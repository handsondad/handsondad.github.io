<text x="192" y="391" font-size="7.9" fill="#18794e" text-anchor="middle" font-weight="700">第3级：外置振动流化床（55 °C 温和补干 → 28 °C 冷风定型）</text>
<text x="192" y="408" font-size="7.5" fill="#0f172a" text-anchor="middle">喷涂微量卵磷脂 · 筛出覆盆子状速溶颗粒（水分 2.5%–3.2%）</text>
<text x="32" y="438" font-size="7.9" fill="#1e293b" text-anchor="start">• 雾化双雄：离心转盘 (14,000–25,000 rpm) 或高压喷嘴 (15–20 MPa)</text>
<text x="32" y="455" font-size="7.9" fill="#0f172a" text-anchor="start" font-weight="700">• 塔内停留仅数秒至二十余秒，杜绝局部长时间受热焦化 (PMC12670600)</text>
<rect x="364" y="64" width="376" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="376.0" y="76.0" width="352" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="552.0" y="91.0" font-size="8.9" fill="#0f766e" text-anchor="middle" font-weight="600">② “湿球护盾”精确曲线：为什么热风与奶滴必须顺流？</text>
