<circle cx="474.8" cy="281.8" r="3.6" fill="#0f766e"/>
<text x="480.8" y="298.8" font-size="7.8" fill="#0f766e" text-anchor="middle" font-weight="700" class="halo">湿球恒温平台 ~48–50 °C</text>
<circle cx="631.9" cy="262.0" r="3.4" fill="#1d6fa5"/>
<text x="623.9" y="280.0" font-size="7.6" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">成壳最高仅 ~68 °C</text>
<rect x="376" y="350" width="352" height="110" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="388" y="369" font-size="8.5" fill="#0f172a" text-anchor="start" font-weight="700">为什么“195 °C 吹不熟蛋白质”？两大物理外挂：</text>
<text x="388" y="388" font-size="8.0" fill="#1e293b" text-anchor="start">1. 面积暴涨 1500 倍：1 升浓奶裂变成 37.3 亿颗 80 μm 微滴，蒸发</text>
<text x="388" y="405" font-size="8.0" fill="#0f766e" text-anchor="start" font-weight="700">   总表面积瞬间摊开成 75 m²（约一片羽毛球场!），水分夺路狂奔；</text>
<text x="388" y="424" font-size="8.0" fill="#1e293b" text-anchor="start">2. 顺流匹配护盾：每克水蒸发带走 2,388 J 潜热，把湿奶滴死死钉在</text>
<text x="388" y="441" font-size="8.0" fill="#0f172a" text-anchor="start" font-weight="700">   48 °C；等奶粒变干没汗了，周围热风也早被吸凉到了 80 °C！</text>
