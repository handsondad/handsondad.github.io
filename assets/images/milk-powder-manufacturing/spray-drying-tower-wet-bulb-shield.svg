<rect x="0.5" y="0.5" width="759" height="485" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">195 °C 滚烫热风当头吹下，奶滴凭什么只有 48 °C？——喷雾干燥塔与“湿球护盾”热力学</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：25 米顺流式三级喷雾干燥塔剖面 · 右：1 升浓奶裂变 37.3 亿微滴与绝热蒸发“湿球恒温平台”精确曲线</text>
<rect x="20" y="64" width="332" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="76.0" width="308" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="186.0" y="91.0" font-size="8.9" fill="#1d6fa5" text-anchor="middle" font-weight="600">① 顺流式三级喷雾干燥塔（热风与奶雾同向下落）</text>
