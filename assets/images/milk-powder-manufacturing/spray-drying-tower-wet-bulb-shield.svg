<text x="144" y="188" font-size="8.0" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">第1级：雾化恒速蒸发区</text>
<text x="144" y="206" font-size="7.8" fill="#0f766e" text-anchor="middle" font-weight="700" class="halo">奶滴锁在湿球 ~48 °C!</text>
<text x="144" y="270" font-size="7.8" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">热风已降温至 ~85 °C</text>
<rect x="112" y="334" width="64" height="24" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="144" y="349" font-size="7.3" fill="#c25014" text-anchor="middle" font-weight="700">第2级内流化床</text>
<polyline points="200.0,304.0 236.0,304.0 236.0,206.0 256.0,206.0" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
