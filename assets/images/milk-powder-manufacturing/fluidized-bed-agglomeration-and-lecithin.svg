<rect x="532" y="320" width="196" height="126" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="542" y="340" font-size="8.0" fill="#0f172a" text-anchor="start" font-weight="700">配料表里的“磷脂”不是科技狠活：</text>
<text x="542" y="359" font-size="7.8" fill="#1e293b" text-anchor="start">• 脱脂奶粉几乎没油，单靠流化床造粒</text>
<text x="542" y="376" font-size="7.8" fill="#1e293b" text-anchor="start">  就能冷水速溶；</text>
<text x="542" y="395" font-size="7.8" fill="#1e293b" text-anchor="start">• 全脂奶粉含 ~26%–28% 乳脂，必须借</text>
<text x="542" y="412" font-size="7.8" fill="#0f172a" text-anchor="start" font-weight="700">  天然大豆/向日葵磷脂把接触角压到</text>
<text x="542" y="429" font-size="7.8" fill="#18794e" text-anchor="start" font-weight="700">  θ &lt; 40°，冷水一冲才瞬间化开！</text>
</svg>
