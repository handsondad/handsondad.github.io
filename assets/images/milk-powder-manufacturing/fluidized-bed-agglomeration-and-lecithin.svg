<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">奶粉鱼眼结块成因与流化床覆盆子附聚造粒及大豆卵磷脂两亲速溶原理图</title>
<desc id="desc">左栏剖析&lt;40μm微细喷雾原粉遇水外层瞬变黏稠乳糖蛋白胶壳、锁死干粉芯(&gt;120秒不沉)的物理原因；中栏展示流化床蒸汽微润、碰撞搭桥与55°C固桥三步造出150–250μm多孔覆盆子颗粒，借30–60μm毛细孔道令润湿缩短至&lt;15秒；右栏解析全脂奶粉喷涂0.2%–0.5%大豆卵磷脂两亲分子桥将疏水油膜接触角从&gt;95°降至&lt;40°实现冷温水速溶的机制。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="473" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么刚喷干的原粉倒进温水必结“鱼眼疙瘩”？——流化床覆盆子造粒与卵磷脂速溶术</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：&lt;40 μm 微细原粉毛细孔锁死结块 · 中：流化床三步架桥造粒 (PMC9647178) · 右：大豆卵磷脂“两亲船桨”破油膜</text>
<rect x="20" y="64" width="228" height="396" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="76.0" width="204" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="134.0" y="91.0" font-size="8.7" fill="#dc2626" text-anchor="middle" font-weight="600">① 未造粒原粉 (&lt;40 μm)：鱼眼结块</text>
<rect x="40" y="168" width="188" height="106" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
<line x1="40.0" y1="168.0" x2="228.0" y2="168.0" stroke="#1d6fa5" stroke-width="2.2"/>
<text x="206" y="264" font-size="7.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">温水</text>
<ellipse cx="134" cy="172" rx="64" ry="34" fill="#fde68a" stroke="#dc2626" stroke-width="3.2"/>
<ellipse cx="134" cy="170" rx="52" ry="24" fill="#fffbeb" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 2"/>
<circle cx="96" cy="178" r="3.0" fill="#f59e0b"/>
<circle cx="110" cy="178" r="3.0" fill="#f59e0b"/>
<circle cx="124" cy="178" r="3.0" fill="#f59e0b"/>
<circle cx="138" cy="178" r="3.0" fill="#f59e0b"/>
<circle cx="152" cy="178" r="3.0" fill="#f59e0b"/>
<circle cx="166" cy="178" r="3.0" fill="#f59e0b"/>
<text x="134" y="164" font-size="7.7" fill="#0f172a" text-anchor="middle" font-weight="700" class="halo">内部干粉 + 死气泡</text>
<text x="134" y="224" font-size="7.7" fill="#dc2626" text-anchor="middle" font-weight="700">外层遇水瞬变黏稠乳糖蛋白胶壳!</text>
<text x="134" y="241" font-size="7.5" fill="#1e293b" text-anchor="middle">堵死微缝 (3–5 μm)，水再也进不去</text>
<rect x="32" y="286" width="204" height="160" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.0"/>
<text x="42" y="306" font-size="8.3" fill="#dc2626" text-anchor="start" font-weight="700">微细原粉的三大物理痛点：</text>
<text x="42" y="326" font-size="7.9" fill="#1e293b" text-anchor="start">• 粒径太细 (&lt;40 μm)：颗粒间范德华力</text>
<text x="42" y="343" font-size="7.9" fill="#1e293b" text-anchor="start">  远大于重力，像面粉一样发黏不流动；</text>
<text x="42" y="362" font-size="7.9" fill="#1e293b" text-anchor="start">• 孔隙极窄：最外圈一沾水立刻溶胀成</text>
<text x="42" y="379" font-size="7.9" fill="#0f172a" text-anchor="start" font-weight="700">  高黏度胶膜，把干粉芯死死焊在里面；</text>
<text x="42" y="398" font-size="7.9" fill="#dc2626" text-anchor="start" font-weight="700">• 润湿下沉时间 &gt;120 秒（甚至浮在水面</text>
<text x="42" y="415" font-size="7.9" fill="#1e293b" text-anchor="start">  拿勺子按扁，咬开还是干粉疙瘩!）</text>
<text x="42" y="434" font-size="7.8" fill="#64748b" text-anchor="start" class="mono">• 堆密度偏高：0.52–0.62 g/cm³</text>
<rect x="260" y="64" width="248" height="396" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="272.0" y="76.0" width="224" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="384.0" y="91.0" font-size="8.7" fill="#18794e" text-anchor="middle" font-weight="600">② 流化床附聚：搭出“覆盆子葡萄串”</text>
<rect x="272" y="108" width="68" height="38" rx="5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.0"/>
<text x="306" y="123" font-size="7.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">1. 蒸汽微润</text>
<text x="306" y="138" font-size="7.1" fill="#1e293b" text-anchor="middle">玻璃态微黏</text>
<rect x="350" y="108" width="68" height="38" rx="5" fill="#fef1e8" stroke="#c25014" stroke-width="1.0"/>
<text x="384" y="123" font-size="7.6" fill="#c25014" text-anchor="middle" font-weight="700">2. 碰撞搭桥</text>
<text x="384" y="138" font-size="7.1" fill="#1e293b" text-anchor="middle">黏成葡萄串</text>
<rect x="428" y="108" width="68" height="38" rx="5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.0"/>
<text x="462" y="123" font-size="7.6" fill="#18794e" text-anchor="middle" font-weight="700">3. 55°C 固桥</text>
<text x="462" y="138" font-size="7.1" fill="#1e293b" text-anchor="middle">锁死大孔道</text>
<rect x="276" y="168" width="216" height="106" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
<line x1="276.0" y1="168.0" x2="492.0" y2="168.0" stroke="#1d6fa5" stroke-width="2.2"/>
<line x1="356.0" y1="186.0" x2="384.0" y2="182.0" stroke="#b45309" stroke-width="5.0"/>
<line x1="384.0" y1="182.0" x2="412.0" y2="188.0" stroke="#b45309" stroke-width="5.0"/>
