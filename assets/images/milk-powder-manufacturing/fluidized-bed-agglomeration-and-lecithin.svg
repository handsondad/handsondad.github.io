<circle cx="382" cy="210" r="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<circle cx="414" cy="214" r="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<circle cx="368" cy="234" r="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<circle cx="398" cy="236" r="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<line x1="312" y1="202" x2="338" y2="202" stroke="#1d6fa5" stroke-width="2.0" marker-end="url(#arr-blue)"/>
<line x1="456" y1="204" x2="430" y2="204" stroke="#1d6fa5" stroke-width="2.0" marker-end="url(#arr-blue)"/>
<text x="384" y="265" font-size="7.5" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">30–60 μm 贯通毛细孔道：水秒吸进芯 → 自动崩解!</text>
<rect x="272" y="286" width="224" height="160" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.0"/>
<text x="282" y="306" font-size="8.1" fill="#18794e" text-anchor="start" font-weight="700">附聚造粒实测跃迁 (Seo 2022, PMC9647178)：</text>
<text x="282" y="326" font-size="7.9" fill="#1e293b" text-anchor="start">• 团簇粒径放大至 150–250 μm（肉眼看</text>
<text x="282" y="343" font-size="7.9" fill="#1e293b" text-anchor="start">  像细沙而非面粉，流动性 Carr 指数 &lt;15）；</text>
<text x="282" y="362" font-size="7.9" fill="#0f172a" text-anchor="start" font-weight="700">• Washburn 毛细渗透 L² ∝ r_pore·cosθ·t：</text>
<text x="282" y="379" font-size="7.9" fill="#1e293b" text-anchor="start">  孔径拓宽 10 倍，水抢在结胶前灌满内腔，</text>
<text x="282" y="396" font-size="7.9" fill="#1e293b" text-anchor="start">  液桥一溶整串颗粒像覆盆子一样散开；</text>
<text x="282" y="415" font-size="8.0" fill="#18794e" text-anchor="start" font-weight="700">• 下沉润湿时间：&lt;15 秒（提升近 10 倍!）</text>
<text x="282" y="434" font-size="7.8" fill="#0f172a" text-anchor="start" font-weight="600">• 蓬松堆密度：0.38–0.45 g/cm³（所以罐大!）</text>
<rect x="520" y="64" width="220" height="396" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="532.0" y="76.0" width="196" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="630.0" y="91.0" font-size="8.7" fill="#6d28d9" text-anchor="middle" font-weight="600">③ 全脂粉外挂：0.3% 大豆卵磷脂</text>
<rect x="532" y="108" width="196" height="78" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.0"/>
<text x="630" y="125" font-size="8.0" fill="#b45309" text-anchor="middle" font-weight="700">未喷卵磷脂的全脂粉表面</text>
<text x="630" y="145" font-size="7.6" fill="#dc2626" text-anchor="middle" font-weight="700">接触角 θ &gt; 95°：冷温水被弹开!</text>
<rect x="546" y="156" width="168" height="20" rx="4" fill="#fde047" stroke="#b45309" stroke-width="1.0"/>
<text x="630" y="170" font-size="7.4" fill="#0f172a" text-anchor="middle" font-weight="700">颗粒表面微薄疏水乳脂膜</text>
<rect x="532" y="196" width="196" height="114" rx="6" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.1"/>
<text x="630" y="214" font-size="7.9" fill="#6d28d9" text-anchor="middle" font-weight="700">流化床微喷 0.2%–0.5% 大豆卵磷脂</text>
<text x="630" y="234" font-size="7.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">亲水头朝外抓水 · 疏水双尾扎进油!</text>
<rect x="546" y="278" width="168" height="20" rx="4" fill="#fde047" stroke="#b45309" stroke-width="1.0"/>
<text x="630" y="292" font-size="7.4" fill="#0f172a" text-anchor="middle" font-weight="700">全脂粉颗粒乳脂表层</text>
