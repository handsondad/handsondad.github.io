<svg xmlns="http://www.w3.org/2000/svg" width="760" height="516" viewBox="0 0 760 516" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">“厶”与“禾”合体为“私”及农耕字族图解</title>
<desc id="desc">拆解初文厶、象形字禾与合体字私的造字逻辑，结合西周公田与私田制度及禾部关联字年、和、利说明汉字从农耕经验生发抽象概念的过程。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="515" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">“私”字拆解：为什么在画圈自守的“厶”旁，偏偏要加一株谷穗“禾”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先认左栏“厶”的画圈指事 → 再看中栏“禾”的垂穗象形 → 右栏回到《诗经》公田与私田现场</text>
<rect x="24" y="68" width="218" height="304" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="44" cy="88" r="10" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="44" y="92" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">1</text>
<text x="60" y="92" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">初文“厶”（上古音 *sil）</text>
<rect x="53" y="106" width="160" height="108" rx="10" fill="#fef2f2" stroke="#f2b6b6" stroke-width="1.3"/>
<line x1="133.0" y1="112" x2="133.0" y2="208" stroke="#f2b6b6" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55"/>
<line x1="59" y1="160.0" x2="207" y2="160.0" stroke="#f2b6b6" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55"/>
<path d="M 136,125 C 102,128 96,178 130,188 C 160,196 172,168 150,151"
      fill="none" stroke="#991b1b" stroke-width="4.5" stroke-linecap="round"/>
<circle cx="133" cy="160" r="3.5" fill="#c25014"/>
<path d="M 157,145 L 148,150 L 154,158" fill="none" stroke="#991b1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="234" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">• 楚简小篆像一笔回环自绕</text>
<text x="40" y="256" font-size="11.5" fill="#1e293b" text-anchor="start">• 韩非：“自环者谓之私”</text>
<text x="40" y="278" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="600">• 它就是“私”最早的本字</text>
<text x="40" y="304" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="600">• 现代活化石：注音符号 ㄙ</text>
<text x="50" y="324" font-size="11.2" fill="#64748b" text-anchor="start">与日语片假名 ム 皆源于此</text>
<text x="40" y="350" font-size="11" fill="#64748b" text-anchor="start">• 另有一说象农具“耜”端头</text>
<circle cx="255" cy="160" r="11" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="255" y="165" font-size="15" fill="#475569" text-anchor="middle" font-weight="700">+</text>
<rect x="268" y="68" width="218" height="304" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="288" cy="88" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="288" y="92" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">2</text>
<text x="304" y="92" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">意符“禾”（沉甸甸谷穗）</text>
<rect x="297" y="106" width="160" height="108" rx="10" fill="#fdf8ee" stroke="#dfc7a7" stroke-width="1.3"/>
<line x1="377.0" y1="112" x2="377.0" y2="208" stroke="#dfc7a7" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55"/>
<line x1="303" y1="160.0" x2="451" y2="160.0" stroke="#dfc7a7" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55"/>
<path d="M 380,200 L 380,136 C 380,124 366,120 348,131"
      fill="none" stroke="#853212" stroke-width="3.8" stroke-linecap="round"/>
<path d="M 353,124 L 344,132 L 356,136" fill="none" stroke="#b45309" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="358" cy="123" r="2.6" fill="#b45309"/>
<circle cx="366" cy="121" r="2.6" fill="#b45309"/>
<path d="M 356,156 Q 380,148 404,156" fill="none" stroke="#853212" stroke-width="3.4" stroke-linecap="round"/>
<path d="M 380,176 L 360,198 M 380,176 L 400,198" fill="none" stroke="#853212" stroke-width="3.2" stroke-linecap="round"/>
<text x="284" y="234" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">• 顶部弯垂：熟透的粟（小米）穗</text>
<text x="284" y="256" font-size="11.5" fill="#1e293b" text-anchor="start">• 中部舒展：禾叶与挺立禾秆</text>
<text x="284" y="278" font-size="11.5" fill="#1e293b" text-anchor="start">• 底部散开：扎入黄土的根须</text>
<text x="284" y="304" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="600">• 北方旱作农业最核心的口粮</text>
<text x="284" y="326" font-size="11.2" fill="#64748b" text-anchor="start">• 谷熟一岁：人背禾就是“年”</text>
<text x="284" y="350" font-size="11.2" fill="#64748b" text-anchor="start">• 交纳余粮：禾加兑就是“税”</text>
<circle cx="499" cy="160" r="11" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="499" y="164" font-size="13" fill="#1d6fa5" text-anchor="middle" font-weight="700">→</text>
<rect x="512" y="68" width="224" height="304" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="532" cy="88" r="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="532" y="92" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">3</text>
<text x="548" y="92" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">合体“私”（自家田里的禾）</text>
<rect x="540" y="106" width="168" height="108" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.1"/>
<rect x="548" y="112" width="48" height="30" rx="4" fill="#ffffff" stroke="#9bc9be" stroke-width="1"/>
<text x="572" y="131" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">私</text>
<rect x="598" y="112" width="48" height="30" rx="4" fill="#ffffff" stroke="#9bc9be" stroke-width="1"/>
<text x="622" y="131" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">私</text>
<rect x="648" y="112" width="48" height="30" rx="4" fill="#ffffff" stroke="#9bc9be" stroke-width="1"/>
<text x="672" y="131" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">私</text>
<rect x="548" y="144" width="48" height="30" rx="4" fill="#ffffff" stroke="#9bc9be" stroke-width="1"/>
<text x="572" y="163" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">私</text>
<rect x="598" y="144" width="48" height="30" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="622" y="163" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">公田</text>
<rect x="648" y="144" width="48" height="30" rx="4" fill="#ffffff" stroke="#9bc9be" stroke-width="1"/>
<text x="672" y="163" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">私</text>
<rect x="548" y="176" width="48" height="30" rx="4" fill="#ffffff" stroke="#9bc9be" stroke-width="1"/>
<text x="572" y="195" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">私</text>
<rect x="598" y="176" width="48" height="30" rx="4" fill="#ffffff" stroke="#9bc9be" stroke-width="1"/>
<text x="622" y="195" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">私</text>
<rect x="648" y="176" width="48" height="30" rx="4" fill="#ffffff" stroke="#9bc9be" stroke-width="1"/>
<text x="672" y="195" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">私</text>
<text x="526" y="234" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">• 《诗经·小雅·大田》名句：</text>
<text x="534" y="255" font-size="11.8" fill="#18794e" text-anchor="start" font-weight="700">“雨我公田，遂及我私”</text>
<text x="526" y="278" font-size="11.5" fill="#1e293b" text-anchor="start">• 《说文》：“私，禾也。从禾</text>
<text x="536" y="298" font-size="11.2" fill="#1e293b" text-anchor="start">厶声，北道名禾主人曰私主人”</text>
<text x="526" y="324" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 归自家的庄稼→个人、私密</text>
<text x="526" y="350" font-size="11.2" fill="#64748b" text-anchor="start">• 久借不还，“厶”退居成偏旁</text>
<rect x="24" y="388" width="712" height="112" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.1"/>
<text x="40" y="412" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">顺着一株“禾”长出的中国农耕词汇树（抽象概念都扎根在泥土与谷穗里）：</text>
<rect x="40" y="426" width="160" height="60" rx="8" fill="#ffffff" stroke="#c25014" stroke-width="1"/>
<rect x="50.0" y="434.0" width="140" height="20" rx="10.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="120.0" y="447.6" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="600">私 = 禾 + 厶</text>
<text x="120" y="474" font-size="11" fill="#1e293b" text-anchor="middle">自家粮仓的庄稼</text>
<rect x="214" y="426" width="160" height="60" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
<rect x="224.0" y="434.0" width="140" height="20" rx="10.0" fill="#fef3c7" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="294.0" y="447.6" font-size="11.2" fill="#b45309" text-anchor="middle" font-weight="600">年 = 禾 + 人</text>
<text x="294" y="474" font-size="11" fill="#1e293b" text-anchor="middle">人背熟禾，谷熟一岁</text>
<rect x="388" y="426" width="160" height="60" rx="8" fill="#ffffff" stroke="#18794e" stroke-width="1"/>
<rect x="398.0" y="434.0" width="140" height="20" rx="10.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="468.0" y="447.6" font-size="11.2" fill="#18794e" text-anchor="middle" font-weight="600">和 = 禾 + 口</text>
<text x="468" y="474" font-size="11" fill="#1e293b" text-anchor="middle">仓廪有粮，言谈调顺</text>
<rect x="562" y="426" width="160" height="60" rx="8" fill="#ffffff" stroke="#1d6fa5" stroke-width="1"/>
<rect x="572.0" y="434.0" width="140" height="20" rx="10.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="642.0" y="447.6" font-size="11.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">利 = 禾 + 刀</text>
<text x="642" y="474" font-size="11" fill="#1e293b" text-anchor="middle">挥镰割禾，锋快有收</text>
</svg>
