<svg xmlns="http://www.w3.org/2000/svg" width="540" height="787.5" viewBox="0 0 540 787.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">两句格言，不是在同一天印上去的</title><desc id="desc">非等比例时间线：1782国玺获准，1935国玺双面进入一美元，1955铭文要求，1956国家座右铭，1957一美元银券首次采用英文格言，1963系列联邦储备券采用。区分票券类别及系列年。</desc><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="786" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="45.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">两句格言，不是在同一天印上去的</text><text x="28" y="93.32" font-size="18.0" fill="#18364b" text-anchor="start">一张纸币，叠着不同年代；下列节点非等比例。</text><rect x="28" y="131" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="171.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1782</text><text x="160" y="172.25" font-size="18.8" fill="#18364b" text-anchor="start">国玺设计获准</text><text x="48" y="220.32" font-size="18.0" fill="#18364b" text-anchor="start">三句拉丁文属于这套历史设计。</text><rect x="28" y="266" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="306.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1935</text><text x="160" y="307.25" font-size="18.8" fill="#18364b" text-anchor="start">国玺双面进入一美元背面</text><text x="48" y="355.32" font-size="18.0" fill="#18364b" text-anchor="start">左金字塔、右鹰；罗斯福修改过排版。</text><rect x="28" y="401" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="441.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1955</text><text x="160" y="442.25" font-size="18.8" fill="#18364b" text-anchor="start">法律要求货币上出现英文格言</text><text x="48" y="490.32" font-size="18.0" fill="#18364b" text-anchor="start">不等于当天就换掉全部旧纸币。</text><rect x="28" y="536" width="664" height="117" rx="10" fill="#faf0dd" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="576.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1956</text><text x="160" y="577.25" font-size="18.8" fill="#18364b" text-anchor="start">法律确立国家座右铭</text><text x="48" y="625.32" font-size="18.0" fill="#18364b" text-anchor="start">IN GOD WE TRUST</text><rect x="28" y="671" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="711.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1957</text><text x="160" y="712.25" font-size="18.8" fill="#18364b" text-anchor="start">英文格言首次用于纸币</text><text x="48" y="760.32" font-size="18.0" fill="#18364b" text-anchor="start">1957 系列一美元银券。</text><rect x="28" y="806" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="846.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1963</text><text x="160" y="847.25" font-size="18.8" fill="#18364b" text-anchor="start">用于这一系列的联邦储备券</text><text x="48" y="895.32" font-size="18.0" fill="#18364b" text-anchor="start">系列年不是每张纸币的生产年份。</text><text x="28" y="1002.32" font-size="18.0" fill="#18364b" text-anchor="start">设计采用、法律地位、首次印上：是三种时间。</text></g></svg>
