<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">两句格言，不是在同一天印上去的</title><desc id="desc">非等比例时间线：1782国玺获准，1935国玺双面进入一美元，1955铭文要求，1956国家座右铭，1957一美元银券首次采用英文格言，1963系列联邦储备券采用。区分票券类别及系列年。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1050" rx="16" fill="#fafcfe"/><text x="28" y="48" font-size="30" fill="#18364b" text-anchor="start">两句格言，不是在同一天印上去的</text><text x="28" y="95" font-size="24" fill="#18364b" text-anchor="start">一张纸币，叠着不同年代；下列节点非等比例。</text><rect x="28" y="131" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="174" font-size="29" fill="#21699a" text-anchor="start">1782</text><text x="160" y="174" font-size="25" fill="#18364b" text-anchor="start">国玺设计获准</text><text x="48" y="222" font-size="24" fill="#18364b" text-anchor="start">三句拉丁文属于这套历史设计。</text><rect x="28" y="266" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="309" font-size="29" fill="#21699a" text-anchor="start">1935</text><text x="160" y="309" font-size="25" fill="#18364b" text-anchor="start">国玺双面进入一美元背面</text><text x="48" y="357" font-size="24" fill="#18364b" text-anchor="start">左金字塔、右鹰；罗斯福修改过排版。</text><rect x="28" y="401" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="444" font-size="29" fill="#21699a" text-anchor="start">1955</text><text x="160" y="444" font-size="25" fill="#18364b" text-anchor="start">法律要求货币上出现英文格言</text><text x="48" y="492" font-size="24" fill="#18364b" text-anchor="start">不等于当天就换掉全部旧纸币。</text><rect x="28" y="536" width="664" height="117" rx="10" fill="#faf0dd" stroke="#adc2d1" stroke-width="2"/><text x="48" y="579" font-size="29" fill="#21699a" text-anchor="start">1956</text><text x="160" y="579" font-size="25" fill="#18364b" text-anchor="start">法律确立国家座右铭</text><text x="48" y="627" font-size="24" fill="#18364b" text-anchor="start">IN GOD WE TRUST</text><rect x="28" y="671" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="714" font-size="29" fill="#21699a" text-anchor="start">1957</text><text x="160" y="714" font-size="25" fill="#18364b" text-anchor="start">英文格言首次用于纸币</text><text x="48" y="762" font-size="24" fill="#18364b" text-anchor="start">1957 系列一美元银券。</text><rect x="28" y="806" width="664" height="117" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="849" font-size="29" fill="#21699a" text-anchor="start">1963</text><text x="160" y="849" font-size="25" fill="#18364b" text-anchor="start">用于这一系列的联邦储备券</text><text x="48" y="897" font-size="24" fill="#18364b" text-anchor="start">系列年不是每张纸币的生产年份。</text><text x="28" y="1004" font-size="24" fill="#18364b" text-anchor="start">设计采用、法律地位、首次印上：是三种时间。</text></svg>
