<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1213" viewBox="0 0 720 1213" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">正面的小字，有的在讲法律，有的在管印刷</title><desc id="desc">一美元正面文字分类：联邦储备券、国家名、法偿声明、黑色联储银行印和绿色财政部印、序列号、系列年、印版号与FW。不是实际票面排版，不展示完整票样或伪造识别号。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1213" rx="16" fill="#fafcfe"/><text x="28" y="48" font-size="30" fill="#18364b" text-anchor="start">正面的小字，有的在讲法律，有的在管印刷</text><text x="28" y="95" font-size="24" fill="#18364b" text-anchor="start">先分三类：票券身份 → 法律地位 → 识别信息。</text><rect x="28" y="130" width="664" height="156" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="172" font-size="26" fill="#21699a" text-anchor="start">① 票券类别</text><text x="48" y="221" font-size="29" fill="#18364b" text-anchor="start">FEDERAL RESERVE NOTE</text><text x="48" y="265" font-size="29" fill="#18364b" text-anchor="start">联邦储备券</text><rect x="28" y="306" width="664" height="156" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="348" font-size="26" fill="#21699a" text-anchor="start">② 国家名称</text><text x="48" y="397" font-size="25" fill="#18364b" text-anchor="start">THE UNITED STATES OF AMERICA</text><text x="48" y="441" font-size="25" fill="#18364b" text-anchor="start">美利坚合众国</text><rect x="28" y="482" width="664" height="200" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="524" font-size="26" fill="#21699a" text-anchor="start">③ 法律声明</text><text x="48" y="573" font-size="25" fill="#18364b" text-anchor="start">THIS NOTE IS LEGAL TENDER</text><text x="48" y="617" font-size="25" fill="#18364b" text-anchor="start">FOR ALL DEBTS, PUBLIC AND PRIVATE</text><text x="48" y="661" font-size="25" fill="#18364b" text-anchor="start">关于公私债务的法偿地位</text><rect x="28" y="702" width="664" height="156" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="744" font-size="26" fill="#21699a" text-anchor="start">④ 两个印，不是同一个机构</text><text x="48" y="793" font-size="25" fill="#18364b" text-anchor="start">左侧黑印：一家联邦储备银行</text><text x="48" y="837" font-size="25" fill="#18364b" text-anchor="start">右侧绿印：美国财政部</text><rect x="28" y="878" width="664" height="200" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="920" font-size="26" fill="#21699a" text-anchor="start">⑤ 同一张票，有不同识别信息</text><text x="48" y="969" font-size="24" fill="#18364b" text-anchor="start">两处序列号：同一识别号重复出现</text><text x="48" y="1013" font-size="24" fill="#18364b" text-anchor="start">SERIES 年份：版本信息，不是逐张生产日期</text><text x="48" y="1057" font-size="24" fill="#18364b" text-anchor="start">印版号：印版；FW：沃思堡印刷设施</text><text x="28" y="1128" font-size="23" fill="#18364b" text-anchor="start">分类阅读卡，不按实际位置排版，不是纸币票样。</text><text x="28" y="1171" font-size="23" fill="#18364b" text-anchor="start">一美元与新版大面额的编号规则，不能直接混用。</text></svg>
