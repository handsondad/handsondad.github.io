<svg xmlns="http://www.w3.org/2000/svg" width="540" height="909.75" viewBox="0 0 540 909.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">正面的小字，有的在讲法律，有的在管印刷</title><desc id="desc">一美元正面文字分类：联邦储备券、国家名、法偿声明、黑色联储银行印和绿色财政部印、序列号、系列年、印版号与FW。不是实际票面排版，不展示完整票样或伪造识别号。</desc><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="908.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="45.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">正面的小字，有的在讲法律，有的在管印刷</text><text x="28" y="93.32" font-size="18.0" fill="#18364b" text-anchor="start">先分三类：票券身份 → 法律地位 → 识别信息。</text><rect x="28" y="130" width="664" height="156" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="170.03" font-size="19.0" fill="#21699a" text-anchor="start" font-weight="600">① 票券类别</text><text x="48" y="218.56" font-size="20.3" fill="#18364b" text-anchor="start" font-weight="700">FEDERAL RESERVE NOTE</text><text x="48" y="262.56" font-size="20.3" fill="#18364b" text-anchor="start" font-weight="700">联邦储备券</text><rect x="28" y="306" width="664" height="156" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="346.03" font-size="19.0" fill="#21699a" text-anchor="start" font-weight="600">② 国家名称</text><text x="48" y="395.25" font-size="18.8" fill="#18364b" text-anchor="start">THE UNITED STATES OF AMERICA</text><text x="48" y="439.25" font-size="18.8" fill="#18364b" text-anchor="start">美利坚合众国</text><rect x="28" y="482" width="664" height="200" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="522.03" font-size="19.0" fill="#21699a" text-anchor="start" font-weight="600">③ 法律声明</text><text x="48" y="571.25" font-size="18.8" fill="#18364b" text-anchor="start">THIS NOTE IS LEGAL TENDER</text><text x="48" y="615.25" font-size="18.8" fill="#18364b" text-anchor="start">FOR ALL DEBTS, PUBLIC AND PRIVATE</text><text x="48" y="659.25" font-size="18.8" fill="#18364b" text-anchor="start">关于公私债务的法偿地位</text><rect x="28" y="702" width="664" height="156" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="742.03" font-size="19.0" fill="#21699a" text-anchor="start" font-weight="600">④ 两个印，不是同一个机构</text><text x="48" y="791.25" font-size="18.8" fill="#18364b" text-anchor="start">左侧黑印：一家联邦储备银行</text><text x="48" y="835.25" font-size="18.8" fill="#18364b" text-anchor="start">右侧绿印：美国财政部</text><rect x="28" y="878" width="664" height="200" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="918.03" font-size="19.0" fill="#21699a" text-anchor="start" font-weight="600">⑤ 同一张票，有不同识别信息</text><text x="48" y="967.32" font-size="18.0" fill="#18364b" text-anchor="start">两处序列号：同一识别号重复出现</text><text x="48" y="1011.32" font-size="18.0" fill="#18364b" text-anchor="start">SERIES 年份：版本信息，不是逐张生产日期</text><text x="48" y="1055.32" font-size="18.0" fill="#18364b" text-anchor="start">印版号：印版；FW：沃思堡印刷设施</text><text x="28" y="1126.39" font-size="17.2" fill="#18364b" text-anchor="start">分类阅读卡，不按实际位置排版，不是纸币票样。</text><text x="28" y="1169.39" font-size="17.2" fill="#18364b" text-anchor="start">一美元与新版大面额的编号规则，不能直接混用。</text></g></svg>
