<svg xmlns="http://www.w3.org/2000/svg" width="540" height="832.5" viewBox="0 0 540 832.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">背面两个圆，原来是一枚国玺的两面</title><desc id="desc">一美元背面的阅读地图。左为国玺背面金字塔，右为国玺正面鹰。三句拉丁文分别位于左图上方、左图下方及右图鹰嘴，英文国家座右铭另在中间。本图不是实际票券。</desc><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="831" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="45.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">背面两个圆，原来是一枚国玺的两面</text><text x="28" y="93.32" font-size="18.0" fill="#18364b" text-anchor="start">先定位，再翻译：这是一美元背面的阅读地图。</text><rect x="28" y="125" width="664" height="65" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="360" y="165.03" font-size="19.0" fill="#18364b" text-anchor="middle" font-weight="600">THE UNITED STATES OF AMERICA</text><rect x="28" y="215" width="320" height="322" rx="10" fill="#faf0dd" stroke="#cbd5e1" stroke-width="1.5"/><text x="44" y="256.39" font-size="17.2" fill="#18364b" text-anchor="start">① 画面左侧：国玺背面</text><path d="M188 288L149 344H227Z" stroke="#92530a" stroke-width="2.4" fill="none"/><path d="M166 325Q188 305 210 325Q188 344 166 325Z" stroke="#92530a" stroke-width="1.6" fill="none"/><circle cx="188" cy="325" r="6" fill="#92530a"/><path d="M166 370L210 370L258 460H118Z" stroke="#92530a" stroke-width="2.4" fill="#e7cd9e"/><text x="188" y="503.25" font-size="18.8" fill="#18364b" text-anchor="middle">金字塔与天意之眼</text><rect x="372" y="215" width="320" height="322" rx="10" fill="#e4f2e9" stroke="#cbd5e1" stroke-width="1.5"/><text x="388" y="256.39" font-size="17.2" fill="#18364b" text-anchor="start">② 画面右侧：国玺正面</text><path d="M530 344L435 308L461 383L506 397M540 344L631 308L605 383L560 397" stroke="#21699a" stroke-width="2.4" fill="none"/><path d="M523 343V311L500 305L521 290L546 297V343" stroke="#21699a" stroke-width="2.4" fill="#fff"/><path d="M497 350H570V414Q534 459 497 414Z" stroke="#21699a" stroke-width="2.4" fill="#e7f0f8"/><text x="532" y="503.25" font-size="18.8" fill="#18364b" text-anchor="middle">鹰与盾牌</text><text x="28" y="586.03" font-size="19.0" fill="#18364b" text-anchor="start" font-weight="600">③ 中间另有英文：IN GOD WE TRUST</text><text x="28" y="628.32" font-size="18.0" fill="#18364b" text-anchor="start">这里是国家座右铭，不是第三句拉丁文。</text><rect x="28" y="665" width="664" height="104" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="701.39" font-size="17.2" fill="#21699a" text-anchor="start">左图上方</text><text x="200" y="701.25" font-size="18.8" fill="#18364b" text-anchor="start">ANNUIT COEPTIS</text><text x="200" y="743.25" font-size="18.8" fill="#18364b" text-anchor="start">祂眷顾了我们的事业</text><rect x="28" y="785" width="664" height="104" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="821.39" font-size="17.2" fill="#21699a" text-anchor="start">左图下方</text><text x="200" y="821.25" font-size="18.8" fill="#18364b" text-anchor="start">NOVUS ORDO SECLORUM</text><text x="200" y="863.25" font-size="18.8" fill="#18364b" text-anchor="start">一个新时代的秩序</text><rect x="28" y="905" width="664" height="104" rx="10" fill="#e7f0f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="941.39" font-size="17.2" fill="#21699a" text-anchor="start">右图鹰嘴</text><text x="200" y="941.25" font-size="18.8" fill="#18364b" text-anchor="start">E PLURIBUS UNUM</text><text x="200" y="983.25" font-size="18.8" fill="#18364b" text-anchor="start">合众为一</text><text x="28" y="1066.39" font-size="17.2" fill="#18364b" text-anchor="start">位置关系示意；图标简化，不是纸币或国玺摹本。</text></g></svg>
