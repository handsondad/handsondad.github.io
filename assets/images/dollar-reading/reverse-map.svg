<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1110" viewBox="0 0 720 1110" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">背面两个圆，原来是一枚国玺的两面</title><desc id="desc">一美元背面的阅读地图。左为国玺背面金字塔，右为国玺正面鹰。三句拉丁文分别位于左图上方、左图下方及右图鹰嘴，英文国家座右铭另在中间。本图不是实际票券。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1110" rx="16" fill="#fafcfe"/><text x="28" y="48" font-size="30" fill="#18364b" text-anchor="start">背面两个圆，原来是一枚国玺的两面</text><text x="28" y="95" font-size="24" fill="#18364b" text-anchor="start">先定位，再翻译：这是一美元背面的阅读地图。</text><rect x="28" y="125" width="664" height="65" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="360" y="167" font-size="26" fill="#18364b" text-anchor="middle">THE UNITED STATES OF AMERICA</text><rect x="28" y="215" width="320" height="322" rx="10" fill="#faf0dd" stroke="#adc2d1" stroke-width="2"/><text x="44" y="258" font-size="23" fill="#18364b" text-anchor="start">① 画面左侧：国玺背面</text><path d="M188 288L149 344H227Z" stroke="#92530a" stroke-width="3" fill="none"/><path d="M166 325Q188 305 210 325Q188 344 166 325Z" stroke="#92530a" stroke-width="2" fill="none"/><circle cx="188" cy="325" r="6" fill="#92530a"/><path d="M166 370L210 370L258 460H118Z" stroke="#92530a" stroke-width="3" fill="#e7cd9e"/><text x="188" y="505" font-size="25" fill="#18364b" text-anchor="middle">金字塔与天意之眼</text><rect x="372" y="215" width="320" height="322" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="388" y="258" font-size="23" fill="#18364b" text-anchor="start">② 画面右侧：国玺正面</text><path d="M530 344L435 308L461 383L506 397M540 344L631 308L605 383L560 397" stroke="#21699a" stroke-width="3" fill="none"/><path d="M523 343V311L500 305L521 290L546 297V343" stroke="#21699a" stroke-width="3" fill="#fff"/><path d="M497 350H570V414Q534 459 497 414Z" stroke="#21699a" stroke-width="3" fill="#e7f0f8"/><text x="532" y="505" font-size="25" fill="#18364b" text-anchor="middle">鹰与盾牌</text><text x="28" y="588" font-size="26" fill="#18364b" text-anchor="start">③ 中间另有英文：IN GOD WE TRUST</text><text x="28" y="630" font-size="24" fill="#18364b" text-anchor="start">这里是国家座右铭，不是第三句拉丁文。</text><rect x="28" y="665" width="664" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="46" y="703" font-size="23" fill="#21699a" text-anchor="start">左图上方</text><text x="200" y="703" font-size="25" fill="#18364b" text-anchor="start">ANNUIT COEPTIS</text><text x="200" y="745" font-size="25" fill="#18364b" text-anchor="start">祂眷顾了我们的事业</text><rect x="28" y="785" width="664" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="46" y="823" font-size="23" fill="#21699a" text-anchor="start">左图下方</text><text x="200" y="823" font-size="25" fill="#18364b" text-anchor="start">NOVUS ORDO SECLORUM</text><text x="200" y="865" font-size="25" fill="#18364b" text-anchor="start">一个新时代的秩序</text><rect x="28" y="905" width="664" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="46" y="943" font-size="23" fill="#21699a" text-anchor="start">右图鹰嘴</text><text x="200" y="943" font-size="25" fill="#18364b" text-anchor="start">E PLURIBUS UNUM</text><text x="200" y="985" font-size="25" fill="#18364b" text-anchor="start">合众为一</text><text x="28" y="1068" font-size="23" fill="#18364b" text-anchor="start">位置关系示意；图标简化，不是纸币或国玺摹本。</text></svg>
