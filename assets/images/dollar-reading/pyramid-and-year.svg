<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1196" viewBox="0 0 720 1196" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">金字塔没有封顶，塔基却写了一个年份</title><desc id="desc">从上到下读金字塔的两句拉丁文、天意之眼、十三层塔身和塔基1776。罗马数字MDCCLXXVI分成M D CC L XX V I七组，分别换算相加得到1776。原创简化示意，不是国玺摹本。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1196" rx="16" fill="#fafcfe"/><text x="28" y="48" font-size="30" fill="#18364b" text-anchor="start">金字塔没有封顶，塔基却写了一个年份</text><text x="28" y="95" font-size="24" fill="#18364b" text-anchor="start">按上 → 中 → 下读；不要先从阴谋故事猜图。</text><text x="360" y="151" font-size="32" fill="#21699a" text-anchor="middle">ANNUIT COEPTIS</text><text x="360" y="194" font-size="26" fill="#18364b" text-anchor="middle">祂眷顾了我们的事业</text><path d="M360 223L309 302H411Z" stroke="#92530a" stroke-width="3" fill="none"/><path d="M329 277Q360 250 391 277Q360 302 329 277Z" stroke="#92530a" stroke-width="2" fill="none"/><circle cx="360" cy="277" r="8" fill="#92530a"/><path d="M321.0 340H399.0L410.5 364H309.5Z" stroke="#92530a" stroke-width="1.5" fill="#f3dfb8"/><text x="570" y="362" font-size="16" fill="#92530a" text-anchor="start">1</text><path d="M309.5 364H410.5L422.0 388H298.0Z" stroke="#92530a" stroke-width="1.5" fill="#e6c997"/><text x="570" y="386" font-size="16" fill="#92530a" text-anchor="start">2</text><path d="M298.0 388H422.0L433.5 412H286.5Z" stroke="#92530a" stroke-width="1.5" fill="#f3dfb8"/><text x="570" y="410" font-size="16" fill="#92530a" text-anchor="start">3</text><path d="M286.5 412H433.5L445.0 436H275.0Z" stroke="#92530a" stroke-width="1.5" fill="#e6c997"/><text x="570" y="434" font-size="16" fill="#92530a" text-anchor="start">4</text><path d="M275.0 436H445.0L456.5 460H263.5Z" stroke="#92530a" stroke-width="1.5" fill="#f3dfb8"/><text x="570" y="458" font-size="16" fill="#92530a" text-anchor="start">5</text><path d="M263.5 460H456.5L468.0 484H252.0Z" stroke="#92530a" stroke-width="1.5" fill="#e6c997"/><text x="570" y="482" font-size="16" fill="#92530a" text-anchor="start">6</text><path d="M252.0 484H468.0L479.5 508H240.5Z" stroke="#92530a" stroke-width="1.5" fill="#f3dfb8"/><text x="570" y="506" font-size="16" fill="#92530a" text-anchor="start">7</text><path d="M240.5 508H479.5L491.0 532H229.0Z" stroke="#92530a" stroke-width="1.5" fill="#e6c997"/><text x="570" y="530" font-size="16" fill="#92530a" text-anchor="start">8</text><path d="M229.0 532H491.0L502.5 556H217.5Z" stroke="#92530a" stroke-width="1.5" fill="#f3dfb8"/><text x="570" y="554" font-size="16" fill="#92530a" text-anchor="start">9</text><path d="M217.5 556H502.5L514.0 580H206.0Z" stroke="#92530a" stroke-width="1.5" fill="#e6c997"/><text x="570" y="578" font-size="16" fill="#92530a" text-anchor="start">10</text><path d="M206.0 580H514.0L525.5 604H194.5Z" stroke="#92530a" stroke-width="1.5" fill="#f3dfb8"/><text x="570" y="602" font-size="16" fill="#92530a" text-anchor="start">11</text><path d="M194.5 604H525.5L537.0 628H183.0Z" stroke="#92530a" stroke-width="1.5" fill="#e6c997"/><text x="570" y="626" font-size="16" fill="#92530a" text-anchor="start">12</text><path d="M183.0 628H537.0L548.5 652H171.5Z" stroke="#92530a" stroke-width="1.5" fill="#f3dfb8"/><text x="570" y="650" font-size="16" fill="#92530a" text-anchor="start">13</text><text x="360" y="698" font-size="30" fill="#18364b" text-anchor="middle">MDCCLXXVI</text><text x="360" y="758" font-size="30" fill="#21699a" text-anchor="middle">NOVUS ORDO SECLORUM</text><text x="360" y="800" font-size="26" fill="#18364b" text-anchor="middle">一个新时代的秩序</text><text x="28" y="865" font-size="27" fill="#18364b" text-anchor="start">塔基年份：把七组罗马数字分别换算</text><rect x="28" y="897" width="88" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="72" y="938" font-size="27" fill="#18364b" text-anchor="middle">M</text><text x="72" y="979" font-size="23" fill="#18364b" text-anchor="middle">1000</text><rect x="124" y="897" width="88" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="168" y="938" font-size="27" fill="#18364b" text-anchor="middle">D</text><text x="168" y="979" font-size="23" fill="#18364b" text-anchor="middle">500</text><rect x="220" y="897" width="88" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="264" y="938" font-size="27" fill="#18364b" text-anchor="middle">CC</text><text x="264" y="979" font-size="23" fill="#18364b" text-anchor="middle">200</text><rect x="316" y="897" width="88" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="360" y="938" font-size="27" fill="#18364b" text-anchor="middle">L</text><text x="360" y="979" font-size="23" fill="#18364b" text-anchor="middle">50</text><rect x="412" y="897" width="88" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="456" y="938" font-size="27" fill="#18364b" text-anchor="middle">XX</text><text x="456" y="979" font-size="23" fill="#18364b" text-anchor="middle">20</text><rect x="508" y="897" width="88" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="552" y="938" font-size="27" fill="#18364b" text-anchor="middle">V</text><text x="552" y="979" font-size="23" fill="#18364b" text-anchor="middle">5</text><rect x="604" y="897" width="88" height="104" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="648" y="938" font-size="27" fill="#18364b" text-anchor="middle">I</text><text x="648" y="979" font-size="23" fill="#18364b" text-anchor="middle">1</text><text x="360" y="1056" font-size="25" fill="#21699a" text-anchor="middle">1000 + 500 + 200 + 50 + 20 + 5 + 1 = 1776</text><text x="28" y="1106" font-size="24" fill="#18364b" text-anchor="start">1776：纪念《独立宣言》，不是纸币的印刷年。</text><text x="28" y="1151" font-size="23" fill="#18364b" text-anchor="start">塔为十三层示意；透视与标签位置经过简化。</text></svg>
