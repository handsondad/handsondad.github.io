<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1030" viewBox="0 0 720 1030" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">合众为一：把“十三”读成一段历史</title><desc id="desc">十三张编号卡表示最初十三州，汇入一个共同体。三个拉丁词拆解为从、许多、一个。盾牌的条纹单独展开为七白六红共十三条。卡片不是州的地图，条纹不是完整盾牌图。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1030" rx="16" fill="#fafcfe"/><text x="28" y="48" font-size="30" fill="#18364b" text-anchor="start">合众为一：把“十三”读成一段历史</text><text x="28" y="95" font-size="24" fill="#18364b" text-anchor="start">在国玺的建国语境里：最初十三州，结成一国。</text><text x="28" y="145" font-size="24" fill="#18364b" text-anchor="start">① 先数“许多”：13 张卡，不是州的地理轮廓</text><rect x="44" y="175" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="83" y="214" font-size="26" fill="#18364b" text-anchor="middle">1</text><rect x="136" y="175" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="175" y="214" font-size="26" fill="#18364b" text-anchor="middle">2</text><rect x="228" y="175" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="267" y="214" font-size="26" fill="#18364b" text-anchor="middle">3</text><rect x="320" y="175" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="359" y="214" font-size="26" fill="#18364b" text-anchor="middle">4</text><rect x="412" y="175" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="451" y="214" font-size="26" fill="#18364b" text-anchor="middle">5</text><rect x="504" y="175" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="543" y="214" font-size="26" fill="#18364b" text-anchor="middle">6</text><rect x="596" y="175" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="635" y="214" font-size="26" fill="#18364b" text-anchor="middle">7</text><rect x="44" y="251" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="83" y="290" font-size="26" fill="#18364b" text-anchor="middle">8</text><rect x="136" y="251" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="175" y="290" font-size="26" fill="#18364b" text-anchor="middle">9</text><rect x="228" y="251" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="267" y="290" font-size="26" fill="#18364b" text-anchor="middle">10</text><rect x="320" y="251" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="359" y="290" font-size="26" fill="#18364b" text-anchor="middle">11</text><rect x="412" y="251" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="451" y="290" font-size="26" fill="#18364b" text-anchor="middle">12</text><rect x="504" y="251" width="79" height="58" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="543" y="290" font-size="26" fill="#18364b" text-anchor="middle">13</text><path d="M360 325V368M348 356L360 368L372 356" stroke="#21699a" stroke-width="3" fill="none"/><rect x="105" y="388" width="510" height="75" rx="10" fill="#faf0dd" stroke="#adc2d1" stroke-width="2"/><text x="360" y="436" font-size="30" fill="#18364b" text-anchor="middle">② 一个共同体</text><text x="360" y="522" font-size="34" fill="#21699a" text-anchor="middle">E PLURIBUS UNUM</text><rect x="28" y="555" width="212" height="112" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="134" y="597" font-size="27" fill="#18364b" text-anchor="middle">E</text><text x="134" y="640" font-size="25" fill="#18364b" text-anchor="middle">从……之中</text><rect x="254" y="555" width="212" height="112" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="360" y="597" font-size="27" fill="#18364b" text-anchor="middle">PLURIBUS</text><text x="360" y="640" font-size="25" fill="#18364b" text-anchor="middle">许多</text><rect x="480" y="555" width="212" height="112" rx="10" fill="#e7f0f8" stroke="#adc2d1" stroke-width="2"/><text x="586" y="597" font-size="27" fill="#18364b" text-anchor="middle">UNUM</text><text x="586" y="640" font-size="25" fill="#18364b" text-anchor="middle">一个</text><text x="28" y="721" font-size="24" fill="#18364b" text-anchor="start">③ 再数盾纹：白色也要算，7 白 + 6 红 = 13</text><rect x="61" y="751" width="46" height="100" rx="0" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="84" y="884" font-size="19" fill="#18364b" text-anchor="middle">1</text><rect x="107" y="751" width="46" height="100" rx="0" fill="#b75150" stroke="#adc2d1" stroke-width="2"/><text x="130" y="884" font-size="19" fill="#18364b" text-anchor="middle">2</text><rect x="153" y="751" width="46" height="100" rx="0" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="176" y="884" font-size="19" fill="#18364b" text-anchor="middle">3</text><rect x="199" y="751" width="46" height="100" rx="0" fill="#b75150" stroke="#adc2d1" stroke-width="2"/><text x="222" y="884" font-size="19" fill="#18364b" text-anchor="middle">4</text><rect x="245" y="751" width="46" height="100" rx="0" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="268" y="884" font-size="19" fill="#18364b" text-anchor="middle">5</text><rect x="291" y="751" width="46" height="100" rx="0" fill="#b75150" stroke="#adc2d1" stroke-width="2"/><text x="314" y="884" font-size="19" fill="#18364b" text-anchor="middle">6</text><rect x="337" y="751" width="46" height="100" rx="0" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="360" y="884" font-size="19" fill="#18364b" text-anchor="middle">7</text><rect x="383" y="751" width="46" height="100" rx="0" fill="#b75150" stroke="#adc2d1" stroke-width="2"/><text x="406" y="884" font-size="19" fill="#18364b" text-anchor="middle">8</text><rect x="429" y="751" width="46" height="100" rx="0" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="452" y="884" font-size="19" fill="#18364b" text-anchor="middle">9</text><rect x="475" y="751" width="46" height="100" rx="0" fill="#b75150" stroke="#adc2d1" stroke-width="2"/><text x="498" y="884" font-size="19" fill="#18364b" text-anchor="middle">10</text><rect x="521" y="751" width="46" height="100" rx="0" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="544" y="884" font-size="19" fill="#18364b" text-anchor="middle">11</text><rect x="567" y="751" width="46" height="100" rx="0" fill="#b75150" stroke="#adc2d1" stroke-width="2"/><text x="590" y="884" font-size="19" fill="#18364b" text-anchor="middle">12</text><rect x="613" y="751" width="46" height="100" rx="0" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="636" y="884" font-size="19" fill="#18364b" text-anchor="middle">13</text><text x="28" y="937" font-size="24" fill="#18364b" text-anchor="start">条纹在此单独展开；不是盾牌真实轮廓。</text><text x="28" y="985" font-size="24" fill="#18364b" text-anchor="start">十三是建国记忆，不是今天州数量的实时显示。</text></svg>
