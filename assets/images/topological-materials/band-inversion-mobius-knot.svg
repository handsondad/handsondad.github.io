<circle cx="380.0" cy="199.0" r="5.5" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="380.0" cy="253.0" r="5.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.5"/>
<text x="380.0" y="156" font-size="9.8" fill="#c25014" text-anchor="middle" font-weight="700">中心 k=0 处：橙色反超到顶！</text>
<text x="380.0" y="230.0" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">SOC 重开体能隙 ≈ 0.3 eV</text>
<text x="380.0" y="306" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">中心 k=0 处：蓝色下沉到底！</text>
<path d="M 332 358 C 332 338, 366 338, 380 358 C 394 378, 428 378, 428 358 C 428 338, 394 338, 380 358 C 366 378, 332 378, 332 358 Z" fill="none" stroke="#1d4ed8" stroke-width="3.0"/>
<text x="380" y="396" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">像“拧半圈粘合的莫比乌斯环”</text>
<text x="380" y="418" font-size="10.0" fill="#dc2626" text-anchor="middle" font-weight="700">拓扑不变量 ν₀ = 1（非平庸态！）</text>
<text x="380" y="440" font-size="9.9" fill="#475569" text-anchor="middle">相对论级自旋-轨道耦合(SOC)</text>
<text x="380" y="458" font-size="9.9" fill="#475569" text-anchor="middle">把导带与价带在体内拧成死结。</text>
<rect x="512" y="68" width="232" height="414" rx="10" fill="#f0fdf4" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="530" cy="92" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="530" y="96" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">3</text>
<text x="550" y="97" font-size="12.0" fill="#18794e" text-anchor="start" font-weight="700">交界处必长“狄拉克锥”</text>
<text x="628" y="118" font-size="9.9" fill="#0f766e" text-anchor="middle" font-weight="600">体-边对应：ν₀ 从 1 变 0 必过零点</text>
<rect x="532" y="134" width="192" height="184" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
<polygon points="550,148 706,148 628.0,196.0" fill="#dbeafe" opacity="0.85"/>
<polygon points="550,304 706,304 628.0,256.0" fill="#ffedd5" opacity="0.85"/>
<line x1="558.0" y1="288.0" x2="698.0" y2="164.0" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round"/>
<line x1="558.0" y1="164.0" x2="698.0" y2="288.0" stroke="#18794e" stroke-width="2.8" stroke-linecap="round"/>
<circle cx="628.0" cy="226.0" r="4.8" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"/>
<text x="628.0" y="162" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">体导带</text>
<text x="672.0" y="230.0" font-size="9.9" fill="#dc2626" text-anchor="middle" font-weight="700">狄拉克点</text>
<text x="628.0" y="298" font-size="9.8" fill="#c25014" text-anchor="middle" font-weight="700">体价带</text>
<text x="628" y="344" font-size="10.6" fill="#18794e" text-anchor="middle" font-weight="700">表面态色散：E(k) = ±ℏv_F |k|</text>
<text x="628" y="368" font-size="10.0" fill="#0f172a" text-anchor="middle">想从体内 ν₀=1 跨到空气 ν₀=0，</text>
<text x="628" y="388" font-size="10.0" fill="#dc2626" text-anchor="middle" font-weight="700">能隙 M 必须在边界穿过 M=0！</text>
<text x="628" y="412" font-size="9.9" fill="#475569" text-anchor="middle">电子在表面像无质量光子一样飞驰，</text>
<text x="628" y="432" font-size="9.9" fill="#475569" text-anchor="middle">这就是角分辨光电子谱(ARPES)</text>
<text x="628" y="452" font-size="10.0" fill="#0f766e" text-anchor="middle" font-weight="700">直接拍到的“X 形”铁证！</text>
</svg>
