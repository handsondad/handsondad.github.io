<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">电子能带怎么“打死结”？重原子自旋-轨道耦合与能带反转三步曲</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">当内部“拧过半圈”的反转能带撞上外部普通真空，交界面能隙必须归零，长出擦不掉的狄拉克锥！</text>
