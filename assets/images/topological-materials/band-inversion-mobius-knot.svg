<text x="132.0" y="156" font-size="9.9" fill="#1d6fa5" text-anchor="middle" font-weight="700">导带在上（p 态，蓝色）</text>
<text x="132.0" y="230.0" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="600">绝缘带隙 E_g &gt; 0</text>
<text x="132.0" y="306" font-size="9.9" fill="#c25014" text-anchor="middle" font-weight="700">价带在下（s 态，橙色）</text>
<ellipse cx="132" cy="358" rx="46" ry="16" fill="none" stroke="#64748b" stroke-width="3.2"/>
<text x="132" y="396" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">像“没拧过的普通纸环”</text>
<text x="132" y="418" font-size="10.0" fill="#0f172a" text-anchor="middle">拓扑不变量 ν₀ = 0（平庸态）</text>
<text x="132" y="440" font-size="9.9" fill="#64748b" text-anchor="middle">上下能带各司其职，</text>
<text x="132" y="458" font-size="9.9" fill="#64748b" text-anchor="middle">体内和表面都不导电。</text>
<rect x="264" y="68" width="232" height="414" rx="10" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="282" cy="92" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="282" y="96" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="302" y="97" font-size="12.0" fill="#1d6fa5" text-anchor="start" font-weight="700">重元素能带反转 (M &lt; 0)</text>
<text x="380" y="118" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="600">铋(Bi, Z=83)、碲(Te)、汞(Hg)</text>
<rect x="284" y="134" width="192" height="184" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
<line x1="294.0" y1="226.0" x2="466.0" y2="226.0" stroke="#cbd5e1" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4,3"/>
