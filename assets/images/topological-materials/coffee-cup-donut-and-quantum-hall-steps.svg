<rect x="0.5" y="0.5" width="759" height="504" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">什么是“拓扑保护”？从面包洞数到十亿分之一精度的量子台阶</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">连续揉捏改不了整数“洞数” g —— 电子波函数的拓扑数 C 同样锁死了霍尔电阻台阶（2016 诺奖核心）</text>
<rect x="16" y="68" width="350" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="36" cy="92" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="36" y="96" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="97" font-size="12.4" fill="#1d6fa5" text-anchor="start" font-weight="700">数学直觉：橡皮泥怎么捏，“洞数”都是整数</text>
<rect x="30" y="114" width="322" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<ellipse cx="78" cy="156" rx="30" ry="22" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<path d="M 60 152 Q 78 140 96 152" fill="none" stroke="#b45309" stroke-width="1.6"/>
<text x="124" y="142" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">圆面包 / 实心球：洞数 g = 0</text>
<text x="124" y="162" font-size="9.9" fill="#475569" text-anchor="start">压扁成盘子、捏成碗，只要不戳破，</text>
<text x="124" y="180" font-size="9.9" fill="#d97706" text-anchor="start" font-weight="600">洞数永远等于 0（绝不会冒出 0.3 个洞！）</text>
<rect x="30" y="208" width="322" height="96" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
<circle cx="62" cy="256" r="22" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<circle cx="62" cy="256" r="8" fill="#eff6ff" stroke="#ea580c" stroke-width="2"/>
<text x="100" y="260" font-size="15.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">⇄</text>
<rect x="116" y="238" width="26" height="34" rx="4" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.8"/>
<path d="M 142 244 C 156 244, 156 266, 142 266" fill="none" stroke="#1d4ed8" stroke-width="3.2"/>
<text x="166" y="236" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700">甜甜圈 ⇄ 马克杯：g = 1</text>
<text x="166" y="256" font-size="9.9" fill="#475569" text-anchor="start">杯身凹陷能慢慢抚平，唯独杯把</text>
<text x="166" y="274" font-size="9.9" fill="#1d6fa5" text-anchor="start" font-weight="600">上的 1 个洞跟甜甜圈拓扑等价！</text>
<text x="166" y="292" font-size="9.8" fill="#dc2626" text-anchor="start" font-weight="700">想变 g=0？除非暴力撕裂杯把！</text>
<rect x="30" y="314" width="322" height="82" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
<rect x="42" y="334" width="68" height="40" rx="18" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
<circle cx="62" cy="354" r="7.5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<circle cx="90" cy="354" r="7.5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="124" y="344" font-size="11.0" fill="#6d28d9" text-anchor="start" font-weight="700">双孔椒盐卷饼 / 眼镜框：g = 2</text>
<text x="124" y="364" font-size="9.9" fill="#475569" text-anchor="start">局部凹凸曲率千变万化，但高斯-博内</text>
<text x="124" y="382" font-size="9.9" fill="#6d28d9" text-anchor="start" font-weight="600">全局曲率积分永远锁死整数 2 − 2g！</text>
