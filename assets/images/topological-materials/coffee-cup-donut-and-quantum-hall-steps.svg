<text x="191" y="428" font-size="10.5" fill="#fbbf24" text-anchor="middle" font-weight="700">索利斯（Thouless, 1982）的天才跨界：</text>
<text x="191" y="448" font-size="9.9" fill="#f8fafc" text-anchor="middle">晶体里电子波函数在动量空间也拧着整数“陈数” C！</text>
<text x="191" y="465" font-size="9.8" fill="#93c5fd" text-anchor="middle">杂质、形变就像捏橡皮泥，只要能隙不关，C 一步不跳！</text>
