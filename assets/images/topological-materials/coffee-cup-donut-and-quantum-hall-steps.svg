<svg xmlns="http://www.w3.org/2000/svg" width="760" height="505" viewBox="0 0 760 505" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">拓扑不变量洞数与量子霍尔效应精确电阻台阶图</title>
<desc id="desc">左图对比球面g=0、甜甜圈与马克杯g=1、双孔卷饼g=2在连续形变下洞数不变；右图绘制量子霍尔效应在ν=1,2,3,4处的精确电阻平台25812.8/ν欧姆及纵向电阻归零现象。</desc>
