<svg xmlns="http://www.w3.org/2000/svg" width="760" height="505" viewBox="0 0 760 505" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">拓扑绝缘体与量子反常霍尔磁性薄膜及拓扑外尔半金属三大家族对比图</title>
<desc id="desc">左栏展示三维拓扑绝缘体体内有带隙而表面有闭合狄拉克锥；中栏展示磁性拓扑绝缘体上下表面开隙仅留一维无耗散边缘态；右栏展示拓扑外尔半金属体内成对手性外尔点与表面半截不闭合费米弧。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6d28d9"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="504" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">拓扑电子材料“三剑客”家族图谱：绝缘体、单向磁性膜与外尔半金属</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">从表面狄拉克锥、零磁场单行道，到体内藏着“动量磁单极子”、表面长出半截“费米弧”的砷化钽</text>
<rect x="16" y="68" width="232" height="420" rx="10" fill="#eff6ff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="82.0" width="160" height="22" rx="11.0" fill="#1d6fa5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>
<text x="112.0" y="97.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">家族 ①：拓扑绝缘体</text>
<text x="132" y="124" font-size="10.4" fill="#0f172a" text-anchor="middle" font-weight="700">代表：HgTe、Bi₂Se₃、Bi₂Te₃</text>
<text x="132" y="143" font-size="9.8" fill="#64748b" text-anchor="middle">（2006–2009 理论预言与实验证实）</text>
<rect x="44" y="160" width="176" height="128" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
<polygon points="132,224 94,174 170,174" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.8"/>
<polygon points="132,224 94,274 170,274" fill="#fed7aa" stroke="#ea580c" stroke-width="1.8"/>
<ellipse cx="132" cy="174" rx="38" ry="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<ellipse cx="132" cy="274" rx="38" ry="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="132" y="228" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">闭合圆费米面</text>
<text x="34" y="314" font-size="10.0" fill="#0f172a" text-anchor="start">• 体内：标准绝缘体（有完整带隙）</text>
<text x="34" y="338" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="700">• 表面：二维无能隙狄拉克金属态</text>
<text x="34" y="362" font-size="10.0" fill="#0f172a" text-anchor="start">• 保护神：时间反演对称性（怕磁铁）</text>
<text x="34" y="386" font-size="10.0" fill="#475569" text-anchor="start">• 温度门槛：Bi₂Se₃ 带隙 0.3 eV，</text>
<text x="44" y="405" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">室温（300 K）就能拍到拓扑表面态！</text>
<rect x="32" y="424" width="200" height="48" rx="8" fill="#dbeafe"/>
<text x="132" y="444" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">拿手绝活：高效率自旋轨道矩</text>
<text x="132" y="462" font-size="9.8" fill="#0f172a" text-anchor="middle">翻转磁存储比特（SOT-MRAM）</text>
<rect x="264" y="68" width="232" height="420" rx="10" fill="#f0fdf4" stroke="#e2e8f0" stroke-width="1"/>
<rect x="280.0" y="82.0" width="180" height="22" rx="11.0" fill="#18794e" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>
<text x="370.0" y="97.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">家族 ②：磁性拓扑绝缘体</text>
<text x="380" y="124" font-size="10.3" fill="#0f172a" text-anchor="middle" font-weight="700">代表：Cr-(Bi,Sb)₂Te₃、MnBi₂Te₄</text>
<text x="380" y="143" font-size="9.8" fill="#64748b" text-anchor="middle">（2013 清华薛其坤团队首测 QAHE）</text>
<rect x="292" y="160" width="176" height="128" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
<rect x="316" y="186" width="128" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/>
<line x1="324.0" y1="180.0" x2="436.0" y2="180.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arr-red)"/>
<line x1="450.0" y1="192.0" x2="450.0" y2="256.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arr-red)"/>
<line x1="436.0" y1="268.0" x2="324.0" y2="268.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arr-red)"/>
<line x1="310.0" y1="256.0" x2="310.0" y2="192.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="380" y="221" font-size="9.9" fill="#0f766e" text-anchor="middle" font-weight="700">上下表面也打开能隙</text>
<text x="380" y="239" font-size="9.9" fill="#dc2626" text-anchor="middle" font-weight="700">只剩一维侧边单行道！</text>
<text x="282" y="314" font-size="10.0" fill="#0f172a" text-anchor="start">• 体内与上下表面：全部绝缘！</text>
<text x="282" y="338" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">• 唯独薄膜一维侧边：零损耗单行道</text>
<text x="282" y="362" font-size="10.0" fill="#0f172a" text-anchor="start">• 保护神：非零陈数 C = ±1（自带磁性）</text>
<text x="282" y="386" font-size="10.0" fill="#475569" text-anchor="start">• 温度门槛：摆脱数万高斯大磁铁，</text>
<text x="292" y="405" font-size="10.0" fill="#d97706" text-anchor="start" font-weight="700">但目前仍需极低温（~0.03–数 K）</text>
<rect x="280" y="424" width="200" height="48" rx="8" fill="#dcfce7"/>
<text x="380" y="444" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="700">拿手绝活：桌面级量子电阻基准</text>
<text x="380" y="462" font-size="9.8" fill="#0f172a" text-anchor="middle">与未来无耗散拓扑互连线</text>
<rect x="512" y="68" width="232" height="420" rx="10" fill="#f5f3ff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="528.0" y="82.0" width="180" height="22" rx="11.0" fill="#6d28d9" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>
<text x="618.0" y="97.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">家族 ③：拓扑外尔半金属</text>
<text x="628" y="124" font-size="10.1" fill="#0f172a" text-anchor="middle" font-weight="700">代表：砷化钽 TaAs、NbAs、Co₃Sn₂S₂</text>
<text x="628" y="143" font-size="9.8" fill="#64748b" text-anchor="middle">（2015 中科院物理所与普林斯顿发现）</text>
<rect x="540" y="160" width="176" height="128" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
<polygon points="562,196 676,196 696,172 582,172" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
<circle cx="596" cy="242" r="9" fill="#dc2626"/>
<text x="596" y="246" font-size="9.8" fill="#ffffff" text-anchor="middle" font-weight="700">+1</text>
<circle cx="662" cy="242" r="9" fill="#1d4ed8"/>
<text x="662" y="246" font-size="9.8" fill="#ffffff" text-anchor="middle" font-weight="700">−1</text>
<line x1="596.0" y1="232.0" x2="596.0" y2="184.0" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3,3"/>
<line x1="662.0" y1="232.0" x2="662.0" y2="184.0" stroke="#1d6fa5" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3,3"/>
<path d="M 596 184 Q 629 168 662 184" fill="none" stroke="#7c3aed" stroke-width="3.2"/>
<circle cx="596" cy="184" r="3.8" fill="#dc2626"/>
<circle cx="662" cy="184" r="3.8" fill="#1d4ed8"/>
<text x="629" y="214" font-size="9.8" fill="#6d28d9" text-anchor="middle" font-weight="700">表面“费米弧”（半截开弧！）</text>
<text x="629" y="272" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="700">体内成对“外尔点”（手性 ±1）</text>
<text x="530" y="314" font-size="10.0" fill="#0f172a" text-anchor="start">• 体内不是绝缘体，而是三维半金属！</text>
<text x="530" y="338" font-size="10.0" fill="#6d28d9" text-anchor="start" font-weight="700">• 导带价带成对点接触：动量磁单极子</text>
<text x="530" y="362" font-size="10.0" fill="#0f172a" text-anchor="start">• 表面奇观：不闭合的“费米弧”连起两点</text>
<text x="530" y="386" font-size="10.0" fill="#475569" text-anchor="start">• 磁场平行电场时出现“手性反常”，</text>
<text x="540" y="405" font-size="10.0" fill="#dc2626" text-anchor="start" font-weight="700">电阻非但不升反而暴跌（负磁阻）！</text>
<rect x="528" y="424" width="200" height="48" rx="8" fill="#ede9fe"/>
<text x="628" y="444" font-size="10.0" fill="#6d28d9" text-anchor="middle" font-weight="700">拿手绝活：超高迁移率宽谱光电</text>
<text x="628" y="462" font-size="9.8" fill="#0f172a" text-anchor="middle">探测、拓扑催化与手性电子学</text>
</svg>
