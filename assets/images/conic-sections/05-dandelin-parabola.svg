<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
<title id="title">抛物线：球给出焦点，接触圆平面给出准线</title>
<desc id="desc">这是包含圆锥轴线且垂直于截平面水平交线的轴截面。球显示为圆，截平面显示为斜直线。P 画在这一轴截面内以便看清点的顺序；正文证明适用于截线上的任意 P。</desc>
<style>text{font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20334d;font-size:19px} .small{font-size:16px}.heading{font-size:24px;font-weight:700} .note{fill:#52647a}</style>
<rect width="1000" height="630" rx="16" fill="#f8fafc"/>
<text x="26.00" y="40.00" class="heading" text-anchor="start">抛物线：球给出焦点，接触圆平面给出准线</text>
<text x="26.00" y="70.00" class="small note" text-anchor="start">轴截面示意：球看成圆，截平面侧看成直线。完整曲线不在这张侧视图中。</text>
<path d="M300.00,550.00 L54.63,125.00" fill="none" stroke="#8599ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M300.00,550.00 L545.37,125.00" fill="none" stroke="#8599ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M300.00,550.00 L300.00,125.00" fill="none" stroke="#becbd8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6"/>
<path d="M138.50,557.73 L376.50,145.50" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<circle cx="300.00" cy="414.00" r="68.00" stroke="#047857" fill="#d5eee4" stroke-width="2"/>
<path d="M241.11,448.00 L358.89,448.00" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6"/>
<path d="M138.50,557.73 L376.50,145.50" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M221.48,414.00 L241.11,380.00" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M221.48,414.00 L241.11,448.00" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6"/>
<circle cx="241.11" cy="448.00" r="4.00" stroke="#2563eb" fill="#2563eb" stroke-width="2"/>
<text x="253.11" y="466.00" class="" text-anchor="start">A</text>
<circle cx="241.11" cy="380.00" r="4.00" stroke="#2563eb" fill="#2563eb" stroke-width="2"/>
<text x="209.11" y="372.00" class="" text-anchor="start">F</text>
<circle cx="221.48" cy="414.00" r="4.00" stroke="#20334d" fill="#20334d" stroke-width="2"/>
<text x="233.48" y="414.00" class="" text-anchor="start">P</text>
<circle cx="300.00" cy="550.00" r="4.00" stroke="#20334d" fill="#20334d" stroke-width="2"/>
<text x="278.00" y="568.00" class="" text-anchor="start">O</text>
<path d="M87.50,448.00 L453.00,448.00" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6"/>
<circle cx="201.85" cy="448.00" r="4.00" stroke="#b45309" fill="#b45309" stroke-width="2"/>
<text x="174.85" y="469.00" class="" text-anchor="start">D</text>
<path d="M221.48,414.00 L201.85,448.00" fill="none" stroke="#be185d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="562.00" y="177.00" class="" text-anchor="start">D 在准线 L 上。</text>
<text x="562.00" y="211.00" class="small" text-anchor="start">L 在这张侧视图中缩成一个点。</text>
<text x="562.00" y="250.00" class="small" text-anchor="start">绿色虚线是接触圆所在平面 H。</text>
<text x="562.00" y="320.00" class="heading" text-anchor="start">关键点的顺序</text>
<text x="562.00" y="360.00" class="" text-anchor="start">沿母线连接 P 与 A</text>
<text x="562.00" y="410.00" class="small" text-anchor="start">PF = PA；再证明 PA = PD</text>
<text x="562.00" y="458.00" class="small note" text-anchor="start">同一外点到同一球的切线段等长。</text>
<text x="26.00" y="605.00" class="small note" text-anchor="start">P 为清楚展示顺序而选在轴截面内；换到其他母线，切线等长与固定高度关系仍成立。</text>
</svg>