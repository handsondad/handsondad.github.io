<title id="title">回到截平面内看三种焦点性质</title>
<desc id="desc">椭圆上的点到两个焦点距离之和固定；双曲线上的点到两个焦点距离之差的绝对值固定；抛物线上的点到焦点与准线距离相等。</desc>
