<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
<title id="title">双曲线：母线上 A、B 在 P 的同侧</title>
<desc id="desc">这是包含圆锥轴线且垂直于截平面水平交线的轴截面。球显示为圆，截平面显示为斜直线。P 画在这一轴截面内以便看清点的顺序；正文证明适用于截线上的任意 P。</desc>
<style>text{font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20334d;font-size:19px} .small{font-size:16px}.heading{font-size:24px;font-weight:700} .note{fill:#52647a}</style>
<rect width="1000" height="630" rx="16" fill="#f8fafc"/>
<text x="26.00" y="40.00" class="heading" text-anchor="start">双曲线：母线上 A、B 在 P 的同侧</text>
<text x="26.00" y="70.00" class="small note" text-anchor="start">轴截面示意：球看成圆，截平面侧看成直线。完整曲线不在这张侧视图中。</text>
<path d="M415.49,547.35 L164.51,112.65" fill="none" stroke="#8599ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M164.51,547.35 L415.49,112.65" fill="none" stroke="#8599ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M290.00,547.35 L290.00,112.65" fill="none" stroke="#becbd8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6"/>
<path d="M359.00,550.80 L359.00,109.20" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<circle cx="290.00" cy="192.00" r="69.00" stroke="#047857" fill="#d5eee4" stroke-width="2"/>
<path d="M230.24,226.50 L349.76,226.50" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6"/>
<circle cx="290.00" cy="468.00" r="69.00" stroke="#047857" fill="#d5eee4" stroke-width="2"/>
<path d="M230.24,433.50 L349.76,433.50" fill="none" stroke="#047857" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6"/>
<path d="M359.00,550.80 L359.00,109.20" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M359.00,210.49 L359.00,192.00" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M359.00,210.49 L349.76,226.50" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6"/>
<circle cx="349.76" cy="226.50" r="4.00" stroke="#2563eb" fill="#2563eb" stroke-width="2"/>
<text x="359.76" y="221.50" class="" text-anchor="start">A</text>
<circle cx="359.00" cy="192.00" r="4.00" stroke="#2563eb" fill="#2563eb" stroke-width="2"/>
<text x="327.00" y="210.00" class="" text-anchor="start">F₁</text>
<path d="M359.00,210.49 L359.00,468.00" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M359.00,210.49 L230.24,433.50" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 6"/>
<circle cx="230.24" cy="433.50" r="4.00" stroke="#be185d" fill="#be185d" stroke-width="2"/>
<text x="240.24" y="428.50" class="" text-anchor="start">B</text>
<circle cx="359.00" cy="468.00" r="4.00" stroke="#be185d" fill="#be185d" stroke-width="2"/>
<text x="327.00" y="486.00" class="" text-anchor="start">F₂</text>
<circle cx="359.00" cy="210.49" r="4.00" stroke="#20334d" fill="#20334d" stroke-width="2"/>
<text x="371.00" y="210.49" class="" text-anchor="start">P</text>
<circle cx="290.00" cy="330.00" r="4.00" stroke="#20334d" fill="#20334d" stroke-width="2"/>
<text x="268.00" y="348.00" class="" text-anchor="start">O</text>
<text x="562.00" y="177.00" class="small" text-anchor="start">蓝色：到第一个球的两条切线</text>
<text x="562.00" y="211.00" class="small" text-anchor="start">红色：到第二个球的两条切线</text>
<text x="562.00" y="250.00" class="small" text-anchor="start">绿色虚线：球与圆锥的接触圆</text>
<text x="562.00" y="320.00" class="heading" text-anchor="start">关键点的顺序</text>
<text x="562.00" y="360.00" class="" text-anchor="start">P — A — O — B</text>
<text x="562.00" y="410.00" class="small" text-anchor="start">PF₂ − PF₁ = PB − PA = AB</text>
<text x="562.00" y="458.00" class="small note" text-anchor="start">同一外点到同一球的切线段等长。</text>
<text x="26.00" y="605.00" class="small note" text-anchor="start">P 为清楚展示顺序而选在轴截面内；换到其他母线，切线等长与固定高度关系仍成立。</text>
</svg>