<svg xmlns="http://www.w3.org/2000/svg" width="760" height="566" viewBox="0 0 760 566" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">细胞结构到蛋白质分子机器的尺度放大图</title>
<desc id="desc">左图画一个约十到二十微米的心肌细胞，含细胞核线粒体核糖体与细胞骨架，并标注成人约三十万亿个细胞约两百种类型；右图画一条氨基酸链折叠成球蛋白，列举运输催化运动防御四类功能，标注人体蛋白中位长度约四百一十五个氨基酸，强调细胞与蛋白尺度相差约一千倍。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="565" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">细胞不是“一袋蛋白质”：它有边界、有分工、有能量供应</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">一个心肌细胞直径约 10～20 µm，里面同时运转着上万种蛋白质。</text>
<rect x="20" y="66" width="352" height="428" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="89" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="38" y="93" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">细胞：生命最小的独立单位</text>
<ellipse cx="196" cy="252" rx="150" ry="118" fill="#fbfdff" stroke="#6d28d9" stroke-width="2"/>
<ellipse cx="196" cy="252" rx="141" ry="109" fill="#f3e8ff" stroke="#6d28d9" stroke-width="0.8" stroke-opacity="0.35"/>
<ellipse cx="182" cy="242" rx="56" ry="44" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="182" y="246" font-size="10.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">细胞核</text>
<circle cx="262" cy="202" r="15" fill="#fdf1d8" stroke="#b45309" stroke-width="1.2"/>
<text x="282" y="206" font-size="10.5" fill="#b45309" text-anchor="start">线粒体</text>
<circle cx="258" cy="292" r="15" fill="#fdf1d8" stroke="#b45309" stroke-width="1.2"/>
<text x="278" y="296" font-size="10.5" fill="#b45309" text-anchor="start">核糖体</text>
<circle cx="112" cy="316" r="15" fill="#fdf1d8" stroke="#b45309" stroke-width="1.2"/>
<text x="132" y="320" font-size="10.5" fill="#b45309" text-anchor="start">细胞骨架</text>
<text x="38" y="128" font-size="10.5" fill="#1e293b" text-anchor="start">膜把内外分开；细胞器分工；ATP 供能。</text>
<text x="38" y="396" font-size="10.5" fill="#475569" text-anchor="start">全成人约 30 万亿个细胞、约 200 种类型。</text>
<text x="38" y="424" font-size="10.5" fill="#64748b" text-anchor="start">红细胞是特例：成熟后没有细胞核。</text>
<rect x="388" y="66" width="352" height="428" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="89" r="10.5" fill="#fdf1d8" stroke="#b45309" stroke-width="1.2"/>
<text x="406" y="93" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">蛋白质：细胞里的分子机器</text>
<path d="M424,156 L452,140 L482,152 L506,134 L534,152 L560,138 L588,156 L600,186 L578,206 L548,194 L520,214 L490,196 L462,220 L436,200" fill="none" stroke="#be123c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="424" cy="156" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="452" cy="140" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="482" cy="152" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="506" cy="134" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="534" cy="152" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="560" cy="138" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="588" cy="156" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="600" cy="186" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="578" cy="206" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="548" cy="194" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="520" cy="214" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="490" cy="196" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="462" cy="220" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<circle cx="436" cy="200" r="4.5" fill="#ffffff" stroke="#be123c" stroke-width="1.3"/>
<text x="512" y="244" font-size="10.5" fill="#1e293b" text-anchor="middle">一条氨基酸链折叠成有形状的蛋白</text>
<line x1="388.0" y1="264.0" x2="740.0" y2="264.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<rect x="406.0" y="280.0" width="56" height="22" rx="11.0" fill="#fdf1d8" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="434.0" y="295.0" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">运输</text>
<text x="474" y="296" font-size="10.5" fill="#1e293b" text-anchor="start">血红蛋白运氧</text>
<rect x="406.0" y="311.0" width="56" height="22" rx="11.0" fill="#fdf1d8" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="434.0" y="326.0" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">催化</text>
<text x="474" y="327" font-size="10.5" fill="#1e293b" text-anchor="start">酶降低反应门槛</text>
<rect x="406.0" y="342.0" width="56" height="22" rx="11.0" fill="#fdf1d8" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="434.0" y="357.0" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">运动</text>
<text x="474" y="358" font-size="10.5" fill="#1e293b" text-anchor="start">肌球蛋白把 ATP 变推力</text>
<rect x="406.0" y="373.0" width="56" height="22" rx="11.0" fill="#fdf1d8" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="434.0" y="388.0" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">防御</text>
<text x="474" y="389" font-size="10.5" fill="#1e293b" text-anchor="start">抗体识别外来物</text>
<text x="406" y="414" font-size="10.5" fill="#475569" text-anchor="start">人体蛋白中位长度约 415 个氨基酸。</text>
<text x="406" y="442" font-size="10.5" fill="#64748b" text-anchor="start">直径量级：细胞 10 µm → 蛋白 5 nm。</text>
<rect x="20" y="508" width="720" height="44" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="536" font-size="10.6" fill="#475569" text-anchor="start">看细胞要显微镜，看蛋白质要靠 X 射线晶体学、冷冻电镜或结构预测；尺度差约一千倍。</text>
</svg>
