<svg xmlns="http://www.w3.org/2000/svg" width="760" height="584" viewBox="0 0 760 584" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">四类基本组织与人体十一大器官系统关系图</title>
<desc id="desc">左栏画出上皮紧密成片、结缔细胞散在基质、肌肉长梭形带横纹、神经细胞带长突起四种基本组织；右栏列出循环消化内分泌免疫皮肤肌肉神经生殖呼吸骨骼泌尿共十一个器官系统，并用心脏示意器官由心肌结缔上皮与神经四类组织构成。</desc>
