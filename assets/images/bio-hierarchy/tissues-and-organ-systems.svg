<text x="406" y="506" font-size="9.8" fill="#475569" text-anchor="start">系统由多个器官组成，例：心脏＋血管＋血液＝循环系统。</text>
<rect x="20" y="526" width="720" height="44" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="554" font-size="10.6" fill="#475569" text-anchor="start">分类是人为的方便：血液算结缔组织，心肌是组织也是器官的一部分，层级之间并非刀切。</text>
