<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" viewBox="0 0 760 466" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">1968至1992年中国当代诗歌四阶段演进时间轴</title>
<desc id="desc">按时间顺序梳理四个关键阶段：1968-1977知青地下手抄本与内部黄皮书潜流期，1978-1983《今天》与《诗刊》互动、朦胧诗大论争及三个崛起破冰期，1984-1989高校诗社与1986现代诗群体大展84社团裂变期，以及1990-1992汪国真余晖与大众媒介分流期。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="465" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<defs><marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1d6fa5"/></marker><marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6d28d9"/></marker><marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#18794e"/></marker><marker id="arr-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b45309"/></marker></defs>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二十五年四重浪：从煤油灯手抄本到八十四个先锋诗群大展（1968–1992）</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">读懂“地下潜流 → 朦胧诗破冰 → 第三代裂变 → 九十年代分流”，才不会把七八十年代诗歌看成铁板一块。</text>
<rect x="20" y="66" width="174" height="44" rx="8" fill="#475569" stroke="none" stroke-width="1"/>
<text x="107.0" y="84" font-size="10.6" fill="#ffffff" text-anchor="middle" font-weight="700">第一浪｜1968–1977</text>
<text x="107.0" y="102" font-size="11.2" fill="#fef08a" text-anchor="middle" font-weight="700">地下手抄本潜流期</text>
<rect x="20" y="118" width="174" height="298" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<rect x="28" y="134" width="158" height="56" rx="5" fill="#f1f5f9" stroke="none" stroke-width="1"/>
<text x="34" y="150" font-size="9.8" fill="#475569" text-anchor="start" font-weight="700">1968</text>
<text x="34" y="167" font-size="9.5" fill="#0f172a" text-anchor="start">食指写《相信未来》等，</text>
<text x="34" y="182" font-size="9.5" fill="#0f172a" text-anchor="start">知青在车站与油灯下传抄</text>
<rect x="28" y="198" width="158" height="56" rx="5" fill="#f1f5f9" stroke="none" stroke-width="1"/>
<text x="34" y="214" font-size="9.8" fill="#475569" text-anchor="start" font-weight="700">70年代初</text>
<text x="34" y="231" font-size="9.5" fill="#0f172a" text-anchor="start">白洋淀诗群（芒克、多多</text>
<text x="34" y="246" font-size="9.5" fill="#0f172a" text-anchor="start">等）与贵州黄翔秘密探索</text>
<rect x="28" y="262" width="158" height="56" rx="5" fill="#f1f5f9" stroke="none" stroke-width="1"/>
<text x="34" y="278" font-size="9.8" fill="#475569" text-anchor="start" font-weight="700">1971–78</text>
<text x="34" y="295" font-size="9.5" fill="#0f172a" text-anchor="start">内部“黄皮书”重印流转，</text>
<text x="34" y="310" font-size="9.5" fill="#0f172a" text-anchor="start">输入现代派陌生化语感</text>
<rect x="28" y="326" width="158" height="56" rx="5" fill="#f1f5f9" stroke="none" stroke-width="1"/>
<text x="34" y="342" font-size="9.8" fill="#475569" text-anchor="start" font-weight="700">1976.04</text>
<text x="34" y="359" font-size="9.5" fill="#0f172a" text-anchor="start">天安门诗歌运动爆发；</text>
<text x="34" y="374" font-size="9.5" fill="#0f172a" text-anchor="start">北岛写下《回答》破土</text>
<text x="107.0" y="405" font-size="9.2" fill="#475569" text-anchor="middle" font-weight="700">手抄本 · 黄皮书 · 自救</text>
<rect x="202" y="66" width="174" height="44" rx="8" fill="#1d6fa5" stroke="none" stroke-width="1"/>
<text x="289.0" y="84" font-size="10.6" fill="#ffffff" text-anchor="middle" font-weight="700">第二浪｜1978–1983</text>
<text x="289.0" y="102" font-size="11.2" fill="#fef08a" text-anchor="middle" font-weight="700">破冰与全民大论争</text>
<rect x="202" y="118" width="174" height="298" rx="8" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.2"/>
<rect x="210" y="134" width="158" height="56" rx="5" fill="#eaf4fb" stroke="none" stroke-width="1"/>
<text x="216" y="150" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700">1978.12</text>
<text x="216" y="167" font-size="9.5" fill="#0f172a" text-anchor="start">北岛、芒克在北京油印</text>
<text x="216" y="182" font-size="9.5" fill="#0f172a" text-anchor="start">创办民刊《今天》贴上墙</text>
<rect x="210" y="198" width="158" height="56" rx="5" fill="#eaf4fb" stroke="none" stroke-width="1"/>
<text x="216" y="214" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700">1979.03</text>
<text x="216" y="231" font-size="9.5" fill="#0f172a" text-anchor="start">官刊《诗刊》发《回答》，</text>
<text x="216" y="246" font-size="9.5" fill="#0f172a" text-anchor="start">随后选载舒婷《致橡树》</text>
<rect x="210" y="262" width="158" height="56" rx="5" fill="#eaf4fb" stroke="none" stroke-width="1"/>
<text x="216" y="278" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700">1980.5–8</text>
<text x="216" y="295" font-size="9.5" fill="#0f172a" text-anchor="start">谢冕发声护航；《令人气</text>
<text x="216" y="310" font-size="9.5" fill="#0f172a" text-anchor="start">闷的“朦胧”》引爆大论争</text>
<rect x="210" y="326" width="158" height="56" rx="5" fill="#eaf4fb" stroke="none" stroke-width="1"/>
<text x="216" y="342" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700">1980–83</text>
<text x="216" y="359" font-size="9.5" fill="#0f172a" text-anchor="start">首届青春诗会召开；“三</text>
<text x="216" y="374" font-size="9.5" fill="#0f172a" text-anchor="start">个崛起”论文确立新美学</text>
<text x="289.0" y="405" font-size="9.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">朦胧诗 · 50万印数 · 崛起</text>
<rect x="384" y="66" width="174" height="44" rx="8" fill="#6d28d9" stroke="none" stroke-width="1"/>
<text x="471.0" y="84" font-size="10.6" fill="#ffffff" text-anchor="middle" font-weight="700">第三浪｜1984–1989</text>
<text x="471.0" y="102" font-size="11.2" fill="#fef08a" text-anchor="middle" font-weight="700">高校狂飙与第三代裂变</text>
<rect x="384" y="118" width="174" height="298" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<rect x="392" y="134" width="158" height="56" rx="5" fill="#f3e8ff" stroke="none" stroke-width="1"/>
<text x="398" y="150" font-size="9.8" fill="#6d28d9" text-anchor="start" font-weight="700">1984–85</text>
<text x="398" y="167" font-size="9.5" fill="#0f172a" text-anchor="start">高校诗社沸腾；《他们》</text>
<text x="398" y="182" font-size="9.5" fill="#0f172a" text-anchor="start">《非非》《海上》等创刊</text>
<rect x="392" y="198" width="158" height="56" rx="5" fill="#f3e8ff" stroke="none" stroke-width="1"/>
<text x="398" y="214" font-size="9.8" fill="#6d28d9" text-anchor="start" font-weight="700">1985</text>
<text x="398" y="231" font-size="9.5" fill="#0f172a" text-anchor="start">《朦胧诗选》热销全国；</text>
<text x="398" y="246" font-size="9.5" fill="#0f172a" text-anchor="start">北大编印《新诗潮诗集》</text>
<rect x="392" y="262" width="158" height="56" rx="5" fill="#f3e8ff" stroke="none" stroke-width="1"/>
<text x="398" y="278" font-size="9.8" fill="#6d28d9" text-anchor="start" font-weight="700">1986.10</text>
<text x="398" y="295" font-size="9.5" fill="#0f172a" text-anchor="start">《诗歌报》《深圳青年报》</text>
<text x="398" y="310" font-size="9.5" fill="#0f172a" text-anchor="start">联办大展：84社团同亮相</text>
<rect x="392" y="326" width="158" height="56" rx="5" fill="#f3e8ff" stroke="none" stroke-width="1"/>
<text x="398" y="342" font-size="9.8" fill="#6d28d9" text-anchor="start" font-weight="700">1984–89</text>
<text x="398" y="359" font-size="9.5" fill="#0f172a" text-anchor="start">海子、西川抒情长诗与</text>
<text x="398" y="374" font-size="9.5" fill="#0f172a" text-anchor="start">口语派、女性诗多元并立</text>
<text x="471.0" y="405" font-size="9.2" fill="#6d28d9" text-anchor="middle" font-weight="700">校园诗社 · 口语 · 84社团</text>
<rect x="566" y="66" width="174" height="44" rx="8" fill="#b45309" stroke="none" stroke-width="1"/>
<text x="653.0" y="84" font-size="10.6" fill="#ffffff" text-anchor="middle" font-weight="700">尾声转折｜1990–1992</text>
<text x="653.0" y="102" font-size="11.2" fill="#ffffff" text-anchor="middle" font-weight="700">余晖热销与大众退潮</text>
<rect x="566" y="118" width="174" height="298" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<rect x="574" y="134" width="158" height="56" rx="5" fill="#fef3c7" stroke="none" stroke-width="1"/>
<text x="580" y="150" font-size="9.8" fill="#b45309" text-anchor="start" font-weight="700">1990–91</text>
<text x="580" y="167" font-size="9.5" fill="#0f172a" text-anchor="start">“汪国真热”风靡校园，成</text>
<text x="580" y="182" font-size="9.5" fill="#0f172a" text-anchor="start">大众手抄诗最后怀旧余晖</text>
<rect x="574" y="198" width="158" height="56" rx="5" fill="#fef3c7" stroke="none" stroke-width="1"/>
<text x="580" y="214" font-size="9.8" fill="#b45309" text-anchor="start" font-weight="700">1991起</text>
<text x="580" y="231" font-size="9.5" fill="#0f172a" text-anchor="start">《现代汉诗》《倾向》创</text>
<text x="580" y="246" font-size="9.5" fill="#0f172a" text-anchor="start">刊，转向书斋语言精耕</text>
<rect x="574" y="262" width="158" height="56" rx="5" fill="#fef3c7" stroke="none" stroke-width="1"/>
<text x="580" y="278" font-size="9.8" fill="#b45309" text-anchor="start" font-weight="700">1992后</text>
<text x="580" y="295" font-size="9.5" fill="#0f172a" text-anchor="start">市场潮、彩电、港台流行</text>
<text x="580" y="310" font-size="9.5" fill="#0f172a" text-anchor="start">歌与摇滚接管大众抒情</text>
<rect x="574" y="326" width="158" height="56" rx="5" fill="#fef3c7" stroke="none" stroke-width="1"/>
<text x="580" y="342" font-size="9.8" fill="#b45309" text-anchor="start" font-weight="700">90年代中</text>
<text x="580" y="359" font-size="9.5" fill="#0f172a" text-anchor="start">诗集常需自费印千册，诗</text>
<text x="580" y="374" font-size="9.5" fill="#0f172a" text-anchor="start">卸下超载重担归于纯文学</text>
<text x="653.0" y="405" font-size="9.2" fill="#b45309" text-anchor="middle" font-weight="700">汪国真热 · 分流 · 归纯粹</text>
<line x1="194.0" y1="88.0" x2="202.0" y2="88.0" stroke="#0f172a" stroke-width="1.6"/>
<line x1="376.0" y1="88.0" x2="384.0" y2="88.0" stroke="#0f172a" stroke-width="1.6"/>
<line x1="558.0" y1="88.0" x2="566.0" y2="88.0" stroke="#0f172a" stroke-width="1.6"/>
<rect x="20" y="424" width="720" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="444" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">演进脉络：70年代靠“手抄本”保住真话火种 → 80年代初靠“朦胧诗”唤醒个体尊严 → 80年代中后期向“多元现代汉语”全面裂变</text>
</svg>
