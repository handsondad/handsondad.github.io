<text x="592" y="200" font-size="9.5" fill="#1e293b" text-anchor="middle" font-weight="600">松林地上厚厚一层松针毯，就是每年退休的老员工！</text>
<text x="456" y="229" font-size="9.8" fill="#0f766e" text-anchor="start" font-weight="700">问1：香樟树冬天绿油油，怎么4月满地掉红黄叶？</text>
<text x="456" y="246" font-size="9.5" fill="#1e293b" text-anchor="start">答：亚热带常绿阔叶树选在暮春“新叶上岗日”集中换旧衣</text>
<text x="456" y="260" font-size="9.5" fill="#1e293b" text-anchor="start">！</text>
<text x="456" y="281" font-size="9.8" fill="#b45309" text-anchor="start" font-weight="700">问2：水杉、池杉、落叶松也是针叶，怎么秋天全秃？</text>
<text x="456" y="298" font-size="9.5" fill="#1e293b" text-anchor="start">答：水杉/池杉管胞较宽怕冻栓；落叶松在-50℃极寒区</text>
<text x="456" y="312" font-size="9.5" fill="#1e293b" text-anchor="start">干脆造薄针一年一扔！</text>
<text x="456" y="339" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">问3：松柏冬天还在做光合作用吗？</text>
<text x="456" y="356" font-size="9.5" fill="#1e293b" text-anchor="start">答：0℃以上晴午仍可微弱补碳；严寒冰封期则锁死气孔专</text>
<text x="456" y="370" font-size="9.5" fill="#1e293b" text-anchor="start">心散热保命。</text>
