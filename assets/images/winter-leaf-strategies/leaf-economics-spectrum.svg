<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">终极算账：为什么阔叶树偏爱“半年抛快消叶”，松柏却造“三年耐用品”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">全球植物叶经济谱（Wright 等 Nature）：比叶重（造价）越高，单日回本越慢，就越必须跨冬连用好几年！</text>
