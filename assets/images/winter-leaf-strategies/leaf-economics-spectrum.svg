<text x="154" y="266" font-size="9.8" fill="#c25014" text-anchor="start" font-weight="700" class="halo">① 落叶阔叶（薄叶高光合，单季回本）</text>
<text x="192" y="298" font-size="9.5" fill="#b45309" text-anchor="start" font-weight="700" class="halo">★叛逆彩蛋：落叶松/水杉（薄针叶秋落）</text>
<text x="222" y="234" font-size="9.8" fill="#0f766e" text-anchor="start" font-weight="700" class="halo">② 香樟/冬青（1年1换）</text>
<text x="234" y="162" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700" class="halo">③ 松树/柏树（厚针叶连用2–5年回本）</text>
<text x="244" y="132" font-size="9.6" fill="#6d28d9" text-anchor="start" font-weight="700" class="halo">④ 狐尾松（极寒贫瘠，寿命30–45年）</text>
<text x="36" y="369" font-size="9.6" fill="#64748b" text-anchor="start">规律：暖湿肥沃区 → 薄叶快赚快扔占优；干冷贫瘠区 → 厚针叶跨冬连用占优。</text>
