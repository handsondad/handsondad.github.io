<text x="565" y="126" font-size="11.2" fill="#18794e" text-anchor="middle" font-weight="700">目标静止轨道 GEO（35,786 km）</text>
<text x="565" y="392" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">绕地数千圈持续微推爬升</text>
<rect x="408" y="404" width="314" height="92" rx="10" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="420" y="426" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">慢车特点：硬币级微推力，比冲翻 5–10 倍！</text>
<text x="420" y="446" font-size="10.8" fill="#1e293b" text-anchor="start">• 电场把氙离子加速到 15–30 km/s 喷出（蓝紫羽流）；</text>
<text x="420" y="464" font-size="10.8" fill="#1e293b" text-anchor="start">• 推力仅 0.1–0.5 N（托一枚硬币），爬升需 3–6 个月，</text>
<text x="420" y="482" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">  但省下 1–2 吨燃料死重，直接让运载火箭小一号！</text>
</svg>
