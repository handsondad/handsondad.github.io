<svg xmlns="http://www.w3.org/2000/svg" width="760" height="532" viewBox="0 0 760 532" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">化学霍曼双脉冲转移与全电推进离子螺旋升轨对比图</title>
<desc id="desc">左侧单次动画演示霍曼转移两次切向点火与5小时15分滑行，右侧展示氙离子电推进数月螺旋爬升</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .anim-hohmann {
        stroke-dasharray: 520;
        stroke-dashoffset: 520;
        animation: hohmannTransfer 3.6s cubic-bezier(0.32, 0.08, 0.24, 1) 0.3s 1 forwards;
      }
      @keyframes hohmannTransfer {
        from { stroke-dashoffset: 520; }
        to   { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .anim-hohmann {
          animation: none !important;
          stroke-dashoffset: 0 !important;
        }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="531" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="380.0" y="30" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">太空变道怎么换高轨？霍曼两脚油门快车 vs 离子电推螺旋慢车</text>
<text x="380.0" y="52" font-size="12.5" fill="#64748b" text-anchor="middle">一边是化学火箭 5 小时 15 分滑行到位，一边是“一张纸推力”连推几个月省下一半燃料重</text>
<rect x="22" y="68" width="356" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="82.0" width="262" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="169.0" y="97.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">方案 A：化学推进 · 霍曼转移（1925）</text>
<circle cx="200" cy="266" r="122" fill="none" stroke="#18794e" stroke-width="2.2" stroke-dasharray="6 4"/>
<circle cx="200" cy="266" r="34" fill="none" stroke="#1d6fa5" stroke-width="2.2"/>
<circle cx="200" cy="266" r="22" fill="#dbeafe" stroke="#1d6fa5" stroke-width="2"/>
<text x="200" y="270" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">地球</text>
<path d="M 200 300 A 64.4 78.0 0 0 0 200 144" fill="none" stroke="#fed7aa" stroke-width="4"/>
<path class="anim-hohmann" d="M 200 300 A 64.4 78.0 0 0 0 200 144" fill="none" stroke="#c25014" stroke-width="3.6" marker-end="url(#arr-orange)"/>
<circle cx="200" cy="300" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.8"/>
<line x1="200" y1="300" x2="248" y2="300" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arr-orange)"/>
<text x="200" y="320" font-size="11.2" fill="#dc2626" text-anchor="middle" font-weight="700">① 近地点点火 Δv₁ = +2.46 km/s</text>
<text x="200" y="336" font-size="10.5" fill="#64748b" text-anchor="middle">（借奥伯特效应在高速井底猛踹一脚）</text>
<circle cx="200" cy="144" r="6" fill="#18794e" stroke="#ffffff" stroke-width="1.8"/>
<line x1="200" y1="144" x2="150" y2="144" stroke="#18794e" stroke-width="2.6" marker-end="url(#arr-green)"/>
<text x="200" y="132" font-size="11.2" fill="#18794e" text-anchor="middle" font-weight="700">② 远地点圆化点火 Δv₂ = +1.48 km/s</text>
<text x="276" y="244" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">熄火滑行</text>
<text x="276" y="261" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">5 小时 15 分</text>
<rect x="38" y="404" width="324" height="92" rx="10" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<text x="50" y="426" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">快车特点：两脚切向点火、当天到站</text>
<text x="50" y="446" font-size="10.8" fill="#1e293b" text-anchor="start">• 近地点拉高对岸远地点；远地点抬平近地点（圆化）。</text>
<text x="50" y="464" font-size="10.8" fill="#1e293b" text-anchor="start">• 推力几百牛，但化学排气慢（ve ≈ 3.1 km/s），</text>
<text x="50" y="482" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">  整颗星将近一半起飞重量都得拿来装变轨燃料！</text>
<rect x="392" y="68" width="346" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="408.0" y="82.0" width="268" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="542.0" y="97.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">方案 B：全电推卫星 · 氙离子螺旋慢爬</text>
<circle cx="565" cy="258" r="122" fill="none" stroke="#18794e" stroke-width="2.2" stroke-dasharray="6 4"/>
