<text x="282.3" y="155.7" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700" class="halo">6h</text>
<circle cx="244.2" cy="154.1" r="5.0" fill="#18794e" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="209.8" cy="154.7" r="5.0" fill="#18794e" stroke="#ffffff" stroke-width="1.5"/>
<text x="219.8" y="158.7" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700" class="halo">8h</text>
<circle cx="170.0" cy="170.0" r="5.0" fill="#18794e" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="126.8" cy="205.1" r="5.0" fill="#18794e" stroke="#ffffff" stroke-width="1.5"/>
<text x="110.8" y="209.1" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700" class="halo">10h</text>
<circle cx="86.1" cy="272.2" r="5.0" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<text x="40" y="434" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">近地点 h = 500 km</text>
<text x="40" y="452" font-size="11" fill="#1e293b" text-anchor="start">狂飙 vp = 10.0 km/s（嗖地掠过南半球）</text>
<text x="40" y="124" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">远地点 ha = 39,870 km</text>
<text x="40" y="142" font-size="11" fill="#1e293b" text-anchor="start">慢走 va = 1.5 km/s（连盯北极 8 小时！）</text>
<text x="40" y="484" font-size="10.6" fill="#6d28d9" text-anchor="start" font-weight="600">两块彩色扇形耗时同为 1 小时，扫过面积严格相等（开普勒第二定律）</text>
<rect x="428" y="68" width="310" height="434" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="446" y="95" font-size="15" fill="#6d28d9" text-anchor="start" font-weight="700">天体力学总开关：活力公式</text>
<rect x="444" y="110" width="278" height="86" rx="10" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
<text x="583" y="138" font-size="16.5" fill="#6d28d9" text-anchor="middle" font-weight="700">v² = μ ( 2 / r − 1 / a )</text>
<text x="583" y="161" font-size="11" fill="#1e293b" text-anchor="middle">r：当前到地心距离 · a：椭圆半长轴</text>
<text x="583" y="180" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">总机械能 E = −μm / (2a) 全程守恒！</text>
<rect x="444" y="210" width="278" height="88" rx="10" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="456" y="231" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">① 正圆轨道特例（r = a）</text>
<text x="456" y="250" font-size="10.8" fill="#1e293b" text-anchor="start">代入得 v = √(μ/r)：高度越高，引力越弱，</text>
<text x="456" y="266" font-size="10.8" fill="#1e293b" text-anchor="start">巡航反而越慢（400 km 跑 7.67 km/s，静止轨</text>
<text x="456" y="282" font-size="10.8" fill="#1e293b" text-anchor="start">3.07 km/s），完全不需要发动机持续推着走！</text>
<rect x="444" y="310" width="278" height="86" rx="10" fill="#e7f6ee" stroke="#86efac" stroke-width="1"/>
<text x="456" y="331" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">② 椭圆轨道自动“能量换挡”</text>
<text x="456" y="350" font-size="10.8" fill="#1e293b" text-anchor="start">爬向远地点：引力拉后腿，动能自动存成势能；</text>
<text x="456" y="366" font-size="10.8" fill="#1e293b" text-anchor="start">跌回近地点：势能兑现回动能，一滴油不烧</text>
<text x="456" y="382" font-size="10.8" fill="#1e293b" text-anchor="start">就能让卫星在目标上空“定点慢放”！</text>
<rect x="444" y="408" width="278" height="80" rx="10" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<text x="456" y="429" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">③ 63.4° 临界倾角锁死远地点</text>
<text x="456" y="448" font-size="10.8" fill="#1e293b" text-anchor="start">赤道鼓包会使普通椭圆拱线漂移；唯独令</text>
<text x="456" y="464" font-size="10.8" fill="#1e293b" text-anchor="start">5cos²i − 1 = 0（i = 63.43°），远地点永远</text>
<text x="456" y="480" font-size="10.8" fill="#1e293b" text-anchor="start">钉在北半球不南漂——3 颗星全天覆盖北极！</text>
</svg>
