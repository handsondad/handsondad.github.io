<text x="380.0" y="30" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">不踩油门凭什么飞十几年？活力公式与“近快远慢”悬停魔术</text>
<text x="380.0" y="52" font-size="12.5" fill="#64748b" text-anchor="middle">引力与惯性永恒拔河：每 1 小时打一个点，高偏心“闪电轨道”自动在北极头顶慢放 8 小时</text>
