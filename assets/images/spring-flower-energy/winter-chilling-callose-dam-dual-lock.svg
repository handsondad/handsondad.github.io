<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">冬季需冷量与早春积温双保险锁控制淀粉解锁开花图解</title>
<desc id="desc">左侧展示甜樱桃子房淀粉在冬季随981至1082需冷量积累达峰、早春随积温消耗的实测规律及郁金香5摄氏度12周冷藏对照实验；右侧拆解胼胝质塞子与DAM休眠基因被低温与春暖串行解锁的三步机制。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f172a"/>
  </marker>
  <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#6d28d9"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#dc2626"/>
  </marker>
  <marker id="arr-pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#db2777"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="509" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="30" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700">为什么腊月里连暖三天，桃树和郁金香却绝不“上当乱开花”？</text>
<text x="380" y="52" font-size="12" fill="#64748b" text-anchor="middle">淀粉金库装了“需冷量 + 春季积温”两把串行密码锁：没冻够天数，连淀粉酶和胞间通道都是锁死的</text>
<rect x="24" y="72" width="356" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40.0" y="86.0" width="228" height="24" rx="12.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="154.0" y="102.3" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">实证曲线：越冬攒淀粉，够冷才解锁</text>
<text x="40" y="126" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">甜樱桃子房淀粉随“需冷量 CU”同步登顶（Fadón 2018）：</text>
<rect x="40" y="138" width="324" height="162" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<line x1="74" y1="266" x2="348" y2="266" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<line x1="74" y1="266" x2="74" y2="158" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<text x="66" y="166" font-size="11" fill="#64748b" text-anchor="end">高</text>
<text x="66" y="266" font-size="11" fill="#64748b" text-anchor="end">低</text>
<text x="98" y="286" font-size="11" fill="#64748b" text-anchor="middle">11月</text>
<text x="212" y="286" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700">1月末需冷达标</text>
<text x="324" y="286" font-size="11" fill="#db2777" text-anchor="middle">3月盛花</text>
<line x1="212" y1="164" x2="212" y2="266" stroke="#6d28d9" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4,4"/>
<polyline points="88,250 130,228 172,198 212,172 268,214 328,256" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="88" cy="250" r="4.5" fill="#b45309"/>
<circle cx="212" cy="172" r="5.5" fill="#6d28d9"/>
<circle cx="328" cy="256" r="4.5" fill="#db2777"/>
<text x="212" y="155" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700">981–1082 CU 淀粉峰值</text>
<text x="138" y="190" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">内休眠攒淀粉</text>
<text x="288" y="198" font-size="11" fill="#db2777" text-anchor="middle" font-weight="700">回暖耗淀粉</text>
<rect x="40" y="314" width="324" height="134" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="54" y="335" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">郁金香球根对照实验（Lambrechts 1994）：</text>
<text x="54" y="357" font-size="11" fill="#1e293b" text-anchor="start">• 5°C 冷藏满 12 周：鳞茎 α-淀粉酶与花莛转化酶激活，</text>
<text x="64" y="376" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">淀粉/果聚糖变葡萄糖，花箭破土冲刺盛开！</text>
<text x="54" y="398" font-size="11" fill="#1e293b" text-anchor="start">• 17°C 一直保暖不冻：哪怕鳞茎塞满淀粉，酶也不开工，</text>
<text x="64" y="417" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">花莛僵缩不长——成为“哑花/盲花”！</text>
<text x="54" y="438" font-size="11" fill="#64748b" text-anchor="start">启示：暖冬若导致果树欠冷量，早春就会开花不齐、坐果暴跌</text>
<rect x="396" y="72" width="340" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="412.0" y="86.0" width="244" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="534.0" y="102.3" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">分子双保险：胼胝质塞子 + DAM 基因锁</text>
<rect x="412" y="124" width="308" height="78" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="426" y="146" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">上锁（深秋短日照 + ABA 脱落酸飙升）</text>
<text x="426" y="168" font-size="11" fill="#1e293b" text-anchor="start">胞间连丝被 1,3-β-葡聚糖（胼胝质塞子）物理堵死；</text>
<text x="426" y="187" font-size="11" fill="#1e293b" text-anchor="start">DAM 休眠基因死死按住成花素 FT，暖风吹来也叫不醒。</text>
<line x1="566" y1="202" x2="566" y2="224" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<rect x="412" y="224" width="308" height="78" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="426" y="246" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">第一把钥匙：攒够冬季需冷量（Chilling）</text>
<text x="426" y="268" font-size="11" fill="#1e293b" text-anchor="start">持续低温诱导 GH17 葡聚糖酶溶解胼胝质塞子，打通细胞</text>
<text x="426" y="287" font-size="11" fill="#1e293b" text-anchor="start">通讯管道；同时表观遗传沉默 DAM 基因，ABA 跌去一半。</text>
<line x1="566" y1="302" x2="566" y2="324" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<rect x="412" y="324" width="308" height="78" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="426" y="346" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">第二把钥匙：攒够早春有效积温（GDH &gt; 4.5°C）</text>
<text x="426" y="368" font-size="11" fill="#1e293b" text-anchor="start">通道已开、刹车已松，春风送暖立即唤醒 FT 与淀粉酶，</text>
<text x="426" y="387" font-size="11" fill="#1e293b" text-anchor="start">跨年淀粉金库开闸放糖，千树万树准时一夜齐放！</text>
<text x="566" y="426" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700">先冻透（内休眠解除）→ 再回暖（生态休眠解除）</text>
<text x="566" y="446" font-size="11" fill="#64748b" text-anchor="middle">两把钥匙缺一不可，完美防住“十月小阳春”骗局</text>
<rect x="24" y="472" width="712" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="380" y="489" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">先看左卡樱桃淀粉曲线与郁金香冷藏对照，再看右卡双钥匙解锁：寒冷不是春花的敌人，而是打开淀粉金库的第一道密码</text>
</svg>
