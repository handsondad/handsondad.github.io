<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">早春无叶树干的正压升液与昼夜冻融蔗糖渗透泵图解</title>
<desc id="desc">左侧对比盛夏有叶负压蒸腾抽水与早春无叶正压顶水（2%蔗糖产生约133.7 kPa渗透压，单次升液动画停留于终态）；右侧拆解木射线卸糖、寒夜小于0摄氏度结冰吸升与白昼融冰正压尖峰三步机制。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f172a"/>
  </marker>
  <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#6d28d9"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#dc2626"/>
  </marker>
  <marker id="arr-pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#db2777"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes sapRise {
        0% { transform: translateY(150px); opacity: 0.25; }
        20% { opacity: 1; }
        100% { transform: translateY(0px); opacity: 1; }
      }
      @keyframes budGlow {
        0%, 55% { opacity: 0.35; }
        100% { opacity: 1; }
      }
      .anim-sap-rise {
        animation: sapRise 3.2s cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
      }
      .anim-bud-glow {
        animation: budGlow 3.2s ease-out 1 forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        .anim-sap-rise, .anim-bud-glow {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="509" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="30" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700">没有一片绿叶拉动“蒸腾抽水机”，早春糖水靠什么爬上光杆树梢？</text>
<text x="380" y="52" font-size="12" fill="#64748b" text-anchor="middle">夏靠叶片负压“往上抽”，早春无叶靠木质部约 2% 蔗糖渗压 + 昼夜冻融正压“往上顶”</text>
<rect x="24" y="72" width="344" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40.0" y="86.0" width="196" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="138.0" y="102.3" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">两种截然相反的输水模式</text>
<rect x="40" y="122" width="144" height="270" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="112" y="142" font-size="12" fill="#18794e" text-anchor="middle" font-weight="700">盛夏有叶模式</text>
<text x="112" y="160" font-size="11" fill="#1e293b" text-anchor="middle">顶部气孔蒸腾拉拽</text>
<circle cx="112" cy="196" r="22" fill="#bbf7d0" stroke="#18794e" stroke-width="1.4"/>
<text x="112" y="200" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">繁茂绿叶</text>
<rect x="102" y="220" width="20" height="112" rx="4" fill="#dcfce7" stroke="#18794e" stroke-width="1.3"/>
<line x1="112" y1="318" x2="112" y2="232" stroke="#18794e" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5,4" marker-end="url(#arr-green)"/>
<text x="112" y="352" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">导管内：负压张力</text>
<text x="112" y="372" font-size="11" fill="#64748b" text-anchor="middle">像吸管一样往上抽</text>
<rect x="198" y="122" width="154" height="270" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.4"/>
<text x="275" y="142" font-size="12" fill="#db2777" text-anchor="middle" font-weight="700">早春无叶模式</text>
<text x="275" y="160" font-size="11" fill="#1e293b" text-anchor="middle">茎干冻融 + 根压上顶</text>
<g class="anim-bud-glow"><circle cx="275" cy="194" r="22" fill="#fbcfe8" stroke="#db2777" stroke-width="1.8"/><text x="275" y="198" font-size="11" fill="#db2777" text-anchor="middle" font-weight="700">膨大花芽</text></g>
<rect x="261" y="220" width="28" height="112" rx="6" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.5"/>
<line x1="275" y1="322" x2="275" y2="228" stroke="#1d6fa5" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<g class="anim-sap-rise"><circle cx="275" cy="246" r="6" fill="#1d6fa5"/><circle cx="275" cy="274" r="6" fill="#c25014"/><circle cx="275" cy="302" r="6" fill="#1d6fa5"/></g>
<text x="275" y="352" font-size="11" fill="#db2777" text-anchor="middle" font-weight="700">导管内：正压上推！</text>
<text x="275" y="372" font-size="11" fill="#1e293b" text-anchor="middle">蓝=水  橙=2%蔗糖</text>
<text x="196" y="414" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">2% 蔗糖树液渗透压 Π ≈ 133.7 kPa（≈1.32 大气压）</text>
<text x="196" y="434" font-size="11" fill="#1e293b" text-anchor="middle">理论上足以托起约 13.6 米水柱，顺带修复冬季气泡栓塞</text>
<text x="196" y="453" font-size="11" fill="#64748b" text-anchor="middle">深30cm土壤保持 &gt;0°C 液态水，供根系持续补水</text>
<rect x="384" y="72" width="352" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="86.0" width="228" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="514.0" y="102.3" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">昼夜冻融 × 蔗糖半透壁增压泵</text>
<text x="400" y="126" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">枫树、桦树、核桃等早春正压树液的三步物理机制：</text>
<rect x="400" y="140" width="320" height="70" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<text x="414" y="160" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">① 木射线卸糖造“半透仓”</text>
<text x="414" y="181" font-size="11" fill="#1e293b" text-anchor="start">活的木射线薄壁细胞把淀粉切成蔗糖（约2%），</text>
<text x="414" y="199" font-size="11" fill="#1e293b" text-anchor="start">木质化纤维-导管壁允许水进出，却拦住大分子蔗糖。</text>
<line x1="560" y1="210" x2="560" y2="224" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<rect x="400" y="224" width="320" height="70" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="414" y="244" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">② 寒夜 &lt; 0°C：结冰吸升蓄能</text>
<text x="414" y="265" font-size="11" fill="#1e293b" text-anchor="start">木纤维内气体的冰晶膜产生低温吸力（cryostatic suction），</text>
<text x="414" y="283" font-size="11" fill="#1e293b" text-anchor="start">把导管与&gt;0°C深层土壤里的水分源源吸进树干并压缩气泡。</text>
<line x1="560" y1="294" x2="560" y2="308" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<rect x="400" y="308" width="320" height="70" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.3"/>
<text x="414" y="328" font-size="12" fill="#db2777" text-anchor="start" font-weight="700">③ 白昼 &gt; 0°C：融冰正压喷涌</text>
<text x="414" y="349" font-size="11" fill="#1e293b" text-anchor="start">清晨升温过 0°C 冰融化，受压气泡回弹 + 导管高糖渗压，</text>
<text x="414" y="367" font-size="11" fill="#1e293b" text-anchor="start">瞬间打出正压尖峰（Zarrinderakht 2024），把糖水顶向花芽！</text>
<rect x="400" y="392" width="320" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="560" y="413" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">为什么桃李藤本没枫树那么猛的冻融泵也能开花？</text>
<text x="560" y="434" font-size="11" fill="#1e293b" text-anchor="middle">靠根压 + 花芽就近木射线卸糖，短距离渗透吸水直供花苞</text>
<rect x="24" y="472" width="712" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="380" y="489" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">左卡蓝橙液滴展示单次正压升液动画（支持减弱动态效果）：糖分既是能量燃料，也是早春输水系统的渗透动力源</text>
</svg>
