<text x="38" y="466" font-size="10" fill="#64748b" text-anchor="start">国际约定原始“惯用年龄 BP(距1950年)”仍按 5568 年报数，再用 IntCal20 树轮曲线统一校正为日历年(cal BC/AD)！</text>
