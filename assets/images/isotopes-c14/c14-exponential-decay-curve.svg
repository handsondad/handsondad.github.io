<svg xmlns="http://www.w3.org/2000/svg" width="760" height="498" viewBox="0 0 760 498" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">碳十四5730年半衰期指数衰变曲线与典型文物年代标定图</title>
<desc id="desc">精确绘制N(t)/N0=2^(-t/5730)指数衰变曲线，标出都灵裹尸布（约670年，剩92.2%）、三星堆祭祀坑炭屑（约3100年，剩68.7%）、1个半衰期5730年（剩50%）、2个半衰期11460年（剩25%）、3个半衰期17190年（剩12.5%）及约5万年测年上限（不足0.2%），底部说明5568年惯用半衰期与5730年物理半衰期的国际换算约定。</desc>
