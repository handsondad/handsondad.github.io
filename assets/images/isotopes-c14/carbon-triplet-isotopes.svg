    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="503" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">什么是“同位素”？挤在元素周期表第 6 号座位上的碳家三兄弟</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">质子数 Z=6 决定它们都叫“碳”、化学脾气相同；中子数 N=6, 7, 8 不同，让体重与原子核寿命大相径庭</text>
<rect x="24" y="68" width="174" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="82.0" width="146" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="111.0" y="97.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">为什么叫“同位”素？</text>
<rect x="46" y="120" width="130" height="136" rx="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.8"/>
<text x="58" y="144" font-size="15" fill="#6d28d9" text-anchor="start" font-weight="700" class="mono">6</text>
<text x="164" y="142" font-size="10.5" fill="#6d28d9" text-anchor="end" font-weight="600">第6号座位</text>
<text x="111" y="186" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">C</text>
<text x="111" y="218" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">碳 Carbon</text>
<text x="111" y="242" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700" class="mono">12.011</text>
<text x="38" y="280" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">索迪（1913）造词：</text>
<text x="38" y="299" font-size="11" fill="#1e293b" text-anchor="start">希腊语 isos(相同) +</text>
<text x="38" y="317" font-size="11" fill="#1e293b" text-anchor="start">topos(位置) = 同占一格</text>
<rect x="36" y="334" width="150" height="132" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="354" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">为什么原子量带小数？</text>
<text x="46" y="374" font-size="11" fill="#1e293b" text-anchor="start" class="mono">12 × 98.93%</text>
<text x="46" y="392" font-size="11" fill="#1e293b" text-anchor="start" class="mono">+ 13.003 × 1.07%</text>
<text x="46" y="410" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700" class="mono">≈ 12.011！</text>
<text x="46" y="431" font-size="10.5" fill="#64748b" text-anchor="start">小数尾数正是天然重稳定</text>
<text x="46" y="448" font-size="10.5" fill="#64748b" text-anchor="start">同位素 ¹³C 留下的证据</text>
