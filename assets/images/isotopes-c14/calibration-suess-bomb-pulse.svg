<text x="404" y="359" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">1955 年后每一年浓度都不同 → 精确到“哪一年生”：</text>
<text x="404" y="380" font-size="10.5" fill="#1e293b" text-anchor="start">① 抓假陈年名酒/假字画：标称 1945 年红酒若含核爆 ¹⁴C 必假！</text>
