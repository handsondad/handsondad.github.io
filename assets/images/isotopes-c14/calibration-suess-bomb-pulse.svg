<text x="414" y="94" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">反转三：1963“核爆脉冲”变身现代鉴伪神尺</text>
<text x="394" y="118" font-size="10.5" fill="#64748b" text-anchor="start">大气核试验瞬间让北半球 ¹⁴C 暴涨近一倍（Δ¹⁴C ‰，据 NOAA）：</text>
