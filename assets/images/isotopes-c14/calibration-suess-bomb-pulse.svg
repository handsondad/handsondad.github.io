<svg xmlns="http://www.w3.org/2000/svg" width="760" height="504" viewBox="0 0 760 504" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">碳十四树轮校准IntCal20、化石燃料苏斯效应与1963核爆脉冲应用图</title>
<desc id="desc">左栏上方说明宇宙射线波动与14000年树轮校准曲线IntCal20及三星堆短寿命竹屑取样原则；左栏下方说明化石燃料不含碳十四稀释大气（苏斯效应），成为人类排放二氧化碳的铁证；右栏绘出1950至2024年大气核试验引发的1963核爆碳十四尖峰及其在名酒字画鉴伪、盗猎象牙取证与人体细胞年龄测定中的跨界应用。</desc>
