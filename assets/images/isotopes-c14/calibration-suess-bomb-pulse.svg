<rect x="0.5" y="0.5" width="759" height="503" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">碳十四时钟的“三大剧情反转”：树轮校准、化石燃料铁证与 1963 核爆脉冲</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">大气 ¹⁴C 并非一成不变——修正误差后，它不仅测得更准，还跨界成了气候取证与法医鉴伪神器！</text>
<rect x="24" y="68" width="336" height="198" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="44" cy="90" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="44" y="94" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="94" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">反转一：太阳与地磁场波动 → 树轮标尺校准</text>
<text x="42" y="120" font-size="11" fill="#1e293b" text-anchor="start">• 宇宙射线强弱随地磁场与太阳活动波动几个百分点</text>
<text x="42" y="141" font-size="11" fill="#1e293b" text-anchor="start">• 科学家用长寿刺果松、古橡木一圈一圈重叠拼接，建起</text>
<text x="42" y="160" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">  连续 14,000 年树轮账本（结合石笋珊瑚达 5.5 万年：IntCal20）</text>
<rect x="42" y="174" width="300" height="76" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="54" y="195" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">考古采样铁律（以三星堆为例）：</text>
<text x="54" y="214" font-size="10.5" fill="#1e293b" text-anchor="start">青铜器不含碳不能直接测！北大团队专挑坑内“短寿命碳化</text>
<text x="54" y="233" font-size="10.5" fill="#1e293b" text-anchor="start">竹屑/种子”测 200+ 份，避开百年老树心“老木头偏老误差”。</text>
<rect x="24" y="280" width="336" height="202" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="44" cy="302" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="44" y="306" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="62" y="306" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">反转二：苏斯效应 → 锁定人类烧煤排碳的铁证</text>
<text x="42" y="332" font-size="11" fill="#1e293b" text-anchor="start">• 煤炭、石油埋藏上亿年，里面的 ¹⁴C 早已 100% 死光！</text>
<text x="42" y="353" font-size="11" fill="#1e293b" text-anchor="start">• 19 世纪末工业革命以来，大量“零 ¹⁴C 化石碳”排入天空，</text>
<text x="42" y="372" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="600">  把大气 ¹⁴C 浓度冲淡了（1900 年的木头测出来反而显老！）</text>
<rect x="42" y="388" width="300" height="78" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.1"/>
<text x="54" y="410" font-size="11" fill="#c25014" text-anchor="start" font-weight="700">意外立大功（NOAA 温室气体溯源核心证据）：</text>
<text x="54" y="430" font-size="10.5" fill="#1e293b" text-anchor="start">正是大气 CO₂ 暴涨同时 Δ¹⁴C 与 δ¹³C 双双下降，铁证如山</text>
<text x="54" y="449" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">地证明新增 CO₂ 来自人类燃烧化石燃料，而非海洋释放！</text>
