<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">点数问题的四种等可能未来</title>
  <desc id="desc">甲领先二比一，先赢三局。最多再看两局，把所有序列补齐为甲甲、甲乙、乙甲、乙乙，其中前三种甲最终获胜，最后一种乙获胜。</desc>
  <defs>
    <style>
      .bg{fill:#f7f5ef}.line{stroke:#64748b;stroke-width:3;fill:none}.node{fill:#fff;stroke:#64748b;stroke-width:2}.win{fill:#dff3e4;stroke:#388659;stroke-width:2}.lose{fill:#fde5e2;stroke:#bd5147;stroke-width:2}.t{font:20px "Microsoft YaHei",sans-serif;fill:#172033}.small{font:16px "Microsoft YaHei",sans-serif;fill:#475569}.strong{font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1000" height="470" rx="22"/>
  <text class="t strong" x="500" y="42" text-anchor="middle">甲领先 2:1；先赢 3 局者拿走 64 枚金币</text>
  <text class="small" x="500" y="72" text-anchor="middle">甲还需 1 局，乙还需 2 局；最多再看 2 局</text>
  <path class="line" d="M500 130 L270 205 M500 130 L730 205 M270 260 L145 340 M270 260 L395 340 M730 260 L605 340 M730 260 L855 340"/>
  <rect class="node" x="415" y="98" width="170" height="62" rx="14"/>
  <text class="t strong" x="500" y="136" text-anchor="middle">当前比分 2:1</text>
  <rect class="win" x="190" y="198" width="160" height="62" rx="14"/>
  <text class="t strong" x="270" y="225" text-anchor="middle">下一局甲胜</text>
  <text class="small" x="270" y="248" text-anchor="middle">比赛已结束</text>
  <rect class="node" x="650" y="198" width="160" height="62" rx="14"/>
  <text class="t strong" x="730" y="225" text-anchor="middle">下一局乙胜</text>
  <text class="small" x="730" y="248" text-anchor="middle">比分变成 2:2</text>
  <rect class="win" x="70" y="330" width="150" height="66" rx="14"/>
  <text class="t strong" x="145" y="357" text-anchor="middle">甲甲</text>
  <text class="small" x="145" y="382" text-anchor="middle">甲胜，1/4</text>
  <rect class="win" x="320" y="330" width="150" height="66" rx="14"/>
  <text class="t strong" x="395" y="357" text-anchor="middle">甲乙</text>
  <text class="small" x="395" y="382" text-anchor="middle">甲胜，1/4</text>
  <rect class="win" x="530" y="330" width="150" height="66" rx="14"/>
  <text class="t strong" x="605" y="357" text-anchor="middle">乙甲</text>
  <text class="small" x="605" y="382" text-anchor="middle">甲胜，1/4</text>
  <rect class="lose" x="780" y="330" width="150" height="66" rx="14"/>
  <text class="t strong" x="855" y="357" text-anchor="middle">乙乙</text>
  <text class="small" x="855" y="382" text-anchor="middle">乙胜，1/4</text>
  <text class="t strong" x="500" y="435" text-anchor="middle">甲占 3/4 的可能性，因此分 48 枚；乙分 16 枚</text>
</svg>
