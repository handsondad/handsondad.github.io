<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">帕斯卡定理：自交六边形的三组对边交点共线</title>
<desc id="desc">椭圆上六点按1、4、2、6、3、5顺序连接成自交六边形。每隔三条边的三组对边延长线相交于P、Q、R，三点在红色帕斯卡线上。</desc>
<defs><style>.bg{fill:#f8f6f0}.conic{fill:none;stroke:#718096;stroke-width:2}.edge{fill:none;stroke:#345b8c;stroke-width:3}.ext{fill:none;stroke:#9b6b32;stroke-width:2;stroke-dasharray:8 7}.pascal{fill:none;stroke:#c23d4b;stroke-width:4}.pt{fill:#fff;stroke:#172033;stroke-width:2}.pint{fill:#c23d4b;stroke:#fff;stroke-width:2}.t{font:20px "Microsoft YaHei",sans-serif;fill:#172033}.lab{font:700 19px "Microsoft YaHei",sans-serif;fill:#172033}</style></defs>
<rect class="bg" width="1000" height="700" rx="20"/>

<ellipse class="conic" cx="500" cy="350" rx="390" ry="270"/>
<circle class="pt" cx="141.0" cy="244.5" r="7"/>
<text class="lab" x="117.0" y="243.5" text-anchor="middle">1</text>
<circle class="pt" cx="412.3" cy="86.9" r="7"/>
<text class="lab" x="404.4" y="69.2" text-anchor="middle">2</text>
<circle class="pt" cx="789.8" cy="169.3" r="7"/>
<text class="lab" x="811.0" y="162.1" text-anchor="middle">3</text>
<circle class="pt" cx="886.2" cy="387.6" r="7"/>
<text class="lab" x="911.1" y="396.0" text-anchor="middle">4</text>
<circle class="pt" cx="718.1" cy="573.8" r="7"/>
<text class="lab" x="735.5" y="597.7" text-anchor="middle">5</text>
<circle class="pt" cx="244.1" cy="553.8" r="7"/>
<text class="lab" x="224.6" y="575.3" text-anchor="middle">6</text>
<line class="pascal" x1="10.0" y1="370.7" x2="990.0" y2="292.6"/>
<line class="edge" x1="141.0" y1="244.5" x2="886.2" y2="387.6"/>
<line class="edge" x1="886.2" y1="387.6" x2="412.3" y2="86.9"/>
<line class="edge" x1="412.3" y1="86.9" x2="244.1" y2="553.8"/>
<line class="edge" x1="244.1" y1="553.8" x2="789.8" y2="169.3"/>
<line class="edge" x1="789.8" y1="169.3" x2="718.1" y2="573.8"/>
<line class="edge" x1="718.1" y1="573.8" x2="141.0" y2="244.5"/>
<line class="ext" x1="10.0" y1="219.4" x2="990.0" y2="407.5"/>
<line class="ext" x1="990.0" y1="28.3" x2="50.8" y2="690.0"/>
<line class="ext" x1="990.0" y1="453.4" x2="291.0" y2="10.0"/>
<line class="ext" x1="818.1" y1="10.0" x2="697.5" y2="690.0"/>
<line class="ext" x1="440.0" y1="10.0" x2="195.1" y2="690.0"/>
<line class="ext" x1="10.0" y1="169.7" x2="921.6" y2="690.0"/>
<circle class="pint" cx="567.0" cy="326.3" r="7"/><text class="lab" x="580.0" y="314.3">P</text>
<circle class="pint" cx="764.8" cy="310.5" r="7"/><text class="lab" x="777.8" y="298.5">Q</text>
<circle class="pint" cx="318.9" cy="346.1" r="7"/><text class="lab" x="331.9" y="334.1">R</text>
<text class="t" x="500" y="660" text-anchor="middle">六边形顺序：1→4→2→6→3→5→1；红线上的 P、Q、R 共线</text>
</svg>