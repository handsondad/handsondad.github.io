    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="467" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">射影对偶与无圆规作图：布利安桑外切六边形 + 单靠直尺画圆锥曲线</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：点线互换后“三点共线”对偶成“三线共点”；右：已知 5 个点，不用圆规也不用方程，纯靠直尺描出整条椭圆！</text>
<rect x="20" y="66" width="354" height="388" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
