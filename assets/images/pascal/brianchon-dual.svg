<text x="669.7" y="185.7" font-size="11.8" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">A₁</text>
<circle cx="484.74" cy="175.30" r="4.3" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.6"/>
<text x="475.7" y="170.3" font-size="11.8" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">A₂</text>
<circle cx="649.49" cy="275.83" r="4.3" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.6"/>
<text x="658.5" y="287.8" font-size="11.8" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">A₃</text>
<circle cx="562.27" cy="152.01" r="4.3" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.6"/>
<text x="562.3" y="142.0" font-size="11.8" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">A₄</text>
<circle cx="461.94" cy="256.35" r="4.3" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.6"/>
<text x="452.9" y="268.3" font-size="11.8" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">A₅</text>
<circle cx="535.33" cy="180.03" r="4.2" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<text x="543.3" y="175.0" font-size="11.8" fill="#c25014" text-anchor="start" font-weight="700" class="halo">P</text>
<circle cx="595.45" cy="199.11" r="4.2" fill="#6d28d9" stroke="#ffffff" stroke-width="1.5"/>
<text x="603.5" y="203.1" font-size="11.8" fill="#6d28d9" text-anchor="start" font-weight="700" class="halo">R</text>
<circle cx="446.01" cy="151.67" r="4.2" fill="#c81e3a" stroke="#ffffff" stroke-width="1.5"/>
<text x="438.0" y="145.7" font-size="11.8" fill="#c81e3a" text-anchor="end" font-weight="700" class="halo">Q</text>
<circle cx="455.64" cy="214.93" r="7.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.6"/>
<circle cx="455.64" cy="214.93" r="4.4" fill="#18794e" stroke="#ffffff" stroke-width="1.5"/>
<text x="445.6" y="206.9" font-size="12" fill="#18794e" text-anchor="end" font-weight="700" class="halo">新点 A₆！</text>
<rect x="400" y="344" width="326" height="96" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="412" y="363" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">纯直尺四步口诀（已知 A₁…A₅，过 A₁ 任画绿线 r）：</text>
<text x="412" y="382" font-size="11.2" fill="#1e293b" text-anchor="start">1. 求 P = A₁A₂ ∩ A₄A₅，求 R = A₃A₄ ∩ r</text>
<text x="412" y="400" font-size="11.2" fill="#1e293b" text-anchor="start">2. 连红线 PR（帕斯卡线），交 A₂A₃ 得 Q</text>
<text x="412" y="418" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">3. 连 QA₅ 交绿线 r ⇒ 精准命中曲线上第 6 点 A₆！</text>
<text x="412" y="434" font-size="11.0" fill="#64748b" text-anchor="start">（若令 A₆→A₁ 合并，同法直接画出 A₁ 处的精确切线！）</text>
</svg>
