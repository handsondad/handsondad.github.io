<text x="246.6" y="340.1" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700" class="halo">V5</text>
<circle cx="305.96" cy="255.69" r="4.2" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
<text x="314.0" y="260.7" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700" class="halo">V6</text>
<rect x="34" y="376" width="326" height="64" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="396" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">射影对偶字典：曲线上的点 ↔ 曲线的切线</text>
<text x="46" y="415" font-size="11.1" fill="#1e293b" text-anchor="start">内接六边形对边交点共线 ↔ 外切六边形对顶点连线共点</text>
<text x="46" y="432" font-size="11.0" fill="#c81e3a" text-anchor="start" font-weight="600">注意：共点 B 一般不与椭圆中心 O 重合！</text>
<rect x="386" y="66" width="354" height="388" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="402" y="89" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">五点定圆锥曲线：只用直尺找第 6 点</text>
<rect x="640.0" y="73.0" width="86" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="683.0" y="88.0" font-size="11.3" fill="#18794e" text-anchor="middle" font-weight="600">零圆规作图</text>
<ellipse cx="564.0" cy="228.0" rx="110.0" ry="76.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 4"/>
