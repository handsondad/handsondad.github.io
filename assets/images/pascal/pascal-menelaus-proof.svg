<svg xmlns="http://www.w3.org/2000/svg" width="760" height="558" viewBox="0 0 760 558" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">帕斯卡定理的初等证明与中心投影推广</title>
<desc id="desc">左图在圆上取隔开的三条边AB、CD、EF构造基准三角形UVW，对截线DE、BC、FA使用三次梅涅劳斯定理并由圆幂定理消去十二段割线长，证得P、Q、R共线；右图由光源S作三维中心投影，把圆与帕斯卡线映射到任意倾斜平面上的圆锥曲线与直线P&#x27;Q&#x27;R&#x27;。</desc>
