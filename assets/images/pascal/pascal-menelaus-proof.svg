<text x="40" y="492" font-size="11.2" fill="#1e293b" text-anchor="start">隔开取边 AB、CD、EF</text>
<text x="40" y="512" font-size="11.2" fill="#64748b" text-anchor="start">两两相交围出 ΔUVW</text>
