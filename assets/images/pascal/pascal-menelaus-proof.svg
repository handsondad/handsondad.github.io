<text x="592.0" y="117.6" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700" class="halo">投影中心 S（光源）</text>
<text x="442" y="184" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">平面 π₁：圆与 P,Q,R</text>
<text x="442" y="304" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700" class="halo">截面 π₂：一般圆锥曲线</text>
<text x="481.2" y="368.0" font-size="11.5" fill="#c81e3a" text-anchor="end" font-weight="700" class="halo">P&#x27;</text>
<text x="587.6" y="331.3" font-size="11.5" fill="#c81e3a" text-anchor="middle" font-weight="700" class="halo">Q&#x27;</text>
<text x="677.0" y="298.2" font-size="11.5" fill="#c81e3a" text-anchor="start" font-weight="700" class="halo">R&#x27;</text>
<text x="438" y="396" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">三束视线张成同一平面 SPQR</text>
<text x="438" y="413" font-size="11.5" fill="#c81e3a" text-anchor="start" font-weight="700">与斜面 π₂ 的交线必是直线 P&#x27;Q&#x27;R&#x27;！</text>
<rect x="20" y="436" width="720" height="108" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
