<rect x="0.5" y="0.5" width="759" height="557" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">初等几何四步证完帕斯卡定理：基准三角形 + 圆幂约分 + 中心投影</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先在圆上借 ΔUVW 连用三次梅涅劳斯定理并用圆幂成对消去 12 段弦长，再用一束中心投影推广到任意圆锥曲线</text>
