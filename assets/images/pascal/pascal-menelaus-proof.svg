<text x="216" y="492" font-size="11.2" fill="#1e293b" text-anchor="start">拿截线 DE、BC、FA</text>
<text x="216" y="512" font-size="11.2" fill="#64748b" text-anchor="start">各切 ΔUVW 三边写连乘</text>
<line x1="378.00" y1="452.00" x2="378.00" y2="530.00" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="399" cy="461" r="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="399" y="465" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">3</text>
<text x="415" y="465" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">圆幂成对约分</text>
<text x="392" y="492" font-size="11.2" fill="#1e293b" text-anchor="start">UA·UB=UC·UD 等三组</text>
<text x="392" y="512" font-size="11.2" fill="#64748b" text-anchor="start">12 段弦全消，剩乘积=-1</text>
<line x1="554.00" y1="452.00" x2="554.00" y2="530.00" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="575" cy="461" r="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="575" y="465" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">4</text>
<text x="591" y="465" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">投影保结合性</text>
<text x="568" y="492" font-size="11.2" fill="#1e293b" text-anchor="start">点在线上、线线相交不变</text>
<text x="568" y="512" font-size="11.2" fill="#64748b" text-anchor="start">圆的结论通杀一切圆锥曲线</text>
