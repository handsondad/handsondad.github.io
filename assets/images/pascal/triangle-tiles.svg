<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">小三角形里的加法：帕斯卡三角第0至7行</title>
<desc id="desc">每个向上三角形承载一个组合数。第3行中间两个3是橙色，下面第4行的6是绿色，说明3加3等于6。右侧行和从1倍增到128。白色倒三角为排版空隙。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.parents{animation:parents 4.8s ease-out 1 both}.result{animation:result 4.8s ease-out 1 both}
@keyframes parents{0%{opacity:0}25%,100%{opacity:1}}
@keyframes result{0%,35%{opacity:0}65%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.parents,.result{animation:none}}</style>
<rect x="1" y="1" width="998" height="798" rx="16" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.5"/>
<text x="500" y="46.18" text-anchor="middle" font-size="21.5" fill="#20314d" font-weight="700">帕斯卡三角：上面两个数，相加落到下面</text><text x="500" y="82.88" text-anchor="middle" font-size="15.0" fill="#20314d">从第 0 行数起；紫色是普通格，橙色是父格，绿色是结果格</text><text x="58" y="121.16" text-anchor="middle" font-size="15.0" fill="#20314d">行号</text><text x="895" y="121.16" text-anchor="middle" font-size="15.0" fill="#20314d">整行之和</text><text x="58" y="182.71" text-anchor="middle" font-size="15.4" fill="#20314d">0</text><text x="895" y="182.71" text-anchor="middle" font-size="15.4" fill="#20314d">1 = 2^0</text><polygon points="460.0,140 415.0,202 505.0,202" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="0" data-k="0" data-value="1"/><text x="460.0" y="186.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><text x="58" y="244.71" text-anchor="middle" font-size="15.4" fill="#20314d">1</text><text x="895" y="244.71" text-anchor="middle" font-size="15.4" fill="#20314d">2 = 2^1</text><polygon points="415.0,202 370.0,264 460.0,264" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="1" data-k="0" data-value="1"/><text x="415.0" y="248.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><polygon points="505.0,202 460.0,264 550.0,264" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="1" data-k="1" data-value="1"/><text x="505.0" y="248.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><text x="58" y="306.71" text-anchor="middle" font-size="15.4" fill="#20314d">2</text><text x="895" y="306.71" text-anchor="middle" font-size="15.4" fill="#20314d">4 = 2^2</text><polygon points="370.0,264 325.0,326 415.0,326" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="2" data-k="0" data-value="1"/><text x="370.0" y="310.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><polygon points="460.0,264 415.0,326 505.0,326" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="2" data-k="1" data-value="2"/><text x="460.0" y="310.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">2</text><polygon points="550.0,264 505.0,326 595.0,326" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="2" data-k="2" data-value="1"/><text x="550.0" y="310.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><text x="58" y="368.71" text-anchor="middle" font-size="15.4" fill="#20314d">3</text><text x="895" y="368.71" text-anchor="middle" font-size="15.4" fill="#20314d">8 = 2^3</text><polygon points="325.0,326 280.0,388 370.0,388" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="3" data-k="0" data-value="1"/><text x="325.0" y="372.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><polygon points="415.0,326 370.0,388 460.0,388" fill="#ffd694" stroke="#fff" stroke-width="2" data-n="3" data-k="1" data-value="3"/><text x="415.0" y="372.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">3</text><polygon points="505.0,326 460.0,388 550.0,388" fill="#ffd694" stroke="#fff" stroke-width="2" data-n="3" data-k="2" data-value="3"/><text x="505.0" y="372.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">3</text><polygon points="595.0,326 550.0,388 640.0,388" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="3" data-k="3" data-value="1"/><text x="595.0" y="372.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><text x="58" y="430.71" text-anchor="middle" font-size="15.4" fill="#20314d">4</text><text x="895" y="430.71" text-anchor="middle" font-size="15.4" fill="#20314d">16 = 2^4</text><polygon points="280.0,388 235.0,450 325.0,450" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="4" data-k="0" data-value="1"/><text x="280.0" y="434.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><polygon points="370.0,388 325.0,450 415.0,450" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="4" data-k="1" data-value="4"/><text x="370.0" y="434.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">4</text><polygon points="460.0,388 415.0,450 505.0,450" fill="#b8e4cf" stroke="#fff" stroke-width="2" data-n="4" data-k="2" data-value="6"/><text x="460.0" y="434.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">6</text><polygon points="550.0,388 505.0,450 595.0,450" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="4" data-k="3" data-value="4"/><text x="550.0" y="434.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">4</text><polygon points="640.0,388 595.0,450 685.0,450" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="4" data-k="4" data-value="1"/><text x="640.0" y="434.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><text x="58" y="492.71" text-anchor="middle" font-size="15.4" fill="#20314d">5</text><text x="895" y="492.71" text-anchor="middle" font-size="15.4" fill="#20314d">32 = 2^5</text><polygon points="235.0,450 190.0,512 280.0,512" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="5" data-k="0" data-value="1"/><text x="235.0" y="496.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><polygon points="325.0,450 280.0,512 370.0,512" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="5" data-k="1" data-value="5"/><text x="325.0" y="496.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">5</text><polygon points="415.0,450 370.0,512 460.0,512" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="5" data-k="2" data-value="10"/><text x="415.0" y="496.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">10</text><polygon points="505.0,450 460.0,512 550.0,512" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="5" data-k="3" data-value="10"/><text x="505.0" y="496.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">10</text><polygon points="595.0,450 550.0,512 640.0,512" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="5" data-k="4" data-value="5"/><text x="595.0" y="496.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">5</text><polygon points="685.0,450 640.0,512 730.0,512" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="5" data-k="5" data-value="1"/><text x="685.0" y="496.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><text x="58" y="554.71" text-anchor="middle" font-size="15.4" fill="#20314d">6</text><text x="895" y="554.71" text-anchor="middle" font-size="15.4" fill="#20314d">64 = 2^6</text><polygon points="190.0,512 145.0,574 235.0,574" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="6" data-k="0" data-value="1"/><text x="190.0" y="558.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><polygon points="280.0,512 235.0,574 325.0,574" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="6" data-k="1" data-value="6"/><text x="280.0" y="558.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">6</text><polygon points="370.0,512 325.0,574 415.0,574" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="6" data-k="2" data-value="15"/><text x="370.0" y="558.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">15</text><polygon points="460.0,512 415.0,574 505.0,574" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="6" data-k="3" data-value="20"/><text x="460.0" y="558.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">20</text><polygon points="550.0,512 505.0,574 595.0,574" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="6" data-k="4" data-value="15"/><text x="550.0" y="558.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">15</text><polygon points="640.0,512 595.0,574 685.0,574" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="6" data-k="5" data-value="6"/><text x="640.0" y="558.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">6</text><polygon points="730.0,512 685.0,574 775.0,574" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="6" data-k="6" data-value="1"/><text x="730.0" y="558.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><text x="58" y="616.71" text-anchor="middle" font-size="15.4" fill="#20314d">7</text><text x="895" y="616.71" text-anchor="middle" font-size="15.4" fill="#20314d">128 = 2^7</text><polygon points="145.0,574 100.0,636 190.0,636" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="7" data-k="0" data-value="1"/><text x="145.0" y="620.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><polygon points="235.0,574 190.0,636 280.0,636" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="7" data-k="1" data-value="7"/><text x="235.0" y="620.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">7</text><polygon points="325.0,574 280.0,636 370.0,636" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="7" data-k="2" data-value="21"/><text x="325.0" y="620.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">21</text><polygon points="415.0,574 370.0,636 460.0,636" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="7" data-k="3" data-value="35"/><text x="415.0" y="620.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">35</text><polygon points="505.0,574 460.0,636 550.0,636" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="7" data-k="4" data-value="35"/><text x="505.0" y="620.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">35</text><polygon points="595.0,574 550.0,636 640.0,636" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="7" data-k="5" data-value="21"/><text x="595.0" y="620.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">21</text><polygon points="685.0,574 640.0,636 730.0,636" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="7" data-k="6" data-value="7"/><text x="685.0" y="620.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">7</text><polygon points="775.0,574 730.0,636 820.0,636" fill="#ead8fa" stroke="#fff" stroke-width="2" data-n="7" data-k="7" data-value="1"/><text x="775.0" y="620.75" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">1</text><g class="parents"><circle cx="415" cy="374" r="20" fill="none" stroke="#ad6500" stroke-width="4"/><circle cx="505" cy="374" r="20" fill="none" stroke="#ad6500" stroke-width="4"/></g><g class="result"><path d="M417 394 L446 425 M503 394 L474 425" fill="none" stroke="#267955" stroke-width="4"/><circle cx="460" cy="436" r="22" fill="none" stroke="#267955" stroke-width="4"/></g><text x="500" y="693.45" text-anchor="middle" font-size="18.5" fill="#20314d" font-weight="700">3 + 3 = 6：下面每一格，都在收集来自两个方向的排法</text><text x="500" y="733.71" text-anchor="middle" font-size="15.4" fill="#20314d">白色倒三角只是排版空隙，不是数值 0；两条外边一直都是 1。</text><text x="500" y="772.16" text-anchor="middle" font-size="15.0" fill="#20314d">描边动画播放一次后停留；静止时也能按橙色 → 绿色读图。</text>
