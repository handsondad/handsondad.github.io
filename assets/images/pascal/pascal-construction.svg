<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">帕斯卡六边形：三组对边逐组显现</title>
<desc id="desc">灰线先给出六边形。橙色边14和63交于P，青色边42和35交于Q，紫色边26和51交于R；红线最后出现，穿过三个交点。三组交点在本构型中均位于边段内部，不必延长。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.pair1{animation:p1 5s steps(1,end) 1 both}.pair2{animation:p2 5s steps(1,end) 1 both}.pair3{animation:p3 5s steps(1,end) 1 both}.final{animation:pf 5s steps(1,end) 1 both}
@keyframes p1{0%,9%{opacity:0}10%,100%{opacity:1}}
@keyframes p2{0%,29%{opacity:0}30%,100%{opacity:1}}
@keyframes p3{0%,49%{opacity:0}50%,100%{opacity:1}}
@keyframes pf{0%,74%{opacity:0}75%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.step{animation:none}}</style>
<rect x="1" y="1" width="998" height="758" rx="16" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.5"/>
<text x="500" y="43.18" text-anchor="middle" font-size="21.5" fill="#20314d" font-weight="700">别一次看六条边：每次只配一组</text><text x="500" y="78.71" text-anchor="middle" font-size="15.4" fill="#20314d">固定顺序 1 → 4 → 2 → 6 → 3 → 5 → 1；边①配④，②配⑤，③配⑥</text><g transform="translate(0 60) scale(1 .83)"><ellipse cx="500" cy="350" rx="390" ry="270" fill="none" stroke="#a9afba" stroke-width="2"/><path d="M141.00398110073166 244.50116993350193 L886.1998263369164 387.59998309235647" stroke="#c8ccd5" stroke-width="2" fill="none"/><path d="M886.1998263369164 387.59998309235647 L412.3047923874842 86.91437716245264" stroke="#c8ccd5" stroke-width="2" fill="none"/><path d="M412.3047923874842 86.91437716245264 L244.13623727189668 553.7711404610685" stroke="#c8ccd5" stroke-width="2" fill="none"/><path d="M244.13623727189668 553.7711404610685 L789.78967357045 169.30643887446408" stroke="#c8ccd5" stroke-width="2" fill="none"/><path d="M789.78967357045 169.30643887446408 L718.1222666891176 573.8228486245966" stroke="#c8ccd5" stroke-width="2" fill="none"/><path d="M718.1222666891176 573.8228486245966 L141.00398110073166 244.50116993350193" stroke="#c8ccd5" stroke-width="2" fill="none"/><g class="step pair1" stroke="#996000" fill="none" stroke-width="4"><path d="M141.00398110073166 244.50116993350193 L886.1998263369164 387.59998309235647"/><path d="M244.13623727189668 553.7711404610685 L789.78967357045 169.30643887446408"/></g><g class="step pair1"><circle cx="566.9759159095844" cy="326.2999060641471" r="10" fill="#996000" stroke="#fff" stroke-width="3"/><text x="581.9759159095844" y="306.63" text-anchor="start" font-size="20.0" fill="#996000" font-weight="700">P</text></g><g class="step pair2" stroke="#006e8a" fill="none" stroke-width="4"><path d="M886.1998263369164 387.59998309235647 L412.3047923874842 86.91437716245264"/><path d="M789.78967357045 169.30643887446408 L718.1222666891176 573.8228486245966"/></g><g class="step pair2"><circle cx="764.765769938565" cy="310.55027753971143" r="10" fill="#006e8a" stroke="#fff" stroke-width="3"/><text x="779.765769938565" y="290.88" text-anchor="start" font-size="20.0" fill="#006e8a" font-weight="700">Q</text></g><g class="step pair3" stroke="#7751a8" fill="none" stroke-width="4"><path d="M412.3047923874842 86.91437716245264 L244.13623727189668 553.7711404610685"/><path d="M718.1222666891176 573.8228486245966 L141.00398110073166 244.50116993350193"/></g><g class="step pair3"><circle cx="318.96079968146734" cy="346.04887634482316" r="10" fill="#7751a8" stroke="#fff" stroke-width="3"/><text x="333.96079968146734" y="374.37" text-anchor="start" font-size="20.0" fill="#7751a8" font-weight="700">R</text></g><path class="step final" d="M110 362.6880259478654 L900 299.781833942278" stroke="#bf3e53" stroke-width="3" stroke-dasharray="9 6"/><circle cx="141.00398110073166" cy="244.50116993350193" r="8" fill="#fff" stroke="#20314d" stroke-width="2"/><text x="120.00398110073166" y="232.83" text-anchor="middle" font-size="20.0" fill="#20314d" font-weight="700">1</text><circle cx="412.3047923874842" cy="86.91437716245264" r="8" fill="#fff" stroke="#20314d" stroke-width="2"/><text x="400.3047923874842" y="66.24" text-anchor="middle" font-size="20.0" fill="#20314d" font-weight="700">2</text><circle cx="789.78967357045" cy="169.30643887446408" r="8" fill="#fff" stroke="#20314d" stroke-width="2"/><text x="810.78967357045" y="155.63" text-anchor="middle" font-size="20.0" fill="#20314d" font-weight="700">3</text><circle cx="886.1998263369164" cy="387.59998309235647" r="8" fill="#fff" stroke="#20314d" stroke-width="2"/><text x="908.1998263369164" y="403.93" text-anchor="middle" font-size="20.0" fill="#20314d" font-weight="700">4</text><circle cx="718.1222666891176" cy="573.8228486245966" r="8" fill="#fff" stroke="#20314d" stroke-width="2"/><text x="732.1222666891176" y="602.15" text-anchor="middle" font-size="20.0" fill="#20314d" font-weight="700">5</text><circle cx="244.13623727189668" cy="553.7711404610685" r="8" fill="#fff" stroke="#20314d" stroke-width="2"/><text x="220.13623727189668" y="577.10" text-anchor="middle" font-size="20.0" fill="#20314d" font-weight="700">6</text></g><text x="180" y="630.52" text-anchor="middle" font-size="17.7" fill="#996000" font-weight="700">① 14 与 63 → P</text><text x="500" y="630.52" text-anchor="middle" font-size="17.7" fill="#006e8a" font-weight="700">② 42 与 35 → Q</text><text x="820" y="630.52" text-anchor="middle" font-size="17.7" fill="#7751a8" font-weight="700">③ 26 与 51 → R</text><text x="500" y="683.39" text-anchor="middle" font-size="19.2" fill="#20314d" font-weight="700">最后连 P、Q：第三个交点 R 也在这条红线上</text><text x="500" y="726.88" text-anchor="middle" font-size="15.0" fill="#20314d">分步动画播放一次后保留完整图；颜色与边号共同帮助配对。</text>
</svg>
