<svg xmlns="http://www.w3.org/2000/svg" width="760" height="458" viewBox="0 0 760 458" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">黄白交角5.14度食季原理与日全食日环食及月全食红月亮几何成因图</title>
<desc id="desc">上图展示白道面相对黄道面倾斜5.14度，仅在半年一次的黄白交点食季才发生交食；左下对比月球近地点日全食与远地点伪本影日环食；右下展示地球大气散射蓝光并折射红光形成暗红月全食。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="457" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">日月食的几何关卡：5.14° 黄白交角、伪本影金环与红月亮</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">白道与黄道斜交使多数朔望错开影锥；月球椭圆距离变化决定日全食与日环食（尺度与倾角为教学示意）</text>
<rect x="20" y="62" width="720" height="178" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 为什么不是每月初一日食、每月十五月食？—— 5.14° 黄白交角与“食季”</text>
<ellipse cx="380.0" cy="158.0" rx="148.0" ry="42.0" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.6"/>
<line x1="190.0" y1="158.0" x2="570.0" y2="158.0" stroke="#18794e" stroke-width="1.4" stroke-dasharray="6 4"/>
<circle cx="380.0" cy="158.0" r="15" fill="#fde047" stroke="#c25014" stroke-width="1.6"/>
<text x="380.0" y="162.0" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">太阳</text>
<text x="380.0" y="187.0" font-size="10.3" fill="#1d6fa5" text-anchor="middle" font-weight="600" class="halo">黄道面（地球公转平面）</text>
<g transform="translate(232.0,158.0) rotate(-18)"><ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#18794e" stroke-width="1.6"/></g>
<circle cx="232.0" cy="158.0" r="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<circle cx="260.5" cy="158.0" r="3.6" fill="#18794e"/>
<circle cx="203.5" cy="158.0" r="3.6" fill="#18794e"/>
<text x="36" y="132" font-size="11.0" fill="#18794e" text-anchor="start" font-weight="700">食季①（过交点）</text>
<text x="36" y="150" font-size="10.5" fill="#1e293b" text-anchor="start">朔望恰落黄白交点</text>
<text x="36" y="168" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">→ 初一日食 / 十五月食</text>
<g transform="translate(528.0,158.0) rotate(-18)"><ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#18794e" stroke-width="1.6"/></g>
<circle cx="528.0" cy="158.0" r="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<circle cx="499.5" cy="158.0" r="3.6" fill="#18794e"/>
<circle cx="556.5" cy="158.0" r="3.6" fill="#18794e"/>
<text x="724" y="132" font-size="11.0" fill="#18794e" text-anchor="end" font-weight="700">食季②（约半年后）</text>
<text x="724" y="150" font-size="10.5" fill="#1e293b" text-anchor="end">交点线再次对准太阳</text>
<text x="724" y="168" font-size="10.5" fill="#18794e" text-anchor="end" font-weight="700">→ 每年约 2 个食季</text>
<g transform="translate(380.0,116.0) rotate(-18)"><ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#c25014" stroke-width="1.6"/></g>
<circle cx="380.0" cy="116.0" r="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<circle cx="380.0" cy="125.5" r="3.5" fill="#c25014"/>
<text x="418.0" y="113.0" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="600" class="halo">非食季：偏离黄道 ±5.14°（约3.4万km），影锥擦过</text>
<g transform="translate(380.0,200.0) rotate(-18)"><ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#c25014" stroke-width="1.6"/></g>
<circle cx="380.0" cy="200.0" r="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<circle cx="380.0" cy="190.5" r="3.5" fill="#c25014"/>
<text x="36" y="226" font-size="10.5" fill="#64748b" text-anchor="start">注：交点线受太阳摄动每年西退约 19.3°，故两食季间隔约 173.3 天（比半年略短）</text>
<rect x="20" y="252" width="354" height="192" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="275" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 日全食 vs 日环食：月球远近改写影锥</text>
<circle cx="52" cy="318.0" r="14" fill="#fde047" stroke="#c25014" stroke-width="1.3"/>
<polygon points="132,311.0 206,301.0 206,335.0 132,325.0" fill="#e2e8f0" opacity="0.7"/>
<polygon points="132,312.0 206,316.5 206,319.5 132,324.0" fill="#1e293b"/>
<circle cx="132" cy="318.0" r="6.2" fill="#475569"/>
<circle cx="212" cy="318.0" r="11" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="234" y="312.0" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">近地点（≈35.6万km，33.5′）</text>
<text x="234" y="329.0" font-size="10.5" fill="#1e293b" text-anchor="start">本影锥触地 → 日全食(见日冕)</text>
<circle cx="52" cy="386.0" r="14" fill="#fde047" stroke="#c25014" stroke-width="1.3"/>
<polygon points="118,380.0 212,368.0 212,404.0 118,392.0" fill="#e2e8f0" opacity="0.7"/>
<polygon points="118,380.5 178,386.0 118,391.5" fill="#1e293b"/>
<polygon points="178,386.0 212,381.5 212,390.5" fill="#fef1e8" stroke="#c25014" stroke-width="0.9"/>
<circle cx="118" cy="386.0" r="5.6" fill="#475569"/>
<circle cx="218" cy="386.0" r="11" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="234" y="380.0" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">远地点（≈40.7万km，29.4′）</text>
<text x="234" y="397.0" font-size="10.5" fill="#1e293b" text-anchor="start">伪本影触地 → 日环食(金环)</text>
<text x="36" y="430" font-size="10.4" fill="#64748b" text-anchor="start">太阳视直径约 31.6′–32.7′，恰卡在月球最大与最小视直径之间！</text>
<rect x="386" y="252" width="354" height="192" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="402" y="275" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">③ 月全食“红月亮”：地球大气层的散射折射</text>
<circle cx="420" cy="348.0" r="16" fill="#fde047" stroke="#c25014" stroke-width="1.4"/>
<text x="420" y="352.0" font-size="10.4" fill="#0f172a" text-anchor="middle" font-weight="700">太阳</text>
<polygon points="520,331.0 716,314.0 716,382.0 520,365.0" fill="#f1f5f9"/>
<polygon points="520,332.0 716,339.0 716,357.0 520,364.0" fill="#fce7e2" opacity="0.85"/>
<path d="M436,336.0 L520,329.0 L668,345.0" fill="none" stroke="#dc2626" stroke-width="1.6"/>
<path d="M436,360.0 L520,367.0 L668,351.0" fill="none" stroke="#dc2626" stroke-width="1.6"/>
<path d="M520,329.0 L542,312.0" fill="none" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="3 2"/>
<path d="M520,367.0 L542,384.0" fill="none" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="3 2"/>
<circle cx="520" cy="348.0" r="20" fill="none" stroke="#93c5fd" stroke-width="3.5"/>
<circle cx="520" cy="348.0" r="16" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="520" y="352.0" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">地球</text>
<circle cx="668" cy="348.0" r="9.5" fill="#b93829" stroke="#7f1d1d" stroke-width="1.4"/>
<text x="668" y="333.0" font-size="10.6" fill="#991b1b" text-anchor="middle" font-weight="700" class="halo">本影内红月亮</text>
<text x="552" y="316.0" font-size="10.4" fill="#1d6fa5" text-anchor="start" font-weight="600" class="halo">蓝紫短波被大气散射滤除</text>
<text x="402" y="408" font-size="10.4" fill="#1e293b" text-anchor="start">• 地球本影比月球宽得多，背日夜半球整片可见月食（持续数小时）</text>
<text x="402" y="428" font-size="10.4" fill="#991b1b" text-anchor="start" font-weight="600">• 红橙长波经地球大气折射入本影，故全食月亮呈暗铜红色而非全黑</text>
</svg>
