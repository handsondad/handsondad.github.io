<text x="488" y="384" font-size="10.6" fill="#1e293b" text-anchor="start">古用平气（等时间 15.22 天）；改定气（等黄经</text>
<text x="488" y="402" font-size="10.6" fill="#1e293b" text-anchor="start">15°）后，直接造就了夏多闰月、冬罕闰月。</text>
