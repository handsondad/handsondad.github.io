<text x="488" y="283" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么清明总在公历 4 月 4–5 日？</text>
<text x="488" y="302" font-size="10.6" fill="#1e293b" text-anchor="start">节气本质是纯阳历角度（清明 = 15°），跟</text>
