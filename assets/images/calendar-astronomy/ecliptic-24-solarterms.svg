<svg xmlns="http://www.w3.org/2000/svg" width="760" height="444" viewBox="0 0 760 444" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">黄道二十四节气定气法15度划分与近日点远日点时间间隔实算图</title>
<desc id="desc">左图展示地球绕太阳椭圆轨道上每隔黄经15度划分二十四节气（12中气与12节气交错）；右图实算2025年各节气间隔从近日点14.72天到远日点15.73天的变化曲线及平气改定气的历法影响。</desc>
