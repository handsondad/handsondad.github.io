<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">2025至2029连续五年无大年三十与2030年回归的定朔时刻计算图</title>
<desc id="desc">上图展示腊月初一合朔时刻t0加当月真实朔望月余时Δh与24小时午夜分界线的关系；下图实算2025至2029年总和均小于24小时（2027年23:56仅差4分钟），故连续五年除夕为腊月廿九，直至2030年00:08跨过午夜迎来大年三十。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="451" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">定朔与午夜红线：为什么 2025—2029 连续五年没有“大年三十”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">按国家标准 GB/T 33661-2017，合朔落入哪天哪天就是初一；腊月能否保住第 30 天，全看下一次合朔跨不跨午夜</text>
<rect x="20" y="62" width="720" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 判定公式：从腊月初一 00:00 起算，下一次合朔能否撑过第 30 天末的午夜 24:00？</text>
<rect x="36" y="96" width="134" height="28" rx="5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="103" y="114" font-size="11.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">t₀：初一合朔时刻</text>
<text x="180" y="115" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">+</text>
<rect x="192" y="96" width="248" height="28" rx="5" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="316" y="114" font-size="10.9" fill="#c25014" text-anchor="middle" font-weight="700">真实朔望月 = 29 整天 + Δh 小时 (6.4–20.2h)</text>
<text x="454" y="115" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">vs</text>
<rect x="470" y="96" width="254" height="28" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="597" y="114" font-size="11.0" fill="#b91c1c" text-anchor="middle" font-weight="700">第 30 天午夜红线：t₀ + Δh = 24.0 小时</text>
<text x="36" y="146" font-size="11.0" fill="#1e293b" text-anchor="start">• 若 t₀ + Δh &lt; 24h：新月落回第 30 天内 → 第 30 天直接变成“正月初一”，腊月只剩 29 天（除夕为腊月廿九）！</text>
<text x="36" y="166" font-size="11.0" fill="#18794e" text-anchor="start" font-weight="600">• 若 t₀ + Δh ≥ 24h：新月跨过午夜进入第 31 天 → 第 30 天顺利留给腊月，迎来“大年三十”（如 2030 年）！</text>
<rect x="20" y="192" width="720" height="248" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="215" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 2025—2030 连续六年腊月实算对表（东八区北京时间，注意 2027 差 4 分钟与 2030 跨 8 分钟！）</text>
<line x1="182.0" y1="230" x2="182.0" y2="394" stroke="#f1f5f9" stroke-width="1"/>
<text x="182.0" y="409" font-size="10.5" fill="#64748b" text-anchor="middle">0h</text>
<line x1="255.2" y1="230" x2="255.2" y2="394" stroke="#f1f5f9" stroke-width="1"/>
<text x="255.2" y="409" font-size="10.5" fill="#64748b" text-anchor="middle">6h</text>
<line x1="328.4" y1="230" x2="328.4" y2="394" stroke="#f1f5f9" stroke-width="1"/>
<text x="328.4" y="409" font-size="10.5" fill="#64748b" text-anchor="middle">12h</text>
<line x1="401.6" y1="230" x2="401.6" y2="394" stroke="#f1f5f9" stroke-width="1"/>
<text x="401.6" y="409" font-size="10.5" fill="#64748b" text-anchor="middle">18h</text>
<text x="34" y="251" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">2025 乙巳蛇年春节前</text>
<rect x="182.0" y="239" width="78.8" height="16" rx="2" fill="#1d6fa5"/>
<rect x="260.8" y="239" width="172.6" height="16" rx="2" fill="#c25014" opacity="0.88"/>
<text x="221.4" y="251" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">6.5h</text>
<text x="347.1" y="251" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">+14.2h</text>
<text x="500" y="251" font-size="10.6" fill="#1e293b" text-anchor="start" font-weight="600">初一 01/29 20:36（腊月29天·无三十）</text>
<text x="34" y="277" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">2026 丙午马年春节前</text>
<rect x="182.0" y="265" width="47.3" height="16" rx="2" fill="#1d6fa5"/>
<rect x="229.3" y="265" width="197.1" height="16" rx="2" fill="#c25014" opacity="0.88"/>
<text x="205.6" y="277" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">3.9h</text>
<text x="327.8" y="277" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">+16.2h</text>
<text x="500" y="277" font-size="10.6" fill="#1e293b" text-anchor="start" font-weight="600">初一 02/17 20:01（腊月29天·无三十）</text>
<text x="34" y="303" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">2027 丁未羊年春节前</text>
<rect x="182.0" y="291" width="53.9" height="16" rx="2" fill="#1d6fa5"/>
<rect x="235.9" y="291" width="238.2" height="16" rx="2" fill="#c25014" opacity="0.88"/>
<text x="208.9" y="303" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">4.4h</text>
<text x="354.9" y="303" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">+19.5h</text>
<text x="500" y="303" font-size="10.6" fill="#b91c1c" text-anchor="start" font-weight="700">初一 02/06 23:56（差4分·廿九除夕）</text>
<text x="34" y="329" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">2028 戊申猴年春节前</text>
<rect x="182.0" y="317" width="51.5" height="16" rx="2" fill="#1d6fa5"/>
<rect x="233.5" y="317" width="231.8" height="16" rx="2" fill="#c25014" opacity="0.88"/>
<text x="207.7" y="329" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">4.2h</text>
<text x="349.3" y="329" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">+19.0h</text>
<text x="500" y="329" font-size="10.6" fill="#1e293b" text-anchor="start" font-weight="600">初一 01/26 23:13（腊月29天·无三十）</text>
<text x="34" y="355" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">2029 己酉鸡年春节前</text>
<rect x="182.0" y="343" width="17.2" height="16" rx="2" fill="#1d6fa5"/>
<rect x="199.2" y="343" width="208.8" height="16" rx="2" fill="#c25014" opacity="0.88"/>
<text x="303.6" y="355" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">+17.1h</text>
<text x="500" y="355" font-size="10.6" fill="#1e293b" text-anchor="start" font-weight="600">初一 02/13 18:31（腊月29天·无三十）</text>
<text x="34" y="381" font-size="10.8" fill="#18794e" text-anchor="start" font-weight="700">2030 庚戌狗年春节前</text>
<rect x="182.0" y="369" width="132.1" height="16" rx="2" fill="#1d6fa5"/>
<rect x="314.1" y="369" width="162.3" height="16" rx="2" fill="#18794e" opacity="0.88"/>
<text x="248.1" y="381" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">10.8h</text>
<text x="395.2" y="381" font-size="10.2" fill="#ffffff" text-anchor="middle" font-weight="700">+13.3h</text>
<text x="500" y="381" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="700">初一 02/03 00:07（跨8分·有年三十）</text>
<line x1="474.8" y1="226" x2="474.8" y2="395" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3"/>
<text x="474.8" y="409" font-size="10.6" fill="#dc2626" text-anchor="middle" font-weight="700">24h 午夜线</text>
<rect x="34" y="420" width="10" height="10" rx="2" fill="#1d6fa5"/>
<text x="48" y="429" font-size="10.5" fill="#64748b" text-anchor="start">t₀：腊月初一合朔时刻</text>
<rect x="184" y="420" width="10" height="10" rx="2" fill="#c25014"/>
<text x="198" y="429" font-size="10.5" fill="#64748b" text-anchor="start">Δh：当月真实朔望月超出 29 天的小时数</text>
<rect x="430" y="420" width="10" height="10" rx="2" fill="#18794e"/>
<text x="444" y="429" font-size="10.5" fill="#64748b" text-anchor="start">绿色：t₀ + Δh ≥ 24h（保住大年三十）</text>
</svg>
