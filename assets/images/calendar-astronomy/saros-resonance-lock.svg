<text x="134.0" y="410.0" font-size="10.3" fill="#6d28d9" text-anchor="middle" font-weight="700">+2沙罗</text>
<text x="168" y="306" font-size="10.6" fill="#1e293b" text-anchor="start">• 地球多自转约 7 小时 43 分（≈116°–120°）</text>
<text x="168" y="327" font-size="10.6" fill="#1e293b" text-anchor="start">• 下一次同族日食落向西边约 1/3 个地球</text>
<text x="168" y="348" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="700">• 满 3 轮沙罗（54 年 33–34 天，“转轮周期”）</text>
<text x="168" y="368" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="600">  累计多转满一整圈，日食才回到同一经度区！</text>
<text x="168" y="394" font-size="10.4" fill="#64748b" text-anchor="start">• 月食因夜半球皆可见，单轮沙罗更易异地同观</text>
<rect x="400" y="252" width="340" height="174" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="416" y="275" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">③ 沙罗家族的寿命与中西古历“食周”</text>
<rect x="414" y="292" width="312" height="56" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="426" y="311" font-size="11.0" fill="#6d28d9" text-anchor="start" font-weight="700">为什么一族沙罗不会永远循环下去？</text>
<text x="426" y="330" font-size="10.4" fill="#1e293b" text-anchor="start">52 分钟残差使交点每次微移约 0.5°（影轴南北移 ~300km），</text>
<text x="426" y="344" font-size="10.4" fill="#1e293b" text-anchor="start">每族历经 1226–1550 年（约 70–85 次食）后从两极谢幕。</text>
<rect x="414" y="358" width="312" height="56" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="426" y="377" font-size="11.0" fill="#18794e" text-anchor="start" font-weight="700">中国古历独立推算的共振：135 月“食周”与交点月</text>
<text x="426" y="396" font-size="10.4" fill="#1e293b" text-anchor="start">西汉《三统历》定 135 朔望月 = 23 食季（146.5 交点月）；</text>
<text x="426" y="410" font-size="10.4" fill="#1e293b" text-anchor="start">462 年祖冲之《大明历》测交点月 27.21223 天，仅差 0.9 秒！</text>
