<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">乐器通用三级发声引擎与440赫兹标准音下音叉竹笛小提琴单簧管傅里叶泛音谱对比图</title>
<desc id="desc">顶部展示激励源、驻波选频器与辐射阻抗匹配器三级声学链路；左下绘制音叉、竹笛、小提琴与单簧管在440赫兹下的真实合成波形；右下柱状图对比前六阶整数倍泛音振幅，揭示基频决定音高、泛音配方决定音色。</desc>
