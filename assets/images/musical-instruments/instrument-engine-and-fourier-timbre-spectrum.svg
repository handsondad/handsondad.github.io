<text x="24" y="50" font-size="11.8" fill="#64748b" text-anchor="start">音高由每秒重复次数（基频 f₁）拍板；音色则由整数倍泛音（2f₁, 3f₁, 4f₁…）的强弱配方与起音包络共同雕刻</text>
