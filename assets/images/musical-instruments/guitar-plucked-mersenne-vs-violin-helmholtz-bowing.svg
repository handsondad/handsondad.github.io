<text x="44" y="314" font-size="12.0" fill="#1d6fa5" text-anchor="start" font-weight="700">梅森弦振公式：f₁ = (1 / 2L) · √(F_T / μ)</text>
<text x="44" y="337" font-size="11.5" fill="#1e293b" text-anchor="start">• 按品缩弦长 L → 升调（12 品 L 减半，频率翻倍高八度）</text>
<text x="44" y="359" font-size="11.5" fill="#1e293b" text-anchor="start">• 拧弦钮拉紧张力 F_T → 升调（频率翻倍需张力涨 4 倍！）</text>
<text x="44" y="381" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 低音弦缠铜丝增大线密度 μ → 不加长琴颈照样出浑厚低音</text>
<line x1="44.0" y1="394.0" x2="350.0" y2="394.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="44" y="415" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">为什么不插电的电吉他像蚊子哼，木吉他却响满屋？</text>
<text x="44" y="437" font-size="11.5" fill="#1e293b" text-anchor="start">• 细钢丝推不动空气（气流绕弦短路，声阻抗严重失配）；</text>
<text x="44" y="459" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">• 木吉他靠琴码带动 2.5 mm 云杉面板大面积活塞鼓风，</text>
<text x="44" y="481" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 叠加音孔“吹空瓶”亥姆霍兹空气腔共振（约 100 Hz），</text>
<text x="44" y="502" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">  不凭空造能量，却把拨弦声辐射效率放大上百倍！</text>
<rect x="386" y="64" width="354" height="464" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="398.0" y="74.0" width="330" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
