<title id="title">吉他拨弦梅森定律与十二平均律品丝几何及小提琴松香粘滑亥姆霍兹折角波与音柱杠杆对比图解</title>
<desc id="desc">左栏按真实2的负k/12次方比例绘制吉他指板品丝与前三阶弦驻波，结合梅森公式与云杉面板加音孔亥姆霍兹腔解释声阻抗匹配；右栏展示小提琴亥姆霍兹抛物线折角波、松香粘滑锯齿波以及音柱与低音梁将横向拉弓转为竖向面板辐射的杠杆机制。</desc>
