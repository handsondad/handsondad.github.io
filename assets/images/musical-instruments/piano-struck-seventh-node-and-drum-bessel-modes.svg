<text x="105.4" y="186" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">↑ 毛毡槌精准敲在 L/7 波节处：</text>
<text x="105.4" y="204" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">把不协和的 7f₁ 胎死腹中！</text>
<rect x="32" y="224" width="330" height="288" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="44" y="246" font-size="11.8" fill="#6d28d9" text-anchor="start" font-weight="700">一架三角钢琴里藏着多少暴力与精巧？</text>
<text x="44" y="270" font-size="11.5" fill="#1e293b" text-anchor="start">① 88 键跨 7 个多八度：27.5 Hz (A0) 至 4186 Hz (C8)，</text>
<text x="44" y="292" font-size="11.5" fill="#1e293b" text-anchor="start">   若光靠加长弦，最低音得 15 米！工程师给低音钢丝</text>
<text x="44" y="314" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">   密缠紫铜丝增重 μ，把整琴塞进 2~2.7 米琴身。</text>
<text x="44" y="340" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">② 20~30 吨恐怖总拉力：约 230 根钢弦足以拉塌木框，</text>
<text x="44" y="362" font-size="11.5" fill="#1e293b" text-anchor="start">   1820 年代引入一体铸铁钢骨，现代钢琴方才定型。</text>
<text x="44" y="388" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">③ 中高音一键敲【同音三弦】：三弦微失谐（&lt;1 音分）</text>
<text x="44" y="410" font-size="11.5" fill="#1e293b" text-anchor="start">   使初段宏亮爆发、尾段反相慢衰，唱出悠长余韵；</text>
<text x="44" y="432" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">   左踏板（Una corda）横移击弦机少敲一弦柔化音色。</text>
<text x="44" y="458" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">④ 拉伸调律（Railsback）：粗钢丝刚度使高次泛音偏高，</text>
<text x="44" y="480" font-size="11.5" fill="#1e293b" text-anchor="start">   调音师把低音略调低、高音略调高 ±30 音分对齐谐波！</text>
