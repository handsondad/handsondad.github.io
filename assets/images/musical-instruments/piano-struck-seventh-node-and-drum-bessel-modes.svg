<text x="688" y="206" font-size="11.5" fill="#64748b" text-anchor="middle">内圈节圆!</text>
<rect x="398" y="224" width="330" height="288" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="410" y="246" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">贝塞尔零点全是无理数，定音鼓怎么“逆天改命”唱准音？</text>
<text x="410" y="270" font-size="11.5" fill="#1e293b" text-anchor="start">• 军鼓/大鼓（无确定音高）：敲击鼓心，专激起圆对称模</text>
<text x="410" y="292" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">  (0,1) : (0,2) : (0,3) = 1 : 2.30 : 3.60（乱序非整数倍！），</text>
<text x="410" y="314" font-size="11.5" fill="#1e293b" text-anchor="start">  叠加底皮金属响弦拍击，产生短促爆裂的节奏冲击感。</text>
<line x1="410.0" y1="328.0" x2="716.0" y2="328.0" stroke="#0f766e" stroke-width="1.0"/>
<text x="410" y="348" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 交响定音鼓三招驯服无理数（Benade 实测）：</text>
<text x="410" y="370" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">  ① 专敲距鼓边 1/4 半径处 → 避开沉闷 (0,1)，重点激发</text>
<text x="410" y="392" font-size="11.5" fill="#1e293b" text-anchor="start">     (1,1)、(2,1)、(3,1) 扇形模（裸膜比 1 : 1.34 : 1.67）；</text>
<text x="410" y="416" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">  ② 密封铜锅内空气质量负载给低阶模强力“挂铅减速”，</text>
<text x="410" y="438" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">     精准把频率比掰成 1.00 : 1.504 : 2.00（纯五度+八度！）</text>
<text x="410" y="462" font-size="11.5" fill="#1e293b" text-anchor="start">  ③ 踩动脚踏板实时拉紧鼓皮张力 T，定音鼓手就能在</text>
<text x="410" y="484" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">     乐队里像低音提琴一样准确奏出 C-G-C 定音旋律！</text>
</svg>
