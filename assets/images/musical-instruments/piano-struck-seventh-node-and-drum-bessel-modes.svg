<svg xmlns="http://www.w3.org/2000/svg" width="760" height="544" viewBox="0 0 760 544" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">三角钢琴毛毡槌1/7弦长击弦点消除第七泛音机制与圆鼓皮二维贝塞尔模态及定音鼓铜锅空气调谐图解</title>
<desc id="desc">左栏绘制钢琴弦第7阶泛音驻波及毛毡槌敲在1/7波节处抑制不协和7次泛音的原理，并总结88键缠铜增重、20至30吨铸铁架、同音三弦与拉伸调律；右栏展示圆鼓皮(0,1)、(1,1)、(2,1)、(0,2)四种贝塞尔模态及1:1.593:2.136非整数频率比，对比军鼓无音高重击与定音鼓铜锅空气负载驯服出1:1.5:2纯正音高。</desc>
