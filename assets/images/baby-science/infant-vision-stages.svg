<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">0至12个月婴儿视锐度、对比度、色彩与立体深度知觉四阶段演进图</title>
<desc id="desc">上方四张卡片按20/400、20/200、20/120、20/60视锐度比例展示新生儿至1岁视觉清晰度、黑白条纹敏感度、彩色与立体景深开启过程；下方给出相对成人20/20分辨率比例轴与AOA眼科就医信号。</desc>
