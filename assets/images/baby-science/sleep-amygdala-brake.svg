<text x="487.2" y="127" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700" class="halo">暂停+情绪命名</text>
<text x="714" y="145" font-size="9.8" fill="#c25014" text-anchor="end" font-weight="600" class="halo">失控互激（正反馈）</text>
<text x="586" y="186" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">宝宝随大人平复</text>
<text x="492" y="216" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700" class="halo">大人呼吸先稳</text>
<text x="714" y="244" font-size="9.6" fill="#18794e" text-anchor="end" class="halo">平稳安全基线</text>
<rect x="402" y="264" width="324" height="120" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="414" y="284" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么不能指望婴儿“自己冷静反省”？</text>
<text x="414" y="304" font-size="10.3" fill="#1e293b" text-anchor="start">1. 婴幼儿前额叶—边缘髓鞘化远未成熟，没有独立刹车片；</text>
<text x="414" y="322" font-size="10.3" fill="#1e293b" text-anchor="start">2. 必须借用照护者平稳的心跳、怀抱与慢语速完成“共同调节”；</text>
<text x="414" y="340" font-size="10.3" fill="#1e293b" text-anchor="start">3. 氧气面罩原则：快失控时先把宝宝放安全婴儿床，大人先降</text>
<text x="414" y="358" font-size="10.3" fill="#18794e" text-anchor="start" font-weight="700">   温（Lieberman 2007 情绪命名法），绝不带怒气摇晃婴儿！</text>
</svg>
