<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">睡眠剥夺导致杏仁核反应飙升60%及亲子神经共同调节机制图</title>
<desc id="desc">左图根据Yoo等2007年Current Biology研究展示睡眠剥夺使内侧前额叶刹车断联、杏仁核对负性刺激反应增强60%；右图通过唤醒曲线对比失控正反馈与大人先降温再带动宝宝平复的共同调节过程。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .trace-line {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: drawLine 1.4s ease-out 1 both;
      }
      @keyframes drawLine {
        from { stroke-dashoffset: 1; }
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .trace-line { animation: none; }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="411" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">缺觉不是脾气差：睡眠剥夺下的“杏仁核飙升 + 刹车断联”与共同调节</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图据 Yoo, Walker 等（2007, Current Biology）fMRI 数据绘制；右图展示神经共同调节机制。</text>
<rect x="20" y="64" width="352" height="332" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 缺觉大脑发生了什么？（Yoo 等 2007）</text>
<rect x="34" y="102" width="156" height="118" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="112" y="120" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="700">睡眠充足组（n=12）</text>
<rect x="48" y="130" width="128" height="28" rx="6" fill="#ffffff" stroke="#18794e" stroke-width="1.3"/>
<text x="112" y="148" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">mPFC 内侧前额叶</text>
<line x1="112.0" y1="158.0" x2="112.0" y2="178.0" stroke="#18794e" stroke-width="2.6" marker-end="url(#arr-green)"/>
<text x="120" y="172" font-size="9.6" fill="#18794e" text-anchor="start" font-weight="700">强抑制连接</text>
<rect x="54" y="182" width="116" height="28" rx="14" fill="#ffffff" stroke="#475569" stroke-width="1"/>
<text x="112" y="200" font-size="10.0" fill="#1e293b" text-anchor="middle" font-weight="600">杏仁核：受控 1.0×</text>
<rect x="202" y="102" width="156" height="118" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="280" y="120" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">睡眠剥夺组（n=14）</text>
<rect x="216" y="130" width="128" height="28" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="4 2"/>
<text x="280" y="148" font-size="10.2" fill="#64748b" text-anchor="middle" font-weight="600">mPFC 刹车断联</text>
<line x1="280.0" y1="158.0" x2="280.0" y2="178.0" stroke="#c25014" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="280" y="173" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700">✕</text>
<rect x="214" y="182" width="132" height="28" rx="14" fill="#fee2e2" stroke="#c25014" stroke-width="1.6"/>
<text x="280" y="200" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">杏仁核飙升 +60%！</text>
<rect x="34" y="232" width="324" height="152" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="252" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">面对负性刺激时杏仁核 fMRI 反应对比：</text>
<text x="46" y="278" font-size="10.4" fill="#475569" text-anchor="start" font-weight="600">充足睡眠基准</text>
<rect x="134" y="266" width="105.0" height="16" rx="4" fill="#e7f6ee" stroke="#18794e"/>
<text x="245.0" y="278" font-size="10.4" fill="#18794e" text-anchor="start" font-weight="700" class="mono">100% (1.0×)</text>
<text x="46" y="304" font-size="10.4" fill="#c25014" text-anchor="start" font-weight="700">缺觉过载状态</text>
<rect x="134" y="292" width="168.0" height="16" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<text x="308.0" y="304" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700" class="mono">+60%</text>
<text x="46" y="330" font-size="10.2" fill="#1e293b" text-anchor="start">• 激活体积同步扩大 +35%；叠加婴儿啼哭（300–3000 Hz</text>
<text x="46" y="347" font-size="10.2" fill="#1e293b" text-anchor="start">  粗糙声学调制，100–200 ms 唤醒脑岛与杏仁核），</text>
<text x="46" y="364" font-size="10.3" fill="#c25014" text-anchor="start" font-weight="700">  深夜“一秒冒火”是神经电路过载，不是你不爱孩子！</text>
<rect x="388" y="64" width="352" height="332" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 共同调节：大人是宝宝的“外接前额叶”</text>
<rect x="430" y="112" width="290" height="140" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="404" y="186.0" font-size="10.2" fill="#64748b" text-anchor="start">唤醒</text>
