<circle cx="98.2" cy="138.6" r="4" fill="#18794e" stroke="#ffffff" stroke-width="1.3"/>
<circle cx="149.2" cy="147.3" r="4" fill="#18794e" stroke="#ffffff" stroke-width="1.3"/>
<circle cx="197.3" cy="164.7" r="4" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.3"/>
<circle cx="245.5" cy="192.9" r="4" fill="#c25014" stroke="#ffffff" stroke-width="1.3"/>
<circle cx="341.8" cy="247.8" r="4" fill="#c25014" stroke="#ffffff" stroke-width="1.3"/>
<text x="123.7" y="216" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">低频穿透窗</text>
<text x="123.7" y="232" font-size="10.2" fill="#18794e" text-anchor="middle" class="halo">嗓音基频/语调</text>
<text x="123.7" y="247" font-size="10.0" fill="#1e293b" text-anchor="middle" class="halo">仅衰减 3–5 dB</text>
<text x="293.7" y="142" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">高频大幅闷住</text>
<text x="293.7" y="157" font-size="10.2" fill="#c25014" text-anchor="middle" class="halo">清辅音 s / t / f</text>
<text x="293.7" y="172" font-size="10.0" fill="#1e293b" text-anchor="middle" class="halo">衰减 15–30 dB</text>
<text x="210.0" y="313" font-size="10.8" fill="#475569" text-anchor="middle">声音频率（对数刻度）</text>
<rect x="34" y="320" width="324" height="62" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="46" y="340" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">妈妈胸腔骨传导 + 低频透射 = 听清“旋律节拍”</text>
<text x="46" y="358" font-size="10.5" fill="#1e293b" text-anchor="start">• 胎儿记住的是语调起伏，不是背单词或变音乐神童</text>
<text x="46" y="374" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="600">• 切勿把耳机/喇叭紧贴肚皮开大音量，自然聊天最安全</text>
<rect x="388" y="64" width="352" height="332" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 刚出生不会说话，科学家怎么测“产前记忆”？</text>
<rect x="402" y="102" width="324" height="136" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="412.0" y="112.0" width="116" height="20" rx="10.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="470.0" y="125.6" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">实验 A · 听觉韵律</text>
<text x="536" y="126" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">DeCasper 压力传感奶嘴实验</text>
<text x="412" y="148" font-size="10.5" fill="#1e293b" text-anchor="start">装置：无营养安抚奶嘴连气压传感器，出生 &lt;72 小时新生儿</text>
<text x="412" y="164" font-size="10.5" fill="#1e293b" text-anchor="start">可通过改变“吸吮停顿节律”自主切换耳机里的两段录音：</text>
<rect x="412" y="174" width="304" height="54" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="420" y="192" font-size="10.4" fill="#1d6fa5" text-anchor="start" font-weight="700">1980 Science：</text>
<text x="502" y="192" font-size="10.2" fill="#1e293b" text-anchor="start">妈妈声音 vs 陌生女性 → 主动吸吮选妈妈</text>
<text x="420" y="212" font-size="10.4" fill="#6d28d9" text-anchor="start" font-weight="700">1986 童谣实验：</text>
<text x="502" y="212" font-size="10.2" fill="#1e293b" text-anchor="start">孕末6周读童谣，换陌生人朗读仍偏爱！</text>
<rect x="402" y="250" width="324" height="132" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<rect x="412.0" y="260.0" width="110" height="20" rx="10.0" fill="#ffffff" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="467.0" y="273.6" font-size="10.6" fill="#c25014" text-anchor="middle" font-weight="600">实验 B · 羊水风味</text>
<text x="530" y="274" font-size="11.3" fill="#0f172a" text-anchor="start" font-weight="700">Mennella 胡萝卜汁实验 (2001)</text>
<text x="412" y="295" font-size="10.3" fill="#1e293b" text-anchor="start">孕晚期连喝 3 周胡萝卜汁 → 风味进入羊水被胎儿吞咽，</text>
<text x="412" y="311" font-size="10.3" fill="#1e293b" text-anchor="start">提前尝到“妈妈餐桌的味道”（对照白水组未接触）。</text>
<rect x="412" y="321" width="304" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="422" y="339" font-size="10.4" fill="#475569" text-anchor="start" font-weight="600">初添胡萝卜米糊皱眉抗拒：</text>
<text x="422" y="359" font-size="10.2" fill="#64748b" text-anchor="start">孕期白水组</text>
<rect x="484" y="349" width="78" height="11" rx="3" fill="#475569" opacity="0.55"/>
<text x="574" y="359" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700">孕期胡萝卜组</text>
<rect x="644" y="349" width="46" height="11" rx="3" fill="#18794e"/>
<text x="694" y="359" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700">更少!</text>
</svg>
