<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">细菌二分裂繁殖与病毒劫持宿主一步生长曲线动态对比图</title>
<desc id="desc">左侧对比大肠杆菌20分钟二分裂与T4噬菌体吸附注射、隐蔽期赶工、组装裂解三阶段；右侧对数坐标曲线展示细菌平稳2^n增长、无细胞肉汤中病毒零增长，以及活细胞内病毒隐蔽归零后百倍爆发。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes bvScan {
    0% { transform: translateX(0px); opacity: 0.95; }
    100% { transform: translateX(188px); opacity: 0.95; }
  }
  @keyframes bvPinch {
    0%, 35% { opacity: 0.35; }
    55%, 100% { opacity: 1; }
  }
  @keyframes bvBurst {
    0%, 72% { transform: scale(0.86); opacity: 0.35; }
    88%, 100% { transform: scale(1); opacity: 1; }
  }
  @keyframes bvDraw {
    0% { stroke-dashoffset: 280; }
    100% { stroke-dashoffset: 0; }
  }
  .bv-cursor {
    animation: bvScan 6.2s ease-in-out 1 forwards;
  }
  .bv-daughter {
    animation: bvPinch 6.2s ease-out 1 forwards;
  }
  .bv-burst-pack {
    transform-box: fill-box;
    transform-origin: center;
    animation: bvBurst 6.2s ease-out 1 forwards;
  }
  .bv-curve {
    stroke-dasharray: 280;
    stroke-dashoffset: 0;
    animation: bvDraw 6.2s ease-out 1 forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .bv-cursor, .bv-daughter, .bv-burst-pack, .bv-curve {
      animation: none !important;
      opacity: 1 !important;
      stroke-dashoffset: 0 !important;
      transform: none !important;
    }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">繁殖方式天壤之别：稳扎稳打的“二分裂分家” vs 先隐身再百倍爆裂的“木马劫持”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左侧对比两者 30 分钟内的命运操作；右侧半对数增长曲线展示细菌指数翻倍（2ⁿ）与病毒一步生长跃迁</text>
