<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">细菌细胞结构与病毒非细胞结构对比及酒精消毒差异图解</title>
<desc id="desc">左图拆解细菌的环状双链DNA、质粒、70S核糖体、细胞膜ATP合成与肽聚糖细胞壁；右图对比有包膜病毒、无包膜裸病毒与噬菌体，底部解释75%酒精为何对无包膜诺如病毒无效。</desc>
