<text x="92" y="114" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="600">肽聚糖细胞壁（抗渗透压盔甲）</text>
<line x1="146" y1="117" x2="146" y2="122" stroke="#18794e" stroke-width="1.2"/>
<text x="314" y="152" font-size="11.2" fill="#18794e" text-anchor="middle" font-weight="600">旋转鞭毛马达</text>
<text x="34" y="256" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">① 遗传主机：</text>
<text x="108" y="256" font-size="11.2" fill="#1e293b" text-anchor="start">环状双链 DNA 拟核 + 可插拔质粒（常携耐药基因）</text>
<text x="34" y="280" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">② 蛋白打印：</text>
<text x="108" y="280" font-size="11.2" fill="#1e293b" text-anchor="start">自带数万台 70S 核糖体（30S+50S），独立造酶</text>
<text x="34" y="304" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">③ 能源电网：</text>
<text x="108" y="304" font-size="11.2" fill="#1e293b" text-anchor="start">细胞膜质子泵自己合成 ATP，喝糖水就能活</text>
<text x="34" y="328" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">④ 生态真相：</text>
<text x="108" y="328" font-size="11.2" fill="#1e293b" text-anchor="start">人体约 38 万亿细菌（≈1:1），99%以上无害或有益！</text>
<rect x="386" y="64" width="354" height="294" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="74.0" width="304" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="552.0" y="89.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">病毒（非细胞寄生体）：核酸图纸 + 蛋白快递盒</text>
