<text x="592" y="229" font-size="11.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">无包膜裸病毒（诺如）</text>
<text x="592" y="124" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">纯蛋白二十面体壳</text>
<polygon points="692,126 708,136 708,154 692,164 676,154 676,136" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
