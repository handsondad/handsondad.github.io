<text x="466" y="229" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="700">有包膜病毒（流感/新冠）</text>
<text x="466" y="112" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="600">脂质包膜+刺突</text>
<polygon points="622.0,168.0 607.0,194.0 577.0,194.0 562.0,168.0 577.0,142.0 607.0,142.0" fill="#e0f2fe" stroke="#1d6fa5" stroke-width="2.4"/>
