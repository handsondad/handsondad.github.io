<path d="M692,190 L683,198 L674,210" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
<path d="M692,190 L687,198 L682,210" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
<path d="M692,190 L697,198 L702,210" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
<path d="M692,190 L701,198 L710,210" fill="none" stroke="#6d28d9" stroke-width="1.5"/>
<text x="692" y="229" font-size="11.2" fill="#6d28d9" text-anchor="middle" font-weight="700">噬菌体</text>
<text x="398" y="262" font-size="11.2" fill="#6d28d9" text-anchor="start" font-weight="700">① 极简家当：</text>
<text x="468" y="262" font-size="10.8" fill="#1e293b" text-anchor="start">DNA 或 RNA 二选一，仅数个至数百基因</text>
<text x="398" y="290" font-size="11.2" fill="#b91c1c" text-anchor="start" font-weight="700">② 三无人员：</text>
<text x="468" y="290" font-size="10.8" fill="#1e293b" text-anchor="start">0 细胞壁、0 核糖体、0 产 ATP，离体如结晶</text>
<text x="398" y="318" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">③ 专一开锁：</text>
<text x="468" y="318" font-size="10.8" fill="#1e293b" text-anchor="start">靠刺突/尾丝配对受体（连细菌也遭噬菌体感染）</text>
<rect x="20" y="370" width="720" height="132" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="380.0" width="516" height="22" rx="11.0" fill="#f1f5f9" stroke="#0f172a" stroke-width="1" stroke-opacity="0.35"/>
<text x="292.0" y="395.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">日常洗手实战推论：为什么 75% 酒精秒杀流感和新冠，遇到“诺如病毒”却失灵？</text>
<rect x="34" y="412" width="336" height="78" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="48" y="434" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">有包膜病毒（流感 / 新冠 / 疱疹）：怕酒精 &amp; 肥皂</text>
<text x="48" y="455" font-size="11.2" fill="#1e293b" text-anchor="start">外层是偷来的脆弱磷脂双分子油膜——75% 医用酒精或肥皂</text>
<text x="48" y="474" font-size="11.2" fill="#1e293b" text-anchor="start">一碰就把脂质包膜溶解拆散，刺突钥匙脱落，瞬间丧失感染力！</text>
<rect x="386" y="412" width="340" height="78" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="400" y="434" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">无包膜裸病毒（诺如 / 手足口 / 鼻病毒）：不怕酒精！</text>
<text x="400" y="455" font-size="11.2" fill="#1e293b" text-anchor="start">浑身没有半点油脂包膜，致密蛋白硬壳让免洗酒精凝露无从下嘴；</text>
<text x="400" y="474" font-size="11.2" fill="#1e293b" text-anchor="start">CDC 指南：必须用肥皂+流动水搓洗 ≥20 秒冲走，物表用含氯消毒液！</text>
</svg>
