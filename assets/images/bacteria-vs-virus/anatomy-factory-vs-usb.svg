<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">解剖台正面交锋：五脏俱全的“自给自足微缩工厂” vs 极简“劫持型代码胶囊”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左侧细菌拥有双链DNA、70S核糖体与ATP发电膜；右侧病毒仅含核酸+蛋白壳（部分披脂质包膜），决定了消毒弱点</text>
<rect x="20" y="64" width="354" height="294" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="274" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="171.0" y="89.0" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">细菌（原核活细胞）：全套生产线齐全</text>
