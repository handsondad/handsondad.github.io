<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">细菌与病毒六维全景对比表及日常就医三大误区指南</title>
<desc id="desc">汇总细菌与病毒在尺寸、结构、独立繁殖、生态角色、疾病谱与药物靶点上的六大核心差异，并澄清抗生素不等于退烧消炎药、黄鼻涕不等于细菌感染及门诊PCR培养与PCT检验逻辑。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一张图收进收藏夹：细菌 vs 病毒六维终极对照与门诊避坑指南</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上方六维硬核速查表（附“裸奔细菌”支原体特例）；下方拆穿“消炎药=头孢”与“黄鼻涕=细菌”两大高频误区</text>
<rect x="20" y="64" width="720" height="294" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="28" y="72" width="704" height="34" rx="7" fill="#0f172a"/>
<text x="98" y="94" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">对比维度</text>
<text x="296" y="94" font-size="12" fill="#86efac" text-anchor="middle" font-weight="700">细菌（Bacteria · 原核活细胞）</text>
<text x="578" y="94" font-size="12" fill="#d8b4fe" text-anchor="middle" font-weight="700">病毒（Viruses · 非细胞寄生颗粒）</text>
<rect x="28" y="110" width="704" height="38" rx="5" fill="#f8fafc"/>
<line x1="168" y1="114" x2="168" y2="144" stroke="#e2e8f0" stroke-width="1"/>
<line x1="432" y1="114" x2="432" y2="144" stroke="#e2e8f0" stroke-width="1"/>
<text x="98" y="134" font-size="11.6" fill="#0f172a" text-anchor="middle" font-weight="700">典型尺寸</text>
<text x="178" y="134" font-size="11.1" fill="#1e293b" text-anchor="start">约 0.5–5 μm（普通光学显微镜可见）</text>
<text x="442" y="134" font-size="11.1" fill="#1e293b" text-anchor="start">约 20–300 nm（小 10–100 倍，需电镜）</text>
<rect x="28" y="150" width="704" height="38" rx="5" fill="#ffffff"/>
<line x1="168" y1="154" x2="168" y2="184" stroke="#e2e8f0" stroke-width="1"/>
<line x1="432" y1="154" x2="432" y2="184" stroke="#e2e8f0" stroke-width="1"/>
<text x="98" y="174" font-size="11.6" fill="#0f172a" text-anchor="middle" font-weight="700">核心装备</text>
<text x="178" y="174" font-size="11.1" fill="#1e293b" text-anchor="start">双链DNA + 70S核糖体 + 产能膜 + 肽聚糖壁</text>
<text x="442" y="174" font-size="11.1" fill="#1e293b" text-anchor="start">DNA 或 RNA 二选一 + 蛋白衣壳（±脂包膜）</text>
<rect x="28" y="190" width="704" height="38" rx="5" fill="#f8fafc"/>
<line x1="168" y1="194" x2="168" y2="224" stroke="#e2e8f0" stroke-width="1"/>
<line x1="432" y1="194" x2="432" y2="224" stroke="#e2e8f0" stroke-width="1"/>
<text x="98" y="214" font-size="11.6" fill="#0f172a" text-anchor="middle" font-weight="700">独立生存</text>
<text x="178" y="214" font-size="11.1" fill="#1e293b" text-anchor="start">能！在营养琼脂/肉汤中每 20min–数小时二分裂</text>
<text x="442" y="214" font-size="11.1" fill="#1e293b" text-anchor="start">不能！离体零代谢可结晶，必钻活细胞劫持爆裂</text>
<rect x="28" y="230" width="704" height="38" rx="5" fill="#ffffff"/>
<line x1="168" y1="234" x2="168" y2="264" stroke="#e2e8f0" stroke-width="1"/>
<line x1="432" y1="234" x2="432" y2="264" stroke="#e2e8f0" stroke-width="1"/>
<text x="98" y="254" font-size="11.6" fill="#0f172a" text-anchor="middle" font-weight="700">人类关系</text>
<text x="178" y="254" font-size="11.1" fill="#1e293b" text-anchor="start">99%以上无害或共生有益（合成维生素/发酵酸奶）</text>
<text x="442" y="254" font-size="11.1" fill="#1e293b" text-anchor="start">已知大多引起宿主病变，但噬菌体可帮人杀耐药菌</text>
<rect x="28" y="270" width="704" height="38" rx="5" fill="#f8fafc"/>
<line x1="168" y1="274" x2="168" y2="304" stroke="#e2e8f0" stroke-width="1"/>
<line x1="432" y1="274" x2="432" y2="304" stroke="#e2e8f0" stroke-width="1"/>
<text x="98" y="294" font-size="11.6" fill="#0f172a" text-anchor="middle" font-weight="700">常见疾病</text>
<text x="178" y="294" font-size="11.1" fill="#1e293b" text-anchor="start">链球菌咽炎、细菌性肺炎、尿路感染、破伤风、结核</text>
<text x="442" y="294" font-size="11.1" fill="#1e293b" text-anchor="start">普通感冒、流感、新冠、诺如腹泻、水痘带状疱疹</text>
<rect x="28" y="310" width="704" height="38" rx="5" fill="#ffffff"/>
<line x1="168" y1="314" x2="168" y2="344" stroke="#e2e8f0" stroke-width="1"/>
<line x1="432" y1="314" x2="432" y2="344" stroke="#e2e8f0" stroke-width="1"/>
<text x="98" y="334" font-size="11.6" fill="#0f172a" text-anchor="middle" font-weight="700">对症武器</text>
<text x="178" y="334" font-size="11.1" fill="#1e293b" text-anchor="start">抗生素有效（头孢破壁；无壁支原体用阿奇）</text>
<text x="442" y="334" font-size="11.1" fill="#1e293b" text-anchor="start">抗生素100%无效！靠疫苗预防 + 48h内靶向抗病毒药</text>
<rect x="20" y="370" width="232" height="132" rx="10" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="34" y="392" font-size="11.8" fill="#c25014" text-anchor="start" font-weight="700">误区①：“头孢是万能消炎药”？</text>
<text x="34" y="414" font-size="10.9" fill="#1e293b" text-anchor="start">• 真正退烧止痛消肿的抗炎药是：</text>
<text x="34" y="432" font-size="10.9" fill="#0f172a" text-anchor="start" font-weight="700">  布洛芬 / 对乙酰氨基酚；</text>
<text x="34" y="452" font-size="10.9" fill="#1e293b" text-anchor="start">• 头孢/阿莫西林只杀细菌，不直接</text>
<text x="34" y="470" font-size="10.9" fill="#1e293b" text-anchor="start">  退烧！叫它“消炎药”最易乱吃</text>
<rect x="264" y="370" width="232" height="132" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="278" y="392" font-size="11.8" fill="#1d6fa5" text-anchor="start" font-weight="700">误区②：“流黄绿浓涕=细菌”？</text>
<text x="278" y="414" font-size="10.9" fill="#1e293b" text-anchor="start">• CDC 明确辟谣：病毒性感冒第</text>
<text x="278" y="432" font-size="10.9" fill="#1e293b" text-anchor="start">  3–5 天中性粒细胞赶来打扫战场，</text>
<text x="278" y="452" font-size="10.9" fill="#1e293b" text-anchor="start">  释放含铁髓过氧化物酶就会染成</text>
<text x="278" y="470" font-size="10.9" fill="#0f172a" text-anchor="start" font-weight="700">  黄绿色！单看鼻涕颜色抓不准凶手</text>
<rect x="508" y="370" width="232" height="132" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="522" y="392" font-size="11.8" fill="#18794e" text-anchor="start" font-weight="700">医院靠什么证据锁定真凶？</text>
<text x="522" y="414" font-size="10.9" fill="#0f172a" text-anchor="start" font-weight="600">• 直接抓现行：咽拭子抗原 / PCR</text>
<text x="522" y="432" font-size="10.9" fill="#1e293b" text-anchor="start">  核酸快检、24–48h 细菌培养药敏</text>
<text x="522" y="452" font-size="10.9" fill="#1e293b" text-anchor="start">• 血液旁证：血常规白细胞分类 +</text>
<text x="522" y="470" font-size="10.9" fill="#1e293b" text-anchor="start">  CRP + 降钙素原（PCT）综合判断</text>
</svg>
