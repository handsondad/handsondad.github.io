<circle cx="145.1" cy="309.8" r="4.8" fill="#1d6fa5" stroke="#fff" stroke-width="1.4"/>
<line x1="145.1" y1="304.8" x2="145.1" y2="285.8" stroke="#1d6fa5" stroke-width="1.1" stroke-dasharray="2 2"/>
<text x="133.1" y="281.8" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">冬日 -5°C：仅 3.4 g/m³</text>
<circle cx="315.6" cy="182.2" r="4.8" fill="#dc2626" stroke="#fff" stroke-width="1.4"/>
<text x="305.6" y="188.2" font-size="11.0" fill="#dc2626" text-anchor="end" font-weight="700">夏日 +30°C：30.4 g/m³</text>
<rect x="34" y="370" width="324" height="96" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="46" y="392" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">• 潜热燃料断供：水汽凝结释放潜热才是雷暴上升的汽油！</text>
<text x="46" y="416" font-size="11.0" fill="#1e293b" text-anchor="start">• 气温每降 1°C，饱和水汽缩水约 7%；-5°C 冬空气含水</text>
<text x="46" y="438" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700">  还不到 30°C 夏空气的 1/9，云层根本烧不起冲天火炉。</text>
<rect x="388" y="68" width="352" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="80.0" width="292" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="546.0" y="95.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">B. 云内非感应起电相图（上升速度 × 过冷水）</text>
<rect x="402" y="112" width="324" height="248" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="456" y="252" width="128" height="70" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="520" y="275" font-size="11.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">普通冬雪静默区</text>
<text x="520" y="294" font-size="10.8" fill="#1e293b" text-anchor="middle">w &lt; 0.3 m/s</text>
<text x="520" y="312" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">全冰相 · 零闪电</text>
<rect x="554" y="198" width="150" height="48" rx="6" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="629" y="219" font-size="11.2" fill="#6d28d9" text-anchor="middle" font-weight="700">罕见“雷打雪”窄窗</text>
<text x="629" y="237" font-size="10.5" fill="#1e293b" text-anchor="middle">w ≈ 3~8 m/s（冷流/气旋）</text>
<rect x="568" y="142" width="138" height="50" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="637" y="163" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="700">盛夏强雷暴主区</text>
<text x="637" y="182" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">w ≈ 10~25 m/s 霰晶狂撞</text>
<line x1="452.0" y1="136.0" x2="452.0" y2="326.0" stroke="#0f172a" stroke-width="1.2"/>
<line x1="452.0" y1="326.0" x2="710.0" y2="326.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="412" y="126" font-size="10.8" fill="#64748b" text-anchor="start">过冷水含量 LWC (g/m³)</text>
<text x="581.0" y="346" font-size="10.8" fill="#1e293b" text-anchor="middle">上升气流速度 w（对数尺度：0.05 → 25 m/s）</text>
<text x="444" y="330" font-size="10.5" fill="#64748b" text-anchor="end">0</text>
<text x="444" y="256" font-size="10.5" fill="#64748b" text-anchor="end">0.2</text>
<text x="444" y="184" font-size="10.5" fill="#64748b" text-anchor="end">1.0+</text>
<rect x="402" y="370" width="324" height="96" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.1"/>
<text x="414" y="392" font-size="11.0" fill="#6d28d9" text-anchor="start" font-weight="700">• 高桥劭（Takahashi 1978）冰晶—霰粒碰撞实验证明：</text>
<text x="414" y="416" font-size="11.0" fill="#1e293b" text-anchor="start">• 没有足够上升流速 w 持续补给过冷水滴，冰晶就不会结霜</text>
<text x="414" y="438" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">  长成重霰粒；雪花撞雪花材质对称，净转移电荷 ≈ 0！</text>
</svg>
