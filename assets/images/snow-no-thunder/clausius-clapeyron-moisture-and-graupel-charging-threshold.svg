    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">冬季断电的两道硬数学门槛：水汽暴跌近 90% 与“流速 × 过冷水”起电禁区</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">温度每降 10°C 空气锁水能力腰斩；进不了右上角混合碰撞窗口，云层就是绝缘雪花车间</text>
