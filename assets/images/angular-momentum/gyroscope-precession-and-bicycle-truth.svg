<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">陀螺进动三维矢量正交原理与2011年Science无陀螺自稳定自行车实验解析图</title>
<desc id="desc">上图展示高速旋转陀螺受水平重力力矩τ作用时ΔL垂直于L从而绕竖直轴水平进动（Ω_P=rMg/Iω）；下图区分普通自行车前轮进动辅助向倾倒侧转向的机制与2011年康奈尔团队对转轮零角动量自行车仍能自稳定的反例。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="533" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">歪斜的陀螺为什么“宁可横着兜圈也绝不倒地”？兼破自行车百年迷思</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">核心密码只有一句话：角动量的改变量 ΔL 永远顺着力矩 τ 的方向走，而不是顺着力 F 的方向倒！</text>
<rect x="24" y="66" width="712" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="44" cy="90" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="44" y="94" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="95" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="700">陀螺进动（Precession）：重力明明往下拽，为什么转轴反而往侧面水平画圈？</text>
<rect x="40" y="108" width="404" height="174" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<line x1="186" y1="256" x2="186" y2="122" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 3"/>
<ellipse cx="186" cy="146" rx="74" ry="18" fill="none" stroke="#18794e" stroke-width="1.6" stroke-dasharray="5 3"/>
<line x1="186" y1="256" x2="258" y2="134" stroke="#1d6fa5" stroke-width="2.8" marker-end="url(#arr-blue)"/>
<g transform="translate(216,204) rotate(30)"><ellipse cx="0" cy="0" rx="34" ry="11" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2"/></g>
<line x1="216" y1="204" x2="216" y2="254" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="224" y="248" font-size="10.2" fill="#c25014" text-anchor="start" font-weight="700">重力 Mg</text>
<line x1="254" y1="140" x2="214" y2="128" stroke="#18794e" stroke-width="2.4" marker-end="url(#arr-green)"/>
<text x="268" y="160" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">自转角动量 L</text>
<text x="196" y="124" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">ΔL = τΔt 垂直于 L → 推着轴尖水平绕圈！</text>
<text x="102" y="182" font-size="10.2" fill="#64748b" text-anchor="middle">若不转(L=0)</text>
<text x="102" y="198" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">直接砸倒！</text>
<rect x="458" y="108" width="262" height="174" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="474" y="132" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">进动快慢公式：Ω_P = r M g / (I ω)</text>
<text x="474" y="156" font-size="10.6" fill="#1e293b" text-anchor="start">• 重力力矩 τ = r × Mg 始终处于水平面，</text>
<text x="474" y="176" font-size="10.6" fill="#1e293b" text-anchor="start">  与倾斜的 L 永远成 90° 正交；</text>
<text x="474" y="198" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">• 反直觉推论：陀螺自转 ω 越快，分母越</text>
<text x="474" y="218" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">  大，水平兜圈进动 Ω_P 反而越慢越稳！</text>
<text x="474" y="242" font-size="10.4" fill="#64748b" text-anchor="start">• 地球本身也是大陀螺：太阳与月球拉扯赤</text>
<text x="474" y="260" font-size="10.4" fill="#64748b" text-anchor="start">  道隆起，使地轴每 2.58 万年进动一圈！</text>
<rect x="24" y="312" width="712" height="204" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="44" cy="336" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="44" y="340" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">2</text>
<text x="62" y="341" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="700">科学辟谣：自行车骑起来不倒，真的“全靠车轮角动量”吗？（2011《Science》实测）</text>
<rect x="40" y="356" width="332" height="144" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="56" y="380" font-size="11.4" fill="#18794e" text-anchor="start" font-weight="700">普通自行车上：陀螺进动确实在“帮忙打把”</text>
<text x="56" y="404" font-size="10.6" fill="#1e293b" text-anchor="start">• 当车身不慎向左倾斜时，重力对前轮施加力矩；</text>
<text x="56" y="424" font-size="10.6" fill="#1e293b" text-anchor="start">• 前轮向前的自转角动量发生进动，恰好自动把车</text>
<text x="56" y="444" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">  把向左拧（“往要倒的一侧转向”）！</text>
<text x="56" y="466" font-size="10.6" fill="#1e293b" text-anchor="start">• 车轮随之滚回人体重心正下方，帮你化险为夷。</text>
<rect x="388" y="356" width="332" height="144" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="404" y="380" font-size="11.4" fill="#c25014" text-anchor="start" font-weight="700">2011 康奈尔/代尔夫特反例车：L = 0 照样不倒！</text>
<text x="404" y="404" font-size="10.6" fill="#1e293b" text-anchor="start">• 鲁伊纳团队给前后轮各配一个反向对转副轮，把</text>
<text x="404" y="424" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">  车轮净角动量 100% 归零（且取消脚轮正拖距）！</text>
<text x="404" y="446" font-size="10.6" fill="#1e293b" text-anchor="start">• 无人小车推出去后依然能自动扶正稳行！证明：</text>
<text x="404" y="466" font-size="10.6" fill="#1e293b" text-anchor="start">  前叉重心分布引起的“向倾倒侧自动转向”同样关键，</text>
<text x="404" y="485" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">  角动量是得力助手，但绝非唯一救命恩人！</text>
</svg>
