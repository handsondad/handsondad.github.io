<svg xmlns="http://www.w3.org/2000/svg" width="760" height="492" viewBox="0 0 760 492" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">质点与刚体角动量定义、右手螺旋定则与转动惯量分布对比图</title>
<desc id="desc">左栏展示沿直线运动的物体只要垂直力臂r⊥不为零就具有恒定角动量L=r⊥mv；右栏展示刚体旋转L=Iω的右手螺旋定则方向，并对比同质量同半径下薄圆环、实心盘与实心球的转动惯量差异。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="491" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">什么是角动量？连走直线的飞球都有角动量，而且方向居然“竖着指天”！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">角动量衡量“转动有多难刹住”：单质点看垂直力臂 L = r⊥mv，刚体看转动惯量 L = Iω</text>
<rect x="24" y="66" width="356" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="92" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">一、反直觉真相：走直线照样有角动量！</text>
<rect x="40" y="108" width="324" height="198" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<line x1="56" y1="148" x2="348" y2="148" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="5 4"/>
<circle cx="112" cy="258" r="5.5" fill="#0f172a"/>
<text x="112" y="278" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">参考支点 O</text>
<line x1="112" y1="258" x2="112" y2="148" stroke="#18794e" stroke-width="1.8" stroke-dasharray="4 3"/>
<rect x="112" y="148" width="9" height="9" fill="none" stroke="#18794e" stroke-width="1.2"/>
<text x="102" y="206" font-size="10.6" fill="#18794e" text-anchor="end" font-weight="700">垂直力臂 r⊥</text>
<line x1="112" y1="258" x2="168" y2="148" stroke="#475569" stroke-width="1.3"/>
<circle cx="168" cy="148" r="7" fill="#fef1e8" stroke="#c25014" stroke-width="1.8"/>
<line x1="176" y1="148" x2="216" y2="148" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="168" y="132" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">时刻 t₁</text>
<line x1="112" y1="258" x2="274" y2="148" stroke="#475569" stroke-width="1.3"/>
<circle cx="274" cy="148" r="7" fill="#fef1e8" stroke="#c25014" stroke-width="1.8"/>
<line x1="282" y1="148" x2="322" y2="148" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="274" y="132" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">时刻 t₂</text>
<text x="322" y="134" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">动量 p=mv</text>
<text x="228" y="224" font-size="10.4" fill="#475569" text-anchor="middle" class="halo">矢径 r 变长，但夹角 θ 变小</text>
<text x="228" y="242" font-size="10.6" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">乘积 r·sinθ ≡ r⊥ 纹丝不变！</text>
<rect x="40" y="318" width="324" height="142" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="54" y="341" font-size="11.4" fill="#1d6fa5" text-anchor="start" font-weight="700">公式拆解：L = r × p ，大小 L = r⊥ · m · v</text>
<text x="54" y="364" font-size="10.8" fill="#1e293b" text-anchor="start">• 只要直线轨迹不穿过支点 O（r⊥ &gt; 0），飞球相对</text>
<text x="54" y="384" font-size="10.8" fill="#1e293b" text-anchor="start">  于 O 就拥有恒定角动量！</text>
<text x="54" y="406" font-size="10.8" fill="#1e293b" text-anchor="start">• 比如滑冰场上你伸手接住迎面偏侧飞来的冰球，</text>
<text x="54" y="426" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">  原本走直线的冰球会立刻把你撞得原地转起圈来</text>
<text x="54" y="446" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">  ——那就是它自带的角动量交到了你身上！</text>
<rect x="394" y="66" width="342" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="412" y="92" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">二、右手定则与“质量离轴越远越难停”</text>
<rect x="410" y="108" width="310" height="174" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<ellipse cx="512" cy="214" rx="74" ry="26" fill="#f3e8ff" stroke="#6d28d9" stroke-width="2"/>
<line x1="512" y1="248" x2="512" y2="126" stroke="#6d28d9" stroke-width="3" marker-end="url(#arr-muted)"/>
<text x="512" y="120" font-size="10.8" fill="#6d28d9" text-anchor="middle" font-weight="700">角动量矢量 L（竖直向上！）</text>
<path d="M462,222 Q512,244 560,220" fill="none" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="512" y="256" font-size="10.4" fill="#c25014" text-anchor="middle" font-weight="700">逆时针旋转角速度 ω</text>
<text x="650" y="166" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">右手螺旋定则：</text>
<text x="650" y="188" font-size="10.4" fill="#1e293b" text-anchor="middle">四指顺着旋转方向</text>
<text x="650" y="206" font-size="10.4" fill="#1e293b" text-anchor="middle">弯曲，大拇指所指</text>
<text x="650" y="224" font-size="10.4" fill="#6d28d9" text-anchor="middle" font-weight="700">的转轴方向就是 L！</text>
<rect x="410" y="294" width="310" height="166" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="426" y="317" font-size="11.4" fill="#c25014" text-anchor="start" font-weight="700">刚体公式 L = Iω（转动惯量 I = Σ mᵢ rᵢ²）：</text>
<text x="426" y="340" font-size="10.6" fill="#1e293b" text-anchor="start">同样质量 M、同样外半径 R、同样转速 ω 下：</text>
<text x="426" y="362" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="600">薄圆环（车轮外圈）</text>
<rect x="556" y="352" width="96.0" height="12" rx="3" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="658.0" y="362" font-size="10" fill="#1d6fa5" text-anchor="start" font-weight="700">I = M R²</text>
<text x="426" y="390" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="600">均匀实心圆盘</text>
<rect x="556" y="380" width="48.0" height="12" rx="3" fill="#ffffff" stroke="#18794e" stroke-width="1.5"/>
<text x="610.0" y="390" font-size="10" fill="#18794e" text-anchor="start" font-weight="700">I = 0.5 M R²</text>
<text x="426" y="418" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="600">均匀实心圆球</text>
<rect x="556" y="408" width="38.4" height="12" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="600.4" y="418" font-size="10" fill="#475569" text-anchor="start" font-weight="700">I = 0.4 M R²</text>
<text x="426" y="446" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">结论：质量越往外圈甩（r² 放大），角动量越强劲！</text>
</svg>
