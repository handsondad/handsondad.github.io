<text x="168" y="118" font-size="10.2" fill="#b45309" text-anchor="middle" font-weight="700">入射光线（先穿电线，最后才撞感光层！）</text>
<rect x="44" y="276" width="248" height="16" rx="3" fill="#334155"/>
<rect x="326" y="276" width="52" height="16" rx="3" fill="#334155"/>
<text x="168" y="288" font-size="9.8" fill="#f8fafc" text-anchor="middle">脉络膜与色素上皮 RPE（吸收杂散光+回收视黄醛）</text>
