<rect x="0.5" y="0.5" width="759" height="535" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二、“装反了”的视网膜、中央凹超清特区与四条感光光谱曲线</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">组织学实测人眼约含 9,200 万视杆与 460 万视锥（Curcio 1990）：夜视靠人海战术，看字认色全靠针尖大的中央凹</text>
<rect x="20" y="64" width="384" height="456" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="352" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="210.0" y="89.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">A · 倒置视网膜、中央凹让路与鼻侧 15° 盲点</text>
<rect x="34" y="108" width="356" height="206" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<line x1="72" y1="120" x2="72" y2="162" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-orange)"/>
