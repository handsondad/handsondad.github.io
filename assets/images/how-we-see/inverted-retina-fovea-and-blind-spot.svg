<rect x="432" y="354" width="294" height="152" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="444" y="375" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">三条光谱曲线藏着三个日常谜底：</text>
<text x="444" y="396" font-size="10.5" fill="#1e293b" text-anchor="start">① 为什么叫“红锥”其实偏黄绿？L 视锥峰值在 563 nm</text>
<text x="444" y="414" font-size="10.5" fill="#1e293b" text-anchor="start">   (黄绿光)，大脑靠 L 与 M (534 nm) 的差值算红绿！</text>
<text x="444" y="435" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="700">② 红绿色盲由来：M 与 L 基因紧挨在 X 染色体上且</text>
<text x="444" y="453" font-size="10.5" fill="#1e293b" text-anchor="start">   仅差 ~30 nm，重组易缺失（男性约 8% 红绿觉异常）。</text>
<text x="444" y="474" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">③ 浦肯野夜间变色：月夜视锥下班，视杆 (498 nm) 接管，</text>
<text x="444" y="492" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">   长波红玫瑰在视杆眼里瞬间漆黑，蓝绿叶子反而发亮！</text>
</svg>
