<title id="title">脊椎动物倒置视网膜、中央凹让路与生理盲点及四类感光细胞吸收光谱图解</title>
<desc id="desc">左图展示光线穿过内层神经元到达视杆与视锥、0.35毫米中央凹神经层分开以及鼻侧15度视盘产生颞侧视野盲点；右图依据Bowmaker与Dartnall(1980)绘制420、498、534、563纳米四条感光曲线。</desc>
