<text x="92" y="178" font-size="10" fill="#1d6fa5" text-anchor="middle" font-weight="700">神经节/双极层</text>
<text x="176" y="212" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">中央凹 (0.35 mm)</text>
<text x="176" y="226" font-size="9.8" fill="#0f172a" text-anchor="middle" class="halo">神经层向两侧掀开!</text>
<text x="310" y="174" font-size="10.2" fill="#b91c1c" text-anchor="middle" font-weight="700">视盘穿出点</text>
<text x="310" y="304" font-size="10" fill="#1d6fa5" text-anchor="middle" font-weight="700">→ 视神经束</text>
<text x="36" y="336" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">• 为什么“装反”也有道理？感光细胞紧贴底层色素上皮 (RPE)</text>
<text x="36" y="355" font-size="10.6" fill="#1e293b" text-anchor="start">  和脉络膜丰富毛细血管，才能极速供氧并每秒翻新感光盘膜！</text>
<text x="36" y="378" font-size="10.8" fill="#18794e" text-anchor="start" font-weight="700">• 针尖大的中央凹（直径 ~0.35 mm ≈ 视角 1.25°）：无视杆、无血管，</text>
<text x="36" y="397" font-size="10.6" fill="#1e293b" text-anchor="start">  视锥密度飙到 199,000 个/mm²！你此刻能看清这行字全靠它。</text>
<text x="36" y="420" font-size="10.8" fill="#b91c1c" text-anchor="start" font-weight="700">• 生理盲点在哪？视神经在中央凹鼻侧约 15° 穿出眼球（无感光</text>
<text x="36" y="439" font-size="10.6" fill="#1e293b" text-anchor="start">  细胞），经晶状体交叉投射，盲点落在每只眼外侧（颞侧）视野</text>
<text x="36" y="458" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">  约 15° 处！平时察觉不到，是因为双眼互补+大脑自动修图填补。</text>
<text x="36" y="484" font-size="10.6" fill="#475569" text-anchor="start" font-weight="600">• 数量澄清（Curcio 1990 金标准）：人眼平均约 9,200 万视杆</text>
<text x="36" y="502" font-size="10.5" fill="#64748b" text-anchor="start">  + 460 万视锥（约 20 : 1，老教材常引早期估算 1.2 亿与 600 万）。</text>
<rect x="418" y="64" width="322" height="456" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="432.0" y="74.0" width="294" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
