<svg xmlns="http://www.w3.org/2000/svg" width="760" height="498" viewBox="0 0 760 498" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">脊椎动物倒置视网膜与头足类正置视网膜布线对比图</title>
<desc id="desc">脊椎动物视网膜神经纤维位于感光细胞前方，视神经穿出视网膜形成盲点，需要大脑补偿；头足类视网膜感光细胞朝向入射光、神经纤维从后方出线因此没有盲点；两者是趋同演化的经典例子。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="497" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">同样能成像，布线却相反：历史留下的“将就”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">脊椎动物的视网膜是倒置的，头足类的是正置的；两者都能看得很好。</text>
<rect x="20" y="66" width="352" height="350" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="88" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="92" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="92" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">脊椎动物：倒置视网膜</text>
<rect x="388" y="66" width="352" height="350" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="88" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="406" y="92" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="92" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">头足类：正置视网膜</text>
<path d="M 52 150 A 142 120 0 0 0 336 150" fill="none" stroke="#e7b27d" stroke-width="18"/>
<path d="M 52 150 A 142 120 0 0 0 336 150" fill="none" stroke="#c25014" stroke-width="2"/>
<line x1="104.0" y1="116.0" x2="104.0" y2="182.0" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<line x1="150.0" y1="112.0" x2="150.0" y2="194.0" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<line x1="196.0" y1="110.0" x2="196.0" y2="198.0" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<line x1="242.0" y1="112.0" x2="242.0" y2="194.0" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<line x1="288.0" y1="116.0" x2="288.0" y2="182.0" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<text x="194" y="132" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">神经纤维先挡一层</text>
<text x="194" y="166" font-size="10.5" fill="#c25014" text-anchor="middle">感光细胞在后</text>
<path d="M 186 258 L 210 258 L 226 344 L 196 344 Z" fill="#f9d7b5" stroke="#c25014" stroke-width="1.5"/>
<line x1="204.0" y1="270.0" x2="214.0" y2="334.0" stroke="#c25014" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="52" y="292" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="700">视神经穿出视网膜 → 盲点</text>
<text x="52" y="324" font-size="10.5" fill="#475569" text-anchor="start">大脑靠插值“补”出空洞</text>
<text x="52" y="384" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="600">路径依赖：从旧结构改造，不是重新画图</text>
<path d="M 420 150 A 142 120 0 0 0 704 150" fill="none" stroke="#e7b27d" stroke-width="18"/>
<path d="M 420 150 A 142 120 0 0 0 704 150" fill="none" stroke="#c25014" stroke-width="2"/>
<line x1="472.0" y1="112.0" x2="472.0" y2="182.0" stroke="#c25014" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<line x1="518.0" y1="110.0" x2="518.0" y2="194.0" stroke="#c25014" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<line x1="564.0" y1="108.0" x2="564.0" y2="198.0" stroke="#c25014" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<line x1="610.0" y1="110.0" x2="610.0" y2="194.0" stroke="#c25014" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<line x1="656.0" y1="112.0" x2="656.0" y2="182.0" stroke="#c25014" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="562" y="132" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="600">光先到感光细胞</text>
<text x="562" y="166" font-size="10.5" fill="#1d6fa5" text-anchor="middle">神经纤维走后方</text>
<path d="M 554 258 L 578 258 L 594 344 L 564 344 Z" fill="#f9d7b5" stroke="#c25014" stroke-width="1.5"/>
<line x1="572.0" y1="270.0" x2="582.0" y2="334.0" stroke="#c25014" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="420" y="292" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">神经从感光层后方出线 → 无盲点</text>
<text x="420" y="324" font-size="10.5" fill="#475569" text-anchor="start">光路更直接，散射更少</text>
<text x="420" y="384" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="600">独立演化出的“另一种图纸”</text>
<rect x="20" y="432" width="720" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="458" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">两套相机眼是趋同演化的经典例子：零件相似，来源不同；都没有被“推倒重来”。</text>
<text x="40" y="480" font-size="10.5" fill="#1e293b" text-anchor="start">所谓“设计缺陷”恰恰是演化历史的指纹——它修旧房子，不画新图纸。</text>
</svg>
