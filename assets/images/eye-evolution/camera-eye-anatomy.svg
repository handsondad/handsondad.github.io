<text x="554" y="216" font-size="10.5" fill="#1d6fa5" text-anchor="middle">视杆：弱光</text>
<text x="584" y="216" font-size="10.5" fill="#c25014" text-anchor="middle">视锥：颜色</text>
<text x="628" y="216" font-size="10.5" fill="#1d6fa5" text-anchor="middle">视杆</text>
<text x="656" y="216" font-size="10.5" fill="#c25014" text-anchor="middle">视锥</text>
<line x1="522.0" y1="228.0" x2="724.0" y2="228.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="522" y="256" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">视杆细胞</text>
<text x="522" y="278" font-size="10.5" fill="#1e293b" text-anchor="start">灵敏度高，暗处工作；</text>
<text x="522" y="298" font-size="10.5" fill="#1e293b" text-anchor="start">不能分辨颜色。</text>
<text x="522" y="332" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">视锥细胞</text>
<text x="522" y="354" font-size="10.5" fill="#1e293b" text-anchor="start">强光下工作，负责色觉；</text>
<text x="522" y="374" font-size="10.5" fill="#1e293b" text-anchor="start">中央凹处最密集。</text>
<text x="522" y="414" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="700">光子 → 11-顺视黄醛异构化</text>
<text x="522" y="438" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="700">→ 电信号 → 视神经</text>
