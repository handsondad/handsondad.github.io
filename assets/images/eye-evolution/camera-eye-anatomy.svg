<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">把相机眼拆开：光走过的是一条精心安排的路</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">角膜、虹膜、晶状体、玻璃体、视网膜、黄斑与盲点，各管一段。</text>
