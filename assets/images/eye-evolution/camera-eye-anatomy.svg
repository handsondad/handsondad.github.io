<text x="32" y="96" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="600">角膜：先折射</text>
<text x="32" y="124" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="600">虹膜：调光</text>
<text x="32" y="152" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="600">晶状体：聚焦</text>
<text x="32" y="180" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="600">玻璃体：透明填充</text>
<text x="32" y="350" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="600">视网膜：感光</text>
<text x="32" y="378" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="600">中央凹：最清晰</text>
<text x="32" y="406" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="600">盲点：神经出口</text>
<text x="32" y="434" font-size="10.5" fill="#475569" text-anchor="start" font-weight="600">视神经：送脑</text>
<text x="352" y="246" font-size="10.6" fill="#c25014" text-anchor="middle" font-weight="700">倒像</text>
<text x="352" y="266" font-size="10.5" fill="#64748b" text-anchor="middle">由大脑翻正</text>
<rect x="506" y="66" width="234" height="410" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
