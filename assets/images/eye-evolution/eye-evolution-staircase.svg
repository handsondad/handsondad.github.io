<svg xmlns="http://www.w3.org/2000/svg" width="760" height="436" viewBox="0 0 760 436" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">眼睛从眼点到相机眼的五级演化台阶图</title>
<desc id="desc">眼睛演化依次经过眼点辨明暗、色素杯判断方向、针孔眼粗成像、晶状体聚光和相机眼高分辨率五个阶段；每一步都有即时生存优势，杯状眼凹陷动画只播放一次并保留静态终态。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  <style>
  @keyframes cupDeepen { 0% { transform: scaleY(0.3); opacity: 0.35; } 100% { transform: scaleY(1); opacity: 1; } }
  .cup-anim { animation: cupDeepen 2.4s ease-out 1 forwards; transform-origin: 198px 176px; }
  @media (prefers-reduced-motion: reduce) { .cup-anim { animation: none !important; transform: none !important; opacity: 1 !important; } }
</style>
</style>
<rect x="0.5" y="0.5" width="759" height="435" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">眼睛不是一次装好的：五级台阶，每一步都能用</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">从一团感光细胞到相机眼，中间没有“必须同时出现”的零件。</text>
