<text x="88" y="220" font-size="11.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">① 眼点</text>
<text x="88" y="244" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">只辨明暗</text>
<line x1="34.0" y1="258.0" x2="142.0" y2="258.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="234" y="220" font-size="11.6" fill="#c25014" text-anchor="middle" font-weight="700">② 色素杯</text>
<text x="234" y="244" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">判断方向</text>
<line x1="180.0" y1="258.0" x2="288.0" y2="258.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="380" y="220" font-size="11.6" fill="#18794e" text-anchor="middle" font-weight="700">③ 针孔眼</text>
<text x="380" y="244" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">粗成像</text>
<line x1="326.0" y1="258.0" x2="434.0" y2="258.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="526" y="220" font-size="11.6" fill="#6d28d9" text-anchor="middle" font-weight="700">④ 晶状体</text>
<text x="526" y="244" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">聚光更亮</text>
<line x1="472.0" y1="258.0" x2="580.0" y2="258.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="672" y="220" font-size="11.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">⑤ 相机眼</text>
<text x="672" y="244" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">高分辨率</text>
<line x1="618.0" y1="258.0" x2="726.0" y2="258.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="88" y="282" font-size="9.9" fill="#1e293b" text-anchor="middle">感光分子把光子变成电信</text>
<text x="88" y="302" font-size="9.9" fill="#1e293b" text-anchor="middle">号</text>
<text x="234" y="282" font-size="9.9" fill="#1e293b" text-anchor="middle">色素挡住侧向光，能判断</text>
<text x="234" y="302" font-size="9.9" fill="#1e293b" text-anchor="middle">光从哪来</text>
<text x="380" y="282" font-size="9.9" fill="#1e293b" text-anchor="middle">小孔让不同方向的光落到</text>
<text x="380" y="302" font-size="9.9" fill="#1e293b" text-anchor="middle">不同位置</text>
<text x="526" y="282" font-size="9.9" fill="#1e293b" text-anchor="middle">透明蛋白聚光，弱光下也</text>
<text x="526" y="302" font-size="9.9" fill="#1e293b" text-anchor="middle">能看清</text>
<text x="672" y="282" font-size="9.9" fill="#1e293b" text-anchor="middle">虹膜调光、晶状体对焦、</text>
<text x="672" y="302" font-size="9.9" fill="#1e293b" text-anchor="middle">视网膜成像</text>
<rect x="20" y="386" width="720" height="40" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="411" font-size="10.8" fill="#475569" text-anchor="start">每一步都只比上一步“好用一点”：方向感 → 粗空间 → 成像 → 灵敏度 → 高分辨率。动画只播放一次。</text>
</svg>
