<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">正方形对角线与边长不可公度的两种严格证明</title>
<desc id="desc">左图把边长AB=s折到对角线AC=d上得到AE=s与余段EC=d-s，构造出更小的等腰直角三角形DEC（直角边d-s、斜边2s-d），无限自相似折叠对应连分数[1;2,2,2,...]；右图用面积4k²=2q²展示p²=2q²导致p与q同为偶数，与最简分数互质假设矛盾。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="475" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么正方形的对角线与边长“不可公度”？几何无限折叠 vs 奇偶反证法</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">不是尺子刻度不够细，而是根本不存在能把边长 s 与对角线 d 同时量成整数份的共同长度单位 u</text>
<rect x="20" y="66" width="376" height="396" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="89" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">方法一：把边折向对角线（几何辗转相减）</text>
<rect x="296.0" y="73.0" width="86" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="339.0" y="88.0" font-size="11.3" fill="#1d6fa5" text-anchor="middle" font-weight="600">永远折不完</text>
<path d="M 56.00,110.00 L 272.00,110.00 L 272.00,326.00" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5 4"/>
<text x="266.0" y="126.0" font-size="11" fill="#64748b" text-anchor="end">正方形另一半</text>
<path d="M 56.00,110.00 56.00,326.00 272.00,326.00 Z" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2.1" stroke-linejoin="round" fill-opacity="0.35"/>
<path d="M 145.47,326.00 208.74,262.74 272.00,326.00 Z" fill="#fef1e8" stroke="#c25014" stroke-width="2.1" stroke-linejoin="round" fill-opacity="0.72"/>
<path d="M 145.47,326.00 234.94,288.94 272.00,326.00 Z" fill="none" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<path d="M 234.94,288.94 234.94,326.00 272.00,326.00 Z" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.8" stroke-linejoin="round" fill-opacity="0.85"/>
<path d="M 56.00,314.00 L 68.00,314.00 L 68.00,326.00" fill="none" stroke="#1d6fa5" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M 202.02,256.02 L 195.30,262.74 L 202.02,269.45" fill="none" stroke="#c25014" stroke-width="1.3" stroke-linejoin="round"/>
<line x1="56.00" y1="110.00" x2="145.47" y2="326.00" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3"/>
<path d="M 56.00,326.00 A 216.00,216.00 0 0 0 208.74,262.74" fill="none" stroke="#18794e" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
<circle cx="56.00" cy="110.00" r="4.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.8"/>
<circle cx="56.00" cy="326.00" r="4.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.8"/>
<circle cx="272.00" cy="326.00" r="4.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.8"/>
<circle cx="145.47" cy="326.00" r="4.0" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="208.74" cy="262.74" r="4.0" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="234.94" cy="288.94" r="3.2" fill="#6d28d9" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="234.94" cy="326.00" r="3.2" fill="#6d28d9" stroke="#ffffff" stroke-width="1.2"/>
<text x="46.0" y="115.0" font-size="12.5" fill="#0f172a" text-anchor="end" font-weight="700">A</text>
<text x="46.0" y="331.0" font-size="12.5" fill="#0f172a" text-anchor="end" font-weight="700">B</text>
<text x="281.0" y="331.0" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">C</text>
<text x="141.5" y="344.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700">D</text>
<text x="218.7" y="257.7" font-size="12" fill="#c25014" text-anchor="start" font-weight="700" class="halo">E</text>
<text x="238.9" y="344.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">E₂</text>
<text x="44.0" y="222.0" font-size="12.5" fill="#1d6fa5" text-anchor="end" font-weight="700">s</text>
<text x="128.0" y="192.0" font-size="11.8" fill="#18794e" text-anchor="start" font-weight="700" class="halo">AE = s</text>
<text x="252.7" y="296.7" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700" class="halo">余边 EC = d − s</text>
<text x="196.7" y="360.0" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">新斜边 DC = 2s − d</text>
<rect x="34" y="370" width="348" height="80" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="389" font-size="11.3" fill="#0f172a" text-anchor="start" font-weight="700">折叠递推：小等腰直角 ΔDEC 满足 s₁ = d−s，d₁ = 2s−d</text>
<text x="46" y="408" font-size="11.1" fill="#1e293b" text-anchor="start">若有共同单位 u 使 s,d 为整数份，余量将产出无穷递降正整数！</text>
<text x="46" y="427" font-size="11.1" fill="#6d28d9" text-anchor="start" font-weight="600">辗转相减商序列：[1; 2, 2, 2, …] ⇒ √2 = 1 + 1/(2 + 1/(2 + …))</text>
<rect x="408" y="66" width="332" height="396" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="424" y="89" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">方法二：奇偶性反证法（p² = 2q²）</text>
<rect x="642.0" y="73.0" width="86" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="685.0" y="88.0" font-size="11.3" fill="#c25014" text-anchor="middle" font-weight="600">互质却全偶</text>
<rect x="432" y="114" width="76" height="76" rx="3" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2.0"/>
<line x1="470.00" y1="114.00" x2="470.00" y2="190.00" stroke="#1d6fa5" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="432.00" y1="152.00" x2="508.00" y2="152.00" stroke="#1d6fa5" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="451" y="137" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">k²</text>
<text x="489" y="137" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">k²</text>
<text x="451" y="175" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">k²</text>
<text x="489" y="175" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">k²</text>
<text x="470" y="207" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">p² = (2k)² = 4k²</text>
<text x="530" y="158" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">=</text>
<rect x="554" y="125" width="54" height="54" rx="3" fill="#fef1e8" stroke="#c25014" stroke-width="2.0"/>
<text x="581" y="156" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700">q²</text>
<text x="619" y="157" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">+</text>
<rect x="630" y="125" width="54" height="54" rx="3" fill="#fef1e8" stroke="#c25014" stroke-width="2.0"/>
<text x="657" y="156" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700">q²</text>
<text x="619" y="207" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2q²（两块 q×q）</text>
<rect x="424" y="224" width="300" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="442" cy="243" r="9.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="442" y="247" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="458" y="247" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="600">先约到最简分数：设 d/s = p/q，gcd(p, q) = 1</text>
<rect x="424" y="272" width="300" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="442" cy="291" r="9.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="442" y="295" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="458" y="295" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="600">平方得 p² = 2q² ⇒ p² 是偶数 ⇒ p = 2k 必为偶数</text>
<rect x="424" y="320" width="300" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="442" cy="339" r="9.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="442" y="343" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">3</text>
<text x="458" y="343" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="600">代入 4k² = 2q² ⇒ q² = 2k² ⇒ q = 2m 也必为偶数！</text>
<rect x="424" y="368" width="300" height="38" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="442" cy="387" r="9.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="442" y="391" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">4</text>
<text x="458" y="391" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="600">矛盾爆破：p, q 都能被 2 整除，与“互质无公因子”冲突！</text>
<rect x="424" y="416" width="300" height="34" rx="7" fill="#fde8ec" stroke="#c81e3a" stroke-width="1"/>
<text x="574" y="437" font-size="11.5" fill="#c81e3a" text-anchor="middle" font-weight="700">结论：不存在任何有理数 p/q 满足 (p/q)² = 2</text>
</svg>
