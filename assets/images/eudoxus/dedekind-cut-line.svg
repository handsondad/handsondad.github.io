<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">戴德金分割、阿基米德公理与柯西基本列的实数完备化图解</title>
<desc id="desc">上图展示有理切口3/2的右集U自带最小数3/2；中图展示无理切口q²&lt;2与q²&gt;2在有理数轴Q上留出针眼缺口，戴德金将切口本身定义为√2从而实现最小上界完备性；下图左栏说明阿基米德公理排除非零无穷小以保证有理数能隔开不同实数，右栏连接康托尔-柯西序列构造。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="535" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">戴德金分割（1872）：从“比较有理数”到“把切口本身定义为实数”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">对比有理切口 3/2 与无理针眼缺口 √2，并看清阿基米德公理与柯西基本列如何共同织出完备实数轴 ℝ</text>
<rect x="20" y="66" width="720" height="128" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="89" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">对照一：有理数切口（以 3/2 为例）——右集合自带最小有理数端点</text>
<rect x="562.0" y="73.0" width="162" height="22" rx="11.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="643.0" y="88.0" font-size="11.3" fill="#475569" text-anchor="middle" font-weight="600">已有现成有理数 3/2</text>
<line x1="56.00" y1="142.00" x2="427.26" y2="142.00" stroke="#1d6fa5" stroke-width="3.2" stroke-linecap="round"/>
<line x1="432.26" y1="142.00" x2="704.00" y2="142.00" stroke="#c25014" stroke-width="3.2" stroke-linecap="round"/>
<line x1="432.26" y1="106.00" x2="432.26" y2="178.00" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<circle cx="424.26" cy="142.00" r="4.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="2.0"/>
<circle cx="432.26" cy="142.00" r="5.2" fill="#c25014" stroke="#ffffff" stroke-width="1.6"/>
<text x="206" y="124" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">左集 L = { q ∈ ℚ : q &lt; 3/2 }（无最大数）</text>
<text x="548" y="124" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">右集 U = { q ∈ ℚ : q ≥ 3/2 }（有最小数 min U = 3/2！）</text>
<line x1="223.23" y1="138.00" x2="223.23" y2="146.00" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<text x="223.2" y="164.0" font-size="11.2" fill="#64748b" text-anchor="middle">1</text>
<line x1="327.74" y1="138.00" x2="327.74" y2="146.00" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<text x="327.7" y="164.0" font-size="11.2" fill="#64748b" text-anchor="middle">5/4</text>
<line x1="432.26" y1="138.00" x2="432.26" y2="146.00" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<text x="432.3" y="164.0" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="700">3/2（实心归 U）</text>
<line x1="536.77" y1="138.00" x2="536.77" y2="146.00" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<text x="536.8" y="164.0" font-size="11.2" fill="#64748b" text-anchor="middle">7/4</text>
<line x1="641.29" y1="138.00" x2="641.29" y2="146.00" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<text x="641.3" y="164.0" font-size="11.2" fill="#64748b" text-anchor="middle">2</text>
<rect x="20" y="206" width="720" height="166" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="229" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">对照二：无理数切口（q² &lt; 2 与 q² &gt; 2）——有理数轴 ℚ 在此露出“针眼缺口”！</text>
<rect x="550.0" y="213.0" width="174" height="22" rx="11.0" fill="#fde8ec" stroke="#c81e3a" stroke-width="1" stroke-opacity="0.35"/>
<text x="637.0" y="228.0" font-size="11.3" fill="#c81e3a" text-anchor="middle" font-weight="600">令切口 (L, U) ≡ √2 ∈ ℝ</text>
<line x1="56.00" y1="294.00" x2="389.39" y2="294.00" stroke="#1d6fa5" stroke-width="3.4" stroke-linecap="round"/>
<line x1="403.39" y1="294.00" x2="704.00" y2="294.00" stroke="#c25014" stroke-width="3.4" stroke-linecap="round"/>
<line x1="396.39" y1="246.00" x2="396.39" y2="344.00" stroke="#c81e3a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4 3"/>
<circle cx="396.39" cy="294.00" r="5.6" fill="#ffffff" stroke="#c81e3a" stroke-width="2.2"/>
<text x="196" y="266" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">L = { q&lt;0 或 q²&lt;2 }：无最大有理数！</text>
<text x="556" y="266" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">U = { q&gt;0 且 q²&gt;2 }：也无最小有理数！</text>
<text x="396.4" y="252" font-size="11.3" fill="#c81e3a" text-anchor="middle" font-weight="700" class="halo">ℚ 中空缺针眼，ℝ 补上 sup L = √2</text>
<circle cx="139.61" cy="294.00" r="3.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.1"/>
<text x="139.6" y="314.0" font-size="11.1" fill="#1d6fa5" text-anchor="middle" font-weight="600">4/5</text>
<circle cx="223.23" cy="294.00" r="3.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.1"/>
<text x="223.2" y="314.0" font-size="11.1" fill="#1d6fa5" text-anchor="middle" font-weight="600">1</text>
<circle cx="327.74" cy="294.00" r="3.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.1"/>
<text x="327.7" y="314.0" font-size="11.1" fill="#1d6fa5" text-anchor="middle" font-weight="600">5/4</text>
<circle cx="390.45" cy="294.00" r="3.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.1"/>
<text x="390.5" y="282.0" font-size="11.1" fill="#1d6fa5" text-anchor="middle" font-weight="600">7/5</text>
<circle cx="397.42" cy="294.00" r="3.2" fill="#c25014" stroke="#ffffff" stroke-width="1.1"/>
<text x="397.4" y="330.0" font-size="11.1" fill="#c25014" text-anchor="middle" font-weight="600">17/12</text>
<circle cx="432.26" cy="294.00" r="3.2" fill="#c25014" stroke="#ffffff" stroke-width="1.1"/>
<text x="432.3" y="282.0" font-size="11.1" fill="#c25014" text-anchor="middle" font-weight="600">3/2</text>
<circle cx="536.77" cy="294.00" r="3.2" fill="#c25014" stroke="#ffffff" stroke-width="1.1"/>
<text x="536.8" y="314.0" font-size="11.1" fill="#c25014" text-anchor="middle" font-weight="600">7/4</text>
<circle cx="641.29" cy="294.00" r="3.2" fill="#c25014" stroke="#ffffff" stroke-width="1.1"/>
<text x="641.3" y="314.0" font-size="11.1" fill="#c25014" text-anchor="middle" font-weight="600">2</text>
<text x="380" y="356" font-size="11.3" fill="#1e293b" text-anchor="middle" font-weight="600">完备性本质：有理数虽然稠密却遍布“无端点切口”；实数轴 ℝ 让每一个戴德金分割都拥有最小上界 sup L</text>
<rect x="20" y="384" width="352" height="138" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="407" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">地基防线：阿基米德公理排除非零无穷小</text>
<text x="36" y="431" font-size="11.3" fill="#1e293b" text-anchor="start">若存在正无穷小 ε &gt; 0（满足对一切正整数 m 都有</text>
<text x="36" y="450" font-size="11.3" fill="#1e293b" text-anchor="start">m·ε &lt; 1），则 1 与 1+ε 之间插不进任何有理数 n/m，</text>
<text x="36" y="469" font-size="11.3" fill="#c25014" text-anchor="start" font-weight="700">两数会共用同一个有理数分割！</text>
<rect x="36" y="480" width="320" height="30" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="196" y="499" font-size="11.1" fill="#1d6fa5" text-anchor="middle" font-weight="700">阿基米德性质：∃m 使 m(y−x) &gt; 1 ⇒ 必有 n/m 隔开 x, y</text>
<rect x="388" y="384" width="352" height="138" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="407" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">殊途同归：从两侧夹逼走向柯西基本列</text>
<text x="404" y="431" font-size="11.3" fill="#1e293b" text-anchor="start">从左集 L 挑递增有理数 aₖ = 1, 7/5, 41/29, 239/169, …</text>
<text x="404" y="450" font-size="11.3" fill="#1e293b" text-anchor="start">项间距离 |aⱼ − aₖ| → 0，构成有理“柯西序列”，</text>
<text x="404" y="469" font-size="11.3" fill="#18794e" text-anchor="start" font-weight="700">在 ℚ 内无家可归，在 ℝ 内收敛向同一极限 √2！</text>
<rect x="404" y="480" width="320" height="30" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="564" y="499" font-size="11.1" fill="#18794e" text-anchor="middle" font-weight="700">戴德金分割完备化 ⇔ 康托尔—柯西序列完备化（同构）</text>
</svg>
