<svg xmlns="http://www.w3.org/2000/svg" width="760" height="538" viewBox="0 0 760 538" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">欧多克斯比例定义V.5的有理数筛子与渐进分数区间套</title>
<desc id="desc">上图按佩尔渐进分数1/1、3/2、7/5、17/12、41/29依次检验整数倍mA与nB、mC与nD的大小关系，2m²与n²仅相差±1且两组正方形判决完全同步；下图在数轴与局部放大镜上展示有理区间[1,3/2]⊃[7/5,3/2]⊃[7/5,17/12]⊃[41/29,17/12]层层收口锁定√2。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="537" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">欧多克斯“有理数筛子”（《几何原本》定义 V.5）：整数倍同步拷问</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">不用写出 √2，只拿正整数倍 mA 与 nB、mC 与 nD 逐轮比大小；所有有理数筛孔回答一致 ⇔ A:B = C:D</text>
<rect x="20" y="66" width="720" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="90" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">两组正方形同步过筛：小正方形 (A=d₁, B=s₁) vs 大正方形 (C=d₂, D=s₂)</text>
<rect x="572.0" y="73.0" width="154" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="649.0" y="88.0" font-size="11.3" fill="#1d6fa5" text-anchor="middle" font-weight="600">mA ≷ nB ⇔ mC ≷ nD</text>
<rect x="34" y="102" width="692" height="28" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="120" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">有理探针 n/m</text>
<text x="152" y="120" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">取倍数 (m, n)</text>
<text x="282" y="120" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">整数平方核验 2m² vs n²</text>
<text x="424" y="120" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">两组比赛同步判决</text>
<text x="574" y="120" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">夹出的有理区间</text>
<text x="46" y="148" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600" class="mono">1/1 = 1.0000</text>
<text x="152" y="148" font-size="11.5" fill="#1e293b" text-anchor="start" class="mono">m=1, n=1</text>
<text x="282" y="148" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">2 &gt; 1（差 +1）</text>
<text x="424" y="148" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">1A &gt; 1B  且  1C &gt; 1D</text>
<text x="574" y="148" font-size="11.5" fill="#475569" text-anchor="start" font-weight="700" class="mono">[1/1, +∞)</text>
<rect x="34" y="160" width="692" height="27" fill="#fbfcfd"/>
<text x="46" y="177" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600" class="mono">3/2 ≈ 1.5000</text>
<text x="152" y="177" font-size="11.5" fill="#1e293b" text-anchor="start" class="mono">m=2, n=3</text>
<text x="282" y="177" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700" class="mono">8 &lt; 9（差 -1）</text>
<text x="424" y="177" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700" class="mono">2A &lt; 3B  且  2C &lt; 3D</text>
<text x="574" y="177" font-size="11.5" fill="#475569" text-anchor="start" font-weight="700" class="mono">[1/1, 3/2]</text>
<text x="46" y="206" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600" class="mono">7/5 ≈ 1.4000</text>
<text x="152" y="206" font-size="11.5" fill="#1e293b" text-anchor="start" class="mono">m=5, n=7</text>
<text x="282" y="206" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">50 &gt; 49（差 +1）</text>
<text x="424" y="206" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">5A &gt; 7B  且  5C &gt; 7D</text>
<text x="574" y="206" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700" class="mono">[7/5, 3/2]</text>
<rect x="34" y="218" width="692" height="27" fill="#fbfcfd"/>
<text x="46" y="235" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600" class="mono">17/12 ≈ 1.4167</text>
<text x="152" y="235" font-size="11.5" fill="#1e293b" text-anchor="start" class="mono">m=12, n=17</text>
<text x="282" y="235" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700" class="mono">288 &lt; 289（差 -1）</text>
<text x="424" y="235" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700" class="mono">12A &lt; 17B  且  12C &lt; 17D</text>
<text x="574" y="235" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700" class="mono">[7/5, 17/12]</text>
<text x="46" y="264" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600" class="mono">41/29 ≈ 1.4138</text>
<text x="152" y="264" font-size="11.5" fill="#1e293b" text-anchor="start" class="mono">m=29, n=41</text>
<text x="282" y="264" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">1682 &gt; 1681（差 +1）</text>
<text x="424" y="264" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">29A &gt; 41B  且  29C &gt; 41D</text>
<text x="574" y="264" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700" class="mono">[41/29, 17/12]</text>
<rect x="20" y="310" width="720" height="214" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="334" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">有理区间层层收口：[1, 3/2] ⊃ [7/5, 3/2] ⊃ [7/5, 17/12] ⊃ [41/29, 17/12]</text>
<rect x="592.0" y="317.0" width="134" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="659.0" y="332.0" font-size="11.3" fill="#18794e" text-anchor="middle" font-weight="600">永无平局却唯一锁定</text>
<line x1="52.00" y1="468.00" x2="412.00" y2="468.00" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
<line x1="333.93" y1="354.00" x2="333.93" y2="476.00" stroke="#c81e3a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="333.9" y="351" font-size="11.5" fill="#c81e3a" text-anchor="middle" font-weight="700">A:B = √2</text>
<rect x="76.83" y="366" width="310.34" height="18" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="232.0" y="379" font-size="11.2" fill="#0f172a" text-anchor="middle" font-weight="600">第 1–2 筛：[1, 3/2]，宽 0.500</text>
<rect x="325.1" y="396" width="62.07" height="18" rx="4" fill="#e7f6ee" stroke="#18794e" stroke-width="1.5"/>
<text x="317.1" y="409" font-size="11.2" fill="#18794e" text-anchor="end" font-weight="600">第 3 筛：[7/5, 3/2]，宽 0.100</text>
<rect x="325.1" y="426" width="10.34" height="18" rx="4" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="317.1" y="439" font-size="11.2" fill="#6d28d9" text-anchor="end" font-weight="600">第 4 筛：[7/5, 17/12]，宽 0.0167</text>
<line x1="76.83" y1="463.00" x2="76.83" y2="473.00" stroke="#1d6fa5" stroke-width="1.8" stroke-linecap="round"/>
<text x="76.8" y="488.0" font-size="11.3" fill="#1d6fa5" text-anchor="middle" font-weight="700">1/1</text>
<line x1="325.10" y1="463.00" x2="325.10" y2="473.00" stroke="#1d6fa5" stroke-width="1.8" stroke-linecap="round"/>
<text x="325.1" y="488.0" font-size="11.3" fill="#1d6fa5" text-anchor="middle" font-weight="700">7/5 (1.4)</text>
<line x1="387.17" y1="463.00" x2="387.17" y2="473.00" stroke="#c25014" stroke-width="1.8" stroke-linecap="round"/>
<text x="387.2" y="488.0" font-size="11.3" fill="#c25014" text-anchor="middle" font-weight="700">3/2 (1.5)</text>
<text x="232" y="510" font-size="11.2" fill="#64748b" text-anchor="middle">宏观数轴窗口 [0.96, 1.54]</text>
<rect x="436" y="352" width="290" height="158" rx="8" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 3"/>
<text x="581" y="372" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">局部放大镜 [1.4125, 1.4175]</text>
<rect x="520.66" y="404" width="143.68" height="22" rx="4" fill="#e7f6ee" stroke="#18794e" stroke-width="1.6"/>
<text x="592.5" y="419" font-size="11.1" fill="#18794e" text-anchor="middle" font-weight="700">宽仅 1/348 ≈ 0.0029</text>
<line x1="456.00" y1="446.00" x2="706.00" y2="446.00" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/>
<line x1="541.68" y1="384.00" x2="541.68" y2="454.00" stroke="#c81e3a" stroke-width="2.1" stroke-linecap="round" stroke-dasharray="4 3"/>
<circle cx="541.68" cy="446.00" r="4.2" fill="#ffffff" stroke="#c81e3a" stroke-width="2.0"/>
<text x="541.7" y="396" font-size="11.2" fill="#c81e3a" text-anchor="middle" font-weight="700" class="halo">√2 ≈ 1.41421</text>
<circle cx="520.66" cy="446.00" r="4.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.5"/>
<text x="520.7" y="466.0" font-size="11.3" fill="#1d6fa5" text-anchor="middle" font-weight="700">41/29</text>
<text x="520.7" y="481.0" font-size="11" fill="#64748b" text-anchor="middle" class="mono">1.4138</text>
<circle cx="664.33" cy="446.00" r="4.2" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<text x="664.3" y="466.0" font-size="11.3" fill="#c25014" text-anchor="middle" font-weight="700">17/12</text>
<text x="664.3" y="481.0" font-size="11" fill="#64748b" text-anchor="middle" class="mono">1.4167</text>
