<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：两条镜像莫比乌斯环沿唯一圆边界缝合成克莱因瓶　|　右：莫比乌斯环上的蒂策六国两两接壤地图</text>
