<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">克莱因瓶双莫比乌斯环缝合原理与莫比乌斯环六国两两接壤六色地图</title>
<desc id="desc">左图展示左旋与右旋莫比乌斯环沿唯一圆边界S1缝合成无边界无内外的克莱因瓶，并标注三维浸入自交处与四维无自交解释；右图用严格可验算的4x5矩形翻转粘合网格构造6个两两相邻区域，证明莫比乌斯环色数为6。</desc>
