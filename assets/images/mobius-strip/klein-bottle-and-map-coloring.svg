<text x="244" y="268" font-size="9.2" fill="#18794e" text-anchor="start" font-weight="700">绿虚线：从底部喉管</text>
<text x="244" y="284" font-size="9.2" fill="#18794e" text-anchor="start" font-weight="700">顺天鹅颈钻出，不跨</text>
<text x="244" y="300" font-size="9.2" fill="#18794e" text-anchor="start" font-weight="700">任何边缘直接爬到瓶</text>
<text x="244" y="316" font-size="9.2" fill="#18794e" text-anchor="start" font-weight="700">肚子外表面——无内</text>
<text x="244" y="332" font-size="9.2" fill="#18794e" text-anchor="start" font-weight="700">无外、无瓶口边界！</text>
<text x="192" y="355" font-size="9.2" fill="#1e293b" text-anchor="middle" font-weight="600">蓝半壁 + 橙半壁 = 两条镜像莫比乌斯环完美闭合成瓶</text>
<rect x="32" y="372" width="320" height="74" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="392" font-size="9.5" fill="#1e293b" text-anchor="start">• 克莱因瓶（1882）：无边界、不可定向、欧拉示性数 χ = 0；</text>
<text x="44" y="411" font-size="9.5" fill="#1e293b" text-anchor="start">• 若改拿 1 条莫比乌斯环 + 1 张普通圆盘 D² 沿唯一圆边界缝合：</text>
<text x="44" y="430" font-size="9.5" fill="#1d6fa5" text-anchor="start" font-weight="600">  就得到射影几何舞台——实射影平面 ℝP²（无边界，χ = 1）！</text>
<rect x="380" y="66" width="362" height="392" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="396" y="90" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">平面四色定理失效！莫比乌斯环需 6 种颜色</text>
<text x="396" y="108" font-size="9.5" fill="#64748b" text-anchor="start">左右两端拧 180° 粘合 (0, y) ~ (L, H−y)：6 国两两共享边界！</text>
