<rect x="394" y="310" width="334" height="136" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="406" y="330" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">手指逐国验算（共 C(6,2) = 15 条公共国界，无一遗漏！）：</text>
<text x="406" y="350" font-size="9.5" fill="#1e293b" text-anchor="start">• ①国与③国居中：上下左右直接挨遍其余全部 5 国；</text>
<text x="406" y="369" font-size="9.5" fill="#c25014" text-anchor="start" font-weight="600">• ②国上横条挨④③①⑤，左端 a 格拧 180° 跨缝直通右下角⑥国！</text>
<text x="406" y="388" font-size="9.5" fill="#1e293b" text-anchor="start">• ④国由左 b 格与右 b 格跨缝连成一片；⑤国由左 c,d 接右 c,d；</text>
<text x="406" y="408" font-size="9.5" fill="#6d28d9" text-anchor="start" font-weight="700">• 结论：6 国两两接壤（完全图 K₆ 对偶），最少必须用 6 种颜色！</text>
<text x="406" y="427" font-size="9.3" fill="#1d6fa5" text-anchor="start" font-weight="600">  同理，“三座房子通水电气（K₃,₃）”在平面必交叉，在莫环零交叉可解。</text>
