<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">施瓦茨2023最优纸莫比乌斯环定理：长宽比√3正三角形折叠极限与全景区间图</title>
<desc id="desc">左图精确构造宽1长√3矩形沿三条60度折痕分成3个边长2/√3的正三角形并叠合为平折正三角形莫比乌斯环；右图按真实比例标出L/w≤π/2绝对禁区、π/2到√3自交区与大于√3光滑无自交可行区。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="467" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">悬置 46 年的几何难题告破：多短的纸条折不出莫比乌斯环？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">施瓦茨（Richard Schwartz, 2023/2024《数学年刊》）严格证明：光滑无自交纸带必满足 L / w &gt; √3 ≈ 1.7321</text>
<rect x="18" y="66" width="378" height="384" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="34" y="90" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">为什么极限常数偏偏是 √3？三块正三角形完美拼出极限带</text>
<polygon points="42.00,126.00 42.00,262.00 120.52,262.00" fill="#fef1e8" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="42.00,126.00 120.52,262.00 199.04,126.00" fill="#eaf4fb" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="120.52,262.00 199.04,126.00 277.56,262.00" fill="#e7f6ee" stroke="#0f172a" stroke-width="1.5"/>
<polygon points="199.04,126.00 277.56,126.00 277.56,262.00" fill="#fef1e8" stroke="#0f172a" stroke-width="1.5"/>
<line x1="42.00" y1="126.00" x2="120.52" y2="262.00" stroke="#6d28d9" stroke-width="2.2" stroke-dasharray="5 3"/>
<line x1="120.52" y1="262.00" x2="199.04" y2="126.00" stroke="#6d28d9" stroke-width="2.2" stroke-dasharray="5 3"/>
<line x1="199.04" y1="126.00" x2="277.56" y2="262.00" stroke="#6d28d9" stroke-width="2.2" stroke-dasharray="5 3"/>
<line x1="42.00" y1="262.00" x2="42.00" y2="130.00" stroke="#c25014" stroke-width="2.6" marker-end="url(#arr-orange)"/>
<line x1="277.56" y1="126.00" x2="277.56" y2="258.00" stroke="#c25014" stroke-width="2.6" marker-end="url(#arr-orange)"/>
<text x="159.8" y="118.0" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">精确长宽比：长 L = √3 ≈ 1.7321，宽 w = 1</text>
<text x="32.0" y="198.0" font-size="9.8" fill="#0f172a" text-anchor="end" font-weight="700" class="mono">w=1</text>
<text x="117.4" y="183.1" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">正△ ①</text>
<text x="197.5" y="215.8" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">正△ ②</text>
<text x="63.2" y="232.1" font-size="9.4" fill="#c25014" text-anchor="middle" font-weight="700">半③</text>
<text x="256.4" y="164.1" font-size="9.4" fill="#c25014" text-anchor="middle" font-weight="700">半③</text>
<text x="138.5" y="256.0" font-size="9.2" fill="#6d28d9" text-anchor="start" font-weight="700" class="mono">60°</text>
<text x="296" y="186" font-size="9.0" fill="#6d28d9" text-anchor="middle" font-weight="700">平折</text>
<text x="296" y="202" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">═▶</text>
<polygon points="348.00,162.00 379.18,216.00 316.82,216.00" fill="#f3e8ff" stroke="#6d28d9" stroke-width="2.2"/>
<text x="348.0" y="206.0" font-size="9.0" fill="#6d28d9" text-anchor="middle" font-weight="700">3层叠合</text>
<text x="348.0" y="244.0" font-size="9.4" fill="#6d28d9" text-anchor="middle" font-weight="700">正三角形环</text>
<text x="348.0" y="259.0" font-size="8.8" fill="#64748b" text-anchor="middle" class="mono">边长 2/√3</text>
<rect x="32" y="288" width="350" height="148" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="44" y="308" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">三步读懂为什么 √3 是不可逾越的硬门槛：</text>
<text x="44" y="328" font-size="9.5" fill="#1e293b" text-anchor="start">1. 真实纸张不可拉伸（高斯曲率 K=0 可展曲面），表面布满直母线；</text>
<text x="44" y="348" font-size="9.5" fill="#1e293b" text-anchor="start">2. 施瓦茨发现“T 字正交截面引理”：任何无自交光滑纸莫比乌斯环必</text>
<text x="44" y="367" font-size="9.5" fill="#1d6fa5" text-anchor="start" font-weight="600">   含一对互相垂直的直母线组成 T 形骨架，将展开面积卡死下限；</text>
<text x="44" y="387" font-size="9.5" fill="#1e293b" text-anchor="start">3. 当高 w=1 时，60° 折痕水平跨度恰为 cot 60° = 1/√3；三段正△拼</text>
<text x="44" y="406" font-size="9.5" fill="#c25014" text-anchor="start" font-weight="700">   合（左右两块橙色半直角△拧 180° 合成正△③），总长 3×(1/√3)=√3！</text>
<text x="44" y="425" font-size="9.4" fill="#6d28d9" text-anchor="start" font-weight="600">   只要 L ≤ √3w，纸面要么撕裂起皱，要么被迫自己穿过自己。</text>
<rect x="410" y="66" width="332" height="384" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="426" y="90" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">纸条长宽比 L / w 全景禁区地图</text>
<text x="426" y="108" font-size="9.5" fill="#64748b" text-anchor="start">横轴按真实数值比例绘制（范围 1.0 ～ 2.6）</text>
<rect x="432.0" y="144.0" width="102.7" height="24" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
<rect x="534.7" y="144.0" width="29.0" height="24" fill="#fef3c7" stroke="#c25014" stroke-width="1.2"/>
<rect x="563.8" y="144.0" width="156.2" height="24" rx="4" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<line x1="432.0" y1="140.0" x2="432.0" y2="172.0" stroke="#64748b" stroke-width="2.0"/>
<text x="432.0" y="184.0" font-size="9.3" fill="#64748b" text-anchor="middle" font-weight="700" class="mono">1.0</text>
<line x1="534.7" y1="140.0" x2="534.7" y2="172.0" stroke="#dc2626" stroke-width="2.0"/>
<text x="534.7" y="136.0" font-size="9.3" fill="#dc2626" text-anchor="middle" font-weight="700" class="mono">π/2≈1.571</text>
<line x1="563.8" y1="140.0" x2="563.8" y2="172.0" stroke="#6d28d9" stroke-width="2.0"/>
<text x="563.8" y="184.0" font-size="9.3" fill="#6d28d9" text-anchor="middle" font-weight="700" class="mono">√3≈1.732</text>
<line x1="648.0" y1="140.0" x2="648.0" y2="172.0" stroke="#18794e" stroke-width="2.0"/>
<text x="648.0" y="136.0" font-size="9.3" fill="#18794e" text-anchor="middle" font-weight="700" class="mono">2.2</text>
<line x1="720.0" y1="140.0" x2="720.0" y2="172.0" stroke="#18794e" stroke-width="2.0"/>
<text x="720.0" y="184.0" font-size="9.3" fill="#18794e" text-anchor="middle" font-weight="700" class="mono">2.6+</text>
<rect x="426" y="200" width="300" height="70" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
<text x="438" y="220" font-size="10.0" fill="#b91c1c" text-anchor="start" font-weight="700">① L / w ≤ π/2 ≈ 1.5708（绝对禁区）</text>
<text x="438" y="239" font-size="9.3" fill="#1e293b" text-anchor="start">Halpern &amp; Weaver (1977) 证明：即便允许纸带像幽灵一样</text>
<text x="438" y="256" font-size="9.3" fill="#1e293b" text-anchor="start">穿透自身，也不存在光滑等距浸入解。</text>
<rect x="426" y="280" width="300" height="76" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="438" y="300" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="700">② π/2 &lt; L / w ≤ √3 ≈ 1.7321（自交陷阱区）</text>
<text x="438" y="319" font-size="9.3" fill="#1e293b" text-anchor="start">1977 年提出猜想，卡住数学界 46 年！布朗大学施瓦茨于</text>
<text x="438" y="336" font-size="9.3" fill="#c25014" text-anchor="start" font-weight="600">2023 年彻底证毕：此区间纸面必定自交，现实纸条做不出！</text>
<rect x="426" y="366" width="300" height="70" rx="8" fill="#e7f6ee" stroke="#bbf7d0" stroke-width="1"/>
<text x="438" y="386" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">③ L / w &gt; √3（真实纸条可行区）</text>
<text x="438" y="405" font-size="9.3" fill="#1e293b" text-anchor="start">越逼近 √3 纸带越紧绷趋向左图三折正三角形；日常手工</text>
<text x="438" y="422" font-size="9.3" fill="#1e293b" text-anchor="start">用 A4 纸裁长宽比 L/w ≥ 5～8，胶带一粘最舒展好看。</text>
</svg>
