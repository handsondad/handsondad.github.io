<text x="380.0" y="311" font-size="9.1" fill="#c25014" text-anchor="middle" font-weight="600">紧贴绝缘膜处处反向对称抵消磁场</text>
<text x="278" y="346" font-size="9.4" fill="#1e293b" text-anchor="start">• 普通绕线电阻一通高频脉冲就变电感线圈</text>
<text x="278" y="366" font-size="9.4" fill="#1e293b" text-anchor="start">  （V = L·dI/dt 产生剧烈振铃失真）；</text>
<text x="278" y="386" font-size="9.4" fill="#1e293b" text-anchor="start">• 莫比乌斯双面金属箔拧半圈短接后，正反</text>
<text x="278" y="406" font-size="9.4" fill="#c25014" text-anchor="start" font-weight="600">  电流严丝合缝相消，寄生电感趋近于零！</text>
