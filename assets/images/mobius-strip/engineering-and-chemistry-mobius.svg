<text x="32" y="346" font-size="9.4" fill="#1e293b" text-anchor="start">• 工业高温传送带不会单侧烤裂卷边；</text>
<text x="32" y="366" font-size="9.4" fill="#1e293b" text-anchor="start">• 老式打字机/票据打印机循环色带盒、</text>
