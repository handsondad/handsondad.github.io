<rect x="0.5" y="0.5" width="759" height="387" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">体重秤读数永远是 0，空间站里怎样给航天员“称体重”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">失重没有夺走“惯性质量”！坐上校准弹簧椅（k = 800 N/m），测一次往返周期 T = 2π√(m/k) 就能算出质量。</text>
<rect x="20" y="64" width="292" height="310" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">太空质量测量仪（BMMD）</text>
<text x="36" y="107" font-size="10.8" fill="#64748b" text-anchor="start">不用重力 mg，改用牛顿第二定律 F = ma</text>
<rect x="34" y="120" width="264" height="106" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<line x1="48.0" y1="130.0" x2="48.0" y2="214.0" stroke="#475569" stroke-width="2.4"/>
<line x1="40.0" y1="140.0" x2="48.0" y2="134.0" stroke="#475569" stroke-width="1.1"/>
