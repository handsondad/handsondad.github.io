<line x1="40.0" y1="176.0" x2="48.0" y2="170.0" stroke="#475569" stroke-width="1.1"/>
<line x1="40.0" y1="188.0" x2="48.0" y2="182.0" stroke="#475569" stroke-width="1.1"/>
<line x1="40.0" y1="200.0" x2="48.0" y2="194.0" stroke="#475569" stroke-width="1.1"/>
<line x1="40.0" y1="212.0" x2="48.0" y2="206.0" stroke="#475569" stroke-width="1.1"/>
<path d="M48.00,174.00 L60.00,174.00 L64.00,164.00 L74.00,184.00 L84.00,164.00 L94.00,184.00 L104.00,164.00 L114.00,184.00 L124.00,164.00 L134.00,174.00 L146.00,174.00" fill="none" stroke="#18794e" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<text x="96" y="155" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700" class="mono">k = 800 N/m</text>
<rect x="146" y="146" width="68" height="52" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<circle cx="180" cy="161" r="7.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
<line x1="180.0" y1="169.0" x2="180.0" y2="188.0" stroke="#0f172a" stroke-width="1.8"/>
<line x1="166.0" y1="177.0" x2="194.0" y2="177.0" stroke="#c25014" stroke-width="2.0"/>
<text x="180" y="212" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="600">绑紧身体 + 屏息</text>
<line x1="224.0" y1="172.0" x2="278.0" y2="172.0" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<line x1="278.0" y1="172.0" x2="224.0" y2="172.0" stroke="#c25014" stroke-width="1.6"/>
<text x="252" y="162" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">往返 ±A</text>
<text x="252" y="190" font-size="10.4" fill="#64748b" text-anchor="middle">光电测 T</text>
<rect x="34" y="238" width="264" height="122" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="46" y="258" font-size="10.9" fill="#1e293b" text-anchor="start">• 地面体重秤：测支持力 N = mg（太空归零）</text>
<text x="46" y="279" font-size="10.9" fill="#1e293b" text-anchor="start">• 太空弹簧椅：测惯性回复 ma = −kx</text>
<text x="46" y="303" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">周期 T = 2π√(m / k)  （式里根本没有 g！）</text>
<text x="46" y="326" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">反推质量：m = k · T² / (4π²)</text>
<text x="46" y="346" font-size="10.7" fill="#64748b" text-anchor="start">质量越大惯性越大 → 来回弹一次越慢</text>
<rect x="328" y="64" width="412" height="310" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="346" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="346" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="364" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">精确位移曲线：50 kg vs 80 kg（k = 800 N/m）</text>
<text x="344" y="107" font-size="10.8" fill="#64748b" text-anchor="start">振幅 A = 10 cm  ｜  蓝实线：50 kg  ｜  橙虚线：80 kg</text>
