<line x1="605.0" y1="160.0" x2="631.0" y2="160.0" stroke="#0f172a" stroke-width="1.6"/>
<line x1="618.0" y1="180.0" x2="609.0" y2="196.0" stroke="#0f172a" stroke-width="1.7"/>
<line x1="618.0" y1="180.0" x2="627.0" y2="196.0" stroke="#0f172a" stroke-width="1.7"/>
<circle cx="618.0" cy="166.0" r="3.2" fill="#0f172a"/>
<line x1="598.0" y1="156.0" x2="598.0" y2="190.0" stroke="#c25014" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="593.0" y="172" font-size="11.0" fill="#c25014" text-anchor="end" font-weight="700">mg</text>
<text x="593.0" y="185" font-size="10.0" fill="#c25014" text-anchor="end" class="mono">588N</text>
<text x="637.0" y="168" font-size="11.0" fill="#c25014" text-anchor="start" font-weight="700">N = 0</text>
<circle cx="652.0" cy="146.0" r="5" fill="#ef4444"/>
<line x1="698.0" y1="134.0" x2="698.0" y2="172.0" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<text x="698" y="127" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">a↓</text>
<rect x="522" y="224" width="204" height="24" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="624" y="240" font-size="11.3" fill="#c25014" text-anchor="middle" font-weight="700">秤读数：0.0 kg（完全失重！）</text>
<text x="624" y="263" font-size="11.2" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">N = m(g − g) = 0 N</text>
<text x="624" y="280" font-size="10.8" fill="#64748b" text-anchor="middle">人与地板同速下落，零挤压</text>
<rect x="20" y="302" width="720" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="314.0" width="74" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="71.0" y="329.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">动手实验</text>
<text x="118" y="329" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="700">侧壁扎孔的纸杯：为什么一松手，漏水立刻停住？</text>
