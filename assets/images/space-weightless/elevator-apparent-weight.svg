<circle cx="374.0" cy="174.0" r="3.2" fill="#0f172a"/>
<line x1="354.0" y1="164.0" x2="354.0" y2="198.0" stroke="#c25014" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="349.0" y="180" font-size="11.0" fill="#c25014" text-anchor="end" font-weight="700">mg</text>
<text x="349.0" y="193" font-size="10.0" fill="#c25014" text-anchor="end" class="mono">588N</text>
<line x1="394.0" y1="184.0" x2="394.0" y2="167.0" stroke="#18794e" stroke-width="2.2" marker-end="url(#arr-green)"/>
<text x="399.0" y="170" font-size="11.0" fill="#18794e" text-anchor="start" font-weight="700">N</text>
<text x="399.0" y="183" font-size="10.0" fill="#18794e" text-anchor="start" class="mono">294N</text>
<line x1="454.0" y1="134.0" x2="454.0" y2="156.0" stroke="#18794e" stroke-width="1.8" marker-end="url(#arr-green)"/>
<text x="454" y="127" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="700">a↓</text>
<rect x="278" y="224" width="204" height="24" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="380" y="240" font-size="11.3" fill="#18794e" text-anchor="middle" font-weight="700">秤读数：30.0 kg（半失重）</text>
<text x="380" y="263" font-size="11.2" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">N = m(g−0.5g) = 294 N</text>
<text x="380" y="280" font-size="10.8" fill="#64748b" text-anchor="middle">地板一边退让一边轻托</text>
<rect x="508" y="64" width="232" height="226" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="526" cy="84" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="526" y="88" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">3</text>
<text x="543" y="88" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="700">自由下落 (a = g)</text>
<rect x="552" y="102" width="132" height="114" rx="8" fill="#f8fafc" stroke="#c25014" stroke-width="1.5" stroke-dasharray="5 3"/>
<line x1="612.0" y1="95.0" x2="617.0" y2="100.0" stroke="#c25014" stroke-width="1.8"/>
