<text x="134" y="360" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">① 手捏住不动 (a = 0)：</text>
<text x="134" y="380" font-size="11.0" fill="#1e293b" text-anchor="start">杯底托水产生水压 ρgh &gt; 0，水柱喷出</text>
<line x1="376.0" y1="342.0" x2="376.0" y2="390.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3 3"/>
<path d="M416,346 L422,390 L456,390 L462,346" fill="none" stroke="#c25014" stroke-width="1.8"/>
<path d="M418,356 L422,389 L456,389 L460,356 Z" fill="#93c5fd" fill-opacity="0.65"/>
<circle cx="457" cy="382" r="2.2" fill="#3b82f6"/>
<line x1="400.0" y1="350.0" x2="400.0" y2="384.0" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<text x="476" y="360" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">② 松手自由下落 (a = g)：</text>
<text x="476" y="380" font-size="11.0" fill="#1e293b" text-anchor="start">杯与水同速下落，水压差归零、滴水不漏！</text>
</svg>
