<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">电梯三态视重对比与自由下落扎孔水杯实验</title>
<desc id="desc">上方三栏对比60千克乘客在静止、以0.5g向下加速、以1g自由下落时重力mg始终为588牛而支持力N从588牛减至294牛再到0牛；下方展示侧壁扎孔水杯松手自由下落时水压差归零停止漏水。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="411" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">“引力”不等于“体重秤读数”：为什么一松手就瞬间失重？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">你感受到的“沉重”，其实是地板向上托你的支持力 N = m(g − a)。当舱体和你一起自由下落，支持力归零。</text>
<rect x="20" y="64" width="232" height="226" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="55" y="88" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="700">静止或匀速 (a = 0)</text>
<rect x="64" y="102" width="132" height="114" rx="8" fill="#f8fafc" stroke="#1d6fa5" stroke-width="1.5"/>
<line x1="130.0" y1="94.0" x2="130.0" y2="102.0" stroke="#475569" stroke-width="2.0"/>
<rect x="98.0" y="204.0" width="64" height="9" rx="3" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<circle cx="130.0" cy="150.0" r="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<line x1="130.0" y1="158.0" x2="130.0" y2="188.0" stroke="#0f172a" stroke-width="1.8"/>
<line x1="117.0" y1="168.0" x2="143.0" y2="168.0" stroke="#0f172a" stroke-width="1.6"/>
<line x1="130.0" y1="188.0" x2="121.0" y2="204.0" stroke="#0f172a" stroke-width="1.7"/>
<line x1="130.0" y1="188.0" x2="139.0" y2="204.0" stroke="#0f172a" stroke-width="1.7"/>
<circle cx="130.0" cy="174.0" r="3.2" fill="#0f172a"/>
<line x1="110.0" y1="164.0" x2="110.0" y2="198.0" stroke="#c25014" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="105.0" y="180" font-size="11.0" fill="#c25014" text-anchor="end" font-weight="700">mg</text>
<text x="105.0" y="193" font-size="10.0" fill="#c25014" text-anchor="end" class="mono">588N</text>
<line x1="150.0" y1="184.0" x2="150.0" y2="150.0" stroke="#1d6fa5" stroke-width="2.2" marker-end="url(#arr-blue)"/>
<text x="155.0" y="164" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700">N</text>
<text x="155.0" y="177" font-size="10.0" fill="#1d6fa5" text-anchor="start" class="mono">588N</text>
<rect x="34" y="224" width="204" height="24" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="136" y="240" font-size="11.3" fill="#1d6fa5" text-anchor="middle" font-weight="700">秤读数：60.0 kg（正常）</text>
<text x="136" y="263" font-size="11.2" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">N = mg = 588 N</text>
<text x="136" y="280" font-size="10.8" fill="#64748b" text-anchor="middle">地板稳稳托住脚底</text>
<rect x="264" y="64" width="232" height="226" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="282" cy="84" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="282" y="88" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">2</text>
<text x="299" y="88" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="700">向下加速 (a = 0.5g)</text>
<rect x="308" y="102" width="132" height="114" rx="8" fill="#f8fafc" stroke="#18794e" stroke-width="1.5"/>
<line x1="374.0" y1="94.0" x2="374.0" y2="102.0" stroke="#475569" stroke-width="2.0"/>
