<text x="671.0" y="164.0" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">自由下落</text>
<text x="671.0" y="178.0" font-size="11.0" fill="#c25014" text-anchor="start" font-weight="700" class="mono">4.35 m</text>
<text x="671.0" y="250.0" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="700">地表下弯</text>
<text x="671.0" y="264.0" font-size="11.0" fill="#18794e" text-anchor="start" font-weight="700" class="mono">4.35 m</text>
<text x="424" y="294" font-size="10.8" fill="#18794e" text-anchor="start" font-weight="600">弯曲的地球表面</text>
<rect x="388" y="312" width="336" height="84" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="400" y="332" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">为什么两个 4.35 m 严丝合缝？因为 v = √(GM/r)：</text>
<text x="400" y="353" font-size="11.1" fill="#c25014" text-anchor="start" font-weight="700">地表弯曲量 x²/(2r) = v²t²/(2r) = ½(GM/r²)t² = ½gt²</text>
<text x="400" y="374" font-size="11.0" fill="#1e293b" text-anchor="start">空间站、航天员、水珠沿同一条圆弧下落 → 相对漂浮！</text>
