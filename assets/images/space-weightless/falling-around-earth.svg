<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图：牛顿高山大炮的精确圆锥曲线轨迹；右图：把 1 秒钟放大看——横飞 7.67 km 时，弯曲的地表刚好也退让了 4.35 m！</text>
