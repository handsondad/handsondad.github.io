<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">空间站百万分之一g微重力来源与球形蓝色火焰及池沸腾对比</title>
<desc id="desc">左图展示空间站20米舱段内的潮汐引力梯度（偏离质心10米约2.6微g）、400千米稀薄大气阻力与推力器振动；右图对比地面受浮力对流拉长的黄色蜡烛火焰与微重力下靠分子扩散形成的球形蓝色火焰，以及微重力沸水聚合成单颗大汽泡的现象。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="411" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么严谨的说法叫“微重力（10⁻⁶ g）”，而不是绝对零重力？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图：潮汐引力梯度与稀薄大气留下百万分之一 g 残余加速度；右图：失去浮力对流后，火焰与沸水大变样。</text>
<rect x="20" y="64" width="352" height="332" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">百万分之一 g 从哪来？三大微弱扰动</text>
<text x="36" y="107" font-size="10.8" fill="#64748b" text-anchor="start">只有质心 1 个点完全抵消，舱体其余位置仍有微小差值</text>
<rect x="90" y="130" width="66" height="160" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
<line x1="54.0" y1="210.0" x2="90.0" y2="210.0" stroke="#1d6fa5" stroke-width="3.0"/>
<line x1="156.0" y1="210.0" x2="182.0" y2="210.0" stroke="#1d6fa5" stroke-width="3.0"/>
<circle cx="123" cy="154" r="4" fill="#6d28d9"/>
<line x1="123.0" y1="150.0" x2="123.0" y2="134.0" stroke="#6d28d9" stroke-width="2.0" marker-end="url(#arr-muted)"/>
<line x1="98.0" y1="210.0" x2="148.0" y2="210.0" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="3 2"/>
<circle cx="123" cy="210.0" r="4.2" fill="#18794e"/>
<circle cx="123" cy="266" r="4" fill="#c25014"/>
<line x1="123.0" y1="270.0" x2="123.0" y2="286.0" stroke="#c25014" stroke-width="2.0" marker-end="url(#arr-orange)"/>
<circle cx="42" cy="156" r="2.2" fill="#1d6fa5"/>
<line x1="47.0" y1="156.0" x2="82.0" y2="156.0" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="2 2" marker-end="url(#arr-blue)"/>
<circle cx="42" cy="184" r="2.2" fill="#1d6fa5"/>
<line x1="47.0" y1="184.0" x2="82.0" y2="184.0" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="2 2" marker-end="url(#arr-blue)"/>
<circle cx="42" cy="236" r="2.2" fill="#1d6fa5"/>
<line x1="47.0" y1="236.0" x2="82.0" y2="236.0" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="2 2" marker-end="url(#arr-blue)"/>
<circle cx="42" cy="264" r="2.2" fill="#1d6fa5"/>
<line x1="47.0" y1="264.0" x2="82.0" y2="264.0" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="2 2" marker-end="url(#arr-blue)"/>
<text x="40" y="142" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="600">稀薄分子</text>
<text x="123" y="308" font-size="10.5" fill="#64748b" text-anchor="middle">↓ 指向地心（r₀ = 6771 km）</text>
<rect x="190" y="126" width="168" height="56" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="200" y="144" font-size="11.4" fill="#6d28d9" text-anchor="start" font-weight="700">① 潮汐引力梯度</text>
<text x="200" y="160" font-size="10.6" fill="#1e293b" text-anchor="start">顶舱离地心远、引力略弱</text>
<text x="200" y="174" font-size="10.6" fill="#6d28d9" text-anchor="start" font-weight="600">±10 m 处约 2.6×10⁻⁶ g</text>
<rect x="190" y="190" width="168" height="48" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="200" y="208" font-size="11.4" fill="#1d6fa5" text-anchor="start" font-weight="700">② 400 km 稀薄大气阻力</text>
<text x="200" y="226" font-size="10.6" fill="#1e293b" text-anchor="start">微弱迎风减速 ~0.1–1 μg</text>
<rect x="190" y="246" width="168" height="52" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="200" y="264" font-size="11.4" fill="#c25014" text-anchor="start" font-weight="700">③ 推力器与人员活动</text>
<text x="200" y="281" font-size="10.6" fill="#1e293b" text-anchor="start">轨控点火、蹬壁、风扇振动</text>
<text x="200" y="294" font-size="10.2" fill="#64748b" text-anchor="start">（跑步机须配专门隔振台）</text>
<rect x="34" y="322" width="324" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="342" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">潮汐加速度公式：Δa ≈ (2GM / r³) · Δr</text>
<text x="46" y="362" font-size="11.0" fill="#1e293b" text-anchor="start">偏离质心仅约 4 米，就有 1×10⁻⁶ g（百万分之一 g）！</text>
<rect x="388" y="64" width="352" height="332" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="84" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="406" y="88" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">没有“热空气上浮”：火焰与沸水大变样</text>
<text x="404" y="107" font-size="10.8" fill="#64748b" text-anchor="start">浮力来自重力造成的上下压强差；微重力下自然对流消失</text>
<rect x="404" y="122" width="154" height="152" rx="8" fill="#fffbeb" stroke="#c25014" stroke-width="1"/>
<text x="481" y="141" font-size="11.8" fill="#c25014" text-anchor="middle" font-weight="700">地面蜡烛（1 g）</text>
<rect x="473" y="218" width="16" height="28" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
<line x1="481.0" y1="210.0" x2="481.0" y2="218.0" stroke="#0f172a" stroke-width="1.8"/>
<path d="M481,154 C495,176 496,202 481,210 C466,202 467,176 481,154 Z" fill="#f97316" fill-opacity="0.85"/>
<path d="M481,168 C489,182 489,200 481,208 C473,200 473,182 481,168 Z" fill="#fde047"/>
<line x1="452.0" y1="214.0" x2="452.0" y2="166.0" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<line x1="510.0" y1="214.0" x2="510.0" y2="166.0" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="481" y="261" font-size="10.6" fill="#1e293b" text-anchor="middle" font-weight="600">热气上浮拉成瘦长黄火苗</text>
<rect x="570" y="122" width="154" height="152" rx="8" fill="#eff6ff" stroke="#1d6fa5" stroke-width="1"/>
<text x="647" y="141" font-size="11.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">空间站火焰（~10⁻⁶ g）</text>
<rect x="639" y="218" width="16" height="28" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
<line x1="647.0" y1="198.0" x2="647.0" y2="218.0" stroke="#0f172a" stroke-width="1.8"/>
<circle cx="647" cy="194" r="24" fill="#3b82f6" fill-opacity="0.28" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="647" cy="194" r="14" fill="#60a5fa" fill-opacity="0.45"/>
<line x1="619.0" y1="172.0" x2="629.6" y2="180.4" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="2 2"/>
<line x1="675.0" y1="172.0" x2="664.4" y2="180.4" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="2 2"/>
<line x1="619.0" y1="210.0" x2="629.6" y2="203.9" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="2 2"/>
<line x1="675.0" y1="210.0" x2="664.4" y2="203.9" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="647" y="261" font-size="10.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">全向分子扩散成安静蓝球</text>
<rect x="404" y="286" width="320" height="96" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="416" y="306" font-size="11.6" fill="#18794e" text-anchor="start" font-weight="700">烧开水也一样（NASA 池沸腾实验）：</text>
<rect x="634" y="296" width="80" height="62" rx="6" fill="#ffffff" stroke="#18794e" stroke-width="1.2"/>
<line x1="643.0" y1="350.0" x2="705.0" y2="350.0" stroke="#c25014" stroke-width="2.6"/>
<circle cx="674" cy="329" r="17" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="674" y="333" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">大汽泡</text>
<text x="416" y="326" font-size="10.9" fill="#1e293b" text-anchor="start">• 地面：蒸汽泡受浮力迅速上浮破裂；</text>
<text x="416" y="346" font-size="10.9" fill="#1e293b" text-anchor="start">• 太空：气泡不往上跑，聚成一颗大汽泡</text>
<text x="416" y="365" font-size="10.7" fill="#64748b" text-anchor="start">  包住加热面（飞船须靠泵强制散热）</text>
</svg>
