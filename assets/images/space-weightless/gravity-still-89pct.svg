<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">400公里空间站真实高度比例与地球引力平方反比衰减曲线</title>
<desc id="desc">左图按统一比例绘制6371千米地球弧面与400千米空间站轨道，对应24厘米篮球外仅7.5毫米；右图绘制引力随高度衰减曲线，标出400千米处仍保留地表引力的88.5%，约8.69米每二次方秒。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <clipPath id="earth-limb-clip"><rect x="34" y="118" width="324" height="156" rx="8"/></clipPath>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="379" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">离地面 400 公里有多近？空间站处的地球引力还剩将近九成！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图按严格几何比例画出地球弧面与 400 km 轨道；右图按牛顿平方反比律计算引力随高度的真实衰减。</text>
<rect x="20" y="64" width="352" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">真实比例：400 km 只是贴着球皮飞</text>
<text x="36" y="108" font-size="11.2" fill="#64748b" text-anchor="start">同一把尺：1 像素 = 16.8 km（绝无视觉放大）</text>
<rect x="34" y="118" width="324" height="156" rx="8" fill="#0f172a"/>
<circle cx="54" cy="134" r="1.1" fill="#e2e8f0" opacity="0.65"/>
<circle cx="92" cy="148" r="0.9" fill="#e2e8f0" opacity="0.65"/>
<circle cx="138" cy="129" r="1.2" fill="#e2e8f0" opacity="0.65"/>
<circle cx="288" cy="132" r="1.0" fill="#e2e8f0" opacity="0.65"/>
<circle cx="334" cy="146" r="1.2" fill="#e2e8f0" opacity="0.65"/>
<circle cx="312" cy="168" r="0.9" fill="#e2e8f0" opacity="0.65"/>
<circle cx="66" cy="174" r="1.0" fill="#e2e8f0" opacity="0.65"/>
<g clip-path="url(#earth-limb-clip)">
<circle cx="196.0" cy="562.0" r="385.96" fill="#38bdf8" fill-opacity="0.22" stroke="#7dd3fc" stroke-width="0.9" stroke-dasharray="3 3"/>
<circle cx="196.0" cy="562.0" r="403.86" fill="none" stroke="#c25014" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="196.0" cy="562.0" r="380.00" fill="#1d6fa5" stroke="#93c5fd" stroke-width="1.5"/>
<circle cx="196.0" cy="562.0" r="370.00" fill="#165a8a" opacity="0.45"/>
</g>
<line x1="183.0" y1="158.1" x2="209.0" y2="158.1" stroke="#fbbf24" stroke-width="2.6"/>
<rect x="191.5" y="154.9" width="9" height="6.4" rx="1.5" fill="#ffffff" stroke="#c25014" stroke-width="1.2"/>
<line x1="196.0" y1="162.1" x2="196.0" y2="182.0" stroke="#fbbf24" stroke-width="1.4"/>
<text x="178.0" y="143" font-size="11.2" fill="#fde68a" text-anchor="end" font-weight="600">中国空间站 / ISS</text>
<line x1="212.0" y1="170.1" x2="232.0" y2="142.0" stroke="#fbbf24" stroke-width="1.1"/>
<text x="236" y="145" font-size="11.5" fill="#fbbf24" text-anchor="start" font-weight="700">h = 400 km</text>
<text x="236" y="161" font-size="10.6" fill="#cbd5e1" text-anchor="start">仅地球半径的 6.3%</text>
<text x="196" y="224" font-size="12.0" fill="#ffffff" text-anchor="middle" font-weight="700">地球平均半径 R_E = 6371 km</text>
<text x="196" y="245" font-size="11.2" fill="#e0f2fe" text-anchor="middle">轨道距地心 r = 6371 + 400 = 6771 km</text>
<text x="196" y="264" font-size="10.5" fill="#bae6fd" text-anchor="middle">（浅蓝虚线：100 km 卡门线大气层顶）</text>
<rect x="34" y="284" width="324" height="66" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="46" y="304" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">把地球缩成直径 24 cm 的标准篮球：</text>
<text x="46" y="324" font-size="11.8" fill="#1d6fa5" text-anchor="start" font-weight="700">空间站只贴在球皮外 7.5 毫米处飞驰！</text>
<text x="46" y="342" font-size="10.8" fill="#64748b" text-anchor="start">（对比：月球在 7.24 米外，远出将近 1000 倍）</text>
<rect x="388" y="64" width="352" height="300" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="84" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="406" y="88" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">平方反比律：400 km 处仍有 88.5% 引力</text>
<text x="404" y="108" font-size="11.2" fill="#64748b" text-anchor="start">g(h) / g(0) = [R_E / (R_E + h)]²，按地心距离 r 计算</text>
<line x1="438.0" y1="228.0" x2="718.0" y2="228.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="432.0" y="232.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">25%</text>
