<text x="432.0" y="198.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">50%</text>
<line x1="438.0" y1="160.0" x2="718.0" y2="160.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="432.0" y="164.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">75%</text>
<line x1="438.0" y1="126.0" x2="718.0" y2="126.0" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="432.0" y="130.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">100%</text>
<text x="432.0" y="266.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">0%</text>
<line x1="438.0" y1="126.0" x2="438.0" y2="262.0" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="438.0" y="277.0" font-size="10.5" fill="#64748b" text-anchor="middle" class="mono">0</text>
<line x1="508.0" y1="126.0" x2="508.0" y2="262.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="508.0" y="277.0" font-size="10.5" fill="#64748b" text-anchor="middle" class="mono">3000</text>
<line x1="586.7" y1="126.0" x2="586.7" y2="262.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="586.7" y="277.0" font-size="10.5" fill="#64748b" text-anchor="middle" class="mono">6371</text>
<line x1="718.0" y1="126.0" x2="718.0" y2="262.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="718.0" y="277.0" font-size="10.5" fill="#64748b" text-anchor="middle" class="mono">12000</text>
<text x="578.0" y="292.0" font-size="10.8" fill="#64748b" text-anchor="middle">离地高度 h（km）</text>
