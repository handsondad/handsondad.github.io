<text x="46" y="446" font-size="11.5" fill="#1e293b" text-anchor="start">GUE 正是量子力学厄米随机矩阵 Ĥ 的本征值统计！</text>
<text x="46" y="466" font-size="11.5" fill="#1e293b" text-anchor="start">若能构造自伴算符 Ĥ 使本征值恰等于 i(1/2 − ρ)，</text>
<text x="46" y="486" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">因自伴算符本征值必为实数，Re(ρ)=1/2 当场得证！</text>
