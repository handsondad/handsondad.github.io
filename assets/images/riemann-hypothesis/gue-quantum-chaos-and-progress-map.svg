<rect x="404" y="142" width="308" height="18" rx="9" fill="#e2e8f0"/>
<rect x="404" y="142" width="128.3" height="18" rx="9" fill="#18794e"/>
<text x="468.2" y="155" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">&gt; 41.7%</text>
<text x="704" y="155" font-size="11.5" fill="#475569" text-anchor="end" font-weight="600">目标 100%</text>
<text x="404" y="181" font-size="11.5" fill="#1e293b" text-anchor="start">• 1914 哈代：无穷多个 → 1942 塞尔伯格：正比例 (&gt;0%)</text>
<text x="404" y="200" font-size="11.5" fill="#1e293b" text-anchor="start">• 1974 莱文森：&gt;1/3 → 1989 康瑞：&gt;2/5 (40%)</text>
<text x="404" y="219" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 2020 Pratt 等四人合作定理：&gt; 5/12 (约 41.7%)！</text>
<rect x="392" y="244" width="334" height="134" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="404" y="265" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">战线② 刀锋常数与 2024 零点密度 52 年大破冰</text>
<text x="404" y="286" font-size="11.5" fill="#1e293b" text-anchor="start">• 德布鲁因-纽曼常数 Λ（黎曼猜想等价于 Λ ≤ 0）：</text>
<text x="404" y="305" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  2020 Rodgers &amp; Tao 证 Λ≥0；Polymath 压至 Λ≤0.2</text>
<text x="404" y="324" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">  → 若猜想为真，它也只是“毫厘不差悬在 Λ=0 刀锋上”！</text>
<text x="404" y="345" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 2024 Guth &amp; Maynard 打破 1972 年以来 52 年纪录：</text>
<text x="404" y="364" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">  将脱轨零点密度上界压低至 T^(30(1−σ)/13 + o(1))！</text>
<rect x="392" y="390" width="334" height="120" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
<text x="404" y="411" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">战线③ 超算严密核验纪录 &amp; “破解银行密码”辟谣</text>
<text x="404" y="432" font-size="11.5" fill="#1e293b" text-anchor="start">• 2021 Platt &amp; Trudgian 用区间算术严格证明：高度</text>
<text x="404" y="451" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  3×10¹² 内前 12,363,153,437,138 个零点 100% 在线上！</text>
<text x="404" y="472" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">• 辟谣：证出黎曼猜想绝不会让 RSA 密码瞬间崩溃！</text>
<text x="404" y="492" font-size="11.5" fill="#1e293b" text-anchor="start">  RSA 安全靠大整数分解难；广义黎曼猜想反而是造锁帮手。</text>
