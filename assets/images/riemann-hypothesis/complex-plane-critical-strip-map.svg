</style>
<rect x="0.5" y="0.5" width="759" height="529" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二、黎曼的复平面藏宝图：解析延拓如何跨过 s = 1 高墙，锁定“临界线”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">1859 年黎曼将 s 扩展为复数 σ + it：跨过 s = 1 极点后，所有“非平凡零点”被困在 0 &lt; σ &lt; 1 窄带内</text>
<rect x="20" y="64" width="446" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="76.0" width="418" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="243.0" y="91.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">A · 复平面 s = σ + it 全景地图（纵轴虚部压缩比例示意）</text>
<rect x="365.9" y="118" width="82.1" height="348" fill="#e7f6ee" fill-opacity="0.7"/>
<rect x="324.9" y="118" width="41.0" height="348" fill="#fef3c7" fill-opacity="0.65"/>
<rect x="54" y="118" width="270.9" height="348" fill="#f8fafc"/>
