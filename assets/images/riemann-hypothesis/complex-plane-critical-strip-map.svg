<text x="242.8" y="317.3" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">-2</text>
<line x1="324.9" y1="293.3" x2="324.9" y2="301.3" stroke="#0f172a" stroke-width="1.2"/>
<text x="319.9" y="315.3" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">0</text>
<line x1="365.9" y1="293.3" x2="365.9" y2="301.3" stroke="#0f172a" stroke-width="1.2"/>
<text x="370.9" y="315.3" font-size="11.5" fill="#64748b" text-anchor="start" class="mono">1</text>
<line x1="407.0" y1="293.3" x2="407.0" y2="301.3" stroke="#0f172a" stroke-width="1.2"/>
<text x="407.0" y="315.3" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">2</text>
<line x1="54" y1="455.5" x2="448" y2="455.5" stroke="#e2e8f0" stroke-width="0.7"/>
<text x="49" y="459.5" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">-30i</text>
<line x1="54" y1="402.7" x2="448" y2="402.7" stroke="#e2e8f0" stroke-width="0.7"/>
<text x="49" y="406.7" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">-20i</text>
<line x1="54" y1="350.0" x2="448" y2="350.0" stroke="#e2e8f0" stroke-width="0.7"/>
<text x="49" y="354.0" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">-10i</text>
<line x1="54" y1="244.5" x2="448" y2="244.5" stroke="#e2e8f0" stroke-width="0.7"/>
<text x="49" y="248.5" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">10i</text>
<line x1="54" y1="191.8" x2="448" y2="191.8" stroke="#e2e8f0" stroke-width="0.7"/>
<text x="49" y="195.8" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">20i</text>
<line x1="54" y1="139.1" x2="448" y2="139.1" stroke="#e2e8f0" stroke-width="0.7"/>
<text x="49" y="143.1" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">30i</text>
<line x1="345.4" y1="118" x2="345.4" y2="466" stroke="#6d28d9" stroke-width="2.6"/>
<text x="345.4" y="112" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">临界线 σ = 1/2</text>
<circle cx="345.4" cy="222.7" r="4.8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="345.4" cy="371.8" r="4.8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="345.4" cy="186.4" r="4.8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="345.4" cy="408.1" r="4.8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="345.4" cy="165.4" r="4.8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="345.4" cy="429.1" r="4.8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="345.4" cy="136.9" r="4.8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="345.4" cy="457.7" r="4.8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<text x="373.4" y="226.7" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700" class="halo">1/2 + 14.13i</text>
<text x="373.4" y="190.4" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="600" class="halo">1/2 + 21.02i</text>
<text x="373.4" y="375.8" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="600" class="halo">1/2 − 14.13i</text>
<circle cx="365.9" cy="297.3" r="6.2" fill="#b91c1c" stroke="#ffffff" stroke-width="1.6"/>
<text x="373.9" y="273.3" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700" class="halo">极点 s = 1</text>
<text x="373.9" y="289.3" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="600" class="halo">(ζ → ∞)</text>
<circle cx="242.8" cy="297.3" r="4.8" fill="#ffffff" stroke="#1d6fa5" stroke-width="2.2"/>
<circle cx="160.7" cy="297.3" r="4.8" fill="#ffffff" stroke="#1d6fa5" stroke-width="2.2"/>
<circle cx="78.6" cy="297.3" r="4.8" fill="#ffffff" stroke="#1d6fa5" stroke-width="2.2"/>
<text x="160.7" y="283.3" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">平凡零点 s = −2, −4, −6…</text>
<text x="160.7" y="335.3" font-size="11.5" fill="#64748b" text-anchor="middle">由函数方程 sin(πs/2) = 0 产生</text>
<text x="409.0" y="149.6" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">绝对收敛区</text>
<text x="409.0" y="173.4" font-size="11.5" fill="#18794e" text-anchor="middle">σ &gt; 1 无零点</text>
<text x="177.1" y="160.2" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">镜像反射半平面 σ &lt; 0</text>
<text x="177.1" y="185.5" font-size="11.5" fill="#1e293b" text-anchor="middle">完备函数 ξ(s) = ξ(1 − s)</text>
<text x="177.1" y="392.2" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">若猜想有反例 ρ 偏离 1/2：</text>
<text x="177.1" y="417.5" font-size="11.5" fill="#1e293b" text-anchor="middle">共轭与对称必逼出“四连点”！</text>
<text x="243" y="496" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">黎曼猜想核心断言：所有非平凡零点都严格钉在紫色直线 σ = 1/2 上！</text>
<rect x="478" y="64" width="262" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="492.0" y="76.0" width="234" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="609.0" y="91.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">B · 解析延拓三步跨墙术</text>
<rect x="492" y="112" width="234" height="94" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.1"/>
<text x="504" y="134" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">① 为什么 s ≤ 1 原公式会炸？</text>
<text x="504" y="155" font-size="11.5" fill="#1e293b" text-anchor="start">把 s = −1 直接塞进 1/n^s 会得到</text>
<text x="504" y="174" font-size="11.5" fill="#1e293b" text-anchor="start">1 + 2 + 3 + 4 + … → +∞ 发散！</text>
<text x="504" y="193" font-size="11.5" fill="#1e293b" text-anchor="start">原级数仅在右半平面 σ &gt; 1 有效。</text>
<rect x="492" y="218" width="234" height="114" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="504" y="240" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">② 第 1 跳：交错级数铺进临界带</text>
<text x="504" y="261" font-size="11.5" fill="#1e293b" text-anchor="start">构造 η(s) = 1 − 1/2^s + 1/3^s − …</text>
<text x="504" y="280" font-size="11.5" fill="#1e293b" text-anchor="start">它在 σ &gt; 0 处处收敛！利用恒等式</text>
<text x="504" y="299" font-size="11.5" fill="#1e293b" text-anchor="start">ζ(s) = η(s) / (1 − 2^(1−s)) 即可</text>
<text x="504" y="318" font-size="11.5" fill="#1e293b" text-anchor="start">合法算透整个临界带 0 &lt; σ &lt; 1！</text>
<rect x="492" y="344" width="234" height="114" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.1"/>
<text x="504" y="366" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">③ 第 2 跳：对称镜面铺满全平面</text>
<text x="504" y="387" font-size="11.5" fill="#1e293b" text-anchor="start">黎曼乘上伽马函数与 π^(-s/2) 配成</text>
<text x="504" y="406" font-size="11.5" fill="#1e293b" text-anchor="start">ξ(s) = ξ(1 − s)，关于 σ = 1/2 镜像！</text>
<text x="504" y="425" font-size="11.5" fill="#1e293b" text-anchor="start">注意：ζ(−1) = −1/12 是延拓函数值，</text>
<text x="504" y="444" font-size="11.5" fill="#1e293b" text-anchor="start">绝非普通加法把正整数加出负数！</text>
</svg>
