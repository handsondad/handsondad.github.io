<text x="649.4" y="374" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">6</text>
<line x1="683.7" y1="132" x2="683.7" y2="356" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="683.7" y="374" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">7</text>
<line x1="718.0" y1="132" x2="718.0" y2="356" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="718.0" y="374" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">8</text>
