    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、欧拉的“黄金钥匙”：算术基本定理怎样把整数加法变成素数连乘？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">1737 年欧拉恒等式：左端按 1, 2, 3… 逐项相加，右端只挑素数 2, 3, 5… 彼此相乘</text>
<rect x="20" y="64" width="388" height="440" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="76.0" width="360" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="214.0" y="91.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 等比级数展开 × 唯一素因子分解筛</text>
<rect x="34" y="110" width="360" height="58" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2"/>
<text x="214" y="132" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">ζ(s) = 1 + 1/2^s + 1/3^s + … = ∏ 1/(1 − p^(−s))</text>
<text x="214" y="154" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">等比展开：1/(1 − p^(−s)) = 1 + 1/p^s + 1/p^(2s) + …</text>
<rect x="34" y="180" width="360" height="54" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="46" y="200" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">素数 p = 2 括号</text>
<text x="382" y="200" font-size="11.5" fill="#1d6fa5" text-anchor="end" font-weight="700">s=2 时 = 4/3</text>
<rect x="46" y="206" width="64" height="22" rx="4" fill="#ffffff" stroke="#1d6fa5" stroke-width="0.9"/>
<text x="78" y="221" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">1</text>
<rect x="120" y="206" width="64" height="22" rx="4" fill="#ffffff" stroke="#1d6fa5" stroke-width="0.9"/>
<text x="152" y="221" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">1/2^s</text>
<rect x="194" y="206" width="64" height="22" rx="4" fill="#fff7ed" stroke="#c25014" stroke-width="1.6"/>
<text x="226" y="221" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700" class="mono">1/4^s</text>
<rect x="268" y="206" width="64" height="22" rx="4" fill="#ffffff" stroke="#1d6fa5" stroke-width="0.9"/>
<text x="300" y="221" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">1/8^s</text>
<text x="354" y="221" font-size="11.5" fill="#64748b" text-anchor="start" class="mono">+ …</text>
<rect x="34" y="244" width="360" height="54" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.1"/>
<text x="46" y="264" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">素数 p = 3 括号</text>
<text x="382" y="264" font-size="11.5" fill="#0f766e" text-anchor="end" font-weight="700">s=2 时 = 9/8</text>
<rect x="46" y="270" width="64" height="22" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="0.9"/>
<text x="78" y="285" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">1</text>
<rect x="120" y="270" width="64" height="22" rx="4" fill="#fff7ed" stroke="#c25014" stroke-width="1.6"/>
<text x="152" y="285" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700" class="mono">1/3^s</text>
<rect x="194" y="270" width="64" height="22" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="0.9"/>
<text x="226" y="285" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">1/9^s</text>
<rect x="268" y="270" width="64" height="22" rx="4" fill="#ffffff" stroke="#0f766e" stroke-width="0.9"/>
<text x="300" y="285" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">1/27^s</text>
<text x="354" y="285" font-size="11.5" fill="#64748b" text-anchor="start" class="mono">+ …</text>
<rect x="34" y="308" width="360" height="54" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.1"/>
<text x="46" y="328" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">素数 p = 5 括号</text>
<text x="382" y="328" font-size="11.5" fill="#6d28d9" text-anchor="end" font-weight="700">s=2 时 = 25/24</text>
<rect x="46" y="334" width="64" height="22" rx="4" fill="#fff7ed" stroke="#c25014" stroke-width="1.6"/>
<text x="78" y="349" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700" class="mono">1</text>
<rect x="120" y="334" width="64" height="22" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="0.9"/>
<text x="152" y="349" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">1/5^s</text>
<rect x="194" y="334" width="64" height="22" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="0.9"/>
<text x="226" y="349" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">1/25^s</text>
<rect x="268" y="334" width="64" height="22" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="0.9"/>
<text x="300" y="349" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600" class="mono">1/125^s</text>
<text x="354" y="349" font-size="11.5" fill="#64748b" text-anchor="start" class="mono">+ …</text>
<rect x="34" y="376" width="360" height="114" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="46" y="397" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">橙框示范：从每个素数括号各挑一项相乘，拼出 1/12^s：</text>
<text x="46" y="419" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700" class="mono">(1/4^s) × (1/3^s) × 1 × … = 1/(2²×3¹)^s = 1/12^s</text>
<text x="46" y="442" font-size="11.5" fill="#1e293b" text-anchor="start">• 算术基本定理保证每个自然数 n 拆法唯一 → 绝不重算漏算！</text>
<text x="46" y="464" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">• 令 s → 1⁺：左端调和级数冲向 +∞，迫使右端素数必须无穷多</text>
<text x="46" y="482" font-size="11.5" fill="#64748b" text-anchor="start">  （否则有限个有限分数相乘绝不可能等于无穷大！）</text>
<rect x="420" y="64" width="320" height="440" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="434.0" y="76.0" width="292" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="580.0" y="91.0" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">B · s = 2 收敛实测：素数连乘 vs 逐项累加</text>
