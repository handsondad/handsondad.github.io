<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">四、“素数的音乐”显式公式：零点怎样像傅里叶琴弦一样奏出素数阶梯？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">每个零点 ρ = β + iγ 贡献谐波 x^β cos(γ ln x)：虚部 γ 定频率，实部 β = 1/2 锁死 √x 误差界</text>
