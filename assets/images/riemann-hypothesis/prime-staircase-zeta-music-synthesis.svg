<text x="474" y="417" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">警钟：算一万亿个例子 ≠ 数学证明！</text>
<text x="474" y="438" font-size="11.5" fill="#1e293b" text-anchor="start">在人类能直接筛出的 10¹⁹ 内，素数个数</text>
<text x="474" y="457" font-size="11.5" fill="#1e293b" text-anchor="start">π(x) 永远小于高斯积分 Li(x)；但利特伍</text>
<text x="474" y="476" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">德严格证明：约 1.397×10³¹⁶ 处 π(x) 首次</text>
<text x="474" y="495" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">反超并无穷次换位！有限验证代替不了定理。</text>
