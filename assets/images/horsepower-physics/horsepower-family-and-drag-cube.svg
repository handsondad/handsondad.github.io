<rect x="0.5" y="0.5" width="759" height="397" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 5 · 马力家族换算账本与极速“三次方高墙”：马力翻倍为何极速远不能翻倍？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左看英制 hp、公制 PS 与空调“1 匹”的差别；右看高速风阻功率 P_drag ∝ v³ 的陡峭代价</text>
