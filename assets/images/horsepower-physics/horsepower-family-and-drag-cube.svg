<text x="340" y="292" font-size="12" fill="#c25014" text-anchor="end" font-weight="700">制冷 ≈2500 W</text>
<text x="44" y="310" font-size="10.5" fill="#1e293b" text-anchor="start">压缩机耗电 ≈735 W × 能效比 COP≈3.4</text>
