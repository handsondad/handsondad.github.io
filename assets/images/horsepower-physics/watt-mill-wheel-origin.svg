<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">瓦特定义1英制马力的历史推算与国际单位制745.7瓦换算图解</title>
<desc id="desc">左栏展示1782年木匠Wrigley提供的24英尺直径磨坊转轮参数，挽马以180磅力每分钟走2.5圈，瓦特取圆周率约为3算得32400并在1783年定为33000英尺磅每分钟；右栏展示等效每秒将550磅重物提升1英尺，精确折合745.70瓦特。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="389" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 1 · 瓦特怎么算出“1 马力”：从 24 英尺磨坊转轮到 550 英尺·磅力/秒</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">1782–1783 年瓦特计算簿手稿：把客户熟悉的挽马绕圈换算成蒸汽机统一定价标尺</text>
<rect x="20" y="64" width="352" height="252" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="76.0" width="264" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="164.0" y="91.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">① 1782.8 造纸磨坊木匠 Wrigley 的实测账</text>
<circle cx="100" cy="200" r="52" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4" stroke-dasharray="5,4"/>
<circle cx="100" cy="200" r="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<line x1="48" y1="200" x2="152" y2="200" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="100" y="216" font-size="11" fill="#64748b" text-anchor="middle" class="halo">直径 D = 24 ft</text>
<text x="100" y="232" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600" class="halo">每分钟走 2.5 圈</text>
<line x1="100" y1="192" x2="100" y2="148" stroke="#0f172a" stroke-width="2"/>
<circle cx="100" cy="148" r="5.5" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<line x1="106" y1="148" x2="166" y2="148" stroke="#c25014" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="112" y="136" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">切向拉力 180 lbf</text>
<text x="198" y="138" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">瓦特手稿按 π ≈ 3 粗算：</text>
<text x="198" y="159" font-size="11.5" fill="#1e293b" text-anchor="start">路程 = 24 × 3 × 2.5</text>
<text x="198" y="178" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">     = 180 ft / min</text>
<text x="198" y="200" font-size="11.5" fill="#1e293b" text-anchor="start">做功 = 180 × 180 lbf</text>
<text x="198" y="219" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">     = 32,400 ft·lbf/min</text>
<text x="198" y="241" font-size="11" fill="#64748b" text-anchor="start">（若按真 π 算为 33,929）</text>
<rect x="32" y="268" width="328" height="36" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="196" y="291" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">1783.9 凑成 60 的整倍数：33,000 ft·lbf/min</text>
<rect x="388" y="64" width="352" height="252" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="76.0" width="258" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="529.0" y="91.0" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">② 等效滑轮吊重定义（1 英制马力 hp）</text>
<line x1="422" y1="108" x2="490" y2="108" stroke="#475569" stroke-width="3"/>
<line x1="456" y1="108" x2="456" y2="130" stroke="#475569" stroke-width="2"/>
<circle cx="456" cy="130" r="14" fill="#e7f6ee" stroke="#18794e" stroke-width="1.8"/>
<circle cx="456" cy="130" r="3" fill="#18794e"/>
<line x1="442" y1="130" x2="412" y2="172" stroke="#0f172a" stroke-width="1.6"/>
<path d="M422 162 L406 178" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<line x1="470" y1="130" x2="470" y2="196" stroke="#0f172a" stroke-width="1.6"/>
<rect x="444" y="196" width="52" height="40" rx="5" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="470" y="214" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">550 lbf</text>
<text x="470" y="230" font-size="10.5" fill="#1e293b" text-anchor="middle">≈249.5kg</text>
<line x1="506" y1="234" x2="506" y2="196" stroke="#18794e" stroke-width="1.8" marker-end="url(#arr-green)"/>
<text x="460" y="255" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">1 秒匀速拎高 1 英尺 (0.3048 m)</text>
<text x="538" y="128" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">折合每秒：550 ft·lbf / s</text>
<text x="538" y="150" font-size="11" fill="#1e293b" text-anchor="start">• 1 ft = 0.3048 m</text>
<text x="538" y="170" font-size="11" fill="#1e293b" text-anchor="start">• 1 lb = 0.45359237 kg</text>
<text x="538" y="190" font-size="11" fill="#1e293b" text-anchor="start">• gₙ = 9.80665 m/s²</text>
<rect x="534" y="204" width="192" height="48" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="630" y="224" font-size="13" fill="#18794e" text-anchor="middle" font-weight="700">1 hp = 745.70 W</text>
<text x="630" y="243" font-size="11" fill="#1e293b" text-anchor="middle">每秒输出约 745.7 焦耳机械功</text>
<rect x="400" y="268" width="328" height="36" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="564" y="291" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">比普通马 8 小时均值高约 50%：宁可多给绝不虚标</text>
<rect x="20" y="328" width="720" height="48" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="36" y="357" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">商业算盘：真马干 6–8 小时就得歇班，蒸汽机却 24 小时连轴转——三班倒矿井里 1 台 10 马力机器能顶 20–30 匹真马！</text>
</svg>
