<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">力、功与功率的区别动画：0.25马力、1马力与3马力匀速吊起75千克重物升高4米的速度对比</title>
<desc id="desc">三台装置匀速提升同为75千克（拉力同为735.5牛）的重物升高4米（总功同为2942焦耳）：0.25公制马力速度0.25米每秒耗时16秒，1公制马力速度1米每秒耗时4秒，3公制马力速度3米每秒耗时1.33秒，直观展示马力衡量做功快慢而非拉力大小。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes liftCrate {
    from { transform: translateY(124.0px); }
    to   { transform: translateY(0px); }
  }
  @keyframes badgePop {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .crate-a { animation: liftCrate 4.00s linear 0.55s 1 backwards; }
  .crate-b { animation: liftCrate 1.00s linear 0.55s 1 backwards; }
  .crate-c { animation: liftCrate 0.333s linear 0.55s 1 backwards; }
  .done-a  { animation: badgePop 0.25s ease-out 4.55s 1 backwards; }
  .done-b  { animation: badgePop 0.25s ease-out 1.55s 1 backwards; }
  .done-c  { animation: badgePop 0.25s ease-out 0.88s 1 backwards; }
  @media (prefers-reduced-motion: reduce) {
    .crate-a, .crate-b, .crate-c, .done-a, .done-b, .done-c { animation: none !important; }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="389" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 3 · “力气一样大”为什么“马力差 12 倍”？同吊 75 kg 升 4 米的时间竞速</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">三根绳子拉力同为 735.5 N、总做功同为 2,942 J；动画按 4 倍速真实比例播放一次并停在终点</text>
<defs><clipPath id="hoist-shaft-clip"><rect x="70" y="122" width="380" height="170"/></clipPath></defs>
<rect x="20" y="64" width="444" height="266" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<line x1="74" y1="134" x2="444" y2="134" stroke="#18794e" stroke-width="1.2" stroke-dasharray="5,4"/>
<line x1="74" y1="288" x2="444" y2="288" stroke="#475569" stroke-width="1.4"/>
<text x="68" y="138" font-size="11" fill="#18794e" text-anchor="end" font-weight="700">4.0 m</text>
<text x="68" y="286" font-size="11" fill="#64748b" text-anchor="end">0.0 m</text>
<text x="134" y="86" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">A · 人力手摇</text>
<text x="134" y="103" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">0.25 PS (v = 0.25 m/s)</text>
<circle cx="134" cy="118" r="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<rect x="106" y="258" width="56" height="30" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="134" y1="254" x2="134" y2="170" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.45"/>
<g clip-path="url(#hoist-shaft-clip)">
  <g class="crate-a">
    <line x1="134" y1="-4" x2="134" y2="134" stroke="#475569" stroke-width="1.6"/>
    <rect x="106" y="134" width="56" height="30" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
    <text x="134" y="148" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">75 kg</text>
    <text x="134" y="160" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="600">735.5 N</text>
  </g>
</g>
<text x="134" y="312" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700" class="done-a">16.0 s 到顶</text>
<text x="256" y="86" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">B · 1 匹电机</text>
<text x="256" y="103" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">1.0 PS (v = 1.00 m/s)</text>
<circle cx="256" cy="118" r="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<rect x="228" y="258" width="56" height="30" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="256" y1="254" x2="256" y2="170" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.45"/>
<g clip-path="url(#hoist-shaft-clip)">
  <g class="crate-b">
    <line x1="256" y1="-4" x2="256" y2="134" stroke="#1d6fa5" stroke-width="1.6"/>
    <rect x="228" y="134" width="56" height="30" rx="5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.6"/>
    <text x="256" y="148" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">75 kg</text>
    <text x="256" y="160" font-size="9.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">735.5 N</text>
  </g>
</g>
<text x="256" y="312" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="done-b">4.0 s 到顶</text>
<text x="378" y="86" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">C · 3 匹卷扬</text>
<text x="378" y="103" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">3.0 PS (v = 3.00 m/s)</text>
<circle cx="378" cy="118" r="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<rect x="350" y="258" width="56" height="30" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="378" y1="254" x2="378" y2="170" stroke="#c25014" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.45"/>
<g clip-path="url(#hoist-shaft-clip)">
  <g class="crate-c">
    <line x1="378" y1="-4" x2="378" y2="134" stroke="#c25014" stroke-width="1.6"/>
    <rect x="350" y="134" width="56" height="30" rx="5" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
    <text x="378" y="148" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">75 kg</text>
    <text x="378" y="160" font-size="9.5" fill="#c25014" text-anchor="middle" font-weight="600">735.5 N</text>
  </g>
</g>
<text x="378" y="312" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700" class="done-c">1.33 s 到顶</text>
<rect x="480" y="64" width="260" height="266" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="494.0" y="76.0" width="206" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="597.0" y="91.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">核心辨析：力 ≠ 功 ≠ 功率</text>
<text x="496" y="118" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">① 绳子拉力 F（力气大小）：</text>
<text x="496" y="137" font-size="11.5" fill="#1e293b" text-anchor="start">匀速提升时 F = mg = 735.5 N</text>
<text x="496" y="155" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">→ A、B、C 三者拉力完全相等！</text>
<text x="496" y="184" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">② 搬运总做功 W（干活总量）：</text>
<text x="496" y="203" font-size="11.5" fill="#1e293b" text-anchor="start">W = F·Δh = 735.5 × 4 = 2,942 J</text>
<text x="496" y="221" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">→ A、B、C 干的总活完全相等！</text>
<text x="496" y="250" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">③ 功率 P（干活快慢 = 马力）：</text>
<text x="496" y="269" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">P = W ÷ t = F × v</text>
<text x="496" y="289" font-size="11" fill="#1e293b" text-anchor="start">• 1 PS 恰好 1 秒拎高 1 米 (735.5 W)</text>
<text x="496" y="308" font-size="11" fill="#1e293b" text-anchor="start">• 3 PS 速度快 3 倍，耗时缩为 1/3</text>
<rect x="20" y="342" width="720" height="36" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="36" y="365" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">记住这句话：小马达配大减速齿轮也能拉动千斤重物（力气大），但只有大马力机器才能把重物“飞快”拎上去（功率大）。</text>
</svg>
