<text x="514" y="277" font-size="11" fill="#1e293b" text-anchor="start">车速高时 F_轮 = η·P ÷ v，</text>
<text x="514" y="294" font-size="11" fill="#1e293b" text-anchor="start">峰值同为 272 PS，后段底气相当！</text>
<rect x="20" y="338" width="720" height="38" rx="10" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="36" y="362" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">骑车比喻秒懂：扭矩是“脚踩踏板那一下蹬多重”，转速是“每分钟踩几圈”，两者乘起来才是你往前冲的马力！</text>
