<title id="title">200千瓦电动汽车电机与2.0T涡轮增压发动机的扭矩与功率特性曲线对比</title>
<desc id="desc">横轴为0至7000转每分：蓝色电机在0至4775转为400牛米恒转矩区、功率线性升至200千瓦，随后进入200千瓦恒功率区；橙色2.0T发动机在1500至4500转维持380牛米扭矩平台，5000转以上达200千瓦峰值功率。</desc>
