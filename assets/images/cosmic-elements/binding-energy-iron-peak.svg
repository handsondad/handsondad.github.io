<text x="672.1" y="144.4" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700" class="halo">²³⁸U(7.57)</text>
<rect x="122" y="258" width="214" height="76" rx="8" fill="#ffffff" stroke="#c25014" stroke-width="1.3"/>
<text x="134" y="279" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">↖ 聚变放能上坡区（A &lt; 56）</text>
<text x="134" y="299" font-size="10.8" fill="#1e293b" text-anchor="start">轻核拼成重核 ⇒ 结合得更紧，</text>
<text x="134" y="318" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">多余质量按 ΔE=Δmc² 化作星光！</text>
<rect x="374" y="246" width="332" height="96" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.3"/>
<text x="386" y="267" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">↘ 铁后下坡区（A &gt; 56：金、铂、铅、铀）</text>
<text x="386" y="288" font-size="10.8" fill="#b91c1c" text-anchor="start" font-weight="600">• 往右强行聚变 = 倒贴巨额能量，恒星核心当场熄火坍缩！</text>
<text x="386" y="308" font-size="10.8" fill="#1e293b" text-anchor="start">• 往左核裂变（如 ²³⁸U/²³⁵U 裂回中等核）= 重新爬坡放能；</text>
<text x="386" y="328" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">• 造金和铀必须靠灾变现场倒贴能量“硬塞中子”！</text>
<text x="32" y="436" font-size="10.5" fill="#64748b" text-anchor="start">严谨注：单核子结合能绝对冠军其实是镍-62（8.795 MeV），铁-56（8.790 MeV）紧随第三；</text>
<text x="32" y="454" font-size="10.5" fill="#64748b" text-anchor="start">因大质量恒星硅燃烧沿 α 链直产双幻核镍-56 并经 β⁺ 衰变为铁-56，故宇宙元素丰度呈显著“铁峰”。</text>
</svg>
