<rect x="0.5" y="0.5" width="759" height="481" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">核物理第一铁律：比结合能曲线（B/A）为什么把恒星聚变死死卡在“铁-56”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">按 AME2020 实验核质量精确绘制：铁峰左侧“聚变放能”点亮恒星，铁峰右侧“聚变倒贴能量”立刻熄火</text>
