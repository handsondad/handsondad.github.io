<text x="186.0" y="158.0" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700" class="halo">He 氦壳层</text>
<text x="186.0" y="177.0" font-size="10" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">C 碳氧壳层</text>
