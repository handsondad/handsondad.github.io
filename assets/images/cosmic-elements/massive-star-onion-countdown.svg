<text x="186.0" y="293.0" font-size="9.8" fill="#6d28d9" text-anchor="middle" font-weight="700" class="halo">O 氧硅层</text>
<text x="186.0" y="276.0" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">Si 硅层</text>
<rect x="28" y="384" width="316" height="78" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="40" y="404" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">你血液里的铁，不全是大质量恒星造的！</text>
<text x="40" y="424" font-size="10.8" fill="#1e293b" text-anchor="start">• 大质量超新星：主要抛洒氧、镁、硅、钙 + 约 40% 铁；</text>
<text x="40" y="444" font-size="10.8" fill="#b91c1c" text-anchor="start" font-weight="700">• 白矮星 Ia 型热核整星殉爆：贡献太阳系约 60% 的铁！</text>
<rect x="368" y="68" width="376" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
