<text x="491.0" y="96.3" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="600">20 倍太阳质量恒星：燃料倒计时</text>
<text x="610" y="96" font-size="11.5" fill="#64748b" text-anchor="start">对数级死亡冲刺</text>
<rect x="380" y="118" width="352" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="380" y="118" width="210" height="34" rx="6" fill="#eaf4fb"/>
<text x="390" y="140" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">① 氢燃烧 → 氦</text>
<text x="544" y="140" font-size="10.8" fill="#64748b" text-anchor="start">≈ 0.4 亿 K</text>
<text x="722" y="140" font-size="11.2" fill="#1d6fa5" text-anchor="end" font-weight="700">≈ 1,000 万年</text>
<rect x="380" y="159" width="352" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="380" y="159" width="176" height="34" rx="6" fill="#f0fdfa"/>
<text x="390" y="181" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">② 氦燃烧 → 碳、氧</text>
<text x="544" y="181" font-size="10.8" fill="#64748b" text-anchor="start">≈ 2 亿 K</text>
<text x="722" y="181" font-size="11.2" fill="#0f766e" text-anchor="end" font-weight="700">≈ 100 万年</text>
<rect x="380" y="200" width="352" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="380" y="200" width="128" height="34" rx="6" fill="#e7f6ee"/>
<text x="390" y="222" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">③ 碳燃烧 → 氖、镁</text>
<text x="544" y="222" font-size="10.8" fill="#64748b" text-anchor="start">≈ 8 亿 K</text>
<text x="722" y="222" font-size="11.2" fill="#18794e" text-anchor="end" font-weight="700">≈ 600–1,000 年</text>
<rect x="380" y="241" width="352" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="380" y="241" width="92" height="34" rx="6" fill="#fffbeb"/>
<text x="390" y="263" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">④ 氖燃烧 → 氧、镁</text>
<text x="544" y="263" font-size="10.8" fill="#64748b" text-anchor="start">≈ 15 亿 K</text>
<text x="722" y="263" font-size="11.2" fill="#b45309" text-anchor="end" font-weight="700">≈ 1 年</text>
<rect x="380" y="282" width="352" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="380" y="282" width="68" height="34" rx="6" fill="#fef1e8"/>
<text x="390" y="304" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">⑤ 氧燃烧 → 硅、硫</text>
<text x="544" y="304" font-size="10.8" fill="#64748b" text-anchor="start">≈ 20 亿 K</text>
<text x="722" y="304" font-size="11.2" fill="#c25014" text-anchor="end" font-weight="700">≈ 6 个月</text>
<rect x="380" y="323" width="352" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="380" y="323" width="38" height="34" rx="6" fill="#f3e8ff"/>
<text x="390" y="345" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">⑥ 硅燃烧 → 镍/铁</text>
<text x="544" y="345" font-size="10.8" fill="#64748b" text-anchor="start">≈ 35 亿 K</text>
<text x="722" y="345" font-size="11.2" fill="#6d28d9" text-anchor="end" font-weight="700">仅 ≈ 1 天（24h）!</text>
<rect x="380" y="364" width="352" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="380" y="364" width="16" height="34" rx="6" fill="#fef2f2"/>
<text x="390" y="386" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">⑦ 铁核超 1.4 M☉ 坍缩</text>
<text x="544" y="386" font-size="10.8" fill="#64748b" text-anchor="start">&gt; 50 亿 K</text>
<text x="722" y="386" font-size="11.2" fill="#b91c1c" text-anchor="end" font-weight="700">不到 1 秒 ⇒ 超新星!</text>
<rect x="380" y="410" width="352" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="392" y="430" font-size="11.2" fill="#b45309" text-anchor="start" font-weight="700">为什么越往后烧得越快？双重催命符：</text>
<text x="392" y="449" font-size="10.8" fill="#1e293b" text-anchor="start">重核每核子释能骤降 + 99% 热量被穿墙而过的“中微子”瞬间偷走！</text>
</svg>
