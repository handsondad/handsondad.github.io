    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="491" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">大质量恒星（≈20 M☉）的“洋葱圈”炼金炉与疯狂加速的死亡倒计时</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图分层为示意半径（真实硅铁核心仅地球大小）；右图展示中微子逃逸如何把最后硅聚变压缩到仅 1 天</text>
<rect x="16" y="68" width="340" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="28.0" y="80.0" width="234" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="145.0" y="96.3" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">临终前的同心“元素洋葱”（示意比例）</text>
<circle cx="186.0" cy="248.0" r="124" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
