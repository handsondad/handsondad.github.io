<text x="67.0" y="409.0" font-size="8.8" fill="#64748b" text-anchor="middle" font-weight="700" class="mono">0</text>
<text x="93.0" y="409.0" font-size="8.8" fill="#64748b" text-anchor="middle" font-weight="700" class="mono">0</text>
<text x="119.0" y="409.0" font-size="8.8" fill="#64748b" text-anchor="middle" font-weight="700" class="mono">0</text>
