<text x="171.0" y="409.0" font-size="8.8" fill="#64748b" text-anchor="middle" font-weight="700" class="mono">0</text>
<text x="206" y="344" font-size="8.7" fill="#0f172a" text-anchor="start" font-weight="700">特征多项式：</text>
<text x="206" y="361" font-size="8.8" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">det(xI − C) = x⁵ − x − 1</text>
<text x="206" y="382" font-size="8.7" fill="#1e293b" text-anchor="start">用正交 QR 算法求 5 个特征值：</text>
<text x="206" y="399" font-size="8.7" fill="#1e293b" text-anchor="start">数值极稳、不炸误差，一次吐出</text>
<text x="206" y="416" font-size="8.7" fill="#18794e" text-anchor="start" font-weight="700">全部 5 颗复根（耗时 &lt; 0.05 ms）！</text>
<rect x="384" y="278" width="342" height="156" rx="7" fill="#f8fafc" stroke="#18794e" stroke-width="1.1"/>
<text x="396" y="297" font-size="9.1" fill="#18794e" text-anchor="start" font-weight="700">牛顿切线迭代 xₙ₊₁ = xₙ − f(xₙ)/f&#x27;(xₙ)（初值 x₀ = 1.2）：</text>
<text x="396" y="314" font-size="8.7" fill="#1e293b" text-anchor="start">每算一步，正确小数位数【直接翻倍】（二阶收敛）！</text>
