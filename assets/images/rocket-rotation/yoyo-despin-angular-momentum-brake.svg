<polyline points="676.6,341.0 679.4,343.1 682.2,345.2 684.9,347.2 687.7,349.3 690.4,351.3 693.2,353.2 695.9,355.2 698.7,357.1 701.5,359.0 704.2,360.9 707.0,362.8 709.7,364.6 712.5,366.4 715.2,368.2 718.0,370.0" fill="none" stroke="#c25014" stroke-width="2.4" stroke-dasharray="5,3"/>
<circle cx="676.6" cy="341.0" r="6" fill="#18794e" stroke="#ffffff" stroke-width="1.8"/>
<text x="668.6" y="329.0" font-size="10.5" fill="#18794e" text-anchor="end" font-weight="700" class="halo">ℓ* = 3.57 m 脱钩点（耗时 1.14 s！）</text>
<text x="714.0" y="389.4" font-size="10.5" fill="#c25014" text-anchor="end" font-weight="700" class="halo">若不脱钩甚至能倒转！</text>
<rect x="400" y="434" width="322" height="62" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
<text x="561" y="456" font-size="10.6" fill="#6d28d9" text-anchor="middle" font-weight="700">代表作：火星探路者号、黎明号、新视野号第三级</text>
<text x="561" y="477" font-size="10.5" fill="#0f172a" text-anchor="middle">与全球数千枚探空火箭——纯牛顿力学的极致浪漫！</text>
