<svg xmlns="http://www.w3.org/2000/svg" width="760" height="528" viewBox="0 0 760 528" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">NASA溜溜球减旋机构角动量转移三步原理与转速衰减精确曲线图</title>
<desc id="desc">左栏分三步图解两颗1公斤配重锤沿切向甩出3.57米钢索抽干200公斤飞船60转每分自旋的过程，右栏绘制精确解析解曲线并标出1.14秒零转速脱钩点与过放反转区。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#1d6fa5"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#c25014"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#18794e"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#6d28d9"/>
    </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="527" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">第四重旋转：在没有空气的真空里，两颗 1 公斤小铁球如何 1 秒刹停 200 公斤飞船？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">NASA“溜溜球减旋机构（Yo-Yo De-spin）”：不烧一滴推进剂，靠钢索甩开暴涨转动惯量，把全身角动量一把抽干！</text>
<rect x="22" y="68" width="348" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="92" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="42" y="96" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="97" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">三步无燃料急刹动作分解（俯视图）</text>
<text x="42" y="117" font-size="10.5" fill="#64748b" text-anchor="start">类似花样滑冰运动员突然把双臂伸长 7 倍并脱手甩出！</text>
<rect x="38" y="134" width="316" height="108" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="50" y="154" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">① 解锁前：钢索紧缠腰部，探测器 60 rpm 高速自旋</text>
<circle cx="114" cy="198" r="24" fill="#dbeafe" stroke="#1d6fa5" stroke-width="2"/>
<circle cx="90" cy="198" r="4.5" fill="#c25014"/>
<circle cx="138" cy="198" r="4.5" fill="#c25014"/>
<text x="160" y="192" font-size="10.5" fill="#1e293b" text-anchor="start">飞船 M = 200 kg, R = 0.5 m</text>
<text x="160" y="212" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">配重锤 2 × 1 kg（仅占总重 1%！）</text>
<rect x="38" y="254" width="316" height="116" rx="8" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<text x="50" y="274" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">② 甩开中：离心力拉出切向钢索，配重惯量 m·r² 暴涨</text>
<circle cx="114" cy="322" r="20" fill="#dbeafe" stroke="#1d6fa5" stroke-width="2"/>
<line x1="114" y1="302" x2="58" y2="302" stroke="#c25014" stroke-width="2"/>
<circle cx="58" cy="302" r="5" fill="#c25014"/>
<line x1="114" y1="342" x2="170" y2="342" stroke="#c25014" stroke-width="2"/>
<circle cx="170" cy="342" r="5" fill="#c25014"/>
<text x="184" y="314" font-size="10.5" fill="#0f172a" text-anchor="start">钢索张力对舱体施加反向制动力矩，</text>
<text x="184" y="334" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">角动量源源不断抽进两颗小铁球！</text>
<rect x="38" y="382" width="316" height="112" rx="8" fill="#e7f6ee" stroke="#86efac" stroke-width="1"/>
<text x="50" y="402" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="700">③ 精准脱钩：钢索走到底（3.57 m）自动滑脱飞走！</text>
<circle cx="114" cy="450" r="20" fill="#dcfce7" stroke="#18794e" stroke-width="2.2"/>
<text x="114" y="454" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">0 rpm</text>
<circle cx="52" cy="424" r="4.5" fill="#c25014"/>
<line x1="52" y1="424" x2="32" y2="424" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-o)"/>
<circle cx="176" cy="476" r="4.5" fill="#c25014"/>
<line x1="176" y1="476" x2="196" y2="476" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-o)"/>
<text x="198" y="444" font-size="10.5" fill="#0f172a" text-anchor="start">两颗铁球揣走 100% 角动量远去，</text>
<text x="198" y="464" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">200 kg 探测器仅 1.14 秒稳稳停住！</text>
<rect x="384" y="68" width="354" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="404" cy="92" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="404" y="96" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="97" font-size="11.6" fill="#0f172a" text-anchor="start" font-weight="700">精确解析解曲线：ω(θ)/ω₀ = (K − θ²)/(K + θ²)</text>
<text x="404" y="117" font-size="10.5" fill="#64748b" text-anchor="start">算例参数 K = I/(2mR²) + 1 = 51，零转速点 θ* = √51 ≈ 7.14 弧度</text>
<line x1="442.0" y1="161.0" x2="718.0" y2="161.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="436.0" y="165.0" font-size="10.5" fill="#64748b" text-anchor="end">+100%</text>
<line x1="442.0" y1="251.0" x2="718.0" y2="251.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="436.0" y="255.0" font-size="10.5" fill="#64748b" text-anchor="end">+50%</text>
<line x1="442.0" y1="341.0" x2="718.0" y2="341.0" stroke="#18794e" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="436.0" y="345.0" font-size="10.5" fill="#18794e" text-anchor="end" font-weight="700">0</text>
<line x1="442.0" y1="377.0" x2="718.0" y2="377.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="436.0" y="381.0" font-size="10.5" fill="#64748b" text-anchor="end">-20%</text>
<line x1="442.0" y1="152.0" x2="442.0" y2="386.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="442.0" y="404.0" font-size="10.5" fill="#64748b" text-anchor="middle">0m</text>
<line x1="507.7" y1="152.0" x2="507.7" y2="386.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="507.7" y="404.0" font-size="10.5" fill="#64748b" text-anchor="middle">1m</text>
<line x1="573.4" y1="152.0" x2="573.4" y2="386.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="573.4" y="404.0" font-size="10.5" fill="#64748b" text-anchor="middle">2m</text>
<line x1="639.1" y1="152.0" x2="639.1" y2="386.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="639.1" y="404.0" font-size="10.5" fill="#64748b" text-anchor="middle">3m</text>
<line x1="704.9" y1="152.0" x2="704.9" y2="386.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="704.9" y="404.0" font-size="10.5" fill="#64748b" text-anchor="middle">4m</text>
<line x1="442.0" y1="152.0" x2="442.0" y2="386.0" stroke="#475569" stroke-width="1.5"/>
<line x1="442.0" y1="386.0" x2="718.0" y2="386.0" stroke="#475569" stroke-width="1.5"/>
<text x="580.0" y="422.0" font-size="10.5" fill="#1e293b" text-anchor="middle">放出的钢索长度 ℓ = R·θ（米）</text>
