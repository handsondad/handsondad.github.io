<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">罗默木卫一蚀延误测光速几何原理与惠更斯首次数值换算图</title>
<desc id="desc">左侧展示木卫一从木星阴影出现的光脉冲传向地球近点B与远点C的路程差及等速传播时间差演示；右侧严格区分1676年罗默测出22分钟轨道横穿时间与惠更斯在《光论》中算出约21.4万千米每秒首个光速数值的史实。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .pulse-near {
    stroke-dasharray: 168.1;
    stroke-dashoffset: 168.1;
    animation: shootNear 1.77s linear 0.3s 1 forwards;
  }
  .pulse-far {
    stroke-dasharray: 288.9;
    stroke-dashoffset: 288.9;
    animation: shootFar 3.04s linear 0.3s 1 forwards;
  }
  @keyframes shootNear { to { stroke-dashoffset: 0; } }
  @keyframes shootFar { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .pulse-near, .pulse-far { animation: none; stroke-dashoffset: 0; }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="535" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">向太阳系借一把三亿公里的大尺子：罗默“木卫一蚀延误”与惠更斯换算</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">地面基线太短，天文学家干脆拿地球公转轨道直径（2 AU ≈ 3 亿 km）把微秒级延迟放大成十几分钟！</text>
<rect x="24" y="66" width="396" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="92" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">一、木卫一（Io）出蚀光信号的路程差（轨道比例示意）</text>
<rect x="38" y="106" width="368" height="272" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="134" cy="298" r="70" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="5 4"/>
<circle cx="134" cy="298" r="13" fill="#fde047" stroke="#c25014" stroke-width="1.5"/>
<text x="134" y="302" font-size="10" fill="#c25014" text-anchor="middle" font-weight="700">太阳</text>
<text x="134" y="384" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">地球公转轨道（直径 2 AU ≈ 3 亿 km）</text>
<polygon points="356,180 402,172 402,200 356,212" fill="#cbd5e1" opacity="0.65"/>
<circle cx="356" cy="196" r="17" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
<text x="356" y="200" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">木星</text>
<ellipse cx="356" cy="196" rx="34" ry="28" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="356" cy="224" r="5.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="350" y="242" font-size="10.2" fill="#6d28d9" text-anchor="end" font-weight="700" class="halo">木卫一（周期 42.5h）</text>
<line x1="356.0" y1="224.0" x2="191.3" y2="257.8" stroke="#93c5fd" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="356.0" y1="224.0" x2="70.6" y2="268.4" stroke="#fdba74" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="356.0" y1="224.0" x2="191.3" y2="257.8" class="pulse-near" stroke="#1d6fa5" stroke-width="2.8" marker-end="url(#arr-blue)"/>
<line x1="356.0" y1="224.0" x2="70.6" y2="268.4" class="pulse-far" stroke="#c25014" stroke-width="2.8" marker-end="url(#arr-orange)"/>
<circle cx="191.3" cy="257.8" r="7.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="203.3" y="273.8" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">近点 B（准时见蚀）</text>
<circle cx="70.6" cy="268.4" r="7.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
<text x="72.6" y="255.4" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">远点 C（迟到！）</text>
<text x="198" y="132" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">多跑整条轨道直径 ΔL → 信号系统性迟到！</text>
<rect x="38" y="390" width="368" height="114" rx="8" fill="#fffdf9" stroke="#1d6fa5" stroke-width="1"/>
<text x="52" y="412" font-size="11.6" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么盯住“木卫一”就能当太空秒表？</text>
<text x="52" y="434" font-size="10.8" fill="#1e293b" text-anchor="start">• 木卫一每 42.5 小时钻进木星阴影一次，极其守时；</text>
<text x="52" y="455" font-size="10.8" fill="#1e293b" text-anchor="start">• 当地球从 B 公转远离至 C，连续几十次食的观测时刻越</text>
<text x="52" y="476" font-size="10.8" fill="#1e293b" text-anchor="start">  积越晚（靠近时又逐次提前）——铁证光传播需要时间！</text>
<text x="52" y="495" font-size="10" fill="#64748b" text-anchor="start">  （注：天体间距为非等比例示意；光束动画严格按等速计时）</text>
<rect x="434" y="66" width="302" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="452" y="92" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">二、史实辨析：谁测时间，谁算速度？</text>
<rect x="450" y="108" width="270" height="174" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<circle cx="468" cy="130" r="9.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="468" y="134" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="484" y="134" font-size="11.8" fill="#1d6fa5" text-anchor="start" font-weight="700">罗默（Ole Rømer，1676 论文）</text>
<text x="462" y="158" font-size="10.8" fill="#1e293b" text-anchor="start">• 巴黎天文台十年观测，成功预言 1676 年</text>
<text x="462" y="178" font-size="10.8" fill="#1e293b" text-anchor="start">  11 月木卫一重现将比旧历表推迟 10 分钟；</text>
<text x="462" y="200" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">• 推算光横穿地球轨道直径需 约 22 分钟</text>
<text x="462" y="220" font-size="10.8" fill="#1e293b" text-anchor="start">  （现代精确值为 16 分 38 秒 ＝ 998 秒）；</text>
<text x="462" y="242" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="600">• 纠偏：罗默本人只证明了光速有限并给出</text>
<text x="462" y="262" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="600">  22 分钟耗时，并未写出 km/s 速度数值！</text>
<line x1="585" y1="282" x2="585" y2="300" stroke="#18794e" stroke-width="1.6" marker-end="url(#arr-green)"/>
<rect x="450" y="302" width="270" height="202" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<circle cx="468" cy="324" r="9.5" fill="#ffffff" stroke="#18794e" stroke-width="1.2"/>
<text x="468" y="328" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">2</text>
<text x="484" y="328" font-size="11.8" fill="#18794e" text-anchor="start" font-weight="700">惠更斯（Huygens，1678/1690）</text>
<text x="462" y="352" font-size="10.8" fill="#1e293b" text-anchor="start">• 在名著《光论》第一章完成首次除法：</text>
<text x="462" y="374" font-size="10.8" fill="#1e293b" text-anchor="start">  取轨道直径 ≈ 22,000 个地球直径，除以</text>
<text x="462" y="394" font-size="10.8" fill="#1e293b" text-anchor="start">  22 分钟 ＝ 每秒跑 16.7 个地球直径！</text>
<text x="462" y="416" font-size="10.8" fill="#1e293b" text-anchor="start">• 代入皮卡尔 1669 年测得的地球周长：</text>
<rect x="462.0" y="428.0" width="244" height="24" rx="12.0" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="584.0" y="444.3" font-size="11.2" fill="#18794e" text-anchor="middle" font-weight="600">人类首个光速值 ≈ 214,000 km/s</text>
<text x="462" y="472" font-size="10.5" fill="#64748b" text-anchor="start">• 虽因当年日地距离与 22 分钟偏粗而偏低</text>
<text x="462" y="490" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">  约 28%，却首次命中 10^8 m/s 正确数量级！</text>
</svg>
