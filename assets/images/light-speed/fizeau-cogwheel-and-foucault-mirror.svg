<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">斐索1849年旋转齿轮法与傅科1850至1862年旋转平面镜法测光速对比图</title>
<desc id="desc">上图展示斐索用720齿旋转齿轮跨越8633米基线在12.6转每秒首次遮住回光测得31.33万千米每秒；下图展示傅科用800转每秒气动旋转镜在20米室内光程测偏转角2α，既证明水中光速慢于空气又在1862年测得29.8万千米每秒。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="547" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">把三亿公里星际跑道搬回地面：斐索旋转齿轮（1849）与傅科旋转镜（1850/1862）</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">不再仰望木星与恒星！一对巴黎科学搭档兼对手，用高速机械快门与偏转镜在地球上驯服光速</text>
<rect x="24" y="66" width="712" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="44" cy="90" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="44" y="94" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="95" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">1849 年斐索（Fizeau）720 齿高速齿轮：人类史上第一次地面直接测光速！</text>
<rect x="40" y="108" width="406" height="166" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="72" cy="156" r="9" fill="#fde047" stroke="#c25014" stroke-width="1.4"/>
<text x="72" y="138" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">光源</text>
<line x1="81" y1="156" x2="122" y2="156" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<line x1="118" y1="174" x2="142" y2="198" stroke="#1d6fa5" stroke-width="2.4"/>
<line x1="130" y1="156" x2="130" y2="186" stroke="#c25014" stroke-width="1.6"/>
<text x="82" y="228" font-size="10.2" fill="#475569" text-anchor="middle" font-weight="600">目镜观察</text>
<line x1="124" y1="186" x2="96" y2="212" stroke="#475569" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="196" cy="186" r="26" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.8"/>
<line x1="221.0" y1="186.0" x2="228.0" y2="186.0" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="217.7" y1="198.5" x2="223.7" y2="202.0" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="208.5" y1="207.7" x2="212.0" y2="213.7" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="196.0" y1="211.0" x2="196.0" y2="218.0" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="183.5" y1="207.7" x2="180.0" y2="213.7" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="174.3" y1="198.5" x2="168.3" y2="202.0" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="171.0" y1="186.0" x2="164.0" y2="186.0" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="174.3" y1="173.5" x2="168.3" y2="170.0" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="183.5" y1="164.3" x2="180.0" y2="158.3" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="196.0" y1="161.0" x2="196.0" y2="154.0" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="208.5" y1="164.3" x2="212.0" y2="158.3" stroke="#1d6fa5" stroke-width="3.2"/>
<line x1="217.7" y1="173.5" x2="223.7" y2="170.0" stroke="#1d6fa5" stroke-width="3.2"/>
<text x="196" y="236" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">720 齿齿轮</text>
<text x="196" y="253" font-size="10.2" fill="#64748b" text-anchor="middle">12.6 转/秒</text>
<line x1="232" y1="178" x2="408" y2="178" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<line x1="408" y1="194" x2="232" y2="194" stroke="#18794e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-green)"/>
<rect x="412" y="164" width="8" height="44" rx="2" fill="#475569" stroke="#0f172a" stroke-width="1.2"/>
<text x="322" y="166" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="600">去程：穿过齿缝飞越巴黎西郊</text>
<text x="322" y="214" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700">回程：恰被转来的相邻齿牙挡死！</text>
<text x="322" y="253" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">单程 d = 8,633 m（往返 17.266 km）</text>
<rect x="460" y="108" width="260" height="166" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="476" y="132" font-size="11.6" fill="#1d6fa5" text-anchor="start" font-weight="700">消光计时算账（首次变黑条件）：</text>
<text x="476" y="155" font-size="10.8" fill="#1e293b" text-anchor="start">• 从“齿缝”转到“紧邻齿牙”只需转过</text>
<text x="476" y="175" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">  1/(2N) = 1/1440 圈！</text>
<text x="476" y="197" font-size="10.8" fill="#1e293b" text-anchor="start">• 往返时间 Δt = 1/(2Nf) ≈ 55.1 微秒</text>
<text x="476" y="219" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">• 公式：c = 2d / Δt = 4 N d f</text>
<rect x="476.0" y="234.0" width="228" height="24" rx="12.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="590.0" y="250.3" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">测得 c ≈ 313,300 km/s（偏高 ~4.5%）</text>
<rect x="24" y="304" width="712" height="228" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="44" cy="328" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="44" y="332" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="62" y="333" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="700">1850/1862 年傅科（Foucault）高速涡轮旋转镜：装进实验室房间，一剑封喉微粒说！</text>
<rect x="40" y="346" width="406" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="76" cy="404" r="8" fill="#fde047" stroke="#c25014" stroke-width="1.4"/>
<text x="76" y="388" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">光源</text>
<line x1="84" y1="404" x2="192" y2="404" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<line x1="192" y1="418" x2="220" y2="390" stroke="#475569" stroke-width="2.5" stroke-dasharray="3 2"/>
<line x1="196" y1="421" x2="216" y2="387" stroke="#c25014" stroke-width="2.8"/>
<text x="206" y="372" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">气动旋转镜（800 转/秒）</text>
<text x="206" y="444" font-size="10.2" fill="#6d28d9" text-anchor="middle" font-weight="600">光往返间转过微角 α</text>
<line x1="218" y1="398" x2="388" y2="398" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<line x1="388" y1="412" x2="218" y2="412" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-muted)"/>
<path d="M394,378 Q408,404 394,430" fill="none" stroke="#1d6fa5" stroke-width="3"/>
<text x="308" y="386" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">室内折返光程仅 20 m（可插入水管！）</text>
<line x1="196" y1="412" x2="90" y2="466" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr-muted)"/>
<text x="144" y="466" font-size="10.4" fill="#6d28d9" text-anchor="middle" font-weight="700" class="halo">反射光偏转 2α → 像移 0.7 mm</text>
<text x="243" y="502" font-size="10.4" fill="#64748b" text-anchor="middle">把“卡死时间点”升级为“连续测量微小偏角”，精度暴涨！</text>
<rect x="460" y="346" width="260" height="170" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="476" y="370" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">傅科转镜改写物理学史的两记重锤：</text>
<text x="476" y="394" font-size="10.8" fill="#1e293b" text-anchor="start">① 1850 水中光速判决实验：测出光在水</text>
<text x="476" y="414" font-size="10.8" fill="#1e293b" text-anchor="start">   中速度仅为空气的 3/4，当场宣判牛顿</text>
<text x="476" y="434" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">   “微粒说（入水加速）”死刑！</text>
<text x="476" y="456" font-size="11" fill="#c25014" text-anchor="start" font-weight="700">② 1862 精密值：298,000 ± 500 km/s</text>
<text x="476" y="476" font-size="10.6" fill="#1e293b" text-anchor="start">   误差仅 0.6%！恰与麦克斯韦纯电磁算</text>
<text x="476" y="496" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="700">   出的波速吻合，证实“光就是电磁波”！</text>
</svg>
