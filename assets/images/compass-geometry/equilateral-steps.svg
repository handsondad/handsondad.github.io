<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1789" viewBox="0 0 720 1789" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">① 两个圆，生出一个等边三角形</title><desc id="desc">圆心 A，开口 AB，画第一个圆；圆心 B，同样开口，取上方交点 C；连接 AC、BC，保留底边 AB；C 在两圆上：AC = AB，BC = AB。；所以三边相等；下方交点也能给出另一个解。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1789" fill="#f3f7fa"/><text x="36" y="50" font-size="29" fill="#172b45" text-anchor="start">① 两个圆，生出一个等边三角形</text><text x="36" y="91" font-size="22" fill="#172b45" text-anchor="start">虚线：辅助圆弧或辅助线　实线：本步重点</text><rect x="24" y="120" width="672" height="495" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="162" font-size="24" fill="#172b45" text-anchor="start">1  圆心 A，开口 AB，画第一个圆</text><path d="M273.000,395.000 L447.000,395.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M447.000,395.000 L446.894,388.927 L446.576,382.862 L446.047,376.812 L445.307,370.784 L444.357,364.785 L443.198,358.823 L441.831,352.906 L440.260,347.039 L438.484,341.231 L436.507,335.488 L434.330,329.818 L431.957,324.228 L429.390,318.723 L426.633,313.312 L423.688,308.000 L420.560,302.794 L417.253,297.700 L413.769,292.725 L410.114,287.875 L406.292,283.155 L402.307,278.571 L398.165,274.129 L393.871,269.835 L389.429,265.693 L384.845,261.708 L380.125,257.886 L375.275,254.231 L370.300,250.747 L365.206,247.440 L360.000,244.312 L354.688,241.367 L349.277,238.610 L343.772,236.043 L338.182,233.670 L332.512,231.493 L326.769,229.516 L320.961,227.740 L315.094,226.169 L309.177,224.802 L303.215,223.643 L297.216,222.693 L291.188,221.953 L285.138,221.424 L279.073,221.106 L273.000,221.000 L266.927,221.106 L260.862,221.424 L254.812,221.953 L248.784,222.693 L242.785,223.643 L236.823,224.802 L230.906,226.169 L225.039,227.740