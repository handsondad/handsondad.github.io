<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1341.75" viewBox="0 0 540 1341.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">⑧ 三等分一条线：不用读尺上的数字</title><desc id="desc">从 A 作一条斜射线，连续截取三段等长；连接第三个点 P3 与端点 B；过 P1、P2 作 P3B 的平行线，截 AB；相似三角形给出 AX : AB = 1 : 3。；同样可以分成 5 份、7 份；这不是任意角的三等分。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="1340.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="47.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑧ 三等分一条线：不用读尺上的数字</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">虚线：辅助圆弧或辅助线　实线：本步重点</text><rect x="24" y="120" width="672" height="495" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="160.39" font-size="18.2" fill="#172b45" text-anchor="start">1  从 A 作一条斜射线，连续截取三段等长</text><path d="M165.000,510.000 L555.000,510.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M165.000,510.000 L367.500,262.500" fill="none" stroke="#172b45" stroke-width="2.4"/><circle cx="165.000" cy="510.000" r="5" fill="#172b45"/><text x="137.0" y="534.45" font-size="17.5" fill="#172b45" text-anchor="start">A</text><circle cx="555.000" cy="510.000" r="5" fill="#172b45"/><text x="567.0" y="534.45" font-size="17.5" fill="#172b45" text-anchor="start">B</text><circle cx="232.500" cy="427.500" r="5" fill="#172b45"/><text x="197.5" y="417.95" font-size="17.5" fill="#172b45" text-anchor="start">P1</text><circle cx="300.000" cy="345.000" r="5" fill="#172b45"/><text x="265.0" y="335.45" font-size="17.5" fill="#172b45" text-anchor="start">P2</text><circle cx="367.500" cy="262.500" r="5" fill="#172b45"/><text x="332.5" y="252.95" font-size="17.5" fill="#172b45" text-anchor="start">P3</text><text x="48" y="566.52" font-size="16.7" fill="#172b45" text-anchor="start">AP1 = P1P2 = P2P3，用圆规保持开口逐次截取。</text><rect x="24" y="640" width="672" height="495" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="680.39" font-size="18.2" fill="#172b45" text-anchor="start">2  连接第三个点 P3 与端点 B</text><path d="M165.000,1030.000 L555.000,1030.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M165.000,1030.000 L367.500,782.500" fill="none" stroke="#172b45" stroke-width="2.4"/><circle cx="165.000" cy="1030.000" r="5" fill="#172b45"/><text x="137.0" y="1054.45" font-size="17.5" fill="#172b45" text-anchor="start">A</text><circle cx="555.000" cy="1030.000" r="5" fill="#172b45"/><text x="567.0" y="1054.45" font-size="17.5" fill="#172b45" text-anchor="start">B</text><circle cx="232.500" cy="947.500" r="5" fill="#172b45"/><text x="197.5" y="937.95" font-size="17.5" fill="#172b45" text-anchor="start">P1</text><circle cx="300.000" cy="865.000" r="5" fill="#172b45"/><text x="265.0" y="855.45" font-size="17.5" fill="#172b45" text-anchor="start">P2</text><circle cx="367.500" cy="782.500" r="5" fill="#172b45"/><text x="332.5" y="772.95" font-size="17.5" fill="#172b45" text-anchor="start">P3</text><path d="M367.500,782.500 L555.000,1030.000" fill="none" stroke="#b77a09" stroke-width="2.4"/><text x="48" y="1086.52" font-size="16.7" fill="#172b45" text-anchor="start">P3B 是两条平行线的方向参照。</text><rect x="24" y="1160" width="672" height="495" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="1200.39" font-size="18.2" fill="#172b45" text-anchor="start">3  过 P1、P2 作 P3B 的平行线，截 AB</text><path d="M165.000,1550.000 L555.000,1550.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M165.000,1550.000 L367.500,1302.500" fill="none" stroke="#172b45" stroke-width="2.4"/><circle cx="165.000" cy="1550.000" r="5" fill="#172b45"/><text x="137.0" y="1574.45" font-size="17.5" fill="#172b45" text-anchor="start">A</text><circle cx="555.000" cy="1550.000" r="5" fill="#172b45"/><text x="567.0" y="1574.45" font-size="17.5" fill="#172b45" text-anchor="start">B</text><circle cx="232.500" cy="1467.500" r="5" fill="#172b45"/><text x="197.5" y="1457.95" font-size="17.5" fill="#172b45" text-anchor="start">P1</text><circle cx="300.000" cy="1385.000" r="5" fill="#172b45"/><text x="265.0" y="1375.45" font-size="17.5" fill="#172b45" text-anchor="start">P2</text><circle cx="367.500" cy="1302.500" r="5" fill="#172b45"/><text x="332.5" y="1292.95" font-size="17.5" fill="#172b45" text-anchor="start">P3</text><path d="M367.500,1302.500 L555.000,1550.000" fill="none" stroke="#b77a09" stroke-width="2.4"/><path d="M232.500,1467.500 L295.000,1550.000" fill="none" stroke="#b34039" stroke-width="2.4"/><circle cx="295.000" cy="1550.000" r="5" fill="#b34039"/><text x="288.0" y="1575.45" font-size="17.5" fill="#b34039" text-anchor="start">X</text><path d="M300.000,1385.000 L425.000,1550.000" fill="none" stroke="#b34039" stroke-width="2.4"/><circle cx="425.000" cy="1550.000" r="5" fill="#b34039"/><text x="418.0" y="1575.45" font-size="17.5" fill="#b34039" text-anchor="start">Y</text><text x="48" y="1606.52" font-size="16.7" fill="#172b45" text-anchor="start">过 P1、P2 作平行线，可用连续两次作垂线。</text><text x="36" y="1700.52" font-size="16.7" fill="#172b45" text-anchor="start">相似三角形给出 AX : AB = 1 : 3。</text><text x="36" y="1737.52" font-size="16.7" fill="#172b45" text-anchor="start">同样可以分成 5 份、7 份；这不是任意角的三等分。</text></g></svg>
