<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1826" viewBox="0 0 720 1826" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">⑦ 用一个半圆，把长方形变成等面积方形</title><desc id="desc">把 a、b 首尾接成 AB，接点记为 C；以 AB 为直径作半圆，在 C 作垂线交于 D；CD² = a × b，CD 就是所求方形的边长；示例 a = 1、b = 3，所以 CD = √3。；几何按统一比例绘制；单位可以任意指定。；长方形能这样化方，不代表圆也能精确化方。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1826" fill="#f3f7fa"/><text x="36" y="50" font-size="29" fill="#172b45" text-anchor="start">⑦ 用一个半圆，把长方形变成等面积方形</text><text x="36" y="91" font-size="22" fill="#172b45" text-anchor="start">虚线：辅助圆弧或辅助线　实线：本步重点</text><rect x="24" y="120" width="672" height="495" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="162" font-size="24" fill="#172b45" text-anchor="start">1  把 a、b 首尾接成 AB，接点记为 C</text><path d="M185.000,395.000 L535.000,395.000" fill="none" stroke="#176786" stroke-width="3"/><circle cx="185.000" cy="395.000" r="5" fill="#172b45"/><text x="160" y="421" font-size="23" fill="#172b45" text-anchor="start">A</text><circle cx="272.500" cy="395.000" r="5" fill="#172b45"/><text x="260.5" y="421" font-size="23" fill="#172b45" text-anchor="start">C</text><circle cx="535.000" cy="395.000" r="5" fill="#172b45"/><text x="547" y="421" font-size="23" fill="#172b45" text-anchor="start">B</text><text x="228" y="470" font-size="23" fill="#176786" text-anchor="start">a = 1</text><text x="403" y="470" font-size="23" fill="#176786" text-anchor="start">b = 3</text><rect x="24" y="640" width="672" height="495" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="682" font-size="24" fill="#172b45" text-anchor="start">2  以 AB 为直径作半圆，在 C 作垂线交于 D</text><path d="M185.000,915.000 L535.000,915.000" fill="none" stroke="#176786" stroke-width="3"/