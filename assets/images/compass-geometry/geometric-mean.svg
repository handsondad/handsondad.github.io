.500 L290.000,897.500 L290.000,915.000" fill="none" stroke="#b34039" stroke-width="3"/><rect x="24" y="1160" width="672" height="495" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="1202" font-size="24" fill="#172b45" text-anchor="start">3  CD² = a × b，CD 就是所求方形的边长</text><path d="M185.000,1435.000 L535.000,1435.000" fill="none" stroke="#176786" stroke-width="3"/><circle cx="185.000" cy="1435.000" r="5" fill="#172b45"/><text x="160" y="1461" font-size="23" fill="#172b45" text-anchor="start">A</text><circle cx="272.500" cy="1435.000" r="5" fill="#172b45"/><text x="260.5" y="1461" font-size="23" fill="#172b45" text-anchor="start">C</text><circle cx="535.000" cy="1435.000" r="5" fill="#172b45"/><text x="547" y="1461" font-size="23" fill="#172b45" text-anchor="start">B</text><text x="228" y="1510" font-size="23" fill="#176786" text-anchor="start">a = 1</text><text x="403" y="1510" font-size="23" fill="#176786" text-anchor="start">b = 3</text><path d="M535.000,1435.000 L534.973,1431.946 L534.893,1428.893 L534.760,1425.841 L534.574,1422.793 L534.334,1419.748 L534.041,1416.708 L533.696,1413.673 L533.297,1410.645 L532.845,1407.624 L532.341,1404.612 L531.785,1401.608 L531.176,1398.615 L530.515,1395.634 L529.802,1392.664 L529.037,1389.707 L528.221,1386.763 L527.353,1383.835 L526.435,1380.922 L525.466,1378.026 L524.446,1375.146 L523.377,1372.286 L522.257,1369.444 L521.088,1366.622 L519.870,1363.821 L518.604,1361.042 L517.289,1358.285 L515.926,1355.552 L514.516,1352.842 L513.058,1350.158 L511.554,1347.500 L510.004,1344.868 L508.408,1342.264 L506.767,1339.688 L505.082,1337.141 L503.352,1334.624 L501.578,1332.138 L499.761,1329.682 L497.902,1327.259 L496.001,1324.869 L494.058,1322.512 L492.074,1320.190 L490.050,1317.902 L487.987,1315.650 L485.884,1313.435 L483.744,1311.256 L481.565,1309.116 L479.350,1307.013 L477.098,1304.950 L474.810,1302.926 L472.488,1300.942 L470.131,1298.999 L467.741,1297.098 L465.318,1295.239 L462.862,1293.422 L460.376,1291.648 L457.859,