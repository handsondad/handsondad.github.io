<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1341.75" viewBox="0 0 540 1341.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">② 不量长度，也能找到正中间</title><desc id="desc">给定线段 AB；分别以 A、B 为圆心，等半径交于 C、D；连接 C、D，与 AB 相交于 M；CA = CB，DA = DB：C、D 都到两端等距。；CD 是垂直平分线，AM = MB，夹角为直角。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="1340.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="47.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">② 不量长度，也能找到正中间</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">虚线：辅助圆弧或辅助线　实线：本步重点</text><rect x="24" y="120" width="672" height="495" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="160.39" font-size="18.2" fill="#172b45" text-anchor="start">1  给定线段 AB</text><path d="M273.000,395.000 L447.000,395.000" fill="none" stroke="#176786" stroke-width="2.4"/><circle cx="273.000" cy="395.000" r="5" fill="#172b45"/><text x="243.0" y="416.45" font-size="17.5" fill="#172b45" text-anchor="start">A</text><circle cx="447.000" cy="395.000" r="5" fill="#172b45"/><text x="459.0" y="416.45" font-size="17.5" fill="#172b45" text-anchor="start">B</text><text x="48" y="583.52" font-size="16.7" fill="#172b45" text-anchor="start">先有线段 AB；还不知道中点在哪里。</text><rect x="24" y="640" width="672" height="495" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="680.39" font-size="18.2" fill="#172b45" text-anchor="start">2  分别以 A、B 为圆心，等半径交于 C、D</text><path d="M273.000,915.000 L447.000,915.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M418.000,915.000 L417.912,909.940 L417.647,904.885 L417.20