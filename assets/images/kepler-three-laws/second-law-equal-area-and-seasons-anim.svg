<title id="title">开普勒第二定律等面积真实计时动画与地球四季时长差异图</title>
<desc id="desc">左图按开普勒方程精确计算12个等时间间隔位置及近远日点等面积扇形(各占T/6)，附7秒单次真实运动动画；右图说明角动量守恒本质及地球1月过近日点导致北半球春夏比秋冬长7.6天。</desc>
