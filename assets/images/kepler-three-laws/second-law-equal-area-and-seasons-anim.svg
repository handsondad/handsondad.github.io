<rect x="0.5" y="0.5" width="759" height="521" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">第二定律（等面积定律）真实计时动画：为什么北半球夏天比冬天多出近 8 天？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">太阳与行星连线在相等时间内扫过相等面积；近处柄短必狂奔，远处柄长慢散步（按开普勒方程精确计时）</text>
