<text x="148" y="264" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600" class="halo">面积 A₂ = A₁ 严格相等！</text>
<text x="338" y="128" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700" class="halo">近日点狂奔</text>
<text x="338" y="145" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="600" class="halo">v近/v远 = 3.44 倍!</text>
