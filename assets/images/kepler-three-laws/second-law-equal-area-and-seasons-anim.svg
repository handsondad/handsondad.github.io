<text x="104" y="151" font-size="10.5" fill="#64748b" text-anchor="middle" class="halo">点位密集成串</text>
<rect x="36" y="386" width="368" height="54" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="220" y="407" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">注：红球按开普勒方程 M = E − e sin E 真实非匀速运动 1 圈；</text>
<text x="220" y="426" font-size="10.5" fill="#64748b" text-anchor="middle">即使未播放动画，12 个等时闪光点疏密也直观呈现快慢反差。</text>
<rect x="432" y="68" width="306" height="182" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="452" cy="90" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="452" y="94" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="470" y="95" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">物理本质：中心力场角动量守恒！</text>
<rect x="444" y="112" width="282" height="124" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="456" y="134" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">• 引力沿连线指向太阳 ⇒ 力矩 τ = r × F = 0</text>
<text x="456" y="156" font-size="11" fill="#6d28d9" text-anchor="start" font-weight="700">• 角动量 L = m r v⊥ 全程守恒不变！</text>
<text x="456" y="178" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">• 掠面速率 dA/dt = L / (2m) = 常数</text>
<text x="456" y="200" font-size="10.5" fill="#1e293b" text-anchor="start">• 近日/远日点切线垂直连线：v近 / v远 = (1+e)/(1−e)</text>
<text x="456" y="220" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">• 适用边界：只要是中心力（哪怕平方不反比）皆成立！</text>
<rect x="432" y="262" width="306" height="192" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="452" cy="284" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="452" y="288" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">3</text>
<text x="470" y="289" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">身边的彩蛋：北半球夏天多赚 7.6 天！</text>
<rect x="444" y="306" width="282" height="134" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="456" y="327" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">• 1 月初地球过近日点（北半球隆冬！）：</text>
<text x="456" y="346" font-size="11" fill="#c25014" text-anchor="start" font-weight="700">  公转极速 30.29 km/s → 秋冬半圈嗖一下跑完！</text>
<text x="456" y="369" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">• 7 月初地球过远日点（北半球盛夏！）：</text>
<text x="456" y="388" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">  公转慢速 29.29 km/s → 春夏半圈慢悠悠散步！</text>
<line x1="456.0" y1="400.0" x2="714.0" y2="400.0" stroke="#18794e" stroke-width="1"/>
<text x="585" y="422" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">春分→秋分 186.4 天 vs 秋分→春分 178.8 天</text>
<rect x="22" y="466" width="716" height="42" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="380" y="492" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">历史冷知识：开普勒在 1602 年先发现了“第二定律（面积律）”，靠它做时间标尺，才在 3 年后算出了“第一定律（椭圆律）”！</text>
