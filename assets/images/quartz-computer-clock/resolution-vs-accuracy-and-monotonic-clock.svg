<rect x="0.5" y="0.5" width="759" height="509" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="380.0" y="30" font-size="18.5" fill="#1e293b" text-anchor="middle" font-weight="700">电脑计时的两大认知陷阱：皮秒刻度照样慢 4 秒 &amp; 时间倒流 Bug</text>
<text x="380.0" y="52" font-size="12.2" fill="#64748b" text-anchor="middle">高分辨率不等于高准确度；测耗时若误用“日历时钟”，一次网络校时往回拨表就能让程序瞬间死锁崩溃</text>
<rect x="22" y="68" width="716" height="198" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
