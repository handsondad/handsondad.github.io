<title id="title">电脑计时分辨率与准确度区别及CLOCK_REALTIME与CLOCK_MONOTONIC对比图</title>
<desc id="desc">上半图对比3GHz高分辨率TSC因50ppm偏差日漂4.32秒与温补晶振高准确度，下半图对比会回跳的日历时钟与永不倒退的单调时钟</desc>
