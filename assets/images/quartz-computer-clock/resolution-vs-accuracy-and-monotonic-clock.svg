<text x="52" y="192" font-size="10.3" fill="#1e293b" text-anchor="start">• 分辨率（最小刻度）：1 ÷ 3×10⁹ = 0.333 纳秒（极精细！）</text>
<text x="52" y="212" font-size="10.3" fill="#1e293b" text-anchor="start">• 准确度受主板晶振 ±50 ppm 公差拖累：86,400 秒 × 50×10⁻⁶</text>
<text x="52" y="232" font-size="10.3" fill="#dc2626" text-anchor="start" font-weight="700">  → 走满一天累计偏差 ±4.32 秒！（像印满微米刻度的橡皮尺）</text>
<rect x="386" y="122" width="336" height="126" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
<text x="400" y="145" font-size="11.0" fill="#0f766e" text-anchor="start" font-weight="700">B. 温补石英表 TCXO 秒脉冲（低分辨率 · 高准确度）</text>
<line x1="402.0" y1="168.0" x2="702.0" y2="168.0" stroke="#0f766e" stroke-width="2"/>
<line x1="402.0" y1="156.0" x2="402.0" y2="168.0" stroke="#0f766e" stroke-width="2"/>
<line x1="462.0" y1="156.0" x2="462.0" y2="168.0" stroke="#0f766e" stroke-width="2"/>
<line x1="522.0" y1="156.0" x2="522.0" y2="168.0" stroke="#0f766e" stroke-width="2"/>
<line x1="582.0" y1="156.0" x2="582.0" y2="168.0" stroke="#0f766e" stroke-width="2"/>
<line x1="642.0" y1="156.0" x2="642.0" y2="168.0" stroke="#0f766e" stroke-width="2"/>
<line x1="702.0" y1="156.0" x2="702.0" y2="168.0" stroke="#0f766e" stroke-width="2"/>
<text x="400" y="192" font-size="10.3" fill="#1e293b" text-anchor="start">• 分辨率（最小刻度）：每秒才跳 1 下（1.0 秒，测不了微秒耗时）</text>
<text x="400" y="212" font-size="10.3" fill="#1e293b" text-anchor="start">• 但晶振经过 ±2 ppm 精密温补：86,400 秒 × 2×10⁻⁶</text>
<text x="400" y="232" font-size="10.3" fill="#0f766e" text-anchor="start" font-weight="700">  → 走满一天误差仅 ±0.17 秒！（刻度虽疏，总长却稳如钢尺）</text>
<rect x="22" y="282" width="716" height="208" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="296.0" width="564" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="320.0" y="311.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">陷阱二：为什么所有现代操作系统都强制拆分“墙上日历钟”与“单调秒表钟”？</text>
<rect x="38" y="336" width="332" height="138" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="52" y="358" font-size="11.2" fill="#dc2626" text-anchor="start" font-weight="700">❌ 日历墙上钟 CLOCK_REALTIME（会跳变倒流！）</text>
<polyline points="56,418 156,382 156,412 246,378" fill="none" stroke="#dc2626" stroke-width="2.6"/>
<circle cx="156" cy="382" r="4" fill="#dc2626"/>
<text x="166" y="412" font-size="9.8" fill="#dc2626" text-anchor="start" font-weight="700">NTP/手动回拨 −2 秒！</text>
<text x="52" y="438" font-size="10.2" fill="#1e293b" text-anchor="start">• 用途：给人类看现在几点、给文件盖 UTC 日期戳；</text>
<text x="52" y="458" font-size="10.2" fill="#dc2626" text-anchor="start" font-weight="700">• 禁忌：测耗时算 t₂ − t₁ 可能算出负数，导致超时器卡死！</text>
<rect x="386" y="336" width="336" height="138" rx="10" fill="#e7f6ee" stroke="#86efac" stroke-width="1"/>
<text x="400" y="358" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">✅ 单调秒表钟 CLOCK_MONOTONIC / QPC（绝不倒退！）</text>
<line x1="406" y1="418" x2="596" y2="372" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arr-green)"/>
<text x="604" y="384" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">开机起算</text>
<text x="604" y="400" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">永远单调递增</text>
<text x="400" y="438" font-size="10.2" fill="#1e293b" text-anchor="start">• 用途：测量函数耗时、网络超时、游戏帧间隔、动画计时；</text>
<text x="400" y="458" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700">• 铁律：不管用户把系统年份改到哪一年，它都稳步向前走！</text>
</svg>
