    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="511" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="380.0" y="30" font-size="18.5" fill="#1e293b" text-anchor="middle" font-weight="700">一块透明小石头凭什么当节拍器？压电效应与石英音叉振荡闭环</text>
<text x="380.0" y="52" font-size="12.2" fill="#64748b" text-anchor="middle">1880 年居里兄弟发现“捏石英生电”，配合电路正反馈，造出了品质因数 Q 高达机械摆轮百倍的物理摆</text>
<rect x="22" y="68" width="352" height="422" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="82.0" width="304" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="190.0" y="97.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">① 物理根基：SiO₂ 晶格的“机电双向翻译”</text>
<rect x="38" y="120" width="320" height="158" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="52" y="142" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">正压电效应（1880 居里兄弟）：机械形变 → 产生电压</text>
<polygon points="92,172 132,162 162,188 152,226 112,236 82,210" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
<line x1="122.0" y1="147.0" x2="122.0" y2="160.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<line x1="122.0" y1="251.0" x2="122.0" y2="238.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="106" y="188" font-size="10.2" fill="#dc2626" text-anchor="start" font-weight="700">+Si⁴⁺</text>
<text x="116" y="218" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700">−O²⁻</text>
<text x="186" y="178" font-size="10.5" fill="#1e293b" text-anchor="start">• 无外力时正负电荷中心重合；</text>
<text x="186" y="198" font-size="10.5" fill="#1e293b" text-anchor="start">• 受压弯曲瞬间，硅氧离子错位，</text>
<text x="186" y="218" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">  晶面两端吐出微弱交变电压！</text>
<text x="52" y="265" font-size="10.2" fill="#64748b" text-anchor="start">（打火机咔哒一按冒电火花，也是同一原理！）</text>
<rect x="38" y="290" width="320" height="184" rx="10" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="52" y="312" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">逆压电效应（1881 李普曼）：施加电压 → 精准弹动</text>
<path d="M 88 432 L 88 386 L 74 386 L 74 332 L 88 332 L 88 372 L 108 372 L 108 332 L 122 332 L 122 386 L 108 386 L 108 432 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<line x1="60.0" y1="344.0" x2="71.0" y2="344.0" stroke="#c25014" stroke-width="2.0" marker-end="url(#arr-orange)"/>
<line x1="136.0" y1="344.0" x2="125.0" y2="344.0" stroke="#c25014" stroke-width="2.0" marker-end="url(#arr-orange)"/>
<text x="98" y="450" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">4 毫米微型石英音叉</text>
<text x="154" y="346" font-size="10.5" fill="#1e293b" text-anchor="start">• 电极通电 → 两根音叉臂弯曲；</text>
<text x="154" y="368" font-size="10.5" fill="#1e293b" text-anchor="start">• 音叉回弹 → 正压电吐回电信号；</text>
<text x="154" y="390" font-size="10.5" fill="#1e293b" text-anchor="start">• 唯有切口决定的“固有谐振频率”</text>
<text x="154" y="410" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">  能通过，其余杂波全被滤除！</text>
<text x="154" y="434" font-size="10.5" fill="#0f766e" text-anchor="start" font-weight="700">• 真空金属壳封装，零空气阻力！</text>
<rect x="388" y="68" width="350" height="422" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="404.0" y="82.0" width="310" height="22" rx="11.0" fill="#fffbeb" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="559.0" y="97.0" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">② 永不疲倦的闭环 + 碾压机械表的 Q 值</text>
<rect x="404" y="120" width="318" height="132" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<rect x="422" y="146" width="114" height="44" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1"/>
<text x="479" y="166" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">石英音叉谐振器</text>
<text x="479" y="182" font-size="9.8" fill="#64748b" text-anchor="middle">（机械选频核心）</text>
<rect x="590" y="146" width="114" height="44" rx="8" fill="#ffffff" stroke="#1d6fa5" stroke-width="1"/>
<text x="647" y="166" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">CMOS 放大器</text>
<text x="647" y="182" font-size="9.8" fill="#64748b" text-anchor="middle">（电池微能量补推）</text>
<line x1="538.0" y1="158.0" x2="588.0" y2="158.0" stroke="#1d6fa5" stroke-width="2.2" marker-end="url(#arr-blue)"/>
<text x="563" y="150" font-size="9.8" fill="#1d6fa5" text-anchor="middle">正压电信号</text>
<line x1="588.0" y1="180.0" x2="538.0" y2="180.0" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="563" y="200" font-size="9.8" fill="#b45309" text-anchor="middle">逆压电轻推一把</text>
<text x="563" y="234" font-size="10.3" fill="#0f172a" text-anchor="middle" font-weight="700">就像大人在最高点轻轻推秋千：每振动一次只补极微弱电能</text>
<rect x="404" y="268" width="318" height="206" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="563" y="290" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">为什么石英表比顶级陀飞轮准几十倍？看谐振峰锐度（Q 值）</text>
