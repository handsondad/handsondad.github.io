<svg xmlns="http://www.w3.org/2000/svg" width="760" height="514" viewBox="0 0 760 514" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">NTP网络时间协议四时间戳延迟抵消算例与平滑调频慢拨机制图解</title>
<desc id="desc">左栏用具体数值演示RFC5905四时间戳解算往返延迟40ms与时钟偏差60ms，右栏展示Stratum原子钟层级及小误差调频慢追Slew曲线</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="513" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="380.0" y="30" font-size="18.5" fill="#1e293b" text-anchor="middle" font-weight="700">网速延迟忽快忽慢，电脑怎么隔着互联网把表对准原子钟？</text>
<text x="380.0" y="52" font-size="12.2" fill="#64748b" text-anchor="middle">NTP 协议靠“四时间戳乒乓算术”扣掉网络路途耗时，再用“调频慢追（Slew）”温柔抚平误差</text>
<rect x="22" y="68" width="412" height="426" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="82.0" width="314" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="195.0" y="97.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">① NTP 四时间戳对表术（IETF RFC 5905）</text>
<rect x="38" y="122" width="380" height="172" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<line x1="112.0" y1="162.0" x2="404.0" y2="162.0" stroke="#0f766e" stroke-width="2.4"/>
<text x="48" y="158" font-size="10.2" fill="#0f766e" text-anchor="start" font-weight="700">原子钟授时</text>
<text x="48" y="173" font-size="10.2" fill="#0f766e" text-anchor="start" font-weight="700">服务器表盘</text>
<line x1="112.0" y1="252.0" x2="404.0" y2="252.0" stroke="#1d6fa5" stroke-width="2.4"/>
<text x="48" y="248" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700">你的电脑</text>
<text x="48" y="263" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700">本地表盘</text>
<line x1="142.0" y1="252.0" x2="224.0" y2="164.0" stroke="#c25014" stroke-width="2.4" marker-end="url(#arr-orange)"/>
<line x1="284.0" y1="162.0" x2="366.0" y2="250.0" stroke="#6d28d9" stroke-width="2.4" marker-end="url(#arr-blue)"/>
<text x="142" y="274" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">T₁ = 10.000s</text>
<text x="214" y="146" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="700">T₂ = 10.080s</text>
<text x="302" y="146" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="700">T₃ = 10.090s</text>
<text x="366" y="274" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">T₄ = 10.050s</text>
<text x="166" y="206" font-size="9.8" fill="#c25014" text-anchor="middle">去程</text>
<text x="340" y="206" font-size="9.8" fill="#6d28d9" text-anchor="middle">回程</text>
<rect x="38" y="306" width="380" height="172" rx="10" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="52" y="328" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">小学生加减法秒破“路途延迟 + 表盘快慢”双未知数：</text>
<text x="52" y="352" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">• 往返纯网络路途延迟 δ = (T₄ − T₁) − (T₃ − T₂)</text>
<text x="52" y="372" font-size="10.2" fill="#1e293b" text-anchor="start">  = (10.050 − 10.000) − (10.090 − 10.080) = 0.040 秒（单程 20 ms）</text>
<text x="52" y="398" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">• 你的电脑相对标准时间偏差 θ = [(T₂ − T₁) + (T₃ − T₄)] ÷ 2</text>
<text x="52" y="418" font-size="10.2" fill="#1e293b" text-anchor="start">  = [(+0.080) + (+0.040)] ÷ 2 = +0.060 秒（你的电脑慢了 60 ms！）</text>
<text x="52" y="444" font-size="10.1" fill="#64748b" text-anchor="start">• 多次采样挑最短延迟包过滤排队抖动，公网对时精度可达几毫秒，</text>
<text x="52" y="462" font-size="10.1" fill="#64748b" text-anchor="start">  局域网更可达几十微秒（精密工业则用硬件时间戳 PTP 达亚微秒）。</text>
<rect x="448" y="68" width="290" height="426" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="464.0" y="82.0" width="254" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="591.0" y="97.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">② 授时金字塔与“温柔慢拨”艺术</text>
<rect x="488" y="124" width="210" height="30" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1"/>
<text x="593.0" y="143" font-size="9.8" fill="#0f766e" text-anchor="middle" font-weight="700">Stratum 0：铯/氢原子钟、GPS/北斗星载钟</text>
<rect x="476" y="162" width="234" height="30" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="593.0" y="181" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">Stratum 1：国家级一级授时服务器</text>
<rect x="464" y="200" width="258" height="30" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="593.0" y="219" font-size="9.8" fill="#6d28d9" text-anchor="middle" font-weight="700">Stratum 2/3：云厂商与操作系统授时池</text>
<line x1="593.0" y1="154.0" x2="593.0" y2="161.0" stroke="#475569" stroke-width="1.6"/>
<line x1="593.0" y1="192.0" x2="593.0" y2="199.0" stroke="#475569" stroke-width="1.6"/>
<rect x="464" y="244" width="258" height="234" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="476" y="266" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">发现慢了 60 毫秒，系统怎么追？</text>
<line x1="482.0" y1="346.0" x2="704.0" y2="294.0" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="658" y="290" font-size="9.6" fill="#64748b" text-anchor="middle">标准原子钟 UTC</text>
<path d="M 482 368 Q 566 346 704 294" fill="none" stroke="#0f766e" stroke-width="2.8"/>
<text x="616" y="350" font-size="10.2" fill="#0f766e" text-anchor="start" font-weight="700">调频慢追（Slew）</text>
<text x="476" y="388" font-size="10.3" fill="#0f766e" text-anchor="start" font-weight="700">• 小误差（&lt;128 ms）走“慢拨 Slew”：</text>
<text x="476" y="407" font-size="10.1" fill="#1e293b" text-anchor="start">  绝不硬跳表！内核把软件时钟步伐悄</text>
<text x="476" y="424" font-size="10.1" fill="#1e293b" text-anchor="start">  悄调快 0.05%（500 ppm，每秒追</text>
<text x="476" y="441" font-size="10.1" fill="#1e293b" text-anchor="start">  0.5 ms），花 2 分钟丝滑贴合标准时；</text>
<text x="476" y="462" font-size="10.1" fill="#dc2626" text-anchor="start" font-weight="700">• 唯刚开机差几分钟以上才“硬跳 Step”。</text>
</svg>
