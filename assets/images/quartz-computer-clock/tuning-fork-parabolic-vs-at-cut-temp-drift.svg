<text x="160.4" y="283.7" font-size="9.8" fill="#dc2626" text-anchor="start" font-weight="700">0℃ 窗台：−21.9 ppm（日慢 1.9 秒）</text>
<text x="368" y="331.1" font-size="10.3" fill="#dc2626" text-anchor="start" font-weight="700">① 32.768 kHz 音叉抛物线</text>
<text x="354" y="158.5" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700">② 电脑 MHz 级 AT 切三次曲线</text>
<text x="154" y="171.8" font-size="10.0" fill="#0f766e" text-anchor="start" font-weight="700">③ 温补晶振 TCXO（±2 ppm）</text>
<rect x="504" y="68" width="234" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="518.0" y="82.0" width="198" height="22" rx="11.0" fill="#fffbeb" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="617.0" y="97.0" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">读图秒懂三个生活现象</text>
<text x="518" y="132" font-size="11.0" fill="#dc2626" text-anchor="start" font-weight="700">1. 为什么手表摘下放冬天桌会变慢？</text>
<text x="518" y="152" font-size="10.1" fill="#1e293b" text-anchor="start">音叉晶振拐点设在 T₀ = 25℃（贴近佩</text>
<text x="518" y="169.5" font-size="10.1" fill="#1e293b" text-anchor="start">戴手腕温度）：</text>
<text x="518" y="187.0" font-size="10.1" fill="#1e293b" text-anchor="start">Δf/f₀ = −0.035 × (T − 25)² ppm</text>
<text x="518" y="204.5" font-size="10.1" fill="#1e293b" text-anchor="start">因为平方项恒为正、系数为负，无论</text>
<text x="518" y="222.0" font-size="10.1" fill="#1e293b" text-anchor="start">天冷（0℃）还是暴晒（50℃），音叉</text>
<text x="518" y="239.5" font-size="10.1" fill="#1e293b" text-anchor="start">永远只会往“变慢”一侧掉速！</text>
<text x="518" y="267.0" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700">2. 电脑发烧到 70℃ 怎么没乱套？</text>
<text x="518" y="287.0" font-size="10.1" fill="#1e293b" text-anchor="start">主板上 24/25/100 MHz 高频晶振改用</text>
<text x="518" y="304.5" font-size="10.1" fill="#1e293b" text-anchor="start">神奇的 35°15′“AT 切角”薄晶片，温漂</text>
<text x="518" y="322.0" font-size="10.1" fill="#1e293b" text-anchor="start">呈横卧 S 形三次曲线，在 −20℃ 至</text>
<text x="518" y="339.5" font-size="10.1" fill="#1e293b" text-anchor="start">70℃ 宽温区内死死锁在 ±20 ppm 内。</text>
<text x="518" y="367.0" font-size="11.0" fill="#0f766e" text-anchor="start" font-weight="700">3. 手机基站与精密 RTC 怎么破局？</text>
<text x="518" y="387.0" font-size="10.1" fill="#1e293b" text-anchor="start">内置微型温度传感器每分钟测温，</text>
<text x="518" y="404.5" font-size="10.1" fill="#1e293b" text-anchor="start">按抛物线反向增减负载电容或分频脉</text>
<text x="518" y="422.0" font-size="10.1" fill="#1e293b" text-anchor="start">冲（TCXO 温补晶振），把年误差压到</text>
<text x="518" y="439.5" font-size="10.1" fill="#1e293b" text-anchor="start">区区 ±1 分钟以内！</text>
</svg>
