<text x="380.0" y="30" font-size="18.5" fill="#1e293b" text-anchor="middle" font-weight="700">为什么石英表戴在手腕上比扔桌上更准？晶振温漂曲线大揭秘</text>
<text x="380.0" y="52" font-size="12.2" fill="#64748b" text-anchor="middle">32.768 kHz 音叉晶振呈开口向下的抛物线（冷热皆变慢！），而电脑高频晶振改用“AT 切角”三次曲线稳频</text>
