<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">32.768kHz音叉晶振抛物线温漂与电脑高频AT切晶振三次曲线对比图</title>
<desc id="desc">左图精确绘制音叉晶振在25摄氏度拐点两侧对称变慢的抛物线、AT切三次S曲线及TCXO温补线，右图解释手腕恒温效应</desc>
