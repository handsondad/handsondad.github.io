<svg xmlns="http://www.w3.org/2000/svg" width="720" height="675" viewBox="0 0 720 675" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">内存里的一个数，不会自动变成屏幕上的字</title><desc id="desc">字符A的码点、UTF8编码与原创5乘7像素字形对照；数值20的一个字节表示和字符串20的两个UTF8字节不同。字形网格是教学示意。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="2"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="675" rx="18" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">内存里的一个数，不会自动变成屏幕上的字</text><text x="28" y="91" font-size="26" fill="#18364b" text-anchor="start">同一个字符，可以有许多不同字形。</text><rect x="28" y="130" width="328" height="365" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><text x="48" y="177" font-size="29" fill="#18364b" text-anchor="start">字符身份：A</text><text x="48" y="233" font-size="25" fill="#18364b" text-anchor="start">Unicode：U+0041</text><text x="48" y="283" font-size="25" fill="#18364b" text-anchor="start">十进制码点：65</text><text x="48" y="333" font-size="22" fill="#18364b" text-anchor="start">UTF-8：41（十六进制）</text><text x="48" y="383" font-size="24" fill="#18364b" text-anchor="start">二进制：01000001</text><text x="48" y="450" font-size="23" fill="#18364b" text-anchor="start">编码不存“这个字的照片”</text><rect x="425" y="150" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="465" y="150" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="505" y="150" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="545" y="150" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="585" y="150" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="425" y="190" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="465" y="190" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="505" y="190" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="545" y="190" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="585" y="190" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="425" y="230" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="465" y="230" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="505" y="230" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="545" y="230" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="585" y="230" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="425" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="465" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="505" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="545" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="585" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="425" y="310" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="465" y="310" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="505" y="310" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="545" y="310" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="585" y="310" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="425" y="350" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="465" y="350" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="505" y="350" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="545" y="350" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="585" y="350" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="425" y="390" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><rect x="465" y="390" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="505" y="390" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="545" y="390" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="2"/><rect x="585" y="390" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="2"/><text x="525" y="476" font-size="24" fill="#18364b" text-anchor="middle">原创 5 × 7 字形</text><text x="28" y="550" font-size="23" fill="#18364b" text-anchor="start">数值 20：单字节无符号表示可为 14（十六进制）</text><text x="28" y="593" font-size="24" fill="#18364b" text-anchor="start">文本“20”：UTF-8 则是 32 30（十六进制）</text><text x="28" y="638" font-size="22" fill="#18364b" text-anchor="start">字符 → 字形 → 图形结果；真实排版还包含许多步骤。</text></svg>
