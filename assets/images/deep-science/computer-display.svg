<svg xmlns="http://www.w3.org/2000/svg" width="540" height="506.25" viewBox="0 0 540 506.25" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">内存里的一个数，不会自动变成屏幕上的字</title><desc id="desc">字符A的码点、UTF8编码与原创5乘7像素字形对照；数值20的一个字节表示和字符串20的两个UTF8字节不同。字形网格是教学示意。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="1.8"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="538.5" height="504.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="43.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">内存里的一个数，不会自动变成屏幕上的字</text><text x="28" y="88.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">同一个字符，可以有许多不同字形。</text><rect x="28" y="130" width="328" height="365" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="174.56" font-size="20.3" fill="#18364b" text-anchor="start" font-weight="700">字符身份：A</text><text x="48" y="231.18" font-size="18.5" fill="#18364b" text-anchor="start">Unicode：U+0041</text><text x="48" y="281.18" font-size="18.5" fill="#18364b" text-anchor="start">十进制码点：65</text><text x="48" y="331.40" font-size="16.3" fill="#18364b" text-anchor="start">UTF-8：41（十六进制）</text><text x="48" y="381.25" font-size="17.8" fill="#18364b" text-anchor="start">二进制：01000001</text><text x="48" y="448.33" font-size="17.0" fill="#18364b" text-anchor="start">编码不存“这个字的照片”</text><rect x="425" y="150" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="465" y="150" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="505" y="150" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="545" y="150" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="585" y="150" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="425" y="190" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="465" y="190" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="505" y="190" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="545" y="190" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="585" y="190" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="425" y="230" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="465" y="230" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="505" y="230" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="545" y="230" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="585" y="230" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="425" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="465" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="505" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="545" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="585" y="270" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="425" y="310" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="465" y="310" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="505" y="310" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="545" y="310" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="585" y="310" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="425" y="350" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="465" y="350" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="505" y="350" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="545" y="350" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="585" y="350" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="425" y="390" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><rect x="465" y="390" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="505" y="390" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="545" y="390" width="36" height="36" rx="2" fill="#e8eef3" stroke="#a9bfd0" stroke-width="1.5"/><rect x="585" y="390" width="36" height="36" rx="2" fill="#226ca2" stroke="#a9bfd0" stroke-width="1.5"/><text x="525" y="474.25" font-size="17.8" fill="#18364b" text-anchor="middle">原创 5 × 7 字形</text><text x="28" y="548.33" font-size="17.0" fill="#18364b" text-anchor="start">数值 20：单字节无符号表示可为 14（十六进制）</text><text x="28" y="591.25" font-size="17.8" fill="#18364b" text-anchor="start">文本“20”：UTF-8 则是 32 30（十六进制）</text><text x="28" y="636.40" font-size="16.3" fill="#18364b" text-anchor="start">字符 → 字形 → 图形结果；真实排版还包含许多步骤。</text></g></svg>
