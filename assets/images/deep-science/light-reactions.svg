<svg xmlns="http://www.w3.org/2000/svg" width="540" height="622.5" viewBox="0 0 540 622.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">水的电子，要经过两次光能帮助</title><desc id="desc">膜拓扑简图：水氧化在类囊体腔侧，电子经光系统II、传递链、光系统I，最终在基质侧用于生成NADPH。H离子梯度并非电子流本身，图省略ATP合酶。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="1.8"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="538.5" height="621" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="43.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">水的电子，要经过两次光能帮助</text><text x="28" y="90.25" font-size="17.8" fill="#18364b" text-anchor="start">实线读电子路线；虚线读跨膜 H⁺方向。</text><rect x="28" y="145" width="664" height="520" rx="12" fill="#edf6ed" stroke="#b4ceb6" stroke-width="1.5"/><text x="46" y="185.88" font-size="19.4" fill="#18364b" text-anchor="start" font-weight="600">叶绿体基质</text><rect x="28" y="320" width="664" height="70" rx="0" fill="#94c39c" stroke="#187864" stroke-width="1.5"/><text x="46" y="617.88" font-size="19.4" fill="#18364b" text-anchor="start" font-weight="600">类囊体腔：H⁺在这里积累</text><path d="M335 248V490" fill="none" stroke="#187864" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="61" y="305" width="128" height="100" rx="12" fill="#fff" stroke="#187864" stroke-width="1.5"/><text x="125" y="349.33" font-size="17.0" fill="#18364b" text-anchor="middle">光系统II</text><rect x="271" y="305" width="128" height="100" rx="12" fill="#fff" stroke="#187864" stroke-width="1.5"/><text x="335" y="349.33" font-size="17.0" fill="#18364b" text-anchor="middle">传递链</text><rect x="486" y="305" width="128" height="100" rx="12" fill="#fff" stroke="#187864" stroke-width="1.5"/><text x="550" y="349.33" font-size="17.0" fill="#18364b" text-anchor="middle">光系统I</text><text x="125" y="235.88" font-size="19.4" fill="#b56308" text-anchor="middle" font-weight="600">光能 ↓</text><text x="550" y="235.88" font-size="19.4" fill="#b56308" text-anchor="middle" font-weight="600">光能 ↓</text><path d="M125 495V410" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="0" style="animation-delay:0s" d="M125 495V410" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><text x="54" y="528.18" font-size="18.5" fill="#18364b" text-anchor="start">2 H₂O</text><text x="54" y="566.25" font-size="17.8" fill="#18364b" text-anchor="start">→ O₂ + 4 H⁺</text><text x="157" y="449.25" font-size="17.8" fill="#226ca2" text-anchor="start">4 e⁻</text><path d="M195 355H265" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="1" style="animation-delay:1s" d="M195 355H265" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><path d="M405 355H480" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="2" style="animation-delay:2s" d="M405 355H480" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><path d="M550 300V275H660V215" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="3" style="animation-delay:3s" d="M550 300V275H660V215" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><text x="389" y="137.33" font-size="17.0" fill="#226ca2" text-anchor="start">末端还原 NADP⁺ → NADPH</text><text x="352" y="466.25" font-size="17.8" fill="#187864" text-anchor="start">H⁺入腔</text><text x="28" y="709.25" font-size="17.8" fill="#18364b" text-anchor="start">① 水补电子　② 接力建立梯度　③ 光再“抬升”</text><text x="28" y="750.25" font-size="17.8" fill="#18364b" text-anchor="start">④ 形成 NADPH；H⁺回流驱动 ATP，见正文。</text><text x="28" y="795.33" font-size="17.0" fill="#18364b" text-anchor="start">省略中间载体与 ATP 合酶；线长不是能量或速率。</text></g></svg>
