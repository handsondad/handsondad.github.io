<svg xmlns="http://www.w3.org/2000/svg" width="540" height="611.25" viewBox="0 0 540 611.25" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">“离太阳刚好”只答对了第一小问</title><desc id="desc">以平均轨道尺度作近似，单位面积太阳辐射随距离平方反比变化。金星、地球、火星分别约为地球的1.91、1、0.43倍，不是地表温度或宜居概率。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="1.8"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="538.5" height="609.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="43.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">“离太阳刚好”只答对了第一小问</text><text x="28" y="89.25" font-size="17.8" fill="#18364b" text-anchor="start">同一颗太阳，距离增大，单位面积收到的光变少。</text><text x="28" y="143.18" font-size="18.5" fill="#18364b" text-anchor="start">金星｜距离 0.723 AU</text><rect x="28" y="162" width="583.4763328608132" height="42" rx="4" fill="#b56308" stroke="none" stroke-width="1.5"/><text x="638.4763328608132" y="192.18" font-size="18.5" fill="#18364b" text-anchor="start">1.91</text><text x="28" y="268.18" font-size="18.5" fill="#18364b" text-anchor="start">地球｜距离 1 AU</text><rect x="28" y="287" width="305.0" height="42" rx="4" fill="#187864" stroke="none" stroke-width="1.5"/><text x="360.0" y="317.18" font-size="18.5" fill="#18364b" text-anchor="start">1.00</text><text x="28" y="393.18" font-size="18.5" fill="#18364b" text-anchor="start">火星｜距离 1.524 AU</text><rect x="28" y="412" width="131.3197070838586" height="42" rx="4" fill="#226ca2" stroke="none" stroke-width="1.5"/><text x="186.3197070838586" y="442.18" font-size="18.5" fill="#18364b" text-anchor="start">0.43</text><text x="28" y="526.18" font-size="18.5" fill="#18364b" text-anchor="start">柱长 ∝ 1 / 距离²；把地球收到的光定为 1。</text><rect x="28" y="568" width="664" height="166" rx="12" fill="#f7efdf" stroke="#d9bd8f" stroke-width="1.5"/><text x="48" y="605.88" font-size="19.4" fill="#18364b" text-anchor="start" font-weight="600">但这不是温度计，更不是生命概率。</text><text x="48" y="650.25" font-size="17.8" fill="#18364b" text-anchor="start">大气、反射率、云与水循环都能改变结果。</text><text x="48" y="693.25" font-size="17.8" fill="#18364b" text-anchor="start">地表液态水还需要合适的压力条件。</text><text x="28" y="777.40" font-size="16.3" fill="#18364b" text-anchor="start">圆轨道近似：取平均轨道尺度；忽略轨道与太阳变化。</text></g></svg>
