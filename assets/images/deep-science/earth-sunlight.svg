<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 815" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">“离太阳刚好”只答对了第一小问</title><desc id="desc">以平均轨道尺度作近似，单位面积太阳辐射随距离平方反比变化。金星、地球、火星分别约为地球的1.91、1、0.43倍，不是地表温度或宜居概率。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="2"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="815" rx="18" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">“离太阳刚好”只答对了第一小问</text><text x="28" y="91" font-size="24" fill="#18364b" text-anchor="start">同一颗太阳，距离增大，单位面积收到的光变少。</text><text x="28" y="145" font-size="25" fill="#18364b" text-anchor="start">金星｜距离 0.723 AU</text><rect x="28" y="162" width="583.4763328608132" height="42" rx="4" fill="#b56308" stroke="none" stroke-width="2"/><text x="638.4763328608132" y="194" font-size="25" fill="#18364b" text-anchor="start">1.91</text><text x="28" y="270" font-size="25" fill="#18364b" text-anchor="start">地球｜距离 1 AU</text><rect x="28" y="287" width="305.0" height="42" rx="4" fill="#187864" stroke="none" stroke-width="2"/><text x="360.0" y="319" font-size="25" fill="#18364b" text-anchor="start">1.00</text><text x="28" y="395" font-size="25" fill="#18364b" text-anchor="start">火星｜距离 1.524 AU</text><rect x="28" y="412" width="131.3197070838586" height="42" rx="4" fill="#226ca2" stroke="none" stroke-width="2"/><text x="186.3197070838586" y="444" font-size="25" fill="#18364b" text-anchor="start">0.43</text><text x="28" y="528" font-size="25" fill="#18364b" text-anchor="start">柱长 ∝ 1 / 距离²；把地球收到的光定为 1。</text><rect x="28" y="568" width="664" height="166" rx="12" fill="#f7efdf" stroke="#d9bd8f" stroke-width="2"/><text x="48" y="608" font-size="27" fill="#18364b" text-anchor="start">但这不是温度计，更不是生命概率。</text><text x="48" y="652" font-size="24" fill="#18364b" text-anchor="start">大气、反射率、云与水循环都能改变结果。</text><text x="48" y="695" font-size="24" fill="#18364b" text-anchor="start">地表液态水还需要合适的压力条件。</text><text x="28" y="779" font-size="22" fill="#18364b" text-anchor="start">圆轨道近似：取平均轨道尺度；忽略轨道与太阳变化。</text></svg>
