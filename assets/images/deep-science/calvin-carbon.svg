<svg xmlns="http://www.w3.org/2000/svg" width="540" height="633.75" viewBox="0 0 540 633.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">卡尔文循环：为什么造出六份，却只拿走一份？</title><desc id="desc">3个二氧化碳的3个碳与3个RuBP的15个碳共18个碳，形成6个三碳单位。净取出1个G3P，其余5个用于再生RuBP。圆点是收支，不是逐个标记原子的轨迹。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="1.8"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="538.5" height="632.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="43.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">卡尔文循环：为什么造出六份，却只拿走一份？</text><text x="28" y="90.25" font-size="17.8" fill="#18364b" text-anchor="start">每个圆点代表 1 个碳；只数碳，不画完整分子。</text><rect x="28" y="125" width="664" height="140" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="163.88" font-size="19.4" fill="#18364b" text-anchor="start" font-weight="600">① 固定：3 CO₂ + 3 RuBP</text><circle cx="55" cy="215" r="10" fill="#b56308"/><circle cx="88" cy="215" r="10" fill="#b56308"/><circle cx="121" cy="215" r="10" fill="#b56308"/><circle cx="240" cy="215" r="10" fill="#187864"/><circle cx="262" cy="215" r="10" fill="#187864"/><circle cx="284" cy="215" r="10" fill="#187864"/><circle cx="306" cy="215" r="10" fill="#187864"/><circle cx="328" cy="215" r="10" fill="#187864"/><circle cx="385" cy="215" r="10" fill="#187864"/><circle cx="407" cy="215" r="10" fill="#187864"/><circle cx="429" cy="215" r="10" fill="#187864"/><circle cx="451" cy="215" r="10" fill="#187864"/><circle cx="473" cy="215" r="10" fill="#187864"/><circle cx="530" cy="215" r="10" fill="#187864"/><circle cx="552" cy="215" r="10" fill="#187864"/><circle cx="574" cy="215" r="10" fill="#187864"/><circle cx="596" cy="215" r="10" fill="#187864"/><circle cx="618" cy="215" r="10" fill="#187864"/><path d="M360 275V313" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="0" style="animation-delay:0s" d="M360 275V313" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><rect x="28" y="325" width="664" height="160" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="365.88" font-size="19.4" fill="#18364b" text-anchor="start" font-weight="600">② 还原：6 个三碳单位</text><circle cx="65" cy="412" r="10" fill="#187864"/><circle cx="89" cy="412" r="10" fill="#187864"/><circle cx="113" cy="412" r="10" fill="#187864"/><circle cx="170" cy="412" r="10" fill="#187864"/><circle cx="194" cy="412" r="10" fill="#187864"/><circle cx="218" cy="412" r="10" fill="#187864"/><circle cx="275" cy="412" r="10" fill="#187864"/><circle cx="299" cy="412" r="10" fill="#187864"/><circle cx="323" cy="412" r="10" fill="#187864"/><circle cx="380" cy="412" r="10" fill="#187864"/><circle cx="404" cy="412" r="10" fill="#187864"/><circle cx="428" cy="412" r="10" fill="#187864"/><circle cx="485" cy="412" r="10" fill="#187864"/><circle cx="509" cy="412" r="10" fill="#187864"/><circle cx="533" cy="412" r="10" fill="#187864"/><circle cx="590" cy="412" r="10" fill="#187864"/><circle cx="614" cy="412" r="10" fill="#187864"/><circle cx="638" cy="412" r="10" fill="#187864"/><text x="48" y="456.33" font-size="17.0" fill="#18364b" text-anchor="start">6 ATP + 6 NADPH：把 3-PGA 加工为 G3P</text><path d="M360 495V534" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="1" style="animation-delay:1s" d="M360 495V534" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><rect x="28" y="545" width="664" height="175" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="581.88" font-size="19.4" fill="#18364b" text-anchor="start" font-weight="600">③ 分流：取出 1 份，留下 5 份</text><circle cx="65" cy="630" r="10" fill="#b56308"/><circle cx="90" cy="630" r="10" fill="#b56308"/><circle cx="115" cy="630" r="10" fill="#b56308"/><text x="48" y="682.25" font-size="17.8" fill="#18364b" text-anchor="start">净产 G3P</text><circle cx="250" cy="630" r="10" fill="#187864"/><circle cx="271" cy="630" r="10" fill="#187864"/><circle cx="292" cy="630" r="10" fill="#187864"/><circle cx="336" cy="630" r="10" fill="#187864"/><circle cx="357" cy="630" r="10" fill="#187864"/><circle cx="378" cy="630" r="10" fill="#187864"/><circle cx="422" cy="630" r="10" fill="#187864"/><circle cx="443" cy="630" r="10" fill="#187864"/><circle cx="464" cy="630" r="10" fill="#187864"/><circle cx="508" cy="630" r="10" fill="#187864"/><circle cx="529" cy="630" r="10" fill="#187864"/><circle cx="550" cy="630" r="10" fill="#187864"/><circle cx="594" cy="630" r="10" fill="#187864"/><circle cx="615" cy="630" r="10" fill="#187864"/><circle cx="636" cy="630" r="10" fill="#187864"/><text x="235" y="682.33" font-size="17.0" fill="#18364b" text-anchor="start">15 个碳 + 3 ATP → 再生 3 RuBP</text><path d="M670 695H704V118H652" fill="none" stroke="#187864" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="2" style="animation-delay:2s" d="M670 695H704V118H652" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><text x="28" y="767.25" font-size="17.8" fill="#18364b" text-anchor="start">投入 18 个碳 = 净取出 3 个 + 再生受体的 15 个</text><text x="28" y="808.25" font-size="17.8" fill="#18364b" text-anchor="start">净消耗 9 ATP、6 NADPH；不是 6 份产物都运走。</text></g></svg>
