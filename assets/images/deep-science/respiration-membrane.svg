<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">电子向前走，H⁺绕一圈，ATP 才合成</title><desc id="desc">线粒体内膜拓扑示意，复合体I、III、IV将氢离子泵向膜间隙，电子最终给氧，氢离子经ATP合酶返回基质。省略复合体II及部分载体结构。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="2"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="760" rx="18" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">电子向前走，H⁺绕一圈，ATP 才合成</text><text x="28" y="89" font-size="23" fill="#18364b" text-anchor="start">局部展平的线粒体内膜；不是整个细胞器的形状。</text><rect x="28" y="120" width="664" height="470" rx="12" fill="#edf5fb" stroke="#adc4d2" stroke-width="2"/><text x="48" y="163" font-size="27" fill="#18364b" text-anchor="start">膜间隙：H⁺较多</text><rect x="28" y="270" width="664" height="65" rx="0" fill="#b2cfe0" stroke="#226ca2" stroke-width="2"/><text x="48" y="575" font-size="27" fill="#18364b" text-anchor="start">线粒体基质</text><path d="M95 410V190" fill="none" stroke="#187864" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="57" y="250" width="76" height="110" rx="12" fill="#fff" stroke="#226ca2" stroke-width="2"/><text x="95" y="310" font-size="27" fill="#18364b" text-anchor="middle">I</text><text x="107" y="208" font-size="23" fill="#187864" text-anchor="start">H⁺</text><path d="M245 410V190" fill="none" stroke="#187864" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="207" y="250" width="76" height="110" rx="12" fill="#fff" stroke="#226ca2" stroke-width="2"/><text x="245" y="310" font-size="27" fill="#18364b" text-anchor="middle">III</text><text x="257" y="208" font-size="23" fill="#187864" text-anchor="start">H⁺</text><path d="M395 410V190" fill="none" stroke="#187864" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="357" y="250" width="76" height="110" rx="12" fill="#fff" stroke="#226ca2" stroke-width="2"/><text x="395" y="310" font-size="27" fill="#18364b" text-anchor="middle">IV</text><text x="407" y="208" font-size="23" fill="#187864" text-anchor="start">H⁺</text><path d="M135 302H200" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="0" style="animation-delay:0s" d="M135 302H200" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><path d="M285 302H350" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="1" style="animation-delay:1s" d="M285 302H350" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><path d="M395 365V425" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="2" style="animation-delay:2s" d="M395 365V425" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><text x="35" y="525" font-size="23" fill="#226ca2" text-anchor="start">NADH → I → Q → III → 细胞色素c → IV</text><text x="305" y="455" font-size="24" fill="#226ca2" text-anchor="start">O₂接电子</text><text x="305" y="490" font-size="24" fill="#226ca2" text-anchor="start">形成水</text><rect x="548" y="250" width="76" height="110" rx="12" fill="#fff" stroke="#187864" stroke-width="2"/><path d="M586 190V410" fill="none" stroke="#187864" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="3" style="animation-delay:3s" d="M586 190V410" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><text x="495" y="453" font-size="25" fill="#187864" text-anchor="start">ATP 合酶</text><text x="487" y="493" font-size="22" fill="#187864" text-anchor="start">ADP + Pi → ATP</text><text x="28" y="635" font-size="22" fill="#18364b" text-anchor="start">① 电子接力　② 泵 H⁺　③ 氧接电子　④ 回流合成 ATP</text><text x="28" y="680" font-size="24" fill="#18364b" text-anchor="start">复合体II不泵 H⁺；其电子从 Q 汇入，图中未画。</text><text x="28" y="724" font-size="22" fill="#18364b" text-anchor="start">箭头顺序仅供读图：真实过程耦联进行，不是排队开机。</text></svg>
