<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 875" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">从一片叶，走到两种反应的现场</title><desc id="desc">叶片、叶肉细胞与叶绿体逐层放大。光反应位于类囊体膜，卡尔文循环位于叶绿体基质；各层不是等比例。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="2"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="875" rx="18" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">从一片叶，走到两种反应的现场</text><text x="28" y="88" font-size="24" fill="#18364b" text-anchor="start">先找地点，再看反应：不是叶片里的一锅绿水。</text><path d="M65 225Q110 70 245 125Q295 235 140 270Z" fill="#b9ddba" stroke="#187864" stroke-width="3"/><path d="M95 245L235 139" fill="none" stroke="#187864" stroke-width="3"  marker-end="url(#arrow)"/><text x="80" y="310" font-size="24" fill="#18364b" text-anchor="start">叶片：CO₂经气孔进入</text><path d="M270 190H370" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><rect x="390" y="125" width="270" height="160" rx="12" fill="#e5f3e7" stroke="#187864" stroke-width="2"/><text x="415" y="164" font-size="25" fill="#18364b" text-anchor="start">一个叶肉细胞</text><ellipse cx="430" cy="200" rx="28" ry="15" fill="#73b881" stroke="#187864"/><ellipse cx="515" cy="220" rx="28" ry="15" fill="#73b881" stroke="#187864"/><ellipse cx="605" cy="195" rx="28" ry="15" fill="#73b881" stroke="#187864"/><text x="395" y="310" font-size="24" fill="#18364b" text-anchor="start">绿色小体：叶绿体</text><path d="M525 325V375" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><ellipse cx="360" cy="555" rx="310" ry="155" fill="#edf8e8" stroke="#187864" stroke-width="4"/><ellipse cx="360" cy="555" rx="300" ry="145" fill="none" stroke="#90b89b" stroke-width="2"/><text x="90" y="456" font-size="25" fill="#18364b" text-anchor="start">叶绿体剖面</text><rect x="135" y="510" width="190" height="16" rx="8" fill="#87be8f" stroke="#187864" stroke-width="2"/><rect x="135" y="530" width="190" height="16" rx="8" fill="#87be8f" stroke="#187864" stroke-width="2"/><rect x="135" y="550" width="190" height="16" rx="8" fill="#87be8f" stroke="#187864" stroke-width="2"/><rect x="135" y="570" width="190" height="16" rx="8" fill="#87be8f" stroke="#187864" stroke-width="2"/><text x="125" y="625" font-size="25" fill="#18364b" text-anchor="start">类囊体堆叠</text><text x="394" y="518" font-size="28" fill="#18364b" text-anchor="start">基质</text><text x="380" y="560" font-size="25" fill="#18364b" text-anchor="start">卡尔文循环</text><text x="380" y="596" font-size="24" fill="#18364b" text-anchor="start">在这里固定碳</text><text x="28" y="755" font-size="24" fill="#18364b" text-anchor="start">类囊体膜上：光反应；膜包围的内部叫“腔”。</text><text x="28" y="796" font-size="24" fill="#18364b" text-anchor="start">基质：类囊体外、叶绿体包膜内的空间。</text><text x="28" y="840" font-size="23" fill="#18364b" text-anchor="start">各层单独放大，形状、数量、大小均为结构示意。</text></svg>
