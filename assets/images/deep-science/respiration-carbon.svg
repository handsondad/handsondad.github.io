<svg xmlns="http://www.w3.org/2000/svg" width="720" height="940" viewBox="0 0 720 940" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">一颗葡萄糖，六个碳怎样离开？</title><desc id="desc">按每分子葡萄糖的稳态净收支，糖酵解不释放CO2，丙酮酸氧化释放2个CO2，两个循环净释放4个CO2。循环不是逐个碳当轮离开的录像。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="2"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="940" rx="18" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">一颗葡萄糖，六个碳怎样离开？</text><text x="28" y="90" font-size="24" fill="#18364b" text-anchor="start">圆点只记碳收支；不表示反应只发生这几步。</text><rect x="28" y="125" width="664" height="145" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><text x="48" y="163" font-size="26" fill="#18364b" text-anchor="start">① 葡萄糖：6 碳</text><circle cx="65" cy="203" r="10" fill="#187864"/><circle cx="94" cy="203" r="10" fill="#187864"/><circle cx="123" cy="203" r="10" fill="#187864"/><circle cx="152" cy="203" r="10" fill="#187864"/><circle cx="181" cy="203" r="10" fill="#187864"/><circle cx="210" cy="203" r="10" fill="#187864"/><text x="48" y="257" font-size="23" fill="#18364b" text-anchor="start">糖酵解：投入 2 ATP，产生 4 ATP</text><path d="M360 276V299" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="0" style="animation-delay:0s" d="M360 276V299" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><rect x="28" y="305" width="664" height="145" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><text x="48" y="343" font-size="26" fill="#18364b" text-anchor="start">② 两个丙酮酸：2 × 3 碳</text><circle cx="65" cy="383" r="10" fill="#187864"/><circle cx="94" cy="383" r="10" fill="#187864"/><circle cx="123" cy="383" r="10" fill="#187864"/><circle cx="193" cy="383" r="10" fill="#187864"/><circle cx="222" cy="383" r="10" fill="#187864"/><circle cx="251" cy="383" r="10" fill="#187864"/><text x="48" y="437" font-size="23" fill="#18364b" text-anchor="start">净得 2 ATP、2 NADH；此时还没释放 CO₂</text><path d="M360 456V479" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="1" style="animation-delay:1s" d="M360 456V479" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><rect x="28" y="485" width="664" height="145" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><text x="48" y="523" font-size="26" fill="#18364b" text-anchor="start">③ 两个乙酰基：2 × 2 碳</text><circle cx="65" cy="563" r="10" fill="#187864"/><circle cx="94" cy="563" r="10" fill="#187864"/><circle cx="193" cy="563" r="10" fill="#187864"/><circle cx="222" cy="563" r="10" fill="#187864"/><circle cx="470" cy="563" r="10" fill="#b56308"/><circle cx="550" cy="563" r="10" fill="#b56308"/><text x="450" y="597" font-size="23" fill="#b56308" text-anchor="start">2 CO₂</text><text x="48" y="617" font-size="23" fill="#18364b" text-anchor="start">释放 2 CO₂，另得 2 NADH</text><path d="M360 636V659" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="2" style="animation-delay:2s" d="M360 636V659" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><rect x="28" y="665" width="664" height="145" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><text x="48" y="703" font-size="26" fill="#18364b" text-anchor="start">④ 两轮三羧酸循环：净释 4 CO₂</text><circle cx="65" cy="743" r="10" fill="#187864"/><circle cx="193" cy="743" r="10" fill="#187864"/><circle cx="321" cy="743" r="10" fill="#187864"/><circle cx="449" cy="743" r="10" fill="#187864"/><text x="48" y="797" font-size="23" fill="#18364b" text-anchor="start">再得 6 NADH、2 FADH₂、约 2 ATP 当量</text><text x="28" y="863" font-size="23" fill="#18364b" text-anchor="start">总账：6 碳 → 6 CO₂；10 NADH、2 FADH₂待交电子。</text><text x="28" y="904" font-size="24" fill="#18364b" text-anchor="start">循环有受体再生；新进乙酰碳未必当轮离开。</text></svg>
