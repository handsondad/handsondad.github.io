<svg xmlns="http://www.w3.org/2000/svg" width="540" height="705" viewBox="0 0 540 705" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">一颗葡萄糖，六个碳怎样离开？</title><desc id="desc">按每分子葡萄糖的稳态净收支，糖酵解不释放CO2，丙酮酸氧化释放2个CO2，两个循环净释放4个CO2。循环不是逐个碳当轮离开的录像。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="1.8"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="538.5" height="703.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="43.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">一颗葡萄糖，六个碳怎样离开？</text><text x="28" y="88.25" font-size="17.8" fill="#18364b" text-anchor="start">圆点只记碳收支；不表示反应只发生这几步。</text><rect x="28" y="125" width="664" height="145" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="160.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">① 葡萄糖：6 碳</text><circle cx="65" cy="203" r="10" fill="#187864"/><circle cx="94" cy="203" r="10" fill="#187864"/><circle cx="123" cy="203" r="10" fill="#187864"/><circle cx="152" cy="203" r="10" fill="#187864"/><circle cx="181" cy="203" r="10" fill="#187864"/><circle cx="210" cy="203" r="10" fill="#187864"/><text x="48" y="255.33" font-size="17.0" fill="#18364b" text-anchor="start">糖酵解：投入 2 ATP，产生 4 ATP</text><path d="M360 276V299" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="0" style="animation-delay:0s" d="M360 276V299" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><rect x="28" y="305" width="664" height="145" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="340.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">② 两个丙酮酸：2 × 3 碳</text><circle cx="65" cy="383" r="10" fill="#187864"/><circle cx="94" cy="383" r="10" fill="#187864"/><circle cx="123" cy="383" r="10" fill="#187864"/><circle cx="193" cy="383" r="10" fill="#187864"/><circle cx="222" cy="383" r="10" fill="#187864"/><circle cx="251" cy="383" r="10" fill="#187864"/><text x="48" y="435.33" font-size="17.0" fill="#18364b" text-anchor="start">净得 2 ATP、2 NADH；此时还没释放 CO₂</text><path d="M360 456V479" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="1" style="animation-delay:1s" d="M360 456V479" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><rect x="28" y="485" width="664" height="145" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="520.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">③ 两个乙酰基：2 × 2 碳</text><circle cx="65" cy="563" r="10" fill="#187864"/><circle cx="94" cy="563" r="10" fill="#187864"/><circle cx="193" cy="563" r="10" fill="#187864"/><circle cx="222" cy="563" r="10" fill="#187864"/><circle cx="470" cy="563" r="10" fill="#b56308"/><circle cx="550" cy="563" r="10" fill="#b56308"/><text x="450" y="595.33" font-size="17.0" fill="#b56308" text-anchor="start">2 CO₂</text><text x="48" y="615.33" font-size="17.0" fill="#18364b" text-anchor="start">释放 2 CO₂，另得 2 NADH</text><path d="M360 636V659" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="2" style="animation-delay:2s" d="M360 636V659" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><rect x="28" y="665" width="664" height="145" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="700.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">④ 两轮三羧酸循环：净释 4 CO₂</text><circle cx="65" cy="743" r="10" fill="#187864"/><circle cx="193" cy="743" r="10" fill="#187864"/><circle cx="321" cy="743" r="10" fill="#187864"/><circle cx="449" cy="743" r="10" fill="#187864"/><text x="48" y="795.33" font-size="17.0" fill="#18364b" text-anchor="start">再得 6 NADH、2 FADH₂、约 2 ATP 当量</text><text x="28" y="861.33" font-size="17.0" fill="#18364b" text-anchor="start">总账：6 碳 → 6 CO₂；10 NADH、2 FADH₂待交电子。</text><text x="28" y="902.25" font-size="17.8" fill="#18364b" text-anchor="start">循环有受体再生；新进乙酰碳未必当轮离开。</text></g></svg>
