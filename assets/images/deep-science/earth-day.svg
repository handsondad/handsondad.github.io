<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">若地球历史只有一天，我们来得有多晚？</title><desc id="desc">地球45.4亿年压缩成24小时。约35亿年前生命证据约05点30分，约24亿年前大氧化事件约11点19分，寒武纪约21点09分。年代均为近似，后两项以数值生成时间。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="2"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="920" rx="18" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">若地球历史只有一天，我们来得有多晚？</text><text x="28" y="92" font-size="23" fill="#18364b" text-anchor="start">模型：把 45.4 亿年等比例压成一天，现在是 24:00。</text><path d="M60 155H665" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path d="M60 144V165" stroke="#18364b" stroke-width="2"/><text x="60" y="197" font-size="21" fill="#18364b" text-anchor="middle">00:00</text><path d="M160 144V165" stroke="#18364b" stroke-width="2"/><text x="160" y="197" font-size="21" fill="#18364b" text-anchor="middle">04:00</text><path d="M260 144V165" stroke="#18364b" stroke-width="2"/><text x="260" y="197" font-size="21" fill="#18364b" text-anchor="middle">08:00</text><path d="M360 144V165" stroke="#18364b" stroke-width="2"/><text x="360" y="197" font-size="21" fill="#18364b" text-anchor="middle">12:00</text><path d="M460 144V165" stroke="#18364b" stroke-width="2"/><text x="460" y="197" font-size="21" fill="#18364b" text-anchor="middle">16:00</text><path d="M560 144V165" stroke="#18364b" stroke-width="2"/><text x="560" y="197" font-size="21" fill="#18364b" text-anchor="middle">20:00</text><path d="M660 144V165" stroke="#18364b" stroke-width="2"/><text x="660" y="197" font-size="21" fill="#18364b" text-anchor="middle">24:00</text><circle cx="60.0" cy="155" r="6" fill="#187864"/><path d="M60.00 167V226H45" fill="none" stroke="#98b0c1" stroke-dasharray="4 5"/><rect x="28" y="240" width="664" height="66" rx="8" fill="#f0f5f9" stroke="#c5d3dd" stroke-width="2"/><text x="45" y="281" font-size="24" fill="#18364b" text-anchor="start">00:00　地球形成</text><circle cx="197.44493392070484" cy="155" r="6" fill="#b56308"/><path d="M197.44 167V309H45" fill="none" stroke="#98b0c1" stroke-dasharray="4 5"/><rect x="28" y="323" width="664" height="66" rx="8" fill="#f0f5f9" stroke="#c5d3dd" stroke-width="2"/><text x="45" y="364" font-size="24" fill="#18364b" text-anchor="start">05:30　约35亿年前：已有生命证据</text><circle cx="342.8193832599119" cy="155" r="6" fill="#b56308"/><path d="M342.82 167V392H45" fill="none" stroke="#98b0c1" stroke-dasharray="4 5"/><rect x="28" y="406" width="664" height="66" rx="8" fill="#f0f5f9" stroke="#c5d3dd" stroke-width="2"/><text x="45" y="447" font-size="24" fill="#18364b" text-anchor="start">11:19　约24亿年前：大氧化事件前后</text><circle cx="588.7665198237885" cy="155" r="6" fill="#b56308"/><path d="M588.77 167V475H45" fill="none" stroke="#98b0c1" stroke-dasharray="4 5"/><rect x="28" y="489" width="664" height="66" rx="8" fill="#f0f5f9" stroke="#c5d3dd" stroke-width="2"/><text x="45" y="530" font-size="24" fill="#18364b" text-anchor="start">21:09　约5.39亿年前：寒武纪开始</text><rect x="28" y="620" width="664" height="175" rx="12" fill="#f8efdf" stroke="#d4b481" stroke-width="2"/><text x="48" y="660" font-size="27" fill="#18364b" text-anchor="start">再放大午夜前的最后一小时</text><text x="48" y="705" font-size="24" fill="#18364b" text-anchor="start">23:39　约6600万年前：非鸟恐龙灭绝</text><text x="48" y="752" font-size="24" fill="#18364b" text-anchor="start">午夜前约 5.7 秒：约30万年前的智人</text><text x="28" y="839" font-size="23" fill="#18364b" text-anchor="start">时钟由所选近似年代换算；不是每件事的精确起点。</text><text x="28" y="880" font-size="24" fill="#18364b" text-anchor="start">早期生命证据的年代，不等于生命诞生的时刻。</text></svg>
