<svg xmlns="http://www.w3.org/2000/svg" width="540" height="686.25" viewBox="0 0 540 686.25" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">把 13 + 7 算完：谁记住下一步该做什么？</title><desc id="desc">四条自定义玩具CPU指令读取地址20的13，加上地址21的7，存到地址22，最后停止。所有执行状态由脚本模拟产生，未规定实际指令编码与时钟周期。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="1.8"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="538.5" height="684.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="43.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">把 13 + 7 算完：谁记住下一步该做什么？</text><text x="28" y="88.25" font-size="17.8" fill="#18364b" text-anchor="start">玩具 CPU：ACC 存当前值，PC 指向当前指令。</text><rect x="28" y="120" width="664" height="150" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="159.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">内存初态</text><text x="48" y="204.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">[20] = 13　　[21] = 7　　[22] = 0</text><text x="48" y="244.25" font-size="17.8" fill="#18364b" text-anchor="start">方括号内是地址；等号右边才是数据。</text><rect x="28" y="310" width="664" height="90" rx="12" fill="#f0f5f9" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="342.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">PC 0：LOAD [20]</text><text x="48" y="381.25" font-size="17.8" fill="#18364b" text-anchor="start">执行后 ACC = 13；[22] = 0</text><path d="M360 404V424" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="0" style="animation-delay:0s" d="M360 404V424" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><rect x="28" y="430" width="664" height="90" rx="12" fill="#f0f5f9" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="462.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">PC 1：ADD [21]</text><text x="48" y="501.25" font-size="17.8" fill="#18364b" text-anchor="start">执行后 ACC = 20；[22] = 0</text><path d="M360 524V544" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="1" style="animation-delay:1s" d="M360 524V544" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><rect x="28" y="550" width="664" height="90" rx="12" fill="#f0f5f9" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="582.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">PC 2：STORE [22]</text><text x="48" y="621.25" font-size="17.8" fill="#18364b" text-anchor="start">执行后 ACC = 20；[22] = 20</text><path d="M360 644V664" fill="none" stroke="#226ca2" stroke-width="2.4"  marker-end="url(#arrow)"/><path class="trace" data-step="2" style="animation-delay:2s" d="M360 644V664" fill="none" stroke="#dc900c" stroke-width="3.8" pathLength="1"/><rect x="28" y="670" width="664" height="90" rx="12" fill="#f0f5f9" stroke="#adc4d2" stroke-width="1.5"/><text x="48" y="702.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">PC 3：HALT</text><text x="48" y="741.25" font-size="17.8" fill="#18364b" text-anchor="start">执行后 ACC = 20；[22] = 20</text><text x="28" y="835.33" font-size="17.0" fill="#18364b" text-anchor="start">每步都经历：取指令 → 译码 → 执行 → 更新状态。</text><text x="28" y="878.40" font-size="16.3" fill="#18364b" text-anchor="start">自定义指令教学模型，不是 x86、ARM 或 Hack 指令集。</text></g></svg>
