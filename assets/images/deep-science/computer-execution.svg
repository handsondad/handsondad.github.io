<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 915" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">把 13 + 7 算完：谁记住下一步该做什么？</title><desc id="desc">四条自定义玩具CPU指令读取地址20的13，加上地址21的7，存到地址22，最后停止。所有执行状态由脚本模拟产生，未规定实际指令编码与时钟周期。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="2"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="915" rx="18" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">把 13 + 7 算完：谁记住下一步该做什么？</text><text x="28" y="90" font-size="24" fill="#18364b" text-anchor="start">玩具 CPU：ACC 存当前值，PC 指向当前指令。</text><rect x="28" y="120" width="664" height="150" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><text x="48" y="162" font-size="28" fill="#18364b" text-anchor="start">内存初态</text><text x="48" y="207" font-size="26" fill="#18364b" text-anchor="start">[20] = 13　　[21] = 7　　[22] = 0</text><text x="48" y="246" font-size="24" fill="#18364b" text-anchor="start">方括号内是地址；等号右边才是数据。</text><rect x="28" y="310" width="664" height="90" rx="12" fill="#f0f5f9" stroke="#adc4d2" stroke-width="2"/><text x="48" y="345" font-size="26" fill="#18364b" text-anchor="start">PC 0：LOAD [20]</text><text x="48" y="383" font-size="24" fill="#18364b" text-anchor="start">执行后 ACC = 13；[22] = 0</text><path d="M360 404V424" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="0" style="animation-delay:0s" d="M360 404V424" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><rect x="28" y="430" width="664" height="90" rx="12" fill="#f0f5f9" stroke="#adc4d2" stroke-width="2"/><text x="48" y="465" font-size="26" fill="#18364b" text-anchor="start">PC 1：ADD [21]</text><text x="48" y="503" font-size="24" fill="#18364b" text-anchor="start">执行后 ACC = 20；[22] = 0</text><path d="M360 524V544" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="1" style="animation-delay:1s" d="M360 524V544" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><rect x="28" y="550" width="664" height="90" rx="12" fill="#f0f5f9" stroke="#adc4d2" stroke-width="2"/><text x="48" y="585" font-size="26" fill="#18364b" text-anchor="start">PC 2：STORE [22]</text><text x="48" y="623" font-size="24" fill="#18364b" text-anchor="start">执行后 ACC = 20；[22] = 20</text><path d="M360 644V664" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path class="trace" data-step="2" style="animation-delay:2s" d="M360 644V664" fill="none" stroke="#dc900c" stroke-width="5" pathLength="1"/><rect x="28" y="670" width="664" height="90" rx="12" fill="#f0f5f9" stroke="#adc4d2" stroke-width="2"/><text x="48" y="705" font-size="26" fill="#18364b" text-anchor="start">PC 3：HALT</text><text x="48" y="743" font-size="24" fill="#18364b" text-anchor="start">执行后 ACC = 20；[22] = 20</text><text x="28" y="837" font-size="23" fill="#18364b" text-anchor="start">每步都经历：取指令 → 译码 → 执行 → 更新状态。</text><text x="28" y="880" font-size="22" fill="#18364b" text-anchor="start">自定义指令教学模型，不是 x86、ARM 或 Hack 指令集。</text></svg>
