<svg xmlns="http://www.w3.org/2000/svg" width="720" height="905" viewBox="0 0 720 905" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">继续放大：从原子核走到尚未分辨的边界</title><desc id="desc">原子核和质子各自放大。质子的三价夸克仅代表组成，非静态三球模型。夸克画为定位符号，不赋予有限半径。电子不是由夸克组成。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="2"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="905" rx="18" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">继续放大：从原子核走到尚未分辨的边界</text><text x="28" y="91" font-size="24" fill="#18364b" text-anchor="start">不是实心套娃：电子那条支路并不会通向夸克。</text><rect x="28" y="125" width="664" height="215" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><rect x="28" y="360" width="664" height="215" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><rect x="28" y="595" width="664" height="215" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><circle cx="120" cy="178" r="13" fill="#226ca2"/><circle cx="145" cy="178" r="13" fill="#b56308"/><circle cx="170" cy="178" r="13" fill="#226ca2"/><circle cx="95" cy="203" r="13" fill="#226ca2"/><circle cx="120" cy="203" r="13" fill="#b56308"/><circle cx="145" cy="203" r="13" fill="#226ca2"/><circle cx="170" cy="203" r="13" fill="#b56308"/><circle cx="195" cy="203" r="13" fill="#226ca2"/><circle cx="95" cy="228" r="13" fill="#b56308"/><circle cx="120" cy="228" r="13" fill="#226ca2"/><circle cx="145" cy="228" r="13" fill="#b56308"/><circle cx="170" cy="228" r="13" fill="#226ca2"/><circle cx="195" cy="228" r="13" fill="#b56308"/><circle cx="95" cy="253" r="13" fill="#226ca2"/><circle cx="120" cy="253" r="13" fill="#b56308"/><circle cx="145" cy="253" r="13" fill="#226ca2"/><circle cx="170" cy="253" r="13" fill="#b56308"/><circle cx="195" cy="253" r="13" fill="#226ca2"/><circle cx="120" cy="278" r="13" fill="#226ca2"/><circle cx="145" cy="278" r="13" fill="#b56308"/><circle cx="170" cy="278" r="13" fill="#226ca2"/><text x="265" y="172" font-size="24" fill="#18364b" text-anchor="start">④ 原子核：约 10⁻¹⁵～10⁻¹⁴ m</text><text x="265" y="218" font-size="24" fill="#18364b" text-anchor="start">尺度随核种与定义改变</text><text x="265" y="264" font-size="24" fill="#18364b" text-anchor="start">通常含质子和中子</text><text x="265" y="309" font-size="24" fill="#18364b" text-anchor="start">普通氢核只有一个质子</text><circle cx="145" cy="462" r="76" fill="#e4ecf7"/><circle cx="185.0" cy="462.0" r="17" fill="#226ca2"/><text x="185.0" y="470.0" font-size="23" fill="#fff" text-anchor="middle">u</text><circle cx="125.0" cy="496.6410161513775" r="17" fill="#226ca2"/><text x="125.0" y="504.6410161513775" font-size="23" fill="#fff" text-anchor="middle">u</text><circle cx="124.99999999999999" cy="427.3589838486225" r="17" fill="#226ca2"/><text x="124.99999999999999" y="435.3589838486225" font-size="23" fill="#fff" text-anchor="middle">d</text><text x="265" y="409" font-size="24" fill="#18364b" text-anchor="start">⑤ 质子：特征尺度在飞米量级</text><text x="265" y="455" font-size="24" fill="#18364b" text-anchor="start">均方根电荷半径约 0.84 fm</text><text x="265" y="501" font-size="24" fill="#18364b" text-anchor="start">u、u、d 只表示价夸克组成</text><text x="265" y="544" font-size="22" fill="#18364b" text-anchor="start">还涉及胶子与海夸克，不是三弹珠</text><path d="M110 695H180M145 660V730" stroke="#226ca2" stroke-width="3"/><text x="145" y="775" font-size="22" fill="#18364b" text-anchor="middle">符号，不是照片</text><text x="265" y="644" font-size="26" fill="#18364b" text-anchor="start">⑥ 夸克：未测得有限大小</text><text x="265" y="690" font-size="24" fill="#18364b" text-anchor="start">标准模型中按点状粒子描述</text><text x="265" y="736" font-size="24" fill="#18364b" text-anchor="start">10⁻¹⁸ m 仅作参照长度</text><text x="265" y="779" font-size="24" fill="#18364b" text-anchor="start">不能把紫色圆球当作实测外形</text><text x="28" y="865" font-size="23" fill="#18364b" text-anchor="start">1 nm = 10⁻⁹ m；1 fm = 10⁻¹⁵ m；各幅不同比例。</text></svg>
