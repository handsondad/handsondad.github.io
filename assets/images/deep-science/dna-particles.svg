<svg xmlns="http://www.w3.org/2000/svg" width="540" height="678.75" viewBox="0 0 540 678.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">继续放大：从原子核走到尚未分辨的边界</title><desc id="desc">原子核和质子各自放大。质子的三价夸克仅代表组成，非静态三球模型。夸克画为定位符号，不赋予有限半径。电子不是由夸克组成。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="1.8"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="538.5" height="677.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="28" y="43.48" font-size="21.0" fill="#18364b" text-anchor="start" font-weight="700">继续放大：从原子核走到尚未分辨的边界</text><text x="28" y="89.25" font-size="17.8" fill="#18364b" text-anchor="start">不是实心套娃：电子那条支路并不会通向夸克。</text><rect x="28" y="125" width="664" height="215" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><rect x="28" y="360" width="664" height="215" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><rect x="28" y="595" width="664" height="215" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="1.5"/><circle cx="120" cy="178" r="13" fill="#226ca2"/><circle cx="145" cy="178" r="13" fill="#b56308"/><circle cx="170" cy="178" r="13" fill="#226ca2"/><circle cx="95" cy="203" r="13" fill="#226ca2"/><circle cx="120" cy="203" r="13" fill="#b56308"/><circle cx="145" cy="203" r="13" fill="#226ca2"/><circle cx="170" cy="203" r="13" fill="#b56308"/><circle cx="195" cy="203" r="13" fill="#226ca2"/><circle cx="95" cy="228" r="13" fill="#b56308"/><circle cx="120" cy="228" r="13" fill="#226ca2"/><circle cx="145" cy="228" r="13" fill="#b56308"/><circle cx="170" cy="228" r="13" fill="#226ca2"/><circle cx="195" cy="228" r="13" fill="#b56308"/><circle cx="95" cy="253" r="13" fill="#226ca2"/><circle cx="120" cy="253" r="13" fill="#b56308"/><circle cx="145" cy="253" r="13" fill="#226ca2"/><circle cx="170" cy="253" r="13" fill="#b56308"/><circle cx="195" cy="253" r="13" fill="#226ca2"/><circle cx="120" cy="278" r="13" fill="#226ca2"/><circle cx="145" cy="278" r="13" fill="#b56308"/><circle cx="170" cy="278" r="13" fill="#226ca2"/><text x="265" y="170.25" font-size="17.8" fill="#18364b" text-anchor="start">④ 原子核：约 10⁻¹⁵～10⁻¹⁴ m</text><text x="265" y="216.25" font-size="17.8" fill="#18364b" text-anchor="start">尺度随核种与定义改变</text><text x="265" y="262.25" font-size="17.8" fill="#18364b" text-anchor="start">通常含质子和中子</text><text x="265" y="307.25" font-size="17.8" fill="#18364b" text-anchor="start">普通氢核只有一个质子</text><circle cx="145" cy="462" r="76" fill="#e4ecf7"/><circle cx="185.0" cy="462.0" r="17" fill="#226ca2"/><text x="185.0" y="468.33" font-size="17.0" fill="#fff" text-anchor="middle">u</text><circle cx="125.0" cy="496.6410161513775" r="17" fill="#226ca2"/><text x="125.0" y="502.97" font-size="17.0" fill="#fff" text-anchor="middle">u</text><circle cx="124.99999999999999" cy="427.3589838486225" r="17" fill="#226ca2"/><text x="124.99999999999999" y="433.68" font-size="17.0" fill="#fff" text-anchor="middle">d</text><text x="265" y="407.25" font-size="17.8" fill="#18364b" text-anchor="start">⑤ 质子：特征尺度在飞米量级</text><text x="265" y="453.25" font-size="17.8" fill="#18364b" text-anchor="start">均方根电荷半径约 0.84 fm</text><text x="265" y="499.25" font-size="17.8" fill="#18364b" text-anchor="start">u、u、d 只表示价夸克组成</text><text x="265" y="542.40" font-size="16.3" fill="#18364b" text-anchor="start">还涉及胶子与海夸克，不是三弹珠</text><path d="M110 695H180M145 660V730" stroke="#226ca2" stroke-width="3"/><text x="145" y="773.40" font-size="16.3" fill="#18364b" text-anchor="middle">符号，不是照片</text><text x="265" y="641.96" font-size="18.7" fill="#18364b" text-anchor="start" font-weight="600">⑥ 夸克：未测得有限大小</text><text x="265" y="688.25" font-size="17.8" fill="#18364b" text-anchor="start">标准模型中按点状粒子描述</text><text x="265" y="734.25" font-size="17.8" fill="#18364b" text-anchor="start">10⁻¹⁸ m 仅作参照长度</text><text x="265" y="777.25" font-size="17.8" fill="#18364b" text-anchor="start">不能把紫色圆球当作实测外形</text><text x="28" y="863.33" font-size="17.0" fill="#18364b" text-anchor="start">1 nm = 10⁻⁹ m；1 fm = 10⁻¹⁵ m；各幅不同比例。</text></g></svg>
