<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 805" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">电路不会背加法口诀，却能完成 1 + 1</title><desc id="desc">半加器逻辑：异或产生本位，与门产生进位，四种输入的真值表均由逻辑计算生成。线为逻辑连接示意，交叉不表示额外接点。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#18364b" stroke-width="2"/></marker><radialGradient id="cloud"><stop stop-color="#6da4d4" stop-opacity=".85"/><stop offset="1" stop-color="#6da4d4" stop-opacity=".05"/></radialGradient></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="805" rx="18" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">电路不会背加法口诀，却能完成 1 + 1</text><text x="28" y="91" font-size="24" fill="#18364b" text-anchor="start">只算两个二进制位；输出“本位”和“进位”。</text><text x="55" y="175" font-size="26" fill="#18364b" text-anchor="start">输入 a</text><text x="55" y="325" font-size="26" fill="#18364b" text-anchor="start">输入 b</text><rect x="270" y="130" width="160" height="90" rx="12" fill="#e3eef8" stroke="#226ca2" stroke-width="2"/><rect x="270" y="285" width="160" height="90" rx="12" fill="#e3f2e9" stroke="#187864" stroke-width="2"/><text x="350" y="184" font-size="25" fill="#18364b" text-anchor="middle">XOR 异或</text><text x="350" y="340" font-size="25" fill="#18364b" text-anchor="middle">AND 与</text><path d="M145 165H250V175H265" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path d="M145 315H210V195H265" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path d="M170 165V330H265" fill="none" stroke="#187864" stroke-width="3"  marker-end="url(#arrow)"/><path d="M145 315H240V350H265" fill="none" stroke="#187864" stroke-width="3"  marker-end="url(#arrow)"/><path d="M440 175H545" fill="none" stroke="#226ca2" stroke-width="3"  marker-end="url(#arrow)"/><path d="M440 330H545" fill="none" stroke="#187864" stroke-width="3"  marker-end="url(#arrow)"/><text x="556" y="184" font-size="25" fill="#226ca2" text-anchor="start">本位 s</text><text x="556" y="339" font-size="25" fill="#187864" text-anchor="start">进位 c</text><rect x="28" y="425" width="664" height="250" rx="12" fill="#edf4f8" stroke="#adc4d2" stroke-width="2"/><text x="75" y="468" font-size="26" fill="#18364b" text-anchor="start">a　b</text><text x="300" y="468" font-size="26" fill="#18364b" text-anchor="start">进位 c</text><text x="510" y="468" font-size="26" fill="#18364b" text-anchor="start">本位 s</text><text x="75" y="515" font-size="26" fill="#18364b" text-anchor="start">0　0</text><text x="340" y="515" font-size="26" fill="#18364b" text-anchor="start">0</text><text x="550" y="515" font-size="26" fill="#18364b" text-anchor="start">0</text><text x="75" y="557" font-size="26" fill="#18364b" text-anchor="start">0　1</text><text x="340" y="557" font-size="26" fill="#18364b" text-anchor="start">0</text><text x="550" y="557" font-size="26" fill="#18364b" text-anchor="start">1</text><text x="75" y="599" font-size="26" fill="#18364b" text-anchor="start">1　0</text><text x="340" y="599" font-size="26" fill="#18364b" text-anchor="start">0</text><text x="550" y="599" font-size="26" fill="#18364b" text-anchor="start">1</text><text x="75" y="641" font-size="26" fill="#18364b" text-anchor="start">1　1</text><text x="340" y="641" font-size="26" fill="#18364b" text-anchor="start">1</text><text x="550" y="641" font-size="26" fill="#18364b" text-anchor="start">0</text><text x="28" y="725" font-size="24" fill="#18364b" text-anchor="start">1 + 1 = 二进制 10：本位 0，把 1 交给左一位。</text><text x="28" y="768" font-size="24" fill="#18364b" text-anchor="start">这是半加器；连续加法还要接收前一位的进位。</text></svg>
