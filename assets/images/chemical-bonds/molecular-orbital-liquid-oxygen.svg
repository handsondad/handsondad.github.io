<text x="400" y="396" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">键级公式一算即准（含 2s 成/反键抵消后）：</text>
<text x="400" y="417" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">• 氧气 O₂：(8 成键 − 4 反键)÷2 = 键级 2（顺磁双键）</text>
<text x="400" y="437" font-size="10.5" fill="#1e293b" text-anchor="start">• 氮气 N₂：(8 成键 − 2 反键)÷2 = 键级 3（946 kJ 极稳）</text>
<text x="400" y="457" font-size="10.5" fill="#1e293b" text-anchor="start">• 双氦 He₂：(2 成键 − 2 反键)÷2 = 键级 0（根本不成键）</text>
<text x="380" y="505" font-size="11" fill="#64748b" text-anchor="middle">数据来源：OpenStax Chemistry 2e 8.4 节（分子轨道理论、二周期双原子分子排布与键级）</text>
</svg>
