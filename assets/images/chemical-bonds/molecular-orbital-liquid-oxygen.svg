<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么淡蓝色液氧会被磁铁吸住悬空？——分子轨道（MO）破案</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">路易斯点式把电子全配成双而失算；量子力学反键轨道 π* 揭开两颗单身电子与键级公式</text>
<rect x="20" y="74" width="336" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="40" cy="96" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="40" y="100" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="101" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">路易斯结构的盲区：液氧顺磁性实验</text>
<rect x="36" y="114" width="304" height="72" rx="10" fill="#fef2f2" stroke="#b91c1c"/>
<text x="48" y="134" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">路易斯点式写法：  :Ö = Ö:</text>
<text x="48" y="154" font-size="10.5" fill="#1e293b" text-anchor="start">表面看 12 颗价电子全部两两成对 →</text>
<text x="48" y="173" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="700">错误预言：氧气应当抗磁（不被磁铁吸引）</text>
<rect x="36" y="198" width="304" height="122" rx="10" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="188" y="218" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">真实物理实验：−183°C 液氧悬停在磁极间！</text>
<rect x="54" y="238" width="76" height="44" rx="6" fill="#b91c1c" />
<text x="92" y="265" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">N 极</text>
<rect x="246" y="238" width="76" height="44" rx="6" fill="#475569" />
<text x="284" y="265" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">S 极</text>
<ellipse cx="188" cy="260" rx="54" ry="18" fill="#38bdf8" stroke="#1d6fa5" stroke-width="2"/>
<text x="188" y="264" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700">淡蓝液氧 O₂ ↑↓?</text>
<text x="188" y="305" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">古伊磁天平实测：每个 O₂ 必含 2 颗未成对电子！</text>
<rect x="36" y="332" width="304" height="140" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="48" y="352" font-size="11.5" fill="#475569" text-anchor="start" font-weight="700">原子轨道线性组合（LCAO）两条铁律：</text>
<text x="48" y="375" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">• 同相叠加（ψₐ + ψᵦ）→ 成键轨道 (σ / π)</text>
<text x="56" y="393" font-size="10.5" fill="#1e293b" text-anchor="start">核间电子密度暴增，能量降低，把两核拉紧</text>
<text x="48" y="417" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="700">• 反相相减（ψₐ − ψᵦ）→ 反键轨道 (σ* / π*)</text>
<text x="56" y="435" font-size="10.5" fill="#1e293b" text-anchor="start">核间出现电子为零的“节面”，能量升高拆台</text>
<text x="48" y="458" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">★ 键级 BO = (成键电子数 − 反键电子数) ÷ 2</text>
<rect x="372" y="74" width="368" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="392" cy="96" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="392" y="100" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
