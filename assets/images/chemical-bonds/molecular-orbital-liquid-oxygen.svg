<line x1="458.0" y1="248.0" x2="476.0" y2="248.0" stroke="#475569" stroke-width="2.6"/><text x="467.0" y="244" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">↑</text>
<text x="444" y="266" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">左 O (2p⁴)</text>
<line x1="640.0" y1="248.0" x2="658.0" y2="248.0" stroke="#475569" stroke-width="2.6"/><text x="644.0" y="244" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">↑</text><text x="654.0" y="244" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">↓</text>
<line x1="663.0" y1="248.0" x2="681.0" y2="248.0" stroke="#475569" stroke-width="2.6"/><text x="672.0" y="244" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">↑</text>
<line x1="686.0" y1="248.0" x2="704.0" y2="248.0" stroke="#475569" stroke-width="2.6"/><text x="695.0" y="244" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">↑</text>
<text x="672" y="266" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">右 O (2p⁴)</text>
