<text x="558" y="164" font-size="10" fill="#64748b" text-anchor="middle">σ*₂ₚ（反键空）</text>
<rect x="506" y="176" width="104" height="44" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
<line x1="518.0" y1="204.0" x2="550.0" y2="204.0" stroke="#c25014" stroke-width="2.6"/><text x="534.0" y="200" font-size="14" fill="#c25014" text-anchor="middle" font-weight="700">↑</text>
<line x1="566.0" y1="204.0" x2="598.0" y2="204.0" stroke="#c25014" stroke-width="2.6"/><text x="582.0" y="200" font-size="14" fill="#c25014" text-anchor="middle" font-weight="700">↑</text>
<text x="558" y="233" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">π*₂ₚ（2 颗单身同自旋！）</text>
<line x1="518.0" y1="292.0" x2="550.0" y2="292.0" stroke="#1d6fa5" stroke-width="2.6"/><text x="529.0" y="288" font-size="13" fill="#1d6fa5" text-anchor="middle" font-weight="700">↑</text><text x="539.0" y="288" font-size="13" fill="#1d6fa5" text-anchor="middle" font-weight="700">↓</text>
