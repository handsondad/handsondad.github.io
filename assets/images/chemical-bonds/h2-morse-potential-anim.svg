<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">氢分子莫尔斯势能曲线与化学键成键放热断键吸热能量账本</title>
<desc id="desc">左侧展示两个氢原子靠近时势能随核间距变化的莫尔斯势能曲线，在74皮米处达到负436千焦每摩尔最低点，小于50皮米急剧排斥；右侧用氢气与氯气生成氯化氢展示拆旧键吸热679千焦、成新键放热864千焦、净放热185千焦。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#b91c1c"/></marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes approachAtom {
    0%, 10% { transform: translateX(182px); }
    68%, 100% { transform: translateX(0px); }
  }
  @keyframes cloudGlow {
    0%, 28% { opacity: 0.08; }
    68%, 100% { opacity: 0.92; }
  }
  @keyframes wellPulse {
    0%, 62% { opacity: 0.25; }
    78%, 100% { opacity: 1; }
  }
  .h-approach { animation: approachAtom 6.2s cubic-bezier(0.25, 0.8, 0.25, 1) 1 forwards; }
  .bond-cloud { animation: cloudGlow 6.2s ease-out 1 forwards; }
  .well-badge { animation: wellPulse 6.2s ease-out 1 forwards; }
  @media (prefers-reduced-motion: reduce) {
    .h-approach, .bond-cloud, .well-badge { animation: none !important; transform: none !important; opacity: 1 !important; }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么两个原子既不擦肩而过，也不撞成一团？——氢分子势能阱</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">核间距离 r 决定吸引与排斥的平衡点（r₀ = 74 pm，成键放热 −436 kJ/mol；支持减少动态效果）</text>
<rect x="20" y="74" width="456" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="40" cy="96" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="40" y="100" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="101" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">H₂ 莫尔斯势能曲线 V(r) 与电子云相长干涉</text>
<rect x="38" y="114" width="420" height="68" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
<ellipse class="bond-cloud" cx="141" cy="148" rx="46" ry="22" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="116" cy="148" r="15" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2"/>
<text x="116" y="153" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="700">Hₐ⁺</text>
<circle cx="166" cy="148" r="15" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3"/>
<g class="h-approach"><circle cx="166" cy="148" r="15" fill="#e7f6ee" stroke="#18794e" stroke-width="2"/><text x="166" y="153" font-size="12" fill="#18794e" text-anchor="middle" font-weight="700">Hᵦ⁺</text></g>
<line x1="332.0" y1="148.0" x2="200.0" y2="148.0" stroke="#18794e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-muted)"/>
<text x="272" y="136" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">从远距靠近 → 停在 74 pm</text>
<text x="394" y="169" font-size="10.5" fill="#64748b" text-anchor="middle">单次动画定格成键态</text>
<line x1="82.0" y1="198.0" x2="82.0" y2="424.0" stroke="#475569" stroke-width="1.5"/>
<line x1="82.0" y1="424.0" x2="448.0" y2="424.0" stroke="#475569" stroke-width="1.5"/>
<line x1="82.0" y1="291.1" x2="448.0" y2="291.1" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="75" y="295.1" font-size="11" fill="#475569" text-anchor="end" font-weight="600">0</text>
<text x="75" y="215.3" font-size="10.5" fill="#b91c1c" text-anchor="end">+300</text>
<text x="75" y="348.2" font-size="10.5" fill="#64748b" text-anchor="end">−200</text>
<text x="75" y="411.0" font-size="11" fill="#1d6fa5" text-anchor="end" font-weight="700">−436</text>
<text x="34" y="250" font-size="11" fill="#475569" text-anchor="start" font-weight="700">势能</text>
<text x="32" y="266" font-size="10" fill="#64748b" text-anchor="start">kJ/mol</text>
<line x1="99.3" y1="424.0" x2="99.3" y2="429.0" stroke="#475569" stroke-width="1.3"/>
<text x="99.3" y="443.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">38</text>
<line x1="151.2" y1="424.0" x2="151.2" y2="429.0" stroke="#475569" stroke-width="1.3"/>
<text x="151.2" y="443.0" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">74</text>
<line x1="260.7" y1="424.0" x2="260.7" y2="429.0" stroke="#475569" stroke-width="1.3"/>
<text x="260.7" y="443.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">150</text>
<line x1="404.8" y1="424.0" x2="404.8" y2="429.0" stroke="#475569" stroke-width="1.3"/>
<text x="404.8" y="443.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">250</text>
<text x="266" y="464" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">两原子核间距离 r (pm，1 pm = 10⁻¹² m)</text>
