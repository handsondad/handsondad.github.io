<polyline points="99.3,288.6 100.7,297.5 102.2,305.9 103.6,313.7 105.1,321.2 106.5,328.1 107.9,334.7 109.4,340.9 110.8,346.6 112.3,352.0 113.7,357.1 115.1,361.8 116.6,366.2 118.0,370.3 119.5,374.1 120.9,377.7 122.3,380.9 123.8,384.0 125.2,386.7 126.7,389.3 128.1,391.6 129.6,393.8 131.0,395.7 132.4,397.4 133.9,399.0 135.3,400.4 136.8,401.7 138.2,402.8 139.6,403.7 141.1,404.5 142.5,405.2 144.0,405.8 145.4,406.2 146.8,406.6 148.3,406.8 149.7,406.9 151.2,407.0 152.6,406.9 154.0,406.8 155.5,406.6 156.9,406.3 158.4,406.0 159.8,405.6 161.3,405.1 162.7,404.6 164.1,404.0 165.6,403.4 167.0,402.7 168.5,402.0 169.9,401.2 171.3,400.4 172.8,399.6 174.2,398.7 175.7,397.8 177.1,396.9 178.5,396.0 180.0,395.0 181.4,394.0 182.9,393.0 184.3,392.0 185.7,390.9 187.2,389.9 188.6,388.8 190.1,387.7 191.5,386.6 193.0,385.5 194.4,384.4 195.8,383.3 197.3,382.2 198.7,381.1 200.2,379.9 201.6,378.8 203.0,377.7 204.5,376.6 205.9,375.5 207.4,374.3 208.8,373.2 210.2,372.1 211.7,371.0 213.1,369.9 214.6,368.8 216.0,367.7 217.4,366.6 218.9,365.5 220.3,364.4 221.8,363.4 223.2,362.3 224.7,361.2 226.1,360.2 227.5,359.2 229.0,358.1 230.4,357.1 231.9,356.1 233.3,355.1 234.7,354.1 236.2,353.1 237.6,352.1 239.1,351.2 240.5,350.2 241.9,349.3 243.4,348.4 244.8,347.4 246.3,346.5 247.7,345.6 249.1,344.8 250.6,343.9 252.0,343.0 253.5,342.2 254.9,341.3 256.4,340.5 257.8,339.7 259.2,338.9 260.7,338.1 262.1,337.3 263.6,336.5 265.0,335.7 266.4,335.0 267.9,334.2 269.3,333.5 270.8,332.8 272.2,332.0 273.6,331.3 275.1,330.7 276.5,330.0 278.0,329.3 279.4,328.6 280.9,328.0 282.3,327.3 283.7,326.7 285.2,326.1 286.6,325.5 288.1,324.9 289.5,324.3 290.9,323.7 292.4,323.1 293.8,322.5 295.3,322.0 296.7,321.4 298.1,320.9 299.6,320.4 301.0,319.8 302.5,319.3 303.9,318.8 305.3,318.3 306.8,317.8 308.2,317.4 309.7,316.9 311.1,316.4 312.6,316.0 314.0,315.5 315.4,315.1 316.9,314.6 318.3,314.2 319.8,313.8 321.2,313.4 322.6,313.0 324.1,312.6 325.5,312.2 327.0,311.8 328.4,311.4 329.8,311.0 331.3,310.7 332.7,310.3 334.2,310.0 335.6,309.6 337.0,309.3 338.5,308.9 339.9,308.6 341.4,308.3 342.8,308.0 344.3,307.6 345.7,307.3 347.1,307.0 348.6,306.7 350.0,306.5 351.5,306.2 352.9,305.9 354.3,305.6 355.8,305.3 357.2,305.1 358.7,304.8 360.1,304.6 361.5,304.3 363.0,304.1 364.4,303.8 365.9,303.6 367.3,303.3 368.7,303.1 370.2,302.9 371.6,302.7 373.1,302.5 374.5,302.2 376.0,302.0 377.4,301.8 378.8,301.6 380.3,301.4 381.7,301.2 383.2,301.0 384.6,300.8 386.0,300.7 387.5,300.5 388.9,300.3 390.4,300.1 391.8,300.0 393.2,299.8 394.7,299.6 396.1,299.5 397.6,299.3 399.0,299.2 400.4,299.0 401.9,298.9 403.3,298.7 404.8,298.6 406.2,298.4 407.7,298.3 409.1,298.1 410.5,298.0 412.0,297.9 413.4,297.7 414.9,297.6 416.3,297.5 417.7,297.4 419.2,297.3 420.6,297.1 422.1,297.0 423.5,296.9 424.9,296.8 426.4,296.7 427.8,296.6 429.3,296.5 430.7,296.4 432.1,296.3 433.6,296.2 435.0,296.1 436.5,296.0 437.9,295.9 439.4,295.8 440.8,295.7 442.2,295.6 443.7,295.5 445.1,295.4 446.6,295.4 448.0,295.3" fill="none" stroke="#1d6fa5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="151.2" y1="291.1" x2="151.2" y2="407.0" stroke="#18794e" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle class="well-badge" cx="151.2" cy="407.0" r="6" fill="#1d6fa5" stroke="#ffffff" stroke-width="2"/>
<text x="106" y="218" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">④ r &lt; 38 pm 强排斥陡墙</text>
<text x="106" y="234" font-size="10.5" fill="#1e293b" text-anchor="start">核间正电斥力+泡利排斥</text>
<text x="332" y="274" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">① 远距孤立双原子 (V = 0)</text>
<text x="336" y="338" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">② 共享电子云吸引 → 放热下滑</text>
<rect x="164" y="380" width="236" height="36" rx="8" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="282" y="396" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">③ 谷底平衡键长 r₀ = 74 pm</text>
<text x="282" y="411" font-size="10.5" fill="#1e293b" text-anchor="middle">成键释放 436 kJ/mol（最稳态）</text>
<rect x="492" y="74" width="248" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="512" cy="96" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="512" y="100" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="534" y="101" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">头号误区：断键其实要吸热！</text>
<rect x="508" y="116" width="216" height="122" rx="10" fill="#fef1e8" stroke="#c25014"/>
<text x="520" y="137" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">成键 = 掉进势能坑（放热）</text>
<text x="520" y="155" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">2 H(g) → H₂(g)   ΔH = −436 kJ</text>
<line x1="520.0" y1="168.0" x2="712.0" y2="168.0" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="520" y="188" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">断键 = 从坑底往上拔（吸热）</text>
<text x="520" y="206" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">H₂(g) → 2 H(g)   ΔH = +436 kJ</text>
<text x="520" y="227" font-size="10.5" fill="#1e293b" text-anchor="start" font-weight="600">燃料放热靠生成更稳的新强键！</text>
<rect x="508" y="252" width="216" height="218" rx="10" fill="#e7f6ee" stroke="#18794e"/>
<text x="520" y="274" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">算一笔真实反应账：H₂ + Cl₂ → 2HCl</text>
<text x="520" y="297" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="600">① 先投入能量拆旧键（吸热）：</text>
<text x="528" y="315" font-size="10.5" fill="#1e293b" text-anchor="start">• 拆 1 mol H–H：+436 kJ</text>
<text x="528" y="332" font-size="10.5" fill="#1e293b" text-anchor="start">• 拆 1 mol Cl–Cl：+243 kJ</text>
<text x="528" y="349" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="700">合计投入：+679 kJ</text>
<text x="520" y="373" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="600">② 再组装新键回血（放热）：</text>
<text x="528" y="391" font-size="10.5" fill="#1e293b" text-anchor="start">• 成 2 mol H–Cl：−2 × 432</text>
<text x="528" y="408" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">合计释放：−864 kJ</text>
<line x1="520.0" y1="421.0" x2="712.0" y2="421.0" stroke="#18794e" stroke-width="1.2"/>
<text x="520" y="441" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">净焓变 ΔH = 679 − 864</text>
<text x="520" y="459" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">= −185 kJ/mol（净放热！）</text>
<text x="380" y="505" font-size="11" fill="#64748b" text-anchor="middle">数据来源：OpenStax Chemistry 2e 7.2 &amp; 7.5 节；1927 年海特勒-伦敦量子计算首次算出 H₂ 势能阱</text>
</svg>
