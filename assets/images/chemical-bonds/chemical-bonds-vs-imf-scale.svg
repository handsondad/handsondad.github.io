<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">化学键与分子间作用力能量标尺及氢键沸点反常图解</title>
<desc id="desc">左侧以对数横条对比氧化镁晶格能3900、氮三键946、水分子内氧氢共价键464与水分子间氢键20、色散力1至5千焦每摩尔；右侧绘出第16族氢化物沸点曲线，展示氢键将水沸点从外推负80摄氏度拉升至正100摄氏度，以及DNA氢键拉链与壁虎纳米刚毛色散力。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#b91c1c"/></marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">100°C 烧开水并没有断掉化学键！——主价键与分子间作用力标尺</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">分子内化学键掌管化学身份（数百至数千 kJ/mol），分子间弱作用力掌管物态相变与生命拉链</text>
<rect x="20" y="74" width="368" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="40" cy="96" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="40" y="100" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="101" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">能量跨度三数量级：化学键 vs 分子间力</text>
<text x="38" y="136" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">MgO 离子晶格能</text>
<rect x="156" y="125" width="169" height="15" rx="4" fill="#c25014"/>
<text x="331" y="137" font-size="10" fill="#c25014" text-anchor="start" font-weight="700">3900</text>
<text x="38" y="170" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">N≡N 共价三键</text>
<rect x="156" y="159" width="140" height="15" rx="4" fill="#1d6fa5"/>
<text x="302" y="171" font-size="10" fill="#1d6fa5" text-anchor="start" font-weight="700">946</text>
<text x="38" y="204" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">NaCl 离子晶格能</text>
<rect x="156" y="193" width="136" height="15" rx="4" fill="#c25014"/>
<text x="298" y="205" font-size="10" fill="#c25014" text-anchor="start" font-weight="700">769</text>
<text x="38" y="238" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">水分子内 O–H 键</text>
<rect x="156" y="227" width="126" height="15" rx="4" fill="#1d6fa5"/>
<text x="288" y="239" font-size="10" fill="#1d6fa5" text-anchor="start" font-weight="700">464</text>
<text x="38" y="272" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">碳骨架 C–C 单键</text>
<rect x="156" y="261" width="120" height="15" rx="4" fill="#1d6fa5"/>
<text x="282" y="273" font-size="10" fill="#1d6fa5" text-anchor="start" font-weight="700">345</text>
<line x1="36.0" y1="287.0" x2="372.0" y2="287.0" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="38" y="312" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">水分子间氢键</text>
<rect x="156" y="301" width="61" height="15" rx="4" fill="#18794e"/>
<text x="223" y="313" font-size="10" fill="#18794e" text-anchor="start" font-weight="700">~20 (汽化 40.7)</text>
<text x="38" y="346" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">HCl 偶极吸引力</text>
<rect x="156" y="335" width="58" height="15" rx="4" fill="#6d28d9"/>
<text x="220" y="347" font-size="10" fill="#6d28d9" text-anchor="start" font-weight="700">~17</text>
<text x="38" y="380" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">伦敦色散力(单接触)</text>
<rect x="156" y="369" width="22" height="15" rx="4" fill="#475569"/>
<text x="184" y="381" font-size="10" fill="#475569" text-anchor="start" font-weight="700">1 ~ 5</text>
<rect x="36" y="408" width="336" height="64" rx="10" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="48" y="428" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">关键分水岭（对数横条，单位 kJ/mol）：</text>
<text x="48" y="447" font-size="10.2" fill="#1e293b" text-anchor="start">• 100°C 沸腾只克服 40.7 kJ/mol 分子间氢键（水→水蒸气）</text>
<text x="48" y="464" font-size="10.2" fill="#b91c1c" text-anchor="start" font-weight="700">• 扯断分子内 O–H 共价键需 464 kJ/mol（超 2000°C 才热解）</text>
<rect x="404" y="74" width="336" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="424" cy="96" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="424" y="100" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">2</text>
<text x="446" y="101" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">氢键救地球：水沸点暴涨 180°C 与生命拉链</text>
<line x1="458.0" y1="128.0" x2="458.0" y2="298.0" stroke="#475569" stroke-width="1.4"/>
<line x1="458.0" y1="298.0" x2="712.0" y2="298.0" stroke="#475569" stroke-width="1.4"/>
<line x1="458.0" y1="220.7" x2="712.0" y2="220.7" stroke="#64748b" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="452" y="147.5" font-size="10" fill="#1d6fa5" text-anchor="end" font-weight="700">+100°C</text>
<text x="452" y="224.7" font-size="10" fill="#475569" text-anchor="end">0°C</text>
<text x="452" y="286.5" font-size="10" fill="#b91c1c" text-anchor="end">−80°C</text>
<polyline points="492.0,282.5 560.0,267.1 628.0,252.4 696.0,222.3" fill="none" stroke="#64748b" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
<polyline points="492.0,143.5 560.0,267.1 628.0,252.4 696.0,222.3" fill="none" stroke="#1d6fa5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="492.0" y1="279.5" x2="492.0" y2="149.6" stroke="#18794e" stroke-width="2.0" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
<text x="550.0" y="209.1" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">氢键拉高</text>
<text x="550.0" y="223.8" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">+180°C！</text>
<circle cx="492.0" cy="143.5" r="4.5" fill="#1d6fa5"/>
<text x="484.0" y="133.5" font-size="10" fill="#1d6fa5" text-anchor="start" font-weight="700">H₂O (+100°)</text>
<circle cx="560.0" cy="267.1" r="4.5" fill="#475569"/>
<text x="560.0" y="283.1" font-size="10" fill="#475569" text-anchor="middle" font-weight="600">H₂S (−60°)</text>
<circle cx="628.0" cy="252.4" r="4.5" fill="#475569"/>
<text x="628.0" y="268.4" font-size="10" fill="#475569" text-anchor="middle" font-weight="600">H₂Se (−41°)</text>
<circle cx="696.0" cy="222.3" r="4.5" fill="#475569"/>
<text x="704.0" y="212.3" font-size="10" fill="#475569" text-anchor="end" font-weight="600">H₂Te (−2°)</text>
<circle cx="492.0" cy="282.5" r="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6"/>
<text x="500.0" y="296.5" font-size="9.8" fill="#b91c1c" text-anchor="start" font-weight="600">无氢键外推 −80°C（海洋全气化）</text>
<text x="585" y="318" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="600">第 16 族氢化物常压沸点随周期变化</text>
<rect x="420" y="330" width="304" height="68" rx="9" fill="#e7f6ee" stroke="#18794e"/>
<text x="432" y="349" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">① DNA 双螺旋：刚柔并济的“氢键拉链”</text>
<text x="432" y="367" font-size="10.2" fill="#1e293b" text-anchor="start">单链骨架靠 ~350 kJ 共价磷酸二酯键锁死防断；</text>
<text x="432" y="384" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="600">双链碱基靠 ~20 kJ 氢键（A=T 二重、G≡C 三重）可逆开合！</text>
<rect x="420" y="408" width="304" height="64" rx="9" fill="#f3e8ff" stroke="#6d28d9"/>
<text x="432" y="427" font-size="11" fill="#6d28d9" text-anchor="start" font-weight="700">② 壁虎飞檐走壁：百万根纳米刚毛色散力叠加</text>
<text x="432" y="445" font-size="10.2" fill="#1e293b" text-anchor="start">无需胶水吸盘，脚趾数百万三角形匙突紧贴玻璃，</text>
<text x="432" y="461" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="600">微弱瞬时偶极色散力积少成多，轻松托起数倍体重！</text>
<text x="380" y="505" font-size="11" fill="#64748b" text-anchor="middle">数据来源：OpenStax Chemistry 2e 7.5 与 10.1 节（氢键沸点反常、Autumn 2000 壁虎范德华力实验）</text>
</svg>
