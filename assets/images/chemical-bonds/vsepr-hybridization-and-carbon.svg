<text x="62" y="311" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">单双三键对比：σ 自由转轴 vs π 旋转锁</text>
<rect x="36" y="326" width="316" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<text x="46" y="344" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">C–C 单键 (1σ)</text>
<text x="46" y="360" font-size="10.5" fill="#1e293b" text-anchor="start">键长 154 pm ｜ 键能 345 kJ/mol</text>
