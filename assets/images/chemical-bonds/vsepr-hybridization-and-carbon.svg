<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">三维分子建筑学：孤对电子挤压、π 键旋转锁与碳的“双面人生”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">杂化轨道与价层电子对互斥（VSEPR）塑造分子几何；成键方式一变，金刚石与铅笔芯天壤之别</text>
