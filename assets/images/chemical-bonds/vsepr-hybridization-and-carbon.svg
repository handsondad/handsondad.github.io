<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">VSEPR孤对电子挤压键角变化、单双三键对比与金刚石石墨成键差异</title>
<desc id="desc">上方展示甲烷109.5度、氨气107.0度、水104.5度随孤对电子增加键角缩水及二氧化碳180度非极性对照；左下方对比碳碳单双三键键长缩短键能激增；右下方对比金刚石sp3三维共价网与石墨sp2层状大π键结构。</desc>
