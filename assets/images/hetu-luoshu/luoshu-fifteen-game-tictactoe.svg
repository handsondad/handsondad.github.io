<rect x="0.5" y="0.5" width="759" height="459" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">洛书的两大隐藏彩蛋：“凑 15 纸牌博弈”同构井字棋 &amp; 平方和惊人守恒</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">换个视角看幻方：心算抢牌瞬间降维成三子连线；连把每行数字正读、倒读求平方和都分毫不差</text>
<rect x="16" y="68" width="358" height="376" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="28.0" y="80.0" width="202" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="129.0" y="96.3" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">彩蛋一：“抢 15” = 洛书井字棋</text>
<text x="28" y="121" font-size="11.5" fill="#1e293b" text-anchor="start">规则：9 张牌 1~9 轮流拿，谁先凑齐任意三张和=15 获胜</text>
