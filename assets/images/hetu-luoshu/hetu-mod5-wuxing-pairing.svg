    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="455" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">河图的数理内核：模 5 同余（a ≡ b mod 5）与奇偶严格平分</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">《系辞》“五位相得而各有合”用现代算术翻译：内圈生数 k 加上中宫 5，自动翻转奇偶生成外圈成数 k+5</text>
<rect x="16" y="68" width="378" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="28.0" y="80.0" width="174" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="115.0" y="96.3" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">规律一：模 5 同余映射器</text>
<text x="212" y="96" font-size="11.5" fill="#64748b" text-anchor="start">成数 = 生数 + 5（奇偶必互补）</text>
<text x="64" y="126" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="600">方位五行</text>
<text x="154" y="126" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="600">内圈生数</text>
<text x="218" y="126" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="600">加中五</text>
<text x="284" y="126" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="600">外圈成数</text>
<text x="354" y="126" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="600">mod 5</text>
<rect x="28.0" y="140.0" width="76" height="30" rx="15.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="66.0" y="160.4" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">下北 · 水</text>
<rect x="116" y="140" width="74" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="153" y="160" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">1 (奇○)</text>
<line x1="194.0" y1="155.0" x2="240.0" y2="155.0" stroke="#c25014" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="217" y="150" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">+5</text>
