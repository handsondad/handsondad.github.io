<text x="153" y="252" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">3 (奇○)</text>
<line x1="194.0" y1="247.0" x2="240.0" y2="247.0" stroke="#c25014" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="217" y="242" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">+5</text>
<rect x="246" y="232" width="76" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="284" y="252" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">8 (偶●)</text>
<rect x="330.0" y="235.0" width="52" height="24" rx="12.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="356.0" y="251.3" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">余 3</text>
<rect x="28.0" y="278.0" width="76" height="30" rx="15.0" fill="#fffbeb" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="66.0" y="298.4" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">右西 · 金</text>
<rect x="116" y="278" width="74" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="153" y="298" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">4 (偶●)</text>
<line x1="194.0" y1="293.0" x2="240.0" y2="293.0" stroke="#c25014" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="217" y="288" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">+5</text>
<rect x="246" y="278" width="76" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="284" y="298" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">9 (奇○)</text>
<rect x="330.0" y="281.0" width="52" height="24" rx="12.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
