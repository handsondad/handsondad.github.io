<rect x="246" y="186" width="76" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="284" y="206" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">7 (奇○)</text>
<rect x="330.0" y="189.0" width="52" height="24" rx="12.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
