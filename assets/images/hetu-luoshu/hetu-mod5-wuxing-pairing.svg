<rect x="28.0" y="324.0" width="76" height="30" rx="15.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="66.0" y="344.4" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">中宫 · 土</text>
<rect x="116" y="324" width="74" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="153" y="344" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">5 (奇○)</text>
<line x1="194.0" y1="339.0" x2="240.0" y2="339.0" stroke="#c25014" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="217" y="334" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">+5</text>
<rect x="246" y="324" width="76" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="284" y="344" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">10 (偶●)</text>
<rect x="330.0" y="327.0" width="52" height="24" rx="12.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="356.0" y="343.3" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">余 0</text>
<rect x="28" y="374" width="354" height="54" rx="8" fill="#fef1e8" stroke="#fdba74"/>
<text x="40" y="395" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">为什么每一方都恰好“一阴一阳”？</text>
<text x="40" y="415" font-size="11.5" fill="#1e293b" text-anchor="start">因为 5 是奇数：奇数 + 5 = 偶数，偶数 + 5 = 奇数，绝无同性相斥！</text>
<rect x="408" y="68" width="336" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="420.0" y="80.0" width="186" height="24" rx="12.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="513.0" y="96.3" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">规律二：外围奇偶恒等于 20</text>
<text x="614" y="96" font-size="11.5" fill="#64748b" text-anchor="start">顺时针相生回路</text>
<circle cx="576.0" cy="232.0" r="84" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M 534.0 304.0 A 84 84 0 0 1 498.0 262.0" fill="none" stroke="#18794e" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="490.0" y="294.0" font-size="11" fill="#18794e" text-anchor="middle" font-weight="600">水生木</text>
<path d="M 498.0 202.0 A 84 84 0 0 1 534.0 160.0" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="490.0" y="178.0" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">木生火</text>
<line x1="576.0" y1="174.0" x2="576.0" y2="206.0" stroke="#b45309" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="604.0" y="192.0" font-size="11" fill="#b45309" text-anchor="start" font-weight="600">火生土</text>
<line x1="612.0" y1="232.0" x2="626.0" y2="232.0" stroke="#b45309" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<path d="M 654.0 262.0 A 84 84 0 0 1 618.0 304.0" fill="none" stroke="#1d6fa5" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="664.0" y="294.0" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">金生水</text>
<rect x="532.0" y="134.0" width="88" height="28" rx="14.0" fill="#fef2f2" stroke="#b91c1c" stroke-width="1" stroke-opacity="0.35"/>
<text x="576.0" y="153.0" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="600">南火 2●·7○</text>
<rect x="444.0" y="218.0" width="88" height="28" rx="14.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="488.0" y="237.0" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="600">东木 3○·8●</text>
<rect x="539.0" y="218.0" width="74" height="28" rx="14.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="576.0" y="237.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">中土 5·10</text>
<rect x="620.0" y="218.0" width="88" height="28" rx="14.0" fill="#fffbeb" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="664.0" y="237.0" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="600">西金 4●·9○</text>
<rect x="532.0" y="302.0" width="88" height="28" rx="14.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="576.0" y="321.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">北水 1○·6●</text>
<text x="624.0" y="214.0" font-size="11" fill="#b45309" text-anchor="start" font-weight="600">土生金</text>
<rect x="420" y="346" width="312" height="82" rx="8" fill="#e7f6ee" stroke="#86efac"/>
<text x="432" y="367" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">拿掉中宫（5 与 10）后，四方奇偶不偏不倚：</text>
<text x="432" y="389" font-size="11.5" fill="#0f172a" text-anchor="start">• 四方阳数和 = 1(北) + 7(南) + 3(东) + 9(西) = 20</text>
<text x="432" y="411" font-size="11.5" fill="#0f172a" text-anchor="start">• 四方阴数和 = 6(北) + 2(南) + 8(东) + 4(西) = 20</text>
</svg>
