<text x="284" y="160" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">6 (偶●)</text>
<rect x="330.0" y="143.0" width="52" height="24" rx="12.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="356.0" y="159.3" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">余 1</text>
<rect x="28.0" y="186.0" width="76" height="30" rx="15.0" fill="#fef2f2" stroke="#b91c1c" stroke-width="1" stroke-opacity="0.35"/>
<text x="66.0" y="206.4" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="600">上南 · 火</text>
<rect x="116" y="186" width="74" height="30" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="153" y="206" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">2 (偶●)</text>
<line x1="194.0" y1="201.0" x2="240.0" y2="201.0" stroke="#c25014" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-orange)"/>
