<title id="title">南宋杨辉《续古摘奇算法》九子斜排四步构造洛书幻方的分步图解与单次归位动画</title>
<desc id="desc">左侧四格静态展示①九子斜排、②上下对易(1与9换)、③左右相更(7与3换)、④四维挺出(4,2,8,6推出四角)；右侧演示同一变换并停留在492/357/816终态，支持减少动态效果。</desc>
