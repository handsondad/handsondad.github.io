<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">半导体核心器件原理对比：PN结二极管单向导通与MOSFET场效应晶体管电压控制沟道</title>
<desc id="desc">左栏对比PN结二极管正向偏置压窄耗尽层导通与反向偏置拉宽耗尽层截止；右栏对比MOSFET在栅极电压低于阈值时源漏断开、高于阈值时在二氧化硅绝缘层下感应出导电沟道，实现小电压控制大电流和数字逻辑开关。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="343" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 5 · 半导体登场：从“只许单向走”的二极管，到“小电压控大电流”的晶体管</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">打破线性欧姆定律！正是这两件有源器件，把死板的电路变成了会整流、会计算的数字芯片</text>
<rect x="20" y="64" width="350" height="266" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="88" font-size="13" fill="#1d6fa5" text-anchor="start" font-weight="700">① 二极管（PN 结）：电流的单向旋转门</text>
<rect x="36" y="102" width="318" height="82" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="48" y="122" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">正向偏置（P 接正、N 接负，跨过约 0.7 V 门槛）</text>
<rect x="52" y="134" width="64" height="34" rx="5" fill="#dbeafe" stroke="#1d6fa5"/>
<text x="84" y="155" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="700">P 区</text>
<rect x="116" y="134" width="12" height="34" fill="#e2e8f0"/>
<rect x="128" y="134" width="64" height="34" rx="5" fill="#fef3c7" stroke="#c25014"/>
<text x="160" y="155" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700">N 区</text>
<path d="M40 151 L208 151" stroke="#18794e" stroke-width="2.2" marker-end="url(#arr-green)"/>
<text x="220" y="147" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">耗尽层被压窄</text>
<text x="220" y="165" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="600">闸门大开，顺畅导通</text>
<rect x="36" y="194" width="318" height="82" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="48" y="214" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">反向偏置（P 接负、N 接正，未达击穿电压）</text>
<rect x="52" y="226" width="48" height="34" rx="5" fill="#dbeafe" stroke="#1d6fa5"/>
<text x="76" y="247" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="700">P 区</text>
<rect x="100" y="226" width="44" height="34" fill="#cbd5e1" stroke="#475569" stroke-dasharray="3 2"/>
<text x="122" y="247" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">宽墙</text>
<rect x="144" y="226" width="48" height="34" rx="5" fill="#fef3c7" stroke="#c25014"/>
<text x="168" y="247" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700">N 区</text>
<text x="214" y="239" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">耗尽层被拉宽成绝缘墙</text>
<text x="214" y="257" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="600">电流几乎为 0，倒流堵死</text>
<text x="36" y="300" font-size="11.5" fill="#1e293b" text-anchor="start">代表分工：整流桥把交流掰成单向直流；</text>
<text x="36" y="318" font-size="11.5" fill="#1e293b" text-anchor="start">发光二极管（LED）让复合能量直接变成光子。</text>
<rect x="390" y="64" width="350" height="266" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="406" y="88" font-size="13" fill="#6d28d9" text-anchor="start" font-weight="700">② MOSFET 晶体管：不费力气的“电控水龙头”</text>
<rect x="406" y="102" width="318" height="82" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="418" y="122" font-size="11.5" fill="#475569" text-anchor="start" font-weight="700">关断态（栅极电压 V_GS &lt; 阈值 V_th → 逻辑 0）</text>
<rect x="430" y="146" width="144" height="28" rx="4" fill="#f8fafc" stroke="#475569"/>
<rect x="436" y="146" width="34" height="16" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="453" y="158" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">源 S</text>
<rect x="534" y="146" width="34" height="16" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="551" y="158" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">漏 D</text>
<rect x="476" y="139" width="52" height="6" fill="#fde68a" stroke="#c25014"/>
<line x1="476" y1="134" x2="528" y2="134" stroke="#6d28d9" stroke-width="3"/>
<text x="590" y="146" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">栅极没加正电压</text>
<text x="590" y="164" font-size="11.5" fill="#475569" text-anchor="start" font-weight="600">S 与 D 之间断路不通</text>
<rect x="406" y="194" width="318" height="82" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="418" y="214" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">导通态（栅极电压 V_GS &gt; 阈值 V_th → 逻辑 1）</text>
<rect x="430" y="238" width="144" height="28" rx="4" fill="#f8fafc" stroke="#475569"/>
<rect x="470" y="246" width="64" height="8" fill="#18794e"/>
<rect x="436" y="238" width="34" height="16" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="453" y="250" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">源 S</text>
<rect x="534" y="238" width="34" height="16" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="551" y="250" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">漏 D</text>
<rect x="476" y="231" width="52" height="6" fill="#fde68a" stroke="#c25014"/>
<line x1="476" y1="226" x2="528" y2="226" stroke="#6d28d9" stroke-width="3"/>
<text x="588" y="239" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">氧化层下吸出导电沟道</text>
<text x="588" y="257" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">毫微功耗即可开关大电流</text>
<text x="406" y="300" font-size="11.5" fill="#1e293b" text-anchor="start">代表分工：快充头里每秒斩波几十万次的功率开关；</text>
<text x="406" y="318" font-size="11.5" fill="#1e293b" text-anchor="start">手机 CPU 里上百亿颗每秒翻转几十亿次的 0/1 逻辑门。</text>
</svg>
