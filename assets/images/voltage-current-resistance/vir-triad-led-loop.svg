<svg xmlns="http://www.w3.org/2000/svg" width="760" height="388" viewBox="0 0 760 388" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">电压、电流与电阻的三元关系及LED串联限流算例</title>
<desc id="desc">上方三卡定义电压（每库仑焦耳数）、电流（每秒库仑数，1安约6.24乘10的18次方个电子每秒）与电阻（材料几何阻碍）；下方用5伏电源串联150欧限流电阻驱动2伏红光LED的回路演示欧姆定律与功率守恒。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="387" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 1 · 电世界的三位主角：电压推、电流跑、电阻拦</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先看三张角色卡抓准单位与物理意义，再看下方 5 V 点亮红光 LED 的完整分压算账</text>
<rect x="20" y="62" width="228" height="150" rx="10" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.3"/>
<rect x="20" y="62" width="228" height="30" rx="10" fill="#eaf4fb"/>
<rect x="20" y="82" width="228" height="10" fill="#eaf4fb"/>
<text x="134" y="82" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">电压 V（伏特 Volt）</text>
<text x="134" y="112" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">1 V = 1 J / C</text>
<text x="134" y="136" font-size="11.5" fill="#1e293b" text-anchor="middle">每 1 库仑电荷获得的能量落差</text>
<text x="134" y="158" font-size="11.5" fill="#64748b" text-anchor="middle">像水箱的高度差：没落差就不流动</text>
<text x="134" y="194" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">例：干电池 1.5 V ｜ USB 5 V ｜ 插座 220 V</text>
<rect x="266" y="62" width="228" height="150" rx="10" fill="#ffffff" stroke="#18794e" stroke-width="1.3"/>
<rect x="266" y="62" width="228" height="30" rx="10" fill="#e7f6ee"/>
<rect x="266" y="82" width="228" height="10" fill="#e7f6ee"/>
<text x="380" y="82" font-size="12.5" fill="#18794e" text-anchor="middle" font-weight="700">电流 I（安培 Ampere）</text>
<text x="380" y="112" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">1 A = 1 C / s</text>
<text x="380" y="136" font-size="11.5" fill="#1e293b" text-anchor="middle">每秒流过截面的电荷总量</text>
<text x="380" y="158" font-size="11.5" fill="#64748b" text-anchor="middle">1 A ≈ 每秒 6.24×10¹⁸ 颗电子过关</text>
<text x="380" y="194" font-size="11" fill="#18794e" text-anchor="middle" font-weight="600">例：LED 0.02 A ｜ 手机快充 5 A ｜ 烧水壶 8 A</text>
<rect x="512" y="62" width="228" height="150" rx="10" fill="#ffffff" stroke="#c25014" stroke-width="1.3"/>
<rect x="512" y="62" width="228" height="30" rx="10" fill="#fef1e8"/>
<rect x="512" y="82" width="228" height="10" fill="#fef1e8"/>
<text x="626" y="82" font-size="12.5" fill="#c25014" text-anchor="middle" font-weight="700">电阻 R（欧姆 Ohm）</text>
<text x="626" y="112" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">R = ρ · L / A</text>
<text x="626" y="136" font-size="11.5" fill="#1e293b" text-anchor="middle">材料晶格对电荷定向移动的阻碍</text>
<text x="626" y="158" font-size="11.5" fill="#64748b" text-anchor="middle">越细越长越难走，撞击晶格变成热</text>
<text x="626" y="194" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">例：1 m 铜线约 0.011 Ω ｜ 干燥皮肤数千 Ω</text>
<rect x="20" y="226" width="720" height="148" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="36" y="250" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">实战算账：为什么 5 V 电源绝不能直接捅进 2 V 的红光 LED？</text>
<rect x="36" y="262" width="396" height="98" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<path d="M78 338 L78 292 L146 292" fill="none" stroke="#475569" stroke-width="1.8"/>
<polyline points="146.0,292.0 154.0,292.0 161.0,285.5 168.0,298.5 175.0,285.5 182.0,298.5 189.0,285.5 196.0,298.5 203.0,285.5 210.0,298.5 217.0,285.5 224.0,292.0 232.0,292.0" fill="none" stroke="#c25014" stroke-width="2"/>
<path d="M232 292 L292 292" fill="none" stroke="#475569" stroke-width="1.8"/>
<polygon points="292,281 292,303 314,292" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
<line x1="315" y1="280" x2="315" y2="304" stroke="#b91c1c" stroke-width="2"/>
<path d="M312 276 L322 267 M320 280 L330 271" stroke="#b91c1c" stroke-width="1.3"/>
<path d="M315 292 L386 292 L386 338 L78 338" fill="none" stroke="#475569" stroke-width="1.8"/>
<rect x="64" y="305" width="28" height="18" fill="#ffffff"/>
<line x1="66" y1="310" x2="90" y2="310" stroke="#1d6fa5" stroke-width="2.4"/>
<line x1="71" y1="319" x2="85" y2="319" stroke="#1d6fa5" stroke-width="1.8"/>
<text x="60" y="318" font-size="11.5" fill="#1d6fa5" text-anchor="end" font-weight="700">5 V</text>
<text x="189" y="278" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">R = 150 Ω（替身挡压 3 V）</text>
<text x="308" y="320" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="600">LED 压降 2.0 V</text>
<path d="M200 338 L248 338" stroke="#18794e" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="224" y="353" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">回路电流 I = 20 mA (0.02 A)</text>
<text x="448" y="282" font-size="12" fill="#1e293b" text-anchor="start">① 扣掉灯珠压降：ΔV = 5.0 − 2.0 = 3.0 V</text>
<text x="448" y="305" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">② 欧姆定律配阻：R = 3.0 V ÷ 0.02 A = 150 Ω</text>
<text x="448" y="328" font-size="12" fill="#1e293b" text-anchor="start">③ 能量守恒去向：总输入 5 V × 20 mA = 100 mW</text>
<text x="448" y="350" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">   电阻发热 60 mW + 灯珠耗电 40 mW = 100 mW ✓</text>
</svg>
