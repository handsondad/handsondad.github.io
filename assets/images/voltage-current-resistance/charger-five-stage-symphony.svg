<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" viewBox="0 0 760 368" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">手机开关电源充电器五级电路合奏：从220伏交流电到稳定5伏直流电的波形演变与元器件分工</title>
<desc id="desc">五张卡片依次展示：①二极管整流桥将220V正弦交流变为100Hz单向脉动波；②高压电容与MOSFET滤波并高频斩波成百千赫兹脉冲；③高频变压器磁耦合隔离降压；④次级肖特基管与电容整流抹平纹波；⑤采样电阻与光耦把输出误差反馈给MOSFET调节占空比，输出纯净5.0V直流。</desc>
