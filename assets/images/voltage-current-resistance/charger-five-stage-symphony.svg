<text x="20" y="350" font-size="11.5" fill="#64748b" text-anchor="start">为什么氮化镓（GaN）充电头能缩成饼干大小？因为它把 ② 里的开关频率推高到数百 kHz 至 MHz，③ 里的变压器磁芯就能大幅缩小。</text>
