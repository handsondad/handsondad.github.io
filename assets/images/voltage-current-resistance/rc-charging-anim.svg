<text x="512" y="122" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">① t = 0⁺ 刚合闸瞬间</text>
<text x="512" y="140" font-size="11" fill="#1e293b" text-anchor="start">极板还是空的（V_C = 0 V），</text>
<text x="512" y="156" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">I(0) = 5 V ÷ 1 kΩ = 5 mA 最大</text>
<rect x="502" y="178" width="224" height="66" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="512" y="196" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">② t = 1τ（1.0 秒）</text>
<text x="512" y="214" font-size="11" fill="#1e293b" text-anchor="start">极板攒起电荷，反向顶住电源；</text>
<text x="512" y="230" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">电流降到 36.8%（1.84 mA）</text>
<rect x="502" y="252" width="224" height="66" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="512" y="270" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">③ t ≥ 5τ（5.0 秒后）</text>
<text x="512" y="288" font-size="11" fill="#1e293b" text-anchor="start">极板电压几乎追平 5.0 V，</text>
<text x="512" y="304" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">直流电流停步 →“隔直”生效</text>
