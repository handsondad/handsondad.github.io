<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">RC电容充电动态过程：电容电压指数上升与充电电流指数衰减</title>
<desc id="desc">左侧按V_C(t)=5(1-e^(-t/tau))和I(t)=5e^(-t/tau)精确绘制5伏经1千欧给1000微法电容充电曲线（tau=1秒）：1tau充至63.2%，3tau达95.0%，5tau达99.3%；右侧分三步解释刚合闸最大电流、半程反顶与充满隔直。</desc>
