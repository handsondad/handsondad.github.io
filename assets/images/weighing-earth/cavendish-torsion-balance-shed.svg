<svg xmlns="http://www.w3.org/2000/svg" width="760" height="535" viewBox="0 0 760 535" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">1798 卡文迪许密封木屋扭秤实验与光杠杆放大动画图</title>
<desc id="desc">俯视展示双层密封花园木屋内 158 kg 大铅球吸引 0.73 kg 小铅球产生微牛级引力扭矩、墙外望远镜与光杠杆放大读数，以及通过扭摆周期消去悬丝刚度的完整原理。偏转角为示意放大。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6d28d9"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#0f766e"/>
    </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes cavTwist {
    0%, 14% { transform: rotate(-7deg); }
    72%, 100% { transform: rotate(0deg); }
  }
  @keyframes beamSweep {
    0%, 14% { opacity: 0.22; stroke-dashoffset: 210; }
    72%, 100% { opacity: 1; stroke-dashoffset: 0; }
  }
  .cav-arm-anim {
    transform-origin: 248px 258px;
    animation: cavTwist 4.2s cubic-bezier(0.22, 0.8, 0.25, 1) 1 forwards;
  }
  .cav-ray-anim {
    stroke-dasharray: 210;
    stroke-dashoffset: 0;
    animation: beamSweep 4.2s cubic-bezier(0.22, 0.8, 0.25, 1) 1 forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .cav-arm-anim, .cav-ray-anim {
      animation: none !important;
      transform: none !important;
      opacity: 1 !important;
      stroke-dashoffset: 0 !important;
    }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="534" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">把地球搬进花园木屋：1798 年卡文迪许扭秤如何捕捉“一粒细沙”的引力？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">0.0177 毫克重（1.74×10⁻⁷ N）的引力连呼吸气流都扛不住——唯有双层密封 + 扭丝悬臂 + 墙外望远镜／光杠杆放大</text>
<rect x="22" y="76" width="452" height="344" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
<text x="40" y="98" font-size="12" fill="#475569" text-anchor="start" font-weight="700">双层密封花园木屋（隔绝人体体温对流与微风）</text>
<rect x="48" y="110" width="368" height="292" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="64" y="130" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">桃花心木防风内箱（俯视示意，偏转角已放大）</text>
<circle cx="248.0" cy="258.0" r="118" fill="none" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/>
<line x1="140.1" y1="254.2" x2="355.9" y2="261.8" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/>
<circle cx="140.1" cy="254.2" r="8" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 2"/>
<circle cx="355.9" cy="261.8" r="8" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="132.1" y="276.2" font-size="9.8" fill="#475569" text-anchor="middle">初态平衡位</text>
<circle cx="148.0" cy="201.4" r="24" fill="#334155" stroke="#0f172a" stroke-width="2"/>
<text x="148.0" y="205.4" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">158 kg</text>
<text x="118.0" y="185.4" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="700">大铅球 W₁</text>
<circle cx="348.0" cy="314.6" r="24" fill="#334155" stroke="#0f172a" stroke-width="2"/>
<text x="348.0" y="318.6" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">158 kg</text>
<text x="316.0" y="336.6" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="700">大铅球 W₂</text>
<g class="cav-arm-anim">
<line x1="142.0" y1="237.4" x2="354.0" y2="278.6" stroke="#1d6fa5" stroke-width="4.0" stroke-linecap="round"/>
<circle cx="142.0" cy="237.4" r="9.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="354.0" cy="278.6" r="9.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.5"/>
<rect x="244.0" y="247.0" width="8" height="22" rx="2" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5"/>
</g>
<line x1="144.0" y1="228.4" x2="146.0" y2="224.4" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-red)"/>
<line x1="352.0" y1="287.6" x2="350.0" y2="291.6" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="106.0" y="225.4" font-size="10.2" fill="#1d6fa5" text-anchor="end" font-weight="700">小铅球 0.73 kg</text>
<text x="248.0" y="286.0" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">镀银铜扭丝 + 中心反射镜</text>
<text x="248.0" y="302.0" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">真实偏角仅 0.03°～0.16°</text>
<rect x="468" y="218" width="12" height="80" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="458" y="212" font-size="9.8" fill="#475569" text-anchor="end">木屋观测窗</text>
<line x1="492.0" y1="232.0" x2="252.0" y2="256.0" stroke="#c25014" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="252.0" y1="260.0" x2="492.0" y2="286.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" class="cav-ray-anim" marker-end="url(#arr-red)"/>
<rect x="492" y="76" width="246" height="106" rx="10" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<circle cx="510" cy="96" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="510" y="100" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="530" y="101" font-size="12.2" fill="#1d6fa5" text-anchor="start" font-weight="700">门外拉滑轮防气流</text>
<text x="508" y="124" font-size="10.6" fill="#0f172a" text-anchor="start">引力仅 1.74×10⁻⁷ N（相当于</text>
<text x="508" y="143" font-size="10.6" fill="#dc2626" text-anchor="start" font-weight="700">0.0177 毫克细沙重，小球自重</text>
<text x="508" y="162" font-size="10.6" fill="#0f172a" text-anchor="start">的五千万分之一），人绝不进屋！</text>
<rect x="492" y="194" width="246" height="108" rx="10" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<circle cx="510" cy="214" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="510" y="218" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="530" y="219" font-size="12.2" fill="#c25014" text-anchor="start" font-weight="700">墙外望远镜／光杠杆放大</text>
<text x="508" y="242" font-size="10.6" fill="#0f172a" text-anchor="start">原版用墙孔望远镜读游标尺（准</text>
<text x="508" y="261" font-size="10.6" fill="#0f172a" text-anchor="start">至 0.25 mm）；现代改进加中心</text>
<text x="508" y="280" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">小镜反射光束，转 θ 光斑偏 2θ！</text>
<rect x="492" y="314" width="246" height="106" rx="10" fill="#e7f6ee" stroke="#86efac" stroke-width="1"/>
<circle cx="510" cy="334" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="510" y="338" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">3</text>
<text x="530" y="339" font-size="12.2" fill="#18794e" text-anchor="start" font-weight="700">测扭摆周期消去悬丝刚度</text>
<text x="508" y="362" font-size="10.6" fill="#0f172a" text-anchor="start">扭丝多硬怎么测？直接秒表测横</text>
<text x="508" y="381" font-size="10.6" fill="#0f172a" text-anchor="start">杆自由扭摆周期 T（约 7～15 分</text>
<text x="508" y="400" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="700">钟），一举算出 ρ⊕ = 5.448 g/cm³！</text>
<rect x="22" y="432" width="716" height="86" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="380" y="456" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">卡文迪许核心联立：力矩平衡 κ·θ = 2·F·(L/2)   且   自由扭摆周期 T = 2π√(I / κ)</text>
<text x="380" y="480" font-size="11.3" fill="#0f766e" text-anchor="middle" font-weight="700">消去未知刚度 κ ⇒ G = 2π²·L·r²·θ / (M·T²)  ⇒  与现代真值 5.514 g/cm³ 仅差 1.2%，尘封百年无人超越！</text>
<text x="380" y="502" font-size="10.2" fill="#64748b" text-anchor="middle">（动画单次播放扭杆趋向引力平衡与光束偏转；开启系统“减少动态效果”或静态查看时保留完整初末态对照）</text>
</svg>
