<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" viewBox="0 0 760 466" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">厄尔尼诺全球大气遥相关洪涝与干旱空间分布示意图</title>
<desc id="desc">以太平洋为中心的示意地图标出厄尔尼诺期间全球极端天气遥相关格局：中东太平洋暖水舌释放巨量潜热，导致秘鲁厄瓜多尔海岸、美国南部与加州以及东亚长江流域（次年夏季）多雨洪涝（实线蓝框），而印尼东南亚、澳大利亚东部与亚马逊流域则因下沉气流遭遇高温干旱与山火（虚线橙框）。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="465" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一场太平洋发烧，为什么让半个地球闹洪灾、另半个地球烧山火？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">大气遥相关（Teleconnections）：沃克环流裂变改写热带雨带，高空急流罗斯贝波列搅动中高纬风暴</text>
<rect x="24" y="68" width="712" height="312" rx="10" fill="#f0f9ff" stroke="#e2e8f0" stroke-width="1"/>
<path d="M36,248.0 L724,248.0" fill="none" stroke="#475569" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" opacity="0.55"/>
<text x="46" y="242.0" font-size="10.5" fill="#475569" text-anchor="start" class="mono">0° 赤道</text>
<path d="M36,158 L724,158" fill="none" stroke="#cbd5e1" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<text x="46" y="153" font-size="10" fill="#64748b" text-anchor="start" class="mono">30°N</text>
<path d="M36,322 L724,322" fill="none" stroke="#cbd5e1" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
<text x="46" y="317" font-size="10" fill="#64748b" text-anchor="start" class="mono">30°S</text>
<path d="M42,92 L176,92 L192,132 L162,178 L128,196 L95,190 L68,214 L42,206 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M92,232 L135,238 L148,252 L112,258 Z M156,240 L196,246 L190,260 L152,255 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M118,284 L196,282 L214,316 L194,352 L134,350 L110,320 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M468,88 L646,88 L626,152 L584,186 L552,214 L526,194 L492,148 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M566,222 L658,236 L692,278 L664,356 L618,366 L594,312 L568,262 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<ellipse cx="432" cy="248" rx="148" ry="26" fill="#dc2626" opacity="0.28" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 3"/>
<text x="432" y="252" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700" class="halo">厄尔尼诺暖水舌（巨大潜热发动机）</text>
<path d="M245,168 Q365,176 475,168 Q545,164 615,158" fill="none" stroke="#1d6fa5" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text x="375" y="160" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">太平洋副热带急流南移拉直（风暴走廊直扑北美南侧）</text>
<path d="M415,222 Q435,162 490,124 Q545,104 595,126" fill="none" stroke="#6d28d9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arr-muted)"/>
<text x="474" y="110" font-size="10.5" fill="#6d28d9" text-anchor="middle" font-weight="600" class="halo">高空罗斯贝波列（暖冬：加拿大/美北）</text>
<rect x="72" y="214" width="152" height="46" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.4" stroke-dasharray="4 2"/>
<text x="148" y="233" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">旱 印尼/东南亚少雨</text>
<text x="148" y="250" font-size="10.5" fill="#1e293b" text-anchor="middle">泥炭林山火与跨境烟霾</text>
<rect x="106" y="294" width="148" height="46" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.4" stroke-dasharray="4 2"/>
<text x="180" y="313" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">旱 澳洲东部高温干旱</text>
<text x="180" y="330" font-size="10.5" fill="#1e293b" text-anchor="middle">小麦减产与丛林火灾风险</text>
<rect x="586" y="212" width="134" height="46" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.4" stroke-dasharray="4 2"/>
<text x="653" y="231" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">旱 亚马逊流域干旱</text>
<text x="653" y="248" font-size="10.5" fill="#1e293b" text-anchor="middle">下沉支笼罩，河流水位骤降</text>
<rect x="452" y="286" width="162" height="48" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="533" y="305" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">涝 秘鲁/厄瓜多尔暴雨</text>
<text x="533" y="323" font-size="10.5" fill="#1e293b" text-anchor="middle">沿海荒漠突发山洪泥石流</text>
<rect x="528" y="152" width="178" height="46" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="617" y="171" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">涝 加州与美国南部多雨</text>
<text x="617" y="188" font-size="10.5" fill="#1e293b" text-anchor="middle">急流裹挟水汽触发洪涝风暴</text>
<rect x="52" y="114" width="168" height="48" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="136" y="133" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">东亚：冬偏暖 + 次夏防涝</text>
<text x="136" y="151" font-size="10.5" fill="#1e293b" text-anchor="middle">长江中下游梅雨洪涝高发</text>
<rect x="24" y="392" width="712" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="415" font-size="11" fill="#1e293b" text-anchor="start">读图提示（示意投影，非等面积）：实线蓝框为上升或急流集中的“洪涝高发区”，虚线橙框为空气下沉的“干旱山火高发区”。</text>
<text x="42" y="435" font-size="11" fill="#64748b" text-anchor="start">遥相关机制：暖水每蒸发 1 kg 水汽释放约 2.5×10⁶ J 潜热，像向高空急流投入巨石，激起跨越上万公里的罗斯贝行星波列。</text>
</svg>
