<svg xmlns="http://www.w3.org/2000/svg" width="760" height="484" viewBox="0 0 760 484" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">芝诺二分法悖论、单位正方形几何证明与柯西收敛级数对比图解</title>
<desc id="desc">左栏展示倒退二分悖论与 1/2+1/4+1/8+... 填满单位正方形的几何证明；右栏对比收敛于 1 的芝诺等比级数与发散到无穷的调和级数。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="483" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二分法悖论：连第一步都迈不出去？单位正方形与柯西部分和的正面破局</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">区分“递进二分”与更刁钻的“倒退二分”，并用柯西收敛判别回答“为什么无穷个正数相加未必等于无穷大”</text>
<rect x="20" y="66" width="352" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="78.0" width="213" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="140.5" y="93.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">左栏：倒退二分陷阱 &amp; 1×1 正方形无缝拼图</text>
<text x="44" y="118" font-size="11.2" fill="#b91c1c" text-anchor="start" font-weight="600">倒退二分：到 1 前先到 1/2，到 1/2 前先到 1/4…哪来第一步？</text>
<line x1="44.0" y1="134.0" x2="348.0" y2="134.0" stroke="#1d6fa5" stroke-width="3"/>
<line x1="44.0" y1="128.0" x2="44.0" y2="140.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="44.0" y="154.0" font-size="11" fill="#0f172a" text-anchor="middle">0</text>
<line x1="82.0" y1="128.0" x2="82.0" y2="140.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="82.0" y="154.0" font-size="11" fill="#64748b" text-anchor="middle">1/8</text>
<line x1="120.0" y1="128.0" x2="120.0" y2="140.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="120.0" y="154.0" font-size="11" fill="#64748b" text-anchor="middle">1/4</text>
<line x1="196.0" y1="128.0" x2="196.0" y2="140.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="196.0" y="154.0" font-size="11" fill="#0f172a" text-anchor="middle">1/2</text>
<line x1="348.0" y1="128.0" x2="348.0" y2="140.0" stroke="#0f172a" stroke-width="1.5"/>
<text x="348.0" y="154.0" font-size="11" fill="#0f172a" text-anchor="middle">1</text>
<rect x="92.0" y="178.0" width="208.0" height="208.0" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
<rect x="92.0" y="178.0" width="104.0" height="208.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="144.0" y="282.0" font-size="15" fill="#1d6fa5" text-anchor="middle" font-weight="700">1/2</text>
<rect x="196.0" y="178.0" width="104.0" height="104.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="248.0" y="234.0" font-size="14" fill="#18794e" text-anchor="middle" font-weight="700">1/4</text>
<rect x="196.0" y="282.0" width="52.0" height="104.0" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="222.0" y="338.0" font-size="13" fill="#c25014" text-anchor="middle" font-weight="700">1/8</text>
<rect x="248.0" y="282.0" width="52.0" height="52.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="274.0" y="312.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">1/16</text>
<rect x="248.0" y="334.0" width="26.0" height="52.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.1"/>
<text x="261.0" y="364.0" font-size="9.8" fill="#0f766e" text-anchor="middle" font-weight="600">1/32</text>
<rect x="274.0" y="334.0" width="26.0" height="26.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.0"/>
<rect x="274.0" y="360.0" width="26.0" height="26.0" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.0" stroke-dasharray="2 2"/>
<text x="196" y="408" font-size="11.4" fill="#0f172a" text-anchor="middle" font-weight="600">前 N 块面积和 S_N = 1 − (1/2)ᴺ，永远装在面积 1 的方框内！</text>
<text x="196" y="428" font-size="11.2" fill="#64748b" text-anchor="middle">右下角剩余缺口 (1/2)ᴺ → 0：极限面积精确等于 1，既不溢出也不少。</text>
<text x="196" y="450" font-size="11.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">• 倒退二分没有“第 1 步”，但起点 x=0 仍在闭区间 [0,1] 里！</text>
<rect x="388" y="66" width="352" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402.0" y="78.0" width="196" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="500.0" y="93.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">右栏：无穷多项正数相加，到底有限还是无限？</text>
<text x="402" y="118" font-size="11.3" fill="#1e293b" text-anchor="start">关键不在“项数是不是无穷”，而在部分和 S_N 有没有天花板：</text>
<line x1="438.0" y1="336.0" x2="721.2" y2="336.0" stroke="#475569" stroke-width="1.5"/>
<line x1="438.0" y1="336.0" x2="438.0" y2="157.2" stroke="#475569" stroke-width="1.5"/>
<line x1="438.0" y1="336.0" x2="709.4" y2="336.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="430.0" y="340.0" font-size="11" fill="#64748b" text-anchor="end">0</text>
<line x1="438.0" y1="281.0" x2="709.4" y2="281.0" stroke="#1d6fa5" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="430.0" y="285.0" font-size="11" fill="#1d6fa5" text-anchor="end" font-weight="700">1</text>
<line x1="438.0" y1="226.0" x2="709.4" y2="226.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="430.0" y="230.0" font-size="11" fill="#64748b" text-anchor="end">2</text>
<line x1="438.0" y1="171.0" x2="709.4" y2="171.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="430.0" y="175.0" font-size="11" fill="#64748b" text-anchor="end">3</text>
<line x1="438.0" y1="336.0" x2="438.0" y2="340.0" stroke="#64748b" stroke-width="1.2"/>
<text x="438.0" y="353.0" font-size="10.8" fill="#64748b" text-anchor="middle">N=1</text>
<line x1="467.5" y1="336.0" x2="467.5" y2="340.0" stroke="#64748b" stroke-width="1.2"/>
<text x="467.5" y="353.0" font-size="10.8" fill="#64748b" text-anchor="middle">2</text>
<line x1="526.5" y1="336.0" x2="526.5" y2="340.0" stroke="#64748b" stroke-width="1.2"/>
<text x="526.5" y="353.0" font-size="10.8" fill="#64748b" text-anchor="middle">4</text>
<line x1="585.5" y1="336.0" x2="585.5" y2="340.0" stroke="#64748b" stroke-width="1.2"/>
<text x="585.5" y="353.0" font-size="10.8" fill="#64748b" text-anchor="middle">6</text>
<line x1="644.5" y1="336.0" x2="644.5" y2="340.0" stroke="#64748b" stroke-width="1.2"/>
<text x="644.5" y="353.0" font-size="10.8" fill="#64748b" text-anchor="middle">8</text>
<line x1="703.5" y1="336.0" x2="703.5" y2="340.0" stroke="#64748b" stroke-width="1.2"/>
<text x="703.5" y="353.0" font-size="10.8" fill="#64748b" text-anchor="middle">10</text>
<polyline points="438.0,281.0 467.5,253.5 497.0,235.2 526.5,221.4 556.0,210.4 585.5,201.3 615.0,193.4 644.5,186.5 674.0,180.4 703.5,174.9" fill="none" stroke="#b91c1c" stroke-width="2.3"/>
<circle cx="438.0" cy="281.0" r="3.3" fill="#b91c1c"/>
<circle cx="467.5" cy="253.5" r="3.3" fill="#b91c1c"/>
<circle cx="497.0" cy="235.2" r="3.3" fill="#b91c1c"/>
<circle cx="526.5" cy="221.4" r="3.3" fill="#b91c1c"/>
<circle cx="556.0" cy="210.4" r="3.3" fill="#b91c1c"/>
<circle cx="585.5" cy="201.3" r="3.3" fill="#b91c1c"/>
<circle cx="615.0" cy="193.4" r="3.3" fill="#b91c1c"/>
<circle cx="644.5" cy="186.5" r="3.3" fill="#b91c1c"/>
<circle cx="674.0" cy="180.4" r="3.3" fill="#b91c1c"/>
<circle cx="703.5" cy="174.9" r="3.3" fill="#b91c1c"/>
<text x="724" y="168.8" font-size="10.8" fill="#b91c1c" text-anchor="end" font-weight="700">调和级数 1+1/2+1/3+… → ∞（耗时无穷！）</text>
<polyline points="438.0,308.5 467.5,294.8 497.0,287.9 526.5,284.4 556.0,282.7 585.5,281.9 615.0,281.4 644.5,281.2 674.0,281.1 703.5,281.1" fill="none" stroke="#1d6fa5" stroke-width="2.5"/>
<circle cx="438.0" cy="308.5" r="3.4" fill="#1d6fa5"/>
<circle cx="467.5" cy="294.8" r="3.4" fill="#1d6fa5"/>
<circle cx="497.0" cy="287.9" r="3.4" fill="#1d6fa5"/>
<circle cx="526.5" cy="284.4" r="3.4" fill="#1d6fa5"/>
<circle cx="556.0" cy="282.7" r="3.4" fill="#1d6fa5"/>
<circle cx="585.5" cy="281.9" r="3.4" fill="#1d6fa5"/>
<circle cx="615.0" cy="281.4" r="3.4" fill="#1d6fa5"/>
<circle cx="644.5" cy="281.2" r="3.4" fill="#1d6fa5"/>
<circle cx="674.0" cy="281.1" r="3.4" fill="#1d6fa5"/>
<circle cx="703.5" cy="281.1" r="3.4" fill="#1d6fa5"/>
<text x="724" y="271.1" font-size="10.8" fill="#1d6fa5" text-anchor="end" font-weight="700">芝诺级数 1/2+1/4+1/8+… → 1（严格收敛！）</text>
<rect x="402" y="368" width="324" height="88" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="414" y="390" font-size="11.3" fill="#0f172a" text-anchor="start" font-weight="700">柯西极限定义（1821）：无穷级数之和定义为部分和的极限</text>
<text x="414" y="412" font-size="11.1" fill="#1e293b" text-anchor="start">• 匀速跑步把 1 秒切成 1/2 + 1/4 + 1/8… 秒，极限 = 1 秒；</text>
<text x="414" y="432" font-size="11.1" fill="#1e293b" text-anchor="start">• 若每段故意减速成耗时 1/k 秒，总时间才会真的发散到 ∞；</text>
<text x="414" y="450" font-size="11.1" fill="#64748b" text-anchor="start">• 1−1+1−1… 则因部分和在 1 与 0 间震荡而“无定义”。</text>
</svg>
