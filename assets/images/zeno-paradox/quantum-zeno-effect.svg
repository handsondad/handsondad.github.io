<title id="title">量子芝诺效应短时二次方存活率曲线与 1990 年 NIST 铍离子实验原理图解</title>
<desc id="desc">左栏精确计算 N=1,4,16,64 次投影测量下的存活概率曲线，展示 96.2% 冻结效果；右栏展示 NIST 铍离子三能级探测机制并阐明不能外推到宏观飞矢的科学边界。</desc>
