<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">Misra &amp; Sudarshan (1977) 命名、1990 年 NIST 温兰德团队用铍离子实验证实：密集测量坍缩把跃迁硬生生按回起点</text>
