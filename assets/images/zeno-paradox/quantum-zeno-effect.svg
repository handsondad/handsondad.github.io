<circle cx="74.0" cy="136.0" r="4.5" fill="#b91c1c"/>
<text x="84.0" y="154.0" font-size="10.6" fill="#b91c1c" text-anchor="start" font-weight="700">极短时间平顶：P(δt) ≈ 1 − c·δt²</text>
<rect x="34" y="376" width="384" height="82" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="46" y="397" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么能冻住？因为量子初态演化起步是“二次方慢热”！</text>
<text x="46" y="417" font-size="10.8" fill="#1e293b" text-anchor="start">每次隔 δt = T/N 测一下，溜走概率只有 O(1/N²)；连测 N 次累计</text>
<text x="46" y="435" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">溜走概率 N × O(1/N²) = O(1/N) → 0！当 N → ∞ 时系统永远停在初态。</text>
<rect x="448" y="66" width="292" height="406" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="462.0" y="78.0" width="230" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="577.0" y="93.0" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">右栏：1990 NIST 铍离子实验 &amp; 适用边界</text>
<text x="462" y="118" font-size="11.3" fill="#0f172a" text-anchor="start" font-weight="700">Itano &amp; Wineland 等（Phys. Rev. A, 1990）：</text>
<text x="462" y="137" font-size="10.8" fill="#64748b" text-anchor="start">彭宁离子阱中约 5000 个激光冷却 ⁹Be⁺ 离子</text>
<rect x="462" y="148" width="264" height="146" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<line x1="482" y1="176" x2="588" y2="176" stroke="#6d28d9" stroke-width="2.6"/>
<text x="482" y="168" font-size="10.8" fill="#6d28d9" text-anchor="start" font-weight="700">激发超精细态 |2⟩（暗态）</text>
<line x1="482" y1="244" x2="588" y2="244" stroke="#1d6fa5" stroke-width="2.6"/>
<text x="482" y="262" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="700">基态 |1⟩（初态）</text>
<line x1="616" y1="168" x2="712" y2="168" stroke="#18794e" stroke-width="2.4"/>
<text x="664" y="160" font-size="10.6" fill="#18794e" text-anchor="middle" font-weight="700">探测态 |3⟩</text>
<line x1="534" y1="238" x2="534" y2="184" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="542" y="214" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="600">射频场慢推</text>
<text x="542" y="228" font-size="10" fill="#64748b" text-anchor="start">(T=256 ms)</text>
<line x1="588" y1="240" x2="646" y2="174" stroke="#18794e" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr-green)"/>
<text x="658" y="216" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">N 次紫外脉冲</text>
<text x="658" y="232" font-size="10.3" fill="#18794e" text-anchor="middle">散射光子=点名!</text>
<text x="594" y="282" font-size="10.6" fill="#0f172a" text-anchor="middle" font-weight="600">实测 N 从 1 增至 64：跃迁率从近 100% 跌至 ~1%！</text>
<rect x="462" y="306" width="264" height="152" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="474" y="327" font-size="11.2" fill="#b91c1c" text-anchor="start" font-weight="700">重要科学边界：别误当成宏观定身术！</text>
<text x="474" y="348" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">1. 盯着飞矢看，箭绝不会停在半空：</text>
<text x="474" y="366" font-size="10.6" fill="#1e293b" text-anchor="start">   宏观箭由 ~10²⁴ 个原子组成且早已环境退相干，</text>
<text x="474" y="383" font-size="10.6" fill="#1e293b" text-anchor="start">   人眼看反光不会把整支箭投影回单一量子初态。</text>
<text x="474" y="404" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">2. 甚至还有“反芝诺效应”（Kofman &amp; Kurizki）：</text>
<text x="474" y="422" font-size="10.6" fill="#1e293b" text-anchor="start">   在某些连续谱衰变体系中，特定频率的观测反而</text>
<text x="474" y="439" font-size="10.6" fill="#1e293b" text-anchor="start">   会加速衰变——关键取决于短时能谱结构！</text>
</svg>
