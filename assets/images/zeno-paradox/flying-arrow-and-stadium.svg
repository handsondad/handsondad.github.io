<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">芝诺飞矢不动与游行队伍（运动场）悖论的双栏机制拆解图</title>
<desc id="desc">左栏对比时刻快照与时空曲线切线斜率，解释罗素在-在运动观与导数；右栏展示游行队伍三排方块的相对运动及对离散原子时空观的反证。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="485" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">飞矢不动与游行队伍：另外两大运动悖论到底卡在了哪里？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">亚里士多德《物理学》卷六第九章记载的后两个悖论：一个拷问“瞬间速度是什么”，一个拷问“相对运动与最小微元”</text>
<rect x="20" y="66" width="352" height="406" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="78.0" width="281" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="174.5" y="93.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">左栏：飞矢不动（The Arrow）——瞬间照片能分清动静吗？</text>
<rect x="36" y="112" width="152" height="68" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="112" y="131" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">时刻 t₀ 快门（Δt = 0）</text>
<line x1="56" y1="152" x2="156" y2="152" stroke="#1d6fa5" stroke-width="3.2" marker-end="url(#arr-blue)"/>
<text x="112" y="171" font-size="10.8" fill="#0f172a" text-anchor="middle">飞行的箭：占据自身长</text>
<rect x="204" y="112" width="152" height="68" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="280" y="131" font-size="10.8" fill="#475569" text-anchor="middle" font-weight="600">时刻 t₀ 快门（Δt = 0）</text>
<line x1="224" y1="152" x2="324" y2="152" stroke="#475569" stroke-width="3.2" marker-end="url(#arr-muted)"/>
<text x="280" y="171" font-size="10.8" fill="#0f172a" text-anchor="middle">桌上的箭：占据自身长</text>
<text x="196" y="202" font-size="11.1" fill="#b91c1c" text-anchor="middle" font-weight="600">芝诺推理：每瞬间 Δx=0、Δt=0（0/0 无意义）⇒ 全程静止？</text>
<line x1="74.0" y1="368.0" x2="342" y2="368.0" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<line x1="74.0" y1="368.0" x2="74.0" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<text x="66.0" y="232" font-size="10.8" fill="#64748b" text-anchor="end">位置 x</text>
<text x="340" y="386.0" font-size="10.8" fill="#64748b" text-anchor="end">时间 t</text>
<line x1="88" y1="326" x2="326" y2="326" stroke="#475569" stroke-width="2.2" stroke-dasharray="5 3"/>
<text x="282" y="344" font-size="10.8" fill="#475569" text-anchor="middle">静止的箭：dx/dt = 0</text>
<path d="M 88,352 Q 186,314 322,232" fill="none" stroke="#1d6fa5" stroke-width="2.6"/>
<line x1="135.5" y1="333.0" x2="255.5" y2="273.0" stroke="#c25014" stroke-width="1.8" stroke-dasharray="4 2"/>
<circle cx="195.5" cy="303.0" r="4.8" fill="#b91c1c" stroke="#ffffff" stroke-width="1.4"/>
<line x1="195.5" y1="368.0" x2="195.5" y2="303.0" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="195.5" y="384.0" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">t₀</text>
<text x="222" y="256" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">飞行的箭：切线斜率 v(t₀) &gt; 0</text>
<rect x="36" y="394" width="320" height="64" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="48" y="415" font-size="11.3" fill="#18794e" text-anchor="start" font-weight="700">罗素“在—在”理论 + 微积分导数：</text>
<text x="48" y="435" font-size="11" fill="#1e293b" text-anchor="start">运动不是在 Δt=0 内部挤出位移，而是不同时刻处在</text>
<text x="48" y="451" font-size="11" fill="#1e293b" text-anchor="start">不同位置的函数映射 x(t)，瞬时速度是邻域差商的极限。</text>
<rect x="388" y="66" width="352" height="406" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402.0" y="78.0" width="298" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="551.0" y="93.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">右栏：游行队伍（The Stadium）——一半时间等于一倍时间？</text>
<text x="404" y="122" font-size="11.1" fill="#0f172a" text-anchor="start" font-weight="600">① 初态 t = 0（领头 B₃ 与领头 C₁ 同对准看台中央 A₂）：</text>
<rect x="510.0" y="132.0" width="38.0" height="22.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="529.0" y="147.2" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">A₁</text>
<rect x="551.0" y="132.0" width="38.0" height="22.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="570.0" y="147.2" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">A₂</text>
<rect x="592.0" y="132.0" width="38.0" height="22.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="611.0" y="147.2" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">A₃</text>
<rect x="469.0" y="160.0" width="38.0" height="22.0" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="488.0" y="175.2" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">B₁</text>
<rect x="510.0" y="160.0" width="38.0" height="22.0" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="529.0" y="175.2" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">B₂</text>
<rect x="551.0" y="160.0" width="38.0" height="22.0" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="570.0" y="175.2" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">B₃</text>
<line x1="596.0" y1="171.0" x2="622.0" y2="171.0" stroke="#1d6fa5" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="628.0" y="175.0" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">+v</text>
<rect x="551.0" y="188.0" width="38.0" height="22.0" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="570.0" y="203.2" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">C₁</text>
<rect x="592.0" y="188.0" width="38.0" height="22.0" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="611.0" y="203.2" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">C₂</text>
<rect x="633.0" y="188.0" width="38.0" height="22.0" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="652.0" y="203.2" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">C₃</text>
<line x1="543.0" y1="199.0" x2="517.0" y2="199.0" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="511.0" y="203.0" font-size="11" fill="#c25014" text-anchor="end" font-weight="700">−v</text>
<text x="404" y="234" font-size="11.1" fill="#0f172a" text-anchor="start" font-weight="600">② 经 Δt = L/v 后（B 右移 1 格、C 左移 1 格，三排对齐）：</text>
<rect x="510.0" y="244.0" width="38.0" height="22.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="529.0" y="259.2" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">A₁</text>
<rect x="551.0" y="244.0" width="38.0" height="22.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="570.0" y="259.2" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">A₂</text>
<rect x="592.0" y="244.0" width="38.0" height="22.0" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="611.0" y="259.2" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">A₃</text>
<rect x="510.0" y="272.0" width="38.0" height="22.0" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="529.0" y="287.2" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">B₁</text>
<rect x="551.0" y="272.0" width="38.0" height="22.0" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="570.0" y="287.2" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">B₂</text>
<rect x="592.0" y="272.0" width="38.0" height="22.0" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="611.0" y="287.2" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">B₃</text>
<line x1="637.0" y1="283.0" x2="663.0" y2="283.0" stroke="#1d6fa5" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="669.0" y="287.0" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">+v</text>
<rect x="510.0" y="300.0" width="38.0" height="22.0" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="529.0" y="315.2" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">C₁</text>
<rect x="551.0" y="300.0" width="38.0" height="22.0" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="570.0" y="315.2" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">C₂</text>
<rect x="592.0" y="300.0" width="38.0" height="22.0" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="611.0" y="315.2" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">C₃</text>
<line x1="502.0" y1="311.0" x2="476.0" y2="311.0" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="470.0" y="315.0" font-size="11" fill="#c25014" text-anchor="end" font-weight="700">−v</text>
<rect x="402" y="334" width="324" height="124" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="414" y="354" font-size="11.3" fill="#b45309" text-anchor="start" font-weight="700">两层拆解（别只把芝诺当成不会算相对速度！）：</text>
<text x="414" y="375" font-size="10.9" fill="#1e293b" text-anchor="start">1. 连续时空层：B₃ 掠过 1 个静止 A，却掠过 2 个反向 C，</text>
<text x="414" y="393" font-size="10.9" fill="#1e293b" text-anchor="start">   只因相对速度 v_BC = v − (−v) = 2v，耗时都是 Δt，无矛盾。</text>
<text x="414" y="414" font-size="10.9" fill="#b91c1c" text-anchor="start" font-weight="600">2. 离散时空暴击：若一格是“不可再分的最小空间原子”，</text>
<text x="414" y="432" font-size="10.9" fill="#1e293b" text-anchor="start">   Δt 是“最小时间原子”，那 B₃ 和 C₂ 何时迎面擦肩对齐？</text>
<text x="414" y="449" font-size="10.9" fill="#1e293b" text-anchor="start">   它们竟在没有中间时刻的情况下“瞬移穿模”越过了彼此！</text>
</svg>
