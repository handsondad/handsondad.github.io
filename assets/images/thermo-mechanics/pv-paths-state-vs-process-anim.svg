<svg xmlns="http://www.w3.org/2000/svg" width="760" height="532" viewBox="0 0 760 532" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">P-V 图上三条路径的做功、吸热与内能变化对比动画</title>
<desc id="desc">精确计算 1 mol 单原子理想气体从 A(2.0 bar, 10 L) 到 B(1.0 bar, 30 L) 沿三条不同路径的功 W(4.00/3.00/2.00 kJ) 与热 Q(5.50/4.50/3.50 kJ)，展示内能增量恒为 +1.50 kJ。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .pv-p1 {
    stroke-dasharray: 340;
    stroke-dashoffset: 340;
    animation: drawP1 1.7s ease-out 0.2s forwards;
  }
  .pv-p2 {
    stroke-dasharray: 260;
    stroke-dashoffset: 260;
    animation: drawP2 1.5s ease-out 1.4s forwards;
  }
  .pv-p3 {
    stroke-dasharray: 340;
    stroke-dashoffset: 340;
    animation: drawP3 1.7s ease-out 2.5s forwards;
  }
  .pv-loop {
    opacity: 0;
    animation: showLoop 0.9s ease-out 3.8s forwards;
  }
  @keyframes drawP1 { to { stroke-dashoffset: 0; } }
  @keyframes drawP2 { to { stroke-dashoffset: 0; } }
  @keyframes drawP3 { to { stroke-dashoffset: 0; } }
  @keyframes showLoop { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .pv-p1, .pv-p2, .pv-p3 {
      animation: none !important;
      stroke-dashoffset: 0 !important;
    }
    .pv-loop {
      animation: none !important;
      opacity: 1 !important;
    }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="531" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">状态参量 vs 过程量：终点海拔（ΔU）一模一样，三条路做功与吸热全不同！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">以 1 mol 单原子理想气体从初态 A(2.0 bar, 10 L) 到末态 B(1.0 bar, 30 L) 为精确算例（面积 ∫P dV 即对外做功）</text>
<rect x="22" y="68" width="426" height="392" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="94" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">P–V 状态图：点代表“平衡态”，线代表“准静态过程”</text>
<rect x="140.0" y="285.0" width="220.0" height="110.0" fill="#e7f6ee" opacity="0.75"/>
<rect class="pv-loop" x="140.0" y="175.0" width="220.0" height="110.0" fill="#fef1e8" opacity="0.85"/>
<line x1="140.0" y1="120.0" x2="140.0" y2="395.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="140" y="414" font-size="11.5" fill="#475569" text-anchor="middle">10 L</text>
<line x1="250.0" y1="120.0" x2="250.0" y2="395.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="250" y="414" font-size="11.5" fill="#475569" text-anchor="middle">20 L</text>
<line x1="360.0" y1="120.0" x2="360.0" y2="395.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="360" y="414" font-size="11.5" fill="#475569" text-anchor="middle">30 L</text>
<line x1="85.0" y1="285.0" x2="418.0" y2="285.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="77" y="289" font-size="11.5" fill="#475569" text-anchor="end">1.0</text>
<line x1="85.0" y1="175.0" x2="418.0" y2="175.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
<text x="77" y="179" font-size="11.5" fill="#475569" text-anchor="end">2.0</text>
<line x1="85.0" y1="395.0" x2="426.0" y2="395.0" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr-muted)"/>
<line x1="85.0" y1="395.0" x2="85.0" y2="114.0" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr-muted)"/>
<text x="85" y="107" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">压强 P (bar)</text>
<text x="394" y="434" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">体积 V (L)</text>
<text x="77" y="399" font-size="11.5" fill="#475569" text-anchor="end">0</text>
<polyline points="140.0,175.0 360.0,175.0 360.0,285.0" fill="none" stroke="#c25014" stroke-width="1.2" stroke-opacity="0.28"/>
<line x1="140.0" y1="175.0" x2="360.0" y2="285.0" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="5,4"/>
<polyline points="140.0,175.0 140.0,285.0 360.0,285.0" fill="none" stroke="#18794e" stroke-width="1.2" stroke-opacity="0.28"/>
<polyline class="pv-p1" points="140.0,175.0 360.0,175.0 360.0,285.0" fill="none" stroke="#c25014" stroke-width="3.2" stroke-linejoin="round"/>
<line class="pv-p2" x1="140.0" y1="175.0" x2="360.0" y2="285.0" stroke="#1d6fa5" stroke-width="2.8"/>
<polyline class="pv-p3" points="140.0,175.0 140.0,285.0 360.0,285.0" fill="none" stroke="#18794e" stroke-width="3.0" stroke-linejoin="round"/>
<line x1="235.0" y1="175.0" x2="265.0" y2="175.0" stroke="#c25014" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<line x1="235.0" y1="222.5" x2="265.0" y2="237.5" stroke="#1d6fa5" stroke-width="2.2" marker-end="url(#arr-blue)"/>
<line x1="235.0" y1="285.0" x2="265.0" y2="285.0" stroke="#18794e" stroke-width="2.2" marker-end="url(#arr-green)"/>
<text x="285" y="162" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">路线 ① 先等压膨胀再等容</text>
<text x="234" y="214" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">路线 ② 直线降压膨胀</text>
<text x="232" y="306" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">路线 ③ 先等容再等压膨胀</text>
<text x="250" y="354" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="600" class="halo">路线 ③ 下方面积 W₃ = 2.00 kJ</text>
<circle cx="140.0" cy="175.0" r="6.5" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<circle cx="360.0" cy="285.0" r="6.5" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
<text x="94" y="145" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" class="halo">初态 A (Uₐ=3.00 kJ)</text>
<text x="420" y="272" font-size="12" fill="#0f172a" text-anchor="end" font-weight="700" class="halo">末态 B (Uᵦ=4.50 kJ)</text>
<text x="235" y="451" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">注：若沿 ① 去、沿 ③ 回构成闭合循环，∮dU = 0，橙框净功 = 2.00 kJ！</text>
<rect x="462" y="68" width="276" height="392" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="478" y="94" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">三本对账单：谁看路径？谁只看终点？</text>
<rect x="474" y="108" width="252" height="64" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="486" y="127" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">路线 ①（上折线）</text>
<text x="486" y="146" font-size="11.5" fill="#1e293b" text-anchor="start">对外功 W₁ = +4.00 kJ  |  吸热 Q₁ = +5.50 kJ</text>
<text x="486" y="164" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">内能差 ΔU = Q₁ − W₁ = +1.50 kJ</text>
<rect x="474" y="180" width="252" height="64" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="486" y="199" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">路线 ②（中斜线）</text>
<text x="486" y="218" font-size="11.5" fill="#1e293b" text-anchor="start">对外功 W₂ = +3.00 kJ  |  吸热 Q₂ = +4.50 kJ</text>
<text x="486" y="236" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">内能差 ΔU = Q₂ − W₂ = +1.50 kJ</text>
<rect x="474" y="252" width="252" height="64" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="486" y="271" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">路线 ③（下折线）</text>
<text x="486" y="290" font-size="11.5" fill="#1e293b" text-anchor="start">对外功 W₃ = +2.00 kJ  |  吸热 Q₃ = +3.50 kJ</text>
<text x="486" y="308" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">内能差 ΔU = Q₃ − W₃ = +1.50 kJ</text>
<rect x="474" y="326" width="252" height="122" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="600" y="347" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="700">微积分符号里的“防坑警报”</text>
<text x="486" y="369" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 态函数用 dU：全微分，∮dU = 0</text>
<text x="496" y="387" font-size="11" fill="#64748b" text-anchor="start">如同银行余额，只取决于当前状态</text>
<text x="486" y="408" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="600">• 过程量用 δQ、δW：不完全微分</text>
<text x="496" y="426" font-size="11" fill="#1e293b" text-anchor="start">如同刷卡流水，严禁写“含有多少热量”！</text>
<rect x="22" y="472" width="716" height="46" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="500" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">核心铁律：W₁ ≠ W₂ ≠ W₃，Q₁ ≠ Q₂ ≠ Q₃（过程量记住历史）；但 Q − W 永远等于 Uᵦ − Uₐ = +1.50 kJ（状态量毫无历史记忆）！</text>
</svg>
