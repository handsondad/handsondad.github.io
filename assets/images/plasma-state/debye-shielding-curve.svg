<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">德拜屏蔽球与汤川指数衰减电势曲线</title>
<desc id="desc">左图展示自由电子在半径为德拜长度的球内聚拢屏蔽正测试电荷；右图精确绘制真空库仑势1/r与等离子体德拜屏蔽势(1/r)exp(-r/λ_D)的对比，在一倍德拜长度处衰减至1/e。</desc>
