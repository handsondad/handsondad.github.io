<svg xmlns="http://www.w3.org/2000/svg" width="760" height="378" viewBox="0 0 760 378" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">芯片制造湿法化学腐蚀横向钻蚀与反应离子等离子体垂直刻蚀对比</title>
<desc id="desc">左图展示湿法化学酸液因分子无方向热运动造成掩模下方严重横向钻蚀；右图展示13.56MHz射频冷等离子体通过鞘层垂直电场加速正离子轰击晶圆沟底，实现90度垂直侧壁的纳米级各向异性刻蚀。</desc>
