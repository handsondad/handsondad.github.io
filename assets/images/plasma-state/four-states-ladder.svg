<text x="202" y="338" font-size="11.5" fill="#0f172a" text-anchor="start">1928 年朗缪尔借医学“血浆（Plasma）”命名：电离气体像血浆托载血细胞那样承载电子与离子。</text>
<text x="34" y="362" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">中文译名抓住了核心物理：宏观体积内正、负电荷数几乎相等（nₑ ≈ Z·nᵢ，准电中性），绝非“粒子个头相等”！</text>
