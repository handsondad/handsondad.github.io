<line x1="82.0" y1="269.3" x2="444.0" y2="269.3" stroke="#93c5fd" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="442.0" y="265.3" font-size="10.0" fill="#1d6fa5" text-anchor="end" class="halo">1 eV ≈ 1.16×10⁴ K</text>
