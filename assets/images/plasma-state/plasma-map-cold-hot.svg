<text x="211.3" y="247.8" font-size="9.8" fill="#1e293b" text-anchor="middle" class="halo">冷等离子体 Tₑ≫T_gas</text>
<circle cx="263.0" cy="136.1" r="6.2" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.8"/>
<text x="272.0" y="140.1" font-size="10.8" fill="#6d28d9" text-anchor="start" font-weight="700" class="halo">托卡马克聚变 (ITER)</text>
<text x="272.0" y="153.1" font-size="9.8" fill="#1e293b" text-anchor="start" class="halo">1.5×10⁸ K</text>
<circle cx="314.7" cy="255.9" r="5.2" fill="#fef1e8" stroke="#c25014" stroke-width="1.8"/>
<text x="314.7" y="230.9" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">闪电 / 电弧焊</text>
<text x="314.7" y="243.9" font-size="9.8" fill="#1e293b" text-anchor="middle" class="halo">热等离子体 Tₑ≈T_gas</text>
<circle cx="418.1" cy="168.5" r="5.2" fill="#fef1e8" stroke="#c25014" stroke-width="1.8"/>
<text x="409.1" y="172.5" font-size="10.8" fill="#c25014" text-anchor="end" font-weight="700" class="halo">太阳核心</text>
<text x="409.1" y="185.5" font-size="9.8" fill="#1e293b" text-anchor="end" class="halo">1.5×10⁷ K</text>
<circle cx="179.0" cy="303.2" r="4.6" fill="#ffffff" stroke="#475569" stroke-width="1.4" stroke-dasharray="2 2"/>
<text x="188.0" y="307.2" font-size="9.8" fill="#475569" text-anchor="start" class="halo">蜡烛火焰（极弱电离热气体）</text>
<text x="36" y="368" font-size="10.5" fill="#64748b" text-anchor="start">注：两轴均为十进制对数坐标；右上高温或高密区多为热平衡等离子体</text>
<rect x="478" y="62" width="262" height="318" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="494" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="600">② 乒乓球撞保龄球：双温之谜</text>
<rect x="494" y="96" width="230" height="114" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
