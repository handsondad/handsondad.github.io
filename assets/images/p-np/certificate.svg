<svg xmlns="http://www.w3.org/2000/svg" width="540" height="652.5" viewBox="0 0 540 652.5" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">子集和的证书与验证</title>
<desc id="desc">五枚硬币面值三、五、六、九、十二，每枚最多使用一次，目标十七。选择第二和第五枚得到十七，是有效证书；第一、三、四枚得到十八，只能排除该组合，不能据此认定无解。共三十二个候选子集。</desc>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect x="0.75" y="0.75" width="538.5" height="651" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/>
<g transform="scale(0.75)">
<text x="36" y="44.98" font-size="21.2" fill="#172b45" text-anchor="start" font-weight="700">找到一个组合，与检查一份清单</text>
<text x="36" y="86.32" font-size="19.0" fill="#41576a" text-anchor="start">每枚最多用一次；目标：恰好凑出 17。</text>
<rect x="24" y="120" width="672" height="172" rx="16" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
<circle cx="100" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="100" y="197.98" font-size="21.2" fill="#176786" text-anchor="middle" font-weight="700">3</text>
<text x="100" y="265.39" font-size="18.2" fill="#41576a" text-anchor="middle">第 1 枚</text>
<circle cx="230" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="230" y="197.98" font-size="21.2" fill="#176786" text-anchor="middle" font-weight="700">5</text>
<text x="230" y="265.39" font-size="18.2" fill="#41576a" text-anchor="middle">第 2 枚</text>
<circle cx="360" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="360" y="197.98" font-size="21.2" fill="#176786" text-anchor="middle" font-weight="700">6</text>
<text x="360" y="265.39" font-size="18.2" fill="#41576a" text-anchor="middle">第 3 枚</text>
<circle cx="490" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="490" y="197.98" font-size="21.2" fill="#176786" text-anchor="middle" font-weight="700">9</text>
<text x="490" y="265.39" font-size="18.2" fill="#41576a" text-anchor="middle">第 4 枚</text>
<circle cx="620" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="620" y="197.98" font-size="21.2" fill="#176786" text-anchor="middle" font-weight="700">12</text>
<text x="620" y="265.39" font-size="18.2" fill="#41576a" text-anchor="middle">第 5 枚</text>
<rect x="24" y="320" width="672" height="218" rx="16" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
<text x="44" y="361.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">① 证书：选第 2、5 枚</text>
<text x="44" y="411.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">核对：编号合法，没有重复。</text>
<text x="44" y="458.80" font-size="20.2" fill="#176786" text-anchor="start" font-weight="700">求和：5 + 12 = 17。</text>
<text x="44" y="507.03" font-size="20.0" fill="#176786" text-anchor="start" font-weight="600">结论：存在，回答“是”。</text>
<rect x="24" y="565" width="672" height="218" rx="16" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
<text x="44" y="606.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">② 另一份证书：选第 1、3、4 枚</text>
<text x="44" y="656.03" font-size="20.0" fill="#ad4f16" text-anchor="start" font-weight="600">求和：3 + 6 + 9 = 18，不是 17。</text>
<text x="44" y="704.03" font-size="20.0" fill="#172b45" text-anchor="start" font-weight="600">只能排除这一份组合。</text>
<text x="44" y="752.03" font-size="20.0" fill="#172b45" text-anchor="start" font-weight="600">不能由此推出：所有组合都不行。</text>
<text x="36" y="830.39" font-size="18.2" fill="#41576a" text-anchor="start">5 枚 → 2⁵ = 32 个候选；检查一份不必枚举全部。</text>
</g>
</svg>
