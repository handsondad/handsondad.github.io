<svg xmlns="http://www.w3.org/2000/svg" width="720" height="870" viewBox="0 0 720 870" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">子集和的证书与验证</title>
<desc id="desc">五枚硬币面值三、五、六、九、十二，每枚最多使用一次，目标十七。选择第二和第五枚得到十七，是有效证书；第一、三、四枚得到十八，只能排除该组合，不能据此认定无解。共三十二个候选子集。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="720" height="870" fill="#f3f7fa"/>
<text x="36" y="48" font-size="32" fill="#172b45" text-anchor="start">找到一个组合，与检查一份清单</text>
<text x="36" y="88" font-size="25" fill="#41576a" text-anchor="start">每枚最多用一次；目标：恰好凑出 17。</text>
<rect x="24" y="120" width="672" height="172" rx="16" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
<circle cx="100" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="100" y="201" font-size="32" fill="#176786" text-anchor="middle">3</text>
<text x="100" y="267" font-size="24" fill="#41576a" text-anchor="middle">第 1 枚</text>
<circle cx="230" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="230" y="201" font-size="32" fill="#176786" text-anchor="middle">5</text>
<text x="230" y="267" font-size="24" fill="#41576a" text-anchor="middle">第 2 枚</text>
<circle cx="360" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="360" y="201" font-size="32" fill="#176786" text-anchor="middle">6</text>
<text x="360" y="267" font-size="24" fill="#41576a" text-anchor="middle">第 3 枚</text>
<circle cx="490" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="490" y="201" font-size="32" fill="#176786" text-anchor="middle">9</text>
<text x="490" y="267" font-size="24" fill="#41576a" text-anchor="middle">第 4 枚</text>
<circle cx="620" cy="189" r="36" fill="#e1f0f5" stroke="#176786" stroke-width="2"/>
<text x="620" y="201" font-size="32" fill="#176786" text-anchor="middle">12</text>
<text x="620" y="267" font-size="24" fill="#41576a" text-anchor="middle">第 5 枚</text>
<rect x="24" y="320" width="672" height="218" rx="16" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
<text x="44" y="364" font-size="29" fill="#172b45" text-anchor="start">① 证书：选第 2、5 枚</text>
<text x="44" y="413" font-size="26" fill="#172b45" text-anchor="start">核对：编号合法，没有重复。</text>
<text x="44" y="461" font-size="28" fill="#176786" text-anchor="start">求和：5 + 12 = 17。</text>
<text x="44" y="509" font-size="27" fill="#176786" text-anchor="start">结论：存在，回答“是”。</text>
<rect x="24" y="565" width="672" height="218" rx="16" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
<text x="44" y="609" font-size="28" fill="#172b45" text-anchor="start">② 另一份证书：选第 1、3、4 枚</text>
<text x="44" y="658" font-size="27" fill="#ad4f16" text-anchor="start">求和：3 + 6 + 9 = 18，不是 17。</text>
<text x="44" y="706" font-size="27" fill="#172b45" text-anchor="start">只能排除这一份组合。</text>
<text x="44" y="754" font-size="27" fill="#172b45" text-anchor="start">不能由此推出：所有组合都不行。</text>
<text x="36" y="832" font-size="24" fill="#41576a" text-anchor="start">5 枚 → 2⁵ = 32 个候选；检查一份不必枚举全部。</text>
</svg>
