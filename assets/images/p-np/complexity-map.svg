<svg xmlns="http://www.w3.org/2000/svg" width="540" height="776.25" viewBox="0 0 540 776.25" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">P与NP关系的假设图及另一种可能</title>
<desc id="desc">上图明确假设P不等于NP：P严格包含于NP，NP完全问题是NP与NP难的交集，P与此交集分离，NP难还延伸到NP之外。下方说明若P等于NP，NP中所有问题可快速判定，非平凡问题也为NP完全，但不可判定问题不会因此变可判定。面积和距离不表达数量与难度。</desc>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect x="0.75" y="0.75" width="538.5" height="774.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/>
<g transform="scale(0.75)">
<text x="36" y="44.98" font-size="21.2" fill="#172b45" text-anchor="start" font-weight="700">先读假设，再看 P、NP 与 NPC</text>
<text x="36" y="86.39" font-size="18.2" fill="#ad4f16" text-anchor="start">下面的分离图假设 P ≠ NP；这不是已证明结论。</text>
<rect x="36" y="130" width="428" height="430" rx="18" fill="#e1f0f5" stroke="#176786" stroke-width="3"/>
<rect x="304" y="180" width="380" height="430" rx="18" fill="#fff1df" fill-opacity="0.62" stroke="#ad4f16" stroke-width="3" stroke-dasharray="9 6"/>
<text x="74" y="176.70" font-size="21.2" fill="#176786" text-anchor="start" font-weight="700">NP</text>
<text x="505" y="222.73" font-size="20.9" fill="#ad4f16" text-anchor="start" font-weight="700">NP-Hard</text>
<rect x="76" y="248" width="184" height="136" rx="16" fill="#fff" stroke="#176786" stroke-width="2"/>
<text x="168" y="296.98" font-size="21.2" fill="#176786" text-anchor="middle" font-weight="700">P</text>
<text x="168" y="346.39" font-size="18.2" fill="#176786" text-anchor="middle">可快速判定</text>
<text x="384" y="322.26" font-size="21.2" fill="#ad4f16" text-anchor="middle" font-weight="700">NPC</text>
<text x="384" y="368.11" font-size="19.2" fill="#ad4f16" text-anchor="middle" font-weight="600">交集</text>
<text x="560" y="453.45" font-size="17.5" fill="#ad4f16" text-anchor="middle">例如停机问题</text>
<text x="560" y="497.32" font-size="19.0" fill="#ad4f16" text-anchor="middle">不属于 NP</text>
<text x="74" y="440.45" font-size="17.5" fill="#41576a" text-anchor="start">留白不全是 NPC</text>
<text x="74" y="484.45" font-size="17.5" fill="#41576a" text-anchor="start">面积不表示数量</text>
<rect x="24" y="652" width="672" height="257" rx="16" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
<text x="44" y="694.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">另一种尚未排除的可能：P = NP</text>
<text x="44" y="748.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">那时 NP 中的所有问题，都可快速判定。</text>
<text x="44" y="796.32" font-size="19.0" fill="#172b45" text-anchor="start">非平凡的 NP 判定问题，也都会是 NPC。</text>
<text x="44" y="843.32" font-size="19.0" fill="#172b45" text-anchor="start">但 NP-Hard 仍可包含 NP 外的不可判定问题。</text>
<text x="44" y="885.45" font-size="17.5" fill="#41576a" text-anchor="start">“非平凡”：既有“是”实例，也有“否”实例。</text>
<text x="36" y="952.03" font-size="20.0" fill="#172b45" text-anchor="start" font-weight="600">始终成立：P ⊆ NP；NPC = NP ∩ NP-Hard。</text>
<text x="36" y="997.39" font-size="18.2" fill="#41576a" text-anchor="start">不是所有问题都属于这四类；图只画相关关系。</text>
</g>
</svg>
