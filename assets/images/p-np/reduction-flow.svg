<svg xmlns="http://www.w3.org/2000/svg" width="540" height="701.25" viewBox="0 0 540 701.25" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">多项式时间多对一归约的方向</title>
<desc id="desc">从问题A的输入出发，多项式时间转换成B的输入，交给假设存在的快速判定器，把其是或否答案作为A的答案。转换保留两个方向。三个步骤一直可读，描边依次提示流程，播放一次后保持完整静态信息；减少动态效果时不播放。</desc>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect x="0.75" y="0.75" width="538.5" height="699.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/>
<g transform="scale(0.75)">
<text x="36" y="44.98" font-size="21.2" fill="#172b45" text-anchor="start" font-weight="700">A ≤ₚ B：把 A 的输入交给 B</text>
<text x="36" y="86.39" font-size="18.2" fill="#41576a" text-anchor="start">输入沿箭头流动；描边提示次序，不表示耗时。</text>
<style>.stage{animation:focus 2s linear 1 forwards}.s2{animation-delay:2s}.s3{animation-delay:4s}@keyframes focus{0%,90%{stroke:#ad4f16;stroke-width:6}100%{stroke:#176786;stroke-width:2}}@media(prefers-reduced-motion:reduce){.stage{animation:none}}</style>
<rect class="stage s1" x="24" y="120" width="672" height="160" rx="16" fill="#fff" stroke="#176786" stroke-width="2"/>
<text x="44" y="168.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">① A 的输入 x → 多项式时间翻译</text>
<text x="44" y="226.39" font-size="18.2" fill="#41576a" text-anchor="start">得到 B 的输入 f(x)，不能偷偷先解出 A。</text>
<path d="M360 294V338" stroke="#176786" stroke-width="4"/>
<path d="M360 345L349 329H371Z" fill="#176786"/>
<rect class="stage s2" x="24" y="355" width="672" height="160" rx="16" fill="#fff" stroke="#176786" stroke-width="2"/>
<text x="44" y="403.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">② 假设有一台 B 的快速判定器</text>
<text x="44" y="461.39" font-size="18.2" fill="#41576a" text-anchor="start">把 f(x) 交进去；此处是假设，不是已实现。</text>
<path d="M360 529V573" stroke="#176786" stroke-width="4"/>
<path d="M360 580L349 564H371Z" fill="#176786"/>
<rect class="stage s3" x="24" y="590" width="672" height="160" rx="16" fill="#fff" stroke="#176786" stroke-width="2"/>
<text x="44" y="638.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">③ 返回同一个“是／否”答案</text>
<text x="44" y="696.39" font-size="18.2" fill="#41576a" text-anchor="start">A 的原输入为“是” ⇔ B 的新输入为“是”。</text>
<text x="36" y="805.03" font-size="20.0" fill="#176786" text-anchor="start" font-weight="600">如果 B 能快速判定，A 就也能快速判定。</text>
<text x="36" y="852.03" font-size="20.0" fill="#172b45" text-anchor="start" font-weight="600">要证明 B 很难：从已知难的 A，归约到 B。</text>
<text x="36" y="897.39" font-size="18.2" fill="#41576a" text-anchor="start">一次转换、一个新实例：本文只用多对一归约。</text>
</g>
</svg>
