<text x="154" y="200" font-size="10.0" fill="#1e293b" text-anchor="start">动势与留白场</text>
<text x="48" y="229" font-size="9.6" fill="#64748b" text-anchor="start">长处：保留连续几何拓扑与整体张力</text>
