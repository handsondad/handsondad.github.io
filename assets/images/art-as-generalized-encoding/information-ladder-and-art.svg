<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">物理痕迹形式模式符号解释和文化解释的广义编码阶梯</title>
<desc id="desc">把物理材料、形式模式、符号关系、个人与文化解释放在同一条层级图上，说明文字、图像、音乐和建筑都属于广义编码系统。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="473" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">艺术到底是什么？先把一幅画和一段文字放回同一条“编码阶梯”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">符号不止是文字：像素、笔触、旋律、动作、建筑与自然痕迹，都可能携带可被解释的信息。</text>
<rect x="24" y="36" width="712" height="74" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<rect x="40.0" y="51.0" width="130" height="24" rx="12.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="105.0" y="67.3" font-size="10" fill="#1d6fa5" text-anchor="middle" font-weight="600">物理痕迹</text>
<text x="188" y="68" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">墨水、像素、振动、土石、光影</text>
<line x1="370.0" y1="110.0" x2="370.0" y2="146.0" stroke="#1d6fa5" stroke-width="1.6" marker-end="url(#arr-blue)"/>
<rect x="24" y="128" width="712" height="74" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<rect x="40.0" y="143.0" width="130" height="24" rx="12.0" fill="#ffffff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="105.0" y="159.3" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="600">形式模式</text>
<text x="188" y="160" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">线、色、节奏、比例、密度、留白</text>
<line x1="370.0" y1="202.0" x2="370.0" y2="238.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-blue)"/>
<rect x="24" y="220" width="712" height="74" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<rect x="40.0" y="235.0" width="130" height="24" rx="12.0" fill="#ffffff" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="105.0" y="251.3" font-size="10" fill="#c25014" text-anchor="middle" font-weight="600">可解释符号</text>
<text x="188" y="252" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">肖像、地图、隐喻、惯例、情绪暗示</text>
<line x1="370.0" y1="294.0" x2="370.0" y2="330.0" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-blue)"/>
<rect x="24" y="312" width="712" height="74" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<rect x="40.0" y="327.0" width="130" height="24" rx="12.0" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="105.0" y="343.3" font-size="10" fill="#18794e" text-anchor="middle" font-weight="600">个人与文化解释</text>
<text x="188" y="344" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">记忆、经验、共同背景、阅读语境</text>
<rect x="24" y="402" width="712" height="58" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="424" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">文字只是编码方式的一种；图像也未必更含糊。</text>
<text x="38" y="444" font-size="10.1" fill="#64748b" text-anchor="start">关键不是“像不像”，而是哪些差异被保留、哪些差异被选择性压缩，以及谁正在解释。</text>
</svg>
