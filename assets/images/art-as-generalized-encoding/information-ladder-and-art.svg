<rect x="48.0" y="259.0" width="146" height="22" rx="11.0" fill="#ffffff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="121.0" y="274.0" font-size="10.2" fill="#6d28d9" text-anchor="middle" font-weight="600">一维文字编码（串行流）</text>
<rect x="48" y="290" width="68" height="52" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1"/>
<path d="M68,296 C78,294 88,299 92,307 C84,311 74,311 66,309 M74,310 L72,325 M82,310 L82,325 M90,308 L95,324 M64,316 L58,324" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round"/>
<text x="82" y="338" font-size="8.8" fill="#64748b" text-anchor="middle">象形轮廓</text>
<line x1="120.0" y1="316.0" x2="138.0" y2="316.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arr-purple)"/>
<rect x="144" y="290" width="106" height="52" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1"/>
<text x="197" y="314" font-size="13.0" fill="#6d28d9" text-anchor="middle" font-weight="700">「白 马」</text>
<text x="197" y="333" font-size="9.2" fill="#64748b" text-anchor="middle" class="mono">11100111…</text>
<text x="48" y="364" font-size="9.6" fill="#64748b" text-anchor="start">长处：离散符号组合、否定与因果推理</text>
<text x="150" y="398" font-size="10.0" fill="#0f172a" text-anchor="middle" font-weight="700">汉字本身就曾从二维图画线性化而来</text>
<text x="150" y="416" font-size="9.6" fill="#64748b" text-anchor="middle">底层相通：都在用有限差异编码世界关系</text>
<rect x="292" y="68" width="444" height="76" rx="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<circle cx="313" cy="90" r="10.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="313" y="94" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="331" y="94" font-size="12.4" fill="#1d6fa5" text-anchor="start" font-weight="700">物理载体与差异痕迹</text>
<rect x="612.0" y="79.0" width="110" height="21" rx="10.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="667.0" y="93.3" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="600">可观测差异</text>
<text x="331" y="116" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">宣纸墨迹、屏幕像素矩阵、空气声压波、石材凿痕</text>
<text x="331" y="134" font-size="9.8" fill="#64748b" text-anchor="start">香农通信层：只要状态有可区分差异，就能充当编码载体</text>
<line x1="514.0" y1="146.0" x2="514.0" y2="160.0" stroke="#1d6fa5" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<rect x="292" y="164" width="444" height="76" rx="9" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<circle cx="313" cy="186" r="10.5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="313" y="190" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="331" y="190" font-size="12.4" fill="#6d28d9" text-anchor="start" font-weight="700">形式模式与知觉张力</text>
<rect x="612.0" y="175.0" width="110" height="21" rx="10.5" fill="#ffffff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="667.0" y="189.3" font-size="10.0" fill="#6d28d9" text-anchor="middle" font-weight="600">并置与节律</text>
<text x="331" y="212" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">边缘轮廓、冷暖对比、疏密比例、留白与运动趋势</text>
<text x="331" y="230" font-size="9.8" fill="#64748b" text-anchor="start">格式塔知觉层：眼睛与耳朵主动把零散刺激组织成“力与形”</text>
<line x1="514.0" y1="242.0" x2="514.0" y2="256.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr-purple)"/>
<rect x="292" y="260" width="444" height="76" rx="9" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<circle cx="313" cy="282" r="10.5" fill="#ffffff" stroke="#c25014" stroke-width="1.2"/>
<text x="313" y="286" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">3</text>
<text x="331" y="286" font-size="12.4" fill="#c25014" text-anchor="start" font-weight="700">符号指向与语法惯例</text>
<rect x="612.0" y="271.0" width="110" height="21" rx="10.5" fill="#ffffff" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="667.0" y="285.3" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="600">编码与约定</text>
<text x="331" y="308" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">肖像相似、光影因果痕迹、词汇语法、透视与和声法则</text>
<text x="331" y="326" font-size="9.8" fill="#64748b" text-anchor="start">皮尔士符号层：差异不再只指自身，开始跨向外部对象与概念</text>
<line x1="514.0" y1="338.0" x2="514.0" y2="352.0" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<rect x="292" y="356" width="444" height="76" rx="9" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<circle cx="313" cy="378" r="10.5" fill="#ffffff" stroke="#18794e" stroke-width="1.2"/>
<text x="313" y="382" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">4</text>
<text x="331" y="382" font-size="12.4" fill="#18794e" text-anchor="start" font-weight="700">观者重构与审美顿悟</text>
<rect x="612.0" y="367.0" width="110" height="21" rx="10.5" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="667.0" y="381.3" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="600">意义生成层</text>
<text x="331" y="404" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">调动个人记忆、身体经验与文化语境，补全画外之音</text>
<text x="331" y="422" font-size="9.8" fill="#64748b" text-anchor="start">艺术发生层：有限符号在解释者心中重新展开为一整个鲜活世界</text>
<rect x="24" y="444" width="712" height="50" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="464" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">核心结论：文字是高度离散化的图像，图像是保留空间并置的广义文字——整个感知世界都在收发编码。</text>
<text x="40" y="483" font-size="10.0" fill="#64748b" text-anchor="start">香农统计熵只度量第 ① 层符号的不确定性消除；艺术的神奇恰恰诞生在 ①→④ 跨层压缩与重构的跃迁里。</text>
</svg>
