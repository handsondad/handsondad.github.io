<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">皮尔士符号三角与像似符指示符规约符三重混合编码图解</title>
<desc id="desc">左侧展示符号载体、所指对象与解释项构成的三元闭环，右侧对比像似符、指示符、规约符的编码机制及艺术作品中的三重叠合。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#6d28d9"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="495" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图像为什么既像文字又不止于文字？皮尔士符号三角与三重混合编码</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先看左栏 ①“符号—对象—解释项”三元闭环，再看右栏 ②③④ 三种指向关系如何在艺术品中叠合</text>
<rect x="24" y="68" width="248" height="342" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="43" cy="90" r="10.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="43" y="94" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">1</text>
<text x="59" y="94" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">符号不是死电线：三元闭环</text>
<rect x="78" y="122" width="140" height="52" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="148" y="143" font-size="10.5" fill="#6d28d9" text-anchor="middle" font-weight="700">解释项 Interpretant</text>
<text x="148" y="162" font-size="9.6" fill="#0f172a" text-anchor="middle">观者脑中唤起的理解</text>
<rect x="34" y="252" width="98" height="52" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="83" y="273" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">符号载体</text>
<text x="83" y="292" font-size="9.6" fill="#0f172a" text-anchor="middle">画痕 / 字词</text>
<rect x="164" y="252" width="98" height="52" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="213" y="273" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">所指对象</text>
<text x="213" y="292" font-size="9.6" fill="#0f172a" text-anchor="middle">事物 / 经验</text>
<line x1="88.0" y1="248.0" x2="124.0" y2="179.0" stroke="#1d6fa5" stroke-width="1.8" marker-end="url(#arr-purple)"/>
<line x1="172.0" y1="178.0" x2="207.0" y2="247.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<line x1="135.0" y1="278.0" x2="161.0" y2="278.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="148" y="324" font-size="9.4" fill="#64748b" text-anchor="middle">虚线：脱离解释过程，符号无法自动指物</text>
<rect x="36" y="338" width="224" height="60" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="148" y="357" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="700">皮尔士核心洞见：意义不在颜料里，</text>
<text x="148" y="375" font-size="9.5" fill="#1e293b" text-anchor="middle">而在“符号→解释项→对象”的动态关联中；</text>
<text x="148" y="391" font-size="9.4" fill="#64748b" text-anchor="middle">解释项本身还会成为下一轮思考的新符号。</text>
<rect x="286" y="68" width="142" height="342" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<circle cx="304" cy="90" r="9.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="304" y="94" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="319" y="94" font-size="11.8" fill="#1d6fa5" text-anchor="start" font-weight="700">像似符 Icon</text>
<text x="357" y="118" font-size="10.6" fill="#0f172a" text-anchor="middle" font-weight="700">靠“结构相似”指向</text>
<rect x="300" y="130" width="114" height="92" rx="7" fill="#ffffff" stroke="#1d6fa5" stroke-width="1"/>
<circle cx="386" cy="154" r="9" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<path d="M310,198 L338,160 L358,184 L380,154 L404,198 Z" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.8" stroke-linejoin="round"/>
<line x1="318.0" y1="208.0" x2="396.0" y2="208.0" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="6 3"/>
<text x="357" y="242" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="600">写实肖像、山水轮廓</text>
<text x="357" y="259" font-size="9.6" fill="#1e293b" text-anchor="middle">几何图示、旋律起伏线</text>
<rect x="296" y="274" width="122" height="124" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="357" y="293" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">编码机制</text>
<text x="357" y="314" font-size="9.4" fill="#64748b" text-anchor="middle">保留对象的几何拓扑</text>
<text x="357" y="333" font-size="9.4" fill="#64748b" text-anchor="middle">或关系同构；跨语言</text>
<text x="357" y="352" font-size="9.4" fill="#64748b" text-anchor="middle">门槛低，一眼可认出</text>
<text x="357" y="371" font-size="9.4" fill="#64748b" text-anchor="middle">“画的是远山与流水”</text>
<rect x="440" y="68" width="142" height="342" rx="10" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<circle cx="458" cy="90" r="9.5" fill="#ffffff" stroke="#c25014" stroke-width="1.2"/>
<text x="458" y="94" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">3</text>
<text x="473" y="94" font-size="11.8" fill="#c25014" text-anchor="start" font-weight="700">指示符 Index</text>
<text x="511" y="118" font-size="10.6" fill="#0f172a" text-anchor="middle" font-weight="700">靠“因果痕迹”指向</text>
<rect x="454" y="130" width="114" height="92" rx="7" fill="#ffffff" stroke="#c25014" stroke-width="1"/>
<path d="M472,200 C490,156 522,152 550,184" fill="none" stroke="#c25014" stroke-width="5.5" stroke-linecap="round"/>
<path d="M516,164 C532,164 542,173 553,186" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="4 2"/>
<line x1="476.0" y1="208.0" x2="544.0" y2="208.0" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-orange)"/>
<text x="511" y="150" font-size="8.8" fill="#64748b" text-anchor="middle">运笔速度 → 飞白肌理</text>
<text x="511" y="242" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="600">狂草飞白、厚涂刀痕</text>
<text x="511" y="259" font-size="9.6" fill="#1e293b" text-anchor="middle">胶片光痕、古陶匠人指印</text>
<rect x="450" y="274" width="122" height="124" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="511" y="293" font-size="9.8" fill="#c25014" text-anchor="middle" font-weight="700">编码机制</text>
<text x="511" y="314" font-size="9.4" fill="#64748b" text-anchor="middle">与物理事件直接相连：</text>
<text x="511" y="333" font-size="9.4" fill="#64748b" text-anchor="middle">枯笔记录手腕疾徐，</text>
<text x="511" y="352" font-size="9.4" fill="#64748b" text-anchor="middle">银盐记录当时光子，</text>
<text x="511" y="371" font-size="9.4" fill="#64748b" text-anchor="middle">自带“在场真实感”</text>
<rect x="594" y="68" width="142" height="342" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<circle cx="612" cy="90" r="9.5" fill="#ffffff" stroke="#18794e" stroke-width="1.2"/>
<text x="612" y="94" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">4</text>
<text x="627" y="94" font-size="11.8" fill="#18794e" text-anchor="start" font-weight="700">规约符 Symbol</text>
<text x="665" y="118" font-size="10.6" fill="#0f172a" text-anchor="middle" font-weight="700">靠“社会约定”指向</text>
<rect x="608" y="130" width="114" height="92" rx="7" fill="#ffffff" stroke="#18794e" stroke-width="1"/>
<rect x="620" y="144" width="90" height="30" rx="5" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="665" y="164" font-size="10.6" fill="#18794e" text-anchor="middle" font-weight="700">「梅 / 松 / 竹」</text>
<text x="665" y="190" font-size="8.8" fill="#64748b" text-anchor="middle">约定俗成 ↓ 文化隐喻</text>
<text x="665" y="209" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="700">清高 · 坚韧 · 气节</text>
<text x="665" y="242" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="600">自然语言文字、数学记号</text>
<text x="665" y="259" font-size="9.6" fill="#1e293b" text-anchor="middle">岁寒三友、礼制与圣像色标</text>
<rect x="604" y="274" width="122" height="124" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="665" y="293" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="700">编码机制</text>
<text x="665" y="314" font-size="9.4" fill="#64748b" text-anchor="middle">外形与对象无需相似；</text>
<text x="665" y="333" font-size="9.4" fill="#64748b" text-anchor="middle">靠文化共同体习得规</text>
<text x="665" y="352" font-size="9.4" fill="#64748b" text-anchor="middle">则，可精密表达抽象</text>
<text x="665" y="371" font-size="9.4" fill="#64748b" text-anchor="middle">概念、隐喻与反讽</text>
<rect x="24" y="422" width="712" height="62" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="444" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">真实艺术品几乎都是三重叠合——以一幅水墨寒梅或纪实摄影为例：</text>
<text x="40" y="466" font-size="9.9" fill="#1e293b" text-anchor="start">枝干面容轮廓是像似符（认出物象）＋ 枯笔飞白/快门曝光是指示符（触摸身体与现场）＋ 题诗典故与构图传统是规约符（读出深意）。</text>
</svg>
