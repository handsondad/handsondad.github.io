<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" viewBox="0 0 760 466" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">皮尔士图标索引符号三种符号关系与一张照片的混合编码图解</title>
<desc id="desc">以相似、因果痕迹和社会惯例区分图标、索引、符号，并说明艺术作品中的意义来自符号与解释共同构成。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="465" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图像为什么既像文字，又不只是文字：看清皮尔士的三种符号关系</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">肖像、足迹与姓名不是一类符号；艺术作品也常同时把相似、因果痕迹和文化惯例编在一起。</text>
<rect x="24" y="78" width="222" height="282" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<rect x="44.0" y="96.0" width="182" height="28" rx="14.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="135.0" y="115.0" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">图标 / Icon</text>
<text x="135" y="158" font-size="12.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">因“相似”而指向</text>
<text x="135" y="188" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">肖像、图示、素描</text>
<circle cx="135" cy="236" r="42" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.8"/>
<line x1="112.0" y1="252.0" x2="158.0" y2="220.0" stroke="#1d6fa5" stroke-width="4"/>
<circle cx="135" cy="236" r="9" fill="#1d6fa5"/>
<text x="135" y="318" font-size="9.3" fill="#64748b" text-anchor="middle">三者在真实作品中常常混用</text>
<rect x="262" y="78" width="222" height="282" rx="10" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<rect x="282.0" y="96.0" width="182" height="28" rx="14.0" fill="#ffffff" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="373.0" y="115.0" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">索引 / Index</text>
<text x="373" y="158" font-size="12.0" fill="#c25014" text-anchor="middle" font-weight="700">因“因果痕迹”而指向</text>
<text x="373" y="188" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">烟、足迹、照片光痕</text>
<circle cx="373" cy="236" r="42" fill="#ffffff" stroke="#c25014" stroke-width="1.8"/>
<line x1="345.0" y1="260.0" x2="401.0" y2="212.0" stroke="#c25014" stroke-width="3"/>
<line x1="355.0" y1="228.0" x2="391.0" y2="228.0" stroke="#c25014" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="373" y="318" font-size="9.3" fill="#64748b" text-anchor="middle">三者在真实作品中常常混用</text>
<rect x="500" y="78" width="222" height="282" rx="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<rect x="520.0" y="96.0" width="182" height="28" rx="14.0" fill="#ffffff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="611.0" y="115.0" font-size="10.5" fill="#6d28d9" text-anchor="middle" font-weight="600">符号 / Symbol</text>
<text x="611" y="158" font-size="12.0" fill="#6d28d9" text-anchor="middle" font-weight="700">因“社会惯例”而指向</text>
<text x="611" y="188" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">文字、旗帜、数字记号</text>
<circle cx="611" cy="236" r="42" fill="#ffffff" stroke="#6d28d9" stroke-width="1.8"/>
<text x="611" y="244" font-size="14.0" fill="#6d28d9" text-anchor="middle" font-weight="700">约定</text>
<text x="611" y="318" font-size="9.3" fill="#64748b" text-anchor="middle">三者在真实作品中常常混用</text>
<rect x="24" y="382" width="714" height="70" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="406" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">一张照片 = 相似（图标） + 光线物理痕迹（索引） + 关于照片证据的阅读惯例（符号）。</text>
<text x="38" y="430" font-size="10.2" fill="#64748b" text-anchor="start">解释不是编码末端的附赠功能：符号只有在解释中才形成可理解的意义。</text>
</svg>
