<text x="274.0" y="288.2" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600" class="halo">半熟悉·半陌生（可压缩的新奇）</text>
<text x="458.6" y="334.5" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">③ 太混乱</text>
