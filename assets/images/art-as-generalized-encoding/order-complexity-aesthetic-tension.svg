<title id="title">三种网格样本对比与秩序熵审美张力倒U型曲线图解</title>
<desc id="desc">通过机械重复、秩序破格与随机白噪声三种 8×5 样本，配合温特—伯莱恩倒 U 型曲线、伯克霍夫公式与有效复杂度，解释审美张力的来源与个体文化边界。</desc>
