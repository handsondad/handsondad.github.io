<circle cx="540" cy="89" r="9.5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="540" y="93" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">4</text>
<text x="555" y="93" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">两代数学模型的启发与边界</text>
<rect x="534" y="108" width="190" height="102" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="546" y="127" font-size="10.0" fill="#6d28d9" text-anchor="start" font-weight="700">伯克霍夫审美度量（1933）</text>
<text x="629" y="153" font-size="14.5" fill="#6d28d9" text-anchor="middle" font-weight="700">M = O / C</text>
<text x="546" y="174" font-size="9.4" fill="#0f172a" text-anchor="start">O：对称、重复、比例等秩序</text>
<text x="546" y="193" font-size="9.4" fill="#64748b" text-anchor="start">C：感知识别结构所耗的努力</text>
<rect x="534" y="220" width="190" height="102" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="546" y="239" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="700">盖尔曼有效复杂度（1996）</text>
<text x="546" y="259" font-size="9.4" fill="#0f172a" text-anchor="start">只度量“可提取规律”的丰富度：</text>
<text x="546" y="278" font-size="9.4" fill="#64748b" text-anchor="start">雪花噪点虽总熵最大，但规律为</text>
<text x="546" y="297" font-size="9.4" fill="#64748b" text-anchor="start">零，故有效复杂度与美感俱归零</text>
<rect x="534" y="332" width="190" height="94" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="546" y="351" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="700">为什么公式不能当审美裁判？</text>
<text x="546" y="371" font-size="9.3" fill="#0f172a" text-anchor="start">观者经验会移动横轴位置：初听</text>
<text x="546" y="389" font-size="9.3" fill="#0f172a" text-anchor="start">复调觉乱（偏 ③），听懂对位法</text>
<text x="546" y="407" font-size="9.3" fill="#0f172a" text-anchor="start">后便落回 ② 号高张力峰值区</text>
<rect x="24" y="450" width="712" height="50" rx="8" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1"/>
<text x="40" y="470" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">关键区分：香农统计熵衡量“下一格有多难猜”，艺术张力衡量“意外之中藏着多深的秩序”。</text>
<text x="40" y="489" font-size="9.9" fill="#1e293b" text-anchor="start">好作品既不靠机械套路哄睡感知，也不靠纯随机噪声瘫痪理解，而是在熟悉与陌生交界处搭桥。</text>
</svg>
