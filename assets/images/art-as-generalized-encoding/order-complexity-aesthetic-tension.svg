<text x="274.0" y="426" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="700">无序度 / 香农统计熵 H（从完全可预测 → 彻底随机）</text>
<text x="476" y="409" font-size="9.4" fill="#64748b" text-anchor="end">高熵（纯白噪声）</text>
