<svg xmlns="http://www.w3.org/2000/svg" width="720" height="850" viewBox="0 0 720 850" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">绝对值函数的尖角与不可导</title><desc id="desc">绝对值函数在0连续，但左侧差商恒为负1、右侧恒为正1，导数不存在。平方函数在0的导数则存在且等于0。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="850" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">连续，只是没有断开；不保证能求导</text><text x="36" y="94" font-size="23" fill="#172b45" text-anchor="start">反例 y = |x|：在 x = 0 接得上，却有一个尖角</text><path d="M112.500,445.000 L607.500,445.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M360.000,445.000 L360.000,165.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><text x="592.5" y="485" font-size="22" fill="#172b45" text-anchor="end">x</text><text x="374" y="170" font-size="22" fill="#172b45" text-anchor="start">y</text><path d="M120.000,221.000 L360.000,445.000 L600.000,221.000" fill="none" stroke="#176786" stroke-width="4"/><circle cx="360.000" cy="445.000" r="7" fill="#b34039"/><text x="112" y="398" font-size="24" fill="#172b45" text-anchor="start">左边斜率 -1</text><text x="445" y="398" font-size="24" fill="#172b45" text-anchor="start">右边斜率 +1</text><rect x="24" y="521" width="672" height="186" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="46" y="563" font-size="25" fill="#172b45" text-anchor="start">h &lt; 0：|h| / h = -1</text><text x="46" y="610" font-size="25" fill="#172b45" text-anchor="start">h &gt; 0：|h| / h = +1</text><text x="46" y="661" font-size="23" fill="#b34039" text-anchor="start">两边不趋向同一个数，所以 0 处的导数不存在。</text><text x="36" y="759" font-size="22" fill="#172b45" text-anchor="start">另一个提醒：y = x² 在 0 处的导数存在，且等于 0。</text><text x="36" y="805" font-size="23" fill="#172b45" text-anchor="start">“导数必须非零”与“连续就可导”，都不是规则。</text></svg>
