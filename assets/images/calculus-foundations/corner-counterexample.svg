<svg xmlns="http://www.w3.org/2000/svg" width="540" height="637.5" viewBox="0 0 540 637.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">绝对值函数的尖角与不可导</title><desc id="desc">绝对值函数在0连续，但左侧差商恒为负1、右侧恒为正1，导数不存在。平方函数在0的导数则存在且等于0。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="636" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">连续，只是没有断开；不保证能求导</text><text x="36" y="92.45" font-size="17.5" fill="#172b45" text-anchor="start">反例 y = |x|：在 x = 0 接得上，却有一个尖角</text><path d="M112.500,445.000 L607.500,445.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M360.000,445.000 L360.000,165.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><text x="592.5" y="483.52" font-size="16.7" fill="#172b45" text-anchor="end">x</text><text x="374" y="168.52" font-size="16.7" fill="#172b45" text-anchor="start">y</text><path d="M120.000,221.000 L360.000,445.000 L600.000,221.000" fill="none" stroke="#176786" stroke-width="3.28"/><circle cx="360.000" cy="445.000" r="7" fill="#b34039"/><text x="112" y="396.39" font-size="18.2" fill="#172b45" text-anchor="start">左边斜率 -1</text><text x="445" y="396.39" font-size="18.2" fill="#172b45" text-anchor="start">右边斜率 +1</text><rect x="24" y="521" width="672" height="186" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="561.32" font-size="19.0" fill="#172b45" text-anchor="start">h &lt; 0：|h| / h = -1</text><text x="46" y="608.32" font-size="19.0" fill="#172b45" text-anchor="start">h &gt; 0：|h| / h = +1</text><text x="46" y="659.45" font-size="17.5" fill="#b34039" text-anchor="start">两边不趋向同一个数，所以 0 处的导数不存在。</text><text x="36" y="757.52" font-size="16.7" fill="#172b45" text-anchor="start">另一个提醒：y = x² 在 0 处的导数存在，且等于 0。</text><text x="36" y="803.45" font-size="17.5" fill="#172b45" text-anchor="start">“导数必须非零”与“连续就可导”，都不是规则。</text></g></svg>
