<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">有限二项式展开与平方根的二项式级数</title><desc id="desc">指数3的展开在u三次项结束。指数二分之一的展开不会结束，在绝对值u小于1时可用，取u为0.2比较一次、二次、四次近似与平方根1.2。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1050" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">二项式：从有限多项式，走到无穷级数</text><text x="36" y="94" font-size="23" fill="#172b45" text-anchor="start">同一串系数规则，不同的指数，却有不同的使用范围</text><rect x="24" y="133" width="672" height="222" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="46" y="176" font-size="27" fill="#172b45" text-anchor="start">① 指数 3：会结束</text><text x="46" y="230" font-size="27" fill="#176786" text-anchor="start">(1+u)³ = 1 + 3u + 3u² + u³</text><text x="46" y="281" font-size="23" fill="#172b45" text-anchor="start">再下一项含有 3-3 = 0，后面的系数都变成 0。</text><text x="46" y="325" font-size="23" fill="#172b45" text-anchor="start">这是有限展开，对任意实数 u 都成立。</text><rect x="24" y="390" width="672" height="250" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="46" y="433" font-size="26" fill="#172b45" text-anchor="start">② 指数 1/2：不会这样结束</text><text x="46" y="486" font-size="25" fill="#b77a09" text-anchor="start">√(1+u) = 1 + u/2 - u²/8 + u³/16</text><text x="219" y="529" font-size="25" fill="#b77a09" text-anchor="start">- 5u⁴/128 + …</text><text x="46" y="575" font-size="22" fill="#172b45" text-anchor="start">这里采用 |u| &lt; 1；不能把无穷多项当成有限公式。</text><text x="46" y="617" font-size="22" fill="#172b45" text-anchor="start">写出一串项，还要证明收敛，并且和等于原函数。</text><rect x="24" y="678" width="672" height="271" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="46" y="721" font-size="25" fill="#172b45" text-anchor="start">保留到 u¹：1.1000000</text><text x="46" y="778" font-size="25" fill="#172b45" text-anchor="start">保留到 u²：1.0950000</text><text x="46" y="835" font-size="25" fill="#172b45" text-anchor="start">保留到 u⁴：1.0954375</text><text x="46" y="904" font-size="24" fill="#176786" text-anchor="start">本例 u = 0.2；√1.2 ≈ 1.0954451</text><text x="36" y="1005" font-size="22" fill="#172b45" text-anchor="start">这些是计算出的近似，不是把省略号当作“随便省略”。</text></svg>
