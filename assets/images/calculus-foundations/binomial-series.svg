<svg xmlns="http://www.w3.org/2000/svg" width="540" height="787.5" viewBox="0 0 540 787.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">有限二项式展开与平方根的二项式级数</title><desc id="desc">指数3的展开在u三次项结束。指数二分之一的展开不会结束，在绝对值u小于1时可用，取u为0.2比较一次、二次、四次近似与平方根1.2。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="786" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">二项式：从有限多项式，走到无穷级数</text><text x="36" y="92.45" font-size="17.5" fill="#172b45" text-anchor="start">同一串系数规则，不同的指数，却有不同的使用范围</text><rect x="24" y="133" width="672" height="222" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="174.03" font-size="20.0" fill="#172b45" text-anchor="start" font-weight="600">① 指数 3：会结束</text><text x="46" y="228.03" font-size="20.0" fill="#176786" text-anchor="start" font-weight="600">(1+u)³ = 1 + 3u + 3u² + u³</text><text x="46" y="279.45" font-size="17.5" fill="#172b45" text-anchor="start">再下一项含有 3-3 = 0，后面的系数都变成 0。</text><text x="46" y="323.45" font-size="17.5" fill="#172b45" text-anchor="start">这是有限展开，对任意实数 u 都成立。</text><rect x="24" y="390" width="672" height="250" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="431.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">② 指数 1/2：不会这样结束</text><text x="46" y="484.32" font-size="19.0" fill="#b77a09" text-anchor="start">√(1+u) = 1 + u/2 - u²/8 + u³/16</text><text x="219" y="527.32" font-size="19.0" fill="#b77a09" text-anchor="start">- 5u⁴/128 + …</text><text x="46" y="573.52" font-size="16.7" fill="#172b45" text-anchor="start">这里采用 |u| &lt; 1；不能把无穷多项当成有限公式。</text><text x="46" y="615.52" font-size="16.7" fill="#172b45" text-anchor="start">写出一串项，还要证明收敛，并且和等于原函数。</text><rect x="24" y="678" width="672" height="271" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="719.32" font-size="19.0" fill="#172b45" text-anchor="start">保留到 u¹：1.1000000</text><text x="46" y="776.32" font-size="19.0" fill="#172b45" text-anchor="start">保留到 u²：1.0950000</text><text x="46" y="833.32" font-size="19.0" fill="#172b45" text-anchor="start">保留到 u⁴：1.0954375</text><text x="46" y="902.39" font-size="18.2" fill="#176786" text-anchor="start">本例 u = 0.2；√1.2 ≈ 1.0954451</text><text x="36" y="1003.52" font-size="16.7" fill="#172b45" text-anchor="start">这些是计算出的近似，不是把省略号当作“随便省略”。</text></g></svg>
