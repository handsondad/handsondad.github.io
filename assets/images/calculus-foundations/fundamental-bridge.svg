9" stroke-width="2.4" stroke-dasharray="7 6"/><text x="386.0" y="532.39" font-size="18.2" fill="#176786" text-anchor="middle">x</text><text x="480.0" y="532.39" font-size="18.2" fill="#b77a09" text-anchor="middle">x+h</text><text x="137" y="386.39" font-size="18.2" fill="#176786" text-anchor="start">原有面积</text><text x="409" y="185.39" font-size="18.2" fill="#b77a09" text-anchor="start">新添的窄条</text><path d="M480.000,208.000 L437.000,447.000" fill="none" stroke="#b77a09" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="24" y="577" width="672" height="231" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="618.32" font-size="19.0" fill="#172b45" text-anchor="start">① 只多走 h，面积只多出这条窄条 ΔA</text><text x="46" y="668.45" font-size="17.5" fill="#172b45" text-anchor="start">② ΔA / h 是窄条的平均高度，不是总面积</text><text x="46" y="717.39" font-size="18.2" fill="#172b45" text-anchor="start">③ h → 0 且 f 连续：平均高度 → f(x)</text><text x="46" y="767.45" font-size="17.5" fill="#176786" text-anchor="start">所以 A′(x) = f(x)：这是连接微分与积分的桥。</text><text x="36" y="860.45" font-size="17.5" fill="#172b45" text-anchor="start">图中 x = 0.6；h = 0.2，故窄条还明显有弯曲。</text><text x="36" y="907.52" font-size="16.7" fill="#172b45" text-anchor="start">平均高度：0.49333 → 0.39083 → 0.36603 → 0.36</text><text x="36" y="955.52" font-size="16.7" fill="#172b45" text-anchor="start">前三项对应 h = 0.2、0.05、0.01；0.36 是极限。</text></g></svg>
