<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">莲藕切开变黑的细胞区室化崩塌与多酚氧化酶催化动画</title>
<desc id="desc">对比完整莲藕细胞中液泡多酚与质体双铜多酚氧化酶的隔离状态，以及切开后氧气涌入触发邻苯醌生成与自发聚合成类黑色素的三步过程。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes bladeDrop {
    0% { transform: translateY(-6px); opacity: 0.35; }
    22% { transform: translateY(4px); opacity: 1; }
    100% { transform: translateY(4px); opacity: 1; }
  }
  @keyframes o2Enter {
    0%, 15% { transform: translate(-18px, -6px); opacity: 0; }
    42%, 100% { transform: translate(0px, 0px); opacity: 1; }
  }
  @keyframes sliceDarken {
    0%, 30% { opacity: 0; }
    65% { opacity: 0.55; }
    100% { opacity: 1; }
  }
  @keyframes stepGlow {
    0%, 45% { opacity: 0.35; }
    78%, 100% { opacity: 1; }
  }
  .anim-blade { animation: bladeDrop 6.2s ease-out 1 forwards; }
  .anim-o2 { animation: o2Enter 6.2s ease-out 1 forwards; }
  .anim-dark-slice { animation: sliceDarken 6.2s ease-in-out 1 forwards; }
  .anim-final { animation: stepGlow 6.2s ease-out 1 forwards; }
  @media (prefers-reduced-motion: reduce) {
    .anim-blade, .anim-o2, .anim-dark-slice, .anim-final {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">凶手一（酶促褐变）：完整莲藕雪白脆嫩，凭什么一刀切开就发黑？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">核心机制：细胞区室化隔离被刀刃打破，液泡多酚、质体双铜酶（PPO）与空气氧气三方会师</text>
<rect x="24" y="66" width="338" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="78.0" width="254" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="165.0" y="93.0" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="600">状态 A：淤泥里的完整细胞（分区上锁）</text>
<rect x="42" y="110" width="212" height="142" rx="18" fill="#f8fafc" stroke="#18794e" stroke-width="2"/>
<rect x="48" y="116" width="200" height="130" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="56" y="132" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="600">细胞壁 + 完整细胞膜（阻挡外界 O2）</text>
<rect x="58" y="142" width="108" height="92" rx="12" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="112" y="160" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">液泡保险箱</text>
<text x="112" y="177" font-size="10.5" fill="#1e293b" text-anchor="middle">(+)-儿茶素</text>
<text x="112" y="193" font-size="10.5" fill="#1e293b" text-anchor="middle">(-)-EGC / 绿原酸</text>
<text x="112" y="211" font-size="10" fill="#64748b" text-anchor="middle">（无色邻二酚底物）</text>
<text x="112" y="227" font-size="10" fill="#1d6fa5" text-anchor="middle" font-weight="600">液泡膜完好上锁</text>
<rect x="174" y="142" width="66" height="92" rx="12" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<text x="207" y="160" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">质体车间</text>
<text x="207" y="179" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">PPO 酶</text>
<circle cx="197" cy="198" r="7" fill="#fed7aa" stroke="#c25014" stroke-width="1.2"/>
<circle cx="217" cy="198" r="7" fill="#fed7aa" stroke="#c25014" stroke-width="1.2"/>
<text x="197" y="201.5" font-size="8.5" fill="#c25014" text-anchor="middle" font-weight="700">Cu</text>
<text x="217" y="201.5" font-size="8.5" fill="#c25014" text-anchor="middle" font-weight="700">Cu</text>
<text x="207" y="224" font-size="10" fill="#64748b" text-anchor="middle">双铜中心</text>
