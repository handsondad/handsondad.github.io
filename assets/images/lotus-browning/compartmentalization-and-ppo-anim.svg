<ellipse cx="285.3" cy="180.7" rx="6.5" ry="4.6" transform="rotate(257.1 285.3 180.7)" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<ellipse cx="289.4" cy="162.7" rx="6.5" ry="4.6" transform="rotate(308.6 289.4 162.7)" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
</g>
<text x="306" y="232" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">雪白脆嫩</text>
<text x="306" y="248" font-size="10.5" fill="#64748b" text-anchor="middle">0 褐变色素</text>
<text x="42" y="282" font-size="11" fill="#18794e" text-anchor="start" font-weight="600">结论：底物与酶隔膜相望 + 淤泥缺氧 = 几个月都不变黑</text>
<rect x="378" y="66" width="358" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="392.0" y="78.0" width="252" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="518.0" y="93.0" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="600">状态 B：菜刀切开瞬间（破壁 + 见氧）</text>
<rect x="394" y="114" width="218" height="136" rx="16" fill="#fffaf5" stroke="#c25014" stroke-width="1.6" stroke-dasharray="6 4"/>
<polygon class="anim-blade" points="488,103 510,103 502,136 496,136" fill="#64748b" stroke="#334155" stroke-width="1"/><text x="518" y="139" font-size="10.5" fill="#b91c1c" font-weight="700">① 刀刃破膜</text>
<g class="anim-o2"><rect x="404" y="124" width="66" height="22" rx="11" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/><text x="437" y="139" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">空气 O2 涌入</text></g>
<rect x="404" y="154" width="198" height="40" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="503" y="171" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">② 双铜 PPO 催化夺氢（酶促步）</text>
<text x="503" y="187" font-size="10.5" fill="#1e293b" text-anchor="middle">无色邻二酚 + O2 → 淡黄邻苯醌 + H2O</text>
<g class="anim-final">
<rect x="404" y="202" width="198" height="40" rx="8" fill="#f8f1ea" stroke="#6b4423" stroke-width="1.3"/>
<text x="503" y="219" font-size="11" fill="#6b4423" text-anchor="middle" font-weight="700">③ 邻苯醌自发聚合（无需酶！）</text>
<text x="503" y="235" font-size="10.5" fill="#1e293b" text-anchor="middle">交联氨基酸 → 茶黄素类 + 类黑色素</text>
</g>
<g>
