<text x="674" y="232" font-size="11.5" fill="#6b4423" text-anchor="middle" font-weight="700">灰褐—黑褐色</text>
<text x="674" y="248" font-size="10.5" fill="#64748b" text-anchor="middle">伤口保护铠甲</text>
<text x="394" y="282" font-size="11" fill="#6b4423" text-anchor="start" font-weight="600">植物本意：用不溶性醌聚合物封住伤口、抵御病菌入侵</text>
<rect x="24" y="312" width="712" height="192" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="324.0" width="326" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="201.0" y="339.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">分步化学拆解与实验实测参数（Nelumbo nucifera）</text>
<rect x="38" y="356" width="412" height="134" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<circle cx="58" cy="376" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="58" y="380" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">1</text>
<text x="76" y="380" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">酶促氧化步（必须有活性 PPO + Cu2+ + O2）：</text>
<text x="56" y="402" font-size="11" fill="#c25014" text-anchor="start" font-weight="600">2 邻二酚（如儿茶素） + O2  ──PPO──▶  2 邻苯醌（高活性亲电体） + 2 H2O</text>
<line x1="52" y1="416" x2="436" y2="416" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="58" cy="436" r="10.5" fill="#f8f1ea" stroke="#6b4423" stroke-width="1.2"/>
<text x="58" y="440" font-size="11.5" fill="#6b4423" text-anchor="middle" font-weight="700">2</text>
<text x="76" y="440" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">非酶聚合步（一旦生成邻苯醌，关掉酶也会继续变黑）：</text>
<text x="56" y="462" font-size="11" fill="#6b4423" text-anchor="start" font-weight="600">邻苯醌 + 多酚 / 蛋白质氨基  ──自发聚合──▶  茶黄素类 + 类黑色素（褐黑）</text>
<text x="56" y="481" font-size="10" fill="#64748b" text-anchor="start">注：催化还原产物是水（H2O）而非双氧水；双铜间距在氧化/还原态间由 3.3 Å 呼吸至 4.4 Å。</text>
<rect x="464" y="356" width="258" height="134" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
<text x="478" y="377" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">实验室实测莲藕褐变档案</text>
<text x="478" y="399" font-size="11" fill="#1e293b" text-anchor="start" font-weight="600">• 最适巅峰：35 °C、pH 6.5</text>
<text x="478" y="419" font-size="11" fill="#1e293b" text-anchor="start">• 速度冠军：(+)-儿茶素（Vmax 最高）</text>
<text x="478" y="439" font-size="11" fill="#1e293b" text-anchor="start">• 亲和冠军：(-)-EGC（Km 最低）</text>
<text x="478" y="459" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">• 食用安全：褐变主产物为茶黄素类</text>
<text x="488" y="477" font-size="10.5" fill="#18794e" text-anchor="start">（与红茶同源！不发黏发臭即可安心吃）</text>
</svg>
