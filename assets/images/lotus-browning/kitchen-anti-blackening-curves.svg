<text x="494.0" y="239.7" font-size="10" fill="#18794e" text-anchor="start" class="halo">pH≤3.5 活性&lt;8%</text>
<circle cx="602.0" cy="110.0" r="4.5" fill="#b91c1c"/>
<text x="602.0" y="132.0" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700" class="halo">鲜藕汁天然 pH≈6.5</text>
<text x="602.0" y="146.0" font-size="10" fill="#b91c1c" text-anchor="middle" class="halo">正撞最适枪口！</text>
<text x="564" y="290" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">溶液酸碱度 pH</text>
<rect x="24" y="312" width="712" height="192" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="324.0" width="282" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="179.0" y="339.0" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="600">厨房实战防黑四板斧（按菜式精准选招）</text>
<rect x="38" y="356" width="164" height="134" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-opacity="0.4"/>
<text x="48" y="376" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">① 切完立刻泡凉水</text>
<text x="48" y="395" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">卡死齿轮：隔绝氧气 O2</text>
<line x1="48" y1="404" x2="192" y2="404" stroke="#1d6fa5" stroke-opacity="0.25"/>
<text x="48" y="424" font-size="10" fill="#1e293b" text-anchor="start">常温水溶氧仅 ~8.3 mg/L，</text>
<text x="48" y="443" font-size="10" fill="#1e293b" text-anchor="start">且 O2 在水中扩散速度比</text>
<text x="48" y="462" font-size="10" fill="#1e293b" text-anchor="start">空气慢约 10,000 倍！</text>
<rect x="210" y="356" width="164" height="134" rx="8" fill="#fef1e8" stroke="#c25014" stroke-opacity="0.4"/>
<text x="220" y="376" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">② 沸水焯烫 1–2 分钟</text>
<text x="220" y="395" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">卡死齿轮：高温废掉 PPO</text>
<line x1="220" y1="404" x2="364" y2="404" stroke="#c25014" stroke-opacity="0.25"/>
<text x="220" y="424" font-size="10" fill="#1e293b" text-anchor="start">95–100 °C 令双铜酶蛋白</text>
<text x="220" y="443" font-size="10" fill="#1e293b" text-anchor="start">不可逆变性坍塌（与绿茶</text>
<text x="220" y="462" font-size="10" fill="#1e293b" text-anchor="start">“杀青”保翠绿完全同源）。</text>
<rect x="382" y="356" width="164" height="134" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-opacity="0.4"/>
<text x="392" y="376" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">③ 白醋 / 柠檬汁一箭三雕</text>
<text x="392" y="395" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">降 pH + 螯合金属 + 还原醌</text>
<line x1="392" y1="404" x2="536" y2="404" stroke="#18794e" stroke-opacity="0.25"/>
<text x="392" y="424" font-size="10" fill="#1e293b" text-anchor="start">酸度压低酶活；柠檬酸抢</text>
<text x="392" y="443" font-size="10" fill="#1e293b" text-anchor="start">走 Cu2+/Fe3+；维 C 把邻</text>
<text x="392" y="462" font-size="10" fill="#1e293b" text-anchor="start">苯醌重新还原回无色酚！</text>
<rect x="554" y="356" width="164" height="134" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-opacity="0.4"/>
<text x="564" y="376" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">④ 避开铁锅与碳钢刀</text>
<text x="564" y="395" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">卡死齿轮：断绝游离铁源</text>
<line x1="564" y1="404" x2="708" y2="404" stroke="#6d28d9" stroke-opacity="0.25"/>
<text x="564" y="424" font-size="10" fill="#1e293b" text-anchor="start">改用不锈钢刀切片，搭配</text>
<text x="564" y="443" font-size="10" fill="#1e293b" text-anchor="start">不锈钢锅、陶瓷锅或砂锅，</text>
<text x="564" y="462" font-size="10" fill="#1e293b" text-anchor="start">彻底杜绝铁酚紫黑墨水。</text>
