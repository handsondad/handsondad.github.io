<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">厨房防黑四板斧：每一招民间窍门，都精准卡死一个化学齿轮</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">基于莲藕多酚氧化酶（PPO）温度—活性与 pH—活性实测规律（最适 35 °C、pH 6.5）的定量拆解</text>
