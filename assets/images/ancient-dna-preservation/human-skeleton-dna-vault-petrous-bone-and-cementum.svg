<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">人类遗骸不同骨骼与牙齿部位的内源古 DNA 保存率对比</title>
<desc id="desc">左图解析颞骨岩部内耳骨迷路C区因孕期骨化后终生零重塑而形成封闭微生态位，并对比听小骨与牙根牙骨质；右图量化对比内耳C区（均值40%、峰值69.6%）、牙骨质（16.4%）、普通颅骨（2.2%）与火化耳骨（0%）。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f172a"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#dc2626"/>
  </marker>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="467" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="20" y="30" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700">人类遗骸哪块骨头最锁 DNA？颅底“耳骨保险箱”、听小骨与牙根牙骨质</text>
<text x="20" y="50" font-size="12" fill="#64748b" text-anchor="start">2014–2020 年古人类学采样本革命：找对几百毫克微生态位，内源人 DNA 占比暴涨数十至 410 倍</text>
<rect x="18" y="68" width="350" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="80.0" width="262" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="163.0" y="95.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">解剖密码：为什么内耳骨是天然防空洞？</text>
<rect x="30" y="114" width="326" height="178" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="134" font-size="11.3" fill="#0f172a" text-anchor="start" font-weight="700">颞骨岩部（Petrous Bone）截面三级分区（Pinhasi 2015）</text>
<rect x="44" y="146" width="300" height="104" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="56" y="165" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="700">A 区：外层多孔松质骨（土壤细菌顺孔洞灌入）</text>
<rect x="64" y="174" width="266" height="68" rx="12" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="76" y="192" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">B 区：致密白色皮质骨护甲</text>
<rect x="92" y="200" width="150" height="34" rx="10" fill="#18794e" stroke="#065f46" stroke-width="1.8"/>
<text x="167" y="221" font-size="10.8" fill="#ffffff" text-anchor="middle" font-weight="700">C 区：内耳骨迷路（耳蜗壳）</text>
<rect x="250" y="200" width="72" height="34" rx="8" fill="#0f766e" stroke="#115e59" stroke-width="1.5"/>
<text x="286" y="221" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700">3 块听小骨</text>
<text x="42" y="270" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">特权：孕 24 周骨化定型 → 终生零骨重塑 → 封闭陷窝护骨细胞</text>
<text x="42" y="286" font-size="10.2" fill="#0f766e" text-anchor="start">微创（Sirak 2020）：取游离听小骨，免钻颅底获同级高纯 DNA</text>
<rect x="30" y="304" width="326" height="138" rx="8" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<text x="42" y="325" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">第二王牌：牙齿的三层分工（Damgaard 2015）</text>
<text x="42" y="346" font-size="10.5" fill="#1e293b" text-anchor="start">• 牙冠釉质：纯无机矿物无细胞 → 测 190 万年古蛋白；</text>
<text x="42" y="366" font-size="10.5" fill="#1e293b" text-anchor="start">• 内层牙本质：生前核 DNA 随年龄骤减，死后易进菌；</text>
<text x="42" y="386" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">• 外层牙骨质：终身留有核细胞，内源 DNA 高达 14 倍！</text>
<text x="42" y="406" font-size="10.5" fill="#6d28d9" text-anchor="start">• 钙化牙结石：如水泥封存口腔菌群、病原体与饮食。</text>
<text x="42" y="428" font-size="10.2" fill="#64748b" text-anchor="start">（仅刮牙根薄皮即可完好保留牙冠形态供博物馆展陈）</text>
<rect x="382" y="68" width="360" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="396.0" y="80.0" width="304" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="548.0" y="95.0" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">实测大比拼：测序读段里有多少真属于墓主人？</text>
<text x="396" y="116" font-size="11.2" fill="#1e293b" text-anchor="start">其余百分比几乎全是死后钻进骨头的土壤细菌与真菌 DNA：</text>
<text x="400" y="134" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">岩部内耳 C 区（温带峰值）</text>
<rect x="400" y="140" width="322" height="15" rx="4" fill="#e2e8f0"/>
<rect x="400" y="140" width="224.1" height="15" rx="4" fill="#18794e"/>
<text x="400" y="168" font-size="10.4" fill="#64748b" text-anchor="start">69.6% 内源人 DNA（比跖骨高 410 倍！）</text>
<text x="400" y="185" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">岩部内耳 C 区（多遗址均值）</text>
<rect x="400" y="191" width="322" height="15" rx="4" fill="#e2e8f0"/>
<rect x="400" y="191" width="128.8" height="15" rx="4" fill="#0f766e"/>
<text x="400" y="219" font-size="10.4" fill="#64748b" text-anchor="start">40.0% 均值（比同骨松质 A 区高最高 177 倍）</text>
<text x="400" y="236" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">中耳听小骨（锤/砧/镫骨）</text>
<rect x="400" y="242" width="322" height="15" rx="4" fill="#e2e8f0"/>
<rect x="400" y="242" width="122.4" height="15" rx="4" fill="#1d6fa5"/>
<text x="400" y="270" font-size="10.4" fill="#64748b" text-anchor="start">与耳蜗壳相当（仅几毫克微粒，保住完整头骨）</text>
<text x="400" y="287" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">牙根外层牙骨质（均值）</text>
<rect x="400" y="293" width="322" height="15" rx="4" fill="#e2e8f0"/>
<rect x="400" y="293" width="52.8" height="15" rx="4" fill="#c25014"/>
<text x="400" y="321" font-size="10.4" fill="#64748b" text-anchor="start">16.4% 均值（比内层牙本质高最高 14 倍）</text>
<text x="400" y="338" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">普通颅顶骨 / 肋骨 / 肢骨</text>
<rect x="400" y="344" width="322" height="15" rx="4" fill="#e2e8f0"/>
<rect x="400" y="344" width="7.1" height="15" rx="4" fill="#6d28d9"/>
<text x="400" y="372" font-size="10.4" fill="#64748b" text-anchor="start">仅 0.17%–2.2%（&gt;97% 经费都在给细菌测序）</text>
<text x="400" y="389" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">火化遗骸颞骨岩部</text>
<rect x="400" y="395" width="322" height="15" rx="4" fill="#e2e8f0"/>
<line x1="402.0" y1="395.0" x2="402.0" y2="410.0" stroke="#dc2626" stroke-width="3.0" stroke-linecap="round"/>
<text x="400" y="423" font-size="10.4" fill="#dc2626" text-anchor="start">0.0%！高温烈火烧断全部化学键，耳骨也无力回天</text>
<text x="396" y="444" font-size="10.3" fill="#64748b" text-anchor="start">数据来源：Pinhasi 2015 · Hansen 2017 · Sirak 2020</text>
</svg>
