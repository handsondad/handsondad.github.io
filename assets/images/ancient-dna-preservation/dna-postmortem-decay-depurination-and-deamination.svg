<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">死后 DNA 水解脱嘌呤断链与末端胞嘧啶脱氨基验真机制</title>
<desc id="desc">左图展示水分子攻击嘌呤糖苷键引发β-消除断链为35至70bp超短片段；右图展示单链悬垂端C到T错配率在首碱基高达35%至40%并指数衰减的古DNA防伪特征。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f172a"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#dc2626"/>
  </marker>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes dnaSnipPulse {
        0% { opacity: 0.25; transform: translateY(-4px); }
        45% { opacity: 1.0; transform: translateY(2px); }
        100% { opacity: 1.0; transform: translateY(0px); }
      }
      .anim-dna-snip {
        animation: dnaSnipPulse 2.6s ease-out 1 forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        .anim-dna-snip {
          animation: none !important;
          opacity: 1.0 !important;
          transform: none !important;
        }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="455" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="20" y="30" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700">死后 DNA 的双重劫难：脱嘌呤断链剪成超短碎片，末端脱氨基刻下古 DNA 防伪伤疤</text>
<text x="20" y="50" font-size="12" fill="#64748b" text-anchor="start">修复酶停摆后，水分子主宰化学崩解；但末端 C→T 错配率也成了区分真古 DNA 与现代污染的铁证</text>
<rect x="18" y="66" width="354" height="376" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="78.0" width="210" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="137.0" y="93.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="600">劫难 ① 水解脱嘌呤与骨架断裂</text>
<text x="32" y="118" font-size="11.5" fill="#1e293b" text-anchor="start">活体每天也在掉嘌呤，全靠修复酶秒级修补；死后 ATP 归零：</text>
<rect x="30" y="132" width="330" height="84" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="151" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">第 1 步：水分子切断糖苷键（脱嘌呤，G 比 A 更易脱落）</text>
<line x1="46.0" y1="172.0" x2="340.0" y2="172.0" stroke="#1d6fa5" stroke-width="3.0" stroke-linecap="round"/>
<line x1="46.0" y1="198.0" x2="340.0" y2="198.0" stroke="#1d6fa5" stroke-width="3.0" stroke-linecap="round"/>
<line x1="62.0" y1="172.0" x2="62.0" y2="198.0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
<line x1="98.0" y1="172.0" x2="98.0" y2="198.0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
<line x1="134.0" y1="172.0" x2="134.0" y2="198.0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
<line x1="170" y1="172" x2="170" y2="183" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
<circle cx="170" cy="172" r="5.5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="184" y="165" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="700">H2O 撞掉 G</text>
<text x="170" y="212" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">无碱基空位 (AP)</text>
<line x1="206.0" y1="172.0" x2="206.0" y2="198.0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
<line x1="242.0" y1="172.0" x2="242.0" y2="198.0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
<line x1="278.0" y1="172.0" x2="278.0" y2="198.0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
<line x1="314.0" y1="172.0" x2="314.0" y2="198.0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
<line x1="195.0" y1="218.0" x2="195.0" y2="236.0" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-red)"/>
<rect x="30" y="240" width="330" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="42" y="260" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">第 2 步：无碱基位发生 β-消除，磷酸二酯骨架直接崩断</text>
<g class="anim-dna-snip">
<line x1="46.0" y1="284.0" x2="162.0" y2="284.0" stroke="#1d6fa5" stroke-width="3.2" stroke-linecap="round"/>
<line x1="46.0" y1="306.0" x2="138.0" y2="306.0" stroke="#1d6fa5" stroke-width="3.2" stroke-linecap="round"/>
<line x1="174.0" y1="272.0" x2="168.0" y2="294.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
<line x1="168.0" y1="294.0" x2="180.0" y2="296.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
<line x1="180.0" y1="296.0" x2="173.0" y2="316.0" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
<line x1="190.0" y1="284.0" x2="342.0" y2="284.0" stroke="#1d6fa5" stroke-width="3.2" stroke-linecap="round"/>
<line x1="216.0" y1="306.0" x2="342.0" y2="306.0" stroke="#1d6fa5" stroke-width="3.2" stroke-linecap="round"/>
</g>
<text x="190" y="276" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">5&#x27; 单链悬垂端</text>
<text x="268" y="322" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">普遍碎成 35–70 bp 超短片段</text>
<rect x="30" y="342" width="330" height="88" rx="8" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<text x="42" y="363" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">为什么古 DNA 测不出几万碱基长链？</text>
<text x="42" y="383" font-size="11.2" fill="#1e293b" text-anchor="start">• 活体基因组单条染色体长达数千万至上亿 bp；</text>
<text x="42" y="402" font-size="11.2" fill="#1e293b" text-anchor="start">• 埋藏数万年遗骸中，绝大多数内源分子已被剪成</text>
<text x="42" y="420" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">  30–80 bp“分子碎纸屑”，传统长片段 PCR 根本抓不到。</text>
<rect x="388" y="66" width="354" height="376" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402.0" y="78.0" width="258" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="531.0" y="93.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">劫难 ② 末端胞嘧啶脱氨基（验真金标准）</text>
<text x="402" y="118" font-size="11.5" fill="#1e293b" text-anchor="start">碎片两端的单链悬垂尾巴失去双螺旋保护，脱氨基快约 100 倍：</text>
<rect x="400" y="130" width="330" height="56" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
<text x="565" y="151" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="700">胞嘧啶 (C) + H2O  →  尿嘧啶 (U) + NH3</text>
<text x="565" y="173" font-size="11" fill="#1e293b" text-anchor="middle">测序聚合酶把 U 当作胸腺嘧啶 (T) 读取 ⇒ 产生大量 C→T 假突变</text>
<text x="565" y="206" font-size="11.2" fill="#0f172a" text-anchor="middle" font-weight="700">读段 5&#x27; 末端 C→T 错配率曲线（尼安德特人 / 百万年古 DNA 实测特征）</text>
<line x1="444.0" y1="376.0" x2="714.0" y2="376.0" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
<text x="436" y="380.0" font-size="10.5" fill="#64748b" text-anchor="end">0%</text>
<line x1="444.0" y1="342.2" x2="714.0" y2="342.2" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="436" y="346.2" font-size="10.5" fill="#64748b" text-anchor="end">10%</text>
<line x1="444.0" y1="308.4" x2="714.0" y2="308.4" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="436" y="312.4" font-size="10.5" fill="#64748b" text-anchor="end">20%</text>
<line x1="444.0" y1="274.7" x2="714.0" y2="274.7" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="436" y="278.7" font-size="10.5" fill="#64748b" text-anchor="end">30%</text>
<line x1="444.0" y1="240.9" x2="714.0" y2="240.9" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="436" y="244.9" font-size="10.5" fill="#64748b" text-anchor="end">40%</text>
<line x1="444.0" y1="224.0" x2="444.0" y2="376.0" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
<line x1="444.0" y1="376.0" x2="444.0" y2="380.0" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
<text x="444.0" y="393" font-size="10.5" fill="#64748b" text-anchor="middle">1</text>
<line x1="482.6" y1="376.0" x2="482.6" y2="380.0" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
<text x="482.6" y="393" font-size="10.5" fill="#64748b" text-anchor="middle">3</text>
<line x1="521.1" y1="376.0" x2="521.1" y2="380.0" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
<text x="521.1" y="393" font-size="10.5" fill="#64748b" text-anchor="middle">5</text>
<line x1="579.0" y1="376.0" x2="579.0" y2="380.0" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
<text x="579.0" y="393" font-size="10.5" fill="#64748b" text-anchor="middle">8</text>
<line x1="656.1" y1="376.0" x2="656.1" y2="380.0" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
<text x="656.1" y="393" font-size="10.5" fill="#64748b" text-anchor="middle">12</text>
<line x1="714.0" y1="376.0" x2="714.0" y2="380.0" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
<text x="714.0" y="393" font-size="10.5" fill="#64748b" text-anchor="middle">15</text>
<text x="579.0" y="410" font-size="11" fill="#1e293b" text-anchor="middle">距 DNA 碎片 5&#x27; 末端的碱基位置（第 1 → 15 位 bp）</text>
<path d="M 444.0,247.6 L 463.3,288.6 L 482.6,316.1 L 501.9,334.5 L 521.1,346.9 L 540.4,355.1 L 559.7,360.7 L 579.0,364.4 L 598.3,366.9 L 617.6,368.6 L 636.9,369.7 L 656.1,370.4 L 675.4,370.9 L 694.7,371.3 L 714.0,371.5" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round"/>
