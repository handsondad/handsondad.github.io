<circle cx="521.1" cy="346.9" r="3.4" fill="#dc2626"/>
<circle cx="540.4" cy="355.1" r="3.4" fill="#dc2626"/>
<path d="M 444.0,374.3 L 463.3,374.3 L 482.6,374.3 L 501.9,374.3 L 521.1,374.3 L 540.4,374.3 L 559.7,374.3 L 579.0,374.3 L 598.3,374.3 L 617.6,374.3 L 636.9,374.3 L 656.1,374.3 L 675.4,374.3 L 694.7,374.3 L 714.0,374.3" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="458" y="241.6" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">真实古 DNA：第 1 位高达 35%–40%</text>
<text x="522" y="300" font-size="10.8" fill="#dc2626" text-anchor="start">向内部双链区指数回落</text>
<text x="579.0" y="360" font-size="10.8" fill="#0f766e" text-anchor="middle" font-weight="700">现代人污染 DNA（&lt;1% 平坦直线）</text>
<text x="402" y="430" font-size="10.8" fill="#64748b" text-anchor="start">注：双链建库在 3&#x27; 端表现为对称 G→A 抬升，合称古 DNA“微笑曲线”</text>
</svg>
