<text x="490" y="325" font-size="11" fill="#0f172a" text-anchor="end" font-weight="700">-17°C 极地冻土黏土</text>
<rect x="498.0" y="314.0" width="162.0" height="15" rx="4" fill="#18794e"/>
<text x="498" y="343" font-size="10.3" fill="#1e293b" text-anchor="start">实测世界纪录：北格陵兰 200 万年环境 DNA</text>
<text x="490" y="368" font-size="11" fill="#0f172a" text-anchor="end" font-weight="700">6600万年 白垩纪恐龙</text>
