<rect x="0.5" y="0.5" width="759" height="471" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="20" y="30" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700">521 年半衰期与温度生死钟：从恐鸟骨骼实测到 683 万年彻底归零铁律</text>
<text x="20" y="50" font-size="12" fill="#64748b" text-anchor="start">基于 Allentoft 等（2012）158 块碳十四定年恐鸟胫跗骨实测与阿伦尼乌斯方程（Ea = 127 kJ/mol）</text>
<rect x="18" y="66" width="344" height="392" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="78.0" width="292" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
