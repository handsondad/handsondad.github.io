<text x="498" y="257" font-size="10.3" fill="#1e293b" text-anchor="start">88.2 万年归零（胡瑟裂谷 43 万年古人核 DNA）</text>
<text x="490" y="282" font-size="11" fill="#0f172a" text-anchor="end" font-weight="700">-5°C 永久冻土</text>
