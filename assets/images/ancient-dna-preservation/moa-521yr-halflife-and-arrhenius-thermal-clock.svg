<rect x="30" y="360" width="320" height="86" rx="8" fill="#e7f6ee" stroke="#86efac" stroke-width="1"/>
<text x="42" y="380" font-size="11.8" fill="#18794e" text-anchor="start" font-weight="700">骨骼为什么比试管水里耐放 384 倍？</text>
<text x="42" y="399" font-size="11" fill="#1e293b" text-anchor="start">• 骨磷灰石微晶溶解缓冲至 pH 7.5（单此一项慢 73 倍）；</text>
<text x="42" y="417" font-size="11" fill="#1e293b" text-anchor="start">• 矿物表面吸附排挤自由水；环状线粒体又比核 DNA</text>
<text x="42" y="435" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">  降解慢 2–2.5 倍，且单细胞拷贝数多出成百上千倍。</text>
<rect x="376" y="66" width="366" height="392" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="390.0" y="78.0" width="304" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="542.0" y="93.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">温度决定上限：降温 20°C，寿命暴涨百倍以上</text>
<line x1="680.1" y1="114.0" x2="680.1" y2="388.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4,3"/>
<text x="676.1" y="124" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">683 万年物理天花板（连 1 bp 都断光）</text>
<text x="490" y="153" font-size="11" fill="#0f172a" text-anchor="end" font-weight="700">+25°C 热带浅埋</text>
<rect x="498.0" y="142.0" width="88.2" height="15" rx="4" fill="#dc2626" opacity="0.22"/>
<rect x="498.0" y="142.0" width="26.3" height="15" rx="4" fill="#dc2626"/>
<text x="498" y="171" font-size="10.3" fill="#1e293b" text-anchor="start">2.2 万年断至 1 bp（热带古 DNA 极难保存）</text>
