<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">恐鸟骨骼古 DNA 的 521 年半衰期与阿伦尼乌斯温度生存上限</title>
<desc id="desc">左图展示13.1摄氏度下242bp线粒体DNA每521年减半的指数衰减；右图在对数时间轴上对比不同埋藏温度下30bp半衰期与683万年彻底归零线，说明白垩纪恐龙DNA不可能存活。</desc>
