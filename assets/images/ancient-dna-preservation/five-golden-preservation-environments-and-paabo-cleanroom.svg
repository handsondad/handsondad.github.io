<rect x="0.5" y="0.5" width="759" height="483" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="20" y="30" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700">四大天然时间胶囊、两大毁灭陷阱与诺奖级“古 DNA 淘金”四步流水线</text>
<text x="20" y="50" font-size="12" fill="#64748b" text-anchor="start">好环境替岁月按下慢放键，而斯万特·帕博（2022 诺奖）团队用超净建库与防伪算法把碎片拼回人类家谱</text>
<rect x="18" y="68" width="236" height="102" rx="9" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
<rect x="28.0" y="78.0" width="216" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="136.0" y="93.0" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">胶囊 ① 永久冻土与高山冰川</text>
<text x="30" y="116" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">西伯利亚冻土、阿尔卑斯冰人奥茨</text>
<text x="30" y="136" font-size="10.5" fill="#1e293b" text-anchor="start">• 常年 -5°C ~ -17°C 冻结液态水；</text>
<text x="30" y="154" font-size="10.5" fill="#1e293b" text-anchor="start">• 创下 120 万年猛犸与 200 万年纪录。</text>
<rect x="262" y="68" width="236" height="102" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
<rect x="272.0" y="78.0" width="216" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="93.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">胶囊 ② 恒温弱碱性石灰岩深洞</text>
<text x="274" y="116" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">丹尼索瓦洞、西班牙胡瑟裂谷</text>
<text x="274" y="136" font-size="10.5" fill="#1e293b" text-anchor="start">• 四季恒温 (0–10.6°C) 免受冻融折腾；</text>
<text x="274" y="154" font-size="10.5" fill="#1e293b" text-anchor="start">• 碳酸钙滴水维持 pH 7.5–8 护骨护链。</text>
<rect x="506" y="68" width="236" height="102" rx="9" fill="#ffffff" stroke="#5eead4" stroke-width="1"/>
<rect x="516.0" y="78.0" width="216" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="624.0" y="93.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">胶囊 ③ 极旱沙漠与天然风干</text>
<text x="518" y="116" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">塔里木干尸、阿塔卡马与干燥岩厦</text>
<text x="518" y="136" font-size="10.5" fill="#1e293b" text-anchor="start">• 死后极速脱水，直接抽干水解反应物；</text>
<text x="518" y="154" font-size="10.5" fill="#1e293b" text-anchor="start">• 连毛发角蛋白包裹的核 DNA 都完好。</text>
<rect x="18" y="180" width="236" height="102" rx="9" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
<rect x="28.0" y="190.0" width="216" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="136.0" y="205.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">胶囊 ④ 缺氧寒冷黏土沉积层</text>
<text x="30" y="228" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">极地河口泥沙、深水静水湖底</text>
<text x="30" y="248" font-size="10.5" fill="#1e293b" text-anchor="start">• 缺氧无生物扰动，蒙脱石纳米夹层；</text>
<text x="30" y="266" font-size="10.5" fill="#1e293b" text-anchor="start">• 无需骨头也能留住整片森林动物痕迹。</text>
<rect x="262" y="180" width="236" height="102" rx="9" fill="#fffaf5" stroke="#fdba74" stroke-width="1"/>
<rect x="272.0" y="190.0" width="216" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="205.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">陷阱 ⑤ 酸性泥炭沼泽（外美内空！）</text>
<text x="274" y="228" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">北欧泥炭沼泽古尸（如托伦德人）</text>
<text x="274" y="248" font-size="10.5" fill="#1e293b" text-anchor="start">• 泥炭藓酸像鞣革一样保住皮肤毛发；</text>
<text x="274" y="266" font-size="10.5" fill="#c25014" text-anchor="start">• 强酸却溶光骨钙并催化脱嘌呤毁 DNA！</text>
<rect x="506" y="180" width="236" height="102" rx="9" fill="#fffaf5" stroke="#fca5a5" stroke-width="1"/>
<rect x="516.0" y="190.0" width="216" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="624.0" y="205.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="600">陷阱 ⑥ 热带湿热交替与高温火葬</text>
<text x="518" y="228" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">雨林酸性红壤、干湿交替与火化墓</text>
<text x="518" y="248" font-size="10.5" fill="#1e293b" text-anchor="start">• 高温高湿令断链速率暴涨数百倍；</text>
<text x="518" y="266" font-size="10.5" fill="#dc2626" text-anchor="start">• 洞穴深埋或耳骨取样是唯一抢救希望。</text>
<rect x="18" y="298" width="724" height="172" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="32" y="322" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">2022 诺贝尔生理学或医学奖：把 &lt;1% 古老碎纸屑读成整部基因组的四道关卡</text>
<rect x="30" y="336" width="166" height="120" rx="8" fill="#ffffff" stroke="#1d6fa5" stroke-width="1"/>
<rect x="30" y="336" width="166" height="26" rx="7" fill="#eaf4fb"/>
<text x="113" y="354" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">1. 正压超净室 + 预消化</text>
<text x="40" y="384" font-size="10.5" fill="#1e293b" text-anchor="start">全身防护隔绝现代皮屑</text>
<text x="40" y="404" font-size="10.5" fill="#1e293b" text-anchor="start">漂白与 15–30 分钟 EDTA</text>
<text x="40" y="424" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">预消化洗掉表面细菌 (2.7×)</text>
<line x1="197.0" y1="396.0" x2="206.0" y2="396.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<rect x="208" y="336" width="166" height="120" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1"/>
<rect x="208" y="336" width="166" height="26" rx="7" fill="#f0fdfa"/>
<text x="291" y="354" font-size="11" fill="#0f766e" text-anchor="middle" font-weight="700">2. 硅胶柱捞超短碎片</text>
<text x="218" y="384" font-size="10.5" fill="#1e293b" text-anchor="start">高盐异丙醇绑定硅胶膜</text>
<text x="218" y="404" font-size="10.5" fill="#1e293b" text-anchor="start">把过去漏掉的 25–40 bp</text>
<text x="218" y="424" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">极短脱嘌呤碎片全数捕获</text>
<line x1="375.0" y1="396.0" x2="384.0" y2="396.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<rect x="386" y="336" width="166" height="120" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1"/>
<rect x="386" y="336" width="166" height="26" rx="7" fill="#f3e8ff"/>
<text x="469" y="354" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700">3. 单链建库 + 探针钓取</text>
<text x="396" y="384" font-size="10.5" fill="#1e293b" text-anchor="start">ssDNA 接头挽救缺口单链</text>
<text x="396" y="404" font-size="10.5" fill="#1e293b" text-anchor="start">百万条人工合成杂交探针</text>
<text x="396" y="424" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">从细菌海洋钓出人类片段</text>
<line x1="553.0" y1="396.0" x2="562.0" y2="396.0" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<rect x="564" y="336" width="166" height="120" rx="8" fill="#ffffff" stroke="#18794e" stroke-width="1"/>
<rect x="564" y="336" width="166" height="26" rx="7" fill="#e7f6ee"/>
<text x="647" y="354" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">4. 损伤验真与污染审计</text>
<text x="574" y="384" font-size="10.5" fill="#1e293b" text-anchor="start">核验末端 35% C→T 曲线</text>
<text x="574" y="404" font-size="10.5" fill="#1e293b" text-anchor="start">用线粒体与男性 X 染色体</text>
<text x="574" y="424" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">锁定现代人污染率 &lt;1%</text>
</svg>
