<rect x="550" y="329" width="114" height="14" rx="4" fill="#f1f5f9"/>
<rect x="550" y="329" width="78.7" height="14" rx="4" fill="#475569" opacity="0.88"/>
<text x="722" y="340" font-size="10.6" fill="#475569" text-anchor="end" font-weight="700">351 m/s</text>
<text x="432" y="372" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="600">文昌不仅多借自转，且离赤道面近、去静止轨省倾角燃料！</text>
</svg>
