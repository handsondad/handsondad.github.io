<text x="204" y="122" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="600" class="halo">GEO 静止圆轨：35,786 km（v = 3.07 km/s）</text>
<text x="396" y="190" font-size="10.5" fill="#1e293b" text-anchor="end" class="halo">到顶剩 1.60</text>
<text x="396" y="206" font-size="10.8" fill="#18794e" text-anchor="end" font-weight="700" class="halo">远地点点火②</text>
<text x="396" y="222" font-size="10.8" fill="#18794e" text-anchor="end" font-weight="700" class="halo">Δv₂ = +1.48</text>
<text x="396" y="238" font-size="10.5" fill="#18794e" text-anchor="end" class="halo">圆化至 3.07</text>
<text x="204" y="329" font-size="10.5" fill="#64748b" text-anchor="middle" class="halo">若不点第②把火：卫星会沿灰虚线掉回 200 km 近地点</text>
<rect x="34.0" y="354.0" width="356" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="212.0" y="369.0" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">共面变轨总增量：Δv₁ + Δv₂ = 2.46 + 1.48 = 3.93 km/s</text>
<rect x="416" y="62" width="324" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="432" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">② 升空姿态与向东借自转“顺风车”</text>
