<line x1="217.8" y1="214.9" x2="217.8" y2="294.0" stroke="#18794e" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="217.8" cy="214.9" r="4.5" fill="#18794e"/>
<text x="213.8" y="201.9" font-size="10.8" fill="#18794e" text-anchor="end" font-weight="700" class="halo">北斗 3.78 km/s</text>
<line x1="318.3" y1="229.6" x2="318.3" y2="294.0" stroke="#c25014" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="318.3" cy="229.6" r="4.5" fill="#c25014"/>
<text x="340.3" y="218.6" font-size="10.8" fill="#c25014" text-anchor="end" font-weight="700" class="halo">静止轨 3.07 km/s</text>
<circle cx="208.4" cy="212.9" r="3.2" fill="#6d28d9"/>
<text x="200.4" y="231.9" font-size="10.5" fill="#6d28d9" text-anchor="end" class="halo">GPS(20,200km): 3.87</text>
<rect x="36.0" y="322.0" width="320" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="196.0" y="337.0" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">GMm/r² = mv²/r ⇒ v_orb = √(GM/r)：轨道越高走得越慢</text>
<text x="36" y="362" font-size="10.5" fill="#64748b" text-anchor="start">周期对比：空间站 1.54h · 北斗 12.9h · 静止轨 23h56m04s</text>
<rect x="388" y="62" width="352" height="314" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">② 地面送每千克卫星入轨的能量账（MJ/kg）</text>
<rect x="404" y="96" width="11" height="11" rx="2" fill="#c25014"/>
<text x="420" y="106" font-size="10.8" fill="#1e293b" text-anchor="start">爬高势能增量 ΔU</text>
<rect x="536" y="96" width="11" height="11" rx="2" fill="#1d6fa5"/>
<text x="552" y="106" font-size="10.8" fill="#1e293b" text-anchor="start">在轨动能 K = ½v²</text>
<text x="404.0" y="134" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="600">近地空间站 LEO（400 km）</text>
<text x="720.0" y="134" font-size="11.2" fill="#1d6fa5" text-anchor="end" font-weight="700">总计 +33.1 MJ/kg</text>
<rect x="404.0" y="141" width="312.0" height="22" rx="5" fill="#f1f5f9"/>
<rect x="404.0" y="141" width="18.0" height="22" rx="4" fill="#c25014" opacity="0.88"/>
<rect x="422.0" y="141" width="143.3" height="22" rx="4" fill="#1d6fa5" opacity="0.88"/>
<text x="404.0" y="177" font-size="10.5" fill="#64748b" text-anchor="start">爬高 3.7 (11%) + 动能 29.4 (89%) → 在轨机械能 -29.4</text>
<text x="404.0" y="200" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="600">北斗中圆轨 MEO（21,528 km）</text>
<text x="720.0" y="200" font-size="11.2" fill="#18794e" text-anchor="end" font-weight="700">总计 +55.4 MJ/kg</text>
<rect x="404.0" y="207" width="312.0" height="22" rx="5" fill="#f1f5f9"/>
<rect x="404.0" y="207" width="235.0" height="22" rx="4" fill="#c25014" opacity="0.88"/>
<rect x="639.0" y="207" width="34.8" height="22" rx="4" fill="#1d6fa5" opacity="0.88"/>
<text x="404.0" y="243" font-size="10.5" fill="#64748b" text-anchor="start">爬高 48.2 (87%) + 动能 7.1 (13%) → 在轨机械能 -7.1</text>
<text x="404.0" y="266" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="600">静止卫星 GEO（35,786 km）</text>
<text x="720.0" y="266" font-size="11.2" fill="#c25014" text-anchor="end" font-weight="700">总计 +57.8 MJ/kg</text>
<rect x="404.0" y="273" width="312.0" height="22" rx="5" fill="#f1f5f9"/>
<rect x="404.0" y="273" width="258.6" height="22" rx="4" fill="#c25014" opacity="0.88"/>
<rect x="662.6" y="273" width="23.0" height="22" rx="4" fill="#1d6fa5" opacity="0.88"/>
<text x="404.0" y="309" font-size="10.5" fill="#64748b" text-anchor="start">爬高 53.0 (92%) + 动能 4.7 (8%) → 在轨机械能 -4.7</text>
<rect x="404.0" y="322.0" width="320" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="564.0" y="337.0" font-size="10.6" fill="#c25014" text-anchor="middle" font-weight="600">总机械能 E = −GMm/(2r)：越高动能越少，但爬井总账越贵！</text>
<text x="404" y="362" font-size="10.5" fill="#64748b" text-anchor="start">注：以无自转地表静止（−62.5 MJ/kg）为基准，未计大气与重力损耗。</text>
</svg>
