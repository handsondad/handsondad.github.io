<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">卫星高低轨巡航速度与发射总能量悖论对比图</title>
<desc id="desc">左图展示400km空间站(7.67 km/s)、21528km北斗(3.78 km/s)与35786km静止卫星(3.07 km/s)随高度变慢；右图分解爬高势能与在轨动能，展示总注入能量从33.1升至57.8 MJ/kg。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="395" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">高低轨悖论：为什么飞得越高的卫星走得越慢，发上去却反而越费燃料？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">关键是拆开两本账：① 在轨巡航速度 v_orb = √(GM/r) 随高度下降；② 入轨总能量增量 ΔE 随高度飙升</text>
<rect x="20" y="62" width="352" height="314" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">① 在轨运行速度 v_orb（越高引力越弱，越慢）</text>
<line x1="66.0" y1="252.1" x2="348.0" y2="252.1" stroke="#f1f5f9" stroke-width="1"/>
<text x="60.0" y="255.6" font-size="10.5" fill="#64748b" text-anchor="end">2</text>
<line x1="66.0" y1="210.2" x2="348.0" y2="210.2" stroke="#f1f5f9" stroke-width="1"/>
<text x="60.0" y="213.7" font-size="10.5" fill="#64748b" text-anchor="end">4</text>
<line x1="66.0" y1="168.4" x2="348.0" y2="168.4" stroke="#f1f5f9" stroke-width="1"/>
