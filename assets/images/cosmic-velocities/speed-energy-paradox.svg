<line x1="66.0" y1="126.5" x2="348.0" y2="126.5" stroke="#f1f5f9" stroke-width="1"/>
<text x="60.0" y="130.0" font-size="10.5" fill="#64748b" text-anchor="end">8</text>
<path d="M66.0,116.0 V294.0 H348.0" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<text x="58.0" y="110.0" font-size="10.5" fill="#64748b" text-anchor="end">km/s</text>
<text x="66.0" y="309.0" font-size="10.5" fill="#64748b" text-anchor="middle">0</text>
<text x="136.5" y="309.0" font-size="10.5" fill="#64748b" text-anchor="middle">1万</text>
