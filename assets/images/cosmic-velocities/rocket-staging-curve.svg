<text x="216.0" y="226" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700" class="halo">液氧煤油 (v_e≈3.1)</text>
<circle cx="329.6" cy="166.7" r="4.2" fill="#c25014"/>
<text x="323.6" y="182.7" font-size="10.6" fill="#c25014" text-anchor="end" font-weight="700" class="halo">m₀/m_f ≈ 20.1</text>
<rect x="36.0" y="322.0" width="328" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="200.0" y="337.0" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">横轴 m₀/m_f = 起飞总重÷燃尽干重：对数增长慢 ⇔ 燃料指数暴涨</text>
<text x="36" y="362" font-size="10.5" fill="#64748b" text-anchor="start">实战 Δv ≈ 7.8 轨道速度 + 1.5 重力与空气阻力损耗 ≈ 9.3 km/s</text>
<rect x="392" y="62" width="348" height="314" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="408" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">② 同样 100 吨起飞送 2 吨卫星：为什么要分级？</text>
<text x="408" y="101" font-size="10.5" fill="#64748b" text-anchor="start">统一条件：v_e = 3.1 km/s，壳重占各子级 10%</text>
<text x="667.8" y="116" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">入轨线 ~9.1</text>
<text x="408.0" y="138" font-size="11.3" fill="#0f172a" text-anchor="start" font-weight="600">单级硬飞（不扔空壳）</text>
<text x="722.0" y="138" font-size="11.3" fill="#475569" text-anchor="end" font-weight="700">Δv = 6.62 km/s</text>
<rect x="408.0" y="144" width="314.0" height="19" rx="5" fill="#f1f5f9"/>
<rect x="408.0" y="144" width="189.1" height="19" rx="5" fill="#475569" opacity="0.88"/>
<text x="408.0" y="177" font-size="10.5" fill="#64748b" text-anchor="start">末段死背 9.8t 大空箱 → 差一大截坠海</text>
<text x="408.0" y="202" font-size="11.3" fill="#0f172a" text-anchor="start" font-weight="600">两级接力（扔 8.2t 一级壳）</text>
<text x="722.0" y="202" font-size="11.3" fill="#1d6fa5" text-anchor="end" font-weight="700">Δv = 9.14 km/s</text>
<rect x="408.0" y="208" width="314.0" height="19" rx="5" fill="#f1f5f9"/>
<rect x="408.0" y="208" width="260.9" height="19" rx="5" fill="#1d6fa5" opacity="0.88"/>
<text x="408.0" y="241" font-size="10.5" fill="#64748b" text-anchor="start">4.15 + 4.99 km/s → 轻装二级跨过入轨线</text>
<text x="408.0" y="266" font-size="11.3" fill="#0f172a" text-anchor="start" font-weight="600">三级接力（连扔两级空壳）</text>
<text x="722.0" y="266" font-size="11.3" fill="#18794e" text-anchor="end" font-weight="700">Δv = 9.91 km/s</text>
<rect x="408.0" y="272" width="314.0" height="19" rx="5" fill="#f1f5f9"/>
<rect x="408.0" y="272" width="283.0" height="19" rx="5" fill="#18794e" opacity="0.88"/>
<text x="408.0" y="305" font-size="10.5" fill="#64748b" text-anchor="start">3.48 + 3.24 + 3.19 km/s → 轻松入轨有富余</text>
<line x1="667.8" y1="121" x2="667.8" y2="296" stroke="#c25014" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="408.0" y="322.0" width="316" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="566.0" y="337.0" font-size="10.6" fill="#18794e" text-anchor="middle" font-weight="600">分级本质：烧完一段油就扔一段空罐，不再花燃料加速废铁！</text>
<text x="408" y="362" font-size="10.5" fill="#64748b" text-anchor="start">齐奥尔科夫斯基 1903 推导方程，1929 提出“多级火箭列车”构想。</text>
</svg>
