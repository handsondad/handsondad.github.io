<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">齐奥尔科夫斯基理想火箭方程指数曲线与单级两级三级火箭速度增量对比</title>
<desc id="desc">左图绘制液氧煤油(ve=3.1)与液氧液氢(ve=4.4)的Δv对质量比曲线；右图对比同为100吨起飞、2吨载荷、10%结构系数下单级(6.62 km/s)、两级(9.10 km/s)与三级(9.91 km/s)的表现。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="395" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">齐奥尔科夫斯基公式与多级火箭：为什么火箭 90% 是燃料，还非得边飞边扔壳？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">Δv = v_e ln(m₀/m_f) 意味着质量比随目标速度呈指数爆炸；半途扔掉空油箱，才能打破单级死胡同</text>
<rect x="20" y="62" width="360" height="314" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">① 理想火箭方程曲线：Δv = v_e ln(m₀ / m_f)</text>
<line x1="66.0" y1="252.9" x2="356.0" y2="252.9" stroke="#f1f5f9" stroke-width="1"/>
<text x="60.0" y="256.4" font-size="10.5" fill="#64748b" text-anchor="end">3</text>
<line x1="66.0" y1="211.8" x2="356.0" y2="211.8" stroke="#f1f5f9" stroke-width="1"/>
<text x="60.0" y="215.3" font-size="10.5" fill="#64748b" text-anchor="end">6</text>
<line x1="66.0" y1="170.8" x2="356.0" y2="170.8" stroke="#f1f5f9" stroke-width="1"/>
<text x="60.0" y="174.3" font-size="10.5" fill="#64748b" text-anchor="end">9</text>
<line x1="66.0" y1="129.7" x2="356.0" y2="129.7" stroke="#f1f5f9" stroke-width="1"/>
<text x="60.0" y="133.2" font-size="10.5" fill="#64748b" text-anchor="end">12</text>
<path d="M66.0,116.0 V294.0 H356.0" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<text x="60.0" y="110.0" font-size="10.5" fill="#64748b" text-anchor="end">Δv(km/s)</text>
<text x="66.0" y="309.0" font-size="10.5" fill="#64748b" text-anchor="middle">1</text>
<text x="121.2" y="309.0" font-size="10.5" fill="#64748b" text-anchor="middle">5(80%)</text>
<text x="190.3" y="309.0" font-size="10.5" fill="#64748b" text-anchor="middle">10(90%)</text>
<text x="259.3" y="309.0" font-size="10.5" fill="#64748b" text-anchor="middle">15</text>
<text x="328.4" y="309.0" font-size="10.5" fill="#64748b" text-anchor="middle">20(95%燃料)</text>
<line x1="66.0" y1="166.7" x2="356.0" y2="166.7" stroke="#18794e" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="352.0" y="161.7" font-size="10.5" fill="#18794e" text-anchor="end" font-weight="700" class="halo">近地入轨实战预算 ≈ 9.3 km/s</text>
