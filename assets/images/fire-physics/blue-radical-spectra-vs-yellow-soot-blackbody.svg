<svg xmlns="http://www.w3.org/2000/svg" width="760" height="485" viewBox="0 0 760 485" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">火焰蓝光与黄光光谱机制及扩散预混火焰对比图</title>
<desc id="desc">左图对比1450K纳米碳烟连续普朗克黑体辐射曲线与CH*、C2*自由基离散化学发光谱峰；右图展示灶台风门开闭对应的扩散黄火与预混蓝火，并澄清火焰颜色与温度的对应条件。</desc>
