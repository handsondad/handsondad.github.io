<text x="173.8" y="143.9" font-size="10.2" fill="#0f766e" text-anchor="start" font-weight="700">C₂* 斯旺带 (516 nm)</text>
<text x="324.1" y="202.1" font-size="10.5" fill="#c25014" text-anchor="end" font-weight="700">1450 K 碳烟黑体辐射</text>
<text x="324.1" y="218.9" font-size="9.8" fill="#dc2626" text-anchor="end">（98% 能量在红外区！）</text>
<rect x="34" y="360" width="336" height="92" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1.0"/>
<text x="46" y="380" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">为什么隔着一米烤篝火，脸还没碰到火就觉得烫？</text>
<text x="46" y="398" font-size="10.3" fill="#1e293b" text-anchor="start">按维恩位移定律，1450 K 碳烟辐射峰值在近红外 2.00 μm！</text>
<text x="46" y="415" font-size="10.3" fill="#1e293b" text-anchor="start">热空气虽全部向上飞走，但纳米碳烟像无数微型红外浴霸灯，以</text>
<text x="46" y="432" font-size="10.3" fill="#1e293b" text-anchor="start">光速向四面八方直线发射红外线；纯氢／甲醇无碳烟火反而辐射弱。</text>
<rect x="396" y="62" width="344" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="414" cy="84" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="414" y="88" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="432" y="88" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="700">灶台风门一调，黄火秒变蓝火的秘密</text>
<rect x="412" y="108" width="150" height="214" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="487" y="128" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">① 扩散火焰（风门堵死）</text>
<path d="M 487 142 C 463 176, 465 212, 487 228 C 509 212, 511 176, 487 142 Z" fill="#facc15" stroke="#ea580c" stroke-width="1.3"/>
<rect x="475" y="228" width="24" height="34" rx="2" fill="#64748b"/>
<text x="487" y="278" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">先出气、再找氧</text>
<text x="487" y="295" font-size="9.8" fill="#1e293b" text-anchor="middle">缺氧裂解出碳烟 · 熏黑锅底</text>
<text x="487" y="311" font-size="9.8" fill="#dc2626" text-anchor="middle" font-weight="600">生成一氧化碳 · 约 1200°C</text>
<rect x="574" y="108" width="150" height="214" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
<text x="649" y="128" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">② 预混火焰（风门打开）</text>
<path d="M 649 156 C 631 186, 633 214, 649 228 C 665 214, 667 186, 649 156 Z" fill="#60a5fa" fill-opacity="0.55" stroke="#2563eb" stroke-width="1.3"/>
<path d="M 649 184 L 638 228 L 660 228 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
<rect x="637" y="228" width="24" height="34" rx="2" fill="#64748b"/>
<circle cx="649" cy="248" r="4.2" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="649" y="278" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">管内先混足氧气再烧</text>
<text x="649" y="295" font-size="9.8" fill="#1e293b" text-anchor="middle">碳烟零生成 · 只剩自由基光</text>
<text x="649" y="311" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">双锥烈焰 · 1750–1950°C</text>
<rect x="412" y="334" width="312" height="118" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.0"/>
<text x="424" y="354" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">破除误区：“蓝火一定比黄火白火温度高”？不一定！</text>
<text x="424" y="373" font-size="10.2" fill="#1e293b" text-anchor="start">• 只有同属【黑体热辐射】（如铁水、恒星）时，颜色越偏蓝白才越热；</text>
<text x="424" y="391" font-size="10.2" fill="#1e293b" text-anchor="start">• 燃气灶蓝火比蜡烛黄火热，是因为【预混供氧充分、无散热碳烟】；</text>
<text x="424" y="409" font-size="10.2" fill="#1e293b" text-anchor="start">• 反例：空间站微重力“冷焰”也泛微弱蓝光，温度却仅 300–500°C，</text>
<text x="424" y="427" font-size="10.2" fill="#1e293b" text-anchor="start">  而氧-乙炔焰掺碳白炽区（&gt;2500°C）比普通酒精灯蓝焰烫得多！</text>
</svg>
