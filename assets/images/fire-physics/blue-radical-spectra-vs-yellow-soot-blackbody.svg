<rect x="0.5" y="0.5" width="759" height="484" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么燃气灶是蓝火、蜡烛篝火是黄火？两种截然不同的发光物理</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">黄光是纳米固体碳粒的“连续黑体热辐射”，蓝光是 CH* 与 C₂* 自由基的“量子跃迁化学发光”</text>
