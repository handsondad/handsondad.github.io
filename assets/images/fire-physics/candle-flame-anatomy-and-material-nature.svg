    <stop offset="0%" stop-color="#fffbeb"/>
    <stop offset="55%" stop-color="#fde047"/>
    <stop offset="100%" stop-color="#f97316"/>
  </radialGradient>
  <linearGradient id="grad-outer" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
    <stop offset="38%" stop-color="#fb923c" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#ef4444" stop-opacity="0.18"/>
  </linearGradient>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="504" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">火到底是什么？蜡烛火焰四层解剖与“火是不是等离子体”定量判决</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">火不是单一物质形态，而是流动的高温气相化学反应区（热气体 + 白炽纳米碳烟 + 十亿分之二化学电离离子）</text>
<rect x="20" y="62" width="364" height="424" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="700">法拉第蜡烛解剖：固态蜡怎样一步步变成火？</text>
<path d="M 122.0 116 C 66.0 196, 68.0 286, 122.0 314 C 176.0 286, 178.0 196, 122.0 116 Z" fill="url(#grad-outer)" stroke="#f97316" stroke-width="1.3" stroke-dasharray="4 3"/>
<path d="M 88.0 276 C 84.0 298, 104.0 315, 122.0 316 C 140.0 315, 160.0 298, 156.0 276 C 144.0 294, 100.0 294, 88.0 276 Z" fill="#2563eb" fill-opacity="0.72"/>
