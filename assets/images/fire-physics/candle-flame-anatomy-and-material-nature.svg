<path d="M 122.0 234 C 105.0 264, 106.0 294, 122.0 306 C 138.0 294, 139.0 264, 122.0 234 Z" fill="#1e293b" fill-opacity="0.82"/>
<rect x="88.0" y="330" width="68" height="92" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<path d="M 88.0 330 Q 122.0 342 156.0 330 L 152.0 340 Q 122.0 348 92.0 340 Z" fill="#fde68a" stroke="#d97706" stroke-width="1.1"/>
<path d="M 122.0 338 L 122.0 286 Q 125.0 276 129.0 272" fill="none" stroke="#334155" stroke-width="3.2" stroke-linecap="round"/>
<line x1="122.0" y1="326.0" x2="122.0" y2="294.0" stroke="#d97706" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 2" marker-end="url(#arr-orange)"/>
<text x="122.0" y="366" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">固态石蜡</text>
<text x="122.0" y="384" font-size="10" fill="#64748b" text-anchor="middle">（本身不直接烧）</text>
<line x1="148.0" y1="152.0" x2="186.0" y2="121.0" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="148.0" cy="152.0" r="2.8" fill="#dc2626"/>
<text x="190" y="124" font-size="10.8" fill="#dc2626" text-anchor="start" font-weight="700">④ 外焰薄壳（~1400°C 最烫）</text>
<text x="190" y="139" font-size="10.0" fill="#1e293b" text-anchor="start">氧气充足，完全生成 CO₂ + H₂O</text>
<line x1="144.0" y1="208.0" x2="186.0" y2="175.0" stroke="#c25014" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="144.0" cy="208.0" r="2.8" fill="#c25014"/>
<text x="190" y="178" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">③ 亮黄内焰（1000–1250°C）</text>
<text x="190" y="193" font-size="10.0" fill="#1e293b" text-anchor="start">纳米碳烟白炽热辐射（含瞬生金刚石）</text>
<line x1="130.0" y1="266.0" x2="186.0" y2="229.0" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="130.0" cy="266.0" r="2.8" fill="#0f172a"/>
<text x="190" y="232" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">① 暗区焰心（300–600°C）</text>
<text x="190" y="247" font-size="10.0" fill="#1e293b" text-anchor="start">刚汽化的石蜡烷烃蒸气，缺氧未燃</text>
<line x1="148.0" y1="298.0" x2="186.0" y2="283.0" stroke="#1d6fa5" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="148.0" cy="298.0" r="2.8" fill="#1d6fa5"/>
<text x="190" y="286" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="700">② 蓝光底座（1200–1400°C）</text>
<text x="190" y="301" font-size="10.0" fill="#1e293b" text-anchor="start">CH* / C₂* 自由基跃迁发出化学蓝光</text>
<line x1="150.0" y1="336.0" x2="186.0" y2="337.0" stroke="#d97706" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="150.0" cy="336.0" r="2.8" fill="#d97706"/>
<text x="190" y="340" font-size="10.8" fill="#d97706" text-anchor="start" font-weight="700">液态蜡碗 + 烛芯毛细抽吸</text>
<text x="190" y="355" font-size="10.0" fill="#1e293b" text-anchor="start">上升冷气流冷却外沿，毛细力往上送油</text>
<rect x="34" y="404" width="336" height="68" rx="8" fill="#fef1e8" stroke="#fdba74" stroke-width="1.0"/>
<text x="46" y="423" font-size="11" fill="#c25014" text-anchor="start" font-weight="700">圣安德鲁斯大学实测彩蛋（Su &amp; Zhou, 2011）：</text>
<text x="46" y="441" font-size="10.3" fill="#1e293b" text-anchor="start">亮黄内焰每秒诞生约 150 万颗纳米金刚石微粒（连同石墨、富勒</text>
<text x="46" y="458" font-size="10.3" fill="#1e293b" text-anchor="start">烯与无定形碳），但不到一眨眼就在外焰被烧成二氧化碳！</text>
<rect x="396" y="62" width="344" height="424" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="414" cy="84" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="414" y="88" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="432" y="88" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="700">辟谣与深究：日常火焰算“等离子体”吗？</text>
<text x="412" y="114" font-size="10.5" fill="#64748b" text-anchor="start">电离度 α = 自由电子数 nₑ ÷ 中性气体分子总数 n₀（对数标尺）</text>
<rect x="420.0" y="148.0" width="198.7" height="20" rx="4" fill="#eaf4fb" stroke="#93c5fd"/>
<rect x="618.7" y="148.0" width="99.3" height="20" rx="4" fill="#f3e8ff" stroke="#d8b4fe"/>
<text x="519.3" y="142.0" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">中性／极弱电离气体区</text>
<text x="668.3" y="142.0" font-size="10.2" fill="#6d28d9" text-anchor="middle" font-weight="700">典型等离子体区</text>
<line x1="420.0" y1="168.0" x2="420.0" y2="173.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="420.0" y="186.0" font-size="9.8" fill="#64748b" text-anchor="middle" class="mono">10^-18</text>
<line x1="486.2" y1="168.0" x2="486.2" y2="173.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="486.2" y="186.0" font-size="9.8" fill="#64748b" text-anchor="middle" class="mono">10^-14</text>
<line x1="552.4" y1="168.0" x2="552.4" y2="173.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="552.4" y="186.0" font-size="9.8" fill="#64748b" text-anchor="middle" class="mono">10^-10</text>
<line x1="618.7" y1="168.0" x2="618.7" y2="173.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="618.7" y="186.0" font-size="9.8" fill="#64748b" text-anchor="middle" class="mono">10^-6</text>
<line x1="684.9" y1="168.0" x2="684.9" y2="173.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="684.9" y="186.0" font-size="9.8" fill="#64748b" text-anchor="middle" class="mono">10^-2</text>
<line x1="718.0" y1="168.0" x2="718.0" y2="173.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="718.0" y="186.0" font-size="9.8" fill="#64748b" text-anchor="middle" class="mono">1</text>
<circle cx="438.2" cy="158.0" r="4.8" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
<rect x="412" y="196" width="312" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="412" y="196" width="5" height="40" rx="2" fill="#475569"/>
<text x="424" y="211" font-size="10.8" fill="#475569" text-anchor="start" font-weight="700">1400°C 纯热电离理论值</text>
<text x="424" y="227" font-size="10.0" fill="#1e293b" text-anchor="start">萨哈方程 α ≈ 10⁻¹⁷（热碰撞根本撞不出电子！）</text>
<circle cx="575.0" cy="158.0" r="4.8" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<rect x="412" y="244" width="312" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="412" y="244" width="5" height="40" rx="2" fill="#c25014"/>
<text x="424" y="259" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">蜡烛／木柴／燃气灶真实火焰</text>
<text x="424" y="275" font-size="10.0" fill="#1e293b" text-anchor="start">化学电离 CH + O → HCO⁺ + e⁻，α ≈ 2×10⁻⁹</text>
<circle cx="638.5" cy="158.0" r="4.8" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<rect x="412" y="292" width="312" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="412" y="292" width="5" height="40" rx="2" fill="#dc2626"/>
<text x="424" y="307" font-size="10.8" fill="#dc2626" text-anchor="start" font-weight="700">氧-乙炔焊枪超高温焰（~3100°C）</text>
<text x="424" y="323" font-size="10.0" fill="#1e293b" text-anchor="start">热电离开始显著介入，步入弱电离等离子体门槛</text>
<circle cx="709.7" cy="158.0" r="4.8" fill="#6d28d9" stroke="#ffffff" stroke-width="1.5"/>
<rect x="412" y="340" width="312" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="412" y="340" width="5" height="40" rx="2" fill="#6d28d9"/>
<text x="424" y="355" font-size="10.8" fill="#6d28d9" text-anchor="start" font-weight="700">闪电通道／电弧焊／太阳日冕</text>
<text x="424" y="371" font-size="10.0" fill="#1e293b" text-anchor="start">α ≈ 0.1–1.0，集体电磁屏蔽主导的标准等离子体</text>
<rect x="412" y="392" width="312" height="80" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.0"/>
<text x="424" y="411" font-size="11.2" fill="#6d28d9" text-anchor="start" font-weight="700">一句话定性日常火焰：</text>
<text x="424" y="429" font-size="10.3" fill="#1e293b" text-anchor="start">普通火不是第四态热等离子体，而是十亿分子里混着约 2 个化学</text>
<text x="424" y="446" font-size="10.3" fill="#1e293b" text-anchor="start">离子的【发光高温反应气流】——虽算不上标准等离子体，却已比空</text>
<text x="424" y="463" font-size="10.3" fill="#1e293b" text-anchor="start">气导电百万倍，足够被高压电场掰弯，也能触发燃气灶离子保护针！</text>
</svg>
