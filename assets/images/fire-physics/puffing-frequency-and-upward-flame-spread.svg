<text x="491" y="300" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="600">热羽流飞向空中</text>
<text x="491" y="317" font-size="9.8" fill="#64748b" text-anchor="middle">下方木杆冷，常半途自熄</text>
<rect x="578" y="108" width="146" height="224" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="651" y="128" font-size="10.6" fill="#dc2626" text-anchor="middle" font-weight="700">B. 火柴头朝下（顺流猛蹿）</text>
<path d="M 651 150 C 626 196, 628 250, 651 272 C 674 250, 676 196, 651 150 Z" fill="#fb923c" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3 2"/>
<path d="M 651 174 C 635 210, 636 252, 651 268 C 666 252, 667 210, 651 174 Z" fill="#fde047" stroke="#ea580c" stroke-width="1.2"/>
<rect x="647" y="184" width="8" height="76" rx="2" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
<ellipse cx="651" cy="260" rx="5.5" ry="7" fill="#334155"/>
<line x1="626.0" y1="256.0" x2="626.0" y2="176.0" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="651" y="300" font-size="10.2" fill="#dc2626" text-anchor="middle" font-weight="700">高温羽流包裹整根木杆</text>
<text x="651" y="317" font-size="9.8" fill="#1e293b" text-anchor="middle">提前热解出可燃气，秒烧到手！</text>
<rect x="418" y="344" width="306" height="116" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.0"/>
<text x="430" y="364" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">从火柴放大到森林山火与高层逃生铁律：</text>
<text x="430" y="383" font-size="10.2" fill="#1e293b" text-anchor="start">1. 严禁往山上跑：陡坡与峡谷把向上热羽流压向坡面树冠（贴壁</text>
<text x="430" y="400" font-size="10.2" fill="#1e293b" text-anchor="start">   柯恩达效应 + 辐射预热），山火上坡蔓延速度可达平地的 4–10 倍！</text>
<text x="430" y="418" font-size="10.2" fill="#1e293b" text-anchor="start">2. 火场弯腰低姿：楼梯间与电梯井是天然大烟囱，剧毒高温烟气</text>
<text x="430" y="435" font-size="10.2" fill="#1e293b" text-anchor="start">   以 3–5 m/s 直冲顶层，贴近地面 30 cm 才有残存低温空气层。</text>
</svg>
