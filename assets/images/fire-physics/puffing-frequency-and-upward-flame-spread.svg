<rect x="0.5" y="0.5" width="759" height="489" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">浮力制造的两大奇观：篝火“呼呼”跳动定律与火柴倒拿狂烧之谜</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">小火苗安静稳定，大火堆却按 f ≈ 1.5/√D 周期脱落环形涡流；顺着浮力方向更会让火势暴涨数倍</text>
<rect x="20" y="62" width="368" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="700">为什么篝火总是一跳一跳？浮力涡环脱落定律</text>
