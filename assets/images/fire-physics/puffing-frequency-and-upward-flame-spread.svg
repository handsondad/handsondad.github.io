<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">火焰浮力涡环闪烁频率定律与火柴顺逆流燃烧蔓延对比图</title>
<desc id="desc">左图绘制火焰闪烁频率随火源直径平方根成反比的实验曲线（从2厘米蜡烛10.6赫兹到9米油池火0.5赫兹）；右图对比火柴头朝上逆流慢烧与朝下顺流预热猛烧，延伸至山火上坡加速与火场低姿逃生原理。</desc>
