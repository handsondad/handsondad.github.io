    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="479" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">两个颠覆直觉的现实应用：加速车里的火往哪偏？燃气灶靠什么防漏气？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">一个验证爱因斯坦等效原理与浮力本质，一个把火焰十亿分之二的化学电离变成千家万户的救命开关</text>
<rect x="20" y="62" width="360" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">密闭玻璃瓶向右加速：火苗竟然“迎着前方”偏！</text>
<rect x="56" y="126" width="288" height="178" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.0"/>
<text x="72" y="148" font-size="10.3" fill="#475569" text-anchor="start" font-weight="600">密闭玻璃罩（隔绝车外迎面风）</text>
<line x1="140.0" y1="112.0" x2="264.0" y2="112.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="202" y="104" font-size="10.8" fill="#dc2626" text-anchor="middle" font-weight="700">整体向右加速 a = 3.5 m/s²</text>
 <rect x="60" y="158" width="96" height="142" rx="8" fill="#dbeafe" fill-opacity="0.65"/>
<line x1="166.0" y1="236.0" x2="92.0" y2="236.0" stroke="#1d6fa5" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<text x="112" y="218" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">重冷空气惯性</text>
<text x="112" y="256" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">拥向后壁增压</text>
<rect x="190.0" y="260" width="28" height="42" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3"/>
<line x1="204.0" y1="260.0" x2="204.0" y2="250.0" stroke="#334155" stroke-width="2.8" stroke-linecap="round"/>
<line x1="204.0" y1="250.0" x2="204.0" y2="162.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/>
<g transform="translate(204.0,250.0) rotate(19.6)"><path d="M 0 -78 C -18 -46, -17 -14, 0 0 C 17 -14, 18 -46, 0 -78 Z" fill="#fde047" stroke="#ea580c" stroke-width="1.3"/><path d="M 0 -28 C -7 -16, -7 -5, 0 0 C 7 -5, 7 -16, 0 -28 Z" fill="#2563eb" fill-opacity="0.7"/></g>
<text x="238.0" y="178" font-size="11" fill="#c25014" text-anchor="start" font-weight="700">向前倾 θ ≈ 19.6°！</text>
<text x="238.0" y="195" font-size="10.2" fill="#64748b" text-anchor="start" class="mono">θ = arctan(a / g)</text>
<circle cx="110" cy="314" r="9" fill="#475569"/>
<circle cx="290" cy="314" r="9" fill="#475569"/>
<rect x="34" y="336" width="332" height="118" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1.0"/>
<text x="46" y="356" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">为什么没往后倒，反而和氦气球一样“往前冲”？</text>
<text x="46" y="375" font-size="10.2" fill="#1e293b" text-anchor="start">• 车厢向右加速等价于叠加向左的惯性力场 −a，合成“等效重力”</text>
<text x="46" y="393" font-size="10.2" fill="#1e293b" text-anchor="start">  g_eff 指向【左下方】；</text>
<text x="46" y="411" font-size="10.2" fill="#1e293b" text-anchor="start">• 密度大 5 倍的冷空气被甩向车尾（左），产生指向【右上方】的</text>
<text x="46" y="429" font-size="10.2" fill="#1e293b" text-anchor="start">  阿基米德浮力，把轻盈火苗推向前方！旋转圆盘上火苗则指向圆心。</text>
<rect x="396" y="62" width="344" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="414" cy="84" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="414" y="88" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">2</text>
<text x="432" y="88" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">厨房灶台救命机关：火焰离子整流熄火保护</text>
<rect x="412" y="114" width="312" height="196" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<rect x="454" y="256" width="160" height="22" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="1.3"/>
<text x="534" y="271" font-size="10.0" fill="#f8fafc" text-anchor="middle" font-weight="600">金属火盖（大面积接地电极）</text>
<path d="M 478 188 C 465 218, 466 244, 478 256 C 490 244, 491 218, 478 188 Z" fill="#38bdf8" fill-opacity="0.65" stroke="#7dd3fc" stroke-width="1.1"/>
<path d="M 514 188 C 501 218, 502 244, 514 256 C 526 244, 527 218, 514 188 Z" fill="#38bdf8" fill-opacity="0.65" stroke="#7dd3fc" stroke-width="1.1"/>
<path d="M 550 188 C 537 218, 538 244, 550 256 C 562 244, 563 218, 550 188 Z" fill="#38bdf8" fill-opacity="0.65" stroke="#7dd3fc" stroke-width="1.1"/>
<path d="M 586 188 C 573 218, 574 244, 586 256 C 598 244, 599 218, 586 188 Z" fill="#38bdf8" fill-opacity="0.65" stroke="#7dd3fc" stroke-width="1.1"/>
<text x="518" y="174" font-size="10.0" fill="#7dd3fc" text-anchor="middle" font-weight="600">火焰区含 HCO⁺ / H₃O⁺ 正离子与高速自由电子 e⁻</text>
<path d="M 656 266 L 656 218 L 588 218" fill="none" stroke="#fbbf24" stroke-width="3.2" stroke-linecap="round"/>
<rect x="648" y="256" width="16" height="32" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
<text x="668" y="214" font-size="10.5" fill="#fbbf24" text-anchor="start" font-weight="700">离子感应针</text>
<text x="668" y="230" font-size="9.6" fill="#cbd5e1" text-anchor="start">（细金属探针）</text>
<rect x="426" y="126" width="196" height="32" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
<text x="524" y="146" font-size="10.0" fill="#4ade80" text-anchor="middle" font-weight="700">整流直流电 I ≈ 2–10 μA → 吸合电磁阀</text>
<text x="534" y="296" font-size="10.0" fill="#fde047" text-anchor="middle" font-weight="600">汤水扑灭火焰 → 离子 0.1 秒消失 → 电流归零瞬间断气！</text>
<rect x="412" y="324" width="312" height="130" rx="8" fill="#e7f6ee" stroke="#86efac" stroke-width="1.0"/>
<text x="424" y="344" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">为什么“烧红的铁丝”骗不过离子感应针？（对比热电偶）</text>
<text x="424" y="363" font-size="10.2" fill="#1e293b" text-anchor="start">• 老式热电偶靠温度发电，溢锅灭了火但余温尚烫，需等几秒才断气；</text>
<text x="424" y="381" font-size="10.2" fill="#1e293b" text-anchor="start">• 离子针施加交流电：电子 e⁻ 比正离子轻数万倍、跑得飞快，加上</text>
<text x="424" y="399" font-size="10.2" fill="#1e293b" text-anchor="start">  火盖面积远大于细针，把火焰变成天然【单向二极管】（火焰整流）！</text>
<text x="424" y="417" font-size="10.2" fill="#1e293b" text-anchor="start">• 哪怕灶头烫得通红或被油污短路，只要没有真实燃烧产生的化学</text>
<text x="424" y="435" font-size="10.2" fill="#1e293b" text-anchor="start">  电离单向直流脉冲，控制器 0.1 秒内果断关阀，杜绝燃气泄漏爆炸。</text>
</svg>
