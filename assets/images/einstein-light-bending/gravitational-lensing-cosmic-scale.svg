    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="517" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">终极反转：从“费尽心机验证爱因斯坦”，变成称量暗物质与恒星的宇宙放大镜</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左看星系团强引力透镜（爱因斯坦环与四重像）→ 右看哈勃推翻爱因斯坦 1936 悲观预言、直接给孤立白矮星称重</text>
<rect x="22" y="68" width="366" height="434" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="92" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="42" y="96" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="97" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">星系级强引力透镜：给看不见的暗物质“过秤”</text>
<text x="42" y="117" font-size="10.6" fill="#64748b" text-anchor="start">前景星系团时空凹陷把背景星系星光从上下左右同时掰弯汇聚</text>
<rect x="38" y="132" width="334" height="176" rx="8" fill="#0f172a"/>
<circle cx="72" cy="214" r="8" fill="#38bdf8"/>
<text x="72" y="242" font-size="10.5" fill="#bae6fd" text-anchor="middle">百亿光年外</text>
<text x="72" y="260" font-size="10.5" fill="#bae6fd" text-anchor="middle">背景星系</text>
<circle cx="198" cy="214" r="34" fill="#a855f7" opacity="0.24"/>
<circle cx="198" cy="214" r="13" fill="#fbbf24"/>
<text x="198" y="294" font-size="10.5" fill="#e9d5ff" text-anchor="middle" font-weight="700">前景星系团＋暗物质晕</text>
<path d="M 80,212 Q 198,148 320,212" fill="none" stroke="#38bdf8" stroke-width="2.3"/>
<path d="M 80,216 Q 198,280 320,216" fill="none" stroke="#38bdf8" stroke-width="2.3"/>
<line x1="320" y1="212" x2="220" y2="160" stroke="#7dd3fc" stroke-width="1.3" stroke-dasharray="4,3"/>
<line x1="320" y1="216" x2="220" y2="268" stroke="#7dd3fc" stroke-width="1.3" stroke-dasharray="4,3"/>
<circle cx="330" cy="214" r="9" fill="#e2e8f0" stroke="#38bdf8" stroke-width="2"/>
<text x="330" y="244" font-size="10.5" fill="#e2e8f0" text-anchor="middle">太空望远镜</text>
<rect x="38" y="322" width="160" height="82" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
<circle cx="72" cy="363" r="18" fill="none" stroke="#6d28d9" stroke-width="3.2" stroke-dasharray="22,6"/>
<circle cx="72" cy="363" r="5" fill="#d97706"/>
<text x="144" y="354" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">正对共线：</text>
<text x="144" y="374" font-size="11.2" fill="#6d28d9" text-anchor="middle" font-weight="700">爱因斯坦环</text>
<rect x="212" y="322" width="160" height="82" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<circle cx="246" cy="363" r="5" fill="#d97706"/>
<circle cx="246" cy="349" r="3.5" fill="#1d6fa5"/>
<circle cx="260" cy="363" r="3.5" fill="#1d6fa5"/>
<circle cx="246" cy="377" r="3.5" fill="#1d6fa5"/>
<circle cx="232" cy="363" r="3.5" fill="#1d6fa5"/>
<text x="318" y="354" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">椭球偏心：</text>
<text x="318" y="374" font-size="11.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">爱因斯坦十字</text>
<rect x="38" y="416" width="334" height="72" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="205" y="438" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">爱因斯坦环角半径：θ_E = √[(4GM/c²) · D_LS / (D_L D_S)]</text>
<text x="205" y="459" font-size="10.5" fill="#1e293b" text-anchor="middle">发光恒星远远不够掰出这么大的环 → 直接称出星系团里</text>
<text x="205" y="477" font-size="10.8" fill="#6d28d9" text-anchor="middle" font-weight="700">约 85% 的引力质量是不发光的“暗物质”！</text>
<rect x="402" y="68" width="336" height="434" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="422" cy="92" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="422" y="96" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="442" y="97" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">天体测量微透镜：给孤立死亡恒星“单颗称重”</text>
<text x="422" y="117" font-size="10.6" fill="#64748b" text-anchor="start">相隔百年的跨时空对话：哈勃望远镜圆了爱因斯坦不敢想的梦</text>
<rect x="418" y="134" width="304" height="74" rx="8" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<text x="570" y="156" font-size="11.0" fill="#c25014" text-anchor="middle" font-weight="700">1936 年爱因斯坦在《Science》撰文感叹：</text>
<text x="570" y="177" font-size="10.6" fill="#0f172a" text-anchor="middle">单颗恒星引力透镜角太小，“我们毫无希望直接观测到”</text>
<text x="570" y="196" font-size="10.5" fill="#64748b" text-anchor="middle">（当年地面望远镜根本分不开几毫角秒的星点偏移）</text>
<line x1="570" y1="214" x2="570" y2="242" stroke="#18794e" stroke-width="2.4" marker-end="url(#arr-g)"/>
<text x="644" y="232" font-size="10.6" fill="#18794e" text-anchor="middle" font-weight="700">百年太空光学突破</text>
<rect x="418" y="248" width="304" height="148" rx="8" fill="#e7f6ee" stroke="#86efac"/>
<text x="570" y="270" font-size="11.0" fill="#18794e" text-anchor="middle" font-weight="700">2017 &amp; 2023 哈勃望远镜（Gaia 提前预报交会）：</text>
<line x1="444" y1="326" x2="696" y2="308" stroke="#475569" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr-s)"/>
<circle cx="534" cy="319" r="9" fill="#ffffff" stroke="#1d6fa5" stroke-width="2.5"/>
<text x="502" y="344" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">前景白矮星</text>
<circle cx="556" cy="298" r="3.5" fill="#64748b"/>
<circle cx="566" cy="285" r="4.5" fill="#c25014"/>
<line x1="556" y1="298" x2="566" y2="285" stroke="#c25014" stroke-width="2"/>
<text x="640" y="290" font-size="10.6" fill="#c25014" text-anchor="middle" font-weight="700">背景星偏移 ~2 毫角秒！</text>
<text x="570" y="368" font-size="10.5" fill="#0f172a" text-anchor="middle">● 2017 Stein 2051 B：测出 0.675 M☉，验证简并态理论</text>
<text x="570" y="388" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">● 2023 孤立白矮星 LAWD 37：首测单星 0.56 M☉！</text>
<rect x="418" y="410" width="304" height="78" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="570" y="434" font-size="11.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">精度对比：比 1919 日全食偏折角还要小 625 倍！</text>
<text x="570" y="455" font-size="10.5" fill="#0f172a" text-anchor="middle">相当于从地球看清月球表面停着的一辆小汽车长度——</text>
<text x="570" y="474" font-size="10.5" fill="#64748b" text-anchor="middle">广义相对论早已从“被考证的猜想”变成天文学日常标尺</text>
</svg>
