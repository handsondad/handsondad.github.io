<text x="378" y="284" font-size="10.6" fill="#475569" text-anchor="middle">月亮挡住刺眼日面，露出日冕旁暗星</text>
<line x1="378" y1="222" x2="378" y2="184" stroke="#475569" stroke-width="1.4"/>
<text x="388" y="202" font-size="10.5" fill="#475569" text-anchor="start">掠过距离 b</text>
