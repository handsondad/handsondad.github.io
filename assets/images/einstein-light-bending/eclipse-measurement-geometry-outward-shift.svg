<text x="442" y="335" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">1.75 角秒到底有多小？苛刻到极致的精度</text>
<text x="422" y="355" font-size="10.8" fill="#64748b" text-anchor="start">1 度 = 60 角分 = 3,600 角秒 → 1.75″ ≈ 0.000486°</text>
