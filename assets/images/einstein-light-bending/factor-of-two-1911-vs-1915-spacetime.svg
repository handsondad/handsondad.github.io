<path d="M 428,286 Q 565,281.0 702,286" fill="none" stroke="#fed7aa" stroke-width="1.2"/>
<circle cx="565" cy="238" r="34" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
<text x="565" y="242" font-size="11.2" fill="#78350f" text-anchor="middle" font-weight="700">太阳 M☉</text>
<line x1="424" y1="176" x2="704" y2="176" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
<path d="M 424,176 Q 565,178 704,212" fill="none" stroke="#c25014" stroke-width="3.2" marker-end="url(#arr-o)"/>
<text x="565" y="145" font-size="11.0" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">时间变慢（g₀₀）＋ 空间尺子拉伸弯曲（gᵣᵣ，γ = 1）</text>
<text x="664" y="234" font-size="11.4" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">α₁₉₁₅ = 1.75″（翻倍！）</text>
<rect x="408" y="304" width="314" height="86" rx="8" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<text x="565" y="325" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">机制：光以近 c 高速穿行，空间曲率与时间变慢平分秋色</text>
<text x="565" y="346" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="700">后牛顿通式：α = (1+γ)·2GM☉/(c²R☉) = 4GM☉/(c²R☉)</text>
<text x="565" y="368" font-size="10.6" fill="#0f172a" text-anchor="middle">平直空间 γ = 0 得 0.875″；广义相对论 γ = 1 得 1.750″！</text>
<rect x="22" y="418" width="716" height="102" rx="10" fill="#e7f6ee" stroke="#86efac" stroke-width="1"/>
<text x="42" y="442" font-size="12.4" fill="#18794e" text-anchor="start" font-weight="700">科学史惊险一幕：1914 年的一场大雨和一战战俘营，意外“救”了爱因斯坦的声誉！</text>
<text x="42" y="468" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">● 1911 布拉格（0.83″ 半值）</text>
<text x="238" y="468" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">● 1914.08 克里米亚日食（扣押＋阴天未拍成）</text>
<text x="508" y="468" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">● 1915.11 柏林（补齐空间曲率 → 1.75″）</text>
<text x="42" y="492" font-size="10.8" fill="#1e293b" text-anchor="start">若 1914 年晴空万里测出 1.75″，当时拿着 0.87″ 错答案的爱因斯坦反而会被判“理论失败”；1915 年补上空间曲率才真正铸就绝杀。</text>
</svg>
