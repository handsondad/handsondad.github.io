<text x="195" y="145" font-size="11.0" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">平直空间网格 ＋ 靠近太阳钟表走得慢（g₀₀）</text>
<text x="285" y="214" font-size="11.8" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">α₁₉₁₁ = 0.875″</text>
<rect x="38" y="304" width="314" height="86" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="195" y="325" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">机制：惠更斯波前内慢外快（等效折射率 n ≈ 1 + GM/c²r）</text>
<text x="195" y="346" font-size="11.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">公式：α₁₉₁₁ = 2GM☉ / (c²R☉) ≈ 0.875 角秒</text>
<text x="195" y="368" font-size="10.5" fill="#64748b" text-anchor="middle">注：与 1801 年索尔德纳把光当牛顿重粒子的结果完全重合</text>
<rect x="392" y="68" width="346" height="336" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="408" y="82" width="314" height="28" rx="8" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<text x="565" y="101" font-size="11.8" fill="#c25014" text-anchor="middle" font-weight="700">1915.11 完整广义相对论：时间＋空间双双弯曲</text>
