<text x="195" y="242" font-size="11.2" fill="#78350f" text-anchor="middle" font-weight="700">太阳 M☉</text>
<line x1="54" y1="176" x2="334" y2="176" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
<path d="M 54,176 Q 195,176 334,194" fill="none" stroke="#1d6fa5" stroke-width="2.8" marker-end="url(#arr-b)"/>
