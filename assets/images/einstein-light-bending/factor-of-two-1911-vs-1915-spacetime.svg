<rect x="0.5" y="0.5" width="759" height="535" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">从 0.875″ 到 1.75″：为什么爱因斯坦 1915 年把自己的预言翻了一倍？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">1911 年只算了“引力让时间变慢”；1915 年补齐“空间本身也在弯曲”，两项各贡献一半偏折角（γ = 1）</text>
