<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="523" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">不用再苦等日全食！现代物理学怎样把验证精度狂飙一万倍？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">从光学底片的 10% 误差，到洲际射电干涉（VLBI）、卡西尼号穿日无线电与盖亚卫星全天微角秒测绘</text>
<rect x="22" y="68" width="224" height="326" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="36" y="82" width="196" height="26" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="134" y="100" font-size="11.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">1. 洲际射电干涉（VLBI）</text>
<text x="134" y="124" font-size="11.0" fill="#0f172a" text-anchor="middle" font-weight="700">大白天透视日冕盯紧类星体</text>
<rect x="38" y="136" width="192" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="38" y="244" font-size="10.6" fill="#1e293b" text-anchor="start">射电波不怕蓝天散射！全球 87 台</text>
<text x="38" y="263" font-size="10.6" fill="#1e293b" text-anchor="start">射电望远镜联网成“地球口径大眼”，</text>
<text x="38" y="282" font-size="10.6" fill="#1e293b" text-anchor="start">20 年追踪 541 颗类星体 170 万次。</text>
<rect x="36" y="298" width="196" height="82" rx="8" fill="#eaf4fb" stroke="#e2e8f0" stroke-width="1"/>
<text x="134" y="318" font-size="10.5" fill="#64748b" text-anchor="middle">Shapiro 等 (2004)：</text>
<text x="134" y="341" font-size="11.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">γ = 0.99983 ± 0.00045</text>
<text x="134" y="364" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">相对误差 0.02%（2018 再提 4.5 倍）</text>
<rect x="268" y="68" width="224" height="326" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="282" y="82" width="196" height="26" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="380" y="100" font-size="11.6" fill="#c25014" text-anchor="middle" font-weight="700">2. 卡西尼号土星飞船（2003）</text>
<text x="380" y="124" font-size="11.0" fill="#0f172a" text-anchor="middle" font-weight="700">引力掰弯光路＋拉长飞行时间</text>
<rect x="284" y="136" width="192" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="284" y="244" font-size="10.6" fill="#1e293b" text-anchor="start">飞船绕到太阳正背面（上合），双频</text>
<text x="284" y="263" font-size="10.6" fill="#1e293b" text-anchor="start">无线电擦过日缘往返，消去日冕等离</text>
<text x="284" y="282" font-size="10.6" fill="#1e293b" text-anchor="start">子体干扰，直测夏皮罗引力延迟。</text>
<rect x="282" y="298" width="196" height="82" rx="8" fill="#fef1e8" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="318" font-size="10.5" fill="#64748b" text-anchor="middle">Bertotti 等 (2003, Nature)：</text>
<text x="380" y="341" font-size="11.4" fill="#c25014" text-anchor="middle" font-weight="700">γ − 1 = (2.1 ± 2.3) × 10⁻⁵</text>
<text x="380" y="364" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">精度高达十万分之二（0.002%）！</text>
<rect x="514" y="68" width="224" height="326" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="528" y="82" width="196" height="26" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="626" y="100" font-size="11.6" fill="#18794e" text-anchor="middle" font-weight="700">3. 欧空局盖亚卫星（Gaia）</text>
<text x="626" y="124" font-size="11.0" fill="#0f172a" text-anchor="middle" font-weight="700">连木星掰弯星光都能直接拍到！</text>
<rect x="530" y="136" width="192" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="530" y="244" font-size="10.6" fill="#1e293b" text-anchor="start">太空无大气抖动，测角达微角秒级：</text>
<text x="530" y="263" font-size="10.6" fill="#1e293b" text-anchor="start">不仅全天修正太阳弯曲（离太阳 90°</text>
<text x="530" y="282" font-size="10.6" fill="#1e293b" text-anchor="start">处星光仍偏折 4.07 毫角秒！），</text>
<rect x="528" y="298" width="196" height="82" rx="8" fill="#e7f6ee" stroke="#e2e8f0" stroke-width="1"/>
<text x="626" y="318" font-size="10.5" fill="#64748b" text-anchor="middle">2022 公布木星掠射实测：</text>
<text x="626" y="341" font-size="11.4" fill="#18794e" text-anchor="middle" font-weight="700">距木星边缘 7″ 偏折 10 毫角秒</text>
<text x="626" y="364" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">连巨行星扁率四极矩都能分辨！</text>
<circle cx="64" cy="175" r="5" fill="#6d28d9"/>
<text x="64" y="204" font-size="10.5" fill="#6d28d9" text-anchor="middle" font-weight="700">类星体</text>
<circle cx="130" cy="190" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
<path d="M 70,175 Q 130,154 196,164" fill="none" stroke="#1d6fa5" stroke-width="2"/>
<path d="M 70,175 Q 130,164 196,194" fill="none" stroke="#1d6fa5" stroke-width="2" stroke-dasharray="4,3"/>
<circle cx="204" cy="179" r="16" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.5"/>
<circle cx="196" cy="164" r="3" fill="#0f172a"/>
<circle cx="196" cy="194" r="3" fill="#0f172a"/>
<circle cx="312" cy="178" r="11" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="318" y="212" font-size="10.5" fill="#1d6fa5" text-anchor="middle">深空网</text>
<circle cx="380" cy="190" r="15" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
<path d="M 324,175 Q 380,148 442,175" fill="none" stroke="#c25014" stroke-width="2.4" marker-end="url(#arr-o)"/>
<rect x="442" y="169" width="14" height="12" rx="2" fill="#475569"/>
<text x="446" y="212" font-size="10.5" fill="#475569" text-anchor="middle">卡西尼</text>
<circle cx="600" cy="178" r="18" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
<line x1="583" y1="173" x2="617" y2="173" stroke="#ea580c" stroke-width="2"/>
<line x1="583" y1="183" x2="617" y2="183" stroke="#ea580c" stroke-width="1.5"/>
<text x="600" y="213" font-size="10.5" fill="#9a3412" text-anchor="middle" font-weight="700">木星</text>
<circle cx="548" cy="160" r="4" fill="#18794e"/>
<path d="M 552,160 Q 602,148 688,174" fill="none" stroke="#18794e" stroke-width="2.2" marker-end="url(#arr-g)"/>
<polygon points="692,164 708,174 692,184" fill="#18794e"/>
<text x="694" y="212" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">Gaia</text>
<rect x="22" y="408" width="716" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="432" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">百年空间曲率参数 γ 检验精度跃迁（广义相对论预言 γ ≡ 1，不确定度越小越苛刻）：</text>
<line x1="66.0" y1="468.0" x2="694.0" y2="468.0" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
<circle cx="66.0" cy="468.0" r="6.5" fill="#475569" stroke="#ffffff" stroke-width="1.8"/>
<text x="66.0" y="455.0" font-size="10.8" fill="#475569" text-anchor="start" font-weight="700">1919 光学日食</text>
<text x="66.0" y="491.0" font-size="10.5" fill="#1e293b" text-anchor="start">误差 ~10%–20%</text>
<circle cx="273.2" cy="468.0" r="6.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.8"/>
<text x="273.2" y="455.0" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">1970s 早期射电</text>
<text x="273.2" y="491.0" font-size="10.5" fill="#1e293b" text-anchor="middle">误差 ~1%</text>
<circle cx="480.5" cy="468.0" r="6.5" fill="#6d28d9" stroke="#ffffff" stroke-width="1.8"/>
<text x="480.5" y="455.0" font-size="10.8" fill="#6d28d9" text-anchor="middle" font-weight="700">2004 全球 VLBI</text>
<text x="480.5" y="491.0" font-size="10.5" fill="#1e293b" text-anchor="middle">误差 0.045%</text>
<circle cx="694.0" cy="468.0" r="6.5" fill="#c25014" stroke="#ffffff" stroke-width="1.8"/>
<text x="694.0" y="455.0" font-size="10.8" fill="#c25014" text-anchor="end" font-weight="700">2003 卡西尼号穿日</text>
<text x="694.0" y="491.0" font-size="10.5" fill="#1e293b" text-anchor="end">误差 0.0023%（提升近万倍！）</text>
