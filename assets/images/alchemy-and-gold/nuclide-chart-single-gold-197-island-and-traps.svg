<title id="title">铂金汞铊铅局部核素图唯一稳定金197孤岛与人工核嬗变三大放射性及产率陷阱图解</title>
<desc id="desc">左栏绘制78号铂至82号铅在N=116至126区间的核素网格，直观展示80号汞拥有7种稳定核而79号金仅有唯一稳定核197Au，相邻198Au与199Au均为短寿命放射性核；右栏拆解1941快中子轰汞产毒金、慢中子轰0.15%稀有196Hg反烧回汞、以及铂造金倒贴成本三大死胡同。</desc>
