<text x="46" y="374" font-size="11.0" fill="#b45309" text-anchor="start" font-weight="700">为什么黄金在核素图上这么“挑食”？（核子成对能铁律）：</text>
<text x="46" y="396" font-size="10.6" fill="#1e293b" text-anchor="start">• 质子、中子为偶数时两两配对更稳：80号汞坐拥 7 种稳定同位素！</text>
<text x="46" y="418" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">• 79号金质子数为奇数，全自然界 100% 只有 ¹⁹⁷Au（79p+118n）</text>
<text x="46" y="440" font-size="10.6" fill="#1e293b" text-anchor="start">  这一种稳定核！多 1 颗中子的 ¹⁹⁸Au 半衰期仅 2.7 天，会发射强伽</text>
<text x="46" y="462" font-size="10.6" fill="#dc2626" text-anchor="start" font-weight="700">  马射线并 β⁻ 衰变重新变回 ¹⁹⁸Hg 水银——谁戴谁辐射中毒！</text>
<rect x="458" y="68" width="282" height="428" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="470.0" y="80.0" width="258" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="599.0" y="95.0" font-size="11.2" fill="#dc2626" text-anchor="middle" font-weight="600">B. 反应堆/加速器造金的三大死胡同</text>
<rect x="470" y="114" width="258" height="114" rx="8" fill="#fffaf5" stroke="#c25014" stroke-width="1.1"/>
<text x="482" y="136" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">陷阱 ①：快中子轰击天然水银 (1941)</text>
<text x="482" y="158" font-size="10.5" fill="#1e293b" text-anchor="start">哈佛 Sherr 等首次把汞变金：</text>
<text x="482" y="178" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">¹⁹⁸Hg + n → ¹⁹⁸Au + p（及 ¹⁹⁹Au）</text>
<text x="482" y="198" font-size="10.4" fill="#dc2626" text-anchor="start" font-weight="700">结果：全是半衰期 2.7~3.1 天的强放射</text>
<text x="482" y="216" font-size="10.4" fill="#1e293b" text-anchor="start">性同位素，不到两周全衰变回水银！</text>
<rect x="470" y="240" width="258" height="126" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.1"/>
<text x="482" y="262" font-size="10.6" fill="#0f766e" text-anchor="start" font-weight="700">陷阱 ②：慢中子轰 ¹⁹⁶Hg 产率仅千分之1.5</text>
<text x="482" y="284" font-size="10.4" fill="#1e293b" text-anchor="start">唯一能变稳定 ¹⁹⁷Au 的 ¹⁹⁶Hg 在天然水</text>
<text x="482" y="304" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">银里仅占 0.15%！其余 99.85% 水银白吃</text>
<text x="482" y="324" font-size="10.4" fill="#1e293b" text-anchor="start">中子；更惨的是造出的 ¹⁹⁷Au 极爱吸中子</text>
