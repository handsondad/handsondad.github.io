<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">2025年CERN大型强子对撞机ALICE超外围碰撞将铅208光核解离为金原子核动态示意图</title>
<desc id="desc">上方深色束流管道展示两束99.999993%光速的铅208原子核擦肩掠过（单次动画），洛伦兹压扁的强电磁场激发巨偶极共振甩出3颗质子与2至3颗中子变成79号金核并由零度商业量热器ZDC捕获；下方两栏说明为何迎头碰撞会碎成夸克胶子等离子体，以及860亿颗金核仅合29皮克的质量换算。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes pbPassTop {
    0%   { transform: translateX(0px); }
    45%  { transform: translateX(195px); }
    100% { transform: translateX(430px); }
  }
  @keyframes pbToAuBot {
    0%   { transform: translateX(0px); }
    45%  { transform: translateX(0px); }
    100% { transform: translateX(-235px); }
  }
  @keyframes flashPulse {
    0%, 38% { opacity: 0; }
    46%     { opacity: 1; }
    65%, 100% { opacity: 0.25; }
  }
  @keyframes ejectProtons {
    0%, 45% { transform: translate(0px, 0px); opacity: 0; }
    100%    { transform: translate(-78px, 52px); opacity: 1; }
  }
  .pb-top-anim { animation: pbPassTop 4.2s linear 1 forwards; }
  .flash-anim  { animation: flashPulse 4.2s ease-out 1 forwards; }
  .eject-anim  { animation: ejectProtons 4.2s ease-out 1 forwards; }
  @media (prefers-reduced-motion: reduce) {
    .pb-top-anim, .flash-anim, .eject-anim { animation: none !important; }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="509" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">2025 年 CERN 大型强子对撞机真把“铅变成了黄金”！——超外围擦肩光核嬗变</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">两颗 ²⁰⁸Pb 核以 99.999993% 光速擦肩而过，扁平强电场发射高能光子震飞 3 颗质子，4 年攒出 29 皮克金</text>
<rect x="20" y="68" width="720" height="246" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="80.0" width="636" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="350.0" y="95.0" font-size="11.2" fill="#6d28d9" text-anchor="middle" font-weight="600">A. CERN ALICE (Phys. Rev. C, 2025.05)：不撞碎原子核，靠“隔空电磁巴掌”精准削掉 3 颗质子</text>
<rect x="34" y="112" width="692" height="188" rx="8" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.0"/>
<line x1="54.0" y1="158.0" x2="706.0" y2="158.0" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="54.0" y1="232.0" x2="706.0" y2="232.0" stroke="#334155" stroke-width="1.2" stroke-dasharray="5 4"/>
<g class="pb-top-anim"><ellipse cx="148" cy="158" rx="5" ry="26" fill="#38bdf8" fill-opacity="0.45" stroke="#38bdf8" stroke-width="1.2"/><circle cx="148" cy="158" r="13" fill="#64748b" stroke="#e2e8f0" stroke-width="1.5"/><text x="148" y="162" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">82Pb</text></g>
<text x="68" y="140" font-size="10.5" fill="#93c5fd" text-anchor="start" font-weight="700">铅核束 ① v = 0.99999993c →</text>
<g class="flash-anim"><path d="M 343 172 L 336 186 L 350 194 L 343 214" fill="none" stroke="#facc15" stroke-width="2.8"/></g>
<text x="348" y="196" font-size="10.5" fill="#fde047" text-anchor="start" font-weight="700">洛伦兹压扁强电场 → 等效高能光子 γ*</text>
<circle cx="536" cy="232" r="13" fill="#64748b" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="536" y="236" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">82Pb</text>
<line x1="516.0" y1="232.0" x2="372.5" y2="232.0" stroke="#cbd5e1" stroke-width="1.8"/>
<polygon points="366.0,232.0 374.0,227.8 374.0,236.2" fill="#cbd5e1"/>
<text x="698" y="214" font-size="10.5" fill="#cbd5e1" text-anchor="end" font-weight="700">← 反向铅核束 ② (²⁰⁸₈₂Pb)</text>
<circle cx="218" cy="232" r="14" fill="#eab308" stroke="#fef08a" stroke-width="2.0"/>
<text x="218" y="236" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="700">79Au</text>
<line x1="332.0" y1="232.0" x2="246.5" y2="232.0" stroke="#eab308" stroke-width="2.2"/>
<polygon points="240.0,232.0 248.0,227.8 248.0,236.2" fill="#eab308"/>
<text x="218" y="260" font-size="10.2" fill="#fde047" text-anchor="middle" font-weight="700">真金原子核诞生！（微秒后撞管壁碎裂）</text>
<g class="eject-anim"><circle cx="330" cy="240" r="4.5" fill="#ef4444"/><circle cx="342" cy="246" r="4.5" fill="#ef4444"/><circle cx="354" cy="240" r="4.5" fill="#ef4444"/></g>
<text x="478" y="282" font-size="10.5" fill="#fca5a5" text-anchor="middle" font-weight="700">巨偶极共振震飞：3 颗质子(p) + 2~3 颗中子(n) → 82 - 3 = 79 号金！</text>
<rect x="48" y="208" width="76" height="48" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3"/>
<text x="86" y="229" font-size="9.8" fill="#38bdf8" text-anchor="middle" font-weight="700">ALICE ZDC</text>
<text x="86" y="245" font-size="9.2" fill="#e2e8f0" text-anchor="middle">零度计点清3p</text>
<rect x="20" y="326" width="352" height="168" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="338.0" width="292" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="178.0" y="353.0" font-size="11.0" fill="#1d6fa5" text-anchor="middle" font-weight="600">B. 为什么偏偏要“擦肩而过”不能迎头硬撞？</text>
<text x="34" y="380" font-size="10.8" fill="#1e293b" text-anchor="start">• 迎头相撞太猛：两颗铅核一旦撞实，瞬间融化成几万亿度</text>
<text x="34" y="402" font-size="10.8" fill="#1e293b" text-anchor="start">  的“夸克-胶子汤”，炸出几千颗碎片，金核根本保不住；</text>
<text x="34" y="424" font-size="10.8" fill="#1e293b" text-anchor="start">• 擦肩而过（超外围碰撞 UPC）：核子没碰到，但 82 颗质子</text>
<text x="34" y="446" font-size="10.8" fill="#1e293b" text-anchor="start">  近光速飞掠的电磁脉冲刚好激发铅核内部振荡，温和甩掉：</text>
<text x="34" y="470" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">  甩 1p→81铊 · 甩 2p→80汞 · 甩 3p→79黄金（峰值8.9万颗/秒）！</text>
<rect x="388" y="326" width="352" height="168" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="338.0" width="298" height="22" rx="11.0" fill="#fef9c3" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="549.0" y="353.0" font-size="11.0" fill="#b45309" text-anchor="middle" font-weight="600">C. 梦想成真却发不了财：4 年只攒出 29 皮克！</text>
<text x="402" y="380" font-size="10.8" fill="#1e293b" text-anchor="start">• 听着吓人：LHC 第二轮运行（2015~2018）四大实验一共</text>
<text x="402" y="402" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">  从铅束里造出了约 860 亿颗（8.6×10¹⁰）金原子核！</text>
<text x="402" y="424" font-size="10.8" fill="#1e293b" text-anchor="start">• 称重傻眼：除以阿伏伽德罗常数 6.02×10²³，总质量仅有：</text>
<text x="402" y="446" font-size="10.8" fill="#dc2626" text-anchor="start" font-weight="700">  m ≈ 2.9 × 10⁻¹¹ 克（29 皮克，比一粒灰尘还轻三万倍）！</text>
<text x="402" y="470" font-size="10.4" fill="#b45309" text-anchor="start" font-weight="700">• 哪怕按每秒 8.9 万颗峰值不眠不休猛打，凑 1 克也得 10.9 亿年！</text>
</svg>
