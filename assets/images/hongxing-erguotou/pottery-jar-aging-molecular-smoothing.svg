<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">红星二锅头陶坛陈酿三重分子驯化机制与以酒调酒示意图</title>
<desc id="desc">展示刚蒸馏出的原酒在陶坛陈酿中经历微孔呼吸排走低沸点硫醇与燥气、陶土溶出钙镁铁铜离子催化游离乙醛缩合为柔和果香乙缩醛、以及游离乙醇与水分子缔合为稳定氢键簇降低TRPV1灼痛刺激的三重机制，并说明纯粮固态酒以酒调酒原理。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f172a"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#dc2626"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="459" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="20" y="30" font-size="15.5" fill="#0f172a" text-anchor="start" font-weight="700">为什么刚出甑的新酒暴辣刺喉，钻进陶坛睡一觉就变绵柔？三重分子陈酿机制</text>
<text x="20" y="50" font-size="12" fill="#64748b" text-anchor="start">微孔陶坛并非死密封玻璃瓶：排杂挥发、金属离子催化缩醛化、水醇氢键缔合共同磨平烈酒棱角</text>
<rect x="18" y="68" width="232" height="286" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="30.0" y="80.0" width="176" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="118.0" y="95.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">① 陶壁微孔呼吸排杂</text>
<ellipse cx="134" cy="134" rx="28" ry="8" fill="#fed7aa" stroke="#c25014" stroke-width="1.8"/>
<path d="M106,134 C86,162 88,212 108,236 L160,236 C180,212 182,162 162,134 Z" fill="#ffedd5" stroke="#c25014" stroke-width="2.0"/>
<text x="134" y="182" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">陶坛陈酿</text>
<text x="134" y="202" font-size="10.5" fill="#1e293b" text-anchor="middle">避光恒温地窖</text>
<line x1="88.0" y1="168.0" x2="52.0" y2="152.0" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
<text x="48" y="146" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">逸出硫醇</text>
<line x1="180.0" y1="168.0" x2="214.0" y2="152.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<text x="214" y="146" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">微量 O2</text>
<text x="30" y="264" font-size="10.5" fill="#1e293b" text-anchor="start">• 陶胎含微米级烧结气孔，</text>
<text x="38" y="283" font-size="10.5" fill="#1e293b" text-anchor="start">液态酒不渗漏而气体可微交换</text>
<text x="30" y="304" font-size="10.5" fill="#1e293b" text-anchor="start">• 极低沸点硫化氢、甲硫醇（烂</text>
<text x="38" y="323" font-size="10.5" fill="#1e293b" text-anchor="start">菜叶味）与部分游离乙醛逸散</text>
<text x="30" y="343" font-size="11" fill="#c25014" text-anchor="start" font-weight="700">→ 褪去刺鼻“新酒燥气”</text>
<rect x="264" y="68" width="232" height="286" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="276.0" y="80.0" width="190" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="371.0" y="95.0" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">② 金属离子催化缩醛化</text>
<rect x="276" y="118" width="208" height="116" rx="8" fill="#e7f6ee" stroke="#86efac" stroke-width="1"/>
<text x="380" y="138" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">陶土溶出 Ca²⁺ / Mg²⁺ / Fe³⁺ / Cu²⁺</text>
<text x="380" y="162" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">2 乙醇 + 游离乙醛（暴辣）</text>
<text x="380" y="184" font-size="10.5" fill="#0f172a" text-anchor="middle">⇌ 催化缩合 + 酸醇缓慢酯化</text>
<text x="380" y="206" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">乙缩醛（柔和熟果香）+ 水</text>
<text x="380" y="226" font-size="10" fill="#64748b" text-anchor="middle">分子量守恒：92.1 + 44.1 = 118.2 + 18.0</text>
<text x="276" y="264" font-size="10.5" fill="#1e293b" text-anchor="start">• 游离乙醛强烈刺激三叉神经，</text>
<text x="284" y="283" font-size="10.5" fill="#1e293b" text-anchor="start">锁进乙缩醛后化作清甜果香！</text>
<text x="276" y="304" font-size="10.5" fill="#1e293b" text-anchor="start">• 多价金属离子与有机酸配位络</text>
<text x="284" y="323" font-size="10.5" fill="#1e293b" text-anchor="start">合，显著缓和尖锐酸涩感</text>
<text x="276" y="343" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">→ 辛辣转甜润，陈香渐显</text>
<rect x="510" y="68" width="232" height="286" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="522.0" y="80.0" width="186" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="615.0" y="95.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">③ 水—醇氢键网络重排</text>
<rect x="522" y="118" width="208" height="54" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="532" y="138" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="700">新酒：游离乙醇横冲直撞</text>
<text x="532" y="158" font-size="10.5" fill="#1e293b" text-anchor="start">直接轰击口腔 TRPV1 灼痛受体</text>
<rect x="522" y="180" width="208" height="54" rx="7" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="532" y="200" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">老熟酒：C2H5OH · nH2O 氢键笼</text>
<text x="532" y="220" font-size="10.5" fill="#1e293b" text-anchor="start">水分子包拢乙醇，释放更平缓</text>
<text x="522" y="264" font-size="10.5" fill="#1e293b" text-anchor="start">• 乙醇极性与水相近，但空间重</text>
<text x="530" y="283" font-size="10.5" fill="#1e293b" text-anchor="start">排跨越能垒需数月至数年时间</text>
<text x="522" y="304" font-size="10.5" fill="#1e293b" text-anchor="start">• 缔合簇增大后黏度微升、挥发</text>
<text x="530" y="323" font-size="10.5" fill="#1e293b" text-anchor="start">冲劲减弱，挂杯与绵柔感倍增</text>
<text x="522" y="343" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">→ 凛冽不刺喉，一线顺入胃</text>
<rect x="18" y="368" width="724" height="78" rx="9" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="380.0" width="310" height="22" rx="11.0" fill="#e2e8f0" stroke="#0f172a" stroke-width="1" stroke-opacity="0.35"/>
<text x="187.0" y="395.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">画龙点睛：传统“勾调（以酒调酒）” ≠ 酒精勾兑</text>
<text x="356" y="396" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">纯粮固态二锅头绝不外加食用酒精或人工香精！</text>
<text x="32" y="426" font-size="11" fill="#1e293b" text-anchor="start">勾调师将不同轮次（大楂劲爽、二楂绵甜）、不同陈酿年份与微量高香调味老酒按比例拼配，让每批次“乙乳比”与风味恒定如一。</text>
</svg>
