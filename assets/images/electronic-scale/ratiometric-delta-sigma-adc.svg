<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">电子秤比率式参考消漂移原理与24位Delta-Sigma模数转换器噪声整形分辨率图</title>
<desc id="desc">左图展示电桥与ADC共用V_exc做参考电压，电池从5.00V跌至4.50V时信号与标尺同步缩水10%，5000.0克读数误差为0%；右图展示Delta-Sigma调制器将量化噪声推向高频并由数字滤波器切除，在10mV满量程与110纳伏峰峰值热噪声下提供约90909个无闪烁内码，远超商用秤3000至10000分度需求。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="433" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">电池快没电了为什么秤不飘？——“比率式消源术”与 24 位 ΔΣ 模数转换器</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：让电桥与 ADC 共用同一根电源作标尺，电压掉 10% 读数纹丝不动；右：高频过采样怎样从热噪声里捞出 2 微伏</text>
<rect x="20" y="64" width="356" height="356" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="55" y="88" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">比率式测量（Ratiometric）：借尺量尺消掉电源漂移</text>
<rect x="36" y="106" width="92" height="52" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="82" y="127" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">电池 / 稳压源</text>
<text x="82" y="145" font-size="10.2" fill="#1e293b" text-anchor="middle">V_exc (会波动)</text>
<line x1="128" y1="122" x2="166" y2="122" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<path d="M 142,122 L 142,196 L 250,196" fill="none" stroke="#1d6fa5" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<text x="144" y="190" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700">直通 V_ref!</text>
<rect x="168" y="102" width="74" height="58" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="205" y="125" font-size="10.6" fill="#18794e" text-anchor="middle" font-weight="700">惠斯通全桥</text>
<text x="205" y="144" font-size="10.0" fill="#0f172a" text-anchor="middle" class="mono">V_exc·ΔR/R</text>
<line x1="242" y1="131" x2="252" y2="131" stroke="#18794e" stroke-width="1.8"/>
<rect x="252" y="102" width="108" height="102" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="306" y="122" font-size="10.6" fill="#6d28d9" text-anchor="middle" font-weight="700">128× PGA</text>
<text x="306" y="139" font-size="10.6" fill="#6d28d9" text-anchor="middle" font-weight="700">+ 24-bit ADC</text>
<text x="306" y="158" font-size="10.0" fill="#1e293b" text-anchor="middle">输出码 D ∝</text>
<text x="306" y="176" font-size="10.4" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">V_out / V_ref</text>
<rect x="36" y="214" width="324" height="114" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="48" y="234" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">同放 5000.0 g 砝码时的实测对比：</text>
<text x="48" y="255" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="700">• 新电池 V_exc = 5.00 V：</text>
<text x="182" y="255" font-size="10.4" fill="#0f172a" text-anchor="start" class="mono">V_out=10.00 mV ÷ 5.00 V → 5000.0 g</text>
<text x="48" y="278" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">• 旧电池 V_exc = 4.50 V：</text>
<text x="182" y="278" font-size="10.4" fill="#0f172a" text-anchor="start" class="mono">V_out= 9.00 mV ÷ 4.50 V → 5000.0 g</text>
<text x="48" y="304" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">分子分母里的 V_exc 上下完美约分：D = G·(ΔR/R)·2²³，</text>
<text x="48" y="320" font-size="10.5" fill="#1e293b" text-anchor="start">电源跌落 10% 甚至带低频纹波，称重结果理论误差 0.00%！</text>
<rect x="36" y="338" width="324" height="70" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="0.9"/>
<text x="48" y="357" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">• 工业地磅进阶两招（TI TIDUAC1A / SBAA532A）：</text>
<text x="48" y="376" font-size="10.3" fill="#1e293b" text-anchor="start">  ① 六线制（+Sense/-Sense）：绕开几十米电缆铜阻压降；</text>
<text x="48" y="394" font-size="10.3" fill="#1e293b" text-anchor="start">  ② 交流方波反转激励：正反相减彻底消掉焊点微伏级热电偶电势。</text>
<rect x="388" y="64" width="352" height="356" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="84" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="406" y="88" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="423" y="88" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">24 位 ΔΣ ADC：为什么标称 1677 万格，实测约 9 万格？</text>
<rect x="414" y="114" width="304" height="126" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<line x1="448" y1="216" x2="704" y2="216" stroke="#475569" stroke-width="1.2"/>
<line x1="448" y1="216" x2="448" y2="130" stroke="#475569" stroke-width="1.2"/>
<text x="442" y="138" font-size="10.0" fill="#64748b" text-anchor="end">噪声</text>
<text x="442" y="151" font-size="10.0" fill="#64748b" text-anchor="end">密度</text>
<text x="704" y="232" font-size="10.2" fill="#64748b" text-anchor="end">频率 f →</text>
<text x="466" y="232" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">0~5 Hz 称重信号带</text>
<rect x="449" y="134" width="44" height="81" fill="#e7f6ee" opacity="0.85"/>
<line x1="493" y1="134" x2="493" y2="216" stroke="#18794e" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="450" y1="180" x2="698" y2="180" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="500" y="194" font-size="9.5" fill="#64748b" text-anchor="start">虚线：普通 ADC 平坦量化噪声</text>
<polyline points="450.0,212.0 456.1,212.0 462.3,211.8 468.4,211.6 474.6,211.3 480.8,211.0 486.9,210.5 493.1,209.9 499.2,209.2 505.4,208.4 511.5,207.5 517.6,206.5 523.8,205.5 530.0,204.3 536.1,203.0 542.2,201.5 548.4,200.0 554.5,198.4 560.7,196.7 566.9,194.8 573.0,192.9 579.1,190.8 585.3,188.6 591.5,186.3 597.6,184.0 603.8,181.4 609.9,178.8 616.0,176.1 622.2,173.2 628.4,170.3 634.5,167.2 640.6,164.0 646.8,160.7 653.0,157.3 659.1,153.7 665.2,150.1 671.4,146.3 677.5,142.4 683.7,138.4 689.9,134.2 696.0,130.0" fill="none" stroke="#6d28d9" stroke-width="2.2"/>
<text x="500" y="142" font-size="9.8" fill="#6d28d9" text-anchor="start" font-weight="700">ΔΣ 调制把噪声推往高频，</text>
<text x="500" y="156" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">数字滤波器切除高频 + 陷波 50Hz!</text>
<rect x="406" y="250" width="316" height="158" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="418" y="270" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">真实电子秤分辨率漏斗（以 TI ADS1232 10 SPS 为例）：</text>
<text x="418" y="294" font-size="10.2" fill="#1e293b" text-anchor="start">24 位理论总格数</text>
<rect x="418" y="299" width="206" height="18" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
<text x="630" y="312" font-size="10.0" fill="#475569" text-anchor="start" font-weight="700">16,777,216 格</text>
<text x="418" y="335" font-size="10.2" fill="#1e293b" text-anchor="start">10 mV 传感器实测无闪烁内码</text>
<rect x="418" y="340" width="148" height="18" rx="4" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="572" y="353" font-size="10.0" fill="#6d28d9" text-anchor="start" font-weight="700">≈ 90,909 格 (~110 nV_pp)</text>
<text x="418" y="376" font-size="10.2" fill="#1e293b" text-anchor="start">商用计价秤显示分度 (OIML III)</text>
<rect x="418" y="381" width="96" height="18" rx="4" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="520" y="394" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">3,000 ~ 10,000 格 (稳如磐石!)</text>
</svg>
