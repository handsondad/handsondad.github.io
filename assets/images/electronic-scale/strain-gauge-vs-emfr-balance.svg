<svg xmlns="http://www.w3.org/2000/svg" width="760" height="414" viewBox="0 0 760 414" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">应变片电子秤三大物理极限与电磁力平衡EMFR万分之一克分析天平闭环原理对比图</title>
<desc id="desc">左栏剖析应变片电子秤受限于金属蠕变、滞后与杨氏模量温漂，通常止步于3000至30000分度；右栏展示电磁力平衡（EMFR）分析天平通过光电零位传感器、PID伺服控制器与永磁体音圈产生安培力F=BLI将横梁严格拉回零位，通过精密测量电流实现200万分度（0.1毫克）以上的超高线性分辨率。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="413" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么厨房秤只能看清 0.1 克，实验室分析天平却能称出半根睫毛（0.0001 克）？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">当精度跨越十万分之一，金属弯曲的“蠕变与疲软”成了死穴——顶级天平干脆不让横梁弯，改用电磁力顶回零位！</text>
<rect x="20" y="64" width="326" height="336" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="78.0" width="262" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="165.0" y="93.0" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="600">路线 A · 应变片电子秤（靠弹性变形读数）</text>
<text x="34" y="118" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">适用：体重秤、快递秤、商超计价秤、厨房秤</text>
<text x="34" y="138" font-size="10.5" fill="#64748b" text-anchor="start">法定准确度：OIML III / II 级（约 3,000 ~ 30,000 分度）</text>
<rect x="34" y="156" width="298" height="72" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="0.9"/>
<text x="44" y="175" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">① 金属蠕变（Creep）</text>
<text x="44" y="193" font-size="9.8" fill="#1e293b" text-anchor="start">重物压在秤上几分钟，铝合金晶格会发生极其缓慢的滑移</text>
<text x="44" y="208" font-size="9.8" fill="#1e293b" text-anchor="start">，即便重量没变，应变片也会多拉长一点点。</text>
<text x="44" y="222" font-size="9.8" fill="#1e293b" text-anchor="start"></text>
<rect x="34" y="236" width="298" height="72" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="0.9"/>
<text x="44" y="255" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">② 机械滞后（Hysteresis）</text>
<text x="44" y="273" font-size="9.8" fill="#1e293b" text-anchor="start">从 0 加到 5 kg 再卸回 2 kg，金属卸力</text>
<text x="44" y="288" font-size="9.8" fill="#1e293b" text-anchor="start">回弹轨迹与加载轨迹不能 100% 重合，留下万分之</text>
<text x="44" y="302" font-size="9.8" fill="#1e293b" text-anchor="start">几的残余偏差。</text>
<rect x="34" y="316" width="298" height="72" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="0.9"/>
<text x="44" y="335" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">③ 杨氏模量温漂（金属受热变“软”）</text>
<text x="44" y="353" font-size="9.8" fill="#1e293b" text-anchor="start">全桥虽抵消了热胀冷缩，但温度每升 10 ℃，铝合金</text>
<text x="44" y="368" font-size="9.8" fill="#1e293b" text-anchor="start">弹性模量 E 会变软约 0.5%！高精度传感器必须</text>
<text x="44" y="382" font-size="9.8" fill="#1e293b" text-anchor="start">额外串联正温度系数镍/铜补偿电阻。</text>
<rect x="358" y="64" width="382" height="336" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="372.0" y="78.0" width="292" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="518.0" y="93.0" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">路线 B · 电磁力平衡天平 EMFR（零位移闭环）</text>
<text x="372" y="118" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">适用：万分之一克 (0.1 mg) 分析天平、微克级超微量天平</text>
<text x="372" y="138" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="600">法定准确度：OIML I 级特种准确度（200 万 ~ 2,000 万分度！）</text>
<rect x="372" y="150" width="354" height="154" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<rect x="388" y="168" width="52" height="7" rx="3" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="414" y="162" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">防风罩秤盘 mg</text>
<line x1="414" y1="175" x2="414" y2="210" stroke="#334155" stroke-width="2"/>
<line x1="414" y1="210" x2="612" y2="210" stroke="#0f172a" stroke-width="3"/>
<polygon points="448,210 441,224 455,224" fill="#64748b"/>
<text x="448" y="237" font-size="9.6" fill="#64748b" text-anchor="middle">无摩擦柔性支点</text>
<rect x="524" y="232" width="48" height="42" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.3"/>
<text x="548" y="267" font-size="9.8" fill="#475569" text-anchor="middle" font-weight="700">恒温永磁体 B</text>
<rect x="536" y="216" width="24" height="28" rx="3" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<line x1="548" y1="210" x2="548" y2="216" stroke="#0f172a" stroke-width="2"/>
<line x1="548" y1="242" x2="548" y2="220" stroke="#18794e" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="548" y="202" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="700">安培力 F=BLI</text>
<circle cx="624" cy="196" r="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<rect x="618" y="220" width="12" height="8" rx="2" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="640" y="200" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">光电零位检测器</text>
<text x="640" y="214" font-size="9.5" fill="#64748b" text-anchor="start">(偏离几纳米即报警)</text>
<rect x="626" y="240" width="88" height="52" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="670" y="258" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700">PID 伺服闭环</text>
<text x="670" y="273" font-size="10.0" fill="#0f172a" text-anchor="middle" font-weight="700">测电流 I ∝ mg</text>
<text x="670" y="286" font-size="9.3" fill="#64748b" text-anchor="middle" class="mono">0.1mg~24.5nA</text>
<path d="M 624,228 L 624,266 L 626,266" fill="none" stroke="#1d6fa5" stroke-width="1.5"/>
<path d="M 626,256 L 562,256 L 562,232" fill="none" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<rect x="372" y="314" width="354" height="74" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="384" y="334" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700">核心降维打击：把“测弯曲变形”变成“零位移测电流”！</text>
<text x="384" y="354" font-size="10.3" fill="#1e293b" text-anchor="start">• 反馈电流时刻把横梁死死拉回原位（形变 Δx → 0），从根源消除了</text>
<text x="384" y="373" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="600">  弹性体弯曲非线性和大形变蠕变，再配内置校准砝码自动消温漂！</text>
</svg>
