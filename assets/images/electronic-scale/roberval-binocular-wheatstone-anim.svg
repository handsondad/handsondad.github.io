<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">双孔平行梁罗贝瓦尔偏载不变形机理与四臂惠斯通全桥差分放大动画图</title>
<desc id="desc">左图展示双孔平行梁在偏心5千克负载下呈平行四边形S形微弯，四处薄颈T1与T2受拉、C1与C2受压，偏载弯矩转化为上下横梁水平内力偶抵消；右图展示5.000V激励下四枚350欧应变片组成惠斯通全桥，左节点升至2.505V、右节点降至2.495V，输出严格线性的+10.00毫伏差分信号并自动抵消温度漂移。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes loadDeflect {
    0% { opacity: 0.15; transform: translateY(-4px); }
    100% { opacity: 1; transform: translateY(0px); }
  }
  @keyframes pulseBridge {
    0% { stroke-dashoffset: 160; opacity: 0.35; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  .beam-loaded {
    animation: loadDeflect 2.2s cubic-bezier(0.22, 0.8, 0.26, 1) 1 forwards;
  }
  .sig-flow {
    stroke-dasharray: 160;
    stroke-dashoffset: 0;
    animation: pulseBridge 2.4s ease-out 1 forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .beam-loaded, .sig-flow {
      animation: none !important;
      transform: none !important;
      stroke-dashoffset: 0 !important;
      opacity: 1 !important;
    }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="451" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">苹果放秤盘角落为什么不偏数？—— 双孔平行梁与惠斯通全桥的四倍放大术</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左看铝合金“眼镜孔”怎样把偏载弯矩锁进上下横梁；右看 2 拉 2 压四枚应变片怎样在菱形电桥里叠加成 +10.00 mV</text>
<rect x="20" y="64" width="364" height="374" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="55" y="88" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">双孔平行梁（罗贝瓦尔机构）：只认竖直总力 F</text>
<rect x="34" y="152" width="16" height="136" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>
<line x1="34" y1="160" x2="46" y2="170" stroke="#475569" stroke-width="1"/>
