<line x1="34" y1="272" x2="46" y2="282" stroke="#475569" stroke-width="1"/>
<text x="42" y="302" font-size="10.2" fill="#475569" text-anchor="middle" font-weight="600">固定端</text>
<rect x="50" y="176" width="236" height="90" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="300" y="302" font-size="9.8" fill="#64748b" text-anchor="middle">(虚线框：空载水平位)</text>
