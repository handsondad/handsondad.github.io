<line x1="338" y1="100" x2="338" y2="114" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="326" y="113" font-size="10.4" fill="#b91c1c" text-anchor="end" font-weight="700">偏角压重物 F</text>
<rect x="108" y="171" width="28" height="6" rx="2" fill="#c25014" stroke="#7c2d12" stroke-width="0.8"/>
<text x="122" y="165" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">T1 拉(+ΔR)</text>
<rect x="108" y="265" width="28" height="6" rx="2" fill="#1d6fa5" stroke="#1e3a8a" stroke-width="0.8"/>
<text x="122" y="285" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">C1 压(-ΔR)</text>
<rect x="200" y="183" width="28" height="6" rx="2" fill="#1d6fa5" stroke="#1e3a8a" stroke-width="0.8"/>
<text x="206" y="177" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">C2 压(-ΔR)</text>
<rect x="200" y="277" width="28" height="6" rx="2" fill="#c25014" stroke="#7c2d12" stroke-width="0.8"/>
<text x="214" y="297" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">T2 拉(+ΔR)</text>
</g>
<rect x="34" y="308" width="336" height="118" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="46" y="327" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">• 为什么双孔挖空？</text>
<text x="152" y="327" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="600">把全梁弯曲精准浓缩到 4 处最薄“颈部”！</text>
<text x="46" y="349" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">• 为什么放角落不偏数？</text>
<text x="46" y="368" font-size="10.8" fill="#1e293b" text-anchor="start">  右端自由块始终平行下沉（呈平行四边形 S 变形）；偏心距</text>
<text x="46" y="386" font-size="10.8" fill="#1e293b" text-anchor="start">  产生的额外翻转力矩 M = F·e 变成上下横梁一拉一推的水平</text>
<text x="46" y="404" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">  内力偶被对称抵消，4 枚应变片总输出只取决于竖直力 F！</text>
<rect x="396" y="64" width="344" height="374" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="414" cy="84" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="414" y="88" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">2</text>
<text x="431" y="88" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">惠斯通四臂全桥：两拉两压对角排布</text>
<rect x="512.0" y="98.0" width="112" height="20" rx="10.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="568.0" y="111.6" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="600">V_exc = +5.000 V</text>
<rect x="524.0" y="294.0" width="92" height="20" rx="10.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="570.0" y="307.6" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">GND = 0.000 V</text>
