<circle cx="568" cy="288" r="4" fill="#0f172a"/>
<text x="460" y="196" font-size="10.5" fill="#18794e" text-anchor="end" font-weight="700" class="halo">V+ = 2.505 V</text>
<text x="676" y="196" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">V- = 2.495 V</text>
<rect x="512" y="187" width="112" height="38" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.5"/>
<text x="568" y="203" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700">差分输出 V_out</text>
<text x="568" y="219" font-size="11.8" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">+10.00 mV</text>
<rect x="410" y="322" width="316" height="104" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="422" y="342" font-size="11.4" fill="#18794e" text-anchor="start" font-weight="700">全桥精确公式：V_out = V_exc · (ΔR / R)</text>
<text x="422" y="363" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">① 灵敏度 ×4：比单贴 1 片应变片的 1/4 桥放大整整 4 倍；</text>
<text x="422" y="383" font-size="10.6" fill="#1e293b" text-anchor="start">② 零非线性：分母 R+ΔR+(R-ΔR) = 2R 恒定，彻底消掉弯曲项；</text>
<text x="422" y="403" font-size="10.6" fill="#1e293b" text-anchor="start">③ 温漂自消：升温让 4 臂同涨 ΔR_T，左右分压比不变，输出仍为 0！</text>
</svg>
