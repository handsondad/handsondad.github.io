<rect x="462" y="140" width="88" height="34" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="506" y="155" font-size="10.6" fill="#c25014" text-anchor="middle" font-weight="700">T1 受拉 ↑</text>
<text x="506" y="169" font-size="9.8" fill="#0f172a" text-anchor="middle" class="mono">350.70 Ω</text>
<rect x="586" y="140" width="88" height="34" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="630" y="155" font-size="10.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">C2 受压 ↓</text>
<text x="630" y="169" font-size="9.8" fill="#0f172a" text-anchor="middle" class="mono">349.30 Ω</text>
<rect x="462" y="236" width="88" height="34" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="506" y="251" font-size="10.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">C1 受压 ↓</text>
<text x="506" y="265" font-size="9.8" fill="#0f172a" text-anchor="middle" class="mono">349.30 Ω</text>
<rect x="586" y="236" width="88" height="34" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="630" y="251" font-size="10.6" fill="#c25014" text-anchor="middle" font-weight="700">T2 受拉 ↑</text>
<text x="630" y="265" font-size="9.8" fill="#0f172a" text-anchor="middle" class="mono">350.70 Ω</text>
<line x1="466" y1="206" x2="670" y2="206" stroke="#18794e" stroke-width="2.0" class="sig-flow"/>
<circle cx="466" cy="206" r="4.5" fill="#18794e"/>
<circle cx="670" cy="206" r="4.5" fill="#18794e"/>
