<path d="M 50,176 L 106,176 C 148,176 188,188 230,188 L 286,188 L 286,278 L 230,278 C 188,278 148,266 106,266 L 50,266 Z" fill="#e2e8f0" stroke="#334155" stroke-width="1.6"/>
<path d="M 126,190 A 30,30 0 1,0 126,250 L 210,262 A 30,30 0 1,0 210,202 Z" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
