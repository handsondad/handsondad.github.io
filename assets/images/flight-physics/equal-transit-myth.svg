<text x="46" y="260" font-size="11.2" fill="#b91c1c" text-anchor="start" font-weight="700">三大反例直接推翻“等时间说”：</text>
<text x="46" y="281" font-size="10.6" fill="#1e293b" text-anchor="start">1. 纸飞机与莱特兄弟薄翼上下一样长，照样飞；</text>
<text x="46" y="301" font-size="10.6" fill="#1e293b" text-anchor="start">2. 特技飞机倒扣飞行（长弧在下），靠迎角照样托住；</text>
<text x="46" y="321" font-size="10.6" fill="#1e293b" text-anchor="start">3. 按路径差算出的流速差太小，连实测升力零头都不够！</text>
