<text x="406" y="260" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">两种解释不是死对头，而是同一流场的两本账：</text>
<text x="406" y="281" font-size="10.5" fill="#1e293b" text-anchor="start">• 压强账（伯努利）：上翼面低压吸起 + 下翼面高压托起；</text>
<text x="406" y="301" font-size="10.5" fill="#1e293b" text-anchor="start">• 动量账（牛顿）：机翼把空气向下偏转 (F = ṁΔv_y)，</text>
<text x="416" y="321" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">空气反过来把机翼往上顶——数学积分严格相等！</text>
