<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">跨尺度飞行物理图谱与超声速马赫锥激波几何</title>
<desc id="desc">上方对比昆虫前缘涡、飞鸟非对称扑翼与动态翱翔、亚声速后掠翼客机及真空火箭卫星四类机制；下方精确绘制M=0.6亚声速声波前传、M=2.0超声速30度马赫锥包络与M=1跨声速波阻峰值。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="383" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">横跨七个数量级的“飞行全图谱”：从昆虫前缘涡、马赫锥到真空轨道</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">空气从“像糖浆一样黏”到“来不及让路撞出激波”，再到彻底消失——每跨一级都得换一套物理武器。</text>
<rect x="20" y="62" width="171" height="128" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="20" y="62" width="171" height="28" rx="9" fill="#f3e8ff"/>
<text x="30" y="81" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">① 昆虫悬停</text>
<text x="30" y="106" font-size="9.8" fill="#64748b" text-anchor="start" class="mono">Re ~ 10²–10⁴ | 1–5 m/s</text>
<text x="30" y="128" font-size="10.2" fill="#1e293b" text-anchor="start">空气相对像糖浆般黏稠</text>
<text x="30" y="147" font-size="10.2" fill="#1e293b" text-anchor="start">大迎角高频拍翼卷出稳定</text>
<text x="30" y="166" font-size="10.2" fill="#1e293b" text-anchor="start">【前缘涡 LEV】吸住上翼面</text>
<rect x="203" y="62" width="171" height="128" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="203" y="62" width="171" height="28" rx="9" fill="#e7f6ee"/>
<text x="213" y="81" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">② 飞鸟扑翼/滑翔</text>
<text x="213" y="106" font-size="9.8" fill="#64748b" text-anchor="start" class="mono">Re ~ 10⁴–10⁵ | 10–25 m/s</text>
<text x="213" y="128" font-size="10.2" fill="#1e293b" text-anchor="start">下拍展羽同时造升力+推力</text>
<text x="213" y="147" font-size="10.2" fill="#1e293b" text-anchor="start">上抬折翼漏气减小负功</text>
<text x="213" y="166" font-size="10.2" fill="#1e293b" text-anchor="start">信天翁借海面风切变白嫖能量</text>
<rect x="386" y="62" width="171" height="128" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="386" y="62" width="171" height="28" rx="9" fill="#eaf4fb"/>
<text x="396" y="81" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">③ 亚/跨声速客机</text>
<text x="396" y="106" font-size="9.8" fill="#64748b" text-anchor="start" class="mono">M ≈ 0.80–0.85 | ~870 km/h</text>
<text x="396" y="128" font-size="10.2" fill="#1e293b" text-anchor="start">贴体流线 + 30°–35° 后掠翼</text>
<text x="396" y="147" font-size="10.2" fill="#1e293b" text-anchor="start">推迟机翼局部激波暴涨</text>
<text x="396" y="166" font-size="10.2" fill="#1e293b" text-anchor="start">兼顾高巡航速度与低波阻</text>
<rect x="569" y="62" width="171" height="128" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="569" y="62" width="171" height="28" rx="9" fill="#fef1e8"/>
<text x="579" y="81" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">④ 真空火箭与卫星</text>
<text x="579" y="106" font-size="9.8" fill="#64748b" text-anchor="start" class="mono">ρ → 0 | v ≥ 7.9 km/s</text>
<text x="579" y="128" font-size="10.2" fill="#1e293b" text-anchor="start">无空气 → 机翼升力归零</text>
<text x="579" y="147" font-size="10.2" fill="#1e293b" text-anchor="start">火箭自带氧化剂向后喷气推进</text>
<text x="579" y="166" font-size="10.2" fill="#1e293b" text-anchor="start">入轨后关机靠万有引力自由落体</text>
<rect x="20" y="202" width="720" height="168" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="225" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">⑤ 为什么会有“声障”与音爆？声波跑不过飞机时，叠出 sin μ = 1/M 的马赫锥！</text>
<text x="124" y="248" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="600">亚声速 (M=0.6)：声波超前报信</text>
<circle cx="129.6" cy="301.0" r="14.0" fill="none" stroke="#93c5fd" stroke-width="1.3"/>
<circle cx="121.2" cy="301.0" r="28.0" fill="none" stroke="#93c5fd" stroke-width="1.3"/>
<circle cx="112.8" cy="301.0" r="42.0" fill="none" stroke="#93c5fd" stroke-width="1.3"/>
<circle cx="138.0" cy="301.0" r="4.0" fill="#1d6fa5"/>
<text x="124" y="359" font-size="10.1" fill="#475569" text-anchor="middle">前方空气提前让路，无激波</text>
<line x1="226" y1="238" x2="226" y2="360" stroke="#e2e8f0" stroke-width="1"/>
<text x="350" y="248" font-size="10.4" fill="#b91c1c" text-anchor="middle" font-weight="700">超声速 (M=2.0)：把声波甩在身后</text>
<circle cx="413.0" cy="301.0" r="9.5" fill="none" stroke="#fca5a5" stroke-width="1.3"/>
<circle cx="413.0" cy="301.0" r="1.8" fill="#64748b"/>
<circle cx="394.0" cy="301.0" r="19.0" fill="none" stroke="#fca5a5" stroke-width="1.3"/>
<circle cx="394.0" cy="301.0" r="1.8" fill="#64748b"/>
<circle cx="375.0" cy="301.0" r="28.5" fill="none" stroke="#fca5a5" stroke-width="1.3"/>
<circle cx="375.0" cy="301.0" r="1.8" fill="#64748b"/>
<circle cx="356.0" cy="301.0" r="38.0" fill="none" stroke="#fca5a5" stroke-width="1.3"/>
<circle cx="356.0" cy="301.0" r="1.8" fill="#64748b"/>
<line x1="432.0" y1="301.0" x2="355.8" y2="257.0" stroke="#b91c1c" stroke-width="2.2"/>
<line x1="432.0" y1="301.0" x2="355.8" y2="345.0" stroke="#b91c1c" stroke-width="2.2"/>
<line x1="338.0" y1="301.0" x2="446.0" y2="301.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3"/>
<polygon points="438.0,301.0 423.0,296.5 423.0,305.5" fill="#b91c1c"/>
<text x="378.0" y="293.0" font-size="10.2" fill="#b91c1c" text-anchor="start" font-weight="700" class="halo">μ = 30°</text>
<text x="350" y="359" font-size="10.1" fill="#b91c1c" text-anchor="middle" font-weight="600">sin μ = a/v = 1/M（激波扫地即音爆！）</text>
<line x1="474" y1="238" x2="474" y2="360" stroke="#e2e8f0" stroke-width="1"/>
<text x="606" y="250" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">跨声速波阻墙 (M ≈ 0.8–1.2)</text>
<line x1="508.0" y1="262.0" x2="508.0" y2="324.0" stroke="#475569" stroke-width="1.2"/>
<line x1="508.0" y1="324.0" x2="710.0" y2="324.0" stroke="#475569" stroke-width="1.2"/>
<line x1="599.8" y1="262.0" x2="599.8" y2="324.0" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="599.8" y="337.0" font-size="9.6" fill="#b91c1c" text-anchor="middle" font-weight="700" class="mono">M = 1</text>
<text x="526.0" y="337.0" font-size="9.5" fill="#64748b" text-anchor="middle" class="mono">0.4</text>
<text x="696.0" y="337.0" font-size="9.5" fill="#64748b" text-anchor="middle" class="mono">2.0</text>
<polyline points="526.4,310.4 529.5,310.4 532.6,310.4 535.7,310.4 538.8,310.4 541.9,310.4 545.0,310.4 548.2,310.4 551.3,310.4 554.4,310.3 557.5,310.3 560.6,310.2 563.7,310.0 566.8,309.7 569.9,309.0 573.1,307.8 576.2,305.8 579.3,302.9 582.4,298.7 585.5,293.2 588.6,286.8 591.7,280.0 594.8,273.7 598.0,268.7 601.1,266.1 604.2,266.1 607.3,264.5 610.4,264.5 613.5,264.5 616.6,272.0 619.7,279.4 622.9,285.6 626.0,290.5 629.1,294.1 632.2,296.6 635.3,298.3 638.4,299.4 641.5,300.1 644.6,300.7 647.8,301.1 650.9,301.4 654.0,301.7 657.1,302.0 660.2,302.3 663.3,302.5 666.4,302.7 669.5,302.9 672.7,303.1 675.8,303.3 678.9,303.5 682.0,303.6 685.1,303.8 688.2,303.9 691.3,304.1 694.4,304.2 697.6,304.3 700.7,304.4 703.8,304.6 706.9,304.7 710.0,304.8" fill="none" stroke="#c25014" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="502.0" y="297.0" font-size="9.6" fill="#1e293b" text-anchor="end" font-weight="600" class="mono">C_D</text>
<text x="611.8" y="276.0" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="700" class="halo">激波暴增！</text>
<text x="606" y="358" font-size="10.1" fill="#475569" text-anchor="middle">尖头 + 后掠翼专治这道阻力峰</text>
</svg>
