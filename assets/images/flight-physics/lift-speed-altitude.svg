<rect x="0.5" y="0.5" width="759" height="367" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">升力公式 L = ½ρv²SC_L 实战账本：为什么起飞要放襟翼，巡航要爬上万米高空？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">以 260 吨宽体客机（翼面积 440 m²，重力 W ≈ 255 万牛）精确计算二次方升力曲线与万米减阻收益。</text>
