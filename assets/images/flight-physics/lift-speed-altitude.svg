<text x="159.5" y="173.7" font-size="10.2" fill="#18794e" text-anchor="end" font-weight="700" class="halo">放襟翼 257</text>
<text x="219.2" y="199.7" font-size="10.1" fill="#c25014" text-anchor="start" font-weight="700" class="halo">光洁翼 392</text>
<text x="371.4" y="199.7" font-size="10.2" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">巡航 866 km/h</text>
<text x="118" y="224" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="600" class="halo">海平面+放襟翼</text>
<text x="292" y="254" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="600" class="halo">11 km 平流层底 (ρ≈0.30ρ₀)</text>
<rect x="444" y="62" width="296" height="292" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="458" y="85" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="700">② 襟翼变形记 &amp; 万米高空省油账</text>
<rect x="458" y="100" width="268" height="108" rx="8" fill="#e7f6ee" stroke="#bbf7d0" stroke-width="1"/>
<text x="468" y="120" font-size="11.0" fill="#18794e" text-anchor="start" font-weight="700">起降慢飞：伸出前缘缝翼 + 后缘襟翼</text>
<text x="468" y="140" font-size="10.4" fill="#1e293b" text-anchor="start">• 机翼面积 S 扩大 (440 → 510 m²)，弯度暴增</text>
<text x="468" y="159" font-size="10.4" fill="#1e293b" text-anchor="start">• 升力系数 C_L 翻倍 (0.80 → 1.60)</text>
<text x="468" y="178" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="600">• 离地速度从 392 降到 257 km/h，跑道够用！</text>
<text x="468" y="197" font-size="10.0" fill="#64748b" text-anchor="start">（代价：阻力也大，起飞爬升后必须收回）</text>
<rect x="458" y="218" width="268" height="124" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="468" y="238" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="700">巡航快飞：同以 866 km/h 飞，阻力差多少？</text>
<text x="468" y="262" font-size="10.2" fill="#475569" text-anchor="start">海平面硬飞</text>
<rect x="532" y="251" width="130.0" height="13" rx="4" fill="#c25014"/>
<text x="668.0" y="262" font-size="10.2" fill="#c25014" text-anchor="start" font-weight="700" class="mono">265 kN</text>
<text x="468" y="285" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="600">11 km 高空</text>
<rect x="532" y="274" width="38.6" height="13" rx="4" fill="#1d6fa5"/>
<text x="576.6" y="285" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">79 kN (-70%!)</text>
<text x="468" y="310" font-size="10.3" fill="#1e293b" text-anchor="start">• 万米空气密度 ρ 仅海平面的 30%，废阻砍掉七成</text>
<text x="468" y="329" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="600">• 用高速度 v² 补回稀薄 ρ，既快又省燃油！</text>
</svg>
