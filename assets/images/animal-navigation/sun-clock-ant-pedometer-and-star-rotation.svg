<svg xmlns="http://www.w3.org/2000/svg" width="760" height="544" viewBox="0 0 760 544" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">帝王蝶触角生物钟太阳罗盘、撒哈拉沙漠蚂蚁高跷计步器与靛蓝彩鹀天象仪星空旋转轴三大经典实验图解</title>
<desc id="desc">左图展示帝王蝶触角生物钟以每小时15度补偿太阳视运动、拨慢6小时导致航向偏转90度；中图按实测数据绘制沙漠蚂蚁正常腿10.20米、高跷腿15.30米与短腿5.75米的步幅积分结果；右图展示天象仪绕参宿四假轴旋转证明夜迁鸣禽通过学习星空旋转中心建立恒星罗盘。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="543" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二、白天看太阳数步子，夜里看星星转圈：三大经典行为实验</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">帝王蝶触角时钟拨慢 6 小时偏航 90°；沙漠蚂蚁踩高跷跑过头 50%；靛蓝彩鹀认旋转轴不认星座</text>
<rect x="20" y="64" width="232" height="464" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="74.0" width="208" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="136.0" y="89.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">A · 帝王蝶触角生物钟罗盘</text>
<path d="M44,198 A92,76 0 0,1 228,198" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="5 3"/>
<circle cx="54" cy="184" r="8" fill="#fde047" stroke="#d97706" stroke-width="1.2"/>
<text x="54" y="171" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">早 6:00 (东)</text>
<circle cx="136" cy="122" r="8" fill="#fde047" stroke="#d97706" stroke-width="1.2"/>
<text x="136" y="109" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">午 12:00 (南)</text>
<circle cx="218" cy="184" r="8" fill="#fde047" stroke="#d97706" stroke-width="1.2"/>
<text x="218" y="171" font-size="10.5" fill="#b45309" text-anchor="middle" font-weight="600">晚 18:00 (西)</text>
<text x="136" y="166" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">太阳每小时横移 ≈ 15°</text>
<line x1="136" y1="176" x2="136" y2="226" stroke="#18794e" stroke-width="2.2" marker-end="url(#arr-green)"/>
<text x="136" y="242" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">正常触角时钟 → 始终飞正南</text>
<rect x="32" y="258" width="208" height="254" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="42" y="280" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">为什么只看太阳会迷路？</text>
<text x="42" y="301" font-size="11.5" fill="#1e293b" text-anchor="start">早上太阳在东，傍晚在西；若死朝</text>
<text x="42" y="320" font-size="11.5" fill="#1e293b" text-anchor="start">太阳飞，一天会画个大弯钩！</text>
<text x="42" y="344" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">Merlin 等 (2009 Science)：</text>
<text x="42" y="365" font-size="11.5" fill="#1e293b" text-anchor="start">• 计时器居然装在两根触角里！</text>
<text x="42" y="386" font-size="11.5" fill="#1e293b" text-anchor="start">• 把光照生物钟人为推迟 6 小时：</text>
<text x="42" y="408" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">  6 h × 15°/h ＝ 航向偏转 90°！</text>
<text x="42" y="432" font-size="11.5" fill="#1e293b" text-anchor="start">• 涂黑触角（阻断触角采光校时）</text>
<text x="42" y="451" font-size="11.5" fill="#1e293b" text-anchor="start">  蝴蝶立刻丧失集体定向；涂透明</text>
<text x="42" y="470" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">  漆对照组则精准向南飞往墨西哥</text>
<rect x="264" y="64" width="232" height="464" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="276.0" y="74.0" width="208" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="89.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">B · 沙漠蚂蚁“高跷计步器”</text>
<line x1="397.8" y1="112" x2="397.8" y2="246" stroke="#18794e" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="397.8" y="108" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">真巢穴 (10.0 m)</text>
<text x="286" y="124" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">正常腿对照</text>
<rect x="286.0" y="128" width="114.0" height="12" rx="6" fill="#18794e"/>
<text x="290.0" y="152" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">10.20 m 停下找家</text>
<text x="286" y="166" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">绑猪鬃高跷</text>
<rect x="286.0" y="170" width="171.0" height="12" rx="6" fill="#c25014"/>
<text x="290.0" y="194" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">15.30 m (+50% 跑过头!)</text>
<text x="286" y="208" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">剪短小短腿</text>
<rect x="286.0" y="212" width="64.3" height="12" rx="6" fill="#6d28d9"/>
<text x="290.0" y="236" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="700">5.75 m (−44% 提前找!)</text>
<rect x="276" y="258" width="208" height="254" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="286" y="280" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">撒哈拉银蚁/箭蚁的绝境难题：</text>
<text x="286" y="301" font-size="11.5" fill="#1e293b" text-anchor="start">60°C 沙面烫到留不下信息素气味，</text>
<text x="286" y="320" font-size="11.5" fill="#1e293b" text-anchor="start">外出蜿蜒觅食却能走直线秒回巢！</text>
<text x="286" y="344" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">Wittlinger 等 (2006 Science)：</text>
<text x="286" y="365" font-size="11.5" fill="#1e293b" text-anchor="start">• 复眼看天空紫外偏振光定方向；</text>
<text x="286" y="386" font-size="11.5" fill="#1e293b" text-anchor="start">• 到食物点抓起蚂蚁粘上 1 mm 猪</text>
<text x="286" y="405" font-size="11.5" fill="#1e293b" text-anchor="start">  鬃高跷：步数照数，步幅变大，</text>
<text x="286" y="424" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">  结果精准冲过头 5.1 米才打转！</text>
<text x="286" y="448" font-size="11.5" fill="#1e293b" text-anchor="start">• 放回巢重走一趟全程穿高跷：</text>
<text x="286" y="468" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">  去程回程步幅抵消，又精准命中！</text>
<rect x="508" y="64" width="232" height="464" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="520.0" y="74.0" width="208" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="624.0" y="89.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">C · 天象仪反转星空实验</text>
<circle cx="570" cy="166" r="44" fill="#0f172a" stroke="#18794e" stroke-width="1.5"/>
<circle cx="570" cy="154" r="14" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="570" cy="154" r="26" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="570" cy="154" r="3.2" fill="#fde047"/>
<line x1="570" y1="162" x2="570" y2="200" stroke="#18794e" stroke-width="2.2"/>
<text x="570" y="114" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">真转轴：北极星</text>
<text x="570" y="224" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">向正南跳!</text>
<circle cx="678" cy="166" r="44" fill="#0f172a" stroke="#b91c1c" stroke-width="1.5"/>
<circle cx="678" cy="154" r="14" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 2"/>
<circle cx="678" cy="154" r="26" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="678" cy="154" r="3.2" fill="#fde047"/>
<line x1="678" y1="162" x2="678" y2="200" stroke="#b91c1c" stroke-width="2.2"/>
<text x="678" y="114" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">假转轴：参宿四</text>
<text x="678" y="224" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="700">背离参宿四跳!</text>
<rect x="520" y="258" width="208" height="254" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="530" y="280" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">小鸟基因里写死了北斗七星吗？</text>
<text x="530" y="301" font-size="11.5" fill="#1e293b" text-anchor="start">地球自转轴每 2.58 万年岁差一圈，</text>
<text x="530" y="320" font-size="11.5" fill="#1e293b" text-anchor="start">一万年前北极根本不是北极星！</text>
<text x="530" y="344" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">Emlen (1970 Science) 漏斗实验：</text>
<text x="530" y="365" font-size="11.5" fill="#1e293b" text-anchor="start">• 把幼年靛蓝彩鹀养在人工天象仪</text>
<text x="530" y="384" font-size="11.5" fill="#1e293b" text-anchor="start">  下，让满天星绕猎户座“参宿四”转</text>
<text x="530" y="406" font-size="11.5" fill="#1e293b" text-anchor="start">• 秋季迁徙夜脚印统计：幼鸟把参</text>
<text x="530" y="425" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">  宿四当成“北方”，集体背着它跳！</text>
<text x="530" y="449" font-size="11.5" fill="#1e293b" text-anchor="start">• 基因没存星图，只存了一句算法：</text>
<text x="530" y="469" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  “盯着夜空不动的圆心，那就是北！”</text>
</svg>
