<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">动物迁徙极限纪录对比与克拉默地图加罗盘双步导航原理图解</title>
<desc id="desc">左图对比北极燕鸥年均70900公里、斑尾塍鹬B6幼鸟13560公里11天不落地跨海飞行、E7雌鸟11680公里及帝王蝶4000公里四代接力纪录；右图拆解定位自身坐标的生理地图与保持航向的太阳、偏振光、星空和地磁多重罗盘。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="535" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、没有地图和卫星，动物凭什么横跨半个地球不迷路？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图对比卫星实测迁徙纪录；右图拆解克拉默“地图（我在哪）+ 罗盘（往哪飞）”双步导航架构</text>
<rect x="20" y="64" width="368" height="456" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="310" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="189.0" y="89.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 实测迁徙极限纪录（无手机、无路标）</text>
<rect x="34" y="108" width="340" height="88" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="46" y="129" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">北极燕鸥 (1.4g 定位器)</text>
<rect x="46" y="137" width="314" height="14" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="46" y="137" width="314.0" height="14" rx="7" fill="#1d6fa5" fill-opacity="0.82"/>
<text x="46" y="169" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">年均 70,900 km（最高 81,600 km）</text>
<text x="46" y="188" font-size="11" fill="#1e293b" text-anchor="start">格陵兰↔南极往返；一生超 240 万 km ≈ 往返月球 3 趟</text>
<rect x="34" y="208" width="340" height="88" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="46" y="229" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">斑尾塍鹬 B6 幼鸟 (2022)</text>
<rect x="46" y="237" width="314" height="14" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="46" y="237" width="238.6" height="14" rx="7" fill="#c25014" fill-opacity="0.82"/>
<text x="46" y="269" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">单程不落地 13,560 km / 11 天</text>
<text x="46" y="288" font-size="11" fill="#1e293b" text-anchor="start">阿拉斯加直飞塔斯马尼亚，11 昼夜不进食不落水休息</text>
<rect x="34" y="308" width="340" height="88" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="46" y="329" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">斑尾塍鹬 E7 雌鸟 (2007)</text>
<rect x="46" y="337" width="314" height="14" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="46" y="337" width="213.5" height="14" rx="7" fill="#b45309" fill-opacity="0.82"/>
<text x="46" y="369" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">单程不落地 11,680 km / 8.1 天</text>
<text x="46" y="388" font-size="11" fill="#1e293b" text-anchor="start">跨太平洋直抵新西兰河口（Gill 等 2009 实测）</text>
<rect x="34" y="408" width="340" height="88" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="46" y="429" font-size="12" fill="#6d28d9" text-anchor="start" font-weight="700">帝王蝶 (体重仅约 0.5 g)</text>
<rect x="46" y="437" width="314" height="14" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="46" y="437" width="138.2" height="14" rx="7" fill="#6d28d9" fill-opacity="0.82"/>
<text x="46" y="469" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">跨四代接力 4,000 km</text>
<text x="46" y="488" font-size="11" fill="#1e293b" text-anchor="start">曾孙代从未去过墨西哥，却精准停回同一片冷杉林</text>
<rect x="400" y="64" width="340" height="456" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="414.0" y="74.0" width="312" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="570.0" y="89.0" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">B · 克拉默“地图 + 罗盘”真导航两步法</text>
<rect x="414" y="108" width="312" height="134" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<circle cx="432" cy="128" r="10.5" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
<text x="432" y="132" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">1</text>
<text x="450" y="132" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">第一步：生理“地图”（回答：我现在在哪？）</text>
<text x="426" y="156" font-size="11.5" fill="#1e293b" text-anchor="start">• 把成年候鸟或海龟装进黑箱，横向搬偏 500 km；</text>
<text x="426" y="177" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">• 若只有“往南飞”罗盘 → 会平行飞错 500 km！</text>
<text x="426" y="198" font-size="11.5" fill="#1e293b" text-anchor="start">• 成年个体却能修正航向直奔终点，靠的是：</text>
<text x="426" y="219" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  地磁双坐标（倾角+强度）、气味羽流、次声波等</text>
<line x1="570" y1="244" x2="570" y2="268" stroke="#18794e" stroke-width="2" marker-end="url(#arr-green)"/>
<rect x="414" y="272" width="312" height="134" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<circle cx="432" cy="292" r="10.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="432" y="296" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="450" y="296" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">第二步：多重“罗盘”（回答：该朝哪边飞？）</text>
<text x="426" y="320" font-size="11.5" fill="#1e293b" text-anchor="start">• 算出目标方位后，用随身罗盘保持航向不跑偏：</text>
<text x="426" y="341" font-size="11.5" fill="#1e293b" text-anchor="start">  ① 白天：太阳罗盘（配合触角/脑生物钟补偿）</text>
<text x="426" y="362" font-size="11.5" fill="#1e293b" text-anchor="start">  ② 阴天：天空紫外偏振光条纹（昆虫/鸟类可见）</text>
<text x="426" y="383" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  ③ 夜晚/全天候：星空旋转中心 + 视网膜地磁罗盘</text>
<rect x="414" y="418" width="312" height="88" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1"/>
<text x="426" y="439" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">经典搬家实验铁证（Perdeck 1958 欧椋鸟）：</text>
<text x="426" y="461" font-size="11.5" fill="#1e293b" text-anchor="start">• 首飞幼鸟只带先天“方向+时间表”（向量导航）→飞偏；</text>
<text x="426" y="482" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">• 历练过的成鸟已建成“双坐标地图”→拐弯精准归巢！</text>
</svg>
