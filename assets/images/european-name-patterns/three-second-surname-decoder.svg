<svg xmlns="http://www.w3.org/2000/svg" width="760" height="518" viewBox="0 0 760 518" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">三秒识别陌生欧洲人名来源国的四步漏斗与三大反例警示图</title>
<desc id="desc">按实战顺序分四步拆解欧洲姓名：①扫视þ/ð、ø/æ、ł、ř、ő/ű、ș/ț、ß等国家特征字母；②检查俄罗斯三段父称、西葡双姓镜像顺序、荷比van大小写及匈牙利姓前名后语序；③核对-ić、-escu、-nen、-opoulos、-aitė等词尾印章；④结合现代移民（如伊布）、边疆交错带（如意大利德语区的辛纳）与王室联姻改姓（如温莎王朝）区分语言祖源与现国籍。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="517" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<defs><marker id="en-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1d6fa5"/></marker><marker id="en-arr-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#c25014"/></marker><marker id="en-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#18794e"/></marker><marker id="en-arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6d28d9"/></marker></defs>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">实战速查卡：拿到一个陌生欧洲人名，3 秒钟破译出处的四步漏斗</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先抓“一票锁定”的独占特殊字母，再看结构与词尾印章，最后用反例滤镜排除移民与边疆干扰。</text>
<rect x="20" y="64" width="720" height="122" rx="9" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.4"/>
<circle cx="38" cy="84" r="11" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="11.4" fill="#1d6fa5" text-anchor="start" font-weight="700">第 1 步｜扫特殊字母与变音符（最快“一剑封喉”，直接缩到 1–2 国）</text>
<rect x="32" y="100" width="168" height="34" rx="6" fill="#eaf4fb" stroke="none" stroke-width="1"/>
<text x="40" y="114" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="700">þ · ð</text>
<text x="40" y="128" font-size="9.2" fill="#0f172a" text-anchor="start">冰岛（þ 国家级独占）</text>
<rect x="208" y="100" width="168" height="34" rx="6" fill="#eaf4fb" stroke="none" stroke-width="1"/>
<text x="216" y="114" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="700">ø · æ</text>
<text x="216" y="128" font-size="9.2" fill="#0f172a" text-anchor="start">丹麦 / 挪威（Ødegaard）</text>
<rect x="384" y="100" width="168" height="34" rx="6" fill="#f3e8ff" stroke="none" stroke-width="1"/>
<text x="392" y="114" font-size="10.0" fill="#6d28d9" text-anchor="start" font-weight="700">ł · ą · ę · ń · ś · ż</text>
<text x="392" y="128" font-size="9.2" fill="#0f172a" text-anchor="start">波兰（Świątek）</text>
<rect x="560" y="100" width="168" height="34" rx="6" fill="#f3e8ff" stroke="none" stroke-width="1"/>
<text x="568" y="114" font-size="10.0" fill="#6d28d9" text-anchor="start" font-weight="700">ř · ů</text>
<text x="568" y="128" font-size="9.2" fill="#0f172a" text-anchor="start">捷克（Dvořák 独有 ř）</text>
<rect x="32" y="142" width="168" height="34" rx="6" fill="#e7f6ee" stroke="none" stroke-width="1"/>
<text x="40" y="156" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">ő · ű + sz · cs · gy</text>
<text x="40" y="170" font-size="9.2" fill="#0f172a" text-anchor="start">匈牙利（双长音符 Erdős）</text>
<rect x="208" y="142" width="168" height="34" rx="6" fill="#fef1e8" stroke="none" stroke-width="1"/>
<text x="216" y="156" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="700">ș · ț · ă</text>
<text x="216" y="170" font-size="9.2" fill="#0f172a" text-anchor="start">罗马尼亚（Ceaușescu）</text>
<rect x="384" y="142" width="168" height="34" rx="6" fill="#f1f5f9" stroke="none" stroke-width="1"/>
<text x="392" y="156" font-size="10.0" fill="#475569" text-anchor="start" font-weight="700">ß / å</text>
<text x="392" y="170" font-size="9.2" fill="#0f172a" text-anchor="start">ß 德奥 ｜ å 瑞/挪/丹</text>
<rect x="560" y="142" width="168" height="34" rx="6" fill="#fef1e8" stroke="none" stroke-width="1"/>
<text x="568" y="156" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="700">ñ / ã · õ / ğ · ı</text>
<text x="568" y="170" font-size="9.2" fill="#0f172a" text-anchor="start">ñ 西 ｜ ã 葡 ｜ ğ 土耳其</text>
<line x1="196.0" y1="186.0" x2="196.0" y2="200.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#en-arr-p)"/>
<line x1="564.0" y1="186.0" x2="564.0" y2="200.0" stroke="#18794e" stroke-width="1.6" marker-end="url(#en-arr-g)"/>
<rect x="20" y="202" width="352" height="140" rx="9" fill="#ffffff" stroke="#6d28d9" stroke-width="1.3"/>
<circle cx="38" cy="222" r="11" fill="#6d28d9" stroke="#ffffff" stroke-width="1.2"/>
<text x="38" y="226" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="56" y="226" font-size="11.2" fill="#6d28d9" text-anchor="start" font-weight="700">第 2 步｜看名字段数、大小写与语序</text>
<text x="32" y="250" font-size="9.6" fill="#0f172a" text-anchor="start">• 三段式含 -ovich / -ovna → 俄罗斯 / 白俄罗斯</text>
<text x="32" y="272" font-size="9.6" fill="#0f172a" text-anchor="start">• 双姓【父+母】→ 西班牙；【母+父(常夹dos/da)】→ 葡萄牙</text>
<text x="32" y="294" font-size="9.6" fill="#0f172a" text-anchor="start">• 连名小写 van / van der → 荷兰；大写 Van / De → 比利时</text>
<text x="32" y="316" font-size="9.6" fill="#0f172a" text-anchor="start">• 本土文本把家族姓放第 1 词 → 匈牙利（如 Liszt Ferenc）</text>
<rect x="388" y="202" width="352" height="140" rx="9" fill="#ffffff" stroke="#18794e" stroke-width="1.3"/>
<circle cx="406" cy="222" r="11" fill="#18794e" stroke="#ffffff" stroke-width="1.2"/>
<text x="406" y="226" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="424" y="226" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">第 3 步｜对词尾高频“家族印章”</text>
<text x="400" y="250" font-size="9.6" fill="#0f172a" text-anchor="start">• -ić / -vić → 克罗地亚/塞尔维亚/波黑 ｜ -escu → 罗马尼亚</text>
<text x="400" y="272" font-size="9.6" fill="#0f172a" text-anchor="start">• -nen / -lä → 芬兰 ｜ -sen → 丹/挪 ｜ -sson → 瑞典</text>
<text x="400" y="294" font-size="9.6" fill="#0f172a" text-anchor="start">• -as / -is / -aitė / -ienė → 立陶宛 ｜ 词尾全挂 -s → 拉脱维亚</text>
<text x="400" y="316" font-size="9.6" fill="#0f172a" text-anchor="start">• -opoulos / -akis / -idis → 希腊 ｜ -ashvili / -adze → 格鲁吉亚</text>
<line x1="380.0" y1="342.0" x2="380.0" y2="356.0" stroke="#c25014" stroke-width="1.8" marker-end="url(#en-arr-o)"/>
<rect x="20" y="358" width="720" height="146" rx="9" fill="#fffaf5" stroke="#c25014" stroke-width="1.5"/>
<circle cx="38" cy="378" r="11" fill="#c25014" stroke="#ffffff" stroke-width="1.2"/>
<text x="38" y="382" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="56" y="382" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">第 4 步｜必做防坑校验：记住“姓氏语言学祖源 ≠ 当事人现持护照”三大反例！</text>
<rect x="32" y="396" width="224" height="96" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="415" font-size="9.8" fill="#9f1239" text-anchor="start" font-weight="700">反例 A · 现代移民与球星二代</text>
<text x="42" y="434.0" font-size="9.1" fill="#0f172a" text-anchor="start">伊布 Ibrahimović 词尾是典型前南 -ić，</text>
<text x="42" y="449.5" font-size="9.1" fill="#0f172a" text-anchor="start">但生于马尔默、代表瑞典出战；</text>
<text x="42" y="465.0" font-size="9.1" fill="#0f172a" text-anchor="start">姆巴佩 Mbappé、齐达内 Zidane</text>
<text x="42" y="480.5" font-size="9.1" fill="#0f172a" text-anchor="start">则折射出法国多元移民史。</text>
<rect x="268" y="396" width="224" height="96" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="278" y="415" font-size="9.8" fill="#9f1239" text-anchor="start" font-weight="700">反例 B · 千年历史边疆交错带</text>
<text x="278" y="434.0" font-size="9.1" fill="#0f172a" text-anchor="start">法国球星格列兹曼 Griezmann</text>
<text x="278" y="449.5" font-size="9.1" fill="#0f172a" text-anchor="start">来自法德交界的阿尔萨斯；</text>
<text x="278" y="465.0" font-size="9.1" fill="#0f172a" text-anchor="start">意大利网球名将 Jannik Sinner</text>
<text x="278" y="480.5" font-size="9.1" fill="#0f172a" text-anchor="start">生于意北德语区南蒂罗尔！</text>
<rect x="504" y="396" width="224" height="96" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="514" y="415" font-size="9.8" fill="#9f1239" text-anchor="start" font-weight="700">反例 C · 跨国联姻与王室改姓</text>
<text x="514" y="434.0" font-size="9.1" fill="#0f172a" text-anchor="start">居里夫人 Skłodowska-Curie</text>
<text x="514" y="449.5" font-size="9.1" fill="#0f172a" text-anchor="start">用连字符拼起波兰娘家与法国夫姓；</text>
<text x="514" y="465.0" font-size="9.1" fill="#0f172a" text-anchor="start">英国王室 1917 年弃用德国旧姓，</text>
<text x="514" y="480.5" font-size="9.1" fill="#0f172a" text-anchor="start">直接改姓英伦地名 Windsor（温莎）！</text>
</svg>
