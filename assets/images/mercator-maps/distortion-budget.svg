<svg xmlns="http://www.w3.org/2000/svg" width="720" height="997" viewBox="0 0 720 997" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">墨卡托投影的局部长度和面积失真</title><desc id="desc">三个同样大小的地面小圆分别在0、30、60度纬度，图上半径按正割纬度放大，面积倍率为长度倍率的平方。这是微小区域的局部近似，不是有限国家轮廓。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="997" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">③ 形状保住了，面积却付出了代价</text><text x="36" y="92" font-size="23" fill="#172b45" text-anchor="start">同样的地面小圆，在不同纬度的局部放大倍数</text><rect x="24" y="122" width="672" height="214" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><circle cx="162.000" cy="228.000" r="28.000" fill="#ddecf3" stroke="#176786" stroke-width="3"/><path d="M134.000,228.000 L190.000,228.000" fill="none" stroke="#176786" stroke-width="3"/><text x="260" y="177" font-size="26" fill="#172b45" text-anchor="start">纬度 0°</text><text x="260" y="227" font-size="24" fill="#176786" text-anchor="start">长度倍率  k = 1.000</text><text x="260" y="274" font-size="24" fill="#b34039" text-anchor="start">面积倍率  k² = 1.000</text><rect x="24" y="358" width="672" height="214" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><circle cx="162.000" cy="464.000" r="32.332" fill="#ddecf3" stroke="#176786" stroke-width="3"/><path d="M129.668,464.000 L194.332,464.000" fill="none" stroke="#176786" stroke-width="3"/><text x="260" y="413" font-size="26" fill="#172b45" text-anchor="start">纬度 30°</text><text x="260" y="463" font-size="24" fill="#176786" text-anchor="start">长度倍率  k = 1.155</text><text x="260" y="510" font-size="24" fill="#b34039" text-anchor="start">面积倍率  k² = 1.333</text><rect x="24" y="594" width="672" height="214" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><circle cx="162.000" cy="700.000" r="56.000" fill="#ddecf3" stroke="#176786" stroke-width="3"/><path d="M106.000,700.000 L218.000,700.000" fill="none" stroke="#176786" stroke-width="3"/><text x="260" y="649" font-size="26" fill="#172b45" text-anchor="start">纬度 60°</text><text x="260" y="699" font-size="24" fill="#176786" text-anchor="start">长度倍率  k = 2.000</text><text x="260" y="746" font-size="24" fill="#b34039" text-anchor="start">面积倍率  k² = 4.000</text><text x="36" y="881" font-size="23" fill="#172b45" text-anchor="start">在 60°：横向 ×2，纵向 ×2，面积就是 ×4。</text><text x="36" y="920" font-size="23" fill="#172b45" text-anchor="start">小圆仍是圆，但它不再代表相同的纸上面积。</text><text x="36" y="959" font-size="22" fill="#172b45" text-anchor="start">局部极限示意；不是把整个国家统一缩放。</text></svg>
