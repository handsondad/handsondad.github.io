<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1327.5" viewBox="0 0 540 1327.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">同一个地面小圆的拉伸与两种经纬网</title><desc id="desc">先把北纬60度附近的同一个地面微小圆作为参考，等距经纬网投影中横向倍率2、纵向倍率1，变为扁椭圆；墨卡托中两个方向倍率均为2，仍为圆。形状用局部线性近似并放大展示。再以同样范围和赤道尺度比较等经纬间距与球面墨卡托投影，经线等距，墨卡托纬线间距随纬度升高而增大。纬度截断于正负75度。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="1326" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">② 横向拉宽以后，纵向也要补偿</text><text x="36" y="90.39" font-size="18.2" fill="#172b45" text-anchor="start">先看同一个地面小圆，再看整张经纬网</text><rect x="24" y="116" width="672" height="166" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="50" y="151.39" font-size="18.2" fill="#172b45" text-anchor="start">地面小圆</text><ellipse cx="172" cy="219" rx="22" ry="22" fill="#e8f1f5" stroke="#172b45" stroke-width="3"/><path d="M150.000,219.000 L194.000,219.000" fill="none" stroke="#172b45" stroke-width="2.4"/><path d="M172.000,197.000 L172.000,241.000" fill="none" stroke="#172b45" stroke-width="2.4"/><text x="282" y="200.32" font-size="19.0" fill="#172b45" text-anchor="start">参考尺寸：横向 1，纵向 1</text><text x="282" y="242.45" font-size="17.5" fill="#172b45" text-anchor="start">放在北纬 60° 附近</text><rect x="24" y="300" width="672" height="166" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="50" y="335.39" font-size="18.2" fill="#176786" text-anchor="start">A  只补横向</text><ellipse cx="172" cy="403" rx="44" ry="22" fill="#e8f1f5" stroke="#176786" stroke-width="3"/><path d="M128.000,403.000 L216.000,403.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M172.000,381.000 L172.000,425.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="282" y="384.32" font-size="19.0" fill="#176786" text-anchor="start">东西 ×2，南北 ×1</text><text x="282" y="426.45" font-size="17.5" fill="#172b45" text-anchor="start">圆变扁：局部角度被改变</text><rect x="24" y="484" width="672" height="166" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="50" y="519.39" font-size="18.2" fill="#b34039" text-anchor="start">B  再补纵向</text><ellipse cx="172" cy="587" rx="44" ry="44" fill="#e8f1f5" stroke="#b34039" stroke-width="3"/><path d="M128.000,587.000 L216.000,587.000" fill="none" stroke="#b34039" stroke-width="2.4"/><path d="M172.000,543.000 L172.000,631.000" fill="none" stroke="#b34039" stroke-width="2.4"/><text x="282" y="568.32" font-size="19.0" fill="#b34039" text-anchor="start">东西 ×2，南北 ×2</text><text x="282" y="610.45" font-size="17.5" fill="#172b45" text-anchor="start">仍是圆：局部角度保住了</text><text x="36" y="693.52" font-size="16.7" fill="#172b45" text-anchor="start">小圆是局部极限示意；大圆范围不能直接套 ×2。</text><text x="36" y="736.52" font-size="16.7" fill="#172b45" text-anchor="start">再看全图：同一赤道尺度，经度 ±180°，纬度 ±75°</text><text x="36" y="780.39" font-size="18.2" fill="#176786" text-anchor="start">A  等间距纬线：高纬地区的小图形会变扁</text><rect x="104.000" y="802.000" width="568.000" height="236.667" fill="#fff" stroke="#c0d0db" stroke-width="2"/><path d="M104.000,802.000 L104.000,1038.667" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M198.667,802.000 L198.667,1038.667" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M293.333,802.000 L293.333,1038.667" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M388.000,802.000 L388.000,1038.667" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M482.667,802.000 L482.667,1038.667" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M577.333,802.000 L577.333,1038.667" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M672.000,802.000 L672.000,1038.667" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,1015.000 L672.000,1015.000" fill="none" stroke="#c0d0db" stroke-width="2.4"/><text x="91" y="1020.59" font-size="16.0" fill="#172b45" text-anchor="end">-60°</text><path d="M104.000,991.333 L672.000,991.333" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,967.667 L672.000,967.667" fill="none" stroke="#c0d0db" stroke-width="2.4"/><text x="91" y="973.26" font-size="16.0" fill="#172b45" text-anchor="end">-30°</text><path d="M104.000,944.000 L672.000,944.000" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,920.333 L672.000,920.333" fill="none" stroke="#c0d0db" stroke-width="2.4"/><text x="91" y="925.92" font-size="16.0" fill="#172b45" text-anchor="end">0°</text><path d="M104.000,896.667 L672.000,896.667" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,873.000 L672.000,873.000" fill="none" stroke="#c0d0db" stroke-width="2.4"/><text x="91" y="878.59" font-size="16.0" fill="#172b45" text-anchor="end">30°</text><path d="M104.000,849.333 L672.000,849.333" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,825.667 L672.000,825.667" fill="none" stroke="#b34039" stroke-width="2.4"/><text x="91" y="831.26" font-size="16.0" fill="#b34039" text-anchor="end">60°</text><text x="104.0" y="1069.26" font-size="16.0" fill="#172b45" text-anchor="middle">180°西</text><text x="388.0" y="1069.26" font-size="16.0" fill="#172b45" text-anchor="middle">0°</text><text x="672.0" y="1069.26" font-size="16.0" fill="#172b45" text-anchor="middle">180°东</text><text x="36" y="1168.39" font-size="18.2" fill="#b34039" text-anchor="start">B  墨卡托纬线：越靠两极，间距越大</text><rect x="104.000" y="1190.000" width="568.000" height="366.588" fill="#fff" stroke="#c0d0db" stroke-width="2"/><path d="M104.000,1190.000 L104.000,1556.588" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M198.667,1190.000 L198.667,1556.588" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M293.333,1190.000 L293.333,1556.588" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M388.000,1190.000 L388.000,1556.588" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M482.667,1190.000 L482.667,1556.588" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M577.333,1190.000 L577.333,1556.588" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M672.000,1190.000 L672.000,1556.588" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,1492.347 L672.000,1492.347" fill="none" stroke="#c0d0db" stroke-width="2.4"/><text x="91" y="1497.94" font-size="16.0" fill="#172b45" text-anchor="end">-60°</text><path d="M104.000,1452.970 L672.000,1452.970" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,1422.951 L672.000,1422.951" fill="none" stroke="#c0d0db" stroke-width="2.4"/><text x="91" y="1428.54" font-size="16.0" fill="#172b45" text-anchor="end">-30°</text><path d="M104.000,1397.236 L672.000,1397.236" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,1373.294 L672.000,1373.294" fill="none" stroke="#c0d0db" stroke-width="2.4"/><text x="91" y="1378.88" font-size="16.0" fill="#172b45" text-anchor="end">0°</text><path d="M104.000,1349.352 L672.000,1349.352" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,1323.637 L672.000,1323.637" fill="none" stroke="#c0d0db" stroke-width="2.4"/><text x="91" y="1329.23" font-size="16.0" fill="#172b45" text-anchor="end">30°</text><path d="M104.000,1293.618 L672.000,1293.618" fill="none" stroke="#c0d0db" stroke-width="2.4"/><path d="M104.000,1254.241 L672.000,1254.241" fill="none" stroke="#b34039" stroke-width="2.4"/><text x="91" y="1259.83" font-size="16.0" fill="#b34039" text-anchor="end">60°</text><text x="104.0" y="1587.18" font-size="16.0" fill="#172b45" text-anchor="middle">180°西</text><text x="388.0" y="1587.18" font-size="16.0" fill="#172b45" text-anchor="middle">0°</text><text x="672.0" y="1587.18" font-size="16.0" fill="#172b45" text-anchor="middle">180°东</text><text x="36" y="1655.45" font-size="17.5" fill="#172b45" text-anchor="start">两条红线都标 60°，不是两条航线或拉伸方向。</text><text x="36" y="1692.45" font-size="17.5" fill="#172b45" text-anchor="start">看灰色横线：下图越靠两极，相邻纬线越远。</text><text x="36" y="1729.52" font-size="16.7" fill="#172b45" text-anchor="start">这里是数学示意，不是 1569 年古地图的复制。</text></g></svg>
