<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1337" viewBox="0 0 720 1337" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">地图瓦片金字塔</title><desc id="desc">层级0、1、2的瓦片网格分别为1、4、16块。每块256像素，整个世界图像宽度分别为256、512、1024像素。这是常见栅格瓦片模型而非所有服务的统一标准。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1337" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">⑧ 手机没下载整张世界地图</text><text x="36" y="92" font-size="23" fill="#172b45" text-anchor="start">它通常只取当前视野附近所需的地图瓦片</text><text x="36" y="138" font-size="25" fill="#172b45" text-anchor="start">层级 z = 0：1 × 1 = 1 块</text><rect x="68.000" y="162.000" width="254.000" height="254.000" fill="#f5d89b" stroke="#c0d0db" stroke-width="2"/><text x="361" y="220" font-size="23" fill="#172b45" text-anchor="start">整幅像素宽度</text><text x="361" y="266" font-size="24" fill="#176786" text-anchor="start">256 × 2^0 = 256 px</text><text x="361" y="330" font-size="23" fill="#172b45" text-anchor="start">每块仍是</text><text x="361" y="370" font-size="24" fill="#172b45" text-anchor="start">256 × 256 px</text><text x="36" y="506" font-size="25" fill="#172b45" text-anchor="start">层级 z = 1：2 × 2 = 4 块</text><rect x="68.000" y="530.000" width="127.000" height="127.000" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><rect x="195.000" y="530.000" width="127.000" height="127.000" fill="#f5d89b" stroke="#c0d0db" stroke-width="2"/><rect x="68.000" y="657.000" width="127.000" height="127.000" fill="#fff" stroke="#c0d0db" stroke-width="2"/><rect x="195.000" y="657.000" width="127.000" height="127.000" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><text x="361" y="588" font-size="23" fill="#172b45" text-anchor="start">整幅像素宽度</text><text x="361" y="634" font-size="24" fill="#176786" text-anchor="start">256 × 2^1 = 512 px</text><text x="361" y="698" font-size="23" fill="#172b45" text-anchor="start">每块仍是</text><text x="361" y="738" font-size="24" fill="#172b45" text-anchor="start">256 × 256 px</text><text x="36" y="874" font-size="25" fill="#172b45" text-anchor="start">层级 z = 2：4 × 4 = 16 块</text><rect x="68.000" y="898.000" width="63.500" height="63.500" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><rect x="131.500" y="898.000" width="63.500" height="63.500" fill="#fff" stroke="#c0d0db" stroke-width="2"/><rect x="195.000" y="898.000" width="63.500" height="63.500" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><rect x="258.500" y="898.000" width="63.500" height="63.500" fill="#f5d89b" stroke="#c0d0db" stroke-width="2"/><rect x="68.000" y="961.500" width="63.500" height="63.500" fill="#fff" stroke="#c0d0db" stroke-width="2"/><rect x="131.500" y="961.500" width="63.500" height="63.500" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><rect x="195.000" y="961.500" width="63.500" height="63.500" fill="#fff" stroke="#c0d0db" stroke-width="2"/><rect x="258.500" y="961.500" width="63.500" height="63.500" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><rect x="68.000" y="1025.000" width="63.500" height="63.500" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><rect x="131.500" y="1025.000" width="63.500" height="63.500" fill="#fff" stroke="#c0d0db" stroke-width="2"/><rect x="195.000" y="1025.000" width="63.500" height="63.500" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><rect x="258.500" y="1025.000" width="63.500" height="63.500" fill="#fff" stroke="#c0d0db" stroke-width="2"/><rect x="68.000" y="1088.500" width="63.500" height="63.500" fill="#fff" stroke="#c0d0db" stroke-width="2"/><rect x="131.500" y="1088.500" width="63.500" height="63.500" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><rect x="195.000" y="1088.500" width="63.500" height="63.500" fill="#fff" stroke="#c0d0db" stroke-width="2"/><rect x="258.500" y="1088.500" width="63.500" height="63.500" fill="#e4edf3" stroke="#c0d0db" stroke-width="2"/><text x="361" y="956" font-size="23" fill="#172b45" text-anchor="start">整幅像素宽度</text><text x="361" y="1002" font-size="24" fill="#176786" text-anchor="start">256 × 2^2 = 1024 px</text><text x="361" y="1066" font-size="23" fill="#172b45" text-anchor="start">每块仍是</text><text x="361" y="1106" font-size="24" fill="#172b45" text-anchor="start">256 × 256 px</text><text x="36" y="1218" font-size="23" fill="#172b45" text-anchor="start">示例：常见的 256 像素栅格瓦片金字塔。</text><text x="36" y="1257" font-size="23" fill="#172b45" text-anchor="start">不是所有服务都同尺寸；也有矢量瓦片。</text><text x="36" y="1296" font-size="22" fill="#172b45" text-anchor="start">黄色只标出一块示例瓦片，不表示下载时序。</text></svg>
