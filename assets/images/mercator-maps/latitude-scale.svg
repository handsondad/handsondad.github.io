<svg xmlns="http://www.w3.org/2000/svg" width="720" height="892" viewBox="0 0 720 892" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">纬度圈与东西方向的长度</title><desc id="desc">球体侧面截面显示北纬60度的纬度圈半径是赤道的一半。半径6371千米的球形模型中，一度经度沿纬线分别约111.2和55.6千米。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="892" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">① 越往北，同样一度经度越短</text><text x="36" y="92" font-size="23" fill="#172b45" text-anchor="start">先看地球侧面：纬度圈的半径不是都一样</text><rect x="24" y="118" width="672" height="410" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><circle cx="345.000" cy="310.000" r="150.000" fill="#eaf3f7" stroke="#172b45" stroke-width="3"/><path d="M345.000,160.000 L345.000,460.000" fill="none" stroke="#c0d0db" stroke-width="3" stroke-dasharray="7 6"/><path d="M195.000,310.000 L495.000,310.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M270.000,180.096 L420.000,180.096" fill="none" stroke="#b34039" stroke-width="3"/><path d="M345.000,310.000 L420.000,180.096" fill="none" stroke="#b34039" stroke-width="3"/><path d="M393.000,310.000 L392.984,308.744 L392.934,307.488 L392.852,306.234 L392.737,304.983 L392.589,303.735 L392.409,302.491 L392.196,301.253 L391.951,300.020 L391.674,298.795 L391.364,297.577 L391.023,296.367 L390.651,295.167 L390.247,293.977 L389.812,292.798 L389.346,291.631 L388.850,290.477 L388.324,289.335 L387.768,288.208 L387.183,287.096 L386.569,286.000 L385.927,284.920 L385.256,283.857 L384.558,282.813 L383.833,281.786 L383.081,280.779 L382.303,279.793 L381.499,278.826 L380.671,277.882 L379.818,276.959 L378.941,276.059 L378.041,275.182 L377.118,274.329 L376.174,273.501 L375.207,272.697 L374.221,271.919 L373.214,271.167 L372.187,270.442 L371.143,269.744 L370.080,269.073 L369.000,268.431" fill="none" stroke="#b77a09" stroke-width="3"/><text x="405" y="289" font-size="24" fill="#b34039" text-anchor="start">60°</text><text x="532" y="318" font-size="24" fill="#176786" text-anchor="start">赤道</text><text x="442" y="165.0961894323342" font-size="24" fill="#b34039" text-anchor="start">北纬 60°</text><circle cx="345.000" cy="310.000" r="6" fill="#172b45"/><text x="306" y="378" font-size="22" fill="#172b45" text-anchor="start">球心</text><text x="66" y="499" font-size="24" fill="#172b45" text-anchor="start">红线长 = 蓝线长 × cos 60° = 一半</text><rect x="24" y="552" width="672" height="228" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="54" y="604" font-size="23" fill="#176786" text-anchor="start">0° 纬度</text><path d="M210.000,596.000 L543.600,596.000" fill="none" stroke="#176786" stroke-width="3"/><text x="560" y="604" font-size="23" fill="#176786" text-anchor="start">111.2 km</text><text x="54" y="677" font-size="23" fill="#b34039" text-anchor="start">60° 纬度</text><path d="M210.000,669.000 L376.800,669.000" fill="none" stroke="#b34039" stroke-width="3"/><text x="560" y="677" font-size="23" fill="#b34039" text-anchor="start">55.6 km</text><text x="54" y="753" font-size="22" fill="#172b45" text-anchor="start">球形模型 R = 6371 km；沿纬线跨过 1° 经度</text><text x="36" y="820" font-size="23" fill="#172b45" text-anchor="start">如果地图把各纬度的一度经度都画成同样宽，</text><text x="36" y="856" font-size="23" fill="#172b45" text-anchor="start">北纬 60° 的东西方向，就已经被放大了两倍。</text></svg>
