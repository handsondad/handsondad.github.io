<svg xmlns="http://www.w3.org/2000/svg" width="720" height="936" viewBox="0 0 720 936" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">基线与两个角决定第三点</title><desc id="desc">教学坐标A为0,0，B为100,0，C为40,80米。底角约63.43与53.13度，AC约89.44米。画图与计算使用同一比例；实际测量还需误差与地球曲率处理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="936" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">⑤ 不必走到山顶，也能测出它在哪</text><text x="36" y="92" font-size="23" fill="#172b45" text-anchor="start">平坦局部教学模型：先测基线，再测两个角</text><rect x="24" y="116" width="672" height="491" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><path d="M105.000,536.000 L293.000,160.000 L575.000,536.000 L105.000,536.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M293.000,160.000 L293.000,536.000" fill="none" stroke="#c0d0db" stroke-width="3" stroke-dasharray="7 6"/><path d="M167.000,536.000 L166.976,534.284 L166.905,532.570 L166.786,530.858 L166.620,529.150 L166.407,527.447 L166.147,525.751 L165.840,524.062 L165.486,522.383 L165.086,520.715 L164.640,519.057 L164.148,517.413 L163.611,515.784 L163.029,514.169 L162.403,512.572 L161.733,510.992 L161.019,509.431 L160.262,507.891 L159.463,506.373 L158.622,504.877 L157.740,503.405 L156.818,501.958 L155.856,500.537 L154.855,499.143 L153.816,497.777 L152.739,496.441 L151.626,495.135 L150.478,493.860 L149.294,492.617 L148.076,491.408 L146.826,490.233 L145.543,489.093 L144.229,487.989 L142.886,486.922 L141.513,485.892 L140.112,484.901 L138.685,483.949 L137.231,483.036 L135.753,482.165 L134.251,481.334 L132.727,480.546" fill="none" stroke="#b77a09" stroke-width="3"/><path d="M513.000,536.000 L513.017,534.563 L513.067,533.126 L513.150,531.692 L513.266,530.259 L513.416,528.830 L513.599,527.404 L513.815,525.983 L514.063,524.567 L514.345,523.158 L514.659,521.755 L515.005,520.360 L515.384,518.974 L515.794,517.597 L516.237,516.229 L516.711,514.872 L517.216,513.527 L517.753,512.193 L518.320,510.873 L518.918,509.566 L519.546,508.273 L520.203,506.995 L520.890,505.732 L521.606,504.486 L522.351,503.257 L523.124,502.045 L523.925,500.852 L524.754,499.678 L525.609,498.523 L526.491,497.388 L527.399,496.274 L528.333,495.181 L529.292,494.110 L530.275,493.062 L531.282,492.037 L532.313,491.035 L533.367,490.058 L534.443,489.105 L535.541,488.177 L536.660,487.276 L537.800,486.400" fill="none" stroke="#b77a09" stroke-width="3"/><circle cx="105.000" cy="536.000" r="6" fill="#172b45"/><text x="71" y="542" font-size="24" fill="#172b45" text-anchor="start">A</text><circle cx="575.000" cy="536.000" r="6" fill="#172b45"/><text x="589" y="542" font-size="24" fill="#172b45" text-anchor="start">B</text><circle cx="293.000" cy="160.000" r="6" fill="#172b45"/><text x="311" y="151" font-size="24" fill="#172b45" text-anchor="start">C 山顶</text><text x="138" y="478" font-size="23" fill="#b77a09" text-anchor="start">α ≈ 63.43°</text><text x="391" y="478" font-size="23" fill="#b77a09" text-anchor="start">β ≈ 53.13°</text><text x="340" y="582" font-size="24" fill="#176786" text-anchor="middle">基线 AB = 100 m</text><text x="117" y="348" font-size="22" fill="#176786" text-anchor="middle">AC ≈</text><text x="117" y="380" font-size="22" fill="#176786" text-anchor="middle">89.44 m</text><text x="343" y="379" font-size="22" fill="#172b45" text-anchor="start">垂距</text><text x="343" y="412" font-size="22" fill="#172b45" text-anchor="start">80 m</text><rect x="24" y="635" width="672" height="214" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="50" y="681" font-size="24" fill="#172b45" text-anchor="start">先看底边：只把 AB 的长度量出来。</text><text x="50" y="734" font-size="24" fill="#172b45" text-anchor="start">再看两角：两条视线决定 C 的位置。</text><text x="50" y="787" font-size="24" fill="#172b45" text-anchor="start">最后接网：换一条已知边，继续测下一点。</text><text x="36" y="895" font-size="23" fill="#172b45" text-anchor="start">真实测量还要处理地形、曲率、折射和观测误差。</text></svg>
