<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1001" viewBox="0 0 720 1001" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">制图综合与连接关系</title><desc id="desc">同一虚构小镇的细节与概览版本，减少小路和建筑，简化河道，但两版保留相同主路、支路和位于道路河流交点的桥。两个窗口同框仅为对比，不表示相同实体比例尺。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1001" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">⑦ 地图不是照片：它必须选择</text><text x="36" y="92" font-size="23" fill="#172b45" text-anchor="start">同一虚构小镇：比较细节与概览的表达方式</text><text x="36" y="138" font-size="24" fill="#172b45" text-anchor="start">A  细节表达：小路、建筑、河道弯曲都保留</text><rect x="76.000" y="160.000" width="568.000" height="285.000" fill="#fff" stroke="#c0d0db" stroke-width="2"/><path d="M76.000,375.000 L146.000,357.000 L226.000,371.000 L321.000,322.000 L371.000,329.000 L436.000,297.000 L526.000,310.000 L644.000,240.000" fill="none" stroke="#176786" stroke-width="5"/><path d="M76.000,228.000 L186.000,238.000 L301.000,233.000 L403.000,251.000 L524.000,232.000 L644.000,228.000" fill="none" stroke="#b34039" stroke-width="4"/><path d="M301.000,233.000 L321.000,322.000 L348.000,430.000" fill="none" stroke="#b34039" stroke-width="4"/><rect x="312.000" y="314.000" width="18.000" height="16.000" fill="#fff" stroke="#172b45" stroke-width="2"/><rect x="136.000" y="202.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="173.000" y="202.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="224.000" y="254.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="260.000" y="264.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="363.000" y="216.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="411.000" y="275.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="452.000" y="254.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="541.000" y="195.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><path d="M173.000,209.000 L173.000,238.000" fill="none" stroke="#b77a09" stroke-width="2" stroke-dasharray="8 6"/><path d="M421.000,282.000 L406.000,251.000" fill="none" stroke="#b77a09" stroke-width="2" stroke-dasharray="8 6"/><text x="480" y="404" font-size="22" fill="#176786" text-anchor="start">河流</text><text x="480" y="197" font-size="22" fill="#b34039" text-anchor="start">主路</text><text x="362" y="362" font-size="22" fill="#172b45" text-anchor="start">桥</text><text x="36" y="559" font-size="24" fill="#172b45" text-anchor="start">B  概览表达：保留连接，减少细碎信息</text><rect x="76.000" y="581.000" width="568.000" height="285.000" fill="#fff" stroke="#c0d0db" stroke-width="2"/><path d="M76.000,796.000 L226.000,792.000 L321.000,743.000 L436.000,718.000 L644.000,661.000" fill="none" stroke="#176786" stroke-width="7"/><path d="M76.000,649.000 L186.000,659.000 L301.000,654.000 L403.000,672.000 L524.000,653.000 L644.000,649.000" fill="none" stroke="#b34039" stroke-width="7"/><path d="M301.000,654.000 L321.000,743.000 L348.000,851.000" fill="none" stroke="#b34039" stroke-width="7"/><rect x="312.000" y="735.000" width="18.000" height="16.000" fill="#fff" stroke="#172b45" stroke-width="2"/><circle cx="381.000" cy="656.000" r="11" fill="#172b45"/><text x="381" y="621" font-size="25" fill="#172b45" text-anchor="middle">小镇</text><text x="480" y="825" font-size="22" fill="#176786" text-anchor="start">河流</text><text x="480" y="618" font-size="22" fill="#b34039" text-anchor="start">主路</text><text x="362" y="783" font-size="22" fill="#172b45" text-anchor="start">桥</text><text x="36" y="923" font-size="23" fill="#172b45" text-anchor="start">可省掉细节，但不能把桥画到没有路的地方。</text><text x="36" y="962" font-size="22" fill="#172b45" text-anchor="start">两图为方便比较而同框，不表示相同制图比例尺。</text></svg>
