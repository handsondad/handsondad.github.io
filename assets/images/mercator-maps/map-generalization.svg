<svg xmlns="http://www.w3.org/2000/svg" width="540" height="750.75" viewBox="0 0 540 750.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">制图综合与连接关系</title><desc id="desc">同一虚构小镇的细节与概览版本，减少小路和建筑，简化河道，但两版保留相同主路、支路和位于道路河流交点的桥。两个窗口同框仅为对比，不表示相同实体比例尺。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="749.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑦ 地图不是照片：它必须选择</text><text x="36" y="90.45" font-size="17.5" fill="#172b45" text-anchor="start">同一虚构小镇：比较细节与概览的表达方式</text><text x="36" y="136.39" font-size="18.2" fill="#172b45" text-anchor="start">A  细节表达：小路、建筑、河道弯曲都保留</text><rect x="76.000" y="160.000" width="568.000" height="285.000" fill="#fff" stroke="#c0d0db" stroke-width="2"/><path d="M76.000,375.000 L146.000,357.000 L226.000,371.000 L321.000,322.000 L371.000,329.000 L436.000,297.000 L526.000,310.000 L644.000,240.000" fill="none" stroke="#176786" stroke-width="4.1"/><path d="M76.000,228.000 L186.000,238.000 L301.000,233.000 L403.000,251.000 L524.000,232.000 L644.000,228.000" fill="none" stroke="#b34039" stroke-width="3.28"/><path d="M301.000,233.000 L321.000,322.000 L348.000,430.000" fill="none" stroke="#b34039" stroke-width="3.28"/><rect x="312.000" y="314.000" width="18.000" height="16.000" fill="#fff" stroke="#172b45" stroke-width="2"/><rect x="136.000" y="202.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="173.000" y="202.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="224.000" y="254.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="260.000" y="264.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="363.000" y="216.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="411.000" y="275.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="452.000" y="254.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><rect x="541.000" y="195.000" width="20.000" height="15.000" fill="#e9e0cd" stroke="#b77a09" stroke-width="2"/><path d="M173.000,209.000 L173.000,238.000" fill="none" stroke="#b77a09" stroke-width="1.64" stroke-dasharray="8 6"/><path d="M421.000,282.000 L406.000,251.000" fill="none" stroke="#b77a09" stroke-width="1.64" stroke-dasharray="8 6"/><text x="480" y="402.52" font-size="16.7" fill="#176786" text-anchor="start">河流</text><text x="480" y="195.52" font-size="16.7" fill="#b34039" text-anchor="start">主路</text><text x="362" y="360.52" font-size="16.7" fill="#172b45" text-anchor="start">桥</text><text x="36" y="557.39" font-size="18.2" fill="#172b45" text-anchor="start">B  概览表达：保留连接，减少细碎信息</text><rect x="76.000" y="581.000" width="568.000" height="285.000" fill="#fff" stroke="#c0d0db" stroke-width="2"/><path d="M76.000,796.000 L226.000,792.000 L321.000,743.000 L436.000,718.000 L644.000,661.000" fill="none" stroke="#176786" stroke-width="5.74"/><path d="M76.000,649.000 L186.000,659.000 L301.000,654.000 L403.000,672.000 L524.000,653.000 L644.000,649.000" fill="none" stroke="#b34039" stroke-width="5.74"/><path d="M301.000,654.000 L321.000,743.000 L348.000,851.000" fill="none" stroke="#b34039" stroke-width="5.74"/><rect x="312.000" y="735.000" width="18.000" height="16.000" fill="#fff" stroke="#172b45" stroke-width="2"/><circle cx="381.000" cy="656.000" r="11" fill="#172b45"/><text x="381" y="619.32" font-size="19.0" fill="#172b45" text-anchor="middle">小镇</text><text x="480" y="823.52" font-size="16.7" fill="#176786" text-anchor="start">河流</text><text x="480" y="616.52" font-size="16.7" fill="#b34039" text-anchor="start">主路</text><text x="362" y="781.52" font-size="16.7" fill="#172b45" text-anchor="start">桥</text><text x="36" y="921.45" font-size="17.5" fill="#172b45" text-anchor="start">可省掉细节，但不能把桥画到没有路的地方。</text><text x="36" y="960.52" font-size="16.7" fill="#172b45" text-anchor="start">两图为方便比较而同框，不表示相同制图比例尺。</text></g></svg>
