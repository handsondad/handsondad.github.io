<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">地球能量收支几何平均反照率与红外辐射图</title>
<desc id="desc">太阳常数1361瓦每平方米按地球截面积与球面面积之比除以四得到全球平均340瓦每平方米，其中约100被反射、240被吸收并以红外形式向太空辐射；有效辐射温度约255开尔文，地表288开尔文向外辐射约390瓦每平方米，温室效应使地表高约33摄氏度。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="539" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">地球的能量账：来的太阳光，最后都以红外光走</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">几何平均一除四，反照率再打七折——剩下的才真正进入气候系统。</text>
<rect x="20" y="66" width="352" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="88" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="38" y="92" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="92" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">为什么 1361 变成 340？</text>
<circle cx="196" cy="204" r="66" fill="#f4f8fc" stroke="#9fc7e8" stroke-width="1.6"/>
<line x1="196.0" y1="112.0" x2="196.0" y2="138.0" stroke="#c25014" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="196" y="126" font-size="10.5" fill="#c25014" text-anchor="middle">阳光</text>
<line x1="196.0" y1="270.0" x2="196.0" y2="296.0" stroke="#1d6fa5" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<text x="196" y="290" font-size="10.5" fill="#1d6fa5" text-anchor="middle">红外</text>
<text x="38" y="156" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="600">太阳常数 ≈ 1361 W/m²</text>
<text x="38" y="340" font-size="10.5" fill="#1e293b" text-anchor="start">截面积 πR² 接光，球面 4πR² 分摊 ⇒ ÷4</text>
<text x="38" y="370" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">全球平均入射 ≈ 340 W/m²</text>
<text x="38" y="410" font-size="10.5" fill="#475569" text-anchor="start">这就是 NASA 常说的 “340 W/m²”。</text>
<rect x="388" y="66" width="352" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="88" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="406" y="92" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="92" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">340 的去向与温度</text>
<text x="404" y="124" font-size="10.5" fill="#0f172a" text-anchor="start">入射太阳</text>
<rect x="404" y="132" width="272.0" height="16" rx="4" fill="#c25014"/>
<text x="684" y="144" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">340 W/m²</text>
<text x="404" y="176" font-size="10.5" fill="#0f172a" text-anchor="start">反射回太空（约 29%）</text>
<rect x="404" y="184" width="78.9" height="16" rx="4" fill="#475569"/>
<text x="684" y="196" font-size="10.5" fill="#475569" text-anchor="start" font-weight="700">99 W/m²</text>
<text x="404" y="228" font-size="10.5" fill="#0f172a" text-anchor="start">地球系统吸收（约 71%）</text>
<rect x="404" y="236" width="193.3" height="16" rx="4" fill="#c25014"/>
<text x="684" y="248" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">242 W/m²</text>
<text x="404" y="280" font-size="10.5" fill="#0f172a" text-anchor="start">向外红外辐射</text>
<rect x="404" y="288" width="193.3" height="16" rx="4" fill="#1d6fa5"/>
<text x="684" y="300" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">242 W/m²</text>
<line x1="404.0" y1="340.0" x2="724.0" y2="340.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="404" y="370" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="600">有效辐射温度 ≈ 255 K（−18°C）</text>
<text x="404" y="398" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="600">地表 288 K 向外辐射 ≈ 390 W/m²</text>
<text x="404" y="430" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="600">温室效应让地表比“从太空看”热约 33°C。</text>
<rect x="20" y="482" width="720" height="48" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="511" font-size="10.8" fill="#475569" text-anchor="start">长期平均下吸收太阳能 ≈ 向外红外能；两边失衡，地球就会升温或降温。</text>
</svg>
