<svg xmlns="http://www.w3.org/2000/svg" width="760" height="508" viewBox="0 0 760 508" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">光热转换与维恩位移黑体峰值波长图</title>
<desc id="desc">左栏展示光被反射透射或吸收，吸收后转为分子振动热，物体升温又会发出热辐射；右栏按维恩位移定律在对数波长轴上标出太阳5778开峰值约0.50微米、白炽灯3000开约0.97微米、人体310开约9.35微米。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="507" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">光变热，热也会变光：两者是同一份能量的不同外衣</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">吸收让分子动起来；足够热的物体自己就会发光。</text>
<rect x="20" y="66" width="352" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="88" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="38" y="92" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="92" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">光照到物体：三条去路</text>
<line x1="48.0" y1="158.0" x2="156.0" y2="158.0" stroke="#c25014" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="90" y="146" font-size="9.8" fill="#c25014" text-anchor="middle">入射光</text>
<rect x="160" y="126" width="86" height="64" rx="6" fill="#f4f8fc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="203" y="164" font-size="10.4" fill="#0f172a" text-anchor="middle" font-weight="700">物体</text>
<line x1="246.0" y1="142.0" x2="320.0" y2="114.0" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<text x="300" y="108" font-size="9.8" fill="#1d6fa5" text-anchor="middle">反射</text>
<line x1="246.0" y1="158.0" x2="320.0" y2="158.0" stroke="#18794e" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-green)"/>
<text x="300" y="152" font-size="9.8" fill="#18794e" text-anchor="middle">透射</text>
<line x1="246.0" y1="174.0" x2="320.0" y2="202.0" stroke="#c25014" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="300" y="214" font-size="9.8" fill="#c25014" text-anchor="middle">吸收→热</text>
<line x1="38.0" y1="226.0" x2="350.0" y2="226.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="38" y="256" font-size="10.4" fill="#1e293b" text-anchor="start">吸收的光子能量转成分子振动、转动，</text>
<text x="38" y="282" font-size="10.4" fill="#1e293b" text-anchor="start">宏观表现就是温度升高。</text>
<text x="38" y="320" font-size="11.0" fill="#6d28d9" text-anchor="start" font-weight="700">热辐射反过来发光：</text>
<text x="38" y="350" font-size="10.4" fill="#1e293b" text-anchor="start">铁块加热先暗红、再橙黄、最后白炽。</text>
<text x="38" y="390" font-size="10.2" fill="#475569" text-anchor="start">白天晒被子暖，夜里被子也向夜空发红外。</text>
<rect x="388" y="66" width="352" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="88" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="406" y="92" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="92" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">维恩位移：越热，光越偏蓝</text>
<line x1="408.0" y1="300.0" x2="700.0" y2="300.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
<line x1="408.0" y1="296.0" x2="408.0" y2="306.0" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="408.0" y="322" font-size="9.4" fill="#64748b" text-anchor="middle">0.1 µm</text>
<line x1="505.3" y1="296.0" x2="505.3" y2="306.0" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="505.3" y="322" font-size="9.4" fill="#64748b" text-anchor="middle">1 µm</text>
<line x1="602.7" y1="296.0" x2="602.7" y2="306.0" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="602.7" y="322" font-size="9.4" fill="#64748b" text-anchor="middle">10 µm</text>
<line x1="700.0" y1="296.0" x2="700.0" y2="306.0" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
<text x="700.0" y="322" font-size="9.4" fill="#64748b" text-anchor="middle">100 µm</text>
<text x="554" y="348" font-size="10.0" fill="#475569" text-anchor="middle">波长 λ（对数刻度）</text>
<line x1="476.2" y1="144.0" x2="476.2" y2="300.0" stroke="#eab308" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<circle cx="476.2" cy="300" r="5" fill="#eab308"/>
<text x="476.2" y="132" font-size="9.8" fill="#eab308" text-anchor="middle" font-weight="700">太阳光球 5778 K</text>
<text x="476.2" y="270" font-size="9.4" fill="#eab308" text-anchor="middle">峰值 0.50 µm</text>
<line x1="503.9" y1="120.0" x2="503.9" y2="300.0" stroke="#f97316" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<circle cx="503.9" cy="300" r="5" fill="#f97316"/>
<text x="503.9" y="108" font-size="9.8" fill="#f97316" text-anchor="middle" font-weight="700">白炽灯丝 3000 K</text>
<text x="503.9" y="246" font-size="9.4" fill="#f97316" text-anchor="middle">峰值 0.97 µm</text>
<line x1="599.8" y1="144.0" x2="599.8" y2="300.0" stroke="#ef4444" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<circle cx="599.8" cy="300" r="5" fill="#ef4444"/>
<text x="599.8" y="132" font-size="9.8" fill="#ef4444" text-anchor="middle" font-weight="700">人体皮肤 310 K</text>
<text x="599.8" y="270" font-size="9.4" fill="#ef4444" text-anchor="middle">峰值 9.35 µm</text>
<text x="404" y="392" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">λ峰值 = b / T，b ≈ 2.898×10⁻³ m·K</text>
<text x="404" y="418" font-size="10.2" fill="#475569" text-anchor="start">太阳峰值在可见光；人体峰值在红外。</text>
<rect x="20" y="454" width="720" height="44" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="482" font-size="10.8" fill="#475569" text-anchor="start">光与热不是“同一种东西”，而是能量在电磁辐射与微观运动之间来回换账。</text>
</svg>
