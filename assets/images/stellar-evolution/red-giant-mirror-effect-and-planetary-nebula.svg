<text x="46" y="392.0" font-size="10.2" fill="#f59e0b" text-anchor="start" font-weight="700">今日太阳</text>
<text x="46" y="405.0" font-size="9.8" fill="#1e293b" text-anchor="start">46 亿岁 (1 L⊙ · 1 D⊙)</text>
<line x1="174" y1="426.0" x2="304" y2="426.0" stroke="#d97706" stroke-width="5"/>
<circle cx="239.0" cy="426.0" r="5.5" fill="#d97706" stroke="#ffffff" stroke-width="1.4"/>
<line x1="239.0" y1="432.0" x2="239.0" y2="446.0" stroke="#d97706" stroke-width="1.4"/>
<text x="239.0" y="460.0" font-size="10.2" fill="#d97706" text-anchor="middle" font-weight="700">主序星终点</text>
<text x="239.0" y="475.0" font-size="9.8" fill="#1e293b" text-anchor="middle">~100–110 亿岁 (核心氢耗尽)</text>
<line x1="304" y1="426.0" x2="434" y2="426.0" stroke="#dc2626" stroke-width="5"/>
<circle cx="369.0" cy="426.0" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"/>
<line x1="369.0" y1="420.0" x2="369.0" y2="406.0" stroke="#dc2626" stroke-width="1.4"/>
<text x="369.0" y="392.0" font-size="10.2" fill="#dc2626" text-anchor="middle" font-weight="700">红巨星极盛</text>
<text x="369.0" y="405.0" font-size="9.8" fill="#1e293b" text-anchor="middle">+13 亿年 (2300 L⊙ · 165 D⊙)</text>
<line x1="434" y1="426.0" x2="548" y2="426.0" stroke="#ea580c" stroke-width="5"/>
<circle cx="491.0" cy="426.0" r="5.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.4"/>
