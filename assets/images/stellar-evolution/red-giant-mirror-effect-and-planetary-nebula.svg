<text x="491.0" y="460.0" font-size="10.2" fill="#ea580c" text-anchor="middle" font-weight="700">氦核聚变</text>
<text x="491.0" y="475.0" font-size="9.8" fill="#1e293b" text-anchor="middle">+1 亿年 (50 L⊙ · 10 D⊙)</text>
<line x1="548" y1="426.0" x2="654" y2="426.0" stroke="#7c3aed" stroke-width="5"/>
<circle cx="601.0" cy="426.0" r="5.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.4"/>
<line x1="601.0" y1="420.0" x2="601.0" y2="406.0" stroke="#7c3aed" stroke-width="1.4"/>
<text x="601.0" y="392.0" font-size="10.2" fill="#7c3aed" text-anchor="middle" font-weight="700">AGB 二次巨星</text>
<text x="601.0" y="405.0" font-size="9.8" fill="#1e293b" text-anchor="middle">+2,000 万年 (5200 L⊙ · 180 D⊙)</text>
<line x1="654" y1="426.0" x2="716" y2="426.0" stroke="#0284c7" stroke-width="5"/>
<circle cx="685.0" cy="426.0" r="5.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.4"/>
<line x1="685.0" y1="432.0" x2="685.0" y2="446.0" stroke="#0284c7" stroke-width="1.4"/>
<text x="724" y="460.0" font-size="10.2" fill="#0284c7" text-anchor="end" font-weight="700">白矮星余生</text>
<text x="724" y="475.0" font-size="9.8" fill="#1e293b" text-anchor="end">数十亿年结晶 (~0.54 M⊙ 固态核)</text>
<text x="34" y="528" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">地球命运节点：180 倍太阳直径（≈ 0.84 AU，叠加潮汐拖拽）将吞没水星与金星，地球表面早已化作岩浆洋。</text>
