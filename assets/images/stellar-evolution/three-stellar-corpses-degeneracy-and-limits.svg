    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="563" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">五、恒星死后的三具终极遗骸：1.44 与 ~2.2 M⊙ 两道不可逾越的质量极限</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">白矮星、中子星与黑洞的量子防线对决，以及“越重反而越小”的钱德拉塞卡相对论质径曲线</text>
<rect x="20" y="64" width="720" height="250" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="478" height="22" rx="11.0" fill="#f0fdfa" stroke="#0d9488" stroke-width="1" stroke-opacity="0.35"/>
<text x="273.0" y="89.0" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="600">A · 初始主序质量（单星近太阳金属丰度）→ 残骸核心质量的三岔路口</text>
<rect x="34" y="104" width="238" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
<rect x="276" y="104" width="166" height="26" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
<rect x="446" y="104" width="150" height="26" rx="4" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3"/>
<rect x="600" y="104" width="126" height="26" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
<text x="153" y="121" font-size="9.9" fill="#1d6fa5" text-anchor="middle" font-weight="700">初始 0.08–8 M⊙ (~97%恒星) → 白矮星</text>
<text x="359" y="121" font-size="9.9" fill="#c25014" text-anchor="middle" font-weight="700">8–20 M⊙ → 中子星</text>
<text x="521" y="121" font-size="9.9" fill="#6d28d9" text-anchor="middle" font-weight="700">20–140 M⊙ → 黑洞</text>
<text x="663" y="121" font-size="9.8" fill="#dc2626" text-anchor="middle" font-weight="700">140–260 M⊙ 炸无残骸</text>
<rect x="34" y="140" width="224" height="162" rx="8" fill="#f0f9ff" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="146" y="160" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">① 白矮星（残核 &lt; 1.44 M⊙）</text>
<text x="44" y="182" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">• 尺寸：≈ 地球（R ~ 5,000–12,000 km）</text>
<text x="44" y="204" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">• 密度：~10⁶ g/cm³（1 cm³ ≈ 1 吨）</text>
<text x="44" y="226" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">• 支撑力：泡利不相容·电子简并压</text>
<text x="44" y="248" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">• 结局：数十亿年结晶成固态碳氧晶球；</text>
<text x="44" y="270" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">  双星吸积越 1.44 M⊙ → Ia型超新星全碎！</text>
<rect x="268" y="140" width="224" height="162" rx="8" fill="#fffbeb" stroke="#c25014" stroke-width="1.4"/>
<text x="380" y="160" font-size="10.4" fill="#c25014" text-anchor="middle" font-weight="700">② 中子星（1.44 ~ 2.17 M⊙）</text>
<text x="278" y="182" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">• 尺寸：≈ 城市（半径仅 ~11–12 km）</text>
<text x="278" y="204" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">• 密度：~4×10¹⁴ g/cm³（方糖重4亿吨）</text>
<text x="278" y="226" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">• 支撑力：中子简并压 + 强核力排斥</text>
<text x="278" y="248" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">• 特征：守恒缩转成毫秒脉冲星与磁星；</text>
<text x="278" y="270" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">  双中子星并合炼出宇宙黄金与铂金！</text>
<rect x="502" y="140" width="224" height="162" rx="8" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="614" y="160" font-size="10.4" fill="#6d28d9" text-anchor="middle" font-weight="700">③ 恒星级黑洞（&gt; ~2.2 M⊙）</text>
<text x="512" y="182" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">• 视界：R_s = 2GM/c² ≈ 3 km × (M/M⊙)</text>
<text x="512" y="204" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">  （10 M⊙ 黑洞视界半径仅 ~30 km！）</text>
<text x="512" y="226" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">• 支撑力：彻底归零！强核力也被压垮</text>
<text x="512" y="248" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">• 本质：引力把时空曲率弯成单向陷阱，</text>
<text x="512" y="270" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">  事件视界内逃逸速度 &gt; 光速 c。</text>
<rect x="20" y="328" width="720" height="226" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="338.0" width="532" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="300.0" y="353.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">B · 钱德拉塞卡质径曲线实算：为什么白矮星“越重反而越小”，直到 1.44 M⊙ 归零？</text>
<rect x="84.0" y="378.0" width="362.0" height="140.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="84.0" y1="518.0" x2="446.0" y2="518.0" stroke="#e2e8f0" stroke-width="1"/>
