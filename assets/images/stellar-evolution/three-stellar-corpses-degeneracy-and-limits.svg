<text x="265.0" y="546" font-size="10.0" fill="#0f172a" text-anchor="middle" font-weight="700">白矮星质量 M / M⊙</text>
<text x="34" y="448.0" font-size="10.0" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90 34 448.0)">半径 R (km)</text>
<rect x="462" y="378" width="264" height="162" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
<text x="474" y="398" font-size="10.4" fill="#c25014" text-anchor="start" font-weight="700">19岁船舱里的惊天推导（1930）：</text>
<text x="474" y="419" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="600">1. 低速段：P_简并 ∝ ρ^(5/3) 抗衡引力</text>
<text x="474" y="437" font-size="9.8" fill="#1e293b" text-anchor="start">   ⇒ R ∝ M^(-1/3)：加质量必须把电子</text>
<text x="474" y="454" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700">   挤进更小空间抬高动量，越重反而越小！</text>
<text x="474" y="475" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="600">2. 相对论危机：电子逼近光速 c 无法再加速，</text>
<text x="474" y="493" font-size="9.8" fill="#1e293b" text-anchor="start">   压强软化为 P ∝ ρ^(4/3)，与引力同阶抵消</text>
<text x="474" y="511" font-size="9.9" fill="#dc2626" text-anchor="start" font-weight="700">   ⇒ 一过 1.44 M⊙，再怎么缩也撑不住！</text>
<text x="474" y="530" font-size="9.8" fill="#64748b" text-anchor="start">3. 中子星越过 ~2.17 M⊙（TOV极限）同理坍成黑洞。</text>
</svg>
