<line x1="84.0" y1="448.0" x2="446.0" y2="448.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="78.0" y="452.0" font-size="9.8" fill="#64748b" text-anchor="end">8,000</text>
<line x1="84.0" y1="413.0" x2="446.0" y2="413.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="78.0" y="417.0" font-size="9.8" fill="#64748b" text-anchor="end">12,000</text>
<line x1="84.0" y1="378.0" x2="446.0" y2="378.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="78.0" y="382.0" font-size="9.8" fill="#64748b" text-anchor="end">16,000</text>
<line x1="129.2" y1="378.0" x2="129.2" y2="518.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="129.2" y="533.0" font-size="9.8" fill="#64748b" text-anchor="middle" font-weight="400">0.2 M⊙</text>
<line x1="219.7" y1="378.0" x2="219.7" y2="518.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="219.7" y="533.0" font-size="9.8" fill="#64748b" text-anchor="middle" font-weight="400">0.6 M⊙</text>
<line x1="310.2" y1="378.0" x2="310.2" y2="518.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="310.2" y="533.0" font-size="9.8" fill="#64748b" text-anchor="middle" font-weight="400">1 M⊙</text>
<line x1="409.8" y1="378.0" x2="409.8" y2="518.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="409.8" y="533.0" font-size="9.8" fill="#dc2626" text-anchor="middle" font-weight="700">1.44 M⊙</text>
<line x1="84.0" y1="462.3" x2="446.0" y2="462.3" stroke="#18794e" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="92.0" y="457.3" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">地球半径 6,371 km</text>
<line x1="409.8" y1="378.0" x2="409.8" y2="518.0" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="4 2"/>
<text x="403.8" y="393.0" font-size="10.0" fill="#dc2626" text-anchor="end" font-weight="700">钱德拉塞卡极限 1.44 M⊙</text>
