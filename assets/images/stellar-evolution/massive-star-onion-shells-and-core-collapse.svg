<rect x="430.0" y="143.0" width="177.3" height="14" rx="3" fill="#0284c7"/>
<text x="614.3" y="154.0" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="500">100 万年 (1.9 亿 K)</text>
