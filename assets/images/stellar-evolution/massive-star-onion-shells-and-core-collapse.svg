<text x="282" y="278.0" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">硅聚变 Si → Fe 族</text>
<rect x="430.0" y="267.0" width="78.4" height="14" rx="3" fill="#dc2626"/>
<text x="515.4" y="278.0" font-size="9.8" fill="#dc2626" text-anchor="start" font-weight="700">仅数天！ (33 亿 K)</text>
<text x="282" y="309.0" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">铁核灾难坍缩</text>
<rect x="430.0" y="298.0" width="6.0" height="14" rx="3" fill="#7f1d1d"/>
<text x="443.0" y="309.0" font-size="9.8" fill="#7f1d1d" text-anchor="start" font-weight="700">仅 0.25 秒！ (飙至 2,000 亿 K)</text>
<rect x="20" y="352" width="720" height="218" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="362.0" width="554" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="311.0" y="377.0" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="600">B · 为什么最稳定的铁核反而引爆宇宙最猛烈灾难？0.25 秒坍缩与 SN 1987A 中微子实证</text>
<rect x="34" y="396" width="168" height="160" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="118" y="415" font-size="10.2" fill="#dc2626" text-anchor="middle" font-weight="700">① 铁核吸能抽底 (0 s)</text>
<text x="43" y="437" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">⁵⁶Fe 处于比结合能峰顶，</text>
<text x="43" y="458" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">再聚变不放热反而吸热！</text>
<text x="43" y="479" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">高温光子敲碎铁核，高压</text>
<text x="43" y="500" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">把电子压进质子 p+e⁻→n+ν_e</text>
<text x="43" y="521" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">简并支架瞬间抽空！</text>
<rect x="208" y="396" width="168" height="160" rx="7" fill="#fff7ed" stroke="#c25014" stroke-width="1.3"/>
<text x="292" y="415" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">② 0.25c 撞上核硬墙</text>
<text x="217" y="437" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">地球大铁核在 ~0.25 秒内</text>
<text x="217" y="458" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">以 7万km/s (0.25c) 砸成</text>
<text x="217" y="479" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">&lt;20 km 原中子星！密度达</text>
<text x="217" y="500" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">2–4×10¹⁴ g/cm³（方糖重</text>
<text x="217" y="521" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">4亿吨），强核力猛烈反弹！</text>
<rect x="382" y="396" width="168" height="160" rx="7" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.3"/>
<text x="466" y="415" font-size="10.2" fill="#6d28d9" text-anchor="middle" font-weight="700">③ 10⁴⁶ W 中微子重启</text>
<text x="391" y="437" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">反弹激波原本在半途卡壳，</text>
<text x="391" y="458" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">但核心涌出 10⁵⁸ 颗中微子</text>
<text x="391" y="479" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">携 99% 引力能（功率超</text>
<text x="391" y="500" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">10亿个星系总星光！）只需</text>
<text x="391" y="521" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">吸收 ~1% 即炸碎整颗巨星！</text>
<rect x="556" y="396" width="168" height="160" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3"/>
<text x="640" y="415" font-size="10.2" fill="#0d9488" text-anchor="middle" font-weight="700">④ SN 1987A 提前报信</text>
<text x="565" y="437" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">中微子秒穿恒星，激波几</text>
<text x="565" y="458" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">小时后才冲破星表发光：</text>
<text x="565" y="479" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">1987年地下探测器提前数</text>
<text x="565" y="500" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="400">小时截获19+颗中微子；2024</text>
<text x="565" y="521" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">韦布望远镜揪出中心中子星！</text>
