<rect x="0.5" y="0.5" width="759" height="583" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">四、大质量恒星（&gt;8 M⊙）的死亡冲刺：硅只烧几天，铁核 0.25 秒自由落体！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">七层“洋葱核”聚变加速倒计时、铁峰吸能陷阱与 10⁴⁶ W 中微子暴吹散整颗超巨星（II 型超新星）</text>
