<text x="310.0" y="89.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">A · 临终前的七层“洋葱壳”与 ~20 M⊙ 恒星聚变倒计时（据 SN 1987A / OpenStax Table 23.2）</text>
