<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">巨分子云低温坍缩、维里定理负热容升温机制与恒星0.075太阳质量点火红线图解</title>
<desc id="desc">上半部展示10至20K巨分子云经金斯不稳定性坍缩为原恒星盘与两极喷流，并按维里定理拆解引力势能50%辐射逃逸、50%加热核心的负热容机制；下半部在对数质量轴上标出13倍木星质量氘聚变褐矮星门槛、0.075太阳质量氢聚变恒星红线与100至200太阳质量辐射压上限。</desc>
