<rect x="0.5" y="0.5" width="759" height="559" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、恒星为什么偏要在 -260℃ 冰云里诞生？负热容升温与 0.075 M⊙ 点火红线</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">巨分子云密度暴涨近 10²⁰ 倍：辐射丢掉一半引力能反而越缩越烫，出生质量一锤定下三类天体命运</text>
<rect x="20" y="64" width="720" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
