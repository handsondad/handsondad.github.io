<text x="126.9" y="433.0" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">行星 (&lt;13 M_J)</text>
<text x="248.7" y="433.0" font-size="10.3" fill="#6d28d9" text-anchor="middle" font-weight="700">褐矮星</text>
<text x="494.4" y="433.0" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">真正的恒星（核心持续氢核聚变：0.075 – ~150 M⊙）</text>
