<text x="260.0" y="89.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 越冷越易坍缩，越丢热量反而越烫：金斯判据与维里定理“负热容”</text>
<ellipse cx="86" cy="176" rx="44" ry="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/>
