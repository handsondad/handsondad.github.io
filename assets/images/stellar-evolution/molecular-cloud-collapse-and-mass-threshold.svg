<text x="322" y="262" font-size="9.8" fill="#64748b" text-anchor="middle">核心冲向千万度</text>
<line x1="390" y1="108" x2="390" y2="282" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="404" y="122" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">维里定理账本（2K + U = 0）：引力释放势能去哪了？</text>
<rect x="404" y="134" width="316" height="22" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="562" y="149" font-size="10.4" fill="#0f172a" text-anchor="middle" font-weight="700">引力收缩释放势能  |ΔU| = 100%</text>
<rect x="404" y="166" width="154" height="36" rx="5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="481" y="181" font-size="10.3" fill="#1d6fa5" text-anchor="middle" font-weight="700">50% 辐射逃向太空</text>
<text x="481" y="196" font-size="9.8" fill="#1e293b" text-anchor="middle">总能量 ΔE = -|ΔU|/2 &lt; 0</text>
<rect x="566" y="166" width="154" height="36" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="643" y="181" font-size="10.3" fill="#dc2626" text-anchor="middle" font-weight="700">50% 留作热动能！</text>
<text x="643" y="196" font-size="9.8" fill="#1e293b" text-anchor="middle">ΔK = +|ΔU|/2 &gt; 0 升温</text>
<rect x="404" y="214" width="316" height="66" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
<text x="416" y="233" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="600">• 负热容奇观：水壶丢掉热量会变凉，自引力气团丢掉</text>
<text x="416" y="250" font-size="10.1" fill="#c25014" text-anchor="start" font-weight="700">  辐射能却迫使引力进一步深缩，核心反而越缩越烫！</text>
<text x="416" y="268" font-size="10.0" fill="#1e293b" text-anchor="start">• 直到量子简并压刹住收缩，或氢聚变稳稳点火才停下。</text>
<rect x="20" y="310" width="720" height="236" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="320.0" width="504" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="286.0" y="335.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">B · 出生质量定终身（对数坐标）：为什么木星和褐矮星点不着真正的“恒星之火”？</text>
