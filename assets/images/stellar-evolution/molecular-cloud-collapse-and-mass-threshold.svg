<text x="431.2" y="496" font-size="9.8" fill="#1e293b" text-anchor="middle">核心 1,570 万 K</text>
<line x1="693.1" y1="444.0" x2="693.1" y2="466" stroke="#dc2626" stroke-width="1.8"/>
<text x="724" y="481" font-size="10.3" fill="#dc2626" text-anchor="end" font-weight="700">质量上限 ~100–200 M⊙</text>
<text x="724" y="496" font-size="9.8" fill="#1e293b" text-anchor="end">猛烈辐射压直接吹飞吸积气体</text>
<text x="34" y="530" font-size="10.0" fill="#64748b" text-anchor="start">注：无论 15 M_J 还是 70 M_J 的褐矮星，在电子简并压支撑下体积几乎都与木星相当，终生缓慢变暗（光谱 L → T → Y）。</text>
