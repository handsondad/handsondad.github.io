<text x="201.7" y="481" font-size="10.3" fill="#6d28d9" text-anchor="middle" font-weight="700">氘聚变门槛 13 M_J (0.012 M⊙)</text>
<text x="201.7" y="496" font-size="9.8" fill="#1e293b" text-anchor="middle">褐矮星短暂烧重氢，简并压提前刹住收缩</text>
<line x1="431.2" y1="444.0" x2="431.2" y2="466" stroke="#d97706" stroke-width="1.8"/>
