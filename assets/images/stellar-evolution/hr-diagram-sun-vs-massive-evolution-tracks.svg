<title id="title">赫罗图恒星半径等值线、太阳一生演化动画与大质量恒星寿命挥霍悖论对比图</title>
<desc id="desc">左侧赫罗图按斯特藩-玻尔兹曼定律精确绘出0.01至1000倍太阳半径斜线、主序星带、25倍太阳质量超巨星轨迹，并以单次CSS动画演示1倍太阳质量从主序星经红巨星氦闪、水平支、渐近巨星支与行星状星云裸核最终冷却为白矮星；右侧列出40倍至0.4倍太阳质量的主序寿命反差。</desc>
