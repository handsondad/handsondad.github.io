<svg xmlns="http://www.w3.org/2000/svg" width="760" height="436" viewBox="0 0 760 436" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">叶绿素a、叶绿素b与类胡萝卜素可见光吸收光谱、绿光透射窗口及秋叶氮回收机制图</title>
<desc id="desc">左图精确绘制400至700nm波长范围内叶绿素a（430nm、662nm双峰）、叶绿素b（453nm、642nm双峰）与类胡萝卜素（450-480nm蓝紫吸收）的吸收曲线及500-560nm绿光窗口；右图解释全黑叶片的光抑制风险、绿光深层透射优势，以及秋季拆解叶绿素回收氮素露出类胡萝卜素黄底与新合成花青素变红的原理。</desc>
