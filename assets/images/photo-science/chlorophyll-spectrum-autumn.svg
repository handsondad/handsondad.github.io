<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图绘制叶绿素 a、叶绿素 b 与类胡萝卜素可见光吸收曲线（乙醚提取参考峰）；右图解析绿光透射与秋叶氮回收。</text>
