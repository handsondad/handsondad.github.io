<text x="389.4" y="158.8" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">662nm</text>
<line x1="38.0" y1="360.0" x2="62.0" y2="360.0" stroke="#18794e" stroke-width="2.6"/>
<text x="67" y="364" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="600">叶绿素 a（主反应中心+天线）</text>
<line x1="246.0" y1="360.0" x2="270.0" y2="360.0" stroke="#1d6fa5" stroke-width="2.2" stroke-dasharray="6 3"/>
<text x="275" y="364" font-size="10.2" fill="#0f172a" text-anchor="start">叶绿素 b（拓宽蓝/橙红吸光带）</text>
<line x1="38.0" y1="380.0" x2="62.0" y2="380.0" stroke="#c25014" stroke-width="2.1" stroke-dasharray="3 3"/>
<text x="67" y="384" font-size="10.2" fill="#0f172a" text-anchor="start">类胡萝卜素（吸蓝紫光 + 耗散过剩强光防灼伤）</text>
<text x="38" y="404" font-size="9.8" fill="#64748b" text-anchor="start">注：活体蛋白结合态峰值较有机溶剂略红移约 10–20 nm（如反应中心 P680、P700）。</text>
<rect x="472" y="64" width="268" height="358" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="486" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 叶片光学与秋叶回收账</text>
<rect x="484" y="102" width="244" height="148" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="494" y="122" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">全黑吸光 100% 岂不更划算？</text>
<text x="494" y="142" font-size="10.0" fill="#1e293b" text-anchor="start">1. 深层接力：上表层叶绿素吃掉红</text>
<text x="494" y="158" font-size="10.0" fill="#1e293b" text-anchor="start">   蓝光，绿光穿透更深喂饱下层细</text>
<text x="494" y="174" font-size="10.0" fill="#1e293b" text-anchor="start">   胞（整片厚叶绿光吸收其实不低）</text>
<text x="494" y="192" font-size="10.0" fill="#1e293b" text-anchor="start">2. 正午防烧伤：强光远超固碳酶速</text>
<text x="494" y="208" font-size="10.0" fill="#1e293b" text-anchor="start">   率上限，全黑会导致高热蒸腾与</text>
<text x="494" y="224" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">   活性氧光氧化损伤！</text>
<rect x="484" y="262" width="244" height="146" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="494" y="282" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">秋天树叶为什么变黄、变红？</text>
<text x="494" y="302" font-size="10.0" fill="#1e293b" text-anchor="start">• 变黄（揭底色）：叶绿素含宝贵的</text>
<text x="494" y="318" font-size="10.0" fill="#1e293b" text-anchor="start">  氮(N)和镁，落叶前树主动拆解叶</text>
<text x="494" y="334" font-size="10.0" fill="#1e293b" text-anchor="start">  绿素运回枝干过冬，露出原本就在</text>
<text x="494" y="350" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">  的类胡萝卜素金黄色！</text>
<text x="494" y="370" font-size="10.0" fill="#1e293b" text-anchor="start">• 变红（打遮阳伞）：枫树等新合成</text>
<text x="494" y="386" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="700">  花青素挡住秋日寒光，掩护氮撤退</text>
</svg>
