<rect x="0.5" y="0.5" width="759" height="463" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">1832 年纸笔预言“锥形折射”：一束细光射进双轴晶体，为什么炸成空心光环？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：菲涅耳四次波矢曲面截面与四个圆锥漏斗奇点（非真实比例放大示意）｜右：劳埃德霰石实验与半角偏振旋转</text>
<rect x="20" y="62" width="352" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 双轴晶体波矢曲面 kx–kz 截面（各向异性放大示意）</text>
<text x="36" y="102" font-size="10.6" fill="#64748b" text-anchor="start">圆截叶 r = ny 与椭圆截叶 (nx, nz) 横截相交出 4 个圆锥奇点</text>
