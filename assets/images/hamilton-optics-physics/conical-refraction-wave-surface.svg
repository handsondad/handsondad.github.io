<circle cx="430.1" cy="356.1" r="2.2" fill="#c25014"/>
<text x="500" y="348" font-size="10.3" fill="#1e293b" text-anchor="start">• 环顶（φ=0°）：偏振竖直 ↕</text>
<text x="500" y="368" font-size="10.3" fill="#1e293b" text-anchor="start">• 环底（φ=180°）：偏振水平 ↔（转 90°）</text>
<text x="500" y="388" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="700">• 绕环一周 360° ⇒ 偏振仅转 φ/2 = 180°</text>
<text x="500" y="408" font-size="10.2" fill="#6d28d9" text-anchor="start" font-weight="600">• 现代物理：拓扑“贝里几何相位 π”先声</text>
