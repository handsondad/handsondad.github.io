<path d="M 244,350 L 278,378 L 312,350" fill="none" stroke="#6d28d9" stroke-width="2.0"/>
<circle cx="278" cy="378" r="3.8" fill="#6d28d9"/>
<line x1="278" y1="378" x2="258" y2="334" stroke="#c25014" stroke-width="1.3" marker-end="url(#hm-orange)"/>
