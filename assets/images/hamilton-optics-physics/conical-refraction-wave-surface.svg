<text x="278" y="398" font-size="10.1" fill="#0f172a" text-anchor="middle" font-weight="600">尖点拥有一整圈无穷多法线</text>
<text x="278" y="415" font-size="10.1" fill="#6d28d9" text-anchor="middle" font-weight="700">⇒ 单束光炸成一圈空心光锥！</text>
<rect x="388" y="62" width="352" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
