<text x="264.0" y="144.0" font-size="10.4" fill="#18794e" text-anchor="start" font-weight="700" class="halo">切平面盖住圆环</text>
<text x="108.0" y="154.0" font-size="10.3" fill="#6d28d9" text-anchor="start" font-weight="700" class="halo">光轴 I</text>
<text x="102.0" y="280.0" font-size="10.3" fill="#1d6fa5" text-anchor="start" font-weight="600" class="halo">圆叶 r=ny</text>
<text x="254.0" y="280.0" font-size="10.3" fill="#c25014" text-anchor="start" font-weight="600" class="halo">椭圆叶</text>
