<line x1="568" y1="172" x2="656" y2="172" stroke="#c25014" stroke-width="2.1" marker-end="url(#hm-orange)"/>
<line x1="568" y1="220" x2="656" y2="220" stroke="#c25014" stroke-width="2.1" marker-end="url(#hm-orange)"/>
<text x="612" y="162" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700">平行空心光柱</text>
<text x="612" y="238" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="600">移远屏幕环径不变！</text>
<polygon points="660,136 714,126 714,256 660,266" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
