<text x="198.0" y="126.0" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">筒身半径 R → 缠绕角 α₀ = arcsin(r_孔/R) = 19.8°</text>
<text x="308.9" y="229.0" font-size="9.6" fill="#c25014" text-anchor="end" font-weight="700">极孔 r_孔：α 自动变 90° 相切掉头!</text>
<rect x="34" y="286" width="328" height="102" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.0"/>
<text x="46" y="306" font-size="10.4" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么绷紧的湿碳纤维非走测地线不可？</text>
<text x="46" y="326" font-size="9.6" fill="#1e293b" text-anchor="start">• 张力 T 乘侧向曲率 κ_g 就是横向滑脱力 F_侧 = T·κ_g；</text>
<text x="46" y="345" font-size="9.6" fill="#1e293b" text-anchor="start">• 刚浸环氧树脂的碳丝极滑，若 κ_g ≠ 0 丝束当场滑落封头！</text>
<text x="46" y="364" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">• 唯有守住 r·sin α = r_极孔（κ_g = 0），丝束死死咬住曲面，</text>
<text x="46" y="381" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">  造出承受数百大气压的火箭燃料贮箱与氢能气瓶。</text>
<rect x="392" y="66" width="348" height="336" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="408" y="90" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">圆锥测地线“半坡掉头 + 自交”一眼破案</text>
