<text x="644.0" y="119.0" font-size="9.5" fill="#18794e" text-anchor="middle" font-weight="700">锥顶 O (展角 120°)</text>
<text x="644.0" y="193.2" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="700" class="halo">展开竟是一条直尺线段!</text>
<text x="644.0" y="282.0" font-size="9.6" fill="#c25014" text-anchor="middle" font-weight="600">垂足即最高掉头点 d_⊥</text>
<rect x="406" y="298" width="320" height="90" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.0"/>
<text x="418" y="318" font-size="10.4" fill="#6d28d9" text-anchor="start" font-weight="700">高斯内蕴几何的魔力：</text>
<text x="418" y="338" font-size="9.6" fill="#1e293b" text-anchor="start">• 圆锥不拉伸剪开就是平面扇形，测地线展开必为直线；</text>
<text x="418" y="357" font-size="9.6" fill="#1e293b" text-anchor="start">• 直线离锥顶最近处垂足（α=90°）正是三维爬坡最高折返点；</text>
<text x="418" y="376" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">• 当锥角较尖（sin θ &lt; 1/2，展角 &lt; 180°），测地线还会在背面自交！</text>
</svg>
