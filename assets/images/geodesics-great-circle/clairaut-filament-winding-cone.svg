<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">克莱罗定律与碳纤维气瓶测地缠绕及圆锥测地线展开图解</title>
<desc id="desc">左图展示碳纤维高压气瓶遵循 r sin α 等于极孔半径的测地缠绕路径，使湿纤维零侧滑并在极孔相切折返；右图展示半顶角正弦为1/3的圆锥测地线爬升折返并在背面自交，剪开展成120度扇形后实为一条笔直线段。</desc>
