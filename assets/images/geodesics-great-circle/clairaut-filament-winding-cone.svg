<rect x="0.5" y="0.5" width="759" height="415" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">克莱罗定律（r·sin α = C）：火箭碳纤维气瓶为什么不滑丝？圆锥测地线为何自己掉头？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">1733 年克莱罗发现回转曲面测地线的“几何角动量守恒”：半径 r 越窄，航向角 α 越横，到 r = C 处自动水平折返</text>
