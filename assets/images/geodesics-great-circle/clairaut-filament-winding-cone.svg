<text x="472.0" y="173.9" font-size="9.4" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">r_min 处掉头!</text>
<text x="472.0" y="282.0" font-size="9.6" fill="#475569" text-anchor="middle" font-weight="600">三维圆锥 (sin θ=1/3)</text>
