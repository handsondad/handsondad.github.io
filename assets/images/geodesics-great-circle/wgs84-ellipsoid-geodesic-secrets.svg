<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">WGS84扁椭球测地线不闭合进动、赤道对跖点翻越极点捷径与三代测距算法对比</title>
<desc id="desc">左图展示扁椭球上倾斜测地线因赤道隆起而向西进动、不再闭合；右图对比赤道半圈20037.5公里与经线圈翻越北极20003.9公里的33.6公里差距，以及Haversine、Vincenty与Karney三代算法精度。</desc>
