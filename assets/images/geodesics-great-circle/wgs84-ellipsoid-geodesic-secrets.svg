<rect x="34" y="314" width="316" height="76" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="334" font-size="9.6" fill="#1e293b" text-anchor="start">• 完美圆球：任何大圆飞满 360° 必精准咬尾闭合；</text>
<text x="46" y="353" font-size="9.6" fill="#1e293b" text-anchor="start">• WGS-84 扁椭球：赤道鼓出 21.385 km，倾斜测地线每绕一圈</text>
<text x="46" y="372" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">  经度向西进动 Δλ ≈ -2πf·sin α₀，织成密集网篮！</text>
<rect x="380" y="66" width="360" height="336" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="396" y="90" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">扁球奇观 2：赤道两端竟是“翻北极更近”！</text>
<rect x="394" y="104" width="332" height="108" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.1"/>
<text x="408" y="124" font-size="10.2" fill="#c25014" text-anchor="start" font-weight="700">同在赤道的两点（φ₁ = φ₂ = 0°，经度差 Δλ &gt; 179.40°）：</text>
<text x="408" y="145" font-size="9.8" fill="#1e293b" text-anchor="start">• 傻傻沿赤道走半圈：πa = 20,037.5 km（鼓肚子绕远了！）</text>
<text x="408" y="165" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">• 直接向正北翻越极点：2Q = 20,003.9 km（压扁捷径！）</text>
<text x="408" y="185" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">→ 距对跖点 67.2 km 内，最短路突然弃赤道改翻两极，省 33.6 km！</text>
<text x="408" y="203" font-size="9.4" fill="#64748b" text-anchor="start">（这正是 1975 年 Vincenty 算法在对跖点附近死循环不收敛的病根）</text>
<text x="396" y="232" font-size="11.0" fill="#0f172a" text-anchor="start" font-weight="700">手机导航与 GIS 测距算法的三代进化：</text>
<rect x="394" y="244" width="332" height="46" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.0"/>
<text x="406" y="262" font-size="10.0" fill="#475569" text-anchor="start" font-weight="700">第1代 · 半正矢 Haversine</text>
<text x="406" y="280" font-size="9.3" fill="#1e293b" text-anchor="start">把地球当圆球，算共享单车够用，洲际最大偏 ~0.5% (数十公里)</text>
<rect x="394" y="295" width="332" height="46" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.0"/>
<text x="406" y="313" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="700">第2代 · 文森特 Vincenty (1975)</text>
<text x="406" y="331" font-size="9.3" fill="#1e293b" text-anchor="start">椭球迭代达 ~0.5 mm 精度，但遇近对跖点（如上海—布宜诺斯艾利斯）发散</text>
<rect x="394" y="346" width="332" height="46" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.0"/>
<text x="406" y="364" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">第3代 · 卡尼算法 Karney (2013)</text>
<text x="406" y="382" font-size="9.3" fill="#1e293b" text-anchor="start">6阶级数 + 牛顿保证收敛，全球任意两点误差 &lt; 15 纳米（GPS/PROJ标准）</text>
</svg>
