<rect x="0.5" y="0.5" width="759" height="415" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">真实地球扁了 1/298.26：测地线不再闭合，连赤道对跖点都改翻北极！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">从贝塞尔辅助球（1825）、文森特迭代（1975）到卡尼纳米级算法（2013）：现代 GPS 与 GIS 背后的椭球大地测量</text>
<rect x="20" y="66" width="344" height="336" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="90" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">扁球奇观 1：绕地球一圈回不到原起点！</text>
<text x="36" y="109" font-size="9.6" fill="#64748b" text-anchor="start">（示意夸大扁率 f=0.18；真实地球每圈西移约 0.6°）</text>
