<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">梯度下降下山轨迹与反向传播链式法则算例</title>
<desc id="desc">左图在抛物损失曲线L(w)=(2w-3)²+0.5上展示梯度下降从0.22逐步收敛至谷底w*=1.5；右图用x=2、w1=1.5、w2=2.0得预测6与目标4的算例，演示链式法则反向算出∂L/∂w2=6与∂L/∂w1=8。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="351" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">千亿个旋钮怎么自动拧准？左边“顺坡蒙眼下山”，右边“反向顺藤追责”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">损失函数给预测偏差打分（越低越好）；梯度指出最陡下坡方向，反向传播用链式法则把误差逐层算到每个旋钮头上。</text>
<rect x="20" y="62" width="352" height="274" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">① 梯度下降：在损失山谷里一步步踩向谷底</text>
<line x1="64.0" y1="226.2" x2="340.0" y2="226.2" stroke="#f1f5f9" stroke-width="1"/>
<text x="57.0" y="230.2" font-size="10.5" fill="#64748b" text-anchor="end">2</text>
<line x1="64.0" y1="154.7" x2="340.0" y2="154.7" stroke="#f1f5f9" stroke-width="1"/>
<text x="57.0" y="158.7" font-size="10.5" fill="#64748b" text-anchor="end">6</text>
<path d="M64.0,110.0 V262.0 H340.0" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<text x="82.4" y="277.0" font-size="10.5" fill="#64748b" text-anchor="middle">0.2</text>
<text x="202.0" y="277.0" font-size="10.5" fill="#64748b" text-anchor="middle">谷底 w*=1.5</text>
<text x="321.6" y="277.0" font-size="10.5" fill="#64748b" text-anchor="middle">2.8</text>
<polyline points="77.8,122.7 81.9,131.2 86.1,139.5 90.2,147.5 94.4,155.1 98.5,162.5 102.6,169.6 106.8,176.4 110.9,183.0 115.1,189.2 119.2,195.1 123.3,200.8 127.5,206.1 131.6,211.2 135.8,216.0 139.9,220.5 144.0,224.7 148.2,228.6 152.3,232.2 156.5,235.5 160.6,238.6 164.7,241.3 168.9,243.8 173.0,246.0 177.2,247.8 181.3,249.4 185.4,250.7 189.6,251.8 193.7,252.5 197.9,252.9 202.0,253.1 206.1,252.9 210.3,252.5 214.4,251.8 218.6,250.7 222.7,249.4 226.8,247.8 231.0,246.0 235.1,243.8 239.3,241.3 243.4,238.6 247.5,235.5 251.7,232.2 255.8,228.6 260.0,224.7 264.1,220.5 268.2,216.0 272.4,211.2 276.5,206.1 280.7,200.8 284.8,195.1 288.9,189.2 293.1,183.0 297.2,176.4 301.4,169.6 305.5,162.5 309.6,155.1 313.8,147.5 317.9,139.5 322.1,131.2 326.2,122.7" fill="none" stroke="#1d6fa5" stroke-width="2.0"/>
<line x1="84.2" y1="135.9" x2="145.5" y2="226.1" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<line x1="145.5" y1="226.1" x2="174.9" y2="246.8" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<line x1="174.9" y1="246.8" x2="189.0" y2="251.6" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<line x1="189.0" y1="251.6" x2="195.7" y2="252.7" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<line x1="195.7" y1="252.7" x2="199.0" y2="253.0" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<circle cx="84.2" cy="135.9" r="3.8" fill="#c25014"/>
<circle cx="145.5" cy="226.1" r="3.8" fill="#c25014"/>
<circle cx="174.9" cy="246.8" r="3.8" fill="#c25014"/>
<circle cx="189.0" cy="251.6" r="3.8" fill="#c25014"/>
<circle cx="195.7" cy="252.7" r="3.8" fill="#c25014"/>
<circle cx="199.0" cy="253.0" r="3.8" fill="#18794e"/>
<circle cx="202.0" cy="253.1" r="5" fill="#18794e"/>
<text x="92.2" y="139.9" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="600" class="halo">起点：坡陡步子大</text>
<text x="212.0" y="245.1" font-size="10.8" fill="#18794e" text-anchor="start" font-weight="700" class="halo">谷底：梯度=0 停稳</text>
<text x="36" y="302" font-size="11" fill="#1e293b" text-anchor="start">更新口诀：新旋钮 = 旧旋钮 − 学习率 η × 当前坡度（偏导数）</text>
<text x="36" y="321" font-size="10.8" fill="#64748b" text-anchor="start">坡越陡迈得越大，越靠近谷底坡越平，步子自动变小。</text>
<rect x="388" y="62" width="352" height="274" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">② 反向传播：一道真数字算例看懂“误差分锅”</text>
<rect x="404.0" y="98.0" width="320" height="21" rx="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="564.0" y="112.3" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">正向算结果（蓝 →）：输入 x=2，标准答案 y=4</text>
<rect x="400" y="134" width="56" height="36" rx="18" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="428" y="156" font-size="11.8" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">x = 2</text>
<rect x="506" y="134" width="56" height="36" rx="18" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="534" y="156" font-size="11.8" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">h = 3</text>
<rect x="612" y="134" width="56" height="36" rx="18" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="640" y="156" font-size="11.8" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">ŷ = 6</text>
<line x1="456" y1="152" x2="502" y2="152" stroke="#1d6fa5" stroke-width="1.6" marker-end="url(#arr-blue)"/>
<text x="479" y="145" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">×w₁=1.5</text>
<line x1="562" y1="152" x2="608" y2="152" stroke="#1d6fa5" stroke-width="1.6" marker-end="url(#arr-blue)"/>
<text x="585" y="145" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">×w₂=2.0</text>
<text x="698" y="156" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="700">偏大 +2!</text>
<rect x="404.0" y="184.0" width="320" height="21" rx="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="564.0" y="198.3" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="600">反向追责任（橙 ←）：链式法则从右往左逐层算偏导</text>
<text x="406" y="226" font-size="10.8" fill="#1e293b" text-anchor="start">① 算总偏差：L = ½(6−4)² = 2，末端敏感度 ∂L/∂ŷ = +2</text>
<text x="406" y="254" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="600">② 追责后旋钮 w₂：∂L/∂w₂ = (+2)×h(3) = +6  ⇒ 调小 w₂</text>
<text x="406" y="282" font-size="10.8" fill="#1e293b" text-anchor="start">③ 传回中间层 h：∂L/∂h = (+2)×w₂(2.0) = +4</text>
<text x="406" y="310" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="600">④ 追责前旋钮 w₁：∂L/∂w₁ = (+4)×x(2) = +8  ⇒ 调小 w₁</text>
</svg>
