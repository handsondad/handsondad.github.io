<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">神经网络泛化与过拟合对比及高维对抗样本机理</title>
<desc id="desc">左图对比平滑拟合曲线与5次拉格朗日插值过拟合曲线在新样本上的表现；右图展示1000维像素各加0.02的同向微小扰动累加出+1.00总偏移，使模型将熊猫高置信误判。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="343" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">举一反三的“泛化”，与神经网络的两大软肋：死记硬背、对抗雪花欺骗</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">好的模型学到的是平滑趋势而非背答案；但它只认统计相关性不懂因果，高维微小噪声累加就能指鹿为马。</text>
<rect x="20" y="62" width="352" height="266" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="600">① 泛化（绿实线） vs 过拟合死记硬背（橙虚线）</text>
<line x1="54.0" y1="196.0" x2="340.0" y2="196.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="47.0" y="200.0" font-size="10.5" fill="#64748b" text-anchor="end">1.5</text>
<line x1="54.0" y1="136.0" x2="340.0" y2="136.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="47.0" y="140.0" font-size="10.5" fill="#64748b" text-anchor="end">3.0</text>
<path d="M54.0,112.0 V256.0 H340.0" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<text x="101.7" y="271.0" font-size="10.5" fill="#64748b" text-anchor="middle">1</text>
<text x="197.0" y="271.0" font-size="10.5" fill="#64748b" text-anchor="middle">3</text>
<text x="292.3" y="271.0" font-size="10.5" fill="#64748b" text-anchor="middle">5</text>
<polyline points="77.8,179.3 81.6,191.5 85.5,200.5 89.3,206.9 93.1,210.9 96.9,213.0 100.7,213.4 104.5,212.4 108.3,210.3 112.2,207.4 116.0,203.7 119.8,199.6 123.6,195.2 127.4,190.6 131.2,186.1 135.0,181.6 138.8,177.3 142.7,173.3 146.5,169.6 150.3,166.3 154.1,163.4 157.9,160.9 161.7,158.9 165.5,157.3 169.4,156.2 173.2,155.5 177.0,155.2 180.8,155.3 184.6,155.6 188.4,156.3 192.2,157.1 196.0,158.2 199.9,159.3 203.7,160.6 207.5,161.8 211.3,162.9 215.1,164.0 218.9,164.9 222.7,165.6 226.6,166.1 230.4,166.3 234.2,166.1 238.0,165.6 241.8,164.8 245.6,163.6 249.4,162.0 253.2,160.1 257.1,157.9 260.9,155.4 264.7,152.6 268.5,149.7 272.3,146.7 276.1,143.8 279.9,141.0 283.8,138.5 287.6,136.4 291.4,135.0 295.2,134.4 299.0,134.8 302.8,136.5 306.6,139.8 310.4,144.9 314.3,152.2 318.1,162.1" fill="none" stroke="#c25014" stroke-width="1.6" stroke-dasharray="4 3"/>
<polyline points="73.1,200.5 77.8,198.2 82.6,196.1 87.4,193.9 92.1,191.8 96.9,189.8 101.7,187.8 106.4,185.9 111.2,184.0 116.0,182.2 120.7,180.4 125.5,178.6 130.3,177.0 135.0,175.4 139.8,173.8 144.6,172.3 149.3,170.8 154.1,169.4 158.9,168.0 163.6,166.7 168.4,165.5 173.2,164.2 177.9,163.1 182.7,162.0 187.5,160.9 192.2,159.9 197.0,159.0 201.8,158.1 206.5,157.3 211.3,156.5 216.1,155.7 220.8,155.1 225.6,154.4 230.4,153.8 235.1,153.3 239.9,152.8 244.7,152.4 249.4,152.0 254.2,151.7 259.0,151.4 263.7,151.2 268.5,151.1 273.3,150.9 278.0,150.9 282.8,150.9 287.6,150.9 292.3,151.0 297.1,151.1 301.9,151.3 306.6,151.6 311.4,151.9 316.2,152.3 320.9,152.7" fill="none" stroke="#18794e" stroke-width="2.2"/>
<circle cx="82.6" cy="194.0" r="4.0" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<circle cx="130.3" cy="187.2" r="4.0" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<circle cx="177.9" cy="155.2" r="4.0" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<circle cx="225.6" cy="166.0" r="4.0" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<circle cx="273.3" cy="146.0" r="4.0" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<circle cx="316.2" cy="156.8" r="4.0" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<circle cx="297.1" cy="151.1" r="4.8" fill="#18794e"/>
<text x="291.1" y="167.1" font-size="10.5" fill="#18794e" text-anchor="end" font-weight="700" class="halo">新考题预测准!</text>
<text x="110.4" y="203.5" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="600" class="halo">背噪点剧烈扭曲</text>
<text x="36" y="294" font-size="10.8" fill="#1e293b" text-anchor="start">• 绿线抓住平滑规律，遇到没见过的新题也能答对（泛化）</text>
<text x="36" y="312" font-size="10.8" fill="#64748b" text-anchor="start">• 橙虚线硬穿每个误差噪点：原题满分，一换新题就崩盘</text>
<rect x="388" y="62" width="352" height="266" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="84" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="600">② 对抗样本：人眼看不出的微调，为什么能骗过模型？</text>
<rect x="406" y="104" width="86" height="86" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="449" y="138" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">🐼 原图 x</text>
<text x="449" y="158" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">判为：熊猫</text>
<text x="449" y="176" font-size="10.2" fill="#64748b" text-anchor="middle" class="mono">得分 −0.40</text>
<text x="506" y="151" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">+</text>
<rect x="520" y="104" width="92" height="86" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-dasharray="3 2"/>
<text x="566" y="136" font-size="11.8" fill="#c25014" text-anchor="middle" font-weight="700">微小噪声</text>
<text x="566" y="155" font-size="10.5" fill="#1e293b" text-anchor="middle" class="mono">±0.02·sign∇</text>
<text x="566" y="174" font-size="10.2" fill="#64748b" text-anchor="middle">肉眼完全透明</text>
<text x="625" y="151" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">=</text>
<rect x="638" y="104" width="86" height="86" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
<text x="681" y="138" font-size="12.5" fill="#0f172a" text-anchor="middle" font-weight="700">🐼 新图 x&#x27;</text>
<text x="681" y="158" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">误判长臂猿!</text>
<text x="681" y="176" font-size="10.2" fill="#c25014" text-anchor="middle" class="mono">得分 +0.60</text>
<rect x="406" y="204" width="318" height="108" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="418" y="224" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">高维累加账本（Goodfellow 等 2015 经典机理）：</text>
<text x="418" y="244" font-size="10.8" fill="#1e293b" text-anchor="start">• 单个像素只改 0.02（人眼根本看不出任何区别）；</text>
<text x="418" y="263" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="600">• 但 1000 个像素全顺着梯度方向推：1000×0.05×0.02 = +1.00！</text>
<text x="418" y="282" font-size="10.8" fill="#1e293b" text-anchor="start">• 提醒：神经网络学到的是高维统计纹理相关性，而非人类</text>
<text x="418" y="300" font-size="10.8" fill="#64748b" text-anchor="start">  的物理因果理解（所以也常把圆润焦黄的柴犬和面包搞混）。</text>
</svg>
