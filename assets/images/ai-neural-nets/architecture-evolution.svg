<text x="200" y="147" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">边缘特征</text>
<text x="200" y="163" font-size="10.2" fill="#64748b" text-anchor="middle">共享旋钮</text>
<text x="34" y="218" font-size="10.6" fill="#1e293b" text-anchor="start">• 3×3 小窗口滑遍全图找边缘轮廓</text>
<text x="34" y="237" font-size="10.6" fill="#1e293b" text-anchor="start">• 同一套旋钮全图复用，参数量比</text>
<text x="34" y="255" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">  全连接骤降上百倍！</text>
<rect x="34.0" y="272.0" width="204" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="136.0" y="287.0" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">主攻：图像识别与局部纹理</text>
<rect x="264" y="62" width="232" height="246" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="278" y="84" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">② 残差网络 ResNet：跨层高架桥</text>
<rect x="282" y="134" width="40" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="302" y="153" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">x</text>
<line x1="322" y1="149" x2="342" y2="149" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-muted)"/>
<rect x="346" y="130" width="74" height="38" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="383" y="147" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">深层变换</text>
<text x="383" y="161" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">F(x)</text>
<line x1="420" y1="149" x2="442" y2="149" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-muted)"/>
<circle cx="458" cy="149" r="13" fill="#e7f6ee" stroke="#18794e" stroke-width="1.6"/>
<text x="458" y="154" font-size="14" fill="#18794e" text-anchor="middle" font-weight="700">+</text>
<path d="M302,134 Q380,92 454,134" fill="none" stroke="#18794e" stroke-width="2.0" marker-end="url(#arr-green)"/>
<text x="380" y="108" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">原样抄送近道 +x</text>
<text x="278" y="218" font-size="10.6" fill="#1e293b" text-anchor="start">• 痛点：叠太深信号传着传着就断了</text>
<text x="278" y="237" font-size="10.6" fill="#1e293b" text-anchor="start">• 解法：输出 y = F(x) + x，哪怕新层</text>
<text x="278" y="255" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="700">  学成 0，梯度也能走高架桥直通！</text>
<rect x="278.0" y="272.0" width="204" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="287.0" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">突破：2015 年起轻松叠上百层</text>
<rect x="508" y="62" width="232" height="246" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="522" y="84" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">③ Transformer：全句自注意力</text>
<rect x="518" y="152" width="40" height="28" rx="5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="538" y="170" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">小狗</text>
<rect x="564" y="152" width="40" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="584" y="170" font-size="10.8" fill="#0f172a" text-anchor="middle">追</text>
<rect x="608" y="152" width="40" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="628" y="170" font-size="10.8" fill="#0f172a" text-anchor="middle">兔子</text>
<rect x="668" y="152" width="40" height="28" rx="5" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="688" y="170" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">它累</text>
<path d="M688,152 Q613,100 538,150" fill="none" stroke="#c25014" stroke-width="2.4" marker-end="url(#arr-orange)"/>
<path d="M688,152 Q658,124 628,150" fill="none" stroke="#c25014" stroke-width="1.1" stroke-dasharray="3 2"/>
<text x="612" y="114" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">注意力权重 76% 锁定“小狗”!</text>
<text x="522" y="218" font-size="10.6" fill="#1e293b" text-anchor="start">• 告别按字排队传话，任意两词直接</text>
<text x="522" y="237" font-size="10.6" fill="#1e293b" text-anchor="start">  算相关性连线，一秒看懂“它”指谁</text>
<text x="522" y="255" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">• 整段文本同时并行计算，喂大算力！</text>
<rect x="522.0" y="272.0" width="204" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="624.0" y="287.0" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">2017 诞生：当今大模型统一底座</text>
