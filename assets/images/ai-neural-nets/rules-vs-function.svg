<svg xmlns="http://www.w3.org/2000/svg" width="760" height="318" viewBox="0 0 760 318" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">人工智能的两次出发：从“人教死口诀”到“机器自己在数据里拧旋钮”</title>
<desc id="desc">左图展示符号主义手写IF-ELSE规则遇到折耳猫等例外即失效；右图展示机器学习将像素x输入含可调参数旋钮w的函数f(x;w)自动学习特征。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="317" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">人工智能的两次出发：从“人教死口诀”到“机器自己在数据里拧旋钮”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">智能的本质都是“接收环境输入 x → 给出合理反应 y”，分歧在于中间的映射关系怎么来。</text>
<rect x="20" y="62" width="352" height="238" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">① 符号主义（专家系统）：手写逻辑树</text>
<rect x="36" y="98" width="320" height="62" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="48" y="118" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">人类专家一条条手写逻辑分支：</text>
<text x="48" y="138" font-size="11.2" fill="#1e293b" text-anchor="start" class="mono">IF 有尖耳朵 AND 有长胡须 ⇒ 判定是【猫】</text>
<text x="48" y="153" font-size="11.2" fill="#64748b" text-anchor="start" class="mono">ELSE ⇒ 判定【不是猫】</text>
<line x1="196" y1="160" x2="196" y2="184" stroke="#c25014" stroke-width="1.5" marker-end="url(#arr-orange)"/>
<rect x="36" y="188" width="320" height="74" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="48" y="208" font-size="11.8" fill="#c25014" text-anchor="start" font-weight="700">一旦遇到现实世界的无穷例外就卡壳：</text>
<text x="48" y="228" font-size="11.2" fill="#1e293b" text-anchor="start">• 折耳猫（耳朵不尖）→ 被误判成不是猫！</text>
<text x="48" y="246" font-size="11.2" fill="#1e293b" text-anchor="start">• 侧脸逆光看不清胡须 → 规则树瞬间失效！</text>
<text x="36" y="286" font-size="11" fill="#64748b" text-anchor="start">瓶颈：人类自己都说不清“认出一只猫”到底用了多少潜规则。</text>
<rect x="388" y="62" width="352" height="238" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="84" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">② 机器学习：带旋钮的黑箱函数 y = f(x)</text>
<rect x="404" y="98" width="320" height="108" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="416" y="118" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">把世间万物翻译成“数字进 → 数字出”的函数：</text>
<rect x="416" y="132" width="78" height="56" rx="6" fill="#ffffff" stroke="#1d6fa5" stroke-width="1"/>
<text x="455" y="153" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">输入 x</text>
<text x="455" y="171" font-size="10.5" fill="#64748b" text-anchor="middle">像素数值</text>
<line x1="494" y1="160" x2="518" y2="160" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<rect x="522" y="128" width="108" height="64" rx="8" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="576" y="149" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">函数 f(x; w)</text>
<text x="576" y="168" font-size="10.2" fill="#93c5fd" text-anchor="middle">⚙️ 满身可调旋钮</text>
<text x="576" y="183" font-size="10" fill="#cbd5e1" text-anchor="middle" class="mono">w₁, w₂, …, b</text>
<line x1="630" y1="160" x2="652" y2="160" stroke="#18794e" stroke-width="1.5" marker-end="url(#arr-green)"/>
<rect x="656" y="132" width="58" height="56" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="685" y="154" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">输出 y</text>
<text x="685" y="172" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">猫 96%</text>
<rect x="404" y="216" width="320" height="52" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="416" y="236" font-size="11.3" fill="#1e293b" text-anchor="start">机器学习（驯狗思路）：人不写死规则，只喂给它</text>
<text x="416" y="254" font-size="11.3" fill="#18794e" text-anchor="start" font-weight="700">十万张照片和奖惩信号，让机器自己把旋钮拧准！</text>
<text x="404" y="286" font-size="11" fill="#64748b" text-anchor="start">1956 达特茅斯会议确立 AI；70–80 年代起重心逐步转向数据驱动。</text>
</svg>
