<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">扩散模型加噪去噪过程与高维图像流形评分引导轨迹</title>
<desc id="desc">左图展示5乘5图案正向加高斯噪声变为随机雪花及逆向去噪恢复，并概括视频时空补丁的优劣势；右图数值模拟5个噪声起点沿评分函数梯度场收敛至S形真实图像流形曲线。</desc>
