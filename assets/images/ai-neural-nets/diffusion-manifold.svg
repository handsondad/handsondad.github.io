<text x="46" y="270" font-size="10.5" fill="#1e293b" text-anchor="start">• 把视频帧切成“时空补丁”交给 Transformer 去噪</text>
<text x="46" y="288" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="600">• 强项：长镜头运镜、遮挡后再出现仍前后一致</text>
<text x="46" y="306" font-size="10.5" fill="#c25014" text-anchor="start">• 短板：未内置物理定律，碎玻璃吹蜡烛易穿帮</text>
