<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">把物理定律拓展到植物：为什么参天巨树也服从 1/4 幂律，且永远长不过 130 米？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：欧拉-格林希尔自重压弯红线 H ∝ D^(2/3) · 右：科赫《Nature》实测红杉 ~19 个大气压负压抽水终极天花板</text>
