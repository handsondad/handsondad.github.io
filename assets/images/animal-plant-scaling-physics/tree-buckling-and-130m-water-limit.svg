<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">植物格林希尔树干自重屈曲幂律与北美红杉122至130米负压抽水物理天花板图解</title>
<desc id="desc">左图绘制欧拉-格林希尔树干临界屈曲曲线H_crit∝D^(2/3)与真实树木3至4倍安全余量轨迹，推导树木同样服从H∝M^(1/4)标度律；右图依据Koch等2004年Nature实测，对比10.33米大气正压极限与116.2米亥伯龙红杉树顶-1.85 MPa内聚力负压拉水，展示气穴栓塞、膨压不足与气孔关闭导致光合归零如何将地球树高锁死在122至130米。</desc>
