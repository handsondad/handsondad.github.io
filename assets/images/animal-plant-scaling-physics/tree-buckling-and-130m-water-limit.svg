<text x="148" y="140" font-size="9.8" fill="#dc2626" text-anchor="middle" font-weight="700" class="halo">自重屈曲折断禁区</text>
<text x="244" y="172" font-size="9.4" fill="#dc2626" text-anchor="middle" font-weight="700" class="halo">格林希尔极限 H_crit ∝ D^(2/3)</text>
<text x="254" y="278" font-size="9.4" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">真实树木安全线 (~3–4倍余量)</text>
<line x1="68.0" y1="196.3" x2="344.0" y2="196.3" stroke="#1d6fa5" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="330.9" cy="210.5" r="4.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.5"/>
<text x="322.9" y="202.5" font-size="9.3" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">亥伯龙红杉 (116.2 m)</text>
<rect x="30" y="368" width="320" height="80" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="42" y="387" font-size="9.7" fill="#18794e" text-anchor="start" font-weight="700">动植物跨界大一统（Greenhill 1881 = McMahon 1973）：</text>
<text x="42" y="405" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">树干质量 M ∝ D²H，代入 H ∝ D^(2/3) 即得 H ∝ M^(1/4)！</text>
<text x="42" y="423" font-size="9.4" fill="#1d6fa5" text-anchor="start" font-weight="700">悬念：4 米粗红杉力学可撑 ~200 米，为何全卡在 116 米？</text>
<text x="42" y="439" font-size="9.3" fill="#1e293b" text-anchor="start">→ 真正卡脖子的不是树干折断，而是把水拽上天的极限！</text>
<rect x="374" y="64" width="368" height="396" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="388" y="86" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 终极天花板：把水拉上 116 米要 ~19 个大气压负压！</text>
<rect x="388" y="143.4" width="340" height="17.8" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="558" y="136.7" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">科赫《Nature》四重指标交汇死线：地球树木上限 122–130 m</text>
<polygon points="445.0,432.0 463.0,432.0 457.0,174.0 451.0,174.0" fill="#92400e" opacity="0.85"/>
<polygon points="428.0,338.8 480.0,338.8 454.0,272.2" fill="#15803d" opacity="0.82"/>
<polygon points="433.0,285.5 475.0,285.5 454.0,223.3" fill="#15803d" opacity="0.82"/>
<polygon points="439.0,236.6 469.0,236.6 454.0,187.8" fill="#15803d" opacity="0.82"/>
<polygon points="445.0,201.1 463.0,201.1 454.0,174.0" fill="#15803d" opacity="0.82"/>
<path d="M 454.00,432.00 L 454.00,174.04" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="xylem-pull"/>
<line x1="432.0" y1="432.0" x2="484.0" y2="432.0" stroke="#475569" stroke-width="1.2"/>
<text x="386" y="446.0" font-size="8.8" fill="#64748b" text-anchor="start">0m 湿润土壤根系</text>
<line x1="432.0" y1="409.1" x2="484.0" y2="409.1" stroke="#c25014" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="386" y="403.1" font-size="8.8" fill="#c25014" text-anchor="start" font-weight="700" class="halo">10.3m 正压极限</text>
<line x1="432.0" y1="298.8" x2="484.0" y2="298.8" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="386" y="301.8" font-size="8.6" fill="#64748b" text-anchor="start" class="halo">60m (−1.0)</text>
<line x1="432.0" y1="174.0" x2="484.0" y2="174.0" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="386" y="169.0" font-size="8.9" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">116.2m 树巅</text>
<text x="386" y="183.0" font-size="8.6" fill="#1d6fa5" text-anchor="start" font-weight="600" class="halo">(−1.85 MPa)</text>
<rect x="492" y="162" width="238" height="84" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="502" y="181" font-size="9.7" fill="#1d6fa5" text-anchor="start" font-weight="700">怎么突破 10.3 米？靠“负压拽水”！</text>
<text x="502" y="200" font-size="9.0" fill="#1e293b" text-anchor="start">大气正压最多推高 10.33 m；巨树靠叶肉纳米</text>
<text x="502" y="216" font-size="9.0" fill="#1e293b" text-anchor="start">孔蒸发，借水分子氢键【内聚力】把整根连续</text>
<text x="502" y="232" font-size="9.0" fill="#1e293b" text-anchor="start">水柱拽入 −1.85 MPa（约 18.5 atm 负压）！</text>
<rect x="492" y="256" width="238" height="88" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="502" y="275" font-size="9.7" fill="#dc2626" text-anchor="start" font-weight="700">锁死 130 米第 1 把锁：气穴栓塞断流</text>
<text x="502" y="294" font-size="9.0" fill="#1e293b" text-anchor="start">每升 1 米先扣 0.0098 MPa 重力税；近 −2 MPa</text>
<text x="502" y="310" font-size="9.0" fill="#1e293b" text-anchor="start">时，空气微泡被硬拽进导管瞬间汽化崩断（气</text>
<text x="502" y="326" font-size="9.0" fill="#1e293b" text-anchor="start">穴栓塞），像吸管漏气一样再也抽不上水！</text>
<rect x="492" y="354" width="238" height="92" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="502" y="373" font-size="9.7" fill="#b45309" text-anchor="start" font-weight="700">第 2 &amp; 3 把锁：膨压归零 + 气孔断粮</text>
<text x="502" y="392" font-size="9.0" fill="#1e293b" text-anchor="start">百米树顶水势极低，新细胞撑不开（红杉顶叶</text>
<text x="502" y="408" font-size="9.0" fill="#1e293b" text-anchor="start">缩成硬鳞片！）；为防断水只能常关气孔，CO₂</text>
<text x="502" y="424" font-size="9.0" fill="#1e293b" text-anchor="start">进不来，光合净收益在 122–130 m 彻底归零！</text>
</svg>
