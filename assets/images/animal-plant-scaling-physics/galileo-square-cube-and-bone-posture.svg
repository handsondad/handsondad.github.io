<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">平方-立方律与抗压破局：为什么 18 米巨人迈步即断，真大象却稳如泰山？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：伽利略等比例放大死局（压强 σ ∝ L 直撞断裂线） · 右：真实动物靠“骨头超比例加粗 + 把腿站直”双重破局</text>
