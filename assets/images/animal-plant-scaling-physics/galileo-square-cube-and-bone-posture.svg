<text x="44" y="336" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• 人类股骨静态/动态安全余量仅约 10 倍体重：</text>
<text x="44" y="354" font-size="9.8" fill="#1e293b" text-anchor="start">  霍尔丹算出 18 米巨人（10×）体重涨 1000 倍，大腿骨截</text>
<text x="44" y="371" font-size="9.8" fill="#dc2626" text-anchor="start" font-weight="600">  面仅涨 100 倍，压强暴增 10 倍，迈出第一步就会骨折！</text>
<text x="44" y="393" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• 科幻片“放大 100 倍的巨型蚂蚁”更惨：</text>
<text x="44" y="411" font-size="9.8" fill="#1e293b" text-anchor="start">  体重涨 100 万倍 ÷ 腿截面 1 万倍 = 压强飙升 100 倍，</text>
<text x="44" y="428" font-size="9.8" fill="#64748b" text-anchor="start">  外骨骼当场坍塌，而且气管扩散供氧也会彻底窒息。</text>
