<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">克莱伯 3/4 次方代谢律：为什么老鼠心跳如鼓活两岁，大象慢悠悠却共享“十亿次心跳”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：双对数实测斜率精准锁定 0.75 而非表面积律 0.67 · 右：WBE 分形血管网络与 1/4 次方生命节拍器</text>
