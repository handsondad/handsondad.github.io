<text x="446" y="308" font-size="9.7" fill="#6d28d9" text-anchor="start" font-weight="700">心率 f ∝ M^(-1/4)  ×  寿命 T ∝ M^(+1/4)  ⇒  f·T ∝ M⁰ !</text>
