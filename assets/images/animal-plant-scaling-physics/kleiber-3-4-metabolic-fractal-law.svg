<text x="708" y="369" font-size="9.0" fill="#18794e" text-anchor="end" font-weight="700">≈ 9.6 亿次</text>
<rect x="446" y="384" width="270" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="454" y="401" font-size="9.3" fill="#0f172a" text-anchor="start" font-weight="700">现代人类</text>
<text x="514" y="401" font-size="9.0" fill="#64748b" text-anchor="start">~70 次/分 × ~80 年</text>
<text x="708" y="401" font-size="9.0" fill="#1d6fa5" text-anchor="end" font-weight="700">≈ 29 亿次 (医学外挂!)</text>
<text x="581" y="427" font-size="8.9" fill="#0f172a" text-anchor="middle" font-weight="600">野生哺乳类多在 8–12 亿次；人类凭脑化与医学翻近三倍！</text>
