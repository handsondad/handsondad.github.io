<text x="556" y="150" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="700">• 动物血管、支气管与植物木质部</text>
<text x="556" y="167" font-size="9.4" fill="#1e293b" text-anchor="start">  都是填满三维空间的【分形树】；</text>
<text x="556" y="186" font-size="9.4" fill="#1e293b" text-anchor="start">• 末端单元（毛细血管/叶片）尺寸</text>
<text x="556" y="203" font-size="9.4" fill="#1e293b" text-anchor="start">  不随体型缩放，流体阻力最小化</text>
<text x="556" y="221" font-size="9.4" fill="#18794e" text-anchor="start" font-weight="700">  天然导出 3/4 幂律（连树木也服从!）</text>
<text x="496" y="242" font-size="8.8" fill="#dc2626" text-anchor="middle" font-weight="600">红点：不变尺寸毛细血管</text>
