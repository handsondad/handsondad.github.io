<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">AI训练与推理生命周期能耗账本及杰文斯悖论反弹效应图解</title>
<desc id="desc">左栏展示总能耗等于一次性训练投入加累计推理次数乘单次能耗，随调用规模扩大推理反超训练；右栏对比效率提升10倍时静态外推降至0.1倍与需求扩张50倍后总能耗反升至5倍的杰文斯悖论。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="365" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">AI 算力与能耗的两本账：训练固定投入、推理规模乘数与杰文斯悖论</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：高频部署后累计推理能耗终将反超单次训练；右：单次效率提升 10 倍，总耗电为何仍可涨 5 倍</text>
<rect x="20" y="64" width="352" height="286" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="86" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="90" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="90" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">生命周期账本：E(N) = E_训练 + N × e_单次推理</text>
<line x1="64" y1="282.0" x2="344.0" y2="282.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="57" y="286.0" font-size="10.5" fill="#64748b" text-anchor="end">0</text>
<line x1="64" y1="241.5" x2="344.0" y2="241.5" stroke="#f1f5f9" stroke-width="1"/>
<text x="57" y="245.5" font-size="10.5" fill="#64748b" text-anchor="end">1×</text>
<line x1="64" y1="201.0" x2="344.0" y2="201.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="57" y="205.0" font-size="10.5" fill="#64748b" text-anchor="end">2×</text>
<line x1="64" y1="160.5" x2="344.0" y2="160.5" stroke="#f1f5f9" stroke-width="1"/>
<text x="57" y="164.5" font-size="10.5" fill="#64748b" text-anchor="end">3×</text>
<line x1="64" y1="120.0" x2="344.0" y2="120.0" stroke="#f1f5f9" stroke-width="1"/>
<text x="57" y="124.0" font-size="10.5" fill="#64748b" text-anchor="end">4×</text>
<path d="M64,120.0 V282 H344.0" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<text x="64.0" y="297" font-size="10.5" fill="#64748b" text-anchor="middle">0</text>
<text x="164.0" y="297" font-size="10.5" fill="#64748b" text-anchor="middle">追平点</text>
<text x="260.0" y="297" font-size="10.5" fill="#64748b" text-anchor="middle">70亿次</text>
<text x="344.0" y="297" font-size="10.5" fill="#64748b" text-anchor="middle">100亿次</text>
<text x="204.0" y="312" font-size="10.8" fill="#64748b" text-anchor="middle">累计推理调用规模 N（示意刻度）</text>
<polygon points="64,241.5 344,128.1 344,241.5" fill="#fef1e8" opacity="0.85"/>
<rect x="64" y="241.5" width="280" height="40.5" fill="#eaf4fb" opacity="0.65"/>
<line x1="64" y1="241.5" x2="344" y2="241.5" stroke="#1d6fa5" stroke-width="1.8" stroke-dasharray="5 3"/>
<line x1="64" y1="241.5" x2="344" y2="128.1" stroke="#c25014" stroke-width="2.4"/>
<line x1="164.0" y1="201.0" x2="164.0" y2="282" stroke="#c25014" stroke-width="1.1" stroke-dasharray="3 3"/>
<circle cx="164.0" cy="201.0" r="4.8" fill="#c25014"/>
<text x="170.0" y="216.0" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700" class="halo">推理累计 = 训练投入</text>
<text x="76" y="268" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="600" class="halo">固定训练底座 E_训练 = 1×</text>
<text x="336" y="120.1" font-size="11" fill="#c25014" text-anchor="end" font-weight="700" class="halo">总能耗 E_总</text>
<text x="36" y="334" font-size="10.8" fill="#64748b" text-anchor="start">示意模型：单次提问耗电极小，乘上十亿级日常调用即成主项</text>
<rect x="388" y="64" width="352" height="286" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="86" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="406" y="90" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="90" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">杰文斯悖论（1865）：单次省 90% vs 总量反弹</text>
<text x="406" y="120" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">① 优化前基准</text>
<text x="532" y="120" font-size="10.5" fill="#64748b" text-anchor="start"></text>
<text x="406" y="135" font-size="10.5" fill="#64748b" text-anchor="start">单次能耗 1.0 × 调用量 1×</text>
<rect x="406" y="141" width="220.0" height="14" rx="4" fill="#f1f5f9"/>
<rect x="406" y="141" width="44.0" height="14" rx="4" fill="#1d6fa5"/>
<text x="634.0" y="152" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">1.0×</text>
<text x="406" y="178" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">② 静态外推（假设用量不变）</text>
<text x="406" y="193" font-size="10.5" fill="#64748b" text-anchor="start"></text>
<text x="406" y="193" font-size="10.5" fill="#64748b" text-anchor="start">硬件/算法提效10倍：0.1 × 用量 1×</text>
<rect x="406" y="199" width="220.0" height="14" rx="4" fill="#f1f5f9"/>
<rect x="406" y="199" width="5.0" height="14" rx="4" fill="#18794e"/>
<text x="634.0" y="210" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">0.1× (-90%)</text>
<text x="406" y="236" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">③ 杰文斯反弹（便宜后嵌入万物）</text>
<text x="406" y="251" font-size="10.5" fill="#64748b" text-anchor="start"></text>
<text x="406" y="251" font-size="10.5" fill="#64748b" text-anchor="start">单次 0.1 × 调用暴涨 50×（自动代理/全员高频）</text>
<rect x="406" y="257" width="220.0" height="14" rx="4" fill="#f1f5f9"/>
<rect x="406" y="257" width="220.0" height="14" rx="4" fill="#c25014"/>
<text x="634.0" y="268" font-size="11" fill="#c25014" text-anchor="start" font-weight="700">5.0× (反增5倍!)</text>
<rect x="406" y="286" width="316" height="30" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="564" y="305" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">总能耗 E = 单次能耗 e (÷10) × 使用规模 Q (×50) = 5×</text>
<text x="406" y="334" font-size="10.8" fill="#64748b" text-anchor="start">注：比例为机制演示模型；评估真实碳排还须核查电网清洁度</text>
</svg>
