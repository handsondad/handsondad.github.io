<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">AI编程工具表层状态词第二人设与底层ReAct工具调用循环解剖图</title>
<desc id="desc">上下分层对比图：上层展示终端前端定时器从词表随机轮播Spelunking与Honking等陪伴文案；下层展示上下文组装、模型JSON工具指令采样、本地grep/edit/pytest执行与退出码观测回传的真实闭环。</desc>
<defs>
