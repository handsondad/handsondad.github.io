<text x="467.0" y="341" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600" class="halo">多轮自动迭代（测试失败或需查更多文件时循环 ②→③→④）</text>
<text x="36" y="366" font-size="10.8" fill="#64748b" text-anchor="start">验货铁律：别因为看到 Spelunking 就信它读懂了全局——只认最终 git diff 与测试通过证据</text>
