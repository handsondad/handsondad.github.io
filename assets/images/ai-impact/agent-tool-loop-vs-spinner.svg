<rect x="0.5" y="0.5" width="759" height="391" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">掀开终端引擎盖：“第二人设”小剧场 vs 底层真实的 ReAct 工具循环</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上方是前端定时器随机抽取的俏皮动词；下方才是提示词、词元采样、本地工具与测试组成的工程闭环</text>
