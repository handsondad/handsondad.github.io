<text x="708" y="131" font-size="10.8" fill="#64748b" text-anchor="end">仅表“仍在等待响应”</text>
<line x1="28" y1="173" x2="732" y2="173" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="380" y="177" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">隔离线：上方文案 ≠ 模型思维链（CoT），也 ≠ 当前正在执行的真实技术动作</text>
