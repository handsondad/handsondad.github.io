<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1005" viewBox="0 0 720 1005" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">图 7｜普通钟摆，为什么只是近似等时？</title><desc id="desc">普通单摆完整周期用椭圆积分数值计算，与相同初始弧长的理想摆线完整周期比较。L为4米，r为1米，共同小振幅周期约4.012秒。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1005" fill="#f3f7fa"/><text x="36" y="44" font-size="28" fill="#172b45" text-anchor="start">图 7｜普通钟摆，为什么只是近似等时？</text><rect x="24" y="70" width="672" height="520" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="112" font-size="23" fill="#172b45" text-anchor="start">共同参数：普通摆长 L＝4 米；摆线 r＝1 米。</text><text x="48" y="157" font-size="22" fill="#172b45" text-anchor="start">横轴：两者从底部沿各自轨道量出的初始弧长。</text><path d="M100.000,465.000 L640.000,465.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M100.000,465.000 L100.000,200.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M100.000,465.000 L105.040,464.985 L110.080,464.942 L115.120,464.868 L120.160,464.766 L125.200,464.634 L130.240,464.473 L135.280,464.283 L140.320,464.064 L145.360,463.815 L150.400,463.537 L155.440,463.229 L160.480,462.893 L165.520,462.527 L170.560,462.131 L175.600,461.706 L180.640,461.252 L185.680,460.768 L190.720,460.255 L195.760,459.712 L200.800,459.139 L205.840,458.537 L210.880,457.906 L215.920,457.245 L220.960,456.554 L226.000,455.833 L231.040,455.083 L236.080,454.303 L241.120,453.493 L246.160,452.653 L251.200,451.783 L256.240,450.883 L261.280,449.953 L266.320,448.993 L271.360,448.003 L276.400,446.983 L281.440,445.932 L286.480,444.851 L291.520,443.740 L296.560,442.598 L301.600,441.426 L306.640,440.223 L311.680,438.990 L316.720,437.725 L321.760,436.430 L326.800,435.105 L331.840,433