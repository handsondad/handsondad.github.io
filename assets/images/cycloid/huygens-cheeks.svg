xt><text x="48" y="495" font-size="23" fill="#b34039" text-anchor="start">自由绳段</text><text x="360" y="602" font-size="23" fill="#172b45" text-anchor="middle">虚线：摆锤的摆线轨迹</text><text x="48" y="674" font-size="24" fill="#172b45" text-anchor="start">图中：缠绕 1.579 米＋自由 2.421 米</text><text x="48" y="722" font-size="23" fill="#172b45" text-anchor="start">总绳长仍为 4 米；绳在接触点沿挡板切线离开。</text><text x="48" y="770" font-size="23" fill="#172b45" text-anchor="start">两块挡板和下方轨迹都是同尺寸的摆线片段。</text><rect x="24" y="840" width="672" height="165" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="883" font-size="22" fill="#172b45" text-anchor="start">理想条件：细绳无质量、不可伸长、无弯曲阻力。</text><text x="48" y="930" font-size="23" fill="#172b45" text-anchor="start">实际钟表还受摩擦、驱动、温度与制造误差影响。</text><text x="48" y="977" font-size="24" fill="#172b45" text-anchor="start">数学上精确，不代表工程上一定最实用。</text></svg>
