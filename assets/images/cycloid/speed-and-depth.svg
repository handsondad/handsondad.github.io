<svg xmlns="http://www.w3.org/2000/svg" width="720" height="825" viewBox="0 0 720 825" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">图 3｜最快，不等于路程最短</title><desc id="desc">均匀重力下从相同起点静止释放，速率为根号二倍重力加速度乘下降深度，箭头长度按速率比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="825" fill="#f3f7fa"/><text x="36" y="44" font-size="28" fill="#172b45" text-anchor="start">图 3｜最快，不等于路程最短</text><rect x="24" y="70" width="672" height="480" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="112" font-size="24" fill="#172b45" text-anchor="start">同一起点静止释放：下降越多，速率越大。</text><text x="48" y="151" font-size="23" fill="#172b45" text-anchor="start">到达同一深度，速率相同；到达时间未必相同。</text><text x="48" y="223" font-size="23" fill="#172b45" text-anchor="start">下降 0.125 米</text><path d="M245.000,215.000 L307.642,215.000" fill="none" stroke="#176786" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="223" font-size="22" fill="#172b45" text-anchor="start">1.566 米/秒</text><text x="48" y="303" font-size="23" fill="#172b45" text-anchor="start">下降 0.5 米</text><path d="M245.000,295.000 L370.284,295.000" fill="none" stroke="#176786" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="303" font-size="22" fill="#172b45" text-anchor="start">3.132 米/秒</text><text x="48" y="383" font-size="23" fill="#172b45" text-anchor="start">下降 1.125 米</text><path d="M245.000,375.000 L432.926,375.000" fill="none" stroke="#176786" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="383" font-size="22" fill="#172b45" text-anchor="start">4.698 米/秒</text><text x="48" y="463" font-size="23" fill="#172b45" text-anchor="start">下降 2 米</text><path d="M245.000,455.000 L495.567,455.000" fill="none" stroke="#176786" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="463" font-size="22" fill="#172b45" text-anchor="start">6.264 米/秒</text><rect x="24" y="580" width="672" height="205" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="625" font-size="24" fill="#172b45" text-anchor="start">省时间的诀窍：先获得速度，再走后面的路。</text><text x="48" y="672" font-size="23" fill="#172b45" text-anchor="start">但“越陡越好”不成立：横向绕路也会花时间。</text><text x="48" y="725" font-size="23" fill="#172b45" text-anchor="start">时间账：每一小段用时＝这段长度 ÷ 当时速率。</text></svg>
