<title id="title">0.8秒心动周期左心压力与容积变化曲线（威格斯图）及第一第二心音阀门开关机制图解</title>
<desc id="desc">同步展示75次/分心跳下0.80秒内的主动脉压（80–120 mmHg含重搏切迹）、左心室压（0–120 mmHg）、左心房压（5–10 mmHg）与左心室容积（EDV 130 mL至ESV 55 mL，每搏输出75 mL），标出等容收缩期、射血期、等容舒张期、被动充盈期及S1/S2心音对应的瓣膜关闭点。</desc>
