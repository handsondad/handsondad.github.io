<line x1="338.0" y1="286.0" x2="322.0" y2="274.0" stroke="#dc2626" stroke-width="2.6"/>
<text x="322" y="332" font-size="8.4" fill="#0f172a" text-anchor="middle" font-weight="700">上阀冲开 · 下阀锁死</text>
<text x="440" y="120" font-size="9.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">落地放松（接力吸）</text>
<line x1="422.0" y1="134.0" x2="422.0" y2="316.0" stroke="#1d6fa5" stroke-width="2.2"/>
<line x1="458.0" y1="134.0" x2="458.0" y2="316.0" stroke="#1d6fa5" stroke-width="2.2"/>
<line x1="422.0" y1="168.0" x2="440.0" y2="156.0" stroke="#dc2626" stroke-width="2.6"/>
<line x1="458.0" y1="168.0" x2="440.0" y2="156.0" stroke="#dc2626" stroke-width="2.6"/>
<text x="440" y="148" font-size="8.2" fill="#dc2626" text-anchor="middle" font-weight="700">上阀托住不掉</text>
<line x1="422.0" y1="286.0" x2="432.0" y2="268.0" stroke="#18794e" stroke-width="2.4"/>
<line x1="458.0" y1="286.0" x2="448.0" y2="268.0" stroke="#18794e" stroke-width="2.4"/>
<line x1="440.0" y1="314.0" x2="440.0" y2="250.0" stroke="#1d6fa5" stroke-width="2.2" marker-end="url(#arr-blue)"/>
<text x="440" y="332" font-size="8.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">上阀托血 · 下阀进新血</text>
<rect x="270" y="358" width="220" height="118" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="280" y="377" font-size="9.2" fill="#c25014" text-anchor="start" font-weight="700">✈️ 生活保命锦囊：</text>
<text x="280" y="395" font-size="8.5" fill="#1e293b" text-anchor="start">• 长途飞机/久坐每半小时做“踝泵”（用</text>
<text x="280" y="412" font-size="8.5" fill="#1e293b" text-anchor="start">  力勾脚尖+绷脚尖），预防深静脉血栓；</text>
<text x="280" y="429" font-size="8.5" fill="#1e293b" text-anchor="start">• 静脉瓣若松弛关不严，血液倒灌撑歪</text>
<text x="280" y="446" font-size="8.5" fill="#991b1b" text-anchor="start" font-weight="700">  浅静脉，就是蚯蚓状“下肢静脉曲张”！</text>
<rect x="514" y="68" width="226" height="422" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="526.0" y="80.0" width="202" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="627.0" y="95.0" font-size="9.6" fill="#6d28d9" text-anchor="middle" font-weight="600">③ 胸腹呼吸泵 + 自动配平</text>
<rect x="532" y="116" width="190" height="96" rx="12" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="638" y="136" font-size="9.0" fill="#6d28d9" text-anchor="middle" font-weight="700">吸气时：胸腔扩容 → 负压！</text>
<text x="638" y="154" font-size="8.3" fill="#1e293b" text-anchor="middle">胸静脉被“吸开”拉血入右房</text>
<path d="M538,200 Q627,178 716,200" fill="none" stroke="#dc2626" stroke-width="3.0"/>
<line x1="638.0" y1="186.0" x2="638.0" y2="208.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arr-orange)"/>
<text x="676" y="184" font-size="8.2" fill="#dc2626" text-anchor="start" font-weight="700">膈肌下压</text>
<rect x="532" y="220" width="190" height="74" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="638" y="242" font-size="8.8" fill="#d97706" text-anchor="middle" font-weight="700">腹腔增压 → 推腹静脉向上！</text>
<text x="638" y="260" font-size="8.2" fill="#1e293b" text-anchor="middle">（下肢静脉瓣挡住不许退）</text>
<line x1="546.0" y1="284.0" x2="546.0" y2="132.0" stroke="#1d6fa5" stroke-width="3.2" marker-end="url(#arr-blue)"/>
<rect x="526" y="308" width="202" height="168" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="536" y="327" font-size="8.9" fill="#18794e" text-anchor="start" font-weight="700">⚖️ 终极追问：左右心室每次哪怕差</text>
<text x="536" y="343" font-size="8.9" fill="#18794e" text-anchor="start" font-weight="700">1 mL，几分钟肺不就被灌爆了吗？</text>
<text x="536" y="363" font-size="8.7" fill="#0f172a" text-anchor="start" font-weight="700">靠“弗兰克-斯塔灵定律”自动纠偏：</text>
<text x="536" y="381" font-size="8.5" fill="#1e293b" text-anchor="start">• 回心血多 1 mL → 把心肌肌节拉得</text>
<text x="536" y="398" font-size="8.5" fill="#1e293b" text-anchor="start">  更接近最佳重叠长度（像拉满弹弓）</text>
<text x="536" y="415" font-size="8.5" fill="#1e293b" text-anchor="start">  → 下一拍自动收缩更猛，多射出那</text>
<text x="536" y="432" font-size="8.5" fill="#1e293b" text-anchor="start">  1 mL！无需大脑算账，纯靠肌纤维</text>
<text x="536" y="449" font-size="8.5" fill="#0f172a" text-anchor="start" font-weight="700">  物理弹性实时把左右流量锁成1:1！</text>
