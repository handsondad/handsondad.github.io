<rect x="0.5" y="0.5" width="759" height="505" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">脚底没有心脏，血液凭什么顶着 1.3 米重力爬回胸口？三大“回心梯”联手破局</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">体循环静脉常驻全身约 64% 血液｜双叶静脉瓣防倒流 + 小腿“第二心脏”骨骼肌泵 + 胸腹呼吸负压抽水泵</text>
<rect x="20" y="68" width="226" height="422" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="80.0" width="202" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="133.0" y="95.0" font-size="9.6" fill="#dc2626" text-anchor="middle" font-weight="600">① 重力难题：97 mmHg 高墙</text>
<line x1="74.0" y1="128.0" x2="74.0" y2="326.0" stroke="#1d6fa5" stroke-width="6.0"/>
<circle cx="74" cy="128" r="10" fill="#dc2626"/>
<text x="92" y="131" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="700">右心房 ≈ 0–5 mmHg</text>
<text x="92" y="147" font-size="8.3" fill="#64748b" text-anchor="start">（全系统最低压终点）</text>
<line x1="48.0" y1="132.0" x2="48.0" y2="322.0" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3 2"/>
<text x="44" y="232" font-size="8.5" fill="#1e293b" text-anchor="end" class="mono">1.25m</text>
<text x="92" y="214" font-size="8.8" fill="#1e293b" text-anchor="start">毛细血管出口仅剩</text>
<text x="92" y="230" font-size="8.8" fill="#1d6fa5" text-anchor="start" font-weight="700">约 15–18 mmHg 余压</text>
<circle cx="74" cy="326" r="8" fill="#1d6fa5"/>
<text x="92" y="322" font-size="8.8" fill="#dc2626" text-anchor="start" font-weight="700">直立脚踝静水重力压</text>
<text x="92" y="338" font-size="9.0" fill="#991b1b" text-anchor="start" font-weight="700" class="mono">ρgh ≈ +97 mmHg!</text>
<rect x="32" y="358" width="202" height="118" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="42" y="377" font-size="9.2" fill="#1d6fa5" text-anchor="start" font-weight="700">📦 静脉是全身最大“活水库”：</text>
<text x="42" y="395" font-size="8.5" fill="#1e293b" text-anchor="start">• 全身约 64% 血液驻留在薄壁静脉；</text>
<text x="42" y="412" font-size="8.5" fill="#1e293b" text-anchor="start">• 若笔直站军姿锁死膝盖不动，血会</text>
<text x="42" y="429" font-size="8.5" fill="#1e293b" text-anchor="start">  淤在下肢，回心血骤减致脑缺血晕倒</text>
<text x="42" y="446" font-size="8.5" fill="#0f172a" text-anchor="start" font-weight="700">  ——必须靠分级阀门把高墙拆矮！</text>
<rect x="258" y="68" width="244" height="422" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="270.0" y="80.0" width="220" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="95.0" font-size="9.5" fill="#18794e" text-anchor="middle" font-weight="600">② 小腿“第二心脏”：肌肉挤 + 单向瓣锁</text>
<text x="322" y="120" font-size="9.0" fill="#18794e" text-anchor="middle" font-weight="700">迈步/勾脚（收缩）</text>
