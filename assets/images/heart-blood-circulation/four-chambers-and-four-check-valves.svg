<line x1="536.0" y1="368.0" x2="536.0" y2="318.0" stroke="#18794e" stroke-width="2.4" marker-end="url(#arr-green)"/>
<text x="536" y="386" font-size="8.5" fill="#18794e" text-anchor="middle" font-weight="700">射血冲开 (P室&gt;P动)</text>
<line x1="622.0" y1="312.0" x2="622.0" y2="372.0" stroke="#0f172a" stroke-width="2.2"/>
<line x1="688.0" y1="312.0" x2="688.0" y2="372.0" stroke="#0f172a" stroke-width="2.2"/>
<path d="M622,340 Q638,366 655,346 Q672,366 688,340" fill="#fde68a" stroke="#dc2626" stroke-width="2.6"/>
<line x1="642.0" y1="316.0" x2="642.0" y2="342.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<line x1="668.0" y1="316.0" x2="668.0" y2="342.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<line x1="622.0" y1="332.0" x2="598.0" y2="332.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<line x1="688.0" y1="332.0" x2="712.0" y2="332.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="655" y="386" font-size="8.4" fill="#991b1b" text-anchor="middle" font-weight="700">倒流灌满兜袋关门+灌入冠脉!</text>
<text x="484" y="408" font-size="8.8" fill="#1e293b" text-anchor="start">• 无腱索！心室一舒张，大动脉血刚往回退就灌满</text>
<text x="484" y="424" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">  三只半月兜袋严密锁门，敲响第二心音“哒”！</text>
<text x="484" y="444" font-size="9.2" fill="#dc2626" text-anchor="start" font-weight="700">💡 反直觉奇观：心脏何时给自己“喂饭”？</text>
<text x="484" y="461" font-size="8.7" fill="#1e293b" text-anchor="start">• 收缩期心肌剧烈紧绷，把自己深处的血管挤扁；</text>
<text x="484" y="477" font-size="8.7" fill="#1e293b" text-anchor="start">• 舒张期主动脉瓣合拢，回弹血正好从瓣兜上方</text>
<text x="484" y="492" font-size="8.7" fill="#991b1b" text-anchor="start" font-weight="700">  灌进左/右冠状动脉——心脏只在放松时吃饭！</text>
</svg>
