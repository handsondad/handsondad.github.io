    offset-path: path('M 164,242 L 164,344 C 164,368 216,368 216,328 L 216,162 C 216,124 232,118 248,162 L 298,242 L 298,344 C 298,368 248,368 248,326 L 248,162 C 248,104 388,108 402,192 C 414,268 408,410 342,462 C 272,494 146,488 112,428 C 86,376 102,242 164,242 Z');
