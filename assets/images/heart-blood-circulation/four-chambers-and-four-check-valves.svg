<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一滴血的双泵12站闭环：为什么一颗心脏要劈成左右两半、装四扇纯机械单向门？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">解剖正面视角（图左=右心低压肺泵 25 mmHg，图右=左心高压全身泵 120 mmHg）｜虚线=缺氧血，实线=富氧血</text>
<rect x="20" y="68" width="424" height="466" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="80.0" width="396" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="232.0" y="95.0" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="600">左看路线：右心送肺换气 + 左心送全身（流量严格相等 5.25 L/min）</text>
<rect x="136" y="108" width="192" height="46" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="232" y="125" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">⑥ 肺泡毛细血管网（换气站）</text>
<text x="232" y="143" font-size="8.9" fill="#1d6fa5" text-anchor="middle" font-weight="600">排 CO₂ · 吸 O₂（低压护住 0.5 μm 肺泡膜）</text>
<rect x="138.0" y="174.0" width="86" height="18" rx="9.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="181.0" y="186.2" font-size="8.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">⑤ 肺动脉瓣 ↑</text>
<rect x="240.0" y="174.0" width="86" height="18" rx="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="283.0" y="186.2" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="600">⑪ 主动脉瓣 ↑</text>
<rect x="114" y="198" width="236" height="212" rx="16" fill="#fff8f8" stroke="#cbd5e1" stroke-width="1"/>
<rect x="227" y="290" width="10" height="114" rx="4" fill="#cbd5e1"/>
<text x="232" y="422" font-size="8.5" fill="#475569" text-anchor="middle" font-weight="600">▲ 致密室间隔（彻底隔开左右血）</text>
<line x1="120.0" y1="278.0" x2="344.0" y2="278.0" stroke="#94a3b8" stroke-width="2.0" stroke-dasharray="4 3"/>
<rect x="122" y="208" width="84" height="58" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="164" y="226" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">② 右心房</text>
<text x="164" y="242" font-size="8.8" fill="#1e293b" text-anchor="middle" class="mono">0–5 mmHg</text>
<text x="164" y="257" font-size="8.3" fill="#64748b" text-anchor="middle">收全身静脉血</text>
<rect x="122" y="294" width="100" height="98" rx="10" fill="#e0f2fe" stroke="#1d6fa5" stroke-width="2.0"/>
<text x="172" y="316" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">④ 右心室</text>
<text x="172" y="333" font-size="8.8" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">25 / 4 mmHg</text>
<text x="172" y="350" font-size="8.6" fill="#1e293b" text-anchor="middle">薄肌壁 (~4 mm)</text>
<text x="172" y="366" font-size="8.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">温柔推血入肺</text>
<rect x="258" y="208" width="84" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="300" y="226" font-size="10.0" fill="#dc2626" text-anchor="middle" font-weight="700">⑧ 左心房</text>
<text x="300" y="242" font-size="8.8" fill="#1e293b" text-anchor="middle" class="mono">5–10 mmHg</text>
<text x="300" y="257" font-size="8.3" fill="#64748b" text-anchor="middle">接4条肺静脉</text>
<rect x="242" y="292" width="100" height="100" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="5.0"/>
<text x="292" y="316" font-size="10.2" fill="#dc2626" text-anchor="middle" font-weight="700">⑩ 左心室</text>
<text x="292" y="333" font-size="8.8" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">120 / 8 mmHg</text>
<text x="292" y="350" font-size="8.6" fill="#991b1b" text-anchor="middle" font-weight="700">厚肌壁 (~13 mm)</text>
<text x="292" y="366" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="600">强力泵遍全身！</text>
<rect x="126.0" y="270.0" width="76" height="18" rx="9.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="164.0" y="282.2" font-size="8.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">③ 三尖瓣 ↓</text>
<rect x="262.0" y="270.0" width="76" height="18" rx="9.0" fill="#ffffff" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="300.0" y="282.2" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="600">⑨ 二尖瓣 ↓</text>
<rect x="126" y="444" width="214" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="233" y="463" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">⑫ 全身器官与冠脉毛细血管网</text>
<text x="233" y="481" font-size="9.0" fill="#d97706" text-anchor="middle" font-weight="600">送出 O₂ 与养分 · 收走代谢 CO₂</text>
<polyline points="126.0,470.0 58.0,470.0 58.0,236.0 118.0,236.0" fill="none" stroke="#1d6fa5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 3" marker-end="url(#arr-blue)"/>
<text x="63" y="352" font-size="8.8" fill="#1d6fa5" text-anchor="start" font-weight="700">① 上/下腔</text>
<text x="63" y="367" font-size="8.4" fill="#64748b" text-anchor="start">静脉(缺氧)</text>
<polyline points="216.0,294.0 216.0,158.0" fill="none" stroke="#1d6fa5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>
<text x="132" y="166" font-size="8.3" fill="#1d6fa5" text-anchor="end" font-weight="700">肺动脉(流缺氧血!)</text>
<polyline points="328.0,128.0 354.0,128.0 354.0,234.0 344.0,234.0" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-orange)"/>
<text x="360" y="126" font-size="8.3" fill="#dc2626" text-anchor="start" font-weight="700">⑦肺静脉</text>
<text x="360" y="140" font-size="8.1" fill="#dc2626" text-anchor="start">(流富氧血!)</text>
<polyline points="248.0,292.0 248.0,162.0 412.0,162.0 412.0,470.0 344.0,470.0" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-orange)"/>
<text x="406" y="332" font-size="8.8" fill="#dc2626" text-anchor="end" font-weight="700">主动脉干线</text>
<text x="406" y="347" font-size="8.5" fill="#991b1b" text-anchor="end" class="mono">120/80</text>
<g class="heart-rbc-parcel"><circle cx="0" cy="0" r="7.5" fill="#dc2626" stroke="#ffffff" stroke-width="2"/><text x="0" y="3" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">O₂</text></g>
<text x="232" y="518" font-size="8.8" fill="#0f172a" text-anchor="middle" font-weight="600">注：动脉=离心的血管，静脉=回心的血管（按流向定义，绝不按含氧颜色定义！）</text>
<rect x="458" y="68" width="282" height="466" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="472.0" y="80.0" width="254" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="599.0" y="95.0" font-size="9.8" fill="#c25014" text-anchor="middle" font-weight="600">右看阀门：没有一块肌肉负责开门，全靠压差 ΔP！</text>
<rect x="472" y="112" width="254" height="152" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="484" y="131" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700">A. 房室瓣（三尖瓣/二尖瓣）：防翻伞拉绳</text>
<text x="532" y="150" font-size="8.8" fill="#18794e" text-anchor="middle" font-weight="700">充盈期 P房 &gt; P室</text>
<line x1="502.0" y1="158.0" x2="522.0" y2="184.0" stroke="#0f172a" stroke-width="2.6"/>
<line x1="562.0" y1="158.0" x2="542.0" y2="184.0" stroke="#0f172a" stroke-width="2.6"/>
<line x1="532.0" y1="156.0" x2="532.0" y2="198.0" stroke="#18794e" stroke-width="2.2" marker-end="url(#arr-green)"/>
<text x="532" y="212" font-size="8.6" fill="#18794e" text-anchor="middle" font-weight="600">顺流推开</text>
<text x="656" y="150" font-size="8.8" fill="#dc2626" text-anchor="middle" font-weight="700">收缩期 P室 ≫ P房</text>
<line x1="622.0" y1="174.0" x2="656.0" y2="172.0" stroke="#dc2626" stroke-width="3.0"/>
<line x1="690.0" y1="174.0" x2="656.0" y2="172.0" stroke="#dc2626" stroke-width="3.0"/>
<line x1="642.0" y1="173.0" x2="634.0" y2="202.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2"/>
<line x1="652.0" y1="173.0" x2="638.0" y2="202.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2"/>
<line x1="660.0" y1="173.0" x2="674.0" y2="202.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2"/>
<line x1="670.0" y1="173.0" x2="678.0" y2="202.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 2"/>
<path d="M626,212 Q636,192 646,212 Z" fill="#dc2626"/>
<path d="M666,212 Q676,192 686,212 Z" fill="#dc2626"/>
<text x="656" y="224" font-size="8.6" fill="#991b1b" text-anchor="middle" font-weight="700">乳头肌拽紧腱索！</text>
<text x="484" y="243" font-size="8.8" fill="#1e293b" text-anchor="start">• 腱索像降落伞绳拉住瓣叶，扛住 120 mmHg</text>
<text x="484" y="257" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">  巨压不外翻进心房；关门声即第一心音“咚”！</text>
<rect x="472" y="274" width="254" height="226" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="484" y="294" font-size="10.2" fill="#d97706" text-anchor="start" font-weight="700">B. 半月瓣（主动脉/肺动脉瓣）：燕子窝兜袋</text>
<line x1="506.0" y1="312.0" x2="506.0" y2="372.0" stroke="#0f172a" stroke-width="2.2"/>
<line x1="566.0" y1="312.0" x2="566.0" y2="372.0" stroke="#0f172a" stroke-width="2.2"/>
