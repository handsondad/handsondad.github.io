<path d="M 74.0,412.0 L 79.4,411.1 L 84.9,410.3 L 90.3,409.4 L 95.7,408.5 L 101.2,407.6 L 106.6,406.8 L 112.0,405.9 L 117.5,405.0 L 122.9,404.2 L 128.3,403.3 L 133.8,402.4 L 139.2,401.5 L 144.6,400.7 L 150.1,399.8 L 155.5,398.9 L 160.9,398.1 L 166.4,397.2 L 171.8,396.3 L 177.2,395.4 L 182.7,394.6 L 188.1,393.7 L 193.5,392.8 L 199.0,392.0 L 204.4,391.1 L 209.8,390.2 L 215.3,389.3 L 220.7,388.5 L 226.1,387.6 L 231.6,386.7 L 237.0,385.9 L 242.4,385.0 L 247.9,384.1 L 253.3,383.2 L 258.7,382.4 L 264.2,381.5 L 269.6,380.6 L 275.0,379.8 L 280.5,378.9 L 285.9,378.0 L 291.3,377.1 L 296.8,376.3 L 302.2,375.4 L 307.6,374.5 L 313.1,373.7 L 318.5,372.8 L 323.9,371.9 L 329.4,371.0 L 334.8,370.2 L 340.2,369.3 L 345.7,368.4 L 351.1,367.6 L 356.5,366.7 L 362.0,365.8 L 367.4,364.9 L 372.8,364.1 L 378.3,363.2 L 383.7,362.3 L 389.1,361.5 L 394.6,360.6 L 400.0,359.7" fill="none" stroke="#1d6fa5" stroke-width="2.1" stroke-dasharray="5 3"/>
<path d="M 74.0,412.0 L 79.4,411.1 L 84.9,410.3 L 90.3,409.4 L 95.7,408.5 L 101.2,407.7 L 106.6,406.8 L 112.0,406.0 L 117.5,405.1 L 122.9,404.3 L 128.3,403.5 L 133.8,402.7 L 139.2,401.9 L 144.6,401.2 L 150.1,400.4 L 155.5,399.7 L 160.9,399.0 L 166.4,398.3 L 171.8,397.6 L 177.2,397.0 L 182.7,396.4 L 188.1,395.8 L 193.5,395.2 L 199.0,394.7 L 204.4,394.2 L 209.8,393.7 L 215.3,393.2 L 220.7,392.8 L 226.1,392.4 L 231.6,392.0 L 237.0,391.7 L 242.4,391.4 L 247.9,391.1 L 253.3,390.9 L 258.7,390.7 L 264.2,390.5 L 269.6,390.4 L 275.0,390.3 L 280.5,390.2 L 285.9,390.2 L 291.3,390.2 L 296.8,390.3 L 302.2,390.3 L 307.6,390.5 L 313.1,390.6 L 318.5,390.8 L 323.9,391.0 L 329.4,391.2 L 334.8,391.5 L 340.2,391.8 L 345.7,392.2 L 351.1,392.6 L 356.5,393.0 L 362.0,393.4 L 367.4,393.9 L 372.8,394.4 L 378.3,394.9 L 383.7,395.5 L 389.1,396.0 L 394.6,396.7 L 400.0,397.3" fill="none" stroke="#c25014" stroke-width="2.2"/>
<text x="334.8" y="309.6" font-size="9.3" fill="#18794e" text-anchor="end" font-weight="700">双曲 C = 2πR·sinh(r/R)</text>
<text x="400.0" y="372.4" font-size="9.2" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">欧氏 C = 2πr</text>
<text x="393.2" y="403.7" font-size="9.2" fill="#c25014" text-anchor="end" font-weight="700">球面 C = 2πR·sin(r/R)</text>
<rect x="422" y="282" width="302" height="144" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="434" y="302" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">一张图读懂两件颠覆直觉的大事：</text>
<text x="434" y="322" font-size="9.4" fill="#1e293b" text-anchor="start">① 周长账：在 r = 3R 处，双曲圆周长已是欧氏圆的</text>
<text x="434" y="340" font-size="9.4" fill="#18794e" text-anchor="start" font-weight="700">   sinh(3)/3 ≈ 3.34 倍！到 r = 10R 更暴涨到 1,101 倍！</text>
<text x="434" y="359" font-size="9.4" fill="#1e293b" text-anchor="start">   外围地盘多到花不完，平行线当然各走各的撞不上。</text>
<text x="434" y="380" font-size="9.4" fill="#1e293b" text-anchor="start">② 相似形灭绝：由 A = R²·|180°−Σ|（弧度制 π−Σ），</text>
<text x="434" y="398" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="600">   在球面和双曲世界，一旦固定三个内角，三角形面积</text>
<text x="434" y="416" font-size="9.4" fill="#dc2626" text-anchor="start" font-weight="700">   就被唯一钉死——世上根本没有“放大版同角三角形”！</text>
</svg>
