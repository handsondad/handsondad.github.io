<svg xmlns="http://www.w3.org/2000/svg" width="760" height="454" viewBox="0 0 760 454" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">球面、欧氏与双曲三角形内角和对比及测地圆周长指数增长曲线</title>
<desc id="desc">上排三卡片对比球面三直角三角形（270度）、欧氏相似三角形（180度）与双曲理想三角形（0度且最大面积πR²）；下排按精确函数对比sinh(r/R)、r/R与sin(r/R)的圆周长增长规律。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="neg-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d6fa5"/>
    </marker>
    <marker id="neg-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18794e"/>
    </marker>
    <marker id="neg-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="453" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">平行线一旦分家，三角形内角和与圆周长全变了！—— 高斯-博内三界对决</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">内角和不再死守 180°：α + β + γ = 180° + K·A（球面角盈 &gt; 180°，双曲角亏 &lt; 180°，非欧世界无相似三角形！）</text>
<rect x="20" y="66" width="232" height="168" rx="9" fill="#ffffff" stroke="#c25014" stroke-width="1.2"/>
<text x="136" y="87" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">球面大三角形：内角和 = 270°!</text>
<circle cx="96.0" cy="162.0" r="48.0" fill="#fffdf9" stroke="#cbd5e1" stroke-width="1.2"/>
<path d="M 96.0,114.0 Q 60.0,140.0 62.0,174.0 Q 96.0,184.0 134.0,172.0 Q 134.0,140.0 96.0,114.0 Z" fill="#c25014" fill-opacity="0.18" stroke="#c25014" stroke-width="2.2"/>
<text x="96.0" y="156.0" font-size="9.6" fill="#c25014" text-anchor="middle" font-weight="700">90°×3</text>
<text x="158" y="128" font-size="9.3" fill="#1e293b" text-anchor="start">北极+赤道经差90°：</text>
<text x="158" y="148" font-size="9.5" fill="#c25014" text-anchor="start" font-weight="700">三个角全是 90°！</text>
<text x="158" y="168" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="700">Σ = π + A/R²</text>
<text x="158" y="188" font-size="9.3" fill="#64748b" text-anchor="start">面积越大越鼓胀</text>
<text x="136" y="220" font-size="9.5" fill="#c25014" text-anchor="middle" font-weight="700">角盈 = +A/R² &gt; 0</text>
<rect x="264" y="66" width="232" height="168" rx="9" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="380" y="87" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">欧氏平面三角形：恒为 180°</text>
<polygon points="292,192 362,192 322,120" fill="#1d6fa5" fill-opacity="0.15" stroke="#1d6fa5" stroke-width="2.1"/>
<polygon points="376,192 414,192 392,153" fill="#1d6fa5" fill-opacity="0.10" stroke="#1d6fa5" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="380" y="128" font-size="9.4" fill="#1e293b" text-anchor="start">大小两个相似形：</text>
<text x="380" y="147" font-size="9.4" fill="#1d6fa5" text-anchor="start" font-weight="700">角度不变可任意缩放</text>
<text x="380" y="178" font-size="9.2" fill="#64748b" text-anchor="middle">（唯独 K=0 才有相似性!）</text>
<text x="380" y="220" font-size="9.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">Σ ≡ 180°（与面积无关）</text>
<rect x="508" y="66" width="232" height="168" rx="9" fill="#ffffff" stroke="#18794e" stroke-width="1.2"/>
<text x="624" y="87" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="700">双曲理想三角形：内角和 → 0°!</text>
<circle cx="564.0" cy="156.0" r="48.0" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<path d="M 564.0,108.0 A 83.1,83.1 0 0,1 522.4,180.0 A 83.1,83.1 0 0,1 605.6,180.0 A 83.1,83.1 0 0,1 564.0,108.0 Z" fill="#18794e" fill-opacity="0.18" stroke="#18794e" stroke-width="2.1"/>
<text x="626" y="126" font-size="9.2" fill="#1e293b" text-anchor="start">三顶点全推到无穷远：</text>
<text x="626" y="145" font-size="9.5" fill="#18794e" text-anchor="start" font-weight="700">0° + 0° + 0° = 0°！</text>
<text x="626" y="165" font-size="9.3" fill="#0f172a" text-anchor="start" font-weight="700">面积竟封顶 A_max=πR²</text>
<text x="626" y="185" font-size="9.2" fill="#64748b" text-anchor="start">角度直接锁死绝对大小</text>
<text x="624" y="220" font-size="9.5" fill="#18794e" text-anchor="middle" font-weight="700">角亏 = π - Σ = A/R²</text>
<rect x="20" y="246" width="720" height="194" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="270" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">为什么双曲空间装得下无穷平行线？—— 测地圆周长 C(r) 的指数暴涨真账</text>
<line x1="74.0" y1="412.0" x2="400.0" y2="412.0" stroke="#e2e8f0" stroke-width="1.1"/>
<text x="68.0" y="415.5" font-size="8.9" fill="#64748b" text-anchor="end">0·2πR</text>
<line x1="74.0" y1="368.4" x2="400.0" y2="368.4" stroke="#e2e8f0" stroke-width="1.1"/>
<text x="68.0" y="371.9" font-size="8.9" fill="#64748b" text-anchor="end">2·2πR</text>
<line x1="74.0" y1="324.9" x2="400.0" y2="324.9" stroke="#e2e8f0" stroke-width="1.1"/>
<text x="68.0" y="328.4" font-size="8.9" fill="#64748b" text-anchor="end">4·2πR</text>
<line x1="74.0" y1="412.0" x2="74.0" y2="416.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="74.0" y="428.0" font-size="9.0" fill="#64748b" text-anchor="middle">r=0R</text>
<line x1="209.8" y1="412.0" x2="209.8" y2="416.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="209.8" y="428.0" font-size="9.0" fill="#64748b" text-anchor="middle">r=1R</text>
<line x1="345.7" y1="412.0" x2="345.7" y2="416.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="345.7" y="428.0" font-size="9.0" fill="#64748b" text-anchor="middle">r=2R</text>
<line x1="74.0" y1="290.0" x2="74.0" y2="412.0" stroke="#0f172a" stroke-width="1.4"/>
<line x1="74.0" y1="412.0" x2="400.0" y2="412.0" stroke="#0f172a" stroke-width="1.4"/>
