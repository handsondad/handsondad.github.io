<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" viewBox="0 0 760 462" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">庞加莱保角圆盘渐近平行与超平行扇束动画及贝特拉米伪球面图解</title>
<desc id="desc">左栏在庞加莱圆盘上按正交圆精确绘出过点P的2条绿色渐近平行线、无穷多条蓝色超平行线与红色相交线；右栏绘出贝特拉米曳物线伪球面及其r=R奇异棱，解释希尔伯特定理。</desc>
