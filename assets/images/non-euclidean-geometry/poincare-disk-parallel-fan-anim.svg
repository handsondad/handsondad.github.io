<text x="208.0" y="187.0" font-size="9.1" fill="#18794e" text-anchor="start" font-weight="700" class="halo">绿弧：2条渐近平行 (Π≈44.4°)</text>
<text x="198.0" y="276.0" font-size="9.1" fill="#dc2626" text-anchor="middle" font-weight="600" class="halo">红虚弧：相交线 (&lt;Π)</text>
<text x="198.0" y="342.0" font-size="9.2" fill="#64748b" text-anchor="middle">无穷远地平线边界 |z| = 1（走到边界需无穷远路程）</text>
<rect x="34" y="352" width="332" height="84" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="371" font-size="9.4" fill="#18794e" text-anchor="start" font-weight="700">• 绿实弧（恰 2 条渐近平行）：在无穷远边界 A∞、B∞ 刚好追上 l；</text>
<text x="46" y="390" font-size="9.4" fill="#1d6fa5" text-anchor="start" font-weight="700">• 蓝实弧（无穷多条超平行）：连在无穷远边界都与 l 隔开一段弧，</text>
<text x="46" y="409" font-size="9.4" fill="#1e293b" text-anchor="start">  两线拥有唯一公垂线，往两侧越走分得越开！</text>
<text x="46" y="427" font-size="9.4" fill="#dc2626" text-anchor="start">• 红虚弧（相交簇）：夹角小于 Π(d)，在有限远处刺穿 l。</text>
