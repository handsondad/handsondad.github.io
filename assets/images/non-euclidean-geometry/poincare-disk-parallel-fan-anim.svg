<text x="580.0" y="128" font-size="9.5" fill="#18794e" text-anchor="start" font-weight="700">曳物线旋转喇叭</text>
<text x="580.0" y="145" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="600">处处恒负曲率 K = -1/R²</text>
<rect x="410" y="314" width="316" height="122" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="0.9"/>
<text x="422" y="334" font-size="9.9" fill="#18794e" text-anchor="start" font-weight="700">为什么非要用圆盘地图？—— 希尔伯特定理 (1901)</text>
<text x="422" y="353" font-size="9.4" fill="#1e293b" text-anchor="start">• 1868 年贝特拉米在伪球面上找到双曲几何真身，铁证：</text>
<text x="422" y="371" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="700">  若非欧几何有矛盾，欧氏几何自己也会当场崩塌！</text>
<text x="422" y="390" font-size="9.4" fill="#1e293b" text-anchor="start">• 但 1901 年希尔伯特证明：完整的恒负曲率平面面积</text>
