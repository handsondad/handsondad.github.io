<rect x="0.5" y="0.5" width="759" height="435" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">同一道考题“过线外一点 P 作直线 l 的平行线”，三种曲面交出三份答卷！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先守住铁律：曲面上的“直线”必须是零侧偏测地线（窄胶带平贴不起皱），绝不能拿打方向盘的纬线圈冒充</text>
<rect x="20" y="66" width="232" height="356" rx="10" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.3"/>
<rect x="30" y="76" width="212" height="28" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="0.8"/>
<text x="136" y="95" font-size="11.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">① 零曲率面 (K = 0)：恰有 1 条</text>
<rect x="36" y="116" width="200" height="146" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<line x1="48" y1="224" x2="224" y2="224" stroke="#0f172a" stroke-width="2.3"/>
<text x="220" y="240" font-size="9.6" fill="#0f172a" text-anchor="end" font-weight="700">基准直线 l</text>
<line x1="48" y1="156.0" x2="224" y2="156.0" stroke="#18794e" stroke-width="2.3"/>
<text x="220" y="148.0" font-size="9.5" fill="#18794e" text-anchor="end" font-weight="700">唯一平行线 m ∥ l</text>
<line x1="56" y1="132" x2="216" y2="246" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="60" y="128" font-size="9.2" fill="#dc2626" text-anchor="start">微偏一点必相交</text>
<circle cx="136.0" cy="156.0" r="4.2" fill="#1d6fa5" stroke="#fff" stroke-width="1.3"/>
<text x="136.0" y="172.0" font-size="9.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">线外点 P</text>
<rect x="32" y="272" width="208" height="138" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="291" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="700">欧几里得几何（平面 &amp; 圆柱面）：</text>
<text x="42" y="311" font-size="9.6" fill="#1e293b" text-anchor="start">• 过 P 只有 1 条直线永不与 l 相交；</text>
<text x="42" y="330" font-size="9.6" fill="#1e293b" text-anchor="start">• 反直觉彩蛋：圆柱面看着弯，但</text>
<text x="42" y="348" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">  沿母线剪开能无拉伸摊成平纸！</text>
<text x="42" y="367" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">• 高斯曲率 K = κ₁·κ₂ = (1/R)·0 = 0，</text>
<text x="42" y="386" font-size="9.6" fill="#18794e" text-anchor="start" font-weight="700">  平行公理与 180° 内角和照常成立！</text>
<rect x="264" y="66" width="232" height="356" rx="10" fill="#ffffff" stroke="#c25014" stroke-width="1.3"/>
<rect x="274" y="76" width="212" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="0.8"/>
<text x="380" y="95" font-size="11.0" fill="#c25014" text-anchor="middle" font-weight="700">② 正曲率球面 (K &gt; 0)：0 条平行</text>
<circle cx="380.0" cy="189.0" r="62.0" fill="#fffdf9" stroke="#475569" stroke-width="1.5"/>
<path d="M 331.4,150.6 A 48.6,10.7 0 0,0 428.6,150.6" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="380.0" y="141.6" font-size="9.0" fill="#dc2626" text-anchor="middle" font-weight="700">✕ 纬线圈需打轮，不是直线!</text>
<path d="M 318.0,189.0 A 62.0,16 0 0,1 442.0,189.0" fill="none" stroke="#0f172a" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 3"/>
