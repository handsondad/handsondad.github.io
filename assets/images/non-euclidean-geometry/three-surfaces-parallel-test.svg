<text x="612.8" y="175.4" font-size="9.3" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">点 P (张开整把平行扇!)</text>
<rect x="520" y="272" width="208" height="138" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="0.8"/>
<text x="530" y="291" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">罗巴切夫斯基双曲几何（K = -1/R²）：</text>
<text x="530" y="311" font-size="9.6" fill="#1e293b" text-anchor="start">• 前后往上翘、左右往下塌（一正</text>
<text x="530" y="330" font-size="9.6" fill="#1e293b" text-anchor="start">  一负主曲率相乘 K = κ₁·κ₂ &lt; 0）；</text>
<text x="530" y="348" font-size="9.6" fill="#1e293b" text-anchor="start">• 空间像喇叭口往外疯长，过点 P</text>
<text x="530" y="367" font-size="9.6" fill="#18794e" text-anchor="start" font-weight="700">  有无穷多条测地线与 l 永不相交！</text>
