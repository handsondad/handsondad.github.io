<circle cx="320.0" cy="192.0" r="3.6" fill="#dc2626"/>
<circle cx="440.0" cy="186.0" r="3.6" fill="#dc2626"/>
<circle cx="380.0" cy="167.0" r="4.2" fill="#1d6fa5" stroke="#fff" stroke-width="1.3"/>
<text x="398.0" y="161.0" font-size="9.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">点 P</text>
<rect x="276" y="272" width="208" height="138" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="0.8"/>
<text x="286" y="291" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="700">黎曼椭圆 / 球面几何（K = +1/R²）：</text>
<text x="286" y="311" font-size="9.6" fill="#1e293b" text-anchor="start">• 球面“直线”只能是过球心的大圆；</text>
<text x="286" y="330" font-size="9.6" fill="#1e293b" text-anchor="start">• 任意两个不同过球心平面必交于</text>
<text x="286" y="348" font-size="9.6" fill="#dc2626" text-anchor="start" font-weight="700">  一条直径 → 大圆必相交 2 次！</text>
<text x="286" y="367" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">• 平行线 = 0 条！空间往里收拢，</text>
<text x="286" y="386" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">  连赤道上垂线都会在北极撞车！</text>
<rect x="508" y="66" width="232" height="356" rx="10" fill="#ffffff" stroke="#18794e" stroke-width="1.3"/>
<rect x="518" y="76" width="212" height="28" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="0.8"/>
<text x="624" y="95" font-size="11.0" fill="#18794e" text-anchor="middle" font-weight="700">③ 负曲率马鞍 (K &lt; 0)：无穷多条</text>
