<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">非欧几何在自然荷叶边生物、双曲薄壳建筑、AI双曲词向量与宇宙学曲率测量中的四大前沿应用</title>
<desc id="desc">四宫格展示非欧几何的真实世界应用：1. 生菜珊瑚与泰米娜钩针双曲面；2. 双曲抛物面薯片与直母线双曲冷却塔；3. AI庞加莱圆盘层级树嵌入；4. CMB宇宙大三角形测量与广义相对论。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="neg-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d6fa5"/>
    </marker>
    <marker id="neg-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18794e"/>
    </marker>
    <marker id="neg-arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="409" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">非欧几何就在你身边：从卷边生菜、薯片薄壳到 AI 词向量与 138 亿光年宇宙</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">只要出现“边缘比中心长得快”“双向反弯抗压”或“指数级分叉树”，负曲率双曲几何就是大自然与工程师的首选</text>
<rect x="20" y="66" width="352" height="158" rx="10" fill="#ffffff" stroke="#18794e" stroke-width="1.3"/>
<rect x="30" y="76" width="332" height="28" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="0.8"/>
<text x="40" y="95" font-size="10.8" fill="#18794e" text-anchor="start" font-weight="700">1. 生物与手工：卷边生菜、珊瑚礁与钩针双曲面</text>
<text x="34" y="122" font-size="9.6" fill="#1e293b" text-anchor="start">• 为什么生菜叶、木耳、海蛞蝓与珊瑚边缘全都是波浪荷叶边？</text>
<text x="34" y="142" font-size="9.6" fill="#1e293b" text-anchor="start">• 因为叶片边缘细胞分裂比中心快，周长按 C ~ sinh(r) 暴涨，</text>
<text x="34" y="162" font-size="9.6" fill="#1e293b" text-anchor="start">  平纸塞不下多余周长，只能在三维里自动拱成负曲率褶皱！</text>
<text x="34" y="182" font-size="9.6" fill="#1e293b" text-anchor="start">• 1997 年数学家戴娜·泰米娜用毛线钩针“每 N 针加 1 针”，</text>
<text x="34" y="202" font-size="9.6" fill="#1e293b" text-anchor="start">  第一次让人们亲手摸到并折纸验证了柔韧的双曲平面。</text>
<rect x="388" y="66" width="352" height="158" rx="10" fill="#ffffff" stroke="#c25014" stroke-width="1.3"/>
<rect x="398" y="76" width="332" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="0.8"/>
<text x="408" y="95" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">2. 工程与美食：品客薯片与百米核电双曲冷却塔</text>
<text x="402" y="122" font-size="9.6" fill="#1e293b" text-anchor="start">• 平薯片一捏就碎，品客薯片做成双曲抛物面 z = x²/a² − y²/b²</text>
<text x="402" y="142" font-size="9.6" fill="#1e293b" text-anchor="start">  （K &lt; 0）：没有固定折痕线，应力向双向分散，装罐不碎！</text>
<text x="402" y="162" font-size="9.6" fill="#1e293b" text-anchor="start">• 发电厂百米冷却塔采用单叶双曲面：整个弯曲塔身竟然完全</text>
<text x="402" y="182" font-size="9.6" fill="#1e293b" text-anchor="start">  由笔直钢筋（直母线）交叉编成！一方向拱受压、另一方向</text>
<text x="402" y="202" font-size="9.6" fill="#1e293b" text-anchor="start">  索受拉，混凝土壳厚仅十几厘米就能硬扛十二级台风。</text>
<rect x="20" y="238" width="352" height="158" rx="10" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.3"/>
<rect x="30" y="248" width="332" height="28" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="0.8"/>
<text x="40" y="267" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="700">3. 人工智能：庞加莱双曲嵌入（Nickel &amp; Kiela 2017）</text>
<text x="34" y="294" font-size="9.6" fill="#1e293b" text-anchor="start">• 人类词汇表、生物分类树与社交网络每往下走 1 层，节点数</text>
<text x="34" y="314" font-size="9.6" fill="#1e293b" text-anchor="start">  按 b^d 指数爆炸——塞进欧氏空间（体积仅 r^n）拥挤不堪；</text>
<text x="34" y="334" font-size="9.6" fill="#1e293b" text-anchor="start">• 把知识树放进庞加莱双曲球：圆周长 sinh(r) 同样指数增长！</text>
<text x="34" y="354" font-size="9.6" fill="#1e293b" text-anchor="start">• 树根放圆心、叶子铺向无穷远边界，仅用 5 维双曲向量的</text>
<text x="34" y="374" font-size="9.6" fill="#1e293b" text-anchor="start">  重构精度就远超 200 维欧氏词向量（WordNet 实测突破）。</text>
<rect x="388" y="238" width="352" height="158" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.3"/>
<rect x="398" y="248" width="332" height="28" rx="6" fill="#f3e8ff" stroke="#6d28d9" stroke-width="0.8"/>
<text x="408" y="267" font-size="10.8" fill="#6d28d9" text-anchor="start" font-weight="700">4. 宇宙学与相对论：给可观测宇宙量“大三角形内角和”</text>
<text x="402" y="294" font-size="9.6" fill="#1e293b" text-anchor="start">• 1820 年代高斯思考过测量三座山峰光线大三角形检验空间曲率；</text>
<text x="402" y="314" font-size="9.6" fill="#1e293b" text-anchor="start">• 今天普朗克卫星拿 138 亿光年外的宇宙微波背景辐射（CMB）</text>
<text x="402" y="334" font-size="9.6" fill="#1e293b" text-anchor="start">  声学斑块当底边，实测宇宙大三角形内角和几乎精确等于 180°</text>
<text x="402" y="354" font-size="9.6" fill="#1e293b" text-anchor="start">  （|Ω_K| &lt; 0.005，大尺度近乎平坦）；而在太阳与黑洞附近，</text>
<text x="402" y="374" font-size="9.6" fill="#1e293b" text-anchor="start">  黎曼非欧弯曲时空每天都在偏折星光、校准你手机里的 GPS！</text>
</svg>
