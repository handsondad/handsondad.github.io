<rect x="0.5" y="0.5" width="759" height="437" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">死磕两千年的“第五公设悬案”：萨凯里三假说与罗巴切夫斯基平行角公式</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">想用反证法保卫欧几里得，却意外推演出零破绽的“锐角新宇宙”：平行角 Π(d) = 2 arctan(e^(-d/R))</text>
<rect x="20" y="66" width="352" height="358" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="90" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">① 萨凯里双直角四边形 ABCD（1733）</text>
<text x="36" y="109" font-size="9.6" fill="#64748b" text-anchor="start">底边 ∠A=∠B=90°，立柱 AD=BC：顶角 ∠C, ∠D 等于几度？</text>
<rect x="34" y="120" width="324" height="86" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.0"/>
<text x="46" y="139" font-size="9.9" fill="#1d6fa5" text-anchor="start" font-weight="700">直角假说（∠D = ∠C = 90°）→ 欧氏平面 K = 0</text>
<line x1="58.0" y1="192.0" x2="128.0" y2="192.0" stroke="#0f172a" stroke-width="1.8"/>
<line x1="58.0" y1="192.0" x2="58.0" y2="154.0" stroke="#1d6fa5" stroke-width="1.9"/>
<line x1="128.0" y1="192.0" x2="128.0" y2="154.0" stroke="#1d6fa5" stroke-width="1.9"/>
<path d="M 58.0,154.0 Q 93.0,154.0 128.0,154.0" fill="none" stroke="#1d6fa5" stroke-width="2.0"/>
<rect x="58.0" y="186.0" width="6" height="6" fill="none" stroke="#0f172a" stroke-width="1.0"/>
<rect x="122.0" y="186.0" width="6" height="6" fill="none" stroke="#0f172a" stroke-width="1.0"/>
<text x="148" y="168" font-size="9.5" fill="#1e293b" text-anchor="start">顶边 DC = 底边 AB，平行线</text>
<text x="148" y="187" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">处处等距且唯一</text>
<rect x="34" y="216" width="324" height="86" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.0"/>
<text x="46" y="235" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="700">钝角假说（∠D = ∠C &gt; 90°）→ 球面几何 K &gt; 0</text>
<line x1="58.0" y1="288.0" x2="128.0" y2="288.0" stroke="#0f172a" stroke-width="1.8"/>
<line x1="58.0" y1="288.0" x2="72.0" y2="250.0" stroke="#c25014" stroke-width="1.9"/>
<line x1="128.0" y1="288.0" x2="114.0" y2="250.0" stroke="#c25014" stroke-width="1.9"/>
<path d="M 72.0,250.0 Q 93.0,245.0 114.0,250.0" fill="none" stroke="#c25014" stroke-width="2.0"/>
<rect x="58.0" y="282.0" width="6" height="6" fill="none" stroke="#0f172a" stroke-width="1.0"/>
<rect x="122.0" y="282.0" width="6" height="6" fill="none" stroke="#0f172a" stroke-width="1.0"/>
<text x="148" y="264" font-size="9.5" fill="#1e293b" text-anchor="start">立柱往内收拢，顶边 DC &lt; AB</text>
<text x="148" y="283" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">，继续延伸必相交</text>
<rect x="34" y="312" width="324" height="86" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.0"/>
<text x="46" y="331" font-size="9.9" fill="#18794e" text-anchor="start" font-weight="700">锐角假说（∠D = ∠C &lt; 90°）→ 双曲几何 K &lt; 0</text>
<line x1="58.0" y1="384.0" x2="128.0" y2="384.0" stroke="#0f172a" stroke-width="1.8"/>
<line x1="58.0" y1="384.0" x2="43.0" y2="346.0" stroke="#18794e" stroke-width="1.9"/>
<line x1="128.0" y1="384.0" x2="143.0" y2="346.0" stroke="#18794e" stroke-width="1.9"/>
<path d="M 43.0,346.0 Q 93.0,352.0 143.0,346.0" fill="none" stroke="#18794e" stroke-width="2.0"/>
<rect x="58.0" y="378.0" width="6" height="6" fill="none" stroke="#0f172a" stroke-width="1.0"/>
<rect x="122.0" y="378.0" width="6" height="6" fill="none" stroke="#0f172a" stroke-width="1.0"/>
<text x="148" y="360" font-size="9.5" fill="#1e293b" text-anchor="start">立柱往外敞开，顶边 DC &gt; AB</text>
<text x="148" y="379" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">，萨凯里苦找矛盾却扑空!</text>
<rect x="388" y="66" width="352" height="358" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="90" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">② 罗巴切夫斯基平行角 Π(d) 精确曲线</text>
<text x="404" y="109" font-size="9.6" fill="#64748b" text-anchor="start">垂距 d 越远，临界平行角 Π(d) 越锐，平行扇区张得越宽！</text>
<line x1="436.0" y1="292.0" x2="712.0" y2="292.0" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="430.0" y="295.5" font-size="9.2" fill="#64748b" text-anchor="end">0°</text>
<line x1="436.0" y1="245.2" x2="712.0" y2="245.2" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="430.0" y="248.7" font-size="9.2" fill="#64748b" text-anchor="end">30°</text>
<line x1="436.0" y1="198.4" x2="712.0" y2="198.4" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="430.0" y="201.9" font-size="9.2" fill="#64748b" text-anchor="end">60°</text>
<line x1="436.0" y1="151.6" x2="712.0" y2="151.6" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="430.0" y="155.1" font-size="9.2" fill="#64748b" text-anchor="end">90°</text>
<text x="708.0" y="145.6" font-size="9.3" fill="#1d6fa5" text-anchor="end" font-weight="700">欧氏恒为 Π = 90° (唯一平行)</text>
<line x1="436.0" y1="292.0" x2="436.0" y2="296.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="436.0" y="308.0" font-size="9.2" fill="#64748b" text-anchor="middle">0R</text>
<line x1="517.2" y1="292.0" x2="517.2" y2="296.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="517.2" y="308.0" font-size="9.2" fill="#64748b" text-anchor="middle">1R</text>
<line x1="598.4" y1="292.0" x2="598.4" y2="296.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="598.4" y="308.0" font-size="9.2" fill="#64748b" text-anchor="middle">2R</text>
<line x1="679.5" y1="292.0" x2="679.5" y2="296.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="679.5" y="308.0" font-size="9.2" fill="#64748b" text-anchor="middle">3R</text>
<text x="574.0" y="323.0" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">无量纲距离 d / R（R 为双曲曲率半径）</text>
<line x1="436.0" y1="136.0" x2="436.0" y2="292.0" stroke="#0f172a" stroke-width="1.4"/>
<line x1="436.0" y1="292.0" x2="712.0" y2="292.0" stroke="#0f172a" stroke-width="1.4"/>
