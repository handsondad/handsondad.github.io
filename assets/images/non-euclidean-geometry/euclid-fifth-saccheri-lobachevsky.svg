<text x="452.0" y="149.6" font-size="9.2" fill="#dc2626" text-anchor="start" font-weight="700" class="halo">d→0: 90.0°</text>
<circle cx="517.2" cy="229.0" r="3.8" fill="#dc2626" stroke="#fff" stroke-width="1.2"/>
