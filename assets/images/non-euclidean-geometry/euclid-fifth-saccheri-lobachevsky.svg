<rect x="402" y="332" width="324" height="78" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="414" y="351" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">为什么日常生活里我们察觉不到双曲平行角？</text>
<text x="414" y="370" font-size="9.5" fill="#1e293b" text-anchor="start">• 若宇宙曲率半径 R 达百亿光年，教室里 d/R ≈ 10⁻²⁶，</text>
<text x="414" y="389" font-size="9.5" fill="#18794e" text-anchor="start" font-weight="700">  此时 Π(d) ≈ 89.999999999999999999999999° ≈ 90°！</text>
<text x="414" y="405" font-size="9.4" fill="#64748b" text-anchor="start">  局部极小范围内，非欧几何严丝合缝退回欧氏几何！</text>
</svg>
