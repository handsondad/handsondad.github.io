<text x="44" y="371" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="700">刘维尔椭圆函数铁律（为什么全纯双周期必为常数？）：</text>
<text x="44" y="390" font-size="9.0" fill="#1e293b" text-anchor="start">• 若处处无极点，闭合有界胞腔 P₀ 锁死最大值 ⇒ 全平面有界必常数！</text>
<text x="44" y="408" font-size="9.0" fill="#1e293b" text-anchor="start">• 留数和为 0 ⇒ 不可能有单极点！最简选择：魏尔斯特拉斯 ℘(z) 在格</text>
<text x="44" y="426" font-size="9.0" fill="#18794e" text-anchor="start" font-weight="600">  点放 1 个二阶极点（红点 ●），绿点 z 与 z+ω₁, z+ω₂ 函数值全相等。</text>
