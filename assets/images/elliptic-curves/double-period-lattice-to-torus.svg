<text x="464" y="434" font-size="9.0" fill="#18794e" text-anchor="middle" font-weight="700">光滑三次曲线 y² = x³+ax+b</text>
<rect x="536" y="268" width="194" height="178" rx="8" fill="#e7f6ee" stroke="#bbf7d0" stroke-width="1"/>
<text x="547" y="288" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">命名冤案彻底破案：</text>
<text x="547" y="308" font-size="8.9" fill="#1e293b" text-anchor="start">1. ℘ 含 z⁻²，导数 ℘&#x27; 含 −2z⁻³；</text>
<text x="547" y="326" font-size="8.9" fill="#1e293b" text-anchor="start">   配成 (℘&#x27;)² − 4℘³ 刚好抵消</text>
<text x="547" y="344" font-size="8.9" fill="#18794e" text-anchor="start" font-weight="700">   6 阶主极点！</text>
<text x="547" y="364" font-size="8.9" fill="#1e293b" text-anchor="start">2. 化简即得三次代数曲线方程：</text>
