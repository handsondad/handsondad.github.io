<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么明明不是椭圆，却叫“椭圆曲线”？从双周期晶格到甜甜圈变形记</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">闯进复平面 C 后涌现两个独立周期 ω₁, ω₂；把基本平行四边形对边黏成复环面，经 ℘(z) 投射恰为三次曲线！</text>
