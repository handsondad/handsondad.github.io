<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">椭圆函数双周期晶格黏合为复环面并经魏尔斯特拉斯函数同构映射为三次椭圆曲线</title>
<desc id="desc">左图展示复平面双周期平行四边形晶格Λ=Zω₁+Zω₂、基本胞腔对边黏合箭头与二阶极点分布；右图展示黏合后的亏格1复环面（甜甜圈）经Φ(z)=(℘(z),℘&#x27;(z))映射为光滑三次曲线y²=4x³-g₂x-g₃的过程，解释椭圆曲线得名的真正原因。</desc>
