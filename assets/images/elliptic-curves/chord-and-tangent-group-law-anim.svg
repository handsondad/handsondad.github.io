<text x="30" y="443" font-size="8.5" fill="#1e293b" text-anchor="start">• 蓝实线（割线相加）：过 P, Q 连 y=x+1 交 R&#x27;(3,4)，沿 x 轴翻折得 P+Q=(3,-4)</text>
<text x="30" y="459" font-size="8.5" fill="#64748b" text-anchor="start">• 紫虚线（切线倍点）：过 Q 作切线 y=−x+3 交 D&#x27;(-1,4)，翻折得 2Q=(-1,-4)</text>
<rect x="450" y="66" width="292" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
