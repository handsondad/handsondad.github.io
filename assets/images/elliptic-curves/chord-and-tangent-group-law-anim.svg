<text x="596.0" y="93.0" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="600">② 两大灵魂追问：为什么要翻折？结合律怎证？</text>
<rect x="464" y="108" width="264" height="182" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="476" y="127" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="700">复环面视角一秒看穿（免去 50 行死算！）：</text>
<text x="476" y="146" font-size="8.9" fill="#1e293b" text-anchor="start">1. 直线 y = sx + d 代入 (℘(z), ℘&#x27;(z))，在格点</text>
<text x="476" y="163" font-size="8.9" fill="#1e293b" text-anchor="start">   0 处有 3 阶极点，故三交点参数必满足：</text>
<text x="596" y="183" font-size="9.3" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="mono">z_P + z_Q + z_R&#x27; ≡ 0 (mod Λ)</text>
<text x="476" y="203" font-size="8.9" fill="#c25014" text-anchor="start" font-weight="700">2. 所以第三交点 R&#x27; 对应的是 −(z_P + z_Q)！</text>
<text x="476" y="221" font-size="8.9" fill="#1e293b" text-anchor="start">   因 ℘(-z)=℘(z) 偶、℘&#x27;(-z)=-℘&#x27;(z) 奇，</text>
<text x="476" y="239" font-size="8.9" fill="#c25014" text-anchor="start" font-weight="700">   沿 x 轴上下翻折变号，恰好还原 z_P + z_Q！</text>
<text x="476" y="259" font-size="8.9" fill="#1e293b" text-anchor="start">3. 环面上普通复数加法天然满足结合律，故</text>
<text x="476" y="276" font-size="8.9" fill="#18794e" text-anchor="start" font-weight="700">   (P+Q)+S = P+(Q+S) 不证自明（零元为 O）！</text>
<rect x="464" y="298" width="264" height="158" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
<text x="476" y="318" font-size="9.6" fill="#b91c1c" text-anchor="start" font-weight="700">红线禁区：为什么必须要求判别式 Δ ≠ 0？</text>
<text x="476" y="336" font-size="8.9" fill="#1e293b" text-anchor="start">一旦 4a³ + 27b² = 0，曲线出现奇点，群律崩塌：</text>
