<title id="title">椭圆曲线y²=x³-7x+10上的弦切加法动画、复环面结合律证明与奇异三次曲线反例</title>
<desc id="desc">左图在精确光滑曲线y²=x³-7x+10上演绎P(-3,-2)与Q(1,2)连线交R&#x27;(3,4)后沿x轴翻折得P+Q=(3,-4)及切线倍点2Q=(-1,-4)的单次动画；右图用复环面z_P+z_Q+z_R&#x27;≡0解释翻折与结合律，并给出Δ=0尖点与自交结点两个退化反例。</desc>
