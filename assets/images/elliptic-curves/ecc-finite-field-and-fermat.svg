<text x="268" y="140" font-size="8.8" fill="#6d28d9" text-anchor="start" font-weight="700">对称轴 y = 8.5</text>
<text x="268" y="156" font-size="8.4" fill="#64748b" text-anchor="start">(y 与 17−y 配对)</text>
<text x="268" y="184" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="700">倍点跳蛙链：</text>
<text x="268" y="202" font-size="8.6" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">1G = (5, 1)</text>
<text x="268" y="219" font-size="8.6" fill="#c25014" text-anchor="start" class="mono">2G = (6, 3)</text>
<text x="268" y="236" font-size="8.6" fill="#c25014" text-anchor="start" class="mono">3G = (10, 6)</text>
<text x="268" y="253" font-size="8.6" fill="#1e293b" text-anchor="start" class="mono">4G = (3, 1)</text>
<text x="268" y="270" font-size="8.6" fill="#18794e" text-anchor="start" font-weight="700" class="mono">7G = (0, 6)</text>
<text x="268" y="287" font-size="8.6" fill="#b91c1c" text-anchor="start" font-weight="700" class="mono">19G = O (回零!)</text>
<rect x="32" y="350" width="348" height="96" rx="8" fill="#eaf4fb" stroke="#bfdbfe" stroke-width="1"/>
<text x="44" y="370" font-size="9.4" fill="#1d6fa5" text-anchor="start" font-weight="700">椭圆曲线离散对数单向陷门（HTTPS / TLS / 比特币基石）：</text>
<text x="44" y="389" font-size="8.9" fill="#1e293b" text-anchor="start">• 正算极快：已知私钥 k 算公钥 Q=kG，靠“倍点+相加”256 位仅需毫秒；</text>
<text x="44" y="408" font-size="8.9" fill="#1e293b" text-anchor="start">• 反推绝望：已知 G 和散乱落点 Q 反猜跳了几步 k，经典计算机束手无策；</text>
<text x="44" y="427" font-size="8.9" fill="#c25014" text-anchor="start" font-weight="700">• 钥匙瘦身 12 倍：256 位 ECC 安全强度 ≈ 3072 位 RSA（NIST 标准）！</text>
<rect x="404" y="66" width="338" height="392" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="416.0" y="78.0" width="278" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="555.0" y="93.0" font-size="10.3" fill="#6d28d9" text-anchor="middle" font-weight="600">② 攻克数论珠峰：椭圆曲线智破费马大定理</text>
<rect x="416" y="114" width="314" height="72" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
<text x="427" y="134" font-size="9.4" fill="#b91c1c" text-anchor="start" font-weight="700">第 1 步｜弗雷构造“怪物曲线”（Frey, 1984–1985）</text>
<text x="427" y="154" font-size="8.8" fill="#1e293b" text-anchor="start">假设费马大定理有反例 Aᵖ + Bᵖ = Cᵖ (素数 p ≥ 5)，</text>
<text x="427" y="172" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">造弗雷曲线 y² = x(x−Aᵖ)(x+Bᵖ)，判别式竟是 2p 次幂！</text>
<rect x="416" y="200" width="314" height="72" rx="8" fill="#fef1e8" stroke="#fed7aa" stroke-width="1"/>
<text x="427" y="220" font-size="9.4" fill="#c25014" text-anchor="start" font-weight="700">第 2 步｜里贝特定理断后路（Ribet, 1986）</text>
<text x="427" y="240" font-size="8.8" fill="#1e293b" text-anchor="start">严格证出塞尔 ε 猜想：这头“弗雷曲线”扭曲到极点，</text>
<text x="427" y="258" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">绝不可能是模形式化身（必然违反谷山—志村猜想）！</text>
<rect x="416" y="286" width="314" height="72" rx="8" fill="#eaf4fb" stroke="#bfdbfe" stroke-width="1"/>
<text x="427" y="306" font-size="9.4" fill="#1d6fa5" text-anchor="start" font-weight="700">第 3 步｜怀尔斯七年铸剑（Wiles &amp; Taylor, 1994–1995）</text>
<text x="427" y="326" font-size="8.8" fill="#1e293b" text-anchor="start">安德鲁·怀尔斯面壁七年并携泰勒补齐最后一环，</text>
<text x="427" y="344" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">证出半稳定有理椭圆曲线 100% 模块化（谷山—志村成立）！</text>
<rect x="416" y="372" width="314" height="72" rx="8" fill="#e7f6ee" stroke="#bbf7d0" stroke-width="1"/>
<text x="427" y="392" font-size="9.4" fill="#18794e" text-anchor="start" font-weight="700">第 4 步｜绝杀归谬（悬置 358 年难题终结！）</text>
<text x="427" y="412" font-size="8.8" fill="#1e293b" text-anchor="start">既必须模块化、又绝不可能模块化 ⇒ 弗雷曲线不存在</text>
<text x="427" y="430" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">⇒ Aⁿ + Bⁿ = Cⁿ (n ≥ 3) 无正整数解！椭圆曲线一锤定音。</text>
