<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">有限域椭圆曲线密码学E(F17)离散点云与费马大定理弗雷-里贝特-怀尔斯四步绝杀链</title>
<desc id="desc">左图精确计算模17有限域上椭圆曲线y²≡x³+2x+2的全部18个离散格点及生成元G=(5,1)倍点跳变，解释ECC离散对数单向陷门为何以256位密钥匹敌3072位RSA；右图展示弗雷曲线、里贝特定理与怀尔斯模性定理终结费马大定理的四步逻辑链。</desc>
