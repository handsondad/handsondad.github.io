<svg xmlns="http://www.w3.org/2000/svg" width="540" height="611.25" viewBox="0 0 540 611.25" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">图 7｜织机有两条不同的升级路线</title><desc id="desc">引纬及动力、花纹选择的平行历史示意；不是所有地区必经的统一演化链。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="609.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="41.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">图 7｜织机有两条不同的升级路线</text><text x="42" y="100.52" font-size="16.7" fill="#176786" text-anchor="start">把纬线送得更快</text><rect x="42" y="155" width="290" height="100" rx="12" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="54" y="190.66" font-size="15.2" fill="#176786" text-anchor="start">手动引纬</text><text x="54" y="228.94" font-size="15.2" fill="#172b45" text-anchor="start">手送梭子穿过梭口</text><path d="M187.000,262.000 L187.000,285.000" fill="none" stroke="#176786" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="42" y="295" width="290" height="100" rx="12" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="54" y="330.66" font-size="15.2" fill="#176786" text-anchor="start">1733：飞梭</text><text x="54" y="368.94" font-size="15.2" fill="#172b45" text-anchor="start">改变梭子的投送方式</text><path d="M187.000,402.000 L187.000,425.000" fill="none" stroke="#176786" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="42" y="435" width="290" height="100" rx="12" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="54" y="470.66" font-size="15.2" fill="#176786" text-anchor="start">1785：动力织机专利</text><text x="54" y="508.94" font-size="15.2" fill="#172b45" text-anchor="start">把织造循环交给动力驱动</text><path d="M187.000,542.000 L187.000,565.000" fill="none" stroke="#176786" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="42" y="575" width="290" height="100" rx="12" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="54" y="610.66" font-size="15.2" fill="#176786" text-anchor="start">现代无梭引纬</text><text x="54" y="648.94" font-size="15.2" fill="#172b45" text-anchor="start">剑杆、气流或片梭带纬</text><text x="387" y="100.52" font-size="16.7" fill="#b34039" text-anchor="start">把提经选择记得更复杂</text><rect x="387" y="155" width="290" height="100" rx="12" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="399" y="190.66" font-size="15.2" fill="#b34039" text-anchor="start">早期纹织与花综</text><text x="399" y="228.94" font-size="15.2" fill="#172b45" text-anchor="start">把组合存进综线配置</text><path d="M532.000,262.000 L532.000,285.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="387" y="295" width="290" height="100" rx="12" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="399" y="330.66" font-size="15.2" fill="#b34039" text-anchor="start">18 世纪前驱</text><text x="399" y="368.94" font-size="15.2" fill="#172b45" text-anchor="start">穿孔纸带与卡片控制</text><path d="M532.000,402.000 L532.000,425.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="387" y="435" width="290" height="100" rx="12" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="399" y="470.66" font-size="15.2" fill="#b34039" text-anchor="start">19 世纪初：提花机构</text><text x="399" y="508.94" font-size="15.2" fill="#172b45" text-anchor="start">逐纬读取可更换的卡链</text><path d="M532.000,542.000 L532.000,565.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="387" y="575" width="290" height="100" rx="12" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="399" y="610.66" font-size="15.2" fill="#b34039" text-anchor="start">现代电子提花</text><text x="399" y="648.94" font-size="15.2" fill="#172b45" text-anchor="start">用数据控制提经选择</text><text x="36" y="773.52" font-size="16.7" fill="#172b45" text-anchor="start">两条路线可以组合：手动也能提花，动力也能织平纹。</text></g></svg>
