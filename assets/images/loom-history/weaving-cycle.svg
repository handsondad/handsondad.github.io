<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1010" viewBox="0 0 720 1010" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">图 2｜一梭布，要做三件事</title><desc id="desc">侧视三阶段梭口与纬纱截面。开口、横向引纬、筘推纬到织口；省略送经卷取。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1010" fill="#f3f7fa"/><text x="36" y="44" font-size="28" fill="#172b45" text-anchor="start">图 2｜一梭布，要做三件事</text><rect x="24" y="70" width="672" height="260" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="110" font-size="25" fill="#172b45" text-anchor="start">① 开口：把经线分成上下两层</text><rect x="65" y="195" width="85" height="40" rx="0" fill="#dfe9ef" stroke="#ccd8e2" stroke-width="2"/><text x="65" y="155" font-size="22" fill="#172b45" text-anchor="start">已织成的布</text><path d="M150.000,215.000 L460.000,173.000 L620.000,215.000" fill="none" stroke="#176786" stroke-width="4"/><path d="M460.000,157.000 L460.000,189.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M150.000,215.000 L460.000,257.000 L620.000,215.000" fill="none" stroke="#172b45" stroke-width="4" stroke-dasharray="8 6"/><path d="M460.000,241.000 L460.000,273.000" fill="none" stroke="#172b45" stroke-width="3"/><text x="520" y="155" font-size="21" fill="#172b45" text-anchor="start">经线来自后方</text><text x="240" y="275" font-size="23" fill="#172b45" text-anchor="start">上下层之间是梭口</text><rect x="24" y="350" width="672" height="260" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="390" font-size="25" fill="#172b45" text-anchor="start">② 引纬：纬线从梭口穿过</text><rect x="65" y="475" width="85" height="40" rx="0" fill="#dfe9ef" stroke="#ccd8e2" stroke-width="2"/><text x="65" y="435" font-size="22" fill="#172b45" text-anchor="start">已织成的布</text><path d="M150.000,495.000 L460.000,453.000 L620.000,495.000" fill="none" stroke="#176786" stroke-width="4"/><path d="M460.000,437.000 L460.000,469.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M150.000,495.000 L460.000,537.000 L620.000,495.000" fill="none" stroke="#172b45" stroke-width="4" stroke-dasharray="8 6"/><path d="M460.000,521.000 L460.000,553.000" fill="none" stroke="#172b45" stroke-width="3"/><text x="520" y="435" font-size="21" fill="#172b45" text-anchor="start">经线来自后方</text><circle cx="320.000" cy="495.000" r="10" fill="#b77a09"/><text x="235" y="555" font-size="22" fill="#b77a09" text-anchor="start">金点＝新纬线的横截面</text><rect x="24" y="630" width="672" height="260" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="670" font-size="25" fill="#172b45" text-anchor="start">③ 打纬：把新纬线推向织口</text><rect x="65" y="755" width="85" height="40" rx="0" fill="#dfe9ef" stroke="#ccd8e2" stroke-width="2"/><text x="65" y="715" font-size="22" fill="#172b45" text-anchor="start">已织成的布</text><path d="M150.000,775.000 L460.000,733.000 L620.000,775.000" fill="none" stroke="#176786" stroke-width="4"/><path d="M460.000,717.000 L460.000,749.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M150.000,775.000 L460.000,817.000 L620.000,775.000" fill="none" stroke="#172b45" stroke-width="4" stroke-dasharray="8 6"/><path d="M460.000,801.000 L460.000,833.000" fill="none" stroke="#172b45" stroke-width="3"/><text x="520" y="715" font-size="21" fill="#172b45" text-anchor="start">经线来自后方</text><circle cx="170.000" cy="775.000" r="10" fill="#b77a09"/><text x="235" y="835" font-size="22" fill="#b77a09" text-anchor="start">金点＝新纬线的横截面</text><path d="M320.000,775.000 L192.000,775.000" fill="none" stroke="#b34039" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M200.000,743.000 L200.000,807.000" fill="none" stroke="#b34039" stroke-width="3"/><text x="36" y="935" font-size="23" fill="#172b45" text-anchor="start">沿经线方向的侧视；不同经线在此叠合。</text><text x="36" y="973" font-size="23" fill="#172b45" text-anchor="start">引纬沿布宽运动，不能画成沿经线跑。</text></svg>
