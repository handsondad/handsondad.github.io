<svg xmlns="http://www.w3.org/2000/svg" width="540" height="690" viewBox="0 0 540 690" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">图 5｜孔不是拉线的手，而是一个许可</title><desc id="desc">简化单举式针钩两状态：有孔使钩保持对准提升刀，无孔推针使钩偏离；非制造图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="688.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="41.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">图 5｜孔不是拉线的手，而是一个许可</text><rect x="24" y="70" width="672" height="345" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="108.39" font-size="18.2" fill="#172b45" text-anchor="start">① 有孔：针通过，钩留在提升位置</text><rect x="550" y="150" width="28" height="160" rx="0" fill="#ead8b6" stroke="#ccd8e2" stroke-width="2"/><rect x="548" y="213" width="32" height="24" rx="0" fill="#fff" stroke="#fff" stroke-width="2"/><path d="M310.000,225.000 L600.000,225.000" fill="none" stroke="#172b45" stroke-width="2.4"/><path d="M310.000,295.000 L310.000,160.000 L338.000,160.000 L338.000,174.000" fill="none" stroke="#176786" stroke-width="4.1"/><rect x="330" y="188" width="70" height="12" rx="0" fill="#b34039" stroke="#ccd8e2" stroke-width="2"/><path d="M390.000,225.000 L390.000,162.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="415" y="186.59" font-size="16.0" fill="#b34039" text-anchor="start">提升刀</text><text x="593" y="280.59" font-size="16.0" fill="#172b45" text-anchor="start">纸卡</text><path d="M310.000,295.000 L310.000,335.000" fill="none" stroke="#176786" stroke-width="2.4" stroke-dasharray="7 6"/><text x="48" y="362.39" font-size="18.2" fill="#172b45" text-anchor="start">钩 → 吊综绳 → 综眼 → 经线</text><rect x="24" y="440" width="672" height="345" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="478.39" font-size="18.2" fill="#172b45" text-anchor="start">② 无孔：针被推回，钩离开提升位置</text><rect x="550" y="520" width="28" height="160" rx="0" fill="#ead8b6" stroke="#ccd8e2" stroke-width="2"/><path d="M235.000,595.000 L555.000,595.000" fill="none" stroke="#172b45" stroke-width="2.4"/><path d="M235.000,665.000 L235.000,530.000 L263.000,530.000 L263.000,544.000" fill="none" stroke="#176786" stroke-width="4.1"/><rect x="330" y="558" width="70" height="12" rx="0" fill="#b34039" stroke="#ccd8e2" stroke-width="2"/><path d="M390.000,595.000 L390.000,532.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="415" y="556.59" font-size="16.0" fill="#b34039" text-anchor="start">提升刀</text><text x="593" y="650.59" font-size="16.0" fill="#172b45" text-anchor="start">纸卡</text><path d="M235.000,665.000 L235.000,705.000" fill="none" stroke="#176786" stroke-width="2.4" stroke-dasharray="7 6"/><text x="48" y="732.39" font-size="18.2" fill="#172b45" text-anchor="start">钩 → 吊综绳 → 综眼 → 经线</text><path d="M520.000,627.000 L450.000,627.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><text x="36" y="838.45" font-size="17.5" fill="#172b45" text-anchor="start">常见单举式的选择逻辑；省略弹簧与支架。</text><text x="36" y="878.39" font-size="18.2" fill="#172b45" text-anchor="start">纸卡只做选择，提升动力另有来源。</text></g></svg>
