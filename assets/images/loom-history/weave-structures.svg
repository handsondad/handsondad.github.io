 x="191" y="781" width="34" height="34" rx="0" fill="#176786" stroke="#ccd8e2" stroke-width="2"/><text x="208.0" y="804.8" font-size="20" fill="#fff" text-anchor="middle">1</text><text x="285" y="688" font-size="22" fill="#172b45" text-anchor="start">每一纬只留一个纬在上点。</text><text x="285" y="733" font-size="22" fill="#172b45" text-anchor="start">相邻纬的该点错开两格。</text><text x="285" y="785" font-size="22" fill="#172b45" text-anchor="start">1＝经在上；0＝纬在上</text><text x="36" y="900" font-size="24" fill="#172b45" text-anchor="start">方格是交织关系，不是印刷颜料。</text><text x="36" y="940" font-size="24" fill="#172b45" text-anchor="start">连续跨过多根另一组线，叫“浮长”。</text></svg>
