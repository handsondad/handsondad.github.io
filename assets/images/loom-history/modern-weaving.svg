<svg xmlns="http://www.w3.org/2000/svg" width="540" height="806.25" viewBox="0 0 540 806.25" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">图 8｜今天的织机：数据选线，机械织布</title><desc id="desc">电子提花选择控制与剑杆、喷气、片梭三种引纬方式的功能示意，省略具体结构。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="804.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="41.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">图 8｜今天的织机：数据选线，机械织布</text><rect x="24" y="70" width="672" height="280" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="110.32" font-size="19.0" fill="#172b45" text-anchor="start">电子提花：换了读法，没取消经纬线</text><rect x="48" y="155" width="190" height="130" rx="10" fill="#eef3f7" stroke="#ccd8e2" stroke-width="2"/><text x="143" y="196.39" font-size="18.2" fill="#176786" text-anchor="middle">设计数据</text><text x="143" y="245.94" font-size="15.2" fill="#172b45" text-anchor="middle">控制器逐纬读取</text><path d="M243.000,220.000 L258.000,220.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="264" y="155" width="190" height="130" rx="10" fill="#eef3f7" stroke="#ccd8e2" stroke-width="2"/><text x="359" y="196.39" font-size="18.2" fill="#176786" text-anchor="middle">电子选择</text><text x="359" y="245.94" font-size="15.2" fill="#172b45" text-anchor="middle">选择钩与提升机构</text><path d="M459.000,220.000 L474.000,220.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="480" y="155" width="190" height="130" rx="10" fill="#eef3f7" stroke="#ccd8e2" stroke-width="2"/><text x="575" y="196.39" font-size="18.2" fill="#176786" text-anchor="middle">吊综与经线</text><text x="575" y="245.94" font-size="15.2" fill="#172b45" text-anchor="middle">形成真实梭口</text><text x="48" y="323.45" font-size="17.5" fill="#172b45" text-anchor="start">下方三种引纬方式，与电子提花不是一回事。</text><rect x="24" y="375" width="672" height="185" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="411.39" font-size="18.2" fill="#172b45" text-anchor="start">① 剑杆：夹住纬线，送入或交接</text><circle cx="170.000" cy="452.000" r="7" fill="#176786"/><circle cx="227.000" cy="502.000" r="7" fill="#176786"/><circle cx="284.000" cy="452.000" r="7" fill="#176786"/><circle cx="341.000" cy="502.000" r="7" fill="#176786"/><circle cx="398.000" cy="452.000" r="7" fill="#176786"/><circle cx="455.000" cy="502.000" r="7" fill="#176786"/><circle cx="512.000" cy="452.000" r="7" fill="#176786"/><circle cx="569.000" cy="502.000" r="7" fill="#176786"/><path d="M140.000,477.000 L590.000,477.000" fill="none" stroke="#b77a09" stroke-width="2.4" stroke-dasharray="7 6"/><rect x="120" y="468" width="230" height="18" rx="0" fill="#ccd8e2" stroke="#ccd8e2" stroke-width="2"/><rect x="350" y="462" width="28" height="30" rx="0" fill="#b77a09" stroke="#ccd8e2" stroke-width="2"/><path d="M420.000,477.000 L565.000,477.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="48" y="536.52" font-size="16.7" fill="#172b45" text-anchor="start">画的是夹持与移动方向，省略回程。</text><rect x="24" y="580" width="672" height="185" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="616.39" font-size="18.2" fill="#172b45" text-anchor="start">② 喷气：用气流带动纬线</text><circle cx="170.000" cy="657.000" r="7" fill="#176786"/><circle cx="227.000" cy="707.000" r="7" fill="#176786"/><circle cx="284.000" cy="657.000" r="7" fill="#176786"/><circle cx="341.000" cy="707.000" r="7" fill="#176786"/><circle cx="398.000" cy="657.000" r="7" fill="#176786"/><circle cx="455.000" cy="707.000" r="7" fill="#176786"/><circle cx="512.000" cy="657.000" r="7" fill="#176786"/><circle cx="569.000" cy="707.000" r="7" fill="#176786"/><path d="M140.000,682.000 L590.000,682.000" fill="none" stroke="#b77a09" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M100.000,662.000 L133.000,675.000 L133.000,689.000 L100.000,702.000" fill="none" stroke="#172b45" stroke-width="3.28"/><path d="M153.000,674.000 L320.000,674.000" fill="none" stroke="#176786" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M153.000,682.000 L320.000,682.000" fill="none" stroke="#176786" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M153.000,690.000 L320.000,690.000" fill="none" stroke="#176786" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M420.000,682.000 L565.000,682.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="48" y="741.52" font-size="16.7" fill="#172b45" text-anchor="start">喷嘴供气；不是把整只梭子吹过去。</text><rect x="24" y="785" width="672" height="185" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="821.39" font-size="18.2" fill="#172b45" text-anchor="start">③ 片梭：小夹持体带着纬线穿过</text><circle cx="170.000" cy="862.000" r="7" fill="#176786"/><circle cx="227.000" cy="912.000" r="7" fill="#176786"/><circle cx="284.000" cy="862.000" r="7" fill="#176786"/><circle cx="341.000" cy="912.000" r="7" fill="#176786"/><circle cx="398.000" cy="862.000" r="7" fill="#176786"/><circle cx="455.000" cy="912.000" r="7" fill="#176786"/><circle cx="512.000" cy="862.000" r="7" fill="#176786"/><circle cx="569.000" cy="912.000" r="7" fill="#176786"/><path d="M140.000,887.000 L590.000,887.000" fill="none" stroke="#b77a09" stroke-width="2.4" stroke-dasharray="7 6"/><rect x="350" y="876" width="50" height="22" rx="5" fill="#b77a09" stroke="#ccd8e2" stroke-width="2"/><path d="M420.000,887.000 L565.000,887.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="48" y="946.52" font-size="16.7" fill="#172b45" text-anchor="start">带的是纬线，不是载满纱的大梭子。</text><text x="36" y="1036.52" font-size="16.7" fill="#172b45" text-anchor="start">引纬图为迎着经线的截面；速度与尺寸不按比例。</text></g></svg>
