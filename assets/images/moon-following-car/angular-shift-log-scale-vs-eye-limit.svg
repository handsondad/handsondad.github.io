<text x="644" y="386" font-size="11" fill="#1e293b" text-anchor="start">转弯前: 前挡风</text>
<text x="644" y="405" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">右转后: 左车窗!</text>
<text x="607" y="444" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">转动效应 Δφ_窗 = −Δψ 与距离无关！</text>
<text x="607" y="465" font-size="11.5" fill="#1e293b" text-anchor="middle">不管天体在 38 万公里还是无穷远，</text>
<text x="607" y="486" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">车头转 90°，月亮立刻横扫 90° 换窗！</text>
