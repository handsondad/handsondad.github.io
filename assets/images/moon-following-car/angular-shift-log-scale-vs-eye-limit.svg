<text x="607" y="234" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">窗内方位 φ_窗 = θ_月 − ψ</text>
<text x="607" y="255" font-size="11.5" fill="#1e293b" text-anchor="middle">ψ = 0° 不变，θ_月 仅变 0.054″</text>
<text x="607" y="276" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">→ 月亮死死钉在同一扇侧窗！</text>
