<line x1="356.4" y1="122.0" x2="356.4" y2="420.0" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="352.4" y="206" font-size="10.5" fill="#b91c1c" text-anchor="end" font-weight="700" class="halo">协和 2150</text>
<circle cx="216.0" cy="254.4" r="4" fill="#1d6fa5"/>
<text x="223.0" y="249.4" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">50°N: 1073 km/h</text>
<circle cx="293.8" cy="420.0" r="4" fill="#1d6fa5"/>
<text x="287.8" y="412.0" font-size="10.5" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">赤道 1670</text>
<text x="368" y="152" font-size="11" fill="#b45309" text-anchor="end" font-weight="700" class="halo">反超自转区：</text>
<text x="368" y="169" font-size="11" fill="#b91c1c" text-anchor="end" font-weight="700" class="halo">太阳从西边升起！</text>
<text x="34" y="478" font-size="11.5" fill="#1e293b" text-anchor="start">• 即使原地停车，地球自转也令太阳 15°/h 西移；</text>
<text x="34" y="498" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 60°N 航线民航向西飞 (900&gt;835) 即可定格落日！</text>
<rect x="406" y="64" width="334" height="454" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="420.0" y="74.0" width="306" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="573.0" y="89.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">B · 两个让日月“移位”的硬核现场</text>
<rect x="420" y="108" width="306" height="202" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
<text x="432" y="130" font-size="12" fill="#fde047" font-weight="700">① 1973.06.30 协和 001 号“夸父追日”</text>
<circle cx="668" cy="154" r="13" fill="#020617" stroke="#fde047" stroke-width="2.2"/>
<polygon points="656,164 680,164 622,232 578,232" fill="#fde047" fill-opacity="0.14"/>
<rect x="432" y="232" width="282" height="12" rx="3" fill="#b45309"/>
<ellipse cx="600" cy="238" rx="24" ry="5" fill="#020617" stroke="#facc15" stroke-width="1"/>
<polygon points="566,196 618,196 602,190 578,190" fill="#f8fafc"/>
<line x1="530" y1="194" x2="562" y2="194" stroke="#38bdf8" stroke-width="1.8"/>
<text x="434" y="156" font-size="11" fill="#e2e8f0">月球本影扫过撒哈拉：</text>
<text x="434" y="175" font-size="11.5" fill="#38bdf8" font-weight="700">影速 ≈ 1,958 km/h (Mach 2.05)</text>
<text x="434" y="218" font-size="11" fill="#cbd5e1">地面站：最多黑 ~7 分钟</text>
<text x="434" y="266" font-size="11.5" fill="#f8fafc">协和 001 号在 17 km 高空同速狂追，</text>
<text x="434" y="287" font-size="11.5" fill="#fde047" font-weight="700">把日全食定在头顶整整 74 分钟！(Nature 1973)</text>
<rect x="420" y="322" width="306" height="182" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1"/>
<text x="432" y="343" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">② 南北长途自驾：大地曲率每 111 km 转 1°</text>
<path d="M446,432 Q536,374 626,432" fill="none" stroke="#0f766e" stroke-width="2.2"/>
<line x1="484" y1="412" x2="466" y2="366" stroke="#1d6fa5" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<line x1="588" y1="412" x2="606" y2="366" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<text x="462" y="361" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">北京天顶</text>
<text x="612" y="361" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">广州天顶</text>
<text x="676" y="392" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">转 17°!</text>
<text x="432" y="456" font-size="11.5" fill="#1e293b" text-anchor="start">• 地球是球体（R ≈ 6,371 km），南北每开 111.2 km，</text>
<text x="432" y="475" font-size="11.5" fill="#1e293b" text-anchor="start">  脚下地平线就倾转 1°；从北京开到广州 (Δφ=17°)，</text>
<text x="432" y="494" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  北极星压低 17°，正午太阳在车窗里抬高 17°！</text>
</svg>
