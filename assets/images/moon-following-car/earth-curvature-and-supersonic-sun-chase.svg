<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">地球不同纬度自转线速度曲线、1973年协和001号74分钟超音速追日全食与南北大地曲率图解</title>
<desc id="desc">左图按v=1670cosφ计算不同纬度追平太阳周日西移所需向西航速；右上还原1973年6月30日协和001号以2.05马赫追赶月球本影创造74分钟日全食纪录；右下说明南北每开111.2公里地平线倾转1度。</desc>
