<rect x="0.5" y="0.5" width="759" height="533" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">四、什么时候不再“死跟着走”？——地球自转、大地曲率与超音速追日</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">把时间拉长到几小时、里程拉长到几百公里，或坐上 2 马赫协和号向西狂追，日月就会明显移位</text>
