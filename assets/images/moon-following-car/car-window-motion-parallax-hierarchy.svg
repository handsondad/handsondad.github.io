<svg xmlns="http://www.w3.org/2000/svg" width="760" height="554" viewBox="0 0 760 554" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">汽车直行100米时的俯视几何视差光路与右侧车窗五层景物角位移阶梯单次动画图解</title>
<desc id="desc">上图对比20米近树视线偏转136.4度与38.4万公里月球视线仅偏0.054角秒的平行光几何；下图按真实角位移比例展示车窗视野内护栏、近树、高楼、远山与月亮的后退幅度，支持减少动态效果。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <clipPath id="mfc-win-clip"><rect x="36.0" y="348.0" width="440.0" height="174.0" rx="8"/></clipPath>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes mfcCarTop {
    0% { transform: translateX(-260px); }
    100% { transform: translateX(0px); }
  }
  @keyframes mfcMtnSlide {
    0% { transform: translateX(4.6px); }
    100% { transform: translateX(0px); }
  }
  @keyframes mfcBldgSlide {
    0% { transform: translateX(113.3px); }
    100% { transform: translateX(0px); }
  }
  @keyframes mfcTreeSweep {
    0% { transform: translateX(380px); }
    100% { transform: translateX(0px); }
  }
  .mfc-car-top { animation: mfcCarTop 7.2s linear 1 forwards; }
  .mfc-mtn { animation: mfcMtnSlide 7.2s linear 1 forwards; }
  .mfc-bldg { animation: mfcBldgSlide 7.2s linear 1 forwards; }
  .mfc-tree { animation: mfcTreeSweep 7.2s cubic-bezier(0.22, 0.68, 0.35, 0.96) 1 forwards; }
  @media (prefers-reduced-motion: reduce) {
    .mfc-car-top, .mfc-mtn, .mfc-bldg, .mfc-tree {
      animation: none !important;
      transform: none !important;
    }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="553" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、车窗外的速度阶梯：近树狂退、远山慢移、月亮“钉”在原处</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">汽车 100 km/h 直行 3.6 秒前进 100 米（单次动画按真实时间放慢 2 倍为 7.2 秒，停在终态）</text>
<rect x="20" y="64" width="720" height="228" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="548" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="308.0" y="89.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 俯视几何光路（纵深压缩示意）：近处视线大角度偏转 vs 38.4 万公里平行月光</text>
<text x="726" y="90" font-size="11.5" fill="#64748b" text-anchor="end">注：纵深非等比</text>
<rect x="196" y="244" width="360" height="28" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
<line x1="204" y1="258" x2="548" y2="258" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 6"/>
