<text x="392" y="122" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">月球 (38.4万km)</text>
<line x1="246.0" y1="130" x2="246.0" y2="242" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 3"/>
<line x1="506.0" y1="130" x2="506.0" y2="242" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 3"/>
<polygon points="358,170 376,148 394,170" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>
<line x1="246.0" y1="246" x2="376" y2="166" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="506.0" y1="246" x2="376" y2="166" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="3 3"/>
<line x1="246.0" y1="246" x2="376" y2="208" stroke="#18794e" stroke-width="2.0"/>
<line x1="506.0" y1="246" x2="376" y2="208" stroke="#18794e" stroke-width="2.0"/>
<circle cx="376" cy="204" r="9" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="376" y="208" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">树</text>
<rect x="228.0" y="249.0" width="36" height="18" rx="5" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="246.0" y="262.0" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">A(0s)</text>
<g class="mfc-car-top"><rect x="486.0" y="248.5" width="40" height="19" rx="5" fill="#1d6fa5" stroke="#0f172a" stroke-width="1.2"/><text x="506.0" y="262.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="700">B(3.6s)</text></g>
<line x1="246.0" y1="281" x2="314" y2="281" stroke="#1d6fa5" stroke-width="1.5"/>
<line x1="438" y1="281" x2="506.0" y2="281" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="376" y="285" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">直行基线 L = 100 m</text>
<rect x="34" y="114" width="152" height="156" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="44" y="136" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">近树 (D = 20 m)</text>
<text x="44" y="157" font-size="11.5" fill="#1e293b" text-anchor="start">A 处：右前方 +68.2°</text>
<text x="44" y="177" font-size="11.5" fill="#1e293b" text-anchor="start">B 处：右后方 −68.2°</text>
<text x="44" y="199" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">总转角 Δθ = 136.4°</text>
<text x="44" y="221" font-size="11.5" fill="#1e293b" text-anchor="start">视线猛烈向后甩，</text>
<text x="44" y="240" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">树影瞬间飞掠车窗！</text>
<rect x="564" y="114" width="162" height="156" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="574" y="136" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">月球 (38.4万km)</text>
<text x="574" y="157" font-size="11.5" fill="#1e293b" text-anchor="start">两条月光夹角仅：</text>
<text x="574" y="178" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">Δθ = 0.054″ (角秒)</text>
<text x="574" y="200" font-size="11.5" fill="#1e293b" text-anchor="start">≈ 0.000015° ≈ 平行光</text>
<text x="574" y="222" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">远山 (5km)：偏 1.15°</text>
<text x="574" y="242" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">月亮方向几乎零变化！</text>
<rect x="20" y="304" width="720" height="236" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="314.0" width="516" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="292.0" y="329.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">B · 乘客右侧车窗视野（横向约 110°）：按真实角位移比例映射 3.6 秒横移</text>
<rect x="34.0" y="346.0" width="444.0" height="178.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="3"/>
<g clip-path="url(#mfc-win-clip)">
<rect x="34.0" y="484.0" width="444.0" height="40" fill="#0f172a"/>
<circle cx="390" cy="384" r="19" fill="#fef08a" fill-opacity="0.18"/>
<circle cx="390" cy="384" r="12.5" fill="#fde047" stroke="#facc15" stroke-width="1.2"/>
<text x="366" y="380" font-size="11.5" fill="#fef08a" text-anchor="end" font-weight="700">月亮：位移 0.054″</text>
<text x="366" y="397" font-size="11.5" fill="#fde68a" text-anchor="end">(钉在窗上不动！)</text>
<polygon points="74,484 128,448 184,484" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>
<g class="mfc-mtn"><polygon points="69.4,484 123.4,448 179.4,484" fill="#475569" stroke="#94a3b8" stroke-width="1.2"/></g>
<text x="126" y="440" font-size="11.5" fill="#cbd5e1" text-anchor="middle">远山：仅退 1.15°</text>
<rect x="344.0" y="432" width="32" height="52" rx="2" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="3 2"/>
<text x="360.0" y="425" font-size="10.5" fill="#93c5fd" text-anchor="middle">0s</text>
<g class="mfc-bldg"><rect x="230.7" y="432" width="32" height="52" rx="2" fill="#3b82f6" stroke="#bfdbfe" stroke-width="1.2"/></g>
<line x1="341.0" y1="458" x2="266.7" y2="458" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
<text x="303.3" y="451" font-size="11.5" fill="#bae6fd" text-anchor="middle" font-weight="700">楼房退 28.1°</text>
<circle cx="446" cy="466" r="13" fill="none" stroke="#86efac" stroke-width="1.2" stroke-dasharray="3 2"/>
<g class="mfc-tree"><rect x="64" y="474" width="6" height="16" fill="#92400e"/><circle cx="67" cy="464" r="14" fill="#16a34a" stroke="#bbf7d0" stroke-width="1.2"/></g>
<line x1="428" y1="504" x2="90" y2="504" stroke="#86efac" stroke-width="1.6" stroke-dasharray="5 3"/>
<polygon points="84,504 93,499.5 93,508.5" fill="#86efac"/>
<text x="258" y="518" font-size="11.5" fill="#bbf7d0" text-anchor="middle" font-weight="700">近树 (20m) 飞掠 136.4° · 护栏 (2.5m) 闪掠 174.3°</text>
</g>
