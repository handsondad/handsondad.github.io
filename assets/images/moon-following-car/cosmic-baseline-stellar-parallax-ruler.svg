    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="537" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">五、把“汽车基线”放大 300 万倍：天文学家怎样用视差量穿银河系？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">你在车窗里纳闷的运动视差，恰恰是人类测量宇宙恒星真实距离最硬核的几何第一性标尺</text>
<rect x="20" y="64" width="452" height="458" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="424" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="246.0" y="89.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 地球这辆“宇宙敞篷车”：半年横跨 3 亿公里拍恒星晃动</text>
<rect x="34" y="108" width="424" height="214" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<circle cx="114.0" cy="215.0" r="62.0" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="114.0" cy="215.0" r="11" fill="#fde047" stroke="#f59e0b" stroke-width="1.2"/>
<text x="114.0" y="241.0" font-size="10.5" fill="#fde68a" text-anchor="middle">太阳</text>
<circle cx="114.0" cy="153.0" r="6.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
<circle cx="114.0" cy="277.0" r="6.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
<text x="102.0" y="157.0" font-size="10.5" fill="#bae6fd" text-anchor="end" font-weight="700">1月地球</text>
<text x="102.0" y="281.0" font-size="10.5" fill="#bae6fd" text-anchor="end" font-weight="700">7月地球</text>
<line x1="130.0" y1="157.0" x2="130.0" y2="273.0" stroke="#38bdf8" stroke-width="1.6"/>
<text x="136.0" y="211.0" font-size="10.5" fill="#38bdf8" font-weight="700">基线 2 AU</text>
<text x="136.0" y="226.0" font-size="10.5" fill="#bae6fd">≈ 3 亿 km</text>
<line x1="114.0" y1="153.0" x2="432.0" y2="266.3" stroke="#facc15" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="114.0" y1="277.0" x2="432.0" y2="163.7" stroke="#fb923c" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="114.0" y1="215.0" x2="288.0" y2="215.0" stroke="#64748b" stroke-width="1" stroke-dasharray="2 3"/>
<circle cx="288.0" cy="215.0" r="6.5" fill="#fde047" stroke="#ffffff" stroke-width="1.2"/>
<text x="288.0" y="201.0" font-size="11" fill="#fef08a" text-anchor="middle" font-weight="700">近距恒星</text>
<text x="252.0" y="213.0" font-size="10.5" fill="#cbd5e1" text-anchor="end">半张角 ϖ</text>
<line x1="432.0" y1="126" x2="432.0" y2="304" stroke="#64748b" stroke-width="1.5"/>
<circle cx="432.0" cy="266.3" r="4" fill="#facc15"/>
<circle cx="432.0" cy="163.7" r="4" fill="#fb923c"/>
<text x="424.0" y="138" font-size="10.5" fill="#e2e8f0" text-anchor="end">遥远背景星幕</text>
<text x="424.0" y="219.0" font-size="11" fill="#fde047" text-anchor="end" font-weight="700">半年摆幅 2ϖ</text>
<text x="44" y="313" font-size="10.5" fill="#94a3b8">注：纵深压缩示意；定义 ϖ = 1″ 时的距离为 1 秒差距 (1 pc ≈ 3.2616 光年)</text>
<rect x="34" y="334" width="424" height="174" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="356" font-size="11.5" fill="#1e293b" text-anchor="start">① 第谷的盲区 (16世纪)：肉眼极限 60″ 找不到恒星晃动，据此怀疑地动说</text>
<text x="46" y="376" font-size="11.5" fill="#64748b" text-anchor="start">   ——实因最近恒星比邻星 (4.24 光年) 视差也仅 0.768″，比肉眼细 78 倍！</text>
<text x="46" y="404" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">② 贝塞尔首破纪录 (1838)：用劈裂物镜量日仪测出天鹅座 61 视差 0.314″</text>
<text x="46" y="424" font-size="11.5" fill="#1e293b" text-anchor="start">   (现代盖亚值 0.286″，距地球 11.4 光年)，人类首次量出太阳系外恒星距离！</text>
<text x="46" y="452" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">③ 欧空局盖亚卫星 Gaia (DR3, 2022)：精测 14.68 亿颗恒星视差与自行，</text>
<text x="46" y="472" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">   亮星精度达 10–20 微角秒 (μas) ≈ 在地球看清月球上一根头发丝！</text>
<text x="46" y="495" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">   核心公式一脉相承：距离 D = 基线半长 (1 AU) / tan ϖ ≈ 1 AU / ϖ</text>
<rect x="484" y="64" width="256" height="458" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="498.0" y="74.0" width="228" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="612.0" y="89.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">B · 四级“视差标尺”大跳级</text>
<rect x="498" y="106" width="228" height="94" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="510" y="126" font-size="12" fill="#475569" text-anchor="start" font-weight="700">第 1 级 · 双眼瞳距</text>
<text x="510" y="146" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">基线 B ≈ 6.5 cm</text>
<text x="510" y="167" font-size="11.5" fill="#1e293b" text-anchor="start">看 40 cm 拇指跳 ~9.3°；</text>
<text x="510" y="187" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">超过百米双眼立体感渐失。</text>
<rect x="498" y="208" width="228" height="94" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="510" y="228" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">第 2 级 · 高速行车</text>
<text x="510" y="248" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">基线 B = 100 m (3.6s)</text>
<text x="510" y="269" font-size="11.5" fill="#1e293b" text-anchor="start">看 20 m 树狂扫 136.4°；</text>
<text x="510" y="289" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">看月球仅 0.054″→跟着车走！</text>
<rect x="498" y="310" width="228" height="94" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="510" y="330" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">第 3 级 · 洲际南北联测</text>
<text x="510" y="350" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">基线 B ≈ 8,720 km</text>
<text x="510" y="371" font-size="11.5" fill="#1e293b" text-anchor="start">1751 拉卡伊(好望角)与拉朗德</text>
<text x="510" y="391" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">(柏林)同测月球错开 ~1.3°！</text>
<rect x="498" y="412" width="228" height="94" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="510" y="432" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">第 4 级 · 地球公转轨道</text>
<text x="510" y="452" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">基线 B = 2 AU ≈ 3 亿 km</text>
<text x="510" y="473" font-size="11.5" fill="#1e293b" text-anchor="start">比汽车基线放大 300 万倍，</text>
<text x="510" y="493" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">直接量出百亿亿公里恒星海！</text>
</svg>
