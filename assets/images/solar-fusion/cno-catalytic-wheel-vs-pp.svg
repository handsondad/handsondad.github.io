<polyline points="510.4,291.6 516.5,283.2 522.5,275.1 528.5,267.4 534.6,259.9 540.6,252.7 546.7,245.7 552.8,239.0 558.8,232.5 564.9,226.1 570.9,220.0 577.0,214.1 583.0,208.3 589.0,202.6 595.1,197.2 601.1,191.8 607.2,186.6 613.2,181.6 619.3,176.6 625.4,171.8 631.4,167.0 637.5,162.4 643.5,157.9 649.5,153.5 655.6,149.2 661.6,144.9 667.7,140.8 673.8,136.7 679.8,132.7 685.9,128.8" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-dasharray="6 3"/>
<line x1="555.2" y1="128" x2="555.2" y2="300" stroke="#c25014" stroke-width="1.6" stroke-dasharray="3 3"/>
<circle cx="555.2" cy="215.1" r="5" fill="#c25014"/>
<circle cx="555.2" cy="236.4" r="4.5" fill="#dc2626"/>
<text x="549.2" y="144" font-size="9.8" fill="#c25014" text-anchor="end" font-weight="700">太阳 15.7 MK</text>
<circle cx="583.0" cy="208.3" r="5" fill="#6d28d9"/>
<text x="591.0" y="222.3" font-size="9.8" fill="#6d28d9" text-anchor="start" font-weight="700">反超点 ≈ 18 MK</text>
<text x="648" y="190" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700">pp 链 (∝ T⁴)</text>
<text x="612" y="144" font-size="10.2" fill="#dc2626" text-anchor="start" font-weight="700">CNO (∝ T¹⁶~¹⁷)</text>
<text x="486.2" y="315" font-size="9.6" fill="#64748b" text-anchor="middle">10</text>
<text x="546.7" y="315" font-size="9.6" fill="#64748b" text-anchor="middle">15</text>
<text x="607.2" y="315" font-size="9.6" fill="#64748b" text-anchor="middle">20</text>
<text x="667.7" y="315" font-size="9.6" fill="#64748b" text-anchor="middle">25</text>
<text x="583.0" y="330" font-size="9.8" fill="#1e293b" text-anchor="middle" font-weight="600">恒星核心温度 T（百万开尔文 MK）</text>
<text x="438" y="218" font-size="9.6" fill="#64748b" text-anchor="middle">对数产率</text>
<text x="414" y="360" font-size="10.4" fill="#1e293b" text-anchor="start">• 电荷门槛更高：碳氮原子核带 +6/+7 正电荷，库仑排斥墙比单质子</text>
<text x="424" y="380" font-size="10.4" fill="#1e293b" text-anchor="start">高 6~7 倍！在太阳 1571 万 K 下，质子极难钻进碳氮核，仅占 ~1%。</text>
<text x="414" y="404" font-size="10.3" fill="#6d28d9" text-anchor="start" font-weight="600">• 指数级狂飙：pp 产率平缓（∝ T⁴），CNO 对温度极敏感</text>
<text x="424" y="424" font-size="10.3" fill="#6d28d9" text-anchor="start" font-weight="600">（∝ T¹⁶~¹⁷）！一旦超 ~1800 万 K（&gt;1.3 M☉，如天狼星 A），</text>
<text x="424" y="444" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="600">CNO 立刻接管全星，猛烧燃料把恒星寿命缩短至几亿年！</text>
<text x="414" y="482" font-size="9.6" fill="#64748b" text-anchor="start">（注：曲线按核天体物理对数相对产率关系 log₁₀ ε 绘制）</text>
</svg>
