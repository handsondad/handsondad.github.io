<svg xmlns="http://www.w3.org/2000/svg" width="760" height="522" viewBox="0 0 760 522" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">太阳碳氮氧（CNO）催化循环转盘与pp/CNO温度敏感度对比图</title>
<desc id="desc">左栏展示碳-12作为催化剂吞下4颗质子生成1颗氦-4并复原的六步CNO-I循环及2020年Borexino实验证实，右栏对数曲线对比pp链（正比于T的4次方）与CNO循环（正比于T的16至17次方）在约1800万K的产能反超分水岭。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="521" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">太阳核心 1% 的隐藏副业：碳氮氧（CNO）催化转盘与恒星温度分水岭</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左栏顺时针看碳-12 怎样当“不消耗媒人”吞四颗氢吐一颗氦 → 右栏看为什么超 1.3 倍太阳质量恒星全靠它当家</text>
<rect x="24" y="68" width="358" height="440" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="88" r="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="42" y="92" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">1</text>
<text x="58" y="92" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">CNO-I 催化转盘：碳-12 借壳生蛋，循环不息</text>
<circle cx="203" cy="254" r="106" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6 4"/>
<circle cx="203" cy="254" r="54" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="203" y="242" font-size="10.6" fill="#0f766e" text-anchor="middle" font-weight="700">催化净反应</text>
<text x="203" y="261" font-size="11.4" fill="#0f172a" text-anchor="middle" font-weight="700">4 ¹H → ⁴He</text>
<text x="203" y="279" font-size="10.2" fill="#1e293b" text-anchor="middle" font-weight="600">26.73 MeV</text>
<rect x="161.0" y="124.0" width="84" height="48" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="203.0" y="143.0" font-size="9.9" fill="#1d6fa5" text-anchor="middle" font-weight="700">¹²C (+p → γ)</text>
<text x="203.0" y="161.0" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">碳-12 起点</text>
<rect x="252.79869280115054" y="177.0" width="84" height="48" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="294.8" y="196.0" font-size="9.9" fill="#c25014" text-anchor="middle" font-weight="700">¹³N (e⁺+νₑ)</text>
<text x="294.8" y="214.0" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">9.97分 β⁺</text>
<rect x="252.79869280115054" y="283.0" width="84" height="48" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="294.8" y="302.0" font-size="9.9" fill="#1d6fa5" text-anchor="middle" font-weight="700">¹³C (+p → γ)</text>
<text x="294.8" y="320.0" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">碳-13</text>
<rect x="161.0" y="336.0" width="84" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="203.0" y="355.0" font-size="9.9" fill="#dc2626" text-anchor="middle" font-weight="700">¹⁴N (+p 极慢)</text>
<text x="203.0" y="373.0" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">最慢瓶颈!</text>
<rect x="69.20130719884949" y="283.0" width="84" height="48" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="111.2" y="302.0" font-size="9.9" fill="#c25014" text-anchor="middle" font-weight="700">¹⁵O (e⁺+νₑ)</text>
<text x="111.2" y="320.0" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">122秒 β⁺</text>
<rect x="69.2013071988495" y="177.0" width="84" height="48" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.4"/>
<text x="111.2" y="196.0" font-size="9.9" fill="#18794e" text-anchor="middle" font-weight="700">¹⁵N (+p→⁴He!)</text>
<text x="111.2" y="214.0" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">氮-15 收官</text>
<text x="40" y="404" font-size="10.5" fill="#1e293b" text-anchor="start">• 催化剂奥秘：太阳诞生时继承自前代超新星的少量 ¹²C，顺时针</text>
<text x="50" y="424" font-size="10.5" fill="#1e293b" text-anchor="start">连吞 4 颗质子 + 2 次 β⁺ 衰变，最后在 ¹⁵N+¹H→¹²C+⁴He 吐出氦核</text>
<text x="50" y="444" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">并满血变回 ¹²C！最慢一步卡在 ¹⁴N 吃质子（决定球状星团年龄）。</text>
<text x="40" y="468" font-size="10.5" fill="#0f766e" text-anchor="start" font-weight="700">• 2020 里程碑：意大利地下 Borexino 实验首次直接抓到太阳 CNO</text>
<text x="50" y="488" font-size="10.5" fill="#0f766e" text-anchor="start" font-weight="700">中微子（《Nature》），实锤证实它贡献了太阳约 0.8%~1% 能量！</text>
<rect x="398" y="68" width="338" height="440" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="416" cy="88" r="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="416" y="92" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="432" y="92" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">温度分水岭：为什么太阳由 pp 当家、巨星靠 CNO？</text>
<rect x="414" y="108" width="306" height="228" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<line x1="462" y1="300" x2="704" y2="300" stroke="#475569" stroke-width="1.4"/>
<line x1="462" y1="128" x2="462" y2="300" stroke="#475569" stroke-width="1.4"/>
