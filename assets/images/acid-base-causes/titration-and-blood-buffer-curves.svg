<circle cx="190.8" cy="315.3" r="4.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="309.5" cy="224.5" r="4.5" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="309.5" cy="264.0" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"/>
<text x="366.5" y="228.7" font-size="10.2" fill="#6d28d9" text-anchor="start" font-weight="700">← 醋酸终点 pH 8.72(偏碱!)</text>
<text x="366.5" y="278.0" font-size="10.2" fill="#b91c1c" text-anchor="start" font-weight="600">← 盐酸终点 pH 7.00</text>
<text x="190.8" y="331.2" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="600">半中和 pH=4.76</text>
<text x="72.0" y="440" font-size="9.8" fill="#64748b" text-anchor="middle">0mL</text>
<text x="190.8" y="440" font-size="9.8" fill="#64748b" text-anchor="middle">12.5mL</text>
<text x="309.5" y="440" font-size="9.8" fill="#64748b" text-anchor="middle">25mL</text>
<text x="452.0" y="440" font-size="9.8" fill="#64748b" text-anchor="middle">40mL</text>
<rect x="490" y="84" width="246" height="364" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
<circle cx="508" cy="108" r="10.5" fill="#eaf4fb" stroke="#0f766e" stroke-width="1.2"/>
<text x="508" y="112" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">1</text>
<text x="528" y="113" font-size="13" fill="#0f766e" text-anchor="start" font-weight="700">生命的酸碱防弹衣</text>
<text x="504" y="136" font-size="11" fill="#0f172a" text-anchor="start">人体动脉血必须死守：</text>
<rect x="504.0" y="146.0" width="218" height="26" rx="13.0" fill="#ffffff" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="613.0" y="163.7" font-size="10.4" fill="#0f766e" text-anchor="middle" font-weight="600">pH 7.35 – 7.45（偏离 0.4 即危及生命）</text>
<text x="504" y="194" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">为什么喝柠檬水或狂跑产乳酸，</text>
<text x="504" y="212" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">血液不会变酸？靠双向弹簧库：</text>
<rect x="504" y="224" width="218" height="66" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/>
<text x="613" y="246" font-size="11.2" fill="#0f766e" text-anchor="middle" font-weight="700">CO₂ + H₂O ⇌ H₂CO₃</text>
<text x="613" y="268" font-size="11.2" fill="#1e3a8a" text-anchor="middle" font-weight="700">⇌ H⁺ + HCO₃⁻（碳酸氢根）</text>
<text x="504" y="312" font-size="10.8" fill="#b91c1c" text-anchor="start" font-weight="700">• 酸冲进来（+H⁺）：</text>
<text x="504" y="330" font-size="10.5" fill="#1e293b" text-anchor="start">  海量 HCO₃⁻ 捕手瞬间吞掉 H⁺</text>
<text x="504" y="348" font-size="10.5" fill="#1e293b" text-anchor="start">  化成 CO₂，肺大口喘气呼出体外！</text>
<text x="504" y="372" font-size="10.8" fill="#1e3a8a" text-anchor="start" font-weight="700">• 碱冲进来（+OH⁻）：</text>
<text x="504" y="390" font-size="10.5" fill="#1e293b" text-anchor="start">  H₂CO₃ 立刻补吐 H⁺ 把它中和成水！</text>
<rect x="504.0" y="410.0" width="218" height="24" rx="12.0" fill="#fef2f2" stroke="#b91c1c" stroke-width="1" stroke-opacity="0.35"/>
<text x="613.0" y="426.3" font-size="10.1" fill="#b91c1c" text-anchor="middle" font-weight="600">粉碎谣言：“酸碱体质食疗”纯属伪科学！</text>
<rect x="24" y="460" width="712" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="486" font-size="10.9" fill="#0f172a" text-anchor="middle" font-weight="600">强弱不等于浓稀：醋酸虽只电离 ~1%（弱酸），但 1 升 0.1 M 醋酸最终能中和的烧碱总量与 0.1 M 盐酸分毫不差（仓库照样吐光）！</text>
</svg>
