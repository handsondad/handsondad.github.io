  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">强酸与弱酸差在哪？为什么弱酸配盐能炼成“稳压防弹衣”（缓冲溶液）？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左看精确计算的滴定曲线（醋酸半中和稳压平台与 pH 8.72 碱性终点）→ 右看人体血液 pH 7.40 生死护盾</text>
<rect x="24" y="84" width="450" height="364" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="102" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">0.1 M NaOH 滴定 25 mL 盐酸(红) vs 醋酸(蓝)</text>
<line x1="72.0" y1="401.1" x2="452.0" y2="401.1" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="66.0" y="405.1" font-size="10" fill="#64748b" text-anchor="end">1</text>
<line x1="72.0" y1="309.7" x2="452.0" y2="309.7" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="66.0" y="313.7" font-size="10" fill="#64748b" text-anchor="end">5</text>
<line x1="72.0" y1="264.0" x2="452.0" y2="264.0" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="66.0" y="268.0" font-size="10" fill="#64748b" text-anchor="end">7</text>
<line x1="72.0" y1="218.3" x2="452.0" y2="218.3" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="66.0" y="222.3" font-size="10" fill="#64748b" text-anchor="end">9</text>
<line x1="72.0" y1="126.9" x2="452.0" y2="126.9" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="66.0" y="130.9" font-size="10" fill="#64748b" text-anchor="end">13</text>
<line x1="72.0" y1="424.0" x2="452.0" y2="424.0" stroke="#e2e8f0"/>
<text x="66.0" y="428.0" font-size="10" fill="#64748b" text-anchor="end">0</text>
<text x="38" y="266" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">pH</text>
