<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">决定物质酸碱强弱的四大分子与原子结构机制图解</title>
<desc id="desc">对比X-O-H成键电负性差异、第二周期氢化物酸性递增、卤化氢HF到HI键能主导的酸性反转以及羧酸根共振与诱导稳定效应。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">同挂着 -OH 为什么烧碱是强碱、酒精中性、醋酸是酸？四大原子级开关</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">酸碱不是死记化学式，全看：① 拔河断哪根键 ② 同周期电负性 ③ 同族键能反杀 ④ 负离子稳不稳</text>
<rect x="24" y="84" width="348" height="176" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="106" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="42" y="110" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="111" font-size="12.3" fill="#0f172a" text-anchor="start" font-weight="700">开关①：X—O—H 三人拔河，到底断哪边？</text>
<text x="40" y="134" font-size="10.8" fill="#64748b" text-anchor="start">氧电负性极高(3.44)，氢居中(2.20)，胜负全看左边 X 是谁：</text>
<rect x="40.0" y="146.0" width="316" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="198.0" y="162.3" font-size="10.3" fill="#1e3a8a" text-anchor="middle" font-weight="600">Na⁺ ⋯ ⁻O—H（X=0.93 慷慨金属）：断左键 → 放 OH⁻ 强碱！</text>
<rect x="40.0" y="178.0" width="316" height="24" rx="12.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="198.0" y="194.3" font-size="10.3" fill="#0f172a" text-anchor="middle" font-weight="600">C₂H₅—O—H（X=2.55 势均力敌）：两边不断 → 酒精中性！</text>
<rect x="40.0" y="210.0" width="316" height="24" rx="12.0" fill="#fef2f2" stroke="#b91c1c" stroke-width="1" stroke-opacity="0.35"/>
<text x="198.0" y="226.3" font-size="10.3" fill="#b91c1c" text-anchor="middle" font-weight="600">O₃Cl—O⋯H⁺（高价吸电子团猛抽氧）：断右键 → 放 H⁺ 强酸！</text>
<text x="40" y="250" font-size="10.2" fill="#b91c1c" text-anchor="start" font-weight="600">氯含氧酸铁证：HClO(7.5) → HClO₂(2.0) → HClO₃(-1) → HClO₄(-8)</text>
<rect x="388" y="84" width="348" height="176" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="106" r="10.5" fill="#eaf4fb" stroke="#0f766e" stroke-width="1.2"/>
<text x="406" y="110" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">2</text>
<text x="426" y="111" font-size="12.3" fill="#0f172a" text-anchor="start" font-weight="700">开关②：同周期从左到右 → 电负性说了算</text>
<text x="404" y="134" font-size="10.8" fill="#64748b" text-anchor="start">第二周期原子半径相近，核电荷越强，把 H 的电子抢得越狠：</text>
<rect x="404" y="148" width="72" height="74" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="440" y="168" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">CH₄</text>
<text x="440" y="186" font-size="10" fill="#64748b" text-anchor="middle">pKa ~50</text>
<text x="440" y="206" font-size="10" fill="#475569" text-anchor="middle" font-weight="600">死不放氢</text>
<rect x="485" y="148" width="72" height="74" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="521" y="168" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">NH₃</text>
<text x="521" y="186" font-size="10" fill="#1e3a8a" text-anchor="middle">孤对抢H⁺</text>
<text x="521" y="206" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="700">反而是碱!</text>
<rect x="566" y="148" width="72" height="74" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
<text x="602" y="168" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="700">H₂O</text>
<text x="602" y="186" font-size="10" fill="#0f766e" text-anchor="middle">pKa 14</text>
<text x="602" y="206" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="600">两性基准</text>
<rect x="647" y="148" width="73" height="74" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="683" y="168" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">HF</text>
<text x="683" y="186" font-size="10" fill="#b91c1c" text-anchor="middle">pKa 3.1</text>
<text x="683" y="206" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">明显显酸</text>
<text x="562" y="246" font-size="10.5" fill="#0f766e" text-anchor="middle" font-weight="600">从 CH₄ 到 HF：抢电子能力升级，酸性暴涨 10⁴⁶ 倍以上！</text>
<rect x="24" y="272" width="348" height="176" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="294" r="10.5" fill="#eaf4fb" stroke="#c25014" stroke-width="1.2"/>
<text x="42" y="298" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">3</text>
<text x="62" y="299" font-size="12.1" fill="#0f172a" text-anchor="start" font-weight="700">开关③：同主族往下 → 键能反杀电负性（HF冤案）</text>
<text x="40" y="322" font-size="10.5" fill="#64748b" text-anchor="start">氟抢电子最强，为何氢氟酸在水里只是弱酸，氢碘酸却是超猛强酸？</text>
<text x="40" y="344" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="600">• HF（键能 567 kJ/mol）：F 太小，把 H⁺ 死死抱在怀里不撒手</text>
<text x="40" y="364" font-size="10.5" fill="#1e293b" text-anchor="start">  → 水中 pKa = +3.1（弱酸！靠强结 Si–F 键才腐蚀玻璃）</text>
<text x="40" y="388" font-size="10.6" fill="#0f172a" text-anchor="start">• HCl(431) → HBr(366) → HI(298 kJ/mol)：碘像大皮球，</text>
<text x="40" y="408" font-size="10.6" fill="#b91c1c" text-anchor="start" font-weight="700">  5p 与 1s 轨道够不着，一碰水就断 → HI pKa = −10.4！</text>
<rect x="40.0" y="418.0" width="316" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="198.0" y="433.0" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="600">结论：HI 比 HF 酸性强出 ~30 万亿倍（10¹³·⁵）！键弱更好断</text>
<rect x="388" y="272" width="348" height="176" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="294" r="10.5" fill="#eaf4fb" stroke="#6d28d9" stroke-width="1.2"/>
<text x="406" y="298" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">4</text>
<text x="426" y="299" font-size="12.1" fill="#0f172a" text-anchor="start" font-weight="700">开关④：“离婚后”负离子稳不稳？（共振与诱导）</text>
<text x="404" y="322" font-size="10.5" fill="#64748b" text-anchor="start">吐出 H⁺ 后留下的 A⁻ 负电荷越分散、越体面，酸就越肯放手：</text>
<text x="404" y="346" font-size="10.6" fill="#1e293b" text-anchor="start">• 乙醇 C₂H₅O⁻：−1 电荷全压在 1 颗氧上 → 极想抢回 H⁺(pKa 16)</text>
<text x="404" y="370" font-size="10.6" fill="#6d28d9" text-anchor="start" font-weight="700">• 醋酸 CH₃COO⁻：双氧共振平摊各 −0.5 电荷 → 稳如泰山！</text>
<text x="404" y="390" font-size="10.5" fill="#6d28d9" text-anchor="start">  酸性瞬间比酒精暴涨 1,000 亿倍（pKa = 4.76）！</text>
<rect x="404.0" y="414.0" width="316" height="24" rx="12.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="562.0" y="430.3" font-size="10.2" fill="#6d28d9" text-anchor="middle" font-weight="600">再挂三颗吸电子氟：三氟乙酸 CF₃COOH pKa 飙至 0.23 准强酸！</text>
<rect x="24" y="460" width="712" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="486" font-size="10.9" fill="#0f172a" text-anchor="middle" font-weight="600">一句话总口诀：H–A 键越极化、键长越长越易断、丢氢后的 A⁻ 电荷越分散稳定 —— 物质就越酸；反之有孤对电子爱抢 H⁺ 就越碱！</text>
</svg>
