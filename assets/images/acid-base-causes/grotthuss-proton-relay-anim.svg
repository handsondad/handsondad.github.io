<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">水中质子格罗特斯接力跳跃机制与酸味味蕾、碱水皂化滑腻感原理图</title>
<desc id="desc">展示氯化氢在水中给出质子后通过水分子氢键网络发生格罗特斯跳跃接力，以及OTOP1质子通道产生酸味和氢氧根皂化皮脂产生滑腻感的机理。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes hop1 {
        0%, 15%  { transform: translate(152px, 198px); opacity: 1; }
        38%, 100%{ transform: translate(236px, 198px); opacity: 1; }
      }
      @keyframes hop2 {
        0%, 36%  { transform: translate(294px, 198px); opacity: 1; }
        62%, 100%{ transform: translate(382px, 198px); opacity: 1; }
      }
      @keyframes hop3 {
        0%, 60%  { transform: translate(440px, 198px); opacity: 1; }
        86%, 100%{ transform: translate(528px, 198px); opacity: 1; }
      }
      @keyframes glowTarget {
        0%, 78%  { stroke-width: 1.8px; fill: #ffffff; }
        90%, 100%{ stroke-width: 3.2px; fill: #fef2f2; }
      }
      .p-hop1 { animation: hop1 5.4s ease-in-out 1 forwards; }
      .p-hop2 { animation: hop2 5.4s ease-in-out 1 forwards; }
      .p-hop3 { animation: hop3 5.4s ease-in-out 1 forwards; }
      .o-end  { animation: glowTarget 5.4s ease-in-out 1 forwards; }
      @media (prefers-reduced-motion: reduce) {
        .p-hop1 { animation: none !important; transform: translate(236px, 198px); }
        .p-hop2 { animation: none !important; transform: translate(382px, 198px); }
        .p-hop3 { animation: none !important; transform: translate(528px, 198px); }
        .o-end  { animation: none !important; stroke-width: 3.2px; fill: #fef2f2; }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">酸和碱在水里到底干了什么？“裸质子”抱水成团与格罗特斯接力跳</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先看上栏 H⁺ 在水分子链上的“击鼓传花”超高速跳跃 → 再看下栏为什么舌头觉得酸、手指觉得滑</text>
<rect x="24" y="84" width="712" height="202" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="106" r="10.5" fill="#eaf4fb" stroke="#b91c1c" stroke-width="1.2"/>
<text x="42" y="110" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="111" font-size="12.3" fill="#0f172a" text-anchor="start" font-weight="700">水中的真相：裸露质子 H⁺ 绝不单飞，靠氢键网格“换棒接力”狂飙（格罗特斯机制，1806）</text>
<text x="42" y="134" font-size="11" fill="#64748b" text-anchor="start">H 丢掉唯一电子后半径缩至 ~10⁻¹⁵ m（比原子小十万倍！），强电场瞬间吸住水分子变成水合氢离子 H₃O⁺</text>
<line x1="114" y1="198" x2="646" y2="198" stroke="#fca5a5" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="112" cy="198" r="24" fill="#e7f6ee" stroke="#18794e" stroke-width="2"/>
<text x="112" y="195" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">HCl</text>
<text x="112" y="211" font-size="10" fill="#18794e" text-anchor="middle">→Cl⁻</text>
<circle cx="265" cy="198" r="24" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2"/>
<text x="265" y="195" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="700">H₂O</text>
<text x="265" y="211" font-size="9.8" fill="#1e293b" text-anchor="middle">水分子①</text>
<circle cx="411" cy="198" r="24" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2"/>
<text x="411" y="195" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="700">H₂O</text>
<text x="411" y="211" font-size="9.8" fill="#1e293b" text-anchor="middle">水分子②</text>
<circle class="o-end" cx="557" cy="198" r="25" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="557" y="195" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">H₃O⁺</text>
<text x="557" y="211" font-size="9.8" fill="#b91c1c" text-anchor="middle">新水合氢!</text>
<rect x="612" y="166" width="108" height="64" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="666" y="189" font-size="10.8" fill="#b91c1c" text-anchor="middle" font-weight="700">接棒终点</text>
<text x="666" y="207" font-size="10.2" fill="#1e293b" text-anchor="middle">比 Na⁺ 挤地铁</text>
<text x="666" y="222" font-size="10.8" fill="#b91c1c" text-anchor="middle" font-weight="700">快 ~7 倍！</text>
<g class="p-hop1"><circle cx="0" cy="0" r="9.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.6"/><text x="0" y="3.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">H⁺</text></g>
<g class="p-hop2"><circle cx="0" cy="0" r="9.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.6"/><text x="0" y="3.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">H⁺</text></g>
<g class="p-hop3"><circle cx="0" cy="0" r="9.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.6"/><text x="0" y="3.5" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">H⁺</text></g>
<text x="340" y="248" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">共价键与氢键交替翻转（O–H⋯O → O⋯H–O）：不必同一颗质子跑完全程，信号瞬间闪现对岸！</text>
<rect x="168.0" y="256.0" width="344" height="22" rx="11.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="340.0" y="271.0" font-size="10.3" fill="#0f172a" text-anchor="middle" font-weight="600">纯水自身也在拔河：每 5.55 亿个水分子仅有 1 对变成 H₃O⁺ + OH⁻</text>
<rect x="24" y="300" width="348" height="148" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<circle cx="42" cy="322" r="10.5" fill="#eaf4fb" stroke="#b91c1c" stroke-width="1.2"/>
<text x="42" y="326" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">2</text>
<text x="62" y="327" font-size="12.5" fill="#b91c1c" text-anchor="start" font-weight="700">为什么醋和柠檬“酸掉牙”？（OTOP1 质子门）</text>
<text x="40" y="352" font-size="11" fill="#0f172a" text-anchor="start">• 2018–2019 揭晓谜底：舌头酸味细胞膜上装有专属</text>
<text x="40" y="372" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">  质子离子通道 OTOP1（Otopetrin-1）；</text>
<text x="40" y="394" font-size="11" fill="#1e293b" text-anchor="start">• 食物里的 H₃O⁺ 顺通道直接涌入味蕾细胞内；</text>
<text x="40" y="414" font-size="11" fill="#1e293b" text-anchor="start">• 细胞膜电位反转触发神经放电 → 大脑亮起“酸味警报”</text>
<text x="40" y="434" font-size="10.5" fill="#64748b" text-anchor="start">  （演化本意：提醒未熟野果或腐败变质食物！）</text>
<rect x="388" y="300" width="348" height="148" rx="10" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<circle cx="406" cy="322" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="406" y="326" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">3</text>
<text x="426" y="327" font-size="12.5" fill="#1e3a8a" text-anchor="start" font-weight="700">为什么小苏打和碱水“滑溜溜”？（现场造肥皂！）</text>
<text x="404" y="352" font-size="11" fill="#0f172a" text-anchor="start">• 碱水本身并不比清水滑！滑的是你自己的皮肤油脂：</text>
<text x="404" y="372" font-size="11" fill="#1e3a8a" text-anchor="start" font-weight="700">  指尖皮脂 + OH⁻ ──▶ 脂肪酸盐（微米级肥皂膜）+ 甘油</text>
<text x="404" y="394" font-size="11" fill="#1e293b" text-anchor="start">• 这叫皂化反应（Saponification）：古人用草木灰水</text>
<text x="404" y="414" font-size="11" fill="#1e293b" text-anchor="start">  （含 K₂CO₃ 碱）洗头去油，正是把油污现场变成肥皂；</text>
<text x="404" y="434" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="600">  ⚠️ 若摸到强碱觉得极滑，说明角质与皮脂正被溶解，速冲水！</text>
<rect x="24" y="460" width="712" height="42" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="380" y="486" font-size="11.0" fill="#b45309" text-anchor="middle" font-weight="600">1909 年嘉士伯啤酒厂实验室：丹麦化学家索伦森为精准控制酿酒酶酸度，发明 pH = −lg[H⁺]，把 0.0000001 M 化作简洁的 pH 7！</text>
</svg>
