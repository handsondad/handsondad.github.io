<text x="631" y="248" font-size="8.5" fill="#9d174d" text-anchor="middle" font-weight="700">分泌 hCG 保住黄体（早孕试纸测它!）</text>
<rect x="116" y="206" width="396" height="70" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="128" y="225" font-size="9.0" fill="#1d6fa5" text-anchor="start" font-weight="700">🔍 为什么连切 5–6 刀（1 → 100 细胞），外径却一丝不涨？</text>
<text x="128" y="243" font-size="8.4" fill="#1e293b" text-anchor="start">外层坚韧“透明带”像硬蛋壳箍住胚胎：既防途中卡在狭窄输卵管引发宫外孕，</text>
<text x="128" y="260" font-size="8.4" fill="#1e293b" text-anchor="start">又省去细胞生长耗时，全靠卵子自带营养库存高速分裂，进宫后再破壳着床！</text>
<style>
