<text x="530" y="358" font-size="8.7" fill="#1d6fa5" text-anchor="start" font-weight="700">异卵双胞胎（约占排卵周期 1%）</text>
<text x="530" y="375" font-size="8.3" fill="#1e293b" text-anchor="start">同时排 2 颗卵 + 2 颗精子各自受精：</text>
<text x="530" y="392" font-size="8.3" fill="#1e293b" text-anchor="start">基因像普通兄妹，各自拥有独立胎盘。</text>
