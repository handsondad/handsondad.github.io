<text x="30" y="88" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">第一幕：输卵管壶腹部受精 → 等体积卵裂（外径死守 ~0.12 mm）→ 第 6–7 天破壳着床</text>
