<text x="530" y="436" font-size="8.7" fill="#6d28d9" text-anchor="start" font-weight="700">同卵双胞胎（1 颗受精卵半路分家）</text>
<text x="530" y="453" font-size="8.3" fill="#1e293b" text-anchor="start">• 2细胞期早分家 → 各自独立双胎盘；</text>
<text x="530" y="470" font-size="8.3" fill="#0f172a" text-anchor="start" font-weight="700">• 囊胚期分内细胞团 → 共用一个胎盘!</text>
