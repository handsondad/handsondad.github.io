<text x="209" y="358" font-size="8.7" fill="#c25014" text-anchor="start" font-weight="700">① 快阻断（毫秒级电锁）</text>
<text x="209" y="375" font-size="8.3" fill="#1e293b" text-anchor="start">融合瞬间 Na+ 涌入使卵膜去</text>
<text x="209" y="392" font-size="8.3" fill="#1e293b" text-anchor="start">极化反转电位，守门约 1 分钟</text>
<rect x="200" y="418" width="158" height="72" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="209" y="436" font-size="8.7" fill="#18794e" text-anchor="start" font-weight="700">② 慢阻断（皮质反应水泥门）</text>
<text x="209" y="453" font-size="8.3" fill="#1e293b" text-anchor="start">Ca2+ 波触发皮质颗粒吐酶，剪</text>
<text x="209" y="470" font-size="8.3" fill="#1e293b" text-anchor="start">断全部受体并硬化成受精膜！</text>
<text x="30" y="446" font-size="8.4" fill="#1e293b" text-anchor="start">• 数百精子顶体酶接力溶穿放射冠</text>
<text x="30" y="464" font-size="8.4" fill="#0f172a" text-anchor="start" font-weight="700">• 杜绝多精三倍体(69条染色体致死)</text>
<text x="30" y="482" font-size="8.4" fill="#64748b" text-anchor="start">• 融合后卵子才排第二极体成合子</text>
