<rect x="0.5" y="0.5" width="759" height="517" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">从两亿选一到破壳着床：双保险防多精锁与“只切蛋糕不长个”的七天漂流</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先看上栏输卵管到子宫的 7 天接力路径与单次漂流微粒，再看左下毫秒/秒级双重锁门与右下破壳分工机制</text>
