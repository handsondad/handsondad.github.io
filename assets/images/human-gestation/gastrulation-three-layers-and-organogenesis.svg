<svg xmlns="http://www.w3.org/2000/svg" width="760" height="522" viewBox="0 0 760 522" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">人类胚胎第3至8周三胚层分化、神经管闭合、22天原始心跳与细胞凋亡雕出五指图解</title>
<desc id="desc">上栏展示第3周原肠胚细胞沿原条潜入形成外胚层、中胚层与内胚层及其对应的全身器官谱系；下栏分三卡展示第4周神经板卷折并在第28天闭合为神经管（解释叶酸窗口期）、第21至22天2-3毫米胚胎原始心管起跳，以及第6至8周手板通过程序性细胞凋亡雕出五根独立手指。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="521" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">从扁圆盘“折纸”造出人形：三胚层大搬家、28天神经管拉链与凋亡雕五指</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先看上栏第 3 周原肠胚三胚层分化总账，再看下栏第 4–8 周三大形态工程（神经管闭合、22天心跳、手板雕指）</text>
<rect x="16" y="66" width="728" height="200" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="30" y="88" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">第 3 周（原肠胚形成）：上胚层细胞顺“原条”向下潜入，叠出决定全身器官命运的三张母板</text>
<rect x="30" y="102" width="256" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="158" y="120" font-size="8.9" fill="#0f172a" text-anchor="middle" font-weight="700">原条沟潜入剖面（长仅 ~2 mm）</text>
<path d="M 48 152 L 136 152 Q 158 172 180 152 L 268 152" fill="none" stroke="#1d6fa5" stroke-width="6.5" stroke-linecap="round"/>
<path d="M 52 188 L 138 188 M 178 188 L 264 188" stroke="#c25014" stroke-width="6.5" stroke-linecap="round"/>
<circle cx="158" cy="188" r="5.8" fill="#c25014"/>
<path d="M 48 216 L 268 216" stroke="#18794e" stroke-width="6.5" stroke-linecap="round"/>
<path d="M 154 160 Q 142 176 114 182" fill="none" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<path d="M 162 160 Q 174 176 202 182" fill="none" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<text x="86" y="141" font-size="8.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">外胚层(留守)</text>
<text x="224" y="176" font-size="8.4" fill="#c25014" text-anchor="middle" font-weight="700">中胚层(铺开)</text>
<text x="158" y="238" font-size="8.2" fill="#18794e" text-anchor="middle" font-weight="700">内胚层(衬里) · 圆点=脊索诱导器</text>
<rect x="300" y="102" width="428" height="44" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="312" y="120" font-size="9.0" fill="#1d6fa5" text-anchor="start" font-weight="700">① 外胚层（最外层“感知与铠甲”）</text>
<text x="312" y="137" font-size="8.3" fill="#1e293b" text-anchor="start">向内卷成大脑、脊髓、视网膜与外周神经；向外包成表皮、头发与指甲（脑与皮肤同宗！）</text>
<rect x="300" y="152" width="428" height="44" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="312" y="170" font-size="9.0" fill="#c25014" text-anchor="start" font-weight="700">② 中胚层（中间层“动力与支架”）</text>
<text x="312" y="187" font-size="8.3" fill="#1e293b" text-anchor="start">长出最先起跳的心脏、全身血管与血细胞、骨骼、骨骼肌与平滑肌、肾脏及生殖腺支架</text>
<rect x="300" y="202" width="428" height="44" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="312" y="220" font-size="9.0" fill="#18794e" text-anchor="start" font-weight="700">③ 内胚层（最内层“消化与呼吸内衬”）</text>
<text x="312" y="237" font-size="8.3" fill="#1e293b" text-anchor="start">卷成原始肠管内壁，分化出气管支气管与肺泡上皮、胃肠黏膜、肝脏、胆囊与胰腺</text>
<rect x="16" y="282" width="234" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="28" y="304" font-size="10.4" fill="#1d6fa5" text-anchor="start" font-weight="700">① 第 4 周：神经板卷管拉链</text>
<path d="M 40 338 L 86 338" stroke="#1d6fa5" stroke-width="5" stroke-linecap="round"/>
<text x="63" y="358" font-size="8.2" fill="#64748b" text-anchor="middle">神经板</text>
<path d="M 112 326 Q 130 354 148 326" fill="none" stroke="#1d6fa5" stroke-width="5" stroke-linecap="round"/>
<text x="130" y="358" font-size="8.2" fill="#64748b" text-anchor="middle">神经褶</text>
<circle cx="200" cy="334" r="12" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="4.2"/>
<text x="200" y="362" font-size="8.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">Day 28闭管</text>
<path d="M 90 336 L 106 336" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<path d="M 154 336 L 176 336" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<rect x="28" y="376" width="210" height="116" rx="7" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="38" y="395" font-size="8.8" fill="#1d6fa5" text-anchor="start" font-weight="700">⚠️ 为什么备孕前就要补叶酸？</text>
<text x="38" y="413" font-size="8.3" fill="#1e293b" text-anchor="start">• 神经管在受精第 28 天（刚停经约</text>
<text x="38" y="430" font-size="8.3" fill="#1e293b" text-anchor="start">  两周）就必须彻底拉上拉链！</text>
<text x="38" y="447" font-size="8.3" fill="#1e293b" text-anchor="start">• 此时常刚测出怀孕；若缺维生素B9</text>
<text x="38" y="464" font-size="8.3" fill="#0f172a" text-anchor="start" font-weight="700">  (叶酸)，拉链卡壳易致脊柱裂。</text>
<rect x="263" y="282" width="234" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="275" y="304" font-size="10.4" fill="#c25014" text-anchor="start" font-weight="700">② 第 22 天：芝麻大胚胎起跳</text>
<path d="M 344 320 C 314 320, 304 352, 326 366 C 344 378, 382 376, 398 356 C 406 342, 394 322, 372 324" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<circle cx="352" cy="348" r="8.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.4"/>
<text x="352" y="351" font-size="9.0" fill="#ffffff" text-anchor="middle" font-weight="700">♥</text>
<text x="444" y="340" font-size="8.5" fill="#c25014" text-anchor="middle" font-weight="700">仅 2–3 mm</text>
<text x="444" y="357" font-size="8.3" fill="#64748b" text-anchor="middle">双心管融合</text>
<rect x="275" y="376" width="210" height="116" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="285" y="395" font-size="8.8" fill="#c25014" text-anchor="start" font-weight="700">折纸卷筒 + 最早完工的动力泵</text>
<text x="285" y="413" font-size="8.3" fill="#1e293b" text-anchor="start">• 扁胚盘向腹侧卷成 C 形圆筒，把</text>
<text x="285" y="430" font-size="8.3" fill="#1e293b" text-anchor="start">  内胚层裹在腹中变成原始肠管；</text>
<text x="285" y="447" font-size="8.3" fill="#1e293b" text-anchor="start">• 受精第 21–22 天心管自发搏动，</text>
<text x="285" y="464" font-size="8.2" fill="#0f172a" text-anchor="start" font-weight="700">  第8周末(3cm/8g)齐备全部器官雏形!</text>
<rect x="510" y="282" width="234" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="522" y="304" font-size="10.4" fill="#18794e" text-anchor="start" font-weight="700">③ 第 6–8 周：“自杀”雕出五指</text>
<circle cx="564" cy="342" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
<text x="564" y="371" font-size="8.2" fill="#64748b" text-anchor="middle">桨状手板</text>
<path d="M 590 342 L 616 342" stroke="#18794e" stroke-width="1.6" marker-end="url(#arr-green)"/>
<circle cx="668" cy="348" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<line x1="668" y1="345" x2="651" y2="333" stroke="#16a34a" stroke-width="4.0" stroke-linecap="round"/>
<line x1="668" y1="345" x2="659" y2="326" stroke="#16a34a" stroke-width="4.0" stroke-linecap="round"/>
<line x1="668" y1="345" x2="668" y2="323" stroke="#16a34a" stroke-width="4.0" stroke-linecap="round"/>
<line x1="668" y1="345" x2="677" y2="326" stroke="#16a34a" stroke-width="4.0" stroke-linecap="round"/>
<line x1="668" y1="345" x2="685" y2="334" stroke="#16a34a" stroke-width="4.0" stroke-linecap="round"/>
<circle cx="655" cy="331" r="1.8" fill="#dc2626"/>
<circle cx="663" cy="326" r="1.8" fill="#dc2626"/>
<circle cx="673" cy="326" r="1.8" fill="#dc2626"/>
<circle cx="681" cy="331" r="1.8" fill="#dc2626"/>
<text x="668" y="371" font-size="8.2" fill="#18794e" text-anchor="middle" font-weight="700">指蹼凋亡散开</text>
<rect x="522" y="376" width="210" height="116" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="532" y="395" font-size="8.8" fill="#18794e" text-anchor="start" font-weight="700">手指不是像树杈硬往外长出来的</text>
<text x="532" y="413" font-size="8.3" fill="#1e293b" text-anchor="start">• 四肢先长成连成一片的扁平小鸭蹼；</text>
<text x="532" y="430" font-size="8.3" fill="#1e293b" text-anchor="start">• 指缝细胞启动“程序性细胞凋亡”</text>
<text x="532" y="447" font-size="8.3" fill="#1e293b" text-anchor="start">  主动退场，像玉雕镂空刻出五指</text>
<text x="532" y="464" font-size="8.3" fill="#0f172a" text-anchor="start" font-weight="700">  （退场不全即形成先天性并指）。</text>
</svg>
