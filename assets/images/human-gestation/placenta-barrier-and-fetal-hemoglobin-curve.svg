<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">胎盘绒毛膜母婴血液隔离屏障、一静两动脐带与胎儿血红蛋白HbF氧解离曲线图解</title>
<desc id="desc">左栏展示母体螺旋动脉向绒毛间隙注血、胎儿绒毛毛细血管隔膜吸收氧气营养且母婴红细胞与T细胞互不混流，以及1条富氧脐静脉与2条缺氧脐动脉；右栏用Hill方程实算对比成人HbA(P50=26.8 mmHg)与胎儿HbF(P50=19.0 mmHg)氧解离曲线，展示在30 mmHg胎盘低氧压区饱和度由约58%跃升至77%的跨膜夺氧机制。</desc>
