<text x="602" y="252" font-size="8.2" fill="#1d6fa5" text-anchor="start" font-weight="700">母体 HbA (P50≈27)</text>
<text x="578" y="272" font-size="8.2" fill="#c25014" text-anchor="start" font-weight="700">30 mmHg处: 58%→77%!</text>
<rect x="414" y="338" width="316" height="128" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="424" y="357" font-size="8.9" fill="#c25014" text-anchor="start" font-weight="700">🔑 抢氧密码：γ 亚基换装 + “双重玻尔效应”</text>
<text x="424" y="375" font-size="8.3" fill="#1e293b" text-anchor="start">1. 绒毛血池 PO2 仅 35–50 mmHg（远低于肺泡 100），胎儿</text>
<text x="424" y="392" font-size="8.3" fill="#1e293b" text-anchor="start">   把成人 β 链换成 γ 链 (α2γ2)，不再紧绑促卸氧分子</text>
<text x="424" y="409" font-size="8.3" fill="#0f172a" text-anchor="start" font-weight="700">   2,3-BPG，氧亲和力暴涨，曲线左移把母血里的氧吸过来！</text>
<text x="424" y="428" font-size="8.3" fill="#1e293b" text-anchor="start">2. 胎儿 CO2 跨膜酸化母血促母血松手放氧，同时胎血变微碱</text>
<text x="424" y="445" font-size="8.3" fill="#1e293b" text-anchor="start">   把氧抓得更牢——一推一拉，同氧压净赚近 20% 饱和度！</text>
