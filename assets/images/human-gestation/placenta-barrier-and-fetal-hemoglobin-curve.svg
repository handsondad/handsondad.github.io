<rect x="0.5" y="0.5" width="759" height="495" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">母婴血液终身不混流，氧气怎么抢过来？绒毛膜隔墙集市与胎儿血红蛋白外挂</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左看胎盘“珊瑚树泡血池”隔膜交换与一静两动脐带；右看实算胎儿 HbF 左移曲线如何在低氧压下跨膜夺氧</text>
