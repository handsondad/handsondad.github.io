<text x="40" y="357" font-size="8.4" fill="#18794e" text-anchor="start" font-weight="700">✅ 获准过墙：O2/CO2(扩散)、葡萄糖(易化)、氨基酸/铁/钙</text>
<text x="40" y="374" font-size="8.3" fill="#1e293b" text-anchor="start">   (主动转运!)、母体 IgG 抗体(赠予新生儿半年被动免疫力)</text>
<text x="40" y="394" font-size="8.4" fill="#1d6fa5" text-anchor="start" font-weight="700">🛑 严禁过墙：母婴红细胞与母体杀伤性 T 细胞（即使母 A 型</text>
<text x="40" y="411" font-size="8.3" fill="#1e293b" text-anchor="start">   子 B 型也绝不凝集，更阻止母体免疫系统攻击胎儿！）</text>
<text x="40" y="431" font-size="8.3" fill="#c25014" text-anchor="start" font-weight="700">⚠️ 危险漏网：酒精、尼古丁、部分脂溶性药物与风疹病毒可穿</text>
<text x="40" y="448" font-size="8.3" fill="#1e293b" text-anchor="start">   透屏障致畸——胎盘是分子筛关卡，并非绝对防弹衣。</text>
