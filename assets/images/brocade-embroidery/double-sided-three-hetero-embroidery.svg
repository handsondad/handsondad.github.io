<svg xmlns="http://www.w3.org/2000/svg" width="760" height="518" viewBox="0 0 760 518" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">双面三异绣横截面藏针隐色拓扑图与锦缎绣三大技术对比表</title>
<desc id="desc">左图放大展示双面异色绣在透明底绢两侧利用长浮线遮蔽对方小于0.2毫米微折返点的横截面拓扑；右图系统对比缎(单层镜面长浮)、锦(重组织0/1提花)与绣(360度劈丝混色)的技术本质。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="517" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">巅峰解密：一块透明薄纱正反绣出“橘猫与黑狗”，异色丝线到底藏哪儿了？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">放大 100 倍剖开“双面三异绣（异稿、异针、异色）”的微观走针拓扑，并看懂锦、缎、绣的终极分工</text>
<rect x="22" y="68" width="396" height="384" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="90" r="10.5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="42" y="94" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">1</text>
<text x="60" y="95" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">微观横截面解剖：双面异色绣“长浮遮短扣”隐身术</text>
<rect x="36" y="112" width="368" height="210" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="220" y="134" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">↑ 正面观赏者视线（只看见鲜亮橘猫毛色，毫无黑点！）</text>
<line x1="50.0" y1="216.0" x2="390.0" y2="216.0" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="66" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="97" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="128" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="159" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="190" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="221" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="252" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="283" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="314" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="345" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<circle cx="376" cy="216" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
<text x="394" y="206" font-size="9.5" fill="#64748b" text-anchor="end">透明底绢丝</text>
<path d="M62,188 C90,174 190,174 216,188 L221,227 L227,188 C256,174 348,174 380,188" fill="none" stroke="#c25014" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M62,244 C82,256 108,256 123,244 L128,205 L134,244 C170,258 330,258 380,244" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="128.0" y1="202.0" x2="128.0" y2="160.0" stroke="#1d6fa5" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="218" y="155" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">← 黑线折返微点 (&lt;0.2 mm) 被橘色长丝完全盖死！</text>
<line x1="221.0" y1="231.0" x2="221.0" y2="272.0" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="221" y="286" font-size="9.8" fill="#b91c1c" text-anchor="middle" font-weight="700" class="halo">橘线折返微点被背面黑色长丝严密遮蔽！</text>
<text x="220" y="310" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">↓ 背面观赏者视线（只看见乌亮黑犬皮毛，零线头零死结！）</text>
<rect x="36" y="332" width="368" height="108" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="48" y="353" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">双面三异绣三大铁律（容错率为零）：</text>
<text x="48" y="375" font-size="10.5" fill="#1e293b" text-anchor="start">① 藏头隐尾不打结：起针穿入底丝夹心，收针顺贴邻线靠摩擦自锁；</text>
<text x="48" y="395" font-size="10.5" fill="#1e293b" text-anchor="start">② 轮廓重合公用边界：正反两幅异形图案的外轮廓严丝合缝对齐遮挡；</text>
<text x="48" y="415" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">③ 夹层遮蔽：异色折返点必须落在对方长浮针肚皮底下，绝不露异色！</text>
<rect x="432" y="68" width="306" height="384" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="452" cy="90" r="10.5" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="452" y="94" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">2</text>
<text x="470" y="95" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">一图分清“锦、缎、绣”底层技术原理</text>
<rect x="444" y="112" width="282" height="104" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="456" y="133" font-size="11" fill="#6d28d9" text-anchor="start" font-weight="700">缎 (Satin) —— 单层镜面织法</text>
<text x="456" y="155" font-size="10.2" fill="#1e293b" text-anchor="start" font-weight="400">• 原理：经纬交织点极少且互质打散(R≥5,R≠6)</text>
<text x="456" y="175" font-size="10.2" fill="#1e293b" text-anchor="start" font-weight="400">• 特长：极度顺滑光亮，是刺绣最佳“发光画布”</text>
<text x="456" y="195" font-size="10.2" fill="#1e293b" text-anchor="start" font-weight="400">• 短板：单层结构浮线长，怕硬物刮擦勾丝</text>
<rect x="444" y="226" width="282" height="104" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="456" y="247" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">锦 (Brocade) —— 多层编程织花</text>
<text x="456" y="269" font-size="10.2" fill="#1e293b" text-anchor="start" font-weight="400">• 原理：先染后织，0/1 花本控制多套重经/断纬</text>
<text x="456" y="289" font-size="10.2" fill="#1e293b" text-anchor="start" font-weight="400">• 特长：花纹与布骨一体成型，挺括富丽耐磨</text>
<text x="456" y="309" font-size="10.2" fill="#1e293b" text-anchor="start" font-weight="400">• 短板：受限于正交网格，制版挑花耗时数月</text>
<rect x="444" y="340" width="282" height="104" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="456" y="361" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">绣 (Embroidery) —— 自由矢量针画</text>
<text x="456" y="383" font-size="10.2" fill="#1e293b" text-anchor="start" font-weight="400">• 原理：织好底布后，劈丝至微米级 360° 穿刺</text>
<text x="456" y="403" font-size="10.2" fill="#1e293b" text-anchor="start" font-weight="400">• 特长：突破经纬直角，色彩渐变与立体感无敌</text>
<text x="456" y="423" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">• 融合：在锦缎底上施刺绣 = 名副其实“锦上添花”！</text>
<rect x="22" y="464" width="716" height="40" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="380" y="489" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">成语“锦上添花”的技术真相：在本来就用重组织提花织出暗纹的“锦缎”底料上，再用劈丝彩线“刺绣”出高光花鸟！</text>
</svg>
