<text x="208" y="274" font-size="10" fill="#64748b" text-anchor="middle" font-weight="600">蓝色 1 = 提综抬经    橙色 0 = 沉经露金红彩纬（菱形花纹成形！）</text>
<rect x="36" y="296" width="344" height="144" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="48" y="316" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">大花楼双人协同（上拽花本读指令，下投飞梭织彩锦）：</text>
