<text x="48" y="404" font-size="10" fill="#0f172a" text-anchor="start" font-weight="600">• 历史传承链：成都老官山汉墓提花机(前2世纪) → 明清云锦结绳花本</text>
<text x="48" y="423" font-size="10" fill="#6d28d9" text-anchor="start" font-weight="700">  → 1804 法国贾卡打孔卡织机 → 巴贝奇分析机与现代计算机编程鼻祖！</text>
<rect x="408" y="68" width="330" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="428" cy="90" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="428" y="94" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="446" y="95" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">三大名锦核心绝活：重组织与“通经断纬”</text>
<rect x="422" y="112" width="302" height="186" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="434" y="133" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">为什么南京云锦至今无法被现代工业织机完全替代？</text>
