<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">织锦大花楼挑花结本二进制提花原理与南京云锦通经断纬图解</title>
<desc id="desc">左图通过单次逐行动画展示花本0/1二进制代码控制经线起落与梭口投纬及从老官山汉墓织机到贾卡织机的传承；右图对比普通通经通纬与南京云锦多小梭局部盘织的通经断纬结构。</desc>
