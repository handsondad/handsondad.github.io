<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">“锦”为什么寸锦寸金？比电子计算机早两千年的“二进制花本”与通经断纬</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">缎是单色组织光泽，锦则是“重组织多色提花”：花纹在织布瞬间按 0/1 代码同步长进布骨子里！</text>
