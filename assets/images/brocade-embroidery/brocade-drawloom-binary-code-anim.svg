<text x="574" y="182" font-size="10" fill="#64748b" text-anchor="middle">普通提花（通经通纬）：金线横贯全幅，背面全浪费！</text>
<rect x="468" y="198" width="68" height="22" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
<text x="502" y="213" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">红绒小梭</text>
<rect x="552" y="198" width="68" height="22" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1.8"/>
<text x="586" y="213" font-size="10" fill="#18794e" text-anchor="middle" font-weight="700">孔雀羽梭</text>
<rect x="634" y="198" width="68" height="22" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="668" y="213" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">扁金线梭</text>
<text x="574" y="242" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="700">云锦“通经断纬（挖花妆彩）”：几十把小梭分区盘织！</text>
<text x="574" y="263" font-size="10" fill="#1e293b" text-anchor="middle">同一横行自由换几十种色彩，连真金线与孔雀羽都能织进去，</text>
<text x="574" y="280" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="600">两位老匠人配合一天仅能织出 5～6 厘米，故称“寸锦寸金”！</text>
<rect x="422" y="310" width="302" height="130" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="434" y="331" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">中国三大名锦的“重组织”技术指纹：</text>
<text x="434" y="355" font-size="10.5" fill="#1e293b" text-anchor="start">• 四川蜀锦（最古，兴于秦汉）：多用“经锦”（多色经线</text>
<text x="434" y="373" font-size="10.5" fill="#64748b" text-anchor="start">  交替浮出显花，不显花的色经藏入夹层背面）</text>
<text x="434" y="395" font-size="10.5" fill="#1e293b" text-anchor="start">• 苏州宋锦（文人书画装裱圣品）：三枚斜纹地 + 纬重组织</text>
<text x="434" y="417" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="700">• 南京云锦（宫廷巅峰，2009 世遗）：缎纹地 + 挖花盘金羽</text>
<rect x="22" y="466" width="716" height="40" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="380" y="491" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">核心判别法：把面料翻到背面看——印花布背面惨白模糊；织锦背面则是严丝合缝的彩色经纬结构反相或换梭接头！</text>
</svg>
