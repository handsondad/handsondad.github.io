<text x="274" y="342" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="700">↑ 提花工拽起“1”经</text>
<text x="274" y="366" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">← 梭口张开投彩纬</text>
