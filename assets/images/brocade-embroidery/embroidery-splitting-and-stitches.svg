<svg xmlns="http://www.w3.org/2000/svg" width="760" height="518" viewBox="0 0 760 518" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">苏绣1/128劈丝尺度对比与齐针、散套针、乱针绣光学混色原理图</title>
<desc id="desc">左图对比1股花线(200微米)、人发(70微米)、1/16丝与1/128极细丝(2-4微米)及人眼90微米分辨极限混色原理；右图对比齐针断层、散套针犬牙嵌合晕染与乱针绣多层斜叉叠光。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="517" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">从“织”跨入“绣”：挣脱 90° 经纬网格，1/128 劈丝与“以针代笔”光学混色</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">染好的丝线不能像油彩一样调和，绣娘靠“微米劈丝 + 犬牙套针/斜叉乱针”骗过人眼分辨率！</text>
<rect x="22" y="68" width="356" height="384" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="90" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="42" y="94" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">1</text>
<text x="60" y="95" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">指尖微米手术：一根绣花线劈成 128 丝有多细？</text>
<rect x="36" y="112" width="328" height="198" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="68" cy="142" r="16.0" fill="#6d28d9"/>
<text x="96" y="140" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">1 根原装花线（1 股）</text>
<text x="96" y="156" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">直径约 200 μm｜粗犷打底</text>
<circle cx="68" cy="186" r="7.0" fill="#475569"/>
<text x="96" y="184" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">成人头发丝（参照标尺）</text>
<text x="96" y="200" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">直径约 70 μm</text>
<circle cx="68" cy="230" r="3.2" fill="#1d6fa5"/>
<text x="96" y="228" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">劈成 1/16 丝（精细平绣）</text>
<text x="96" y="244" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">约 1～2 根单蚕丝（~12 μm）</text>
<circle cx="68" cy="274" r="1.1" fill="#b91c1c"/>
<text x="96" y="272" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">劈成 1/64～1/128 丝！</text>
<text x="96" y="288" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="600">仅约 2～4 μm（发丝的 1/20！）</text>
<rect x="36" y="322" width="328" height="116" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="48" y="344" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">为什么非要劈到肉眼几乎看不见？</text>
<text x="48" y="367" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">• 人眼在 30 cm 正常观赏距离的分辨极限约 90 μm！</text>
<text x="48" y="388" font-size="10.5" fill="#1e293b" text-anchor="start">• 当丝线细至几微米（远小于 90 μm），深红、绯红、粉白</text>
<text x="48" y="407" font-size="10.5" fill="#1e293b" text-anchor="start">  几十种色丝并排穿插，视网膜会自动融合成无缝柔光渐变，</text>
<text x="48" y="426" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">  彻底消灭笔刷痕迹！（原理同手机视网膜屏亚像素混色）</text>
<rect x="392" y="68" width="346" height="384" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="412" cy="90" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="412" y="94" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="430" y="95" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">三大里程碑针法：如何消除色块硬边与制造景深？</text>
<rect x="406" y="112" width="318" height="94" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="418" y="132" font-size="10.5" fill="#475569" text-anchor="start" font-weight="700">① 齐针并排（反例）：同长齐头换色 → 必留“生硬刀切缝”</text>
