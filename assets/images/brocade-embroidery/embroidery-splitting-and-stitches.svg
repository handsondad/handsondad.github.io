<text x="590" y="414" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="700">• 三维立体散射混色！</text>
<rect x="22" y="464" width="716" height="40" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="380" y="489" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">苏绣八字真言“平、齐、细、密、和、顺、光、匀”——每一字背后都是纤维张力控制与微米级光学排列！</text>
