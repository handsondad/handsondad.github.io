<line x1="540.0" y1="178.0" x2="650.0" y2="178.0" stroke="#fca5a5" stroke-width="2.6"/>
<line x1="426.0" y1="186.0" x2="536.0" y2="186.0" stroke="#dc2626" stroke-width="2.6"/>
<line x1="540.0" y1="186.0" x2="650.0" y2="186.0" stroke="#fca5a5" stroke-width="2.6"/>
<line x1="538.0" y1="140.0" x2="538.0" y2="194.0" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="684" y="172" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="700">断层刺眼!</text>
<rect x="406" y="216" width="318" height="104" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="418" y="236" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">② 苏绣“散套针”：长短犬牙嵌合 → 如水彩晕染无痕过渡！</text>
