<svg xmlns="http://www.w3.org/2000/svg" width="760" height="586" viewBox="0 0 760 586" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">黎曼猜想零点临界线与素数计数关系图</title>
<desc id="desc">左栏在数轴上标出二到三十一的素数并说明局部无规律整体可用x除以log x近似但误差由zeta函数零点控制，右栏画复平面中零到一的临界带与实部二分之一的临界线并在线上画七个非平凡零点，底栏说明猜想讲的是零点位置而不是某条素数公式。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="585" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">黎曼猜想问的不是素数，而是 ζ 函数的零点在哪</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">1859 年黎曼发现：素数计数的误差，被 ζ(s) 的非平凡零点位置死死控制住。</text>
<rect x="20" y="66" width="352" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="89" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="93" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">左边：素数为何难数</text>
<line x1="44.0" y1="250.0" x2="348.0" y2="250.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr-muted)"/>
<line x1="60.0" y1="244.0" x2="60.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="60" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">2</text>
<line x1="87.0" y1="244.0" x2="87.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="87" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">3</text>
<line x1="114.0" y1="244.0" x2="114.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="114" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">5</text>
<line x1="141.0" y1="244.0" x2="141.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="141" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">7</text>
<line x1="168.0" y1="244.0" x2="168.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="168" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">11</text>
<line x1="195.0" y1="244.0" x2="195.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="195" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">13</text>
<line x1="222.0" y1="244.0" x2="222.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="222" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">17</text>
<line x1="249.0" y1="244.0" x2="249.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="249" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">19</text>
<line x1="276.0" y1="244.0" x2="276.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="276" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">23</text>
<line x1="303.0" y1="244.0" x2="303.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="303" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">29</text>
<line x1="330.0" y1="244.0" x2="330.0" y2="256.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round"/>
<text x="330" y="278" font-size="10.5" fill="#1d6fa5" text-anchor="middle">31</text>
<text x="44" y="314" font-size="10.5" fill="#1e293b" text-anchor="start">局部看：间隔忽大忽小，没有简单规律。</text>
<text x="44" y="342" font-size="10.5" fill="#1e293b" text-anchor="start">整体看：π(x) ≈ x / log x，误差有多大？</text>
<rect x="40" y="366" width="312" height="88" rx="7" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="56" y="392" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">黎曼的发现：误差项 ≈ Σ 零点贡献</text>
<text x="56" y="420" font-size="10.5" fill="#1e293b" text-anchor="start">零点越靠近实部 1/2，素数分布越</text>
<text x="56" y="444" font-size="10.5" fill="#1e293b" text-anchor="start">接近“最优随机”；越往右偏，误差越大。</text>
<rect x="388" y="66" width="352" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="89" r="10.5" fill="#fee9e7" stroke="#b42318" stroke-width="1.2"/>
<text x="406" y="93" font-size="11.5" fill="#b42318" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">右边：零点排布与临界线</text>
<line x1="416.0" y1="340.0" x2="720.0" y2="340.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr-muted)"/>
<line x1="416.0" y1="132.0" x2="416.0" y2="340.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr-muted)"/>
<text x="408" y="360" font-size="10.5" fill="#64748b" text-anchor="middle">0</text>
<text x="714" y="360" font-size="10.5" fill="#64748b" text-anchor="middle">1</text>
<text x="430" y="126" font-size="10.5" fill="#64748b" text-anchor="start">Im s</text>
<rect x="520.0" y="132" width="96" height="208" fill="#fee9e7" stroke="#b42318" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="568.0" y1="132.0" x2="568.0" y2="340.0" stroke="#b42318" stroke-width="2" stroke-linecap="round"/>
<text x="568.0" y="360" font-size="10.5" fill="#b42318" text-anchor="middle" font-weight="700">Re s = 1/2</text>
<circle cx="568.0" cy="152.0" r="4.2" fill="#b42318" stroke="#b42318" stroke-width="1"/>
<circle cx="568.0" cy="180.0" r="4.2" fill="#b42318" stroke="#b42318" stroke-width="1"/>
<circle cx="568.0" cy="208.0" r="4.2" fill="#b42318" stroke="#b42318" stroke-width="1"/>
<circle cx="568.0" cy="236.0" r="4.2" fill="#b42318" stroke="#b42318" stroke-width="1"/>
<circle cx="568.0" cy="264.0" r="4.2" fill="#b42318" stroke="#b42318" stroke-width="1"/>
<circle cx="568.0" cy="292.0" r="4.2" fill="#b42318" stroke="#b42318" stroke-width="1"/>
<circle cx="568.0" cy="320.0" r="4.2" fill="#b42318" stroke="#b42318" stroke-width="1"/>
<text x="424" y="382" font-size="10.5" fill="#1e293b" text-anchor="start">平凡零点在负偶数；非平凡零点全在 0&lt;Re&lt;1 的带里。</text>
<text x="424" y="408" font-size="10.5" fill="#1e293b" text-anchor="start">RH 断言：它们全都站在正中央那条线上。</text>
<text x="424" y="440" font-size="10.5" fill="#b42318" text-anchor="start">2026-11-20 的证明，就是把这个断言变成定理。</text>
<rect x="20" y="500" width="720" height="72" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="526" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">读图顺序：先看左边“素数难数”，再看右边“零点在带里”，最后把两句接起来。</text>
<text x="38" y="554" font-size="10.5" fill="#475569" text-anchor="start">注意：RH 说的是零点位置，不是某一条素数公式；威力在于它一旦成立，上千条定理的“如果”就能删掉。</text>
</svg>
