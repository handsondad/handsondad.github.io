<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">阿波罗真月壤拟南芥氧化应激基因谱与荒漠齿肋赤藓五千戈瑞抗辐射及模拟火星再生实测图解</title>
<desc id="desc">左图展示阿波罗17号、12号与11号真月壤种植拟南芥的差异表达应激基因数分别为113、265与465个，揭示长期太阳风轰击形成的纳米单质铁与无有机质环境引发盐、金属及活性氧毒害；右图在对数坐标轴上对比人类3.5戈瑞、普通植物1000戈瑞、水熊虫4200戈瑞与齿肋赤藓约5000戈瑞的伽马射线半致死剂量，并列出失水98%两秒复绿、负196摄氏度液氮冰封再生及模拟火星舱七天100%再生三组实验证据。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="533" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">五、走出水培舱踏上月球与火星：真月壤种菜应激账本与“5000 Gy 不死”先锋藓</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">阿波罗月壤纳米铁触发数百个氧化应激基因；新疆齿肋赤藓靠玻璃化脱水硬扛火星低压极寒与强伽马辐射</text>
<rect x="20" y="64" width="348" height="456" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="315" height="22" rx="11.0" fill="#fffbeb" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="191.5" y="89.0" font-size="12" fill="#b45309" text-anchor="middle" font-weight="600">A · 阿波罗真月壤首种拟南芥（Commun. Biol. 2022）</text>
<text x="34" y="111" font-size="11.5" fill="#1e293b" text-anchor="start">发芽率近 100%，但第 6 天起根系受阻、开启强应激基因：</text>
<text x="36" y="132" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">地球火山灰模拟土 JSC-1A</text>
<rect x="36" y="140" width="296" height="20" rx="4" fill="#f1f5f9"/>
<rect x="36" y="140" width="14.0" height="20" rx="4" fill="#18794e"/>
<text x="44" y="173" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">对照基准（叶片舒展翠绿）</text>
<text x="36" y="194" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">阿波罗 17 号较年轻月壤 (70051)</text>
<rect x="36" y="202" width="296" height="20" rx="4" fill="#f1f5f9"/>
<rect x="36" y="202" width="66.9" height="20" rx="4" fill="#1d6fa5"/>
<text x="44" y="235" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">113 个应激基因（受创最轻）</text>
<text x="36" y="256" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">阿波罗 12 号亚成熟月壤 (12070)</text>
<rect x="36" y="264" width="296" height="20" rx="4" fill="#f1f5f9"/>
<rect x="36" y="264" width="156.9" height="20" rx="4" fill="#c25014"/>
<text x="44" y="297" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">265 个应激基因（植株矮小）</text>
<text x="36" y="318" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">阿波罗 11 号高成熟月壤 (10084)</text>
<rect x="36" y="326" width="296" height="20" rx="4" fill="#f1f5f9"/>
<rect x="36" y="326" width="275.3" height="20" rx="4" fill="#b91c1c"/>
<text x="44" y="359" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">465 个应激基因（紫黑僵苗）</text>
<rect x="34" y="382" width="320" height="124" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.1"/>
<text x="46" y="403" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">为什么外星原土“能发芽却难长壮”？</text>
<text x="46" y="424" font-size="11.5" fill="#1e293b" text-anchor="start">• 月壤：无有机质，亿年微陨石与太阳风轰出尖锐玻璃胶</text>
<text x="46" y="444" font-size="11.5" fill="#1e293b" text-anchor="start">  结物与纳米单质铁 (npFe⁰)，71% 差异基因指向盐、重</text>
<text x="46" y="464" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  金属与活性氧 (ROS) 毒害（越老的月海风化土越严重）！</text>
<text x="46" y="486" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">• 火壤含 0.5%–1% 高氯酸盐，种菜前须水洗或菌解。</text>
<rect x="380" y="64" width="360" height="456" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="394.0" y="74.0" width="324" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="556.0" y="89.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">B · 火星拓荒先锋：齿肋赤藓（The Innovation 2024）</text>
<text x="394" y="111" font-size="11.5" fill="#1e293b" text-anchor="start">伽马射线半致死剂量 LD50 对数标尺比较（单位：Gy）：</text>
<line x1="406" y1="178" x2="686" y2="178" stroke="#0f172a" stroke-width="2"/>
<line x1="406.0" y1="173" x2="406.0" y2="183" stroke="#0f172a" stroke-width="1.4"/>
<text x="406.0" y="198" font-size="11.5" fill="#64748b" text-anchor="middle">1 Gy</text>
<line x1="476.0" y1="173" x2="476.0" y2="183" stroke="#0f172a" stroke-width="1.4"/>
<text x="476.0" y="198" font-size="11.5" fill="#64748b" text-anchor="middle">10 Gy</text>
<line x1="546.0" y1="173" x2="546.0" y2="183" stroke="#0f172a" stroke-width="1.4"/>
<text x="546.0" y="198" font-size="11.5" fill="#64748b" text-anchor="middle">100 Gy</text>
<line x1="616.0" y1="173" x2="616.0" y2="183" stroke="#0f172a" stroke-width="1.4"/>
<text x="616.0" y="198" font-size="11.5" fill="#64748b" text-anchor="middle">1,000</text>
<line x1="686.0" y1="173" x2="686.0" y2="183" stroke="#0f172a" stroke-width="1.4"/>
<text x="686.0" y="198" font-size="11.5" fill="#64748b" text-anchor="middle">10,000</text>
<circle cx="444.1" cy="178" r="5.2" fill="#b91c1c" stroke="#ffffff" stroke-width="1.4"/>
<line x1="444.1" y1="172" x2="444.1" y2="156" stroke="#b91c1c" stroke-width="1.2"/>
<text x="444.1" y="152" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">人类 ~3.5 Gy</text>
<circle cx="616.0" cy="178" r="5.2" fill="#c25014" stroke="#ffffff" stroke-width="1.4"/>
<line x1="616.0" y1="184" x2="616.0" y2="204" stroke="#c25014" stroke-width="1.2"/>
<text x="616.0" y="216" font-size="11.5" fill="#c25014" text-anchor="end" font-weight="700">普通植物 ≤1000</text>
<circle cx="659.6" cy="178" r="5.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.4"/>
<line x1="659.6" y1="184" x2="659.6" y2="204" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="659.6" y="216" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">水熊虫 ~4200</text>
<circle cx="664.9" cy="178" r="5.2" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<line x1="664.9" y1="172" x2="664.9" y2="156" stroke="#6d28d9" stroke-width="1.2"/>
<text x="664.9" y="152" font-size="11.5" fill="#6d28d9" text-anchor="end" font-weight="700">齿肋赤藓 ~5000 Gy!</text>
<rect x="394" y="232" width="332" height="81" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="408" y="254" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">① 极致脱水“假死”与 2 秒复绿</text>
<text x="408" y="277" font-size="11.5" fill="#1e293b" text-anchor="start">失水 &gt;98% 叶片蜷缩变黑（蔗糖玻璃化护膜）；遇水 2 秒</text>
<text x="408" y="298" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">转绿，20 秒展叶，2 分钟内光合效率 Fv/Fm 满血恢复！</text>
<rect x="394" y="323" width="332" height="81" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="408" y="345" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">② 液氮 −196 °C 冰封与辐射反促长</text>
<text x="408" y="368" font-size="11.5" fill="#1e293b" text-anchor="start">−80 °C 冻存 5 年或 −196 °C 液氮泡 30 天再生率 ≥90%；</text>
<text x="408" y="389" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">500 Gy 强辐射非但未死，新枝数 (4.08) 反超对照 (3.24)！</text>
<rect x="394" y="414" width="332" height="81" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="408" y="436" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">③ 中科院模拟火星舱 7 天极限生还</text>
<text x="408" y="459" font-size="11.5" fill="#1e293b" text-anchor="start">同时承受 95% CO2、650 Pa 低压、−60~+20 °C 昼夜剧变</text>
<text x="408" y="480" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">与强紫外辐射 7 天，回温培养 30 天达 100% 再生率！</text>
</svg>
