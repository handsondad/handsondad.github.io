<svg xmlns="http://www.w3.org/2000/svg" width="760" height="528" viewBox="0 0 760 528" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">太空候选作物收获指数HI与株高紧凑度二维优选图解及生物量废料拆解对比</title>
<desc id="desc">左图在收获指数HI与株高坐标系中标定八种作物：1毫米微萍以100%收获指数居首，红叶生菜、茎叶块根兼食的甘薯与45厘米超矮春小麦Apogee落入太空优选黄金象限，而2.2米高秆玉米因62%不可食秸秆出局；右图对比五种作物可食与废料占比，解释马铃薯含龙葵素毒茎叶需耗氧降解而甘薯双食高效的生保账本。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="527" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二、太空农场的铁算盘：收获指数 HI 与矮化效率如何筛出“天选作物”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">每一克不可食秸秆都在白烧宝贵的 LED 光子并增加废物处理负担——八种候选作物定量坐标对比</text>
<rect x="20" y="64" width="426" height="450" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="213" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="140.5" y="89.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 收获指数 HI vs 株高紧凑度坐标图</text>
<rect x="191.7" y="128.0" width="228.2" height="82.7" rx="8" fill="#e7f6ee" fill-opacity="0.72" stroke="#18794e" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="305.8" y="120.0" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">太空优选黄金象限（株高 ≤ 60 cm · HI ≥ 50%）</text>
<line x1="118.4" y1="128" x2="118.4" y2="438" stroke="#e2e8f0" stroke-width="1"/>
<text x="118.4" y="456" font-size="11.5" fill="#64748b" text-anchor="middle">30%</text>
<line x1="199.9" y1="128" x2="199.9" y2="438" stroke="#e2e8f0" stroke-width="1"/>
<text x="199.9" y="456" font-size="11.5" fill="#64748b" text-anchor="middle">50%</text>
<line x1="281.4" y1="128" x2="281.4" y2="438" stroke="#e2e8f0" stroke-width="1"/>
<text x="281.4" y="456" font-size="11.5" fill="#64748b" text-anchor="middle">70%</text>
<line x1="362.9" y1="128" x2="362.9" y2="438" stroke="#e2e8f0" stroke-width="1"/>
<text x="362.9" y="456" font-size="11.5" fill="#64748b" text-anchor="middle">90%</text>
<line x1="403.6" y1="128" x2="403.6" y2="438" stroke="#e2e8f0" stroke-width="1"/>
<text x="403.6" y="456" font-size="11.5" fill="#64748b" text-anchor="middle">100%</text>
<line x1="98" y1="128.0" x2="424" y2="128.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="132.0" font-size="11.5" fill="#64748b" text-anchor="end">0</text>
<line x1="98" y1="192.6" x2="424" y2="192.6" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="196.6" font-size="11.5" fill="#64748b" text-anchor="end">50</text>
<line x1="98" y1="257.2" x2="424" y2="257.2" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="261.2" font-size="11.5" fill="#64748b" text-anchor="end">100</text>
<line x1="98" y1="321.8" x2="424" y2="321.8" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="325.8" font-size="11.5" fill="#64748b" text-anchor="end">150</text>
<line x1="98" y1="386.3" x2="424" y2="386.3" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="390.3" font-size="11.5" fill="#64748b" text-anchor="end">200</text>
<line x1="98" y1="128" x2="98" y2="438" stroke="#0f172a" stroke-width="1.4"/>
<line x1="98" y1="438" x2="424" y2="438" stroke="#0f172a" stroke-width="1.4"/>
<text x="261.0" y="480" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">收获指数 HI = 可食干重 / 植株总干重（越靠右垃圾越少）</text>
<text x="28" y="250" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">株高</text>
<text x="28" y="267" font-size="11.5" fill="#64748b" text-anchor="start">(cm)</text>
<text x="28" y="288" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">越上</text>
<text x="28" y="305" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">越省舱</text>
<circle cx="403.6" cy="129.3" r="5.2" fill="#18794e" stroke="#ffffff" stroke-width="1.5"/>
<text x="394.6" y="139.3" font-size="11.5" fill="#18794e" text-anchor="end" font-weight="700">微萍 Wolffia (1mm)</text>
<circle cx="342.5" cy="152.5" r="5.2" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
<text x="333.5" y="157.5" font-size="11.5" fill="#0f766e" text-anchor="end" font-weight="700">红叶生菜/水菜</text>
<circle cx="314.0" cy="173.2" r="5.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.5"/>
<text x="323.0" y="177.2" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">甘薯(根叶兼食)</text>
<circle cx="208.0" cy="187.4" r="5.2" fill="#6d28d9" stroke="#ffffff" stroke-width="1.5"/>
<text x="217.0" y="193.4" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">超矮小麦 Apogee</text>
<circle cx="208.0" cy="208.1" r="5.2" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<text x="217.0" y="214.1" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">马铃薯(仅块茎)</text>
<circle cx="167.3" cy="208.1" r="5.2" fill="#b45309" stroke="#ffffff" stroke-width="1.5"/>
<text x="125.3" y="230.1" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">大豆(蛋白油脂)</text>
<circle cx="159.1" cy="259.8" r="5.2" fill="#475569" stroke="#ffffff" stroke-width="1.5"/>
<text x="168.1" y="264.8" font-size="11.5" fill="#475569" text-anchor="start" font-weight="700">普通高秆小麦</text>
<circle cx="151.0" cy="405.7" r="5.2" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<text x="160.0" y="399.7" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">高秆玉米(2.2m·淘汰)</text>
<text x="233" y="502" font-size="11.5" fill="#64748b" text-anchor="middle">注：微萍无根茎 100% 可食；甘薯嫩叶可作绿蔬使综合 HI 达 ~78%。</text>
<rect x="458" y="64" width="282" height="450" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="472.0" y="74.0" width="179" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="561.5" y="89.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">B · 可食营养 vs 不可食废料拆解</text>
<text x="472" y="112" font-size="11.5" fill="#1e293b" text-anchor="start">同样耗费 100 份光能与养分长出的生物量：</text>
<text x="472" y="132" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">微萍 Wolffia（无根无茎无草酸）</text>
<rect x="472" y="140" width="252.0" height="22" rx="4" fill="#18794e"/>
<text x="598.0" y="155" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">100% 全食</text>
<text x="472" y="190" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">红叶生菜 Outredgeous（即摘即食）</text>
<rect x="472" y="198" width="214.2" height="22" rx="4" fill="#0f766e"/>
<rect x="686.2" y="198" width="37.8" height="22" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
<text x="579.1" y="213" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">85% 鲜叶</text>
<text x="705.1" y="213" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">15%</text>
<text x="472" y="248" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">甘薯（块根 55% + 嫩茎叶 23%）</text>
<rect x="472" y="256" width="196.6" height="22" rx="4" fill="#1d6fa5"/>
<rect x="668.6" y="256" width="55.4" height="22" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
<text x="570.3" y="271" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">78% 双食</text>
<text x="696.3" y="271" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">22%</text>
<text x="472" y="306" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">马铃薯（茎叶含龙葵素毒不可食）</text>
<rect x="472" y="314" width="131.0" height="22" rx="4" fill="#c25014"/>
<rect x="603.0" y="314" width="121.0" height="22" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
<text x="537.5" y="329" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">52% 块茎</text>
<text x="663.5" y="329" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">48% 毒茎叶</text>
<text x="472" y="364" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">高秆玉米（粗秆·苞叶·穗轴占大头）</text>
<rect x="472" y="372" width="95.8" height="22" rx="4" fill="#b91c1c"/>
<rect x="567.8" y="372" width="156.2" height="22" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
<text x="519.9" y="387" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">38%</text>
<text x="645.9" y="387" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">62% 秸秆废料</text>
<rect x="472" y="420" width="254" height="84" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="484" y="439" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么封闭舱常偏爱甘薯胜过土豆？</text>
<text x="484" y="458" font-size="11.5" fill="#1e293b" text-anchor="start">土豆茎叶含龙葵素，降解它还要倒扣宝</text>
<text x="484" y="477" font-size="11.5" fill="#1e293b" text-anchor="start">贵氧气；甘薯块根管饱、嫩尖当青菜炒，</text>
<text x="484" y="495" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">微重力扦插 5 天即可生根（航天飞机实测）</text>
</svg>
