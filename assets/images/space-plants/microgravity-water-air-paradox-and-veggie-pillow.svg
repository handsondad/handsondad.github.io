<rect x="0.5" y="0.5" width="759" height="535" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、失重下的水气双悖论：为什么在太空浇水反而会把根“憋死”、把麦穗“熏绝育”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">微重力抽走浮力对流（停滞气膜积聚乙烯）并放大毛细张力（水壳裹死根毛），迫使太空农业重构供水与通风</text>
