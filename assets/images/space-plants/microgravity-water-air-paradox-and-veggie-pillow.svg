<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">微重力下植物根区缺氧与叶面停滞层水气双悖论及空间站培养舱破局与五维选种标准图解</title>
<desc id="desc">左上对比地球1g重力排水与浮力自然对流同轨道微重力下毛细水膜裹死根系导致缺氧窒息、无对流停滞层积聚乙烯导致和平号小麦绝育的双重物理陷阱；右上解剖NASA Veggie与问天实验舱采用红蓝绿LED灯板、强制通风除乙烯滤芯及多孔煅烧黏土植物枕水气平衡方案；底部列出高收获指数HI、矮小株高、短周期、高营养护盾与免虫媒耐逆境五道选种门槛。</desc>
