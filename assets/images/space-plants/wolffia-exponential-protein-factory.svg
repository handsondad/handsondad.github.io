<svg xmlns="http://www.w3.org/2000/svg" width="760" height="524" viewBox="0 0 760 524" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">世界最小开花植物微萍Wolffia一毫米无根解剖结构与二十天指数增殖蛋白工厂曲线图解</title>
<desc id="desc">左图展示仅约1毫米大小的微萍叶状体剖面：无根无茎无草酸钙，靠顶部通气组织浮水、下表皮直接吸收铵氮与磷，并在母体囊袋内套娃式芽殖子代与孙代原基；右图按实测相对生长率绘制从10克起始火种经20天指数增殖建成2000克稳态母本池、此后每日持续采收600克鲜品满足成人全天蛋白质需求的锯齿稳态曲线，并标注最快29.3小时倍增极限线。</desc>
