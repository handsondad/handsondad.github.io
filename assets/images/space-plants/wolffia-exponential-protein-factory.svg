<text x="46" y="413" font-size="11.5" fill="#1e293b" text-anchor="start">• 干重含 20%–35% 全谱蛋白，齐备 9 种必需氨基酸</text>
<text x="46" y="434" font-size="11.5" fill="#1e293b" text-anchor="start">• 脂肪约 80% 为多不饱和脂肪酸（富护心 ω-3）</text>
<text x="46" y="455" font-size="11.5" fill="#1e293b" text-anchor="start">• 唯一不含草酸钙针晶的浮萍属，免肾结石隐患</text>
<text x="46" y="476" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 2024 变重力实验：个体越小的克隆株倍增越快！</text>
