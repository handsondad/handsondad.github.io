<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">大观楼蓝底鎏金抱柱长联实景左右读序与无标点五步领字断句指南图</title>
<desc id="desc">左侧立面图展示面向大观楼正门时右手东柱为上联（末字柳仄收）、左手西柱为下联（末字霜平收）的传统读序；右侧提供五步领字换气口诀，帮助读者在原匾无标点情况下按5-4-4-7、一字领四排、4-6过渡、5-7扇面对、三字领四言轻松断句朗读。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="431" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">站在大观楼前怎么读不迷路？蓝底金字抱柱联实景读法与断句秘籍</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">原匾通篇无标点、竖排分列：记住“面门先右后左、末字仄起平收、一字三字领句换气”三条口诀。</text>
<rect x="20" y="64" width="348" height="356" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="88" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">① 面对临水正门：哪边是上联？按什么顺序读？</text>
<polygon points="194.0,98 138.0,120 250.0,120" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
<rect x="156.0" y="120" width="76" height="16" fill="#e2e8f0" stroke="#475569"/>
<polygon points="140.0,136 248.0,136 276.0,152 112.0,152" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
<rect x="134.0" y="152" width="120" height="22" fill="#e2e8f0" stroke="#475569"/>
<rect x="160.0" y="155" width="68" height="16" rx="3" fill="#163a5f" stroke="#f59e0b" stroke-width="1.2"/>
<text x="194.0" y="167" font-size="10.5" fill="#fde68a" text-anchor="middle" font-weight="700">大 观 楼</text>
<polygon points="114.0,174 274.0,174 312.0,192 76.0,192" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
<rect x="100.0" y="194" width="58" height="164" rx="5" fill="#163a5f" stroke="#f59e0b" stroke-width="1.5"/>
<text x="129.0" y="212" font-size="10.2" fill="#93c5fd" text-anchor="middle" font-weight="700">西柱·下联</text>
<text x="129.0" y="232" font-size="10.2" fill="#fde68a" text-anchor="middle" font-weight="600">数千年往事</text>
<text x="129.0" y="250" font-size="10.2" fill="#fde68a" text-anchor="middle">注到心头…</text>
<text x="129.0" y="270" font-size="10.2" fill="#fde68a" text-anchor="middle">想汉习楼船</text>
<text x="129.0" y="290" font-size="10.2" fill="#fde68a" text-anchor="middle">……</text>
<text x="129.0" y="310" font-size="10.2" fill="#fde68a" text-anchor="middle">两行秋雁</text>
<text x="129.0" y="330" font-size="10.5" fill="#fef08a" text-anchor="middle" font-weight="700">一枕清霜</text>
<text x="129.0" y="350" font-size="9.8" fill="#86efac" text-anchor="middle" font-weight="700">末字“霜”平声</text>
<rect x="166.0" y="216" width="56" height="142" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="194.0" y="274" font-size="11.0" fill="#64748b" text-anchor="middle" font-weight="600">正门</text>
<text x="194.0" y="294" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">← 后读</text>
<text x="194.0" y="252" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">先读 →</text>
<rect x="230.0" y="194" width="58" height="164" rx="5" fill="#163a5f" stroke="#f59e0b" stroke-width="1.5"/>
<text x="259.0" y="212" font-size="10.2" fill="#93c5fd" text-anchor="middle" font-weight="700">东柱·上联</text>
<text x="259.0" y="232" font-size="10.2" fill="#fde68a" text-anchor="middle" font-weight="600">五百里滇池</text>
<text x="259.0" y="250" font-size="10.2" fill="#fde68a" text-anchor="middle">奔来眼底…</text>
<text x="259.0" y="270" font-size="10.2" fill="#fde68a" text-anchor="middle">看东骧神骏</text>
<text x="259.0" y="290" font-size="10.2" fill="#fde68a" text-anchor="middle">……</text>
<text x="259.0" y="310" font-size="10.2" fill="#fde68a" text-anchor="middle">九夏芙蓉</text>
<text x="259.0" y="330" font-size="10.5" fill="#fef08a" text-anchor="middle" font-weight="700">三春杨柳</text>
<text x="259.0" y="350" font-size="9.8" fill="#fda4af" text-anchor="middle" font-weight="700">末字“柳”仄声</text>
<text x="194.0" y="382" font-size="10.3" fill="#0f172a" text-anchor="middle" font-weight="700">游客视角：右手东柱为上联（先读），左手西柱为下联（后读）</text>
<text x="194.0" y="402" font-size="10.2" fill="#64748b" text-anchor="middle">每块木匾内部竖排亦按传统“自右向左”逐列移目</text>
<rect x="384" y="64" width="356" height="356" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="400" y="88" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">② 原匾零标点：五步“领字换气法”当场读通</text>
<rect x="398" y="102" width="328" height="46" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.0"/>
<text x="408" y="120" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="700">第 1 拍｜5·4·4·7 破题</text>
<text x="408" y="138" font-size="10.1" fill="#0f172a" text-anchor="start">五百里滇池 / 奔来眼底 / 披襟岸帻 / 喜｜茫茫空阔无边</text>
<rect x="398" y="156" width="328" height="46" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.0"/>
<text x="408" y="174" font-size="10.8" fill="#18794e" text-anchor="start" font-weight="700">第 2 拍｜1字领 4×4 排比</text>
<text x="408" y="192" font-size="10.1" fill="#0f172a" text-anchor="start">看（想）｜XXXX · XXXX · XXXX · XXXX（一口气四顿）</text>
<rect x="398" y="210" width="328" height="46" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.0"/>
<text x="408" y="228" font-size="10.8" fill="#475569" text-anchor="start" font-weight="700">第 3 拍｜4·6 舒缓换气</text>
<text x="408" y="246" font-size="10.1" fill="#0f172a" text-anchor="start">高人韵士（伟烈丰功）/ 何妨选胜登临（费尽移山心力）</text>
<rect x="398" y="264" width="328" height="46" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.0"/>
<text x="408" y="282" font-size="10.8" fill="#6d28d9" text-anchor="start" font-weight="700">第 4 拍｜5·7 隔句对 ×2</text>
<text x="408" y="300" font-size="10.1" fill="#0f172a" text-anchor="start">趁（尽）XXXXX，XX就（不及）XXXX；（更/便 同构）</text>
<rect x="398" y="318" width="328" height="46" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.0"/>
<text x="408" y="336" font-size="10.8" fill="#b45309" text-anchor="start" font-weight="700">第 5 拍｜3字领 4×4 余音</text>
<text x="408" y="354" font-size="10.1" fill="#0f172a" text-anchor="start">莫辜负（只赢得）｜四万九三（几半两一）四组四言慢收！</text>
<rect x="398" y="376" width="328" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="562.0" y="397" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="700">毛泽东评点大观楼长联：“从古未有，别创一格！”</text>
</svg>
