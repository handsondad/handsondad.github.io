<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">用柯西留数定理计算实数反常积分 dx/(1+x²) 等于 π</title>
<desc id="desc">左图展示上半复平面半径为 R 的 D 形闭合围线包住奇点 z=i 并排除 z=-i；右图分三步展示围线拆分、半圆弧积分按 πR/(R²-1) 趋于零，以及留数 2πi 乘 1/(2i) 得到 π。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#6d28d9"/>
        </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="395" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">用柯西留数定理秒杀实数反常积分：∫₋∞^∞ dx/(1+x²) = π</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">不求反正切原函数，借上半复平面 D 形闭合围线包住唯一奇点 z = i，三步直接读出答案</text>
<rect x="20" y="66" width="356" height="314" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="90" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">上半复平面闭合围线 C_R</text>
<rect x="236.0" y="74.0" width="126" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="299.0" y="89.0" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="600">只包住 z = +i</text>
<path d="M 84.0,248.0 L 300.0,248.0 A 108.0,108.0 0 0 0 84.0,248.0 Z" fill="#eaf4fb" fill-opacity="0.58" stroke="none"/>
<line x1="40" y1="248.0" x2="356" y2="248.0" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-muted)"/>
<line x1="192.0" y1="336" x2="192.0" y2="112" stroke="#475569" stroke-width="1.3" marker-end="url(#arr-muted)"/>
<text x="354" y="240.0" font-size="11.5" fill="#64748b" text-anchor="end">实轴 Re</text>
<text x="200.0" y="120" font-size="11.5" fill="#64748b" text-anchor="start">虚轴 Im</text>
<line x1="84.0" y1="248.0" x2="174.0" y2="248.0" stroke="#1d6fa5" stroke-width="3.0" marker-end="url(#arr-blue)"/>
<line x1="170.0" y1="248.0" x2="300.0" y2="248.0" stroke="#1d6fa5" stroke-width="3.0"/>
<line x1="212.0" y1="248.0" x2="248.0" y2="248.0" stroke="#1d6fa5" stroke-width="3.0" marker-end="url(#arr-blue)"/>
<path d="M 300.0,248.0 A 108.0,108.0 0 0 0 246.0,154.5" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-purple)"/>
<path d="M 246.0,154.5 A 108.0,108.0 0 0 0 84.0,248.0" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="192.0" y1="248.0" x2="119.7" y2="167.7" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="138.0" y="208.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600" class="halo">半径 R → ∞</text>
<text x="276.0" y="160.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600" class="halo">上半圆弧 Γ_R</text>
<circle cx="84.0" cy="248.0" r="3.2" fill="#0f172a"/>
<text x="84.0" y="267.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">-R</text>
<circle cx="192.0" cy="248.0" r="3.2" fill="#0f172a"/>
<text x="184.0" y="267.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">0</text>
<circle cx="300.0" cy="248.0" r="3.2" fill="#0f172a"/>
<text x="300.0" y="267.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">+R</text>
<path d="M 208.0,198.0 A 16,16 0 1 0 203.3,209.3" fill="none" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<circle cx="192.0" cy="198.0" r="5.5" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<text x="214.0" y="195.0" font-size="12" fill="#c25014" text-anchor="start" font-weight="700" class="halo">圈内奇点 z = +i</text>
<text x="214.0" y="212.0" font-size="11.5" fill="#1e293b" text-anchor="start" class="halo">留数 Res = 1/(2i)</text>
<circle cx="192.0" cy="298.0" r="5.2" fill="#ffffff" stroke="#64748b" stroke-width="1.8" stroke-dasharray="2.5 2"/>
<text x="205.0" y="302.0" font-size="11.5" fill="#64748b" text-anchor="start">圈外奇点 z = -i（不计入）</text>
<text x="198" y="364" font-size="11.5" fill="#64748b" text-anchor="middle">实轴段 [-R, R]（蓝）与半圆弧 Γ_R（紫）围成 D 形圈</text>
<rect x="390" y="66" width="350" height="314" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="408" y="90" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">三步算清整圈账本（无需原函数）</text>
<rect x="404" y="104" width="322" height="70" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<circle cx="422" cy="122" r="10.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="422" y="126" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="440" y="126" font-size="12.5" fill="#1d6fa5" text-anchor="start" font-weight="700">把实轴积分嵌入闭合围线</text>
<text x="418" y="147" font-size="11.5" fill="#0f172a" text-anchor="start" class="mono">∮_C f(z)dz = ∫₋R^R dx/(1+x²) + ∫_Γ f(z)dz</text>
<text x="418" y="165" font-size="11.5" fill="#1e293b" text-anchor="start">1+z² = (z-i)(z+i)，上半平面仅包住 z = i</text>
<rect x="404" y="184" width="322" height="76" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<circle cx="422" cy="202" r="10.5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="422" y="206" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="440" y="206" font-size="12.5" fill="#6d28d9" text-anchor="start" font-weight="700">估界证明：半圆弧贡献随 R → ∞ 归零</text>
<text x="418" y="227" font-size="11.5" fill="#1e293b" text-anchor="start">|z| = R 时 |1+z²| ≥ R²-1，半圆弧长 = πR</text>
<text x="418" y="247" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">|∫_Γ| ≤ πR/(R²-1) → 0（分母 R² 压倒分子 R）</text>
<rect x="404" y="270" width="322" height="96" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<circle cx="422" cy="288" r="10.5" fill="#ffffff" stroke="#18794e" stroke-width="1.2"/>
<text x="422" y="292" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">3</text>
<text x="440" y="292" font-size="12.5" fill="#18794e" text-anchor="start" font-weight="700">留数定理一锤定音</text>
<text x="418" y="313" font-size="11.5" fill="#0f172a" text-anchor="start" class="mono">Res(i) = 1/(z+i)|_{z=i} = 1/(2i)</text>
<text x="418" y="333" font-size="11.5" fill="#1e293b" text-anchor="start">整圈积分 = 2πi × 1/(2i) = π（与 R 无关）</text>
<text x="418" y="354" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">令 R → ∞：∫₋∞^∞ dx/(1+x²) = π - 0 = π</text>
</svg>
