<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">求根号 2 的长方形取平均法与柯西列数轴放大图</title>
<desc id="desc">左图展示面积为2的长方形两边取平均一步步逼近正方形，给出x1到x4的精确分数；右图在数轴上放大150倍展示分数项挤向根号2处的有理数空洞。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="355" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">柯西列的巧思：面积为 2 的长方形越压越方，在数轴上挤向一个“分数空洞”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左边解释迭代公式怎么来的；右边展示：哪怕有理数世界里没有 √2 这个终点，单看项与项越挤越近也能判定收敛趋势。</text>
<rect x="20" y="62" width="344" height="278" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">① 公式哪来的？把面积=2 的长方形两边取平均</text>
<rect x="48" y="114" width="42.0" height="84.0" rx="3" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<text x="69.0" y="214.0" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">宽 x₁ = 1</text>
<text x="96.0" y="160.0" font-size="11" fill="#c25014" text-anchor="start">高 2/1=2</text>
<line x1="142" y1="156" x2="174" y2="156" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<text x="158" y="148" font-size="10.5" fill="#64748b" text-anchor="middle">取平均</text>
<rect x="188.0" y="128.0" width="63.0" height="56.0" rx="3" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.6"/>
<rect x="188.0" y="124.6" width="59.4" height="59.4" fill="none" stroke="#18794e" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="219.5" y="200.0" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">宽 x₂ = 3/2 = 1.5</text>
<text x="257.0" y="160.1" font-size="11" fill="#1d6fa5" text-anchor="start">高 4/3</text>
<text x="218.0" y="120.0" font-size="10.5" fill="#18794e" text-anchor="middle">绿虚线：理想正方形 √2</text>
<rect x="36" y="224" width="312" height="102" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="48" y="244" font-size="11.3" fill="#0f172a" text-anchor="start" font-weight="600">再取一次平均，每一项都仍是纯粹的分数：</text>
<text x="48" y="264" font-size="11.2" fill="#1e293b" text-anchor="start" class="mono">• x₁ = 1/1 = 1.000000</text>
<text x="48" y="282" font-size="11.2" fill="#1e293b" text-anchor="start" class="mono">• x₂ = 3/2 = 1.500000      （与 x₁ 差 0.5）</text>
<text x="48" y="300" font-size="11.2" fill="#1e293b" text-anchor="start" class="mono">• x₃ = 17/12 ≈ 1.416667    （与 x₂ 差 0.083）</text>
<text x="48" y="318" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="600" class="mono">• x₄ = 577/408 ≈ 1.414216  （与 x₃ 差 0.0025）</text>
<rect x="378" y="62" width="362" height="278" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="394" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">② 数轴放大看：所有分数都在往同一个位置聚拢</text>
<line x1="406.0" y1="134.0" x2="712.0" y2="134.0" stroke="#0f172a" stroke-width="1.6"/>
<line x1="406.0" y1="130.0" x2="406.0" y2="138.0" stroke="#64748b" stroke-width="1.2"/>
<text x="406.0" y="151.0" font-size="10.5" fill="#64748b" text-anchor="middle">1.0</text>
<line x1="508.0" y1="130.0" x2="508.0" y2="138.0" stroke="#64748b" stroke-width="1.2"/>
<text x="508.0" y="151.0" font-size="10.5" fill="#64748b" text-anchor="middle">1.2</text>
<line x1="610.0" y1="130.0" x2="610.0" y2="138.0" stroke="#64748b" stroke-width="1.2"/>
<text x="610.0" y="151.0" font-size="10.5" fill="#64748b" text-anchor="middle">1.4</text>
<line x1="712.0" y1="130.0" x2="712.0" y2="138.0" stroke="#64748b" stroke-width="1.2"/>
<text x="712.0" y="151.0" font-size="10.5" fill="#64748b" text-anchor="middle">1.6</text>
<circle cx="406.0" cy="134.0" r="4" fill="#1e293b"/>
<text x="406.0" y="124.0" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">x₁=1</text>
<circle cx="618.5" cy="134.0" r="4" fill="#1d6fa5"/>
<text x="618.5" y="124.0" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">x₃</text>
<circle cx="661.0" cy="134.0" r="4" fill="#1e293b"/>
<text x="661.0" y="124.0" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">x₂=1.5</text>
<circle cx="617.2" cy="134.0" r="4.8" fill="#ffffff" stroke="#c25014" stroke-width="2"/>
<polygon points="615.6,140.0 621.2,140.0 720.0,198.0 398.0,198.0" fill="#fef1e8" fill-opacity="0.45" stroke="#c25014" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="398.0" y="198.0" width="322.0" height="82" rx="8" fill="#ffffff" stroke="#c25014" stroke-width="1.3"/>
<text x="410.0" y="216.0" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="600">放大 150 倍看区间 [1.4138, 1.4170]：</text>
<line x1="414.0" y1="246.0" x2="704.0" y2="246.0" stroke="#0f172a" stroke-width="1.6"/>
<circle cx="670.6" cy="246.0" r="4" fill="#1d6fa5"/>
<text x="666.6" y="237.0" font-size="10.8" fill="#1d6fa5" text-anchor="end" font-weight="600">x₃≈1.4167</text>
<circle cx="454.6" cy="246.0" r="4" fill="#1d6fa5"/>
<text x="462.6" y="264.0" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="600">x₄≈1.414216</text>
<circle cx="454.4" cy="246.0" r="5.5" fill="#ffffff" stroke="#c25014" stroke-width="2.2"/>
<text x="452.4" y="236.0" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">√2（无理数空洞）</text>
<text x="394" y="303" font-size="11.2" fill="#1e293b" text-anchor="start">哪怕先不知道 √2 是谁，只要项与项彼此无限贴近，就叫【柯西列】；</text>
<text x="394" y="322" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="600">把所有这类“分数空洞”全部填实，有理数就升级成了完备的【实数】！</text>
</svg>
