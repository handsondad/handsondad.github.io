<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">微积分基础危机与柯西极限窄带思想</title>
<desc id="desc">左图展示早期求导中Δx先作非零除数后又置零的矛盾及1−1+1−1级数歧义；右图展示序列从某步起永远落入任意窄误差带L±ε的柯西极限思想。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="343" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">微积分当年闯了什么祸？从“零的鬼魂”到柯西的“任意窄带挑战”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">早期微积分一会儿拿 Δx 当非零分母，一会儿又令 Δx=0 抹掉；柯西改用“无限逼近到比任何给定误差都小”立下规矩。</text>
<rect x="20" y="62" width="356" height="266" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">① 18 世纪的尴尬：它到底是不是 0？</text>
<rect x="36" y="98" width="324" height="114" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="48" y="118" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">求 y = x² 切线斜率时的“双重标准”：</text>
<text x="48" y="140" font-size="11.5" fill="#1e293b" text-anchor="start">第1步：((x+Δx)² − x²) / Δx = 2x + Δx</text>
<text x="62" y="158" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="600">↳ 能放进分母约分，前提是 Δx ≠ 0！</text>
<text x="48" y="179" font-size="11.5" fill="#1e293b" text-anchor="start">第2步：直接擦掉尾巴，宣布斜率 = 2x</text>
<text x="62" y="197" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="600">↳ 转头又当 Δx = 0！（贝克莱嘲讽：已死量的鬼魂）</text>
<rect x="36" y="222" width="324" height="90" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="48" y="242" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">无穷级数乱加括号的车祸：1 − 1 + 1 − 1 + … = ？</text>
<text x="48" y="263" font-size="11.3" fill="#1e293b" text-anchor="start">• (1−1) + (1−1) + … = 0</text>
<text x="48" y="282" font-size="11.3" fill="#1e293b" text-anchor="start">• 1 − (1−1) − (1−1) − … = 1    （同一个式子三个答案！）</text>
<text x="48" y="301" font-size="11.2" fill="#64748b" text-anchor="start">⇒ 不先定义什么叫“收敛”，无穷求和根本没法算。</text>
<rect x="390" y="62" width="350" height="266" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="406" y="84" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">② 柯西的极限法则：永不除以 0，只看能否锁进窄带</text>
<rect x="434.0" y="178.0" width="282.0" height="36.1" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="434.0" y1="196.0" x2="716.0" y2="196.0" stroke="#18794e" stroke-width="1.6"/>
<text x="428.0" y="200.0" font-size="12" fill="#18794e" text-anchor="end" font-weight="700">L</text>
<text x="712.0" y="173.0" font-size="10.8" fill="#18794e" text-anchor="end" font-weight="600">你任意指定窄带 L ± ε</text>
<line x1="544.0" y1="112" x2="544.0" y2="268" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="3 3"/>
<text x="549.0" y="124" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="600">从这一步往后，全关进窄带里！</text>
<polyline points="448.0,251.8 478.7,158.1 509.3,221.8 540.0,178.5 570.6,207.9 601.3,187.9 631.9,201.5 662.6,192.3 693.2,198.5" fill="none" stroke="#cbd5e1" stroke-width="1.4"/>
<circle cx="448.0" cy="251.8" r="4.0" fill="#c25014"/>
<circle cx="478.7" cy="158.1" r="4.0" fill="#c25014"/>
<circle cx="509.3" cy="221.8" r="4.0" fill="#c25014"/>
<circle cx="540.0" cy="178.5" r="4.0" fill="#18794e"/>
<circle cx="570.6" cy="207.9" r="4.0" fill="#18794e"/>
<circle cx="601.3" cy="187.9" r="4.0" fill="#18794e"/>
<circle cx="631.9" cy="201.5" r="4.0" fill="#18794e"/>
<circle cx="662.6" cy="192.3" r="4.0" fill="#18794e"/>
<circle cx="693.2" cy="198.5" r="4.0" fill="#18794e"/>
<text x="406" y="290" font-size="11.3" fill="#1e293b" text-anchor="start">柯西的改造：Δx 只是一个不断变小、以 0 为极限的变量，</text>
<text x="406" y="309" font-size="11.3" fill="#18794e" text-anchor="start" font-weight="600">全程保持 Δx ≠ 0；只要差值能小于任意给定的正数，极限就是 2x！</text>
</svg>
