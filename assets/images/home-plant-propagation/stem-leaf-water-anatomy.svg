<text x="113" y="253" font-size="9.5" fill="#0f766e" text-anchor="middle" font-weight="700">节部冒出不定根</text>
<rect x="204" y="106" width="158" height="152" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="283" y="124" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="700">✗ 上下倒插（必枯死）</text>
<line x1="214" y1="196" x2="352" y2="196" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4,3"/>
<rect x="278" y="136" width="10" height="96" rx="3" fill="#475569"/>
<line x1="266" y1="212" x2="266" y2="148" stroke="#b91c1c" stroke-width="2.0" marker-end="url(#arr-red)"/>
<text x="238" y="180" font-size="9.5" fill="#b91c1c" text-anchor="middle" font-weight="700">IAA仍往</text>
<text x="238" y="192" font-size="9.5" fill="#b91c1c" text-anchor="middle" font-weight="700">原根端运</text>
<text x="283" y="232" font-size="9.5" fill="#b91c1c" text-anchor="middle" font-weight="600">土下无激素难生根</text>
<text x="283" y="248" font-size="9.5" fill="#1e293b" text-anchor="middle">切口腐烂黑杆！</text>
<rect x="34" y="268" width="328" height="98" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="46" y="288" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="700">叶插两大奇观（多肉/海棠能活，月季单叶变“僵尸叶”）：</text>
<text x="46" y="308" font-size="10" fill="#0f172a" text-anchor="start">• 月季/绿萝单叶无腋芽，偶能生根却抽不出茎芽，成不了新株；</text>
<text x="46" y="327" font-size="10" fill="#0f172a" text-anchor="start">• 金边虎皮兰是“周缘嵌合体”：叶插新芽只从内部纯绿细胞层</text>
<text x="46" y="345" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="700">  冒出，金边100%消失！想保住金边必须连地下根状茎【分株】。</text>
