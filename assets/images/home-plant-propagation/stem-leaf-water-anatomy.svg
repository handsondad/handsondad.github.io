<text x="649" y="252" font-size="9.5" fill="#1e293b" text-anchor="middle">• 亿万根毛把吸水面扩百倍</text>
<rect x="406" y="280" width="320" height="86" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="418" y="300" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">水培苗移栽进土“不死口诀”：</text>
<text x="418" y="320" font-size="10" fill="#0f172a" text-anchor="start" font-weight="600">① 黄金窗口：水根刚长到 2～5 cm 时就下土（别等长满一瓶！）</text>
<text x="418" y="339" font-size="10" fill="#0f172a" text-anchor="start">② 泥浆过渡：头 10 天保持盆土微湿偏润，诱发带根毛的新土根</text>
<text x="418" y="357" font-size="10" fill="#1d6fa5" text-anchor="start" font-weight="600">③ 纯水培秘诀：水位只淹没 1/3～1/2 根系，留上半截在空气呼吸</text>
