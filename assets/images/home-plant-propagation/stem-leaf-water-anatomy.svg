<rect x="0.5" y="0.5" width="759" height="391" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 2 · 插土与泡水的微观真相：茎节“激素单行道”、虎皮兰丢金边与水根“潜水管”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左看为什么枝条插反必死、金边虎皮兰叶插变纯绿；右看水中缺氧 10,000 倍造出的两套根系</text>
<rect x="20" y="64" width="356" height="314" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="75.0" width="246" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="157.0" y="90.0" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="600">土插密码：生长素单行道与“茎节”生死线</text>
<rect x="34" y="106" width="158" height="152" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="113" y="124" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">✓ 顺向正插（带茎节）</text>
