<text x="566" y="125" font-size="10" fill="#475569" text-anchor="start" font-weight="700">① 第1–2天：果胶黏附</text>
<text x="566" y="141" font-size="9.5" fill="#1e293b" text-anchor="start">切口细胞膨胀粘连固定</text>
<text x="566" y="169" font-size="10" fill="#be185d" text-anchor="start" font-weight="700">② 第2–3天：愈伤架桥</text>
<text x="566" y="185" font-size="9.5" fill="#1e293b" text-anchor="start">形成层分裂填满接口缝隙</text>
<text x="566" y="213" font-size="10" fill="#c25014" text-anchor="start" font-weight="700">③ 第3–4天：韧皮部先通</text>
<text x="566" y="229" font-size="9.5" fill="#1e293b" text-anchor="start">接穗往下运糖与生长素！</text>
