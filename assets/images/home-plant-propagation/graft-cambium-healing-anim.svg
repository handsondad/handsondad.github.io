  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes callusGrow {
    0%   { transform: scale(0.08); opacity: 0.15; }
    20%  { transform: scale(0.35); opacity: 0.55; }
    43%  { transform: scale(1.00); opacity: 1.00; }
    100% { transform: scale(1.00); opacity: 1.00; }
  }
  @keyframes phloemBridge {
    0%, 38%  { stroke-dashoffset: 68; opacity: 0.15; }
    57%      { stroke-dashoffset: 0;  opacity: 1.00; }
    100%     { stroke-dashoffset: 0;  opacity: 1.00; }
  }
  @keyframes xylemBridge {
    0%, 78%  { stroke-dashoffset: 68; opacity: 0.15; }
    100%     { stroke-dashoffset: 0;  opacity: 1.00; }
  }
  @keyframes progressCursor {
    0%   { transform: translateX(-276px); }
    100% { transform: translateX(0px); }
  }
  .callus-anim {
    transform-box: fill-box;
    transform-origin: center;
    animation: callusGrow 5.25s linear 0.4s 1 backwards;
  }
  .phloem-anim {
    stroke-dasharray: 68;
    stroke-dashoffset: 0;
    animation: phloemBridge 5.25s linear 0.4s 1 backwards;
  }
  .xylem-anim {
    stroke-dasharray: 68;
    stroke-dashoffset: 0;
    animation: xylemBridge 5.25s linear 0.4s 1 backwards;
  }
  .cursor-anim {
    animation: progressCursor 5.25s linear 0.4s 1 backwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .callus-anim, .phloem-anim, .xylem-anim, .cursor-anim { animation: none !important; }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="393" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 4 · 果树嫁接的“一线生死”与血管重连动画：为什么先通韧皮部、后通木质部？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左看横切面“维管形成层对齐”铁律与单子叶死穴；右按 Melnyk (2015) 实测 7 天时序单次演示愈合</text>
