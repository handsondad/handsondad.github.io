<text x="106" y="302" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">• 双子叶（果树/月季/番茄）：形成层连成整圈环</text>
<text x="106" y="321" font-size="9.8" fill="#0f172a" text-anchor="start">• 单子叶（竹/玉米/棕榈）：维管束满天星散生，</text>
<text x="106" y="338" font-size="9.8" fill="#b91c1c" text-anchor="start" font-weight="700">  成年茎干无形成层环，常规枝接无法愈合！</text>
<text x="106" y="356" font-size="9.2" fill="#64748b" text-anchor="start">  （仅种子萌发胚胎期可显微嫁接，Nature 2021）</text>
