<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">575吨客机跑道滑跑加速动画与速度平方升力曲线及襟翼增升作用图解</title>
<desc id="desc">上方按匀加速比例单次演示客机从静止滑跑至276千米每小时拉杆离地；下方精确绘制放襟翼（升力系数1.85，276千米每小时离地）与光洁机翼（升力系数0.85，需408千米每小时）的二次方升力曲线，标出半速138千米每小时仅得四分之一升力。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#b91c1c"/>
  </marker>
  <marker id="arr-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f766e"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes takeoffRoll {
    0%   { transform: translate(-248.0px, 28px) rotate(10deg); }
    25%  { transform: translate(-232.5px, 28px) rotate(10deg); }
    50%  { transform: translate(-186.0px, 28px) rotate(10deg); }
    75%  { transform: translate(-108.5px, 28px) rotate(8deg); }
    88%  { transform: translate(-37.2px, 26px) rotate(2deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }
  @keyframes dotClimb {
    0%   { transform: translate(-233.6px, 130.2px); }
    25%  { transform: translate(-175.2px, 122.0px); }
    50%  { transform: translate(-116.8px, 97.6px); }
    75%  { transform: translate(-58.4px, 56.9px); }
    100% { transform: translate(0px, 0px); }
  }
  .plane-anim {
    transform-box: fill-box;
    transform-origin: center;
    animation: takeoffRoll 4.6s linear 0.45s 1 backwards;
  }
  .lift-dot-anim {
    animation: dotClimb 4.05s linear 0.45s 1 backwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .plane-anim, .lift-dot-anim { animation: none !important; }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="393" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 3 · 速度翻倍，升力翻 4 倍！575 吨客机跑道加速与襟翼“变形”实算</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上方按匀加速比例演示一次滑跑抬头离地；下方按 L = ½ρv²SC_L 对比放襟翼（276 km/h）与不放襟翼（408 km/h）</text>
