<rect x="490" y="168" width="250" height="214" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="504.0" y="180.0" width="198" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="603.0" y="195.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">三个一眼算穿的飞行现象</text>
<text x="504" y="218" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">① 为什么要长跑道猛加速？</text>
<text x="504" y="236" font-size="10.5" fill="#1e293b" text-anchor="start">L ∝ v²：从 138 加速到 276 km/h，</text>
<text x="504" y="252" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">速度翻 2 倍，升力暴涨 4 倍！</text>
<text x="504" y="278" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">② 高原机场为什么更难起飞？</text>
<text x="504" y="296" font-size="10.5" fill="#1e293b" text-anchor="start">海拔 4411 m 空气密度 ρ 少约 40%，</text>
<text x="504" y="312" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">必须跑得更快或减载才能凑够升力。</text>
<text x="504" y="338" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">③ 猛拉杆抬头为什么反会失速？</text>
<text x="504" y="356" font-size="10.5" fill="#1e293b" text-anchor="start">迎角超 ~15° 边界层成片剥离，</text>
<text x="504" y="372" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="700">翼背低压区垮塌，升力断崖暴跌！</text>
</svg>
