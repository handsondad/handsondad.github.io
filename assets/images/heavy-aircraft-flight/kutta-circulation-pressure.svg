<rect x="0.5" y="0.5" width="759" height="391" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 2 · 空气没约好“后缘重逢”！黏性、起始涡与环流怎样造出 575 吨压差？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">从无黏零升力悖论 → 跑道起步脱落起始涡建立环流 Γ → 翼背吸力占七成、平均压差仅 0.066 个大气压</text>
