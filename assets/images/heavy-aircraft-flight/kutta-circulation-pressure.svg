<rect x="276.0" y="74.0" width="208" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="89.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">② 真实黏性起步：脱落起始涡</text>
