<text x="344" y="110" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="700">附着环流 +Γ (顺时针)</text>
<path d="M 446 138 m -14 0 a 14 14 0 1 0 28 0 a 14 14 0 1 0 -28 0" fill="none" stroke="#c25014" stroke-width="1.6" stroke-dasharray="4,2"/>
