<rect x="520.0" y="74.0" width="208" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="624.0" y="89.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">③ 稳态飞行：环流 + 来流叠加</text>
