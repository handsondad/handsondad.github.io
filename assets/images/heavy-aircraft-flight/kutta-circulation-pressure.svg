<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">机翼黏性起始涡建立环流机制与上下表面压强分布及A380翼载压差图解</title>
<desc id="desc">上方三步对比无黏理想流体后缘倒卷零升力、真实黏性起步脱落逆时针起始涡建立顺时针环流满足库塔条件、以及上表面气流远早于下表面冲过尾缘；下方展示上表面低压吸力贡献约三分之二至四分之三升力，A380平均翼面压差仅6673帕即0.066个大气压。</desc>
