<text x="208" y="256" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">上表面低压“向上吸”（p_上 &lt; p_0）：贡献约 2/3～3/4 升力！</text>
<text x="214" y="366" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">下表面高压“向上托”（p_下 &gt; p_0）：贡献约 1/4～1/3 升力</text>
<rect x="406" y="218" width="318" height="148" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1"/>
<text x="422" y="240" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">空客 A380 机翼压差实算（反直觉真相）：</text>
<text x="422" y="263" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">• 满载总重量：W = 575 t = 5,638,824 N</text>
<text x="422" y="284" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">• 机翼总面积：S = 845 m²（约两座篮球场！）</text>
<text x="422" y="306" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">• 平均上下压强差：Δp = W / S ≈ 6,673 Pa</text>
<text x="422" y="327" font-size="11" fill="#c25014" text-anchor="start" font-weight="700">  仅为海平面大气压（101,325 Pa）的 6.6%！</text>
<text x="422" y="349" font-size="10.5" fill="#1e293b" text-anchor="start" font-weight="600">• 折合指甲盖 1 cm² 上仅差 0.68 N（约 1 颗鸡蛋重）</text>
</svg>
