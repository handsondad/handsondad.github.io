<text x="624" y="170" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">上方气团远早于下方冲过尾缘！</text>
<text x="624" y="184" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="600">绝非“路远赶时间同时到达”</text>
