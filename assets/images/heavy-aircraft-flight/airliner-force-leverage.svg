<svg xmlns="http://www.w3.org/2000/svg" width="760" height="394" viewBox="0 0 760 394" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">575吨客机四力分工与18倍升阻比放大及每秒350吨空气下洗动量账图解</title>
<desc id="desc">左侧对比空客A380四台涡扇最大静推力1.33兆牛不足重力5.64兆牛的四分之一，平飞时靠升阻比18用0.31兆牛推力换取5.64兆牛升力；右侧展示机翼每秒将约350吨迎面空气向下偏转16.1米每秒从而获得5.64兆牛向上反作用力。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#b91c1c"/>
  </marker>
  <marker id="arr-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f766e"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="393" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 1 · 575 吨钢铁大楼的飞行分工：为什么发动机不朝下喷，机翼却能放大 18 倍力？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">以空客 A380 满载起飞重量（575 t ≈ 5.64 MN）与四台涡扇发动机真实推力核算</text>
<rect x="20" y="64" width="348" height="270" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="76.0" width="206" height="22" rx="11.0" fill="#fef2f2" stroke="#b91c1c" stroke-width="1" stroke-opacity="0.35"/>
<text x="137.0" y="91.0" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="600">对比账：硬顶失败 vs 气动杠杆</text>
<rect x="34" y="108" width="320" height="96" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
<text x="48" y="128" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">❌ 设想把 4 台大涡扇全竖过来朝下喷：</text>
<text x="48" y="150" font-size="10.5" fill="#1e293b" text-anchor="start" font-weight="600">4 台满推力</text>
<rect x="114" y="140" width="47" height="12" rx="3" fill="#c25014"/>
<text x="167" y="150" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">1.33 MN（仅够顶 136 吨！）</text>
<text x="48" y="171" font-size="10.5" fill="#1e293b" text-anchor="start" font-weight="600">满载总重力</text>
<rect x="114" y="161" width="200" height="12" rx="3" fill="#b91c1c"/>
<text x="48" y="193" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="600">结论：推力连机身重量的 1/4 都不到，纹丝不动！</text>
<rect x="34" y="214" width="320" height="108" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="48" y="234" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">✓ 真实平飞分工（巡航升阻比 L / D ≈ 18）：</text>
<text x="48" y="255" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">• 发动机往后推气 → 向前推力 T = D ≈ 0.31 MN</text>
<text x="48" y="274" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">• 机翼把迎面风往下导 → 向上升力 L = W = 5.64 MN</text>
<text x="48" y="294" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">• 1 份水平推力撬起 18 份竖直重量（省力斜坡效应）</text>
<text x="48" y="311" font-size="10" fill="#64748b" text-anchor="start">  注意：省力不省功，升力垂直于航迹不做功！</text>
<rect x="384" y="64" width="356" height="270" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="398.0" y="76.0" width="224" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="510.0" y="91.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">动量账：每秒把 350 吨空气往下拨</text>
<path d="M 404 148 C 480 148, 548 150, 610 162 Q 655 172 702 180" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-teal)"/>
<path d="M 404 166 C 480 166, 548 168, 610 184 Q 655 194 702 202" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-teal)"/>
<path d="M 404 186 C 480 186, 548 188, 610 204 Q 655 214 702 222" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-teal)"/>
<text x="406" y="136" font-size="10.5" fill="#0f766e" text-anchor="start" font-weight="600">迎面相对气流 v ≈ 250 m/s</text>
<text x="646" y="228" font-size="10.5" fill="#0f766e" text-anchor="middle" font-weight="700">下洗偏转气流</text>
<text x="646" y="242" font-size="10" fill="#0f766e" text-anchor="middle" font-weight="600">Δv_y ≈ 16.1 m/s ↓</text>
<path d="M 500 174 C 520 156, 566 160, 608 182 C 572 183, 526 181, 500 174 Z" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2.2"/>
<rect x="530" y="186" width="28" height="10" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<line x1="546" y1="166" x2="546" y2="108" stroke="#1d6fa5" stroke-width="2.6" marker-end="url(#arr-blue)"/>
<text x="556" y="116" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">升力 L = 5.64 MN</text>
<line x1="546" y1="184" x2="546" y2="242" stroke="#b91c1c" stroke-width="2.6" marker-end="url(#arr-red)"/>
<text x="546" y="257" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">重力 W = 5.64 MN</text>
<line x1="524" y1="191" x2="462" y2="191" stroke="#c25014" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="458" y="207" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">推力 T = 0.31 MN</text>
<line x1="612" y1="182" x2="668" y2="182" stroke="#475569" stroke-width="2.0" marker-end="url(#arr-muted)"/>
<text x="674" y="178" font-size="10.5" fill="#475569" text-anchor="start" font-weight="700">阻力 D</text>
<rect x="398" y="268" width="328" height="54" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="410" y="288" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">牛顿第二、三定律：L = ṁ_空气 × Δv_y</text>
<text x="410" y="308" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">每秒拨动 350,000 kg 空气 × 下推 16.1 m/s = 5.64 MN！</text>
<rect x="20" y="344" width="720" height="38" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="36" y="368" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">一句话抓本质：飞机不是踩着静止空气不动，而是以 900 km/h 高速不断“划过新空气”——每秒把几百吨空气往下推！</text>
</svg>
