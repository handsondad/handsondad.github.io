    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="389" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 5 · 都在天上飞，谁在“划空气”、谁在“自己喷工质”？四类飞行器全景对照</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">全部遵守牛顿第三定律，但“推谁、往哪推、能不能悬停、抽空空气会怎样”截然不同</text>
<rect x="20" y="64" width="174" height="312" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="20" y="64" width="174" height="58" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="107" y="88" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">① 固定翼大客机</text>
<text x="107" y="109" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">空客 A380 / C919</text>
<line x1="30" y1="136" x2="184" y2="136" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="151" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">靠什么前进</text>
<text x="32" y="169" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">发动机往后推空气</text>
<line x1="30" y1="180" x2="184" y2="180" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="195" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">靠什么抗重力</text>
<text x="32" y="213" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">固定机翼往下导空气</text>
<line x1="30" y1="224" x2="184" y2="224" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="239" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">能否原地悬停</text>
<text x="32" y="257" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="600">❌ 不能悬停（须保持空速）</text>
<line x1="30" y1="268" x2="184" y2="268" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="283" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">巡航经济性</text>
<text x="32" y="301" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">升阻比 L/D ≈ 17～20（极省油）</text>
<line x1="30" y1="312" x2="184" y2="312" stroke="#cbd5e1" stroke-width="1"/>
<text x="32" y="327" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">若抽干空气</text>
<text x="32" y="345" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">升力与推力双双归零，坠落</text>
<rect x="202" y="64" width="174" height="312" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="202" y="64" width="174" height="58" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.2"/>
<text x="289" y="88" font-size="12.5" fill="#0f766e" text-anchor="middle" font-weight="700">② 旋翼机 / 航拍无人机</text>
<text x="289" y="109" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">直升机 / 四旋翼</text>
<line x1="212" y1="136" x2="366" y2="136" stroke="#cbd5e1" stroke-width="1"/>
<text x="214" y="151" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">靠什么前进</text>
<text x="214" y="169" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">旋翼倾斜分力向前推</text>
<line x1="212" y1="180" x2="366" y2="180" stroke="#cbd5e1" stroke-width="1"/>
<text x="214" y="195" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">靠什么抗重力</text>
<text x="214" y="213" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">旋转桨叶高速兜圈下压空气</text>
<line x1="212" y1="224" x2="366" y2="224" stroke="#cbd5e1" stroke-width="1"/>
<text x="214" y="239" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">能否原地悬停</text>
<text x="214" y="257" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="600">✓ 可原地悬停与垂直起降</text>
<line x1="212" y1="268" x2="366" y2="268" stroke="#cbd5e1" stroke-width="1"/>
<text x="214" y="283" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">巡航经济性</text>
<text x="214" y="301" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">等效升阻比 ≈ 4～5（悬停费能）</text>
<line x1="212" y1="312" x2="366" y2="312" stroke="#cbd5e1" stroke-width="1"/>
<text x="214" y="327" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">若抽干空气</text>
<text x="214" y="345" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">旋翼抓不到空气，无法起飞</text>
<rect x="384" y="64" width="174" height="312" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="384" y="64" width="174" height="58" rx="10" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="471" y="88" font-size="12.5" fill="#c25014" text-anchor="middle" font-weight="700">③ 扑翼飞鸟</text>
<text x="471" y="109" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">白鸽 / 信天翁</text>
<line x1="394" y1="136" x2="548" y2="136" stroke="#cbd5e1" stroke-width="1"/>
<text x="396" y="151" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">靠什么前进</text>
<text x="396" y="169" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">翅膀下拍斜向后下方拍气</text>
<line x1="394" y1="180" x2="548" y2="180" stroke="#cbd5e1" stroke-width="1"/>
<text x="396" y="195" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">靠什么抗重力</text>
<text x="396" y="213" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">同一对翅膀包揽升力+推力</text>
<line x1="394" y1="224" x2="548" y2="224" stroke="#cbd5e1" stroke-width="1"/>
<text x="396" y="239" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">能否原地悬停</text>
<text x="396" y="257" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">△ 蜂鸟可长期悬停，大鸟难</text>
<line x1="394" y1="268" x2="548" y2="268" stroke="#cbd5e1" stroke-width="1"/>
<text x="396" y="283" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">巡航经济性</text>
<text x="396" y="301" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">信天翁滑翔 L/D ≈ 20</text>
<line x1="394" y1="312" x2="548" y2="312" stroke="#cbd5e1" stroke-width="1"/>
<text x="396" y="327" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">若抽干空气</text>
<text x="396" y="345" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">无法扑翼，也无法呼吸</text>
<rect x="566" y="64" width="174" height="312" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="566" y="64" width="174" height="58" rx="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="653" y="88" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="700">④ 运载火箭</text>
<text x="653" y="109" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="600">长征五号 / 星舰</text>
<line x1="576" y1="136" x2="730" y2="136" stroke="#cbd5e1" stroke-width="1"/>
<text x="578" y="151" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">靠什么前进</text>
<text x="578" y="169" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">向后/下高速喷自带燃气</text>
<line x1="576" y1="180" x2="730" y2="180" stroke="#cbd5e1" stroke-width="1"/>
<text x="578" y="195" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">靠什么抗重力</text>
<text x="578" y="213" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">靠推力硬顶或入轨自由落体</text>
<line x1="576" y1="224" x2="730" y2="224" stroke="#cbd5e1" stroke-width="1"/>
<text x="578" y="239" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">能否原地悬停</text>
<text x="578" y="257" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="600">✓ 推重比 &gt; 1 可垂直拔起</text>
<line x1="576" y1="268" x2="730" y2="268" stroke="#cbd5e1" stroke-width="1"/>
<text x="578" y="283" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">巡航经济性</text>
<text x="578" y="301" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">几分钟烧光百吨推进剂</text>
<line x1="576" y1="312" x2="730" y2="312" stroke="#cbd5e1" stroke-width="1"/>
<text x="578" y="327" font-size="9.5" fill="#64748b" text-anchor="start" font-weight="700">若抽干空气</text>
<text x="578" y="345" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="600">✓ 真空无阻力，喷管推力更大！</text>
