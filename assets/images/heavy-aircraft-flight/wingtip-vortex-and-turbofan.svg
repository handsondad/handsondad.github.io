</style>
<rect x="0.5" y="0.5" width="759" height="397" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 4 · 坐飞机透过舷窗看到的两个秘密：上翘的翼尖小翼与“大肚子”涡扇发动机</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左看有限机翼如何抑制翼尖涡流省油；右看 10:1 高涵道比涡扇为什么“9 成冷风不进燃烧室”</text>
<rect x="20" y="64" width="352" height="274" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="76.0" width="232" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="150.0" y="91.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">机翼末端：翼尖涡流与诱导阻力</text>
<text x="196" y="114" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">无小翼平直翼尖（正后方视角）</text>
<ellipse cx="196" cy="144" rx="14" ry="14" fill="#f1f5f9" stroke="#475569" stroke-width="1.8"/>
