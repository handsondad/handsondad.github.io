<text x="136" y="160" font-size="9.5" fill="#c25014" text-anchor="middle" font-weight="700">高压 p_下</text>
<path d="M 96 152 C 66 156, 62 126, 92 130 C 106 132, 102 146, 90 142" fill="none" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arr-red)"/>
