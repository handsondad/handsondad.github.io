<text x="196" y="178" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="600">高压气绕翼尖往上翻卷 → 拖出强烈翼尖涡！</text>
<rect x="34" y="190" width="324" height="134" rx="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="196" y="210" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700">✓ 现代客机解法：修长机翼 + 上翘翼尖小翼</text>
<ellipse cx="196" cy="240" rx="12" ry="12" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
<path d="M 78 220 L 90 242 L 184 242" fill="none" stroke="#6d28d9" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 314 220 L 302 242 L 208 242" fill="none" stroke="#6d28d9" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="74" cy="218" r="6" fill="none" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="3,2"/>
<circle cx="318" cy="218" r="6" fill="none" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="3,2"/>
<text x="48" y="270" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">• 诱导阻力 C_Di = C_L² / (π · e · AR)：升力的伴生代价</text>
<text x="48" y="290" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">• 小翼挡住上下串流，全航程实测省油 3%～5%！</text>
<text x="48" y="310" font-size="10" fill="#1e293b" text-anchor="start">• 空管铁律：重型机身后尾流强劲，后机须隔数海里</text>
<rect x="388" y="64" width="352" height="274" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402.0" y="74.0" width="258" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="531.0" y="89.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">翼下巨兽：高涵道比涡扇（大流量慢加速）</text>
<text x="564" y="112" font-size="10.5" fill="#0f766e" text-anchor="middle" font-weight="700">外涵冷空气 (~90% 流量) → 贡献约 80% 推力！</text>
<path d="M 424 120 Q 540 115 664 125 L 664 131 Q 540 122 424 127 Z" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<path d="M 424 196 Q 540 201 664 191 L 664 185 Q 540 194 424 189 Z" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<rect x="440" y="125" width="10" height="66" rx="3" fill="#1d6fa5" stroke="#0f172a" stroke-width="1.0"/>
<path d="M 464 143 L 642 147 L 656 152 L 656 164 L 642 169 L 464 173 Z" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<text x="556" y="162" font-size="9.5" fill="#c25014" text-anchor="middle" font-weight="700">核心燃烧室 + 涡轮 (仅占 ~10% 空气)</text>
<line x1="402" y1="134" x2="704" y2="134" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
<line x1="402" y1="182" x2="704" y2="182" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
<line x1="658" y1="158" x2="718" y2="158" stroke="#b91c1c" stroke-width="2.0" marker-end="url(#arr-red)"/>
<rect x="402" y="208" width="324" height="116" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="416" y="226" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么不造细管猛喷火？推进效率 η_p = 2v₀/(v_e+v₀)：</text>
<text x="416" y="250" font-size="10" fill="#0f172a" text-anchor="start" font-weight="600">高涵道涡扇 (ṁ=975 kg/s, v_e=330)</text>
<rect x="416" y="256" width="240" height="12" rx="3" fill="#18794e"/>
<text x="664" y="266" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">86.2%</text>
<text x="416" y="286" font-size="10" fill="#64748b" text-anchor="start" font-weight="600">老式纯涡喷 (ṁ=195 kg/s, v_e=650)</text>
<rect x="416" y="292" width="155" height="12" rx="3" fill="#c25014"/>
<text x="579" y="302" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">55.6% (白扔大量动能)</text>
<rect x="20" y="348" width="720" height="38" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="36" y="372" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">共同物理哲学：推力/升力 ∝ ṁ·Δv，浪费动能 ∝ ṁ·(Δv)²——“温柔拨动巨量空气”永远比“暴力猛喷少量空气”省油得多！</text>
</svg>
