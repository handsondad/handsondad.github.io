<svg xmlns="http://www.w3.org/2000/svg" width="760" height="546" viewBox="0 0 760 546" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">现代几何深度学习不变性与等变性原理及1773至2026年代数不变量与变换发展史时间轴</title>
<desc id="desc">上半部分对比不变性f(g·x)=f(x)与等变性f(g·x)=g·f(x)，并列出平移群CNN、置换群GNN、三维刚体群AlphaFold与流形规范网络的群论对应；下半部分以六个关键节点串联1773年二次型判别式、1851年不变量命名与矩阵创立、1872年爱尔朗根纲领、1890年希尔伯特基定理、1918年诺特守恒律定理至2026年几何AI的完整历史。</desc>
