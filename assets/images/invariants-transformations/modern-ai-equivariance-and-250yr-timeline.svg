<rect x="0.5" y="0.5" width="759" height="545" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">253 年大回响：从《爱尔朗根纲领》到今日 AI 几何深度学习（1773–2026）</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上半部拆解现代神经网络的“不变性 vs 等变性”；下半部串起代数不变量与变换群跨越两个半世纪的演化主线</text>
<rect x="20" y="66" width="352" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="78.0" width="328" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="196.0" y="93.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 现代 AI 双翼：不变性 vs 等变性（协变）</text>
<rect x="32" y="110" width="328" height="80" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.0"/>
<text x="44" y="131" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">① 不变性 Invariance：f(g · x) = f(x)</text>
<text x="44" y="152" font-size="11.5" fill="#1e293b" text-anchor="start">输入图片平移 / 蛋白质整体旋转 g，网络输出的</text>
<text x="44" y="172" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">“猫咪类别”或“分子总能量 E”绝对不能变！</text>
<rect x="32" y="198" width="328" height="80" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.0"/>
<text x="44" y="219" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">② 等变性 Equivariance：f(g · x) = g · f(x)</text>
<text x="44" y="240" font-size="11.5" fill="#1e293b" text-anchor="start">1851 西尔维斯特“协变量”的现代重生！输入平移或</text>
<text x="44" y="260" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">旋转 g，特征热力图与原子受力向量 F 同步跟着变！</text>
<rect x="388" y="66" width="352" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
