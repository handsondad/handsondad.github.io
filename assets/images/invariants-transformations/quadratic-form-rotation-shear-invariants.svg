<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">二次型椭圆在标准轴、30度旋转轴与等面积错切斜轴下的系数与不变量对比</title>
<desc id="desc">三幅面板绘出完全相同的物理椭圆5x²+y²=1在标准正交网格、逆时针旋转30度正交网格与det M=1水平错切斜网格下的真实坐标线，底部核对表证明迹A+C仅在旋转下守住6而在错切下破功为11，判别式B²-4AC在全部等面积线性变换下恒等于-20。</desc>
