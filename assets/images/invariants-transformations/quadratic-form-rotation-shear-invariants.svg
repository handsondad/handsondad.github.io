<text x="36" y="383" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">候选代数表达式</text>
<text x="245" y="383" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="700">① 标准坐标</text>
<text x="425" y="383" font-size="12" fill="#18794e" text-anchor="middle" font-weight="700">② 正交旋转 SO(2)</text>
<text x="615" y="383" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700">③ 等面积错切 SL(2)</text>
<line x1="28" y1="426" x2="732" y2="426" stroke="#cbd5e1" stroke-width="0.9"/>
<text x="36" y="414" font-size="12" fill="#1e293b" text-anchor="start" font-weight="600">迹 A + C（头尾系数和）</text>
<text x="245" y="414" font-size="12" fill="#0f172a" text-anchor="middle" class="mono">5 + 1 = 6</text>
<text x="425" y="414" font-size="12" fill="#18794e" text-anchor="middle" font-weight="700">4 + 2 = 6  ✓ 守恒</text>
<text x="615" y="414" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">5 + 6 = 11  ✗ 破功!</text>
<text x="36" y="450" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">判别式 Δ = B² − 4AC</text>
<text x="245" y="450" font-size="12" fill="#0f172a" text-anchor="middle" class="mono">0 − 20 = −20</text>
<text x="425" y="450" font-size="12" fill="#18794e" text-anchor="middle" font-weight="700">12 − 32 = −20  ✓ 守恒</text>
<text x="615" y="450" font-size="12" fill="#18794e" text-anchor="middle" font-weight="700">100 − 120 = −20  ✓ 锁死!</text>
<text x="380" y="474" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">通则：任意线性变换 x = Mx′ 下 Δ′ = (det M)²·Δ（权重 w = 2 的相对不变量；det M = ±1 时绝对不变）</text>
