<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二次型不变量实测：同一个椭圆换三套坐标尺，谁破功了、谁纹丝不动？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">椭圆 5x² + y² = 1 实体毫发未动；旋转坐标轴保住 A+C 与 B²−4AC，等面积错切击碎 A+C 却撼不动判别式 −20</text>
