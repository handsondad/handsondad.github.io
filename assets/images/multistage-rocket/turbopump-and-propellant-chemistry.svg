<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">液体火箭发动机涡轮泵再生冷却结构与四大推进剂比冲密度对比图</title>
<desc id="desc">左图剖析高速涡轮泵增压、低温燃料流经喷管夹层吸热的再生冷却及开式与高压补燃闭式循环；右图基于排气速度反比于分子量平方根解释固体、液氧煤油、液氧甲烷与液氧液氢在多级火箭中的分工。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">第二关：每秒狂吞两吨半油的“涡轮泵心脏”，以及一级煤油、二级液氢的绝配</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">3500 K 烈火比钢熔点高近两千度怎么不烧穿？靠零下两百度的燃料先给铜壁“洗冷水澡”！</text>
<rect x="22" y="68" width="370" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="90" r="10.5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="42" y="94" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">1</text>
<text x="60" y="95" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">液体发动机解剖：涡轮泵增压与“再生冷却”</text>
<rect x="36" y="112" width="342" height="188" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="50" y="124" width="66" height="36" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.8"/>
<text x="83" y="146" font-size="10" fill="#1d6fa5" text-anchor="middle" font-weight="700">液氧箱 LOX</text>
<rect x="130" y="124" width="66" height="36" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.8"/>
<text x="163" y="146" font-size="10" fill="#c25014" text-anchor="middle" font-weight="700">低温燃料箱</text>
<rect x="64" y="182" width="120" height="34" rx="14" fill="#ffffff" stroke="#6d28d9" stroke-width="2.2"/>
<text x="124" y="203" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="700">高速涡轮泵 (3万转/分)</text>
<line x1="83.0" y1="160.0" x2="88.0" y2="182.0" stroke="#1d6fa5" stroke-width="2.0" marker-end="url(#arr-blue)"/>
<line x1="163.0" y1="160.0" x2="158.0" y2="182.0" stroke="#c25014" stroke-width="2.0" marker-end="url(#arr-orange)"/>
<path d="M242,154 L294,154 L294,188 L278,208 L308,266 L228,266 L258,208 L242,188 Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.2"/>
<text x="268" y="178" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">3500 K</text>
<text x="268" y="250" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">主燃烧室</text>
<path d="M184,202 L222,258 L248,208 L234,142 L268,142 L268,154" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="4,2"/>
<text x="136" y="246" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="700">再生冷却回路：</text>
<text x="136" y="264" font-size="9.8" fill="#1e293b" text-anchor="middle">冰冷燃料先流经喷管夹层</text>
<text x="136" y="281" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="600">吸热降温后再喷入炉膛！</text>
<rect x="36" y="312" width="342" height="128" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="48" y="333" font-size="11" fill="#6d28d9" text-anchor="start" font-weight="700">涡轮泵动力哪儿来？（决定发动机代差的分水岭）</text>
<text x="48" y="355" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">• 土星五号单台 F-1 涡轮泵高达 5.5 万马力，每秒吞油 2.58 吨！</text>
<text x="48" y="376" font-size="10" fill="#1e293b" text-anchor="start">• 燃气发生器开式循环（F-1/梅林）：抽 ~2% 燃料吹完涡轮直接排掉，</text>
<text x="48" y="394" font-size="10" fill="#64748b" text-anchor="start">  结构轻巧耐造，但损失少许比冲（喷管旁常冒一缕黑烟）；</text>
<text x="48" y="415" font-size="10" fill="#1e293b" text-anchor="start">• 高压补燃闭式循环（长五 YF-100/星舰猛禽）：吹完涡轮的尾气</text>
<text x="48" y="432" font-size="10" fill="#18794e" text-anchor="start" font-weight="700">  100% 压回主燃烧室烧尽，零浪费，压榨出极限比冲！</text>
<rect x="406" y="68" width="332" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="426" cy="90" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="426" y="94" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">2</text>
<text x="444" y="95" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">推进剂分工：为什么一级烧煤油、上面级烧液氢？</text>
<rect x="418" y="112" width="308" height="66" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="572" y="133" font-size="10.2" fill="#b45309" text-anchor="middle" font-weight="700">热力学铁律：排气速度 ve ∝ √(燃烧温度 Tc / 燃气分子量 M)</text>
<text x="572" y="153" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">分子量 M 越轻 → 喷气越快（比冲 Isp 越高，越省油）！</text>
<text x="572" y="170" font-size="9.8" fill="#1e293b" text-anchor="middle">燃料密度 ρ 越高 → 油箱越小巧（起飞迎风阻力与结构死重越小）！</text>
<text x="424" y="204" font-size="10.6" fill="#475569" text-anchor="start" font-weight="700">① 固体推进剂（助推器大力士）</text>
<rect x="424" y="210" width="150" height="12" rx="6" fill="#475569" opacity="0.85"/>
<text x="424" y="237" font-size="9.8" fill="#1e293b" text-anchor="start">真空比冲 ~265 s｜密度 1800 kg/m³（推力猛、难关机）</text>
<text x="424" y="268" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">② 液氧 + 煤油（一级起飞王牌）</text>
<rect x="424" y="274" width="192" height="12" rx="6" fill="#c25014" opacity="0.85"/>
<text x="424" y="301" font-size="9.8" fill="#1e293b" text-anchor="start">真空比冲 ~335 s｜密度 1030 kg/m³（长五助推/猎鹰9）</text>
<text x="424" y="332" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">③ 液氧 + 甲烷（复用火箭新星）</text>
<rect x="424" y="338" width="214" height="12" rx="6" fill="#1d6fa5" opacity="0.85"/>
<text x="424" y="365" font-size="9.8" fill="#1e293b" text-anchor="start">真空比冲 ~370 s｜密度 820 kg/m³（不积碳易洗刷）</text>
<text x="424" y="396" font-size="10.6" fill="#6d28d9" text-anchor="start" font-weight="700">④ 液氧 + 液氢（高空长跑霸主）</text>
<rect x="424" y="402" width="262" height="12" rx="6" fill="#6d28d9" opacity="0.85"/>
<text x="424" y="429" font-size="9.8" fill="#1e293b" text-anchor="start">真空比冲 ~445 s!｜液氢仅 71 kg/m³（极轻但占大肚子）</text>
<rect x="22" y="466" width="716" height="40" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="380" y="491" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">多级火箭的第二个黄金分工：底层用高密度煤油/固推“猛力拔地抗重力”，高层用轻分子液氢“超高比冲冲刺入轨”！</text>
</svg>
