    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">第三关：火箭方程的“指数暴政”——为什么不造一枚单级火箭直飞太空？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">算一笔硬核死账：同样 300 吨起飞、7% 结构死重，单级火箭连空铁皮都飞不上去，切两级立送 8.1 吨卫星！</text>
<rect x="22" y="68" width="434" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="90" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="42" y="94" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="60" y="95" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">300 吨液氧煤油火箭实算对比（ve = 3100 m/s，结构比 ε = 7%）</text>
<line x1="84.0" y1="348.9" x2="424.0" y2="348.9" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="78.0" y="352.9" font-size="9.8" fill="#64748b" text-anchor="end" font-weight="400">6.0</text>
