<text x="78.0" y="278.6" font-size="9.8" fill="#64748b" text-anchor="end" font-weight="400">8.0</text>
<line x1="84.0" y1="226.3" x2="424.0" y2="226.3" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="78.0" y="230.3" font-size="9.8" fill="#b91c1c" text-anchor="end" font-weight="700">9.3</text>
<line x1="84.0" y1="163.1" x2="424.0" y2="163.1" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="78.0" y="167.1" font-size="9.8" fill="#64748b" text-anchor="end" font-weight="400">11.0</text>
<line x1="84.0" y1="386.0" x2="84.0" y2="390.0" stroke="#475569" stroke-width="1.2"/>
<text x="84.0" y="403.0" font-size="9.8" fill="#64748b" text-anchor="middle">0t</text>
