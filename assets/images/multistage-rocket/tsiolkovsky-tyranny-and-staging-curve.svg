<text x="169.0" y="403.0" font-size="9.8" fill="#64748b" text-anchor="middle">5t</text>
<line x1="254.0" y1="386.0" x2="254.0" y2="390.0" stroke="#475569" stroke-width="1.2"/>
<text x="254.0" y="403.0" font-size="9.8" fill="#64748b" text-anchor="middle">10t</text>
<line x1="339.0" y1="386.0" x2="339.0" y2="390.0" stroke="#475569" stroke-width="1.2"/>
<text x="339.0" y="403.0" font-size="9.8" fill="#64748b" text-anchor="middle">15t</text>
<line x1="424.0" y1="386.0" x2="424.0" y2="390.0" stroke="#475569" stroke-width="1.2"/>
<text x="424.0" y="403.0" font-size="9.8" fill="#64748b" text-anchor="middle">20t</text>
<line x1="84.0" y1="126.0" x2="84.0" y2="386.0" stroke="#475569" stroke-width="1.5"/>
<line x1="84.0" y1="386.0" x2="424.0" y2="386.0" stroke="#475569" stroke-width="1.5"/>
<text x="42" y="256" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">总 Δv</text>
<text x="42" y="272" font-size="9.5" fill="#64748b" text-anchor="middle">(km/s)</text>
<text x="254" y="422" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">送入近地轨道的卫星有效载荷质量 m_pay（吨）</text>
<text x="436" y="219.3" font-size="9.8" fill="#b91c1c" text-anchor="end" font-weight="700" class="halo">入轨生死线 Δv = 9.3 km/s</text>
