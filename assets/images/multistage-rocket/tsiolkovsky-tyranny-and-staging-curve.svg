<circle cx="84.0" cy="265.5" r="5" fill="#b91c1c"/>
<text x="94.0" y="279.5" font-size="9.8" fill="#475569" text-anchor="start" font-weight="700" class="halo">单级极限仅 8.24 km/s（0吨卫星也坠毁！）</text>
<circle cx="222.3" cy="226.3" r="5.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.5"/>
<text x="216.3" y="246.3" font-size="10" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">两级入轨：8.1 吨！</text>
<circle cx="251.6" cy="226.3" r="5.5" fill="#18794e" stroke="#ffffff" stroke-width="1.5"/>
<text x="251.6" y="215.3" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">三级：9.9 吨</text>
<rect x="470" y="68" width="268" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="490" cy="90" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="490" y="94" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="508" y="95" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">“燃料背燃料”恶性循环与分级甜点</text>
<rect x="482" y="112" width="244" height="158" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="494" y="133" font-size="11" fill="#c25014" text-anchor="start" font-weight="700">单级火箭死在哪儿？</text>
<text x="494" y="155" font-size="10" fill="#1e293b" text-anchor="start">• 要装 279 吨燃料，必须造一个承重近</text>
<text x="494" y="174" font-size="10" fill="#1e293b" text-anchor="start">  300 吨的巨型金属桶（干重 ~20 吨）；</text>
<text x="494" y="194" font-size="10" fill="#1e293b" text-anchor="start">• 到了最后 10 秒，桶早空了，发动机却还</text>
<text x="494" y="213" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="700">  在拼命给这 20 吨废铁皮加速到 8 km/s！</text>
<text x="494" y="235" font-size="10" fill="#1e293b" text-anchor="start">• 多级精髓：油烧光瞬间把十几吨空铁桶</text>
<text x="494" y="254" font-size="10" fill="#18794e" text-anchor="start" font-weight="700">  一脚踹掉，总速度变成各级 Δv 直接相加！</text>
<rect x="482" y="282" width="244" height="158" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="494" y="303" font-size="11" fill="#6d28d9" text-anchor="start" font-weight="700">那切成 10 级岂不是更省油？</text>
<text x="494" y="325" font-size="10" fill="#1e293b" text-anchor="start">• 边际收益骤降：从 1 级变 2 级是从 0 到</text>
<text x="494" y="344" font-size="10" fill="#1e293b" text-anchor="start">  8.1 吨的质变；3 级变 4 级仅多几百公斤；</text>
<text x="494" y="365" font-size="10" fill="#1e293b" text-anchor="start">• 级间代价反噬：每多一级就多一套独立</text>
<text x="494" y="384" font-size="10" fill="#1e293b" text-anchor="start">  发动机、涡轮泵、级间环和爆炸螺栓死重，</text>
<text x="494" y="403" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="600">  高空点火与分离故障率还会成倍叠加！</text>
<text x="494" y="424" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700">→ 全球运载火箭黄金甜点：2 级 ～ 3.5 级！</text>
<rect x="22" y="466" width="716" height="40" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="380" y="491" font-size="11.3" fill="#0f172a" text-anchor="middle" font-weight="600">齐奥尔科夫斯基名言：“地球是人类的摇篮，但没有一枚单级化学火箭能带人类离开摇篮——唯有靠多级火箭列车！”</text>
</svg>
