<text x="44" y="412" font-size="10.2" fill="#64748b" text-anchor="start">1974 年 Racker 与 Stoeckenius 将细菌紫膜质子泵与牛 ATP 合酶装入人造脂泡，</text>
<text x="44" y="428" font-size="10.2" fill="#64748b" text-anchor="start">在无呼吸链条件下靠光照造出 ATP，一锤定音证实 Mitchell 化学渗透学说！</text>
