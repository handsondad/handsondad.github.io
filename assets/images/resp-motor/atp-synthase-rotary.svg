<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">F0F1-ATP合酶纳米分子水轮机纵切结构与120度步进催化及UCP1产热旁路图</title>
<desc id="desc">左图展示线粒体膜间隙质子顺电化学梯度经a亚基半通道驱动F0转子c环与中央不对称γ轴旋转，在外周静子柄b2固定下顶开F1头α3β3亚基每圈合成3颗ATP；右上俯视图展示Boyer三态循环与1997年荧光肌动蛋白丝120度步进实拍；右下展示棕色脂肪UCP1质子分流非战栗产热机制。</desc>
