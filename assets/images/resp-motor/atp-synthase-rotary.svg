<text x="470" y="350" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">御寒旁路：H⁺ → 解偶联蛋白 UCP1（产热素）</text>
<text x="470" y="366" font-size="10.4" fill="#b91c1c" text-anchor="start" font-weight="700">          绕开合酶直返基质 → 100% 化作体温！</text>
<text x="458" y="392" font-size="10.2" fill="#1e293b" text-anchor="start">• 新生婴儿不会打寒颤，颈背部富含棕色脂肪保命；</text>
<text x="458" y="410" font-size="10.2" fill="#1e293b" text-anchor="start">• 冬眠熊/旱獭靠 UCP1 非战栗产热苏醒；因富含含铁</text>
<text x="458" y="427" font-size="10.2" fill="#64748b" text-anchor="start">  细胞色素的密集线粒体，组织肉眼呈棕褐色。</text>
