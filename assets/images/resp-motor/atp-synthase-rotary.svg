<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">自然界最小的旋转水轮机：F₀F₁-ATP 合酶的 120° 步进催化与棕色脂肪产热旁路</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：跨膜 H⁺ 驱动 c 环与 γ 轴旋转；右上：Boyer 结合变化机制与 1997 荧光实拍；右下：UCP1 御寒分流</text>
