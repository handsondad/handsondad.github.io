<text x="578" y="172" font-size="10.2" fill="#be123c" text-anchor="start" font-weight="700">1997 吉田贤右 / 野地博行：</text>
<text x="578" y="189" font-size="9.9" fill="#1e293b" text-anchor="start">在 γ 轴粘上 ~1 μm 荧光</text>
