<rect x="0.5" y="0.5" width="759" height="431" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">从 10 秒飞人到 2 小时马拉松：人体三大供能系统的平滑接力曲线</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">实测表明三套系统在起跑第 1 秒便同时启动，并非“先耗尽前一个才开后一个”；约 75 秒处有氧追平无氧</text>
<rect x="20" y="62" width="720" height="250" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 全力运动持续时间 vs 瞬时供能相对占比（%，对数时间轴 1 秒 → 2 小时，据 Gastin 2001 模型）</text>
