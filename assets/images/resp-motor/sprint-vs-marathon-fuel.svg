<line x1="380.4" y1="112.0" x2="380.4" y2="266.0" stroke="#18794e" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="380.4" cy="189.0" r="5.2" fill="#18794e" stroke="#ffffff" stroke-width="1.5"/>
<text x="388.4" y="182.0" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700" class="halo">≈74s 交叉点：有氧 50% = 无氧合 50%</text>
<text x="125.2" y="135.1" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700" class="halo">① 磷酸原 (ATP-PCr，实线)</text>
<text x="309.6" y="158.2" font-size="10.8" fill="#6d28d9" text-anchor="middle" font-weight="700" class="halo">② 无氧糖酵解 (虚线)</text>
<text x="561.2" y="125.9" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">③ 有氧氧化磷酸化 (实线，长跑 &gt;98%)</text>
<text x="36" y="300" font-size="10.2" fill="#64748b" text-anchor="start">注：纵轴为各时刻瞬时功率占比（三曲线之和恒为 100%）；个体训练水平与配速会使交叉点在 60–90 秒间微移。</text>
<rect x="20" y="324" width="228" height="96" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="32" y="344" font-size="11.0" fill="#c25014" text-anchor="start" font-weight="700">① 磷酸原系统（0–10 秒霸主）</text>
<text x="32" y="365" font-size="10.3" fill="#1e293b" text-anchor="start">磷酸肌酸一步把磷酸基交给 ADP，</text>
<text x="32" y="383" font-size="10.3" fill="#1e293b" text-anchor="start">无需氧气、功率最高，但库存仅够</text>
<text x="32" y="401" font-size="10.3" fill="#1e293b" text-anchor="start">博尔特百米冲刺或举重抓举数秒。</text>
<rect x="266" y="324" width="228" height="96" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="278" y="344" font-size="11.0" fill="#6d28d9" text-anchor="start" font-weight="700">② 无氧糖酵解（10–90 秒峰值）</text>
<text x="278" y="365" font-size="10.3" fill="#1e293b" text-anchor="start">每分子葡萄糖快产 2 ATP，靠丙酮</text>
<text x="278" y="383" font-size="10.3" fill="#1e293b" text-anchor="start">酸变乳酸再生 NAD⁺；乳酸可被心肝</text>
<text x="278" y="401" font-size="10.3" fill="#1e293b" text-anchor="start">回收利用，并非次日肌肉酸痛元凶。</text>
<rect x="512" y="324" width="228" height="96" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="524" y="344" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700">③ 有氧呼吸（&gt;75 秒绝对主力）</text>
<text x="524" y="365" font-size="10.3" fill="#1e293b" text-anchor="start">线粒体动用糖原与脂肪彻底氧化，</text>
<text x="524" y="383" font-size="10.3" fill="#1e293b" text-anchor="start">单分子糖产 30–32 ATP、脂肪更高；</text>
<text x="524" y="401" font-size="10.3" fill="#1e293b" text-anchor="start">功率受摄氧量限制，却能续航数小时。</text>
</svg>
