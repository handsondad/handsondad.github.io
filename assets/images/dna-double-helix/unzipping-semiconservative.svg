<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">DNA双螺旋互补解旋半保留复制机制与1958年梅塞尔森-斯塔尔同位素超速离心验证图解</title>
<desc id="desc">左图动画演示亲代双链解旋后各作模板合成互补新链；右图按真实氯化铯浮力密度（¹⁵N/¹⁵N 1.724、¹⁵N/¹⁴N 1.717、¹⁴N/¹⁴N 1.71 g/cm³）绘制第0、1、2代离心条带，直观排除全保留与弥散假说。</desc>
