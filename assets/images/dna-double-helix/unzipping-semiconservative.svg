<text x="115" y="364" font-size="9.0" fill="#0f172a" text-anchor="middle" font-weight="700">子代 DNA ①（1旧蓝+1新橙）</text>
<text x="293" y="364" font-size="9.0" fill="#0f172a" text-anchor="middle" font-weight="700">子代 DNA ②（1新橙+1旧蓝）</text>
<text x="204" y="388" font-size="9.2" fill="#18794e" text-anchor="middle" font-weight="700">两份拷贝序列完全一致：A-T / G-C / T-A / C-G ···</text>
<text x="204" y="408" font-size="9.2" fill="#0f172a" text-anchor="middle" font-weight="600">结构即功能：看见双螺旋的一瞬，遗传之谜自动解开！</text>
<text x="204" y="426" font-size="8.7" fill="#64748b" text-anchor="middle">（注：真实细胞中由解旋酶与 DNA 聚合酶沿新链 5&#x27;→3&#x27; 合成）</text>
<rect x="402" y="62" width="338" height="378" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="416" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 梅塞尔森-斯塔尔实验（1958）：给新旧链称重！</text>
<text x="416" y="103" font-size="9.0" fill="#1e293b" text-anchor="start">用重氮 ¹⁵N 喂养大肠杆菌再换轻氮 ¹⁴N，超速离心看浮力条带：</text>
<text x="462.0" y="126" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="700">第 0 代</text>
<text x="462.0" y="141" font-size="8.6" fill="#64748b" text-anchor="middle">纯 ¹⁵N 亲代</text>
