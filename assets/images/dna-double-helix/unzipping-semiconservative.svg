<rect x="416" y="320" width="310" height="108" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.0"/>
<text x="426" y="340" font-size="9.4" fill="#18794e" text-anchor="start" font-weight="700">两代离心条带，当场判死另外两种假说：</text>
<text x="426" y="359" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="600">• 第 1 代只出唯一居中带（1.717）→ 排除【全保留复制】</text>
<text x="426" y="376" font-size="8.9" fill="#1e293b" text-anchor="start">  （若是全保留，第 1 代就会直接分裂成一重一轻两条带）；</text>
<text x="426" y="394" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="600">• 第 2 代分出 1:1 轻带与杂合带 → 排除【弥散碎块复制】，</text>
<text x="426" y="412" font-size="8.9" fill="#18794e" text-anchor="start" font-weight="700">  被誉为“生物学史上最美丽的实验”，双螺旋预言彻底封神！</text>
