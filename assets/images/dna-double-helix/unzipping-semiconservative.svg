<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">科学史上最凡尔赛的一句话：拉链一开一分为二，与 1958 年同位素铁证</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">“我们并非没有注意到，我们所假设的特定配对立即提示了遗传物质的一种可能复制机制”——沃森 &amp; 克里克 (1953)</text>
