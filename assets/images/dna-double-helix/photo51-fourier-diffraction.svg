<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">富兰克林第51号X射线衍射照片的四项定量几何标尺与第4层线相消原理图</title>
<desc id="desc">左图展示高湿B-DNA纤维（螺距34Å、碱基层距3.4Å、双链轴向错位3/8螺距形成12Å小沟与22Å大沟）受1.54Å X射线照射及相位丢失问题；右图按贝塞尔函数与双链干涉因子4cos²(3πl/8)精确重现Photo 51的X形斑点、l=10极轴强弧及第4层线完全相消。</desc>
