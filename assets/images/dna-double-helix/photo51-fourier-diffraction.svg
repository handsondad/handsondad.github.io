<text x="400" y="379" font-size="9.5" fill="#1d6fa5" text-anchor="start" font-weight="700">克里克贝塞尔衍射公式（1952）一锤定音：</text>
<text x="400" y="397" font-size="9.1" fill="#0f172a" text-anchor="start" class="mono">• 第 l 层线振幅 ∝ J_l(2πr₀R)·[1 + e^(i·2πl·3/8)]；</text>
<text x="400" y="415" font-size="9.1" fill="#dc2626" text-anchor="start" font-weight="700">• 当 l = 4 时相位差恰好为 3π（1 + e^(i3π) = 0），完全相消！</text>
<text x="400" y="433" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="600">• 再加单斜 C2 晶胞二阶对称轴 → 两条链必然【反向平行】！</text>
