<text x="42" y="386" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="700">⚠️ 为什么“照片 ≠ 三维模型”（晶体学相位丢失问题）？</text>
<text x="42" y="404" font-size="9.2" fill="#1e293b" text-anchor="start">• 底片只记录波强 I ∝ |F(q)|²，丢掉了电磁波的【相位 φ】；</text>
<text x="42" y="421" font-size="9.2" fill="#1e293b" text-anchor="start">• 无法像普通相机那样直接逆变换成像，必须靠贝塞尔函数</text>
<text x="42" y="437" font-size="9.2" fill="#1d6fa5" text-anchor="start" font-weight="600">  理论 + 立体化学搭模型正演核对，才能锁死原子坐标！</text>
