<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">“第 51 号照片”到底怎么读？—— 从一束 X 射线衍射斑反推双螺旋的四把标尺</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">照片不是分子影子，而是电子密度的傅里叶衍射强度 |F(q)|²：倒易空间里“越宽对应越窄、缺第 4 层藏着双链错位”</text>
