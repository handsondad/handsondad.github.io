<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" viewBox="0 0 760 466" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">从富兰克林回形针控湿相机到螺旋正交X衍射及单双螺旋第4层线干涉判据三步图解</title>
<desc id="desc">第1步展示富兰克林与高斯林将&lt;1mm DNA纤维绷在回形针上并通92%湿度氢气曝光62小时；第2步展示螺旋侧视前后斜杠（/与\）如何各自沿90°垂直方向衍射叠成X十字；第3步对比单螺旋（1-5层全亮）、1/2错位双链（1,3,5层全灭）与真实3/8错位B-DNA双螺旋（唯独第4层相差1.5波长相消归零）。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="465" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">X 射线衍射究竟怎么对应出双螺旋？—— 从富兰克林回形针相机到“X 十字 + 第 4 层隐身”三步拆解</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先拆单根弹簧为何打出交叉 X，再对比“单螺旋 / 对半双螺旋 / 3/8 错位双螺旋”—— 一眼看穿双链密码！</text>
<rect x="20" y="64" width="232" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="78.0" width="208" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="136.0" y="93.0" font-size="9.6" fill="#1d6fa5" text-anchor="middle" font-weight="600">第 1 步 · 富兰克林的回形针控湿相机</text>
<rect x="32" y="110" width="208" height="156" rx="8" fill="#f8fafc" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="136" y="127" font-size="8.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">密封氢气控湿室（相对湿度 92%）</text>
<rect x="38" y="176" width="42" height="14" rx="2" fill="#475569"/>
<line x1="80.0" y1="183.0" x2="128.0" y2="183.0" stroke="#c25014" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="62" y="170" font-size="8.3" fill="#475569" text-anchor="middle" font-weight="700">微焦点准直管</text>
<text x="62" y="204" font-size="8.4" fill="#c25014" text-anchor="middle" font-weight="700">X射线束</text>
<rect x="114" y="236" width="40" height="18" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.2"/>
<text x="134" y="248" font-size="8.1" fill="#c25014" text-anchor="middle" font-weight="700">软木塞</text>
<path d="M 122,236 L 122,144 Q 134,136 146,144 L 146,236" fill="none" stroke="#64748b" stroke-width="2.0"/>
<line x1="134.0" y1="146.0" x2="134.0" y2="232.0" stroke="#1d6fa5" stroke-width="2.8"/>
<text x="166" y="156" font-size="8.3" fill="#1d6fa5" text-anchor="start" font-weight="700">DNA细丝</text>
<line x1="136.0" y1="183.0" x2="214.0" y2="148.0" stroke="#c25014" stroke-width="1.3" stroke-dasharray="3 2"/>
<line x1="136.0" y1="183.0" x2="214.0" y2="218.0" stroke="#c25014" stroke-width="1.3" stroke-dasharray="3 2"/>
<rect x="214" y="138" width="8" height="92" rx="2" fill="#1e293b"/>
<text x="206" y="250" font-size="8.3" fill="#0f172a" text-anchor="end" font-weight="700">感光底片</text>
<text x="32" y="286" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="600">• 样本玄机：把几十万根同向排列的钠盐 DNA</text>
<text x="32" y="303" font-size="9.0" fill="#1e293b" text-anchor="start">  分子拉成 &lt;1 mm 细丝，绷在弯折回形针上；</text>
<text x="32" y="322" font-size="9.1" fill="#1d6fa5" text-anchor="start" font-weight="700">• 为什么要通湿润氢气？一来让 DNA 吸饱水保</text>
<text x="32" y="339" font-size="9.0" fill="#1e293b" text-anchor="start">  持活细胞里的【B 型湿态】，二来氢气原子极轻，</text>
<text x="32" y="356" font-size="9.0" fill="#1e293b" text-anchor="start">  不会像空气那样乱散射 X 射线弄脏底片！</text>
<text x="32" y="375" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="600">• 苦熬 62 小时（1952.05.02–06）：富兰克林与</text>
<text x="32" y="392" font-size="9.0" fill="#1e293b" text-anchor="start">  博士生高斯林终于冲印出清晰绝伦的 Photo 51</text>
<text x="32" y="410" font-size="8.7" fill="#64748b" text-anchor="start">  （早在 1938 年女先驱弗洛伦斯·贝尔已拍到首张</text>
<text x="32" y="426" font-size="8.7" fill="#64748b" text-anchor="start">  模糊 DNA 纤维衍射图，初测出 ~3.4 Å 层距）。</text>
<rect x="264" y="64" width="232" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="276.0" y="78.0" width="208" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="93.0" font-size="9.5" fill="#6d28d9" text-anchor="middle" font-weight="600">第 2 步 · 螺旋侧看是“之”字 → 正交打出 X</text>
<rect x="276" y="110" width="208" height="156" rx="8" fill="#faf5ff" stroke="#6d28d9" stroke-width="1.1"/>
<line x1="296.0" y1="152.0" x2="340.0" y2="134.0" stroke="#1d6fa5" stroke-width="2.8"/>
<line x1="296.0" y1="152.0" x2="340.0" y2="170.0" stroke="#c25014" stroke-width="2.4" stroke-dasharray="4 2"/>
<line x1="296.0" y1="188.0" x2="340.0" y2="170.0" stroke="#1d6fa5" stroke-width="2.8"/>
<line x1="296.0" y1="188.0" x2="340.0" y2="206.0" stroke="#c25014" stroke-width="2.4" stroke-dasharray="4 2"/>
<line x1="296.0" y1="224.0" x2="340.0" y2="206.0" stroke="#1d6fa5" stroke-width="2.8"/>
<line x1="296.0" y1="224.0" x2="340.0" y2="242.0" stroke="#c25014" stroke-width="2.4" stroke-dasharray="4 2"/>
<text x="318" y="126" font-size="8.6" fill="#0f172a" text-anchor="middle" font-weight="700">螺旋侧视投影</text>
<text x="318" y="257" font-size="8.4" fill="#1e293b" text-anchor="middle" font-weight="600">蓝 / 前壁 + 橙 \ 后壁</text>
<line x1="348.0" y1="188.0" x2="372.0" y2="188.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr-purple)"/>
<circle cx="426.0" cy="188.0" r="42" fill="#ffffff" stroke="#475569" stroke-width="1.1"/>
<circle cx="402.0" cy="160.0" r="3.3" fill="#1d6fa5"/>
<circle cx="414.0" cy="174.0" r="3.3" fill="#1d6fa5"/>
<circle cx="438.0" cy="202.0" r="3.3" fill="#1d6fa5"/>
<circle cx="450.0" cy="216.0" r="3.3" fill="#1d6fa5"/>
<circle cx="402.0" cy="216.0" r="3.3" fill="#c25014"/>
<circle cx="414.0" cy="202.0" r="3.3" fill="#c25014"/>
<circle cx="438.0" cy="174.0" r="3.3" fill="#c25014"/>
<circle cx="450.0" cy="160.0" r="3.3" fill="#c25014"/>
<line x1="399.0" y1="157.0" x2="453.0" y2="219.0" stroke="#1d6fa5" stroke-width="1.0" stroke-dasharray="2 2"/>
<line x1="399.0" y1="219.0" x2="453.0" y2="157.0" stroke="#c25014" stroke-width="1.0" stroke-dasharray="2 2"/>
<text x="426.0" y="126" font-size="8.5" fill="#6d28d9" text-anchor="middle" font-weight="700">衍射垂直于斜杠!</text>
<text x="426.0" y="257" font-size="8.5" fill="#6d28d9" text-anchor="middle" font-weight="700">蓝 \ + 橙 / = 十字 X</text>
<text x="276" y="286" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="700">• 为什么螺旋不打出圆圈，反而打出【X 字】？</text>
<text x="276" y="304" font-size="9.0" fill="#1e293b" text-anchor="start">  从侧面平视一根弹簧，前半圈斜向右上（/），</text>
<text x="276" y="321" font-size="9.0" fill="#1e293b" text-anchor="start">  后半圈斜向右下（\），拼成周期性“之”字斜栅；</text>
<text x="276" y="340" font-size="9.1" fill="#6d28d9" text-anchor="start" font-weight="700">• 波动光学铁律：一排平行斜缝的衍射亮斑，必</text>
<text x="276" y="357" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="600">  然沿着【与狭缝垂直（90°）】的方向排成直线！</text>
<text x="276" y="376" font-size="9.0" fill="#1d6fa5" text-anchor="start" font-weight="600">• 于是前半圈（/）打出左上→右下（\）斑点串，</text>
<text x="276" y="393" font-size="9.0" fill="#c25014" text-anchor="start" font-weight="600">  后半圈（\）打出左下→右上（/）斑点串——两</text>
<text x="276" y="410" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="700">  束斜线在底片正中叠加，就是螺旋独有的 X 指纹！</text>
<text x="276" y="428" font-size="8.6" fill="#64748b" text-anchor="start">  （在家拿激光笔照圆珠笔弹簧，墙上也会现出 X！）</text>
<rect x="508" y="64" width="232" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="520.0" y="78.0" width="208" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="624.0" y="93.0" font-size="9.6" fill="#18794e" text-anchor="middle" font-weight="600">第 3 步 · 单链还是双链？第 4 层破案！</text>
<rect x="520" y="110" width="208" height="156" rx="8" fill="#f0fdf4" stroke="#18794e" stroke-width="1.1"/>
<text x="566.0" y="126" font-size="8.4" fill="#475569" text-anchor="middle" font-weight="700">单根螺旋</text>
<text x="528" y="148.5" font-size="8.2" fill="#0f172a" text-anchor="start" font-weight="700" class="mono">l=5</text>
<rect x="554.0" y="141.0" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.53"/>
<text x="528" y="170.0" font-size="8.2" fill="#0f172a" text-anchor="start" font-weight="700" class="mono">l=4</text>
<rect x="554.0" y="162.5" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.53"/>
<text x="528" y="191.5" font-size="8.2" fill="#0f172a" text-anchor="start" font-weight="700" class="mono">l=3</text>
<rect x="554.0" y="184.0" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.53"/>
<text x="528" y="213.0" font-size="8.2" fill="#0f172a" text-anchor="start" font-weight="700" class="mono">l=2</text>
<rect x="554.0" y="205.5" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.53"/>
<text x="528" y="234.5" font-size="8.2" fill="#0f172a" text-anchor="start" font-weight="700" class="mono">l=1</text>
<rect x="554.0" y="227.0" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.53"/>
<text x="628.0" y="126" font-size="8.4" fill="#c25014" text-anchor="middle" font-weight="700">对半双链</text>
<circle cx="628.0" cy="145.0" r="5.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="2 2"/>
<text x="628.0" y="148.0" font-size="8.3" fill="#dc2626" text-anchor="middle" font-weight="700">×</text>
<rect x="616.0" y="162.5" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.95"/>
<circle cx="628.0" cy="188.0" r="5.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="2 2"/>
<text x="628.0" y="191.0" font-size="8.3" fill="#dc2626" text-anchor="middle" font-weight="700">×</text>
<rect x="616.0" y="205.5" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.95"/>
<circle cx="628.0" cy="231.0" r="5.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="2 2"/>
<text x="628.0" y="234.0" font-size="8.3" fill="#dc2626" text-anchor="middle" font-weight="700">×</text>
<text x="690.0" y="126" font-size="8.4" fill="#18794e" text-anchor="middle" font-weight="700">真实B型</text>
<rect x="678.0" y="141.0" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.95"/>
<circle cx="690.0" cy="166.5" r="5.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="2 2"/>
<text x="690.0" y="169.5" font-size="8.3" fill="#dc2626" text-anchor="middle" font-weight="700">×</text>
<rect x="678.0" y="184.0" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.95"/>
<rect x="678.0" y="205.5" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.71"/>
<rect x="678.0" y="227.0" width="24" height="8" rx="3" fill="#0f172a" fill-opacity="0.46"/>
<text x="624" y="257" font-size="8.6" fill="#dc2626" text-anchor="middle" font-weight="700">唯独【错位 3/8 螺距】精准熄灭 l=4！</text>
<text x="520" y="286" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="700">• 光有 X 字，怎么知道是【两条链】缠在一起？</text>
<text x="520" y="304" font-size="9.0" fill="#1e293b" text-anchor="start">  1) 若只有 1 根螺旋：第 1～5 层斑点【全亮】；</text>
<text x="520" y="322" font-size="9.0" fill="#1e293b" text-anchor="start">  2) 若 2 根链正对半错开 1/2 螺距：第 1、3、5</text>
<text x="520" y="339" font-size="9.0" fill="#c25014" text-anchor="start" font-weight="600">     奇数层会全部波峰撞波谷熄灭（不符照片！）；</text>
<text x="520" y="358" font-size="9.1" fill="#dc2626" text-anchor="start" font-weight="700">  3) Photo 51 偏偏只缺【第 4 层（l=4）】！</text>
<text x="520" y="375" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="600">     富兰克林独立算出：第二条同轴链沿轴错开了</text>
<text x="520" y="392" font-size="9.0" fill="#1e293b" text-anchor="start">     3/8 螺距（在 l=4 处恰相差 4×3/8 = 1.5 个波</text>
<text x="520" y="409" font-size="9.0" fill="#1e293b" text-anchor="start">     长，完美相消归零！），顺带把表面切出一窄</text>
<text x="520" y="426" font-size="9.0" fill="#18794e" text-anchor="start" font-weight="700">     （3/8P 小沟）一宽（5/8P 大沟）的不对称双沟！</text>
</svg>
