<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">鲍林内骨外碱三螺旋错误模型与沃森克里克外骨内碱反向平行B-DNA横截面对比图</title>
<desc id="desc">左图展示鲍林1953年1月三螺旋模型将三串在pH=7下带负电的磷酸基团塞入轴心引发强烈库仑排斥且碱基朝外无法复制；右图展示正确B-DNA横截面：负电磷酸骨架朝外水合、疏水碱基配对居中，且糖苷键偏心张角造出22Å大沟与12Å小沟。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="459" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">连拿两次诺奖的鲍林为什么翻了车？——“反穿毛衣”三螺旋死胡同 vs 反向平行双螺旋</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">把带负电的磷酸骨架塞进圆心，既违背酸碱电离常识，也彻底堵死了遗传密码自我复制的可能</text>
<rect x="20" y="62" width="348" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="76.0" width="318" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="193.0" y="91.0" font-size="9.8" fill="#dc2626" text-anchor="middle" font-weight="600">错误路线 · 鲍林“内骨外碱”三螺旋 (1953.01)</text>
<circle cx="194.0" cy="190.0" r="74" fill="#fff1f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="194.0" y1="171.0" x2="194.0" y2="134.0" stroke="#475569" stroke-width="2.2"/>
<rect x="179.0" y="125.0" width="30" height="18" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.3"/>
<text x="194.0" y="137.5" font-size="8.6" fill="#1e293b" text-anchor="middle" font-weight="700">碱基</text>
<circle cx="194.0" cy="171.0" r="12.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"/>
<text x="194.0" y="174.5" font-size="8.5" fill="#ffffff" text-anchor="middle" font-weight="700">PO₄⁻</text>
<line x1="210.5" y1="199.5" x2="242.5" y2="218.0" stroke="#475569" stroke-width="2.2"/>
<rect x="227.5" y="209.0" width="30" height="18" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.3"/>
<text x="242.5" y="221.5" font-size="8.6" fill="#1e293b" text-anchor="middle" font-weight="700">碱基</text>
<circle cx="210.5" cy="199.5" r="12.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"/>
<text x="210.5" y="203.0" font-size="8.5" fill="#ffffff" text-anchor="middle" font-weight="700">PO₄⁻</text>
<line x1="177.5" y1="199.5" x2="145.5" y2="218.0" stroke="#475569" stroke-width="2.2"/>
<rect x="130.5" y="209.0" width="30" height="18" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.3"/>
<text x="145.5" y="221.5" font-size="8.6" fill="#1e293b" text-anchor="middle" font-weight="700">碱基</text>
<circle cx="177.5" cy="199.5" r="12.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.4"/>
<text x="177.5" y="203.0" font-size="8.5" fill="#ffffff" text-anchor="middle" font-weight="700">PO₄⁻</text>
<text x="194.0" y="194.0" font-size="12.0" fill="#fef08a" text-anchor="middle">⚡</text>
<text x="86" y="134" font-size="9.0" fill="#475569" text-anchor="middle" font-weight="700">碱基朝外乱伸</text>
<text x="302" y="134" font-size="9.0" fill="#dc2626" text-anchor="middle" font-weight="700">无法互补配对!</text>
<text x="194.0" y="280" font-size="9.3" fill="#dc2626" text-anchor="middle" font-weight="700">轴心挤塞 3 串负电磷酸根 → 剧烈库仑排斥炸裂！</text>
<rect x="34" y="294" width="320" height="140" rx="7" fill="#fff1f2" stroke="#dc2626" stroke-width="1.0"/>
<text x="44" y="314" font-size="9.6" fill="#dc2626" text-anchor="start" font-weight="700">为什么沃森和克里克一眼看穿它是错的？</text>
<text x="44" y="334" font-size="9.2" fill="#0f172a" text-anchor="start" font-weight="600">• 化学硬伤：磷酸二酯 pKₐ ≈ 1.5–2，在细胞 pH ≈ 7 下</text>
<text x="44" y="351" font-size="9.2" fill="#1e293b" text-anchor="start">  99.999% 带负电（若不电离就不是“核酸”了！），</text>
<text x="44" y="368" font-size="9.2" fill="#1e293b" text-anchor="start">  硬塞进轴心既同性相斥，范德华原子间距也撞车；</text>
<text x="44" y="387" font-size="9.2" fill="#1e293b" text-anchor="start">• 实验误导：鲍林混用了干 A 型与湿 B 型模糊旧照片；</text>
<text x="44" y="406" font-size="9.2" fill="#dc2626" text-anchor="start" font-weight="700">• 生物学死穴：碱基朝外悬空，根本没法做【复制模具】！</text>
<text x="44" y="423" font-size="8.9" fill="#64748b" text-anchor="start">  （注：沃森自己 1951.11 首版模型也犯过同款内骨错误）</text>
<rect x="382" y="62" width="358" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="396.0" y="76.0" width="330" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="561.0" y="91.0" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="600">正确结构 · 沃森-克里克反向平行双螺旋 (1953.04)</text>
<circle cx="561.0" cy="194.0" r="72" fill="#ecfeff" stroke="#0f766e" stroke-width="1.0" stroke-dasharray="3 3"/>
<circle cx="561.0" cy="194.0" r="62.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="2.0"/>
<rect x="519.0" y="183.0" width="38" height="26" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<rect x="565.0" y="183.0" width="38" height="26" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<line x1="557.0" y1="190.0" x2="565.0" y2="190.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="2 2"/>
<line x1="557.0" y1="196.0" x2="565.0" y2="196.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="2 2"/>
<line x1="557.0" y1="202.0" x2="565.0" y2="202.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="2 2"/>
<text x="538.0" y="199.0" font-size="9.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">嘌呤</text>
<text x="584.0" y="199.0" font-size="9.0" fill="#b45309" text-anchor="middle" font-weight="700">嘧啶</text>
<line x1="503.7" y1="217.7" x2="527.0" y2="209.0" stroke="#475569" stroke-width="2.0"/>
<line x1="618.3" y1="217.7" x2="595.0" y2="209.0" stroke="#475569" stroke-width="2.0"/>
<circle cx="503.7" cy="217.7" r="13.0" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.5"/>
<text x="503.7" y="221.2" font-size="8.2" fill="#ffffff" text-anchor="middle" font-weight="700">5&#x27;→3&#x27;</text>
<circle cx="618.3" cy="217.7" r="13.0" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
<text x="618.3" y="221.2" font-size="8.2" fill="#ffffff" text-anchor="middle" font-weight="700">3&#x27;←5&#x27;</text>
<text x="561.0" y="113" font-size="8.9" fill="#6d28d9" text-anchor="middle" font-weight="700">宽敞大沟 (~22 Å，张角 ~225°)：蛋白可直接伸入识字</text>
<text x="561.0" y="238.0" font-size="8.9" fill="#0f766e" text-anchor="middle" font-weight="700">狭窄小沟 (~12 Å)</text>
<text x="438" y="134" font-size="9.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">外层亲水 PO₄⁻</text>
<text x="438" y="149" font-size="8.7" fill="#0f766e" text-anchor="middle">拥抱水与 Na⁺</text>
<text x="684" y="134" font-size="9.0" fill="#18794e" text-anchor="middle" font-weight="700">C2 二阶对称轴</text>
<text x="684" y="149" font-size="8.7" fill="#1e293b" text-anchor="middle">双链反向平行</text>
<text x="561.0" y="280" font-size="9.3" fill="#18794e" text-anchor="middle" font-weight="700">亲水负电骨架朝外泡水，疏水碱基朝内叠成恒宽阶梯！</text>
<rect x="396" y="294" width="330" height="140" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.0"/>
<text x="406" y="314" font-size="9.6" fill="#18794e" text-anchor="start" font-weight="700">外骨内碱 + 反向平行的三重精妙：</text>
<text x="406" y="334" font-size="9.2" fill="#1e293b" text-anchor="start">• 静电与疏水双赢：带负电磷酸基团朝外被水分子和阳离</text>
<text x="406" y="351" font-size="9.2" fill="#1e293b" text-anchor="start">  子（Na⁺/Mg²⁺）轻松屏蔽；扁平疏水碱基躲在内部避水堆叠；</text>
<text x="406" y="370" font-size="9.2" fill="#0f172a" text-anchor="start" font-weight="600">• 反向平行（5&#x27;→3&#x27; 对 3&#x27;→5&#x27;）：契合富兰克林单斜 C2 晶胞</text>
<text x="406" y="387" font-size="9.2" fill="#1e293b" text-anchor="start">  对称性——把整段双螺旋上下倒置 180°，骨架依然重合；</text>
<text x="406" y="406" font-size="9.2" fill="#6d28d9" text-anchor="start" font-weight="700">• 偏心糖苷键造出【大沟 + 小沟】：无需解开双链，调控</text>
<text x="406" y="423" font-size="9.2" fill="#0f172a" text-anchor="start" font-weight="600">  蛋白就能从 22 Å 大沟直接“摸”清里面的遗传字母！</text>
</svg>
