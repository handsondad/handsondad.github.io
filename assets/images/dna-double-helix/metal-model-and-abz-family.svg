<text x="400" y="369" font-size="9.2" fill="#b45309" text-anchor="start" font-weight="700">💡 富兰克林最重要的早期发现之一：区分【干 A 型】与【湿 B 型】！</text>
<text x="400" y="387" font-size="9.0" fill="#1e293b" text-anchor="start">• 在她之前（如阿斯特伯里），学界拍到的常是 A+B 混合模糊斑点；</text>
<text x="400" y="404" font-size="9.0" fill="#1e293b" text-anchor="start">• 富兰克林精准控湿分离两态，但她曾花一年主攻斑点更丰富的干晶 A 型</text>
<text x="400" y="421" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="600">  （碱基斜倾 20°，X 十字不如 B 型直白），而活细胞内部恰恰是湿润 B 型！</text>
