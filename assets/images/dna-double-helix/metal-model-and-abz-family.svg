<text x="44" y="350" font-size="9.3" fill="#0f172a" text-anchor="start" font-weight="700">史实正本清源（1953《自然》三联发 &amp; 2023 档案新考）：</text>
<text x="44" y="368" font-size="8.9" fill="#1e293b" text-anchor="start">• 1953.04.25《Nature》同刊连发 3 篇（沃森&amp;克里克、威尔金斯组、</text>
<text x="44" y="384" font-size="8.9" fill="#1e293b" text-anchor="start">  富兰克林&amp;高斯林），经布拉格爵士推荐免审直发以见证集体突破；</text>
<text x="44" y="401" font-size="8.9" fill="#1d6fa5" text-anchor="start" font-weight="600">• 2023《Nature》档案考证指出：富兰克林并非“看不懂照片的受害者”，</text>
<text x="44" y="417" font-size="8.9" fill="#0f172a" text-anchor="start" font-weight="600">  她独立推导出外骨双链与 3/8 错位，是并驾齐驱的【四重奏】核心成员</text>
<text x="44" y="434" font-size="8.8" fill="#64748b" text-anchor="start">  （惜于 1958 年 37 岁病逝，无缘不授逝者的 1962 年诺贝尔奖）。</text>
