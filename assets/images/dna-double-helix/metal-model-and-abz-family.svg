<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">1953年卡文迪许金属板DNA模型四路证据汇流与A型B型Z型三种双螺旋构象对比图</title>
<desc id="desc">左图重现沃森与克里克高约1.8米的铝板铜杆立体模型及伦敦国王学院X射线、查伽夫定则、贝塞尔衍射理论、多诺休酮式化学四路证据汇流，并补充2023年Nature档案新考；右图按真实比例尺对比短粗右旋A-DNA（23Å，11bp，倾角20°）、标准活细胞右旋B-DNA（20Å，10.5bp）与细长左旋折线Z-DNA（18Å，12bp）。</desc>
