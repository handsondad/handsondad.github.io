<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：四路证据汇流成 1953 年铝片铜杆立体模型；右：湿度与序列怎样让双螺旋变胖（A型）或左旋折线化（Z型）</text>
