<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">热泵空调四通换向阀冷暖切换水路与冬季结霜逆循环化霜及喷气增焓原理图</title>
<desc id="desc">上半幅对比四通换向阀D形滑块在夏季制冷(高压D口通室外冷凝、室内冷气经滑块回S吸气口)与冬季制热(滑块右移令82°C高压气直通室内散热、室外变-5°C蒸发器吸寒风热量)的切换原理；下半幅解释0-5°C高湿结霜致制热跌45%后的逆循环化霜水雾、PTC电辅热高耗电本质与-25°C喷气增焓(EVI)中压补气增效机制。</desc>
