<rect x="0.5" y="0.5" width="759" height="479" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">冬天制热根本不用压缩机倒转！——四通换向滑块阀与“外机停风冒白烟”化霜之谜</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左上/右上：5 W 先导电磁阀借 2 MPa 压差平移 D 形滑块一键冷暖互换 · 下：结霜衰减、逆循环化霜与喷气增焓</text>
