<text x="197.0" y="91.0" font-size="9.0" fill="#1d6fa5" text-anchor="middle" font-weight="600">① 夏季制冷模式（先导线圈断电 · 滑块罩住左+中口）</text>
<rect x="107.0" y="148.0" width="180.0" height="42.0" rx="18" fill="#fff1f2" stroke="#dc2626" stroke-width="1.8"/>
<rect x="145.0" y="106" width="104" height="26" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="197.0" y="123" font-size="7.9" fill="#0f172a" text-anchor="middle" font-weight="700">压缩机（转向永不变!）</text>
<line x1="197.0" y1="132.0" x2="197.0" y2="148.0" stroke="#dc2626" stroke-width="4.0"/>
<text x="205.0" y="143" font-size="7.5" fill="#dc2626" text-anchor="start" font-weight="700">D 高压排气</text>
