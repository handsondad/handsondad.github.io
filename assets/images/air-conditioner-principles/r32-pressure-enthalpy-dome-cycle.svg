<rect x="0.5" y="0.5" width="759" height="475" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">制冷工程师的“热力学藏宝图”：R32 压焓图（lg P–h）上的四步真实轨迹</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">按 NIST 实测物性绘制两相穹顶：看懂 25.2% 闪蒸自牺牲、5 °C 防液击过热与 5 °C 提效过冷</text>
<rect x="20" y="64" width="430" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="78.0" width="402" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="235.0" y="93.0" font-size="9.0" fill="#1d6fa5" text-anchor="middle" font-weight="600">① R32 压焓图实算（NIST IIR 基准：0 °C 饱和液 h=200 kJ/kg）</text>
<rect x="34.0" y="110.0" width="402.0" height="266.0" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
