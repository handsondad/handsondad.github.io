<text x="320.7" y="363.0" font-size="8.0" fill="#64748b" text-anchor="middle" class="mono">500</text>
<line x1="386.0" y1="348.0" x2="386.0" y2="128.0" stroke="#f1f5f9" stroke-width="1.0"/>
<text x="386.0" y="363.0" font-size="8.0" fill="#64748b" text-anchor="middle" class="mono">600</text>
