<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">NIST实测R32制冷剂压焓图两相穹顶四步循环与过冷过热防液击机理图</title>
<desc id="desc">左图基于NIST数据库精确绘制R32气液两相穹顶与临界点C(78.1°C, 5.79MPa)，标出1→2压缩耗功55.8kJ/kg、2→3冷凝放热292.2kJ/kg、3→4绝热节流至干度25.2%、4→1蒸发吸热236.4kJ/kg；右栏拆解25.2%液体闪蒸降温、吸气5°C过热防止不可压缩液体击碎压缩机阀片(液击)及冷凝5°C过冷提升冷量的工程原因。</desc>
