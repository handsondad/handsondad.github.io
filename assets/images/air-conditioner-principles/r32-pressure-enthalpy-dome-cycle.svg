<polyline points="91.4,342.1 96.8,328.8 102.2,316.0 107.7,303.8 113.2,292.1 118.8,280.9 124.5,270.1 130.3,259.8 136.1,249.8 142.0,240.1 148.1,230.8 154.3,221.8 160.7,213.1 167.2,204.7 173.9,196.6 180.9,188.6 188.2,180.9 196.0,173.4 204.2,166.1 220.3,154.6 237.0,146.2 265.1,140.6" fill="none" stroke="#1d6fa5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="265.1,140.6 295.8,146.2 309.7,154.6 319.0,166.1 322.6,173.4 325.3,180.9 327.4,188.6 329.0,196.6 330.1,204.7 330.9,213.1 331.4,221.8 331.7,230.8 331.7,240.1 331.5,249.8 331.2,259.8 330.7,270.1 330.0,280.9 329.2,292.1 328.2,303.8 327.2,316.0 326.0,328.8 324.8,342.1" fill="none" stroke="#6d28d9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="265.1" cy="140.6" r="3.6" fill="#0f172a"/>
<text x="265.1" y="133.6" font-size="7.7" fill="#0f172a" text-anchor="middle" font-weight="700">临界点 C (78.1°C, 5.79 MPa)</text>
<text x="232.4" y="302.2" font-size="8.2" fill="#64748b" text-anchor="middle" font-weight="600">气液两相沸腾区</text>
<line x1="180.9" y1="259.8" x2="335.5" y2="259.8" stroke="#1d6fa5" stroke-width="3.0"/>
<line x1="335.5" y1="259.8" x2="372.0" y2="180.9" stroke="#dc2626" stroke-width="3.0"/>
<line x1="372.0" y1="180.9" x2="180.9" y2="180.9" stroke="#c25014" stroke-width="3.0"/>
<line x1="180.9" y1="180.9" x2="180.9" y2="259.8" stroke="#b45309" stroke-width="2.8" stroke-dasharray="5,3"/>
<circle cx="335.5" cy="259.8" r="4.2" fill="#ffffff" stroke="#1d6fa5" stroke-width="2.2"/>
<text x="341.5" y="272.8" font-size="7.8" fill="#1d6fa5" text-anchor="start" font-weight="700">1 (10°C过热气)</text>
<circle cx="372.0" cy="180.9" r="4.2" fill="#ffffff" stroke="#dc2626" stroke-width="2.2"/>
<text x="378.0" y="174.9" font-size="7.8" fill="#dc2626" text-anchor="start" font-weight="700">2 (82°C排气)</text>
<circle cx="180.9" cy="180.9" r="4.2" fill="#ffffff" stroke="#c25014" stroke-width="2.2"/>
<text x="174.9" y="172.9" font-size="7.8" fill="#c25014" text-anchor="end" font-weight="700">3 (45°C过冷液)</text>
<circle cx="180.9" cy="259.8" r="4.2" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/>
<text x="186.9" y="272.8" font-size="7.8" fill="#0f766e" text-anchor="start" font-weight="700">4 (5°C, x=25.2%)</text>
<text x="258.2" y="252.8" font-size="7.9" fill="#1d6fa5" text-anchor="middle" font-weight="700">④→① 室内吸热 q_L = 236.4</text>
<text x="276.5" y="194.9" font-size="7.9" fill="#c25014" text-anchor="middle" font-weight="700">②→③ 室外放热 q_H = 292.2</text>
<text x="361.7" y="224.3" font-size="7.8" fill="#dc2626" text-anchor="start" font-weight="700" class="mono">w=55.8</text>
<text x="36" y="396" font-size="8.5" fill="#1e293b" text-anchor="start">• 横轴跨度就是能量大小：底边吸热段 (236.4) 足足是右侧压缩耗功水平跨度</text>
<text x="36" y="414" font-size="8.5" fill="#0f172a" text-anchor="start" font-weight="700">  (55.8) 的 4.24 倍！竖直虚线 ③→④ 比焓不变 (h3=h4=286.3)，绝热节流。</text>
<text x="36" y="432" font-size="8.4" fill="#dc2626" text-anchor="start" font-weight="600">• 临界点红线：若室外暴晒令盘管超 78.1 °C，R32 无法液化，制冷立刻崩溃！</text>
<rect x="462" y="64" width="278" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="476.0" y="78.0" width="250" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="601.0" y="93.0" font-size="9.1" fill="#0f766e" text-anchor="middle" font-weight="600">② 三个藏在拐角里的生死工程细节</text>
<rect x="476" y="110" width="250" height="108" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.1"/>
<text x="488" y="129" font-size="8.7" fill="#0f766e" text-anchor="start" font-weight="700">1. 节流“自牺牲”：45 °C 液体怎么秒变 5 °C？</text>
<text x="488" y="148" font-size="8.3" fill="#1e293b" text-anchor="start">跨过膨胀阀窄缝时压强暴跌，45 °C 高于新沸点</text>
<text x="488" y="165" font-size="8.3" fill="#0f172a" text-anchor="start" font-weight="700">5 °C：约 25.2% 液体当场闪蒸成气，强行从自</text>
<text x="488" y="182" font-size="8.3" fill="#1e293b" text-anchor="start">家兄弟身上抽走汽化潜热，把剩下 74.8% 液体</text>
<text x="488" y="199" font-size="8.3" fill="#0f766e" text-anchor="start" font-weight="700">瞬间冻成 5 °C 冰雾送进室内蒸发器！</text>
<rect x="476" y="228" width="250" height="108" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.1"/>
<text x="488" y="247" font-size="8.7" fill="#dc2626" text-anchor="start" font-weight="700">2. 吸气“5 °C 过热”：救压缩机一命的防液击线</text>
<text x="488" y="266" font-size="8.3" fill="#1e293b" text-anchor="start">5 °C 下液态 R32 密度 (1038 kg/m³) 是蒸气的</text>
<text x="488" y="283" font-size="8.3" fill="#1e293b" text-anchor="start">40 倍且不可压缩！若没沸腾完的药水滴冲进每</text>
<text x="488" y="300" font-size="8.3" fill="#0f172a" text-anchor="start" font-weight="700">分钟几千转的气缸，就像铁锤砸水——瞬间打碎</text>
<text x="488" y="317" font-size="8.3" fill="#dc2626" text-anchor="start" font-weight="700">阀片（液击）！故出口必多热 5 °C 确保纯气。</text>
<rect x="476" y="346" width="250" height="102" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.1"/>
<text x="488" y="365" font-size="8.7" fill="#c25014" text-anchor="start" font-weight="700">3. 冷凝“5 °C 过冷”：白捡的制冷量增益</text>
<text x="488" y="384" font-size="8.3" fill="#1e293b" text-anchor="start">液化完在 50 °C 不急着出管，再借迎面风多凉到</text>
<text x="488" y="401" font-size="8.3" fill="#1e293b" text-anchor="start">45 °C（点 3 左移）：既防止阀前提前冒泡气堵，</text>
<text x="488" y="418" font-size="8.3" fill="#0f172a" text-anchor="start" font-weight="700">又把节流闪蒸损耗从 28.9% 压低到 25.2%，每千</text>
<text x="488" y="435" font-size="8.3" fill="#c25014" text-anchor="start" font-weight="700">克工质多腾出 11.2 kJ 净冷量！</text>
</svg>
