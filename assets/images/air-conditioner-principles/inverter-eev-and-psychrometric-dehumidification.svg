<svg xmlns="http://www.w3.org/2000/svg" width="760" height="476" viewBox="0 0 760 476" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">定频锯齿与全直流变频低频高COP巡航对比及开利湿空气显热潜热除湿机理图</title>
<desc id="desc">左图对比定频空调50Hz频繁启停造成的±1.5°C室温锯齿与全直流变频25Hz贴线±0.3°C巡航，解释低负荷时换热面积富余令蒸发升至11°C、冷凝降至40°C从而推高COP破5的物理机制；右图结合开利1902彩印厂控湿专利US808897A拆解60%显热与40%潜热(凝结1升水耗2450kJ)，对比雪花制冷与水滴超微风低温深除湿模式。</desc>
