<rect x="0.5" y="0.5" width="759" height="475" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">定频 vs 变频到底差在哪？为什么“除湿模式”比制冷还冻人？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：变频低频巡航靠“大马拉小车缩小换热温差”把 COP 推过 5.0 · 右：开利湿空气学——凝结 1 升水抽走 2450 kJ</text>
<rect x="20" y="64" width="362" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="78.0" width="334" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="201.0" y="93.0" font-size="9.1" fill="#1d6fa5" text-anchor="middle" font-weight="600">① 定频“猛踩急刹” vs 全直流变频“低频贴线巡航”</text>
<rect x="34.0" y="110.0" width="334.0" height="168.0" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<line x1="74.0" y1="198.4" x2="354.0" y2="198.4" stroke="#18794e" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="352.0" y="210.4" font-size="7.7" fill="#18794e" text-anchor="end" font-weight="700">设定 26.0°C</text>
<line x1="74.0" y1="254.0" x2="354.0" y2="254.0" stroke="#475569" stroke-width="1.2"/>
<line x1="74.0" y1="254.0" x2="74.0" y2="128.0" stroke="#475569" stroke-width="1.2"/>
<line x1="71.0" y1="235.5" x2="74.0" y2="235.5" stroke="#475569" stroke-width="1.0"/>
<text x="69.0" y="238.5" font-size="7.9" fill="#64748b" text-anchor="end" class="mono">24°C</text>
<line x1="71.0" y1="198.4" x2="74.0" y2="198.4" stroke="#475569" stroke-width="1.0"/>
<text x="69.0" y="201.4" font-size="7.9" fill="#64748b" text-anchor="end" class="mono">26°C</text>
<line x1="71.0" y1="161.4" x2="74.0" y2="161.4" stroke="#475569" stroke-width="1.0"/>
<text x="69.0" y="164.4" font-size="7.9" fill="#64748b" text-anchor="end" class="mono">28°C</text>
<line x1="74.0" y1="254.0" x2="74.0" y2="258.0" stroke="#475569" stroke-width="1.0"/>
<text x="74.0" y="269.0" font-size="7.9" fill="#64748b" text-anchor="middle" class="mono">0m</text>
<line x1="144.0" y1="254.0" x2="144.0" y2="258.0" stroke="#475569" stroke-width="1.0"/>
<text x="144.0" y="269.0" font-size="7.9" fill="#64748b" text-anchor="middle" class="mono">30m</text>
<line x1="214.0" y1="254.0" x2="214.0" y2="258.0" stroke="#475569" stroke-width="1.0"/>
<text x="214.0" y="269.0" font-size="7.9" fill="#64748b" text-anchor="middle" class="mono">60m</text>
