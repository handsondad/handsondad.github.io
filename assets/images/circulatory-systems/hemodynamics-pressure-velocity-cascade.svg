<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">血管树的流体力学奇迹：微动脉怎样管血压，毛细血管怎样刹慢 700 倍？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上栏看血压瀑布（泊肃叶定律 R ∝ 1/r⁴ 水龙头）→ 下栏看总截面积暴涨与流速急刹（A₁v₁ = A₂v₂）</text>
