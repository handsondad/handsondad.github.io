<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">人体四腔双泵串联血液循环分步与短动画示意图</title>
<desc id="desc">展示右心低压肺循环（25/10 mmHg）与左心高压体循环（120/80 mmHg）组成的8字闭环、四道单向瓣膜及哈维定量推算。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes rbcPulmOut {
        0%   { transform: translate(334px, 240px); opacity: 0; }
        12%  { transform: translate(334px, 240px); opacity: 1; }
        46%  { transform: translate(316px, 146px); opacity: 1; }
        82%  { transform: translate(366px, 118px); opacity: 1; }
        100% { transform: translate(366px, 118px); opacity: 1; }
      }
      @keyframes rbcPulmIn {
        0%   { transform: translate(394px, 118px); opacity: 0.25; }
        35%  { transform: translate(444px, 146px); opacity: 1; }
        78%  { transform: translate(426px, 206px); opacity: 1; }
        100% { transform: translate(426px, 186px); opacity: 1; }
      }
      @keyframes rbcSysOut {
        0%   { transform: translate(426px, 286px); opacity: 0.25; }
        35%  { transform: translate(466px, 344px); opacity: 1; }
        78%  { transform: translate(414px, 398px); opacity: 1; }
        100% { transform: translate(398px, 398px); opacity: 1; }
      }
      @keyframes rbcSysIn {
        0%   { transform: translate(356px, 398px); opacity: 0.25; }
        42%  { transform: translate(294px, 344px); opacity: 1; }
        84%  { transform: translate(334px, 206px); opacity: 1; }
        100% { transform: translate(334px, 186px); opacity: 1; }
      }
      @keyframes heartPulse {
        0%, 100% { stroke-width: 2.2px; }
        35%      { stroke-width: 3.6px; }
        70%      { stroke-width: 2.2px; }
      }
      .rbc-p-out { animation: rbcPulmOut 5.8s ease-in-out 1 forwards; }
      .rbc-p-in  { animation: rbcPulmIn  5.8s ease-in-out 1 forwards; }
      .rbc-s-out { animation: rbcSysOut  5.8s ease-in-out 1 forwards; }
      .rbc-s-in  { animation: rbcSysIn   5.8s ease-in-out 1 forwards; }
      .lv-wall   { animation: heartPulse 2.9s ease-in-out 2 forwards; }
      @media (prefers-reduced-motion: reduce) {
        .rbc-p-out { animation: none !important; transform: translate(366px, 118px); opacity: 1 !important; }
        .rbc-p-in  { animation: none !important; transform: translate(426px, 186px); opacity: 1 !important; }
        .rbc-s-out { animation: none !important; transform: translate(398px, 398px); opacity: 1 !important; }
        .rbc-s-in  { animation: none !important; transform: translate(334px, 186px); opacity: 1 !important; }
        .lv-wall   { animation: none !important; }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">人体四腔双泵串联回路：为什么一颗心要拆成“低压右泵”与“高压左泵”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先看中央四腔心与四道单向瓣膜 → 再顺箭头跟读 8 字双循环 → 对比右心 25/10 与左心 120/80 mmHg 压差</text>
<rect x="24" y="152" width="182" height="224" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
<circle cx="42" cy="174" r="10.5" fill="#eaf4fb" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="42" y="178" font-size="11.5" fill="#1d4ed8" text-anchor="middle" font-weight="700">1</text>
<text x="62" y="179" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="700">右心：低压护肺泵</text>
<text x="36" y="204" font-size="11.5" fill="#0f172a" text-anchor="start">• 路径：右心房 → 三尖瓣</text>
<text x="36" y="224" font-size="11.5" fill="#0f172a" text-anchor="start">  → 右心室 → 肺动脉瓣</text>
<text x="36" y="248" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="700">• 肺动脉压：25 / 10 mmHg</text>
<text x="36" y="268" font-size="11.5" fill="#1e293b" text-anchor="start">• 右室肌壁：薄（3–4 mm）</text>
<text x="36" y="292" font-size="11" fill="#1e293b" text-anchor="start">• 原因：肺泡膜仅 0.3 μm，</text>
<text x="36" y="310" font-size="11" fill="#1e293b" text-anchor="start">  高压会把液体压进肺泡！</text>
<rect x="36.0" y="326.0" width="158" height="22" rx="11.0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" stroke-opacity="0.35"/>
<text x="115.0" y="341.0" font-size="10.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">陷阱：肺动脉流暗红缺氧血</text>
<rect x="554" y="152" width="182" height="224" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<circle cx="572" cy="174" r="10.5" fill="#eaf4fb" stroke="#b91c1c" stroke-width="1.2"/>
<text x="572" y="178" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">2</text>
<text x="592" y="179" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="700">左心：高压全身泵</text>
<text x="566" y="204" font-size="11.5" fill="#0f172a" text-anchor="start">• 路径：左心房 → 二尖瓣</text>
<text x="566" y="224" font-size="11.5" fill="#0f172a" text-anchor="start">  → 左心室 → 主动脉瓣</text>
<text x="566" y="248" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">• 主动脉压：120 / 80 mmHg</text>
<text x="566" y="268" font-size="11.5" fill="#1e293b" text-anchor="start">• 左室肌壁：厚 3 倍(8–12mm)</text>
<text x="566" y="292" font-size="11" fill="#1e293b" text-anchor="start">• 自带电网：窦房结起搏 →</text>
<text x="566" y="310" font-size="11" fill="#1e293b" text-anchor="start">  房室结延 0.1s → 心尖上挤</text>
<rect x="566.0" y="326.0" width="158" height="22" rx="11.0" fill="#fee2e2" stroke="#b91c1c" stroke-width="1" stroke-opacity="0.35"/>
<text x="645.0" y="341.0" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="600">冠脉特例：主要在舒张期供血</text>
<rect x="224" y="82" width="312" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="102" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">肺泡毛细血管网（吸 O₂ · 排 CO₂ · 气血屏障 ~0.3 μm）</text>
<text x="294" y="125" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="600">肺动脉（蓝·缺氧）↗</text>
<text x="466" y="125" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="600">↘ 肺静脉（红·富氧）</text>
<rect x="224" y="386" width="312" height="62" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="406" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">全身毛细血管网 + 肝门静脉双毛细血管海关</text>
<text x="380" y="426" font-size="11" fill="#1e293b" text-anchor="middle">左右心流量严格相等：70 mL × 72 次/分 ≈ 5 L/min（7,200 L/天）</text>
<path d="M 344 252 C 296 226, 296 156, 344 138" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="6 3"/>
<path d="M 416 138 C 464 156, 464 182, 434 198" fill="none" stroke="#dc2626" stroke-width="4"/>
<path d="M 416 268 C 488 292, 488 362, 424 386" fill="none" stroke="#dc2626" stroke-width="5"/>
<path d="M 336 386 C 272 362, 272 224, 326 198" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-dasharray="7 3"/>
<rect x="318" y="170" width="124" height="166" rx="18" fill="#ffffff" stroke="#475569" stroke-width="2.0"/>
<line x1="380" y1="172" x2="380" y2="334" stroke="#475569" stroke-width="4"/>
<line x1="320" y1="242" x2="440" y2="242" stroke="#475569" stroke-width="2" stroke-dasharray="4 2"/>
<rect x="323" y="175" width="53" height="63" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="349" y="202" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="700">右心房</text>
<text x="349" y="220" font-size="10" fill="#1e3a8a" text-anchor="middle">三尖瓣↓</text>
<rect x="384" y="175" width="53" height="63" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="410" y="202" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">左心房</text>
<text x="410" y="220" font-size="10" fill="#b91c1c" text-anchor="middle">↓二尖瓣</text>
<rect x="323" y="246" width="53" height="84" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="349" y="282" font-size="11.5" fill="#1e3a8a" text-anchor="middle" font-weight="700">右心室</text>
<text x="349" y="300" font-size="10.5" fill="#1e3a8a" text-anchor="middle" font-weight="700">25/10</text>
<text x="349" y="316" font-size="10" fill="#1e293b" text-anchor="middle">薄壁泵</text>
<rect class="lv-wall" x="384" y="246" width="53" height="84" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3.2"/>
<text x="410" y="282" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">左心室</text>
<text x="410" y="300" font-size="10.5" fill="#b91c1c" text-anchor="middle" font-weight="700">120/80</text>
<text x="410" y="316" font-size="10" fill="#1e293b" text-anchor="middle">厚壁泵</text>
<text x="380" y="356" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">心音“咚-哒”= 房室瓣关 → 动脉瓣关</text>
<g class="rbc-p-out"><circle cx="0" cy="0" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/></g>
<g class="rbc-p-in"><circle cx="0" cy="0" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/></g>
<g class="rbc-s-out"><circle cx="0" cy="0" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/></g>
<g class="rbc-s-in"><circle cx="0" cy="0" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/></g>
<rect x="24" y="460" width="712" height="42" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="380" y="486" font-size="11.2" fill="#b45309" text-anchor="middle" font-weight="600">哈维 1628 算术破案：哪怕按极保守每搏 4.7 mL 算，一天也泵血 ~226 kg，肝脏绝不可能凭空造出——血液必然闭环循环！</text>
</svg>
