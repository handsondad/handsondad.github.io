<rect x="278" y="270" width="204" height="180" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="288" y="290" font-size="10.3" fill="#6d28d9" text-anchor="start" font-weight="700">• 别把桑葚和树莓搞混：</text>
<text x="288" y="309" font-size="10.1" fill="#1e293b" text-anchor="start">  树莓是一朵花里许多子房聚成的</text>
<text x="288" y="326" font-size="10.1" fill="#1e293b" text-anchor="start">  聚合核果；而桑葚是整根花序轴上</text>
<text x="288" y="343" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">  几十朵独立雌花挤成的【聚花果】！</text>
<text x="288" y="364" font-size="10.3" fill="#6d28d9" text-anchor="start" font-weight="700">• 最让人意外的爆汁真相：</text>
<text x="288" y="382" font-size="10.1" fill="#1e293b" text-anchor="start">  每朵小雌花授粉后，真正的子房只</text>
<text x="288" y="399" font-size="10.1" fill="#1e293b" text-anchor="start">  结出一粒极小的瘦果；反倒是外围</text>
<text x="288" y="416" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">  4 片【花萼 (Calyx)】吸饱紫黑花青素</text>
<text x="288" y="433" font-size="9.8" fill="#64748b" text-anchor="start">  鼓成小水珠！（菠萝、无花果也是聚花果）</text>
