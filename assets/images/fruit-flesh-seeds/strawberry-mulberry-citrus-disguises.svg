<text x="528" y="94" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">3</text>
<text x="544" y="94" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="700">柑橘柚子：特化柑果</text>
<text x="524" y="114" font-size="10.2" fill="#64748b" text-anchor="start">一瓣一瓣的果粒竟是“内果皮长毛”！</text>
