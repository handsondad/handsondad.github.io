<rect x="34" y="270" width="204" height="180" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="44" y="290" font-size="10.3" fill="#dc2626" text-anchor="start" font-weight="700">• 红艳果肉 = 膨大的【茎尖花托】！</text>
<text x="44" y="309" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="700">• 表面约 200 粒“小芝麻”：</text>
<text x="44" y="327" font-size="10.1" fill="#1e293b" text-anchor="start">  根本不是裸露种子，而是 200 颗</text>
<text x="44" y="344" font-size="10.1" fill="#18794e" text-anchor="start" font-weight="700">  独立的【瘦果 (Achene)】——每粒</text>
<text x="44" y="361" font-size="10.1" fill="#1e293b" text-anchor="start">  硬壳里才装着一颗真正的草莓种子！</text>
<text x="44" y="382" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">• 经典实验（Nitsch 1950）：趁幼果</text>
<text x="44" y="399" font-size="10.0" fill="#1e293b" text-anchor="start">  期用镊子拔光表面瘦果，花托立刻</text>
<text x="44" y="416" font-size="10.0" fill="#1e293b" text-anchor="start">  停止长大；涂上生长素又重新鼓起！</text>
<text x="44" y="434" font-size="9.8" fill="#64748b" text-anchor="start">  证明瘦果是发号施令的“包工头”。</text>
<rect x="264" y="68" width="232" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
