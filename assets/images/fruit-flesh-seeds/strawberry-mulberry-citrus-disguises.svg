<text x="532" y="290" font-size="10.2" fill="#c25014" text-anchor="start" font-weight="700">• 剥橘子就是逐层拆解三层真果皮：</text>
<text x="532" y="309" font-size="10.1" fill="#1e293b" text-anchor="start">  ① 喷香油胞橙色外皮 = 外果皮；</text>
<text x="532" y="326" font-size="10.1" fill="#1e293b" text-anchor="start">  ② 白色海绵状“橘络” = 中果皮；</text>
<text x="532" y="343" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">  ③ 包住每一瓣的薄韧衣 = 内果皮！</text>
<text x="532" y="364" font-size="10.2" fill="#c25014" text-anchor="start" font-weight="700">• 那一粒粒水滴状果肉是什么？</text>
<text x="532" y="382" font-size="10.1" fill="#1e293b" text-anchor="start">  是内果皮内壁向腔内长出的巨型多</text>
<text x="532" y="399" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">  细胞表皮毛——【汁胞 (Juice Sacs)】</text>
<text x="532" y="416" font-size="10.1" fill="#1e293b" text-anchor="start">  内部 &gt;90% 体积是装满糖酸的大液泡</text>
<text x="532" y="433" font-size="9.8" fill="#64748b" text-anchor="start">  （吃柚子一粒粒剥开的正是这种腺毛）！</text>
</svg>
