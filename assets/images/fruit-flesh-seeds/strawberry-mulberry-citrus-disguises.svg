<text x="300" y="94" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="700">桑葚：整串花序聚花果</text>
<text x="280" y="114" font-size="10.2" fill="#64748b" text-anchor="start">一粒桑葚 = 几十朵小花抱成团！</text>
