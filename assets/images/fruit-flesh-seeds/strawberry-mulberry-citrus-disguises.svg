<rect x="0.5" y="0.5" width="759" height="483" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">水果界三大“障眼法”：草莓籽其实是果、桑葚吃花萼、橙子果肉竟是“毛”！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">同样酸甜爆汁，植物演化出了截然不同的储糖容器——拿放大镜看一眼全破案。</text>
