<text x="56" y="94" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="700">草莓：聚合假果</text>
<text x="36" y="114" font-size="10.2" fill="#64748b" text-anchor="start">一朵花长出 ~200 颗独立干果！</text>
