<svg xmlns="http://www.w3.org/2000/svg" width="760" height="484" viewBox="0 0 760 484" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">草莓聚合假果花托瘦果、桑葚聚花果肉质花萼与柑橘内果皮汁胞结构图解</title>
<desc id="desc">三栏并列拆解三种特化果实：草莓可食部分为茎尖花托而表面小粒为真正瘦果；桑葚由整串花序发育且爆汁部分为肉质花萼；柑橘类一粒粒汁胞是内果皮向内生长的多细胞储水毛状体。</desc>
