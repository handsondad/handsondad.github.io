<text x="672" y="224" font-size="10.0" fill="#d97706" text-anchor="middle" font-weight="700">梨果肉放大：</text>
<text x="672" y="237" font-size="9.8" fill="#92400e" text-anchor="middle" font-weight="700">木质化石细胞团</text>
<line x1="472" y1="156" x2="434" y2="128" stroke="#c25014" stroke-width="1.4"/>
<text x="402" y="122" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="700">外圈&gt;70%脆肉</text>
<text x="402" y="135" font-size="9.5" fill="#64748b" text-anchor="start">= 花筒(非子房)</text>
<line x1="498" y1="220" x2="438" y2="258" stroke="#18794e" stroke-width="1.4"/>
<text x="402" y="255" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">果心线以内</text>
<text x="402" y="268" font-size="9.6" fill="#18794e" text-anchor="start" font-weight="700">= 真正果皮！</text>
<rect x="404" y="292" width="320" height="114" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="416" y="313" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">• 把苹果拦腰横切一刀，你会看到一圈淡绿色虚线环：</text>
<text x="416" y="332" font-size="10.2" fill="#1e293b" text-anchor="start">  ① 环外 &gt;70% 脆甜果肉：由包被下位子房的【花筒/花托】膨大；</text>
<text x="416" y="350" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700">  ② 环内你啃剩吐掉的“苹果核”：才是真正的子房中果皮，</text>
<text x="416" y="368" font-size="10.2" fill="#1e293b" text-anchor="start">     那五片卡牙缝的硬塑料状薄片则是【革质内果皮】！</text>
<text x="416" y="388" font-size="9.8" fill="#64748b" text-anchor="start">  （苹果底部凹坑里残留的干枯小爪子，正是当年的花萼片！）</text>
<rect x="404" y="416" width="320" height="82" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="416" y="436" font-size="10.2" fill="#d97706" text-anchor="start" font-weight="700">🍐 同样是仁果，为什么梨吃起来“沙沙咯牙”，苹果却细腻？</text>
<text x="416" y="454" font-size="10.0" fill="#1e293b" text-anchor="start">• 梨的花筒果肉里散布着成团的【石细胞 (Brachysclereids)】——</text>
<text x="416" y="471" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">  细胞壁沉积了 25%–30% 木质素（跟坚果壳同款硬质材料！），</text>
<text x="416" y="488" font-size="9.8" fill="#64748b" text-anchor="start">  野生梨原本靠它防虫护种，人工选育才让砀山梨石细胞变细少。</text>
</svg>
