<rect x="0.5" y="0.5" width="759" height="527" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">西红柿 vs 苹果与梨：一个吸溜“胎座胶质”，两个专啃“花筒外衣”！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">横切一刀见真章：西红柿全身内外都姓“子房”；苹果和梨真正的果皮却被封印在果心线以内。</text>
<rect x="20" y="68" width="352" height="444" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="36.0" y="82.0" width="224" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="148.0" y="97.0" font-size="11.2" fill="#dc2626" text-anchor="middle" font-weight="600">西红柿：根正苗红的“真果·浆果”</text>
