<text x="315" y="142" font-size="10.2" fill="#dc2626" text-anchor="start" font-weight="700">果皮肉壁</text>
<text x="315" y="155" font-size="9.6" fill="#64748b" text-anchor="start">(中/内果皮)</text>
<line x1="234" y1="224" x2="306" y2="232" stroke="#d97706" stroke-width="1.4"/>
<text x="309" y="228" font-size="10.2" fill="#d97706" text-anchor="start" font-weight="700">胎座液化胶</text>
<text x="309" y="241" font-size="9.6" fill="#64748b" text-anchor="start">(酸甜爆汁源)</text>
<line x1="144" y1="172" x2="86" y2="142" stroke="#0f172a" stroke-width="1.4"/>
<text x="82" y="138" font-size="10.0" fill="#0f172a" text-anchor="end" font-weight="700">隔膜(Septa)</text>
<text x="82" y="151" font-size="9.5" fill="#64748b" text-anchor="end">分出心皮室</text>
<rect x="36" y="292" width="320" height="114" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="48" y="313" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">• 西红柿咬开后，我们其实同时吃下了两样器官：</text>
<text x="48" y="332" font-size="10.2" fill="#1e293b" text-anchor="start">  ① 外圈厚实沙瓤与辐射状隔膜 = 子房壁长成的中/内果皮；</text>
<text x="48" y="350" font-size="10.2" fill="#1e293b" text-anchor="start">  ② 包裹种子的酸甜果冻汁 = 由 SlMBP3 基因调控液化的</text>
<text x="48" y="368" font-size="10.2" fill="#dc2626" text-anchor="start" font-weight="700">     【胎座胶质 (Locular Gel)】，富含谷氨酸鲜味与有机酸！</text>
<text x="48" y="388" font-size="9.8" fill="#64748b" text-anchor="start">  （种子表面自带抑制发芽物质，随动物消化道排出才萌发）</text>
<rect x="36" y="416" width="320" height="82" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="48" y="436" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="700">⚖️ 1893 美国最高法院“西红柿关税案”(Nix v. Hedden)：</text>
<text x="48" y="454" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">• 植物学铁证：100% 是浆果（受精子房发育且含种子）！</text>
<text x="48" y="471" font-size="10.0" fill="#1e293b" text-anchor="start">• 大法官判决：按厨房习惯配正餐吃而非饭后甜点，关税算蔬菜！</text>
<text x="48" y="488" font-size="9.8" fill="#64748b" text-anchor="start">  → 一锤定音区分了“植物学果实”与“餐桌蔬菜”两套词典。</text>
<rect x="388" y="68" width="352" height="444" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="404.0" y="82.0" width="238" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="523.0" y="97.0" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="600">苹果与梨：穿厚外套的“仁果·假果”</text>
<circle cx="520" cy="198" r="76" fill="#fef9c3" stroke="#dc2626" stroke-width="2.6"/>
