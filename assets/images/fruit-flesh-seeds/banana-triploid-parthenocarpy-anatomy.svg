<circle cx="215" cy="181" r="2.2" fill="#64748b"/>
<text x="188" y="286" font-size="10.6" fill="#dc2626" text-anchor="middle" font-weight="700">果腔几乎被直径 4–6 mm 的黑色硬籽塞满！</text>
<text x="188" y="306" font-size="10.3" fill="#1e293b" text-anchor="middle">• 东南亚丛林里的野生小果野蕉 (M. acuminata) 与</text>
<text x="188" y="324" font-size="10.3" fill="#1e293b" text-anchor="middle">  野芭蕉 (M. balbisiana) 必须经蝙蝠或鸟类传粉受精</text>
<text x="188" y="342" font-size="10.3" fill="#1e293b" text-anchor="middle">  才能结果；黑籽硬如碎石，果肉只剩薄薄几丝。</text>
<rect x="36" y="360" width="304" height="88" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="48" y="380" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="700">🍌 植物学冷知识：香蕉是如假包换的【下位子房浆果】！</text>
<text x="48" y="398" font-size="10.0" fill="#1e293b" text-anchor="start">• 因为香蕉花子房长在花萼下方（跟黄瓜、蓝莓一样），</text>
<text x="48" y="415" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">  你剥掉的黄香蕉皮 = 外层【花筒 + 外果皮】愈合外衣；</text>
<text x="48" y="432" font-size="10.0" fill="#64748b" text-anchor="start">  撕皮时粘手的“白筋” = 给果实运糖的韧皮部维管束！</text>
<rect x="376" y="68" width="364" height="396" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="392.0" y="82.0" width="294" height="22" rx="11.0" fill="#fffbeb" stroke="#d97706" stroke-width="1" stroke-opacity="0.35"/>
<text x="539.0" y="97.0" font-size="11.2" fill="#d97706" text-anchor="middle" font-weight="600">现代栽培香牙蕉（三倍体 2n = 3x = 33）</text>
