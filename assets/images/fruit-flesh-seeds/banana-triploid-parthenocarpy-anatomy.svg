<circle cx="209" cy="221" r="2.2" fill="#64748b"/>
<circle cx="186" cy="236" r="9.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
<circle cx="183" cy="233" r="2.2" fill="#64748b"/>
<circle cx="154" cy="180" r="9.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
<circle cx="151" cy="177" r="2.2" fill="#64748b"/>
