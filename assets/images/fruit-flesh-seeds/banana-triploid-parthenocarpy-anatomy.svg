  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="483" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">香蕉也是浆果？为什么剥掉皮不见果核，只剩三排小黑点？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">野生香蕉满肚子碎牙硬黑籽；超市华蕉（AAA 三倍体）靠“单性结实 + 减数分裂卡壳”把种子全憋没了！</text>
<rect x="20" y="68" width="336" height="396" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="36.0" y="82.0" width="266" height="22" rx="11.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="169.0" y="97.0" font-size="11.2" fill="#475569" text-anchor="middle" font-weight="600">野生祖先芭蕉（二倍体 2n = 2x = 22）</text>
<circle cx="188" cy="198" r="68" fill="#fde047" stroke="#a16207" stroke-width="3.0"/>
<circle cx="188" cy="198" r="58" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.4"/>
