<circle cx="489.0" cy="193.3" r="1.9" fill="#78350f"/>
<circle cx="490.4" cy="190.8" r="1.9" fill="#78350f"/>
<line x1="562" y1="172" x2="604" y2="144" stroke="#ca8a04" stroke-width="1.4"/>
<text x="608" y="140" font-size="10.1" fill="#b45309" text-anchor="start" font-weight="700">黄皮：花筒+外果皮</text>
<text x="608" y="154" font-size="9.5" fill="#64748b" text-anchor="start">(剥掉不吃)</text>
<line x1="536" y1="204" x2="604" y2="196" stroke="#18794e" stroke-width="1.4"/>
<text x="608" y="192" font-size="10.1" fill="#18794e" text-anchor="start" font-weight="700">甜糯果肉：内层果皮</text>
<text x="608" y="206" font-size="9.5" fill="#64748b" text-anchor="start">(淀粉熟化转果糖/蔗糖)</text>
<line x1="512" y1="214" x2="604" y2="246" stroke="#78350f" stroke-width="1.4"/>
<text x="608" y="242" font-size="10.1" fill="#78350f" text-anchor="start" font-weight="700">中心三排小褐点：</text>
<text x="608" y="256" font-size="9.8" fill="#dc2626" text-anchor="start" font-weight="700">退化的未受精胚珠！</text>
<rect x="392" y="282" width="332" height="166" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="404" y="303" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">✨ 人类驯化史上的两记绝杀（约 7000 年前东南亚起源）：</text>
<text x="404" y="323" font-size="10.2" fill="#1e293b" text-anchor="start">① 单性结实突变 (Parthenocarpy)：子房不需要受精就能自己</text>
<text x="404" y="341" font-size="10.2" fill="#1e293b" text-anchor="start">   分泌生长素，让内果皮与胎座填满柔滑淀粉果肉；</text>
<text x="404" y="360" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="600">② 三倍体卡死减数分裂 (3x = 33)：每组染色体有 3 条，配对</text>
<text x="404" y="378" font-size="10.2" fill="#1e293b" text-anchor="start">   分家时 2:1 乱成一团，99.99% 胚珠刚起步就发育中止，</text>
<text x="404" y="396" font-size="10.2" fill="#d97706" text-anchor="start" font-weight="700">   只留下香蕉正中央那三排人畜无害的小褐点！（无籽西瓜同理）</text>
<text x="404" y="417" font-size="10.0" fill="#dc2626" text-anchor="start" font-weight="600">⚠️ 代价：没有种子只能靠地下吸芽无性克隆，全球华蕉基因</text>
<text x="404" y="434" font-size="10.0" fill="#1e293b" text-anchor="start">   几乎一模一样，面对热带枯萎病 TR4 真菌极其脆弱！</text>
</svg>
