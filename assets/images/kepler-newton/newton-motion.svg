<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1005" viewBox="0 0 720 1005" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">惯性、受力转弯与作用反作用</title><desc id="desc">圆轨道速度沿切线，引力朝圆心。质量比10比1的两体受力相等，加速度不同，质心靠近重者。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1005" fill="#f3f7fa"/><text x="36" y="52" font-size="30" fill="#172b45" text-anchor="start">牛顿：速度怎么变，先看合力</text><rect x="24" y="115" width="672" height="417" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="46" y="155" font-size="24" fill="#172b45" text-anchor="start">① 没有合力：沿切线直走，不必持续推着走</text><circle cx="275" cy="328" r="140" fill="none" stroke="#176786" stroke-width="3"/><circle cx="275.000" cy="328.000" r="14" fill="#b77a09"/><circle cx="415.000" cy="328.000" r="12" fill="#176786"/><path d="M415.000,328.000 L415.000,210.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M415.000,328.000 L305.000,328.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><path d="M415.000,210.000 L415.000,185.000" fill="none" stroke="#172b45" stroke-width="3" stroke-dasharray="7 6"/><text x="449" y="235" font-size="24" fill="#172b45" text-anchor="start">速度 v</text><text x="319" y="365" font-size="24" fill="#b34039" text-anchor="start">引力 F</text><text x="232" y="367" font-size="22" fill="#172b45" text-anchor="start">太阳</text><text x="46" y="501" font-size="24" fill="#172b45" text-anchor="start">② 有合力：F合 = ma；改方向，也属于加速</text><rect x="24" y="558" width="672" height="314" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="46" y="599" font-size="24" fill="#172b45" text-anchor="start">③ 作用与反作用：同样大，作用在不同物体</text><circle cx="180.000" cy="699.000" r="40" fill="#b77a09"/><circle cx="540.000" cy="699.000" r="18" fill="#176786"/><path d="M180.000,699.000 L285.000,699.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><path d="M540.000,699.000 L435.000,699.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><path d="M212.727,747.000 L212.727,771.000" fill="none" stroke="#172b45" stroke-width="3"/><text x="128" y="646" font-size="24" fill="#172b45" text-anchor="start">质量 10</text><text x="494" y="646" font-size="24" fill="#172b45" text-anchor="start">质量 1</text><text x="128" y="808" font-size="23" fill="#172b45" text-anchor="start">共同质心偏向重者</text><text x="393" y="808" font-size="23" fill="#172b45" text-anchor="start">轻者加速度是 10 倍</text><text x="46" y="852" font-size="22" fill="#172b45" text-anchor="start">双物体质量比为教学模型，不是太阳与地球的比例。</text><text x="36" y="917" font-size="24" fill="#172b45" text-anchor="start">万有引力另给规则：距离加倍，力变为 1/4。</text><text x="36" y="961" font-size="22" fill="#172b45" text-anchor="start">箭头只标方向；上图长度不用于比较速度和力。</text></svg>
