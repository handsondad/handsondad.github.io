<svg xmlns="http://www.w3.org/2000/svg" width="540" height="753.75" viewBox="0 0 540 753.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">惯性、受力转弯与作用反作用</title><desc id="desc">圆轨道速度沿切线，引力朝圆心。质量比10比1的两体受力相等，加速度不同，质心靠近重者。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="752.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.54" font-size="21.2" fill="#172b45" text-anchor="start" font-weight="700">牛顿：速度怎么变，先看合力</text><rect x="24" y="115" width="672" height="417" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="153.39" font-size="18.2" fill="#172b45" text-anchor="start">① 没有合力：沿切线直走，不必持续推着走</text><circle cx="275" cy="328" r="140" fill="none" stroke="#176786" stroke-width="3"/><circle cx="275.000" cy="328.000" r="14" fill="#b77a09"/><circle cx="415.000" cy="328.000" r="12" fill="#176786"/><path d="M415.000,328.000 L415.000,210.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M415.000,328.000 L305.000,328.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M415.000,210.000 L415.000,185.000" fill="none" stroke="#172b45" stroke-width="2.4" stroke-dasharray="7 6"/><text x="449" y="233.39" font-size="18.2" fill="#172b45" text-anchor="start">速度 v</text><text x="319" y="363.39" font-size="18.2" fill="#b34039" text-anchor="start">引力 F</text><text x="232" y="365.52" font-size="16.7" fill="#172b45" text-anchor="start">太阳</text><text x="46" y="499.39" font-size="18.2" fill="#172b45" text-anchor="start">② 有合力：F合 = ma；改方向，也属于加速</text><rect x="24" y="558" width="672" height="314" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="597.39" font-size="18.2" fill="#172b45" text-anchor="start">③ 作用与反作用：同样大，作用在不同物体</text><circle cx="180.000" cy="699.000" r="40" fill="#b77a09"/><circle cx="540.000" cy="699.000" r="18" fill="#176786"/><path d="M180.000,699.000 L285.000,699.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M540.000,699.000 L435.000,699.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M212.727,747.000 L212.727,771.000" fill="none" stroke="#172b45" stroke-width="2.4"/><text x="128" y="644.39" font-size="18.2" fill="#172b45" text-anchor="start">质量 10</text><text x="494" y="644.39" font-size="18.2" fill="#172b45" text-anchor="start">质量 1</text><text x="128" y="806.45" font-size="17.5" fill="#172b45" text-anchor="start">共同质心偏向重者</text><text x="393" y="806.45" font-size="17.5" fill="#172b45" text-anchor="start">轻者加速度是 10 倍</text><text x="46" y="850.52" font-size="16.7" fill="#172b45" text-anchor="start">双物体质量比为教学模型，不是太阳与地球的比例。</text><text x="36" y="915.39" font-size="18.2" fill="#172b45" text-anchor="start">万有引力另给规则：距离加倍，力变为 1/4。</text><text x="36" y="959.52" font-size="16.7" fill="#172b45" text-anchor="start">箭头只标方向；上图长度不用于比较速度和力。</text></g></svg>
