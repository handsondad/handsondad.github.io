<svg xmlns="http://www.w3.org/2000/svg" width="540" height="633.75" viewBox="0 0 540 633.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">半长轴与周期的平方立方关系</title><desc id="desc">半长轴1、2、4，对应周期1、约2.828、8；同一中心质量下T平方除a立方为常数。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="632.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">③ 轨道放大，周期不只同比放大</text><text x="36" y="92.45" font-size="17.5" fill="#172b45" text-anchor="start">同一中心天体；以第一条轨道的 a、T 为单位</text><rect x="24" y="142" width="672" height="148" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="178.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">半长轴 a = 1</text><path d="M48.000,212.000 L120.000,212.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="387" y="185.32" font-size="19.0" fill="#176786" text-anchor="start">周期 T ≈ 1.000</text><text x="387" y="231.45" font-size="17.5" fill="#172b45" text-anchor="start">T² = 1；a³ = 1</text><text x="46" y="267.52" font-size="16.7" fill="#172b45" text-anchor="start">线段长度代表半长轴，不是行星直径。</text><rect x="24" y="314" width="672" height="148" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="350.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">半长轴 a = 2</text><path d="M48.000,384.000 L192.000,384.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="387" y="357.32" font-size="19.0" fill="#176786" text-anchor="start">周期 T ≈ 2.828</text><text x="387" y="403.45" font-size="17.5" fill="#172b45" text-anchor="start">T² = 8；a³ = 8</text><text x="46" y="439.52" font-size="16.7" fill="#172b45" text-anchor="start">线段长度代表半长轴，不是行星直径。</text><rect x="24" y="486" width="672" height="148" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="522.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">半长轴 a = 4</text><path d="M48.000,556.000 L336.000,556.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="387" y="529.32" font-size="19.0" fill="#176786" text-anchor="start">周期 T ≈ 8.000</text><text x="387" y="575.45" font-size="17.5" fill="#172b45" text-anchor="start">T² = 64；a³ = 64</text><text x="46" y="611.52" font-size="16.7" fill="#172b45" text-anchor="start">线段长度代表半长轴，不是行星直径。</text><text x="36" y="708.39" font-size="18.2" fill="#172b45" text-anchor="start">距离放大 4 倍 → 引力加速度变为 1/16</text><text x="36" y="754.39" font-size="18.2" fill="#172b45" text-anchor="start">圆轨道速度变为 1/2 → 绕一圈需要 8 倍时间</text><text x="36" y="801.52" font-size="16.7" fill="#172b45" text-anchor="start">上面的一般周期规律适用椭圆；末两行用圆解释。</text></g></svg>
