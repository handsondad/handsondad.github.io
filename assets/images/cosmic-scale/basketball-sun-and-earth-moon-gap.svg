<svg xmlns="http://www.w3.org/2000/svg" width="760" height="586" viewBox="0 0 760 586" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">1比58亿篮球太阳微缩模型与地月远地点净空横排塞入其余七大行星真实比例图解</title>
<desc id="desc">上图将太阳缩为24厘米篮球，展示地球仅2.2毫米位于25.8米外，而最近恒星比邻星远在6931公里外；下图按1比1真实直径比例证明地月远地点表面净空397384公里足以并排容纳其余七大行星（赤道直径总和387941公里）。</desc>
