<text x="196.6" y="188.0" font-size="10.0" fill="#0d9488" text-anchor="middle" font-weight="700" class="halo">②地轨2AU</text>
<line x1="366.9" y1="152.0" x2="366.9" y2="137.0" stroke="#c25014" stroke-width="1.3"/>
<circle cx="366.9" cy="152.0" r="4.5" fill="#c25014" stroke="#ffffff" stroke-width="1.2"/>
<text x="366.9" y="132.0" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">③比邻星</text>
<line x1="512.0" y1="152.0" x2="512.0" y2="176.0" stroke="#1d6fa5" stroke-width="1.3"/>
<circle cx="512.0" cy="152.0" r="4.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.2"/>
<text x="512.0" y="188.0" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">④银河系</text>
<line x1="578.4" y1="152.0" x2="578.4" y2="137.0" stroke="#18794e" stroke-width="1.3"/>
<circle cx="578.4" cy="152.0" r="4.5" fill="#18794e" stroke="#ffffff" stroke-width="1.2"/>
<text x="578.4" y="132.0" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">⑤本星系群</text>
<line x1="635.4" y1="152.0" x2="635.4" y2="176.0" stroke="#c25014" stroke-width="1.3"/>
