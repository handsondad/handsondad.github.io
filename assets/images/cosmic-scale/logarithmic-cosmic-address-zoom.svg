    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes cosmicZoomSweep {
    0%   { transform: translateX(0px); opacity: 0.95; }
    12%  { transform: translateX(0px); opacity: 1; }
    88%  { transform: translateX(658px); opacity: 1; }
    100% { transform: translateX(658px); opacity: 0.92; }
  }
  .zoom-scanner {
    animation: cosmicZoomSweep 8.5s cubic-bezier(0.32, 0.04, 0.24, 1) 1 forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .zoom-scanner {
      animation: none !important;
      transform: translateX(658px);
    }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="545" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">三、你的完整“宇宙收货地址”：横跨 20 个数量级的对数标尺与“宏伟的终结”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">从地球直径 10⁷ m 一路放大 10²⁰ 倍到 930 亿光年可观测宇宙——为什么超过 3 亿光年后“套娃”突然停止了？</text>
