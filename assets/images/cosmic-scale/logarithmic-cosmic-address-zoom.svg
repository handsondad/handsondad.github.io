<text x="380.0" y="172.0" font-size="9.5" fill="#64748b" text-anchor="middle" class="mono">10^17</text>
<line x1="446.4" y1="146.0" x2="446.4" y2="158.0" stroke="#475569" stroke-width="1.2"/>
