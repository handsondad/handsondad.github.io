<text x="635.4" y="188.0" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">⑥拉尼亚凯亚</text>
<line x1="710.2" y1="152.0" x2="710.2" y2="137.0" stroke="#6d28d9" stroke-width="1.3"/>
<circle cx="710.2" cy="152.0" r="4.5" fill="#6d28d9" stroke="#ffffff" stroke-width="1.2"/>
<text x="710.2" y="132.0" font-size="10.0" fill="#6d28d9" text-anchor="end" font-weight="700" class="halo">⑦可观测视界</text>
<g class="zoom-scanner"><circle cx="51.5" cy="152.0" r="10.5" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4 2"/><polygon points="51.5,138.0 46.5,130.0 56.5,130.0" fill="#dc2626"/></g>
<text x="380" y="228" font-size="9.8" fill="#64748b" text-anchor="middle">提示：红色游标单次扫过 20 个数量级后停在可观测视界终点（930 亿光年）；关闭动态效果时直接停在终点。</text>
<rect x="20" y="254" width="232" height="132" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.1"/>
<text x="32" y="276" font-size="11.2" fill="#0d9488" text-anchor="start" font-weight="700">① 地月与太阳系疆域</text>
<text x="32" y="295" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">跨度：1.27万 km → ~2 光年</text>
<text x="32" y="318" font-size="10.0" fill="#1e293b" text-anchor="start">• 日球层顶 ≈ 120 AU (旅行者闯出点)</text>
<text x="32" y="338" font-size="10.0" fill="#1e293b" text-anchor="start">• 最外围奥尔特冰彗星云延伸至约</text>
<text x="32" y="358" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">  5万–10万 AU（约 0.8–1.6 光年）</text>
<rect x="264" y="254" width="232" height="132" rx="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="276" y="276" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">② 银河系（棒旋星系家园）</text>
<text x="276" y="295" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">直径 ≈ 10 万光年 (9.5×10²⁰ m)</text>
<text x="276" y="318" font-size="10.0" fill="#1e293b" text-anchor="start">• 含约 1,000亿–4,000亿颗恒星</text>
<text x="276" y="338" font-size="10.0" fill="#1e293b" text-anchor="start">• 太阳居猎户支臂，距银心 2.6万 ly</text>
<text x="276" y="358" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">• 绕银心一圈“银河年”≈ 2.3 亿年</text>
<rect x="508" y="254" width="232" height="132" rx="9" fill="#e7f6ee" stroke="#18794e" stroke-width="1.1"/>
<text x="520" y="276" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">③ 本星系群（引力束缚小村）</text>
<text x="520" y="295" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">直径 ≈ 1,000 万光年 (~3 Mpc)</text>
<text x="520" y="318" font-size="10.0" fill="#1e293b" text-anchor="start">• 仙女座 M31 + 银河系 + 三角座 M33</text>
<text x="520" y="338" font-size="10.0" fill="#1e293b" text-anchor="start">  三大旋涡星系领衔 60+ 矮星系</text>
<text x="520" y="358" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">• 总质量 ≈ 4×10¹² M☉（暗物质占大头）</text>
<rect x="20" y="398" width="232" height="132" rx="9" fill="#fef1e8" stroke="#c25014" stroke-width="1.1"/>
<text x="32" y="420" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">④ 拉尼亚凯亚超星系团</text>
<text x="32" y="439" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">直径 ≈ 5.2 亿光年 (160 Mpc)</text>
<text x="32" y="462" font-size="10.0" fill="#1e293b" text-anchor="start">• 2014 Tully 团队按本动速度流划定</text>
<text x="32" y="482" font-size="10.0" fill="#1e293b" text-anchor="start">• 囊括室女座团等约 10 万个大星系</text>
<text x="32" y="502" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">• 如山谷溪流汇聚向“巨引源”盆地</text>
<rect x="264" y="398" width="232" height="132" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.1"/>
<text x="276" y="420" font-size="11.2" fill="#475569" text-anchor="start" font-weight="700">⑤ 宇宙纤维网与巨型空洞</text>
<text x="276" y="439" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">单泡跨度 ≈ 1.5 亿–13.7 亿光年</text>
<text x="276" y="462" font-size="10.0" fill="#1e293b" text-anchor="start">• 90% 星系挤在不足 10% 体积的暗物质</text>
<text x="276" y="482" font-size="10.0" fill="#1e293b" text-anchor="start">  纤维丝与长城上（斯隆长城 13.7亿 ly）</text>
<text x="276" y="502" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">• 中间夹着直径 ~1.5 亿光年的巨型空洞</text>
<rect x="508" y="398" width="232" height="132" rx="9" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.1"/>
<text x="520" y="420" font-size="11.2" fill="#6d28d9" text-anchor="start" font-weight="700">⑥ 宏伟的终结 → 可观测宇宙</text>
<text x="520" y="439" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">均匀阈值 &gt;3.3 亿 ly → 全宽 930 亿 ly</text>
<text x="520" y="462" font-size="10.0" fill="#1e293b" text-anchor="start">• &gt;3.3 亿光年星系计数严格 N(R)∝R³，</text>
<text x="520" y="482" font-size="10.0" fill="#1e293b" text-anchor="start">  不再有更高一级套娃（各向同性海绵）</text>
<text x="520" y="502" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">• 平均每 4 m³ 仅摊到约 1 颗普通氢原子！</text>
</svg>
