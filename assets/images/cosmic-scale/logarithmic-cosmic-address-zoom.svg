<rect x="34.0" y="74.0" width="478" height="22" rx="11.0" fill="#f0fdfa" stroke="#0d9488" stroke-width="1" stroke-opacity="0.35"/>
<text x="273.0" y="89.0" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="600">A · 对数尺度标尺 log₁₀(空间跨度 / 米)：每向右走一格 = 尺度乘以 100 倍</text>
