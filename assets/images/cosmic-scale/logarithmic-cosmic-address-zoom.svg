<text x="712.0" y="172.0" font-size="9.5" fill="#64748b" text-anchor="middle" class="mono">10^27</text>
<line x1="51.5" y1="152.0" x2="51.5" y2="137.0" stroke="#1d6fa5" stroke-width="1.3"/>
<circle cx="51.5" cy="152.0" r="4.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.2"/>
<text x="51.5" y="132.0" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">①地球</text>
<line x1="196.6" y1="152.0" x2="196.6" y2="176.0" stroke="#0d9488" stroke-width="1.3"/>
