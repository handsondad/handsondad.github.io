<text x="488" y="133" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">① 正曲率闭合 (Ω_k &lt; 0)</text>
<text x="488" y="151" font-size="9.9" fill="#1e293b" text-anchor="start">三维超球面 · 有限但无边缘</text>
<text x="488" y="167" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">大三角内角和 &gt; 180°</text>
<rect x="412" y="184" width="314" height="62" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.1"/>
<path d="M 450,196 Q 438.0,215.0 426,234 Q 450,234.0 474,234 Q 462.0,215.0 450,196" fill="#ffffff" fill-opacity="0.7" stroke="#18794e" stroke-width="1.8"/>
<text x="488" y="205" font-size="10.6" fill="#18794e" text-anchor="start" font-weight="700">② 零曲率平直 (Ω_k = 0)</text>
<text x="488" y="223" font-size="9.9" fill="#1e293b" text-anchor="start">欧氏平直空间 · 可无限延伸</text>
<text x="488" y="239" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">大三角内角和 = 180°（实测吻合！）</text>
<rect x="412" y="256" width="314" height="62" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<path d="M 450,268 Q 442.8,287.0 426,306 Q 450,300.6 474,306 Q 457.2,287.0 450,268" fill="#ffffff" fill-opacity="0.7" stroke="#1d6fa5" stroke-width="1.8"/>
<text x="488" y="277" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">③ 负曲率开放 (Ω_k &gt; 0)</text>
<text x="488" y="295" font-size="9.9" fill="#1e293b" text-anchor="start">三维马鞍面 · 空间无限延伸</text>
<text x="488" y="311" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">大三角内角和 &lt; 180°</text>
<text x="412" y="338" font-size="10.6" fill="#6d28d9" text-anchor="start" font-weight="700">Planck 2018 + BAO 实测：Ω_k = 0.0007 ± 0.0019</text>
<rect x="20" y="362" width="720" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="372.0" width="486" height="22" rx="11.0" fill="#f0fdfa" stroke="#0d9488" stroke-width="1" stroke-opacity="0.35"/>
<text x="277.0" y="387.0" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="600">C · 终极尺度账本：整个宇宙至少有多大？930 亿光年里到底装了什么？</text>
<rect x="34.0" y="406.0" width="274.0" height="26" rx="4" fill="#6d28d9"/>
<rect x="308.0" y="406.0" width="106.4" height="26" fill="#2563eb"/>
<rect x="414.4" y="406.0" width="19.6" height="26" rx="3" fill="#f59e0b"/>
<text x="171.0" y="423.0" font-size="10.4" fill="#ffffff" text-anchor="middle" font-weight="700">暗能量 68.5%</text>
<text x="361.2" y="423.0" font-size="10.0" fill="#ffffff" text-anchor="middle" font-weight="700">暗物质 26.6%</text>
<text x="442.0" y="423.0" font-size="10.2" fill="#d97706" text-anchor="start" font-weight="700">普通原子仅 4.9%！</text>
<text x="34" y="452" font-size="10.1" fill="#1e293b" text-anchor="start">• 极致空旷：临界密度 ≈ 5.1 质子能量/m³；普通物质平均每 4 立方米才摊到 1 颗氢原子！</text>
<text x="34" y="471" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">• 整体下限：即便宇宙闭合，总体积也 &gt; 251 倍可观测体积（Vardanyan 等 2011；暴胀模型更远超 10⁷⁸ 倍）。</text>
