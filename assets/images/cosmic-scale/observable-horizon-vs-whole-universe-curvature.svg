<text x="260" y="199" font-size="9.6" fill="#f5d0fe" font-weight="700">外星观测者</text>
<text x="282" y="124" font-size="9.5" fill="#e9d5ff" text-anchor="middle">他的930亿ly视界</text>
<circle cx="144" cy="196" r="66.0" fill="#1d4ed8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="2.0"/>
<circle cx="144" cy="196" r="23.7" fill="#f59e0b" fill-opacity="0.22" stroke="#fbbf24" stroke-width="1.6"/>
