<svg xmlns="http://www.w3.org/2000/svg" width="760" height="496" viewBox="0 0 760 496" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">可观测宇宙465亿光年视界与165亿光年事件视界对比、普朗克CMB大三角空间曲率检验及宇宙组分图解</title>
<desc id="desc">左上对比地球与遥远外星人各自直径930亿光年的重叠可观测视界球及内部半径165亿光年的未来事件视界；右上图解正曲率、零曲率与负曲率空间大三角内角和及普朗克Ω_k=0.0007±0.0019实测；下方展示68.5%暗能量、26.6%暗物质、4.9%普通原子占比与闭合体积超251倍下限。</desc>
