<text x="144" y="211" font-size="9.6" fill="#ffffff" text-anchor="middle" font-weight="700">地球</text>
<text x="132" y="124" font-size="9.6" fill="#7dd3fc" text-anchor="middle" font-weight="700">可观测视界 R≈465亿ly</text>
<text x="144" y="236" font-size="9.5" fill="#fde047" text-anchor="middle" font-weight="700">事件视界≈167亿ly</text>
<text x="203" y="278" font-size="9.5" fill="#94a3b8" text-anchor="middle">← 视界之外并非悬崖，而是光尚未跑到的同类星海 →</text>
<text x="34" y="306" font-size="10.0" fill="#1e293b" text-anchor="start">• 过去视界（R≈465亿ly）：大爆炸至今光能到的最大范围；</text>
<text x="34" y="326" font-size="10.0" fill="#dc2626" text-anchor="start" font-weight="700">• 未来事件视界（R≈167亿ly，z≈1.87）：圈外星系今天</text>
<text x="34" y="343" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">  发出的光再也追不上暗能量加速膨胀，永远到不了地球！</text>
