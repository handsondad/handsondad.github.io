<rect x="0.5" y="0.5" width="759" height="495" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">五、直径 930 亿光年之外是什么？——视界不等于尽头，给整个宇宙量曲率</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">可观测宇宙只是光速来得及跑进我们眼睛的“海平线圆圈”；普朗克卫星测得空间平直到千分之二以内</text>
