<text x="358.4" y="297.1" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">光行回望 D_T</text>
<text x="369.5" y="344.9" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">角直径距离 D_A ↓</text>
