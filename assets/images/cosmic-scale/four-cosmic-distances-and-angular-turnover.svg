<title id="title">平坦ΛCDM宇宙四种距离随红移演化实算曲线与z大于1.6角直径反转放大镜效应图解</title>
<desc id="desc">左图精确积分绘制光度距离D_L、共动距离D_C、光行距离D_T与角直径距离D_A曲线，标出z=14.32星系的四个数值及D_A在z≈1.6处的58亿光年折返极值；右图直观解释更遥远星系因发光时距离仅22亿光年而在天空呈现更大视张角。</desc>
