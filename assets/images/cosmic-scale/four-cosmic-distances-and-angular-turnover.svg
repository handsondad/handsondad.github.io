<text x="610" y="132" font-size="9.6" fill="#fdba74" text-anchor="middle" font-weight="700">z=14.3 发光时仅距 22.1亿ly！</text>
<text x="610" y="268" font-size="9.5" fill="#fed7aa" text-anchor="middle" font-weight="700">同尺寸星系张角反增至≈3.1″</text>
<text x="494" y="310" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">为什么越远看着反而越大？（Hogg 1999）</text>
<text x="494" y="332" font-size="10.0" fill="#1e293b" text-anchor="start">① 日常静态房间里：D_A = D_C = D_L，</text>
<text x="494" y="351" font-size="10.0" fill="#1e293b" text-anchor="start">   东西越远，视角 θ = 直径 / D 越小；</text>
<text x="494" y="373" font-size="10.0" fill="#1e293b" text-anchor="start">② 但在膨胀宇宙里，决定天上张角的是</text>
<text x="494" y="392" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">   星系发光那一刻离我们的距离：</text>
<text x="494" y="412" font-size="10.6" fill="#dc2626" text-anchor="start" font-weight="700">   D_A = D_C / (1 + z)！</text>
<text x="494" y="434" font-size="10.0" fill="#1e293b" text-anchor="start">③ z &gt; 1.6 后宇宙当时太紧凑，发光点</text>
<text x="494" y="453" font-size="10.0" fill="#1e293b" text-anchor="start">   反而贴近早期我们，张开大视角定格</text>
<text x="494" y="472" font-size="10.0" fill="#6d28d9" text-anchor="start" font-weight="700">   至今——但表面亮度按 (1+z)⁴ 暴跌！</text>
</svg>
