<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">高维球薄壳集中效应与超立方体内切球体积占比坍缩图解</title>
<desc id="desc">左栏精确绘制1减0.99的n次方曲线，展示100维63.4%与500维99.3%体积集中在1%薄壳；右栏对比超立方体顶角距离根号n增长与内切球体积占比从二维78.54%跌至十维0.25%。</desc>
