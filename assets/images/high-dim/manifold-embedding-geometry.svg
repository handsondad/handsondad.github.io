<title id="title">高维流形假设与Embedding向量空间几何关系对比图</title>
<desc id="desc">左栏以二维截面展示高维像素空间中自然图像集中在低维流形上，对比穿过噪声的欧氏直线与沿流形的测地线；右栏展示Embedding空间中国王减男人加女人近似王后的平行四边形关系与余弦夹角。</desc>
