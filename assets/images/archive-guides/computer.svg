<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">按下 A，屏幕为什么会出现 A？</title><desc id="desc">简化的键盘输入、程序处理与显示过程。字符A的Unicode码点为65，八位二进制表示是01000001，但键盘事件本身并不直接发送这个字符编码。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">按下 A，屏幕为什么会出现 A？</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">① 输入：键盘产生按键事件</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">系统结合键盘布局、修饰键和输入法解释</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:0s" d="M360,170 L360,190" pathLength="1" fill="none" stroke="#e18c20" stroke-width="5"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">② 处理：程序更新文本与内存</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">A 的码点是 65；8 位写作 01000001</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:1s" d="M360,290 L360,310" pathLength="1" fill="none" stroke="#e18c20" stroke-width="5"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">③ 输出：字体字形被绘制成像素</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">编码不是字的照片；显示还需要字形和布局</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">逻辑层示意：省略硬件中断、缓存和图形渲染细节。</text></svg>
