<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="370.5" viewBox="0 0 561.6 370.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">AI 小实验：先猜边界，再看训练</title><desc id="desc">① 选数据：圆环还是螺旋？：TensorFlow Playground 有预设数据，不必手绘；② 做比较：只改变一项设置：固定数据与其他参数，比较训练和测试误差；③ 找边界：训练好，不等于处处好：多试几次随机初始化；不上传儿童个人资料</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="369" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">AI 小实验：先猜边界，再看训练</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="107.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">① 选数据：圆环还是螺旋？</text><text x="48" y="139.53" font-size="15.8" text-anchor="start" fill="#16324f">TensorFlow Playground 有预设数据，不必手绘</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="227.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">② 做比较：只改变一项设置</text><text x="48" y="259.53" font-size="15.8" text-anchor="start" fill="#16324f">固定数据与其他参数，比较训练和测试误差</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="347.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">③ 找边界：训练好，不等于处处好</text><text x="48" y="379.53" font-size="15.8" text-anchor="start" fill="#16324f">多试几次随机初始化；不上传儿童个人资料</text><text x="30" y="450.82" font-size="14.8" text-anchor="start" fill="#16324f">模型图展示数值计算，不是读取机器的主观想法。</text></g></svg>
