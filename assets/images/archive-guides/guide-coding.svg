<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">编程第一课：让角色走出一个正方形</title><desc id="desc">① 预测：走一步，再转 90°：Scratch：移动 50 步，右转 90 度；② 重复：把两条积木重复 4 次：先在纸上画路线，再让角色验证；③ 调试：如果改成 3 次或 5 次？：观察终点与朝向；错误也是一条线索</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">编程第一课：让角色走出一个正方形</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">① 预测：走一步，再转 90°</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">Scratch：移动 50 步，右转 90 度</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">② 重复：把两条积木重复 4 次</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">先在纸上画路线，再让角色验证</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">③ 调试：如果改成 3 次或 5 次？</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">观察终点与朝向；错误也是一条线索</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">积木数值是示例；先复位位置和方向再比较。</text></svg>
