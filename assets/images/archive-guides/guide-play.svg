<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="370.5" viewBox="0 0 561.6 370.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">十个网站，不如完成一次共同探索</title><desc id="desc">先选：今晚只解决一个小问题：故事 → 讲结局；天气 → 比两个城市；再做：给孩子一个能动手的任务：JRMF 摆一题；植物建模改一个参数；最后：关掉网页，带走一个作品：一张图、一段复述，或明天去公园的问题</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="369" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">十个网站，不如完成一次共同探索</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="107.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">先选：今晚只解决一个小问题</text><text x="48" y="139.53" font-size="15.8" text-anchor="start" fill="#16324f">故事 → 讲结局；天气 → 比两个城市</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="227.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">再做：给孩子一个能动手的任务</text><text x="48" y="259.53" font-size="15.8" text-anchor="start" fill="#16324f">JRMF 摆一题；植物建模改一个参数</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="347.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">最后：关掉网页，带走一个作品</text><text x="48" y="379.53" font-size="15.8" text-anchor="start" fill="#16324f">一张图、一段复述，或明天去公园的问题</text><text x="30" y="450.82" font-size="14.8" text-anchor="start" fill="#16324f">年龄只是选题建议；账号、收费和隐私需家长先检查。</text></g></svg>
