<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">十个网站，不如完成一次共同探索</title><desc id="desc">先选：今晚只解决一个小问题：故事 → 讲结局；天气 → 比两个城市；再做：给孩子一个能动手的任务：JRMF 摆一题；植物建模改一个参数；最后：关掉网页，带走一个作品：一张图、一段复述，或明天去公园的问题</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">十个网站，不如完成一次共同探索</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">先选：今晚只解决一个小问题</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">故事 → 讲结局；天气 → 比两个城市</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">再做：给孩子一个能动手的任务</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">JRMF 摆一题；植物建模改一个参数</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">最后：关掉网页，带走一个作品</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">一张图、一段复述，或明天去公园的问题</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">年龄只是选题建议；账号、收费和隐私需家长先检查。</text></svg>
