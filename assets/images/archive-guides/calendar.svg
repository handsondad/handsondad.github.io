<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">太阳和月亮，并没有把时钟对齐</title><desc id="desc">平均12个朔望月354.3672天，回归年365.2422天，差10.875天。柱长使用相同比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="500" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">太阳和月亮，并没有把时钟对齐</text><text x="30" y="100" font-size="25" text-anchor="start" fill="#16324f">12 个平均朔望月</text><rect x="30" y="120" width="602.424" height="55" rx="8" fill="#66a8c0"/><text x="48" y="156" font-size="25" text-anchor="start" fill="#fff">354.3672 天</text><text x="30" y="225" font-size="25" text-anchor="start" fill="#16324f">1 个平均回归年</text><rect x="30" y="245" width="620.912" height="55" rx="8" fill="#177e89"/><text x="48" y="281" font-size="25" text-anchor="start" fill="#fff">365.2422 天</text><text x="30" y="355" font-size="25" text-anchor="start" fill="#16324f">每年约差 10.875 天，差距会逐年累积。</text><text x="30" y="410" font-size="24" text-anchor="start" fill="#16324f">闰月补的是“月”，公历闰年补的是“日”。</text><text x="30" y="465" font-size="21" text-anchor="start" fill="#16324f">柱长按天数计算；19 年 7 闰只是近似协调。</text></svg>
