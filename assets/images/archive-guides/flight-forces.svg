<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">飞机不是被一股神秘力量托起来的</title><desc id="desc">平直匀速飞行时的四力平衡示意，箭头不表示实际力值。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="540" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">飞机不是被一股神秘力量托起来的</text><path d="M180,255 L530,245 L555,261 L395,278 L270,274 Z" fill="#bed2df" stroke="#16324f" stroke-width="3"/><path d="M325,260 L277,302 L385,271" fill="#8bb4cc"/><path d="M360,232 L360,95" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path d="M360,292 L360,429" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path d="M535,260 L675,260" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path d="M185,260 L45,260" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><text x="380" y="120" font-size="25" text-anchor="start" fill="#16324f">升力</text><text x="380" y="415" font-size="25" text-anchor="start" fill="#16324f">重力</text><text x="570" y="236" font-size="25" text-anchor="start" fill="#16324f">推力</text><text x="55" y="236" font-size="25" text-anchor="start" fill="#16324f">阻力</text><text x="30" y="475" font-size="24" text-anchor="start" fill="#16324f">平直匀速飞行：升力 = 重力，推力 = 阻力</text><text x="30" y="510" font-size="20" text-anchor="start" fill="#16324f">示意：升力垂直来流；滑翔时受力方向不同。</text></svg>
