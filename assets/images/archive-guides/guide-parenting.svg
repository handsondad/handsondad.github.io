<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">育儿信息，不按星级选，按问题选</title><desc id="desc">健康与发展担忧 → 儿保或儿科：带上具体观察；网络清单不能替代专业评估；日常陪伴怎么做 → 可信机构指南：先选一条适合家庭的建议，而非下载十张量表；理念怎么讨论 → 书籍与家人对话：经典书也有时代局限；安全建议以现行指南为准</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">育儿信息，不按星级选，按问题选</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">健康与发展担忧 → 儿保或儿科</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">带上具体观察；网络清单不能替代专业评估</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">日常陪伴怎么做 → 可信机构指南</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">先选一条适合家庭的建议，而非下载十张量表</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">理念怎么讨论 → 书籍与家人对话</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">经典书也有时代局限；安全建议以现行指南为准</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">这是信息分流，不是诊断流程；紧急情况应及时就医。</text></svg>
