<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">相似的能量办法，不同的膜与空间</title><desc id="desc">上图为叶绿体，氢离子在类囊体腔积累，经ATP合酶回流基质。下图为线粒体，氢离子在膜间隙积累，经ATP合酶回流线粒体基质。两者方向按各自空间定义，箭头时长不代表生物速率。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="690" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">相似的能量办法，不同的膜与空间</text><text x="30" y="85" font-size="26" text-anchor="start" fill="#16324f">叶绿体｜类囊体膜</text><rect x="30" y="97" width="660" height="180" rx="8" fill="#eaf3f8"/><rect x="30" y="179" width="660" height="12" fill="#bed2df"/><text x="45" y="129" font-size="22" text-anchor="start" fill="#16324f">类囊体腔：H⁺积累</text><text x="45" y="261" font-size="22" text-anchor="start" fill="#16324f">叶绿体基质</text><text x="360" y="142" font-size="22" text-anchor="start" fill="#16324f">H⁺</text><text x="405" y="142" font-size="22" text-anchor="start" fill="#16324f">H⁺</text><text x="450" y="142" font-size="22" text-anchor="start" fill="#16324f">H⁺</text><text x="495" y="142" font-size="22" text-anchor="start" fill="#16324f">H⁺</text><text x="540" y="142" font-size="22" text-anchor="start" fill="#16324f">H⁺</text><text x="585" y="142" font-size="22" text-anchor="start" fill="#16324f">H⁺</text><text x="630" y="142" font-size="22" text-anchor="start" fill="#16324f">H⁺</text><rect x="520" y="169" width="30" height="48" rx="8" fill="#8bb4cc"/><path d="M290,232 L290,149" fill="none" stroke="#177e89" 