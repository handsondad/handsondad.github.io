<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="538.2" viewBox="0 0 561.6 538.2" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">相似的能量办法，不同的膜与空间</title><desc id="desc">上图为叶绿体，氢离子在类囊体腔积累，经ATP合酶回流基质。下图为线粒体，氢离子在膜间隙积累，经ATP合酶回流线粒体基质。两者方向按各自空间定义，箭头时长不代表生物速率。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="536.7" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">相似的能量办法，不同的膜与空间</text><text x="30" y="83.03" font-size="19.0" text-anchor="start" fill="#16324f" font-weight="600">叶绿体｜类囊体膜</text><rect x="30" y="97" width="660" height="180" rx="8" fill="#eaf3f8"/><rect x="30" y="179" width="660" height="12" fill="#bed2df"/><text x="45" y="127.46" font-size="16.5" text-anchor="start" fill="#16324f">类囊体腔：H⁺积累</text><text x="45" y="259.46" font-size="16.5" text-anchor="start" fill="#16324f">叶绿体基质</text><text x="360" y="140.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="405" y="140.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="450" y="140.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="495" y="140.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="540" y="140.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="585" y="140.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="630" y="140.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><rect x="520" y="169" width="30" height="48" rx="8" fill="#8bb4cc"/><path d="M290,232 L290,149" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:0s" d="M290,232 L290,149" pathLength="1" fill="none" stroke="#e18c20" stroke-width="3.4"/><path d="M535,149 L535,232" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:1s" d="M535,149 L535,232" pathLength="1" fill="none" stroke="#e18c20" stroke-width="3.4"/><text x="45" y="318.46" font-size="16.5" text-anchor="start" fill="#16324f">建立梯度：基质 → 腔</text><text x="360" y="318.53" font-size="15.8" text-anchor="start" fill="#16324f">合成 ATP：腔 → 基质</text><text x="555" y="223.46" font-size="16.5" text-anchor="start" fill="#16324f">ATP 合酶</text><text x="30" y="368.03" font-size="19.0" text-anchor="start" fill="#16324f" font-weight="600">线粒体｜内膜</text><rect x="30" y="382" width="660" height="180" rx="8" fill="#eaf3f8"/><rect x="30" y="464" width="660" height="12" fill="#bed2df"/><text x="45" y="412.46" font-size="16.5" text-anchor="start" fill="#16324f">膜间隙：H⁺积累</text><text x="45" y="544.46" font-size="16.5" text-anchor="start" fill="#16324f">线粒体基质</text><text x="360" y="425.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="405" y="425.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="450" y="425.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="495" y="425.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="540" y="425.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="585" y="425.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><text x="630" y="425.46" font-size="16.5" text-anchor="start" fill="#16324f">H⁺</text><rect x="520" y="454" width="30" height="48" rx="8" fill="#8bb4cc"/><path d="M290,517 L290,434" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:2s" d="M290,517 L290,434" pathLength="1" fill="none" stroke="#e18c20" stroke-width="3.4"/><path d="M535,434 L535,517" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:3s" d="M535,434 L535,517" pathLength="1" fill="none" stroke="#e18c20" stroke-width="3.4"/><text x="45" y="603.46" font-size="16.5" text-anchor="start" fill="#16324f">建立梯度：基质 → 膜间隙</text><text x="360" y="603.53" font-size="15.8" text-anchor="start" fill="#16324f">合成 ATP：膜间隙 → 基质</text><text x="555" y="508.46" font-size="16.5" text-anchor="start" fill="#16324f">ATP 合酶</text><text x="30" y="658.53" font-size="15.8" text-anchor="start" fill="#16324f">H⁺示意，不表示实际浓度；两套膜系统并不相同。</text></g></svg>
