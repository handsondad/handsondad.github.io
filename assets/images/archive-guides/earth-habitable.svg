<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="370.5" viewBox="0 0 561.6 370.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">宜居不是集齐勋章，就自动长出生命</title><desc id="desc">液态水、化学原料和能量供给是研究已知生命的线索，宜居条件不等于生命起源的充分条件。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="369" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">宜居不是集齐勋章，就自动长出生命</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="107.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">线索一：液态水与合适的环境</text><text x="48" y="139.53" font-size="15.8" text-anchor="start" fill="#16324f">温度和压力一起决定水能否长期保持液态</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="227.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">线索二：原料与可利用的能量</text><text x="48" y="259.53" font-size="15.8" text-anchor="start" fill="#16324f">碳等元素 + 阳光或化学反应提供的能量</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="347.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">开放问题：生命最初怎样出现？</text><text x="48" y="379.53" font-size="15.8" text-anchor="start" fill="#16324f">地球提供了实例，但还没有完整起源答案</text><text x="30" y="450.82" font-size="14.8" text-anchor="start" fill="#16324f">这是阅读层次，不是先后发生的三步，也不是概率计算。</text></g></svg>
