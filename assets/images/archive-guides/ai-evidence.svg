<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="370.5" viewBox="0 0 561.6 370.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">遇到一句 AI 预言，先分清它是哪一层</title><desc id="desc">区分观察、预测和个人选择：具体模型表现需要测试，未来预测带有条件，个人选择涉及价值判断。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="369" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">遇到一句 AI 预言，先分清它是哪一层</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="107.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">① 观察：这次真的发生了什么？</text><text x="48" y="139.53" font-size="15.8" text-anchor="start" fill="#16324f">具体模型、具体任务、可复查的输入和结果</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="227.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">② 推断：成立需要哪些条件？</text><text x="48" y="259.53" font-size="15.8" text-anchor="start" fill="#16324f">从一次成功，不能跳到“所有工作都会消失”</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="347.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">③ 选择：我们愿意怎样使用？</text><text x="48" y="379.53" font-size="15.8" text-anchor="start" fill="#16324f">让工具扩展尝试，而不是替我们承担责任</text><text x="30" y="450.82" font-size="14.8" text-anchor="start" fill="#16324f">每向下一层，都要补一层理由；这不是历史时间线。</text></g></svg>
