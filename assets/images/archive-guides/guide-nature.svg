<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">从“软件说像”到“我有证据”</title><desc id="desc">① 观察：先记录，不惊扰：外形、时间、环境；远距离拍照；② 比对：识别结果只是候选：找两项可见特征；不确定就保留不确定；③ 分享：保护生物，也保护孩子：隐藏住宅学校位置；不公开敏感物种坐标</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">从“软件说像”到“我有证据”</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">① 观察：先记录，不惊扰</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">外形、时间、环境；远距离拍照</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">② 比对：识别结果只是候选</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">找两项可见特征；不确定就保留不确定</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">③ 分享：保护生物，也保护孩子</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">隐藏住宅学校位置；不公开敏感物种坐标</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">不捕捉、不投喂、不用鸟声诱鸟；不要凭识别结果食用。</text></svg>
