<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">一缕阳光，经历两种不同的旅程</title><desc id="desc">核心聚变释放能量，能量经辐射区和对流区到光球，再经真空约499秒到地球。非等比例，动画不是实际速度。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">一缕阳光，经历两种不同的旅程</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">① 核心：氢聚变成氦</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">质量差对应能量；不是煤炭在燃烧</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:0s" d="M360,170 L360,190" pathLength="1" fill="none" stroke="#e18c20" stroke-width="5"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">② 内部：辐射输运 → 对流输运</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">吸收、再发射与散射；不是同一光子的履历</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:1s" d="M360,290 L360,310" pathLength="1" fill="none" stroke="#e18c20" stroke-width="5"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">③ 光球 → 地球：约 8 分 19 秒</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">离开太阳后，穿过约 1.496 亿千米</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">箭头依次描出一次；时间和距离均非等比例。</text></svg>
