<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="370.5" viewBox="0 0 561.6 370.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">一缕阳光，经历两种不同的旅程</title><desc id="desc">核心聚变释放能量，能量经辐射区和对流区到光球，再经真空约499秒到地球。非等比例，动画不是实际速度。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="369" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">一缕阳光，经历两种不同的旅程</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="107.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">① 核心：氢聚变成氦</text><text x="48" y="139.53" font-size="15.8" text-anchor="start" fill="#16324f">质量差对应能量；不是煤炭在燃烧</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:0s" d="M360,170 L360,190" pathLength="1" fill="none" stroke="#e18c20" stroke-width="3.4"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="227.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">② 内部：辐射输运 → 对流输运</text><text x="48" y="259.53" font-size="15.8" text-anchor="start" fill="#16324f">吸收、再发射与散射；不是同一光子的履历</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:1s" d="M360,290 L360,310" pathLength="1" fill="none" stroke="#e18c20" stroke-width="3.4"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="347.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">③ 光球 → 地球：约 8 分 19 秒</text><text x="48" y="379.53" font-size="15.8" text-anchor="start" fill="#16324f">离开太阳后，穿过约 1.496 亿千米</text><text x="30" y="450.82" font-size="14.8" text-anchor="start" fill="#16324f">箭头依次描出一次；时间和距离均非等比例。</text></g></svg>
