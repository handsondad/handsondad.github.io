<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">资源地图：按今天的问题入场</title><desc id="desc">想解释一个现象 → 科学与数学：PhET / OpenStax / GeoGebra：先猜再验证；想完成一个作品 → 编程与艺术：Scratch / 博物馆藏品：做一件小作品；想查一条信息 → 百科与机构：找原始出处、日期和适用条件，不只看排名</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">资源地图：按今天的问题入场</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">想解释一个现象 → 科学与数学</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">PhET / OpenStax / GeoGebra：先猜再验证</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">想完成一个作品 → 编程与艺术</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">Scratch / 博物馆藏品：做一件小作品</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">想查一条信息 → 百科与机构</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">找原始出处、日期和适用条件，不只看排名</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">导航不是质量保证；免费阅读不等于免费课程或转载权。</text></svg>
