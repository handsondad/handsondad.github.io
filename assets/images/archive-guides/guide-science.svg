<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="370.5" viewBox="0 0 561.6 370.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">把模拟器玩成一场小实验</title><desc id="desc">① 先猜：投射角越大，落点越远？：先写下猜测；在相同条件下比较；② 再改：只改变一个变量：理想无空气阻力、同高落地时比较 30°/45°/60°；③ 最后解释：模型省略了什么？：现实有风、阻力和不同的起落高度</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="369" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">把模拟器玩成一场小实验</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="107.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">① 先猜：投射角越大，落点越远？</text><text x="48" y="139.53" font-size="15.8" text-anchor="start" fill="#16324f">先写下猜测；在相同条件下比较</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="227.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">② 再改：只改变一个变量</text><text x="48" y="259.53" font-size="15.8" text-anchor="start" fill="#16324f">理想无空气阻力、同高落地时比较 30°/45°/60°</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="347.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">③ 最后解释：模型省略了什么？</text><text x="48" y="379.53" font-size="15.8" text-anchor="start" fill="#16324f">现实有风、阻力和不同的起落高度</text><text x="30" y="450.82" font-size="14.8" text-anchor="start" fill="#16324f">可在 oPhysics 选投射运动；先确认模拟的假设。</text></g></svg>
