<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">叶子有两份账：能量账与碳账</title><desc id="desc">光反应利用光和水产生氧气、ATP、NADPH；卡尔文循环每固定3个二氧化碳净产1个三碳G3P，消耗9ATP和6NADPH。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">叶子有两份账：能量账与碳账</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">① 光反应｜类囊体膜</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">光 + 水 → 氧气；同时形成 ATP、NADPH</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:0s" d="M360,170 L360,190" pathLength="1" fill="none" stroke="#e18c20" stroke-width="5"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">② 卡尔文循环｜叶绿体基质</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">3 CO₂ + 9 ATP + 6 NADPH → 净产 1 G3P</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:1s" d="M360,290 L360,310" pathLength="1" fill="none" stroke="#e18c20" stroke-width="5"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">③ 碳去了哪里？</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">3 个碳 → 1 个三碳 G3P → 糖及其他有机物</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">第二行省略辅产物；是物料摘要，不是完整化学方程式。</text></svg>
