<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="370.5" viewBox="0 0 561.6 370.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">叶子有两份账：能量账与碳账</title><desc id="desc">光反应利用光和水产生氧气、ATP、NADPH；卡尔文循环每固定3个二氧化碳净产1个三碳G3P，消耗9ATP和6NADPH。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="369" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">叶子有两份账：能量账与碳账</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="107.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">① 光反应｜类囊体膜</text><text x="48" y="139.53" font-size="15.8" text-anchor="start" fill="#16324f">光 + 水 → 氧气；同时形成 ATP、NADPH</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:0s" d="M360,170 L360,190" pathLength="1" fill="none" stroke="#e18c20" stroke-width="3.4"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="227.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">② 卡尔文循环｜叶绿体基质</text><text x="48" y="259.53" font-size="15.8" text-anchor="start" fill="#16324f">3 CO₂ + 9 ATP + 6 NADPH → 净产 1 G3P</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:1s" d="M360,290 L360,310" pathLength="1" fill="none" stroke="#e18c20" stroke-width="3.4"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="347.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">③ 碳去了哪里？</text><text x="48" y="379.53" font-size="15.8" text-anchor="start" fill="#16324f">3 个碳 → 1 个三碳 G3P → 糖及其他有机物</text><text x="30" y="450.82" font-size="14.8" text-anchor="start" fill="#16324f">第二行省略辅产物；是物料摘要，不是完整化学方程式。</text></g></svg>
