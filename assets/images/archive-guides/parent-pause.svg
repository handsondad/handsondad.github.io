<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="370.5" viewBox="0 0 561.6 370.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">不必立刻成为完美父母</title><desc id="desc">给照护者的非诊断性自我提醒：先确保孩子安全，再辨认自己的感受，必要时寻求支持。这不是固定发展阶段。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="369" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">不必立刻成为完美父母</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="107.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">停一下：先照顾安全</text><text x="48" y="139.53" font-size="15.8" text-anchor="start" fill="#16324f">累了可以求助；不要把忍到极限当作责任</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="227.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">说具体：看见当下</text><text x="48" y="259.53" font-size="15.8" text-anchor="start" fill="#16324f">“我现在很疲惫”，比“我不是好父母”更准确</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="347.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">做一件小事：给关系留空间</text><text x="48" y="379.53" font-size="15.8" text-anchor="start" fill="#16324f">陪伴、休息、轮换照护，都可以是下一步</text><text x="30" y="450.82" font-size="14.8" text-anchor="start" fill="#16324f">这是自我提醒，不是心理评估或治疗方法。</text></g></svg>
