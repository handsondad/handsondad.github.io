<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">看一件文物，也能像侦探办案</title><desc id="desc">① 先看图：只描述你真的看见的：颜色、形状、材料；暂时不猜故事；② 再读著录：把猜测和记录对照：年代、用途、出处；区分事实与推测；③ 留一个问题：换一件作品比较：同样是瓶子，不同时期为什么长得不同？</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">看一件文物，也能像侦探办案</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">① 先看图：只描述你真的看见的</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">颜色、形状、材料；暂时不猜故事</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">② 再读著录：把猜测和记录对照</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">年代、用途、出处；区分事实与推测</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">③ 留一个问题：换一件作品比较</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">同样是瓶子，不同时期为什么长得不同？</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">馆藏总数不等于全部高清公开；下载复用须看授权。</text></svg>
