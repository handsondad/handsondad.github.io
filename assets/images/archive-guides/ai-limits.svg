<svg xmlns="http://www.w3.org/2000/svg" width="561.6" height="370.5" viewBox="0 0 561.6 370.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">三种“做不到”，不要混成一句话</title><desc id="desc">逻辑不可判定、现实资源不足、现有模型表现差是不同限制。标准量子计算不消除不可判定性。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="560.1" height="369" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.78)"><text x="30" y="40.73" font-size="19.9" text-anchor="start" fill="#16324f" font-weight="700">三种“做不到”，不要混成一句话</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="107.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">逻辑边界：不存在包办全部情况的算法</text><text x="48" y="139.53" font-size="15.8" text-anchor="start" fill="#16324f">停机问题：不能对任意程序与输入都正确判定</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="227.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">资源边界：理论可算，现实未必算得动</text><text x="48" y="259.53" font-size="15.8" text-anchor="start" fill="#16324f">密码学安全要写清假设、攻击模型与资源</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="347.11" font-size="18.2" text-anchor="start" fill="#16324f" font-weight="600">当前能力：这个模型这一次没做好</text><text x="48" y="379.53" font-size="15.8" text-anchor="start" fill="#16324f">可通过更好的模型、工具和验证改善</text><text x="30" y="450.82" font-size="14.8" text-anchor="start" fill="#16324f">三类限制不是包含关系，也不是性能排行榜。</text></g></svg>
