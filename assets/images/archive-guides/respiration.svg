<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 475" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">跟着 6 个碳，走完细胞里的拆包之旅</title><desc id="desc">一分子葡萄糖经糖酵解变成两个三碳丙酮酸，再变成两个二碳乙酰辅酶A并释放两个二氧化碳；循环再释放四个二氧化碳。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#177e89" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="475" rx="16" fill="#f7fafc"/><text x="30" y="43" font-size="28" text-anchor="start" fill="#16324f">跟着 6 个碳，走完细胞里的拆包之旅</text><rect x="30" y="75" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="109" font-size="25" text-anchor="start" fill="#16324f">① 糖酵解｜细胞质基质</text><text x="48" y="141" font-size="21" text-anchor="start" fill="#16324f">6 碳 → 2 × 3 碳丙酮酸；净得 2 ATP</text><path d="M360,170 L360,190" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:0s" d="M360,170 L360,190" pathLength="1" fill="none" stroke="#e18c20" stroke-width="5"/><rect x="30" y="195" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="229" font-size="25" text-anchor="start" fill="#16324f">② 丙酮酸氧化 → 三羧酸循环</text><text x="48" y="261" font-size="21" text-anchor="start" fill="#16324f">2 × 3 碳 → 2 × 2 碳 + 2 CO₂ → 再释 4 CO₂</text><path d="M360,290 L360,310" fill="none" stroke="#177e89" stroke-width="4" marker-end="url(#arrow)"/><path class="trace" style="animation-delay:1s" d="M360,290 L360,310" pathLength="1" fill="none" stroke="#e18c20" stroke-width="5"/><rect x="30" y="315" width="660" height="90" rx="12" fill="#eaf3f8" stroke="#bed2df"/><text x="48" y="349" font-size="25" text-anchor="start" fill="#16324f">③ 电子传递链 → ATP 合酶</text><text x="48" y="381" font-size="21" text-anchor="start" fill="#16324f">氧气最终接电子形成水；大部分 ATP 在此形成</text><text x="30" y="452" font-size="19" text-anchor="start" fill="#16324f">按每分子葡萄糖计；第三步的电子来自前面各步。</text></svg>
