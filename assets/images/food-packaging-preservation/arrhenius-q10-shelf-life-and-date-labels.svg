<text x="432" y="154" font-size="11.5" fill="#1e293b" text-anchor="start">饼干/罐头/干面：代表风味酥脆度保持巅峰的期限；</text>
<text x="432" y="175" font-size="11.5" fill="#475569" text-anchor="start">未破损受潮超期几天并非剧毒（误丢占家庭浪费 20%）。</text>
<line x1="432" y1="192" x2="714" y2="192" stroke="#cbd5e1" stroke-width="1"/>
<text x="432" y="214" font-size="12.0" fill="#be123c" text-anchor="start" font-weight="700">② 安全食用期（Use By · 安全悬崖红线！）</text>
<text x="432" y="236" font-size="11.5" fill="#1e293b" text-anchor="start">冷鲜即食熟肉/鲜切沙拉/婴儿配方粉：嗜冷李斯特菌</text>
<text x="432" y="257" font-size="11.5" fill="#be123c" text-anchor="start" font-weight="700">可在 4°C 暗中增殖且不酸臭，超期必须果断丢弃！</text>
<text x="420" y="308" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">看到包装鼓包（胀袋/胖听），到底能不能吃？</text>
