<text x="46" y="418" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">防潮保质期工程公式（为什么大包装比小袋耐放？）：</text>
<text x="46" y="442" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">ts = Ws · (Mc − Mi) / (WVTR · A · Δp / p_std)</text>
<text x="46" y="466" font-size="11.5" fill="#1e293b" text-anchor="start">• 干重 Ws 翻倍而袋面积 A 仅增 1.6 倍 ⇒ 寿命自动拉长；</text>
<text x="46" y="488" font-size="11.5" fill="#1e293b" text-anchor="start">• 酷暑盛夏每升温 10 °C 寿命缩水至 1/2–1/3，</text>
<text x="46" y="510" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">  因此“阴凉避光干燥处”是实打实的动力学参数！</text>
