<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">三、薄如发丝却挡住整年阳光氧气：六层无菌纸砖与“怕水阻氧夹心膜”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">没有全能单层塑料：聚烯烃防水漏氧，极性 EVOH 挡氧怕湿；多层复合与 6.3 µm 铝箔各司其职</text>
