<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">食品水分活度全局稳定性曲线与多因子栅栏保质技术示意图</title>
<desc id="desc">上图绘制自由水逃逸压水分活度 aw 从 0 到 1 区间内四类腐败反应速率及吸附等温线：细菌在 0.85 以下受阻，一切微生物在 0.60 以下彻底停摆，但脂质氧化在过干区(aw 小于 0.20)反常回升，使 aw 约 0.25 至 0.35 成为干制品单分子水膜黄金稳态窗；下图展示栅栏技术通过轻度加热、温和控水、微调酸度与脱氧包装四道温和关卡接力耗尽微生物稳态能量。</desc>
