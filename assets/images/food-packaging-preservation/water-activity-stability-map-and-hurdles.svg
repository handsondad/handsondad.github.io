<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">决定腐败的不是总含水量而是自由水逃逸压 aw = p / p0：aw &lt; 0.60 锁死一切微生物，但 aw &lt; 0.20 反而加速油脂酸败</text>
