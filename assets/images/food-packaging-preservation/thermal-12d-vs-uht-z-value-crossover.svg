<text x="237.7" y="155.2" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">实心罐头 (121°C×30 min)</text>
<text x="237.7" y="173.2" font-size="11.5" fill="#1e293b" text-anchor="start">导热慢，越过褐变线产熟罐味</text>
<circle cx="346.0" cy="291.9" r="5.2" fill="#18794e" stroke="#ffffff" stroke-width="1.5"/>
<text x="338.0" y="313.9" font-size="11.5" fill="#18794e" text-anchor="end" font-weight="700">★ UHT 超高温奶 (138°C×4 s)</text>
<text x="360.0" y="232.9" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">化学煮熟线 (z≈28°C)</text>
<text x="136" y="136" font-size="11.5" fill="#be123c" text-anchor="start" font-weight="700">12D 杀芽孢线</text>
<text x="148" y="153" font-size="11.5" fill="#be123c" text-anchor="start">(z = 10°C)</text>
<rect x="34" y="404" width="402" height="116" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="48" y="426" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">算清“高温短时（HTST / UHT）”抢时间的数学账：</text>
<text x="48" y="450" font-size="11.5" fill="#be123c" text-anchor="start" font-weight="700">• 升温 20 °C (121→141 °C)：芽孢致死提速 10^(20/10) = 100 倍！</text>
<text x="48" y="473" font-size="11.5" fill="#b45309" text-anchor="start">• 同一 20 °C 温升：美拉德与维生素破坏仅提速 10^(20/28) ≈ 5.2 倍。</text>
<text x="48" y="496" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">• 结果：灭菌时间缩至 1/100，化学热损伤反而锐减约 95%！</text>
<rect x="464" y="64" width="276" height="470" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="478.0" y="74.0" width="205" height="22" rx="11.0" fill="#ffe4e6" stroke="#be123c" stroke-width="1" stroke-opacity="0.35"/>
<text x="580.5" y="89.0" font-size="12" fill="#be123c" text-anchor="middle" font-weight="600">B · FDA pH = 4.6 酸度分水岭</text>
<rect x="478" y="110" width="248" height="134" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<circle cx="496" cy="131" r="10" fill="#ffffff" stroke="#18794e" stroke-width="1.2"/>
<text x="496" y="135" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">1</text>
<text x="512" y="135" font-size="12.0" fill="#18794e" text-anchor="start" font-weight="700">高酸食品：pH ≤ 4.6</text>
<text x="490" y="159" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">代表：番茄酱、橙汁、果酱、泡菜</text>
<text x="490" y="181" font-size="11.5" fill="#1e293b" text-anchor="start">高浓度 H+ 锁死肉毒梭菌芽孢萌发；</text>
<text x="490" y="203" font-size="11.5" fill="#1e293b" text-anchor="start">无需高压釜，85–95 °C 常压巴氏杀菌</text>
<text x="490" y="225" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">灭掉霉菌酵母即可常温保质！</text>
<rect x="478" y="258" width="248" height="152" rx="8" fill="#ffe4e6" stroke="#be123c" stroke-width="1.2"/>
<circle cx="496" cy="279" r="10" fill="#ffffff" stroke="#be123c" stroke-width="1.2"/>
<text x="496" y="283" font-size="11.5" fill="#be123c" text-anchor="middle" font-weight="700">2</text>
<text x="512" y="283" font-size="12.0" fill="#be123c" text-anchor="start" font-weight="700">低酸食品：pH &gt; 4.6 · aw &gt; 0.85</text>
<text x="490" y="307" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">代表：纯牛奶、玉米罐头、红烧肉</text>
<text x="490" y="329" font-size="11.5" fill="#1e293b" text-anchor="start">密封无氧+中性营养=肉毒梭菌温床</text>
<text x="490" y="351" font-size="11.5" fill="#1e293b" text-anchor="start">(中性缓冲液中芽孢耐热 D 值高 3 倍)；</text>
<text x="490" y="373" font-size="11.5" fill="#be123c" text-anchor="start" font-weight="700">必须用 121 °C 高压釜或 &gt;135 °C UHT</text>
<text x="490" y="395" font-size="11.5" fill="#be123c" text-anchor="start" font-weight="700">达成 12D 斩草除根（存活率 10⁻¹²）！</text>
<rect x="478" y="422" width="248" height="98" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="490" y="444" font-size="12.0" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么常温纯牛奶零防腐剂？</text>
<text x="490" y="467" font-size="11.5" fill="#1e293b" text-anchor="start">液态奶流动换热快，闪蒸 4 秒团灭芽孢</text>
<text x="490" y="489" font-size="11.5" fill="#1e293b" text-anchor="start">+ 过氧化氢无菌舱灌装 = 零菌封存；</text>
<text x="490" y="510" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">一旦开盒进空气，须冷藏且尽快喝完。</text>
</svg>
