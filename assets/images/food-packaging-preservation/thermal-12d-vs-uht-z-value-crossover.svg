<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二、pH 4.6 生死线与热杀菌剪刀差：为什么 138 °C 闪蒸 4 秒比慢炖更保鲜？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">杀灭芽孢对升温极敏感（z ≈ 10 °C，每升 10 °C 快 10 倍），煮坏营养风味却迟钝（z ≈ 28 °C，仅快 2.3 倍）</text>
