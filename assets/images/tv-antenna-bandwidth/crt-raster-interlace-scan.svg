<text x="430" y="400" font-size="9.7" fill="#0f172a" text-anchor="start" font-weight="700">• 视觉刷新率：每秒整屏亮 50 次（跨过 ~45 Hz 闪烁门限）</text>
<text x="430" y="415" font-size="9.5" fill="#475569" text-anchor="start">• 遗产：今天视频里的 1080i / 576i 字母 i 就来自 Interlaced！</text>
