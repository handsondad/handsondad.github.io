<line x1="113.6" y1="382.0" x2="372.0" y2="382.0" stroke="#1d6fa5" stroke-width="1.8"/>
<text x="83.8" y="397" font-size="9.2" fill="#b91c1c" text-anchor="middle" font-weight="700">12μs 消隐</text>
<text x="250.3" y="397" font-size="9.3" fill="#1d6fa5" text-anchor="middle" font-weight="700">52 μs 有效图像电压（最高 275 周 ≈ 5.3 MHz）</text>
<text x="95.7" y="316" font-size="8.9" fill="#6d28d9" text-anchor="middle" font-weight="700">色同步</text>
<text x="34" y="421" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="600">秘密：负脉冲“同步头”像指挥棒，强迫千家万户电子枪跟摄像机同起同落！</text>
<rect x="404" y="62" width="336" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="418" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 2:1 隔行扫描（50i）：带宽省一半还不闪！</text>
<text x="418" y="105" font-size="9.8" fill="#64748b" text-anchor="start">难题：每秒 25 帧全画人眼觉得闪烁；画 50 帧带宽又要翻倍到 12 MHz</text>
