<text x="58.0" y="113.0" font-size="9.4" fill="#e2e8f0" text-anchor="start" font-weight="600">电子束从左往右扫一行 (52 μs) · 虚线消隐回扫 (12 μs)</text>
<text x="356.0" y="206.0" font-size="9.3" fill="#93c5fd" text-anchor="end" class="mono">625行×25帧 = 15,625行/秒</text>
<line x1="54.0" y1="252.0" x2="372.0" y2="252.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="3 3"/>
