<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">CRT显像管64微秒逐行扫描电压波形与2比1隔行扫描省带宽机制图</title>
<desc id="desc">左图展示电子束在CRT荧光屏上按每秒15625行扫描，每行64微秒由12微秒行同步消隐（含-0.3V同步脉冲和色同步摆动）与52微秒明暗电压波形组成；右图展示奇数场与偶数场各用20毫秒交替扫描，以25帧带宽实现50Hz无闪烁刷新。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .beam-line {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: scanSweep 1.8s ease-out 1 both;
      }
      .beam-dot {
        animation: dotPulse 1.8s ease-out 1 both;
      }
      @keyframes scanSweep {
        0% { stroke-dashoffset: 1; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes dotPulse {
        0% { opacity: 0.35; }
        50% { opacity: 1.0; }
        100% { opacity: 1.0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .beam-line, .beam-dot { animation: none; }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="447" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">没有芯片和内存怎么传动态画面？—— 64 微秒电子束扫描与“隔行扫描”省流术</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">把二维画面切成每秒 15,625 根一维亮暗波形；再分奇偶两场交替画，用一半带宽消除了 25 Hz 闪烁！</text>
<rect x="20" y="62" width="372" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="34" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 二维变一维：每行 64 μs 的“同步头 + 明暗电压”</text>
<rect x="40.0" y="98.0" width="332.0" height="118.0" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
