<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">网球场标准几何尺寸、对角斜线勾股容错优势与三大边界擦网规则图解</title>
<desc id="desc">左图按1米=12.2像素精确绘制23.77米×10.97米（单打8.23米）球场、发球区、平分区与占先区，并对比直线23.77米、斜线25.15米与合法绕柱球轨迹；右图展示球网中间比两端低15.6厘米的弧形下沉、斜线多出1.38米跑道，以及压线算好球、发球擦网重发与相持擦网有效三条核心规则。</desc>
