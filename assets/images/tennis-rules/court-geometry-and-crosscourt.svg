<rect x="388" y="344" width="344" height="106" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="400" y="363" font-size="9.2" fill="#b45309" text-anchor="start" font-weight="700">新手最容易看懵的 3 条“边界与擦网”铁律：</text>
<text x="400" y="382" font-size="8.6" fill="#1e293b" text-anchor="start">1. 压线即界内（IN）：哪怕毛毡球外缘只蹭到白线外沿 1 mm，100% 算好球！</text>
<text x="400" y="401" font-size="8.6" fill="#1e293b" text-anchor="start">2. 发球擦网 vs 相持擦网：发球擦网落入发球区叫 Let（重发，不计失误）；</text>
<text x="400" y="418" font-size="8.6" fill="#0f172a" text-anchor="start" font-weight="600">   但一旦进入多拍对拉，球砸中网带翻滚过网落入界内——比赛继续，绝不重打！</text>
<text x="400" y="437" font-size="8.2" fill="#1e293b" text-anchor="start">3. 禁触网与过网击球：活球期身体或球拍碰网即失分（除非球落地后倒旋回网）。</text>
</svg>
