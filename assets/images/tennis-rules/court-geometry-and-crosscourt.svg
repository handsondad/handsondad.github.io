<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：ITF 标准球场精确比例（长 23.77 m，单打宽 8.23 m / 双打 10.97 m） · 右：球网中心下沉 15.6 cm 与勾股跑道红利</text>
