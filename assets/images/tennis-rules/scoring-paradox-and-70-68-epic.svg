<rect x="0.5" y="0.5" width="759" height="479" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">总得分比对手少 14 分却夺走温网冠军？网球“准辛普森悖论”与跨三天 70 比 68 神迹</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：清零机制酿成的“少得分赢球”数学奇观与 2019 温网决赛 · 右：2010 温网 18 号球场打瘫记分牌的 11 小时 05 分绝唱</text>
<rect x="16" y="64" width="362" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="28.0" y="76.0" width="304" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="180.0" y="91.0" font-size="9.6" fill="#dc2626" text-anchor="middle" font-weight="600">① 计分悖论 · 输盘脆败不扣额外分，赢盘险胜就够夺冠</text>
<rect x="28" y="108" width="338" height="134" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
<text x="40" y="127" font-size="9.0" fill="#dc2626" text-anchor="start" font-weight="700">数学极限（无平分三盘两胜）：只拿全场 36.9% 的总分就能赢！</text>
<text x="40" y="146" font-size="8.5" fill="#1e293b" text-anchor="start">• 第 1 盘战略放弃：0–6 吞蛋（全 0–4 脆败） → 甲 0 分 : 乙 24 分</text>
<text x="40" y="164" font-size="8.5" fill="#1e293b" text-anchor="start">• 第 2、3 盘精打细算：各输 6 局 0–4、各赢 6 局 4–2，抢七各赢 7–5</text>
<text x="40" y="181" font-size="8.5" fill="#0f172a" text-anchor="start" font-weight="600">  每盘甲拿 24+7 = 31 分，乙拿 24+12+5 = 41 分，甲却连赢两盘 7–6！</text>
<rect x="40" y="194" width="115.1" height="22" rx="4" fill="#18794e"/>
<rect x="155.1" y="194" width="196.9" height="22" rx="4" fill="#475569"/>
<text x="97.6" y="209" font-size="8.3" fill="#ffffff" text-anchor="middle" font-weight="700">胜者甲 62 分 (36.9%)</text>
<text x="253.6" y="209" font-size="8.3" fill="#ffffff" text-anchor="middle" font-weight="700">败者乙 106 分 (63.1%) 却输掉比赛！</text>
<text x="197" y="232" font-size="8.2" fill="#dc2626" text-anchor="middle" font-weight="600">原因：0–4 脆败与 2–4 惜败同样只算丢 1 局，“溢出选票”全被清零浪费！</text>
<rect x="28" y="252" width="338" height="204" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="271" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="700">真实巅峰案例：2019 温网男单决赛（4 小时 57 分最长温网决赛）</text>
<text x="40" y="289" font-size="8.4" fill="#1d6fa5" text-anchor="start" font-weight="700">比分：德约科维奇 7–6(5), 1–6, 7–6(4), 4–6, 13–12(3) 险胜费德勒</text>
<text x="40" y="314" font-size="8.5" fill="#0f172a" text-anchor="start" font-weight="700">总得分</text>
<text x="106" y="314" font-size="8.5" fill="#1e293b" text-anchor="start" font-weight="600" class="mono">德约 204</text>
<text x="162" y="314" font-size="8.5" fill="#c25014" text-anchor="start" font-weight="700" class="mono">费德勒 218</text>
<text x="228" y="314" font-size="8.2" fill="#dc2626" text-anchor="start" font-weight="600">费德勒多拿 14 分！</text>
<text x="40" y="338" font-size="8.5" fill="#0f172a" text-anchor="start" font-weight="700">总赢局数</text>
<text x="106" y="338" font-size="8.5" fill="#1e293b" text-anchor="start" font-weight="600" class="mono">德约 32</text>
<text x="162" y="338" font-size="8.5" fill="#c25014" text-anchor="start" font-weight="700" class="mono">费德勒 36</text>
<text x="228" y="338" font-size="8.2" fill="#dc2626" text-anchor="start" font-weight="600">费德勒多赢 4 局！</text>
<text x="40" y="362" font-size="8.5" fill="#0f172a" text-anchor="start" font-weight="700">制胜分</text>
<text x="106" y="362" font-size="8.5" fill="#1e293b" text-anchor="start" font-weight="600" class="mono">德约 54</text>
<text x="162" y="362" font-size="8.5" fill="#c25014" text-anchor="start" font-weight="700" class="mono">费德勒 94</text>
<text x="228" y="362" font-size="8.2" fill="#dc2626" text-anchor="start" font-weight="600">费德勒多轰 40 记！</text>
<text x="40" y="386" font-size="8.5" fill="#0f172a" text-anchor="start" font-weight="700">破发次数</text>
<text x="106" y="386" font-size="8.5" fill="#1e293b" text-anchor="start" font-weight="600" class="mono">德约 3</text>
<text x="162" y="386" font-size="8.5" fill="#c25014" text-anchor="start" font-weight="700" class="mono">费德勒 7</text>
<text x="228" y="386" font-size="8.2" fill="#dc2626" text-anchor="start" font-weight="600">费德勒破发 7 次 vs 3 次</text>
<text x="40" y="410" font-size="8.5" fill="#18794e" text-anchor="start" font-weight="700">抢七胜率</text>
<text x="106" y="410" font-size="8.5" fill="#18794e" text-anchor="start" font-weight="700" class="mono">德约 3</text>
<text x="162" y="410" font-size="8.5" fill="#64748b" text-anchor="start" font-weight="400" class="mono">费德勒 0</text>
<text x="228" y="410" font-size="8.2" fill="#18794e" text-anchor="start" font-weight="700">德约 3 次抢七全胜夺冠！</text>
<text x="40" y="442" font-size="8.1" fill="#64748b" text-anchor="start">注：费德勒在决胜盘 8–7 40–15 手握 2 个冠军点未兑现，最终输在 12–12 抢七。</text>
