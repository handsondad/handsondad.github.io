<text x="568.0" y="91.0" font-size="9.4" fill="#0f766e" text-anchor="middle" font-weight="600">② 史诗绝唱 · 2010 温网跨三天 70–68（把规则逼改的历史化石）</text>
<rect x="404" y="108" width="328" height="92" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1.5"/>
<text x="418" y="126" font-size="8.4" fill="#a7f3d0" text-anchor="start" font-weight="700" class="mono">WIMBLEDON 2010 · COURT 18（第一轮 · 耗时 11 小时 05 分钟）</text>
<text x="418" y="152" font-size="9.5" fill="#fef08a" text-anchor="start" font-weight="700" class="mono">J. ISNER (胜)</text>
<text x="526" y="152" font-size="9.6" fill="#ffffff" text-anchor="start" font-weight="600" class="mono">6   3   6   7</text>
<rect x="634" y="137" width="84" height="22" rx="4" fill="#fef08a"/>
<text x="676" y="153" font-size="11.5" fill="#064e3b" text-anchor="middle" font-weight="700" class="mono">70</text>
<text x="418" y="180" font-size="9.5" fill="#e2e8f0" text-anchor="start" font-weight="700" class="mono">N. MAHUT</text>
<text x="526" y="180" font-size="9.6" fill="#cbd5e1" text-anchor="start" font-weight="600" class="mono">4   6   7   6</text>
<rect x="634" y="165" width="84" height="22" rx="4" fill="#065f46" stroke="#6ee7b7" stroke-width="1"/>
<text x="676" y="181" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700" class="mono">68</text>
<rect x="404" y="210" width="328" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="416" y="229" font-size="8.9" fill="#0f172a" text-anchor="start" font-weight="700">跨三天拉锯奇闻（当时温网决胜盘不设抢七，必须净胜 2 局！）：</text>
<text x="416" y="248" font-size="8.5" fill="#1e293b" text-anchor="start">• 6 月 22 日（周二）：打完前四盘 2–2 平，天黑无照明暂停；</text>
<text x="416" y="267" font-size="8.5" fill="#1e293b" text-anchor="start">• 6 月 23 日（周三）：单日死磕 7 小时 04 分！打到 47–47 时现场 IBM</text>
<text x="416" y="284" font-size="8.5" fill="#c25014" text-anchor="start" font-weight="700">  电子记分牌彻底卡死黑屏（程序员根本没写超过 47 局的代码！），官网</text>
<text x="416" y="301" font-size="8.5" fill="#1e293b" text-anchor="start">  在 50–50 归零贴出告示“请读者自行 +50”；战至 59–59 再度天黑暂停！</text>
<text x="416" y="320" font-size="8.5" fill="#0f766e" text-anchor="start" font-weight="700">• 6 月 24 日（周四）：再战 67 分钟，伊斯内尔第 138 局破发定格 70–68！</text>
<text x="416" y="340" font-size="8.5" fill="#dc2626" text-anchor="start" font-weight="700">• 又见计分悖论：全场共 980 分，输球的马胡拿了 502 分 &gt; 胜者 478 分！</text>
<text x="416" y="355" font-size="8.3" fill="#64748b" text-anchor="start">  两人合轰 216 记 Ace（113 vs 103），连续保发 168 局无一人掉链子。</text>
<rect x="404" y="370" width="328" height="86" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
<text x="416" y="389" font-size="9.0" fill="#18794e" text-anchor="start" font-weight="700">永远封存的世界纪录：为什么后人再也不可能打破 70–68？</text>
<text x="416" y="408" font-size="8.4" fill="#1e293b" text-anchor="start">2018 温网半决赛伊斯内尔又打出 26–24 长盘后，温网于 2019 增设 12–12</text>
<text x="416" y="425" font-size="8.4" fill="#0f172a" text-anchor="start" font-weight="600">抢七；2022 年四大满贯正式统一为【决胜盘 6–6 抢十】——183 局马拉松</text>
<text x="416" y="442" font-size="8.4" fill="#18794e" text-anchor="start" font-weight="700">从此化作网球规则演进史上前无古人、后无来者的琥珀标本！</text>
