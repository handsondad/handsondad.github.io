<text x="522" y="395.2" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">  极小，球触地不减速反而贴地急窜！</text>
<text x="522" y="410.4" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">• 弹跳不及膝高，发球上网与切削利器；</text>
<text x="522" y="425.6" font-size="8.1" fill="#15803d" text-anchor="start" font-weight="700">• 2025 历史转折：温网告别坚守 147 年</text>
<text x="522" y="440.8" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">  的约 300 名盛装司线员，全场 10+ 高</text>
<text x="522" y="456.0" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">  速相机 2.6 mm 精度 0.1 秒自动报出界！</text>
