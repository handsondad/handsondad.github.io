<text x="528" y="99" font-size="9.2" fill="#0f172a" text-anchor="start" font-weight="700">为什么长绒毛、涂荧光黄？</text>
<text x="528" y="115" font-size="8.2" fill="#4d7c0f" text-anchor="start" font-weight="700">56–59.4 g · 罐内约 2 倍大气压</text>
<text x="486" y="137" font-size="8.3" fill="#1e293b" text-anchor="start">• 绒毛减速稳控：若做成光滑橡胶球，200 km/h</text>
<text x="486" y="153" font-size="8.3" fill="#1e293b" text-anchor="start">  发球几乎无法控制；羊毛尼龙毡增大空气抓力，</text>
<text x="486" y="169" font-size="8.3" fill="#0f172a" text-anchor="start" font-weight="600">  炸毛后阻力变大，职业赛遵循【首7局、后每9局】</text>
<text x="486" y="185" font-size="8.3" fill="#1e293b" text-anchor="start">  换新球铁律（首7局扣除了赛前热身磨损的2局！）。</text>
<text x="486" y="204" font-size="8.3" fill="#1e293b" text-anchor="start">• 彩色电视催生的荧光黄：1972 ITF 批准荧光黄球，</text>
<text x="486" y="220" font-size="8.3" fill="#b45309" text-anchor="start" font-weight="700">  保守的温网硬是坚持用白球到 1986 年才改口！</text>
