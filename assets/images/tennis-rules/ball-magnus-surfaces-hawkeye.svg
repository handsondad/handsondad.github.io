<text x="274" y="395.2" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">  石英砂粗细精准调校摩擦快慢；</text>
<text x="274" y="410.4" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">• 球速与弹跳高度最稳定、最“诚实”，</text>
<text x="274" y="425.6" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">  攻守全能型球员的试金石；</text>
<text x="274" y="440.8" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">• 澳网(2021)与美网(2022)已全面启用</text>
<text x="274" y="456.0" font-size="8.1" fill="#1d4ed8" text-anchor="start" font-weight="700">  Hawk-Eye Live 实时电子司线。</text>
