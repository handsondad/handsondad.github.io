<text x="26" y="395.2" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">  把前冲动能转成高耸旋转弹跳；</text>
<text x="26" y="410.4" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">• 大炮发球威力骤减，多拍拉锯天堂；</text>
<text x="26" y="425.6" font-size="8.1" fill="#c2410c" text-anchor="start" font-weight="700">• 唯一保留人工看印的大满贯：红土</text>
<text x="26" y="440.8" font-size="8.1" fill="#1e293b" text-anchor="start" font-weight="400">  留有清晰球印，主裁仍亲自下椅验印！</text>
