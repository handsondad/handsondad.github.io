<text x="44" y="212" font-size="11.5" fill="#1e293b" text-anchor="start">相邻势阱互不侵犯，剪切模量 G_c 坚挺，晶格稳固。</text>
<rect x="32" y="238" width="330" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="44" y="258" font-size="11.6" fill="#dc2626" text-anchor="start" font-weight="700">抵达熔点 (T = T_m)：均方根振幅冲破 ~10% a！</text>
<circle cx="68" cy="302" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2"/>
<circle cx="72" cy="302" r="5.8" fill="#dc2626"/>
