<circle cx="212" cy="302" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2"/>
<circle cx="216" cy="302" r="5.8" fill="#dc2626"/>
<circle cx="284" cy="302" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2"/>
<circle cx="280" cy="302" r="5.8" fill="#dc2626"/>
<text x="44" y="344" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">1910 林德曼普适铁律：√⟨u²⟩ / a ≈ 0.10–0.13</text>
<text x="44" y="362" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="600">邻居撞肩产生 ~10% 临界剪切应变，囚笼瞬间松动！</text>
<rect x="32" y="382" width="330" height="126" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="44" y="404" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">弹簧越硬，把振幅晃到 10% 所需的熔点越高：</text>
<text x="44" y="428" font-size="11.5" fill="#1e293b" text-anchor="start">• 弱色散力：固态氩 -189 °C（轻轻一热就晃散架）</text>
<text x="44" y="450" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 氢键网络：冰 0 °C · 离子键：食盐 NaCl 801 °C</text>
<text x="44" y="472" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">• 强金属/共价键：铁 1538 °C · 钨高达 3422 °C！</text>
<text x="44" y="494" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">（唯一零压不冻：液氦零点量子抖动已超 10%！）</text>
<rect x="388" y="66" width="352" height="456" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="78.0" width="328" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="564.0" y="94.3" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">B · 热力学终审裁判：焓 H（省能量）vs 熵 S（要自由）</text>
<line x1="436.0" y1="320.0" x2="720.0" y2="320.0" stroke="#475569" stroke-width="1.4"/>
<line x1="436.0" y1="122.0" x2="436.0" y2="320.0" stroke="#475569" stroke-width="1.4"/>
