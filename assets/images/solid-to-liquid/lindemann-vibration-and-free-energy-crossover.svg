<text x="718" y="338.0" font-size="11.5" fill="#0f172a" text-anchor="end" font-weight="700">温度 T →</text>
<line x1="436.0" y1="162.0" x2="561.2" y2="208.5" stroke="#1d6fa5" stroke-width="2.8"/>
<line x1="561.2" y1="208.5" x2="716.0" y2="266.0" stroke="#1d6fa5" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="436.0" y1="128.0" x2="561.2" y2="208.5" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 3"/>
