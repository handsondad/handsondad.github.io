<rect x="0.5" y="0.5" width="759" height="535" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二、坚硬固体凭什么在某一刻突然松手？林德曼 10% 振幅红线与自由能夺权</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：热振动冲破晶格间距 10% 触发剪切崩塌 · 右：吉布斯自由能 G = H - TS 交叉线与过冷液体</text>
<rect x="20" y="66" width="354" height="456" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="78.0" width="330" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="197.0" y="94.3" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="600">A · 动力学扳机：林德曼熔化判据（振幅 ≈ 10% 间距）</text>
<rect x="32" y="114" width="330" height="112" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="44" y="134" font-size="11.6" fill="#1d6fa5" text-anchor="start" font-weight="700">低温固态 (T ≪ T_m)：热抖动仅 ~3% 间距 a</text>
<circle cx="68" cy="176" r="11" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="2 2"/>
<circle cx="68" cy="176" r="5.5" fill="#1d6fa5"/>
