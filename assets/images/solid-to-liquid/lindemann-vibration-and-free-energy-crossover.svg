<text x="561.2" y="338.0" font-size="11.8" fill="#dc2626" text-anchor="middle" font-weight="700">熔点 T_m</text>
<text x="442" y="216" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">固态 G_固 (斜率缓)</text>
<text x="478" y="132" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">过冷液体(亚稳)</text>
<text x="628" y="308" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">液态 G_液 (斜率陡!)</text>
<rect x="400" y="350" width="328" height="158" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="412" y="372" font-size="11.8" fill="#0f766e" text-anchor="start" font-weight="700">为什么加热到 T_m 会发生“政权交接”？</text>
<text x="412" y="396" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 自然界自动滚向【吉布斯自由能 G = H - TS 最低】态：</text>
<text x="412" y="418" font-size="11.5" fill="#1e293b" text-anchor="start">• T &lt; T_m：温度低，晶体靠成键深、低焓 H 稳坐江山；</text>
<text x="412" y="440" font-size="11.5" fill="#1e293b" text-anchor="start">• T &gt; T_m：T 放大熵项 -TS！液体构型多（S_液&gt;S_固），</text>
<text x="412" y="462" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">  G_液 跌破 G_固，精确交界 T_m = ΔH_fus / ΔS_fus！</text>
<text x="412" y="486" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">• 缺晶核时纯水可沿虚线滑入 -10 °C【过冷水】秒冻态！</text>
