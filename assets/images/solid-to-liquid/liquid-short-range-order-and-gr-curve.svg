<svg xmlns="http://www.w3.org/2000/svg" width="760" height="544" viewBox="0 0 760 544" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">固液气三态微观囚笼排布、径向分布函数g(r)实算与三相点气压门槛图解</title>
<desc id="desc">左栏对比晶体格点锁死、液体肩并肩暂态囚笼皮秒换位与气体稀疏乱飞，并归纳液体表面张力与毛细现象；右栏实算绘制晶体、液体与理想气体的径向分布函数g(r)，并说明低于三相点压强时液态无法存在的相图铁律。</desc>
