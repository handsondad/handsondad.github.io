<circle cx="120" cy="132" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<circle cx="54" cy="154" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<circle cx="76" cy="154" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<circle cx="98" cy="154" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<circle cx="120" cy="154" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<circle cx="54" cy="176" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<circle cx="76" cy="176" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<circle cx="98" cy="176" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<circle cx="120" cy="176" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<text x="144" y="134" font-size="11.8" fill="#1d6fa5" text-anchor="start" font-weight="700">① 晶体固体（长程有序）</text>
<text x="144" y="156" font-size="11.5" fill="#1e293b" text-anchor="start">• 原子锁死在周期格点原地震动</text>
<text x="144" y="178" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 抗剪切 G&gt;0，保持固定外形</text>
<rect x="32" y="210" width="330" height="108" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<circle cx="54" cy="240" r="6.2" fill="#0f766e"/>
<circle cx="76" cy="236" r="6.2" fill="#0f766e"/>
<circle cx="97" cy="243" r="6.2" fill="#0f766e"/>
<circle cx="118" cy="237" r="6.2" fill="#0f766e"/>
<circle cx="62" cy="261" r="6.2" fill="#0f766e"/>
<circle cx="85" cy="264" r="6.2" fill="#c25014"/>
<circle cx="108" cy="263" r="6.2" fill="#0f766e"/>
<circle cx="52" cy="284" r="6.2" fill="#0f766e"/>
<circle cx="75" cy="287" r="6.2" fill="#0f766e"/>
<circle cx="98" cy="285" r="6.2" fill="#0f766e"/>
<circle cx="120" cy="280" r="6.2" fill="#0f766e"/>
<circle cx="85" cy="264" r="19" fill="none" stroke="#c25014" stroke-width="1.4" stroke-dasharray="3 2"/>
<text x="144" y="232" font-size="11.8" fill="#0f766e" text-anchor="start" font-weight="700">② 液体（短程有序 · 长程无序）</text>
<text x="144" y="254" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 密度与固体仅差 5–10%，肩并肩紧挨！</text>
<text x="144" y="276" font-size="11.5" fill="#1e293b" text-anchor="start">• 贴身第一圈仍有 ~4–12 个暂态邻居，</text>
<text x="144" y="298" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">  但每 ~1–2 皮秒就挤破囚笼换新舞伴！</text>
<rect x="32" y="328" width="330" height="78" rx="8" fill="#fff7ed" stroke="#c25014" stroke-width="1.1"/>
<circle cx="54" cy="350" r="5.5" fill="#c25014"/>
<circle cx="112" cy="346" r="5.5" fill="#c25014"/>
<circle cx="78" cy="384" r="5.5" fill="#c25014"/>
<circle cx="122" cy="388" r="5.5" fill="#c25014"/>
<text x="144" y="352" font-size="11.8" fill="#c25014" text-anchor="start" font-weight="700">③ 气体（长短程皆无序）</text>
<text x="144" y="374" font-size="11.5" fill="#1e293b" text-anchor="start">• 间距拉开 ~10 倍，密度骤降上千倍，</text>
<text x="144" y="394" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">  动能彻底碾压引力（k_B T ≫ U₀）。</text>
<rect x="32" y="418" width="330" height="98" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="44" y="440" font-size="11.6" fill="#1d6fa5" text-anchor="start" font-weight="700">液态三大宏观绝活（全靠“贴身却能换位”）：</text>
<text x="44" y="462" font-size="11.5" fill="#1e293b" text-anchor="start">• 难压缩却可流动（黏度 η 度量换笼阻力）；</text>
<text x="44" y="484" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 表面张力：表层少一半邻居被向内拽 → 水滴缩球；</text>
<text x="44" y="504" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">• 毛细现象：附着力 &gt; 内聚力 → 顺细管逆重力爬升。</text>
<rect x="388" y="66" width="352" height="464" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="78.0" width="328" height="24" rx="12.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="564.0" y="94.3" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">B · 一眼分清三态：径向分布函数 g(r) 与宇宙稀缺性</text>
