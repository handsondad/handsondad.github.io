<text x="493.8" y="140.7" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">液体第1邻居峰</text>
<text x="720" y="146" font-size="11.5" fill="#1d6fa5" text-anchor="end" font-weight="600">浅蓝尖峰：晶体长程序</text>
<text x="720" y="168" font-size="11.5" fill="#c25014" text-anchor="end" font-weight="700">橙色虚线：理想气体 g(r)→1</text>
<text x="564" y="314" font-size="11.5" fill="#64748b" text-anchor="middle">距离 r / σ（&gt;3σ 后液体起伏抹平→1）</text>
<rect x="400" y="330" width="328" height="186" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="412" y="352" font-size="11.6" fill="#6d28d9" text-anchor="start" font-weight="700">宇宙真相：液体是三态里最娇贵的“灰姑娘”！</text>
<text x="412" y="376" font-size="11.5" fill="#1e293b" text-anchor="start">• 气体铺满星际，冰岩遍布彗星；唯独液体被死死</text>
<text x="412" y="398" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  夹在【三相点压强 P_t】与【临界点】窄缝里！</text>
<text x="412" y="422" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">• 一旦环境气压 P &lt; P_t，液态在任何温度都不存在：</text>
<text x="412" y="444" font-size="11.5" fill="#1e293b" text-anchor="start">  ① 二氧化碳 P_t=5.11 atm → 常压干冰只升华；</text>
<text x="412" y="466" font-size="11.5" fill="#1e293b" text-anchor="start">  ② 水 P_t=611.7 Pa → 太空与月球冰受热直奔水汽，</text>
<text x="412" y="488" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">     唯有地球大气压稳稳托住了浩瀚液态海洋！</text>
</svg>
