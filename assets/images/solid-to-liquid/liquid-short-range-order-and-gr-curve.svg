<rect x="0.5" y="0.5" width="759" height="543" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、液体的真实面目：既非散沙也非死板方阵，而是“短程有序、长程无序”的皮秒集体舞</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：晶格死锁 vs 液态暂态囚笼（~1 ps 换舞伴）vs 气体 · 右：径向分布函数 g(r) 实算与三相点生存门槛</text>
<rect x="20" y="66" width="354" height="464" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="78.0" width="330" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="197.0" y="94.3" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 微观排布真相：液体的拥挤度其实跟固体几乎一样！</text>
<rect x="32" y="112" width="330" height="88" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<circle cx="54" cy="132" r="6.2" fill="#1d6fa5" opacity="0.88"/>
<circle cx="76" cy="132" r="6.2" fill="#1d6fa5" opacity="0.88"/>
