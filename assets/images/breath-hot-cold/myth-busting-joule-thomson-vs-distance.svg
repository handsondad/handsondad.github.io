<text x="449.6" y="178.2" font-size="9.9" fill="#dc2626" text-anchor="start" font-weight="700">1 cm 贴唇吹气: 33.4°C (热!)</text>
<circle cx="602.0" cy="297.0" r="5" fill="#1d6fa5" stroke="#fff" stroke-width="1.4"/>
<text x="602.0" y="287.0" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">15 cm 吹气中心: 22.0°C (凉!)</text>
<text x="642.6" y="199.0" font-size="10.0" fill="#dc2626" text-anchor="middle" font-weight="700">张嘴哈气中心 (D=30 mm)</text>
<rect x="394" y="392" width="330" height="74" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.0"/>
<text x="406" y="413" font-size="10.4" fill="#0f766e" text-anchor="start" font-weight="700">反过来试：张大嘴“哈气”，但把手伸远到 40 cm 外！</text>
<text x="406" y="433" font-size="10.0" fill="#1e293b" text-anchor="start">一旦超过 5 倍大口径（&gt;15 cm），哈气暖柱也会被冷空气</text>
<text x="406" y="451" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">吞没稀释——哪怕张大嘴哈气，隔老远照样变成凉风！</text>
</svg>
