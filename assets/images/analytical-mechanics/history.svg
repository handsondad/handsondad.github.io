<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1140" viewBox="0 0 720 1140" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">分析力学发展的六个历史路标</title><desc id="desc">列出六个有史料依据的出版或论文年份，区分各人的贡献，不表示一人独自发明整套理论。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1140" fill="#f3f7fa"/><text x="36" y="48" font-size="29" fill="#172b45" text-anchor="start">① 不是推翻牛顿，而是重组问题</text><rect x="24" y="76" width="672" height="144" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="112" font-size="25" fill="#176786" text-anchor="start">1687</text><text x="300" y="112" font-size="25" fill="#172b45" text-anchor="start">牛顿</text><text x="48" y="153" font-size="23" fill="#172b45" text-anchor="start">《原理》：运动定律与万有引力</text><text x="48" y="189" font-size="23" fill="#172b45" text-anchor="start">给出物理规律；书中主要用几何论证</text><rect x="24" y="236" width="672" height="144" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="272" font-size="25" fill="#176786" text-anchor="start">1736</text><text x="300" y="272" font-size="25" fill="#172b45" text-anchor="start">欧拉</text><text x="48" y="313" font-size="23" fill="#172b45" text-anchor="start">《力学》：系统使用分析方法</text><text x="48" y="349" font-size="23" fill="#172b45" text-anchor="start">把质点动力学翻译成微分方程</text><rect x="24" y="396" width="672" height="144" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="432" font-size="25" fill="#176786" text-anchor="start">1743</text><text x="300" y="432" font-size="25" fill="#172b45" text-anchor="start">达朗贝尔</text><text x="48" y="473" font-size="23" fill="#172b45" text-anchor="start">《动力学论》：达朗贝尔原理</text><text x="48" y="509" font-size="23" fill="#172b45" text-anchor="start">在理想约束下，借虚功组织运动方程</text><rect x="24" y="556" width="672" height="144" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="592" font-size="25" fill="#176786" text-anchor="start">1788</text><text x="300" y="592" font-size="25" fill="#172b45" text-anchor="start">拉格朗日</text><text x="48" y="633" font-size="23" fill="#172b45" text-anchor="start">《分析力学》：统一的坐标方法</text><text x="48" y="669" font-size="23" fill="#172b45" text-anchor="start">用广义坐标和统一运算处理复杂系统</text><rect x="24" y="716" width="672" height="144" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="752" font-size="25" fill="#176786" text-anchor="start">1834—1835</text><text x="300" y="752" font-size="25" fill="#172b45" text-anchor="start">哈密顿</text><text x="48" y="793" font-size="23" fill="#172b45" text-anchor="start">两篇动力学论文</text><text x="48" y="829" font-size="23" fill="#172b45" text-anchor="start">从光学走向动力学，发展新的状态描述</text><rect x="24" y="876" width="672" height="144" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="912" font-size="25" fill="#176786" text-anchor="start">1918</text><text x="300" y="912" font-size="25" fill="#172b45" text-anchor="start">诺特</text><text x="48" y="953" font-size="23" fill="#172b45" text-anchor="start">连续对称性与守恒定理</text><text x="48" y="989" font-size="23" fill="#172b45" text-anchor="start">解释为什么某些量会在运动中不变</text><text x="36" y="1080" font-size="22" fill="#172b45" text-anchor="start">这里只选六个路标，不是完整的发明人名单。</text><text x="36" y="1118" font-size="22" fill="#172b45" text-anchor="start">伯努利家族、莫佩尔蒂等人也参与了这段历史。</text></svg>
