<svg xmlns="http://www.w3.org/2000/svg" width="540" height="855" viewBox="0 0 540 855" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">分析力学发展的六个历史路标</title><desc id="desc">列出六个有史料依据的出版或论文年份，区分各人的贡献，不表示一人独自发明整套理论。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="853.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="45.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">① 不是推翻牛顿，而是重组问题</text><rect x="24" y="76" width="672" height="144" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="110.32" font-size="19.0" fill="#176786" text-anchor="start">1687</text><text x="300" y="110.32" font-size="19.0" fill="#172b45" text-anchor="start">牛顿</text><text x="48" y="151.45" font-size="17.5" fill="#172b45" text-anchor="start">《原理》：运动定律与万有引力</text><text x="48" y="187.45" font-size="17.5" fill="#172b45" text-anchor="start">给出物理规律；书中主要用几何论证</text><rect x="24" y="236" width="672" height="144" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="270.32" font-size="19.0" fill="#176786" text-anchor="start">1736</text><text x="300" y="270.32" font-size="19.0" fill="#172b45" text-anchor="start">欧拉</text><text x="48" y="311.45" font-size="17.5" fill="#172b45" text-anchor="start">《力学》：系统使用分析方法</text><text x="48" y="347.45" font-size="17.5" fill="#172b45" text-anchor="start">把质点动力学翻译成微分方程</text><rect x="24" y="396" width="672" height="144" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="430.32" font-size="19.0" fill="#176786" text-anchor="start">1743</text><text x="300" y="430.32" font-size="19.0" fill="#172b45" text-anchor="start">达朗贝尔</text><text x="48" y="471.45" font-size="17.5" fill="#172b45" text-anchor="start">《动力学论》：达朗贝尔原理</text><text x="48" y="507.45" font-size="17.5" fill="#172b45" text-anchor="start">在理想约束下，借虚功组织运动方程</text><rect x="24" y="556" width="672" height="144" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="590.32" font-size="19.0" fill="#176786" text-anchor="start">1788</text><text x="300" y="590.32" font-size="19.0" fill="#172b45" text-anchor="start">拉格朗日</text><text x="48" y="631.45" font-size="17.5" fill="#172b45" text-anchor="start">《分析力学》：统一的坐标方法</text><text x="48" y="667.45" font-size="17.5" fill="#172b45" text-anchor="start">用广义坐标和统一运算处理复杂系统</text><rect x="24" y="716" width="672" height="144" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="750.32" font-size="19.0" fill="#176786" text-anchor="start">1834—1835</text><text x="300" y="750.32" font-size="19.0" fill="#172b45" text-anchor="start">哈密顿</text><text x="48" y="791.45" font-size="17.5" fill="#172b45" text-anchor="start">两篇动力学论文</text><text x="48" y="827.45" font-size="17.5" fill="#172b45" text-anchor="start">从光学走向动力学，发展新的状态描述</text><rect x="24" y="876" width="672" height="144" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="910.32" font-size="19.0" fill="#176786" text-anchor="start">1918</text><text x="300" y="910.32" font-size="19.0" fill="#172b45" text-anchor="start">诺特</text><text x="48" y="951.45" font-size="17.5" fill="#172b45" text-anchor="start">连续对称性与守恒定理</text><text x="48" y="987.45" font-size="17.5" fill="#172b45" text-anchor="start">解释为什么某些量会在运动中不变</text><text x="36" y="1078.52" font-size="16.7" fill="#172b45" text-anchor="start">这里只选六个路标，不是完整的发明人名单。</text><text x="36" y="1116.52" font-size="16.7" fill="#172b45" text-anchor="start">伯努利家族、莫佩尔蒂等人也参与了这段历史。</text></g></svg>
