<svg xmlns="http://www.w3.org/2000/svg" width="540" height="790.5" viewBox="0 0 540 790.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">诺特定理的三个常见守恒对应</title><desc id="desc">时间、空间平移与旋转连续对称性分别关联能量、总动量、角动量，需针对系统作用量判断。固定单摆只有这里所述时间对称性而不具空间平移对称性。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="789" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="45.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑦ 不变的规律，留下守恒的量</text><rect x="24" y="76" width="672" height="222" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="117.03" font-size="20.0" fill="#176786" text-anchor="start" font-weight="600">时间平移</text><path d="M230.000,110.000 L420.000,110.000" fill="none" stroke="#b77a09" stroke-width="2.4" marker-end="url(#arrow)"/><text x="457" y="117.03" font-size="20.0" fill="#b34039" text-anchor="start" font-weight="600">能量</text><text x="48" y="177.52" font-size="16.7" fill="#172b45" text-anchor="start">今天与明天，用同一套运动规律。</text><text x="48" y="225.52" font-size="16.7" fill="#172b45" text-anchor="start">例：固定支点、无摩擦单摆。</text><text x="48" y="270.52" font-size="16.7" fill="#172b45" text-anchor="start">要求作用量的相应连续对称性，不是外观相似。</text><rect x="24" y="320" width="672" height="222" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="361.03" font-size="20.0" fill="#176786" text-anchor="start" font-weight="600">空间平移</text><path d="M230.000,354.000 L420.000,354.000" fill="none" stroke="#b77a09" stroke-width="2.4" marker-end="url(#arrow)"/><text x="457" y="361.03" font-size="20.0" fill="#b34039" text-anchor="start" font-weight="600">总动量</text><text x="48" y="421.52" font-size="16.7" fill="#172b45" text-anchor="start">整体搬到另一处，规律仍相同。</text><text x="48" y="469.52" font-size="16.7" fill="#172b45" text-anchor="start">例：无外力、相互作用只依赖相对位置的系统。</text><text x="48" y="514.52" font-size="16.7" fill="#172b45" text-anchor="start">要求作用量的相应连续对称性，不是外观相似。</text><rect x="24" y="564" width="672" height="222" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="605.03" font-size="20.0" fill="#176786" text-anchor="start" font-weight="600">空间旋转</text><path d="M230.000,598.000 L420.000,598.000" fill="none" stroke="#b77a09" stroke-width="2.4" marker-end="url(#arrow)"/><text x="457" y="605.03" font-size="20.0" fill="#b34039" text-anchor="start" font-weight="600">角动量</text><text x="48" y="665.52" font-size="16.7" fill="#172b45" text-anchor="start">整体转一个角度，规律仍相同。</text><text x="48" y="713.52" font-size="16.7" fill="#172b45" text-anchor="start">例：固定中心的球对称引力场。</text><text x="48" y="758.52" font-size="16.7" fill="#172b45" text-anchor="start">要求作用量的相应连续对称性，不是外观相似。</text><rect x="24" y="828" width="672" height="196" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="868.52" font-size="16.7" fill="#172b45" text-anchor="start">单摆支点选定了一个位置：空间平移对称性被打破。</text><text x="48" y="917.52" font-size="16.7" fill="#172b45" text-anchor="start">所以摆球自身动量不守恒，不能套用第二条。</text><text x="48" y="966.52" font-size="16.7" fill="#172b45" text-anchor="start">若支点主动移动或有摩擦，原来的能量账也要重写。</text></g></svg>
