<svg xmlns="http://www.w3.org/2000/svg" width="540" height="795" viewBox="0 0 540 795" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">单摆双摆与自由刚体的自由度</title><desc id="desc">按独立坐标计数：平面单摆一自由度、平面双摆二自由度、空间自由刚体局部六自由度。双摆角度均相对竖直，图为固定构型不是运动模拟。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="793.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="45.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">④ 把一个角度，升级成一组角度</text><rect x="24" y="76" width="672" height="342" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="114.32" font-size="19.0" fill="#176786" text-anchor="start">单摆：一个独立角度 θ</text><path d="M250.000,162.000 L342.000,335.000" fill="none" stroke="#176786" stroke-width="2.4"/><circle cx="250.000" cy="162.000" r="8" fill="#172b45"/><circle cx="342.000" cy="335.000" r="14" fill="#176786"/><path d="M250.000,162.000 L250.000,350.000" fill="none" stroke="#a8b7c4" stroke-width="2.4" stroke-dasharray="7 6"/><text x="290" y="217.11" font-size="19.2" fill="#b77a09" text-anchor="start" font-weight="600">θ</text><text x="425" y="221.32" font-size="19.0" fill="#172b45" text-anchor="start">自由度：1</text><text x="425" y="262.52" font-size="16.7" fill="#172b45" text-anchor="start">写 1 条二阶方程</text><text x="48" y="386.45" font-size="17.5" fill="#172b45" text-anchor="start">杆长固定，所以 x、y 不能独立选择。</text><rect x="24" y="438" width="672" height="388" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="476.32" font-size="19.0" fill="#176786" text-anchor="start">双摆：两个独立角度 θ₁、θ₂</text><path d="M265.000,516.000 L349.696,639.800" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M349.696,639.800 L263.614,723.405" fill="none" stroke="#b34039" stroke-width="2.4"/><circle cx="265.000" cy="516.000" r="8" fill="#172b45"/><circle cx="349.696" cy="639.800" r="13" fill="#176786"/><circle cx="263.614" cy="723.405" r="13" fill="#b34039"/><path d="M265.000,516.000 L265.000,671.000" fill="none" stroke="#a8b7c4" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M349.696,639.800 L349.696,784.800" fill="none" stroke="#a8b7c4" stroke-width="2.4" stroke-dasharray="7 6"/><text x="270" y="609.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">θ₁</text><text x="311" y="712.11" font-size="19.2" fill="#b34039" text-anchor="start" font-weight="600">θ₂</text><text x="450" y="578.32" font-size="19.0" fill="#172b45" text-anchor="start">自由度：2</text><text x="450" y="624.52" font-size="16.7" fill="#172b45" text-anchor="start">写 2 条耦合</text><text x="450" y="662.52" font-size="16.7" fill="#172b45" text-anchor="start">二阶方程</text><text x="48" y="792.52" font-size="16.7" fill="#172b45" text-anchor="start">第二个球的速度，还包含第一个关节带来的运动。</text><rect x="24" y="846" width="672" height="186" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="884.52" font-size="16.7" fill="#172b45" text-anchor="start">空间中无约束的刚体：3 个位置 + 3 个姿态参数。</text><text x="48" y="932.52" font-size="16.7" fill="#172b45" text-anchor="start">局部共 6 个自由度，不等于有 6 个互不影响的运动。</text><text x="48" y="980.52" font-size="16.7" fill="#172b45" text-anchor="start">机器人、刚体、振动系统：换坐标，统一列方程。</text></g></svg>
