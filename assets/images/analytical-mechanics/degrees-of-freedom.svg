<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">单摆双摆与自由刚体的自由度</title><desc id="desc">按独立坐标计数：平面单摆一自由度、平面双摆二自由度、空间自由刚体局部六自由度。双摆角度均相对竖直，图为固定构型不是运动模拟。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1060" fill="#f3f7fa"/><text x="36" y="48" font-size="29" fill="#172b45" text-anchor="start">④ 把一个角度，升级成一组角度</text><rect x="24" y="76" width="672" height="342" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="116" font-size="25" fill="#176786" text-anchor="start">单摆：一个独立角度 θ</text><path d="M250.000,162.000 L342.000,335.000" fill="none" stroke="#176786" stroke-width="3"/><circle cx="250.000" cy="162.000" r="8" fill="#172b45"/><circle cx="342.000" cy="335.000" r="14" fill="#176786"/><path d="M250.000,162.000 L250.000,350.000" fill="none" stroke="#a8b7c4" stroke-width="3" stroke-dasharray="7 6"/><text x="290" y="219" font-size="26" fill="#b77a09" text-anchor="start">θ</text><text x="425" y="223" font-size="25" fill="#172b45" text-anchor="start">自由度：1</text><text x="425" y="264" font-size="22" fill="#172b45" text-anchor="start">写 1 条二阶方程</text><text x="48" y="388" font-size="23" fill="#172b45" text-anchor="start">杆长固定，所以 x、y 不能独立选择。</text><rect x="24" y="438" width="672" height="388" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="478" font-size="25" fill="#176786" text-anchor="start">双摆：两个独立角度 θ₁、θ₂</text><path d="M265.000,516.000 L349.696,639.800" fill="none" stroke="#176786" stroke-width="3"/><path d="M349.696,639.800 L263.614,723.405" fill="none" stroke="#b34039" stroke-width="3"/><circle cx="265.000" cy="516.000" r="8" fill="#172b45"/><circle cx="349.696" cy="639.800" r="13" fill="#176786"/><circle cx="263.614" cy="723.405" r="13" fill="#b34039"/><path d="M265.000,516.000 L265.000,671.000" fill="none" stroke="#a8b7c4" stroke-width="3" stroke-dasharray="7 6"/><path d="M349.696,639.800 L349.696,784.800" fill="none" stroke="#a8b7c4" stroke-width="3" stroke-dasharray="7 6"/><text x="270" y="611" font-size="26" fill="#176786" text-anchor="start">θ₁</text><text x="311" y="714" font-size="26" fill="#b34039" text-anchor="start">θ₂</text><text x="450" y="580" font-size="25" fill="#172b45" text-anchor="start">自由度：2</text><text x="450" y="626" font-size="22" fill="#172b45" text-anchor="start">写 2 条耦合</text><text x="450" y="664" font-size="22" fill="#172b45" text-anchor="start">二阶方程</text><text x="48" y="794" font-size="22" fill="#172b45" text-anchor="start">第二个球的速度，还包含第一个关节带来的运动。</text><rect x="24" y="846" width="672" height="186" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="886" font-size="22" fill="#172b45" text-anchor="start">空间中无约束的刚体：3 个位置 + 3 个姿态参数。</text><text x="48" y="934" font-size="22" fill="#172b45" text-anchor="start">局部共 6 个自由度，不等于有 6 个互不影响的运动。</text><text x="48" y="982" font-size="22" fill="#172b45" text-anchor="start">机器人、刚体、振动系统：换坐标，统一列方程。</text></svg>
