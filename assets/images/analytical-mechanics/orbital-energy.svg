<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1030" viewBox="0 0 720 1030" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">中心引力轨道与有效势能的同一组计算</title><desc id="desc">归一化固定中心模型，角动量零点八、能量负零点六。椭圆近日远日距离与有效势能水平线两交点一致。谷底对应同一角动量下的圆轨道，势能图两轴为不同物理量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1030" fill="#f3f7fa"/><text x="36" y="48" font-size="29" fill="#172b45" text-anchor="start">⑧ 把二维轨道，变成径向能量账</text><rect x="24" y="76" width="672" height="424" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="116" font-size="23" fill="#172b45" text-anchor="start">理想固定中心引力；归一化单位 GM = m = 1</text><text x="48" y="154" font-size="23" fill="#172b45" text-anchor="start">取角动量 J = 0.8、总能量 E = −0.6</text><path d="M493.431,294.000 L493.409,291.833 L493.345,289.667 L493.237,287.502 L493.086,285.340 L492.892,283.180 L492.655,281.023 L492.375,278.870 L492.052,276.722 L491.687,274.579 L491.279,272.442 L490.828,270.311 L490.335,268.188 L489.800,266.072 L489.223,263.965 L488.604,261.868 L487.943,259.779 L487.241,257.702 L486.497,255.635 L485.713,253.581 L484.887,251.538 L484.022,249.508 L483.115,247.492 L482.169,245.491 L481.183,243.503 L480.158,241.532 L479.093,239.576 L477.990,237.637 L476.849,235.715 L475.669,233.811 L474.451,231.925 L473.196,230.058 L471.904,228.210 L470.576,226.383 L469.211,224.576 L467.811,222.790 L466.375,221.026 L464.904,219.284 L463.399,217.565 L461.860,215.870 L460.287,214.198 L458.681,212.550 L457.043,210.927 L455.373,209.330 L453.671,207.758 L451.938,206.212 L450.174,204.694 L448.381,203.202 L446.558,201.738 L444.706,200.302 L442.826,198.895 L440.918,197.517 L438.983,196.168 L437.021,194.849 L435.034,193.560 L433.021,192.302 L430.983,191.075 L428.921,189.879 L426.836,188.714 L424.728,187.5