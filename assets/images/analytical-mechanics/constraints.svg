4039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="480" y="389.45" font-size="17.5" fill="#b34039" text-anchor="start">虚位移 δr</text><path d="M410.000,362.526 L410.000,436.526" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><text x="431" y="462.45" font-size="17.5" fill="#172b45" text-anchor="start">重力 mg</text><rect x="24" y="538" width="672" height="234" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="577.45" font-size="17.5" fill="#172b45" text-anchor="start">① 只在同一时刻，想象一个满足杆长的微小位移。</text><text x="48" y="624.45" font-size="17.5" fill="#172b45" text-anchor="start">② 它沿圆弧切线，不是任意指向。</text><text x="48" y="671.45" font-size="17.5" fill="#172b45" text-anchor="start">③ 杆力沿半径，与这个虚位移垂直。</text><text x="48" y="718.45" font-size="17.5" fill="#172b45" text-anchor="start">因此杆力的虚功为零，但杆力并没有消失。</text><rect x="24" y="792" width="672" height="168" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="832.45" font-size="17.5" fill="#172b45" text-anchor="start">位置：x = l sin θ，y = −l cos θ</text><text x="48" y="877.45" font-size="17.5" fill="#172b45" text-anchor="start">支点为原点；x 向右、y 向上为正。</text><text x="48" y="922.45" font-size="17.5" fill="#172b45" text-anchor="start">约束：x² + y² = l² → 只需 θ 来描述位置。</text></g></svg>
