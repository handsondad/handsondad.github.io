<svg xmlns="http://www.w3.org/2000/svg" width="540" height="742.5" viewBox="0 0 540 742.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">单摆广义坐标与理想约束力的零虚功</title><desc id="desc">单摆位置由一个角度决定，虚位移与杆方向正交。支点为原点，横坐标向右、纵坐标向上，位置公式与坐标图一致。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="741" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="45.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">② 两个位置坐标，只有一个自由度</text><rect x="24" y="76" width="672" height="442" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="111.45" font-size="17.5" fill="#172b45" text-anchor="start">固定支点、定长轻杆、平面运动；图取 θ = 30°</text><path d="M82.000,172.000 L560.000,172.000" fill="none" stroke="#a3afb9" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M300.000,172.000 L300.000,134.000" fill="none" stroke="#a3afb9" stroke-width="2.4" marker-end="url(#arrow)"/><text x="570" y="179.39" font-size="18.2" fill="#172b45" text-anchor="start">x</text><text x="271" y="153.39" font-size="18.2" fill="#172b45" text-anchor="start">y</text><path d="M142.182,325.275 L143.550,326.672 L144.931,328.057 L146.325,329.429 L147.730,330.789 L149.148,332.136 L150.577,333.471 L152.018,334.792 L153.471,336.101 L154.935,337.397 L156.411,338.680 L157.899,339.950 L159.397,341.206 L160.907,342.449 L162.427,343.679 L163.959,344.895 L165.501,346.098 L167.054,347.286 L168.617,348.461 L170.191,349.622 L171.775,350.769 L173.369,351.901 L174.973,353.020 L176.587,354.124 L178.211,355.214 L179.844,356.289 L181.487,357.350 L183.139,358.396 L184.800,359.428 L186.471,360.444 L188.151,361.446 L189.839,362.432 L191.536,363.404 L193.242,364.361 L