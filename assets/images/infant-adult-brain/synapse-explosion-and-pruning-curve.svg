<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes highwayGlow {
      0% { stroke-dashoffset: 260; opacity: 0.35; }
      65% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes pruneDim {
      0%, 35% { opacity: 0.85; }
      100% { opacity: 0.28; }
    }
    .anim-hwy {
      stroke-dasharray: 260;
      stroke-dashoffset: 0;
      animation: highwayGlow 3.0s ease-out 1 both;
    }
    .anim-prune {
      opacity: 0.28;
      animation: pruneDim 3.0s ease-out 1 both;
    }
    @media (prefers-reduced-motion: reduce) {
      .anim-hwy, .anim-prune {
        animation: none !important;
        stroke-dashoffset: 0 !important;
      }
      .anim-hwy { opacity: 1 !important; }
      .anim-prune { opacity: 0.28 !important; }
    }
</style>
<rect x="0.5" y="0.5" width="759" height="537" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">硬件账本第二怪：2 岁宝宝的突触连接密度，竟然是成年人的近 2 倍！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先看左图三大脑区分波疯长与修剪曲线 → 再看右图“先铺满小路、再修剪成高速公路”（含单次修剪强化动画）</text>
