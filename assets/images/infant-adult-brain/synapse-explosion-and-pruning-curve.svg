<svg xmlns="http://www.w3.org/2000/svg" width="760" height="538" viewBox="0 0 760 538" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">人类大脑突触爆发式生成与修剪曲线及三阶段神经网络重塑对比图</title>
<desc id="desc">左栏绘制视听皮层、语言区与前额叶突触密度冲上成人近200%后再修剪回100%的分波曲线，右栏对比新生儿稀疏网、幼儿全连接丛林与成人修剪后高速主干道。</desc>
