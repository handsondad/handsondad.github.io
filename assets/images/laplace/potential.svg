−1</text><text x="35" y="308.94" font-size="15.2" fill="#172b45" text-anchor="start">−0.25</text><rect x="24" y="568" width="672" height="260" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="609.39" font-size="18.2" fill="#172b45" text-anchor="start">看 P = (1, 0, 0)，不在中心质量上：</text><text x="48" y="662.39" font-size="18.2" fill="#172b45" text-anchor="start">三个方向的势曲率分别是 −2、+1、+1。</text><text x="48" y="715.39" font-size="18.2" fill="#172b45" text-anchor="start">加起来为 0；但势 Φ = −1，引力大小为 1。</text><text x="48" y="768.39" font-size="18.2" fill="#172b45" text-anchor="start">“没有当地质量”不等于“没有远方的引力”。</text><text x="36" y="872.45" font-size="17.5" fill="#172b45" text-anchor="start">完整三维函数：Φ(x,y,z) = −1 / √(x²+y²+z²)。</text></g></svg>
