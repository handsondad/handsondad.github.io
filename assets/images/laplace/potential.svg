<svg xmlns="http://www.w3.org/2000/svg" width="540" height="690" viewBox="0 0 540 690" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">引力势和真空中的拉普拉斯方程</title><desc id="desc">曲线为天体外部负一除以r的势。无量纲点P处三个坐标二阶偏导为负二、正一、正一，和为零但势与引力均不为零。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="688.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑤ 引力势不为零，拉普拉斯和却可以为零</text><text x="36" y="89.45" font-size="17.5" fill="#172b45" text-anchor="start">球对称天体外部：把距离和势都无量纲化。</text><text x="36" y="125.45" font-size="17.5" fill="#172b45" text-anchor="start">本图令 GM = 1，横轴 r 从 1 到 4，不画内部。</text><path d="M90.000,245.000 L650.000,245.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M90.000,513.000 L90.000,190.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M90.000,475.000 L92.125,472.160 L94.250,469.390 L96.375,466.687 L98.500,464.048 L100.625,461.471 L102.750,458.953 L104.875,456.494 L107.000,454.091 L109.125,451.742 L111.250,449.444 L113.375,447.198 L115.500,445.000 L117.625,442.849 L119.750,440.745 L121.875,438.684 L124.000,436.667 L126.125,434.691 L128.250,432.755 L130.375,430.859 L132.500,429.000 L134.625,427.178 L136.750,425.392 L138.875,423.641 L141.000,421.923 L143.125,420.238 L145.250,418.585 L147.375,416.963 L149.500,415.370 L151.625,413.807 L153.750,412.273 L155.875,410.766 L158.000,409.286 L160.125,407.832 L162.250,406.404 L164.375,405.000 L166.500,403.621 L168.625,402.265 L170.750,400.932 L172.875,399.622 L175.000,398.333 L177.125,397.066 L179.250,395.820 L181.375,394.593 L183.500