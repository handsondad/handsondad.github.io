<svg xmlns="http://www.w3.org/2000/svg" width="720" height="750" viewBox="0 0 720 750" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">日心摄动需要直接项和间接项</title><desc id="desc">共线教学构型中，土星对木星的加速度约为对太阳的4.84倍；两者都向土星，日心额外加速度为差。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="750" fill="#f3f7fa"/><text x="36" y="49" font-size="29" fill="#172b45" text-anchor="start">② 土星拉木星，也拉着太阳</text><text x="36" y="91" font-size="23" fill="#172b45" text-anchor="start">只看日心位置时，要扣除太阳本身的加速度。</text><text x="36" y="127" font-size="23" fill="#172b45" text-anchor="start">下面采用同一直线上的构型，距离按比例画。</text><path d="M90.000,300.000 L595.444,300.000" fill="none" stroke="#a2b4c2" stroke-width="3" stroke-dasharray="7 6"/><circle cx="90.000" cy="300.000" r="15" fill="#b77a09"/><circle cx="365.753" cy="300.000" r="11" fill="#176786"/><circle cx="595.444" cy="300.000" r="12" fill="#b34039"/><text x="90" y="348" font-size="24" fill="#172b45" text-anchor="middle">太阳</text><text x="365.75301099999996" y="348" font-size="24" fill="#172b45" text-anchor="middle">木星 J</text><text x="595.44382482" y="348" font-size="24" fill="#172b45" text-anchor="middle">土星 S</text><path d="M90.000,238.000 L122.000,238.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><path d="M365.753,238.000 L520.709,238.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="197" font-size="22" fill="#172b45" text-anchor="start">土星引起的加速度：1 份</text><text x="345" y="197" font-size="22" fill="#172b45" text-anchor="start">加速度：4.84 份</text><rect x="24" y="400" width="672" height="257" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="443" font-size="24" fill="#172b45" text-anchor="start">① 木星确实被土星向右拉。</text><text x="48" y="491" font-size="24" fill="#172b45" text-anchor="start">② 太阳也被土星向右拉，但加速度较小。</text><text x="48" y="539" font-size="24" fill="#172b45" text-anchor="start">③ 木星相对太阳的额外加速度＝两者之差。</text><text x="48" y="624" font-size="22" fill="#172b45" text-anchor="start">图中红箭头表示加速度，长度按同一倍率绘制。</text><text x="36" y="706" font-size="22" fill="#172b45" text-anchor="start">不是所有“行星受到的力”，都能直接当日心方程的项。</text></svg>
