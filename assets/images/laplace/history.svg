<svg xmlns="http://www.w3.org/2000/svg" width="540" height="660" viewBox="0 0 540 660" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">从牛顿到现代星历的天体力学路标</title><desc id="desc">六个历史路标说明拉普拉斯连接牛顿引力、分析计算与可检验的天文预报；并未证明永远稳定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="658.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">① 一条引力定律，为什么需要几代人？</text><rect x="24" y="85" width="672" height="103" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="117.39" font-size="18.2" fill="#176786" text-anchor="start">1687</text><text x="242" y="117.32" font-size="19.0" fill="#172b45" text-anchor="start">牛顿</text><text x="48" y="160.45" font-size="17.5" fill="#172b45" text-anchor="start">给出运动定律与万有引力。</text><rect x="24" y="205" width="672" height="103" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="237.39" font-size="18.2" fill="#176786" text-anchor="start">18 世纪</text><text x="242" y="237.32" font-size="19.0" fill="#172b45" text-anchor="start">欧拉、拉格朗日等</text><text x="48" y="280.45" font-size="17.5" fill="#172b45" text-anchor="start">发展分析方法与摄动计算。</text><rect x="24" y="325" width="672" height="103" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="357.39" font-size="18.2" fill="#176786" text-anchor="start">1780 年代</text><text x="242" y="357.32" font-size="19.0" fill="#172b45" text-anchor="start">拉普拉斯</text><text x="48" y="400.45" font-size="17.5" fill="#172b45" text-anchor="start">解释木星、土星的长周期偏差。</text><rect x="24" y="445" width="672" height="103" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="477.39" font-size="18.2" fill="#176786" text-anchor="start">1799 起</text><text x="242" y="477.32" font-size="19.0" fill="#172b45" text-anchor="start">《天体力学》</text><text x="48" y="520.45" font-size="17.5" fill="#172b45" text-anchor="start">前两卷出版，全书共五卷。</text><rect x="24" y="565" width="672" height="103" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="597.39" font-size="18.2" fill="#176786" text-anchor="start">19 世纪末</text><text x="242" y="597.32" font-size="19.0" fill="#172b45" text-anchor="start">庞加莱</text><text x="48" y="640.45" font-size="17.5" fill="#172b45" text-anchor="start">揭示三体问题远比想象复杂。</text><rect x="24" y="685" width="672" height="103" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="717.39" font-size="18.2" fill="#176786" text-anchor="start">今天</text><text x="242" y="717.32" font-size="19.0" fill="#172b45" text-anchor="start">观测与数值积分</text><text x="48" y="760.45" font-size="17.5" fill="#172b45" text-anchor="start">精密星历与长期统计研究并行。</text><text x="36" y="840.52" font-size="16.7" fill="#172b45" text-anchor="start">年份是研究与出版路标，不是一人接替一人的完整名单。</text></g></svg>
