<svg xmlns="http://www.w3.org/2000/svg" width="540" height="663.75" viewBox="0 0 540 663.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">从观测到预报的天体力学工作链</title><desc id="desc">五步连接观测、物理模型、积分拟合、残差和新预报，并区别短期精度、长期稳定性与混沌。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="662.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑥ 预报不是只把方程往后算</text><rect x="24" y="85" width="672" height="99" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="118.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">① 观测</text><text x="48" y="160.45" font-size="17.5" fill="#172b45" text-anchor="start">测角、测距、航天器无线电数据。</text><rect x="24" y="199" width="672" height="99" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="232.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">② 建模</text><text x="48" y="274.45" font-size="17.5" fill="#172b45" text-anchor="start">质量、引力、相对论修正等。</text><rect x="24" y="313" width="672" height="99" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="346.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">③ 积分与拟合</text><text x="48" y="388.45" font-size="17.5" fill="#172b45" text-anchor="start">调整初值和参数，让模型贴近观测。</text><rect x="24" y="427" width="672" height="99" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="460.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">④ 检查残差</text><text x="48" y="502.45" font-size="17.5" fill="#172b45" text-anchor="start">区分测量噪声、数值误差、遗漏的物理。</text><rect x="24" y="541" width="672" height="99" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="574.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">⑤ 预报并再检验</text><text x="48" y="616.45" font-size="17.5" fill="#172b45" text-anchor="start">给出适用时段，继续接受新观测挑战。</text><text x="36" y="702.39" font-size="18.2" fill="#172b45" text-anchor="start">能预报一段时间 ≠ 证明永远稳定。</text><text x="36" y="753.39" font-size="18.2" fill="#172b45" text-anchor="start">存在长期混沌 ≠ 明天就会发生行星碰撞。</text><text x="36" y="804.39" font-size="18.2" fill="#172b45" text-anchor="start">规律确定 ≠ 有限精度的初值能预知无限未来。</text></g></svg>
