<svg xmlns="http://www.w3.org/2000/svg" width="720" height="885" viewBox="0 0 720 885" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">从观测到预报的天体力学工作链</title><desc id="desc">五步连接观测、物理模型、积分拟合、残差和新预报，并区别短期精度、长期稳定性与混沌。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="885" fill="#f3f7fa"/><text x="36" y="49" font-size="29" fill="#172b45" text-anchor="start">⑥ 预报不是只把方程往后算</text><rect x="24" y="85" width="672" height="99" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="120" font-size="26" fill="#176786" text-anchor="start">① 观测</text><text x="48" y="162" font-size="23" fill="#172b45" text-anchor="start">测角、测距、航天器无线电数据。</text><rect x="24" y="199" width="672" height="99" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="234" font-size="26" fill="#176786" text-anchor="start">② 建模</text><text x="48" y="276" font-size="23" fill="#172b45" text-anchor="start">质量、引力、相对论修正等。</text><rect x="24" y="313" width="672" height="99" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="348" font-size="26" fill="#176786" text-anchor="start">③ 积分与拟合</text><text x="48" y="390" font-size="23" fill="#172b45" text-anchor="start">调整初值和参数，让模型贴近观测。</text><rect x="24" y="427" width="672" height="99" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="462" font-size="26" fill="#176786" text-anchor="start">④ 检查残差</text><text x="48" y="504" font-size="23" fill="#172b45" text-anchor="start">区分测量噪声、数值误差、遗漏的物理。</text><rect x="24" y="541" width="672" height="99" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="576" font-size="26" fill="#176786" text-anchor="start">⑤ 预报并再检验</text><text x="48" y="618" font-size="23" fill="#172b45" text-anchor="start">给出适用时段，继续接受新观测挑战。</text><text x="36" y="704" font-size="24" fill="#172b45" text-anchor="start">能预报一段时间 ≠ 证明永远稳定。</text><text x="36" y="755" font-size="24" fill="#172b45" text-anchor="start">存在长期混沌 ≠ 明天就会发生行星碰撞。</text><text x="36" y="806" font-size="24" fill="#172b45" text-anchor="start">规律确定 ≠ 有限精度的初值能预知无限未来。</text></svg>
