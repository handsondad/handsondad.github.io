<svg xmlns="http://www.w3.org/2000/svg" width="720" height="855" viewBox="0 0 720 855" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">三体积分相对独立二体基线的方向偏差</title><desc id="desc">采用人工共面近圆初值；太阳也参与运动。横轴0至120年，纵轴木星方向偏差，真实质量与十倍行星质量用同一尺度比较。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="855" fill="#f3f7fa"/><text x="36" y="49" font-size="29" fill="#172b45" text-anchor="start">③ 椭圆是起点，偏差才是线索</text><text x="36" y="91" font-size="23" fill="#172b45" text-anchor="start">同一组人工初始位置与速度，积分 120 年。</text><text x="36" y="127" font-size="23" fill="#172b45" text-anchor="start">比较：三体木星方向 − 独立二体基线方向。</text><path d="M100.000,565.000 L655.000,565.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M100.000,565.000 L100.000,190.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M100.000,550.000 L640.000,550.000" fill="none" stroke="#d5dfe6" stroke-width="3" stroke-dasharray="7 6"/><text x="83" y="557" font-size="21" fill="#172b45" text-anchor="end">-10</text><path d="M100.000,486.000 L640.000,486.000" fill="none" stroke="#d5dfe6" stroke-width="3" stroke-dasharray="7 6"/><text x="83" y="493" font-size="21" fill="#172b45" text-anchor="end">-8</text><path d="M100.000,422.000 L640.000,422.000" fill="none" stroke="#d5dfe6" stroke-width="3" stroke-dasharray="7 6"/><text x="83" y="429" font-size="21" fill="#172b45" text-anchor="end">-6</text><path d="M100.000,358.000 L640.000,358.000" fill="none" stroke="#d5dfe6" stroke-width="3" stroke-dasharray="7 6"/><text x="83" y="365" font-size="21" fill="#172b45" text-anchor="end">-4</text><path d="M100.000,294.000 L640.000,294.000" fill="none" stroke="#d5dfe6" stroke-width="3" stroke-dasharray="7 6"/><text x="83" y="301" font-size="21" fill