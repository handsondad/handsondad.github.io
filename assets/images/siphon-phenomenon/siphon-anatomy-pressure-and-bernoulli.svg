  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#dc2626"/>
  </marker>
  <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#6d28d9"/>
  </marker>
  <marker id="arr-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f766e"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes siphonParcel {
    0%   { stroke-dashoffset: 380; opacity: 0.25; }
    15%  { opacity: 0.95; }
    100% { stroke-dashoffset: 0; opacity: 0.95; }
  }
  .anim-flow {
    stroke-dasharray: 10 14;
    stroke-dashoffset: 380;
    animation: siphonParcel 3.2s cubic-bezier(0.22, 0.61, 0.36, 1) 1 forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .anim-flow {
      animation: none !important;
      stroke-dashoffset: 0 !important;
      opacity: 0.95 !important;
    }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="489" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">虹吸管剖面、沿管压强曲线与希罗反例：水为什么愿意先爬坡再下坠？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">模型参数：P₀ = 101.3 kPa，爬升高度 h₁ = 0.60 m，液面总落差 H = 0.80 m（20 °C 清水）</text>
<rect x="20" y="62" width="366" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="40" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="40" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="58" y="88" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">物理空间：四处关键截面（A → B → C → D）</text>
<rect x="42" y="186" width="112" height="72" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<rect x="44" y="204" width="108" height="52" rx="2" fill="#dbeafe"/>
<line x1="44.0" y1="204.0" x2="152.0" y2="204.0" stroke="#1d6fa5" stroke-width="2.0" stroke-linecap="round"/>
