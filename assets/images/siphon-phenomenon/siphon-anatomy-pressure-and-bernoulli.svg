<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">虹吸管物理剖面、沿管绝对压强分布与古希腊希罗反例</title>
<desc id="desc">左图展示虹吸管A自由液面、B等高面、C管顶最高点与D出口射流面及希罗反例；右图对比理想伯努利流与真实黏性管流的沿管绝对压强曲线。</desc>
