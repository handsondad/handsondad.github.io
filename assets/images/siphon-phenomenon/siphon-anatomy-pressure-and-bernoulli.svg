<rect x="234" y="316" width="96" height="44" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<rect x="236" y="334" width="92" height="24" rx="2" fill="#dbeafe"/>
<line x1="234.0" y1="316.0" x2="330.0" y2="316.0" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"/>
<line x1="152.0" y1="204.0" x2="368.0" y2="204.0" stroke="#1d6fa5" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="188.0" y1="132.0" x2="368.0" y2="132.0" stroke="#dc2626" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="266.0" y1="300.0" x2="368.0" y2="300.0" stroke="#18794e" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 3"/>
<line x1="334.0" y1="202.0" x2="334.0" y2="135.0" stroke="#dc2626" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="342" y="171" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600">h₁=0.6m</text>
<line x1="334.0" y1="206.0" x2="334.0" y2="297.0" stroke="#18794e" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr-green)"/>
<text x="342" y="256" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">H=0.8m</text>
<path d="M 116,238 L 116,162 C 116,122 262,122 262,162 L 262,300" fill="none" stroke="#334155" stroke-width="15" stroke-linecap="butt"/>
<path d="M 116,238 L 116,162 C 116,122 262,122 262,162 L 262,300" fill="none" stroke="#93c5fd" stroke-width="11" stroke-linecap="butt"/>
<path d="M 116,238 L 116,162 C 116,122 262,122 262,162 L 262,300" fill="none" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round" class="anim-flow"/>
<line x1="262.0" y1="301.0" x2="262.0" y2="332.0" stroke="#60a5fa" stroke-width="6.5" stroke-linecap="round"/>
