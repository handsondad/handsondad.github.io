<line x1="74.0" y1="166.0" x2="74.0" y2="199.0" stroke="#c25014" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="74" y="160" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">大气压 P₀</text>
<circle cx="74.0" cy="204.0" r="8.5" fill="#ffffff" stroke="#c25014" stroke-width="2"/>
<text x="74" y="208.0" font-size="11" fill="#c25014" text-anchor="middle" font-weight="700">A</text>
<circle cx="116.0" cy="204.0" r="8.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="2"/>
<text x="116" y="208.0" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="700">B</text>
<circle cx="189.0" cy="132.0" r="8.5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="189" y="136" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">C</text>
<circle cx="262.0" cy="300.0" r="8.5" fill="#ffffff" stroke="#18794e" stroke-width="2"/>
<text x="262" y="304.0" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">D</text>
<text x="46" y="274" font-size="11" fill="#1e293b" text-anchor="start">A: z=0, v≈0, P=P₀</text>
<text x="46" y="291" font-size="11" fill="#1d6fa5" text-anchor="start">B: z=0, P_B &lt; P₀ (流速降压)</text>
<text x="189" y="115" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="600">C 管顶最低压区 (易析出气泡)</text>
<text x="144" y="348" font-size="11" fill="#18794e" text-anchor="start" font-weight="600">D 实测流速 ≈ 1.29 m/s</text>
<rect x="34" y="372" width="338" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
<text x="46" y="391" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">古希腊希罗反例（《气动力学》命题 1，约公元 1 世纪）：</text>
<text x="46" y="410" font-size="11" fill="#1e293b" text-anchor="start">• 误区：“外侧管更粗、装水总重量更大，就能把水拽出来”</text>
<text x="46" y="428" font-size="11" fill="#1e293b" text-anchor="start">• 希罗实验：内侧细长、外侧粗短（出口高于上液面 H &lt; 0），</text>
<text x="46" y="446" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">  哪怕外管水重十倍，水仍倒流回桶！决定流向的唯独是高差 H。</text>
<rect x="398" y="62" width="342" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="418" cy="84" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="418" y="88" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="436" y="88" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">沿管绝对压强分布 P(s)：理想 vs 真实黏性流</text>
<line x1="448.0" y1="306.0" x2="718.0" y2="306.0" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="442.0" y="310.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">88</text>
<line x1="448.0" y1="266.0" x2="718.0" y2="266.0" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="442.0" y="270.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">92</text>
<line x1="448.0" y1="226.0" x2="718.0" y2="226.0" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="442.0" y="230.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">96</text>
<line x1="448.0" y1="186.0" x2="718.0" y2="186.0" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="442.0" y="190.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">100</text>
<line x1="448.0" y1="146.0" x2="718.0" y2="146.0" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="442.0" y="150.0" font-size="10.5" fill="#64748b" text-anchor="end" class="mono">104</text>
<text x="442" y="114" font-size="11" fill="#64748b" text-anchor="start">绝对压强 P (kPa)</text>
<line x1="448.0" y1="172.7" x2="718.0" y2="172.7" stroke="#c25014" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 3"/>
<text x="716.0" y="167.7" font-size="10.5" fill="#c25014" text-anchor="end" font-weight="600">大气压 101.3 kPa</text>
<line x1="448.0" y1="126.0" x2="448.0" y2="326.0" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<line x1="448.0" y1="326.0" x2="718.0" y2="326.0" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<polyline points="448.0,226.6 470.5,251.1 542.5,309.8 718.0,172.7" fill="none" stroke="#6d28d9" stroke-width="2.0" stroke-dasharray="5 4"/>
<polyline points="448.0,160.6 470.5,189.9 542.5,267.3 718.0,172.7" fill="none" stroke="#1d6fa5" stroke-width="2.6"/>
<line x1="448.0" y1="326.0" x2="448.0" y2="330.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="446.0" y="343.0" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">管口</text>
<circle cx="448.0" cy="160.6" r="4.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.4"/>
<line x1="470.5" y1="326.0" x2="470.5" y2="330.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="474.5" y="343.0" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">B</text>
<circle cx="470.5" cy="189.9" r="4.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.4"/>
<line x1="542.5" y1="326.0" x2="542.5" y2="330.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="542.5" y="343.0" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">C(管顶)</text>
<circle cx="542.5" cy="267.3" r="4.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.4"/>
<line x1="718.0" y1="326.0" x2="718.0" y2="330.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
<text x="718.0" y="343.0" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="600">D(出口)</text>
<circle cx="718.0" cy="172.7" r="4.2" fill="#1d6fa5" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="542.5" cy="309.8" r="4.0" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<text x="550.5" y="261.3" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">真实管顶 91.9 kPa</text>
<text x="550.5" y="322.8" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="600">无摩擦理想 87.6 kPa</text>
<line x1="416.0" y1="362.0" x2="444.0" y2="362.0" stroke="#1d6fa5" stroke-width="2.6" stroke-linecap="round"/>
<text x="450" y="366" font-size="11" fill="#1e293b" text-anchor="start">真实软管（内径 12 mm，长 3 m）：v ≈ 1.29 m/s</text>
<line x1="416.0" y1="382.0" x2="444.0" y2="382.0" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="450" y="386" font-size="11" fill="#1e293b" text-anchor="start">理想无黏性流（托里拆利极限）：v = √(2gH) = 3.96 m/s</text>
<rect x="412" y="398" width="314" height="64" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1.0"/>
<text x="424" y="418" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">读图关键：从 A 到 C 压强一路跌破大气压（负表压抽吸），</text>
<text x="424" y="436" font-size="11" fill="#1e293b" text-anchor="start">过了管顶 C 后重力加速大于沿程摩擦，压强回升至出口 D</text>
<text x="424" y="453" font-size="11" fill="#1e293b" text-anchor="start">的 P₀；管越细长，摩擦耗散越大，管顶低压反而更温和。</text>
</svg>
