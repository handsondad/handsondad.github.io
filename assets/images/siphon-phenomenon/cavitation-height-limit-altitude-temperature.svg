<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">普通水虹吸的“生死红线”：水温、海拔与微米气核如何锁死爬升高度？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">一旦管顶压强跌至饱和蒸气压 Pᵥ，水在室温下剧烈沸腾（气蚀断流）；开水根本无法向上虹吸</text>
