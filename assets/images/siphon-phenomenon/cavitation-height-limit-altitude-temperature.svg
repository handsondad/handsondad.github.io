<text x="352.0" y="312.0" font-size="10.8" fill="#0f172a" text-anchor="end" font-weight="700">100°C: 0 m (沸水断流)</text>
<rect x="34" y="354" width="334" height="98" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.0"/>
<text x="46" y="374" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">生活反直觉实验：为什么刚烧开的热水很难用软管虹吸？</text>
<text x="46" y="393" font-size="11" fill="#1e293b" text-anchor="start">• 20 °C 冷水饱和蒸气压仅 2.33 kPa，大气压还能撑起 10.1 m；</text>
<text x="46" y="411" font-size="11" fill="#1e293b" text-anchor="start">• 85 °C 热水蒸气压暴涨至 57.8 kPa，极限高度腰斩至 4.6 m；</text>
<text x="46" y="429" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">• 100 °C 沸水 Pᵥ = P₀，只要软管略高于液面立刻沸腾断流！</text>
<rect x="396" y="62" width="344" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="416" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="416" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="434" y="88" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">海拔气压衰减（20 °C 水）与微米气核准则</text>
<text x="540" y="127.0" font-size="11" fill="#1e293b" text-anchor="end">海平面 (0 m)</text>
<rect x="548.0" y="114.0" width="152.0" height="18" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="114.0" width="139.8" height="18" rx="4" fill="#1d6fa5"/>
<text x="693.8" y="127.0" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700" class="mono">10.1 m</text>
