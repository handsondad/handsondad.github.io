<rect x="548.0" y="146.0" width="152.0" height="18" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="146.0" width="110.5" height="18" rx="4" fill="#0f766e"/>
<text x="664.5" y="159.0" font-size="11" fill="#0f766e" text-anchor="start" font-weight="700" class="mono">8.0 m</text>
<text x="540" y="191.0" font-size="11" fill="#1e293b" text-anchor="end">拉萨 (3650 m)</text>
<rect x="548.0" y="178.0" width="152.0" height="18" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="178.0" width="87.8" height="18" rx="4" fill="#18794e"/>
<text x="641.8" y="191.0" font-size="11" fill="#18794e" text-anchor="start" font-weight="700" class="mono">6.4 m</text>
<text x="540" y="223.0" font-size="11" fill="#1e293b" text-anchor="end">珠峰大本营 (5200 m)</text>
<rect x="548.0" y="210.0" width="152.0" height="18" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="210.0" width="71.0" height="18" rx="4" fill="#c25014"/>
<text x="625.0" y="223.0" font-size="11" fill="#c25014" text-anchor="start" font-weight="700" class="mono">5.1 m</text>
<text x="540" y="255.0" font-size="11" fill="#1e293b" text-anchor="end">客机巡航高度 (12000 m)</text>
<rect x="548.0" y="242.0" width="152.0" height="18" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="242.0" width="23.9" height="18" rx="4" fill="#dc2626"/>
<text x="577.9" y="255.0" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700" class="mono">1.7 m</text>
<rect x="410" y="282" width="316" height="170" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.1"/>
<text x="422" y="303" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">杨-拉普拉斯气核定律：ΔP = 2γ / r（γ = 0.072 N/m）</text>
<text x="422" y="323" font-size="11" fill="#1e293b" text-anchor="start">• 管壁缝隙藏着直径 ≥ 2.8 μm 微气泡：负压刚过 1 atm</text>
<text x="422" y="341" font-size="11" fill="#1e293b" text-anchor="start">  （爬升 &gt; 10.1 m）气核瞬间失稳膨胀，扯断水柱；</text>
<text x="422" y="361" font-size="11" fill="#1e293b" text-anchor="start">• 真空脱气 + 表面活性剂润湿除核：消除微米气核后，</text>
<text x="422" y="379" font-size="11" fill="#1e293b" text-anchor="start">  实验室虹吸一举爬上 15.4 m（负压 -49 kPa）；</text>
<text x="422" y="399" font-size="11" fill="#1e293b" text-anchor="start">• 北美巨杉木质部纹孔膜（纳米孔径 ~2.8 nm）：可抗</text>
<text x="422" y="417" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">  100 MPa 级张力，靠叶片蒸腾把水拉上 110 米树冠！</text>
<rect x="422.0" y="426.0" width="288" height="20" rx="10.0" fill="#ffffff" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="566.0" y="439.6" font-size="10.8" fill="#0f766e" text-anchor="middle" font-weight="600">气泡越小 → 表面张力锁死越紧 → 抗负压越强</text>
</svg>
