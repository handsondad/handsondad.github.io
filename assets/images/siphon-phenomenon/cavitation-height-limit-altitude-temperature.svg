<title id="title">水虹吸极限爬升高度与水温、海拔及微米气核关系图</title>
<desc id="desc">左图基于安托万方程绘制0至100摄氏度海平面水虹吸极限高度曲线；右图展示不同海拔极限高度条形对比及杨-拉普拉斯微米气核失稳与巨杉纳米抗负压机理。</desc>
