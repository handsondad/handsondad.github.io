<text x="46" y="362" font-size="9.7" fill="#1e293b" text-anchor="start">• 仿射不变性：先旋转控制点再画线 = 先画线再整条旋转；</text>
<text x="46" y="382" font-size="9.7" fill="#1e293b" text-anchor="start">• t=0 时 b0=1（锁死起点 P0），t=1 时 b3=1（锁死终点 P3），</text>
