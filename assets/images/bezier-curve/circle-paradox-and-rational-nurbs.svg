<text x="414" y="357" font-size="9.5" fill="#1e293b" text-anchor="start">  借射影几何把三维锥面投影回平面，分子分母同乘权重 w_i：</text>
<text x="414" y="377" font-size="9.5" fill="#18794e" text-anchor="start" font-weight="700">  w1 &lt; 1 精确生成椭圆/正圆，w1 = 1 抛物线，w1 &gt; 1 双曲线！</text>
<text x="414" y="397" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">  再结合分段局部B样条，就诞生了工业界霸主 NURBS 曲面。</text>
