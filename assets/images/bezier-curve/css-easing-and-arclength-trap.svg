<text x="448" y="202" font-size="9.2" fill="#c25014" text-anchor="middle" font-weight="600">短手柄处挤成一团（慢）</text>
<text x="640" y="202" font-size="9.2" fill="#c25014" text-anchor="middle" font-weight="600">长跨度处大步狂飙（快 2.8 倍！）</text>
<text x="414" y="224" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">② 弧长重参数化 s(t) = ∫|B&#x27;(u)|du 等距采样（11 颗绿点）：</text>
