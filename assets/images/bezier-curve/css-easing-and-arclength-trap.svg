<text x="564" y="304" font-size="9.3" fill="#18794e" text-anchor="middle" font-weight="700">像铁轨枕木一样步步等距！数控机床与自动驾驶必做这一步</text>
<rect x="402" y="324" width="324" height="96" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="414" y="344" font-size="9.6" fill="#1e293b" text-anchor="start">• 贝塞尔弧长 ∫√(x&#x27;²+y&#x27;²)dt 一般没有初等公式解（阿贝尔积分）！</text>
<text x="414" y="364" font-size="9.6" fill="#1e293b" text-anchor="start">• 游戏摄像机、激光切割头与无人车变道规划，都必须先用高斯积</text>
<text x="414" y="384" font-size="9.6" fill="#1e293b" text-anchor="start">  分或查表把弧长 s 反解回 t(s)，否则过弯就会急刹顿挫；</text>
<text x="414" y="404" font-size="9.6" fill="#c25014" text-anchor="start" font-weight="600">• 同理：三次曲线的平行等距线（描边）高达 10 次代数曲线！</text>
