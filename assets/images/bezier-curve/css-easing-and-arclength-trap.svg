<text x="160.3" y="119.2" font-size="9.3" fill="#6d28d9" text-anchor="start" font-weight="700" class="halo">y1=1.45 冲过 100% 产生Q弹回弹！</text>
<text x="231.7" y="243.9" font-size="9.3" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">ease-in-out：两头平缓=慢起慢停</text>
<text x="157.3" y="265.0" font-size="9.0" fill="#475569" text-anchor="start" class="halo">linear 匀速</text>
<rect x="34" y="324" width="324" height="96" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="344" font-size="9.6" fill="#1e293b" text-anchor="start">• 曲线斜率 dy/dx 就是瞬时速度：越陡冲得越快，越平越慢；</text>
<text x="46" y="364" font-size="9.6" fill="#1e293b" text-anchor="start">• 纵坐标 y1, y2 允许超出 [0,1]，弹窗就会冲过头再弹回来；</text>
<text x="46" y="384" font-size="9.6" fill="#1e293b" text-anchor="start">• 横坐标 x1, x2 严禁出 [0,1]：否则曲线横着往回折，同一时刻</text>
<text x="46" y="404" font-size="9.6" fill="#6d28d9" text-anchor="start" font-weight="600">  对应三个位置（时间倒流），浏览器会直接判为非法丢弃！</text>
<rect x="388" y="62" width="352" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402.0" y="74.0" width="324" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="564.0" y="89.0" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">空间轨迹陷阱：等参数 Δt=0.1 ≠ 等距离匀速行驶！</text>
<text x="414" y="112" font-size="9.8" fill="#c25014" text-anchor="start" font-weight="700">① 直接按 t = 0, 0.1, 0.2, …, 1.0 采样（11 颗橙点）：</text>
