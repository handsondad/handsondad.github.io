<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">井字棋里一步陷阱和一步守和</title>
<desc id="desc">三盘井字棋。左盘轮到画叉，完整搜索的值是和棋。中盘里叉先占左上，圈立刻占右上，沿对角线连成三子。右盘改占右上，是三个空位里唯一仍为和棋的选择；上边中间那格也会输，图中没有展开。</desc>
