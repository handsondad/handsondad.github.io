<text x="36" y="48" font-size="32" fill="#172b45" text-anchor="start">同一盘棋：一步送掉，一步守和</text>
<text x="36" y="88" font-size="24" fill="#41576a" text-anchor="start">× 先手，○ 后手。中盘两枚橙格有先后。</text>
