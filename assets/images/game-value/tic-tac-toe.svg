<text x="36" y="528" font-size="24" fill="#172b45" text-anchor="start">正中空位也会输，只是圈不能马上连成，图里没有展开。</text>
<text x="36" y="570" font-size="24" fill="#41576a" text-anchor="start">右盘之后仍是和棋。空棋盘用同一套搜索，结果也是和棋。</text>
