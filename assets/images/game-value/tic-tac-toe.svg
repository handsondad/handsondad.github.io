<svg xmlns="http://www.w3.org/2000/svg" width="760" height="302" viewBox="0 0 760 302" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">井字棋一步陷阱与唯一守和着法对比</title>
<desc id="desc">左盘轮到×落子，理论值为和棋；中盘×误下左上角被○占右上角连成斜线获胜；右盘×占右上角成为三个空位中唯一守和选择。</desc>
<defs>
