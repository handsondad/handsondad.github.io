<title id="title">六贯棋盘结构、无和棋通水直觉与纳什先手必胜证明</title>
<desc id="desc">左图展示5乘5菱形六边形六贯棋盘，蓝色实线连接上下北南两岸获胜并阻断橙色东西连线；右图总结无和棋定理加策略窃取如何推出先手必胜。</desc>
