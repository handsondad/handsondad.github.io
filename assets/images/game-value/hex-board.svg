<text x="446" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">② 纳什的“两步绝杀”存在性证明</text>
<rect x="446" y="100" width="278" height="86" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="458" y="120" font-size="11.6" fill="#0f172a" text-anchor="start" font-weight="700">第一步：为什么不可能和棋？（通水定理）</text>
<text x="458" y="140" font-size="11.2" fill="#1e293b" text-anchor="start">把蓝格当河道、橙格当堤坝。从北岸放水，</text>
<text x="458" y="158" font-size="11.2" fill="#1e293b" text-anchor="start">水若流不到南岸，唯一可能是西到东被橙坝</text>
<text x="458" y="176" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="600">彻底堵死——堵死恰恰说明橙方连赢了！</text>
<rect x="446" y="198" width="278" height="96" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="458" y="218" font-size="11.6" fill="#0f172a" text-anchor="start" font-weight="700">第二步：策略窃取 ⇒ 先手必胜！</text>
<text x="458" y="238" font-size="11.2" fill="#1e293b" text-anchor="start">• 棋盘上多一枚己方棋子永远不会帮倒忙；</text>
<text x="458" y="256" font-size="11.2" fill="#1e293b" text-anchor="start">• 假如后手有必胜秘籍，先手随便下一子再</text>
<text x="458" y="274" font-size="11.2" fill="#1e293b" text-anchor="start">  假装自己是后手就能偷走秘籍；又无和棋，</text>
<text x="458" y="289" font-size="10.8" fill="#18794e" text-anchor="start" font-weight="700">⇒ 11×11 标准六贯棋必是先手胜（但没人算得出谱）</text>
</svg>
