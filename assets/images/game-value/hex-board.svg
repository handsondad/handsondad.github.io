<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">六贯棋（Hex）：棋盘长什么样？为什么下满时绝不可能出现“和棋”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">蓝方要把上下两条蓝边连成通路，橙方要把左右两条橙边连成通路（六边形相邻格共边即相连）。</text>
