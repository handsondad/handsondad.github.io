<rect x="36.0" y="284.0" width="320" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="196.0" y="300.3" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="600">异或和 9⊕5⊕12 = 0：谁先拿都会拆散一对，必败</text>
<rect x="388" y="62" width="352" height="272" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="84" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="600">② 必胜局 (3, 4, 5)：揪出落单的“2颗袋”拿走！</text>
