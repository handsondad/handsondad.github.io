<rect x="282" y="138" width="27" height="27" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="3 2"/>
<rect x="222" y="168" width="27" height="27" rx="4" fill="#7c2d12" stroke="#9a5b25" stroke-width="1.2"/>
<text x="235.5" y="186" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">毒</text>
<rect x="252" y="168" width="27" height="27" rx="4" fill="#eab676" stroke="#9a5b25" stroke-width="1.2"/>
<rect x="282" y="168" width="27" height="27" rx="4" fill="#eab676" stroke="#9a5b25" stroke-width="1.2"/>
<text x="267" y="214" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">后手咬中心留 L 形</text>
<rect x="36.0" y="254.0" width="320" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="196.0" y="270.3" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">精髓：后手这招“留 L 形”，先手开局就能直接偷来用！</text>
<rect x="388" y="62" width="352" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="84" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="600">② 真正必胜着：第一口直接咬出等臂 L 形！</text>
