<text x="581" y="531" font-size="20" fill="#fff" text-anchor="middle">毒</text>
<rect x="606" y="502" width="42" height="42" rx="6" fill="#e1b07a" stroke="#8a5a2b" stroke-width="2"/>
<rect x="652" y="502" width="42" height="42" rx="6" fill="#eef3f6" stroke="#9aabb8" stroke-width="2" stroke-dasharray="4 4"/>
<text x="467" y="318" font-size="20" fill="#41576a" text-anchor="middle">吃完右上角</text>
<text x="627" y="318" font-size="20" fill="#ad4f16" text-anchor="middle">变成 L</text>
<text x="467" y="588" font-size="20" fill="#176786" text-anchor="middle">你留下的 L</text>
<text x="627" y="588" font-size="20" fill="#176786" text-anchor="middle">补回对称</text>
<text x="36" y="670" font-size="24" fill="#172b45" text-anchor="start">存在性证明只说第一口存在，不指出是哪一口。</text>
<text x="36" y="708" font-size="24" fill="#41576a" text-anchor="start">3×3 的第一口是吃掉中心及其右上。2×3 却是只吃右上角。</text>
</svg>
