<text x="67.5" y="186" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">毒</text>
<rect x="84" y="168" width="27" height="27" rx="4" fill="#eab676" stroke="#9a5b25" stroke-width="1.2"/>
<rect x="114" y="168" width="27" height="27" rx="4" fill="#eab676" stroke="#9a5b25" stroke-width="1.2"/>
<text x="99" y="214" font-size="11" fill="#64748b" text-anchor="middle">先手只咬右上角</text>
<line x1="156" y1="152" x2="206" y2="152" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<text x="181" y="144" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">后手惩罚</text>
