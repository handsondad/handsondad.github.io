<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">三乘三有毒巧克力的试探反证与对称必胜法</title>
<desc id="desc">左图先手只吃右上角会被后手吃掉中心留下对称L形而落败；右图先手开局直接吃成对称L形并镜像回应获胜。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="309" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">有毒巧克力（Chomp）与“策略窃取”：试探的那一口，不等于真正该下的第一口</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左下角有毒，每次咬掉一格及其右上方所有格。虚线格表示已被吃掉。</text>
<rect x="20" y="62" width="352" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="600">① 假想试探：先手只咬右上角，反而送对手赢</text>
<rect x="54" y="108" width="27" height="27" rx="4" fill="#eab676" stroke="#9a5b25" stroke-width="1.2"/>
<rect x="84" y="108" width="27" height="27" rx="4" fill="#eab676" stroke="#9a5b25" stroke-width="1.2"/>
<rect x="114" y="108" width="27" height="27" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="3 2"/>
