<rect x="650" y="138" width="27" height="27" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="3 2"/>
<rect x="590" y="168" width="27" height="27" rx="4" fill="#7c2d12" stroke="#9a5b25" stroke-width="1.2"/>
<text x="603.5" y="186" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">毒</text>
<rect x="620" y="168" width="27" height="27" rx="4" fill="#eab676" stroke="#9a5b25" stroke-width="1.2"/>
<rect x="650" y="168" width="27" height="27" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="3 2"/>
<text x="635" y="214" font-size="11" fill="#18794e" text-anchor="middle" font-weight="600">对手咬右端→你咬上端</text>
<rect x="404.0" y="254.0" width="320" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="564.0" y="270.3" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">注意：2×3 矩形的必胜第一口却变回“只咬右上角”</text>
</svg>
