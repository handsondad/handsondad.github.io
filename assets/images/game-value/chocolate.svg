<text x="435.5" y="186" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">毒</text>
<rect x="452" y="168" width="27" height="27" rx="4" fill="#eab676" stroke="#9a5b25" stroke-width="1.2"/>
<rect x="482" y="168" width="27" height="27" rx="4" fill="#eab676" stroke="#9a5b25" stroke-width="1.2"/>
<text x="467" y="214" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">先手开局直接留 L</text>
<line x1="524" y1="152" x2="574" y2="152" stroke="#18794e" stroke-width="1.6" marker-end="url(#arr-green)"/>
<text x="549" y="144" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">对称回应</text>
<rect x="590" y="108" width="27" height="27" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="3 2"/>
<rect x="620" y="108" width="27" height="27" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.1" stroke-dasharray="3 2"/>
