<svg xmlns="http://www.w3.org/2000/svg" width="760" height="264" viewBox="0 0 760 264" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">单堆拿糖从零颗倒推到八颗的胜负表</title>
<desc id="desc">零到八颗糖每次拿一到三颗，零、四、八为橙色虚线必败格，其余为蓝色实线必胜格并标出唯一必胜拿法。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .walker{opacity:0;animation:walk 7.5s linear 1}@keyframes walk{0.00%{opacity:1;transform:translateX(0px)}8.67%{opacity:1;transform:translateX(0px)}11.11%{opacity:1;transform:translateX(79px)}19.78%{opacity:1;transform:translateX(79px)}22.22%{opacity:1;transform:translateX(158px)}30.89%{opacity:1;transform:translateX(158px)}33.33%{opacity:1;transform:translateX(237px)}42.00%{opacity:1;transform:translateX(237px)}44.44%{opacity:1;transform:translateX(316px)}53.11%{opacity:1;transform:translateX(316px)}55.56%{opacity:1;transform:translateX(395px)}64.22%{opacity:1;transform:translateX(395px)}66.67%{opacity:1;transform:translateX(474px)}75.33%{opacity:1;transform:translateX(474px)}77.78%{opacity:1;transform:translateX(553px)}86.44%{opacity:1;transform:translateX(553px)}88.89%{opacity:1;transform:translateX(632px)}97.56%{opacity:1;transform:translateX(632px)}100%{opacity:0;transform:translateX(632px)}}@media(prefers-reduced-motion:reduce){.walker{animation:none;opacity:0}}
</style>
<rect x="0.5" y="0.5" width="759" height="263" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">单堆拿糖（每次 1～3 颗）：从 0 颗往回贴标签，4 的倍数全是必败格</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">橙虚线格 = 轮到谁走谁必败；蓝实线格 = 有唯一一步把对手推进虚线格。动画橙框演示从 0 到 8 的倒推顺序。</text>
<rect x="20" y="62" width="720" height="186" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="28" y="82" width="68" height="106" rx="9" fill="#fef1e8" stroke="#c25014" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="62" y="112" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">0颗</text>
<text x="62" y="140" font-size="12.5" fill="#c25014" text-anchor="middle" font-weight="700">必败</text>
<text x="62" y="168" font-size="11.2" fill="#64748b" text-anchor="middle">无好手</text>
<rect x="107" y="82" width="68" height="106" rx="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="141" y="112" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">1颗</text>
<text x="141" y="140" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">必胜</text>
<text x="141" y="168" font-size="11.2" fill="#64748b" text-anchor="middle">拿 1</text>
<rect x="186" y="82" width="68" height="106" rx="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="220" y="112" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">2颗</text>
<text x="220" y="140" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">必胜</text>
<text x="220" y="168" font-size="11.2" fill="#64748b" text-anchor="middle">拿 2</text>
<rect x="265" y="82" width="68" height="106" rx="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="299" y="112" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">3颗</text>
<text x="299" y="140" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">必胜</text>
<text x="299" y="168" font-size="11.2" fill="#64748b" text-anchor="middle">拿 3</text>
<rect x="344" y="82" width="68" height="106" rx="9" fill="#fef1e8" stroke="#c25014" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="378" y="112" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">4颗</text>
<text x="378" y="140" font-size="12.5" fill="#c25014" text-anchor="middle" font-weight="700">必败</text>
<text x="378" y="168" font-size="11.2" fill="#64748b" text-anchor="middle">无好手</text>
<rect x="423" y="82" width="68" height="106" rx="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="457" y="112" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">5颗</text>
<text x="457" y="140" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">必胜</text>
<text x="457" y="168" font-size="11.2" fill="#64748b" text-anchor="middle">拿 1</text>
<rect x="502" y="82" width="68" height="106" rx="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="536" y="112" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">6颗</text>
<text x="536" y="140" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">必胜</text>
<text x="536" y="168" font-size="11.2" fill="#64748b" text-anchor="middle">拿 2</text>
<rect x="581" y="82" width="68" height="106" rx="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="615" y="112" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">7颗</text>
<text x="615" y="140" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">必胜</text>
<text x="615" y="168" font-size="11.2" fill="#64748b" text-anchor="middle">拿 3</text>
<rect x="660" y="82" width="68" height="106" rx="9" fill="#fef1e8" stroke="#c25014" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="694" y="112" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">8颗</text>
<text x="694" y="140" font-size="12.5" fill="#c25014" text-anchor="middle" font-weight="700">必败</text>
<text x="694" y="168" font-size="11.2" fill="#64748b" text-anchor="middle">无好手</text>
<rect class="walker" x="28" y="79" width="68" height="112" rx="10" fill="none" stroke="#c25014" stroke-width="2.6"/>
<line x1="36" y1="210" x2="718" y2="210" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="380" y="232" font-size="11.8" fill="#0f172a" text-anchor="middle" font-weight="600">倒推规律：50 = 4×12 + 2  ⇒  开局先手唯一胜着是拿 2 颗（留给对手 48），之后对手拿 r 你就拿 4−r</text>
</svg>
