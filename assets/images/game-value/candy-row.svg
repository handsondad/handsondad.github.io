<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">单堆拿糖从零颗倒推到八颗</title>
<desc id="desc">零到八颗糖，每次可拿一到三颗，拿走最后一颗的人获胜。零、四、八是轮到的人必败；其余格唯一的必胜拿法是拿到四的倍数。高亮框从零走到八，播放一次后消失。减少动态效果时不显示高亮，格子与文字保持完整。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="720" height="490" fill="#f3f7fa"/>
<text x="36" y="48" font-size="32" fill="#172b45" text-anchor="start">从 0 颗往回标：谁赢已经写在格里</text>
<text x="36" y="88" font-size="24" fill="#41576a" text-anchor="start">实线格轮到的人必胜；虚线格必败。橙框只提示倒推次序。</text>
<style>.walker{opacity:0;animation:walk 9s linear 1}@keyframes walk{0.00%{opacity:1;transform:translateX(0px)}8.67%{opacity:1;transform:translateX(0px)}11.11%{opacity:1;transform:translateX(76px)}19.78%{opacity:1;transform:translateX(76px)}22.22%{opacity:1;transform:translateX(152px)}30.89%{opacity:1;transform:translateX(152px)}33.33%{opacity:1;transform:translateX(228px)}42.00%{opacity:1;transform:translateX(228px)}44.44%{opacity:1;transform:translateX(304px)}53.11%{opacity:1;transform:translateX(304px)}55.56%{opacity:1;transform:translateX(380px)}64.22%{opacity:1;transform:translateX(380px)}66.67%{opacity:1;transform:translateX(456px)}75.33%{opacity:1;transform:translateX(456px)}77.78%{opacity:1;transform:translateX(532px)}86.44%{opacity:1;transform:translateX(532px)}88.89%{opacity:1;transform:translateX(608px)}97.56%{opacity:1;transform:translateX(608px)}100%{opacity:0;transform:translateX(608px)}}@media(prefers-reduced-motion:reduce){.walker{animation:none;opacity:0}}</style>
<rect x="28" y="132" width="68" height="160" rx="12" fill="#f8e6d4" stroke="#ad4f16" stroke-width="2" stroke-dasharray="5 4"/>
<text x="62" y="168" font-size="28" fill="#172b45" text-anchor="middle">0</text>
<text x="62" y="206" font-size="22" fill="#ad4f16" text-anchor="middle">必败</text>
<text x="62" y="248" font-size="16" fill="#41576a" text-anchor="middle">无好手</text>
<rect x="104" y="132" width="68" height="160" rx="12" fill="#d9eef5" stroke="#176786" stroke-width="2" />
<text x="138" y="168" font-size="28" fill="#172b45" text-anchor="middle">1</text>
<text x="138" y="206" font-size="22" fill="#176786" text-anchor="middle">必胜</text>
<text x="138" y="248" font-size="16" fill="#41576a" text-anchor="middle">拿1</text>
<rect x="180" y="132" width="68" height="160" rx="12" fill="#d9eef5" stroke="#176786" stroke-width="2" />
<text x="214" y="168" font-size="28" fill="#172b45" text-anchor="middle">2</text>
<text x="214" y="206" font-size="22" fill="#176786" text-anchor="middle">必胜</text>
<text x="214" y="248" font-size="16" fill="#41576a" text-anchor="middle">拿2</text>
<rect x="256" y="132" width="68" height="160" rx="12" fill="#d9eef5" stroke="#176786" stroke-width="2" />
<text x="290" y="168" font-size="28" fill="#172b45" text-anchor="middle">3</text>
<text x="290" y="206" font-size="22" fill="#176786" text-anchor="middle">必胜</text>
<text x="290" y="248" font-size="16" fill="#41576a" text-anchor="middle">拿3</text>
<rect x="332" y="132" width="68" height="160" rx="12" fill="#f8e6d4" stroke="#ad4f16" stroke-width="2" stroke-dasharray="5 4"/>
<text x="366" y="168" font-size="28" fill="#172b45" text-anchor="middle">4</text>
<text x="366" y="206" font-size="22" fill="#ad4f16" text-anchor="middle">必败</text>
<text x="366" y="248" font-size="16" fill="#41576a" text-anchor="middle">无好手</text>
<rect x="408" y="132" width="68" height="160" rx="12" fill="#d9eef5" stroke="#176786" stroke-width="2" />
<text x="442" y="168" font-size="28" fill="#172b45" text-anchor="middle">5</text>
<text x="442" y="206" font-size="22" fill="#176786" text-anchor="middle">必胜</text>
<text x="442" y="248" font-size="16" fill="#41576a" text-anchor="middle">拿1</text>
<rect x="484" y="132" width="68" height="160" rx="12" fill="#d9eef5" stroke="#176786" stroke-width="2" />
<text x="518" y="168" font-size="28" fill="#172b45" text-anchor="middle">6</text>
<text x="518" y="206" font-size="22" fill="#176786" text-anchor="middle">必胜</text>
<text x="518" y="248" font-size="16" fill="#41576a" text-anchor="middle">拿2</text>
<rect x="560" y="132" width="68" height="160" rx="12" fill="#d9eef5" stroke="#176786" stroke-width="2" />
<text x="594" y="168" font-size="28" fill="#172b45" text-anchor="middle">7</text>
<text x="594" y="206" font-size="22" fill="#176786" text-anchor="middle">必胜</text>
<text x="594" y="248" font-size="16" fill="#41576a" text-anchor="middle">拿3</text>
<rect x="636" y="132" width="68" height="160" rx="12" fill="#f8e6d4" stroke="#ad4f16" stroke-width="2" stroke-dasharray="5 4"/>
<text x="670" y="168" font-size="28" fill="#172b45" text-anchor="middle">8</text>
<text x="670" y="206" font-size="22" fill="#ad4f16" text-anchor="middle">必败</text>
<text x="670" y="248" font-size="16" fill="#41576a" text-anchor="middle">无好手</text>
<rect class="walker" x="28" y="128" width="68" height="168" rx="12" fill="none" stroke="#ad4f16" stroke-width="5"/>
<text x="36" y="338" font-size="24" fill="#172b45" text-anchor="start">倒推方向：先定 0，再看哪一步能把对方留在虚线格。</text>
<path d="M48 362H668" fill="none" stroke="#176786" stroke-width="3" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#176786"/></marker></defs>
<text x="36" y="408" font-size="24" fill="#172b45" text-anchor="start">0、4、8 必败。核到 50：50＝4×12＋2，只能拿 2。</text>
<text x="36" y="448" font-size="24" fill="#41576a" text-anchor="start">拿错数量会离开这个节拍，对方就能把你留回虚线格。</text>
</svg>
