<svg xmlns="http://www.w3.org/2000/svg" width="720" height="870" viewBox="0 0 720 870" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">两堆拿糖的胜负网格</title>
<desc id="desc">甲堆和乙堆各从零到五。每次只能在同一堆拿走至少一颗。两堆数量相同的六格是轮到的人必败，其余由倒推得到必胜。下方例子从五比二拿到二比二，再从一比二补回一比一。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="720" height="870" fill="#f3f7fa"/>
<text x="36" y="48" font-size="32" fill="#172b45" text-anchor="start">两堆一样多，轮到的人必败</text>
<text x="36" y="88" font-size="24" fill="#41576a" text-anchor="start">行是乙堆，列是甲堆。格里先写甲，再写乙。</text>
