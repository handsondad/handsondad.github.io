<text x="44" y="692" font-size="26" fill="#172b45" text-anchor="start">例：甲 5、乙 2。先手从甲堆拿 3，留下 2 与 2。</text>
<text x="44" y="736" font-size="26" fill="#172b45" text-anchor="start">后手若从甲堆拿 1，变成 1 与 2。</text>
<text x="44" y="780" font-size="26" fill="#176786" text-anchor="start">先手再从乙堆拿 1，回到 1 与 1。</text>
<text x="44" y="818" font-size="24" fill="#41576a" text-anchor="start">后手每次打破相等，先手就把它补回。</text>
