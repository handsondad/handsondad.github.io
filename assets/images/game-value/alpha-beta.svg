<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">一个六片叶子的极小化极大剪枝</title>
<desc id="desc">先手选择三支后手局面。按左、中、右的次序，搜索读到五、六、三、四，在看到三和四之后分别停住，不读七和九。根的分数是五。把中支改成先看七，会多读一片叶子，根仍是五。叶子是估分，不是终局胜负。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="720" height="800" fill="#f3f7fa"/>
<text x="36" y="48" font-size="32" fill="#172b45" text-anchor="start">分数已经够用，旁边的树枝可以不看</text>
<text x="36" y="88" font-size="23" fill="#41576a" text-anchor="start">先手要高分，后手要低分。灰虚线是这一次序下没读的叶子。</text>
<path d="M360 200L140 286" fill="none" stroke="#176786" stroke-width="2"/>
<path d="M140 350L100 472" fill="none" stroke="#176786" stroke-width="2"/>
<path d="M140 350L180 472" fill="none" stroke="#176786" stroke-width="2"/>
<path d="M360 200L360 286" fill="none" stroke="#176786" stroke-width="2"/>
<path d="M360 350L320 472" fill="none" stroke="#176786" stroke-width="2"/>
<path d="M360 350L420 472" fill="none" stroke="#9aabb8" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M360 200L580 286" fill="none" stroke="#176786" stroke-width="2"/>
<path d="M580 350L540 472" fill="none" stroke="#176786" stroke-width="2"/>
<path d="M580 350L660 472" fill="none" stroke="#9aabb8" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="285.0" y="136.0" width="150" height="64" rx="10" fill="#d9eef5" stroke="#176786" stroke-width="2"/>
<text x="360" y="160" font-size="20" fill="#172b45" text-anchor="middle">先手</text>
<text x="360" y="188" font-size="18" fill="#172b45" text-anchor="middle">结果：5</text>
<rect x="80.0" y="286.0" width="120" height="64" rx="10" fill="#fff" stroke="#176786" stroke-width="2"/>
<text x="140" y="310" font-size="20" fill="#172b45" text-anchor="middle">后手</text>
<text x="140" y="338" font-size="18" fill="#172b45" text-anchor="middle">会选 5</text>
<rect x="300.0" y="286.0" width="120" height="64" rx="10" fill="#fff" stroke="#176786" stroke-width="2"/>
<text x="360" y="310" font-size="20" fill="#172b45" text-anchor="middle">后手</text>
<text x="360" y="338" font-size="18" fill="#172b45" text-anchor="middle">最多 3</text>
<rect x="520.0" y="286.0" width="120" height="64" rx="10" fill="#fff" stroke="#176786" stroke-width="2"/>
<text x="580" y="310" font-size="20" fill="#172b45" text-anchor="middle">后手</text>
<text x="580" y="338" font-size="18" fill="#172b45" text-anchor="middle">最多 4</text>
<rect x="64.0" y="472.0" width="72" height="56" rx="10" fill="#d9eef5" stroke="#176786" stroke-width="2"/>
<text x="100" y="492" font-size="20" fill="#172b45" text-anchor="middle">5</text>
<text x="100" y="520" font-size="18" fill="#172b45" text-anchor="middle">①</text>
<rect x="144.0" y="472.0" width="72" height="56" rx="10" fill="#d9eef5" stroke="#176786" stroke-width="2"/>
<text x="180" y="492" font-size="20" fill="#172b45" text-anchor="middle">6</text>
<text x="180" y="520" font-size="18" fill="#172b45" text-anchor="middle">②</text>
<rect x="284.0" y="472.0" width="72" height="56" rx="10" fill="#d9eef5" stroke="#176786" stroke-width="2"/>
<text x="320" y="492" font-size="20" fill="#172b45" text-anchor="middle">3</text>
<text x="320" y="520" font-size="18" fill="#172b45" text-anchor="middle">③</text>
<rect x="384.0" y="472.0" width="72" height="56" rx="10" fill="#eef3f6" stroke="#9aabb8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="420" y="492" font-size="20" fill="#172b45" text-anchor="middle">7</text>
<text x="420" y="520" font-size="18" fill="#172b45" text-anchor="middle">不看</text>
<rect x="504.0" y="472.0" width="72" height="56" rx="10" fill="#d9eef5" stroke="#176786" stroke-width="2"/>
<text x="540" y="492" font-size="20" fill="#172b45" text-anchor="middle">4</text>
<text x="540" y="520" font-size="18" fill="#172b45" text-anchor="middle">④</text>
<rect x="624.0" y="472.0" width="72" height="56" rx="10" fill="#eef3f6" stroke="#9aabb8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="660" y="492" font-size="20" fill="#172b45" text-anchor="middle">9</text>
<text x="660" y="520" font-size="18" fill="#172b45" text-anchor="middle">不看</text>
<text x="36" y="580" font-size="24" fill="#172b45" text-anchor="start">① 左支看完，先手已经能保证 5。</text>
<text x="36" y="618" font-size="24" fill="#172b45" text-anchor="start">② 中支一看到 3，就比 5 差，7 不必再读。</text>
<text x="36" y="656" font-size="24" fill="#172b45" text-anchor="start">③ 右支一看到 4，同样不超过 5，9 不必再读。</text>
<text x="36" y="704" font-size="24" fill="#176786" text-anchor="start">若中支改成先看 7，7 会被读到；根上的结果仍是 5。</text>
<text x="36" y="748" font-size="22" fill="#41576a" text-anchor="start">灰格上的 7 和 9 是为了核对才写上的，搜索本身没有读取。</text>
</svg>
