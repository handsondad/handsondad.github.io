<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">极小化极大博弈树与 α-β 剪枝步骤图</title>
<desc id="desc">根节点先手MAX取最大，第二层后手MIN取最小。左支得出保底5分后，中支读到3、右支读到4均不超过5，直接剪去叶子7与9。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="343" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">极小化极大（Minimax）与 α-β 剪枝：我挑最高分、对手挑最低分，废枝直接剪掉</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先手（MAX）想要大数字，后手（MIN）专挑小数字坑你。一旦某分支上限还不如手头保底分，后面叶子全免检！</text>
<rect x="20" y="62" width="720" height="266" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<line x1="380" y1="128" x2="156" y2="164" stroke="#1d6fa5" stroke-width="1.6"/>
<line x1="156" y1="208" x2="106" y2="252" stroke="#1d6fa5" stroke-width="1.5"/>
<line x1="156" y1="208" x2="206" y2="252" stroke="#1d6fa5" stroke-width="1.5"/>
<line x1="380" y1="128" x2="380" y2="164" stroke="#1d6fa5" stroke-width="1.6"/>
<line x1="380" y1="208" x2="330" y2="252" stroke="#1d6fa5" stroke-width="1.5"/>
<line x1="380" y1="208" x2="430" y2="252" stroke="#c25014" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="380" y1="128" x2="604" y2="164" stroke="#1d6fa5" stroke-width="1.6"/>
<line x1="604" y1="208" x2="554" y2="252" stroke="#1d6fa5" stroke-width="1.5"/>
<line x1="604" y1="208" x2="654" y2="252" stroke="#c25014" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="288" y="84" width="184" height="44" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.7"/>
<text x="380" y="103" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="700">先手 MAX（挑最大）</text>
<text x="380" y="120" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">最终敲定得分 = 5</text>
<rect x="78" y="164" width="156" height="44" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
<text x="156" y="183" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">后手 MIN（压最小）</text>
<text x="156" y="200" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="600">后手选 min(5,6)=5</text>
<rect x="302" y="164" width="156" height="44" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
<text x="380" y="183" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">后手 MIN（压最小）</text>
<text x="380" y="200" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="600">看到 3 ≤ 5，立刻停！</text>
<rect x="526" y="164" width="156" height="44" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
<text x="604" y="183" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">后手 MIN（压最小）</text>
<text x="604" y="200" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="600">看到 4 ≤ 5，立刻停！</text>
<rect x="70" y="252" width="72" height="40" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="106" y="270" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">估分 5</text>
<text x="106" y="286" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">①读</text>
<rect x="170" y="252" width="72" height="40" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="206" y="270" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">估分 6</text>
<text x="206" y="286" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">②读</text>
<rect x="294" y="252" width="72" height="40" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="330" y="270" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">估分 3</text>
<text x="330" y="286" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">③读</text>
<rect x="394" y="252" width="72" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="430" y="270" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">估分 7</text>
<text x="430" y="286" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">✂剪掉</text>
<rect x="518" y="252" width="72" height="40" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="554" y="270" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">估分 4</text>
<text x="554" y="286" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">④读</text>
<rect x="618" y="252" width="72" height="40" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="654" y="270" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">估分 9</text>
<text x="654" y="286" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">✂剪掉</text>
<text x="36" y="316" font-size="11.2" fill="#1e293b" text-anchor="start">读左支拿到保底 5 分后，中支刚翻开 3 就知道后手绝不会给超过 3 分，旁边的 7 哪怕是 100 分也轮不到你，直接剪掉！</text>
</svg>
