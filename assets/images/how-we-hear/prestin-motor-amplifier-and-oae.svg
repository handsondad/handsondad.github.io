<rect x="0.5" y="0.5" width="759" height="531" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">四、耳朵里藏着上万台跳舞马达：Prestin 主动放大 50 dB 与耳声发射</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">如果只靠被动行波，耳语会被粘滞淋巴液淹没——外毛细胞靠 Prestin 蛋白高速伸缩“推秋千”，甚至让耳朵自己发出声音！</text>
<rect x="20" y="64" width="382" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="352" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="210.0" y="89.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">A · 外毛细胞 Prestin 压电马达：把灵敏度暴拉百倍！</text>
<rect x="34" y="108" width="354" height="152" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="64" y="138" width="38" height="92" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="83" y="128" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">超极化(伸长)</text>
<rect x="134" y="156" width="46" height="66" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/>
<text x="157" y="146" font-size="9.8" fill="#c25014" text-anchor="middle" font-weight="700">去极化(收缩!)</text>
<line x1="110" y1="184" x2="128" y2="184" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<text x="120" y="248" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">Prestin 膜马达每秒可伸缩数万次！</text>
