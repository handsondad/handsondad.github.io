<text x="310" y="128" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700" class="halo">主动放大 +40~50 dB!</text>
<text x="268" y="224" font-size="9.6" fill="#475569" text-anchor="middle">死后被动行波</text>
<text x="36" y="284" font-size="10.6" fill="#1e293b" text-anchor="start">• 粘滞阻尼难题：内耳装满液体，被动行波就像在水里荡秋千，</text>
<text x="36" y="303" font-size="10.6" fill="#1e293b" text-anchor="start">  既微弱又扁平——如果只有它，你既听不见耳语，也分不清音高！</text>
<text x="36" y="326" font-size="10.7" fill="#c25014" text-anchor="start" font-weight="700">• 2000 年 Nature 揪出真凶——马达蛋白 Prestin（郑景中等）：</text>
<text x="36" y="345" font-size="10.5" fill="#1e293b" text-anchor="start">  12,000 个外毛细胞侧壁塞满了 Prestin 蛋白，不耗 ATP 就能</text>
<text x="36" y="364" font-size="10.5" fill="#1e293b" text-anchor="start">  随跨膜电压直接发生“压电式纵向伸缩”，在每个声波周期精准推</text>
<text x="36" y="383" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">  一把基底膜，把微弱声波锐利放大 40–50 dB（振幅放大上百倍）！</text>
<text x="36" y="408" font-size="10.5" fill="#1e293b" text-anchor="start">• 鸡尾酒会烦恼：外毛细胞一旦被噪音或耳毒性药物伤损，人不仅</text>
<text x="36" y="427" font-size="10.5" fill="#1e293b" text-anchor="start">  觉得声音小，更因为失去了“尖峰频率锐化”，在嘈杂饭馆里明明</text>
<text x="36" y="446" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="700">  听见别人说话嗡嗡响，却怎么也分辨不清吐字！</text>
<text x="36" y="474" font-size="10.1" fill="#64748b" text-anchor="start">  （Prestin 命名源自乐谱术语 Presto“急板”，致敬其超高速响应）</text>
<rect x="416" y="64" width="324" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="430.0" y="74.0" width="296" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="578.0" y="89.0" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">B · 会回唱的耳朵：耳声发射与新生儿筛查</text>
<rect x="430" y="108" width="296" height="162" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="578" y="130" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">大卫·坎普 1978 年惊人发现：耳声发射 (OAE)</text>
<rect x="444" y="150" width="114" height="52" rx="6" fill="#ffffff" stroke="#1d6fa5" stroke-width="1"/>
<text x="501" y="172" font-size="10.3" fill="#1d6fa5" text-anchor="middle" font-weight="700">耳塞微型扬声器</text>
<text x="501" y="190" font-size="9.8" fill="#1e293b" text-anchor="middle">送入轻柔咔哒声 →</text>
<rect x="598" y="150" width="114" height="52" rx="6" fill="#ffffff" stroke="#c25014" stroke-width="1"/>
<text x="655" y="172" font-size="10.3" fill="#c25014" text-anchor="middle" font-weight="700">外毛细胞跳舞</text>
<text x="655" y="190" font-size="9.8" fill="#1e293b" text-anchor="middle">Prestin 主动回推!</text>
<line x1="558" y1="166" x2="596" y2="166" stroke="#1d6fa5" stroke-width="2" marker-end="url(#arr-blue)"/>
<line x1="596" y1="190" x2="558" y2="190" stroke="#18794e" stroke-width="2.2" marker-end="url(#arr-green)"/>
<text x="578" y="228" font-size="10.3" fill="#0f172a" text-anchor="middle" font-weight="600">← 几毫秒后，振动倒传经听小骨推响鼓膜，</text>
<text x="578" y="247" font-size="10.3" fill="#18794e" text-anchor="middle" font-weight="700">被耳道高灵敏麦克风当场录到“耳蜗回声”！</text>
<rect x="430" y="284" width="296" height="218" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="442" y="306" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">这项“离经叛道”的发现拯救了无数婴儿：</text>
<text x="442" y="328" font-size="10.4" fill="#1e293b" text-anchor="start">① 1978 年坎普刚宣布“健康耳朵会自己往外发声”时，</text>
<text x="442" y="347" font-size="10.4" fill="#1e293b" text-anchor="start">   曾被同行怀疑是麦克风故障；结果一验证震惊全球！</text>
<text x="442" y="370" font-size="10.4" fill="#1d6fa5" text-anchor="start" font-weight="700">② 新生儿听力筛查神器：出生仅两三天的宝宝不会说话</text>
<text x="442" y="389" font-size="10.4" fill="#1e293b" text-anchor="start">   也不会举手，护士趁宝宝熟睡塞进一枚小探头，几十秒</text>
<text x="442" y="408" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="600">   测出耳声发射“通过”，就知道外毛细胞马达运转正常！</text>
<text x="442" y="432" font-size="10.4" fill="#1e293b" text-anchor="start">③ 甚至有相当比例健康人在绝对安静的暗室里，耳朵会</text>
<text x="442" y="451" font-size="10.4" fill="#1e293b" text-anchor="start">   持续发出极微弱的“自发性耳声发射”——因为放大器</text>
<text x="442" y="470" font-size="10.4" fill="#6d28d9" text-anchor="start" font-weight="700">   增益拉到极致时，偶尔会像话筒靠近音箱那样轻微自激！</text>
</svg>
