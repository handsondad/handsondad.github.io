<svg xmlns="http://www.w3.org/2000/svg" width="760" height="532" viewBox="0 0 760 532" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">外毛细胞Prestin马达蛋白主动放大50分贝谐振锐化与耳声发射新生儿听力筛查图解</title>
<desc id="desc">左图展示外毛细胞Prestin随膜电位伸缩驱动主动耳蜗放大器提供40至50分贝增益与尖锐频率选择性；右图展示坎普发现的耳声发射反向传导机制及其在新生儿无创听力筛查中的应用。</desc>
