<svg xmlns="http://www.w3.org/2000/svg" width="760" height="532" viewBox="0 0 760 532" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">双耳10微秒时间差杰弗里斯延迟线、高频头影声强差、耳廓上下定位与骨传导图解</title>
<desc id="desc">左图展示脑干内侧上橄榄核MSO通过轴突延迟线符合检测分辨10微秒双耳时间差实现1度方位定位；右图解释高频声影差ILD、外耳廓褶皱仰角滤波及录音缺失颅骨传导导致自听声音陌生的原因。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="531" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">五、闭上眼凭什么抓准蚊子在哪？大脑 10 微秒时间尺、声影与骨传导</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">单只耳朵分不出立体方位——脑干靠双耳 10 微秒时间差、高频头颅声影与耳廓褶皱频谱，实时解算出三维声场</text>
<rect x="20" y="64" width="376" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="346" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="207.0" y="89.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 双耳时间差 ITD：比神经脉冲还准 100 倍的秒表！</text>
<rect x="34" y="108" width="348" height="206" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="76" cy="146" r="8" fill="#c25014"/>
<text x="76" y="130" font-size="10" fill="#c25014" text-anchor="middle" font-weight="700">左侧声源</text>
<circle cx="232" cy="174" r="34" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
<text x="232" y="178" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">头颅</text>
<ellipse cx="195" cy="174" rx="5" ry="11" fill="#fef1e8" stroke="#c25014" stroke-width="1.8"/>
<ellipse cx="269" cy="174" rx="5" ry="11" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.8"/>
<line x1="84" y1="148" x2="188" y2="170" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<path d="M 84,144 Q 186,108 268,160" fill="none" stroke="#1d6fa5" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
<text x="136" y="176" font-size="9.8" fill="#c25014" text-anchor="middle" font-weight="700">先到左耳</text>
<text x="206" y="126" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">绕头晚到右耳 (Δt)</text>
<text x="208" y="240" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">脑干内侧上橄榄核 (MSO) 延迟线符合检测阵列：</text>
<circle cx="108" cy="272" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="108" y="276" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<circle cx="158" cy="272" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="158" y="276" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">2</text>
<circle cx="208" cy="272" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="208" y="276" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">3</text>
<circle cx="258" cy="272" r="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
<text x="258" y="276" font-size="9.5" fill="#b91c1c" text-anchor="middle" font-weight="700">4</text>
<circle cx="308" cy="272" r="7" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="308" y="276" font-size="9.5" fill="#475569" text-anchor="middle" font-weight="700">5</text>
<line x1="92" y1="258" x2="324" y2="258" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<line x1="324" y1="286" x2="92" y2="286" stroke="#1d6fa5" stroke-width="1.6" marker-end="url(#arr-blue)"/>
<text x="258" y="304" font-size="9.8" fill="#b91c1c" text-anchor="middle" font-weight="700">4号神经元同时收到双耳脉冲→锁定左侧角！</text>
<text x="36" y="338" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">• 惊人的时间精度（Purves 神经科学）：</text>
<text x="36" y="358" font-size="10.5" fill="#1e293b" text-anchor="start">  正侧面声源绕过脑袋的最大双耳时间差约 700 微秒；而人脑竟</text>
<text x="36" y="377" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">  能分辨短短 10 微秒（0.00001 秒，声波仅多走 3.4 毫米！）的</text>
<text x="36" y="396" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">  时间差——对应水平方向 1° 定位精度！</text>
<text x="36" y="420" font-size="10.5" fill="#1e293b" text-anchor="start">• 神经学奇迹：单个动作电位本身宽达 ~1,000 微秒，为什么能测</text>
<text x="36" y="439" font-size="10.5" fill="#1e293b" text-anchor="start">  出 10 微秒？靠左右轴突一长一短对冲走时，只有双侧脉冲同时撞</text>
<text x="36" y="458" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">  上的那颗 MSO 符合神经元才会点火！（主攻 &lt;1.5–3 kHz 低频）</text>
<rect x="410" y="64" width="330" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="424.0" y="74.0" width="298" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="573.0" y="89.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">B · 高频声影、耳廓褶皱与“录音社死之谜”</text>
<rect x="424" y="108" width="302" height="122" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1"/>
<text x="436" y="130" font-size="10.8" fill="#0f766e" text-anchor="start" font-weight="700">① 高频声强差 (ILD)：外侧上橄榄核 (LSO) 管辖</text>
<text x="436" y="151" font-size="10.4" fill="#1e293b" text-anchor="start">• 频率 &gt; 2 kHz 的高频声波长小于头颅直径，绕不过脑袋，</text>
<text x="436" y="170" font-size="10.4" fill="#1e293b" text-anchor="start">  会在背风侧耳朵投下一片“声影区”（响度弱几到十几 dB）；</text>
<text x="436" y="189" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="600">• 大脑把“低频时间差 + 高频响度差”双剑合璧（瑞利双工理论），</text>
<text x="436" y="208" font-size="10.4" fill="#0f766e" text-anchor="start" font-weight="700">  横扫全频段水平方位！</text>
<rect x="424" y="242" width="302" height="130" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="436" y="264" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">② 为什么外耳廓长得皱巴巴？专管“上下与前后”！</text>
<text x="436" y="285" font-size="10.4" fill="#1e293b" text-anchor="start">• 正前方、正头顶、正后方的声音到两耳距离完全相等（ITD=0,</text>
<text x="436" y="304" font-size="10.4" fill="#1e293b" text-anchor="start">  ILD=0），光靠两耳对比根本分不出是在头顶还是脚底！</text>
<text x="436" y="323" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="600">• 全靠外耳廓凹凸不平的耳轮与耳甲腔：不同高度射来的声波</text>
<text x="436" y="342" font-size="10.4" fill="#1e293b" text-anchor="start">  反射干涉，刻出独一无二的频谱缺口；经典实验用硅胶填平耳廓</text>
<text x="436" y="360" font-size="10.4" fill="#b91c1c" text-anchor="start" font-weight="700">  褶皱后，受试者立刻丧失上下仰角定位能力！</text>
<rect x="424" y="384" width="302" height="120" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="436" y="406" font-size="10.6" fill="#6d28d9" text-anchor="start" font-weight="700">③ 彩蛋：为什么听微信语音总觉得“我的声音怎么这么难听”？</text>
<text x="436" y="427" font-size="10.4" fill="#1e293b" text-anchor="start">• 平时你自己开口说话时，内耳同时收到两路声音：</text>
<text x="436" y="446" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">  空气传声 + 声带直接震动头骨传进耳蜗的“颅骨传导”！</text>
<text x="436" y="465" font-size="10.4" fill="#1e293b" text-anchor="start">• 头骨是天然重低音炮，给你的自听声音加了浑厚低频滤镜；而</text>
<text x="436" y="484" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="600">  麦克风只录空气传声（那恰恰是全世界别人天天听到的真声）！</text>
</svg>
