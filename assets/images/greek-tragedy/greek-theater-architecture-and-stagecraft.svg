<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">古希腊露天剧场空间平面构造与三大舞台机关解剖图</title>
<desc id="desc">左侧按埃皮达鲁斯34加21排比例展示看台、乐池、侧道与景屋的声学空间关系；右侧解析亚麻面具、展示室内惨案的滑轮推车与衍生出机械降神一词的起重吊车。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="547" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">没有扩音器，一万四千人怎么听清台词？古希腊露天剧场空间与三大机关</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：依山开凿的半圆扇形声学剧场平面（按埃皮达鲁斯 34+21=55 排比例）；右：面具、推车与吊车</text>
<rect x="24" y="66" width="388" height="466" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="92" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">一、露天剧场空间布局（俯视平面构造）</text>
<path d="M 75.2 304.4 A 146 146 0 1 1 360.8 304.4 L 323.6 296.5 A 108 108 0 1 0 112.4 296.5 Z" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<path d="M 120.2 294.8 A 100 100 0 1 1 315.8 294.8 L 272.8 285.6 A 56 56 0 1 0 163.2 285.6 Z" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<line x1="162.3" y1="268.1" x2="72.8" y2="258.7" stroke="#ffffff" stroke-width="1.4"/>
<line x1="171.6" y1="242.7" x2="97.0" y2="192.4" stroke="#ffffff" stroke-width="1.4"/>
<line x1="191.7" y1="224.6" x2="149.5" y2="145.1" stroke="#ffffff" stroke-width="1.4"/>
<line x1="218.0" y1="218.0" x2="218.0" y2="128.0" stroke="#ffffff" stroke-width="1.4"/>
<line x1="244.3" y1="224.6" x2="286.5" y2="145.1" stroke="#ffffff" stroke-width="1.4"/>
<line x1="264.4" y1="242.7" x2="339.0" y2="192.4" stroke="#ffffff" stroke-width="1.4"/>
<line x1="273.7" y1="268.1" x2="363.2" y2="258.7" stroke="#ffffff" stroke-width="1.4"/>
<text x="218" y="152" font-size="11.2" fill="#475569" text-anchor="middle" font-weight="700" class="halo">上层看台 Epitheatron（21 排）</text>
<text x="218" y="198" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">下层看台 Theatron（34 排，“观看之所”）</text>
<circle cx="218" cy="274" r="42" fill="#e7f6ee" stroke="#18794e" stroke-width="1.6"/>
<text x="218" y="258" font-size="11.2" fill="#18794e" text-anchor="middle" font-weight="700">乐池 Orchestra</text>
<text x="218" y="294" font-size="10.2" fill="#1e293b" text-anchor="middle">12–15 人歌队歌舞</text>
<circle cx="218" cy="275" r="5" fill="#c25014" stroke="#ffffff" stroke-width="1.2"/>
<rect x="54" y="306" width="92" height="24" rx="5" fill="#fff7ed" stroke="#c25014" stroke-width="1"/>
<text x="100" y="322" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">左通道 Parodos</text>
<rect x="290" y="306" width="92" height="24" rx="5" fill="#fff7ed" stroke="#c25014" stroke-width="1"/>
<text x="336" y="322" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">右通道 Parodos</text>
<rect x="126" y="336" width="184" height="22" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.1"/>
<text x="218" y="351" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">台口演区 Proskenion（3 演员交锋）</text>
<rect x="116" y="360" width="204" height="34" rx="6" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="218" y="381" font-size="10.8" fill="#6d28d9" text-anchor="middle" font-weight="700">景屋 Skene（换面具后台＋宫殿立面＋平顶神坛）</text>
<rect x="38" y="412" width="360" height="106" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="50" y="433" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">考古与声学真相：</text>
<text x="50" y="454" font-size="10.8" fill="#1e293b" text-anchor="start">• 雅典酒神剧场前 5 世纪初为木看台与近梯形乐池，前 4 世纪改石阶；</text>
<text x="50" y="474" font-size="10.8" fill="#1e293b" text-anchor="start">• 埃皮达鲁斯（前 4 世纪）55 排石阶容约 1.4 万人，石灰岩座位呈波纹</text>
<text x="50" y="494" font-size="10.8" fill="#1e293b" text-anchor="start">  结构：滤除人群低频嗡鸣，把演员高频辅音清晰反射到顶排。</text>
<rect x="426" y="66" width="310" height="466" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="444" y="92" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">二、三大舞台黑科技</text>
<rect x="442" y="108" width="278" height="122" rx="8" fill="#f8fafc" stroke="#1d6fa5" stroke-width="1"/>
<ellipse cx="474" cy="168" rx="18" ry="23" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<circle cx="467" cy="161" r="2.6" fill="#1d6fa5"/><circle cx="481" cy="161" r="2.6" fill="#1d6fa5"/>
<path d="M466,179 Q474,171 482,179" fill="none" stroke="#1d6fa5" stroke-width="2"/>
<text x="504" y="130" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">① 亚麻面具（Prosopon）</text>
<text x="504" y="152" font-size="11" fill="#1e293b" text-anchor="start">• 夸张五官轮廓，百米外一眼辨角色</text>
<text x="504" y="173" font-size="11" fill="#1e293b" text-anchor="start">• 3 男演员秒换男女老少 6–10 角</text>
<text x="504" y="194" font-size="10.8" fill="#64748b" text-anchor="start">• 纠偏：古典面具嘴孔适中，主要靠</text>
<text x="504" y="212" font-size="10.8" fill="#64748b" text-anchor="start">  剧场声学而非“喇叭嘴”扩音</text>
<rect x="442" y="244" width="278" height="130" rx="8" fill="#f8fafc" stroke="#c25014" stroke-width="1"/>
<rect x="454" y="298" width="40" height="14" rx="3" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<circle cx="463" cy="317" r="5" fill="none" stroke="#c25014" stroke-width="1.6"/>
<circle cx="485" cy="317" r="5" fill="none" stroke="#c25014" stroke-width="1.6"/>
<line x1="458" y1="291" x2="490" y2="291" stroke="#c25014" stroke-width="2" marker-end="url(#arr-orange)"/>
<text x="504" y="266" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">② 滑轮推车（Ekkyklema）</text>
<text x="504" y="288" font-size="11" fill="#1e293b" text-anchor="start">• 舞台禁忌：几乎不当众演砍杀动作</text>
<text x="504" y="309" font-size="11" fill="#1e293b" text-anchor="start">• 惨案在门后发生，先闻惨叫，再开</text>
<text x="504" y="330" font-size="11" fill="#1e293b" text-anchor="start">  景屋大门推出木台亮出室内尸骸</text>
<text x="504" y="351" font-size="10.8" fill="#64748b" text-anchor="start">  （如《阿伽门农》浴缸弑王场面）</text>
<rect x="442" y="388" width="278" height="128" rx="8" fill="#f8fafc" stroke="#6d28d9" stroke-width="1"/>
<line x1="460" y1="494" x2="460" y2="424" stroke="#6d28d9" stroke-width="2.2"/>
<line x1="460" y1="424" x2="490" y2="416" stroke="#6d28d9" stroke-width="2.2"/>
<line x1="488" y1="417" x2="488" y2="446" stroke="#6d28d9" stroke-width="1.3" stroke-dasharray="3 2"/>
<circle cx="488" cy="456" r="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="488" y="460" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="700">神</text>
<text x="506" y="410" font-size="12" fill="#6d28d9" text-anchor="start" font-weight="700">③ 起重吊车（Mechane）</text>
<text x="506" y="432" font-size="11" fill="#1e293b" text-anchor="start">• 悬臂绳索把神明或英雄吊飞至景屋</text>
<text x="506" y="453" font-size="11" fill="#1e293b" text-anchor="start">  半空（如美狄亚乘太阳龙车升空）</text>
<text x="506" y="474" font-size="11" fill="#6d28d9" text-anchor="start" font-weight="600">• 拉丁成语 Deus ex machina：</text>
<text x="506" y="494" font-size="10.8" fill="#64748b" text-anchor="start">  “机械降神”强行收场即源于此机</text>
</svg>
