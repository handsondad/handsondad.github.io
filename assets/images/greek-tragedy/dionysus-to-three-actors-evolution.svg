<text x="470.5" y="296" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700">对话通道：3 条</text>
<text x="470.5" y="322" font-size="11.2" fill="#1e293b" text-anchor="middle">两角色首次当面交锋！</text>
<text x="470.5" y="344" font-size="11.2" fill="#1e293b" text-anchor="middle">《诗学》：对话自此取代</text>
<text x="470.5" y="366" font-size="11.2" fill="#1e293b" text-anchor="middle">合唱跃升为全剧重心</text>
