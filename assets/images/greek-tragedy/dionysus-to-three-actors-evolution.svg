<text x="108.5" y="322" font-size="11.2" fill="#1e293b" text-anchor="middle">纯第三人称集体吟唱：</text>
<text x="108.5" y="344" font-size="11.2" fill="#1e293b" text-anchor="middle">“大家听，酒神当年……”</text>
<text x="108.5" y="366" font-size="11.2" fill="#1e293b" text-anchor="middle">只有叙事赞歌，尚无角色</text>
