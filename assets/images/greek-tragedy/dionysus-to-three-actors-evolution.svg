<title id="title">古希腊悲剧从酒神合唱到三演员戏剧的演化与词源三假说</title>
<desc id="desc">展示古希腊悲剧从50人酒神颂合唱（0名演员）经泰斯庇斯第1演员、埃斯库罗斯第2演员到索福克勒斯第3演员的对话通道倍增过程，以及山羊之歌词源的三种学术假说。</desc>
