<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">从酒神合唱到三演员交锋：希腊悲剧怎样一步步“长”出戏剧冲突？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">每增加 1 名演员，台上对话通道按组合数 C(n+1, 2) 跃升（含歌队长）；底部附“山羊之歌”词源三假说</text>
