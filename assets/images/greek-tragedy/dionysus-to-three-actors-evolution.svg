<text x="683.5" y="220" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">歌</text>
<rect x="579.0" y="256.0" width="145" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="651.5" y="271.0" font-size="11" fill="#18794e" text-anchor="middle" font-weight="600">演员 3 人｜歌队 15 人</text>
