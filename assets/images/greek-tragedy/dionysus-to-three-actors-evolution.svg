<text x="470.5" y="222" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="700">歌</text>
<text x="470.5" y="146" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">正面冲突</text>
