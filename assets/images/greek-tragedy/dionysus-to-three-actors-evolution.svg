<text x="287.5" y="173.0" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">一问一答</text>
<rect x="217.0" y="256.0" width="145" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="289.5" y="271.0" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">演员 1 人｜歌队长应答</text>
<text x="289.5" y="296" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="700">对话通道：1 条</text>
<text x="289.5" y="322" font-size="11.2" fill="#1e293b" text-anchor="middle">首创“应答者”戴面具：</text>
<text x="289.5" y="344" font-size="11.2" fill="#1e293b" text-anchor="middle">“我就是酒神本人！”</text>
<text x="289.5" y="366" font-size="11.2" fill="#1e293b" text-anchor="middle">后台换面具可分饰多角</text>
