<text x="651.5" y="322" font-size="11.2" fill="#1e293b" text-anchor="middle">实现争辩＋旁听＋反讽</text>
<text x="651.5" y="344" font-size="11.2" fill="#1e293b" text-anchor="middle">定型“三演员铁律”：仅</text>
<text x="651.5" y="366" font-size="11.2" fill="#1e293b" text-anchor="middle">3 男演员分饰全剧角色</text>
<rect x="24" y="416" width="712" height="126" rx="10" fill="#fffdf9" stroke="#c25014" stroke-width="1.1"/>
<text x="40" y="440" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">词源悬案：为什么“悲剧（Tragōidia）”字面意思是“公山羊（tragos）之歌（ōidē）”？学界三大假说并存：</text>
<rect x="38" y="452" width="222" height="78" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="0.9"/>
<text x="149" y="472" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">① 奖品／祭品说（古典传统）</text>
<text x="149" y="494" font-size="11" fill="#1e293b" text-anchor="middle">早期合唱竞赛以活山羊为奖品，</text>
<text x="149" y="514" font-size="11" fill="#1e293b" text-anchor="middle">或开演前绕坛宰杀公山羊献祭酒神</text>
<rect x="269" y="452" width="222" height="78" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="0.9"/>
<text x="380" y="472" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">② 羊人侍从说（《诗学》线索）</text>
<text x="380" y="494" font-size="11" fill="#1e293b" text-anchor="middle">歌队曾披羊皮扮酒神随从萨堤尔，</text>
<text x="380" y="514" font-size="11" fill="#1e293b" text-anchor="middle">从诙谐歌舞逐渐蜕变为严肃悲剧</text>
<rect x="500" y="452" width="222" height="78" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="0.9"/>
<text x="611" y="472" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">③ 少年变声说（温克勒现代假说）</text>
<text x="611" y="494" font-size="11" fill="#1e293b" text-anchor="middle">雅典青年受训兵组成歌队，变声期</text>
<text x="611" y="514" font-size="11" fill="#1e293b" text-anchor="middle">破音在古希腊语中称“像山羊叫”</text>
</svg>
