<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">雅典城邦酒神节五天运作与四联剧竞赛机制图解</title>
<desc id="desc">左栏展示名年执政官选拔、富豪歌队资助人制度、观剧津贴与十部落双层抽签评委；右栏展示开场公民政治仪式与连续三天每位诗人上演三部悲剧加一部萨堤尔剧的赛制。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="529" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">不只是看戏，更是全城民主大审视：雅典“城邦酒神节”运作与竞赛机制</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">每年早春航海季（3 月底—4 月初）全城停工：执政官选本、富豪包歌队、穷人领津贴、十部落抽签定冠军</text>
<rect x="24" y="66" width="350" height="448" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="92" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">一、谁选戏、谁出钱、谁打分？（城邦公事四环）</text>
<rect x="40" y="108" width="318" height="84" rx="8" fill="#f8fafc" stroke="#1d6fa5" stroke-width="1"/>
<circle cx="58" cy="130" r="9.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="58" y="134" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="74" y="134" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">名年执政官选拔（提前半年“授予歌队”）</text>
<text x="50" y="158" font-size="11.2" fill="#1e293b" text-anchor="start">最高行政官审读剧本提纲，选定 3 位悲剧诗人入围；</text>
<text x="50" y="178" font-size="11.2" fill="#1e293b" text-anchor="start">落选即无缘当年大节（名家索福克勒斯亦须申报）。</text>
<line x1="199" y1="192" x2="199" y2="206" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-muted)"/>
<rect x="40" y="206" width="318" height="84" rx="8" fill="#f8fafc" stroke="#c25014" stroke-width="1"/>
<circle cx="58" cy="228" r="9.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="58" y="232" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="74" y="232" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">歌队资助人制度（Choregia 富豪公益义务）</text>
<text x="50" y="256" font-size="11.2" fill="#1e293b" text-anchor="start">指定 3 位富豪公民自费承担 12–15 名公民歌队员数月</text>
<text x="50" y="276" font-size="11.2" fill="#1e293b" text-anchor="start">食宿、排练与华服（前 472 年青年伯里克利资助《波斯人》）。</text>
<line x1="199" y1="290" x2="199" y2="304" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-muted)"/>
<rect x="40" y="304" width="318" height="84" rx="8" fill="#f8fafc" stroke="#18794e" stroke-width="1"/>
<circle cx="58" cy="326" r="9.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="58" y="330" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">3</text>
<text x="74" y="330" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">观剧津贴（Theorika 全民入场保障）</text>
<text x="50" y="354" font-size="11.2" fill="#1e293b" text-anchor="start">门票约 2 欧博尔（相当于劳工日薪），城邦向贫困公民</text>
<text x="50" y="374" font-size="11.2" fill="#1e293b" text-anchor="start">发放津贴，让上万公民共同在剧场审视伦理与政治。</text>
<line x1="199" y1="388" x2="199" y2="402" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr-muted)"/>
<rect x="40" y="402" width="318" height="84" rx="8" fill="#f8fafc" stroke="#6d28d9" stroke-width="1"/>
<circle cx="58" cy="424" r="9.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="58" y="428" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">4</text>
<text x="74" y="428" font-size="12" fill="#6d28d9" text-anchor="start" font-weight="700">十部落双层抽签评委（防贿赂机制）</text>
<text x="50" y="452" font-size="11.2" fill="#1e293b" text-anchor="start">10 个部落各抽 1 名评委投票密封；执政官终场随机只</text>
<text x="50" y="472" font-size="11.2" fill="#1e293b" text-anchor="start">抽出 5 票计分定胜负——一半归民意，一半留给神意。</text>
<rect x="388" y="66" width="348" height="448" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="406" y="92" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">二、早春赛程与“3 悲 + 1 羊”四联剧配方</text>
<rect x="404" y="108" width="316" height="104" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="418" y="130" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">正赛前奏：全城迎神游行 ＋ 帝国政治大秀</text>
<text x="418" y="152" font-size="11.2" fill="#1e293b" text-anchor="start">• 迎酒神木像夜游入场 ＋ 10 部落千人酒神颂合唱赛</text>
<text x="418" y="174" font-size="11.2" fill="#1e293b" text-anchor="start">• 剧场中央公开陈列盟邦贡银、表彰城邦功臣</text>
<text x="418" y="196" font-size="11.2" fill="#1e293b" text-anchor="start">• 阵亡将士遗孤满 18 岁获赠全套铠甲，列队巡场</text>
<rect x="404" y="224" width="316" height="214" rx="8" fill="#ffffff" stroke="#c25014" stroke-width="1.2"/>
<text x="418" y="246" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">连续 3 个悲剧竞赛日：每位诗人独占 1 整天！</text>
<rect x="416.0" y="262.0" width="116" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="474.0" y="278.3" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">清晨 ① 悲剧一</text>
<text x="540" y="278" font-size="11.2" fill="#1e293b" text-anchor="start">铺陈神话困局与家族／城邦裂痕</text>
<rect x="416.0" y="296.0" width="116" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="474.0" y="312.3" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">上午 ② 悲剧二</text>
<text x="540" y="312" font-size="11.2" fill="#1e293b" text-anchor="start">冲突激化，英雄一步步逼近临界点</text>
<rect x="416.0" y="330.0" width="116" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="474.0" y="346.3" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">午后 ③ 悲剧三</text>
<text x="540" y="346" font-size="11.2" fill="#1e293b" text-anchor="start">终局审判或毁灭（三部合称三联剧）</text>
<rect x="416.0" y="364.0" width="116" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="474.0" y="380.3" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">傍晚 ④ 萨堤尔剧</text>
<text x="540" y="380" font-size="11.2" fill="#1e293b" text-anchor="start">半人半羊歌队荒诞嬉闹，释放悲伤！</text>
<line x1="418" y1="404" x2="706" y2="404" stroke="#cbd5e1" stroke-width="1"/>
<text x="562" y="425" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">3 天正赛总计：3 位诗人 × 4 部戏 = 12 部大戏连演</text>
<rect x="404" y="450" width="316" height="50" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="562" y="471" font-size="11.3" fill="#18794e" text-anchor="middle" font-weight="700">终场荣耀：获胜资助人与诗人同刻大理石《胜利名录》</text>
<text x="562" y="491" font-size="11" fill="#1e293b" text-anchor="middle">头戴常春藤花冠，其声望在雅典堪比奥林匹克夺冠</text>
</svg>
