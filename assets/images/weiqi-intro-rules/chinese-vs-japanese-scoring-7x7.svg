<title id="title">7×7围棋终局数子法与数目法逐点核算及19路黑贴3又4分之3子换算图</title>
<desc id="desc">左图构造一盘单官收完的7×7终局（黑14活子围12空提2白子，白13活子围10空提1黑子）；右上严格对比中国数子法（黑26子超半数24.5达+1.5子）与日韩数目法（黑14目减白11目净胜+3目），证明1子差等于2目差；右下推导19路361点黑贴3.75子（185子黑胜、184子白胜）与黑贴7.5目的精确2倍关系。</desc>
