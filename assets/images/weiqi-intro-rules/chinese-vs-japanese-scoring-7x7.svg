<text x="354" y="96" font-size="11.0" fill="13.5" text-anchor="start" font-weight="700">同一盘棋两种数法（先不计贴目）：结果分毫不差！</text>
<rect x="336" y="112" width="192" height="160" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="432" y="130" font-size="9.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">中国规则 · 数子法（算占地总面积）</text>
<text x="346" y="150" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="700">口诀：活子 + 围空（俘虏死子不用管）</text>
<text x="346" y="170" font-size="8.9" fill="#1d6fa5" text-anchor="start" font-weight="700">• 黑总子数 = 14 活子 + 12 空 = 26 子</text>
<text x="346" y="188" font-size="8.9" fill="#1e293b" text-anchor="start">• 白总子数 = 13 活子 + 10 空 = 23 子</text>
<text x="346" y="206" font-size="8.8" fill="#64748b" text-anchor="start">• 棋盘半数（归本数）= 49 ÷ 2 = 24.5</text>
<rect x="346.0" y="218.0" width="172" height="24" rx="12.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="432.0" y="234.3" font-size="8.9" fill="#1d6fa5" text-anchor="middle" font-weight="600">黑超半数 26-24.5 = +1.5 子</text>
<text x="432" y="258" font-size="8.6" fill="#0f172a" text-anchor="middle">（黑白总地盘差 26 - 23 = +3 点）</text>
<rect x="538" y="112" width="192" height="160" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="634" y="130" font-size="9.5" fill="#18794e" text-anchor="middle" font-weight="700">日韩规则 · 数目法（算净围空+俘虏）</text>
<text x="548" y="150" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="700">口诀：围空 + 提子（或死子回填敌空）</text>
<text x="548" y="170" font-size="8.9" fill="#18794e" text-anchor="start" font-weight="700">• 黑总目数 = 12 围空 + 2 俘虏 = 14 目</text>
<text x="548" y="188" font-size="8.9" fill="#1e293b" text-anchor="start">• 白总目数 = 10 围空 + 1 俘虏 = 11 目</text>
<text x="548" y="206" font-size="8.8" fill="#64748b" text-anchor="start">• 直接相减比谁净目多：14 vs 11</text>
<rect x="548.0" y="218.0" width="172" height="24" rx="12.0" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="634.0" y="234.3" font-size="8.9" fill="#18794e" text-anchor="middle" font-weight="600">黑净胜 14 - 11 = +3 目！</text>
<text x="634" y="258" font-size="8.6" fill="#18794e" text-anchor="middle" font-weight="700">（1.5 子 × 2 = 3 目，完全等价！）</text>
<rect x="322" y="298" width="422" height="166" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="338" cy="316" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="338" y="320" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">3</text>
<text x="354" y="320" font-size="10.8" fill="13.5" text-anchor="start" font-weight="700">秒懂 19 路大赛播报：为什么“黑贴 3¾ 子”就是“黑贴 7.5 目”？</text>
<rect x="338" y="334" width="390" height="42" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="533" y="352" font-size="9.4" fill="#c25014" text-anchor="middle" font-weight="700" class="mono">恒等式：黑子 + 白子 = 361  ⇒  黑白差 (黑 - 白) = 2 × (黑 - 180.5)</text>
<text x="533" y="369" font-size="8.5" fill="#0f172a" text-anchor="middle">数子算“单方超半数 (黑 - 180.5)”；数目算“双方净差 (黑 - 白)”，恰好差 2 倍！</text>
<text x="338" y="395" font-size="8.7" fill="#1e293b" text-anchor="start">• 中国规则（2002）：黑贴 3¾ 子（3.75 子），过关线 = 180.5 + 3.75 = 184.25 子：</text>
<text x="348" y="414" font-size="8.9" fill="#18794e" text-anchor="start" font-weight="700">— 黑数 185 子：185 - 184.25 = 黑胜 ¾ 子（×2 即黑胜 1.5 目！）</text>
<text x="348" y="432" font-size="8.9" fill="#9f1239" text-anchor="start" font-weight="700">— 黑数 184 子：184 - 184.25 = 黑负 ¼ 子，即白胜 ¼ 子（白胜 0.5 目！）</text>
<text x="338" y="451" font-size="8.6" fill="#64748b" text-anchor="start">• 日韩规则：现行黑贴 6.5 目；应氏规则：黑贴 8 点（平点白胜，等效 7.5 目）。</text>
</svg>
