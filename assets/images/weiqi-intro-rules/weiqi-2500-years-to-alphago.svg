<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">围棋两千五百年历史演进时间轴与AlphaGo突破10的170次方状态空间图解</title>
<desc id="desc">上排梳理公元前548年《左传》定名、东汉望都墓17道石盘、北周《敦煌碁经》与隋代张盛墓19道瓷盘、江户废除座子与1933新布局及贴目制、直至2016–2017年AlphaGo与AlphaGo Zero的五次跃迁；左下按对数尺度对比国际象棋(~10^44)、可观测宇宙原子(~10^80)与19路围棋精确合法局面(2.08×10^170)；右下解析策略网络+价值网络+MCTS与著名的五路肩冲第37手。</desc>
