<rect x="0.5" y="0.5" width="759" height="467" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">两千五百年棋道演进与 AI 破壁：从 17 道石盘、废除座子到 AlphaGo</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">为什么国际象棋 1997 年就被深蓝攻克，而规则更简单的围棋却让人类顶尖棋手多守了整整 19 年？</text>
<rect x="16" y="74" width="728" height="186" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="32" cy="92" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="32" y="96" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="48" y="96" font-size="11.2" fill="13.5" text-anchor="start" font-weight="700">围棋形制与规则的五次历史定型（史料与考古实物双重印证）</text>
<line x1="90.0" y1="134.0" x2="670.0" y2="134.0" stroke="#e2e8f0" stroke-width="2.2"/>
<rect x="30" y="112" width="134" height="134" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<rect x="42.0" y="118.0" width="110" height="20" rx="10.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="97.0" y="131.6" font-size="8.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">公元前548年</text>
<text x="97" y="154" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="700">先秦文献定名</text>
<text x="97" y="173" font-size="8.5" fill="#1e293b" text-anchor="middle">《左传》襄公二十五年</text>
<text x="97" y="189" font-size="8.5" fill="#1e293b" text-anchor="middle">首载“弈者举棋不定”；</text>
<text x="97" y="205" font-size="8.5" fill="#1e293b" text-anchor="middle">《孟子》记国手弈秋，</text>
<text x="97" y="221" font-size="8.5" fill="#1e293b" text-anchor="middle">早期称“弈”后称围棋。</text>
<rect x="172" y="112" width="134" height="134" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
<rect x="184.0" y="118.0" width="110" height="20" rx="10.0" fill="#ffffff" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="239.0" y="131.6" font-size="8.5" fill="#b45309" text-anchor="middle" font-weight="600">东汉—魏晋</text>
<text x="239" y="154" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="700">17×17 道石棋盘</text>
<text x="239" y="173" font-size="8.5" fill="#1e293b" text-anchor="middle">河北望都东汉墓出土</text>
<text x="239" y="189" font-size="8.5" fill="#1e293b" text-anchor="middle">17道石盘（289点）；</text>
<text x="239" y="205" font-size="8.5" fill="#1e293b" text-anchor="middle">班固《弈旨》首论棋理，</text>
<text x="239" y="221" font-size="8.5" fill="#1e293b" text-anchor="middle">《艺经》载纵横十七道。</text>
<rect x="314" y="112" width="134" height="134" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<rect x="326.0" y="118.0" width="110" height="20" rx="10.0" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="381.0" y="131.6" font-size="8.5" fill="#18794e" text-anchor="middle" font-weight="600">南北朝—隋唐</text>
<text x="381" y="154" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="700">19×19 道与十决</text>
<text x="381" y="173" font-size="8.5" fill="#1e293b" text-anchor="middle">北周《敦煌碁经》载</text>
<text x="381" y="189" font-size="8.5" fill="#1e293b" text-anchor="middle">“三百六十一道”；安阳</text>
<text x="381" y="205" font-size="8.5" fill="#1e293b" text-anchor="middle">隋张盛墓(595)出白瓷盘；</text>
<text x="381" y="221" font-size="8.5" fill="#1e293b" text-anchor="middle">唐王积薪撰《围棋十决》。</text>
<rect x="456" y="112" width="134" height="134" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<rect x="468.0" y="118.0" width="110" height="20" rx="10.0" fill="#ffffff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="523.0" y="131.6" font-size="8.5" fill="#6d28d9" text-anchor="middle" font-weight="600">17世纪—20世纪</text>
<text x="523" y="154" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="700">废座子·新布局·贴目</text>
<text x="523" y="173" font-size="8.5" fill="#1e293b" text-anchor="middle">古棋先摆4颗星位座子；</text>
<text x="523" y="189" font-size="8.5" fill="#1e293b" text-anchor="middle">江户日本改空盘自由下，</text>
<text x="523" y="205" font-size="8.5" fill="#1e293b" text-anchor="middle">1933吴清源掀起新布局，</text>
<text x="523" y="221" font-size="8.5" fill="#1e293b" text-anchor="middle">现代确立先行贴目制。</text>
<rect x="598" y="112" width="134" height="134" rx="7" fill="#ffe4e6" stroke="#9f1239" stroke-width="1"/>
<rect x="610.0" y="118.0" width="110" height="20" rx="10.0" fill="#ffffff" stroke="#9f1239" stroke-width="1" stroke-opacity="0.35"/>
<text x="665.0" y="131.6" font-size="8.5" fill="#9f1239" text-anchor="middle" font-weight="600">2016—2017</text>
<text x="665" y="154" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="700">AlphaGo 零知识破壁</text>
<text x="665" y="173" font-size="8.5" fill="#1e293b" text-anchor="middle">2016 胜李世石(4:1)，</text>
<text x="665" y="189" font-size="8.5" fill="#1e293b" text-anchor="middle">第37手五路肩冲惊天下；</text>
<text x="665" y="205" font-size="8.5" fill="#1e293b" text-anchor="middle">2017 Zero 仅凭基本规则</text>
<text x="665" y="221" font-size="8.5" fill="#1e293b" text-anchor="middle">自博弈 100:0 完胜前代！</text>
