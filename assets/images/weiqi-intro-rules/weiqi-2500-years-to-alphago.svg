<text x="588" y="326" font-size="9.3" fill="#18794e" text-anchor="start" font-weight="700">破局三剑客：</text>
<text x="588" y="344" font-size="8.6" fill="#0f172a" text-anchor="start">1. 策略网络：像人类棋感，</text>
<text x="588" y="359" font-size="8.6" fill="#0f172a" text-anchor="start">   从250点筛出几步好点；</text>
<text x="588" y="377" font-size="8.6" fill="#0f172a" text-anchor="start">2. 价值网络：不数子力，直</text>
<text x="588" y="392" font-size="8.6" fill="#0f172a" text-anchor="start">   接评估整盘胜率厚薄；</text>
<text x="588" y="410" font-size="8.6" fill="#0f172a" text-anchor="start">3. 树搜索+自博弈：打破</text>
<text x="588" y="425" font-size="8.6" fill="#0f172a" text-anchor="start">   “布局禁下五路”古训，</text>
<text x="588" y="440" font-size="8.6" fill="#9f1239" text-anchor="start" font-weight="700">   反哺今天人类职业棋坛！</text>
