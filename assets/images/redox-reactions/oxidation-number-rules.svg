<svg xmlns="http://www.w3.org/2000/svg" width="760" height="506" viewBox="0 0 760 506" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">氧化数规则与置换燃烧反应记账图</title>
<desc id="desc">左侧列出氧化数五条常用规则：单质为零、单原子离子等于电荷、氢通常正一、氧通常负二、分子总和为零；右侧用锌置换铜离子和碳燃烧两个反应示范氧化数升高即氧化、降低即还原，并强调氧化不等于必须与氧反应。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="505" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">氧化数：给每个原子记一笔“电子账”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">不一定真有电子完全转移；氧化数是一种形式记账规则。</text>
<rect x="20" y="66" width="352" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="88" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="92" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="92" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">五条常用规则</text>
<rect x="38" y="124" width="316" height="46" rx="6" fill="#f7fafc" stroke="#dbe6ee"/>
<text x="50" y="143" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">单质</text>
<text x="50" y="161" font-size="9.8" fill="#0f172a" text-anchor="start">氧化数为 0</text>
<text x="212" y="152" font-size="9.6" fill="#475569" text-anchor="start">O₂、Zn、C：都是 0</text>
<rect x="38" y="180" width="316" height="46" rx="6" fill="#f7fafc" stroke="#dbe6ee"/>
<text x="50" y="199" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">单原子离子</text>
<text x="50" y="217" font-size="9.8" fill="#0f172a" text-anchor="start">等于离子电荷</text>
<text x="212" y="208" font-size="9.6" fill="#475569" text-anchor="start">Na⁺ 为 +1，Cl⁻ 为 −1</text>
<rect x="38" y="236" width="316" height="46" rx="6" fill="#f7fafc" stroke="#dbe6ee"/>
<text x="50" y="255" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">氢</text>
<text x="50" y="273" font-size="9.8" fill="#0f172a" text-anchor="start">通常为 +1</text>
<text x="212" y="264" font-size="9.6" fill="#475569" text-anchor="start">金属氢化物中为 −1</text>
<rect x="38" y="292" width="316" height="46" rx="6" fill="#f7fafc" stroke="#dbe6ee"/>
<text x="50" y="311" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">氧</text>
<text x="50" y="329" font-size="9.8" fill="#0f172a" text-anchor="start">通常为 −2</text>
<text x="212" y="320" font-size="9.6" fill="#475569" text-anchor="start">过氧化物中为 −1</text>
<rect x="38" y="348" width="316" height="46" rx="6" fill="#f7fafc" stroke="#dbe6ee"/>
<text x="50" y="367" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">总和</text>
<text x="50" y="385" font-size="9.8" fill="#0f172a" text-anchor="start">分子为 0；离子为净电荷</text>
<text x="212" y="376" font-size="9.6" fill="#475569" text-anchor="start">H₂O：2×(+1)+(−2)=0</text>
<text x="38" y="418" font-size="10.2" fill="#64748b" text-anchor="start">IUPAC：异核键电子形式上判给电负性更大的一方。</text>
<rect x="388" y="66" width="352" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="88" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="406" y="92" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="92" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">用氧化数追踪两个反应</text>
<text x="404" y="128" font-size="11.0" fill="#c25014" text-anchor="start" font-weight="700">① 置换反应</text>
<text x="404" y="156" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">Zn + Cu²⁺ → Zn²⁺ + Cu</text>
<text x="418" y="180" font-size="10.4" fill="#475569" text-anchor="middle" font-weight="700">0</text>
<text x="488" y="180" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">+2</text>
<text x="566" y="180" font-size="10.4" fill="#c25014" text-anchor="middle" font-weight="700">+2</text>
<text x="650" y="180" font-size="10.4" fill="#475569" text-anchor="middle" font-weight="700">0</text>
<text x="404" y="208" font-size="10.4" fill="#c25014" text-anchor="start">Zn：0 → +2 升高，被氧化；</text>
<text x="404" y="230" font-size="10.4" fill="#1d6fa5" text-anchor="start">Cu²⁺：+2 → 0 降低，被还原。</text>
<line x1="404.0" y1="244.0" x2="724.0" y2="244.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="404" y="274" font-size="11.0" fill="#c25014" text-anchor="start" font-weight="700">② 燃烧反应</text>
<text x="404" y="302" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">C + O₂ → CO₂</text>
<text x="404" y="330" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="600">C：0 → +4（氧化）</text>
<text x="404" y="354" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="600">O：0 → −2（还原）</text>
<text x="404" y="384" font-size="10.4" fill="#1e293b" text-anchor="start">“氧化”不一定是和氧反应：</text>
<text x="404" y="408" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">本质是氧化数升高、失去电子。</text>
<rect x="20" y="452" width="720" height="44" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="480" font-size="10.8" fill="#475569" text-anchor="start">半反应法配平：先分开写氧化与还原，再让两边电子数相等，最后相加消去 e⁻。</text>
</svg>
