<title id="title">克拉克三颗静止卫星全球覆盖几何切线81.3度盲区与闪电轨道高纬接力对比图</title>
<desc id="desc">左图按1比6.61真实比例画出地球静止轨道切线，证明南北纬81.3度以上存在极区盲区，并展示克拉克120度三星覆盖；右图按开普勒方程标出闪电轨道12个等时间间隔（每1小时）点位，展示远地点慢速高纬悬停原理。</desc>
