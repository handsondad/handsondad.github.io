<text x="150" y="331" font-size="10.3" fill="#1e293b" text-anchor="start">• 3 颗星相隔 120° 即可无缝覆盖全球经度</text>
<text x="150" y="350" font-size="10.3" fill="#1e293b" text-anchor="start">• 实际工程要求仰角 ≥ 5°（防楼宇/大气折射）</text>
<text x="150" y="369" font-size="10.3" fill="#c25014" text-anchor="start" font-weight="700">  有效南北界约为 ±76.3°，北冰洋仍失联！</text>
<text x="150" y="389" font-size="10.2" fill="#64748b" text-anchor="start">• 极地科考与高纬通信必须另请“奇兵” →</text>
