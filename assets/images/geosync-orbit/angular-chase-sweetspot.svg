  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .rot-earth {
        transform-origin: 192.0px 248.0px;
        animation: spinEarth 6.4s linear 0.35s 1 forwards;
      }
      .rot-geo {
        transform-origin: 192.0px 248.0px;
        animation: spinGeo 6.4s linear 0.35s 1 forwards;
      }
      .rot-meo {
        transform-origin: 192.0px 248.0px;
        animation: spinMeo 6.4s linear 0.35s 1 forwards;
      }
      .rot-leo {
        transform-origin: 192.0px 248.0px;
        animation: spinLeo 6.4s linear 0.35s 1 forwards;
      }
      @keyframes spinEarth {
        from { transform: rotate(90.00deg); }
        to   { transform: rotate(0deg); }
      }
      @keyframes spinGeo {
        from { transform: rotate(90.00deg); }
        to   { transform: rotate(0deg); }
      }
      @keyframes spinMeo {
        from { transform: rotate(167.15deg); }
        to   { transform: rotate(0deg); }
      }
      @keyframes spinLeo {
        from { transform: rotate(1396.34deg); }
        to   { transform: rotate(0deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rot-earth, .rot-geo, .rot-meo, .rot-leo {
          animation: none;
          transform: rotate(0deg);
        }
      }
</style>
