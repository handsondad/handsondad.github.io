<text x="419.0" y="142.0" font-size="9.8" fill="#64748b" text-anchor="end">55°N</text>
<line x1="472.7" y1="122.0" x2="472.7" y2="336.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="472.7" y="350.0" font-size="9.8" fill="#64748b" text-anchor="middle">-20°</text>
