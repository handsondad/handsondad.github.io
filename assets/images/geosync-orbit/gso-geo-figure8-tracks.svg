<rect x="0.5" y="0.5" width="759" height="445" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">地球同步（GSO）≠ 地球静止（GEO）：为什么头顶 8 字舞与赤道单点并存？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：地心引力锁定轨道面必过地心 O；右：真实球面几何精算的 4 类同步卫星星下点轨迹</text>
<rect x="20" y="62" width="336" height="368" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 为什么不能悬停在北京（40°N）正上方？</text>
<text x="36" y="102" font-size="10.8" fill="#64748b" text-anchor="start">万有引力永远指向地心 O，不指向自转轴！</text>
<line x1="156.0" y1="126" x2="156.0" y2="322" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="156.0" y="120" font-size="10.4" fill="#475569" text-anchor="middle" font-weight="600">北极自转轴 Oz</text>
<circle cx="156.0" cy="226.0" r="66.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.8"/>
<ellipse cx="156.0" cy="226.0" rx="66.0" ry="14" fill="none" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="156.0" cy="226.0" r="3.2" fill="#0f172a"/>
<text x="146.0" y="241.0" font-size="10.4" fill="#0f172a" text-anchor="end" font-weight="700">地心 O</text>
<line x1="156.0" y1="143.7" x2="254.1" y2="143.7" stroke="#6d28d9" stroke-width="1.6" stroke-dasharray="4 3" marker-start="url(#arr-muted)"/>
<text x="205.0" y="136.7" font-size="10.0" fill="#6d28d9" text-anchor="middle" font-weight="600">悬停所需向心力（指向轴）</text>
<line x1="254.1" y1="143.7" x2="203.1" y2="186.5" stroke="#c25014" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="260.1" y="175.7" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">真实引力 F_g</text>
<text x="260.1" y="189.7" font-size="10.2" fill="#c25014" text-anchor="start">（直指地心 O！）</text>
<line x1="85.9" y1="285.3" x2="254.1" y2="143.7" stroke="#c25014" stroke-width="1.3" stroke-dasharray="3 3"/>
<circle cx="206.6" cy="183.6" r="3.6" fill="#0f172a"/>
<text x="200.6" y="177.6" font-size="10.2" fill="#0f172a" text-anchor="end" font-weight="700">40°N</text>
<circle cx="254.1" cy="143.7" r="5.8" fill="#c25014" stroke="#ffffff" stroke-width="1.5"/>
<rect x="34" y="334" width="308" height="82" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="46" y="353" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">力学铁律：无外力推力时，轨道平面必过地心 O！</text>
<text x="46" y="371" font-size="10.3" fill="#1e293b" text-anchor="start">• 只要在北纬 40° 出现，半圈后必穿过赤道去南纬 40°；</text>
<text x="46" y="389" font-size="10.3" fill="#1e293b" text-anchor="start">• 唯一能让“向轴”与“向地心”重合的平面——只有赤道面！</text>
<text x="46" y="407" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700">  （倾角 i = 0°、偏心率 e = 0 ⇒ 地球静止轨道 GEO）</text>
<rect x="372" y="62" width="368" height="368" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="388" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 同步卫星星下点轨迹（以 118°E 为中心经度）</text>
<text x="388" y="102" font-size="10.8" fill="#64748b" text-anchor="start">同样 23h56m04s 转一圈，倾角 i 与偏心率 e 决定地面舞步</text>
<rect x="424.0" y="122.0" width="292.0" height="214.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="424.0" y1="319.5" x2="716.0" y2="319.5" stroke="#e2e8f0" stroke-width="1"/>
<text x="419.0" y="323.0" font-size="9.8" fill="#64748b" text-anchor="end">55°S</text>
<line x1="424.0" y1="283.3" x2="716.0" y2="283.3" stroke="#e2e8f0" stroke-width="1"/>
<text x="419.0" y="286.8" font-size="9.8" fill="#64748b" text-anchor="end">33°S</text>
<line x1="424.0" y1="229.0" x2="716.0" y2="229.0" stroke="#475569" stroke-width="1.5"/>
<text x="419.0" y="232.5" font-size="9.8" fill="#64748b" text-anchor="end">0° 赤道</text>
<line x1="424.0" y1="174.7" x2="716.0" y2="174.7" stroke="#e2e8f0" stroke-width="1"/>
<text x="419.0" y="178.2" font-size="9.8" fill="#64748b" text-anchor="end">33°N</text>
