<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">淡水鱼与咸水鱼四大身体结构与感官配置对比图</title>
<desc id="desc">对比淡水鱼与咸水鱼在runx2b肌间小刺（含鲱形目海鱼多刺与鲈形目淡水鱼无小刺例外）、Cyp27c1维生素A1/A2视觉色素、韦伯氏器听觉放大及开鳔闭鳔体型上的适应性差异。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6d28d9"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">从鱼刺、眼睛、耳朵到鱼鳔：浑浊浅滩与蔚蓝大洋改写了哪些硬件？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">打破“淡水鱼都有小刺、海鱼都没小刺”的刻板印象：看清演化辈分与水体光学/声学法则</text>
<rect x="16" y="68" width="144" height="34" rx="8" fill="#1e293b"/>
<text x="88" y="89" font-size="10.8" fill="#ffffff" text-anchor="middle" font-weight="700">身体硬件维度</text>
<rect x="168" y="68" width="282" height="34" rx="8" fill="#0284c7"/>
<text x="309" y="89" font-size="10.8" fill="#ffffff" text-anchor="middle" font-weight="700">典型淡水鱼主流配置（浑水·水草·浅滩）</text>
<rect x="458" y="68" width="286" height="34" rx="8" fill="#ea580c"/>
<text x="601" y="89" font-size="10.8" fill="#ffffff" text-anchor="middle" font-weight="700">典型咸水鱼主流配置（蓝海·高压·开阔洋）</text>
<rect x="16" y="110" width="144" height="96" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="88" y="152.0" font-size="11.0" fill="#dc2626" text-anchor="middle" font-weight="700">① 肌间小刺</text>
<text x="88" y="172.0" font-size="9.8" fill="#64748b" text-anchor="middle" font-weight="600">（runx2b 基因）</text>
<rect x="168" y="110" width="282" height="96" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.3"/>
<text x="180" y="134" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">鲤科（鲫/草/鲢/武昌鱼）含 80–120+ 根</text>
<text x="180" y="157" font-size="9.9" fill="#1d6fa5" text-anchor="start" font-weight="500">Y 字形骨化肌间隔肌腱，支撑低速弯体发力。</text>
<text x="180" y="180" font-size="9.9" fill="#dc2626" text-anchor="start" font-weight="700">【例外】淡水鳜鱼、鲈鱼、黄颡鱼无肌间刺！</text>
<rect x="458" y="110" width="286" height="96" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
<text x="470" y="134" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">高等鲈形目（金枪/石斑/带鱼/大黄鱼）</text>
<text x="470" y="157" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="500">演化出紧实椎骨与大块肌节，0 根肌间小刺！</text>
<text x="470" y="180" font-size="9.9" fill="#dc2626" text-anchor="start" font-weight="700">【例外】低等海鱼鲥鱼、沙丁鱼照样满身小刺！</text>
<rect x="16" y="214" width="144" height="88" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="88" y="252.0" font-size="11.0" fill="#6d28d9" text-anchor="middle" font-weight="700">② 视觉调谐</text>
<text x="88" y="272.0" font-size="9.8" fill="#64748b" text-anchor="middle" font-weight="600">（Cyp27c1 酶）</text>
<rect x="168" y="214" width="282" height="88" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.3"/>
<text x="180" y="238" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">泥沙腐殖质吸收蓝光，水下偏红褐（550–650nm）</text>
<text x="180" y="261" font-size="9.9" fill="#1d6fa5" text-anchor="start" font-weight="500">高表达 Cyp27c1 将维 A₁ 转为维 A₂（视紫蓝质）</text>
<text x="180" y="284" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="500">相当于自带“浑水红光/近红外夜视仪”！</text>
<rect x="458" y="214" width="286" height="88" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
<text x="470" y="238" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">清澈大洋蓝绿光穿透最深（470–490nm）</text>
<text x="470" y="261" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="500">视网膜使用维生素 A₁（视紫红质）匹配蓝海；</text>
<text x="470" y="284" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="500">深海鱼演化超大瞳孔或生物发光诱饵。</text>
<rect x="16" y="310" width="144" height="88" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="88" y="348.0" font-size="11.0" fill="#0f766e" text-anchor="middle" font-weight="700">③ 听觉与触须</text>
<text x="88" y="368.0" font-size="9.8" fill="#64748b" text-anchor="middle" font-weight="600">（韦伯氏器）</text>
<rect x="168" y="310" width="282" height="88" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.3"/>
<text x="180" y="334" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">视线受阻靠耳朵！骨鳔总目（占淡水鱼 ≈70%）</text>
<text x="180" y="357" font-size="9.9" fill="#1d6fa5" text-anchor="start" font-weight="500">长出 4 块“韦伯氏小骨”把鱼鳔连上内耳，</text>
<text x="180" y="380" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="500">高频听力飙至 3–5 kHz；底栖鲤/鲶多味觉触须。</text>
<rect x="458" y="310" width="286" height="88" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
<text x="470" y="334" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">开阔海域无遮挡，依赖高精度流场侧线阵列</text>
<text x="470" y="357" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="500">感知几米外鱼群尾流，配合背青腹白“反荫蔽”</text>
<text x="470" y="380" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="500">保护色，形成成千上万尾同步急转弯鱼球。</text>
<rect x="16" y="406" width="144" height="96" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="88" y="448.0" font-size="11.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">④ 鱼鳔与体型</text>
<text x="88" y="468.0" font-size="9.8" fill="#64748b" text-anchor="middle" font-weight="600">（开鳔 vs 闭鳔）</text>
<rect x="168" y="406" width="282" height="96" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.3"/>
<text x="180" y="430" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">多保留连接食道的“喉鳔管（开鳔）”：夏夜闷热</text>
<text x="180" y="453" font-size="9.9" fill="#1d6fa5" text-anchor="start" font-weight="500">缺氧时直接浮到水面吞咽空气救急（“浮头”）！</text>
<text x="180" y="476" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="500">体态偏侧扁（如鲫/鲂），擅长水草间原地急转。</text>
<rect x="458" y="406" width="286" height="96" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
<text x="470" y="430" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">多演化为封闭“闭鳔”（靠奇网分泌高压氧气）</text>
<text x="470" y="453" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="500">以适应几十米水深水压；高速巡游的鲨鱼、鲭鱼</text>
<text x="470" y="476" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="500">干脆退化掉鱼鳔，配纺锤流线身+新月尾防炸鳔！</text>
</svg>
