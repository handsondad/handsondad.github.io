<svg xmlns="http://www.w3.org/2000/svg" width="760" height="538" viewBox="0 0 760 538" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">北半球北美东亚与欧洲秋季森林太阳辐射及红叶树种比例对比与两大演化假说图解</title>
<desc id="desc">上图依据Renner与Zohner(2019)对比北美东部(9月短波辐射168 W/m²，新英格兰约70%树种产红素)、东亚(165 W/m²，同园约38%变红)与欧洲(仅114 W/m²，低32%，多云温和，仅约20%变红而以黄叶为主)；下图并列解析主流光保护护氮假说(向阳叶红、遮阴剪影与高光低温地理吻合)与汉密尔顿蚜虫诚实警戒信号假说及其视觉受体争议。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="537" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么中国香山与北美枫叶红遍漫山，欧洲秋天却满眼金黄？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上：北半球三大温带落叶林 9 月太阳辐射与红叶树种比例 · 下：演化生物学两大假说的交锋与互补</text>
<rect x="20" y="66" width="720" height="232" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="78.0" width="548" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="306.0" y="94.3" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">① 711 种落叶木本同园实验 + 卫星辐射账单 (Renner &amp; Zohner 2019, New Phytologist)</text>
<rect x="32" y="112" width="224" height="174" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
<text x="144" y="133" font-size="12.2" fill="#be123c" text-anchor="middle" font-weight="700">北美东部（美东 / 加东）</text>
<rect x="46.0" y="143" width="196" height="14" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="46.0" y="143" width="196.0" height="14" rx="4" fill="#be123c"/>
<text x="46" y="174" font-size="11.5" fill="#be123c" text-anchor="start" font-weight="700">9 月森林短波辐射：168 W/m²</text>
<text x="46" y="196" font-size="11.5" fill="#1e293b" text-anchor="start">大陆东岸：晴空强光 + 寒潮骤降</text>
<text x="46" y="218" font-size="11.5" fill="#1e293b" text-anchor="start">生长期短约 3 周，撤氮窗口极紧</text>
<rect x="42" y="232" width="204" height="44" rx="6" fill="#ffffff" stroke="#be123c" stroke-width="1.0"/>
<text x="144" y="259" font-size="11.5" fill="#be123c" text-anchor="middle" font-weight="700">红叶盛况：新英格兰约 70% 产红素!</text>
<rect x="268" y="112" width="224" height="174" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="380" y="133" font-size="12.2" fill="#c25014" text-anchor="middle" font-weight="700">东亚（中国 / 日本 / 半岛）</text>
<rect x="282.0" y="143" width="196" height="14" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="282.0" y="143" width="192.5" height="14" rx="4" fill="#c25014"/>
<text x="282" y="174" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">9 月森林短波辐射：165 W/m²</text>
<text x="282" y="196" font-size="11.5" fill="#1e293b" text-anchor="start">季风东岸：秋高气爽 + 冷空气南下</text>
<text x="282" y="218" font-size="11.5" fill="#1e293b" text-anchor="start">南北山脉护佑古老红叶树种渡过冰期</text>
<rect x="278" y="232" width="204" height="44" rx="6" fill="#ffffff" stroke="#c25014" stroke-width="1.0"/>
<text x="380" y="259" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">红叶盛况：同园约 38% 变红 (黄栌/槭)</text>
<rect x="504" y="112" width="224" height="174" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="616" y="133" font-size="12.2" fill="#b45309" text-anchor="middle" font-weight="700">欧洲西部与北部</text>
<rect x="518.0" y="143" width="196" height="14" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="518.0" y="143" width="133.0" height="14" rx="4" fill="#b45309"/>
<text x="518" y="174" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">9 月辐射：仅 114 W/m² (-32%!)</text>
<text x="518" y="196" font-size="11.5" fill="#1e293b" text-anchor="start">大西洋暖流下风向：多云阴雨温和</text>
<text x="518" y="218" font-size="11.5" fill="#1e293b" text-anchor="start">光氧化风险低 + 阿尔卑斯横山阻隔</text>
<rect x="514" y="232" width="204" height="44" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.0"/>
<text x="616" y="259" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">秋色基调：仅约 20% 变红，满城金黄</text>
<rect x="20" y="310" width="354" height="214" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<rect x="32.0" y="322.0" width="264" height="24" rx="12.0" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="164.0" y="338.3" font-size="12" fill="#18794e" text-anchor="middle" font-weight="600">② 主流机制：光保护“护氮防晒盾”假说</text>
<text x="34" y="366" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 核心逻辑：晴朗强光 + 寒潮低温 = 最凶险的光氧化组合；</text>
<text x="34" y="390" font-size="11.5" fill="#1e293b" text-anchor="start">• 树冠外层向阳叶最红、内层背阴叶偏黄，甚至两片叶上下</text>
<text x="34" y="412" font-size="11.5" fill="#1e293b" text-anchor="start">  遮挡就能晒出一枚“黄色树叶剪影”，直接证明花青素是</text>
<text x="34" y="434" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">  按光照强度现场定制的光学滤镜！</text>
<text x="34" y="460" font-size="11.5" fill="#1e293b" text-anchor="start">• 完美解释为何“强光骤冷”的美东与东亚红叶远多于西欧，</text>
<text x="34" y="482" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">  且贫瘠缺氮土壤里的枫树往往红得更早、更艳。</text>
<rect x="386" y="310" width="354" height="214" rx="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<rect x="398.0" y="322.0" width="276" height="24" rx="12.0" fill="#ffffff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="536.0" y="338.3" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="600">③ 生态争议：防蚜虫“诚实炫富信号”假说</text>
<text x="400" y="366" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 汉密尔顿与阿凯蒂 (2000–2001)：许多专食蚜虫恰在秋天</text>
<text x="400" y="390" font-size="11.5" fill="#1e293b" text-anchor="start">  飞回树上产越冬卵（次年春天孵化吸汁、传播病毒）；</text>
<text x="400" y="414" font-size="11.5" fill="#1e293b" text-anchor="start">• 花重金染红就像羚羊跳高炫耀体能：“我防御强、单宁重，</text>
<text x="400" y="436" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">  快挑泛黄弱树产卵！”（鸡爪槭实测红株蚜虫更少）</text>
<text x="400" y="462" font-size="11.5" fill="#1e293b" text-anchor="start">• 学界审慎限定：蚜虫缺专门红光视蛋白（但能辨绿/蓝比），</text>
<text x="400" y="484" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">  目前视为生理防晒主机制之外的协同演化补充假说。</text>
</svg>
