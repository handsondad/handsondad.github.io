<text x="34" y="434" font-size="11.5" fill="#1e293b" text-anchor="start">• 类胡萝卜素藏在底下被绿光淹没</text>
<text x="34" y="458" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 仅 500–570 nm 绿光被退货散射</text>
