<svg xmlns="http://www.w3.org/2000/svg" width="760" height="558" viewBox="0 0 760 558" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">叶片叶绿素类胡萝卜素与花青素活体吸收光谱及绿叶黄叶红叶减法混色原理图</title>
<desc id="desc">上图绘制400至700纳米可见光区叶绿素a+b(434与663纳米双峰实线)、类胡萝卜素(424至478纳米三指峰虚线)与活体液泡花青素(539纳米宽峰点划线)吸收光谱；下图对比盛夏绿叶反射绿光、秋季黄叶因叶绿素降解解除红光吸收后反射绿橙红混合金黄光、秋季红叶因新合成花青素额外吸收500至600纳米绿黄光而只剩纯红光散射的光学机制。</desc>
