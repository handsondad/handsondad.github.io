<text x="136" y="509" font-size="12.0" fill="#18794e" text-anchor="middle" font-weight="700">⇒ 人眼看到：满树翠绿</text>
<rect x="264" y="352" width="232" height="192" rx="9" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<circle cx="284" cy="375" r="10" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="284" y="379" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">2</text>
<text x="300" y="379" font-size="12.2" fill="#b45309" text-anchor="start" font-weight="700">银杏/白桦黄叶：做减法掀帘</text>
<text x="278" y="410" font-size="11.5" fill="#1e293b" text-anchor="start">• 叶绿素拆空，663 nm 红光禁令解除</text>
<text x="278" y="434" font-size="11.5" fill="#1e293b" text-anchor="start">• 留守类胡萝卜素只吞 400–500 蓝光</text>
<text x="278" y="458" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 520–700 nm 绿+橙+红光全数退回</text>
<rect x="276" y="478" width="208" height="52" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.0"/>
<text x="380" y="509" font-size="12.0" fill="#b45309" text-anchor="middle" font-weight="700">⇒ 视锥细胞合成：透亮金黄！</text>
<rect x="508" y="352" width="232" height="192" rx="9" fill="#fff1f2" stroke="#be123c" stroke-width="1.2"/>
<circle cx="528" cy="375" r="10" fill="#ffffff" stroke="#be123c" stroke-width="1.2"/>
<text x="528" y="379" font-size="11.5" fill="#be123c" text-anchor="middle" font-weight="700">3</text>
<text x="544" y="379" font-size="12.2" fill="#be123c" text-anchor="start" font-weight="700">枫树/黄栌红叶：做加法滤光</text>
<text x="522" y="410" font-size="11.5" fill="#1e293b" text-anchor="start">• 液泡新造花青素封死 500–600 绿窗</text>
<text x="522" y="434" font-size="11.5" fill="#1e293b" text-anchor="start">• 蓝紫光(质体)+绿黄光(液泡)全被吞</text>
<text x="522" y="458" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 仅剩 &gt;600 nm 长波红光散射出叶面</text>
<rect x="520" y="478" width="208" height="52" rx="6" fill="#ffffff" stroke="#be123c" stroke-width="1.0"/>
<text x="624" y="509" font-size="12.0" fill="#be123c" text-anchor="middle" font-weight="700">⇒ 人眼看到：炽烈丹红 / 绯红！</text>
