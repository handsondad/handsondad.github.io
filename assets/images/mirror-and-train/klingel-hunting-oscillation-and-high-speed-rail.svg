<line x1="86.0" y1="120.0" x2="301.4" y2="120.0" stroke="#c25014" stroke-width="1.8"/>
<line x1="86.0" y1="115.0" x2="86.0" y2="125.0" stroke="#c25014" stroke-width="1.8"/>
<line x1="301.4" y1="115.0" x2="301.4" y2="125.0" stroke="#c25014" stroke-width="1.8"/>
<text x="193.7" y="114" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">1:20 波长 L_K ≈ 17.2 m</text>
<text x="42" y="254" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">橙实线：普速 1:20 锥面（波长 17.2 m，直轨摆动密）</text>
<text x="406" y="254" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">蓝虚线：高铁 1:40 缓锥（波长拉长至 24.3 m，摆频降）</text>
<text x="380" y="276" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">起因：偏左 → 左轮变粗超前右拐回中线 → 回到 y=0 时车头仍斜着（ψ≠0）→ 冲过头偏右，周而复始！</text>
<rect x="20" y="304" width="352" height="218" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="316.0" width="328" height="24" rx="12.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="196.0" y="332.3" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="600">B · 高速噩梦：越过临界速度 v_crit 的蛇行失稳</text>
<text x="34" y="358" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">• 摆动频率随车速正比飙升：f_K = v / L_K</text>
<text x="34" y="382" font-size="11.5" fill="#1e293b" text-anchor="start">  若 v = 360 km/h (100 m/s) 跑在 17.2 m 波长上：</text>
<text x="34" y="404" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">  轮对每秒钟要左右狂甩近 6 个来回（f_K ≈ 5.8 Hz）！</text>
<text x="34" y="430" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="600">• 低速时：悬挂阻尼吸走能量，正弦摆动几秒就衰减归零；</text>
<text x="34" y="454" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">• 一旦车速冲破【蛇行临界速度 v_crit】：轮轨蠕滑力反过来</text>
<text x="34" y="476" font-size="11.5" fill="#1e293b" text-anchor="start">  往摆动里泵入能量，振幅失控放大，左右轮缘疯狂撞轨，</text>
<text x="34" y="498" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  几秒内即可震碎扣件甚至爬轨倾覆！</text>
<rect x="388" y="304" width="352" height="218" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="316.0" width="328" height="24" rx="12.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="564.0" y="332.3" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="600">C · 350 km/h 高铁怎样同时兼顾“过弯”与“稳跑”？</text>
<text x="402" y="358" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">① 削缓等效锥度（如 1:40 磨耗型踏面）：拉长波长 L_K，</text>
<text x="402" y="380" font-size="11.5" fill="#1e293b" text-anchor="start">   从源头把蛇行临界速度推高到 400–500 km/h 以上；</text>
<text x="402" y="406" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">② 转向架加装【抗蛇行液压减振器】：像方向盘阻尼器一样</text>
<text x="402" y="428" font-size="11.5" fill="#1e293b" text-anchor="start">   专门扼杀高频摇头（yaw），低速过弯慢转却不卡死；</text>
<text x="402" y="454" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">③ 巨型弯道半径 + 外轨超高倾斜：350 km/h 高铁最小弯道</text>
<text x="402" y="476" font-size="11.5" fill="#1e293b" text-anchor="start">   半径达 5000–7000 米，外轨垫高最多 ~175 mm 用重力</text>
<text x="402" y="498" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">   分力抵消离心力，让立起的硬币全程稳如泰山！</text>
</svg>
