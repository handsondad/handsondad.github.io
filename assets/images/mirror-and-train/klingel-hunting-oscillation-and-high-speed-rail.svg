<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">五、成也锥面、败也锥面：克林格尔正弦“蛇行运动”与 350 km/h 高铁驯兽术</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上：直轨偏心纠偏矫枉过正，实算 1:20 与 1:40 波长曲线 · 下：临界失稳速度与复兴号/新干线三大法宝</text>
<rect x="20" y="66" width="720" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
