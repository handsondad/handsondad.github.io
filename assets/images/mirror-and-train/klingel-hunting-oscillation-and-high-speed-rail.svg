<text x="380.0" y="94.3" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 克林格尔波长公式 L_K = 2π√(b₀r₀/λ)：直轨上一旦偏心，锥面自回正必然走出正弦波！</text>
