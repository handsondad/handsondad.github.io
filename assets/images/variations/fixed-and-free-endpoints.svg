<svg xmlns="http://www.w3.org/2000/svg" width="540" height="800.25" viewBox="0 0 540 800.25" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">固定终点与竖直边界上自由终点的最短路径</title><desc id="desc">上图固定两点最短线为斜率一的直线，下图末端只固定横坐标一，纵坐标可变，最短线为水平线并垂直于竖直边界。两图均等比例。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="798.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="45.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑤ 同一个内部方程，边界可以改掉答案</text><rect x="24" y="76" width="672" height="375" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="113.45" font-size="17.5" fill="#172b45" text-anchor="start">最短曲线问题：A = (0,0)，B = (1,1) 都固定。</text><text x="48" y="152.45" font-size="17.5" fill="#172b45" text-anchor="start">允许改中间，不允许把 B 挪走。</text><path d="M220.000,380.000 L420.000,180.000" fill="none" stroke="#176786" stroke-width="2.4"/><circle cx="220.000" cy="380.000" r="8" fill="#172b45"/><circle cx="420.000" cy="180.000" r="8" fill="#172b45"/><text x="182" y="408.32" font-size="19.0" fill="#172b45" text-anchor="start">A</text><text x="447" y="181.32" font-size="19.0" fill="#172b45" text-anchor="start">B</text><text x="468" y="288.45" font-size="17.5" fill="#176786" text-anchor="start">最佳：y = x</text><rect x="24" y="471" width="672" height="390" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="508.45" font-size="17.5" fill="#172b45" text-anchor="start">现在只固定终点横坐标 x = 1，纵坐标可以滑动。</text><text x="48" y="547.45" font-size="17.5" fill="#172b45" text-anchor="start">A 仍固定；同样是在找最短曲线。</text><path d="M220.000,755.000 L420.000,555.000" fill="none" stroke="#aab9c6" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M220.000,755.000 L420.000,655.000" fill="none" stroke="#aab9c6" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M420.000,555.000 L420.000,755.000" fill="none" stroke="#aab9c6" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M220.000,755.000 L420.000,755.000" fill="none" stroke="#176786" stroke-width="2.4"/><circle cx="220.000" cy="755.000" r="8" fill="#172b45"/><circle cx="420.000" cy="755.000" r="8" fill="#176786"/><path d="M450.000,622.000 L450.000,709.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="478" y="648.45" font-size="17.5" fill="#b34039" text-anchor="start">末端可以滑</text><text x="186" y="793.32" font-size="19.0" fill="#172b45" text-anchor="start">A</text><text x="428" y="793.32" font-size="19.0" fill="#172b45" text-anchor="start">C</text><text x="48" y="836.45" font-size="17.5" fill="#176786" text-anchor="start">最佳到 C：y = 0，末端与竖直边界垂直。</text><rect x="24" y="881" width="672" height="155" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="923.45" font-size="17.5" fill="#172b45" text-anchor="start">欧拉—拉格朗日方程管内部。</text><text x="48" y="973.45" font-size="17.5" fill="#172b45" text-anchor="start">边界项与端点条件，决定你到底在解哪道题。</text></g></svg>
