<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1051" viewBox="0 0 720 1051" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">空间函数变分与时间运动函数变分的同一结构</title><desc id="desc">区分形状的空间积分与动力学作用量时间积分。自由落体以向下位移为正，g九点八一，固定零与一秒端点；真实曲线为二分之一gt平方，候选加零点四sinπt。图是位移时间坐标，不是空间轨迹。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1051" fill="#f3f7fa"/><text x="36" y="48" font-size="29" fill="#172b45" text-anchor="start">⑧ 同一套变分运算，换成时间就管运动</text><rect x="24" y="76" width="672" height="245" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="117" font-size="23" fill="#172b45" text-anchor="start">形状问题：输入 y(x)，比较 J[y] = ∫F dx。</text><text x="48" y="164" font-size="23" fill="#172b45" text-anchor="start">动力学：输入 q(t)，比较 S[q] = ∫L dt。</text><text x="48" y="211" font-size="23" fill="#172b45" text-anchor="start">变的是整段函数；换的是变量和实际的评分规则。</text><text x="48" y="258" font-size="23" fill="#172b45" text-anchor="start">L = K − U，不是只比较势能 U。</text><rect x="24" y="341" width="672" height="415" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="380" font-size="23" fill="#172b45" text-anchor="start">例：向下为正的自由落体，从静止释放。</text><text x="48" y="418" font-size="23" fill="#172b45" text-anchor="start">一秒后到 q = 4.905 米；比较固定两端的候选。</text><path d="M100.000,670.000 L638.000,670.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M100.000,670.000 L100.000,437.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><text x="648" y="678" font-size="24" fill="#172b45" text-anchor="start">t</text><text x="65" y="459" font-size="24" fill="#172b45" text-anchor="start">q</text><path d="M100.000,670.000 L102.167,669.761 L104.333,669.513 L106.500,669.259 L108.667,668.997 L110.833,66