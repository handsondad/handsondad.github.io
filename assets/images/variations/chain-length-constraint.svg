<svg xmlns="http://www.w3.org/2000/svg" width="720" height="903" viewBox="0 0 720 903" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">悬链线势能比较必须保持链长不变</title><desc id="desc">支点横距两米、总长二点三五零四零二米。直线长两米，构造的更深抛物线长二点九五七八八六米，都不满足固定链长。蓝线为a等于一米的悬链线；纵横缩放比为250比260。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="903" fill="#f3f7fa"/><text x="36" y="48" font-size="29" fill="#172b45" text-anchor="start">⑦ 链子不能一边比较，一边偷偷变长</text><rect x="24" y="76" width="672" height="530" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="116" font-size="23" fill="#172b45" text-anchor="start">固定两端 x = ±1 米，支点等高；均匀柔链。</text><text x="48" y="154" font-size="23" fill="#172b45" text-anchor="start">固定总长 2.350402 米，只受自身重力。</text><path d="M100.000,229.230 L102.167,229.230 L104.333,229.230 L106.500,229.230 L108.667,229.230 L110.833,229.230 L113.000,229.230 L115.167,229.230 L117.333,229.230 L119.500,229.230 L121.667,229.230 L123.833,229.230 L126.000,229.230 L128.167,229.230 L130.333,229.230 L132.500,229.230 L134.667,229.230 L136.833,229.230 L139.000,229.230 L141.167,229.230 L143.333,229.230 L145.500,229.230 L147.667,229.230 L149.833,229.230 L152.000,229.230 L154.167,229.230 L156.333,229.230 L158.500,229.230 L160.667,229.230 L162.833,229.230 L165.000,229.230 L167.167,229.230 L169.333,229.230 L171.500,229.230 L173.667,229.230 L175.833,229.230 L178.000,229.230 L180.167,229.230 L182.333,229.230 L184.500,229.230 L186.667,229.230 L188.833,229.230 L191.000,229.230 L193.167,229.230 L195.333,229.230 L197.500,229.230 L199.667,229.230 L201.833,229.230 L204.000,229.230 L206.167,229.230 L208.333,229.230 L210.500,229.230 L212.667,229.230 L214.833,229.230 L217.000,229.230 L219.167,229.230 L221.333,229.230 L223.500,229.230 L225.667,229.230 L227.833,229.