<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1127" viewBox="0 0 720 1127" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">变动折射交点得到斯涅尔定律</title><desc id="desc">均匀非色散介质折射率一和一点五，固定两端距界面一米。最短时间交点约零点六二三二；金虚线为交点零点五的几何最短直线，用时却更多。蓝线角度验证斯涅尔定律，灰线为零交点候选；三线不是同时存在的折射光线。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1127" fill="#f3f7fa"/><text x="36" y="48" font-size="29" fill="#172b45" text-anchor="start">⑥ 光为什么在界面处拐弯？</text><rect x="24" y="76" width="672" height="760" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="116" font-size="23" fill="#172b45" text-anchor="start">A = (0,1) 米，B = (1,−1) 米；界面在 y = 0</text><text x="48" y="155" font-size="23" fill="#172b45" text-anchor="start">理想均匀、无色散介质；图中横纵等比例。</text><rect x="26" y="175" width="668" height="295" fill="#edf5f9"/><rect x="26" y="470" width="668" height="290" fill="#fff6e6"/><path d="M180.000,230.000 L180.000,470.000 L420.000,710.000" fill="none" stroke="#a4b5c3" stroke-width="2" stroke-dasharray="8 6"/><path d="M180.000,230.000 L420.000,710.000" fill="none" stroke="#b77a09" stroke-width="2" stroke-dasharray="8 6"/><path d="M48.000,470.000 L672.000,470.000" fill="none" stroke="#172b45" stroke-width="3"/><path d="M329.568,262.000 L329.568,690.000" fill="none" stroke="#869aaa" stroke-width="3" stroke-dasharray="7 6"/><path d="M180.000,230.000 L329.568,470.000 L420.000,710.000" fill="none" stroke="#176786" stroke-width="4"/><circle cx="180.000" cy="230.000" r="8" fill="#176786"/><circle cx="420.000" cy="710.000" r="8" fill="#176786"/><circle cx="329.568" cy="470.000" r="8" fill="#176786"/><text x="142" y="225" font-size="25" fill="#172b45" text-anchor="start">A</text><text x="445" y="719" font-size="25" fill="#172b45" text-anchor="start">B</