<svg xmlns="http://www.w3.org/2000/svg" width="760" height="568" viewBox="0 0 760 568" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">FSD v15算力开销延迟与跨形态复用边界图</title>
<desc id="desc">左栏三个大数字三十亿加十亿参数半个TRIP加速器与二百二十毫秒延迟，右栏画UVE通用视觉编码器连到FSD汽车Robotaxi与Optimus三种机器并列出复用互联网视频训练的好处与机器人需重采样生成画面会幻觉的边界，底栏总结重建世界足够便宜能上车也足够危险不能全信。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="567" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">半个 TRIP 加速器、220 毫秒延迟：实时造世界的代价与边界</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">FSD 与 Robotaxi、Optimus 共用 UVE，同一套视觉底座服务三种形态。</text>
<rect x="20" y="66" width="352" height="434" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="89" r="10.5" fill="#fdf1d8" stroke="#b45309" stroke-width="1.2"/>
<text x="38" y="93" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">三个关键数字</text>
<rect x="38" y="120" width="316" height="94" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="196" y="164" font-size="22" fill="#1d6fa5" text-anchor="middle" font-weight="700">3B + 1B</text>
<text x="196" y="194" font-size="10.5" fill="#1e293b" text-anchor="middle">驾驶网络 30 亿参数，生成网络 10 亿</text>
<rect x="38" y="228" width="316" height="94" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="196" y="272" font-size="22" fill="#b45309" text-anchor="middle" font-weight="700">½ TRIP</text>
<text x="196" y="302" font-size="10.5" fill="#1e293b" text-anchor="middle">生成分支只占 SoC 上半个加速器</text>
<rect x="38" y="336" width="316" height="94" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="196" y="380" font-size="22" fill="#be123c" text-anchor="middle" font-weight="700">220 ms</text>
<text x="196" y="410" font-size="10.5" fill="#1e293b" text-anchor="middle">画面约比真实世界晚 0.22 秒</text>
<rect x="388" y="66" width="352" height="434" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="89" r="10.5" fill="#e6f5f2" stroke="#0f766e" stroke-width="1.2"/>
<text x="406" y="93" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">一套视觉底座，三种机器</text>
<rect x="470" y="124" width="188" height="40" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="564" y="150" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">UVE 通用视觉编码器</text>
<line x1="564.0" y1="164.0" x2="422.0" y2="200.0" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round"/>
<rect x="402" y="200" width="104" height="60" rx="8" fill="#f1f5f9" stroke="#18794e" stroke-width="1.4"/>
<text x="454" y="224" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="700">FSD</text>
<text x="454" y="244" font-size="10.5" fill="#1e293b" text-anchor="middle">汽车驾驶</text>
<line x1="564.0" y1="164.0" x2="538.0" y2="200.0" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round"/>
<rect x="518" y="200" width="104" height="60" rx="8" fill="#f1f5f9" stroke="#c25014" stroke-width="1.4"/>
<text x="570" y="224" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">Robotaxi</text>
<text x="570" y="244" font-size="10.5" fill="#1e293b" text-anchor="middle">无人驾驶出租</text>
<line x1="564.0" y1="164.0" x2="654.0" y2="200.0" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round"/>
<rect x="634" y="200" width="104" height="60" rx="8" fill="#f1f5f9" stroke="#6d28d9" stroke-width="1.4"/>
<text x="686" y="224" font-size="10.5" fill="#6d28d9" text-anchor="middle" font-weight="700">Optimus</text>
<text x="686" y="244" font-size="10.5" fill="#1e293b" text-anchor="middle">人形机器人</text>
<line x1="406.0" y1="282.0" x2="724.0" y2="282.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="406" y="312" font-size="11.2" fill="#0f766e" text-anchor="start" font-weight="700">复用带来什么</text>
<text x="406" y="344" font-size="10.5" fill="#1e293b" text-anchor="start">• 互联网视频训练，覆盖未专门标注的长尾物体</text>
<text x="406" y="374" font-size="10.5" fill="#1e293b" text-anchor="start">• 一个模型升级，多个形态受益</text>
<text x="406" y="410" font-size="11.2" fill="#be123c" text-anchor="start" font-weight="700">绕不开什么</text>
<text x="406" y="442" font-size="10.5" fill="#1e293b" text-anchor="start">• 机器人进室内仍要重新采样数据</text>
<text x="406" y="472" font-size="10.5" fill="#1e293b" text-anchor="start">• 生成画面会“幻觉”，不能当传感器真值</text>
<rect x="20" y="514" width="720" height="40" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="540" font-size="10.5" fill="#475569" text-anchor="start">v15 把“重建世界”变成一项车端实时服务：它足够便宜能上车，也足够危险不能全信——理解这条边界，才算真懂这次更新。</text>
</svg>
