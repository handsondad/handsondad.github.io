<text x="424" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">产品与交互新功能</text>
<rect x="406" y="120" width="316" height="60" rx="7" fill="#f1f5f9" stroke="#e2e8f0"/>
<circle cx="424" cy="150" r="7" fill="#6d28d9"/>
