<rect x="0.5" y="0.5" width="759" height="567" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">FSD v15 到底更新了什么：视觉编码器升级＋Reality View＋一堆长尾场景</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">2026 年 11 月 21 日在北美向 HW4 早期体验用户推送，12 月预计扩大范围。</text>
