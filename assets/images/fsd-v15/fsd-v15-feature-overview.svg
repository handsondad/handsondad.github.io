<text x="440" y="306" font-size="10.5" fill="#1e293b" text-anchor="start">测速摄像头前自动减速</text>
<rect x="406" y="330" width="316" height="60" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<circle cx="424" cy="360" r="7" fill="#1d6fa5"/>
<text x="440" y="356" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">驾驶员监控优化</text>
<text x="440" y="376" font-size="10.5" fill="#1e293b" text-anchor="start">戴帽子墨镜也能判断注意力</text>
<rect x="406" y="400" width="316" height="60" rx="7" fill="#f1f5f9" stroke="#e2e8f0"/>
<circle cx="424" cy="430" r="7" fill="#b45309"/>
<text x="440" y="426" font-size="10.5" fill="#b45309" text-anchor="start" font-weight="700">自行车架模式</text>
<text x="440" y="446" font-size="10.5" fill="#1e293b" text-anchor="start">识别拖挂配件后调整感知边界</text>
<rect x="20" y="514" width="720" height="40" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="540" font-size="10.5" fill="#475569" text-anchor="start">一句话抓住主线：v15 的最大变化不是“会更开”，而是把世界模型塞进车机，让屏幕画面与驾驶决策同源。</text>
