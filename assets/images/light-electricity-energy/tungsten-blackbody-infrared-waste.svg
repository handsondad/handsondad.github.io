<svg xmlns="http://www.w3.org/2000/svg" width="760" height="494" viewBox="0 0 760 494" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">2800K钨丝白炽灯普朗克黑体光谱红外浪费与60瓦能量流向图解</title>
<desc id="desc">左栏按普朗克定律精确绘制2800K钨丝光谱（峰值约1035纳米深陷红外区）与380至750纳米可见光窗口对比；右栏展示60瓦白炽灯仅约5%电能化为可见光、其余约95%化为红外辐射与传导废热。</desc>
