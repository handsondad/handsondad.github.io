<text x="181.3" y="174.0" font-size="9.5" fill="#dc2626" text-anchor="start" font-weight="700">2800 K 钨丝峰值 λ_max ≈ 1035 nm (近红外！)</text>
<text x="162" y="266" font-size="9.3" fill="#1d6fa5" text-anchor="start" font-weight="700">5778 K 太阳光谱参考</text>
<line x1="66.0" y1="326.0" x2="426.0" y2="326.0" stroke="#0f172a" stroke-width="1.4"/>
<line x1="66.0" y1="326.0" x2="66.0" y2="134.0" stroke="#0f172a" stroke-width="1.4"/>
<line x1="89.1" y1="326.0" x2="89.1" y2="330.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="89.1" y="342.0" font-size="9.0" fill="#64748b" text-anchor="middle">380nm</text>
<line x1="136.7" y1="326.0" x2="136.7" y2="330.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="136.7" y="342.0" font-size="9.0" fill="#64748b" text-anchor="middle">750nm</text>
<line x1="233.1" y1="326.0" x2="233.1" y2="330.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="233.1" y="342.0" font-size="9.0" fill="#64748b" text-anchor="middle">1500nm</text>
<line x1="361.7" y1="326.0" x2="361.7" y2="330.0" stroke="#0f172a" stroke-width="1.2"/>
<text x="361.7" y="342.0" font-size="9.0" fill="#64748b" text-anchor="middle">2500nm</text>
<rect x="36" y="356" width="400" height="104" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="48" y="376" font-size="9.8" fill="#c25014" text-anchor="start" font-weight="700">🌡️ 维恩位移定律死穴（λ_max = b / T）：为什么不能把钨丝烧到 5800 K？</text>
<text x="48" y="395" font-size="9.5" fill="#1e293b" text-anchor="start">• 想让热辐射峰值挪进可见光正中央（像太阳表面 5778 K 那样），灯丝得耐受近</text>
<text x="48" y="412" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="700">  6000 K 高温！可全周期表最耐烧金属【钨 (W)】熔点也只有 3695 K (3422°C)！</text>
<text x="48" y="430" font-size="9.5" fill="#1e293b" text-anchor="start">• 为防钨丝几分钟升华烧断，只能压在 ~2800 K 工作（充氩氮或卤素循环），</text>
<text x="48" y="447" font-size="9.5" fill="#dc2626" text-anchor="start" font-weight="700">  结果 60 W 灯泡 = 57 W 暖气 + 3 W 照明，光效仅 12–16 lm/W，寿命 1000 h！</text>
<rect x="468" y="68" width="272" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="484.0" y="82.0" width="216" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="592.0" y="97.0" font-size="11.0" fill="#dc2626" text-anchor="middle" font-weight="600">60 W 白炽灯能量去向拆解</text>
<rect x="504" y="128" width="56" height="12" rx="2" fill="#facc15" stroke="#d97706"/>
<rect x="504" y="140" width="56" height="164" fill="#dc2626" opacity="0.85"/>
<rect x="504" y="304" width="56" height="24" rx="2" fill="#475569"/>
<text x="572" y="138" font-size="10.2" fill="#d97706" text-anchor="start" font-weight="700">仅 ~5% 可见光 (~3 W)</text>
<text x="572" y="222" font-size="10.2" fill="#dc2626" text-anchor="start" font-weight="700">~83% 红外热辐射</text>
<text x="572" y="240" font-size="9.5" fill="#64748b" text-anchor="start">(烤手烫脸的主力)</text>
<text x="572" y="320" font-size="9.8" fill="#475569" text-anchor="start" font-weight="700">~12% 玻壳传导热</text>
<rect x="484" y="348" width="240" height="112" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="496" y="368" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">🌀 双螺旋钨丝的精巧挣扎：</text>
<text x="496" y="387" font-size="9.7" fill="#1e293b" text-anchor="start">• 把半米多长的极细钨丝绕成“螺旋</text>
<text x="496" y="404" font-size="9.7" fill="#1e293b" text-anchor="start">  之螺旋”，减少惰性气体带走热量；</text>
<text x="496" y="421" font-size="9.7" fill="#1e293b" text-anchor="start">• 关灯开灯瞬间冷态电阻仅热态 1/10，</text>
<text x="496" y="438" font-size="9.7" fill="#dc2626" text-anchor="start" font-weight="700">  10 倍浪涌电流最易把变细处烧断！</text>
</svg>
