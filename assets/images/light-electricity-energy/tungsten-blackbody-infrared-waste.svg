<rect x="0.5" y="0.5" width="759" height="493" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">第一代电灯（白炽灯）：为什么爱迪生和钨丝灯把 95% 的电全烧成了暖气？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">靠“硬把金属烧烫发光”的黑体辐射死胡同：2800 K 钨丝的辐射洪峰全砸在肉眼看不见的红外线里！</text>
<rect x="20" y="68" width="432" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
