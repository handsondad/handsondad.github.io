<text x="112.9" y="160.0" font-size="8.8" fill="#64748b" text-anchor="middle">380–750 nm</text>
<rect x="136.7" y="134.0" width="289.3" height="192.0" fill="#fef2f2" opacity="0.55"/>
<text x="281.4" y="154.0" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">看不见的红外热辐射海洋 (~94%–95% 能量白白变热！)</text>
