<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">投影打破中点等分与平行铁轨交于无穷远点</title>
<desc id="desc">左图演示光源O将水平尺上的等分点AM=MB投影到斜面上后A&#x27;M&#x27;与M&#x27;B&#x27;不再相等；右图演示平行铁轨与等距枕木在透视投影下汇聚于地平线上的无穷远点P∞。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="339" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">手电筒照下去，欧氏几何坏了哪两条？中点不再居中，平行线交于一点</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">中心投影下，不仅线段长度改变，连“两段之比 1:1”都保不住；而地面平行线会在画布地平线上交于“无穷远点”。</text>
<rect x="20" y="62" width="348" height="262" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">① 尺子正中点 M，投成影子后偏心了！</text>
<line x1="82" y1="154" x2="226" y2="154" stroke="#1d6fa5" stroke-width="2.0"/>
<line x1="48.0" y1="214.0" x2="336.0" y2="276.0" stroke="#0f172a" stroke-width="2.0"/>
<line x1="142.0" y1="96.0" x2="70.0" y2="218.7" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="108.0" cy="154.0" r="4" fill="#1d6fa5"/>
<circle cx="70.0" cy="218.7" r="4" fill="#1d6fa5"/>
<text x="111.0" y="146.0" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">A</text>
<text x="68.0" y="234.7" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">A&#x27;</text>
<line x1="142.0" y1="96.0" x2="169.3" y2="240.1" stroke="#c25014" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="153.0" cy="154.0" r="4" fill="#c25014"/>
<circle cx="169.3" cy="240.1" r="4" fill="#c25014"/>
<text x="156.0" y="146.0" font-size="12" fill="#c25014" text-anchor="start" font-weight="700" class="halo">M</text>
<text x="167.3" y="256.1" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">M&#x27;</text>
<line x1="142.0" y1="96.0" x2="310.5" y2="270.5" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="198.0" cy="154.0" r="4" fill="#1d6fa5"/>
<circle cx="310.5" cy="270.5" r="4" fill="#1d6fa5"/>
<text x="201.0" y="146.0" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">B</text>
<text x="308.5" y="286.5" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">B&#x27;</text>
<circle cx="142.0" cy="96.0" r="5" fill="#c25014"/>
<text x="152.0" y="100.0" font-size="12" fill="#c25014" text-anchor="start" font-weight="600">光源 O</text>
<text x="130" y="148" font-size="11" fill="#1d6fa5" text-anchor="middle" class="halo">45</text>
<text x="175" y="148" font-size="11" fill="#1d6fa5" text-anchor="middle" class="halo">45</text>
<text x="36" y="310" font-size="11.3" fill="#64748b" text-anchor="start">原尺 AM : MB = 1 : 1；斜影 A&#x27;M&#x27; : M&#x27;B&#x27; ≈ 1 : 1.42（不再等分）</text>
<rect x="382" y="62" width="358" height="262" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="398" y="84" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">② 平行铁轨的归宿：添上“无穷远点” P∞</text>
<line x1="404" y1="134" x2="720" y2="134" stroke="#1d6fa5" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="718" y="150" font-size="10.8" fill="#1d6fa5" text-anchor="end">地平线（无穷远直线）</text>
<line x1="434" y1="274" x2="562" y2="134" stroke="#0f172a" stroke-width="2.2"/>
<line x1="690" y1="274" x2="562" y2="134" stroke="#0f172a" stroke-width="2.2"/>
<line x1="434.0" y1="274.0" x2="690.0" y2="274.0" stroke="#64748b" stroke-width="1.4"/>
<line x1="484.4" y1="218.8" x2="639.6" y2="218.8" stroke="#64748b" stroke-width="1.4"/>
<line x1="506.3" y1="194.9" x2="617.7" y2="194.9" stroke="#64748b" stroke-width="1.4"/>
<line x1="518.6" y1="181.5" x2="605.4" y2="181.5" stroke="#64748b" stroke-width="1.4"/>
<line x1="526.4" y1="172.9" x2="597.6" y2="172.9" stroke="#64748b" stroke-width="1.4"/>
<line x1="531.9" y1="166.9" x2="592.1" y2="166.9" stroke="#64748b" stroke-width="1.4"/>
<circle cx="562" cy="134" r="5.5" fill="#c25014"/>
<text x="562" y="123" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">P∞（无穷远交点）</text>
<text x="398" y="294" font-size="11.3" fill="#1e293b" text-anchor="start">• 欧氏几何里得加备注：“两直线相交，平行除外”</text>
<text x="398" y="312" font-size="11.3" fill="#18794e" text-anchor="start" font-weight="600">• 射影平面补上 P∞ 后：任何两条不同直线都必交于唯一一点！</text>
</svg>
