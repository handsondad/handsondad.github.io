<svg xmlns="http://www.w3.org/2000/svg" width="760" height="596" viewBox="0 0 760 596" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">腰果工业化加工去毒流程与腰果壳油回收利用图</title>
<desc id="desc">顶部五步流程从带壳果经蒸汽烘烤壳裂油出机械剥壳到分级包装，说明高温使腰果酸脱羧毒油流出回收且所谓生腰果只是未调味；左下讲回收腰果壳油用作刹车片树脂涂料与药物中间体，右下讲家里剥生腰果会导致皮肤水疱口腔灼伤与眼睛刺激且乳胶手套无效。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="595" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">货架上的“生腰果”其实都熟过：一道高温工序把毒油逼出来</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">蒸或烤 → 壳脆油出 → 剥壳 → 分级，毒性就此归零。</text>
<rect x="20" y="66" width="720" height="220" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="89" r="10.5" fill="#fdf1d8" stroke="#b45309" stroke-width="1.2"/>
<text x="38" y="93" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">带壳腰果的工业化流程</text>
<rect x="36" y="132" width="124" height="88" rx="8" fill="#f1f5f9" stroke="#be123c" stroke-width="1.4"/>
<text x="98" y="162" font-size="10.8" fill="#be123c" text-anchor="middle" font-weight="700">带壳果</text>
<text x="98" y="188" font-size="10.5" fill="#1e293b" text-anchor="middle">毒油满壳</text>
<path d="M162 176 L208 176" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr-blue)"/>
<rect x="176" y="132" width="124" height="88" rx="8" fill="#f1f5f9" stroke="#b45309" stroke-width="1.4"/>
<text x="238" y="162" font-size="10.8" fill="#b45309" text-anchor="middle" font-weight="700">蒸汽/烘烤</text>
<text x="238" y="188" font-size="10.5" fill="#1e293b" text-anchor="middle">高温脱毒</text>
<path d="M302 176 L348 176" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr-blue)"/>
<rect x="316" y="132" width="124" height="88" rx="8" fill="#f1f5f9" stroke="#c25014" stroke-width="1.4"/>
<text x="378" y="162" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700">壳裂油出</text>
<text x="378" y="188" font-size="10.5" fill="#1e293b" text-anchor="middle">CNSL 回收</text>
<path d="M442 176 L488 176" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr-blue)"/>
<rect x="456" y="132" width="124" height="88" rx="8" fill="#f1f5f9" stroke="#18794e" stroke-width="1.4"/>
<text x="518" y="162" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="700">机械剥壳</text>
<text x="518" y="188" font-size="10.5" fill="#1e293b" text-anchor="middle">果仁分离</text>
<path d="M582 176 L628 176" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr-blue)"/>
<rect x="596" y="132" width="124" height="88" rx="8" fill="#f1f5f9" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="658" y="162" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">分级包装</text>
<text x="658" y="188" font-size="10.5" fill="#1e293b" text-anchor="middle">出口上市</text>
<text x="36" y="248" font-size="10.5" fill="#475569" text-anchor="start">关键就在第二步：高温让壳中油囊破裂、腰果酸脱羧，毒油流出被回收。</text>
<text x="36" y="274" font-size="10.5" fill="#be123c" text-anchor="start" font-weight="600">所以“raw cashew（生腰果）”只是“未调味”的营销叫法，不是真的生。</text>
<rect x="20" y="302" width="352" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="325" r="10.5" fill="#e6f5f2" stroke="#0f766e" stroke-width="1.2"/>
<text x="38" y="329" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">2</text>
<text x="56" y="329" font-size="11.6" fill="#0f172a" text-anchor="start" font-weight="700">毒油变宝贝</text>
<text x="38" y="362" font-size="10.5" fill="#1e293b" text-anchor="start">回收的 CNSL 是贵重工业原料：</text>
<text x="38" y="392" font-size="10.5" fill="#0f766e" text-anchor="start">• 刹车片、离合器摩擦材料</text>
<text x="38" y="420" font-size="10.5" fill="#0f766e" text-anchor="start">• 酚醛树脂、涂料、绝缘材料</text>
<text x="38" y="448" font-size="10.5" fill="#0f766e" text-anchor="start">• 抗菌活性研究、药物中间体</text>
<text x="38" y="484" font-size="10.5" fill="#475569" text-anchor="start">脱羧后的腰果酚毒性大减。</text>
<rect x="388" y="302" width="352" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="325" r="10.5" fill="#ffe9ee" stroke="#be123c" stroke-width="1.2"/>
<text x="406" y="329" font-size="11.5" fill="#be123c" text-anchor="middle" font-weight="700">3</text>
<text x="424" y="329" font-size="11.6" fill="#0f172a" text-anchor="start" font-weight="700">别在家里剥生腰果</text>
<text x="406" y="362" font-size="10.5" fill="#1e293b" text-anchor="start">树上现摘的带壳腰果会渗毒油：</text>
<text x="406" y="392" font-size="10.5" fill="#be123c" text-anchor="start">• 皮肤灼痛、红疹、水疱</text>
<text x="406" y="420" font-size="10.5" fill="#be123c" text-anchor="start">• 沾到果仁再入口，口腔灼伤</text>
<text x="406" y="448" font-size="10.5" fill="#be123c" text-anchor="start">• 溅入眼睛需立刻大量冲洗就医</text>
<text x="406" y="484" font-size="10.5" fill="#475569" text-anchor="start" font-weight="600">戴手套也没用：酚类能穿透乳胶。</text>
<rect x="20" y="542" width="720" height="40" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="568" font-size="10.5" fill="#475569" text-anchor="start">产业链的聪明之处：把同一份“毒”从食品里分离出去，变成工业的“宝”。</text>
</svg>
