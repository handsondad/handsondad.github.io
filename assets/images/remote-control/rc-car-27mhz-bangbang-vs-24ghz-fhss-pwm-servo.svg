  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="523" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">遥控玩具车两代革命：为什么老玩具拖着长铁杆还爱“串车”，新遥控车能丝滑拐弯？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">从 27 MHz 四分之一波长长天线“左打死/右打死”，升级到 2.4 GHz 藏身短天线跳频与 50 Hz 比例舵机</text>
<rect x="20" y="68" width="352" height="436" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="80.0" width="324" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="194.0" y="95.0" font-size="11.0" fill="#c25014" text-anchor="middle" font-weight="600">A. 天线长短与撞频之谜：27 MHz 老玩具 vs 2.4 GHz 跳频</text>
<rect x="34" y="114" width="324" height="174" rx="8" fill="#fffaf5" stroke="#c25014" stroke-width="1.2"/>
<text x="46" y="136" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">① 童年 27 / 49 MHz 玩具车（TX-2B 开关式）</text>
<text x="46" y="158" font-size="10.2" fill="#1e293b" text-anchor="start">• 为什么非拖一根半米长铁拉杆？电磁波波长 λ = c / f ≈ 11.1 米！</text>
<text x="46" y="178" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">  1/4 波长谐振要 2.76 米，哪怕底部绕电感缩短也得伸出长铁杆。</text>
<text x="46" y="200" font-size="10.2" fill="#1e293b" text-anchor="start">• 为什么小区两辆车一碰面就“抢方向盘”？固定死守单一频点，</text>
<text x="46" y="220" font-size="10.2" fill="#1e293b" text-anchor="start">  谁信号强听谁的！且电机只有“全通电打死 / 断电回弹”两档，</text>
<text x="46" y="240" font-size="10.2" fill="#dc2626" text-anchor="start" font-weight="700">  没法走微弧线，一拐弯就猛甩头（Bang-Bang 开关控制）。</text>
<rect x="34" y="302" width="324" height="186" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="46" y="324" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="700">② 现代 2.4 GHz 遥控车 / 无人机（FHSS 跳频扩频）</text>
<text x="46" y="346" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">• 天线去哪了？2.4 GHz 波长仅 12.5 cm → 1/4 波长仅 3.1 厘米！</text>
<text x="46" y="366" font-size="10.2" fill="#1e293b" text-anchor="start">  比火柴棍还短，直接藏进车壳与手柄塑料里，再也不戳眼睛。</text>
<text x="46" y="388" font-size="10.2" fill="#1e293b" text-anchor="start">• 50 辆车同场飙车为何零干扰？对频绑定 32/48 位唯一身份证，</text>
<text x="46" y="408" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700">  并在 2400~2483.5 MHz 几十个信道间每秒按暗号狂跳上百次！</text>
<rect x="48" y="424" width="25" height="13" rx="2" fill="#1d6fa5" stroke="#1d6fa5" stroke-width="0.8"/>
<rect x="48" y="440" width="25" height="13" rx="2" fill="#ffffff" stroke="#1d6fa5" stroke-width="0.8"/>
<rect x="48" y="456" width="25" height="13" rx="2" fill="#ffffff" stroke="#1d6fa5" stroke-width="0.8"/>
