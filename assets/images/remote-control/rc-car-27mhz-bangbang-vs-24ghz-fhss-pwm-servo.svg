<rect x="309" y="456" width="25" height="13" rx="2" fill="#1d6fa5" stroke="#1d6fa5" stroke-width="0.8"/>
<text x="196" y="480" font-size="9.4" fill="#64748b" text-anchor="middle">↑ FHSS 时间—频率跳频示意：同场撞上一格也会在毫秒内跳开</text>
<rect x="388" y="68" width="352" height="436" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="80.0" width="328" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="564.0" y="95.0" font-size="11.0" fill="#0f766e" text-anchor="middle" font-weight="600">B. 丝滑转向与油门的秘密：50 Hz (20 ms) 比例 PWM 脉宽</text>
<rect x="402" y="114" width="324" height="232" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="564" y="136" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">每 20 毫秒（50 Hz）发一帧，高电平宽度精准决定轮胎角度！</text>
<text x="414" y="156" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700">1.0 ms 窄脉冲 → 舵机左打满 (0°) / 电调怠速</text>
<polyline points="414,192 424,192 424,168 452,168 452,192 674,192" fill="none" stroke="#1d6fa5" stroke-width="2.1"/>
<text x="686" y="184" font-size="8.8" fill="#64748b" text-anchor="start">20ms周期</text>
<text x="414" y="220" font-size="9.8" fill="#0f766e" text-anchor="start" font-weight="700">1.5 ms 中位脉冲 → 轮胎精准回正 (90° 中立点)</text>
<polyline points="414,256 424,256 424,232 466,232 466,256 674,256" fill="none" stroke="#0f766e" stroke-width="2.1"/>
<text x="686" y="248" font-size="8.8" fill="#64748b" text-anchor="start">20ms周期</text>
<text x="414" y="284" font-size="9.8" fill="#dc2626" text-anchor="start" font-weight="700">2.0 ms 宽脉冲 → 舵机右打满 (180°) / 全油门狂飙</text>
<polyline points="414,320 424,320 424,296 480,296 480,320 674,320" fill="none" stroke="#dc2626" stroke-width="2.1"/>
<text x="686" y="312" font-size="8.8" fill="#64748b" text-anchor="start">20ms周期</text>
<text x="564" y="336" font-size="9.2" fill="#64748b" text-anchor="middle">（注：为清晰展示脉宽差异，高电平宽度作了横向放大示意）</text>
<rect x="402" y="358" width="324" height="130" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.1"/>
<text x="414" y="380" font-size="10.6" fill="#0f766e" text-anchor="start" font-weight="700">舵机（Servo）凭什么拧多少方向盘，前轮就停在几度？</text>
<text x="414" y="404" font-size="10.2" fill="#1e293b" text-anchor="start">• 方向盘连着电位器/霍尔传感器，转至 45° 就发出 1.25 ms 脉宽；</text>
<text x="414" y="426" font-size="10.2" fill="#1e293b" text-anchor="start">• 车头舵机肚子里也藏着一颗同轴角度电位器，实时对比“目标脉</text>
<text x="414" y="448" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">  宽 vs 当前转角”：差一点就驱动电机转，转到位立刻刹车锁死！</text>
<text x="414" y="470" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="700">• 油门扳机同理，通过电调（ESC）高频斩波平滑调节车速快慢。</text>
</svg>
