<svg xmlns="http://www.w3.org/2000/svg" width="760" height="546" viewBox="0 0 760 546" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">莱文塔尔折叠悖论与自由能折叠漏斗、分子伴侣及信号肽粗面内质网高尔基体分拣加工图解</title>
<desc id="desc">左图算清100氨基酸蛋白3^198≈3×10^94种构象盲试需约9×10^73年的莱文塔尔悖论，展示疏水塌缩沿自由能漏斗毫秒级滑入唯一天然活性态、分子伴侣隔离防聚集及2024年诺贝尔化学奖AI结构预测；右图解析游离核糖体胞内路线与1999年诺奖信号肽-SRP引导粗面内质网跨膜、二硫键折叠、高尔基体糖基化分拣及胰岛素原切除C肽激活全流程。</desc>
