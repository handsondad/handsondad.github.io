<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">从虚拟到现实再回到虚拟：三维物理建模的工程闭环</title>
<desc id="desc">五个步骤依次是CAD造型、CAE仿真、制造或施工、真实物体、数字孪生；最后一步通过传感器实时数据把真实状态送回模型，形成闭环。静态3D模型、仿真与数字孪生三者定义不同；流程为教学示意，真实工程常反复迭代。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#6d28d9"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="299" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 5 · 从屏幕到现实，再回到屏幕：一个不断被修正的闭环</text>
<rect x="16" y="52" width="132" height="92" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="82.0" y="76" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">① CAD 造型</text>
<text x="82.0" y="98" font-size="11.5" fill="#1e293b" text-anchor="middle">点线面 → 实体</text>
<text x="82.0" y="118" font-size="11.5" fill="#64748b" text-anchor="middle">回答「长什么样」</text>
<rect x="164" y="52" width="132" height="92" rx="10" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="230.0" y="76" font-size="12.5" fill="#c25014" text-anchor="middle" font-weight="700">② CAE 仿真</text>
<text x="230.0" y="98" font-size="11.5" fill="#1e293b" text-anchor="middle">受力·流动·传热</text>
<text x="230.0" y="118" font-size="11.5" fill="#64748b" text-anchor="middle">回答「会怎样」</text>
<rect x="312" y="52" width="132" height="92" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="378.0" y="76" font-size="12.5" fill="#18794e" text-anchor="middle" font-weight="700">③ 制造 / 施工</text>
<text x="378.0" y="98" font-size="11.5" fill="#1e293b" text-anchor="middle">CNC·3D打印·BIM</text>
<text x="378.0" y="118" font-size="11.5" fill="#64748b" text-anchor="middle">把数字变成实物</text>
<rect x="460" y="52" width="132" height="92" rx="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="526.0" y="76" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="700">④ 真实物体</text>
<text x="526.0" y="98" font-size="11.5" fill="#1e293b" text-anchor="middle">桥·机器·零件</text>
<text x="526.0" y="118" font-size="11.5" fill="#64748b" text-anchor="middle">接受现实检验</text>
<rect x="608" y="52" width="136" height="92" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="676.0" y="76" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">⑤ 数字孪生</text>
<text x="676.0" y="98" font-size="11.5" fill="#1e293b" text-anchor="middle">传感器实时回流</text>
<text x="676.0" y="118" font-size="11.5" fill="#64748b" text-anchor="middle">回答「此刻如何」</text>
<path d="M150 98 L162 98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<path d="M298 98 L310 98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<path d="M446 98 L458 98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<path d="M594 98 L606 98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<path d="M676 146 L676 190 Q676 202 664 202 L244 202 Q230 202 230 188 L230 148" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-purple)"/>
<rect x="348" y="188" width="208" height="28" rx="14" fill="#fbfcfd"/>
<text x="452" y="207" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">← 实测数据回流修正模型</text>
<text x="16" y="246" font-size="11.5" fill="#1e293b" text-anchor="start">静态 3D 模型只描述外观；仿真预测「如果这样会怎样」；数字孪生再接上实时数据，</text>
<text x="16" y="266" font-size="11.5" fill="#1e293b" text-anchor="start">让虚拟副本跟着真实物体一起呼吸——三者不是一回事（定义依据见文末 IBM 资料）。</text>
<text x="16" y="288" font-size="11.5" fill="#64748b" text-anchor="start">注：图中为教学示意，流程顺序在真实工程中常反复迭代，并非严格一次走完。</text>
</svg>
