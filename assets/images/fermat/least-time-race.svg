<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc">
<title id="title">救生员同时出发的时间比较动画</title>
<desc id="desc">红点沿直线、绿点沿最优折线同时出发；两者都在岸上以速度2、水中以速度1运动。红点总时间6.364，绿点6.056，绿色先到。动画统一缩放为不到5秒，静止的两条路线与耗时始终可读。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}@media(prefers-reduced-motion:reduce){.runner{display:none}}</style>
<rect width="1000" height="730" rx="20" fill="#faf8f3"/>
<text x="500" y="47" text-anchor="middle" font-size="28" fill="#20314d" font-weight="700">同时出发：直线更短，绿线却先到</text><text x="500" y="84" text-anchor="middle" font-size="20" fill="#20314d">小圆点在水中会减速；不是两条线各用同样时长播放</text><rect x="60" y="106" width="880" height="224" fill="#fff0d3"/><rect x="60" y="330" width="880" height="250" fill="#e0eff8"/><path d="M60 330 H940" stroke="#73899a" stroke-dasharray="8 6" stroke-width="2"/><text x="110" y="285" text-anchor="start" font-size="22" fill="#20314d">岸上速度 2</text><text x="110" y="505" text-anchor="start" font-size="22" fill="#20314d">水中速度 1</text><text x="204" y="113" text-anchor="end" font-size="22" fill="#20314d" font-weight="700">A</text><text x="662" y="545" text-anchor="start" font-size="22" fill="#20314d" font-weight="700">B</text><path d="M220 120 L430 330 L640 540" fill="none" stroke="#c34550" stroke-width="4" stroke-dasharray="10 7"/><circle class="runner" cx="0" cy="0" r="13" fill="#c34550" stroke="#fff" stroke-width="2"><animateMotion dur="4.80000000s" path="M220 120 L430 330 L640 540" keyTimes="0;0.3333333333;1" keyPoints="0;0.5000000000;1" calcMode="linear" fill="freeze"/></circle><circle cx="430" cy="330" r="5" fill="#c34550"/><path d="M220 120 L543.0354912747738 330 L640 540" fill="none" stroke="#16785a" stroke-width="4"/><circle class="runner" cx="0" cy="0" r="8" fill="#16785a" stroke="#fff" stroke-width="2"><animateMotion dur="4.56807190s" path="M220 120 L543.0354912747738 330 L640 540" keyTimes="0;0.4544076987;1" keyPoints="0;0.6248697654;1" calcMode="linear" fill="freeze"/></circle><circle cx="543.0354912747738" cy="330" r="5" fill="#16785a"/><rect x="679" y="135" width="236" height="146" rx="12" fill="#fff"/><text x="700" y="170" text-anchor="start" font-size="21" fill="#b03040" font-weight="700">红虚线：约 6.364</text><text x="700" y="207" text-anchor="start" font-size="21" fill="#146747" font-weight="700">绿实线：约 6.056</text><text x="700" y="249" text-anchor="start" font-size="20" fill="#20314d">少花约 4.83% 时间</text><text x="500" y="620" text-anchor="middle" font-size="24" fill="#20314d" font-weight="700">全程时间 = 岸上距离 ÷ 2 + 水中距离 ÷ 1</text><text x="500" y="660" text-anchor="middle" font-size="18" fill="#20314d">动画只播放一次；约 4.8 秒后停住。真实时间统一缩放，但保留 2:1 速度比。</text><text x="500" y="697" text-anchor="middle" font-size="18" fill="#20314d">坐标与前图一致；仅为救生员教学模型，不代表实际空气—水的光速比。</text>
</svg>
