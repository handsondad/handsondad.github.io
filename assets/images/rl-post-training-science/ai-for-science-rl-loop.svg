<svg xmlns="http://www.w3.org/2000/svg" width="760" height="482" viewBox="0 0 760 482" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">AI for Science强化学习增强闭环与形式数学、蛋白质材料设计、托卡马克核聚变控制三大突破图解</title>
<desc id="desc">上图展示科学预训练底座结合KL合法性锚定、多目标探索采样及多保真度科学验证器（扣除代理模型不确定度防止奖励黑客）的通用闭环；下图分三栏梳理AlphaTensor/AlphaProof形式验证突破、REINVENT/ProtRL/MatterGen分子材料闭环优化及Nature 2022/2024托卡马克等离子体磁约束控制。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="481" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">AI for Science 的强化学习增强蓝图：把“人类打分员”换成“大自然第一性原理”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">科学预训练底座负责守住“化学/物理合法流形”，物理模拟器、形式化内核与湿实验闭环负责推向未知极值</text>
<rect x="18" y="60" width="724" height="144" rx="10" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="34" y="83" font-size="12.0" fill="#1d6fa5" text-anchor="start" font-weight="700">① 科学大模型后训练通用闭环（同时防住“违反化合价/物理定律”与“代理模型奖励黑客”）</text>
<rect x="34" y="96" width="198" height="68" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="133.0" y="117" font-size="10.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">科学预训练先验底座</text>
<text x="133.0" y="136" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="600">蛋白质 pLM · 分子图 · 晶体扩散</text>
<text x="133.0" y="153" font-size="9.6" fill="#1e293b" text-anchor="middle">提供合法语法 + KL 先验锚定</text>
<rect x="256" y="96" width="194" height="68" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.3"/>
<text x="353.0" y="117" font-size="10.8" fill="#6d28d9" text-anchor="middle" font-weight="700">多目标探索采样</text>
<text x="353.0" y="136" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="600">序列突变 · 晶格弛豫 · 证明树</text>
<text x="353.0" y="153" font-size="9.6" fill="#1e293b" text-anchor="middle">跳出训练库平均值搜稀有极值</text>
<rect x="474" y="96" width="252" height="68" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="600.0" y="117" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="700">多保真度科学验证器</text>
<text x="600.0" y="136" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="600">Lean内核 · DFT量子化学 · 湿实验</text>
<text x="600.0" y="153" font-size="9.6" fill="#1e293b" text-anchor="middle">R = 目标性质 − λ·不确定度 σ(x)</text>
<line x1="234.0" y1="130.0" x2="254.0" y2="130.0" stroke="#1d6fa5" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<line x1="452.0" y1="130.0" x2="472.0" y2="130.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arr-muted)"/>
<path d="M 600,166 Q 380,198 134,166" fill="none" stroke="#18794e" stroke-width="1.9" stroke-dasharray="5 3" marker-end="url(#arr-green)"/>
<text x="380" y="194" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">PPO / GRPO / DPO 反向更新模型权重 + 湿实验数据回流重校准代理模型</text>
<rect x="18" y="216" width="228" height="252" rx="10" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="32" y="239" font-size="12.2" fill="#1d6fa5" text-anchor="start" font-weight="700">赛道 A · 形式数学与算法</text>
<rect x="32.0" y="248.0" width="182" height="20" rx="10.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="123.0" y="261.6" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="600">绝对零误差内核验证器</text>
<text x="32" y="286" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• AlphaTensor (Nature 2022)</text>
<text x="40" y="308" font-size="9.8" fill="#1e293b" text-anchor="start">4×4(模2) 乘法由 49 降至 47 次！</text>
<text x="32" y="330" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• AlphaProof (Nature 2025)</text>
<text x="40" y="352" font-size="9.8" fill="#1e293b" text-anchor="start">斩获 IMO 2024 银牌水准 (28/42分)</text>
<text x="32" y="374" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• FunSearch (Nature 2024)</text>
<text x="40" y="396" font-size="9.8" fill="#1e293b" text-anchor="start">刷新困扰数学界数十年的帽集下界</text>
<rect x="30" y="424" width="204" height="32" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="132" y="444" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">优势：100% 免幻觉，对就是对！</text>
<rect x="266" y="216" width="228" height="252" rx="10" fill="#ffffff" stroke="#18794e" stroke-width="1.3"/>
<text x="280" y="239" font-size="12.2" fill="#18794e" text-anchor="start" font-weight="700">赛道 B · 生命分子与新材料</text>
<rect x="280.0" y="248.0" width="182" height="20" rx="10.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="371.0" y="261.6" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="600">物理计算 + 湿实验主动闭环</text>
<text x="280" y="286" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• REINVENT 分子从头设计</text>
<text x="288" y="308" font-size="9.8" fill="#1e293b" text-anchor="start">RL 定向优化靶点活性命中率 &gt;95%</text>
<text x="280" y="330" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• ProtRL 蛋白工程 (2025)</text>
<text x="288" y="352" font-size="9.8" fill="#1e293b" text-anchor="start">即得 Kd=5.5 nM 高亲和 EGFR 结合剂</text>
<text x="280" y="374" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• MatterGen 晶体生成 (2024)</text>
<text x="288" y="396" font-size="9.8" fill="#1e293b" text-anchor="start">磁密微调，靶向设计低风险新晶体</text>
<rect x="278" y="424" width="204" height="32" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="380" y="444" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="700">铁律：须扣不确定度防代理模型被骗</text>
<rect x="514" y="216" width="228" height="252" rx="10" fill="#ffffff" stroke="#c25014" stroke-width="1.3"/>
<text x="528" y="239" font-size="12.2" fill="#c25014" text-anchor="start" font-weight="700">赛道 C · 聚变控制与物理仿真</text>
<rect x="528.0" y="248.0" width="182" height="20" rx="10.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="619.0" y="261.6" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="600">高维偏微分方程实时闭环</text>
<text x="528" y="286" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• TCV 托卡马克磁控 (Nature 2022)</text>
<text x="536" y="308" font-size="9.8" fill="#1e293b" text-anchor="start">在物理仿真器练成 RL 控制器，</text>
<text x="528" y="330" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• 每秒上万次操控 19 组磁线圈</text>
<text x="536" y="352" font-size="9.8" fill="#1e293b" text-anchor="start">稳稳捏出雪花形、负三角形截面，</text>
<text x="528" y="374" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">• 首创“双水滴”同室悬浮等离子体</text>
<text x="536" y="396" font-size="9.8" fill="#1e293b" text-anchor="start">预判并规避致命的等离子体撕裂模！</text>
<rect x="526" y="424" width="204" height="32" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="628" y="444" font-size="9.8" fill="#c25014" text-anchor="middle" font-weight="700">关键：随机化仿真参数跨越虚实鸿沟</text>
</svg>
