<rect x="0.5" y="0.5" width="759" height="455" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">强化学习点石成金的两个秘密：生成—验证不对称性，与防崩盘的 KL 拴狗绳</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：裁判不必比选手更会解题，只要“判对错比凑答案容易”；右：没有 KL 散度拉住底座，高分必成作弊</text>
<rect x="18" y="62" width="354" height="376" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="32" y="85" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">① 为什么不给标准步骤也能变强？（生成难 vs 验证易）</text>
<text x="32" y="104" font-size="10.2" fill="#64748b" text-anchor="start">呼应计算机科学 P vs NP 直觉：找钥匙难，试钥匙开锁极快！</text>
<rect x="32" y="118" width="326" height="62" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40.0" y="125.0" width="96" height="19" rx="9.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="88.0" y="137.9" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">竞赛数学证明</text>
<rect x="282.0" y="125.0" width="68" height="19" rx="9.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="316.0" y="137.9" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="600">验：毫秒级</text>
<text x="40" y="158" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="600">生成难：从上万条代数变形分支里凑出巧解</text>
<text x="40" y="173" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">验证易：核对最终数值 / Lean 4 内核逐行验真</text>
<rect x="32" y="190" width="326" height="62" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40.0" y="197.0" width="96" height="19" rx="9.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="88.0" y="209.9" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">复杂软件补丁</text>
<rect x="282.0" y="197.0" width="68" height="19" rx="9.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="316.0" y="209.9" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="600">验：秒级</text>
<text x="40" y="230" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="600">生成难：跨十几个文件定位并发 Bug 并改对</text>
<text x="40" y="245" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">验证易：跑一遍编译器 + 单元测试套件通过率</text>
<rect x="32" y="262" width="326" height="62" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<rect x="40.0" y="269.0" width="96" height="19" rx="9.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="88.0" y="281.9" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">蛋白质/晶体设计</text>
<rect x="282.0" y="269.0" width="68" height="19" rx="9.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="316.0" y="281.9" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="600">验：可量化</text>
<text x="40" y="302" font-size="10.0" fill="#c25014" text-anchor="start" font-weight="600">生成难：在 20^200 序列空间大海捞针找折叠</text>
<text x="40" y="317" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">验证易：物理能量函数 / 分子对接 / 湿实验测 Kd</text>
<rect x="32" y="338" width="326" height="86" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="44" y="358" font-size="11.0" fill="#18794e" text-anchor="start" font-weight="700">强化学习的“棘轮放大器”效应：</text>
<text x="44" y="377" font-size="10.1" fill="#1e293b" text-anchor="start">1. 预训练底座靠随机采样偶尔撞出 1 条妙解（哪怕概率仅 5%）；</text>
<text x="44" y="395" font-size="10.1" fill="#1e293b" text-anchor="start">2. 验证器一秒认出“做对了”，RL 立刻把这条路径权重调高；</text>
<text x="44" y="413" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">3. 下一轮从更高起点继续探索 → 不靠更聪明的人写范文也能进化！</text>
<rect x="384" y="62" width="358" height="376" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="398" y="85" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">② 为什么要扣掉 β·D_KL(π_θ ∥ π_ref)？防“奖励黑客”</text>
<text x="398" y="104" font-size="10.2" fill="#64748b" text-anchor="start">精确函数绘制：J(d) = R_proxy(d) − β·d（最优甜点区 d* ≈ 2.18）</text>
