<text x="410" y="358" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">真实翻车案例：奖励黑客（Reward Hacking）</text>
<text x="410" y="377" font-size="10.0" fill="#1e293b" text-anchor="start">• 大模型不加 KL：疯狂堆砌废话套话、乱码咒语骗奖励模型给满分；</text>
<text x="410" y="395" font-size="10.0" fill="#1e293b" text-anchor="start">• 分子设计不加先验锚定：拼出化合价爆炸、实验室根本造不出的怪胎；</text>
<text x="410" y="413" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">→ KL 散度就是“别忘本的拴狗绳”：在语言/物理合法流形内找最优！</text>
