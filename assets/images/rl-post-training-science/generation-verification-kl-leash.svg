<title id="title">生成与验证不对称性棘轮机制及KL散度正则化防止奖励黑客曲线图</title>
<desc id="desc">左图对比数学证明、代码修复与分子设计中生成难而验证快的P与NP式不对称性及其驱动的强化学习自我进化棘轮；右图计算代理奖励、KL正则化目标与真实质量随策略偏离度变化的曲线，标示最优甜点区与奖励黑客崩盘区。</desc>
