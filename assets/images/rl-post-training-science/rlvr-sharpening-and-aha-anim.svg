<svg xmlns="http://www.w3.org/2000/svg" width="760" height="458" viewBox="0 0 760 458" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">RLVR概率分布锐化单次动画与DeepSeek-R1-Zero顿悟涌现及Pass@k边界对比图</title>
<desc id="desc">左图通过单次CSS动画演示强化学习如何压低预训练底座中的4条高概率错误捷径（85%降至22%）并将自检纠错与严密推理链从15%浓缩至78%；右图展示DeepSeek-R1-Zero在AIME 2024从15.6%跃升至71.0%及Yue等2025年揭示的大k采样Pass@k交叉边界。</desc>
