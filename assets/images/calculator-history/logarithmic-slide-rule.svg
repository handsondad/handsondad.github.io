<svg xmlns="http://www.w3.org/2000/svg" width="540" height="633.75" viewBox="0 0 540 633.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">④ 计算尺：把乘法，变成长度的相加</title><desc id="desc">按十进对数位置绘制的双尺，滑动尺的1对准固定尺2后，滑动尺3对准固定尺6。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="632.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">④ 计算尺：把乘法，变成长度的相加</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">这是另一条技术路线：对数刻度，读出近似结果</text><rect x="24" y="120" width="672" height="540" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="184.39" font-size="18.2" fill="#172b45" text-anchor="start">固定尺</text><path d="M90.000,265.000 L432.495,265.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M90.000,265.000 L580.000,265.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M90.000,253.000 L90.000,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="90.0" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">1</text><path d="M237.505,253.000 L237.505,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="237.5046978753508" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">2</text><path d="M323.789,253.000 L323.789,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="323.7894148126346" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">3</text><path d="M385.009,253.000 L385.009,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="385.0093957507016" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">4</text><path d="M432.495,253.000 L432.495,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="432.49530212464924" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">5</text><path d="M471.294,253.000 L471.294,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="471.2941126879854" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">6</text><path d="M504.098,253.000 L504.098,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="504.0980396069858" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">7</text><path d="M532.514,253.000 L532.514,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="532.5140936260523" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">8</text><path d="M557.579,253.000 L557.579,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="557.5788296252692" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">9</text><path d="M580.000,253.000 L580.000,277.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="580.0" y="306.45" font-size="17.5" fill="#172b45" text-anchor="middle">10</text><text x="48" y="344.39" font-size="18.2" fill="#172b45" text-anchor="start">滑动尺</text><path d="M237.505,425.000 L580.000,425.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M237.505,413.000 L237.505,437.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="237.5046978753508" y="466.45" font-size="17.5" fill="#172b45" text-anchor="middle">1</text><path d="M385.009,413.000 L385.009,437.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="385.0093957507016" y="466.45" font-size="17.5" fill="#172b45" text-anchor="middle">2</text><path d="M471.294,413.000 L471.294,437.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="471.2941126879854" y="466.45" font-size="17.5" fill="#172b45" text-anchor="middle">3</text><path d="M532.514,413.000 L532.514,437.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="532.5140936260524" y="466.45" font-size="17.5" fill="#172b45" text-anchor="middle">4</text><path d="M580.000,413.000 L580.000,437.000" fill="none" stroke="#176786" stroke-width="2.4"/><text x="580.0" y="466.45" font-size="17.5" fill="#172b45" text-anchor="middle">5</text><path d="M237.505,252.000 L237.505,438.000" fill="none" stroke="#b34039" stroke-width="2.4" stroke-dasharray="7 6"/><text x="48" y="541.39" font-size="18.2" fill="#b34039" text-anchor="start">上尺 2 对齐下尺 1</text><path d="M471.294,252.000 L471.294,438.000" fill="none" stroke="#b34039" stroke-width="2.4" stroke-dasharray="7 6"/><text x="48" y="590.39" font-size="18.2" fill="#b34039" text-anchor="start">下尺 3 对应上尺 6</text><text x="36" y="708.54" font-size="21.2" fill="#176786" text-anchor="start" font-weight="700">log₁₀2 + log₁₀3 = log₁₀6</text><text x="36" y="756.45" font-size="17.5" fill="#172b45" text-anchor="start">刻度越往右越密；图中不是等距排了 1 到 10。</text><text x="36" y="799.52" font-size="16.7" fill="#172b45" text-anchor="start">计算尺主要给有效数字，数量级通常还要由人判断。</text></g></svg>
