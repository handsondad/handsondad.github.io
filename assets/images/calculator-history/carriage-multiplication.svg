<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1090" viewBox="0 0 720 1090" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">③ 乘法：重复相加，加上十进位移</title><desc id="desc">输入1709，分别转5圈、左移后转6圈、再左移转3圈，累计得到623785。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1090" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">③ 乘法：重复相加，加上十进位移</text><text x="36" y="91" font-size="22" fill="#172b45" text-anchor="start">1709 × 365 = 1709 × (5 + 60 + 300)</text><rect x="24" y="120" width="672" height="250" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="159" font-size="25" fill="#172b45" text-anchor="start">1  滑架位移 0 格；转 5 圈</text><text x="60" y="215" font-size="29" fill="#176786" text-anchor="start">每圈加 1,709</text><text x="60" y="267" font-size="29" fill="#b77a09" text-anchor="start">本步增加 8,545</text><text x="60" y="327" font-size="32" fill="#b34039" text-anchor="start">累计结果 8,545</text><rect x="24" y="395" width="672" height="250" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="434" font-size="25" fill="#172b45" text-anchor="start">2  滑架位移 1 格；转 6 圈</text><text x="60" y="490" font-size="29" fill="#176786" text-anchor="start">每圈加 17,090</text><text x="60" y="542" font-size="29" fill="#b77a09" text-anchor="start">本步增加 102,540</text><text x="60" y="602" font-size="32" fill="#b34039" text-anchor="start">累计结果 111,085</text><rect x="24" y="670" width="672" height="250" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="709" font-size="25" fill="#172b45" text-anchor="start">3  滑架位移 2 格；转 3 圈</text><text x="60" y="765" font-size="29" fill="#176786" text-anchor="start">每圈加 170,900</text><text x="60" y="817" font-size="29" fill="#b77a09" text-anchor="start">本步增加 512,700</text><text x="60" y="877" font-size="32" fill="#b34039" text-anchor="start">累计结果 623,785</text><text x="36" y="1004" font-size="25" fill="#172b45" text-anchor="start">5 + 6 + 3 = 14 圈，而不是连续加 365 次。</text><text x="36" y="1045" font-size="22" fill="#172b45" text-anchor="start">滑架每左移一格，输入数对齐更高一位，贡献乘 10。</text></svg>
