<svg xmlns="http://www.w3.org/2000/svg" width="540" height="817.5" viewBox="0 0 540 817.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">③ 乘法：重复相加，加上十进位移</title><desc id="desc">输入1709，分别转5圈、左移后转6圈、再左移转3圈，累计得到623785。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="816" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">③ 乘法：重复相加，加上十进位移</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">1709 × 365 = 1709 × (5 + 60 + 300)</text><rect x="24" y="120" width="672" height="250" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="157.32" font-size="19.0" fill="#172b45" text-anchor="start">1  滑架位移 0 格；转 5 圈</text><text x="60" y="212.73" font-size="20.9" fill="#176786" text-anchor="start" font-weight="700">每圈加 1,709</text><text x="60" y="264.73" font-size="20.9" fill="#b77a09" text-anchor="start" font-weight="700">本步增加 8,545</text><text x="60" y="323.98" font-size="21.2" fill="#b34039" text-anchor="start" font-weight="700">累计结果 8,545</text><rect x="24" y="395" width="672" height="250" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="432.32" font-size="19.0" fill="#172b45" text-anchor="start">2  滑架位移 1 格；转 6 圈</text><text x="60" y="487.73" font-size="20.9" fill="#176786" text-anchor="start" font-weight="700">每圈加 17,090</text><text x="60" y="539.73" font-size="20.9" fill="#b77a09" text-anchor="start" font-weight="700">本步增加 102,540</text><text x="60" y="598.98" font-size="21.2" fill="#b34039" text-anchor="start" font-weight="700">累计结果 111,085</text><rect x="24" y="670" width="672" height="250" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="707.32" font-size="19.0" fill="#172b45" text-anchor="start">3  滑架位移 2 格；转 3 圈</text><text x="60" y="762.73" font-size="20.9" fill="#176786" text-anchor="start" font-weight="700">每圈加 170,900</text><text x="60" y="814.73" font-size="20.9" fill="#b77a09" text-anchor="start" font-weight="700">本步增加 512,700</text><text x="60" y="873.98" font-size="21.2" fill="#b34039" text-anchor="start" font-weight="700">累计结果 623,785</text><text x="36" y="1002.32" font-size="19.0" fill="#172b45" text-anchor="start">5 + 6 + 3 = 14 圈，而不是连续加 365 次。</text><text x="36" y="1043.52" font-size="16.7" fill="#172b45" text-anchor="start">滑架每左移一格，输入数对齐更高一位，贡献乘 10。</text></g></svg>
