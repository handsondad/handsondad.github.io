<svg xmlns="http://www.w3.org/2000/svg" width="540" height="690" viewBox="0 0 540 690" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">⑧ 按下等号前，还要知道“数”怎样保存</title><desc id="desc">比较有限位机械整数、二进制浮点、十进制或有理数算法，说明显示结果与内部表示并非一回事。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="688.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑧ 按下等号前，还要知道“数”怎样保存</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">这些是表示方式的例子，不是所有产品的统一实现</text><rect x="24" y="120" width="672" height="200" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="158.32" font-size="19.0" fill="#176786" text-anchor="start">有限位十进制整数</text><text x="48" y="213.52" font-size="16.7" fill="#172b45" text-anchor="start">例如：四个数轮只能显示 0000—9999。</text><text x="48" y="269.59" font-size="16.0" fill="#b34039" text-anchor="start">9999 再加 1，需要额外一位或溢出处理。</text><rect x="24" y="340" width="672" height="200" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="378.32" font-size="19.0" fill="#176786" text-anchor="start">有限精度二进制浮点数</text><text x="48" y="433.52" font-size="16.7" fill="#172b45" text-anchor="start">0.1 的二进制小数无限循环，存储时需舍入。</text><text x="48" y="489.59" font-size="16.0" fill="#b34039" text-anchor="start">常见示例：0.1 + 0.2 → 0.30000000000000004</text><rect x="24" y="560" width="672" height="200" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="598.32" font-size="19.0" fill="#176786" text-anchor="start">十进制、整数或有理数算法</text><text x="48" y="653.52" font-size="16.7" fill="#172b45" text-anchor="start">0.1 可按十进小数处理，也可记成分数 1/10。</text><text x="48" y="709.59" font-size="16.0" fill="#b34039" text-anchor="start">能精确处理哪些运算，仍取决于算法和资源。</text><text x="36" y="830.45" font-size="17.5" fill="#172b45" text-anchor="start">显示“0.3”，不一定能反推出内部恰好存了什么。</text><text x="36" y="876.52" font-size="16.7" fill="#172b45" text-anchor="start">无限循环小数、无理数与有限屏幕，是不同层面的限制。</text></g></svg>
