<svg xmlns="http://www.w3.org/2000/svg" width="540" height="847.5" viewBox="0 0 540 847.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">② 阶梯鼓：一圈，怎样恰好加 3？</title><desc id="desc">展开后的九根渐长齿棱中，一条接触线只与最长的三根相交，说明设为3时每圈输入3。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="846" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">② 阶梯鼓：一圈，怎样恰好加 3？</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">把圆柱表面展开来看；横向是轴向，纵向是转动次序</text><rect x="24" y="120" width="672" height="650" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="161.39" font-size="18.2" fill="#172b45" text-anchor="start">九条齿棱长短不同，并非九层圆盘。</text><text x="76" y="246.52" font-size="16.7" fill="#71869a" text-anchor="middle">1</text><rect x="110" y="230" width="50" height="22" rx="4" fill="#176786"/><text x="76" y="292.52" font-size="16.7" fill="#71869a" text-anchor="middle">2</text><rect x="110" y="276" width="100" height="22" rx="4" fill="#176786"/><text x="76" y="338.52" font-size="16.7" fill="#71869a" text-anchor="middle">3</text><rect x="110" y="322" width="150" height="22" rx="4" fill="#176786"/><text x="76" y="384.52" font-size="16.7" fill="#71869a" text-anchor="middle">4</text><rect x="110" y="368" width="200" height="22" rx="4" fill="#176786"/><text x="76" y="430.52" font-size="16.7" fill="#71869a" text-anchor="middle">5</text><rect x="110" y="414" width="250" height="22" rx="4" fill="#176786"/><text x="76" y="476.52" font-size="16.7" fill="#71869a" text-anchor="middle">6</text><rect x="110" y="460" width="300" height="22" rx="4" fill="#176786"/><text x="76" y="522.52" font-size="16.7" fill="#71869a" text-anchor="middle">7</text><rect x="110" y="506" width="350" height="22" rx="4" fill="#b34039"/><circle cx="435.000" cy="517.000" r="7" fill="#b77a09"/><text x="76" y="568.52" font-size="16.7" fill="#71869a" text-anchor="middle">8</text><rect x="110" y="552" width="400" height="22" rx="4" fill="#b34039"/><circle cx="435.000" cy="563.000" r="7" fill="#b77a09"/><text x="76" y="614.52" font-size="16.7" fill="#71869a" text-anchor="middle">9</text><rect x="110" y="598" width="450" height="22" rx="4" fill="#b34039"/><circle cx="435.000" cy="609.000" r="7" fill="#b77a09"/><path d="M435.000,196.000 L435.000,650.000" fill="none" stroke="#b77a09" stroke-width="2.4" stroke-dasharray="7 6"/><text x="435.0" y="689.52" font-size="16.7" fill="#b77a09" text-anchor="middle">小齿轮的接触位置</text><text x="48" y="733.52" font-size="16.7" fill="#172b45" text-anchor="start">这个位置只有三条齿棱经过 → 接收齿轮走三步。</text><rect x="24" y="795" width="672" height="255" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="835.39" font-size="18.2" fill="#172b45" text-anchor="start">调节轴向位置，就改变一圈经过的齿数</text><text x="150" y="894.80" font-size="20.2" fill="#176786" text-anchor="middle" font-weight="700">设为 0</text><text x="150" y="944.32" font-size="19.0" fill="#b34039" text-anchor="middle">遇到 0 齿</text><text x="355" y="894.80" font-size="20.2" fill="#176786" text-anchor="middle" font-weight="700">设为 3</text><text x="355" y="944.32" font-size="19.0" fill="#b34039" text-anchor="middle">遇到 3 齿</text><text x="560" y="894.80" font-size="20.2" fill="#176786" text-anchor="middle" font-weight="700">设为 7</text><text x="560" y="944.32" font-size="19.0" fill="#b34039" text-anchor="middle">遇到 7 齿</text><text x="48" y="1017.59" font-size="16.0" fill="#172b45" text-anchor="start">转完齿区后，还要处理进位；此处只拆解输入机制。</text><text x="36" y="1093.52" font-size="16.7" fill="#172b45" text-anchor="start">示意省略真实齿形、传动比、定位与无齿区的角度。</text></g></svg>
