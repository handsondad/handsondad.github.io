<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1130" viewBox="0 0 720 1130" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">② 阶梯鼓：一圈，怎样恰好加 3？</title><desc id="desc">展开后的九根渐长齿棱中，一条接触线只与最长的三根相交，说明设为3时每圈输入3。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1130" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">② 阶梯鼓：一圈，怎样恰好加 3？</text><text x="36" y="91" font-size="22" fill="#172b45" text-anchor="start">把圆柱表面展开来看；横向是轴向，纵向是转动次序</text><rect x="24" y="120" width="672" height="650" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="163" font-size="24" fill="#172b45" text-anchor="start">九条齿棱长短不同，并非九层圆盘。</text><text x="76" y="248" font-size="22" fill="#71869a" text-anchor="middle">1</text><rect x="110" y="230" width="50" height="22" rx="4" fill="#176786"/><text x="76" y="294" font-size="22" fill="#71869a" text-anchor="middle">2</text><rect x="110" y="276" width="100" height="22" rx="4" fill="#176786"/><text x="76" y="340" font-size="22" fill="#71869a" text-anchor="middle">3</text><rect x="110" y="322" width="150" height="22" rx="4" fill="#176786"/><text x="76" y="386" font-size="22" fill="#71869a" text-anchor="middle">4</text><rect x="110" y="368" width="200" height="22" rx="4" fill="#176786"/><text x="76" y="432" font-size="22" fill="#71869a" text-anchor="middle">5</text><rect x="110" y="414" width="250" height="22" rx="4" fill="#176786"/><text x="76" y="478" font-size="22" fill="#71869a" text-anchor="middle">6</text><rect x="110" y="460" width="300" height="22" rx="4" fill="#176786"/><text x="76" y="524" font-size="22" fill="#71869a" text-anchor="middle">7</text><rect x="110" y="506" width="350" height="22" rx="4" fill="#b34039"/><circle cx="435.000" cy="517.000" r="7" fill="#b77a09"/><text x="76" y="570" font-size="22" fill="#71869a" text-anchor="middle">8</text><rect x="110" y="552" width="400" height="22" rx="4" fill="#b34039"/><circle cx="435.000" cy="563.000" r="7" fill="#b77a09"/><text x="76" y="616" font-size="22" fill="#71869a" text-anchor="middle">9</text><rect x="110" y="598" width="450" height="22" rx="4" fill="#b34039"/><circle cx="435.000" cy="609.000" r="7" fill="#b77a09"/><path d="M435.000,196.000 L435.000,650.000" fill="none" stroke="#b77a09" stroke-width="3" stroke-dasharray="7 6"/><text x="435.0" y="691" font-size="22" fill="#b77a09" text-anchor="middle">小齿轮的接触位置</text><text x="48" y="735" font-size="22" fill="#172b45" text-anchor="start">这个位置只有三条齿棱经过 → 接收齿轮走三步。</text><rect x="24" y="795" width="672" height="255" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="837" font-size="24" fill="#172b45" text-anchor="start">调节轴向位置，就改变一圈经过的齿数</text><text x="150" y="897" font-size="28" fill="#176786" text-anchor="middle">设为 0</text><text x="150" y="946" font-size="25" fill="#b34039" text-anchor="middle">遇到 0 齿</text><text x="355" y="897" font-size="28" fill="#176786" text-anchor="middle">设为 3</text><text x="355" y="946" font-size="25" fill="#b34039" text-anchor="middle">遇到 3 齿</text><text x="560" y="897" font-size="28" fill="#176786" text-anchor="middle">设为 7</text><text x="560" y="946" font-size="25" fill="#b34039" text-anchor="middle">遇到 7 齿</text><text x="48" y="1019" font-size="21" fill="#172b45" text-anchor="start">转完齿区后，还要处理进位；此处只拆解输入机制。</text><text x="36" y="1095" font-size="22" fill="#172b45" text-anchor="start">示意省略真实齿形、传动比、定位与无齿区的角度。</text></svg>
