<svg xmlns="http://www.w3.org/2000/svg" width="540" height="862.5" viewBox="0 0 540 862.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">① 99 + 1：最难的是把那个 1 传过去</title><desc id="desc">从0099加一，依次处理个位和十位进位，最后得到0100。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="861" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">① 99 + 1：最难的是把那个 1 传过去</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">数位状态图；不是帕斯卡机内部零件的精确复刻</text><rect x="24" y="120" width="672" height="220" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="155.39" font-size="18.2" fill="#172b45" text-anchor="start">1  原来是 0099，准备在个位加 1。</text><text x="180" y="194.66" font-size="15.2" fill="#71869a" text-anchor="middle">千位</text><text x="292" y="194.66" font-size="15.2" fill="#71869a" text-anchor="middle">百位</text><text x="404" y="194.66" font-size="15.2" fill="#71869a" text-anchor="middle">十位</text><text x="516" y="194.66" font-size="15.2" fill="#71869a" text-anchor="middle">个位</text><rect x="136" y="208" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="180" y="257.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><rect x="248" y="208" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="292" y="257.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><rect x="360" y="208" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="404" y="257.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">9</text><rect x="472" y="208" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#b34039" stroke-width="2"/><text x="516" y="257.52" font-size="28.0" fill="#b34039" text-anchor="middle" font-weight="700">9</text><text x="48" y="317.52" font-size="16.7" fill="#172b45" text-anchor="start">每个十进制数位只容纳 0—9。</text><rect x="24" y="360" width="672" height="220" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="395.39" font-size="18.2" fill="#172b45" text-anchor="start">2  个位 9 → 0，向十位发出进位。</text><text x="180" y="434.66" font-size="15.2" fill="#71869a" text-anchor="middle">千位</text><text x="292" y="434.66" font-size="15.2" fill="#71869a" text-anchor="middle">百位</text><text x="404" y="434.66" font-size="15.2" fill="#71869a" text-anchor="middle">十位</text><text x="516" y="434.66" font-size="15.2" fill="#71869a" text-anchor="middle">个位</text><rect x="136" y="448" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="180" y="497.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><rect x="248" y="448" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="292" y="497.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><rect x="360" y="448" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="404" y="497.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">9</text><rect x="472" y="448" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#b34039" stroke-width="2"/><text x="516" y="497.52" font-size="28.0" fill="#b34039" text-anchor="middle" font-weight="700">0</text><text x="48" y="557.52" font-size="16.7" fill="#172b45" text-anchor="start">这里的 0 不是结束，而是触发下一步。</text><rect x="24" y="600" width="672" height="220" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="635.39" font-size="18.2" fill="#172b45" text-anchor="start">3  十位也从 9 → 0，再向百位进 1。</text><text x="180" y="674.66" font-size="15.2" fill="#71869a" text-anchor="middle">千位</text><text x="292" y="674.66" font-size="15.2" fill="#71869a" text-anchor="middle">百位</text><text x="404" y="674.66" font-size="15.2" fill="#71869a" text-anchor="middle">十位</text><text x="516" y="674.66" font-size="15.2" fill="#71869a" text-anchor="middle">个位</text><rect x="136" y="688" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="180" y="737.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><rect x="248" y="688" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="292" y="737.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><rect x="360" y="688" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#b34039" stroke-width="2"/><text x="404" y="737.52" font-size="28.0" fill="#b34039" text-anchor="middle" font-weight="700">0</text><rect x="472" y="688" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="516" y="737.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><text x="48" y="797.52" font-size="16.7" fill="#172b45" text-anchor="start">连着几个 9，就需要连续几次进位。</text><rect x="24" y="840" width="672" height="220" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="875.39" font-size="18.2" fill="#172b45" text-anchor="start">4  百位收到 1，结果成为 0100。</text><text x="180" y="914.66" font-size="15.2" fill="#71869a" text-anchor="middle">千位</text><text x="292" y="914.66" font-size="15.2" fill="#71869a" text-anchor="middle">百位</text><text x="404" y="914.66" font-size="15.2" fill="#71869a" text-anchor="middle">十位</text><text x="516" y="914.66" font-size="15.2" fill="#71869a" text-anchor="middle">个位</text><rect x="136" y="928" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="180" y="977.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><rect x="248" y="928" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#b34039" stroke-width="2"/><text x="292" y="977.52" font-size="28.0" fill="#b34039" text-anchor="middle" font-weight="700">1</text><rect x="360" y="928" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="404" y="977.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><rect x="472" y="928" width="88" height="76" rx="8" fill="#f3f7fa" stroke="#176786" stroke-width="2"/><text x="516" y="977.52" font-size="28.0" fill="#176786" text-anchor="middle" font-weight="700">0</text><text x="48" y="1037.52" font-size="16.7" fill="#172b45" text-anchor="start">完整结果：99 + 1 = 100。</text><text x="36" y="1112.52" font-size="16.7" fill="#172b45" text-anchor="start">重点不是四个轮子一起转，而是数位之间可靠地传信。</text></g></svg>
