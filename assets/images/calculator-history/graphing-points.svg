<svg xmlns="http://www.w3.org/2000/svg" width="540" height="708.75" viewBox="0 0 540 708.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">⑥ 从“一个答案”，到“一整条曲线”</title><desc id="desc">九个精确平方函数样本点与十七点采样折线，展示绘图计算器将数值变成图形的基本思路。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="707.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑥ 从“一个答案”，到“一整条曲线”</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">教学示意：反复计算 y = x²，把数对放到屏幕位置</text><rect x="24" y="120" width="672" height="690" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="163.45" font-size="17.5" fill="#172b45" text-anchor="start">取九个示例输入，不只问一次“2 的平方是多少”</text><path d="M160.000,650.000 L560.000,650.000" fill="none" stroke="#dce5ec" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M160.000,550.000 L560.000,550.000" fill="none" stroke="#dce5ec" stroke-width="2.4" stroke-dasharray="7 6"/><text x="339" y="555.66" font-size="15.2" fill="#71869a" text-anchor="end">1</text><path d="M160.000,450.000 L560.000,450.000" fill="none" stroke="#dce5ec" stroke-width="2.4" stroke-dasharray="7 6"/><text x="339" y="455.66" font-size="15.2" fill="#71869a" text-anchor="end">2</text><path d="M160.000,350.000 L560.000,350.000" fill="none" stroke="#dce5ec" stroke-width="2.4" stroke-dasharray="7 6"/><text x="339" y="355.66" font-size="15.2" fill="#71869a" text-anchor="end">3</text><path d="M160.000,250.000 L560.000,250.000" fill="none" stroke="#dce5ec" stroke-width="2.4" stroke-dasharray="7 6"/><text x="339" y="255.66" font-size="15.2" fill="#71869a" text-anchor="end">4</text><path d="M130.000,650.000 L605.000,650.000" fill="none" stroke="#176786" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M360.000,675.000 L360.000,215.000" fill="none" stroke="#176786" stroke-width="2.4" marker-end="url(#arrow)"/><text x="160" y="688.52" font-size="16.7" fill="#172b45" text-anchor="middle">-2</text><text x="260" y="688.52" font-size="16.7" fill="#172b45" text-anchor="middle">-1</text><text x="360" y="688.52" font-size="16.7" fill="#172b45" text-anchor="middle">0</text><text x="460" y="688.52" font-size="16.7" fill="#172b45" text-anchor="middle">1</text><text x="560" y="688.52" font-size="16.7" fill="#172b45" text-anchor="middle">2</text><text x="619" y="655.39" font-size="18.2" fill="#176786" text-anchor="start">x</text><text x="373" y="218.39" font-size="18.2" fill="#176786" text-anchor="start">y</text><path d="M160.000,250.000 L185.000,343.750 L210.000,425.000 L235.000,493.750 L260.000,550.000 L285.000,593.750 L310.000,625.000 L335.000,643.750 L360.000,650.000 L385.000,643.750 L410.000,625.000 L435.000,593.750 L460.000,550.000 L485.000,493.750 L510.000,425.000 L535.000,343.750 L560.000,250.000" fill="none" stroke="#176786" stroke-width="2.46"/><circle cx="160.000" cy="250.000" r="7" fill="#b34039"/><circle cx="210.000" cy="425.000" r="7" fill="#b34039"/><circle cx="260.000" cy="550.000" r="7" fill="#b34039"/><circle cx="310.000" cy="625.000" r="7" fill="#b34039"/><circle cx="360.000" cy="650.000" r="7" fill="#b34039"/><circle cx="410.000" cy="625.000" r="7" fill="#b34039"/><circle cx="460.000" cy="550.000" r="7" fill="#b34039"/><circle cx="510.000" cy="425.000" r="7" fill="#b34039"/><circle cx="560.000" cy="250.000" r="7" fill="#b34039"/><text x="48" y="749.52" font-size="16.7" fill="#172b45" text-anchor="start">红点：九个精确数对；蓝线：更密采样后的折线。</text><text x="36" y="859.52" font-size="16.7" fill="#172b45" text-anchor="start">有限像素只能近似显示连续曲线；窗口选择也会影响观察。</text><text x="36" y="900.52" font-size="16.7" fill="#172b45" text-anchor="start">这是原理图，不是 fx-7000G 的屏幕复刻或算法测绘。</text></g></svg>
