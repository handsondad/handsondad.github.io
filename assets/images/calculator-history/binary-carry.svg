<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1065" viewBox="0 0 720 1065" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">⑤ 换成电路，进位这件事还在</title><desc id="desc">二进制0011加0001得到0100；全加器把两个输入位和低位进位转换成本位和及高位进位。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1065" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">⑤ 换成电路，进位这件事还在</text><text x="36" y="91" font-size="22" fill="#172b45" text-anchor="start">教学用二进制加法；不表示所有计算器都用同一编码</text><rect x="24" y="120" width="672" height="330" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="166" font-size="25" fill="#172b45" text-anchor="start">同一个十进制 3 + 1，换一种写法</text><text x="360" y="235" font-size="42" fill="#176786" text-anchor="middle">0011</text><text x="360" y="299" font-size="42" fill="#176786" text-anchor="middle">+ 0001</text><text x="360" y="387" font-size="42" fill="#b34039" text-anchor="middle">= 0100</text><text x="48" y="426" font-size="22" fill="#172b45" text-anchor="start">右边两位连续进位，十进制结果仍然是 4。</text><rect x="24" y="475" width="672" height="500" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="520" font-size="25" fill="#172b45" text-anchor="start">拆开一个“全加器”：处理当前这一位</text><text x="143" y="585" font-size="24" fill="#176786" text-anchor="middle">输入 A</text><path d="M143.000,605.000 L143.000,665.000" fill="none" stroke="#176786" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="585" font-size="24" fill="#176786" text-anchor="middle">输入 B</text><path d="M360.000,605.000 L360.000,665.000" fill="none" stroke="#176786" stroke-width="3" marker-end="url(#arrow)"/><text x="577" y="585" font-size="24" fill="#176786" text-anchor="middle">低位进位 C</text><path d="M577.000,605.000 L577.000,665.000" fill="none" stroke="#176786" stroke-width="3" marker-end="url(#arrow)"/><rect x="85" y="672" width="550" height="104" rx="14" fill="#eaf2f7" stroke="#176786" stroke-width="2"/><text x="360" y="735" font-size="30" fill="#176786" text-anchor="middle">把三个 0 或 1 相加</text><text x="360" y="835" font-size="29" fill="#b34039" text-anchor="middle">A + B + C = S + 2 × C′</text><text x="48" y="894" font-size="23" fill="#172b45" text-anchor="start">S：留在本位的和；C′：交给高位的进位。</text><text x="48" y="940" font-size="25" fill="#172b45" text-anchor="start">例：1 + 1 + 1 = 1 + 2 × 1。</text><text x="36" y="1024" font-size="22" fill="#172b45" text-anchor="start">电路用逻辑门实现规则；齿轮和脉冲不是同一种机构。</text></svg>
