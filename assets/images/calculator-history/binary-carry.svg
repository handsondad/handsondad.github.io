<svg xmlns="http://www.w3.org/2000/svg" width="540" height="798.75" viewBox="0 0 540 798.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">⑤ 换成电路，进位这件事还在</title><desc id="desc">二进制0011加0001得到0100；全加器把两个输入位和低位进位转换成本位和及高位进位。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="797.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑤ 换成电路，进位这件事还在</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">教学用二进制加法；不表示所有计算器都用同一编码</text><rect x="24" y="120" width="672" height="330" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="164.32" font-size="19.0" fill="#172b45" text-anchor="start">同一个十进制 3 + 1，换一种写法</text><text x="360" y="229.18" font-size="21.2" fill="#176786" text-anchor="middle" font-weight="700">0011</text><text x="360" y="293.18" font-size="21.2" fill="#176786" text-anchor="middle" font-weight="700">+ 0001</text><text x="360" y="381.18" font-size="21.2" fill="#b34039" text-anchor="middle" font-weight="700">= 0100</text><text x="48" y="424.52" font-size="16.7" fill="#172b45" text-anchor="start">右边两位连续进位，十进制结果仍然是 4。</text><rect x="24" y="475" width="672" height="500" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="518.32" font-size="19.0" fill="#172b45" text-anchor="start">拆开一个“全加器”：处理当前这一位</text><text x="143" y="583.39" font-size="18.2" fill="#176786" text-anchor="middle">输入 A</text><path d="M143.000,605.000 L143.000,665.000" fill="none" stroke="#176786" stroke-width="2.4" marker-end="url(#arrow)"/><text x="360" y="583.39" font-size="18.2" fill="#176786" text-anchor="middle">输入 B</text><path d="M360.000,605.000 L360.000,665.000" fill="none" stroke="#176786" stroke-width="2.4" marker-end="url(#arrow)"/><text x="577" y="583.39" font-size="18.2" fill="#176786" text-anchor="middle">低位进位 C</text><path d="M577.000,605.000 L577.000,665.000" fill="none" stroke="#176786" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="85" y="672" width="550" height="104" rx="14" fill="#eaf2f7" stroke="#176786" stroke-width="2"/><text x="360" y="732.54" font-size="21.2" fill="#176786" text-anchor="middle" font-weight="700">把三个 0 或 1 相加</text><text x="360" y="832.73" font-size="20.9" fill="#b34039" text-anchor="middle" font-weight="700">A + B + C = S + 2 × C′</text><text x="48" y="892.45" font-size="17.5" fill="#172b45" text-anchor="start">S：留在本位的和；C′：交给高位的进位。</text><text x="48" y="938.32" font-size="19.0" fill="#172b45" text-anchor="start">例：1 + 1 + 1 = 1 + 2 × 1。</text><text x="36" y="1022.52" font-size="16.7" fill="#172b45" text-anchor="start">电路用逻辑门实现规则；齿轮和脉冲不是同一种机构。</text></g></svg>
