<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1800" viewBox="0 0 720 1800" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">⑦ 不是一位天才，按下了所有时代的等号</title><desc id="desc">计算器发展精选时间线，区分通信记录、发明改进、量产、发布与软件时代。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1800" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">⑦ 不是一位天才，按下了所有时代的等号</text><text x="36" y="91" font-size="22" fill="#172b45" text-anchor="start">精选路标，纵向间距不代表真实时间间隔</text><rect x="24" y="130" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="164" font-size="24" fill="#b34039" text-anchor="start">1623</text><text x="48" y="205" font-size="25" fill="#176786" text-anchor="start">席卡德的通信记录</text><text x="48" y="242" font-size="21" fill="#172b45" text-anchor="start">齿轮加减，配合纳皮尔算筹处理乘除。</text><rect x="24" y="280" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="314" font-size="24" fill="#b34039" text-anchor="start">1640 年代</text><text x="48" y="355" font-size="25" fill="#176786" text-anchor="start">帕斯卡计算器</text><text x="48" y="392" font-size="21" fill="#172b45" text-anchor="start">把加法与自动进位做成实际机器。</text><rect x="24" y="430" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="464" font-size="24" fill="#b34039" text-anchor="start">1673 起</text><text x="48" y="505" font-size="25" fill="#176786" text-anchor="start">莱布尼茨持续展示、改进计算机</text><text x="48" y="542" font-size="21" fill="#172b45" text-anchor="start">后来以阶梯鼓、滑架实现四则运算。</text><rect x="24" y="580" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="614" font-size="24" fill="#b34039" text-anchor="start">1820 起</text><text x="48" y="655" font-size="25" fill="#176786" text-anchor="start">托马斯算术计；随后改进、量产</text><text x="48" y="692" font-size="21" fill="#172b45" text-anchor="start">原理之外，可靠性、制造与市场同样重要。</text><rect x="24" y="730" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="764" font-size="24" fill="#b34039" text-anchor="start">二战后</text><text x="48" y="805" font-size="25" fill="#176786" text-anchor="start">Curta：口袋里的纯机械计算器</text><text x="48" y="842" font-size="21" fill="#172b45" text-anchor="start">阶梯鼓的后代，不用电池也能做四则运算。</text><rect x="24" y="880" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="914" font-size="24" fill="#b34039" text-anchor="start">1961</text><text x="48" y="955" font-size="25" fill="#176786" text-anchor="start">ANITA 电子桌面计算器发布</text><text x="48" y="992" font-size="21" fill="#172b45" text-anchor="start">电子管时代的计算器，不是单芯片小机器。</text><rect x="24" y="1030" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="1064" font-size="24" fill="#b34039" text-anchor="start">1971</text><text x="48" y="1105" font-size="25" fill="#176786" text-anchor="start">Intel 4004 首次公开广告</text><text x="48" y="1142" font-size="21" fill="#172b45" text-anchor="start">为计算器开发芯片，推动微处理器发展。</text><rect x="24" y="1180" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="1214" font-size="24" fill="#b34039" text-anchor="start">1972</text><text x="48" y="1255" font-size="25" fill="#176786" text-anchor="start">HP-35 掌上科学计算器</text><text x="48" y="1292" font-size="21" fill="#172b45" text-anchor="start">三角、对数等函数进入衣兜。</text><rect x="24" y="1330" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="1364" font-size="24" fill="#b34039" text-anchor="start">1983</text><text x="48" y="1405" font-size="25" fill="#176786" text-anchor="start">SL-800：薄至 0.8 毫米</text><text x="48" y="1442" font-size="21" fill="#172b45" text-anchor="start">电子计算器不只变小，还向卡片的厚度靠近。</text><rect x="24" y="1480" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="1514" font-size="24" fill="#b34039" text-anchor="start">1985</text><text x="48" y="1555" font-size="25" fill="#176786" text-anchor="start">fx-7000G 绘图计算器</text><text x="48" y="1592" font-size="21" fill="#172b45" text-anchor="start">答案不只是一串数，还能是一幅函数图。</text><rect x="24" y="1630" width="672" height="132" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="1664" font-size="24" fill="#b34039" text-anchor="start">今天</text><text x="48" y="1705" font-size="25" fill="#176786" text-anchor="start">计算器也成为一种软件功能</text><text x="48" y="1742" font-size="21" fill="#172b45" text-anchor="start">科学、绘图、编程与专用计算器仍然并存。</text></svg>
