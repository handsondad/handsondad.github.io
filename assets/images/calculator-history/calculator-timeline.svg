<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1350" viewBox="0 0 540 1350" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">⑦ 不是一位天才，按下了所有时代的等号</title><desc id="desc">计算器发展精选时间线，区分通信记录、发明改进、量产、发布与软件时代。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="1348.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑦ 不是一位天才，按下了所有时代的等号</text><text x="36" y="89.52" font-size="16.7" fill="#172b45" text-anchor="start">精选路标，纵向间距不代表真实时间间隔</text><rect x="24" y="130" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="162.39" font-size="18.2" fill="#b34039" text-anchor="start">1623</text><text x="48" y="203.32" font-size="19.0" fill="#176786" text-anchor="start">席卡德的通信记录</text><text x="48" y="240.59" font-size="16.0" fill="#172b45" text-anchor="start">齿轮加减，配合纳皮尔算筹处理乘除。</text><rect x="24" y="280" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="312.39" font-size="18.2" fill="#b34039" text-anchor="start">1640 年代</text><text x="48" y="353.32" font-size="19.0" fill="#176786" text-anchor="start">帕斯卡计算器</text><text x="48" y="390.59" font-size="16.0" fill="#172b45" text-anchor="start">把加法与自动进位做成实际机器。</text><rect x="24" y="430" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="462.39" font-size="18.2" fill="#b34039" text-anchor="start">1673 起</text><text x="48" y="503.32" font-size="19.0" fill="#176786" text-anchor="start">莱布尼茨持续展示、改进计算机</text><text x="48" y="540.59" font-size="16.0" fill="#172b45" text-anchor="start">后来以阶梯鼓、滑架实现四则运算。</text><rect x="24" y="580" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="612.39" font-size="18.2" fill="#b34039" text-anchor="start">1820 起</text><text x="48" y="653.32" font-size="19.0" fill="#176786" text-anchor="start">托马斯算术计；随后改进、量产</text><text x="48" y="690.59" font-size="16.0" fill="#172b45" text-anchor="start">原理之外，可靠性、制造与市场同样重要。</text><rect x="24" y="730" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="762.39" font-size="18.2" fill="#b34039" text-anchor="start">二战后</text><text x="48" y="803.32" font-size="19.0" fill="#176786" text-anchor="start">Curta：口袋里的纯机械计算器</text><text x="48" y="840.59" font-size="16.0" fill="#172b45" text-anchor="start">阶梯鼓的后代，不用电池也能做四则运算。</text><rect x="24" y="880" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="912.39" font-size="18.2" fill="#b34039" text-anchor="start">1961</text><text x="48" y="953.32" font-size="19.0" fill="#176786" text-anchor="start">ANITA 电子桌面计算器发布</text><text x="48" y="990.59" font-size="16.0" fill="#172b45" text-anchor="start">电子管时代的计算器，不是单芯片小机器。</text><rect x="24" y="1030" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="1062.39" font-size="18.2" fill="#b34039" text-anchor="start">1971</text><text x="48" y="1103.32" font-size="19.0" fill="#176786" text-anchor="start">Intel 4004 首次公开广告</text><text x="48" y="1140.59" font-size="16.0" fill="#172b45" text-anchor="start">为计算器开发芯片，推动微处理器发展。</text><rect x="24" y="1180" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="1212.39" font-size="18.2" fill="#b34039" text-anchor="start">1972</text><text x="48" y="1253.32" font-size="19.0" fill="#176786" text-anchor="start">HP-35 掌上科学计算器</text><text x="48" y="1290.59" font-size="16.0" fill="#172b45" text-anchor="start">三角、对数等函数进入衣兜。</text><rect x="24" y="1330" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="1362.39" font-size="18.2" fill="#b34039" text-anchor="start">1983</text><text x="48" y="1403.32" font-size="19.0" fill="#176786" text-anchor="start">SL-800：薄至 0.8 毫米</text><text x="48" y="1440.59" font-size="16.0" fill="#172b45" text-anchor="start">电子计算器不只变小，还向卡片的厚度靠近。</text><rect x="24" y="1480" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="1512.39" font-size="18.2" fill="#b34039" text-anchor="start">1985</text><text x="48" y="1553.32" font-size="19.0" fill="#176786" text-anchor="start">fx-7000G 绘图计算器</text><text x="48" y="1590.59" font-size="16.0" fill="#172b45" text-anchor="start">答案不只是一串数，还能是一幅函数图。</text><rect x="24" y="1630" width="672" height="132" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="1662.39" font-size="18.2" fill="#b34039" text-anchor="start">今天</text><text x="48" y="1703.32" font-size="19.0" fill="#176786" text-anchor="start">计算器也成为一种软件功能</text><text x="48" y="1740.59" font-size="16.0" fill="#172b45" text-anchor="start">科学、绘图、编程与专用计算器仍然并存。</text></g></svg>
