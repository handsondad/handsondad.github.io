<svg xmlns="http://www.w3.org/2000/svg" width="540" height="645" viewBox="0 0 540 645" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">傅里叶的学习经历与热理论发展路标</title><desc id="desc">1795年学习、1807年报告、1811年参赛与1822年专著出版是不同阶段；现代傅里叶分析由后人持续发展。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="643.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">① 从研究热，到研究各种变化</text><rect x="24" y="86" width="672" height="109" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="119.32" font-size="19.0" fill="#176786" text-anchor="start">1768</text><text x="220" y="119.39" font-size="18.2" fill="#172b45" text-anchor="start">出生于欧塞尔</text><text x="48" y="166.45" font-size="17.5" fill="#172b45" text-anchor="start">后来经历教学、远征与行政工作。</text><rect x="24" y="211" width="672" height="109" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="244.32" font-size="19.0" fill="#176786" text-anchor="start">1795</text><text x="220" y="244.39" font-size="18.2" fill="#172b45" text-anchor="start">在巴黎师范学校学习</text><text x="48" y="291.45" font-size="17.5" fill="#172b45" text-anchor="start">听过拉格朗日、拉普拉斯与蒙日的课。</text><rect x="24" y="336" width="672" height="109" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="369.32" font-size="19.0" fill="#176786" text-anchor="start">1807</text><text x="220" y="369.39" font-size="18.2" fill="#172b45" text-anchor="start">报告固体中的热传播研究</text><text x="48" y="416.45" font-size="17.5" fill="#172b45" text-anchor="start">三角级数与推导的严密性引发争论。</text><rect x="24" y="461" width="672" height="109" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="494.32" font-size="19.0" fill="#176786" text-anchor="start">1811</text><text x="220" y="494.39" font-size="18.2" fill="#172b45" text-anchor="start">扩充论文参加热传播竞赛</text><text x="48" y="541.45" font-size="17.5" fill="#172b45" text-anchor="start">获奖肯定与对论证的保留意见并存。</text><rect x="24" y="586" width="672" height="109" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="619.32" font-size="19.0" fill="#176786" text-anchor="start">1822</text><text x="220" y="619.39" font-size="18.2" fill="#172b45" text-anchor="start">《热的解析理论》出版</text><text x="48" y="666.45" font-size="17.5" fill="#172b45" text-anchor="start">系统讨论热传播及三角级数方法。</text><text x="36" y="766.45" font-size="17.5" fill="#172b45" text-anchor="start">现代傅里叶分析经过许多人的后续完善。</text><text x="36" y="804.45" font-size="17.5" fill="#172b45" text-anchor="start">不是“一个人一次写出了今天所有频谱算法”。</text></g></svg>
