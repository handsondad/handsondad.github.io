<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">傅里叶的学习经历与热理论发展路标</title><desc id="desc">1795年学习、1807年报告、1811年参赛与1822年专著出版是不同阶段；现代傅里叶分析由后人持续发展。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="860" fill="#f3f7fa"/><text x="36" y="49" font-size="28" fill="#172b45" text-anchor="start">① 从研究热，到研究各种变化</text><rect x="24" y="86" width="672" height="109" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="121" font-size="25" fill="#176786" text-anchor="start">1768</text><text x="220" y="121" font-size="24" fill="#172b45" text-anchor="start">出生于欧塞尔</text><text x="48" y="168" font-size="23" fill="#172b45" text-anchor="start">后来经历教学、远征与行政工作。</text><rect x="24" y="211" width="672" height="109" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="246" font-size="25" fill="#176786" text-anchor="start">1795</text><text x="220" y="246" font-size="24" fill="#172b45" text-anchor="start">在巴黎师范学校学习</text><text x="48" y="293" font-size="23" fill="#172b45" text-anchor="start">听过拉格朗日、拉普拉斯与蒙日的课。</text><rect x="24" y="336" width="672" height="109" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="371" font-size="25" fill="#176786" text-anchor="start">1807</text><text x="220" y="371" font-size="24" fill="#172b45" text-anchor="start">报告固体中的热传播研究</text><text x="48" y="418" font-size="23" fill="#172b45" text-anchor="start">三角级数与推导的严密性引发争论。</text><rect x="24" y="461" width="672" height="109" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="496" font-size="25" fill="#176786" text-anchor="start">1811</text><text x="220" y="496" font-size="24" fill="#172b45" text-anchor="start">扩充论文参加热传播竞赛</text><text x="48" y="543" font-size="23" fill="#172b45" text-anchor="start">获奖肯定与对论证的保留意见并存。</text><rect x="24" y="586" width="672" height="109" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="621" font-size="25" fill="#176786" text-anchor="start">1822</text><text x="220" y="621" font-size="24" fill="#172b45" text-anchor="start">《热的解析理论》出版</text><text x="48" y="668" font-size="23" fill="#172b45" text-anchor="start">系统讨论热传播及三角级数方法。</text><text x="36" y="768" font-size="23" fill="#172b45" text-anchor="start">现代傅里叶分析经过许多人的后续完善。</text><text x="36" y="806" font-size="23" fill="#172b45" text-anchor="start">不是“一个人一次写出了今天所有频谱算法”。</text></svg>
