<svg xmlns="http://www.w3.org/2000/svg" width="720" height="919" viewBox="0 0 720 919" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">由傅里叶导热定律和能量守恒理解温度变化</title><desc id="desc">等间距的80、60、20摄氏度三处，右侧温度差大于左侧，流出更多，中段降温。箭头仅示意方向。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="919" fill="#f3f7fa"/><text x="36" y="49" font-size="28" fill="#172b45" text-anchor="start">② 一小段升温，还是降温？看收支</text><text x="36" y="96" font-size="23" fill="#172b45" text-anchor="start">等间距、同材料、同截面；三处温度：80、60、20 ℃。</text><text x="36" y="134" font-size="23" fill="#172b45" text-anchor="start">只看中间小段：左边流入，右边流出。</text><rect x="24" y="179" width="672" height="284" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><rect x="90" y="245" width="140" height="102" fill="#e1edf4" stroke="#172b45" stroke-width="2"/><text x="160" y="307" font-size="28" fill="#172b45" text-anchor="middle">80 ℃</text><rect x="290" y="245" width="140" height="102" fill="#e1edf4" stroke="#172b45" stroke-width="2"/><text x="360" y="307" font-size="28" fill="#172b45" text-anchor="middle">60 ℃</text><rect x="490" y="245" width="140" height="102" fill="#e1edf4" stroke="#172b45" stroke-width="2"/><text x="560" y="307" font-size="28" fill="#172b45" text-anchor="middle">20 ℃</text><path d="M230.000,296.000 L282.000,296.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><path d="M430.000,296.000 L482.000,296.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><text x="250" y="220" font-size="24" fill="#b34039" text-anchor="middle">流入</text><text x="450" y="220" font-size="24" fill="#b34039" text-anchor="middle">流出</text><text x="48" y="414" font-size="23" fill="#172b45" text-anchor="start">左温差 20；右温差 40 → 流出更多，中间降温。</text><rect x="24" y="498" width="672" height="266" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="545" font-size="23" fill="#172b45" text-anchor="start">① 温度向右下降，热流朝右。</text><text x="48" y="597" font-size="23" fill="#172b45" text-anchor="start">② 傅里叶定律：热流密度 = −导热率 × 温度梯度。</text><text x="48" y="649" font-size="23" fill="#172b45" text-anchor="start">③ 能量守恒：积累 = 流入 − 流出。</text><text x="48" y="701" font-size="23" fill="#172b45" text-anchor="start">合起来：温度随时间的变化，由空间弯曲程度决定。</text><text x="36" y="817" font-size="22" fill="#172b45" text-anchor="start">箭头只标方向，不按长度表示热流大小。</text><text x="36" y="855" font-size="22" fill="#172b45" text-anchor="start">这是一维局部收支示意；热传导定律不是波分解公式。</text></svg>
