<svg xmlns="http://www.w3.org/2000/svg" width="540" height="689.25" viewBox="0 0 540 689.25" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">由傅里叶导热定律和能量守恒理解温度变化</title><desc id="desc">等间距的80、60、20摄氏度三处，右侧温度差大于左侧，流出更多，中段降温。箭头仅示意方向。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="687.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">② 一小段升温，还是降温？看收支</text><text x="36" y="94.45" font-size="17.5" fill="#172b45" text-anchor="start">等间距、同材料、同截面；三处温度：80、60、20 ℃。</text><text x="36" y="132.45" font-size="17.5" fill="#172b45" text-anchor="start">只看中间小段：左边流入，右边流出。</text><rect x="24" y="179" width="672" height="284" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><rect x="90" y="245" width="140" height="102" fill="#e1edf4" stroke="#172b45" stroke-width="2"/><text x="160" y="304.80" font-size="20.2" fill="#172b45" text-anchor="middle" font-weight="700">80 ℃</text><rect x="290" y="245" width="140" height="102" fill="#e1edf4" stroke="#172b45" stroke-width="2"/><text x="360" y="304.80" font-size="20.2" fill="#172b45" text-anchor="middle" font-weight="700">60 ℃</text><rect x="490" y="245" width="140" height="102" fill="#e1edf4" stroke="#172b45" stroke-width="2"/><text x="560" y="304.80" font-size="20.2" fill="#172b45" text-anchor="middle" font-weight="700">20 ℃</text><path d="M230.000,296.000 L282.000,296.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M430.000,296.000 L482.000,296.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="250" y="218.39" font-size="18.2" fill="#b34039" text-anchor="middle">流入</text><text x="450" y="218.39" font-size="18.2" fill="#b34039" text-anchor="middle">流出</text><text x="48" y="412.45" font-size="17.5" fill="#172b45" text-anchor="start">左温差 20；右温差 40 → 流出更多，中间降温。</text><rect x="24" y="498" width="672" height="266" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="543.45" font-size="17.5" fill="#172b45" text-anchor="start">① 温度向右下降，热流朝右。</text><text x="48" y="595.45" font-size="17.5" fill="#172b45" text-anchor="start">② 傅里叶定律：热流密度 = −导热率 × 温度梯度。</text><text x="48" y="647.45" font-size="17.5" fill="#172b45" text-anchor="start">③ 能量守恒：积累 = 流入 − 流出。</text><text x="48" y="699.45" font-size="17.5" fill="#172b45" text-anchor="start">合起来：温度随时间的变化，由空间弯曲程度决定。</text><text x="36" y="815.52" font-size="16.7" fill="#172b45" text-anchor="start">箭头只标方向，不按长度表示热流大小。</text><text x="36" y="853.52" font-size="16.7" fill="#172b45" text-anchor="start">这是一维局部收支示意；热传导定律不是波分解公式。</text></g></svg>
