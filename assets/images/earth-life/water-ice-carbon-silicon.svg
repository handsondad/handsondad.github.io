<circle cx="126.8" cy="124.3" r="4.8" fill="#c25014" stroke="#ffffff" stroke-width="1.3"/>
<text x="136.8" y="127.3" font-size="10.3" fill="#c25014" text-anchor="start" font-weight="700" class="halo">峰值 4°C: 1.0000 g/cm³</text>
<text x="284.5" y="167.0" font-size="9.8" fill="#1d6fa5" text-anchor="middle" class="halo">液态水密度曲线(放大纵轴)</text>
<rect x="36" y="264" width="320" height="140" rx="8" fill="#f8fbff" stroke="#93c5fd" stroke-width="1"/>
<rect x="46" y="276" width="300" height="34" rx="5" fill="#e0f2fe" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="196.0" y="297" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">0°C 六方冰层：0.917 g/cm³（氢键撑开空笼，浮于水面隔寒）</text>
<rect x="46" y="316" width="300" height="76" rx="5" fill="#eaf4fb" stroke="none"/>
<text x="56" y="338" font-size="10.2" fill="#1e293b" text-anchor="start">• 0~4°C 水体：越接近 4°C 越重，自动下沉到湖底与深海</text>
<text x="56" y="358" font-size="10.2" fill="#c25014" text-anchor="start" font-weight="600">• 若冰和多数固体一样比液态重：冰会沉底、水体自下而上冻实！</text>
<text x="56" y="378" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700">• 4°C 液态深水层（1.000 g/cm³）：严冬与冰期水生生命的避难所</text>
<rect x="388" y="64" width="352" height="356" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 周期表同族对决：为什么是碳（₆C）不是硅（₁₄Si）？</text>
<rect x="404" y="106" width="320" height="134" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<rect x="416.0" y="116.0" width="182" height="22" rx="11.0" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="507.0" y="131.0" font-size="11.0" fill="#18794e" text-anchor="middle" font-weight="600">₆C 碳｜第2周期·4个共价键</text>
<text x="416" y="156" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="600">• C–C 键能 ≈ 346 kJ/mol（与 C–O、C–H 相近）：</text>
<text x="416" y="174" font-size="10.0" fill="#1e293b" text-anchor="start">  既牢靠搭出长链、环与双键，又可在酶促下温和拆装。</text>
<text x="416" y="195" font-size="10.3" fill="#18794e" text-anchor="start" font-weight="700">• 氧化产物 CO₂（独立小分子）：常温是可溶气体！</text>
<text x="416" y="213" font-size="10.0" fill="#1e293b" text-anchor="start">  碳能在大气、海洋、叶片与细胞间全行星自由流转。</text>
<rect x="404" y="252" width="320" height="134" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<rect x="416.0" y="262.0" width="182" height="22" rx="11.0" fill="#ffffff" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="507.0" y="277.0" font-size="11.0" fill="#c25014" text-anchor="middle" font-weight="600">₁₄Si 硅｜地壳质量远多于碳</text>
<text x="416" y="302" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="600">• Si–Si 键仅 ≈ 222 kJ/mol，Si–O 高达 ≈ 452：</text>
<text x="416" y="320" font-size="10.0" fill="#1e293b" text-anchor="start">  难成稳定双键；硅氢链遇水和氧易断裂并锁死成硅氧键。</text>
<text x="416" y="341" font-size="10.3" fill="#c25014" text-anchor="start" font-weight="700">• 氧化产物 SiO₂（三维网状晶体）：是石英砂岩石！</text>
<text x="416" y="359" font-size="10.0" fill="#1e293b" text-anchor="start">  不溶于水也没法随呼吸排出——总不能呼气吐一把沙子。</text>
<text x="404" y="405" font-size="9.9" fill="#64748b" text-anchor="start">注：解释有水有氧环境碳的优势，不排除极端环境异质化学。</text>
</svg>
