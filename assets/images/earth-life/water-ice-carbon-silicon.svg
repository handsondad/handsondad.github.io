<text x="262.0" y="251" font-size="10.0" fill="#64748b" text-anchor="middle" class="mono">16°C</text>
<line x1="352.0" y1="112.0" x2="352.0" y2="236.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="2 3"/>
<text x="352.0" y="251" font-size="10.0" fill="#64748b" text-anchor="middle" class="mono">24°C</text>
<line x1="82.0" y1="112.0" x2="82.0" y2="236.0" stroke="#475569" stroke-width="1.2"/>
<line x1="82.0" y1="236.0" x2="352.0" y2="236.0" stroke="#475569" stroke-width="1.2"/>
