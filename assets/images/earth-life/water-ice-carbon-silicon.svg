<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">液态水4摄氏度最大密度反常膨胀曲线与碳硅元素成键及氧化物对比图</title>
<desc id="desc">左图按Kell(1975)公式精确绘制0至24°C液态水密度曲线（在约4°C达1.0000 g/cm³峰值），对比0°C六方冰0.917 g/cm³浮于水面的护生机制；右图对比第14族碳（C-C键稳定、CO2为可溶气体）与硅（Si-O锁死、SiO2为石英固体）的分子差异。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .trace-line {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: drawLine 1.3s ease-out 1 both;
      }
      @keyframes drawLine {
        from { stroke-dashoffset: 1; }
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .trace-line { animation: none; }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="433" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">水与碳的分子偏爱：为什么冰浮在水面护住生命，而硅很难顶替碳？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图据 Kell (1975) 与 NIST 物性表绘制液态水 4°C 密度峰值与浮冰效应；右图对比碳与硅的化学键和氧化物。</text>
<rect x="20" y="64" width="352" height="356" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 水的反常膨胀：4°C 最重，结冰反轻 8.3%</text>
