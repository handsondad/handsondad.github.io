<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">暗淡年轻太阳悖论、碳酸盐—硅酸盐风化地质恒温器与雪球地球逃逸机制图</title>
<desc id="desc">左图按恒星演化模型绘制45亿年来太阳光度从约72%升至100%的曲线，并标注44亿年杰克山锆石与38-35亿年枕状熔岩液态水证据；右图展示火山脱气、硅酸盐风化、碳酸盐沉积构成的负反馈闭环，以及雪球地球火山CO2累积逃逸与百万年时间尺度边界。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .trace-line {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        animation: drawLine 1.3s ease-out 1 both;
      }
      @keyframes drawLine {
        from { stroke-dashoffset: 1; }
        to { stroke-dashoffset: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .trace-line { animation: none; }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="445" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">暗淡年轻太阳悖论：40 亿年前阳光弱近三成，地球靠什么没冻成死冰球？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图据恒星演化公式绘制太阳光度增长与古海洋证据；右图拆解硅酸盐风化负反馈及“雪球地球”火山逃逸。</text>
<rect x="20" y="64" width="344" height="368" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 太阳变亮曲线 vs 早期液态水铁证</text>
<rect x="68.0" y="116.0" width="159.5" height="174.0" fill="#eaf4fb" opacity="0.72"/>
<text x="147.7" y="131" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">若仅靠现代温室气体</text>
<text x="147.7" y="145" font-size="10.2" fill="#1d6fa5" text-anchor="middle">全球均温将跌破 0°C 冰点</text>
<line x1="68.0" y1="268.2" x2="344.0" y2="268.2" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="62" y="272.2" font-size="10.3" fill="#64748b" text-anchor="end" class="mono">70%</text>
<line x1="68.0" y1="224.8" x2="344.0" y2="224.8" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="62" y="228.8" font-size="10.3" fill="#64748b" text-anchor="end" class="mono">80%</text>
<line x1="68.0" y1="181.2" x2="344.0" y2="181.2" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="62" y="185.2" font-size="10.3" fill="#64748b" text-anchor="end" class="mono">90%</text>
<line x1="68.0" y1="137.8" x2="344.0" y2="137.8" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="62" y="141.8" font-size="10.3" fill="#64748b" text-anchor="end" class="mono">100%</text>
<line x1="68.0" y1="116.0" x2="68.0" y2="290.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="2 3"/>
<text x="68.0" y="306" font-size="10.2" fill="#64748b" text-anchor="middle">45亿年前</text>
<line x1="160.0" y1="116.0" x2="160.0" y2="290.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="2 3"/>
<text x="160.0" y="306" font-size="10.2" fill="#64748b" text-anchor="middle">30亿</text>
<line x1="252.0" y1="116.0" x2="252.0" y2="290.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="2 3"/>
<text x="252.0" y="306" font-size="10.2" fill="#64748b" text-anchor="middle">15亿</text>
<line x1="344.0" y1="116.0" x2="344.0" y2="290.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="2 3"/>
<text x="344.0" y="306" font-size="10.2" fill="#64748b" text-anchor="middle">今天</text>
<line x1="68.0" y1="116.0" x2="68.0" y2="290.0" stroke="#475569" stroke-width="1.2"/>
<line x1="68.0" y1="290.0" x2="344.0" y2="290.0" stroke="#475569" stroke-width="1.2"/>
<path d="M 68.00,260.67 L 72.60,259.19 L 77.20,257.70 L 81.80,256.20 L 86.40,254.68 L 91.00,253.14 L 95.60,251.59 L 100.20,250.03 L 104.80,248.45 L 109.40,246.86 L 114.00,245.25 L 118.60,243.62 L 123.20,241.98 L 127.80,240.32 L 132.40,238.64 L 137.00,236.95 L 141.60,235.24 L 146.20,233.51 L 150.80,231.76 L 155.40,230.00 L 160.00,228.22 L 164.60,226.42 L 169.20,224.60 L 173.80,222.76 L 178.40,220.90 L 183.00,219.02 L 187.60,217.12 L 192.20,215.21 L 196.80,213.27 L 201.40,211.30 L 206.00,209.32 L 210.60,207.32 L 215.20,205.29 L 219.80,203.24 L 224.40,201.17 L 229.00,199.08 L 233.60,196.96 L 238.20,194.81 L 242.80,192.64 L 247.40,190.45 L 252.00,188.23 L 256.60,185.99 L 261.20,183.72 L 265.80,181.42 L 270.40,179.10 L 275.00,176.74 L 279.60,174.36 L 284.20,171.95 L 288.80,169.51 L 293.40,167.05 L 298.00,164.55 L 302.60,162.02 L 307.20,159.45 L 311.80,156.86 L 316.40,154.23 L 321.00,151.57 L 325.60,148.88 L 330.20,146.15 L 334.80,143.39 L 339.40,140.59 L 344.00,137.75" fill="none" stroke="#c25014" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="trace-line"/>
<text x="279.6" y="164.4" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">太阳光度 L/L₀</text>
<circle cx="74.1" cy="258.7" r="5" fill="#18794e" stroke="#ffffff" stroke-width="1.4"/>
<circle cx="117.1" cy="244.2" r="5" fill="#18794e" stroke="#ffffff" stroke-width="1.4"/>
<line x1="74.1" y1="252.7" x2="82.1" y2="222.7" stroke="#18794e" stroke-width="1.2"/>
<text x="78.1" y="218.7" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700" class="halo">4.4 Ga 杰克山锆石</text>
<line x1="117.1" y1="250.2" x2="133.1" y2="266.2" stroke="#18794e" stroke-width="1.2"/>
<text x="123.1" y="278.2" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700" class="halo">3.8~3.5 Ga 枕状熔岩/古海洋</text>
<rect x="34" y="316" width="316" height="102" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="44" y="336" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">萨根与马伦（1972）揭开的矛盾与解答：</text>
<text x="44" y="355" font-size="10.3" fill="#1e293b" text-anchor="start">• 恒星核聚变使太阳核心平均分子量增大，每十亿年变亮约 7%–9%；</text>
<text x="44" y="373" font-size="10.3" fill="#1e293b" text-anchor="start">• 40 亿年前光度仅 ~74%，却有液态海！靠的是早期更高浓度的</text>
<text x="44" y="391" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="600">  CO₂、CH₄ 等温室气体，以及深色海洋较低的反照率。</text>
<rect x="380" y="64" width="360" height="368" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="396" y="88" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 碳酸盐—硅酸盐风化反馈（百万年尺度）</text>
<rect x="396" y="106" width="150" height="56" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="471.0" y="129" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="700">火山与变质脱气</text>
<text x="471.0" y="148" font-size="10.2" fill="#1e293b" text-anchor="middle">持续向大气补充 CO₂</text>
<rect x="574" y="106" width="150" height="56" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="649.0" y="129" font-size="11.2" fill="#18794e" text-anchor="middle" font-weight="700">偏暖多雨：风化加速</text>
<text x="649.0" y="148" font-size="10.2" fill="#1e293b" text-anchor="middle">雨水+CO₂ 蚀解硅酸盐岩</text>
<rect x="574" y="196" width="150" height="56" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="649.0" y="219" font-size="11.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">入海沉积锁碳降温</text>
<text x="649.0" y="238" font-size="10.0" fill="#1e293b" text-anchor="middle" class="mono">Ca²⁺+HCO₃⁻ → CaCO₃ 埋藏</text>
<rect x="396" y="196" width="150" height="56" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.3"/>
<text x="471.0" y="219" font-size="11.2" fill="#6d28d9" text-anchor="middle" font-weight="700">偏冷少雨：风化刹车</text>
<text x="471.0" y="238" font-size="10.2" fill="#1e293b" text-anchor="middle">消耗减慢 → CO₂ 重新攒高</text>
<line x1="549.0" y1="134.0" x2="569.0" y2="134.0" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<line x1="649.0" y1="165.0" x2="649.0" y2="191.0" stroke="#18794e" stroke-width="1.8" marker-end="url(#arr-green)"/>
<line x1="571.0" y1="224.0" x2="551.0" y2="224.0" stroke="#1d6fa5" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<line x1="471.0" y1="193.0" x2="471.0" y2="167.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-muted)"/>
<text x="560.0" y="183" font-size="10.2" fill="#475569" text-anchor="middle" font-weight="700" class="halo">负反馈稳定器</text>
<text x="560.0" y="274" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600">净反应简式：CaSiO₃（硅酸盐岩）+ CO₂ ⇌ CaCO₃（石灰岩）+ SiO₂</text>
<rect x="394" y="288" width="332" height="130" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="404" y="308" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">③ 当恒温器暂时失控：“雪球地球”怎样脱困？</text>
<text x="404" y="328" font-size="10.0" fill="#1e293b" text-anchor="start">• 约 7.2–6.35 亿年前冰雪反照率正反馈使冰盖推进至低纬；</text>
<text x="404" y="346" font-size="10.0" fill="#1e293b" text-anchor="start">• 冰层隔绝雨水与岩石，风化近停，但火山仍持续喷出 CO₂；</text>
<text x="404" y="364" font-size="10.0" fill="#1e293b" text-anchor="start">• 数百万年攒出超强温室融穿冰壳，留下厚层“盖帽碳酸盐岩”！</text>
<text x="404" y="384" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">• 警示：该调节耗时百万年，绝来不及抵消现代百年快速排碳！</text>
</svg>
