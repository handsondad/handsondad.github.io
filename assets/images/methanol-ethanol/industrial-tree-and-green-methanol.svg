<svg xmlns="http://www.w3.org/2000/svg" width="760" height="514" viewBox="0 0 760 514" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">甲醇与乙醇工业生产路线及五大核心用途全景图</title>
<desc id="desc">对比甲醇（合成气与绿色甲醇路线、甲醛树脂、MTO制烯烃、醋酸、防冻防堵及远洋船用燃料）与乙醇（发酵与乙烯水合、E10/E85高辛烷值燃料、医药香水双亲溶剂、医疗消毒解毒、低温冷浴与DNA沉淀、食品酿造）的全景用途。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="513" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">双醇工业帝国与零碳未来：一个撑起 C1 化工与远洋巨轮，一个横跨药房、实验室与油箱</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左栏看甲醇如何从煤/绿氢变成塑料与船用清洁燃料 → 右栏看乙醇如何凭双亲结构与高辛烷值通吃四大领域</text>
<rect x="24" y="68" width="348" height="430" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.3"/>
<rect x="38.0" y="80.0" width="320" height="24" rx="12.0" fill="#ccfbf1" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="198.0" y="96.3" font-size="11.6" fill="#0f766e" text-anchor="middle" font-weight="600">甲醇 CH₃OH：全球年产超亿吨的“C1 化工之母”</text>
<rect x="38" y="114" width="320" height="68" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
<text x="50" y="135" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">经典低压合成（ICI 铜锌铝催化）：CO + 2H₂ → CH₃OH</text>
<text x="50" y="156" font-size="11" fill="#0f766e" text-anchor="start" font-weight="700">零碳“液态阳光”路线：绿电制 H₂ + 捕集 CO₂ → 绿色甲醇</text>
<text x="50" y="174" font-size="10.5" fill="#64748b" text-anchor="start">（把难存难运的氢气与二氧化碳，锁进常温常压液体里！）</text>
<rect x="38" y="194" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38" y="194" width="5" height="50" rx="2.5" fill="#c25014"/>
<text x="52" y="214" font-size="11.4" fill="#c25014" text-anchor="start" font-weight="700">① 聚合物基石（甲醛·约占3成）</text>
<text x="52" y="233" font-size="10.6" fill="#1e293b" text-anchor="start">氧化制甲醛 → 脲醛/酚醛树脂、聚甲醛工程塑料（POM）</text>
<rect x="38" y="252" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38" y="252" width="5" height="50" rx="2.5" fill="#6d28d9"/>
<text x="52" y="272" font-size="11.4" fill="#6d28d9" text-anchor="start" font-weight="700">② MTO 煤/气制烯烃（中国王牌）</text>
<text x="52" y="291" font-size="10.6" fill="#1e293b" text-anchor="start">绕开石油！分子筛催化甲醇直产乙烯、丙烯造日用塑料</text>
<rect x="38" y="310" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38" y="310" width="5" height="50" rx="2.5" fill="#1d6fa5"/>
<text x="52" y="330" font-size="11.4" fill="#1d6fa5" text-anchor="start" font-weight="700">③ 冰醋酸与燃油添加剂</text>
<text x="52" y="349" font-size="10.6" fill="#1e293b" text-anchor="start">Cativa 法与 CO 合成乙酸；合成 MTBE、生物柴油酯交换</text>
<rect x="38" y="368" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38" y="368" width="5" height="50" rx="2.5" fill="#475569"/>
<text x="52" y="388" font-size="11.4" fill="#475569" text-anchor="start" font-weight="700">④ 防冻玻璃水与深海油气防堵</text>
<text x="52" y="407" font-size="10.6" fill="#1e293b" text-anchor="start">低冰点（-97.6℃）防结冰；注入海底管道防天然气水合物冰堵</text>
<rect x="38" y="426" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38" y="426" width="5" height="50" rx="2.5" fill="#18794e"/>
<text x="52" y="446" font-size="11.4" fill="#18794e" text-anchor="start" font-weight="700">⑤ 远洋双燃料巨轮与燃料电池</text>
<text x="52" y="465" font-size="10.6" fill="#1e293b" text-anchor="start">体积能量密度 15.6 MJ/L，几乎零硫氧化物，航运脱碳主力</text>
<rect x="388" y="68" width="348" height="430" rx="10" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.3"/>
<rect x="402.0" y="80.0" width="320" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="562.0" y="96.3" font-size="11.6" fill="#1d6fa5" text-anchor="middle" font-weight="600">乙醇 C₂H₅OH：横跨能源、医药与科研的“万能桥梁”</text>
<rect x="402" y="114" width="320" height="68" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="414" y="135" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">生物发酵法（占全球逾9成）：C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂↑</text>
<text x="414" y="156" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">石化水合法（高纯工业醇）：CH₂=CH₂ + H₂O → C₂H₅OH</text>
<text x="414" y="174" font-size="10.5" fill="#64748b" text-anchor="start">（无水乙醇需分子筛吸附打破 95.6% 共沸极限）</text>
<rect x="402" y="194" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402" y="194" width="5" height="50" rx="2.5" fill="#c25014"/>
<text x="416" y="214" font-size="11.4" fill="#c25014" text-anchor="start" font-weight="700">① 高辛烷值车用燃料（头号消耗）</text>
<text x="416" y="233" font-size="10.6" fill="#1e293b" text-anchor="start">E10/E85 汽油（RON 辛烷值≈108.6 抗爆震，能量密度 21–24 MJ/L）</text>
<rect x="402" y="252" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402" y="252" width="5" height="50" rx="2.5" fill="#1d6fa5"/>
<text x="416" y="272" font-size="11.4" fill="#1d6fa5" text-anchor="start" font-weight="700">② 药房与日化“万能双亲溶剂”</text>
<text x="416" y="291" font-size="10.6" fill="#1e293b" text-anchor="start">碘酊、止咳糖浆等逾 700 种液态药物辅料；香水定香快干</text>
<rect x="402" y="310" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402" y="310" width="5" height="50" rx="2.5" fill="#18794e"/>
<text x="416" y="330" font-size="11.4" fill="#18794e" text-anchor="start" font-weight="700">③ 医疗感控与甲醇中毒急救</text>
<text x="416" y="349" font-size="10.6" fill="#1e293b" text-anchor="start">70%–75% 表面及手部消毒；无甲吡唑时静脉/口服竞争解毒</text>
<rect x="402" y="368" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402" y="368" width="5" height="50" rx="2.5" fill="#6d28d9"/>
<text x="416" y="388" font-size="11.4" fill="#6d28d9" text-anchor="start" font-weight="700">④ 实验室超低温浴与 DNA 提纯</text>
<text x="416" y="407" font-size="10.6" fill="#1e293b" text-anchor="start">配干冰制 -78℃ 冷浴（凝固点 -114℃）；破坏水合层析出 DNA</text>
<rect x="402" y="426" width="320" height="50" rx="7" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<rect x="402" y="426" width="5" height="50" rx="2.5" fill="#b45309"/>
<text x="416" y="446" font-size="11.4" fill="#b45309" text-anchor="start" font-weight="700">⑤ 千年酿造饮品与风味酯合成</text>
<text x="416" y="465" font-size="10.6" fill="#1e293b" text-anchor="start">白酒/葡萄酒/啤酒灵魂成分；合成乙酸乙酯等食品果香香精</text>
</svg>
