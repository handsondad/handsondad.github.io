<svg xmlns="http://www.w3.org/2000/svg" width="760" height="342" viewBox="0 0 760 342" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">大模型指挥机械臂的三条路径与一道时间瓶颈</title>
<desc id="desc">直觉物理、仿真地基、真机示教三条路径共同支撑大模型控制机械臂，但都受限于思考期间真实世界不停顿的时间瓶颈。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="341" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 1 · 大模型指挥机械臂，靠的不是一条路，而是三条路加一道坎</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">统计直觉给计划，仿真地基给训练场，真机示教给最后一厘米；最后还要跨过“世界时钟”这一关</text>
<rect x="20" y="60" width="232" height="182" rx="10" fill="#ffffff" stroke="#1d6fa5" stroke-width="1"/>
<rect x="36.0" y="74.0" width="200" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="136.0" y="90.3" font-size="12.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">① 直觉物理</text>
<text x="136" y="126" font-size="12" fill="#1e293b" text-anchor="middle">从海量图文与视频里学到</text>
<text x="136" y="148" font-size="12" fill="#1e293b" text-anchor="middle">“看起来会怎样”的统计规律</text>
<text x="136" y="214" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">擅长：看懂场景、拆计划、定空间目标</text>
<path d="M136 244 L136 264" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<rect x="264" y="60" width="232" height="182" rx="10" fill="#ffffff" stroke="#18794e" stroke-width="1"/>
<rect x="280.0" y="74.0" width="200" height="24" rx="12.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="90.3" font-size="12.5" fill="#18794e" text-anchor="middle" font-weight="600">② 仿真地基</text>
<text x="380" y="126" font-size="12" fill="#1e293b" text-anchor="middle">CAD / 网格 / 物理引擎</text>
<text x="380" y="148" font-size="12" fill="#1e293b" text-anchor="middle">把“三维世界”变成可训练的环境</text>
<text x="380" y="214" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="600">擅长：生成数据、反复试错、迁移到真机</text>
<path d="M380 244 L380 264" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<rect x="508" y="60" width="232" height="182" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1"/>
<rect x="524.0" y="74.0" width="200" height="24" rx="12.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="624.0" y="90.3" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="600">③ 真机示教</text>
<text x="624" y="126" font-size="12" fill="#1e293b" text-anchor="middle">少量真机示范写进上下文</text>
<text x="624" y="148" font-size="12" fill="#1e293b" text-anchor="middle">边看边改、闭环纠错</text>
<text x="624" y="214" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">擅长：泛化到新任务、失败后换策略</text>
<path d="M624 244 L624 264" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-muted)"/>
<rect x="20" y="268" width="720" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="380" y="292" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">共同终点：把一句自然语言，变成机械臂一串正确的动作</text>
<text x="380" y="313" font-size="11.5" fill="#64748b" text-anchor="middle">但三条路都绕不开第四关——模型思考时，真实世界的时钟不会停（图 5）</text>
</svg>
