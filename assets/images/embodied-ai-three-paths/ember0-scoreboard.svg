<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">Ember-0 真机成绩单与 SenseNova 真机分组成功率</title>
<desc id="desc">XDOF Ember-0 总成功率从GPT-6 Astra（2026年10月）的19.6%提升到GPT-6.2 Astra（2026年11月）的41.2%；SenseNova对GPT-6-Astra在八种真机平台实测中刚性抓取17/18、柔性2/4、长程移动9/23、精确插接0/11；早期五模型宣称done时任务真完成仅57%，展平T恤前五模型0/143而6.2仅1/30。</desc>
