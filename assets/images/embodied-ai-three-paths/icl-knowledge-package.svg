<svg xmlns="http://www.w3.org/2000/svg" width="760" height="364" viewBox="0 0 760 364" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">上下文学习知识包内容与步数预算消融结果</title>
<desc id="desc">SenseNova对GPT-6-Astra的评测协议中，大模型研读示教后写入六类冻结知识包并在测试时检索适配；把步数预算放宽到10倍可让LIBERO等族成功率超过95%，代价约1M tokens和1小时每回合；消融显示ICL加VLA达54.17%，远高于VLA单独6.91%。</desc>
