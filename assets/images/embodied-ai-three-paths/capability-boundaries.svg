<svg xmlns="http://www.w3.org/2000/svg" width="760" height="378" viewBox="0 0 760 378" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">具身智能的四道工程边界与真实实测数据</title>
<desc id="desc">精确接触、柔性形变、长程遗忘、不可逆失败是具身智能落地的四道边界，图中给出SenseNova与XDOF的一手实测数字；结论是模型给出的假设必须接受真实测量检验。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="377" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图 6 · 四道边界：为什么“具身胜任”还不等于“实用具身智能”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">SenseNova 结论原话：已大体跨过 embodied competence，尚未跨过 practical embodied intelligence</text>
<rect x="20" y="60" width="720" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="20" y="60" width="6" height="56" rx="3" fill="#b34039"/>
<text x="40" y="82" font-size="12.5" fill="#b34039" text-anchor="start" font-weight="700">① 精确接触</text>
<text x="40" y="102" font-size="11.5" fill="#64748b" text-anchor="start">缺力觉反馈；夹面包 6.2 虽升至 27/30，毫米级盲插仍全败</text>
<text x="404" y="82" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">插头对孔真机 0/11；Ember-0 拿笔写字仅 5/30（17%）</text>
<rect x="20" y="124" width="720" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="20" y="124" width="6" height="56" rx="3" fill="#c25014"/>
<text x="40" y="146" font-size="12.5" fill="#c25014" text-anchor="start" font-weight="700">② 柔性形变</text>
<text x="40" y="166" font-size="11.5" fill="#64748b" text-anchor="start">知道要展开 ≠ 能管住四个角与不断变化的褶皱（打结仅 5/27）</text>
<text x="404" y="146" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">展平 T 恤：前五模型 0/143，6.2 首破零也仅 1/30（3.3%）</text>
<rect x="20" y="188" width="720" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="20" y="188" width="6" height="56" rx="3" fill="#6d28d9"/>
<text x="40" y="210" font-size="12.5" fill="#6d28d9" text-anchor="start" font-weight="700">③ 长程与遗忘</text>
<text x="40" y="230" font-size="11.5" fill="#64748b" text-anchor="start">多步长链条里小误差跨阶段累积，后一步常撞乱前一步成果</text>
<text x="404" y="210" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">移动取物 9/23；Ember-0 摆餐具 0/30、倒麦片 0/22</text>
<rect x="20" y="252" width="720" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<rect x="20" y="252" width="6" height="56" rx="3" fill="#1d6fa5"/>
<text x="40" y="274" font-size="12.5" fill="#1d6fa5" text-anchor="start" font-weight="700">④ 不可逆失败</text>
<text x="40" y="294" font-size="11.5" fill="#64748b" text-anchor="start">“画面看着像做完”与满足接触、支撑、时间窗口约束不是一回事</text>
<text x="404" y="274" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">自报 done 真完成仅 57%；捏碎薯片、煎焦鸡蛋无法重来</text>
<rect x="20" y="320" width="720" height="42" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="34" y="338" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">认识论不变：统计直觉 / 显式仿真 / 真实测量三件事不能混。</text>
<text x="34" y="356" font-size="11.5" fill="#64748b" text-anchor="start">模型给缩小范围的假设；真机传感器与人的判断，才是最终裁判。</text>
</svg>
