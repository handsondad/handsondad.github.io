<text x="656" y="194" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">气流托升</text>
<text x="656" y="212" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">冰晶 (+)</text>
<text x="432" y="280" font-size="11.5" fill="#1e293b" text-anchor="start">• T &lt; −15°C 时：霰粒冻结过冷水放热表面略暖，</text>
<text x="432" y="300" font-size="11.5" fill="#1e293b" text-anchor="start">  擦撞冷冰晶瞬间转移质子/电荷（每次约 33 fC）；</text>
<text x="432" y="320" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 重力与上升气流分道扬镳，拉开数公里巨型电容！</text>
<rect x="420" y="346" width="306" height="156" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.1"/>
<text x="432" y="368" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">GRAPES-3 宇宙线缪子透视 (PRL, 2019)：</text>
<text x="432" y="389" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 实测雷暴云总电势高达 1.3 GV（13 亿伏特）！</text>
<text x="432" y="409" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">• 充电功率 ≥ 2 GW（堪比两台核电机组满发）！</text>
<text x="432" y="431" font-size="11.5" fill="#1e293b" text-anchor="start">• 击穿之谜：云内宏观电场 (~200 kV/m) 远低于干</text>
<text x="432" y="451" font-size="11.5" fill="#1e293b" text-anchor="start">  空气击穿阈值 (3,000 kV/m)，全靠冰晶尖端增场</text>
<text x="432" y="471" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">  ＋ 宇宙线相对论逃逸电子雪崩（RREA）点火！</text>
