<rect x="420" y="110" width="306" height="224" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="432" y="131" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">绝不是“两朵云摩擦起电”！真实微观三主角：</text>
<circle cx="548.0" cy="208.0" r="38" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2.2"/>
<text x="548.0" y="204.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">重霰粒</text>
<text x="548.0" y="222.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">(~2mm, −)</text>
