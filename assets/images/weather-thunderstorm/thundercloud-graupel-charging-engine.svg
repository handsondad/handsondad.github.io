<rect x="0.5" y="0.5" width="759" height="529" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">三、云里既没铜线也没磁铁，凭什么攒出十亿伏高压？——霰冰碰撞起电引擎</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上升气流托着微冰晶往上跑，重霰粒往下砸：−15 °C 之上每次碰撞搬运约 33 飞库仑电荷</text>
