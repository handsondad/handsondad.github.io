<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">晴天积云500吨悬空力学与科勒曲线云凝结核激活原理图解</title>
<desc id="desc">左图展示暖湿气团按每公里9.8摄氏度绝热冷却在抬升凝结高度形成平云底，以及1立方公里积云含500吨水却因10微米水滴沉降仅每秒1.2厘米而悬空；右图精确计算科勒曲线，对比纯水开尔文曲率势垒与海盐凝结核在100.18%湿度激活成云。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="529" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、500 吨重的大白云为什么不掉下来？——绝热抬升、凝结核与科勒曲线</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">1 km³ 晴天积云重达 500 吨：靠 10 微米水滴每秒仅落 1.2 厘米悬空，靠吸湿盐核跨过曲率势垒</text>
<rect x="20" y="64" width="362" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="76.0" width="334" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="201.0" y="91.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 绝热抬升成云 + 500 吨白云悬空账</text>
<rect x="34" y="110" width="334" height="212" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="44" y="294" width="314" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
<text x="201" y="306" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">太阳晒热地面：暖湿气团 T=28°C, 露点 18°C</text>
<line x1="135" y1="290" x2="135" y2="232" stroke="#c25014" stroke-width="2.0" stroke-dasharray="4 3"/>
<line x1="201" y1="290" x2="201" y2="232" stroke="#c25014" stroke-width="2.0" stroke-dasharray="4 3"/>
<line x1="267" y1="290" x2="267" y2="232" stroke="#c25014" stroke-width="2.0" stroke-dasharray="4 3"/>
<text x="201" y="262" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">上升膨胀绝热冷却 (−9.8°C/km)</text>
<text x="201" y="281" font-size="11.5" fill="#1e293b" text-anchor="middle" class="halo">上升气流 w ≈ 100–200 cm/s</text>
<rect x="66" y="118" width="270" height="80" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2.0"/>
<text x="201" y="141" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">1 km³ 晴天积云（含水 0.5 g/m³）</text>
<text x="201" y="161" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">总水重 = 500 吨（≈ 100 头成年大象！）</text>
<text x="201" y="181" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">拆成 10¹⁴ 颗 10μm 微滴：沉降仅 1.2 cm/s！</text>
<line x1="46" y1="206" x2="356" y2="206" stroke="#1d6fa5" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="201" y="223" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">↑ 抬升凝结高度 LCL (~1.25km 达100%饱和→平云底)</text>
<rect x="34" y="334" width="334" height="168" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="46" y="355" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么云掉不下来，变大成雨滴却能砸下来？</text>
<text x="46" y="386" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">10 μm 云滴</text>
<rect x="138" y="374" width="16" height="15" rx="3" fill="#0f766e" fill-opacity="0.22" stroke="#0f766e" stroke-width="1.2"/>
<text x="46" y="403" font-size="11.5" fill="#1e293b" text-anchor="start">0.012 m/s (被微弱上升气流稳稳托住)</text>
<text x="46" y="426" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">100 μm 毛毛雨</text>
<rect x="138" y="414" width="84" height="15" rx="3" fill="#b45309" fill-opacity="0.22" stroke="#b45309" stroke-width="1.2"/>
<text x="46" y="443" font-size="11.5" fill="#1e293b" text-anchor="start">0.70 m/s  (开始缓慢飘落出云底)</text>
<text x="46" y="466" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">1 mm 标准雨滴</text>
<rect x="138" y="454" width="218" height="15" rx="3" fill="#1d6fa5" fill-opacity="0.22" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="46" y="483" font-size="11.5" fill="#1e293b" text-anchor="start">6.50 m/s  (冲破上升气流倾盆而下!)</text>
<rect x="396" y="64" width="344" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="410.0" y="76.0" width="316" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="568.0" y="91.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">B · 科勒曲线 (1936)：无凝结核湿透也难结云</text>
<line x1="456" y1="328.3" x2="722" y2="328.3" stroke="#e2e8f0" stroke-width="0.9"/>
<text x="450" y="332.3" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">99.5%</text>
<line x1="456" y1="259.5" x2="722" y2="259.5" stroke="#0f172a" stroke-width="1.4"/>
<text x="450" y="263.5" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">100.0%</text>
<line x1="456" y1="190.8" x2="722" y2="190.8" stroke="#e2e8f0" stroke-width="0.9"/>
<text x="450" y="194.8" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">100.5%</text>
<line x1="456" y1="122.0" x2="722" y2="122.0" stroke="#e2e8f0" stroke-width="0.9"/>
<text x="450" y="126.0" font-size="11.5" fill="#64748b" text-anchor="end" class="mono">101.0%</text>
<line x1="490.7" y1="122" x2="490.7" y2="342" stroke="#e2e8f0" stroke-width="0.8"/>
