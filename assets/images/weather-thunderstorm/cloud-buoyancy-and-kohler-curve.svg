<text x="422" y="454" font-size="11.5" fill="#1e293b" text-anchor="start">• 真实大气靠海盐、硫酸盐等“云凝结核 CCN”：</text>
<text x="422" y="474" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  溶质锁水拉平势垒，湿度刚过 100.2% 即刻成云！</text>
