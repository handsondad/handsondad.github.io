<rect x="410" y="392" width="316" height="110" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.1"/>
<text x="422" y="413" font-size="11.5" fill="#1e293b" text-anchor="start">• 纯净无尘空气：1 nm 胚胎表面弯曲极陡，水分子</text>
