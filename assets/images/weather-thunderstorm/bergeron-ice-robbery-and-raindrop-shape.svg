<text x="497" y="460" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">③ ~4.5 mm 巨型雨滴</text>
<text x="497" y="478" font-size="11.5" fill="#b45309" text-anchor="middle">底面凹陷成蚕豆伞状</text>
<rect x="578" y="394" width="138" height="96" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="630" cy="424" r="6" fill="#eaf4fb" stroke="#b91c1c" stroke-width="1.7"/>
<circle cx="650" cy="418" r="5" fill="#eaf4fb" stroke="#b91c1c" stroke-width="1.7"/>
