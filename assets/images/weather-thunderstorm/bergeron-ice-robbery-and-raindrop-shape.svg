<rect x="0.5" y="0.5" width="759" height="529" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">二、体积暴涨一百万倍才能下雨：冷云“冰晶夺水”与雨滴真实的汉堡包形状</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">单靠水汽扩散长成雨滴要熬十几个小时；大自然靠 −12 °C 冰晶抢水汽与暖云碰并走高速捷径</text>
