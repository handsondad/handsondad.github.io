<text x="260.0" y="140.8" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">黄金造雨温区 -12.0°C (27.0 Pa)</text>
<rect x="34" y="356" width="342" height="146" rx="8" fill="#f8fafc" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="46" y="377" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">中纬度大部分降雨，半空出生时其实是雪花！</text>
<text x="46" y="398" font-size="11.5" fill="#1e293b" text-anchor="start">① 0 至 −38°C 云层里，大量过冷水滴与少量冰晶共存；</text>
<text x="46" y="419" font-size="11.5" fill="#1e293b" text-anchor="start">② 冰面锁水更紧（蒸汽压低 13%），空气对水滴刚饱和，</text>
<text x="46" y="440" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">   对冰晶却严重过饱和 → 水汽从水滴蒸发直奔冰晶疯长；</text>
<text x="46" y="461" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">③ 冰晶粘连成雪片坠落，穿过 0°C 融化层化作大雨滴！</text>
<text x="46" y="482" font-size="11.5" fill="#64748b" text-anchor="start">   （碘化银人工增雨正是撒入仿冰晶格的“催化火种”）</text>
<rect x="404" y="64" width="336" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="418.0" y="76.0" width="308" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="572.0" y="91.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">B · 百万合一暖云碰并 &amp; 雨滴真实形状</text>
<rect x="418" y="110" width="308" height="132" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.1"/>
<text x="430" y="131" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">热带暖云（全在 0°C 以上）靠什么 20 分钟下雨？</text>
<text x="430" y="152" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 体积鸿沟：(1 mm / 10 μm)³ = 1,000,000 颗云滴！</text>
<text x="430" y="173" font-size="11.5" fill="#1e293b" text-anchor="start">• 大海盐核先造出少量 &gt;25 μm“领跑大水滴”，</text>
<text x="430" y="194" font-size="11.5" fill="#1e293b" text-anchor="start">  下落更快 → 像滚雪球一路追尾吞并下方小云滴，</text>
<text x="430" y="215" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">  越撞越大、越重越快，指数级加速冲破上升气流！</text>
<rect x="418" y="254" width="308" height="248" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="430" y="275" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="700">NASA GPM 实测：雨滴绝不是绘本里的“泪滴形”！</text>
<rect x="428" y="290" width="138" height="94" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="497" cy="324" r="13" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2"/>
<text x="497" y="356" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">① &lt; 1 mm 小雨滴</text>
<text x="497" y="374" font-size="11.5" fill="#1d6fa5" text-anchor="middle">表面张力主导：正圆球</text>
<rect x="578" y="290" width="138" height="94" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<path d="M 625,332 C 625,308 669,308 669,332 Z" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2"/>
