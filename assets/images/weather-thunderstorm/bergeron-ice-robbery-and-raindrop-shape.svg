<text x="647" y="460" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">④ &gt; 5 mm 气动极限</text>
<text x="647" y="478" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">张力兜不住：空中解体!</text>
