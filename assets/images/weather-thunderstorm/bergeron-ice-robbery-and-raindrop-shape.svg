<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">冷云贝吉龙冰晶夺水蒸汽压差实算曲线、暖云碰并增长与NASA雨滴真实汉堡包形状演化图解</title>
<desc id="desc">左图按Buck饱和蒸汽压方程绘出0至-40°C水面与冰面蒸汽压差曲线，在-12.3°C达峰值26.9帕，解释冰晶吸干过冷水滴化雪成雨的机制；右图展示百万云滴暖云碰并，并给出小于1毫米圆球、2至3毫米汉堡包形、4.5毫米凹陷伞形及超5毫米空中解体的真实雨滴形态。</desc>
