<text x="674.1" y="402.2" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700" class="halo">声影盲区!</text>
<rect x="414" y="444" width="312" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="426" y="465" font-size="11.5" fill="#1e293b" text-anchor="start">• 对流层越往高处越冷，声速 c ∝ √T 上慢下快；</text>
<text x="426" y="486" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 声波向高空弯折翘起 → 20 km 外“只见闪电不闻雷”</text>
</svg>
