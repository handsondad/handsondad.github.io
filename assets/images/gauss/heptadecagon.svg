<svg xmlns="http://www.w3.org/2000/svg" width="760" height="374" viewBox="0 0 760 374" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">正十七边形与高斯的四次对折降次思路</title>
<desc id="desc">左图展示圆周17等分及顶点1与16对应的余弦线段；右图展示高斯将16个虚根按3的幂次重排后连续对折4次（16→8→4→2→1），每次仅解二次方程，从而只用四层平方根写出cos(2π/17)。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="373" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">正十七边形为什么能用尺规画出：16 个复根连续四次“对折”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">尺规交点最多解二次方程（只出平方根 √）。17 − 1 = 16 = 2⁴，恰好能对折 4 次，每次只解一个二次方程。</text>
<rect x="20" y="64" width="316" height="292" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="88" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">① 圆周 17 等分：上下对称配成余弦</text>
<circle cx="178" cy="202" r="80" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="86" y1="202" x2="272" y2="202" stroke="#cbd5e1" stroke-width="1"/>
<polygon points="258.0,202.0 252.6,173.1 237.1,148.1 213.7,130.4 185.4,122.3 156.1,125.1 129.8,138.2 110.0,159.9 99.4,187.3 99.4,216.7 110.0,244.1 129.8,265.8 156.1,278.9 185.4,281.7 213.7,273.6 237.1,255.9 252.6,230.9" fill="#eaf4fb" fill-opacity="0.65" stroke="#1d6fa5" stroke-width="1.6"/>
<line x1="252.6" y1="173.1" x2="252.6" y2="230.9" stroke="#c25014" stroke-width="1.8" stroke-dasharray="3 2"/>
<line x1="178" y1="202" x2="252.6" y2="202" stroke="#c25014" stroke-width="2.2"/>
<circle cx="258.0" cy="202.0" r="4.2" fill="#c25014"/>
<text x="273.0" y="206.0" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">0</text>
<circle cx="252.6" cy="173.1" r="4.2" fill="#c25014"/>
<text x="266.6" y="171.7" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">1</text>
<circle cx="237.1" cy="148.1" r="2.8" fill="#1d6fa5"/>
<circle cx="213.7" cy="130.4" r="2.8" fill="#1d6fa5"/>
<circle cx="185.4" cy="122.3" r="2.8" fill="#1d6fa5"/>
<text x="186.8" y="111.4" font-size="11" fill="#64748b" text-anchor="middle">4</text>
<circle cx="156.1" cy="125.1" r="2.8" fill="#1d6fa5"/>
<circle cx="129.8" cy="138.2" r="2.8" fill="#1d6fa5"/>
<circle cx="110.0" cy="159.9" r="2.8" fill="#1d6fa5"/>
<circle cx="99.4" cy="187.3" r="2.8" fill="#1d6fa5"/>
<text x="84.6" y="188.5" font-size="11" fill="#64748b" text-anchor="middle">8</text>
<circle cx="99.4" cy="216.7" r="2.8" fill="#1d6fa5"/>
<text x="84.6" y="223.5" font-size="11" fill="#64748b" text-anchor="middle">9</text>
<circle cx="110.0" cy="244.1" r="2.8" fill="#1d6fa5"/>
<circle cx="129.8" cy="265.8" r="2.8" fill="#1d6fa5"/>
<circle cx="156.1" cy="278.9" r="2.8" fill="#1d6fa5"/>
<circle cx="185.4" cy="281.7" r="2.8" fill="#1d6fa5"/>
<text x="186.8" y="300.6" font-size="11" fill="#64748b" text-anchor="middle">13</text>
<circle cx="213.7" cy="273.6" r="2.8" fill="#1d6fa5"/>
<circle cx="237.1" cy="255.9" r="2.8" fill="#1d6fa5"/>
<circle cx="252.6" cy="230.9" r="4.2" fill="#c25014"/>
<text x="266.6" y="240.3" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">16</text>
<text x="178" y="326" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="600">目标：造出横坐标 cos(2π/17)（橙色水平段）</text>
<text x="178" y="344" font-size="11" fill="#64748b" text-anchor="middle">本图为精确坐标示意，右侧展示高斯的代数拆法</text>
<rect x="350" y="64" width="390" height="292" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="368" y="88" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">② 高斯周期拆解法：把 16 次方程拆成 4 层二次方程</text>
<rect x="368" y="102" width="354" height="36" rx="7" fill="#f1f5f9" stroke="#1e293b" stroke-width="1"/>
<text x="380" y="117" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">去掉顶点 0，剩 16 个对称顶点</text>
<text x="380" y="131" font-size="11" fill="#64748b" text-anchor="start">按 3ᵏ mod 17 重排顺序</text>
<rect x="660.0" y="109.0" width="52" height="21" rx="10.5" fill="#ffffff" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35"/>
<text x="686.0" y="123.3" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">16 项</text>
<line x1="545" y1="138" x2="545" y2="146" stroke="#64748b" stroke-width="1.2"/>
<rect x="368" y="146" width="354" height="36" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="380" y="161" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">第 1 次对折：分成两组各 8 项</text>
<text x="380" y="175" font-size="11" fill="#1d6fa5" text-anchor="start">t² + t − 4 = 0  →  出现 √17</text>
<rect x="660.0" y="153.0" width="52" height="21" rx="10.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="686.0" y="167.3" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">8 + 8</text>
<line x1="545" y1="182" x2="545" y2="190" stroke="#64748b" stroke-width="1.2"/>
<rect x="368" y="190" width="354" height="36" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="380" y="205" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">第 2 次对折：再拆成各 4 项</text>
<text x="380" y="219" font-size="11" fill="#1d6fa5" text-anchor="start">解二次方程  →  出现 √(34 − 2√17)</text>
<rect x="660.0" y="197.0" width="52" height="21" rx="10.5" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="686.0" y="211.3" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">4 + 4</text>
<line x1="545" y1="226" x2="545" y2="234" stroke="#64748b" stroke-width="1.2"/>
<rect x="368" y="234" width="354" height="36" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="380" y="249" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">第 3 次对折：拆成各 2 项</text>
<text x="380" y="263" font-size="11" fill="#18794e" text-anchor="start">再解二次方程  →  套上第 3 层 √</text>
<rect x="660.0" y="241.0" width="52" height="21" rx="10.5" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="686.0" y="255.3" font-size="11" fill="#18794e" text-anchor="middle" font-weight="600">2 + 2</text>
<line x1="545" y1="270" x2="545" y2="278" stroke="#64748b" stroke-width="1.2"/>
<rect x="368" y="278" width="354" height="36" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="380" y="293" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">第 4 次定位：锁定顶点 1 与 16</text>
<text x="380" y="307" font-size="11" fill="#c25014" text-anchor="start">得到 cos(2π/17)，尺规即可作出！</text>
<rect x="660.0" y="285.0" width="52" height="21" rx="10.5" fill="#ffffff" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="686.0" y="299.3" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">1 + 1</text>
<text x="368" y="341" font-size="11.5" fill="#64748b" text-anchor="start">反例：正七边形 7−1 = 6 = 2×3，卡在因子 3（需开立方），尺规无解</text>
</svg>
