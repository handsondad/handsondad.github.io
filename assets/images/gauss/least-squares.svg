  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="373" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">最小二乘法的几何直觉：把竖直误差变成“小正方形”，让总面积最小</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">横纵轴采用 1:1 等比例刻度，每个方块的真实面积严格等于该点误差的平方 eᵢ²（正负不再抵消）。</text>
<rect x="20" y="64" width="352" height="294" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="86" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">① 随手画一条偏斜直线：方块面积很大</text>
