<svg xmlns="http://www.w3.org/2000/svg" width="760" height="294" viewBox="0 0 760 294" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">高斯绝妙定理：曲率乘积决定能否无拉伸展平</title>
<desc id="desc">平纸片与卷起的披萨高斯曲率均为0，因此卷起横向可迫使纵向挺直；球面高斯曲率大于0，故地球表面无法无拉伸地摊平为地图。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="293" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">高斯的“绝妙定理”：为什么披萨弯着拿不塌，橘子皮却按不平？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">不拉伸、不撕裂地弯曲薄片时，两个主方向弯曲程度的乘积（高斯曲率 K = k₁ × k₂）保持不变。</text>
<rect x="20" y="64" width="230" height="212" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="86" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="600">① 平摊薄片：K = 0 × 0 = 0</text>
<polygon points="62,158 198,136 220,188 84,210" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<line x1="94" y1="168" x2="186" y2="153" stroke="#1d6fa5" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="132" y1="149" x2="150" y2="195" stroke="#18794e" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="135" y="240" font-size="11.5" fill="#1e293b" text-anchor="middle">横向 k₁ = 0，纵向 k₂ = 0</text>
<text x="135" y="260" font-size="11.5" fill="#64748b" text-anchor="middle">软披萨直接端：纵向一弯就塌</text>
<rect x="265" y="64" width="230" height="212" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="281" y="86" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="600">② 左右卷起：K = k₁ × 0 = 0</text>
<path d="M302,164 Q340,126 378,164 L448,194 Q415,168 386,194 Z" fill="#e7f6ee" stroke="#18794e" stroke-width="1.6"/>
<path d="M312,172 Q342,140 374,172" fill="none" stroke="#c25014" stroke-width="1.6"/>
<line x1="342" y1="150" x2="416" y2="181" stroke="#18794e" stroke-width="1.8"/>
<text x="380" y="240" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="600">横向弯了 k₁≠0  ⇒  纵向必保持 k₂=0</text>
<text x="380" y="260" font-size="11.5" fill="#64748b" text-anchor="middle">所以尖端挺直不塌！（无需拉伸饼皮）</text>
<rect x="510" y="64" width="230" height="212" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="526" y="86" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="600">③ 球面（地球）：K = 1/R² &gt; 0</text>
<circle cx="625" cy="166" r="46" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
<ellipse cx="625" cy="166" rx="46" ry="15" fill="none" stroke="#c25014" stroke-width="1.2" stroke-dasharray="4 3"/>
<ellipse cx="625" cy="166" rx="15" ry="46" fill="none" stroke="#c25014" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="625" y="240" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="600">两个方向都弯：K &gt; 0 ≠ 平面的 0</text>
<text x="625" y="260" font-size="11.5" fill="#64748b" text-anchor="middle">绝不可能无变形摊成平面地图</text>
</svg>
