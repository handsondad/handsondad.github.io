<text x="190.5" y="125.5" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">5</text>
<rect x="211" y="106" width="29" height="29" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
