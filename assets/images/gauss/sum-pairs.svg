<text x="558" y="251" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="600">宽 = n + 1 = 6 格</text>
<text x="476" y="178.0" font-size="12" fill="#0f172a" text-anchor="end" font-weight="600">高 n=5</text>
<rect x="444.0" y="260.0" width="122" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
