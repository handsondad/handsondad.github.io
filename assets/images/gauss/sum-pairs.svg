<text x="330.5" y="125.5" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">9</text>
<rect x="351" y="106" width="29" height="29" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="365.5" y="125.5" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">10</text>
<path d="M50.5,139 C50.5,249.0 365.5,249.0 365.5,139" fill="none" stroke="#1d6fa5" stroke-width="1.4" stroke-opacity="0.82"/>
<text x="208.0" y="232.5" font-size="11" fill="#1d6fa5" text-anchor="middle" class="halo">1+10=11</text>
<path d="M85.5,139 C85.5,226.0 330.5,226.0 330.5,139" fill="none" stroke="#1d6fa5" stroke-width="1.4" stroke-opacity="0.82"/>
<text x="208.0" y="215.2" font-size="11" fill="#1d6fa5" text-anchor="middle" class="halo">2+9=11</text>
<path d="M120.5,139 C120.5,203.0 295.5,203.0 295.5,139" fill="none" stroke="#1d6fa5" stroke-width="1.4" stroke-opacity="0.82"/>
<text x="208.0" y="198.0" font-size="11" fill="#1d6fa5" text-anchor="middle" class="halo">3+8=11</text>
<path d="M155.5,139 C155.5,180.0 260.5,180.0 260.5,139" fill="none" stroke="#1d6fa5" stroke-width="1.4" stroke-opacity="0.82"/>
<text x="208.0" y="180.8" font-size="11" fill="#1d6fa5" text-anchor="middle" class="halo">4+7=11</text>
<path d="M190.5,139 C190.5,157.0 225.5,157.0 225.5,139" fill="none" stroke="#1d6fa5" stroke-width="1.4" stroke-opacity="0.82"/>
<text x="208.0" y="163.5" font-size="11" fill="#1d6fa5" text-anchor="middle" class="halo">5+6=11</text>
<text x="36" y="298" font-size="12" fill="#64748b" text-anchor="start">5 对 × 11 = 55；同理 1 到 100 是 50 对 × 101 = 5050</text>
<rect x="420" y="64" width="320" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="438" cy="84" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="438" y="88" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="455" y="88" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">奇数项怎么办？复制一份倒扣成矩形</text>
