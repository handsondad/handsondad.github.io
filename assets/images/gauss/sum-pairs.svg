<svg xmlns="http://www.w3.org/2000/svg" width="760" height="338" viewBox="0 0 760 338" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">高斯配对求和与阶梯拼矩形</title>
<desc id="desc">左侧把1到10头尾配成5对，每对11，总和55；右侧把1到5的阶梯复制一份倒扣，拼成5乘6矩形，说明无论奇偶都有1+…+n=n(n+1)/2。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="337" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">求和不用硬加：头尾配对，或倒扣成整块长方形</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：偶数项头尾配成 5 对；右：奇数项（1 到 5）复制一份倒扣，拼成 5×6 长方形再除以 2。</text>
<rect x="20" y="64" width="386" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="55" y="88" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">偶数项：1 到 10 头尾配成 5 对，每对都是 11</text>
<rect x="36" y="106" width="29" height="29" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="50.5" y="125.5" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">1</text>
