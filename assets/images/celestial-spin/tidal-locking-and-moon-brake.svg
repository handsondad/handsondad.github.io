<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">月球1:1同步自转潮汐锁定对照动画及地月潮汐摩擦导致地球变慢月球远离机制图</title>
<desc id="desc">左面板对比真实月球（公转一圈自转一圈，红点始终朝向地球）与假想不自转月球（红点朝向固定星空，半月后露出背面）；右面板展示地球快自转将海水潮汐隆起带偏超前，反向刹慢地球（泥盆纪一天21.9小时）并以每年约3.8厘米推远月球。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#6d28d9"/>
  </marker>
  <marker id="arr-crimson" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#b91c1c"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes tl-orbit {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes tl-counter {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .tl-locked-arm {
        transform-origin: 112px 218px;
        animation: tl-orbit 8s ease-in-out 0.3s 1 forwards;
      }
      .tl-nospin-arm {
        transform-origin: 294px 218px;
        animation: tl-orbit 8s ease-in-out 0.3s 1 forwards;
      }
      .tl-keep-upright {
        transform-origin: 294px 158px;
        animation: tl-counter 8s ease-in-out 0.3s 1 forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        .tl-locked-arm, .tl-nospin-arm, .tl-keep-upright {
          animation: none !important;
          transform: none !important;
        }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="485" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">月球永远拿“正脸”看地球，是因为它不自转吗？潮汐锁定与地球刹车</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左看单次对照动画：不自转反而会露出后脑勺；右看海洋潮汐摩擦如何把地球每天拖慢、把月球推远</text>
<rect x="16" y="68" width="376" height="402" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="28.0" y="80.0" width="348" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="202.0" y="96.3" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">破解直觉误区：为什么“永远露正脸”恰恰证明月球在自转？</text>
<text x="112.0" y="130" font-size="11" fill="#18794e" text-anchor="middle" font-weight="700">✅ 真实月球：公转1圈 = 自转1圈</text>
<circle cx="112.0" cy="218.0" r="60.0" fill="none" stroke="#18794e" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="112.0" cy="218.0" r="14" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="112.0" y="222.0" font-size="10" fill="#1d6fa5" text-anchor="middle" font-weight="700">地球</text>
<circle cx="172.0" cy="218.0" r="10" fill="#e7f6ee" stroke="#18794e" opacity="0.35"/>
<circle cx="163.0" cy="218.0" r="3.2" fill="#b91c1c" opacity="0.65"/>
<circle cx="112.0" cy="278.0" r="10" fill="#e7f6ee" stroke="#18794e" opacity="0.35"/>
<circle cx="112.0" cy="269.0" r="3.2" fill="#b91c1c" opacity="0.65"/>
<circle cx="52.0" cy="218.0" r="10" fill="#e7f6ee" stroke="#18794e" opacity="0.35"/>
<circle cx="61.0" cy="218.0" r="3.2" fill="#b91c1c" opacity="0.65"/>
<g class="tl-locked-arm"><circle cx="112.0" cy="158.0" r="11" fill="#e7f6ee" stroke="#18794e" stroke-width="1.8"/><circle cx="112.0" cy="166.5" r="3.6" fill="#b91c1c"/></g>
<text x="112.0" y="302" font-size="10.3" fill="#1e293b" text-anchor="middle">红点（正面）每走 1/4 圈</text>
<text x="112.0" y="318" font-size="10.3" fill="#18794e" text-anchor="middle" font-weight="700">自身也同步转过 90° ⇒ 永远朝地!</text>
<text x="294.0" y="130" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">❌ 假如不自转：半个月就露背面!</text>
<circle cx="294.0" cy="218.0" r="60.0" fill="none" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="294.0" cy="218.0" r="14" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="294.0" y="222.0" font-size="10" fill="#1d6fa5" text-anchor="middle" font-weight="700">地球</text>
<circle cx="354.0" cy="218.0" r="10" fill="#fef2f2" stroke="#b91c1c" opacity="0.35"/>
<circle cx="354.0" cy="226.5" r="3.2" fill="#b91c1c" opacity="0.65"/>
<circle cx="294.0" cy="278.0" r="10" fill="#fef2f2" stroke="#b91c1c" opacity="0.35"/>
<circle cx="294.0" cy="286.5" r="3.2" fill="#b91c1c" opacity="0.65"/>
<circle cx="234.0" cy="218.0" r="10" fill="#fef2f2" stroke="#b91c1c" opacity="0.35"/>
<circle cx="234.0" cy="226.5" r="3.2" fill="#b91c1c" opacity="0.65"/>
<g class="tl-nospin-arm"><g class="tl-keep-upright"><circle cx="294.0" cy="158.0" r="11" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/><circle cx="294.0" cy="166.5" r="3.6" fill="#b91c1c"/></g></g>
<text x="294.0" y="302" font-size="10.3" fill="#1e293b" text-anchor="middle">红点死指宇宙同一方向：</text>
<text x="294.0" y="318" font-size="10.3" fill="#b91c1c" text-anchor="middle" font-weight="700">走到下方时地球直接看见月背!</text>
<rect x="28" y="336" width="352" height="120" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="40" y="358" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">潮汐锁定的本质（宇宙大卫星的共同宿命）：</text>
<text x="40" y="379" font-size="10.5" fill="#1e293b" text-anchor="start">• 早期月球自转飞快，地球引力把月球拉成微凸的“橄榄球”；</text>
<text x="40" y="398" font-size="10.5" fill="#1e293b" text-anchor="start">• 岩石反复揉搓发热耗散动能，直到隆起端死死对准地球（27.32天</text>
<text x="40" y="417" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">  转一圈 = 公转一圈）才停止摩擦；木星、土星的大卫星也全被锁定！</text>
<text x="40" y="439" font-size="10.0" fill="#64748b" text-anchor="start">  （注：天平动让我们累计能偷瞄到约 59% 的月面；支持减少动态效果）</text>
<rect x="404" y="68" width="340" height="402" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="416.0" y="80.0" width="314" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="573.0" y="96.3" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">地球也在被月球刹车：恐龙时代一年有 370 多天！</text>
<line x1="516.0" y1="198.0" x2="684.0" y2="198.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/>
<g transform="rotate(-20 516.0 198.0)"><ellipse cx="516.0" cy="198.0" rx="54" ry="34" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/></g>
<circle cx="516.0" cy="198.0" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<text x="516.0" y="196.0" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">地球快转</text>
<text x="516.0" y="211.0" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">24h 逆时针</text>
<text x="554.0" y="164.0" font-size="10" fill="#1d6fa5" text-anchor="start" font-weight="700">海水涨潮隆起被</text>
<text x="554.0" y="178.0" font-size="10" fill="#1d6fa5" text-anchor="start" font-weight="700">海床摩擦往前带偏!</text>
<circle cx="684.0" cy="198.0" r="14" fill="#fef1e8" stroke="#c25014" stroke-width="1.8"/>
<text x="684.0" y="202.0" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">月</text>
<line x1="684.0" y1="180.0" x2="684.0" y2="144.0" stroke="#18794e" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-green)"/>
<text x="678.0" y="138.0" font-size="10" fill="#18794e" text-anchor="end" font-weight="700">被斜前隆起往前拽</text>
<text x="700.0" y="226.0" font-size="10" fill="#c25014" text-anchor="end" font-weight="700">每年远离 ≈3.8cm</text>
<rect x="416" y="276" width="316" height="180" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
<text x="428" y="298" font-size="11.2" fill="#b45309" text-anchor="start" font-weight="700">铁证如山的地球“慢动作回放”（总角动量守恒）：</text>
<text x="428" y="320" font-size="10.5" fill="#1e293b" text-anchor="start">• 海底摩擦拖慢地球自转，损失的自转角动量传给月球公转，</text>
<text x="428" y="339" font-size="10.5" fill="#1e293b" text-anchor="start">  阿波罗激光角反射器实测月球正以每年约 3.8 cm 螺旋远离；</text>
<text x="428" y="361" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">• 4 亿年前泥盆纪珊瑚化石日生长纹显示：当时一年约 400 天，</text>
<text x="428" y="380" font-size="10.5" fill="#1e293b" text-anchor="start">  地球转一圈只要 21.9 小时！近几百年平均每世纪变长约 1.4–</text>
<text x="428" y="399" font-size="10.5" fill="#1e293b" text-anchor="start">  1.8 毫秒（1972 年以来原子钟已累计插入 27 次“闰秒”）；</text>
<text x="428" y="421" font-size="10.2" fill="#64748b" text-anchor="start">• 严谨补记：地核—地幔耦合与冰川融化偶尔会带来毫秒级短期</text>
<text x="428" y="439" font-size="10.2" fill="#64748b" text-anchor="start">  波动（如 2022 年 6 月 29 日曾比 24h 短了 1.59 毫秒，NIST）。</text>
</svg>
