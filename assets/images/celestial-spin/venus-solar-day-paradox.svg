<svg xmlns="http://www.w3.org/2000/svg" width="760" height="474" viewBox="0 0 760 474" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">恒星日与太阳日几何关系及金星243天逆向自转对应116.75天太阳日计算图</title>
<desc id="desc">左面板展示顺向自转的地球因公转需每天多转约4分钟追赶太阳，以及水星3:2共振导致1太阳日等于176天（2水星年）；右面板按真实角度187.05°公转与172.95°顺时针逆转，严格演示金星每116.75天重回正午。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#6d28d9"/>
  </marker>
  <marker id="arr-crimson" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#b91c1c"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="473" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">金星“度日如年”的算术反转：自转一圈 243 天，为什么白天黑夜一轮只要 116.8 天？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">恒星日（对遥远恒星转 360°）≠ 太阳日（太阳重回正午）：顺转要多追太阳，逆转反而迎面撞向太阳！</text>
<rect x="16" y="68" width="350" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="28.0" y="80.0" width="264" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="160.0" y="96.3" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">顺向自转（地球）：公转与自转同为逆时针</text>
<circle cx="92" cy="196" r="24" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
<text x="92" y="200" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">太阳</text>
<path d="M 246 256 A 164 164 0 0 0 246 136" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr-muted)"/>
<circle cx="252" cy="240" r="18" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.6"/>
<line x1="252.0" y1="240.0" x2="228.0" y2="240.0" stroke="#b91c1c" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-crimson)"/>
<text x="296" y="244" font-size="10.5" fill="#1e293b" text-anchor="start">第0天正午</text>
<circle cx="252" cy="152" r="18" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.6"/>
<line x1="252.0" y1="152.0" x2="228.0" y2="152.0" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
<line x1="252.0" y1="152.0" x2="230.0" y2="162.0" stroke="#b91c1c" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-crimson)"/>
<text x="302" y="148" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">转满360°后</text>
<text x="302" y="164" font-size="10.2" fill="#b91c1c" text-anchor="start" font-weight="600">还差约 1°(4分钟)</text>
<rect x="28" y="284" width="326" height="160" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="40" y="306" font-size="11.3" fill="#1d6fa5" text-anchor="start" font-weight="700">顺转追赶账（公转抵消了一小截自转）：</text>
<text x="40" y="329" font-size="10.8" fill="#1e293b" text-anchor="start">• 地球恒星日 T_sid = 23 小时 56 分 04 秒；</text>
<text x="40" y="350" font-size="10.8" fill="#1e293b" text-anchor="start">• 因一边自转一边逆时针公转，每天要多转约 0.986°</text>
<text x="40" y="370" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">  （多花 3 分 56 秒）才能让太阳重回头顶正午 = 24 小时！</text>
<text x="40" y="395" font-size="10.6" fill="#64748b" text-anchor="start">• 水星更极端：58.6 天自转配 88 天公转（3:2 共振），</text>
<text x="40" y="415" font-size="10.6" fill="#64748b" text-anchor="start">  在水星上熬过一个昼夜（太阳日），竟要整整 176 地球日</text>
<text x="40" y="433" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">  ——相当于在水星上“过一天等于过两年”！</text>
<rect x="378" y="68" width="366" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="390.0" y="80.0" width="282" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="531.0" y="96.3" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">逆向自转（金星）：公转逆时针 + 自转顺时针!</text>
<circle cx="561.0" cy="184.0" r="62.0" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="561.0" cy="184.0" r="18" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
<text x="561.0" y="188.0" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">太阳</text>
<circle cx="623.0" cy="184.0" r="12" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
<line x1="623.0" y1="184.0" x2="605.0" y2="184.0" stroke="#b91c1c" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-crimson)"/>
<text x="641.0" y="180.0" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">① t = 0 天</text>
<text x="641.0" y="196.0" font-size="10.2" fill="#c25014" text-anchor="start" font-weight="600">金星正午</text>
<circle cx="499.5" cy="191.6" r="12" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
<line x1="499.5" y1="191.6" x2="517.3" y2="189.4" stroke="#b91c1c" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-crimson)"/>
<text x="483.5" y="185.6" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="700">② t = 116.8 天</text>
<text x="483.5" y="201.6" font-size="10.2" fill="#b91c1c" text-anchor="end" font-weight="700">重回正午!</text>
<text x="561.0" y="112.0" font-size="10.2" fill="#6d28d9" text-anchor="middle" font-weight="600">公转逆时针跑半圈 + 自转顺时针倒半圈 = 半途提前撞见正午!</text>
<rect x="390" y="284" width="342" height="160" rx="8" fill="#fef1e8" stroke="#fdba74"/>
<text x="402" y="306" font-size="11.3" fill="#c25014" text-anchor="start" font-weight="700">一行公式统一所有顺转与逆转星球：</text>
<text x="402" y="330" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">1 / T_太阳日 = | 1 / T_自转 − 1 / T_公转 |（逆转取负号变相加!）</text>
<text x="402" y="354" font-size="10.8" fill="#1e293b" text-anchor="start">• 代入金星：1 / (-243.0天) − 1 / 224.7天 ⇒ 相加！</text>
<text x="402" y="376" font-size="10.8" fill="#b91c1c" text-anchor="start" font-weight="700">• 算出金星太阳日 T_太阳日 = 116.75 地球日（约 58.4 天白昼 +</text>
<text x="402" y="396" font-size="10.8" fill="#1e293b" text-anchor="start">  58.4 天黑夜）！所以在金星过 1 年（224.7天），能看近两次</text>
<text x="402" y="416" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">  “太阳从西边升起、东边落下”，绝不是网传的“一天比一年长”！</text>
</svg>
