<text x="572" y="261" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">海王星 · 倾角 28.3°</text>
<text x="646" y="355" font-size="10.6" fill="#1e293b" text-anchor="middle" font-weight="600">自转 16h 07m</text>
<rect x="28" y="380" width="346" height="78" rx="8" fill="#fef1e8" stroke="#fdba74"/>
<text x="40" y="401" font-size="11.3" fill="#c25014" text-anchor="start" font-weight="700">怪咖 ① 金星（倾角 177.4°）：太阳打西边出来！</text>
<text x="40" y="421" font-size="10.5" fill="#1e293b" text-anchor="start">早期巨型撞击 + 92 倍地球气压浓厚大气的“太阳热潮汐力矩”，</text>
<text x="40" y="440" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">把金星搓成了极其缓慢的倒转，赤道自转线速度仅 6.5 km/h（慢跑速）！</text>
<rect x="386" y="380" width="346" height="78" rx="8" fill="#f3e8ff" stroke="#d8b4fe"/>
<text x="398" y="401" font-size="11.3" fill="#6d28d9" text-anchor="start" font-weight="700">怪咖 ② 天王星（倾角 97.8°）：躺着滚完 84 年！</text>
<text x="398" y="421" font-size="10.5" fill="#1e293b" text-anchor="start">疑被地球级原行星斜撞放倒。虽然每 17.2 小时自转一圈，但南北极</text>
<text x="398" y="440" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="600">轮流直对太阳：一侧连晒 42 年极昼，另一侧连熬 42 年极夜！</text>
