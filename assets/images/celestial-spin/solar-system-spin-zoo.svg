<text x="468" y="355" font-size="10.6" fill="#b91c1c" text-anchor="middle" font-weight="700">自转 17h 14m（横躺!）</text>
<rect x="562" y="242" width="168" height="124" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/>
