<rect x="0.5" y="0.5" width="759" height="485" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">太阳系八大行星“自转怪咖图鉴”：正转、倒转与横躺着滚的星球</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">按 NASA 实测自转轴倾角（Obliquity）精确绘制：6 颗逆时针正转，唯独金星倒立逆转、天王星横躺打滚</text>
<rect x="16" y="68" width="728" height="402" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="32" y="92" font-size="11.2" fill="#64748b" text-anchor="start">灰色水平虚线 = 绕太阳公转轨道面；带箭头斜轴 = 北自转轴指向（右手法则拇指朝向）：</text>
