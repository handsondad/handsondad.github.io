<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">康托尔的一一对应：正偶数配对与有理数蛇形编号</title>
<desc id="desc">左图把自然数n与正偶数2n逐一连线配对；右图在4乘4分数网格上沿斜对角蛇形路线依次编号1到9，遇到2/2等于1/1时跳过重复，说明全体正有理数也可数。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="355" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">康托尔的第一层震撼：无限怎么比大小？不数总数，只看“能不能一一牵手”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">有限集合里“部分一定小于整体”；但在无限集合里，偶数、甚至密密麻麻的全体正分数，都能和自然数排成一队！</text>
<rect x="20" y="62" width="336" height="278" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="600">① 正偶数明明少了一半，却和自然数“一样多”</text>
<rect x="37" y="106" width="38" height="32" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="56" y="127" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">1</text>
<line x1="56" y1="140" x2="56" y2="184" stroke="#18794e" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="68" y="166" font-size="10.5" fill="#18794e" text-anchor="start">×2</text>
<rect x="37" y="188" width="38" height="32" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="56" y="209" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">2</text>
<rect x="91" y="106" width="38" height="32" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="110" y="127" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">2</text>
<line x1="110" y1="140" x2="110" y2="184" stroke="#18794e" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="122" y="166" font-size="10.5" fill="#18794e" text-anchor="start">×2</text>
<rect x="91" y="188" width="38" height="32" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="110" y="209" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">4</text>
<rect x="145" y="106" width="38" height="32" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="164" y="127" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">3</text>
<line x1="164" y1="140" x2="164" y2="184" stroke="#18794e" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="176" y="166" font-size="10.5" fill="#18794e" text-anchor="start">×2</text>
<rect x="145" y="188" width="38" height="32" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="164" y="209" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">6</text>
<rect x="199" y="106" width="38" height="32" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="218" y="127" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">4</text>
<line x1="218" y1="140" x2="218" y2="184" stroke="#18794e" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="230" y="166" font-size="10.5" fill="#18794e" text-anchor="start">×2</text>
<rect x="199" y="188" width="38" height="32" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="218" y="209" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">8</text>
<rect x="253" y="106" width="38" height="32" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="272" y="127" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">5</text>
<line x1="272" y1="140" x2="272" y2="184" stroke="#18794e" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="284" y="166" font-size="10.5" fill="#18794e" text-anchor="start">×2</text>
<rect x="253" y="188" width="38" height="32" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="272" y="209" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">10</text>
<text x="322" y="127" font-size="12.5" fill="#1d6fa5" text-anchor="start" font-weight="600">… n</text>
<text x="322" y="209" font-size="12.5" fill="#18794e" text-anchor="start" font-weight="600">… 2n</text>
<rect x="36" y="238" width="304" height="84" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="48" y="260" font-size="11.5" fill="#1e293b" text-anchor="start">• 每一个自然数 n，都有唯一的偶数 2n 配对</text>
<text x="48" y="281" font-size="11.5" fill="#1e293b" text-anchor="start">• 每一个正偶数，也都有唯一的座位号 n/2</text>
<text x="48" y="303" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="600">⇒ 双方谁也没剩下：它们同属“可数无限”！</text>
<rect x="370" y="62" width="370" height="278" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="386" y="84" font-size="12.8" fill="#0f172a" text-anchor="start" font-weight="600">② 分数密密麻麻？斜着走“蛇形路线”就能编号</text>
<polyline points="434,118 486,118 434,170 434,222 486,170 538,118 590,118 538,170 486,222 434,274" fill="none" stroke="#c25014" stroke-width="1.8" stroke-dasharray="4 3"/>
<rect x="413" y="104" width="42" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="434" y="122" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">1/1</text>
<circle cx="452" cy="106" r="8" fill="#1d6fa5"/>
<text x="452" y="109.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<rect x="465" y="104" width="42" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="486" y="122" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">1/2</text>
<circle cx="504" cy="106" r="8" fill="#1d6fa5"/>
<text x="504" y="109.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<rect x="517" y="104" width="42" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="538" y="122" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">1/3</text>
<circle cx="556" cy="106" r="8" fill="#1d6fa5"/>
<text x="556" y="109.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<rect x="569" y="104" width="42" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="590" y="122" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">1/4</text>
<circle cx="608" cy="106" r="8" fill="#1d6fa5"/>
<text x="608" y="109.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
<rect x="413" y="156" width="42" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="434" y="174" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">2/1</text>
<circle cx="452" cy="158" r="8" fill="#1d6fa5"/>
<text x="452" y="161.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<rect x="465" y="156" width="42" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="486" y="174" font-size="11.5" fill="#64748b" text-anchor="middle">2/2</text>
<text x="486" y="193" font-size="9.5" fill="#64748b" text-anchor="middle" class="halo">重复跳过</text>
<rect x="517" y="156" width="42" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="538" y="174" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">2/3</text>
<circle cx="556" cy="158" r="8" fill="#1d6fa5"/>
<text x="556" y="161.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
<rect x="569" y="156" width="42" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="590" y="174" font-size="11.5" fill="#64748b" text-anchor="middle">2/4</text>
<rect x="413" y="208" width="42" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="434" y="226" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">3/1</text>
<circle cx="452" cy="210" r="8" fill="#1d6fa5"/>
<text x="452" y="213.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<rect x="465" y="208" width="42" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="486" y="226" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">3/2</text>
<circle cx="504" cy="210" r="8" fill="#1d6fa5"/>
<text x="504" y="213.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">8</text>
<rect x="517" y="208" width="42" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="538" y="226" font-size="11.5" fill="#64748b" text-anchor="middle">3/3</text>
<rect x="569" y="208" width="42" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="590" y="226" font-size="11.5" fill="#0f172a" text-anchor="middle">3/4</text>
<rect x="413" y="260" width="42" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="434" y="278" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">4/1</text>
<circle cx="452" cy="262" r="8" fill="#1d6fa5"/>
<text x="452" y="265.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700">9</text>
<rect x="465" y="260" width="42" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="486" y="278" font-size="11.5" fill="#64748b" text-anchor="middle">4/2</text>
<rect x="517" y="260" width="42" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="538" y="278" font-size="11.5" fill="#0f172a" text-anchor="middle">4/3</text>
<rect x="569" y="260" width="42" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="590" y="278" font-size="11.5" fill="#64748b" text-anchor="middle">4/4</text>
<text x="650" y="278" font-size="15" fill="#64748b" text-anchor="start">…</text>
<text x="386" y="314" font-size="11" fill="#64748b" text-anchor="start">沿斜对角线依次扫描（跳过约分相等的重复项），</text>
<text x="386" y="330" font-size="11" fill="#64748b" text-anchor="start">哪怕任何两个分数之间还有无穷多个分数，也能排成一队！</text>
</svg>
