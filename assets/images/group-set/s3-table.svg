  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="373" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">六个动作的“乘法表”（凯莱表），以及伽罗瓦看到的方程根对称</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">查表口诀：先找上方的【第一步动作（列）】，再找左侧的【第二步动作（行）】，交叉格就是总结果。</text>
