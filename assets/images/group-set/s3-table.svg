<text x="278" y="235" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="600">← 先r后a = b</text>
<rect x="36" y="319" width="11" height="11" rx="2" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1"/>
<text x="52" y="329" font-size="11" fill="#64748b" text-anchor="start">浅橙底 18 格：颠倒顺序结果不同</text>
<text x="36" y="346" font-size="11" fill="#64748b" text-anchor="start">每行每列 6 个符号各出现 1 次（必有唯一撤销键）</text>
<rect x="400" y="62" width="340" height="294" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="416" y="84" font-size="13" fill="#0f172a" text-anchor="start" font-weight="600">② 伽罗瓦的绝招：方程的“根”也有对称群！</text>
<rect x="416" y="98" width="308" height="114" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="428" y="118" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">小样品：方程 x² − 2 = 0 的两个根  +√2  与  −√2</text>
<text x="428" y="140" font-size="11.5" fill="#1e293b" text-anchor="start">• 原样不动 e：(+√2) + (−√2) = 0，乘积 = −2</text>
<text x="428" y="160" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="600">• 互换两根 s：(−√2) + (+√2) = 0，乘积 = −2</text>
<text x="428" y="182" font-size="11.5" fill="#1e293b" text-anchor="start">只靠有理数加减乘除，根本分不清 +√2 和 −√2！</text>
<text x="428" y="200" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="600">⇒ 对称群只有 {e, s} 两个动作，一步开平方就能解开。</text>
<rect x="416" y="222" width="308" height="112" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="428" y="242" font-size="12" fill="#0f172a" text-anchor="start" font-weight="600">一般五次方程：5 个根最多有 5! = 120 种置换（S₅）</text>
<text x="428" y="264" font-size="11.5" fill="#1e293b" text-anchor="start">• 每开一次 n 次方根，只能削掉一层“可交换”的对称</text>
<text x="428" y="284" font-size="11.5" fill="#1e293b" text-anchor="start">• 伽罗瓦发现：S₅ 里藏着 60 个动作的“硬核” A₅，</text>
<text x="428" y="302" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="600">  它的动作高度不可交换，永远拆不成可交换的碎片！</text>
<text x="428" y="322" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">⇒ 所以一般五次方程绝不存在只靠根号的求根公式。</text>
</svg>
