<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" viewBox="0 0 760 368" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">康托尔对角线法：构造逃出任意无限清单的新序列</title>
<desc id="desc">左侧6乘6二进制矩阵标出橙色对角线011111，逐位取反得到蓝色逃逸序列100000；右侧逐行说明该序列在第n位必与第n行不同，证明全体无限0-1序列不可数。</desc>
