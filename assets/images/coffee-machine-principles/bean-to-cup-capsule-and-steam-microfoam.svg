<rect x="0.5" y="0.5" width="759" height="475" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一键全自动、胶囊机与蒸汽奶泡棒：机器怎样替掉咖啡师的双手？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左上：全自动步进冲泡器四连动作 · 左下：铝胶囊“憋够高压再破膜” · 右：18 克蒸汽潜热秒热冰奶与 65 °C 蛋白生死线</text>
<rect x="20" y="64" width="366" height="198" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="78.0" width="310" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="189.0" y="93.0" font-size="9.4" fill="#1d6fa5" text-anchor="middle" font-weight="600">① 全自动咖啡机（Bean-to-Cup）肚子里的机械手</text>
<rect x="32" y="110" width="80" height="96" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="72" y="130" font-size="8.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">1. 定量现磨</text>
<text x="72" y="156" font-size="8.1" fill="#0f172a" text-anchor="middle" font-weight="600">锥刀/平刀磨豆</text>
<text x="72" y="173" font-size="8.0" fill="#1e293b" text-anchor="middle">落入活动冲泡腔</text>
<line x1="112.0" y1="158.0" x2="118.0" y2="158.0" stroke="#475569" stroke-width="1.5"/>
<rect x="118" y="110" width="80" height="96" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="158" y="130" font-size="8.8" fill="#18794e" text-anchor="middle" font-weight="700">2. 丝杆压粉</text>
<text x="158" y="156" font-size="8.1" fill="#0f172a" text-anchor="middle" font-weight="600">步进电机推活塞</text>
<text x="158" y="173" font-size="8.0" fill="#1e293b" text-anchor="middle">施 ~200N 力压实</text>
<line x1="198.0" y1="158.0" x2="204.0" y2="158.0" stroke="#475569" stroke-width="1.5"/>
<rect x="204" y="110" width="80" height="96" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="244" y="130" font-size="8.8" fill="#c25014" text-anchor="middle" font-weight="700">3. 预浸+9bar</text>
<text x="244" y="156" font-size="8.1" fill="#0f172a" text-anchor="middle" font-weight="600">先润湿防通道</text>
<text x="244" y="173" font-size="8.0" fill="#1e293b" text-anchor="middle">再高压穿流萃取</text>
<line x1="284.0" y1="158.0" x2="290.0" y2="158.0" stroke="#475569" stroke-width="1.5"/>
<rect x="290" y="110" width="80" height="96" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="330" y="130" font-size="8.8" fill="#6d28d9" text-anchor="middle" font-weight="700">4. 顶饼扫渣</text>
<text x="330" y="156" font-size="8.1" fill="#0f172a" text-anchor="middle" font-weight="600">活塞上举干粉饼</text>
<text x="330" y="173" font-size="8.0" fill="#1e293b" text-anchor="middle">刮臂推入废渣盒</text>
<text x="34" y="226" font-size="8.7" fill="#1e293b" text-anchor="start">• 为什么全自动机芯大多建议定期拆洗？塑料活动冲泡腔内有滑轨与</text>
<text x="34" y="244" font-size="8.7" fill="#64748b" text-anchor="start">  O 形密封圈，咖啡油脂残留氧化会串味（商用机配自动药片反冲洗）。</text>
<rect x="20" y="274" width="366" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="288.0" width="338" height="22" rx="11.0" fill="#fffbeb" stroke="#b45309" stroke-width="1" stroke-opacity="0.35"/>
<text x="203.0" y="303.0" font-size="9.2" fill="#b45309" text-anchor="middle" font-weight="600">② 胶囊机（专利 US4136202A）：仅 5 克粉凭什么萃出厚油脂？</text>
<rect x="34" y="318" width="162" height="132" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<polygon points="90,330 98,330 94,344" fill="#475569"/>
<polygon points="111,330 119,330 115,344" fill="#475569"/>
<polygon points="132,330 140,330 136,344" fill="#475569"/>
<text x="115" y="326" font-size="7.9" fill="#1d6fa5" text-anchor="middle" font-weight="700">顶部三针刺破 (12–16 bar)</text>
<polygon points="84,342 146,342 160,404 70,404" fill="#fef3c7" stroke="#b45309" stroke-width="2.0"/>
<text x="115" y="370" font-size="8.3" fill="#78350f" text-anchor="middle" font-weight="700">充氮保鲜细粉</text>
<text x="115" y="387" font-size="8.1" fill="#dc2626" text-anchor="middle" font-weight="700">全密封憋起内压!</text>
<path d="M 70,404 Q 115,419 160,404" fill="none" stroke="#dc2626" stroke-width="2.2"/>
<polygon points="78,422 86,422 82,413" fill="#475569"/>
<polygon points="90,422 98,422 94,413" fill="#475569"/>
<polygon points="102,422 110,422 106,413" fill="#475569"/>
<polygon points="114,422 122,422 118,413" fill="#475569"/>
<polygon points="126,422 134,422 130,413" fill="#475569"/>
<polygon points="138,422 146,422 142,413" fill="#475569"/>
<polygon points="150,422 158,422 154,413" fill="#475569"/>
<text x="115" y="439" font-size="8.0" fill="#0f172a" text-anchor="middle" font-weight="700">薄铝膜鼓胀撞金字塔破膜!</text>
<text x="206" y="336" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="700">“先憋压、后破膜”两步巧思：</text>
<text x="206" y="356" font-size="8.5" fill="#1e293b" text-anchor="start">1. 刚注水时底部 40 μm 铝箔完</text>
<text x="206" y="373" font-size="8.5" fill="#1e293b" text-anchor="start">   全密封，一滴水也漏不出去，</text>
<text x="206" y="390" font-size="8.5" fill="#1d6fa5" text-anchor="start" font-weight="600">   强迫全部粉末 100% 浸润增压；</text>
<text x="206" y="410" font-size="8.5" fill="#1e293b" text-anchor="start">2. 等内压飙到阈值，铝膜向下鼓</text>
<text x="206" y="427" font-size="8.5" fill="#c25014" text-anchor="start" font-weight="600">   包抵住金字塔格栅均匀撕裂，</text>
<text x="206" y="444" font-size="8.5" fill="#18794e" text-anchor="start" font-weight="700">   免去填粉布粉失误，杯杯一致！</text>
<rect x="398" y="64" width="342" height="400" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="412.0" y="78.0" width="314" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="569.0" y="93.0" font-size="9.2" fill="#0f766e" text-anchor="middle" font-weight="600">③ 蒸汽打奶泡：2450 J/g 相变外挂 + 65 °C 蛋白质窗口</text>
<rect x="412" y="108" width="314" height="126" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.1"/>
<text x="424" y="128" font-size="9.2" fill="#0f766e" text-anchor="start" font-weight="700">为什么蒸汽棒十来秒就能烫热一整缸冰牛奶？</text>
<text x="424" y="147" font-size="8.6" fill="#1e293b" text-anchor="start">• 相变潜热外挂：把 200 g 冰奶 (5→62 °C) 加热需 44.8 kJ；</text>
<text x="424" y="164" font-size="8.6" fill="#0f172a" text-anchor="start" font-weight="700">  水蒸气凝结成水每克放热 ~2,451 J，仅凝结 18.3 g 蒸汽</text>
<text x="424" y="181" font-size="8.6" fill="#1e293b" text-anchor="start">  （水量仅增 ~9%）就能瞬间灌满热量，远快于灶台隔锅烧！</text>
<text x="424" y="200" font-size="8.5" fill="#1d6fa5" text-anchor="start" font-weight="700">• 两段手法：① &lt;37 °C 喷嘴贴液面“嗤嗤撕纸声”文丘里卷吸进气；</text>
<text x="424" y="217" font-size="8.5" fill="#0f766e" text-anchor="start" font-weight="700">  ② 随后喷嘴埋入液下造漩涡，把大气泡打碎成 &lt;50 μm 微米丝绒泡！</text>
<rect x="412.0" y="246.0" width="314.0" height="146.0" rx="7" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="613.8" y="266.0" width="32.8" height="102.0" fill="#e7f6ee"/>
<rect x="662.9" y="266.0" width="49.1" height="102.0" fill="#fef2f2"/>
<line x1="450.0" y1="368.0" x2="712.0" y2="368.0" stroke="#475569" stroke-width="1.2"/>
<line x1="450.0" y1="368.0" x2="450.0" y2="266.0" stroke="#475569" stroke-width="1.2"/>
<text x="446.0" y="274.0" font-size="8.1" fill="#64748b" text-anchor="end">奶泡</text>
<text x="446.0" y="286.0" font-size="8.1" fill="#64748b" text-anchor="end">质量</text>
<line x1="466.4" y1="368.0" x2="466.4" y2="372.0" stroke="#475569" stroke-width="1.0"/>
<text x="466.4" y="383.0" font-size="8.1" fill="#64748b" text-anchor="middle" class="mono">10°C</text>
<line x1="554.8" y1="368.0" x2="554.8" y2="372.0" stroke="#475569" stroke-width="1.0"/>
<text x="554.8" y="383.0" font-size="8.1" fill="#64748b" text-anchor="middle" class="mono">37°C</text>
<line x1="630.1" y1="368.0" x2="630.1" y2="372.0" stroke="#475569" stroke-width="1.0"/>
<text x="630.1" y="383.0" font-size="8.1" fill="#64748b" text-anchor="middle" class="mono">60°C</text>
<line x1="662.9" y1="368.0" x2="662.9" y2="372.0" stroke="#475569" stroke-width="1.0"/>
<text x="662.9" y="383.0" font-size="8.1" fill="#dc2626" text-anchor="middle" class="mono">70°C</text>
<line x1="695.6" y1="368.0" x2="695.6" y2="372.0" stroke="#475569" stroke-width="1.0"/>
<text x="695.6" y="383.0" font-size="8.1" fill="#dc2626" text-anchor="middle" class="mono">80°C</text>
<path d="M 450.0,331.3 L 453.3,331.3 L 456.6,331.4 L 459.8,331.4 L 463.1,331.5 L 466.4,331.7 L 469.6,331.9 L 472.9,332.2 L 476.2,332.7 L 479.5,333.3 L 482.8,334.1 L 486.0,335.1 L 489.3,336.3 L 492.6,337.8 L 495.9,339.5 L 499.1,341.5 L 502.4,343.5 L 505.7,345.7 L 508.9,347.8 L 512.2,349.7 L 515.5,351.4 L 518.8,352.6 L 522.0,353.4 L 525.3,353.7 L 528.6,353.4 L 531.9,352.6 L 535.1,351.3 L 538.4,349.6 L 541.7,347.6 L 545.0,345.4 L 548.2,343.2 L 551.5,340.9 L 554.8,338.7 L 558.1,336.7 L 561.4,334.7 L 564.6,332.8 L 567.9,331.0 L 571.2,329.2 L 574.5,327.2 L 577.7,325.1 L 581.0,322.8 L 584.3,320.2 L 587.5,317.2 L 590.8,313.8 L 594.1,310.1 L 597.4,306.0 L 600.6,301.6 L 603.9,297.0 L 607.2,292.3 L 610.5,287.6 L 613.8,283.1 L 617.0,278.9 L 620.3,275.2 L 623.6,272.2 L 626.9,270.1 L 630.1,270.1 L 633.4,270.1 L 636.7,270.1 L 640.0,270.1 L 643.2,272.2 L 646.5,275.2 L 649.8,278.9 L 653.0,285.6 L 656.3,294.8 L 659.6,305.3 L 662.9,316.5 L 666.1,327.7 L 669.4,338.4 L 672.7,348.4 L 676.0,357.5 L 679.2,359.8 L 682.5,359.8 L 685.8,359.8 L 689.1,359.8 L 692.4,359.8 L 695.6,359.8 L 698.9,359.8 L 702.2,359.8 L 705.5,359.8 L 708.7,359.8 L 712.0,359.8" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="625.2" y="262.0" font-size="8.1" fill="#18794e" text-anchor="middle" font-weight="700">55–65°C 黄金窗</text>
<text x="687.4" y="294.0" font-size="8.1" fill="#dc2626" text-anchor="middle" font-weight="700">&gt;70°C</text>
<text x="687.4" y="306.0" font-size="7.9" fill="#dc2626" text-anchor="middle" font-weight="700">聚沉破泡!</text>
<text x="412" y="411" font-size="8.6" fill="#1e293b" text-anchor="start">• β-乳球蛋白锁泡术：60 °C 左右乳清蛋白适度展开疏水基团，像救生圈</text>
<text x="412" y="428" font-size="8.6" fill="#1e293b" text-anchor="start">  一样牢牢裹住气液界面，且此时舌头对乳糖感知最甜；一旦飙过 70 °C，</text>
<text x="412" y="445" font-size="8.6" fill="#dc2626" text-anchor="start" font-weight="700">  二硫键不可逆交联聚沉并放出硫化物熟腥味，丝绒奶泡当场塌成粗肥皂泡！</text>
</svg>
