<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">水饱和蒸汽压死锁曲线与摩卡壶空气垫、现代意式咖啡机9bar温压解耦及黄金油脂成因图</title>
<desc id="desc">左图按Antoine方程精确绘制水的饱和蒸汽压曲线P_sat(T)：若靠纯蒸汽升至9 bar水温必高达175.4°C烫焦咖啡；对比手冲(1 bar, 93°C)、1901蒸汽机(1.8 bar, 118°C)、摩卡壶(靠封存空气在78-108°C推水)及现代意式浓缩(9 bar, 93°C机械解耦)；右图拆解摩卡壶见泡即停铁律与9 bar亨利定律CO2过饱和泄压生成Crema微泡乳液机制。</desc>
