<rect x="0.5" y="0.5" width="759" height="471" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么早期蒸汽机煮出的咖啡焦苦难咽？—— 饱和蒸汽死锁与“9 Bar 温压解耦”革命</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">靠烧蒸汽凑齐 9 bar 水温必飙到 175.4 °C 把粉烫糊！加吉亚与 E61 用机械活塞和水泵把“高压”与“93 °C”彻底拆开</text>
<rect x="20" y="64" width="404" height="394" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="78.0" width="374" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="221.0" y="93.0" font-size="9.4" fill="#1d6fa5" text-anchor="middle" font-weight="600">① 四大流派在“温度—压力相图”上的真实坐标（Antoine 方程实算）</text>
<rect x="34.0" y="110.0" width="374.0" height="258.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="145.6" y="130.0" width="19.3" height="210.0" fill="#e7f6ee" opacity="0.9"/>
<text x="155.3" y="142.0" font-size="8.1" fill="#18794e" text-anchor="middle" font-weight="700" class="mono">88–96°C</text>
<line x1="78.0" y1="320.9" x2="392.0" y2="320.9" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="72.0" y="324.4" font-size="8.3" fill="#64748b" text-anchor="end" class="mono">1 bar</text>
