    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes bubbleLift {
    0%   { transform: translateY(44px); opacity: 0.25; }
    20%  { opacity: 1.0; }
    100% { transform: translateY(0px); opacity: 1.0; }
  }
  .slug-train {
    animation: bubbleLift 3.2s ease-out 1 forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .slug-train {
      animation: none !important;
      transform: none !important;
      opacity: 1.0 !important;
    }
  }
</style>
<rect x="0.5" y="0.5" width="759" height="467" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">连水泵和电机都没有，百元美式滴滤壶凭什么把水送上 25 厘米高的头顶？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">靠一颗单向止回球阀 + 1600 倍蒸汽膨胀“气泡塞”向上顶水，再借双金属片干烧升温自动断电转保温</text>
<rect x="20" y="64" width="392" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="78.0" width="292" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="180.0" y="93.0" font-size="9.6" fill="#1d6fa5" text-anchor="middle" font-weight="600">① 无泵热虹吸气泡升水回路（专利 US4744291A）</text>
<rect x="34" y="110" width="364" height="248" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<rect x="48" y="148" width="68" height="146" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<rect x="50" y="184" width="64" height="108" rx="4" fill="#dbeafe"/>
<text x="82" y="168" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="700">冷水箱</text>
<text x="82" y="234" font-size="9.2" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="mono">20 °C</text>
<text x="82" y="251" font-size="8.6" fill="#1d6fa5" text-anchor="middle" font-weight="600">重力补水↓</text>
<path d="M 82,294 L 82,318 L 194,318" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
<path d="M 82,294 L 82,318 L 194,318" fill="none" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round"/>
<rect x="122" y="305" width="32" height="26" rx="5" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
<circle cx="135" cy="318" r="6.0" fill="#c25014"/>
<line x1="143.0" y1="318.0" x2="152.0" y2="318.0" stroke="#c25014" stroke-width="1.8"/>
<text x="138" y="298" font-size="8.7" fill="#c25014" text-anchor="middle" font-weight="700">① 单向止回阀</text>
<text x="138" y="346" font-size="8.3" fill="#dc2626" text-anchor="middle" font-weight="700">反压死锁防倒退!</text>
<rect x="192" y="308" width="92" height="22" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="238" y="323" font-size="8.6" fill="#dc2626" text-anchor="middle" font-weight="700">② 铝加热管 900W</text>
<text x="238" y="346" font-size="8.3" fill="#1e293b" text-anchor="middle">局部微沸腾产汽</text>
<rect x="290" y="310" width="96" height="20" rx="4" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="338" y="324" font-size="8.4" fill="#6d28d9" text-anchor="middle" font-weight="700">⑤ 双金属温控开关</text>
<path d="M 204,308 L 204,132 L 308,132 L 308,142" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 204,308 L 204,132 L 308,132 L 308,142" fill="none" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
