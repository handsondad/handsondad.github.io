<text x="671.5" y="274.7" font-size="8.1" fill="#64748b" text-anchor="middle" font-weight="600">淡而干涩</text>
<rect x="410" y="326" width="316" height="114" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="422" y="346" font-size="8.8" fill="#1d6fa5" text-anchor="start" font-weight="700">守恒铁律：萃取率 EY ≈ 浓度 TDS × (咖啡液重 ÷ 干粉重)</text>
<text x="422" y="367" font-size="8.6" fill="#0f172a" text-anchor="start" font-weight="700" class="mono">• 美式/手冲（液粉比 ~16:1）：TDS = 1.25% × 16 = 20% EY</text>
<text x="422" y="386" font-size="8.6" fill="#78350f" text-anchor="start" font-weight="700" class="mono">• 意式浓缩（液粉比  2:1）：TDS = 10.0% ×  2 = 20% EY</text>
<text x="422" y="406" font-size="8.5" fill="#1e293b" text-anchor="start">一句话顿悟：咖啡豆里只有约 30% 物质能溶于水，无论你用几百元</text>
<text x="422" y="423" font-size="8.5" fill="#18794e" text-anchor="start" font-weight="700">滴滤壶还是万元意式机，最好喝的甜平衡永远是只搬走其中 18%–22%！</text>
