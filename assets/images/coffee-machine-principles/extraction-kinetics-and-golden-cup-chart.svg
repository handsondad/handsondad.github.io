<text x="194.3" y="167.9" font-size="8.2" fill="#18794e" text-anchor="middle" font-weight="700">② 焦糖甜感+油脂</text>
<text x="318.1" y="190.0" font-size="8.2" fill="#6d28d9" text-anchor="middle" font-weight="700">③ 多酚涩苦</text>
<rect x="34" y="308" width="336" height="132" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="328" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="700">两个颠覆直觉的萃取真相（Moroney 2016 / Batali 2020）：</text>
<text x="46" y="348" font-size="8.6" fill="#1e293b" text-anchor="start">• 咖啡因其实是个“急性子”！咖啡因分子带强极性、极易溶</text>
<text x="46" y="365" font-size="8.6" fill="#c25014" text-anchor="start" font-weight="600">  于热水，前 8–10 秒就已被冲出大半；提前掐停做短萃 (Ristretto)</text>
<text x="46" y="382" font-size="8.6" fill="#1e293b" text-anchor="start">  少掉的主要是尾段大分子苦涩物，提神劲头其实没少多少！</text>
<text x="46" y="401" font-size="8.6" fill="#1e293b" text-anchor="start">• 为什么会有“尖酸”和“死苦”？太早关机只接了第①波果酸，</text>
<text x="46" y="418" font-size="8.6" fill="#1e293b" text-anchor="start">  缺第②波糖类圆场就酸得皱眉；拖太久细胞深孔慢扩散出第</text>
<text x="46" y="434" font-size="8.6" fill="#6d28d9" text-anchor="start" font-weight="700">  ③波苯基茚满与木质多酚，舌面唾液蛋白就会被抓出干涩感！</text>
<rect x="396" y="64" width="344" height="390" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="410.0" y="78.0" width="316" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
