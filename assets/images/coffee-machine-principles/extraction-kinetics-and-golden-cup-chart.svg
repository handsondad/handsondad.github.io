<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">万机归一的化学底层：为什么前段酸、中段甜、尾段涩？手冲与浓缩凭什么共用“20% 金杯律”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：极性决定的“果酸咖啡因 → 焦糖脂质 → 多酚苦涩”三波溶出赛跑 · 右：Lockhart / SCA 金杯控制图实算</text>
