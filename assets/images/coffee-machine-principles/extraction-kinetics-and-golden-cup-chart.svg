<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">咖啡三波极性分子溶出动力学曲线与Lockhart及SCA金杯控制图跨机型守恒对比图</title>
<desc id="desc">左图绘制意式30秒内三波风味溶出速率：第1波高极性果酸与亲水咖啡因前10秒快速冲出，第2波美拉德糖类与油脂在10-22秒带来甜醇平衡，第3波低极性多酚与苯基茚满在22秒后慢扩散造成干涩苦味；右图实算Lockhart金杯控制图(18%-22%萃取率与1.15%-1.35%滴滤TDS靶心)，并用质量守恒EY=TDS×液粉比揭示1.25%浓度的手冲与10%浓度的意式浓缩共享同一个20%黄金萃取率。</desc>
