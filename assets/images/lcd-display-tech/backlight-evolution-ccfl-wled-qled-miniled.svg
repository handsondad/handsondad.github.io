  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="455" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="28" font-size="16.2" fill="#0f172a" text-anchor="middle" font-weight="700">两座诺贝尔奖给液晶“续命封神”：量子点（QLED）提纯色彩，Mini-LED 驯服黑场</text>
<text x="380" y="48" font-size="11.5" fill="#64748b" text-anchor="middle">2014 物理诺奖蓝光 LED 淘汰汞灯管；2023 化学诺奖纳米晶砍掉杂色；千级微米分区灭灯逼近自发光对比度</text>
<rect x="24" y="62" width="346" height="194" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="72.0" width="307" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="191.5" y="87.0" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">光谱第 1 代：蓝光 LED + YAG 黄粉（普通白光 WLED）</text>
<line x1="54" y1="194" x2="346" y2="194" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<line x1="54" y1="108" x2="54" y2="194" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<path d="M 58 194 L 84 192 Q 100 188 108 116 Q 116 186 132 182 Q 175 126 226 132 Q 282 140 338 193 L 344 194 Z" fill="#fde68a" fill-opacity="0.55" stroke="#b45309" stroke-width="2"/>
<path d="M 88 193 Q 100 188 108 116 Q 116 186 128 192" fill="none" stroke="#1d6fa5" stroke-width="2.3"/>
<text x="108" y="110" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">450nm 蓝峰</text>
<text x="228" y="122" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">宽胖黄光包（FWHM ~110 nm）</text>
<text x="228" y="168" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">绿红连成一片，串色严重!</text>
<text x="58" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">400</text>
<text x="112" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">460</text>
<text x="180" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">530</text>
<text x="278" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">630</text>
<text x="336" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">700nm</text>
<text x="52" y="232" font-size="10.5" fill="#1e293b" text-anchor="start">• 2014 物理诺奖氮化镓蓝光 LED 让屏幕甩掉含汞 CCFL 灯管</text>
<text x="52" y="248" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">• 但黄粉光谱太宽，色域仅 ~50%–55% Rec.2020，正红偏橘</text>
<rect x="390" y="62" width="346" height="194" rx="12" fill="#ffffff" stroke="#18794e" stroke-width="1.5"/>
<rect x="404.0" y="72.0" width="290" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="549.0" y="87.0" font-size="11" fill="#18794e" text-anchor="middle" font-weight="600">光谱第 2 代：QLED 量子点薄膜（2023 化学诺奖纳米晶）</text>
<line x1="420" y1="194" x2="712" y2="194" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<line x1="420" y1="108" x2="420" y2="194" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>
<path d="M 454 194 Q 468 190 474 116 Q 480 190 494 194 Z" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="2.2"/>
<path d="M 526 194 Q 541 188 548 114 Q 555 188 570 194 Z" fill="#e7f6ee" stroke="#18794e" stroke-width="2.2"/>
<path d="M 620 194 Q 637 188 644 116 Q 651 188 668 194 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
<text x="474" y="109" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">蓝 LED</text>
<text x="548" y="109" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="700">~2.5nm 绿点</text>
<text x="644" y="109" font-size="9.8" fill="#dc2626" text-anchor="middle" font-weight="700">~6.5nm 红点</text>
<text x="424" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">400</text>
<text x="478" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">460</text>
<text x="548" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">532</text>
<text x="644" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">630</text>
<text x="702" y="209" font-size="9.5" fill="#64748b" text-anchor="middle">700nm</text>
<text x="404" y="232" font-size="10.3" fill="#1e293b" text-anchor="start">• 量子限域 ΔE ∝ 1/R²：改晶粒尺寸即可精准定制光色</text>
<text x="404" y="248" font-size="10.3" fill="#18794e" text-anchor="start" font-weight="700">• 半峰宽仅 20~30 nm，三峰独立，色域飙至 90%+ Rec.2020</text>
<rect x="24" y="270" width="346" height="174" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38.0" y="280.0" width="230" height="22" rx="11.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="153.0" y="295.0" font-size="11" fill="#475569" text-anchor="middle" font-weight="600">控光痛点：整板常亮背光 → 暗室看夜景“发灰漏光”</text>
<rect x="42" y="312" width="132" height="82" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.4"/>
<circle cx="108" cy="353" r="15" fill="#fef08a"/>
<text x="108" y="410" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">整块背光 100% 亮着</text>
<text x="108" y="427" font-size="9.8" fill="#64748b" text-anchor="middle">黑夜漏成 ~0.2 nit 灰雾</text>
<text x="188" y="332" font-size="10.6" fill="#1e293b" text-anchor="start">• 哪怕屏幕只有一轮明月，背后</text>
<text x="188" y="351" font-size="10.6" fill="#1e293b" text-anchor="start">  整张白光灯板也得火力全开</text>
<text x="188" y="372" font-size="10.6" fill="#1e293b" text-anchor="start">• 液晶百叶窗关不死 0.02%~0.1%</text>
<text x="188" y="391" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">  退偏振漏光，关灯看电影黑位泛白</text>
<text x="188" y="414" font-size="10.4" fill="#c25014" text-anchor="start" font-weight="700">• 注意：QLED 仍是液晶屏，不是自发光</text>
<rect x="390" y="270" width="346" height="174" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
<rect x="404.0" y="280.0" width="273" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="540.5" y="295.0" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="600">控光跃迁：Mini-LED 千级分区调光 → 该黑处彻底断电</text>
