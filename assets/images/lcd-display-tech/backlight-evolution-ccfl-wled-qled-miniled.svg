<text x="474" y="410" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="700">暗区灯珠直接 0 nit 熄灭</text>
<text x="474" y="427" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="700">亮区飙上 2000+ nit HDR</text>
<text x="554" y="332" font-size="10.5" fill="#1e293b" text-anchor="start">• 把灯珠缩到 100~200 μm，铺满</text>
<text x="554" y="351" font-size="10.5" fill="#1e293b" text-anchor="start">  上千至上万个独立棋盘调光分区</text>
<text x="554" y="372" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="700">• “分区背光粗调 + 液晶像素精调”</text>
<text x="554" y="391" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">  双级调制实现 12-bit 与十万比一对比</text>
<text x="554" y="414" font-size="10.3" fill="#64748b" text-anchor="start">• 唯一破绽：亮暗交界偶见微弱光晕</text>
