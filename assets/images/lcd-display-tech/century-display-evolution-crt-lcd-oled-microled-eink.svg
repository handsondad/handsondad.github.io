<svg xmlns="http://www.w3.org/2000/svg" width="760" height="468" viewBox="0 0 760 468" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">百年五代显示技术（CRT、LCD、OLED、Micro-LED、E-Ink）原理与工程指标全景对比图</title>
<desc id="desc">上方时间轴梳理1897年CRT显像管、1971年TN-LCD、1987年OLED、1997年E-Ink电泳电子纸到Micro-LED的五代演进；下方矩阵对比发光机制、黑场对比度、响应时间、亮度、形态与核心瓶颈，并定量算清4K Micro-LED四个九良率仍剩2488颗坏点的巨量转移挑战。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f172a"/>
  </marker>
  <marker id="arr-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#6d28d9"/>
  </marker>
  <marker id="arr-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#dc2626"/>
  </marker>
  <marker id="arr-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#0f766e"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="467" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="28" font-size="16.5" fill="#0f172a" text-anchor="middle" font-weight="700">百年屏幕五代同堂：从真空电子枪、液晶百叶窗到微米自发光与电子纸</text>
<text x="380" y="48" font-size="11.5" fill="#64748b" text-anchor="middle">没有哪块屏幕全科满分——看懂“控光尺度”与“材料寿命”的博弈，就看懂了一百三十年的显示进化史</text>
<rect x="24" y="62" width="131" height="88" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="89.5" y="82" font-size="10.2" fill="#475569" text-anchor="middle" font-weight="700">1897–1990s</text>
<text x="89.5" y="106" font-size="12.2" fill="#0f172a" text-anchor="middle" font-weight="700">CRT 显像管</text>
<text x="89.5" y="128" font-size="9.8" fill="#1e293b" text-anchor="middle">25kV 电子炮扫荧光粉</text>
<line x1="157" y1="106" x2="167" y2="106" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-muted)"/>
<rect x="169" y="62" width="131" height="88" rx="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="234.5" y="82" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">1971–至今</text>
<text x="234.5" y="106" font-size="12.2" fill="#0f172a" text-anchor="middle" font-weight="700">LCD 液晶家族</text>
<text x="234.5" y="128" font-size="9.8" fill="#1e293b" text-anchor="middle">背光 + 液晶电控光阀</text>
<line x1="302" y1="106" x2="312" y2="106" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-muted)"/>
<rect x="314" y="62" width="131" height="88" rx="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="379.5" y="82" font-size="10.2" fill="#6d28d9" text-anchor="middle" font-weight="700">1987 / 2010s+</text>
<text x="379.5" y="106" font-size="12.2" fill="#0f172a" text-anchor="middle" font-weight="700">OLED 有机自发光</text>
<text x="379.5" y="128" font-size="9.8" fill="#1e293b" text-anchor="middle">子像素独立亮灭 + 柔性</text>
<line x1="447" y1="106" x2="457" y2="106" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-muted)"/>
<rect x="459" y="62" width="131" height="88" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="524.5" y="82" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="700">1997 / 2007+</text>
<text x="524.5" y="106" font-size="12.2" fill="#0f172a" text-anchor="middle" font-weight="700">E-Ink 电子墨水</text>
<text x="524.5" y="128" font-size="9.8" fill="#1e293b" text-anchor="middle">带电微胶囊反射自然光</text>
<line x1="592" y1="106" x2="602" y2="106" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-muted)"/>
<rect x="604" y="62" width="131" height="88" rx="10" fill="#e7f6ee" stroke="#18794e" stroke-width="1.4"/>
<text x="669.5" y="82" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700">2020s–未来</text>
<text x="669.5" y="106" font-size="12.2" fill="#0f172a" text-anchor="middle" font-weight="700">Micro-LED</text>
<text x="669.5" y="128" font-size="9.8" fill="#1e293b" text-anchor="middle">&lt;50μm 无机晶粒终极屏</text>
<rect x="24" y="166" width="712" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="24" y="166" width="712" height="36" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="34" y="189" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">核心维度</text>
<text x="134" y="189" font-size="11" fill="#475569" text-anchor="start" font-weight="700">CRT 老彩电</text>
<text x="248" y="189" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="700">LCD / Mini-LED</text>
<text x="378" y="189" font-size="11" fill="#6d28d9" text-anchor="start" font-weight="700">OLED / QD-OLED</text>
<text x="508" y="189" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">Micro-LED</text>
<text x="632" y="189" font-size="11" fill="#0f766e" text-anchor="start" font-weight="700">E-Ink 电子纸</text>
<text x="34" y="224" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">发光机制</text>
<text x="134" y="224" font-size="10.2" fill="#1e293b" text-anchor="start">真空电子束轰击</text>
<text x="248" y="224" font-size="10.2" fill="#1e293b" text-anchor="start">背光灯 + 液晶阀门</text>
<text x="378" y="224" font-size="10.2" fill="#1e293b" text-anchor="start">有机薄膜电致发光</text>
<text x="508" y="224" font-size="10.2" fill="#1e293b" text-anchor="start">无机氮化镓自发光</text>
<text x="632" y="224" font-size="10.2" fill="#1e293b" text-anchor="start">微胶囊反射环境光</text>
<line x1="32" y1="238" x2="728" y2="238" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="34" y="259" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">黑场对比度</text>
<text x="134" y="259" font-size="10.2" fill="#1e293b" text-anchor="start">高（暗室纯正）</text>
<text x="248" y="259" font-size="10.2" fill="#1e293b" text-anchor="start">千比一至分区十万</text>
<text x="378" y="259" font-size="10.2" fill="#6d28d9" text-anchor="start" font-weight="700">∞:1（0 nit 断电黑）</text>
<text x="508" y="259" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700">∞:1（0 nit 断电黑）</text>
<text x="632" y="259" font-size="10.2" fill="#1e293b" text-anchor="start">类纸反射 (~15:1)</text>
<line x1="32" y1="273" x2="728" y2="273" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="34" y="294" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">像素响应</text>
<text x="134" y="294" font-size="10.2" fill="#1e293b" text-anchor="start">脉冲 &lt;0.01 ms</text>
<text x="248" y="294" font-size="10.2" fill="#1e293b" text-anchor="start">毫秒级 1~8 ms</text>
<text x="378" y="294" font-size="10.2" fill="#1e293b" text-anchor="start">微秒级 ~0.03 ms</text>
<text x="508" y="294" font-size="10.2" fill="#1e293b" text-anchor="start">纳秒级 ~ns</text>
<text x="632" y="294" font-size="10.2" fill="#1e293b" text-anchor="start">翻页 100~300 ms</text>
<line x1="32" y1="308" x2="728" y2="308" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="34" y="329" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">峰值亮度</text>
<text x="134" y="329" font-size="10.2" fill="#1e293b" text-anchor="start">100~200 nit</text>
<text x="248" y="329" font-size="10.2" fill="#1e293b" text-anchor="start">400~3000+ nit</text>
<text x="378" y="329" font-size="10.2" fill="#1e293b" text-anchor="start">800~3000 nit(叠层)</text>
<text x="508" y="329" font-size="10.2" fill="#1e293b" text-anchor="start">万至百万 nit(AR)</text>
<text x="632" y="329" font-size="10.2" fill="#1e293b" text-anchor="start">不发光(越晒越清)</text>
<line x1="32" y1="343" x2="728" y2="343" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="34" y="364" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">柔性形态</text>
<text x="134" y="364" font-size="10.2" fill="#1e293b" text-anchor="start">笨重防爆玻璃壳</text>
<text x="248" y="364" font-size="10.2" fill="#1e293b" text-anchor="start">刚性玻璃为主</text>
<text x="378" y="364" font-size="10.2" fill="#1e293b" text-anchor="start">可弯曲 / 三折叠屏</text>
<text x="508" y="364" font-size="10.2" fill="#1e293b" text-anchor="start">无缝拼接 / 透明屏</text>
<text x="632" y="364" font-size="10.2" fill="#1e293b" text-anchor="start">超薄柔性耐摔</text>
<line x1="32" y1="378" x2="728" y2="378" stroke="#e2e8f0" stroke-width="1.0" stroke-linecap="round"/>
<text x="34" y="399" font-size="10.2" fill="#0f172a" text-anchor="start" font-weight="700">头号瓶颈</text>
<text x="134" y="399" font-size="10.2" fill="#1e293b" text-anchor="start">体积硕大已淘汰</text>
<text x="248" y="399" font-size="10.2" fill="#1e293b" text-anchor="start">光效 ~6% / 微光晕</text>
<text x="378" y="399" font-size="10.2" fill="#1e293b" text-anchor="start">高亮有机蓝光老化</text>
<text x="508" y="399" font-size="10.2" fill="#18794e" text-anchor="start" font-weight="700">巨量转移良率地狱</text>
<text x="632" y="399" font-size="10.2" fill="#1e293b" text-anchor="start">难显示流畅视频</text>
<rect x="34" y="418" width="692" height="30" rx="6" fill="#e7f6ee" stroke="#bbf7d0" stroke-width="1"/>
<text x="380" y="438" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">为什么 Micro-LED 昂贵？4K 屏含 2488 万颗晶粒，99.99% 良率仍留 2488 颗坏点——须达 99.9999%（六个九）！</text>
</svg>
