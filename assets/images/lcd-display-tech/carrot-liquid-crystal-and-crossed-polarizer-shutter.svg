<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  @keyframes lcStandUp {
      0%, 18% { transform: scaleX(0.42) rotate(-32deg); opacity: 0.72; }
      58%, 100% { transform: scaleX(1) rotate(0deg); opacity: 1; }
    }
    @keyframes shutterBlockFade {
      0%, 18% { opacity: 0.85; }
      58%, 100% { opacity: 0.14; }
    }
    .anim-lc-shutter {
      transform-box: fill-box;
      transform-origin: center;
      animation: lcStandUp 4.2s cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
    }
    .anim-blocked-beam {
      animation: shutterBlockFade 4.2s ease-out 1 forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .anim-lc-shutter, .anim-blocked-beam {
        animation: none !important;
      }
    }
</style>
<rect x="0.5" y="0.5" width="759" height="455" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="28" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700">从胡萝卜“双熔点怪液”到拧光 90° 的液晶百叶窗</text>
<text x="380" y="48" font-size="12" fill="#64748b" text-anchor="middle">1888 年莱尼泽尔发现第四态物质；1971 年沙德特与赫尔弗里希把它夹进正交偏振片做成电控光阀</text>
<rect x="24" y="60" width="712" height="108" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
