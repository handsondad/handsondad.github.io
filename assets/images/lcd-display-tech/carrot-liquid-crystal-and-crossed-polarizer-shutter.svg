<text x="335" y="304" font-size="10.5" fill="#18794e" text-anchor="middle">顺畅通过</text>
<rect x="38" y="354" width="318" height="74" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
<text x="50" y="374" font-size="11" fill="#0f172a" text-anchor="start">• 上下配向膜沟槽互成 90°，迫使棒状分子排成旋转楼梯</text>
<text x="50" y="394" font-size="11" fill="#1e293b" text-anchor="start">• 满足波导条件 d·Δn = (√3/2)λ ≈ 0.48 μm 时，竖直偏振光</text>
<text x="50" y="414" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">  顺着分子长轴被拧成水平偏振，完美穿过 P2 呈现亮白</text>
