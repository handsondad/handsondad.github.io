<text x="187.0" y="83.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">第一步：为什么叫“液态晶体”？苯甲酸胆固醇酯的两次熔化（1888）</text>
<rect x="38" y="96" width="194" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="135" y="115" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">① 固态晶体 (&lt; 145.5 °C)</text>
<text x="135" y="134" font-size="11" fill="#1e293b" text-anchor="middle">位置锁死 + 方向整齐</text>
<text x="135" y="150" font-size="10.5" fill="#64748b" text-anchor="middle">刚性晶格，不能流动</text>
<line x1="236" y1="127" x2="272" y2="127" stroke="#c25014" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="254" y="116" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">145.5°C</text>
<text x="254" y="143" font-size="10" fill="#c25014" text-anchor="middle">初熔浑浊</text>
<rect x="278" y="96" width="208" height="62" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="382" y="115" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="700">② 液晶态 (145.5~178.5 °C)</text>
<text x="382" y="134" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">位置自由流动 + 长轴方向对齐</text>
<text x="382" y="150" font-size="10.5" fill="#1d6fa5" text-anchor="middle">兼具液体流动性与晶体双折射 Δn</text>
<line x1="490" y1="127" x2="526" y2="127" stroke="#6d28d9" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-purple)"/>
<text x="508" y="116" font-size="10.5" fill="#6d28d9" text-anchor="middle" font-weight="700">178.5°C</text>
<text x="508" y="143" font-size="10" fill="#6d28d9" text-anchor="middle">清亮化点</text>
<rect x="532" y="96" width="190" height="62" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="627" y="115" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">③ 清亮液体 (&gt; 178.5 °C)</text>
<text x="627" y="134" font-size="11" fill="#1e293b" text-anchor="middle">位置无序 + 方向随机乱撞</text>
<text x="627" y="150" font-size="10.5" fill="#64748b" text-anchor="middle">光学各向同性，失去旋光本领</text>
