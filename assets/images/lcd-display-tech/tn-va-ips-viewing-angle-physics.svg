<text x="380" y="48" font-size="11.6" fill="#64748b" text-anchor="middle">可视角度的本质是斜看时分子有效双折射 Δn_eff 会不会剧变：从翘头（TN）、多畴对倾（VA）到原地平转（IPS）</text>
