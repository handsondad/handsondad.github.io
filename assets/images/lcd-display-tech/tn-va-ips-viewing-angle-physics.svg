<svg xmlns="http://www.w3.org/2000/svg" width="760" height="444" viewBox="0 0 760 444" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">TN、VA与IPS三大液晶显示模式分子取向与可视角度物理解析图</title>
<desc id="desc">对比TN扭曲向列（分子斜翘导致上下视角双折射剧变而反色）、VA垂直配向（断电垂直立正实现3000:1至5000:1高对比度，加电多畴对称倾倒）与IPS/FFS平面转换（底部横向电场驱动分子水平旋转实现178度广视角）的电光差异。</desc>
