<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">地平线大气差异折射使日出太阳垂直压扁约17%的光路与相机实拍对比图</title>
<desc id="desc">左卡展示大气密度梯度导致太阳下缘抬升34.5角分、上缘抬升29.0角分；右卡按真实比例绘制同焦距减光相机下正午正圆（32.0×32.0角分）与日出扁椭圆（32.0×26.5角分）的像素宽度完全一致。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1d6fa5"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#c25014"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#18794e"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="489" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">拿同焦距相机给“车盖派”验伤：大气层不是放大镜，反而把朝阳拍扁了 17%！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">地平线大气折射把整轮太阳提前“拎”出地面，且下缘比上缘抬得更高，把正圆挤成扁鸭蛋</text>
<rect x="20" y="62" width="400" height="410" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">大气差异折射：为什么下缘抬升 34.5′、上缘只抬 29.0′？</text>
<path d="M 38 308 Q 210 278 398 326 L 398 352 L 38 352 Z" fill="#cbd5e1"/>
<path d="M 38 256 Q 210 226 398 274" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="5,4"/>
<path d="M 38 206 Q 210 176 398 224" fill="none" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="92" y="232" font-size="10.0" fill="#64748b" text-anchor="start">高层稀薄空气 n ≈ 1.00005</text>
<text x="92" y="282" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="600">近地稠密空气 n ≈ 1.00029</text>
<circle cx="84" cy="294" r="5.5" fill="#0f172a"/>
<text x="84" y="316" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="700">观测者</text>
<line x1="84.0" y1="294.0" x2="396.0" y2="294.0" stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="245" y="310" font-size="10.0" fill="#475569" text-anchor="middle">几何真地平线（无大气时此刻根本看不见太阳！）</text>
<circle cx="366" cy="322" r="20" fill="#fde68a" fill-opacity="0.45" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4,3"/>
<text x="306" y="342" font-size="10.2" fill="#d97706" text-anchor="end" font-weight="700">真实太阳位置</text>
<ellipse cx="366" cy="266" rx="20" ry="16.5" fill="#fb923c" fill-opacity="0.88" stroke="#dc2626" stroke-width="1.6"/>
<text x="338" y="250" font-size="10.4" fill="#dc2626" text-anchor="end" font-weight="700">视太阳虚像（已露出地平线）</text>
<path d="M 366 302 Q 230 264 84 294" fill="none" stroke="#c25014" stroke-width="1.8"/>
<path d="M 366 342 Q 230 284 84 294" fill="none" stroke="#dc2626" stroke-width="1.8"/>
<line x1="84.0" y1="294.0" x2="366.0" y2="249.5" stroke="#c25014" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/>
<line x1="84.0" y1="294.0" x2="366.0" y2="282.5" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/>
<rect x="36" y="364" width="368" height="94" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1.0"/>
<text x="48" y="384" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">戳破流传最广的伪科普：“清晨水汽像凸透镜放大了太阳”</text>
<text x="48" y="403" font-size="10.1" fill="#1e293b" text-anchor="start">• 空气密度下密上疏，光线向地面弯曲，人眼逆着切线看去像被抬高；</text>
<text x="48" y="421" font-size="10.1" fill="#1e293b" text-anchor="start">• 太阳下缘贴近最稠密空气层，向上抬升 34.5 角分；上缘仅抬升 29.0 角分；</text>
<text x="48" y="439" font-size="10.1" fill="#dc2626" text-anchor="start" font-weight="600">• 下巴往上挤了 5.5 角分，结果大气折射非但没放大，反而把太阳压扁了！</text>
<rect x="434" y="62" width="306" height="410" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="452" cy="84" r="10.5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="452" y="88" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">2</text>
<text x="470" y="88" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">铁证：同焦距减光相机实拍叠图</text>
<rect x="452" y="106" width="270" height="232" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
<line x1="533.0" y1="120.0" x2="533.0" y2="326.0" stroke="#475569" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4,3"/>
<line x1="641.0" y1="120.0" x2="641.0" y2="326.0" stroke="#475569" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4,3"/>
<circle cx="587" cy="176" r="54.0" fill="#fef08a" stroke="#facc15" stroke-width="1.8"/>
<text x="587" y="172" font-size="11.0" fill="#0f172a" text-anchor="middle" font-weight="700">正午日中</text>
<text x="587" y="190" font-size="10.2" fill="#1e293b" text-anchor="middle" class="mono">32.0′ × 32.0′</text>
<ellipse cx="587" cy="280" rx="54.0" ry="44.7" fill="#f97316" stroke="#fb923c" stroke-width="1.8"/>
<text x="587" y="276" font-size="11.0" fill="#fff" text-anchor="middle" font-weight="700">清晨日出</text>
<text x="587" y="294" font-size="10.0" fill="#ffedd5" text-anchor="middle" class="mono">宽 32.0′ × 高 26.5′</text>
<text x="464" y="134" font-size="10.0" fill="#93c5fd" text-anchor="start">← 水平宽度完全相等 →</text>
<text x="652" y="284" font-size="10.2" fill="#fca5a5" text-anchor="start" font-weight="700">压扁 17%</text>
<rect x="452" y="350" width="270" height="108" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.0"/>
<text x="464" y="370" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">像素尺量出来的真相：</text>
<text x="464" y="390" font-size="10.1" fill="#1e293b" text-anchor="start">1. 横向直径：早中晚恒为约 32 角分（0.53°），</text>
<text x="464" y="408" font-size="10.1" fill="#1e293b" text-anchor="start">   连小拇指指甲盖的一半宽度都不到；</text>
<text x="464" y="426" font-size="10.1" fill="#dc2626" text-anchor="start" font-weight="700">2. 纵向直径：日出时反而缩水约 1/6！</text>
<text x="464" y="444" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">⇒ “大如车盖”100% 发生在眼球之后的大脑里！</text>
</svg>
