<svg xmlns="http://www.w3.org/2000/svg" width="760" height="515" viewBox="0 0 760 515" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">两小儿辩日距离真相：地球自转与椭圆公转叠加下的春秋胜负反转图</title>
<desc id="desc">左卡演示地球6小时自转将北纬35.6度观测者向太阳拉近约5186公里；右卡揭示地球椭圆轨道在春秋两季6小时内产生正负10750公里的径向距离变化，使秋季正午更近而春季日出更近；底部指出两者均不足日地距离的万分之一。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1d6fa5"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#c25014"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#18794e"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
    
    <style>
      @keyframes rot6h {
        0%   { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      .anim-obs {
        transform-origin: 146px 226px;
        animation: rot6h 3.2s cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
      }
      @media (prefers-reduced-motion: reduce) {
        .anim-obs {
          animation: none !important;
          transform: none !important;
        }
      }
    </style>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="514" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">裁判第一锤：日出近还是正午近？连春天和秋天都会给出相反答案！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">单看地球自转正午拉近约 5186 km；但加上地球椭圆轨道 6 小时狂奔 ±10750 km，春秋季胜负直接反转</text>
<rect x="20" y="62" width="350" height="340" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">账本 A：地球自转 6 小时（正午拉近半个地球）</text>
<circle cx="146" cy="226" r="72" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.8"/>
<path d="M 146 154 A 72 72 0 0 0 146 298 Z" fill="#1e293b" fill-opacity="0.78"/>
<line x1="146.0" y1="144.0" x2="146.0" y2="308.0" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3"/>
<text x="110" y="231" font-size="10.5" fill="#f8fafc" text-anchor="middle" font-weight="600">黑夜</text>
<text x="180" y="231" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">白昼</text>
<line x1="348.0" y1="172.0" x2="252.0" y2="172.0" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<line x1="348.0" y1="226.0" x2="252.0" y2="226.0" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<line x1="348.0" y1="280.0" x2="252.0" y2="280.0" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="300" y="154" font-size="10.0" fill="#d97706" text-anchor="middle" font-weight="700">平行阳光（距日 1.5 亿 km）</text>
<circle cx="146" cy="154" r="5" fill="#94a3b8" stroke="#fff" stroke-width="1.2"/>
<text x="146" y="126" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">① 清晨 06:00 日出（晨昏线）</text>
<path d="M 146 140 A 86 86 0 0 1 232 226" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
<circle cx="218" cy="226" r="6.2" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2"/>
<g class="anim-obs"><circle cx="218" cy="226" r="6.2" fill="#dc2626" stroke="#fff" stroke-width="1.5"/></g>
<text x="228" y="244" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="700">② 正午 12:00</text>
<line x1="146.0" y1="226.0" x2="146.0" y2="326.0" stroke="#475569" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,3"/>
<line x1="218.0" y1="226.0" x2="218.0" y2="326.0" stroke="#dc2626" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3,3"/>
<line x1="146.0" y1="322.0" x2="218.0" y2="322.0" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-red)"/>
<text x="182.0" y="338" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">自转拉近 ≈ 5186 km</text>
<text x="36" y="362" font-size="10.0" fill="#1e293b" text-anchor="start">• 以孔子故里曲阜（北纬 35.6°）春分为例：赤道半径 6378 km，</text>
<text x="36" y="380" font-size="10.0" fill="#1e293b" text-anchor="start">  自转 6 小时把人朝太阳方向端近了 R·cos35.6° ≈ 5186 km。</text>
<text x="36" y="395" font-size="9.6" fill="#64748b" text-anchor="start">  （注：左图地球尺寸为看清几何刻意放大，非真实日地比例）</text>
<rect x="384" y="62" width="356" height="340" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="402" cy="84" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="402" y="88" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="420" y="88" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">账本 B：椭圆公转 6 小时（比地球半径大一倍！）</text>
<rect x="400" y="106" width="324" height="92" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.1"/>
<text x="412" y="126" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">1 月初近日点 1.471 亿 km（隆冬）↔ 7 月初远日点 1.521 亿 km</text>
<text x="412" y="145" font-size="10.0" fill="#1e293b" text-anchor="start">半年进出 500 万公里！春／秋分前后径向速度高达 ±1791 km/h：</text>
<text x="412" y="164" font-size="10.2" fill="#c25014" text-anchor="start" font-weight="700">• 06:00 → 12:00 仅 6 小时，公转改变日地距离 ±10750 km！</text>
<text x="412" y="183" font-size="10.1" fill="#dc2626" text-anchor="start" font-weight="700">• 公转 6 小时位移竟是自转拉近量（5186 km）的 2.07 倍！</text>
<rect x="400" y="210" width="324" height="82" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.1"/>
<text x="412" y="230" font-size="10.6" fill="#dc2626" text-anchor="start" font-weight="700">秋季早晨（9 月底至 10 月初，加速扑向近日点）：</text>
<text x="412" y="249" font-size="10.1" fill="#1e293b" text-anchor="start">公转拉近 10750 km ＋ 自转拉近 5186 km</text>
<text x="412" y="269" font-size="10.4" fill="#dc2626" text-anchor="start" font-weight="700">⇒ 正午比日出【近约 15900 km】！（体感派小儿胜）</text>
<rect x="400" y="302" width="324" height="86" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1.1"/>
<text x="412" y="322" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">春季早晨（3 月底至 4 月初，远离太阳奔向远日点）：</text>
<text x="412" y="341" font-size="10.1" fill="#1e293b" text-anchor="start">公转推远 10750 km － 自转拉近 5186 km</text>
<text x="412" y="361" font-size="10.4" fill="#1d6fa5" text-anchor="start" font-weight="700">⇒ 日出反而比正午【近约 5560 km】！（视觉派小儿翻盘）</text>
<rect x="20" y="414" width="720" height="86" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.2"/>
<rect x="36.0" y="424.0" width="292" height="22" rx="11.0" fill="#ccfbf1" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="182.0" y="439.0" font-size="11.2" fill="#0f766e" text-anchor="middle" font-weight="600">终极比例尺裁决：两小儿的推理前提双双落空！</text>
<text x="36" y="466" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">无论 5186 km 还是 15900 km，除以日地平均距离 1.496 亿 km，相对变化率都不到【万分之一（0.004%–0.011%）】！</text>
<text x="36" y="486" font-size="10.2" fill="#1e293b" text-anchor="start">这就好比你站在 10 米外烤篝火，身体只往前探了 0.4 毫米——既不可能让太阳看起来变大，也不可能把清凉变滚烫！</text>
</svg>
