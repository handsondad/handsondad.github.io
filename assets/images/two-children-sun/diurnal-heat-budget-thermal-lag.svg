<text x="526" y="88" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">秒懂“热惯性存款账本”</text>
<rect x="504" y="108" width="222" height="110" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="516" y="128" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">① 为什么日出是一天最冷时刻？</text>
<text x="516" y="148" font-size="10.0" fill="#1e293b" text-anchor="start">整晚 12 小时太阳零进账，大地却一刻</text>
<text x="516" y="166" font-size="10.0" fill="#1e293b" text-anchor="start">不停向太空发射红外线散热。日出刚</text>
<text x="516" y="184" font-size="10.0" fill="#1e293b" text-anchor="start">露头时进账仍小于支出，昨晚热老本</text>
<text x="516" y="202" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">彻底赔光，跌入全天最冷谷底！</text>
<rect x="504" y="228" width="222" height="122" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="516" y="248" font-size="10.3" fill="#dc2626" text-anchor="start" font-weight="700">② 正午晒皮烫 vs 午后空气热</text>
<text x="516" y="267" font-size="9.8" fill="#1e293b" text-anchor="start">12 点阳光直射皮肤火力最强（体感如</text>
<text x="516" y="285" font-size="9.8" fill="#1e293b" text-anchor="start">探汤）；而背阴气温因 12 点至 14:24</text>
<text x="516" y="303" font-size="9.8" fill="#1e293b" text-anchor="start">进账仍大于支出，继续涨到午后才见</text>
<text x="516" y="321" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="600">顶！两者叠加，早晨自然最凉。</text>
<rect x="504" y="360" width="222" height="100" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
<text x="516" y="380" font-size="10.4" fill="#d97706" text-anchor="start" font-weight="700">③ 年度放大版：“夏至不热三伏热”</text>
<text x="516" y="400" font-size="10.0" fill="#1e293b" text-anchor="start">北半球 6 月 21 日夏至阳光最强（且</text>
<text x="516" y="418" font-size="10.0" fill="#1e293b" text-anchor="start">7 月初反而在远日点！），但土壤海</text>
<text x="516" y="436" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="600">洋持续净储热，最热推迟到 7 月底！</text>
</svg>
