<polyline points="444.0,312.0 450.9,311.4 457.7,309.4 464.6,306.3 471.4,302.3 478.2,297.7 485.1,292.6 491.9,287.2 498.8,281.5 505.6,275.6 512.5,269.6 519.4,263.5 526.2,257.3 533.0,251.2 539.9,245.0 546.8,238.8 553.6,232.8 560.5,226.7 567.3,220.8 574.1,215.0 581.0,209.2 587.9,203.6 594.7,198.2 601.5,192.9 608.4,187.7 615.2,182.8 622.1,178.0 629.0,173.4 635.8,169.0 642.6,164.8 649.5,160.8 656.4,157.1 663.2,153.6 670.0,150.3 676.9,147.3 683.8,144.5 690.6,141.9 697.5,139.7 704.3,137.6 711.1,135.9 718.0,134.4" fill="none" stroke="#dc2626" stroke-width="2.6"/>
