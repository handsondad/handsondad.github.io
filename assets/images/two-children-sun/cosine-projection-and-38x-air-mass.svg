<text x="491.9" y="304.0" font-size="9.6" fill="#1d6fa5" text-anchor="start" font-weight="700">α=5°: 仅 21 W/m² (10.4 AM)</text>
<text x="622.3" y="163.5" font-size="9.6" fill="#c25014" text-anchor="end" font-weight="700">春分正午 734 W/m² (1.23 AM)</text>
<text x="702.5" y="129.0" font-size="9.6" fill="#dc2626" text-anchor="end" font-weight="700">夏至正午 926 W/m²</text>
<text x="450.0" y="136.0" font-size="10.0" fill="#dc2626" text-anchor="start" font-weight="700">晴空地面直射火力 (W/m²)</text>
<rect x="410" y="360" width="314" height="114" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.0"/>
<text x="422" y="380" font-size="10.7" fill="#dc2626" text-anchor="start" font-weight="700">日出切线光学质量高达 38 倍大气厚度（38 AM）！</text>
<text x="422" y="399" font-size="10.0" fill="#1e293b" text-anchor="start">• 蓝紫短波被空气分子瑞利散射一空，只剩红橙光染红朝阳；</text>
<text x="422" y="417" font-size="10.0" fill="#1e293b" text-anchor="start">• 水汽与尘埃再截留大半红外热能，叠加余弦摊薄后，5° 低阳</text>
<text x="422" y="435" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">  地面火力（21 W/m²）不到夏至正午（926 W/m²）的 1/40！</text>
<text x="422" y="453" font-size="10.0" fill="#1e293b" text-anchor="start">  这就是早晨直视朝阳不刺眼、晒在身上也不烫的物理根源。</text>
</svg>
