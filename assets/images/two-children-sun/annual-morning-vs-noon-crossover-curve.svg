<title id="title">曲阜全年365天日出与正午日地距离差逐日曲线及孔子时代岁差对比图</title>
<desc id="desc">左卡精确计算北纬35.6度全年每日正午减日出距离差Δd：当代1月26日至6月4日共129天日出更近（4月7日峰值+5727公里），其余236天正午更近（9月15日谷底-15670公里），两交点为平局日；紫色虚线展示公元前500年近日点进动后的130天反转窗口。</desc>
