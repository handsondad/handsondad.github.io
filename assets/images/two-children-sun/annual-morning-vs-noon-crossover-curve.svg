<text x="522" y="125" font-size="10.3" fill="#1d6fa5" text-anchor="start" font-weight="700">① 当代每年 129 天“早晨更近”</text>
<text x="522" y="144" font-size="9.8" fill="#1e293b" text-anchor="start">几何日出瞬间，观测者地心半径永远</text>
<text x="522" y="161" font-size="9.8" fill="#1e293b" text-anchor="start">垂直于阳光（投影恒为 0）；正午拉</text>
<text x="522" y="178" font-size="9.8" fill="#1e293b" text-anchor="start">近量随季节在冬至 3278 km 至夏至</text>
<text x="522" y="195" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="600">6228 km 间变化，1月底公转即反超！</text>
