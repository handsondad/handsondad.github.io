<text x="522" y="253" font-size="10.3" fill="#18794e" text-anchor="start" font-weight="700">② 一年两次“绝对平局日”</text>
<text x="522" y="272" font-size="9.8" fill="#1e293b" text-anchor="start">每年 1 月 26 日与 6 月 4 日前后，</text>
<text x="522" y="289" font-size="9.8" fill="#1e293b" text-anchor="start">半日椭圆轨道退行量恰好等于曲阜自</text>
<text x="522" y="306" font-size="9.8" fill="#1e293b" text-anchor="start">转拉近量（Δd＝0），早晨和中午距</text>
<text x="522" y="323" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="600">太阳一公里不差——两小儿战成平手！</text>
<rect x="512" y="354" width="214" height="118" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
<text x="522" y="373" font-size="10.3" fill="#6d28d9" text-anchor="start" font-weight="700">③ 回到 2500 年前孔子时代</text>
<text x="522" y="392" font-size="9.8" fill="#1e293b" text-anchor="start">地球椭圆近日点约 2.1 万年进动一圈</text>
<text x="522" y="409" font-size="9.8" fill="#1e293b" text-anchor="start">（每 58 年推迟 1 天）。前 500 年近</text>
<text x="522" y="426" font-size="9.8" fill="#1e293b" text-anchor="start">日点在 11 月下旬，12月中旬至 4月20</text>
<text x="522" y="443" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="600">日共 130 天日出更近，暮春照样翻盘！</text>
