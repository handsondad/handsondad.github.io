<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">日出大如车盖的视觉神经机制：扁平天穹庞佐错觉与初级视觉皮层V1激活扩张图</title>
<desc id="desc">左卡展示地面树木建筑远山构成的深度线索将地平线天穹推远2.5至3倍，按埃默特定律将同为0.53度的视角放大为车盖；右卡展示2006年Nature Neuroscience的V1皮层fMRI证据及纸筒窥视、弯腰倒看、小拇指测角三种破除错觉实验。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1d6fa5"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#c25014"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#18794e"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="499" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">第一个小孩为什么发誓“大如车盖”？扁平天穹错觉与大脑 V1 皮层的自动放大</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">视网膜光斑永远只有 0.16 毫米；但地景深度线索骗过了大脑，让初级视觉皮层点亮了更大面积</text>
<rect x="20" y="62" width="392" height="422" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="84" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="38" y="88" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="88" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">扁平天穹与埃默特定律：感知大小 ＝ 视角 θ × 感知距离</text>
<line x1="36.0" y1="302.0" x2="394.0" y2="302.0" stroke="#64748b" stroke-width="2.0" stroke-linecap="round"/>
<polygon points="154,302 164,274 174,302" fill="#16a34a" opacity="0.75"/>
<rect x="206" y="282" width="18" height="20" fill="#94a3b8"/>
<polygon points="203,282 215,270 227,282" fill="#64748b"/>
<path d="M 252 302 L 278 276 L 304 302 L 328 284 L 352 302 Z" fill="#cbd5e1"/>
<text x="248" y="320" font-size="9.9" fill="#475569" text-anchor="middle">树木 → 房屋 → 远山层云（丰富地面透视线索把地平线推得很远）</text>
<path d="M 96 166 A 136 136 0 0 1 232 302" fill="none" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,4"/>
<text x="208" y="206" font-size="9.6" fill="#475569" text-anchor="start">真实等距轨迹</text>
<path d="M 52 208 Q 210 198 368 302" fill="none" stroke="#6d28d9" stroke-width="2.4"/>
<text x="216" y="122" font-size="10.2" fill="#6d28d9" text-anchor="middle" font-weight="700">大脑感知的“扁平覆碗天穹”（四边远、头顶矮）</text>
<circle cx="96" cy="302" r="5.5" fill="#0f172a"/>
<line x1="96.0" y1="302.0" x2="88.0" y2="204.0" stroke="#1d6fa5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/>
<line x1="96.0" y1="302.0" x2="104.0" y2="204.0" stroke="#1d6fa5" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/>
<circle cx="96" cy="204" r="9" fill="#fef08a" stroke="#d97706" stroke-width="1.6"/>
<text x="108" y="146" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="600">头顶无参照物 → 感知近</text>
<text x="108" y="163" font-size="9.9" fill="#0f172a" text-anchor="start" font-weight="700">大脑判定：“小如盘盂”</text>
<line x1="96.0" y1="302.0" x2="368.0" y2="266.0" stroke="#c25014" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/>
<line x1="96.0" y1="302.0" x2="368.0" y2="300.0" stroke="#c25014" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/>
<circle cx="368" cy="283" r="20" fill="#fb923c" fill-opacity="0.88" stroke="#dc2626" stroke-width="1.8"/>
<text x="394" y="232" font-size="9.8" fill="#dc2626" text-anchor="end" font-weight="700">感知远 2.5–3 倍 →“大如车盖”！</text>
<rect x="36" y="336" width="360" height="134" rx="8" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.0"/>
<text x="48" y="356" font-size="10.3" fill="#6d28d9" text-anchor="start" font-weight="700">为什么王充《论衡》猜反了亮度，考夫曼（1962）抓到了主因？</text>
<text x="48" y="376" font-size="9.8" fill="#1e293b" text-anchor="start">• 东汉王充猜“暗处看火显得大”，但实测刺眼强光才会有辐照膨胀，</text>
<text x="48" y="394" font-size="9.8" fill="#1e293b" text-anchor="start">  只是日出经 38 倍空气消光柔和可看清轮廓，正午眩光刺眼难直视；</text>
<text x="48" y="412" font-size="9.8" fill="#1e293b" text-anchor="start">• Kaufman &amp; Rock (1962, Science) 人工月亮证实：遮住地面远景后，</text>
<text x="48" y="430" font-size="9.8" fill="#1e293b" text-anchor="start">  “车盖巨日／巨月”当场缩回原形！加上平视与仰头 90° 的辐辏差异，</text>
<text x="48" y="448" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="600">  大脑把完全相同的 0.16 mm 视网膜像强行放大成了两三倍巨轮。</text>
<rect x="426" y="62" width="314" height="422" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="444" cy="84" r="10.5" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="444" y="88" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="88" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">fMRI 脑扫描实锤 ＋ 三招一秒破除魔法</text>
<rect x="442" y="106" width="282" height="152" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/>
<text x="454" y="126" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">Murray 等 (2006, Nat. Neurosci.) fMRI 发现：</text>
<text x="454" y="144" font-size="9.8" fill="#1e293b" text-anchor="start">视网膜光斑完全相等（0.53°），但初级视觉皮层 V1 里：</text>
<rect x="456" y="158" width="120" height="86" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<circle cx="516" cy="192" r="12" fill="#3b82f6" fill-opacity="0.8"/>
<text x="516" y="222" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">头顶近处目标</text>
<text x="516" y="237" font-size="9.9" fill="#1e293b" text-anchor="middle">V1 激活区较小</text>
<rect x="590" y="158" width="120" height="86" rx="8" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
<circle cx="650" cy="192" r="22" fill="#f97316" fill-opacity="0.82" stroke="#dc2626" stroke-width="1.3"/>
<text x="650" y="222" font-size="10.0" fill="#dc2626" text-anchor="middle" font-weight="700">地平线远处目标</text>
<text x="650" y="237" font-size="9.9" fill="#dc2626" text-anchor="middle" font-weight="700">V1 激活区真的变大！</text>
<rect x="442" y="270" width="282" height="200" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.1"/>
<text x="454" y="291" font-size="10.5" fill="#0f766e" text-anchor="start" font-weight="700">亲自验证！（仅限日出微光或满月，严禁直视烈日）</text>
<text x="454" y="314" font-size="10.1" fill="#1e293b" text-anchor="start">① 纸筒窥视法：把 A4 纸卷成细筒只看日轮，挡住</text>
<text x="454" y="332" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="600">   树梢与房屋，大车盖瞬间缩回小盘子！</text>
<text x="454" y="355" font-size="10.1" fill="#1e293b" text-anchor="start">② 弯腰胯下倒看法：背对日出弯腰从两腿间倒着看，</text>
<text x="454" y="373" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="600">   天地透视线索颠倒，巨日错觉当场消失大半！</text>
<text x="454" y="396" font-size="10.1" fill="#1e293b" text-anchor="start">③ 小拇指标尺法：伸直手臂竖起小拇指（宽约 1°），</text>
<text x="454" y="414" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="600">   无论早晚，太阳和月亮永远只占半个指甲盖宽！</text>
<text x="454" y="440" font-size="9.9" fill="#dc2626" text-anchor="start" font-weight="700">⚠️ 安全红线：正午阳光聚焦视网膜 1 秒即可灼伤黄斑，</text>
<text x="454" y="457" font-size="9.9" fill="#dc2626" text-anchor="start">   测正午太阳大小请务必使用小孔成像投影或巴德膜！</text>
</svg>
