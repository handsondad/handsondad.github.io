<line x1="377.3" y1="122.0" x2="377.3" y2="368.0" stroke="#c25014" stroke-width="1.2" stroke-dasharray="3 3"/>
<circle cx="377.3" cy="161.4" r="4" fill="#18794e"/>
<circle cx="377.3" cy="305.7" r="4" fill="#b91c1c"/>
<circle cx="377.3" cy="181.0" r="5" fill="#1d6fa5"/>
<text x="245" y="160.5" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700" class="halo">广义相对论（高处引力弱）：约 +45 μs/天</text>
<text x="250" y="327.3" font-size="10.5" fill="#b91c1c" text-anchor="start" font-weight="700" class="halo">狭义相对论（3.9 km/s 高速）：约 −7 μs/天</text>
<text x="369.3" y="196.0" font-size="11" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">GPS 净快 ≈ +38 μs/天</text>
<rect x="34" y="412" width="412" height="90" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="46" y="433" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么手机地图没导航进河里？（NASA / Ashby 2003）</text>
<text x="46" y="454" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">• 每天快 38 微秒 × 光速 c ≈ 每天累积约 11.4 公里的测距狂漂！</text>
<text x="46" y="474" font-size="10.8" fill="#1e293b" text-anchor="start">• 工程师在卫星发射前，故意把星载 10.23 MHz 原子钟基准调慢</text>
<text x="46" y="492" font-size="10.8" fill="#1e293b" text-anchor="start">  至 10.22999999543 MHz，上天入轨后刚好与地面分毫不差！</text>
<rect x="474" y="64" width="266" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="488.0" y="74.0" width="238" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="607.0" y="89.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">B · 从太空到 1 毫米：实测三级跳</text>
<rect x="488" y="108" width="238" height="120" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="500" y="129" font-size="11.8" fill="#1d6fa5" text-anchor="start" font-weight="700">第 1 级 · 太空导航星座</text>
<text x="500" y="148" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">高度差 Δh ≈ 20,200 km</text>
<text x="500" y="170" font-size="10.8" fill="#1e293b" text-anchor="start">国际空间站 (h≈400 km) 因飞得</text>
<text x="500" y="189" font-size="10.8" fill="#1e293b" text-anchor="start">太快，宇航员反而比地面略年轻；</text>
<text x="500" y="208" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">GPS 高轨引力更弱，净快 38 μs/天。</text>
<rect x="488" y="240" width="238" height="120" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="500" y="261" font-size="11.8" fill="#c25014" text-anchor="start" font-weight="700">第 2 级 · 桌面抬高一级台阶</text>
<text x="500" y="280" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">高度差 Δh = 33 厘米 (NIST 2010)</text>
<text x="500" y="302" font-size="10.8" fill="#1e293b" text-anchor="start">Chou 等用两台单铝离子 (Al⁺) 光钟</text>
<text x="500" y="321" font-size="10.8" fill="#1e293b" text-anchor="start">实测：把上面那台仅垫高 33 cm，</text>
<text x="500" y="340" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">走时立刻变快（79年快约 90 纳秒）！</text>
<rect x="488" y="372" width="238" height="120" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="500" y="393" font-size="11.8" fill="#18794e" text-anchor="start" font-weight="700">第 3 级 · 一团原子云的上下两端</text>
<text x="500" y="412" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="700">高度差 Δh = 1 毫米 (JILA 2022)</text>
<text x="500" y="434" font-size="10.8" fill="#1e293b" text-anchor="start">叶军团队在 Nature 发表：在 1 mm</text>
<text x="500" y="453" font-size="10.8" fill="#1e293b" text-anchor="start">超冷锶原子晶格内部，直接测出顶部</text>
<text x="500" y="472" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="600">比底部走得快的引力红移 (10⁻²¹)！</text>
</svg>
