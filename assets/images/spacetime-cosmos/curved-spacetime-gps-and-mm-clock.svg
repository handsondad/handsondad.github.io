<rect x="0.5" y="0.5" width="759" height="531" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">三、引力把时间拽慢：从手机 GPS 每天快 38 微秒到 1 毫米原子钟</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">广义相对论揭示：越靠近大质量天体（引力势越深）时间走得越慢；轨道卫星同时受“引力快钟”与“高速慢钟”拉锯</text>
