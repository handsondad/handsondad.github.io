<svg xmlns="http://www.w3.org/2000/svg" width="760" height="532" viewBox="0 0 760 532" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">广义与狭义相对论地球轨道时钟频移曲线、GPS每天38微秒修正及33厘米与1毫米光钟实测图解</title>
<desc id="desc">左图精确绘制圆轨道卫星广义相对论快钟、狭义相对论慢钟与净频移曲线，标出3170公里抵消高度与20200公里GPS轨道净快38微秒每天；右图汇总太空星座、2010年33厘米铝离子钟与2022年1毫米锶光晶格钟三级实测。</desc>
