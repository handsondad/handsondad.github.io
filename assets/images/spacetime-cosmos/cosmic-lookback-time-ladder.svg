<svg xmlns="http://www.w3.org/2000/svg" width="760" height="532" viewBox="0 0 760 532" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">宇宙六级光速回望时间阶梯与仙女座悖论同时性相对性切片图解</title>
<desc id="desc">左图按对数秒展示从月球1.28秒、太阳8分19秒、比邻星4.25年、仙女座250万年到韦布JADES-GS-z14-0约135亿年前与CMB约138亿年前的回望阶梯；右图展示相距250万光年时步行1米每秒即可使同时面偏转约3天。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="531" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、抬头没有“现在”：从月球 1.28 秒前到韦布 135 亿年前的回望阶梯</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">光速被精确定义为 c = 299,792,458 m/s——在宇宙里望向远处，本质上就是用望远镜翻阅不同年代的历史底片</text>
<rect x="20" y="64" width="456" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="74.0" width="346" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="207.0" y="89.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 六级宇宙“时间延迟尺”（按 log₁₀ 秒精确换算）</text>
<line x1="152.0" y1="118" x2="452.0" y2="118" stroke="#cbd5e1" stroke-width="1"/>
<line x1="152.0" y1="113" x2="152.0" y2="452" stroke="#f1f5f9" stroke-width="1"/>
<text x="152.0" y="110" font-size="10" fill="#64748b" text-anchor="middle">1 秒</text>
<line x1="218.7" y1="113" x2="218.7" y2="452" stroke="#f1f5f9" stroke-width="1"/>
<text x="218.7" y="110" font-size="10" fill="#64748b" text-anchor="middle">3 小时</text>
<line x1="285.3" y1="113" x2="285.3" y2="452" stroke="#f1f5f9" stroke-width="1"/>
<text x="285.3" y="110" font-size="10" fill="#64748b" text-anchor="middle">3.2 年</text>
<line x1="352.0" y1="113" x2="352.0" y2="452" stroke="#f1f5f9" stroke-width="1"/>
<text x="352.0" y="110" font-size="10" fill="#64748b" text-anchor="middle">3.2 万年</text>
<line x1="418.7" y1="113" x2="418.7" y2="452" stroke="#f1f5f9" stroke-width="1"/>
<text x="418.7" y="110" font-size="10" fill="#64748b" text-anchor="middle">3.2 亿年</text>
<line x1="452.0" y1="113" x2="452.0" y2="452" stroke="#f1f5f9" stroke-width="1"/>
<text x="452.0" y="110" font-size="10" fill="#64748b" text-anchor="middle">317 亿年</text>
<text x="34" y="148" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">① 月球</text>
<rect x="152.0" y="134.0" width="8.0" height="18" rx="5" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<circle cx="160.0" cy="143.0" r="4" fill="#475569"/>
<text x="168.0" y="147" font-size="11" fill="#475569" text-anchor="start" font-weight="700">1.28 秒前</text>
<text x="152.0" y="168" font-size="10.5" fill="#1e293b" text-anchor="start">距离 38.44 万 km · 阿波罗通话延迟</text>
<text x="34" y="202" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">② 太阳</text>
<rect x="152.0" y="188.0" width="45.0" height="18" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.3"/>
<circle cx="197.0" cy="197.0" r="4" fill="#b45309"/>
<text x="205.0" y="201" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">8 分 19 秒前</text>
<text x="152.0" y="222" font-size="10.5" fill="#1e293b" text-anchor="start">1 AU ≈ 1.50 亿 km · 此刻阳光发自 8 分钟前</text>
<text x="34" y="256" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">③ 比邻星</text>
<rect x="152.0" y="242.0" width="135.5" height="18" rx="5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<circle cx="287.5" cy="251.0" r="4" fill="#18794e"/>
<text x="295.5" y="255" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">约 4.25 年前</text>
<text x="152.0" y="276" font-size="10.5" fill="#1e293b" text-anchor="start">最近恒星邻居 · 4.25 光年外</text>
<text x="34" y="310" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">④ 仙女座 M31</text>
<rect x="152.0" y="296.0" width="231.6" height="18" rx="5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<circle cx="383.6" cy="305.0" r="4" fill="#1d6fa5"/>
<text x="375.6" y="309" font-size="10.5" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">约 250 万年前</text>
<text x="152.0" y="330" font-size="10.5" fill="#1e293b" text-anchor="start">肉眼最远大星系 · 地球早期人类刚打制石器</text>
<text x="34" y="364" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">⑤ JADES-GS-z14-0</text>
<rect x="152.0" y="350.0" width="293.8" height="18" rx="5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.3"/>
<circle cx="445.8" cy="359.0" r="4" fill="#6d28d9"/>
<text x="437.8" y="363" font-size="10.5" fill="#6d28d9" text-anchor="end" font-weight="700" class="halo">约 135 亿年前</text>
<text x="152.0" y="384" font-size="10.5" fill="#1e293b" text-anchor="start">z = 14.32 (韦布 2024) · 大爆炸后仅 2.9 亿年</text>
<text x="34" y="418" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">⑥ 微波背景 CMB</text>
<rect x="152.0" y="404.0" width="294.0" height="18" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
<circle cx="446.0" cy="413.0" r="4" fill="#b91c1c"/>
<text x="438.0" y="417" font-size="10.5" fill="#b91c1c" text-anchor="end" font-weight="700" class="halo">约 138 亿年前</text>
<text x="152.0" y="438" font-size="10.5" fill="#1e293b" text-anchor="start">z ≈ 1090 (2.7255 K) · 大爆炸后 38 万年首缕光</text>
<rect x="34" y="462" width="428" height="42" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="480" font-size="10.8" fill="#0f172a" text-anchor="start" font-weight="700">关键结论：“光年”是长度单位（光走 1 年 ≈ 9.46 万亿 km），但宇宙深空</text>
<text x="46" y="497" font-size="10.8" fill="#64748b" text-anchor="start">没有“实时直播”——空间距离越远，你看到的必然是越遥远的过去。</text>
<rect x="490" y="64" width="250" height="452" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="504.0" y="74.0" width="222" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="615.0" y="89.0" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">B · “全宇宙同一个现在”破产</text>
<rect x="504" y="108" width="222" height="182" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<line x1="542" y1="126" x2="542" y2="274" stroke="#38bdf8" stroke-width="2"/>
<line x1="688" y1="126" x2="688" y2="274" stroke="#c084fc" stroke-width="2"/>
<text x="542" y="122" font-size="10.5" fill="#bae6fd" text-anchor="middle" font-weight="700">地球</text>
<text x="688" y="122" font-size="10.5" fill="#e9d5ff" text-anchor="middle" font-weight="700">仙女座 M31</text>
<line x1="522" y1="214" x2="708" y2="214" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<line x1="522" y1="220" x2="708" y2="162" stroke="#fb923c" stroke-width="2"/>
<circle cx="542" cy="214" r="4.5" fill="#facc15"/>
<circle cx="688" cy="214" r="4" fill="#94a3b8"/>
<circle cx="688" cy="168" r="4.5" fill="#fb923c"/>
<text x="614" y="232" font-size="10" fill="#cbd5e1" text-anchor="middle">静坐者的“此刻”切片</text>
<text x="608" y="176" font-size="10" fill="#fed7aa" text-anchor="middle" font-weight="700">朝 M31 步行者的“此刻”</text>
<text x="682" y="195" font-size="10.5" fill="#fde047" text-anchor="end" font-weight="700">差约 3 天!</text>
<text x="615" y="282" font-size="10" fill="#94a3b8" text-anchor="middle">相距 L ≈ 250 万光年</text>
<text x="504" y="314" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">彭罗斯“仙女座悖论”：</text>
<text x="504" y="335" font-size="11" fill="#1e293b" text-anchor="start">在地球街头擦肩而过的两个人：</text>
<text x="504" y="355" font-size="11" fill="#1e293b" text-anchor="start">• 甲原地静坐；乙以 v = 1 m/s</text>
<text x="504" y="374" font-size="11" fill="#1e293b" text-anchor="start">  朝仙女座方向散步。</text>
<text x="504" y="396" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">• 按洛伦兹变换 Δt = v·L / c²，</text>
<text x="504" y="416" font-size="11" fill="#1e293b" text-anchor="start">  两人在 250 万光年外定义的</text>
<text x="504" y="435" font-size="11" fill="#b91c1c" text-anchor="start" font-weight="700">  “现在”，足足错开约 3.0 天！</text>
<text x="504" y="460" font-size="11" fill="#475569" text-anchor="start">• 宇宙不是一秒一帧同步翻页的</text>
<text x="504" y="479" font-size="11" fill="#475569" text-anchor="start">  连环画，而是一整块四维时空</text>
<text x="504" y="498" font-size="11" fill="#0f172a" text-anchor="start" font-weight="600">  面包，不同速度切出不同斜面。</text>
</svg>
