<rect x="0.5" y="0.5" width="759" height="371" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">没去太阳挖一勺，怎么知道它有氢和氦？5772 K 光谱密码与夫琅禾费暗线</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图绘制 5772 K 普朗克黑体辐射曲线（峰值 502 nm）与元素条形码；右图揭晓蓝天白日与红霞之谜。</text>
