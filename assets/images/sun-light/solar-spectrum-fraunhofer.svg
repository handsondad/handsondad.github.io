<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">太阳5772K黑体光谱、夫琅禾费吸收暗线与瑞利散射变色原理</title>
<desc id="desc">左图计算5772K普朗克黑体辐射曲线（维恩峰值约502nm）并标出氢Hα/Hβ、钙K、钠D暗线与1868年日食发现的氦D3线；右图解释太空纯白阳光与地面瑞利1/λ⁴散射导致的蓝天及红日落。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <linearGradient id="vis-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
        <stop offset="22%" stop-color="#2563eb" stop-opacity="0.28"/>
        <stop offset="45%" stop-color="#10b981" stop-opacity="0.28"/>
        <stop offset="68%" stop-color="#eab308" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="#ef4444" stop-opacity="0.28"/>
      </linearGradient>
      <linearGradient id="barcode-rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#6d28d9"/>
        <stop offset="22%" stop-color="#2563eb"/>
        <stop offset="46%" stop-color="#16a34a"/>
        <stop offset="70%" stop-color="#eab308"/>
        <stop offset="84%" stop-color="#f97316"/>
