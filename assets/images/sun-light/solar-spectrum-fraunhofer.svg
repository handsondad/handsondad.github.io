<rect x="466" y="62" width="274" height="294" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="480" y="85" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">② 峰值在绿光，太阳为啥不发绿？</text>
<rect x="480" y="100" width="246" height="74" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="490" y="119" font-size="10.7" fill="#475569" text-anchor="start" font-weight="700">太空看太阳：纯白色！</text>
<text x="490" y="139" font-size="9.9" fill="#1e293b" text-anchor="start">5772 K 黑体曲线宽平，红绿蓝</text>
<text x="490" y="156" font-size="9.9" fill="#1e293b" text-anchor="start">光子齐备，合成纯正白光。</text>
<rect x="480" y="182" width="246" height="74" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="490" y="201" font-size="10.7" fill="#1d6fa5" text-anchor="start" font-weight="700">正午地面：瑞利散射 ∝ 1/λ⁴</text>
<text x="490" y="221" font-size="9.9" fill="#1e293b" text-anchor="start">450nm 蓝光散射是红光的 4.4 倍！</text>
<text x="490" y="238" font-size="9.9" fill="#1e293b" text-anchor="start">蓝光染蓝天空，直射光微偏暖黄。</text>
<rect x="480" y="264" width="246" height="74" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="490" y="283" font-size="10.7" fill="#c25014" text-anchor="start" font-weight="700">日出日落：斜穿十余倍大气</text>
<text x="490" y="303" font-size="9.9" fill="#1e293b" text-anchor="start">斜穿厚大气，蓝绿光几乎散尽，</text>
<text x="490" y="320" font-size="9.9" fill="#1e293b" text-anchor="start">只剩波长最长的金橙与绯红透出！</text>
