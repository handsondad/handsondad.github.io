<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">核心热能 k_BT ≈ 1.3 keV 比库仑势垒 (~1,000 keV) 矮近千倍；全靠量子波穿墙与 E₀ ≈ 5.9 keV 伽莫夫峰！</text>
