<svg xmlns="http://www.w3.org/2000/svg" width="760" height="364" viewBox="0 0 760 364" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">太阳能源寿命对数对比：化学烧煤、开尔文引力收缩与氢核聚变</title>
<desc id="desc">按太阳质量与光度精确计算三种能源寿命：化学燃烧仅数千年、开尔文-亥姆霍兹引力收缩约3.1千万年（远小于地球45.4亿年年龄），唯有氢核聚变可达约100亿年。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="363" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">十九世纪最大科学悬案：如果太阳烧煤或靠引力收缩，它早就熄火了！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">按太阳真实质量 1.99×10³⁰ kg 与光度 3.83×10²⁶ W 核算对数寿命尺——差出整整七个数量级。</text>
<rect x="20" y="62" width="720" height="286" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="86" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">对数时间尺（10³ 年 → 10¹¹ 年）：每往右走一格，寿命翻 10 倍！</text>
<line x1="198.0" y1="104" x2="198.0" y2="262" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="198.0" y="280" font-size="10.2" fill="#64748b" text-anchor="middle">10<tspan dy="-4" font-size="7.8">3</tspan><tspan dy="4">年</tspan></text>
<line x1="261.5" y1="104" x2="261.5" y2="262" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="261.5" y="280" font-size="10.2" fill="#64748b" text-anchor="middle">10<tspan dy="-4" font-size="7.8">4</tspan><tspan dy="4">年</tspan></text>
<line x1="325.0" y1="104" x2="325.0" y2="262" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="325.0" y="280" font-size="10.2" fill="#64748b" text-anchor="middle">10<tspan dy="-4" font-size="7.8">5</tspan><tspan dy="4">年</tspan></text>
<line x1="388.5" y1="104" x2="388.5" y2="262" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="388.5" y="280" font-size="10.2" fill="#64748b" text-anchor="middle">10<tspan dy="-4" font-size="7.8">6</tspan><tspan dy="4">年</tspan></text>
<line x1="452.0" y1="104" x2="452.0" y2="262" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="452.0" y="280" font-size="10.2" fill="#64748b" text-anchor="middle">10<tspan dy="-4" font-size="7.8">7</tspan><tspan dy="4">年</tspan></text>
<line x1="515.5" y1="104" x2="515.5" y2="262" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="515.5" y="280" font-size="10.2" fill="#64748b" text-anchor="middle">10<tspan dy="-4" font-size="7.8">8</tspan><tspan dy="4">年</tspan></text>
<line x1="579.0" y1="104" x2="579.0" y2="262" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="579.0" y="280" font-size="10.2" fill="#64748b" text-anchor="middle">10<tspan dy="-4" font-size="7.8">9</tspan><tspan dy="4">年</tspan></text>
<line x1="642.5" y1="104" x2="642.5" y2="262" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="642.5" y="280" font-size="10.2" fill="#64748b" text-anchor="middle">10<tspan dy="-4" font-size="7.8">10</tspan><tspan dy="4">年</tspan></text>
<line x1="706.0" y1="104" x2="706.0" y2="262" stroke="#f1f5f9" stroke-width="1.2"/>
<text x="706.0" y="280" font-size="10.2" fill="#64748b" text-anchor="middle">10<tspan dy="-4" font-size="7.8">11</tspan><tspan dy="4">年</tspan></text>
<line x1="198.0" y1="262" x2="706.0" y2="262" stroke="#475569" stroke-width="1.3"/>
<line x1="620.7" y1="100" x2="620.7" y2="262" stroke="#1d6fa5" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="614.7" y="113" font-size="10.4" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">地球与陨石实测年龄 ≈ 45.4 亿年（生命演化铁证！）</text>
<text x="36" y="139" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">① 整颗太阳烧煤+氧气</text>
<text x="36" y="155" font-size="9.8" fill="#64748b" text-anchor="start" class="mono">化学键能 ~10⁷ J/kg</text>
<rect x="198.0" y="130" width="30.0" height="22" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<circle cx="228.0" cy="141" r="4.2" fill="#b91c1c"/>
<text x="238.0" y="145" font-size="10.4" fill="#b91c1c" text-anchor="start" font-weight="700" class="halo">仅够烧约 1,500–5,000 年（金字塔刚建好就灭了！）</text>
<text x="36" y="187" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">② 开尔文引力收缩</text>
<text x="36" y="203" font-size="9.8" fill="#64748b" text-anchor="start" class="mono">t_KH = GM²/(RL)</text>
<rect x="198.0" y="178" width="285.6" height="22" rx="5" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<circle cx="483.6" cy="189" r="4.2" fill="#c25014"/>
<text x="493.6" y="193" font-size="10.4" fill="#c25014" text-anchor="start" font-weight="700" class="halo">最多约 3000 万年（比地球年龄短 150 倍！）</text>
<text x="36" y="235" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">③ 核心氢聚变成氦</text>
<text x="36" y="251" font-size="9.8" fill="#64748b" text-anchor="start" class="mono">E = 0.0071 mc²</text>
<rect x="198.0" y="226" width="445.9" height="22" rx="5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.5"/>
<circle cx="643.9" cy="237" r="4.2" fill="#18794e"/>
<text x="210.0" y="241" font-size="10.4" fill="#18794e" text-anchor="start" font-weight="700">主序星寿命约 105 亿年 ✓（如今 46 亿岁正值壮年）</text>
<rect x="36" y="294" width="688" height="42" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="380" y="320" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="600">根源差距：化学燃烧只挪动外层电子（~10⁷ J/kg），核聚变重组原子核（6.4×10¹⁴ J/kg）——同重燃料能量高出数千万倍！</text>
</svg>
