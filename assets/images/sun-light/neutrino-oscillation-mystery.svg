<text x="398" y="272" font-size="10.3" fill="#1e293b" text-anchor="start">• 1,000 吨重水 (D₂O) 丙烯酸球 + 9,600 只光电倍增管</text>
<text x="398" y="292" font-size="10.3" fill="#18794e" text-anchor="start" font-weight="600">• 氘核中性流反应对【全部三味 ν_e+ν_μ+ν_τ】一视同仁！</text>
<rect x="398.0" y="308.0" width="109.5" height="20" rx="4" fill="#1d6fa5"/>
<rect x="507.5" y="308.0" width="212.5" height="20" rx="4" fill="#6d28d9"/>
<text x="406.0" y="322.0" font-size="10.0" fill="#ffffff" text-anchor="start" font-weight="700">34% ν_e</text>
<text x="519.5" y="322.0" font-size="10.0" fill="#ffffff" text-anchor="start" font-weight="700">+ 66% (ν_μ + ν_τ) = 100% 吻合！</text>
<text x="398" y="347" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="600">真相大白：太阳聚变分秒未停，贝特标准太阳模型大获全胜！</text>
</svg>
