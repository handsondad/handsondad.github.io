<rect x="0.5" y="0.5" width="759" height="375" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">困扰物理学界 30 年的“太阳中微子失踪案”：不是太阳熄火，是半路变脸！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">1970 年戴维斯在地下金矿只抓到预测值 1/3 的电子中微子；2001 年 SNO 重水实验揪出另外 2/3 的“马甲”。</text>
<rect x="20" y="62" width="720" height="146" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="85" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">① 跨越 1.496 亿千米的量子“变脸”之旅（中微子振荡证明中微子具有微小非零质量！）</text>
