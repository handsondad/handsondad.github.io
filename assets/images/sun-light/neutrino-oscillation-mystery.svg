<text x="425" y="108" font-size="10.2" fill="#6d28d9" text-anchor="start" font-weight="700" class="halo">变身缪子 ν_μ + 陶子 ν_τ (~2/3)</text>
<text x="358.0" y="194" font-size="10.2" fill="#475569" text-anchor="middle">2.3 秒直穿太阳 → 约 8 分 19 秒抵地（每秒约 6.4×10¹⁰ 颗穿过每平方厘米指甲盖！）</text>
<circle cx="656.0" cy="142.0" r="34" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="656.0" y="139.0" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">地球深矿井</text>
<text x="656.0" y="155.0" font-size="9.6" fill="#475569" text-anchor="middle">(1.5–2 km 深)</text>
<text x="656.0" y="192.0" font-size="10.0" fill="#64748b" text-anchor="middle">挡住宇宙线干扰</text>
<rect x="20" y="220" width="352" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="232.0" width="248" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
