<text x="34" y="272" font-size="10.3" fill="#1e293b" text-anchor="start">• 615 吨四氯乙烯干洗剂：ν_e + ³⁷Cl → ³⁷Ar + e⁻</text>
<text x="34" y="292" font-size="10.3" fill="#b91c1c" text-anchor="start" font-weight="600">• 盲区：阈值只认【电子中微子 ν_e】，对 ν_μ/ν_τ 全盲！</text>
<rect x="34.0" y="308.0" width="316.0" height="20" rx="5" fill="#f1f5f9" stroke="#e2e8f0"/>
<rect x="34.0" y="308.0" width="107.4" height="20" rx="5" fill="#1d6fa5"/>
<text x="44.0" y="322.0" font-size="10.0" fill="#ffffff" text-anchor="start" font-weight="700">实测 ~34% ν_e</text>
<text x="155.4" y="322.0" font-size="10.0" fill="#b91c1c" text-anchor="start" font-weight="700">？另外 66% 神秘失踪！</text>
<text x="34" y="347" font-size="9.8" fill="#64748b" text-anchor="start">整整一个月才从几百吨液体里数出十几颗氩原子！</text>
<rect x="384" y="220" width="356" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
