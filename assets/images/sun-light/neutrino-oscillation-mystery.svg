  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .nu-wave {
        stroke-dasharray: 900;
        stroke-dashoffset: 0;
        animation: nuDraw 1.8s ease-out 1 both;
      }
      @keyframes nuDraw {
        from { stroke-dashoffset: 900; }
        to { stroke-dashoffset: 0; }
