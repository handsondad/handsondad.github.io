<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">竖直热板自然对流的温度边界层与换热计算图</title>
<desc id="desc">40摄氏度竖直热板置于20摄氏度静止空气中，热边界层沿板向上增厚；按空气物性取贝塔约1/303每开、运动黏度1.57e-5、热扩散率2.2e-5平方米每秒，板高0.5米温差20开时瑞利数约2.3e8，努塞尔数约73，换热系数约3.8瓦每平方米每开，热流密度约76瓦每平方米，是整层静止空气导热的约73倍。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">热量不是直接“跳”进空气：先烤热贴壁的那层薄气膜</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">竖直 40°C 热板放进 20°C 静止空气，温度与速度边界层从下往上越长越厚。</text>
<rect x="20" y="66" width="392" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="88" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="38" y="92" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="92" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">边界层剖面：越往上，被烤热的空气层越厚</text>
<rect x="72" y="112" width="18" height="298" rx="3" fill="#f9d7b5" stroke="#c25014" stroke-width="1.6"/>
<text x="81" y="104" font-size="10.4" fill="#c25014" text-anchor="middle" font-weight="700">40°C 竖板</text>
<rect x="90" y="112" width="286" height="298" rx="4" fill="#f4f9fd" stroke="#dbe8f2"/>
<text x="360" y="130" font-size="10.4" fill="#1d6fa5" text-anchor="end" font-weight="600">环境 20°C</text>
<line x1="90.0" y1="170.0" x2="376.0" y2="170.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<path d="M 91 170 C 123 168, 147 157, 152 157" fill="none" stroke="#e08a4c" stroke-width="2.2"/>
<line x1="92.0" y1="166.0" x2="152.0" y2="166.0" stroke="#18794e" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/>
<text x="156" y="164" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">δT</text>
<line x1="90.0" y1="260.0" x2="376.0" y2="260.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<path d="M 91 260 C 133 258, 171 247, 186 247" fill="none" stroke="#e08a4c" stroke-width="2.2"/>
<line x1="92.0" y1="256.0" x2="186.0" y2="256.0" stroke="#18794e" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/>
<text x="190" y="254" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">δT</text>
<line x1="90.0" y1="350.0" x2="376.0" y2="350.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<path d="M 91 350 C 145 348, 197 337, 224 337" fill="none" stroke="#e08a4c" stroke-width="2.2"/>
<line x1="92.0" y1="346.0" x2="224.0" y2="346.0" stroke="#18794e" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/>
<text x="228" y="344" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">δT</text>
<line x1="112.0" y1="300.0" x2="112.0" y2="244.0" stroke="#c25014" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<line x1="142.0" y1="250.0" x2="142.0" y2="190.0" stroke="#c25014" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<line x1="182.0" y1="200.0" x2="182.0" y2="140.0" stroke="#c25014" stroke-width="2.1" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<text x="220" y="222" font-size="10.2" fill="#c25014" text-anchor="start" font-weight="600">贴壁空气受热变轻 → 沿板上升</text>
<text x="206" y="244" font-size="10.0" fill="#475569" text-anchor="start">黏性让壁面速度为 0，只能靠传导穿过气膜</text>
<rect x="244.0" y="396.0" width="142" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="315.0" y="411.0" font-size="10.2" fill="#6d28d9" text-anchor="middle" font-weight="600">层流 → 湍流（Ra 更高时）</text>
<text x="38" y="432" font-size="10.4" fill="#1e293b" text-anchor="start">温度从壁面 40°C 衰减到远处 20°C 的距离，就是热边界层厚度 δT。</text>
<text x="38" y="452" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="600">气膜越厚 = 热阻越大；流动把它削薄，换热系数 h 就上去。</text>
<rect x="426" y="66" width="314" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="444" cy="88" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="444" y="92" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="92" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">把这张图换算成硬数字</text>
<text x="444" y="124" font-size="11.4" fill="#1d6fa5" text-anchor="start" font-weight="700">① 浮力有多强：瑞利数</text>
<text x="444" y="148" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">Ra = gβΔT·L³ / (ν·α)</text>
<text x="444" y="168" font-size="10.0" fill="#475569" text-anchor="start">β≈1/303 K⁻¹，ν≈1.57×10⁻⁵ m²/s</text>
<text x="444" y="187" font-size="10.0" fill="#475569" text-anchor="start">α≈2.2×10⁻⁵ m²/s，L=0.5 m</text>
<text x="444" y="211" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="600"> Ra ≈ 2.34e+08（层流，落在 10⁴–10⁹ 区间）</text>
<line x1="444.0" y1="226.0" x2="722.0" y2="226.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="444" y="250" font-size="11.4" fill="#1d6fa5" text-anchor="start" font-weight="700">② 换热增强多少：努塞尔数</text>
<text x="444" y="274" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">Nu = hL/k ≈ 0.59 Ra¹⁄⁴</text>
<text x="444" y="298" font-size="10.6" fill="#1e293b" text-anchor="start">Nu ≈ 73 ⇒ h = Nu·k/L ≈ 3.8 W/(m²·K)</text>
<text x="444" y="317" font-size="10.0" fill="#475569" text-anchor="start">这里 k 是空气导热系数 ≈ 0.026 W/(m·K)</text>
<line x1="444.0" y1="332.0" x2="722.0" y2="332.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="444" y="356" font-size="11.4" fill="#c25014" text-anchor="start" font-weight="700">③ 每平方米每秒搬走多少热</text>
<text x="444" y="380" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">q″ = hΔT ≈ 76 W/m²</text>
<text x="444" y="402" font-size="10.2" fill="#475569" text-anchor="start">若 0.5 m 空气完全静止：kΔT/L ≈ 1 W/m²</text>
<text x="444" y="424" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">⇒ 对流把散热放大约 73 倍！</text>
<text x="444" y="450" font-size="10.4" fill="#18794e" text-anchor="start" font-weight="600">等效气膜厚度 δ = k/h ≈ 6.9 mm</text>
<rect x="20" y="476" width="720" height="36" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="500" font-size="10.6" fill="#475569" text-anchor="start">注意：h 不是空气的“固定常数”。几何、流速、温差、特征长度一变，h 就会跟着变。</text>
</svg>
