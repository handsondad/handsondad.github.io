<svg xmlns="http://www.w3.org/2000/svg" width="760" height="516" viewBox="0 0 760 516" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">室内自然对流环流与烟囱效应压差图</title>
<desc id="desc">暖气片装在冷窗下加热下沉气流形成房间闭合环流，顶部热空气向冷墙流动后下沉；烟囱效应压差约为室外密度减室内密度乘重力加速度乘高度，取高30米室内20摄氏度室外5摄氏度算得约19帕，中性面之上室内向外漏风、之下室外向内补风。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="515" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">同一条浮力链：在房间里转成圈，在烟囱里变成抽力</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">热空气上升不是终点；它必须找地方冷却、下沉，循环才闭合。</text>
<rect x="20" y="66" width="424" height="392" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="88" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="38" y="92" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="92" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">房间里的闭合环流：暖气为什么装低处</text>
<rect x="44" y="112" width="376" height="286" rx="6" fill="#f8fbfe" stroke="#b9cfe0" stroke-width="1.5"/>
<rect x="58" y="140" width="28" height="84" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3"/>
<text x="72" y="240" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="600">冷窗</text>
<line x1="66.0" y1="160.0" x2="66.0" y2="206.0" stroke="#1d6fa5" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<text x="72" y="262" font-size="9.6" fill="#1d6fa5" text-anchor="middle">玻璃降温</text>
<text x="72" y="278" font-size="9.6" fill="#1d6fa5" text-anchor="middle">冷气下沉</text>
<rect x="100" y="344" width="72" height="28" rx="4" fill="#f9d7b5" stroke="#c25014" stroke-width="1.5"/>
<line x1="110.0" y1="350.0" x2="110.0" y2="366.0" stroke="#c25014" stroke-width="1.2" stroke-linecap="round"/>
<line x1="124.0" y1="350.0" x2="124.0" y2="366.0" stroke="#c25014" stroke-width="1.2" stroke-linecap="round"/>
<line x1="138.0" y1="350.0" x2="138.0" y2="366.0" stroke="#c25014" stroke-width="1.2" stroke-linecap="round"/>
<line x1="152.0" y1="350.0" x2="152.0" y2="366.0" stroke="#c25014" stroke-width="1.2" stroke-linecap="round"/>
<text x="136" y="388" font-size="9.8" fill="#c25014" text-anchor="middle" font-weight="600">暖气片</text>
<path d="M 138 336 C 140 290, 156 230, 190 196" fill="none" stroke="#c25014" stroke-width="2.4" marker-end="url(#arr-orange)"/>
<path d="M 196 186 C 268 154, 344 168, 388 204" fill="none" stroke="#c25014" stroke-width="2.4" marker-end="url(#arr-orange)"/>
<path d="M 396 216 C 412 252, 404 308, 372 338" fill="none" stroke="#1d6fa5" stroke-width="2.4" marker-end="url(#arr-blue)"/>
<path d="M 362 350 C 300 374, 220 374, 180 368" fill="none" stroke="#1d6fa5" stroke-width="2.4" marker-end="url(#arr-blue)"/>
<text x="228" y="162" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="600">顶部最热</text>
<text x="320" y="300" font-size="10.0" fill="#1d6fa5" text-anchor="middle">贴墙冷却后下沉</text>
<text x="248" y="326" font-size="10.0" fill="#1d6fa5" text-anchor="middle">地板附近回流</text>
<text x="40" y="424" font-size="10.2" fill="#1e293b" text-anchor="start">• 暖气片放窗下：刚下沉的冷气立刻被加热，循环带动整屋</text>
<text x="40" y="445" font-size="10.2" fill="#1e293b" text-anchor="start">• 夏季风扇只是搅动空气；它不制冷，靠加速蒸发与撕薄气膜</text>
<rect x="460" y="66" width="280" height="392" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="478" cy="88" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="478" y="92" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="496" y="92" font-size="12.0" fill="#0f172a" text-anchor="start" font-weight="700">烟囱效应：高度就是抽力</text>
<rect x="636" y="128" width="46" height="242" rx="3" fill="#f5f8fb" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="659.0" y1="352.0" x2="659.0" y2="152.0" stroke="#c25014" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arr-orange)"/>
<line x1="608.0" y1="364.0" x2="632.0" y2="352.0" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<line x1="710.0" y1="364.0" x2="686.0" y2="352.0" stroke="#1d6fa5" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<text x="659" y="120" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="600">热烟气上升</text>
<text x="659" y="392" font-size="9.8" fill="#1d6fa5" text-anchor="middle">底部补入冷空气</text>
<line x1="616.0" y1="254.0" x2="634.0" y2="254.0" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="608" y="250" font-size="9.4" fill="#64748b" text-anchor="end">中性面</text>
<text x="476" y="208" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">Δp = (ρ外−ρ内)·g·h</text>
<text x="476" y="230" font-size="10.6" fill="#1d6fa5" text-anchor="start">≈ (p·g·h/R)·(1/T外−1/T内)</text>
<text x="476" y="254" font-size="10.0" fill="#475569" text-anchor="start">取 h=30 m、ΔT=15 K：</text>
<text x="476" y="278" font-size="11.6" fill="#c25014" text-anchor="start" font-weight="700">Δp ≈ 19 Pa（NIST 公式）</text>
<text x="476" y="304" font-size="10.2" fill="#1e293b" text-anchor="start">越高、内外温差越大，抽力越强。</text>
<text x="476" y="329" font-size="10.2" fill="#1e293b" text-anchor="start">中性面以上室内向外漏风，</text>
<text x="476" y="349" font-size="10.2" fill="#1e293b" text-anchor="start">以下则室外空气从缝隙灌入。</text>
<text x="476" y="382" font-size="9.8" fill="#64748b" text-anchor="start">火场烟气、老式烟囱、高层建筑</text>
<text x="476" y="401" font-size="9.8" fill="#64748b" text-anchor="start">的“拔风”，全是这一条公式。</text>
<rect x="20" y="470" width="720" height="36" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="494" font-size="10.6" fill="#475569" text-anchor="start">房间示意只画出一个主环流；真实房间会被门窗、家具、热源位置撕成多个涡。</text>
</svg>
