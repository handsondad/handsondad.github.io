<text x="565" y="118" font-size="10.8" fill="#6d28d9" text-anchor="middle" font-weight="700">全波段强烈漫散射 → 肉眼见纯白！</text>
<text x="412" y="298" font-size="10.8" fill="#1e293b" text-anchor="start">• 成因 A（自然受沁）：土壤弱酸碱地下水淋滤溶蚀晶界；</text>
<text x="412" y="318" font-size="10.8" fill="#1e293b" text-anchor="start">• 成因 B（祭祀燎玉）：商周/红山火烧 &gt;800℃ 脱水相变扩孔；</text>
<text x="412" y="338" font-size="10.8" fill="#6d28d9" text-anchor="start" font-weight="700">• 空气孔（n=1.00）与玉晶（n=1.62）界面单次反射率飙升！</text>
<rect x="22" y="400" width="716" height="88" rx="12" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="40" y="425" font-size="12.5" fill="#1d6fa5" text-anchor="start" font-weight="700">连破两大谜团：① 为什么说“古玉钙化”是用词错误？ ② 为什么手盘古玉会慢慢“回润变透”？</text>
<text x="40" y="447" font-size="10.7" fill="#1e293b" text-anchor="start">• 钙化误区：红外与拉曼光谱检测表明，鸡骨白古玉并未变成碳酸钙（CaCO₃），反而因地下水淋滤流失了部分钙镁硅，应称“白化/受沁风化”。</text>
<text x="40" y="468" font-size="10.7" fill="#0f172a" text-anchor="start" font-weight="700">• 盘玉光学：人体皮脂（n ≈ 1.48）渗入表层微孔赶走空气（n = 1.00），界面散射率骤降超 25 倍，光线重新穿透——但出土文物严禁手盘污染！</text>
