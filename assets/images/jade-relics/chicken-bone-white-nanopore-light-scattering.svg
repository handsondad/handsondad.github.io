<text x="380.0" y="30" font-size="18.5" fill="#1e293b" text-anchor="middle" font-weight="700">古玉“鸡骨白”并不是变成了石灰！显微溶蚀孔隙与散射光学揭秘</text>
<text x="380.0" y="52" font-size="12.2" fill="#64748b" text-anchor="middle">就像透明冰块砸成碎冰茬会变白雪：拉曼光谱证实鸡骨白仍是透闪石，白化源于微孔对光线的漫散射</text>
