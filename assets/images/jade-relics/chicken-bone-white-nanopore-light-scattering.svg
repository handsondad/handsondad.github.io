<text x="132" y="132" font-size="10.8" fill="#b45309" text-anchor="middle" font-weight="700">入射自然光</text>
<text x="286" y="146" font-size="10.8" fill="#115e59" text-anchor="middle" font-weight="700">深层柔和透射</text>
<text x="44" y="298" font-size="10.8" fill="#1e293b" text-anchor="start">• 微晶严丝合缝，晶间孔隙远小于可见光波长（&lt;10 nm）；</text>
<text x="44" y="318" font-size="10.8" fill="#1e293b" text-anchor="start">• 内部折射率处处均匀（n ≈ 1.61–1.63），光线深入玉肉</text>
<text x="44" y="338" font-size="10.8" fill="#115e59" text-anchor="start" font-weight="700">  再柔柔折回人眼，呈现凝脂般的“油脂光泽”。</text>
