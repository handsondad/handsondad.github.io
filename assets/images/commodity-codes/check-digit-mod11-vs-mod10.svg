<text x="711" y="132" font-size="10.6" fill="#0f172a" text-anchor="middle" font-weight="700">9</text>
<text x="436" y="164" font-size="10.6" fill="#1d6fa5" text-anchor="middle">1</text>
<text x="461" y="164" font-size="10.6" fill="#1d6fa5" text-anchor="middle">3</text>
<text x="486" y="164" font-size="10.6" fill="#1d6fa5" text-anchor="middle">1</text>
