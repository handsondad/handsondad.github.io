<text x="332" y="214" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700">3072</text>
<text x="40" y="124" font-size="10.5" fill="#64748b" text-anchor="start">字符</text>
<text x="40" y="154" font-size="10.5" fill="#64748b" text-anchor="start">数值</text>
<text x="40" y="184" font-size="10.5" fill="#64748b" text-anchor="start">权重</text>
<text x="40" y="214" font-size="10.5" fill="#64748b" text-anchor="start">乘积</text>
<line x1="36.0" y1="260.0" x2="356.0" y2="260.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="40" y="300" font-size="10.5" fill="#475569" text-anchor="start">字母值从 A=10 起算，跳过 11 的倍数</text>
<text x="40" y="330" font-size="10.5" fill="#475569" text-anchor="start">权重依次是 1、2、4、…、512（2 的幂）</text>
<text x="40" y="374" font-size="11.6" fill="#c25014" text-anchor="start" font-weight="700">Σ = 5494；5494 mod 11 = 5</text>
<rect x="388" y="66" width="352" height="326" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="88" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="406" y="92" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="92" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">商品条码：930123456789 → 7</text>
<text x="436" y="132" font-size="10.6" fill="#0f172a" text-anchor="middle" font-weight="700">9</text>
