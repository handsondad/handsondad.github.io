<line x1="400.0" y1="262.0" x2="724.0" y2="262.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="404" y="300" font-size="10.5" fill="#475569" text-anchor="start">从左往右权重 1、3 交替，正好是模 10 的简便写法</text>
<text x="404" y="330" font-size="10.5" fill="#475569" text-anchor="start">校验位把加权和补到下一个整十</text>
<text x="404" y="374" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">Σ = 113；下个整十是 120 ⇒ 校验位 7</text>
<rect x="20" y="408" width="720" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="434" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">防错能力：为什么一个用素数 11，一个用十进制？</text>
<text x="40" y="462" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="600">ISO 6346：2 的幂与 11 互素，单位错与相邻换位必被抓住；</text>
<text x="40" y="484" font-size="10.5" fill="#475569" text-anchor="start">但字母值 A=10 与 K=21 相差 11，单字母替换可能漏网；余数 10 又被写成 0。</text>
<text x="400" y="462" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="600">GTIN：1/3 权重抓所有单位错，但漏掉约 11% 的相邻换位</text>
<text x="400" y="484" font-size="10.5" fill="#475569" text-anchor="start">（两数相差 5 时 2×5≡0 mod 10），性价比高、适合人工抄写。</text>
<text x="40" y="510" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="700">校验位只能发现“号码内部不一致”，不能证明货物、车辆或箱子真实存在。</text>
</svg>
