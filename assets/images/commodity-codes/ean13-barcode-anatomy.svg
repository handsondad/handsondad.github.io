  @keyframes scanSweep { 0% { transform: translateX(0); opacity: 0.25; } 100% { transform: translateX(202px); opacity: 1; } }
  .scan-line { animation: scanSweep 2.6s ease-in-out 1 forwards; }
  @media (prefers-reduced-motion: reduce) { .scan-line { animation: none !important; transform: none !important; opacity: 1 !important; } }
</style>
