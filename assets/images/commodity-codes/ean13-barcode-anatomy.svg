<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">EAN-13 条码：前缀 690 不是“成分密码”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">扫码器读的是条空宽度，数字只是给人看的；前缀只说明在哪里申请。</text>
