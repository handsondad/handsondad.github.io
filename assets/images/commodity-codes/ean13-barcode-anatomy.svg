<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" viewBox="0 0 760 512" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">EAN-13 商品条码结构、校验位与 ISBN 关系图</title>
<desc id="desc">以6901234567892为例，条码按EAN-13的L/G/R编码表生成95个模块；前12位交替乘1和3得128，补到130得校验位2；前缀690只是GS1分配给中国的国家代码，与商品成分无关，ISBN-13以978或979开头沿用同一校验算法。</desc>
