<text x="142" y="262" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">6901234567892</text>
<text x="142" y="288" font-size="10.5" fill="#475569" text-anchor="middle">95 个模块 · 左右各 10 个静区</text>
<text x="38" y="326" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="600">前 3 位 690：GS1 分配给中国的国家前缀</text>
<text x="38" y="351" font-size="10.5" fill="#475569" text-anchor="start">中间厂商代码 + 商品项目代码由编码组织与厂商分配</text>
<text x="38" y="380" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">“690 表示含激素、691 含铅汞”是谣言：</text>
<text x="38" y="404" font-size="10.5" fill="#1e293b" text-anchor="start">前缀只表示条码申请地，与成分、产地无必然关系。</text>
<text x="38" y="434" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="600">ISBN-13 以 978/979 开头，沿用同一套 GTIN 校验算法。</text>
<rect x="388" y="66" width="352" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="88" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
