<text x="400" y="196" font-size="10.5" fill="#64748b" text-anchor="start">乘积</text>
<line x1="400.0" y1="262.0" x2="724.0" y2="262.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="404" y="286" font-size="10.5" fill="#475569" text-anchor="start">从左往右权重 1、3、1、3……</text>
<text x="404" y="314" font-size="10.5" fill="#475569" text-anchor="start">校验位 = 10 − (Σ mod 10)，若整除则写 0</text>
<text x="404" y="354" font-size="11" fill="#18794e" text-anchor="start" font-weight="700">加权和 = 128 ⇒ 下一个整十是 130</text>
<text x="404" y="382" font-size="11.6" fill="#0f172a" text-anchor="start" font-weight="700">校验位 = 130 − 128 = 2</text>
<line x1="404.0" y1="398.0" x2="724.0" y2="398.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="404" y="424" font-size="11.4" fill="#6d28d9" text-anchor="start" font-weight="700">完整 GTIN-13：6901234567892</text>
<text x="404" y="448" font-size="10.5" fill="#475569" text-anchor="start">ISBN-13、EAN-13、GTIN-13 是同一族编码。</text>
