<svg xmlns="http://www.w3.org/2000/svg" width="760" height="526" viewBox="0 0 760 526" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">ISO 6346 集装箱号与尺寸类型码解剖图</title>
<desc id="desc">11位集装箱号由3位注册箱主代号、1位设备类别字母U或J或Z、6位顺序号和1位校验位组成，尺寸类型码另占4位，例如22G1表示20英尺普通箱，45G1表示40英尺高箱；校验位正确只说明号码内部自洽，并不证明箱子真实存在。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="525" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">集装箱的 11 位身份证：每一段都有主人</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">箱主代号、设备类别、顺序号、校验位——连最后一位的方框都有讲究。</text>
<rect x="20" y="66" width="720" height="190" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="94" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">ISO 6346 识别标记示例</text>
<rect x="40" y="150" width="172" height="46" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="126.0" y="183" font-size="21" fill="#1d6fa5" text-anchor="middle" font-weight="700">BIC</text>
<text x="126.0" y="218" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="600">箱主代号（3 位字母）</text>
<text x="126.0" y="238" font-size="10.5" fill="#64748b" text-anchor="middle">向 BIC 注册，全球唯一</text>
<rect x="218" y="150" width="76" height="46" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="256.0" y="183" font-size="19" fill="#c25014" text-anchor="middle" font-weight="700">U</text>
<text x="256.0" y="218" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="600">设备类别（1 位）</text>
<text x="256.0" y="238" font-size="10.5" fill="#64748b" text-anchor="middle">U 箱 / J 设备 / Z 底盘</text>
<rect x="300" y="150" width="212" height="46" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="406.0" y="183" font-size="21" fill="#18794e" text-anchor="middle" font-weight="700">123456</text>
<text x="406.0" y="218" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="600">顺序号（6 位数字）</text>
<text x="406.0" y="238" font-size="10.5" fill="#64748b" text-anchor="middle">箱主编制，不足补 0</text>
<rect x="518" y="150" width="92" height="46" rx="6" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.3"/>
<text x="564.0" y="183" font-size="19" fill="#6d28d9" text-anchor="middle" font-weight="700">5</text>
<text x="564.0" y="218" font-size="10.8" fill="#0f172a" text-anchor="middle" font-weight="600">校验位（1 位）</text>
<text x="564.0" y="238" font-size="10.5" fill="#64748b" text-anchor="middle">前 10 位算出，常加框</text>
<text x="40" y="126" font-size="13.5" fill="#475569" text-anchor="start">BICU 123456 5</text>
<text x="706" y="126" font-size="11.2" fill="#475569" text-anchor="end" font-weight="600">共 11 个字符</text>
<rect x="20" y="270" width="352" height="196" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="292" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="296" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="296" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">箱主代号：先注册，才敢刷漆</text>
<text x="38" y="324" font-size="10.5" fill="#1e293b" text-anchor="start">• 前 3 位字母（如 BIC、MSU、COS）由箱主</text>
<text x="38" y="345" font-size="10.5" fill="#1e293b" text-anchor="start">  向 BIC 登记；第 4 位字母说明设备种类。</text>
<text x="38" y="370" font-size="10.5" fill="#1e293b" text-anchor="start">• 同一个箱子在门板、侧板、顶板上都刷同一串号，</text>
<text x="38" y="391" font-size="10.5" fill="#1e293b" text-anchor="start">  码头、堆场、船公司靠它跨系统对上号。</text>
<text x="38" y="420" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="600">BIC 国际箱主代号登记册自 1970 年起发布。</text>
<text x="38" y="446" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">校验位正确 ≠ 这个箱子真的存在。</text>
<rect x="388" y="270" width="352" height="196" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="292" r="10.5" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="406" y="296" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="296" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">尺寸类型码：另外 4 位字符</text>
<text x="404" y="326" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">第 1 位：长度    第 2 位：高度／宽度</text>
<text x="404" y="348" font-size="10.5" fill="#475569" text-anchor="start">第 3–4 位：箱型与版本（G1=通用箱）</text>
<rect x="404.0" y="366.0" width="150" height="24" rx="12.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="479.0" y="382.3" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">22G1 → 20 英尺普通箱</text>
<text x="562" y="383" font-size="10.5" fill="#475569" text-anchor="start">高 8 英尺 6 英寸（2591 mm）</text>
<rect x="404.0" y="402.0" width="150" height="24" rx="12.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="479.0" y="418.3" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">45G1 → 40 英尺高箱</text>
<text x="562" y="419" font-size="10.5" fill="#475569" text-anchor="start">高 9 英尺 6 英寸（2896 mm）</text>
<text x="404" y="446" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="600">号码说明“是谁的箱子”，类型码说明“怎样的箱子”。</text>
<rect x="20" y="480" width="720" height="36" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="504" font-size="10.6" fill="#475569" text-anchor="start">1956 年现代集装箱运输起步；1968 年前后 ISO 推出统一标志，随后形成 ISO 6346。</text>
</svg>
