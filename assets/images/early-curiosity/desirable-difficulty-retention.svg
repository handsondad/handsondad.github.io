<svg xmlns="http://www.w3.org/2000/svg" width="760" height="332" viewBox="0 0 760 332" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">被动重读与主动检索记忆留存反转曲线及AI时代合意困难学习法</title>
<desc id="desc">左图依据2006年Roediger与Karpicke实验绘出5分钟后被动重读81%略高但一周后主动检索56%大幅反超被动重读42%的交叉曲线；右图给出避免AI流畅性错觉的三步家庭实践。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="331" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么 AI“秒给答案”越顺滑，大脑反而忘得越快？合意困难与记忆反转曲线</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">据 Roediger &amp; Karpicke（2006，Psychological Science）经典实验绘制：省力重读 vs 费力回想。</text>
<rect x="20" y="62" width="380" height="254" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="85" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">① 5 分钟后的“学会错觉” vs 一周后的“真本事”</text>
<line x1="72" y1="114.0" x2="72" y2="254" stroke="#475569" stroke-width="1.3"/>
<line x1="72" y1="254" x2="366.0" y2="254" stroke="#475569" stroke-width="1.3"/>
<line x1="72" y1="254.0" x2="366.0" y2="254.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="66" y="258.0" font-size="9.8" fill="#64748b" text-anchor="end">30%</text>
<line x1="72" y1="207.3" x2="366.0" y2="207.3" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="66" y="211.3" font-size="9.8" fill="#64748b" text-anchor="end">50%</text>
<line x1="72" y1="160.7" x2="366.0" y2="160.7" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="66" y="164.7" font-size="9.8" fill="#64748b" text-anchor="end">70%</text>
<line x1="72" y1="114.0" x2="366.0" y2="114.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="66" y="118.0" font-size="9.8" fill="#64748b" text-anchor="end">90%</text>
<text x="96" y="272" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">5 分钟后测</text>
<text x="219.0" y="272" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">2 天后测</text>
<text x="342.0" y="272" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="600">1 周后测</text>
<polyline points="96.0,135.0 219.0,198.0 342.0,226.0" fill="none" stroke="#c25014" stroke-width="2.2" stroke-dasharray="5 3"/>
<polyline points="96.0,149.0 219.0,165.3 342.0,193.3" fill="none" stroke="#18794e" stroke-width="2.5"/>
<circle cx="96.0" cy="135.0" r="4" fill="#c25014"/>
<text x="96" y="127.0" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700">81%</text>
<circle cx="219.0" cy="198.0" r="4" fill="#c25014"/>
<text x="229.0" y="213.0" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700">54%</text>
<circle cx="342.0" cy="226.0" r="4" fill="#c25014"/>
<text x="352.0" y="241.0" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700">42%</text>
<circle cx="96.0" cy="149.0" r="4.5" fill="#18794e"/>
<text x="96" y="165.0" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700">75%</text>
<circle cx="219.0" cy="165.3" r="4.5" fill="#18794e"/>
<text x="219.0" y="156.3" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700">68%</text>
<circle cx="342.0" cy="193.3" r="4.5" fill="#18794e"/>
<text x="342.0" y="184.3" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700">56%</text>
<text x="240" y="126" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700" class="halo">主动费力回想组（一周仍留存 56%！）</text>
<text x="256" y="224" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">顺滑反复看答案组（掉到 42%）</text>
<text x="36" y="298" font-size="10.0" fill="#64748b" text-anchor="start">反转真相：反复看答案组考前自信心更高，一周后却忘掉近一半！</text>
<rect x="412" y="62" width="328" height="254" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="428" y="85" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">② 给家庭加一点“合意困难（Desirable Difficulty）”</text>
<rect x="428" y="102" width="296" height="62" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="440" y="120" font-size="10.8" fill="#c25014" text-anchor="start" font-weight="700">警惕“流畅性错觉（Fluency Illusion）”</text>
<text x="440" y="138" font-size="10.1" fill="#1e293b" text-anchor="start">看着 AI 秒写出的漂亮解析连连点头：“看懂了！”</text>
<text x="440" y="154" font-size="10.1" fill="#1e293b" text-anchor="start">其实只调用了短期识别，没在脑中刻下提取路径。</text>
<rect x="428" y="176" width="296" height="62" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="440" y="194" font-size="10.8" fill="#1d6fa5" text-anchor="start" font-weight="700">第一步：合上书/关掉屏幕“硬憋三分钟”</text>
<text x="440" y="212" font-size="10.1" fill="#1e293b" text-anchor="start">先用自己的歪扭画图或大白话猜一遍、讲给爸妈听；</text>
<text x="440" y="228" font-size="10.1" fill="#1e293b" text-anchor="start">哪怕猜错了，卡壳本身就在给神经元涂“助焊剂”！</text>
<rect x="428" y="250" width="296" height="62" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="440" y="268" font-size="10.8" fill="#18794e" text-anchor="start" font-weight="700">第二步：再用工具对照，找“我漏了哪一步”</text>
<text x="440" y="286" font-size="10.1" fill="#1e293b" text-anchor="start">把 AI 从“替身枪手”降级成“对答案时的陪练”，</text>
<text x="440" y="302" font-size="10.1" fill="#1e293b" text-anchor="start">亲手合上书重讲一遍才算真正装进自己脑子里。</text>
</svg>
