<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">恒星月与朔望月几何差及十五的月亮十六圆时间成因</title>
<desc id="desc">左图展示地球公转前进导致月球转满360度恒星月27.32天后还需多走2.21天才回到日月同经度的朔望月29.53天；右图解释合朔时刻跨度与月球远地点减速为何使满月最常落在农历十六。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">月亮的两个常见追问：为什么朔望月比公转周期长 2.2 天？为什么“十五的月亮十六圆”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图演示地球边走边看导致月亮必须多追约 29°；右图算清“初一朔时刻 + 椭圆慢半圈”的时间账。</text>
<rect x="20" y="62" width="352" height="252" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="85" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">① 恒星月 27.32 天 vs 朔望月 29.53 天</text>
<circle cx="74" cy="188" r="18" fill="#fde047" stroke="#c25014" stroke-width="1.5"/>
<text x="74" y="192" font-size="10.2" fill="#0f172a" text-anchor="middle" font-weight="700">太阳</text>
<path d="M222,256 Q262,188 228,118" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="242" cy="224" r="34" fill="none" stroke="#93c5fd" stroke-width="1.1" stroke-dasharray="3 2"/>
<circle cx="242" cy="224" r="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="286" y="228" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="600">初一地球</text>
<circle cx="244" cy="142" r="34" fill="none" stroke="#93c5fd" stroke-width="1.1" stroke-dasharray="3 2"/>
<circle cx="244" cy="142" r="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="288" y="146" font-size="10.2" fill="#1d6fa5" text-anchor="start" font-weight="600">29.5天后</text>
<circle cx="209" cy="217" r="5" fill="#475569"/>
<line x1="74" y1="188" x2="242" y2="224" stroke="#c25014" stroke-width="1.1" stroke-dasharray="3 3"/>
<line x1="74" y1="188" x2="244" y2="142" stroke="#c25014" stroke-width="1.3"/>
<line x1="244" y1="142" x2="200" y2="133" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 2"/>
<circle cx="211" cy="135" r="4.5" fill="#cbd5e1" stroke="#475569"/>
<circle cx="213" cy="155" r="5" fill="#c25014"/>
<text x="154" y="114" font-size="10.0" fill="#475569" text-anchor="middle">27.32天转满360°</text>
<text x="156" y="174" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">再多追2.21天重新对准太阳!</text>
<text x="36" y="294" font-size="10.3" fill="#64748b" text-anchor="start">公式核验：1/27.32 − 1/365.26 = 1/29.53（分毫不差！）</text>
<rect x="384" y="62" width="356" height="252" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="400" y="85" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">② 为什么满月最爱落在农历十六？</text>
<rect x="400" y="102" width="324" height="92" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="412" y="122" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700">原因一：“初一”是一整天，“朔”只是一个瞬间</text>
<text x="412" y="143" font-size="10.4" fill="#1e293b" text-anchor="start">• 只要“朔”落在当天 00:00–23:59，这天就定为初一</text>
<text x="412" y="162" font-size="10.4" fill="#1e293b" text-anchor="start">• 若初一下午 18:00 才合朔，往后加半个月（平均 14.77 天</text>
<text x="412" y="180" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">  = 14天18小时），就已经跨进十六中午 12:00 了！</text>
<rect x="400" y="204" width="324" height="94" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="412" y="224" font-size="11.0" fill="#c25014" text-anchor="start" font-weight="700">原因二：月球也走椭圆轨道（远地点慢悠悠）</text>
<text x="412" y="245" font-size="10.4" fill="#1e293b" text-anchor="start">• 过近地点快：朔到望最短仅约 13.9 天 → 十五甚至十四圆</text>
<text x="412" y="264" font-size="10.4" fill="#1e293b" text-anchor="start">• 过远地点慢：朔到望最长可达约 15.6 天！</text>
<text x="412" y="283" font-size="10.3" fill="#c25014" text-anchor="start" font-weight="700">→ 初一晚合朔 + 远地点慢半圈 = 十六圆最常见，偶尔十七圆！</text>
</svg>
