<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">婴儿原初对话轮流留白节拍与成人连珠炮单向输出对比</title>
<desc id="desc">上图展示0至8.5秒内宝宝发球、父母回应、留白1.5秒等待宝宝再发声的良性对话节拍；下图对比成人连续发问无留白导致婴儿感官过载移开视线。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="319" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">开口说话前，宝宝早就懂“聊天节奏”了：乒乓式留白对话 vs 连珠炮式抢话</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">把每一次微笑和“啊—哦”当成一拍音乐：大人留出 1–2 秒空白，宝宝才会把下一球发回来。</text>
<rect x="20" y="62" width="720" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.2" fill="#18794e" text-anchor="start" font-weight="700">① 健康的“原初对话（Proto-conversation）”：一发一回，中间留出等待空白</text>
<line x1="56" y1="138" x2="702.0" y2="138" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="67.4" y="102" width="76.0" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="105.4" y="120" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700">宝宝：凝视+笑</text>
<rect x="158.6" y="102" width="98.8" height="28" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="208.0" y="120" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">爸妈：“醒啦！”</text>
<rect x="272.6" y="102" width="106.4" height="28" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1.4"/>
<text x="325.8" y="120" font-size="10.0" fill="#18794e" text-anchor="middle" font-weight="700">留白 1.5s 等他接</text>
<rect x="394.2" y="102" width="83.6" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="436.0" y="120" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700">宝宝：“啊—咕！”</text>
<rect x="493.0" y="102" width="98.8" height="28" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="542.4" y="120" font-size="10.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">爸妈模仿回应</text>
<rect x="607.0" y="102" width="83.6" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="648.8" y="120" font-size="10.0" fill="#c25014" text-anchor="middle" font-weight="700">宝宝咯咯大笑!</text>
<text x="36" y="164" font-size="10.5" fill="#1e293b" text-anchor="start">效果：宝宝发现“我的声音和笑容能改变大人的反应！” → 轮流对话与语言神经回路高速连线。</text>
<rect x="20" y="192" width="720" height="112" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="214" font-size="12.2" fill="#c25014" text-anchor="start" font-weight="700">② 成人“播音员式连珠炮”：全程塞满无留白 → 宝宝过载扭头断开连接</text>
<line x1="56" y1="264" x2="702.0" y2="264" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="71.2" y="230" width="440.8" height="28" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="291.6" y="248" font-size="10.1" fill="#c25014" text-anchor="middle" font-weight="600">大人连问：“看这是啥？红球！圆不圆？跟爸爸念球球！怎么不笑呀？看镜头！”</text>
<rect x="527.2" y="230" width="159.6" height="28" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.3"/>
<text x="607.0" y="248" font-size="10.1" fill="#475569" text-anchor="middle" font-weight="700">宝宝：扭头/打哈欠避开</text>
<text x="36" y="288" font-size="10.5" fill="#64748b" text-anchor="start">提醒：宝宝移开视线不是“不理人”，而是大脑在给自己降温减负——停下来安静抱抱就是最好回应。</text>
</svg>
