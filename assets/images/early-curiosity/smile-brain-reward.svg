<svg xmlns="http://www.w3.org/2000/svg" width="760" height="334" viewBox="0 0 760 334" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">杜氏微笑肌肉特征与父母多巴胺奖赏回路及婴儿笑声排行榜</title>
<desc id="desc">左图解析眼轮匝肌与颧大肌共同构成的杜氏真笑及2008年Pediatrics脑成像发现的多巴胺奖赏激活；右图展示伦敦大学金史密斯学院婴儿笑声项目中躲猫猫约70%放声大笑率。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="333" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么宝宝一笑大人就“满血复活”？杜氏微笑解剖、多巴胺回路与婴儿幽默排行榜</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图结合杜氏微笑（Duchenne Smile）与 Strathearn（2008）fMRI 研究；右图展示伦敦大学金史密斯学院婴儿笑声调查。</text>
<rect x="20" y="62" width="356" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="85" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">① 弯成月牙的眼睛 + 大脑多巴胺“充电宝”</text>
<circle cx="92" cy="146" r="36" fill="#fff7ed" stroke="#c25014" stroke-width="1.6"/>
<path d="M74,140 Q81,132 88,140" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
<path d="M96,140 Q103,132 110,140" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="73" cy="151" r="5" fill="#fda4af" opacity="0.55"/>
<circle cx="111" cy="151" r="5" fill="#fda4af" opacity="0.55"/>
<path d="M79,154 Q92,168 105,154" fill="none" stroke="#c25014" stroke-width="2.2" stroke-linecap="round"/>
<text x="144" y="122" font-size="10.6" fill="#1d6fa5" text-anchor="start" font-weight="700">• 眼轮匝肌收缩 → 眼睛弯成两道月牙</text>
<text x="144" y="142" font-size="10.2" fill="#64748b" text-anchor="start">  （很难靠意志假装的“杜氏真笑”标志）</text>
<text x="144" y="164" font-size="10.6" fill="#c25014" text-anchor="start" font-weight="700">• 颧大肌上提 → 嘴角翘起发出社交邀请</text>
<rect x="36" y="196" width="324" height="108" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="48" y="216" font-size="11.0" fill="#1d6fa5" text-anchor="start" font-weight="700">Strathearn 等（2008，Pediatrics）脑成像发现：</text>
<text x="48" y="237" font-size="10.4" fill="#1e293b" text-anchor="start">• 28 位新手妈妈看自家 5–10 月龄宝宝照片时：</text>
<text x="48" y="256" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">• 唯有“开心笑脸”特异性点亮黑质—纹状体多巴胺奖赏区</text>
<text x="48" y="275" font-size="10.3" fill="#1e293b" text-anchor="start">  （开心 &gt; 平静 &gt; 哭泣），从生理层面帮疲惫父母“回血”！</text>
<rect x="388" y="62" width="352" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="85" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">② 什么最能逗笑宝宝？（伦敦大学 390 家庭实测）</text>
<text x="404" y="115" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">双手躲猫猫（Peekaboo）</text>
<rect x="404" y="121" width="164.5" height="12" rx="6" fill="#18794e" opacity="0.85"/>
<text x="574.5" y="131" font-size="9.8" fill="#64748b" text-anchor="start">~70%  冠军！纯眼神全神贯注连接</text>
<text x="404" y="157" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">挠痒痒 / 身体轻触游戏</text>
<rect x="404" y="163" width="122.2" height="12" rx="6" fill="#1d6fa5" opacity="0.85"/>
<text x="532.2" y="173" font-size="9.8" fill="#64748b" text-anchor="start">~52%  触觉预期与悬念感</text>
<text x="404" y="199" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">把杯子顶在头上装傻</text>
<rect x="404" y="205" width="89.3" height="12" rx="6" fill="#c25014" opacity="0.85"/>
<text x="499.3" y="215" font-size="9.8" fill="#64748b" text-anchor="start">~38%  温和打破日常规则的反差</text>
<text x="404" y="241" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="600">拿猫咪玩偶学小狗“汪汪”</text>
<rect x="404" y="247" width="79.9" height="12" rx="6" fill="#6d28d9" opacity="0.85"/>
<text x="489.9" y="257" font-size="9.8" fill="#64748b" text-anchor="start">~34%  概念错位（大一点更爱笑）</text>
<rect x="404" y="274" width="320" height="32" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="564" y="294" font-size="10.2" fill="#18794e" text-anchor="middle" font-weight="700">Addyman 核心结论：逗笑宝宝的秘诀不是道具，是 100% 在场的专注！</text>
</svg>
