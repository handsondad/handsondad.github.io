<svg xmlns="http://www.w3.org/2000/svg" width="760" height="328" viewBox="0 0 760 328" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">农历无中气置闰规则与地球椭圆轨道冬夏中气间距对比</title>
<desc id="desc">上图展示夏半年远日点附近两中气间隔约31.4天大于29.5天朔望月，易出现不含中气的闰月；下图展示冬半年近日点附近两中气仅隔约29.4天，极难产生闰腊月或闰正月。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="327" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">无中气置闰：为什么“闰四月、闰五月”常见，“闰腊月、闰正月”极罕见？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">地球公转轨道是椭圆（1月初近日点快、7月初远日点慢），直接拉开了冬夏两个“中气”的时间间距！</text>
<rect x="20" y="62" width="720" height="122" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="85" font-size="12.2" fill="#18794e" text-anchor="start" font-weight="700">① 夏半年（远日点附近地球走得慢）：两个中气相隔约 31.5 天 &gt; 朔望月 29.5 天 → 容易卡出“无中气闰月”！</text>
<line x1="68" y1="132" x2="693.6" y2="132" stroke="#475569" stroke-width="1.5"/>
<rect x="81.8" y="102" width="271.7" height="26" rx="5" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<text x="217.6" y="119" font-size="10.3" fill="#c25014" text-anchor="middle" font-weight="700">这个农历月夹在两中气之间：0 个中气 → 定为闰五月！</text>
<rect x="353.5" y="102" width="271.7" height="26" rx="5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="489.3" y="119" font-size="10.3" fill="#1d6fa5" text-anchor="middle" font-weight="700">含“大暑” → 六月</text>
<line x1="68.0" y1="96" x2="68.0" y2="146" stroke="#18794e" stroke-width="2.0"/>
<circle cx="68.0" cy="132" r="4" fill="#18794e"/>
<text x="68.0" y="164" font-size="10.4" fill="#18794e" text-anchor="middle" font-weight="700">中气：夏至(90°)</text>
<line x1="357.5" y1="96" x2="357.5" y2="146" stroke="#18794e" stroke-width="2.0"/>
<circle cx="357.5" cy="132" r="4" fill="#18794e"/>
<text x="357.5" y="164" font-size="10.4" fill="#18794e" text-anchor="middle" font-weight="700">中气：大暑(120°)</text>
<line x1="647.0" y1="96" x2="647.0" y2="146" stroke="#18794e" stroke-width="2.0"/>
<circle cx="647.0" cy="132" r="4" fill="#18794e"/>
<text x="647.0" y="164" font-size="10.4" fill="#18794e" text-anchor="middle" font-weight="700">中气：处暑(150°)</text>
<rect x="20" y="196" width="720" height="118" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="219" font-size="12.2" fill="#1d6fa5" text-anchor="start" font-weight="700">② 冬半年（近日点附近地球走得快）：两个中气仅隔约 29.4 天 ≤ 朔望月 29.5 天 → 几乎每月都撞上中气！</text>
<line x1="68" y1="264" x2="693.6" y2="264" stroke="#475569" stroke-width="1.5"/>
<rect x="77.2" y="234" width="271.7" height="26" rx="5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="213.0" y="251" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="600">含“大寒” → 十二月（腊月）</text>
<rect x="348.9" y="234" width="271.7" height="26" rx="5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="484.7" y="251" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="600">含“雨水” → 正月</text>
<line x1="68.0" y1="228" x2="68.0" y2="278" stroke="#1d6fa5" stroke-width="2.0"/>
<circle cx="68.0" cy="264" r="4" fill="#1d6fa5"/>
<text x="68.0" y="296" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">中气：冬至(270°)</text>
<line x1="338.8" y1="228" x2="338.8" y2="278" stroke="#1d6fa5" stroke-width="2.0"/>
<circle cx="338.8" cy="264" r="4" fill="#1d6fa5"/>
<text x="338.8" y="296" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">中气：大寒(300°)</text>
<line x1="609.6" y1="228" x2="609.6" y2="278" stroke="#1d6fa5" stroke-width="2.0"/>
<circle cx="609.6" cy="264" r="4" fill="#1d6fa5"/>
<text x="609.6" y="296" font-size="10.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">中气：雨水(330°)</text>
</svg>
