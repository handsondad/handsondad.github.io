<svg xmlns="http://www.w3.org/2000/svg" width="760" height="334" viewBox="0 0 760 334" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">婴儿周岁整夜觉达标比例曲线与语言理解表达冰山模型</title>
<desc id="desc">左图依据2010年Pediatrics纵向研究展示1至12月龄22点至早6点连续睡眠比例（满12月仍有28%健康婴儿未达标）；右图用冰山模型对比水下庞大理解词汇与水上延迟爆发的口语表达词汇。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="333" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">最磨人的两件大事：为什么满周岁还有近三成健康宝宝夜醒？为什么“听懂”远早于“开口”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左图据 Pediatrics（2010）实测绘出整夜觉达标曲线；右图展示“水下理解词库”托起“水上开口爆发”的语言冰山。</text>
<rect x="20" y="62" width="362" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="85" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">① 睡整觉实测（22:00–06:00 连续不醒比例）</text>
<line x1="68" y1="114.0" x2="68" y2="256" stroke="#475569" stroke-width="1.3"/>
<line x1="68" y1="256" x2="354.0" y2="256" stroke="#475569" stroke-width="1.3"/>
<line x1="68" y1="256.0" x2="354.0" y2="256.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="62" y="260.0" font-size="9.8" fill="#64748b" text-anchor="end">0%</text>
<line x1="68" y1="185.0" x2="354.0" y2="185.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="62" y="189.0" font-size="9.8" fill="#64748b" text-anchor="end">50%</text>
<line x1="68" y1="114.0" x2="354.0" y2="114.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="62" y="118.0" font-size="9.8" fill="#64748b" text-anchor="end">100%</text>
<polyline points="68.0,247.5 94.0,230.4 120.0,206.3 146.0,190.7 172.0,180.7 198.0,173.6 276.0,160.9 354.0,153.8" fill="none" stroke="#1d6fa5" stroke-width="2.4"/>
<text x="68.0" y="271" font-size="9.8" fill="#64748b" text-anchor="middle">1月</text>
<text x="120.0" y="271" font-size="9.8" fill="#64748b" text-anchor="middle">3月</text>
<text x="172.0" y="271" font-size="9.8" fill="#64748b" text-anchor="middle">5月</text>
<text x="276.0" y="271" font-size="9.8" fill="#64748b" text-anchor="middle">9月</text>
<text x="354.0" y="271" font-size="9.8" fill="#64748b" text-anchor="middle">12月</text>
<circle cx="354.0" cy="153.8" r="4.5" fill="#c25014" stroke="#fff" stroke-width="1.2"/>
<text x="348.0" y="143.8" font-size="10.0" fill="#c25014" text-anchor="end" font-weight="700" class="halo">12月龄：72% 达标（仍有 28% 健康宝宝夜醒！）</text>
<text x="36" y="296" font-size="10.0" fill="#64748b" text-anchor="start">来源：Henderson 等（2010，N=75 红外录像校验）——夜醒≠睡眠故障！</text>
<rect x="394" y="62" width="346" height="256" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="410" y="85" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">② 语言发育的“冰山定律”：先攒水下，再冒水面</text>
<rect x="410" y="162" width="314" height="108" rx="8" fill="#eaf4fb"/>
<line x1="410" y1="162" x2="724" y2="162" stroke="#1d6fa5" stroke-width="1.8" stroke-dasharray="5 3"/>
<text x="718" y="155" font-size="9.8" fill="#c25014" text-anchor="end" font-weight="700">水面：外人听得见的“开口说”</text>
<polygon points="530,162 594,162 562,116" fill="#fef1e8" stroke="#c25014" stroke-width="1.6"/>
<text x="486" y="134" font-size="10.5" fill="#c25014" text-anchor="end" font-weight="700">表达词汇（说得出）</text>
<text x="486" y="150" font-size="9.8" fill="#1e293b" text-anchor="end">12月仅几词 → 18–24月爆发</text>
<polygon points="518,164 606,164 656,258 468,258" fill="#bfdbfe" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="562" y="196" font-size="11.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">水下巨型底座：理解词汇（听得懂）</text>
<text x="562" y="217" font-size="10.1" fill="#0f172a" text-anchor="middle">• 8–12月：还不会说，已听懂几十个日常词与手势</text>
<text x="562" y="236" font-size="10.1" fill="#0f172a" text-anchor="middle">• 约 14 月：常能听懂 50–100+ 词，嘴上只蹦几个词</text>
<text x="410" y="294" font-size="10.1" fill="#18794e" text-anchor="start" font-weight="700">观察重点：先看他能不能听懂指认、眼神交流，不只数会背几个词！</text>
</svg>
