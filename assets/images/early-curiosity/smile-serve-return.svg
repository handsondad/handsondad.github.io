<svg xmlns="http://www.w3.org/2000/svg" width="760" height="328" viewBox="0 0 760 328" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">婴儿第一年笑容发育四阶段与哈佛发球回球五步互动图</title>
<desc id="desc">左图按月龄区分0至4周反射性微笑、约2个月社会性微笑、约4个月轻笑与6个月以上放声大笑；右图列出哈佛儿童发展中心发球与回球五步互动。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="327" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">从无意识嘴角上扬到“你笑我也笑”：婴儿笑容的四步升级与发球—回球回路</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">对照 CDC 发育里程碑与哈佛儿童发展中心（Serve and Return）互动模型绘制。</text>
<rect x="20" y="62" width="352" height="250" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 第一年里的四种“笑”</text>
<rect x="36.0" y="100.0" width="72" height="22" rx="11.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="72.0" y="115.0" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="600">0–4 周</text>
<text x="118" y="115" font-size="11.5" fill="#475569" text-anchor="start" font-weight="700">内源/反射性微笑</text>
<text x="118" y="133" font-size="10.3" fill="#1e293b" text-anchor="start">多出现在浅睡（REM）期，尚非看清人脸后的社交回应</text>
<rect x="36.0" y="150.0" width="72" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="72.0" y="165.0" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">约 2 个月</text>
<text x="118" y="165" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">社会性微笑登场！</text>
<text x="118" y="183" font-size="10.3" fill="#1e293b" text-anchor="start">看清 20–25cm 外你的脸、听到声音后主动回以微笑</text>
<rect x="36.0" y="200.0" width="72" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="72.0" y="215.0" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">约 4 个月</text>
<text x="118" y="215" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">轻笑与主动撩人</text>
<text x="118" y="233" font-size="10.3" fill="#1e293b" text-anchor="start">会自己先笑来吸引你注意，逗乐时发出轻快笑声</text>
<rect x="36.0" y="250.0" width="72" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="72.0" y="265.0" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">约 6 个月+</text>
<text x="118" y="265" font-size="11.5" fill="#18794e" text-anchor="start" font-weight="700">放声咯咯笑与预期幽默</text>
<text x="118" y="283" font-size="10.3" fill="#1e293b" text-anchor="start">会轮流发声，不等手碰到肚子、光看怪表情就先大笑</text>
<rect x="388" y="62" width="352" height="250" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 哈佛“发球—回球”五步搭起大脑连接</text>
<circle cx="416" cy="112" r="10" fill="#f1f5f9" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="416" y="116" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="434" y="116" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">看见发球：</text>
<text x="502" y="116" font-size="10.4" fill="#1e293b" text-anchor="start">宝宝看向某物、咧嘴笑、咿呀发声或伸手</text>
<circle cx="416" cy="152" r="10" fill="#f1f5f9" stroke="#18794e" stroke-width="1.2"/>
<text x="416" y="156" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">2</text>
<text x="434" y="156" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">温暖回球：</text>
<text x="502" y="156" font-size="10.4" fill="#1e293b" text-anchor="start">大人微笑对视、轻声回应，让宝宝知道“我懂你”</text>
<circle cx="416" cy="192" r="10" fill="#f1f5f9" stroke="#c25014" stroke-width="1.2"/>
<text x="416" y="196" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">3</text>
<text x="434" y="196" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">把话说出来：</text>
<text x="502" y="196" font-size="10.4" fill="#1e293b" text-anchor="start">替眼前的事物或感受命名：“你在看那只小狗呀”</text>
<circle cx="416" cy="232" r="10" fill="#f1f5f9" stroke="#6d28d9" stroke-width="1.2"/>
<text x="416" y="236" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">4</text>
<text x="434" y="236" font-size="11.2" fill="#6d28d9" text-anchor="start" font-weight="700">留白等一等：</text>
<text x="502" y="236" font-size="10.4" fill="#1e293b" text-anchor="start">停几秒等宝宝再咿呀回应，练习像打乒乓球一样轮流</text>
<circle cx="416" cy="272" r="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="416" y="276" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">5</text>
<text x="434" y="276" font-size="11.2" fill="#475569" text-anchor="start" font-weight="700">顺势收尾：</text>
<text x="502" y="276" font-size="10.4" fill="#1e293b" text-anchor="start">宝宝转头、打哈欠就是“打累了”，温柔切换休息</text>
</svg>
