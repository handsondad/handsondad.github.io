<svg xmlns="http://www.w3.org/2000/svg" width="760" height="522" viewBox="0 0 760 522" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">超重助推器7分钟发射热分离返航与机械哥斯拉筷子捕获全流程动画图解</title>
<desc id="desc">左图按时间顺序演示超重助推器33机升空、T+2分41秒保留中心3机的级间热分离、13机返航点火、栅格翼超音速滑翔、外海自动弃捕安全分支以及1公里高度13变3机平移挂入146米发射塔筷子的单次动画；右图展示底部33台猛禽外20中10内3三环布局及双承力销坐落液压缓冲轨的机械细节。</desc>
