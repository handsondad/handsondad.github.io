<svg xmlns="http://www.w3.org/2000/svg" width="760" height="518" viewBox="0 0 760 518" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">星舰304L不锈钢与1.8万片六角石英隔热瓦多层防护及拍肚皮襟翼气动控制原理图</title>
<desc id="desc">左图对比铝合金约160°C软化与304L不锈钢约800°C保强度的耐温差距，剖解钝头脱体激波、密度0.34 g/cm^3六角多孔石英瓦、陶瓷毡与Pyron二次烧蚀层、焊钉机械卡扣不锈钢壁五层防热体系；右图展示星舰65至90度大迎角横躺拍肚皮（终端速度约80 m/s）时四片襟翼向背风侧0至80度收放控制俯仰、横滚与偏航的跳伞力学。</desc>
