<text x="552" y="178" font-size="9.2" fill="#c25014" text-anchor="middle" font-weight="700">后翼上折(小阻)</text>
<text x="496" y="246" font-size="9.3" fill="#18794e" text-anchor="middle" font-weight="700">压心 CP 前移 ⇒ 产生抬头力矩！</text>
<rect x="598" y="118" width="128" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="662" y="136" font-size="10.0" fill="#0f172a" text-anchor="middle" font-weight="700">迎头截面：背风收放</text>
<circle cx="662" cy="218" r="24" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
<path d="M638,218 A24,24 0 0 0 686,218" fill="none" stroke="#0f172a" stroke-width="4.2"/>
<line x1="638" y1="214" x2="608" y2="214" stroke="#18794e" stroke-width="4.0" stroke-linecap="round"/>
<line x1="684" y1="210" x2="696" y2="178" stroke="#c25014" stroke-width="4.0" stroke-linecap="round"/>
<path d="M712,208 A34,34 0 0 0 700,180" fill="none" stroke="#c25014" stroke-width="1.4" stroke-dasharray="3 2" marker-end="url(#ss-orange)"/>
<text x="623" y="232" font-size="9.1" fill="#18794e" text-anchor="middle" font-weight="700">0°平展</text>
<text x="702" y="172" font-size="9.1" fill="#c25014" text-anchor="middle" font-weight="700">80°收拢</text>
<text x="662" y="266" font-size="9.2" fill="#1e293b" text-anchor="middle">不往下翻（避火流）</text>
<text x="662" y="283" font-size="9.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">只往背风侧收拢减阻</text>
<text x="662" y="300" font-size="9.2" fill="#6d28d9" text-anchor="middle" font-weight="700">左右不对称 ⇒ 滚转！</text>
<rect x="402" y="326" width="324" height="166" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="414" y="346" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="700">四片襟翼协同口诀（活脱脱一位钢铁高空跳伞员）：</text>
<rect x="414.0" y="364.0" width="76" height="22" rx="11.0" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="452.0" y="379.0" font-size="9.6" fill="#18794e" text-anchor="middle" font-weight="600">俯仰 Pitch</text>
<text x="498" y="379" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">前翼平展 0° + 后翼收拢 80°</text>
<text x="498" y="394" font-size="9.3" fill="#1e293b" text-anchor="start"> ⇒ 抬头（神龙摆尾起手式！）</text>
<rect x="414.0" y="404.0" width="76" height="22" rx="11.0" fill="#ffffff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="452.0" y="419.0" font-size="9.6" fill="#6d28d9" text-anchor="middle" font-weight="600">横滚 Roll</text>
<text x="498" y="419" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">左收右展 ⇒ 机身侧倾偏转升力，高超</text>
<text x="498" y="434" font-size="9.3" fill="#1e293b" text-anchor="start">音速横向滑翔数百公里</text>
<rect x="414.0" y="444.0" width="76" height="22" rx="11.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="452.0" y="459.0" font-size="9.6" fill="#1d6fa5" text-anchor="middle" font-weight="600">偏航 Yaw</text>
<text x="498" y="459" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">左前+右后对角差动 ⇒ 扭转船头，绕</text>
<text x="498" y="474" font-size="9.3" fill="#1e293b" text-anchor="start">过外海安全门精准对塔</text>
