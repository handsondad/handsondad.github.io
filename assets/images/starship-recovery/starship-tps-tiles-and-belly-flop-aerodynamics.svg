<rect x="0.5" y="0.5" width="759" height="517" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">硬扛 1,400°C 等离子火海还当“跳伞员”：1.8 万片挂钩瓦与拍肚皮控姿术</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：304L 不锈钢 + Pyron 烧蚀垫 + 六角石英瓦多层护盾｜右：四片襟翼怎样学跳伞员收放四肢？</text>
<rect x="20" y="62" width="352" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 为什么弃铝合金，改用不锈钢 + 卡扣六角瓦？</text>
<text x="36" y="102" font-size="10.0" fill="#64748b" text-anchor="start">航天飞机 2.4 万块异形瓦靠胶粘；星舰 ~1.8 万块标准六角瓦靠钢钉挂扣</text>
<rect x="34" y="116" width="324" height="78" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="134" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">箭体金属耐温天花板对比（决定“万一掉一块瓦会不会死”）：</text>
<text x="46" y="155" font-size="9.5" fill="#475569" text-anchor="start" font-weight="600">传统铝合金</text>
<rect x="106" y="145" width="26" height="12" rx="3" fill="#475569"/>
<text x="138" y="155" font-size="9.1" fill="#dc2626" text-anchor="start" font-weight="600">~160°C 软化（~600°C 熔，掉瓦易烧穿）</text>
<text x="46" y="177" font-size="9.5" fill="#1d6fa5" text-anchor="start" font-weight="700">304L 不锈钢</text>
<rect x="106" y="167" width="96" height="12" rx="3" fill="#1d6fa5"/>
<text x="208" y="177" font-size="9.1" fill="#1d6fa5" text-anchor="start" font-weight="700">~800°C 仍保强度（~1420°C 熔）</text>
<text x="36" y="218" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">迎风面热防护（TPS）五层纵深剖面（左热右冷）：</text>
<rect x="34" y="230" width="56" height="154" rx="6" fill="#ffedd5" stroke="#c25014" stroke-width="1"/>
<text x="62" y="266" font-size="9.6" fill="#c25014" text-anchor="middle" font-weight="700">钝头弓形</text>
<text x="62" y="282" font-size="9.6" fill="#c25014" text-anchor="middle" font-weight="700">脱体激波</text>
<text x="62" y="306" font-size="9.6" fill="#dc2626" text-anchor="middle" font-weight="700">&gt;1,400°C</text>
<text x="62" y="324" font-size="9.1" fill="#1e293b" text-anchor="middle">9m 大曲率</text>
<text x="62" y="339" font-size="9.1" fill="#1e293b" text-anchor="middle">推开主热流</text>
<rect x="96" y="230" width="82" height="154" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
<text x="137" y="258" font-size="9.8" fill="#ffffff" text-anchor="middle" font-weight="700">六角石英瓦</text>
<text x="137" y="276" font-size="9.2" fill="#93c5fd" text-anchor="middle" font-weight="600">ρ≈0.34 g/cm³</text>
<text x="137" y="294" font-size="9.2" fill="#e2e8f0" text-anchor="middle">~90% 是空气</text>
<text x="137" y="314" font-size="9.1" fill="#fde68a" text-anchor="middle">黑硼硅玻璃釉</text>
<text x="137" y="330" font-size="9.1" fill="#fde68a" text-anchor="middle">二次辐射散走</text>
<text x="137" y="346" font-size="9.2" fill="#fde68a" text-anchor="middle" font-weight="700">&gt;90% 表面热！</text>
<rect x="184" y="230" width="68" height="154" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="218" y="260" font-size="9.5" fill="#c25014" text-anchor="middle" font-weight="700">缝隙陶瓷毡</text>
<text x="218" y="276" font-size="9.5" fill="#c25014" text-anchor="middle" font-weight="700">+ Pyron</text>
<text x="218" y="292" font-size="9.5" fill="#c25014" text-anchor="middle" font-weight="700">二次烧蚀层</text>
<text x="218" y="318" font-size="9.0" fill="#1e293b" text-anchor="middle">防等离子钻缝</text>
<text x="218" y="334" font-size="9.0" fill="#1e293b" text-anchor="middle">掉瓦时替身保命</text>
<rect x="258" y="230" width="50" height="154" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<rect x="170" y="238" width="88" height="5" rx="1.5" fill="#475569"/>
<rect x="170" y="366" width="88" height="5" rx="1.5" fill="#475569"/>
<text x="283" y="292" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="700">304L</text>
<text x="283" y="308" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="700">不锈钢壁</text>
<text x="283" y="325" font-size="9.1" fill="#64748b" text-anchor="middle">3.97 mm</text>
<text x="283" y="342" font-size="9.1" fill="#1d6fa5" text-anchor="middle" font-weight="600">焊钉卡扣</text>
<rect x="314" y="230" width="44" height="154" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="336" y="294" font-size="9.4" fill="#1d6fa5" text-anchor="middle" font-weight="700">深冷箱</text>
<text x="336" y="312" font-size="9.3" fill="#18794e" text-anchor="middle" font-weight="700">&lt;100°C</text>
<text x="336" y="329" font-size="9.1" fill="#1e293b" text-anchor="middle">安全区</text>
<rect x="34" y="396" width="324" height="96" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="46" y="416" font-size="9.6" fill="#1e293b" text-anchor="start">• 六角阵列无十字长直通缝，钢钉机械卡扣允许瓦片自由热胀冷缩</text>
<text x="46" y="436" font-size="9.6" fill="#1e293b" text-anchor="start">• Block 2/3 将前襟翼后掠并向背风面折起 140°，彻底根治铰链烧蚀</text>
<text x="46" y="456" font-size="9.6" fill="#18794e" text-anchor="start" font-weight="700">• Flight 15 实战检验：Ship 42 扛过 7.8 km/s 再入，完好挂上筷子！</text>
<rect x="388" y="62" width="352" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② “拍肚皮”跳伞术：四片襟翼怎样不动尾翼控三轴？</text>
<text x="404" y="102" font-size="10.0" fill="#64748b" text-anchor="start">迎角 65°～90° 横躺迎风，亚音速终端下坠速度压至仅 ~75–85 m/s</text>
<rect x="402" y="118" width="190" height="196" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="497" y="136" font-size="10.0" fill="#0f172a" text-anchor="middle" font-weight="700">侧视：前后襟翼差动调压心</text>
<line x1="428" y1="296" x2="428" y2="262" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#ss-blue)"/>
<line x1="474" y1="296" x2="474" y2="262" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#ss-blue)"/>
<line x1="520" y1="296" x2="520" y2="262" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#ss-blue)"/>
<line x1="566" y1="296" x2="566" y2="262" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#ss-blue)"/>
<text x="497" y="308" font-size="9.2" fill="#1d6fa5" text-anchor="middle" font-weight="600">迎面气流 v_∞（终端速度 ~80 m/s）</text>
