<title id="title">星舰无损凸优化二阶锥制导原理、最后18秒神龙摆尾翻身捕获轨迹与15次试飞演进图</title>
<desc id="desc">左上图对比带熄火禁区的非凸推力圆环扇区与引入松弛变量后升维而成的实心二阶锥规划（SOCP）凸集，解释机载计算机毫秒级实时重算亚米级轨迹的数学原理；右上图绘制Flight 15任务中Ship 42在540米高度横躺点火、甩尾竖直、微反向消速至95米零速落入Pad 2筷子的18秒动力学过程；下图汇总2023年4月Flight 1至2026年11月14日Flight 15首次捕获入轨二级的五阶段里程碑。</desc>
