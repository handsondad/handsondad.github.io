<svg xmlns="http://www.w3.org/2000/svg" width="760" height="508" viewBox="0 0 760 508" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">猛禽全流量分级燃烧甲烷发动机循环与星舰鼻锥头部小贮箱防晃动供油原理图</title>
<desc id="desc">左图展示猛禽发动机（Raptor）100%过冷液氧与100%过冷液态甲烷分别驱动富氧与富燃预燃室涡轮泵、在300至350 bar主燃烧室纯气态混合自燃并支持电火花多次重燃的全流量分级燃烧架构；右图对比横躺90度从巨型主贮箱抽油导致吸入增压气体空化爆炸的反例，与鼻锥尖端100%满液LOX/LCH4头部小贮箱经独立下输管稳定供油并前移质心的设计。</desc>
