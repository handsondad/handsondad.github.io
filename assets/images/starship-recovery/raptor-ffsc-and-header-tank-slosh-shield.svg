<rect x="0.5" y="0.5" width="759" height="507" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">半空急刹全靠哪颗“心脏”？全流量分级燃烧猛禽与鼻锥“防晃小油箱”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：全球首款实用化全流量分级燃烧甲烷机（Raptor）｜右：为什么横躺坠落绝不能直接抽主贮箱？</text>
<rect x="20" y="62" width="352" height="432" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13.0" fill="#0f172a" text-anchor="start" font-weight="700">① 猛禽发动机：纯气态对撞燃烧，零结焦秒重燃</text>
<text x="36" y="102" font-size="10.0" fill="#64748b" text-anchor="start">过冷液态甲烷/液氧（~93–95 K，氧燃比 ~3.6:1）天生适合高频免检复用</text>
<rect x="36" y="118" width="150" height="46" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="111" y="137" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">100% 过冷液氧 LOX</text>
<text x="111" y="153" font-size="9.3" fill="#1e293b" text-anchor="middle">SX500 耐富氧超合金泵增压</text>
<rect x="206" y="118" width="150" height="46" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="281" y="137" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">100% 过冷甲烷 LCH₄</text>
<text x="281" y="153" font-size="9.3" fill="#1e293b" text-anchor="middle">先流经喷管室壁再生冷却</text>
<line x1="111" y1="164" x2="111" y2="184" stroke="#1d6fa5" stroke-width="2.0" marker-end="url(#ss-blue)"/>
<line x1="281" y1="164" x2="281" y2="184" stroke="#c25014" stroke-width="2.0" marker-end="url(#ss-orange)"/>
<line x1="216" y1="172" x2="146" y2="184" stroke="#c25014" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#ss-orange)"/>
<line x1="176" y1="172" x2="246" y2="184" stroke="#1d6fa5" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#ss-blue)"/>
<rect x="36" y="188" width="150" height="52" rx="7" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="111" y="208" font-size="10.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">富氧预燃室 + 氧涡轮</text>
<text x="111" y="226" font-size="9.4" fill="#1e293b" text-anchor="middle">化作中温高压富氧燃气</text>
<rect x="206" y="188" width="150" height="52" rx="7" fill="#ffffff" stroke="#c25014" stroke-width="1.4"/>
<text x="281" y="208" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">富燃预燃室 + 燃涡轮</text>
<text x="281" y="226" font-size="9.4" fill="#1e293b" text-anchor="middle">化作中温高压富甲烷燃气</text>
<path d="M111,240 L156,264" fill="none" stroke="#1d6fa5" stroke-width="2.2" marker-end="url(#ss-blue)"/>
<path d="M281,240 L236,264" fill="none" stroke="#c25014" stroke-width="2.2" marker-end="url(#ss-orange)"/>
<rect x="68" y="266" width="256" height="62" rx="9" fill="#e7f6ee" stroke="#18794e" stroke-width="1.6"/>
<text x="196" y="287" font-size="10.6" fill="#18794e" text-anchor="middle" font-weight="700">300–350 bar 主燃烧室：纯气-气对撞自燃！</text>
<text x="196" y="305" font-size="9.6" fill="#1e293b" text-anchor="middle">无液滴雾化延迟 · 高温高压接触即燃</text>
<text x="196" y="320" font-size="9.5" fill="#18794e" text-anchor="middle" font-weight="600">预燃室配电火花点火器 ⇒ 飞行中可多次重燃</text>
<polygon points="168,328 224,328 242,366 150,366" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.6"/>
<text x="196" y="352" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="700">±15° 电驱摆动</text>
<rect x="34" y="378" width="324" height="104" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="398" font-size="9.6" fill="#1e293b" text-anchor="start">• 零积碳结焦：甲烷无长碳链，彻底告别煤油机涡轮积碳翻修</text>
<text x="46" y="418" font-size="9.6" fill="#1e293b" text-anchor="start">• 全工质做功：无燃气发生器废气白抛，海平面 Isp 327–350 s</text>
<text x="46" y="438" font-size="9.6" fill="#1e293b" text-anchor="start">• Raptor 3 进化：次级流道 3D 打印进内壁，砍掉 &gt;1 吨外防热罩，</text>
<text x="46" y="456" font-size="9.6" fill="#1d6fa5" text-anchor="start" font-weight="700">  单机海平面推力跃升至 ~280 吨力，裸机可耐受高温返航尾流！</text>
<rect x="388" y="62" width="352" height="432" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 晃动生死劫：为什么要把着陆油箱藏进鼻锥尖？</text>
<text x="404" y="102" font-size="10.0" fill="#64748b" text-anchor="start">横躺坠落时着陆余油仅占主箱容积 ~2%，直接抽取必吸气泡爆炸</text>
<rect x="402" y="118" width="324" height="144" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="414" y="138" font-size="10.4" fill="#dc2626" text-anchor="start" font-weight="700">✕ 反例：横躺 90° 若从 1,200–1,600 吨巨型主箱抽油</text>
<path d="M430,178 Q458,158 504,158 L678,158 L678,198 L504,198 Q458,198 430,178 Z" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<line x1="566" y1="158" x2="566" y2="198" stroke="#dc2626" stroke-width="1.2"/>
<path d="M506,192 Q532,184 564,193 L564,197 L506,197 Z" fill="#c25014" fill-opacity="0.45"/>
<path d="M568,191 Q615,182 676,193 L676,197 L568,197 Z" fill="#1d6fa5" fill-opacity="0.45"/>
<text x="622" y="176" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">98% 是增压气体！</text>
<polygon points="678,171 694,165 694,191 678,185" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
<text x="414" y="220" font-size="9.6" fill="#1e293b" text-anchor="start">• 涡轮泵转速超 3 万转/分，一旦吸入半口气泡瞬间空化飞车、</text>
<text x="414" y="238" font-size="9.6" fill="#dc2626" text-anchor="start" font-weight="600">  富氧烧穿发动机！（早期 SN8/SN9 曾因头部箱增压不足坠毁）</text>
<rect x="402" y="274" width="324" height="208" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="414" y="294" font-size="10.4" fill="#18794e" text-anchor="start" font-weight="700">✓ 星舰正解：鼻锥尖端独立“头部小贮箱”（Header Tanks）</text>
<path d="M424,338 Q454,314 504,314 L678,314 L678,362 L504,362 Q454,362 424,338 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<path d="M425,338 Q442,323 462,320 L462,356 Q442,353 425,338 Z" fill="#1d6fa5" fill-opacity="0.85"/>
<path d="M464,320 L494,316 L494,360 L464,356 Z" fill="#c25014" fill-opacity="0.85"/>
<line x1="462" y1="334" x2="678" y2="334" stroke="#1d6fa5" stroke-width="2.2"/>
<line x1="494" y1="343" x2="678" y2="343" stroke="#c25014" stroke-width="2.2"/>
<polygon points="678,329 696,323 696,353 678,347" fill="#18794e" fill-opacity="0.85"/>
<text x="414" y="310" font-size="9.3" fill="#0f172a" text-anchor="start" font-weight="700">↓ 鼻锥尖 100% 满液 LOX + LCH₄ 头箱</text>
<text x="590" y="329" font-size="9.2" fill="#18794e" text-anchor="middle" font-weight="700">独立保温下输管直供 3 台海平面猛禽</text>
<text x="414" y="386" font-size="9.6" fill="#1e293b" text-anchor="start">• 满灌锁死液面：容积恰好装 ~25–35 吨着陆推进剂，单向阀隔离</text>
<text x="414" y="406" font-size="9.6" fill="#1e293b" text-anchor="start">• 无惧 90° 狂甩：COPV 高压气瓶顶住锥形集液槽，全程零气泡吸入</text>
<text x="414" y="426" font-size="9.6" fill="#1e293b" text-anchor="start">• 一石二鸟调配重：把几十吨燃料压在鼻锥最前端，大幅前移质心</text>
<text x="414" y="446" font-size="9.6" fill="#18794e" text-anchor="start" font-weight="700">  （CM），抵消尾部 6 台发动机重锤，稳住高超音速再入俯仰平衡！</text>
</svg>
