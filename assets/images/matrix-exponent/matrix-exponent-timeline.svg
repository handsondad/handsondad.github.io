<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">矩阵乘法指数七十五年演进与九四分之一定理图</title>
<desc id="desc">左栏定义矩阵乘法指数omega为可在O括号n的s次方内相乘的s的下确界并给出n等于一千与一百万时三次方与二点二五次方运算量对比，右栏按年份列出1969年Strassen二点八零七四、1990年CoppersmithWinograd二点三七六、2026年九月交错抽取二点三七一零五五、十月上界二点二五、十一月匹配下界二点二五以及被否定的omega等于二猜想，底栏说明上下界合拢才叫确定。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="609" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">矩阵乘法指数 ω：57 年，把 3 挪到了 2.25</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">ω = inf{s : 两个 n×n 矩阵可在 O(n^s) 次标量运算内相乘}；输出本身有 n² 项，ω ≥ 2 曾被视为铁律。</text>
<rect x="20" y="66" width="292" height="486" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="89" r="10.5" fill="#fee9e7" stroke="#b42318" stroke-width="1.2"/>
<text x="38" y="93" font-size="11.5" fill="#b42318" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">结论先放这里</text>
<text x="166" y="164" font-size="21" fill="#b42318" text-anchor="middle" font-weight="700">ω = 9/4</text>
<text x="166" y="196" font-size="10.5" fill="#1e293b" text-anchor="middle">= 2.25，恰好卡在 2 和 3 之间</text>
<line x1="40.0" y1="216.0" x2="292.0" y2="216.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="40" y="244" font-size="11.2" fill="#b42318" text-anchor="start" font-weight="700">它度量什么</text>
<text x="40" y="270" font-size="10.5" fill="#1e293b" text-anchor="start">n×n 矩阵相乘所需运算</text>
<text x="40" y="292" font-size="10.5" fill="#1e293b" text-anchor="start">随 n 增长的幂次。</text>
<text x="40" y="320" font-size="10.5" fill="#1e293b" text-anchor="start">它不是某台机器跑多久，</text>
<text x="40" y="342" font-size="10.5" fill="#1e293b" text-anchor="start">而是 n → ∞ 时的指数。</text>
<text x="40" y="374" font-size="10.5" fill="#1e293b" text-anchor="start">定理覆盖任意域 F，</text>
<text x="40" y="396" font-size="10.5" fill="#1e293b" text-anchor="start">包括有限域。</text>
<line x1="40.0" y1="414.0" x2="292.0" y2="414.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="40" y="440" font-size="11.2" fill="#b42318" text-anchor="start" font-weight="700">规模账（仅算运算次数）</text>
<text x="40" y="466" font-size="10.5" fill="#1e293b" text-anchor="start">n = 1000：10⁹ → 约 5.6×10⁶</text>
<text x="40" y="488" font-size="10.5" fill="#64748b" text-anchor="start">省约 178 倍。</text>
<text x="40" y="516" font-size="10.5" fill="#1e293b" text-anchor="start">n = 10⁶：10¹⁸ → 约 3.2×10¹³</text>
<text x="40" y="538" font-size="10.5" fill="#64748b" text-anchor="start">这是渐近量，不是实测加速。</text>
<rect x="328" y="66" width="412" height="486" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="346" cy="89" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="346" y="93" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">2</text>
<text x="364" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700"> milestones：指数是怎么一步步掉下来的</text>
<rect x="344" y="126" width="380" height="60" rx="7" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="358" y="151" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">1969</text>
<text x="358" y="173" font-size="10.5" fill="#64748b" text-anchor="start">时间 / 来源</text>
<text x="436" y="151" font-size="12" fill="#1d6fa5" text-anchor="start" font-weight="700">3 → 2.8074</text>
<text x="436" y="173" font-size="10.5" fill="#64748b" text-anchor="start">可达指数</text>
<text x="526" y="151" font-size="10.5" fill="#1e293b" text-anchor="start">Strassen 七乘积恒等式</text>
<text x="526" y="173" font-size="10.5" fill="#64748b" text-anchor="start">论文原文与附录引用</text>
<rect x="344" y="194" width="380" height="60" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="358" y="219" font-size="10.5" fill="#18794e" text-anchor="start" font-weight="700">1990</text>
<text x="358" y="241" font-size="10.5" fill="#64748b" text-anchor="start">时间 / 来源</text>
<text x="436" y="219" font-size="12" fill="#18794e" text-anchor="start" font-weight="700">2.376</text>
<text x="436" y="241" font-size="10.5" fill="#64748b" text-anchor="start">可达指数</text>
<text x="526" y="219" font-size="10.5" fill="#1e293b" text-anchor="start">Coppersmith–Winograd</text>
<text x="526" y="241" font-size="10.5" fill="#64748b" text-anchor="start">论文原文与附录引用</text>
<rect x="344" y="262" width="380" height="60" rx="7" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="358" y="287" font-size="10.5" fill="#c25014" text-anchor="start" font-weight="700">2026.09</text>
<text x="358" y="309" font-size="10.5" fill="#64748b" text-anchor="start">时间 / 来源</text>
<text x="436" y="287" font-size="12" fill="#c25014" text-anchor="start" font-weight="700">&lt; 2.371055</text>
<text x="436" y="309" font-size="10.5" fill="#64748b" text-anchor="start">可达指数</text>
<text x="526" y="287" font-size="10.5" fill="#1e293b" text-anchor="start">交错抽取，任意域</text>
<text x="526" y="309" font-size="10.5" fill="#64748b" text-anchor="start">论文原文与附录引用</text>
<rect x="344" y="330" width="380" height="60" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="358" y="355" font-size="10.5" fill="#6d28d9" text-anchor="start" font-weight="700">2026.10</text>
<text x="358" y="377" font-size="10.5" fill="#64748b" text-anchor="start">时间 / 来源</text>
<text x="436" y="355" font-size="12" fill="#6d28d9" text-anchor="start" font-weight="700">≤ 2.25</text>
<text x="436" y="377" font-size="10.5" fill="#64748b" text-anchor="start">可达指数</text>
<text x="526" y="355" font-size="10.5" fill="#1e293b" text-anchor="start">OpenAI 多项式乘法上界</text>
<text x="526" y="377" font-size="10.5" fill="#64748b" text-anchor="start">论文原文与附录引用</text>
<rect x="344" y="398" width="380" height="60" rx="7" fill="#fee9e7" stroke="#e2e8f0"/>
<text x="358" y="423" font-size="10.5" fill="#b42318" text-anchor="start" font-weight="700">2026.11</text>
<text x="358" y="445" font-size="10.5" fill="#64748b" text-anchor="start">时间 / 来源</text>
<text x="436" y="423" font-size="12" fill="#b42318" text-anchor="start" font-weight="700">= 2.25</text>
<text x="436" y="445" font-size="10.5" fill="#64748b" text-anchor="start">可达指数</text>
<text x="526" y="423" font-size="10.5" fill="#1e293b" text-anchor="start">匹配下界，指数被钉死</text>
<text x="526" y="445" font-size="10.5" fill="#64748b" text-anchor="start">论文原文与附录引用</text>
<rect x="344" y="466" width="380" height="60" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
<text x="358" y="491" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">旧猜想</text>
<text x="358" y="513" font-size="10.5" fill="#64748b" text-anchor="start">时间 / 来源</text>
<text x="436" y="491" font-size="12" fill="#64748b" text-anchor="start" font-weight="700">2</text>
<text x="436" y="513" font-size="10.5" fill="#64748b" text-anchor="start">可达指数</text>
<text x="526" y="491" font-size="10.5" fill="#1e293b" text-anchor="start">ω = 2 的猜想被否定</text>
<text x="526" y="513" font-size="10.5" fill="#64748b" text-anchor="start">论文原文与附录引用</text>
<rect x="20" y="566" width="720" height="34" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="588" font-size="10.5" fill="#475569" text-anchor="start">读法：上界说“存在这么快的算法”，下界说“不可能更快”；只有两头合拢，才算真正确定一个指数。</text>
</svg>
