<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">120/80 毫米汞柱究竟有多猛？从 1.54 米血柱喷泉到动脉硬化脉压差</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：水银密度是血液的 12.8 倍，把 1.54 米血柱微缩成 12 厘米刻度 · 右：双心动周期实算波形与平均动脉压 MAP</text>
<rect x="16" y="68" width="346" height="436" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="30" y="92" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">一、为什么全世界的血压至今还在用“毫米汞柱”？</text>
<text x="30" y="110" font-size="8.5" fill="#64748b" text-anchor="start">同等的压强 P = ρgh，液体越轻，管子就得竖得越高：</text>
