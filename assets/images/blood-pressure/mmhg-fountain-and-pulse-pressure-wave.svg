<text x="54" y="371.5" font-size="8.0" fill="#64748b" text-anchor="end">0 m</text>
<line x1="60" y1="326.5" x2="344" y2="326.5" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="54" y="330.0" font-size="8.0" fill="#64748b" text-anchor="end">0.5 m</text>
<line x1="60" y1="284.9" x2="344" y2="284.9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="54" y="288.4" font-size="8.0" fill="#64748b" text-anchor="end">1.0 m</text>
