<text x="467.5" y="155.2" font-size="8.4" fill="#c25014" text-anchor="start" font-weight="700">硬化动脉 160/70 (脉压差 90!)</text>
<text x="614.8" y="224.1" font-size="8.4" fill="#1d6fa5" text-anchor="start" font-weight="700">年轻弹性动脉 120/80</text>
<text x="528.6" y="243.5" font-size="8.0" fill="#1d6fa5" text-anchor="middle">↙ 重搏切迹(瓣膜关)</text>
<rect x="638.5" y="256.7" width="116" height="16" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="721" y="268.7" font-size="8.2" fill="#18794e" text-anchor="end" font-weight="700">平均压 MAP ≈ 93.6</text>
<text x="543.5" y="333.6" font-size="8.1" fill="#c25014" text-anchor="middle" font-weight="700">弹性丧失→舒张跌至 70</text>
<rect x="390" y="370" width="342" height="122" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="402" y="389" font-size="8.3" fill="#0f172a" text-anchor="start" font-weight="700">• 血压总公式（流体欧姆定律）：MAP ≈ 心输出量 CO × 外周阻力 SVR</text>
<text x="402" y="408" font-size="8.2" fill="#1e293b" text-anchor="start">• 为什么平均压不是 (120+80)/2 = 100？因为舒张期占约 2/3 时间：</text>
<text x="412" y="425" font-size="8.2" fill="#18794e" text-anchor="start" font-weight="700">MAP ≈ 舒张压 + 1/3 × 脉压差 = 80 + 40/3 ≈ 93.3 mmHg（供血真推力）</text>
<text x="402" y="444" font-size="8.2" fill="#1e293b" text-anchor="start">• 为什么老人常“高压飙到 160、低压反降到 70”（脉压差拉大）？</text>
<text x="412" y="461" font-size="8.1" fill="#c25014" text-anchor="start" font-weight="700">大动脉弹性顺应性 C 退化变硬：射血时撑不开→高压暴冲；</text>
<text x="412" y="478" font-size="8.1" fill="#1e293b" text-anchor="start">舒张期没回弹蓄力→低压骤跌（顺带连累舒张期吃血的冠状动脉！）</text>
</svg>
