<text x="54" y="205.3" font-size="8.0" fill="#64748b" text-anchor="end">2.0 m</text>
<line x1="60" y1="160.3" x2="344" y2="160.3" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="54" y="163.8" font-size="8.0" fill="#64748b" text-anchor="end">2.5 m</text>
<line x1="58" y1="368" x2="346" y2="368" stroke="#1e293b" stroke-width="1.5"/>
<rect x="82" y="273.0" width="32" height="95" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="85" y="358.0" width="26" height="10.0" rx="2" fill="#64748b"/>
<text x="98" y="267" font-size="8.5" fill="#0f172a" text-anchor="middle" font-weight="700">仅 12 cm!</text>
<text x="98" y="385" font-size="8.5" fill="#0f172a" text-anchor="middle" font-weight="700">水银柱 (1828)</text>
<text x="98" y="400" font-size="8.3" fill="#1e293b" text-anchor="middle">120 mmHg</text>
<text x="98" y="414" font-size="8.0" fill="#64748b" text-anchor="middle">ρ=13.6 g/cm³</text>
<rect x="178" y="230.1" width="32" height="137.9" rx="4" fill="#fff1f2" stroke="#fda4af" stroke-width="1.4"/>
<rect x="181" y="240.1" width="26" height="127.9" rx="2" fill="#e11d48"/>
<text x="194" y="224.1" font-size="8.7" fill="#be123c" text-anchor="middle" font-weight="700">1.54 m 高!</text>
<text x="194" y="385" font-size="8.5" fill="#be123c" text-anchor="middle" font-weight="700">人体等效血柱</text>
<text x="194" y="400" font-size="8.3" fill="#1e293b" text-anchor="middle">同为 120 mmHg</text>
<text x="194" y="414" font-size="8.0" fill="#64748b" text-anchor="middle">ρ=1.06 g/cm³</text>
<rect x="278" y="151.1" width="32" height="216.9" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
<rect x="281" y="159.1" width="26" height="208.9" rx="2" fill="#c25014"/>
<text x="294" y="146.1" font-size="8.4" fill="#c25014" text-anchor="middle" font-weight="700">2.51 m (8尺3寸)</text>
<text x="294" y="385" font-size="8.5" fill="#c25014" text-anchor="middle" font-weight="700">黑尔斯母马实验</text>
<text x="294" y="400" font-size="8.1" fill="#1e293b" text-anchor="middle">1733年(≈196mmHg)</text>
<text x="294" y="414" font-size="8.0" fill="#64748b" text-anchor="middle">人类首次测血压</text>
<rect x="28" y="424" width="322" height="68" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="38" y="442" font-size="8.4" fill="#1d6fa5" text-anchor="start" font-weight="700">💡 120 mmHg ≈ 16.0 kPa（比外界大气压高约 0.16 个大气压）：</text>
<text x="38" y="459" font-size="8.2" fill="#1e293b" text-anchor="start">若不用水银而插玻璃水管，诊室桌上得立一根一米六高的血柱！</text>
<text x="38" y="476" font-size="8.2" fill="#1e293b" text-anchor="start">电子血压计早已无汞，但“mmHg”因百年临床直觉沿用至今。</text>
<rect x="378" y="68" width="366" height="436" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="392" y="92" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">二、收缩压、舒张压、平均压与老年“高压高、低压低”</text>
<text x="392" y="110" font-size="8.5" fill="#64748b" text-anchor="start">按真实心动周期 T=0.8s 计算：舒张期占 2/3，MAP 绝不是 100！</text>
