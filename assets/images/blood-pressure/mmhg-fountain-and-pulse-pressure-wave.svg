<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">120/80毫米汞柱物理高度换算与年轻弹性动脉对比老年硬化动脉血压波形图解</title>
<desc id="desc">左栏按流体静力学P=ρgh对比120 mmHg对应的12厘米水银柱、1.54米人体等效血柱及1733年黑尔斯测得的2.51米母马血柱；右栏按真实心动周期绘制年轻弹性动脉(120/80 mmHg, MAP≈93.3 mmHg)与老年顺应性下降硬化动脉(160/70 mmHg, 脉压差90 mmHg)的双周期压力波形。</desc>
