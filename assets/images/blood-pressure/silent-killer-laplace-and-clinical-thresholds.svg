<text x="114.1" y="473.1" font-size="8.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">夜间低谷(-10%~20%)</text>
<text x="173.6" y="368.1" font-size="8.2" fill="#dc2626" text-anchor="middle" font-weight="700">6–10点清晨血压晨峰!</text>
<text x="207.0" y="512" font-size="8.0" fill="#1e293b" text-anchor="middle">交感+皮质醇唤醒激增（心梗脑卒中高发窗）</text>
<rect x="372" y="342" width="358" height="30" rx="6" fill="#ecfdf5" stroke="#18794e" stroke-width="1"/>
<text x="382" y="361" font-size="8.3" fill="#18794e" text-anchor="start" font-weight="700">理想正常</text>
<text x="482" y="361" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="600">&lt; 120 且 &lt; 80</text>
<text x="722" y="361" font-size="8.0" fill="#1e293b" text-anchor="end">心血管负担最小</text>
<rect x="372" y="378" width="358" height="30" rx="6" fill="#f0f9ff" stroke="#1d6fa5" stroke-width="1"/>
<text x="382" y="397" font-size="8.3" fill="#1d6fa5" text-anchor="start" font-weight="700">正常高值</text>
<text x="482" y="397" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="600">120–129（中国至139/89）</text>
<text x="722" y="397" font-size="8.0" fill="#1e293b" text-anchor="end">限盐+运动逆转窗</text>
<rect x="372" y="414" width="358" height="30" rx="6" fill="#fff7ed" stroke="#c25014" stroke-width="1"/>
<text x="382" y="433" font-size="8.3" fill="#c25014" text-anchor="start" font-weight="700">130/80 分水岭</text>
<text x="482" y="433" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="600">ACC/AHA 1级高血压</text>
<text x="722" y="433" font-size="8.0" fill="#1e293b" text-anchor="end">高危人群控制目标!</text>
<rect x="372" y="450" width="358" height="30" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/>
<text x="382" y="469" font-size="8.3" fill="#e11d48" text-anchor="start" font-weight="700">≥140 或 ≥90</text>
<text x="482" y="469" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="600">WHO/中国诊室高血压</text>
<text x="722" y="469" font-size="8.0" fill="#1e293b" text-anchor="end">非同日达标即确诊</text>
<rect x="372" y="486" width="358" height="30" rx="6" fill="#fae8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="382" y="505" font-size="8.3" fill="#6d28d9" text-anchor="start" font-weight="700">&gt;180 或 &gt;120</text>
<text x="482" y="505" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="600">高血压急症/危象红线</text>
<text x="722" y="505" font-size="8.0" fill="#1e293b" text-anchor="end">伴胸痛头痛立急诊!</text>
</svg>
