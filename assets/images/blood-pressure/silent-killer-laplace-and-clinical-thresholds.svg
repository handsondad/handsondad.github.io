<rect x="0.5" y="0.5" width="759" height="539" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">高压 160 为什么一点不疼却暗毁四器官？拉普拉斯壁应力与晨峰分级尺</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上：探头 48 小时“叛变”消音 + 拉普拉斯壁应力撕裂微血管 · 下：清晨 6–10 点危险晨峰与中外诊断标准对照</text>
<rect x="16" y="68" width="352" height="222" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="30" y="91" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">一、为什么全球 44% 患者毫不知情（无痛假象）？</text>
<rect x="28" y="104" width="328" height="78" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
<text x="38" y="123" font-size="8.6" fill="#be123c" text-anchor="start" font-weight="700">🔕 警报器“调定点重设（Resetting）”：</text>
<text x="38" y="141" font-size="8.1" fill="#1e293b" text-anchor="start">血管壁没有“血压痛觉神经”！更糟的是，颈动脉压力探头只抓</text>
<text x="38" y="158" font-size="8.1" fill="#1e293b" text-anchor="start">短时波动——若高压持续 1–2 天，探头就会把 160 当成“新常态”</text>
<text x="38" y="174" font-size="8.0" fill="#be123c" text-anchor="start" font-weight="700">停止报警（此时若猛降回正常值，身体反倒误以为低血压头晕！）</text>
<rect x="28" y="192" width="328" height="86" rx="8" fill="#eaf4fb" stroke="#93c5fd" stroke-width="1"/>
<text x="38" y="211" font-size="8.7" fill="#1d6fa5" text-anchor="start" font-weight="700">📐 拉普拉斯管壁应力定律：σ = (P × r) / w</text>
<text x="38" y="229" font-size="8.1" fill="#1e293b" text-anchor="start">• 左心室对抗高压 P → 只能拼命增厚室壁 w 自保（向心性肥厚变硬）</text>
<text x="38" y="246" font-size="8.1" fill="#1e293b" text-anchor="start">• 脑深部微动脉壁 w 极薄 → 高压 P 直接顶出微动脉瘤甚至撑破出血</text>
<text x="38" y="263" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="700">• 高压脉冲撕裂血管内皮 → 胆固醇钻缝筑斑块 → 管径 r 变窄更升压！</text>
<rect x="384" y="68" width="360" height="222" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="398" y="91" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">二、无声高压日夜磨损的“四大靶器官”</text>
<rect x="396" y="104" width="164" height="82" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/>
<text x="404" y="122" font-size="8.4" fill="#e11d48" text-anchor="start" font-weight="700">♥ 心脏：肥厚 → 冠心病/心衰</text>
<text x="404" y="140" font-size="8.0" fill="#1e293b" text-anchor="start">左室长期顶着高压泵血被迫练成</text>
<text x="404" y="156" font-size="8.0" fill="#1e293b" text-anchor="start">僵硬厚墙，舒张充盈变差且冠脉</text>
<text x="404" y="172" font-size="8.0" fill="#1e293b" text-anchor="start">供血跟不上，终致心梗或心衰。</text>
<rect x="568" y="104" width="164" height="82" rx="7" fill="#fff7ed" stroke="#c25014" stroke-width="1"/>
<text x="576" y="122" font-size="8.4" fill="#c25014" text-anchor="start" font-weight="700">🧠 大脑：脑出血与腔隙脑梗</text>
<text x="576" y="140" font-size="8.0" fill="#1e293b" text-anchor="start">大脑中动脉直角分出的豆纹动脉</text>
<text x="576" y="156" font-size="8.0" fill="#1e293b" text-anchor="start">直迎高压洪峰，极易破裂脑溢血</text>
<text x="576" y="172" font-size="8.0" fill="#1e293b" text-anchor="start">或粥样硬化堵死诱发缺血脑卒中。</text>
<rect x="396" y="196" width="164" height="82" rx="7" fill="#eff6ff" stroke="#1d6fa5" stroke-width="1"/>
<text x="404" y="214" font-size="8.4" fill="#1d6fa5" text-anchor="start" font-weight="700">🫘 肾脏：肾小球高压硬化</text>
<text x="404" y="232" font-size="8.0" fill="#1e293b" text-anchor="start">高压冲毁百万个肾小球滤过网 →</text>
<text x="404" y="248" font-size="8.0" fill="#1e293b" text-anchor="start">漏出蛋白尿、肾功能衰竭；缺血</text>
<text x="404" y="264" font-size="8.0" fill="#1e293b" text-anchor="start">肾又乱放肾素，陷入升压死循环！</text>
<rect x="568" y="196" width="164" height="82" rx="7" fill="#ecfdf5" stroke="#18794e" stroke-width="1"/>
<text x="576" y="214" font-size="8.4" fill="#18794e" text-anchor="start" font-weight="700">👁️ 眼底：活体微血管观察窗</text>
<text x="576" y="232" font-size="8.0" fill="#1e293b" text-anchor="start">视网膜是全身唯一不切皮就能直</text>
<text x="576" y="248" font-size="8.0" fill="#1e293b" text-anchor="start">视活体微动脉的窗口：高压会压</text>
<text x="576" y="264" font-size="8.0" fill="#1e293b" text-anchor="start">瘪静脉、引发眼底渗出出血视物糊。</text>
<rect x="16" y="302" width="728" height="224" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="30" y="325" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">三、左：24 小时昼夜“杓型节律”与清晨危险晨峰 · 右：WHO/中国 vs ACC/AHA 血压分级尺</text>
<rect x="64" y="348" width="286" height="134" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1"/>
<rect x="135.5" y="348" width="47.7" height="134" fill="#fef2f2"/>
<line x1="64" y1="459.7" x2="350" y2="459.7" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="59" y="463.2" font-size="8.0" fill="#64748b" text-anchor="end">100</text>
<line x1="64" y1="415.0" x2="350" y2="415.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="59" y="418.5" font-size="8.0" fill="#64748b" text-anchor="end">120</text>
<line x1="64" y1="370.3" x2="350" y2="370.3" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3 3"/>
<text x="59" y="373.8" font-size="8.0" fill="#64748b" text-anchor="end">140</text>
<text x="64.0" y="496" font-size="8.0" fill="#64748b" text-anchor="middle">0点</text>
<text x="135.5" y="496" font-size="8.0" fill="#64748b" text-anchor="middle">6点</text>
<text x="207.0" y="496" font-size="8.0" fill="#64748b" text-anchor="middle">12点</text>
<text x="278.5" y="496" font-size="8.0" fill="#64748b" text-anchor="middle">18点</text>
<text x="350.0" y="496" font-size="8.0" fill="#64748b" text-anchor="middle">24点</text>
