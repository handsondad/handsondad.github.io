<svg xmlns="http://www.w3.org/2000/svg" width="760" height="524" viewBox="0 0 760 524" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">站立重力静水压冲击、颈动脉窦主动脉弓压力感受器反射与血管内皮一氧化氮调节图解</title>
<desc id="desc">左栏对比平躺与猛然站立时脑心脚的静水压变化及下肢静脉池滞留300至800毫升血液引发的直立性低血压风险；右栏按四步解析颈动脉窦与主动脉弓Piezo1/2牵张探头经延髓心血管中枢在1至2秒内提升心率、收缩微动脉与静脉的负反馈闭环，以及血管内皮释放一氧化氮NO气体扩管机制。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="523" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">猛一起床为什么没当场晕倒？2 秒救驾的“压力反射”与内皮一氧化氮</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：站起瞬间 500 mL 血液坠入下肢静脉池的重力突袭 · 右：Piezo1/2 牵张探头负反馈闭环与 NO 气体扩管刹车</text>
<rect x="16" y="68" width="344" height="440" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="30" y="92" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">一、平躺 vs 猛然站起：地球重力的 0.5 秒突袭</text>
<rect x="28" y="106" width="320" height="96" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="40" y="125" font-size="8.6" fill="#18794e" text-anchor="start" font-weight="700">① 平躺睡觉：脑、心、脚处于同一重力水平面 (h ≈ 0)</text>
<circle cx="72" cy="156" r="12" fill="#ffffff" stroke="#18794e" stroke-width="1.8"/>
<text x="72" y="160" font-size="8.2" fill="#18794e" text-anchor="middle" font-weight="700">脑</text>
<rect x="92" y="144" width="136" height="24" rx="10" fill="#ffffff" stroke="#18794e" stroke-width="1.8"/>
<text x="160" y="160" font-size="8.3" fill="#be123c" text-anchor="middle" font-weight="700">♥ 心脏 MAP ≈ 93</text>
<rect x="236" y="147" width="94" height="18" rx="8" fill="#ffffff" stroke="#18794e" stroke-width="1.8"/>
<text x="283" y="160" font-size="8.1" fill="#18794e" text-anchor="middle" font-weight="700">脚 ≈ 90 mmHg</text>
<text x="40" y="190" font-size="8.2" fill="#1e293b" text-anchor="start">无需对抗重力水柱，大脑平均灌注压轻松维持 ~90 mmHg。</text>
<rect x="28" y="214" width="320" height="280" rx="8" fill="#fff7ed" stroke="#c25014" stroke-width="1"/>
<text x="40" y="234" font-size="8.6" fill="#c25014" text-anchor="start" font-weight="700">② 猛然站起瞬间：头顶减压 + 下肢静脉池“兜走半升血”</text>
<circle cx="72" cy="274" r="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="72" y="278" font-size="8.5" fill="#dc2626" text-anchor="middle" font-weight="700">脑</text>
<rect x="56" y="294" width="32" height="72" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
<text x="72" y="333" font-size="8.5" fill="#be123c" text-anchor="middle" font-weight="700">♥心</text>
<rect x="58" y="372" width="12" height="78" rx="5" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.8"/>
<rect x="74" y="372" width="12" height="78" rx="5" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.8"/>
<text x="72" y="466" font-size="8.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">双腿静脉池</text>
<text x="106" y="272" font-size="8.4" fill="#dc2626" text-anchor="start" font-weight="700">• 头比心脏高 ~35 cm：</text>
<text x="114" y="289" font-size="8.2" fill="#1e293b" text-anchor="start">重力直接扣掉 -27 mmHg 静水压！</text>
<text x="106" y="314" font-size="8.4" fill="#c25014" text-anchor="start" font-weight="700">• 脚踝比心脏低 ~125 cm：</text>
<text x="114" y="331" font-size="8.2" fill="#1e293b" text-anchor="start">静水压暴涨 +97，脚踝动脉达 ~190！</text>
<text x="106" y="356" font-size="8.4" fill="#1d6fa5" text-anchor="start" font-weight="700">• 静脉顺应性是动脉的 20–30 倍：</text>
<text x="114" y="373" font-size="8.2" fill="#1e293b" text-anchor="start">300–800 mL 血液瞬间坠入下肢与腹腔，</text>
<text x="114" y="390" font-size="8.2" fill="#1e293b" text-anchor="start">回心血量骤减 → 心输出量 CO 猛跌！</text>
<rect x="106" y="406" width="230" height="74" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1"/>
<text x="116" y="425" font-size="8.4" fill="#be123c" text-anchor="start" font-weight="700">⚠️ 若无神经秒级救驾：</text>
<text x="116" y="443" font-size="8.1" fill="#1e293b" text-anchor="start">脑部 MAP 将跌破 60 mmHg 缺血红线，</text>
<text x="116" y="460" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="700">眼前发黑（直立性低血压）甚至晕厥！</text>
<rect x="376" y="68" width="368" height="440" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="390" y="92" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">二、1–2 次心跳极速稳压：压力反射闭环 + 一氧化氮</text>
<rect x="390" y="106" width="340" height="70" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="402" y="125" font-size="8.6" fill="#1d6fa5" text-anchor="start" font-weight="700">① 管壁牵张探头：颈动脉窦 + 主动脉弓（2021 诺奖机制）</text>
<text x="402" y="144" font-size="8.1" fill="#1e293b" text-anchor="start">守在进脑咽喉要道的颈动脉窦与主动脉弓管壁内，嵌有机械敏感离子通道</text>
<text x="402" y="161" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="600">Piezo1/Piezo2：血压一跌 → 管壁回缩牵张减弱 → 神经脉冲放电频率骤降！</text>
<rect x="390" y="188" width="340" height="70" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="402" y="207" font-size="8.6" fill="#6d28d9" text-anchor="start" font-weight="700">② 传入专线直通脑干：延髓心血管中枢（毫秒级判读）</text>
<text x="402" y="226" font-size="8.1" fill="#1e293b" text-anchor="start">信号沿舌咽神经(IX)与迷走神经(X)直报延髓：中枢立即同步关小“迷走心抑制</text>
<text x="402" y="243" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="600">中心”刹车，并拉响“心加速中心 + 血管运动中心”双路交感警报！</text>
<rect x="390" y="270" width="340" height="70" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="402" y="289" font-size="8.6" fill="#c25014" text-anchor="start" font-weight="700">③ 双管齐下 2 秒回血升压：提心率 + 拧紧微动脉与静脉池</text>
<text x="402" y="308" font-size="8.1" fill="#1e293b" text-anchor="start">• 心脏端：撤迷走 + 催交感去甲肾上腺素 → 心率与心肌收缩力瞬间跳升(CO↑)</text>
<text x="402" y="325" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="600">• 血管端：微动脉收缩(R∝1/r⁴ 阻力猛增) + 静脉网收缩把滞留血挤回心脏！</text>
<line x1="560" y1="176" x2="560" y2="186" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<line x1="560" y1="258" x2="560" y2="268" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr-blue)"/>
<rect x="390" y="354" width="340" height="140" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="402" y="374" font-size="8.7" fill="#18794e" text-anchor="start" font-weight="700">④ 血管内皮自带“扩管气体开关”：一氧化氮 NO（1998 诺奖）</text>
<text x="402" y="393" font-size="8.1" fill="#1e293b" text-anchor="start">• 血流冲刷剪切力或乙酰胆碱刺激健康血管内皮细胞 → 当场合成一氧化氮</text>
<text x="402" y="410" font-size="8.1" fill="#0f172a" text-anchor="start" font-weight="700">  气体（NO，半衰期不足 10 秒）穿膜进入平滑肌，令肌肉松弛扩管降压！</text>
<text x="402" y="430" font-size="8.1" fill="#1e293b" text-anchor="start">• 百年戏剧反差：诺贝尔造炸药致富的“硝酸甘油”，之所以能救心绞痛与</text>
<text x="402" y="447" font-size="8.1" fill="#18794e" text-anchor="start" font-weight="700">  急降血压，正是进体内释放 NO 气体替受损内皮强行松开血管！</text>
<text x="402" y="467" font-size="8.0" fill="#64748b" text-anchor="start">• 反面险情：严重细菌感染败血症时白细胞狂喷 NO，全身血管瘫软暴跌休克。</text>
</svg>
