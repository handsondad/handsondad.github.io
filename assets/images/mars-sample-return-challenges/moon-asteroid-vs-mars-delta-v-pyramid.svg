<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">月球小行星与火星采样返回速度增量对比及齐奥尔科夫斯基火箭质量放大金字塔图</title>
<desc id="desc">左图对比小行星贝努/龙宫、火卫一Phobos、月球（嫦娥五号/六号）与火星表面的逃逸速度和返程总Δv（火星高达约6.3 km/s）；右图解释为何火面直飞地球质量失控，并按NASA/ESA与天问三号量级绘出从0.5公斤样品到11公斤样品球、450公斤火星上升火箭、3375公斤着陆器及地球千吨级重型火箭的五级质量金字塔。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
  <marker id="msr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d6fa5"/>
    </marker>
    <marker id="msr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c25014"/>
    </marker>
    <marker id="msr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18794e"/>
    </marker>
    <marker id="msr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6d28d9"/>
    </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="489" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么月球和小行星都能采样回家，火星返程却像隔着一道指数高墙？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：四类天体逃逸速度与返程 Δv 硬账本｜右：齐奥尔科夫斯基公式下的“百万倍齿轮放大金字塔”</text>
<rect x="20" y="62" width="354" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 逃逸速度差一倍多，返程总 Δv 翻至 6.3 km/s</text>
<text x="36" y="102" font-size="10.2" fill="#64748b" text-anchor="start">井深正比于 v_esc²：火星引力井深度是月球的 4.5 倍！</text>
<rect x="34" y="122.0" width="326" height="68" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="140.0" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">小行星龙宫/贝努</text>
<text x="186" y="140.0" font-size="9.6" fill="#18794e" text-anchor="start" font-weight="700">v_esc ≈ 0.0002 km/s</text>
<rect x="284.0" y="127.0" width="66" height="18" rx="9.0" fill="#ffffff" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="317.0" y="139.2" font-size="9.1" fill="#18794e" text-anchor="middle" font-weight="600">已返回</text>
<rect x="40.0" y="149.0" width="3.0" height="14" rx="3" fill="#18794e"/>
<text x="51.0" y="160.0" font-size="9.5" fill="#18794e" text-anchor="start" font-weight="700">&lt; 0.01 km/s</text>
<text x="46" y="179.0" font-size="9.3" fill="#64748b" text-anchor="start">触碰喷气即走 (Δv &lt; 1 m/s)</text>
<rect x="34" y="200.0" width="326" height="68" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="218.0" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">火卫一 Phobos</text>
<text x="186" y="218.0" font-size="9.6" fill="#6d28d9" text-anchor="start" font-weight="700">v_esc ≈ 0.011 km/s</text>
<rect x="284.0" y="205.0" width="66" height="18" rx="9.0" fill="#ffffff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="317.0" y="217.2" font-size="9.1" fill="#6d28d9" text-anchor="middle" font-weight="600">2026已发</text>
<rect x="40.0" y="227.0" width="3.0" height="14" rx="3" fill="#6d28d9"/>
<rect x="45.0" y="227.0" width="28.6" height="14" rx="3" fill="#6d28d9" fill-opacity="0.45" stroke="#6d28d9" stroke-width="1.0"/>
<text x="79.6" y="238.0" font-size="9.5" fill="#6d28d9" text-anchor="start" font-weight="700">总 Δv ≈ 1.00 km/s</text>
<text x="46" y="257.0" font-size="9.3" fill="#64748b" text-anchor="start">百米冲刺即逃，仅需母船返地</text>
<rect x="34" y="278.0" width="326" height="68" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="296.0" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">月球（嫦娥五/六）</text>
<text x="186" y="296.0" font-size="9.6" fill="#1d6fa5" text-anchor="start" font-weight="700">v_esc = 2.38 km/s</text>
<rect x="284.0" y="283.0" width="66" height="18" rx="9.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="317.0" y="295.2" font-size="9.1" fill="#1d6fa5" text-anchor="middle" font-weight="600">已返回</text>
<rect x="40.0" y="305.0" width="55.8" height="14" rx="3" fill="#1d6fa5"/>
<rect x="97.8" y="305.0" width="25.6" height="14" rx="3" fill="#1d6fa5" fill-opacity="0.45" stroke="#1d6fa5" stroke-width="1.0"/>
<text x="129.4" y="316.0" font-size="9.5" fill="#1d6fa5" text-anchor="start" font-weight="700">总 Δv ≈ 2.70 km/s</text>
<text x="46" y="335.0" font-size="9.3" fill="#64748b" text-anchor="start">升空 1.85 + 环月返地 0.85</text>
<rect x="34" y="356.0" width="326" height="68" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="46" y="374.0" font-size="10.4" fill="#c25014" text-anchor="start" font-weight="700">火星表面（难关！）</text>
<text x="186" y="374.0" font-size="9.6" fill="#c25014" text-anchor="start" font-weight="700">v_esc = 5.03 km/s</text>
<rect x="284.0" y="361.0" width="66" height="18" rx="9.0" fill="#ffffff" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="317.0" y="373.2" font-size="9.1" fill="#c25014" text-anchor="middle" font-weight="600">至今 0 克</text>
<rect x="40.0" y="383.0" width="123.6" height="14" rx="3" fill="#c25014"/>
<rect x="165.6" y="383.0" width="66.3" height="14" rx="3" fill="#c25014" fill-opacity="0.45" stroke="#c25014" stroke-width="1.0"/>
<text x="238.0" y="394.0" font-size="9.5" fill="#c25014" text-anchor="start" font-weight="700">总 Δv ≈ 6.30 km/s</text>
<text x="46" y="413.0" font-size="9.3" fill="#1e293b" text-anchor="start">升空 4.10 + 火轨返地 2.20</text>
<text x="36" y="444" font-size="9.5" fill="#64748b" text-anchor="start">• 实心段 = 表面起飞入轨 Δv；浅色段 = 环绕轨道加速返地 Δv</text>
<text x="36" y="461" font-size="9.4" fill="#c25014" text-anchor="start" font-weight="600">• 火面还多一层稀薄大气阻力 + 重力损耗（比理论圆轨速度多烧 ~0.7 km/s）</text>
<rect x="388" y="62" width="352" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="404" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 指数级质量齿轮：0.5 kg 火星土背后的百万倍托举</text>
<text x="404" y="102" font-size="10.2" fill="#64748b" text-anchor="start">m₀/m_f = e^(Δv/v_e)：每一级都在给上一级的燃料买单！</text>
<rect x="402" y="114" width="324" height="78" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="414" y="132" font-size="9.8" fill="#6d28d9" text-anchor="start" font-weight="700">为什么不敢像早期苏联月球探测器那样“火面直飞地球”？</text>
<text x="414" y="150" font-size="9.2" fill="#1e293b" text-anchor="start">• 直飞需火面火箭独自扛满 ~6.3 km/s，还要顶 90 kg 防热舱起飞；</text>
<text x="414" y="167" font-size="9.2" fill="#1e293b" text-anchor="start">• 光火面上升火箭就暴涨至 ~3 吨，连带着陆系统突破 10 吨级——</text>
<text x="414" y="184" font-size="9.3" fill="#6d28d9" text-anchor="start" font-weight="700">  彻底超出人类现有火星着陆能力！唯有用“火星轨道交会”拆单。</text>
<rect x="462.0" y="204.0" width="204.0" height="40" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1.5"/>
<text x="564.0" y="220.0" font-size="9.3" fill="#18794e" text-anchor="middle" font-weight="700">⑤ 最终到手的火星岩芯样品：~0.5 kg</text>
<text x="564.0" y="236.0" font-size="8.9" fill="#1e293b" text-anchor="middle">约 30 管（一瓶矿泉水重）</text>
<rect x="448.0" y="251.0" width="232.0" height="40" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.5"/>
<text x="564.0" y="267.0" font-size="9.3" fill="#1d6fa5" text-anchor="middle" font-weight="700">④ 环火轨道样品球 (OS)：11 kg</text>
<text x="564.0" y="283.0" font-size="8.9" fill="#1e293b" text-anchor="middle">钛管 + 密封球壳（排球大小）</text>
<rect x="433.0" y="298.0" width="262.0" height="40" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<text x="564.0" y="314.0" font-size="9.3" fill="#c25014" text-anchor="middle" font-weight="700">③ 火星上升火箭 (MAV)：450 kg</text>
<text x="564.0" y="330.0" font-size="8.9" fill="#1e293b" text-anchor="middle">两级固体火箭（放大 41 倍）</text>
<rect x="418.0" y="345.0" width="292.0" height="40" rx="6" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="564.0" y="361.0" font-size="9.3" fill="#6d28d9" text-anchor="middle" font-weight="700">② 火星样品回收着陆器 (SRL)：3,375 kg</text>
<text x="564.0" y="377.0" font-size="8.9" fill="#1e293b" text-anchor="middle">含保温舱+弹射架+机械臂</text>
<rect x="403.0" y="392.0" width="322.0" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="564.0" y="408.0" font-size="9.3" fill="#0f172a" text-anchor="middle" font-weight="700">① 地球起飞两发重型运载火箭：~800–1,600 吨</text>
<text x="564.0" y="424.0" font-size="8.9" fill="#1e293b" text-anchor="middle">如两发长征五号 / 重型火箭接力</text>
<text x="564" y="456" font-size="9.7" fill="#c25014" text-anchor="middle" font-weight="700">总杠杆比：地球点火超百万公斤燃料，只为换回火星半公斤石头！</text>
</svg>
