<svg xmlns="http://www.w3.org/2000/svg" width="760" height="504" viewBox="0 0 760 504" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">地火霍曼往返26个月会合窗口与454天被迫等待轨道动画及环火轨道自主捕获23厘米样品球图解</title>
<desc id="desc">左图按精确开普勒轨道计算地火去程259天、火星表面或轨道等待454天（因抵达火星时地球已超前75.2度）、返程259天的完整972天往返轨迹并配单次播放动画；右图展示返地轨道器在单程最长达22分钟通信延迟下，用超过1000公里光学相机和激光雷达自主搜寻捕获直径23厘米无动力样品球的过程。</desc>
