<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">错过一班再等 26 个月，到了还得苦等 15 个月！地火往返天体时刻表与盲抓样品球</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：霍曼去程 259 天 + 被迫等位 454 天 + 返程 259 天动画｜右：上亿公里外自主抓 23 cm 小球</text>
