<text x="36" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 为什么到了火星不能马上回？（会合周期 780 天）</text>
<text x="36" y="102" font-size="9.7" fill="#64748b" text-anchor="start">内圈地球跑得快：等你飞到火星，地球早已甩到前方 +75.2°！</text>
