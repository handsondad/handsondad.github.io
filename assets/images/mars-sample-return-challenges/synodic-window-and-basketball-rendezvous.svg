<text x="208.0" y="344.0" font-size="9.2" fill="#1d6fa5" text-anchor="middle" font-weight="700" class="halo">① 地球出发 (t=0)</text>
<circle cx="208.0" cy="142.3" r="5.2" fill="#c25014" stroke="#ffffff" stroke-width="1.4"/>
<text x="216.0" y="132.3" font-size="9.2" fill="#c25014" text-anchor="start" font-weight="700" class="halo">② 抵火 (259天)</text>
<circle cx="138.4" cy="233.5" r="4.0" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.8"/>
<line x1="135.4" y1="236.5" x2="122.4" y2="257.5" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="34" y="269.5" font-size="8.9" fill="#1d6fa5" text-anchor="start" font-weight="600" class="halo">抵火时地球已超前+75°</text>
<circle cx="301.1" cy="310.0" r="5.0" fill="#6d28d9" stroke="#ffffff" stroke-width="1.4"/>
<text x="297.1" y="330.0" font-size="9.1" fill="#6d28d9" text-anchor="middle" font-weight="700" class="halo">③ 等满454天返航</text>
<circle cx="146.9" cy="213.9" r="5.0" fill="#18794e" stroke="#ffffff" stroke-width="1.4"/>
<line x1="143.9" y1="210.9" x2="130.9" y2="189.9" stroke="#18794e" stroke-width="1.1"/>
<text x="34" y="185.9" font-size="9.1" fill="#18794e" text-anchor="start" font-weight="700" class="halo">④ 返抵地球 (~972天)</text>
<circle class="msr-ship" cx="0" cy="0" r="6.0" fill="#c25014" stroke="#ffffff" stroke-width="2.0"/>
<rect x="34" y="396" width="338" height="78" rx="7" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="415" font-size="9.2" fill="#0f172a" text-anchor="start" font-weight="700">往返总耗时账单：259d 去（蓝）+ 454d 等（紫虚）+ 259d 回（绿）≈ 2.7 年</text>
<text x="46" y="434" font-size="9.0" fill="#1e293b" text-anchor="start">• 会合周期 T_syn = 1/(1/365.26 − 1/686.98) = 780 天（约 26 个月才开一扇窗）</text>
<text x="46" y="452" font-size="9.0" fill="#c25014" text-anchor="start" font-weight="600">• 任何环节晚半个月赶不上窗口，整套系统就得在太空或地面硬扛两年多！</text>
<rect x="398" y="62" width="342" height="426" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="414" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 环火轨道“大海捞针”：盲抓一只 23 cm 排球</text>
<text x="414" y="102" font-size="9.7" fill="#64748b" text-anchor="start">样品球没发动机也没信标天线，全靠母船光学与激光自寻的！</text>
<rect x="412" y="116" width="314" height="200" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
<path d="M 412,294 Q 569,254 726,294 L 726,316 L 412,316 Z" fill="#9a3412" fill-opacity="0.75" stroke="#fb923c" stroke-width="1.3"/>
<text x="569" y="307" font-size="8.9" fill="#fed7aa" text-anchor="middle" font-weight="600">火星 350 km 低轨道（轨速 ~3.4 km/s，每 ~115 分钟绕一圈）</text>
<line x1="444" y1="158" x2="444" y2="236" stroke="#60a5fa" stroke-width="5.0"/>
<rect x="434" y="186" width="24" height="22" rx="3" fill="#e2e8f0" stroke="#93c5fd" stroke-width="1.5"/>
<text x="424" y="136" font-size="9.1" fill="#93c5fd" text-anchor="start" font-weight="700">返地轨道器 (7 吨 / 翼展 38 m)</text>
<polygon points="458,197 678,170 678,224" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="4 3"/>
<line x1="458" y1="197" x2="672" y2="197" stroke="#4ade80" stroke-width="1.8" stroke-dasharray="3 2"/>
<circle cx="682" cy="197" r="7.0" fill="#fde047" stroke="#ffffff" stroke-width="1.6"/>
<text x="682" y="160" font-size="9.2" fill="#fde047" text-anchor="middle" font-weight="700">样品球 OS</text>
<text x="682" y="240" font-size="8.9" fill="#f8fafc" text-anchor="middle">Ø 23 cm / 11 kg</text>
<text x="556" y="156" font-size="9.0" fill="#bae6fd" text-anchor="middle" font-weight="600">① &gt;1,000 km 相机搜反光星点</text>
<text x="552" y="240" font-size="9.0" fill="#86efac" text-anchor="middle" font-weight="600">② 近距 LiDAR 锁死相对位姿</text>
<rect x="412" y="330" width="314" height="144" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="424" y="350" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700">为什么环火交会比嫦娥五号/六号环月交会还要凶险？</text>
<text x="424" y="370" font-size="9.1" fill="#1e293b" text-anchor="start">• 距离远百倍以上：地月仅 38 万 km（延迟 1.3 秒，地面可兜底）；</text>
<text x="424" y="388" font-size="9.1" fill="#c25014" text-anchor="start" font-weight="700">  地火隔 5,500 万～4 亿 km，单程延迟达 22 分钟，零人工介入！</text>
<text x="424" y="407" font-size="9.1" fill="#1e293b" text-anchor="start">• 被动非合作目标：样品球为省重不带推进器与主动雷达应答机，</text>
<text x="424" y="425" font-size="9.1" fill="#1e293b" text-anchor="start">  万一上升器入轨偏差稍大，7 吨母船必须在茫茫火轨自己找回它；</text>
<text x="424" y="443" font-size="9.1" fill="#18794e" text-anchor="start" font-weight="700">• 天问三号则兼顾主动微波/激光导引交会，力求压缩捕获风险。</text>
</svg>
