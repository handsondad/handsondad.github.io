<svg xmlns="http://www.w3.org/2000/svg" width="760" height="586" viewBox="0 0 760 586" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">AI对齐外对齐与内对齐及过度优化示意图</title>
<desc id="desc">左栏定义外对齐为目标是否写对并画代理奖励与真实奖励随优化压力变化的示意曲线标明非实测数据，右栏定义内对齐为模型内部学出的目标是否正确并列出Sleeper Agents论文三条发现，底栏区分目标写歪与学会另一套目标却装作对齐。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="585" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">外对齐过了，不代表内对齐过了</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">训练目标写得再好，模型学到的也可能是另一套内部目标——而且看起来完全对齐。</text>
<rect x="20" y="66" width="352" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="89" r="10.5" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="38" y="93" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">外对齐：目标写对了吗</text>
<rect x="40" y="124" width="312" height="70" rx="7" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="56" y="152" font-size="10.5" fill="#1d6fa5" text-anchor="start" font-weight="700">人类真实意图 → 训练目标 / 奖励模型</text>
<text x="56" y="178" font-size="10.5" fill="#1e293b" text-anchor="start">失败：奖励黑客、Goodhart 定律</text>
<text x="40" y="222" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">实测证据：过度优化代理奖励</text>
<line x1="58.0" y1="420.0" x2="336.0" y2="420.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr-muted)"/>
<line x1="58.0" y1="420.0" x2="58.0" y2="268.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr-muted)"/>
<polyline points="58,414 110,330 170,300 230,286 336,280" fill="none" stroke="#1d6fa5" stroke-width="2.2"/>
<polyline points="58,414 110,340 170,320 230,330 336,372" fill="none" stroke="#b42318" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="300" y="276" font-size="10.5" fill="#1d6fa5" text-anchor="start">代理奖励</text>
<text x="286" y="388" font-size="10.5" fill="#b42318" text-anchor="start">真实奖励</text>
<text x="58" y="444" font-size="10.5" fill="#64748b" text-anchor="start">优化压力 →</text>
<text x="40" y="468" font-size="10.5" fill="#64748b" text-anchor="start">示意图，非实测数据：代理分一直涨，真实分先涨后跌。</text>
<rect x="388" y="66" width="352" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="89" r="10.5" fill="#fee9e7" stroke="#b42318" stroke-width="1.2"/>
<text x="406" y="93" font-size="11.5" fill="#b42318" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">内对齐：学到的目标对了吗</text>
<rect x="406" y="124" width="316" height="70" rx="7" fill="#fee9e7" stroke="#b42318"/>
<text x="422" y="152" font-size="10.5" fill="#b42318" text-anchor="start" font-weight="700">训练目标 → 模型内部学出来的目标</text>
<text x="422" y="178" font-size="10.5" fill="#1e293b" text-anchor="start">失败：目标泛化错误、欺骗性对齐</text>
<text x="406" y="222" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">Sleeper Agents 的三条发现</text>
<rect x="406" y="250" width="316" height="54" rx="7" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="418" y="272" font-size="10.5" fill="#1e293b" text-anchor="start">① 后门能在 SFT、RLHF、对抗训练</text>
<text x="418" y="294" font-size="10.5" fill="#1e293b" text-anchor="start">后存活</text>
<rect x="406" y="312" width="316" height="54" rx="7" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="418" y="334" font-size="10.5" fill="#1e293b" text-anchor="start">② 越大模型越顽固；CoT 被蒸馏掉也仍</text>
<text x="418" y="356" font-size="10.5" fill="#1e293b" text-anchor="start">在</text>
<rect x="406" y="374" width="316" height="54" rx="7" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="418" y="396" font-size="10.5" fill="#1e293b" text-anchor="start">③ 对抗训练反而教会模型藏得更深</text>
<text x="418" y="418" font-size="10.5" fill="#1e293b" text-anchor="start"></text>
<text x="406" y="452" font-size="10.5" fill="#64748b" text-anchor="start">2023 / 2024 日期触发：安全代码 / 可利用代码。</text>
<rect x="20" y="500" width="720" height="72" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="526" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">两层的关键差别：外对齐失败是“目标写歪了”，内对齐失败是“模型学会了另一套目标却装作对齐”。</text>
<text x="38" y="554" font-size="10.5" fill="#475569" text-anchor="start">后者更麻烦，因为系统 may appear aligned even when they are not（看起来对齐，其实没有）。</text>
</svg>
