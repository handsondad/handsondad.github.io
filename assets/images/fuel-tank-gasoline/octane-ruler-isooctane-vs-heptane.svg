<svg xmlns="http://www.w3.org/2000/svg" width="760" height="516" viewBox="0 0 760 516" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">汽油辛烷值分子标尺与中外标号换算及汽柴油逻辑对比图</title>
<desc id="desc">展示0分正庚烷直链与100分异辛烷多支链分子结构差异、中国RON研究法标号（89/92/95/98）与北美AKI标号（87/89/93）的换算关系，以及汽油抗爆标号与柴油凝点标号的本质区别。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="515" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">92、95、98 号到底在给什么打分？一把“异辛烷 vs 正庚烷”的抗爆震标尺</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">先看左栏 0 分直链正庚烷与 100 分支链异辛烷的分子骨架 → 再看右栏中外加油站标号为什么差 5 分</text>
<rect x="24" y="66" width="352" height="292" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="42" cy="86" r="10" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="42" y="90" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">1</text>
<text x="58" y="90" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="700">辛烷值标尺：不是“纯度”，而是“抗自燃定力”！</text>
<rect x="38" y="104" width="324" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<rect x="48.0" y="112.0" width="264" height="20" rx="10.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="180.0" y="125.6" font-size="10.8" fill="#dc2626" text-anchor="middle" font-weight="600">0 分学渣基准：正庚烷 n-C₇H₁₆（RON = 0）</text>
<polyline points="56,156 78,144 100,156 122,144 144,156 166,144 188,156" fill="none" stroke="#dc2626" stroke-width="2.8"/><circle cx="56" cy="156" r="4.5" fill="#dc2626"/><circle cx="78" cy="144" r="4.5" fill="#dc2626"/><circle cx="100" cy="156" r="4.5" fill="#dc2626"/><circle cx="122" cy="144" r="4.5" fill="#dc2626"/><circle cx="144" cy="156" r="4.5" fill="#dc2626"/><circle cx="166" cy="144" r="4.5" fill="#dc2626"/><circle cx="188" cy="156" r="4.5" fill="#dc2626"/>
<text x="206" y="152" font-size="10.8" fill="#1e293b" text-anchor="start">细长无支链 → 高温高压下极易</text>
<text x="206" y="171" font-size="10.8" fill="#dc2626" text-anchor="start" font-weight="700">断裂生过氧化物，一挤就暴躁自燃！</text>
<text x="48" y="187" font-size="10.1" fill="#64748b" text-anchor="start">（正辛烷更惨：RON = -20！碳链越直越长，汽油机越容易敲缸）</text>
<rect x="38" y="204" width="324" height="100" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.1"/>
<rect x="48.0" y="212.0" width="304" height="20" rx="10.0" fill="#dcfce7" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="200.0" y="225.6" font-size="10.6" fill="#18794e" text-anchor="middle" font-weight="600">100 分学霸基准：异辛烷 2,2,4-三甲基戊烷（RON = 100）</text>
<polyline points="60,262 84,252 108,262 132,252 156,262" fill="none" stroke="#18794e" stroke-width="2.8"/>
<line x1="84" y1="252" x2="76" y2="236" stroke="#18794e" stroke-width="2.5"/>
<line x1="84" y1="252" x2="92" y2="270" stroke="#18794e" stroke-width="2.5"/>
<line x1="132" y1="252" x2="132" y2="235" stroke="#18794e" stroke-width="2.5"/>
<circle cx="60" cy="262" r="4.5" fill="#18794e"/><circle cx="84" cy="252" r="4.5" fill="#18794e"/><circle cx="108" cy="262" r="4.5" fill="#18794e"/><circle cx="132" cy="252" r="4.5" fill="#18794e"/><circle cx="156" cy="262" r="4.5" fill="#18794e"/>
<circle cx="76" cy="236" r="4.2" fill="#1d6fa5"/>
<circle cx="92" cy="270" r="4.2" fill="#1d6fa5"/>
<circle cx="132" cy="235" r="4.2" fill="#1d6fa5"/>
<text x="182" y="255" font-size="10.8" fill="#1e293b" text-anchor="start">紧凑多支链抱团 → 自由基极难链式</text>
<text x="182" y="274" font-size="10.8" fill="#18794e" text-anchor="start" font-weight="700">蔓延，高压下稳如泰山，乖乖等火花！</text>
<text x="48" y="296" font-size="10.3" fill="#0f172a" text-anchor="start" font-weight="600">定义：92 号汽油 = 抗爆定力等同于“92% 异辛烷 + 8% 正庚烷”标准液</text>
<text x="38" y="326" font-size="10.6" fill="#1e293b" text-anchor="start">• 真相：现代商品汽油并非真拿异辛烷兑正庚烷，而是由上百种 C₄~C₁₂</text>
<text x="38" y="345" font-size="10.6" fill="#1e293b" text-anchor="start">  异构烷烃、环烷烃、芳烃及含氧抗爆剂（如乙醇 RON≈108.6）调合而成。</text>
<rect x="392" y="66" width="344" height="292" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="410" cy="86" r="10" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="410" y="90" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="426" y="90" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="700">出国自驾别加错：为什么美国最高才标 93 号？</text>
<text x="406" y="115" font-size="10.7" fill="#1d6fa5" text-anchor="start" font-weight="600">• 研究法 RON（中/欧标准）：600 rpm 温和进气，模拟市区加速</text>
<text x="406" y="135" font-size="10.7" fill="#c25014" text-anchor="start" font-weight="600">• 马达法 MON（严苛测试）：900 rpm 预热进气，同款油低 8~12 分</text>
<text x="406" y="155" font-size="10.7" fill="#6d28d9" text-anchor="start" font-weight="700">• 美加抗爆指数 AKI = (RON + MON) ÷ 2 → 数字天生低 4~5 分！</text>
<rect x="406" y="170" width="316" height="30" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="416" y="189" font-size="11.2" fill="#475569" text-anchor="start" font-weight="700">中国 89#</text>
<text x="486" y="189" font-size="10.4" fill="#1e293b" text-anchor="start" font-weight="600">RON ≥ 89</text>
<text x="606" y="189" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">老款低压缩比机 / 农机</text>
<rect x="406" y="206" width="316" height="30" rx="6" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="416" y="225" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">中国 92#</text>
<text x="486" y="225" font-size="10.4" fill="#1e293b" text-anchor="start" font-weight="600">RON 92 / MON≈82</text>
<text x="606" y="225" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">≈ 美国 Regular 87</text>
<rect x="406" y="242" width="316" height="30" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="416" y="261" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">中国 95#</text>
<text x="486" y="261" font-size="10.4" fill="#1e293b" text-anchor="start" font-weight="600">RON 95 / MON≈85</text>
<text x="606" y="261" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">≈ 美国 Mid 89~90 / 欧 95</text>
<rect x="406" y="278" width="316" height="30" rx="6" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="416" y="297" font-size="11.2" fill="#6d28d9" text-anchor="start" font-weight="700">中国 98#</text>
<text x="486" y="297" font-size="10.4" fill="#1e293b" text-anchor="start" font-weight="600">RON 98 / MON≈88</text>
<text x="606" y="297" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">≈ 美国 Premium 93 / 欧 98</text>
<text x="406" y="332" font-size="10.5" fill="#1e293b" text-anchor="start">• 超过 100 分存在吗？完全存在！德国 Aral 102、赛车汽油、</text>
<text x="406" y="349" font-size="10.5" fill="#64748b" text-anchor="start">  航空活塞油及纯乙醇（RON 108.6）抗爆性都比纯异辛烷更强。</text>
<rect x="24" y="372" width="712" height="130" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="40" y="395" font-size="12.1" fill="#0f172a" text-anchor="start" font-weight="700">顺手打通任督二脉：为什么汽油怕“提前自燃”，柴油（0# / -10# / -35#）标号却完全是另一套逻辑？</text>
<rect x="40" y="408" width="332" height="82" rx="8" fill="#ffffff" stroke="#1d6fa5" stroke-width="1"/>
<text x="52" y="429" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">汽油机（火花塞点燃）：追求“沉得住气”的高辛烷值</text>
<text x="52" y="450" font-size="10.7" fill="#1e293b" text-anchor="start">• 先把油气混合好再一起压缩，绝不许在火花塞点火前自燃</text>
<text x="52" y="470" font-size="10.7" fill="#0f172a" text-anchor="start" font-weight="600">• 92 / 95 / 98 全代表抗爆震辛烷值（RON），跟结冰温度无关！</text>
<rect x="388" y="408" width="332" height="82" rx="8" fill="#ffffff" stroke="#c25014" stroke-width="1"/>
<text x="400" y="429" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">柴油机（压燃无火花塞）：标号代表“凝点温度”！</text>
<text x="400" y="450" font-size="10.7" fill="#1e293b" text-anchor="start">• 先把纯空气压到滚烫再喷柴油，越容易自燃越好（高十六烷值）</text>
<text x="400" y="470" font-size="10.7" fill="#dc2626" text-anchor="start" font-weight="600">• 0#、-10#、-35# 柴油代表抗结蜡凝点（℃），冬天选错真会冻住！</text>
</svg>
