<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">固定1%半径厚度下的高维球壳体积比例</title><desc id="desc">2、3、10、100、1000维的外壳占比依次为1.99%、2.9701%、9.5618%、63.3968%、99.9957%。横条是数值图表，不是高维球的投影。</desc>
<style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.s1{animation:r1 4.5s steps(1,end) 1 both}
.s2{animation:r2 4.5s steps(1,end) 1 both}
.s3{animation:r3 4.5s steps(1,end) 1 both}
@keyframes r1{0%,9%{opacity:0}10%,100%{opacity:1}}
@keyframes r2{0%,34%{opacity:0}35%,100%{opacity:1}}
@keyframes r3{0%,64%{opacity:0}65%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.s1,.s2,.s3,.spinner{animation:none}}
</style>
<rect width="1000" height="650" rx="20" fill="#faf8f3"/>
<text x="500" y="48" text-anchor="middle" font-size="28" fill="#20334d" font-weight="700">半径只取外面 1%，体积能占多少？</text><text x="500" y="88" text-anchor="middle" font-size="20" fill="#20334d">同样的壳厚 ε = 0.01；条长表示体积比例，不是球的形状</text><text x="120" y="137" text-anchor="middle" font-size="20" fill="#20334d">维度 n</text><text x="565" y="137" text-anchor="middle" font-size="21" fill="#20334d">外壳占比：1 − 0.99ⁿ</text><text x="120" y="195" text-anchor="middle" font-size="24" fill="#20334d" font-weight="700">2</text><rect x="215" y="170" width="610" height="34" rx="14" fill="#e7e8ef"/><rect x="215" y="170" width="12.139000000000017" height="34" rx="4" fill="#277c67" data-n="2" data-fraction="0.01990000000000003"/><text x="850" y="195" text-anchor="start" font-size="19" fill="#20334d">1.9900%</text><text x="120" y="264" text-anchor="middle" font-size="24" fill="#20334d" font-weight="700">3</text><rect x="215" y="239" width="610" height="34" rx="14" fill="#e7e8ef"/><rect x="215" y="239" width="18.117609999999985" height="34" rx="4" fill="#277c67" data-n="3" data-fraction="0.029700999999999977"/><text x="850" y="264" text-anchor="start" font-size="19" fill="#20334d">2.9701%</text><text x="120" y="333" text-anchor="middle" font-size="24" fill="#20334d" font-weight="700">10</text><rect x="215" y="308" width="610" height="34" rx="14" fill="#e7e8ef"/><rect x="215" y="308" width="58.326934244629314" height="34" rx="4" fill="#277c67" data-n="10" data-fraction="0.09561792499119559"/><text x="850" y="333" text-anchor="start" font-size="19" fill="#20334d">9.5618%</text><text x="120" y="402" text-anchor="middle" font-size="24" fill="#20334d" font-weight="700">100</text><rect x="215" y="377" width="610" height="34" rx="14" fill="#e7e8ef"/><rect x="215" y="377" width="386.7202718233302" height="34" rx="4" fill="#277c67" data-n="100" data-fraction="0.6339676587267709"/><text x="850" y="402" text-anchor="start" font-size="19" fill="#20334d">63.3968%</text><text x="120" y="471" text-anchor="middle" font-size="24" fill="#20334d" font-weight="700">1000</text><rect x="215" y="446" width="610" height="34" rx="14" fill="#e7e8ef"/><rect x="215" y="446" width="609.9736655390794" height="34" rx="4" fill="#277c67" data-n="1000" data-fraction="0.9999568287525893"/><text x="850" y="471" text-anchor="start" font-size="19" fill="#20334d">99.9957%</text><text x="500" y="563" text-anchor="middle" font-size="23" fill="#20334d" font-weight="700">先固定壳厚，再提高维度：不是把二维圆环画得越来越厚</text><text x="500" y="607" text-anchor="middle" font-size="19" fill="#20334d">前提：在整个单位球体内均匀采样。中心仍在球内，球面本身的体积仍为 0。</text>
</svg>
