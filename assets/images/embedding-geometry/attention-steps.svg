<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="605" viewBox="0 0 1000 605" role="img" aria-labelledby="title desc">
<title id="title">单头注意力的具体数值分步图</title><desc id="desc">分数3、0、1经softmax后约0.844、0.042、0.114；值向量分别为(1,0)、(0,1)、(0.5,0.5)，加权输出约(0.9009,0.0991)。分三步出现，最终保留完整图。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .s1{animation:r1 4.5s steps(1,end) 1 both}
    .s2{animation:r2 4.5s steps(1,end) 1 both}
    .s3{animation:r3 4.5s steps(1,end) 1 both}
    @keyframes r1{0%,9%{opacity:0}10%,100%{opacity:1}}
    @keyframes r2{0%,34%{opacity:0}35%,100%{opacity:1}}
    @keyframes r3{0%,64%{opacity:0}65%,100%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.s1,.s2,.s3,.spinner{animation:none}}</style>
<rect x="1" y="1" width="998" height="603" rx="16" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.5"/>
<text x="500" y="46.19" text-anchor="middle" font-size="20.5" fill="#20334d" font-weight="700">把注意力算一遍：分数 → 权重 → 加权取值</text><text x="500" y="85.88" text-anchor="middle" font-size="15.0" fill="#20334d">单头、单位置的玩具例子：三处可见信息；不是某个真实模型的测量</text><g class="s1"><rect x="30" y="122" width="303" height="300" rx="14" fill="#e6eff9" stroke="#dde6ee" stroke-width="1"/><text x="181" y="163.71" text-anchor="middle" font-size="16.4" fill="#20334d" font-weight="700">① 已缩放的匹配分数</text><text x="181" y="230.64" text-anchor="middle" font-size="17.2" fill="#20334d">A：3</text><text x="181" y="300.64" text-anchor="middle" font-size="17.2" fill="#20334d">B：0</text><text x="181" y="370.64" text-anchor="middle" font-size="17.2" fill="#20334d">C：1</text></g><g class="s2"><rect x="358" y="122" width="303" height="300" rx="14" fill="#f0e7f7" stroke="#dde6ee" stroke-width="1"/><text x="509" y="163.71" text-anchor="middle" font-size="16.4" fill="#20334d" font-weight="700">② softmax 后的权重</text><text x="509" y="230.64" text-anchor="middle" font-size="17.2" fill="#20334d">A：0.844</text><text x="509" y="300.64" text-anchor="middle" font-size="17.2" fill="#20334d">B：0.042</text><text x="509" y="370.64" text-anchor="middle" font-size="17.2" fill="#20334d">C：0.114</text></g><g class="s3"><rect x="686" y="122" width="303" height="300" rx="14" fill="#e4f2eb" stroke="#dde6ee" stroke-width="1"/><text x="837" y="163.71" text-anchor="middle" font-size="16.4" fill="#20334d" font-weight="700">③ 乘上对应的 V</text><text x="837" y="230.64" text-anchor="middle" font-size="17.2" fill="#20334d">0.844 × (1.0, 0.0)</text><text x="837" y="300.64" text-anchor="middle" font-size="17.2" fill="#20334d">0.042 × (0.0, 1.0)</text><text x="837" y="370.64" text-anchor="middle" font-size="17.2" fill="#20334d">0.114 × (0.5, 0.5)</text></g><text x="500" y="473.46" text-anchor="middle" font-size="19.5" fill="#20334d" font-weight="700">先用未四舍五入的权重计算：o ≈ (0.9009, 0.0991)</text><text x="500" y="522.88" text-anchor="middle" font-size="15.0" fill="#20334d">Q、K 参与算匹配分数；真正混合的内容来自 V，而不是把分数本身当内容。</text><text x="500" y="564.16" text-anchor="middle" font-size="15.0" fill="#20334d">权重总和为 1，但不是“属于某个语义类别的概率”；输出还不是整个 Transformer 层。</text>
</svg>
