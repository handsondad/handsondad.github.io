<circle cx="102" cy="212.0" r="6.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2 2"/>
<circle cx="300" cy="212.0" r="6.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="2 2"/>
<g class="alpha-tunnel-dot"><circle cx="102" cy="212.0" r="6.5" fill="#dc2626"/></g>
<text x="148.0" y="132" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">库仑高墙 ~26 MeV</text>
<text x="206" y="188" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">经典禁区：波函数指数衰减穿墙</text>
<text x="312" y="266" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="700">穿墙逃逸 α (4.27 MeV) →</text>
<text x="102" y="274" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">核内势阱</text>
<rect x="424" y="114" width="302" height="174" rx="8" fill="#fff7ed" stroke="#c25014" stroke-width="1.2"/>
<text x="436" y="136" font-size="11.6" fill="#c25014" text-anchor="start" font-weight="700">为什么半衰期能差出 27 个数量级？</text>
<text x="436" y="158" font-size="11.5" fill="#1e293b" text-anchor="start">• α 团簇每秒撞墙 10²¹ 次！穿墙率对能量极敏感：</text>
<text x="436" y="180" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">• 钋-212 (8.95 MeV)：墙薄，半衰期仅 0.3 微秒！</text>
<text x="436" y="202" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 铀-238 (4.27 MeV)：撞 10³⁸ 次才穿出 1 次，</text>
<text x="436" y="224" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">  半衰期长达 44.7 亿年（恰好与地球同寿供地热）！</text>
<text x="436" y="248" font-size="11.5" fill="#1e293b" text-anchor="start">• 铁律 N=N₀(1/2)^(t/T₁/₂)：单核何时穿完全随机，</text>
<text x="436" y="270" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">  万亿核总体却准如碳-14 考古原子钟！</text>
<rect x="20" y="316" width="366" height="214" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="328.0" width="342" height="24" rx="12.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="203.0" y="344.3" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="600">B · β 衰变：原子核里根本没藏电子！是弱力现场造的</text>
<text x="34" y="368" font-size="11.5" fill="#1e293b" text-anchor="start">• 海森堡铁证：若把电子硬关进 10 fm 核里，不确定性动量</text>
<text x="34" y="390" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">  要求动能 &gt;12,000 MeV（实测仅 ~1 MeV）→ 核内绝无电子！</text>
<text x="34" y="416" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 真相（弱核力夸克手术）：当核内中子偏多（如 ¹⁴C），</text>
<text x="34" y="438" font-size="11.5" fill="#1e293b" text-anchor="start">  中子内 1 颗下夸克 d 吐出虚 W⁻ 玻色子翻转为上夸克 u：</text>
<text x="34" y="462" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">  n(udd) → p(uud) + e⁻(β⁻) + ν̄_e（质子数 Z+1 回归稳定谷！）</text>
<text x="34" y="486" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">• 反之质子偏多时发生 β⁺ 衰变：p → n + e⁺ + ν_e（医院 PET</text>
<text x="34" y="508" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">  正电子显像原理）；γ 衰变则是核壳层高能级跃迁吐光子！</text>
<rect x="398" y="316" width="342" height="214" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="410.0" y="328.0" width="318" height="24" rx="12.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="569.0" y="344.3" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="600">C · α、β、γ 三大射线脾气与防护盾牌实测对比</text>
<rect x="548" y="364" width="12" height="118" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<rect x="616" y="364" width="16" height="118" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
<rect x="686" y="364" width="28" height="118" rx="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.4"/>
<text x="554" y="498" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700">一张纸/皮肤</text>
<text x="624" y="498" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">3mm 铝板</text>
<text x="700" y="498" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">几厘米铅墙</text>
<text x="412" y="388" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">α (⁴He²⁺ 重炮)</text>
<line x1="506.0" y1="384.0" x2="546.0" y2="384.0" stroke="#dc2626" stroke-width="3.2"/>
<text x="412" y="428" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">β (高速 e⁻/e⁺)</text>
<line x1="506.0" y1="424.0" x2="614.0" y2="424.0" stroke="#6d28d9" stroke-width="2.4"/>
<text x="412" y="468" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">γ (MeV 光子)</text>
<line x1="506.0" y1="464.0" x2="698.0" y2="464.0" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="5 3"/>
<text x="570" y="518" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="600">注：α 外照一张纸即挡，但吸入体内近距电离杀伤极强！</text>
</svg>
