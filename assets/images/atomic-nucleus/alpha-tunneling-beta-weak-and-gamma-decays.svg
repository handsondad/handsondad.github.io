<rect x="0.5" y="0.5" width="759" height="543" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">四、挤不下或偏科的原子核如何自救？α 量子穿墙术、β 夸克变身与 γ 泄压</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上：伽莫夫 α 粒子量子隧穿 26 MeV 静电高墙动画 · 下：弱力夸克翻转 β 衰变与三射线穿透力对比</text>
