<svg xmlns="http://www.w3.org/2000/svg" width="760" height="544" viewBox="0 0 760 544" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">铀238阿尔法粒子伽莫夫量子隧穿势垒动画与贝塔弱力夸克变身及三射线穿透力对比图解</title>
<desc id="desc">上栏绘制核内深势阱与26兆电子伏库仑势垒，单次动画配合静态穿透波展示4.27兆电子伏阿尔法粒子量子隧穿逃逸；左下栏用不确定性原理排除核内预存电子，展示弱核力d变u夸克贝塔衰变；右下栏对比纸张、铝板与铅墙对α、β、γ射线的阻挡能力。</desc>
