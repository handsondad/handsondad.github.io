<rect x="32.0" y="78.0" width="696" height="24" rx="12.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="94.3" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="600">A · α 衰变惊天悖论：铀-238 里的 α 粒子只有 4.27 MeV，凭什么翻过 26 MeV 库仑绝壁？（1928 伽莫夫量子隧穿）</text>
