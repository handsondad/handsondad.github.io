<title id="title">核子间强核力与库仑力势能实算曲线及核素图稳定谷N/Z向上弯曲机制图解</title>
<desc id="desc">左栏绘制核子间距0.4至3.4飞米内的排斥硬核与1飞米汤川强吸引深势阱，解释原子核恒定2.3亿吨每立方厘米超高密度；右栏绘制核素稳定谷N对Z曲线，展示Z大于20后长程库仑斥力迫使稳定核招募额外中子直至铅208极限。</desc>
