<text x="110.3" y="138" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">&lt;0.6 fm 硬核死顶</text>
<text x="155.9" y="271.9" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">~1 fm 强力深阱 (-50 MeV)</text>
<text x="344" y="181.6" font-size="11.5" fill="#c25014" text-anchor="end" font-weight="600">橙虚线：库仑长程斥力(示意放大)</text>
<text x="212" y="312" font-size="11.5" fill="#64748b" text-anchor="middle">核子间距 r（0.4 → 3.4 fm，&gt;2.5 fm 强力归零！）</text>
<rect x="32" y="326" width="330" height="190" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="44" y="348" font-size="11.6" fill="#1d6fa5" text-anchor="start" font-weight="700">原子核的三个极端尺度真相：</text>
<text x="44" y="370" font-size="11.5" fill="#1e293b" text-anchor="start">• 体育场里的一颗棒球：核半径仅原子 1/10 万，却装走</text>
<text x="44" y="392" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  99.97% 质量！R = 1.2 A¹/³ fm（铁核约 4.6 fm）；</text>
<text x="44" y="416" font-size="11.5" fill="#1e293b" text-anchor="start">• 密度恒定 2.3×10¹⁷ kg/m³：因 &lt;0.6 fm 排斥硬核死顶，</text>
<text x="44" y="438" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">  核子没法再压扁，1 立方厘米核物质重达 2.3 亿吨！</text>
<text x="44" y="462" font-size="11.5" fill="#1e293b" text-anchor="start">• 1935 汤川秀树破案：核子靠交换有质量的 π 介子拉手，</text>
<text x="44" y="484" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">  力程锁死在 ħ/(m_π c) ≈ 1.4 fm，强度压倒电磁百倍，</text>
<text x="44" y="504" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">  且对质子、中子一视同仁（电荷无关性）！</text>
<rect x="388" y="66" width="352" height="464" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="400.0" y="78.0" width="328" height="24" rx="12.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
