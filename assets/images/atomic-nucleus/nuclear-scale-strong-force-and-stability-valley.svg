<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、几十颗正电荷质子挤在几飞米里，凭什么没炸飞？强核力手铐与中子稳定谷</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：核子势能 V(r) 实算（0.5 fm 硬核排斥 + 1 fm 汤川强吸引） · 右：核素稳定谷 N/Z 弯曲之谜</text>
