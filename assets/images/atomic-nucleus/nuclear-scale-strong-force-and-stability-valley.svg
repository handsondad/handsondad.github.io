<text x="434" y="134" font-size="11.5" fill="#0f172a" text-anchor="end" font-weight="700">中子N</text>
<text x="580" y="326" font-size="11.5" fill="#64748b" text-anchor="middle">质子数 Z（0 → 92，Z&gt;82 后全部具放射性）</text>
<rect x="400" y="340" width="328" height="176" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="412" y="362" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">中子的神级职责：“只出强力胶水、不添静电火药”！</text>
<text x="412" y="386" font-size="11.5" fill="#1e293b" text-anchor="start">• 轻核 (Z≤20)：核直径小，质子与中子 1:1 对称最省能；</text>
<text x="412" y="408" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="600">• 重核危机：强核力只拉贴身邻居（~A），而库仑斥力横跨</text>
<text x="412" y="430" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">  全核，每对质子都互推，斥力按 Z(Z-1)/2 平方暴涨！</text>
<text x="412" y="454" font-size="11.5" fill="#1e293b" text-anchor="start">• 破局：必须多塞不带电的中子隔开质子、补强核力（铅-208</text>
<text x="412" y="476" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">  高达 N/Z = 1.54）；一旦 Z &gt; 82（铅/铋之上），再多</text>
<text x="412" y="498" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  中子也箍不住静电炸药桶，原子核必然衰变或裂变！</text>
