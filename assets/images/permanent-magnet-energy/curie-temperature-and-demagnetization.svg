<text x="586.0" y="97.0" font-size="11.0" fill="#d97706" text-anchor="middle" font-weight="600">永磁体日常保养与真假退磁榜</text>
<rect x="464" y="118" width="260" height="74" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="474" y="136" font-size="9.9" fill="#18794e" text-anchor="start" font-weight="700">✅ 辟谣：一直吸重物会吸没劲吗？</text>
<text x="474" y="154" font-size="9.4" fill="#1e293b" text-anchor="start">绝不会！静力不做功，吸在铁板上反而帮磁</text>
<text x="474" y="169" font-size="9.4" fill="#1e293b" text-anchor="start">感线形成闭合磁路（古人称“衔铁护磁”）</text>
<text x="474" y="184" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="600">，比裸放空气中更不易退磁！</text>
<rect x="464" y="202" width="260" height="74" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="474" y="220" font-size="9.9" fill="#dc2626" text-anchor="start" font-weight="700">⚠️ 杀手 1：高温烘烤（头号天敌）</text>
<text x="474" y="238" font-size="9.4" fill="#1e293b" text-anchor="start">钕铁硼怕热（常规耐温 80–150°C</text>
<text x="474" y="253" font-size="9.4" fill="#1e293b" text-anchor="start">），电机过载发烫极易退磁；高温航天场景</text>
<text x="474" y="268" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="600">需改用钐钴磁铁（T_C 高达 700–800°C）。</text>
<rect x="464" y="286" width="260" height="74" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="474" y="304" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="700">⚠️ 杀手 2：强反向磁场与乱撞敲击</text>
<text x="474" y="322" font-size="9.4" fill="#1e293b" text-anchor="start">两块强磁同名极硬怼或拿铁锤猛砸古旧铝镍</text>
<text x="474" y="337" font-size="9.4" fill="#1e293b" text-anchor="start">钴磁钢，剧烈震动会帮磁畴壁翻越势垒滑回</text>
<text x="474" y="352" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="600">混乱抵消态。</text>
<rect x="464" y="370" width="260" height="74" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="474" y="388" font-size="9.9" fill="#475569" text-anchor="start" font-weight="700">⏳ 杀手 3：极其缓慢的热蠕变</text>
<text x="474" y="406" font-size="9.4" fill="#1e293b" text-anchor="start">常温下极少数磁畴靠热涨落越过势垒，呈对</text>
<text x="474" y="421" font-size="9.4" fill="#1e293b" text-anchor="start">数规律微弱衰减：现代优质钕铁硼在室温放</text>
<text x="474" y="436" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="600"> 30 年磁通损失不到 1%–3%！</text>
