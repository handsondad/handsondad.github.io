<text x="48" y="369" font-size="10.2" fill="#dc2626" text-anchor="start" font-weight="700">🔥 1895 皮埃尔·居里发现的临界相变（居里点 T_C）：</text>
<text x="48" y="388" font-size="9.8" fill="#1e293b" text-anchor="start">• 一旦加热跨过 T_C，晶格热振动能量 k_B T 彻底压倒海森堡交换锁扣，</text>
<text x="48" y="405" font-size="9.8" fill="#1e293b" text-anchor="start">  整齐列队的电子自旋瞬间乱成一团散沙（铁磁态相变为顺磁态）！</text>
<text x="48" y="423" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">• 生活警告：普通 N 牌号钕铁硼磁铁只要用打火机烤或泡进 &gt;80°C 开水，</text>
<text x="48" y="440" font-size="9.8" fill="#dc2626" text-anchor="start" font-weight="700">  就会发生不可逆退磁，凉下来也再变不回磁铁了（除非重进充磁机）！</text>
<rect x="448" y="68" width="292" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
