<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">“永磁铁”真的永恒不灭吗？一把火烧过“居里温度”，磁王当场变废铁！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">吊重物绝不会耗光磁性；真正能杀死永磁体的，是高温热运动、反向强磁场与剧烈敲击。</text>
