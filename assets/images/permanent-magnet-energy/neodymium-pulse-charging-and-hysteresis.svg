<circle cx="483.1" cy="224.0" r="4.8" fill="#dc2626"/>
<text x="479.1" y="242.0" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">-H_cJ 矫顽力</text>
<text x="646" y="176" font-size="9.6" fill="#6d28d9" text-anchor="start" font-weight="700">紫宽框：钕铁硼硬磁</text>
<text x="638" y="286" font-size="9.6" fill="#0d9488" text-anchor="start" font-weight="700">绿窄虚线：纯铁软磁</text>
<rect x="396" y="348" width="328" height="112" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="408" y="369" font-size="9.8" fill="#1e293b" text-anchor="start">• 软磁（纯铁钉/硅钢片）：磁滞回线窄如细针，矫顽力极小——外场</text>
<text x="408" y="387" font-size="9.8" fill="#0d9488" text-anchor="start" font-weight="700">  一撤磁畴立刻散架归零（最适合做电磁铁与变压器铁芯）！</text>
<text x="408" y="406" font-size="9.8" fill="#1e293b" text-anchor="start">• 硬磁 / 永磁（钕铁硼/钐钴/铁氧体）：回线宽胖如堡垒！撤去充磁</text>
<text x="408" y="424" font-size="9.8" fill="#1e293b" text-anchor="start">  外场 (H=0) 后稳坐高剩磁 B_r，除非遭遇超强反向磁场 (-H_cJ) 或</text>
<text x="408" y="442" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">  高温，否则被势垒牢牢锁在亚稳态里几十年不掉电！</text>
</svg>
