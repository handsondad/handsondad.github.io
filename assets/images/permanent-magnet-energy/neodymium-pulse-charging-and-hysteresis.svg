<rect x="0.5" y="0.5" width="759" height="493" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">磁铁那口“原始磁场能”是谁充进去的？钕铁硼凭什么当上现代磁王？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">出厂前经历一次毫秒级“雷霆脉冲充磁”，再靠极高矫顽力晶格高墙把磁畴死死钉在岗位上！</text>
<rect x="20" y="68" width="344" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="36.0" y="82.0" width="268" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="170.0" y="97.0" font-size="11.0" fill="#c25014" text-anchor="middle" font-weight="600">出厂关键工序：高压电容脉冲充磁机</text>
<rect x="44" y="126" width="88" height="72" rx="6" fill="#fef1e8" stroke="#c25014" stroke-width="1.8"/>
<text x="88" y="152" font-size="10.2" fill="#c25014" text-anchor="middle" font-weight="700">高压电容组</text>
<text x="88" y="170" font-size="9.8" fill="#0f172a" text-anchor="middle" font-weight="700" class="mono">2000–3000 V</text>
<text x="88" y="187" font-size="9.4" fill="#64748b" text-anchor="middle">储存数万焦耳</text>
<line x1="132.0" y1="162.0" x2="198.0" y2="162.0" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-orange)"/>
<text x="165" y="152" font-size="9.4" fill="#dc2626" text-anchor="middle" font-weight="700">万安培脉冲</text>
<text x="165" y="178" font-size="9.2" fill="#64748b" text-anchor="middle">(几毫秒放电)</text>
<rect x="204" y="122" width="136" height="80" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.8"/>
<rect x="232" y="144" width="80" height="36" rx="4" fill="#6d28d9" stroke="#0f172a" stroke-width="1.5"/>
<text x="272" y="166" font-size="10.0" fill="#ffffff" text-anchor="middle" font-weight="700" class="mono">Nd₂Fe₁₄B</text>
