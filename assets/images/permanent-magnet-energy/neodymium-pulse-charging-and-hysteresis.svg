<path d="M 308,122 Q 314,162 308,202" fill="none" stroke="#c25014" stroke-width="2.0"/>
<path d="M 326,122 Q 332,162 326,202" fill="none" stroke="#c25014" stroke-width="2.0"/>
<text x="272" y="218" font-size="9.8" fill="#1d6fa5" text-anchor="middle" font-weight="700">螺线管瞬间爆发 2–3 特斯拉强磁场！</text>
<rect x="36" y="236" width="312" height="222" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="48" y="258" font-size="10.4" fill="#0f172a" text-anchor="start" font-weight="700">⚡ 算清磁铁一辈子的能量总账：</text>
<text x="48" y="279" font-size="9.9" fill="#1e293b" text-anchor="start">① 刚从烧结炉出来的钕铁硼毛坯其实是【完全没磁性】的！</text>
<text x="48" y="298" font-size="9.9" fill="#1e293b" text-anchor="start">② 脉冲充磁机电网耗电充进电容，毫秒间轰出 &gt;2.5 T 巨浪，</text>
<text x="48" y="316" font-size="9.9" fill="#1e293b" text-anchor="start">   强行推平磁畴壁、把所有电子自旋拧向同一个易磁化轴，</text>
<text x="48" y="334" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="700">   同时替这块磁铁在周围空间建起了那座【外部磁场储能水库】！</text>
<text x="48" y="356" font-size="10.2" fill="#6d28d9" text-anchor="start" font-weight="700">🏆 1984 佐川真人发现“现代磁王”钕铁硼 (Nd₂Fe₁₄B)：</text>
<text x="48" y="375" font-size="9.8" fill="#1e293b" text-anchor="start">• 稀土钕原子(Nd)提供极陡的磁晶各向异性势垒（防退磁高墙），</text>
<text x="48" y="392" font-size="9.8" fill="#1e293b" text-anchor="start">  14 颗铁原子(Fe)提供超高饱和磁矩，硼原子(B)锁紧四方晶格；</text>
<text x="48" y="410" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">• 最大磁能积 (BH)_max 实验室纪录高达 474 kJ/m³ (59.5 MGOe)，</text>
<text x="48" y="428" font-size="9.8" fill="#1e293b" text-anchor="start">  指甲盖大一块就能轻松吊起自身重量几百倍的大铁砣，直接促成</text>
<text x="48" y="445" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="600">  新能源汽车驱动电机、风力发电机、耳机与硬盘音圈小型化革命！</text>
<rect x="380" y="68" width="360" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="396.0" y="82.0" width="316" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="554.0" y="97.0" font-size="10.8" fill="#6d28d9" text-anchor="middle" font-weight="600">硬磁 vs 软磁：一张“磁滞回线”看懂为何不退磁</text>
<line x1="408.0" y1="224.0" x2="712.0" y2="224.0" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arr-muted)"/>
