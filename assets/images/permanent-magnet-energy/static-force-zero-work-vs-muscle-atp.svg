<text x="568" y="137" font-size="9.6" fill="#1d6fa5" text-anchor="middle" font-weight="700">肌动蛋白细丝 (Actin) —— 无机械卡扣棘轮！</text>
<text x="568" y="163" font-size="9.4" fill="#dc2626" text-anchor="middle" font-weight="700">肌球蛋白横桥每秒几十次：抓紧→烧ATP松开→再抓紧→全变废热 Q！</text>
<text x="414" y="250" font-size="10.1" fill="#1e293b" text-anchor="start">• 人类骨骼肌为了换取“毫秒级收放自如”的敏捷身手，</text>
<text x="414" y="269" font-size="10.1" fill="#dc2626" text-anchor="start" font-weight="700">  演化时放弃了机械锁死卡扣！</text>
<text x="414" y="289" font-size="10.0" fill="#1e293b" text-anchor="start">• 当你平举哑铃纹丝不动时，成百上千亿个肌球蛋白小爪子</text>
<text x="414" y="307" font-size="10.0" fill="#1e293b" text-anchor="start">  像拔河队员在冰面上小碎步倒手一样，每秒反复【结合—</text>
<text x="414" y="325" font-size="10.0" fill="#0f172a" text-anchor="start" font-weight="700">  水解 ATP—脱开—再结合】数十次！</text>
<text x="414" y="344" font-size="10.0" fill="#1e293b" text-anchor="start">• 注意能量账本：哑铃高度没变，你对哑铃做的机械功依然</text>
<text x="414" y="362" font-size="10.0" fill="#18794e" text-anchor="start" font-weight="700">  严格等于 0 J；你烧掉的 ATP 100% 变成了肌肉内热 Q！</text>
<rect x="412" y="378" width="312" height="84" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<text x="424" y="398" font-size="10.0" fill="#d97706" text-anchor="start" font-weight="700">🦪 大自然反例：蛤蜊与扇贝的“闭壳平滑肌 (Catch Muscle)”！</text>
<text x="424" y="416" font-size="9.8" fill="#1e293b" text-anchor="start">• 你拿刀撬生蚝或蛤蜊为什么那么费劲？因为贝类演化出了</text>
<text x="424" y="433" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="600">  twitchin 蛋白分子插销——合拢后直接把横桥“机械上锁”，</text>
<text x="424" y="450" font-size="9.8" fill="#1e293b" text-anchor="start">  几乎不烧 ATP 就能死死夹紧好几天，跟磁铁和螺栓一模一样！</text>
</svg>
