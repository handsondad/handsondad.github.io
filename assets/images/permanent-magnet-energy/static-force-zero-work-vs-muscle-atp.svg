</style>
<rect x="0.5" y="0.5" width="759" height="493" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">手臂举哑铃累得冒汗，为什么冰箱贴吸在铁门十年却“零耗能”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">物理学第一铁律：有“力”不等于“做功”（W = F · Δs）！真正骗了你直觉的，是人类骨骼肌的特殊设计。</text>
<rect x="20" y="68" width="360" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="36.0" y="82.0" width="302" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="187.0" y="97.0" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="600">物理真相：位移 Δs = 0 → 做功 W = 0 焦耳！</text>
<rect x="36" y="118" width="328" height="62" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="48" y="137" font-size="10.4" fill="#1d6fa5" text-anchor="start" font-weight="700">① 木桌托住 5 kg 大词典</text>
<text x="48" y="155" font-size="9.8" fill="#1e293b" text-anchor="start">桌面弹性形变产生向上支持力 F = 49 N</text>
<text x="48" y="171" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">词典高度不变 (Δs = 0)，木桌一百年耗能 = 0 J！</text>
<rect x="36" y="190" width="328" height="62" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
<text x="48" y="209" font-size="10.4" fill="#0d9488" text-anchor="start" font-weight="700">② 钢螺栓夹紧两块钢板</text>
<text x="48" y="227" font-size="9.8" fill="#1e293b" text-anchor="start">螺杆预紧拉力高达数吨，死死咬合不松口</text>
<text x="48" y="243" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">无相对滑动 (Δs = 0)，钢螺栓无需装电池供电！</text>
<rect x="36" y="262" width="328" height="62" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="48" y="281" font-size="10.4" fill="#6d28d9" text-anchor="start" font-weight="700">③ 地球引力拉住整片海洋</text>
<text x="48" y="299" font-size="9.8" fill="#1e293b" text-anchor="start">万有引力时刻把海水拽向地心</text>
<text x="48" y="315" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">海面不继续下落 (Δs = 0)，地球引力场不掉质量！</text>
<rect x="36" y="334" width="328" height="62" rx="7" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="48" y="353" font-size="10.4" fill="#18794e" text-anchor="start" font-weight="700">④ 永磁冰箱贴吸住铁门</text>
<text x="48" y="371" font-size="9.8" fill="#1e293b" text-anchor="start">水平磁吸力 F_mag 引发最大静摩擦力 ≥ mg</text>
<text x="48" y="387" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">静止悬停 (Δs = 0)，磁场势能一分钱都不用掏！</text>
<text x="36" y="424" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">💡 费曼一语点醒：把“维持静态力”误当成“消耗能量”，</text>
<text x="36" y="442" font-size="10.0" fill="#1e293b" text-anchor="start">   是人类拿自己的胳膊去揣测无生命世界闹出的最大误会！</text>
<text x="36" y="460" font-size="9.6" fill="#64748b" text-anchor="start">   （见《费曼物理学讲义》第 1 卷第 14 章 §14-1）</text>
<rect x="396" y="68" width="344" height="408" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="412.0" y="82.0" width="312" height="22" rx="11.0" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-opacity="0.35"/>
<text x="568.0" y="97.0" font-size="10.6" fill="#dc2626" text-anchor="middle" font-weight="600">生理破案：为什么你的胳膊平举重物会酸痛发烫？</text>
<rect x="416" y="120" width="304" height="108" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
