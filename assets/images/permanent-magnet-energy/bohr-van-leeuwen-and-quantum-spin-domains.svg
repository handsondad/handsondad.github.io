<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">玻尔范吕文定理、电子量子自旋海森堡交换与铁磁磁畴结构图解</title>
<desc id="desc">左栏说明经典物理无法产生永磁性，永磁体源于零电阻损耗的电子内禀自旋与海森堡交换作用；右栏对比普通铁钉内部互相抵消的多磁畴结构与永磁体内部整齐同向锁定的磁畴阵列。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="509" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">电磁铁断电就失磁，为什么永磁铁体内没有电池，磁性却永不摩擦停转？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">1911 玻尔—范吕文定理惊天判决：经典物理世界里根本不可能存在永磁体！每一块吸铁石都是纯正量子奇迹。</text>
<rect x="20" y="68" width="368" height="424" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="36.0" y="82.0" width="302" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="187.0" y="97.0" font-size="10.8" fill="#6d28d9" text-anchor="middle" font-weight="600">微观真相：电子内禀自旋 + 海森堡交换作用</text>
<rect x="36" y="116" width="336" height="92" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="48" y="136" font-size="10.2" fill="#dc2626" text-anchor="start" font-weight="700">❌ 玻尔—范吕文定理（Bohr–van Leeuwen, 1911/1921）：</text>
<text x="48" y="155" font-size="9.8" fill="#1e293b" text-anchor="start">• 如果电子只是绕原子核转圈的经典带电小球，严格统计力学证明：</text>
<text x="48" y="173" font-size="9.8" fill="#1e293b" text-anchor="start">  任何热平衡固体的宏观磁化强度恒等于 0！而且经典电流只要在</text>
<text x="48" y="191" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">  常温金属晶格里跑，不到一纳秒就会被电阻发热耗光停转！</text>
<rect x="36" y="218" width="336" height="146" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="48" y="238" font-size="10.2" fill="#6d28d9" text-anchor="start" font-weight="700">✅ 量子力学亮出两张王牌，实现“零电阻永恒磁矩”：</text>
<text x="48" y="258" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">① 电子内禀自旋 (Spin s = 1/2，1 玻尔磁子 μ_B = 9.27×10⁻²⁴ J/T)：</text>
<text x="48" y="276" font-size="9.8" fill="#1e293b" text-anchor="start">   自旋不是小球真在机械自转，而是电子生来就焊死在身上的基态</text>
<text x="48" y="293" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">   量子属性！没有宏观电荷穿过晶格，因此电阻发热 I²R 严格为 0！</text>
<text x="48" y="313" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="700">② 海森堡交换相互作用 (Heisenberg 1928)：</text>
<text x="48" y="330" font-size="9.8" fill="#1e293b" text-anchor="start">   泡利不相容原理规定：相邻铁原子 3d 未成对电子若【自旋平行】，</text>
<text x="48" y="347" font-size="9.8" fill="#1e293b" text-anchor="start">   空间波函数反对称→电子自动离得更远→静电排斥能大幅降低！</text>
<rect x="36" y="374" width="336" height="102" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="48" y="394" font-size="10.0" fill="#1d6fa5" text-anchor="start" font-weight="700">🌀 安培分子环流几何戏法（内部抵消，只剩表面束缚电流 K_m）：</text>
<circle cx="76" cy="436" r="15" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="76" y="440" font-size="13" fill="#1d6fa5" text-anchor="middle" font-weight="700">↺</text>
<circle cx="118" cy="436" r="15" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="118" y="440" font-size="13" fill="#1d6fa5" text-anchor="middle" font-weight="700">↺</text>
<circle cx="160" cy="436" r="15" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="160" y="440" font-size="13" fill="#1d6fa5" text-anchor="middle" font-weight="700">↺</text>
<circle cx="202" cy="436" r="15" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="202" y="440" font-size="13" fill="#1d6fa5" text-anchor="middle" font-weight="700">↺</text>
<text x="236" y="424" font-size="9.6" fill="#1e293b" text-anchor="start">相邻晶格内部一上一下刚好抵消；</text>
<text x="236" y="442" font-size="9.6" fill="#1e293b" text-anchor="start">外表面等效于一圈永不耗能的</text>
<text x="236" y="460" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="700">量子束缚面电流 K_m = M × n̂！</text>
<rect x="404" y="68" width="336" height="424" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="420.0" y="82.0" width="304" height="22" rx="11.0" fill="#f0fdfa" stroke="#0d9488" stroke-width="1" stroke-opacity="0.35"/>
<text x="572.0" y="97.0" font-size="10.6" fill="#0d9488" text-anchor="middle" font-weight="600">中观破案：普通铁钉也有铁原子，为何平时不吸铁？</text>
<text x="420" y="122" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">状态 A：普通退火铁钉 —— 分裂成上百万个小【磁畴】互抵消</text>
<rect x="420" y="132" width="304" height="96" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
<line x1="510.0" y1="132.0" x2="492.0" y2="228.0" stroke="#0f172a" stroke-width="1.6"/>
<line x1="616.0" y1="132.0" x2="634.0" y2="228.0" stroke="#0f172a" stroke-width="1.6"/>
<line x1="420.0" y1="180.0" x2="724.0" y2="180.0" stroke="#0f172a" stroke-width="1.6"/>
<text x="462" y="160" font-size="16" fill="#1d6fa5" text-anchor="middle" font-weight="700">→</text>
<text x="562" y="160" font-size="16" fill="#c25014" text-anchor="middle" font-weight="700">↑</text>
<text x="672" y="160" font-size="16" fill="#dc2626" text-anchor="middle" font-weight="700">←</text>
<text x="458" y="208" font-size="16" fill="#18794e" text-anchor="middle" font-weight="700">↓</text>
<text x="566" y="208" font-size="16" fill="#6d28d9" text-anchor="middle" font-weight="700">←</text>
<text x="676" y="208" font-size="16" fill="#0d9488" text-anchor="middle" font-weight="700">↗</text>
<text x="572" y="246" font-size="9.5" fill="#64748b" text-anchor="middle">每个微米级磁畴内部早已 100% 磁化！但各畴方向乱指，对外净磁矩 = 0</text>
<text x="420" y="274" font-size="10.1" fill="#18794e" text-anchor="start" font-weight="700">状态 B：充磁后的永磁体 —— 各磁畴统一立正朝右（M 饱和锁定）！</text>
<rect x="420" y="284" width="304" height="84" rx="6" fill="#e7f6ee" stroke="#18794e" stroke-width="2.0"/>
<text x="454" y="314" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<text x="512" y="314" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<text x="570" y="314" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<text x="628" y="314" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<text x="686" y="314" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<text x="454" y="348" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<text x="512" y="348" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<text x="570" y="348" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<text x="628" y="348" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<text x="686" y="348" font-size="15" fill="#18794e" text-anchor="middle" font-weight="700">➔</text>
<rect x="420" y="382" width="304" height="94" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
<text x="432" y="402" font-size="10.1" fill="#0d9488" text-anchor="start" font-weight="700">🧩 为什么要分成磁畴？（又是为了省外部磁场能！）</text>
<text x="432" y="421" font-size="9.8" fill="#1e293b" text-anchor="start">• 如果整根大铁棒合成一个巨型磁畴，周围空间就得撑起庞大的外部</text>
<text x="432" y="438" font-size="9.8" fill="#1e293b" text-anchor="start">  磁场能 U_B；切成尺寸 &gt;10 μm 的反向小磁畴让磁感线在体内闭环，</text>
<text x="432" y="455" font-size="9.8" fill="#0f172a" text-anchor="start" font-weight="600">  总能量最低！所以普通铁块“身怀绝技却深藏不露”。</text>
</svg>
