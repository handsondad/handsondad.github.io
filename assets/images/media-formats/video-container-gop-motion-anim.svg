<text x="380" y="483" font-size="10.4" fill="#475569" text-anchor="middle">代际跃迁：H.264(兼容之王) → H.265/HEVC(4K HDR省流40%) → AV1(免版税流媒体新王) ｜ ProRes 全用 I 帧专供顺滑倒放剪辑</text>
