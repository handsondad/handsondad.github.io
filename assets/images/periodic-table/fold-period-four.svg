<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">八个大标题，为什么装得下十八个元素？</title><desc id="desc">第四周期的18个元素。上方为现代1至18族长行，下方按俄罗斯2026化学示例卷的短表位置分成两行，铁钴镍置于第VIII大族下，氪在第二行最右。下表角标为原子序数，上方为族号。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#21699a" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="830" rx="16" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">八个大标题，为什么装得下十八个元素？</text><text x="28" y="92" font-size="24" fill="#18364b" text-anchor="start">只取第四周期：同样 18 个元素，换一种排法。</text><text x="28" y="146" font-size="27" fill="#18364b" text-anchor="start">① 长表：沿一行读 K → Kr</text><text x="53" y="187" font-size="17" fill="#18364b" text-anchor="middle">1</text><rect x="36" y="201" width="34" height="62" rx="3" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="53" y="240" font-size="21" fill="#18364b" text-anchor="middle">K</text><text x="89" y="187" font-size="17" fill="#18364b" text-anchor="middle">2</text><rect x="72" y="201" width="34" height="62" rx="3" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="89" y="240" font-size="21" fill="#18364b" text-anchor="middle">Ca</text><text x="125" y="187" font-size="17" fill="#18364b" text-anchor="middle">3</text><rect x="108" y="201" width="34" height="62" rx="3" fill="#e2edf9" stroke="#adc2d1" stroke-width="2"/><text x="125" y="240" font-size="21" fill="#18364b" text-anchor="middle">Sc</text><text x="161" y="187" font-size="17" fill="#18364b" text-anchor="middle">4</text