<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">一张表，是怎样被许多人慢慢改出来的？</title><desc id="desc">1869门捷列夫早期周期体系，1871修订与预言，1905维尔纳展开式，1913莫塞莱原子序数工作，1923德明教材长表，1988IUPAC推荐1至18族编号。并非完整发明史，也不暗示所有版本单线继承。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#21699a" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="980" rx="16" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">一张表，是怎样被许多人慢慢改出来的？</text><text x="28" y="92" font-size="24" fill="#18364b" text-anchor="start">读成多人的接力，不是两国各自发明一张表。</text><rect x="28" y="130" width="664" height="107" rx="10" fill="#edf3f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="168" font-size="29" fill="#21699a" text-anchor="start">1869</text><text x="155" y="168" font-size="24" fill="#18364b" text-anchor="start">门捷列夫发表早期周期体系</text><text x="48" y="212" font-size="22" fill="#18364b" text-anchor="start">按原子量与化学性质组织，尚不知道现代原子结构。</text><rect x="28" y="256" width="664" height="107" rx="10" fill="#edf3f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="294" font-size="29" fill="#21699a" text-anchor="start">1871</text><text x="155" y="294" font-size="24" fill="#18364b" text-anchor="start">表格继续修订，并为未知元素留位</text><text x="48" y="338" font-size="22" fill="#18364b" text-anchor="start">不是一张排好后永不修改的八列表。</text><rect x="28" y="382" width="664" height="107" rx="10" fill="#edf3f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="420" font-size="29" fill="#21699a" text-anchor="start">1905</text><text x="155" y="420" font-size="24" fill="#18364b" text-anchor="start">维尔纳提出展开式排列</text><text x="48" y="464" font-size="22" fill="#18364b" text-anchor="start">已像现代长表，但包含后来被纠正的位置与数量。</text><rect x="28" y="508" width="664" height="107" rx="10" fill="#edf3f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="546" font-size="29" fill="#21699a" text-anchor="start">1913</text><text x="155" y="546" font-size="24" fill="#18364b" text-anchor="start">莫塞莱的工作推动原子序数认识</text><text x="48" y="590" font-size="22" fill="#18364b" text-anchor="start">元素排序的根本编号，不再只是平均原子量。</text><rect x="28" y="634" width="664" height="107" rx="10" fill="#edf3f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="672" font-size="29" fill="#21699a" text-anchor="start">1923</text><text x="155" y="672" font-size="24" fill="#18364b" text-anchor="start">德明《普通化学》采用长表</text><text x="48" y="716" font-size="22" fill="#18364b" text-anchor="start">教材、仪器供应商与挂图，帮助这种画法传播。</text><rect x="28" y="760" width="664" height="107" rx="10" fill="#edf3f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="798" font-size="29" fill="#21699a" text-anchor="start">1988</text><text x="155" y="798" font-size="24" fill="#18364b" text-anchor="start">IUPAC推荐族号 1—18</text><text x="48" y="842" font-size="22" fill="#18364b" text-anchor="start">统一编号，不等于宣布唯一合法的图形。</text><text x="28" y="940" font-size="23" fill="#18364b" text-anchor="start">这是关键节点选读，不是周期表发展的完整名单。</text></svg>
