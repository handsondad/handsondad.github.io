<svg xmlns="http://www.w3.org/2000/svg" width="547.2" height="744.8" viewBox="0 0 547.2 744.8" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">一张表，是怎样被许多人慢慢改出来的？</title><desc id="desc">1869门捷列夫早期周期体系，1871修订与预言，1905维尔纳展开式，1913莫塞莱原子序数工作，1923德明教材长表，1988IUPAC推荐1至18族编号。并非完整发明史，也不暗示所有版本单线继承。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#21699a" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="545.7" height="743.3" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.76)"><text x="28" y="43.42" font-size="20.8" fill="#18364b" text-anchor="start" font-weight="700">一张表，是怎样被许多人慢慢改出来的？</text><text x="28" y="90.39" font-size="18.2" fill="#18364b" text-anchor="start">读成多人的接力，不是两国各自发明一张表。</text><rect x="28" y="130" width="664" height="107" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="165.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1869</text><text x="155" y="166.39" font-size="18.2" fill="#18364b" text-anchor="start">门捷列夫发表早期周期体系</text><text x="48" y="210.52" font-size="16.7" fill="#18364b" text-anchor="start">按原子量与化学性质组织，尚不知道现代原子结构。</text><rect x="28" y="256" width="664" height="107" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="291.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1871</text><text x="155" y="292.39" font-size="18.2" fill="#18364b" text-anchor="start">表格继续修订，并为未知元素留位</text><text x="48" y="336.52" font-size="16.7" fill="#18364b" text-anchor="start">不是一张排好后永不修改的八列表。</text><rect x="28" y="382" width="664" height="107" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="417.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1905</text><text x="155" y="418.39" font-size="18.2" fill="#18364b" text-anchor="start">维尔纳提出展开式排列</text><text x="48" y="462.52" font-size="16.7" fill="#18364b" text-anchor="start">已像现代长表，但包含后来被纠正的位置与数量。</text><rect x="28" y="508" width="664" height="107" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="543.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1913</text><text x="155" y="544.39" font-size="18.2" fill="#18364b" text-anchor="start">莫塞莱的工作推动原子序数认识</text><text x="48" y="588.52" font-size="16.7" fill="#18364b" text-anchor="start">元素排序的根本编号，不再只是平均原子量。</text><rect x="28" y="634" width="664" height="107" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="669.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1923</text><text x="155" y="670.39" font-size="18.2" fill="#18364b" text-anchor="start">德明《普通化学》采用长表</text><text x="48" y="714.52" font-size="16.7" fill="#18364b" text-anchor="start">教材、仪器供应商与挂图，帮助这种画法传播。</text><rect x="28" y="760" width="664" height="107" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="795.56" font-size="20.3" fill="#21699a" text-anchor="start" font-weight="700">1988</text><text x="155" y="796.39" font-size="18.2" fill="#18364b" text-anchor="start">IUPAC推荐族号 1—18</text><text x="48" y="840.52" font-size="16.7" fill="#18364b" text-anchor="start">统一编号，不等于宣布唯一合法的图形。</text><text x="28" y="938.45" font-size="17.5" fill="#18364b" text-anchor="start">这是关键节点选读，不是周期表发展的完整名单。</text></g></svg>
