<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 995" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">长表的宽度，不是排版师随便拉出来的</title><desc id="desc">s、p、d、f亚层分别有1、3、5、7个轨道，每轨道最多2电子，得到2、6、10、14的容量。第四周期4s、3d、4p的区块宽度为2加10加6等于18。框和箭头只是量子态记号，不是经典运动轨道。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#21699a" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="995" rx="16" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">长表的宽度，不是排版师随便拉出来的</text><text x="28" y="92" font-size="22" fill="#18364b" text-anchor="start">每个方框代表一个轨道，每个轨道至多容纳 2 电子。</text><rect x="28" y="128" width="664" height="112" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="50" y="171" font-size="27" fill="#18364b" text-anchor="start">s 亚层</text><text x="660" y="171" font-size="26" fill="#18364b" text-anchor="end">1 × 2 = 2</text><rect x="52" y="186" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="84" y="214" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="28" y="258" width="664" height="112" rx="10" fill="#faeedb" stroke="#adc2d1" stroke-width="2"/><text x="50" y="301" font-size="27" fill="#18364b" text-anchor="start">p 亚层</text><text x="660" y="301" font-size="26" fill="#18364b" text-anchor="end">3 × 2 = 6</text><rect x="52" y="316" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="84" y="344" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="136" y="316" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="168" y="344" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="220" y="316" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="252" y="344" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="28" y="388" width="664" height="112" rx="10" fill="#e2edf9" stroke="#adc2d1" stroke-width="2"/><text x="50" y="431" font-size="27" fill="#18364b" text-anchor="start">d 亚层</text><text x="660" y="431" font-size="26" fill="#18364b" text-anchor="end">5 × 2 = 10</text><rect x="52" y="446" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="84" y="474" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="136" y="446" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="168" y="474" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="220" y="446" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="252" y="474" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="304" y="446" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="336" y="474" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="388" y="446" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="420" y="474" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="28" y="518" width="664" height="112" rx="10" fill="#eee6f5" stroke="#adc2d1" stroke-width="2"/><text x="50" y="561" font-size="27" fill="#18364b" text-anchor="start">f 亚层</text><text x="660" y="561" font-size="26" fill="#18364b" text-anchor="end">7 × 2 = 14</text><rect x="52" y="576" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="84" y="604" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="136" y="576" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="168" y="604" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="220" y="576" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="252" y="604" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="304" y="576" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="336" y="604" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="388" y="576" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="420" y="604" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="472" y="576" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="504" y="604" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><rect x="556" y="576" width="65" height="40" rx="3" fill="#fff" stroke="#adc2d1" stroke-width="2"/><text x="588" y="604" font-size="24" fill="#18364b" text-anchor="middle">↑↓</text><text x="28" y="702" font-size="28" fill="#18364b" text-anchor="start">第四周期的区块宽度</text><rect x="36" y="736" width="72" height="75" rx="0" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="72.0" y="782" font-size="24" fill="#18364b" text-anchor="middle">4s：2</text><rect x="108" y="736" width="360" height="75" rx="0" fill="#e2edf9" stroke="#adc2d1" stroke-width="2"/><text x="288.0" y="782" font-size="24" fill="#18364b" text-anchor="middle">3d：10</text><rect x="468" y="736" width="216" height="75" rx="0" fill="#faeedb" stroke="#adc2d1" stroke-width="2"/><text x="576.0" y="782" font-size="24" fill="#18364b" text-anchor="middle">4p：6</text><text x="28" y="862" font-size="24" fill="#18364b" text-anchor="start">2 + 10 + 6 = 18；更长周期还涉及 14 格的 f 区。</text><text x="28" y="910" font-size="24" fill="#18364b" text-anchor="start">框图不是电子轨道照片；填充次序有例外。</text><text x="28" y="952" font-size="22" fill="#18364b" text-anchor="start">氦排在第18族，却是 1s²；位置也要照顾化学性质。</text></svg>
