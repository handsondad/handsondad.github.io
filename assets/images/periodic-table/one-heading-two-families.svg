<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 855" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">钾和铜：旧表的“同楼”，不是同一家</title><desc id="desc">短表旧第I大族可以同时容纳碱金属和铜族，现代分别列为1族和11族。K2O和Cu2O都体现+1氧化态，但铜还有+2等化学状态。K与Cu中性原子的基态电子排布并不相同。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#21699a" stroke-width="2"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect width="720" height="855" rx="16" fill="#fafcfe"/><text x="28" y="46" font-size="30" fill="#18364b" text-anchor="start">钾和铜：旧表的“同楼”，不是同一家</text><text x="28" y="92" font-size="24" fill="#18364b" text-anchor="start">短表的 I 大族，包含两支不相同的家族。</text><rect x="28" y="125" width="664" height="130" rx="10" fill="#edf3f8" stroke="#adc2d1" stroke-width="2"/><text x="48" y="169" font-size="28" fill="#18364b" text-anchor="start">同一旧标题：I</text><text x="48" y="219" font-size="28" fill="#18364b" text-anchor="start">K（钾）　　　　　　　　　Cu（铜）</text><path d="M210 265V312H165V340" fill="none" stroke="#21699a" stroke-width="3" marker-end="url(#arrow)"/><path class="trace" d="M210 265V312H165V340" pathLength="1" fill="none" stroke="#cf850e" stroke-width="5" style="animation-delay:0s"/><path d="M510 265V312H555V340" fill="none" stroke="#21699a" stroke-width="3" marker-end="url(#arrow)"/><path class="trace" d="M510 265V312H555V340" pathLength="1" fill="none" stroke="#cf850e" stroke-width="5" style="animation-delay:1s"/><rect x="28" y="350" width="320" height="270" rx="10" fill="#e4f2e9" stroke="#adc2d1" stroke-width="2"/><text x="188" y="398" font-size="28" fill="#18364b" text-anchor="middle">现代第 1 族</text><text x="188" y="451" font-size="27" fill="#18364b" text-anchor="middle">Li　Na　K</text><text x="188" y="502" font-size="25" fill="#18364b" text-anchor="middle">[Ar] 4s¹</text><text x="188" y="566" font-size="24" fill="#18364b" text-anchor="middle">K₂O：钾为 +1</text><rect x="372" y="350" width="320" height="270" rx="10" fill="#e2edf9" stroke="#adc2d1" stroke-width="2"/><text x="532" y="398" font-size="28" fill="#18364b" text-anchor="middle">现代第 11 族</text><text x="532" y="451" font-size="27" fill="#18364b" text-anchor="middle">Cu　Ag　Au</text><text x="532" y="502" font-size="25" fill="#18364b" text-anchor="middle">[Ar] 3d¹⁰ 4s¹</text><text x="532" y="566" font-size="24" fill="#18364b" text-anchor="middle">Cu₂O：铜为 +1</text><text x="28" y="670" font-size="24" fill="#18364b" text-anchor="start">同有“+1”这条线索，不等于化学性质全都相同。</text><text x="28" y="717" font-size="23" fill="#18364b" text-anchor="start">铜还能形成 CuO（+2）；不能照抄碱金属的性格。</text><text x="28" y="764" font-size="23" fill="#18364b" text-anchor="start">电子式分别取中性钾、铜基态；[Ar]表示氩核芯。</text><text x="28" y="811" font-size="23" fill="#18364b" text-anchor="start">A/B 旧标号有不同传统，本文优先写现代族号。</text></svg>
