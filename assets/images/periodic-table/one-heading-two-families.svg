<svg xmlns="http://www.w3.org/2000/svg" width="547.2" height="649.8" viewBox="0 0 547.2 649.8" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">钾和铜：旧表的“同楼”，不是同一家</title><desc id="desc">短表旧第I大族可以同时容纳碱金属和铜族，现代分别列为1族和11族。K2O和Cu2O都体现+1氧化态，但铜还有+2等化学状态。K与Cu中性原子的基态电子排布并不相同。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#21699a" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="545.7" height="648.3" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.76)"><text x="28" y="43.42" font-size="20.8" fill="#18364b" text-anchor="start" font-weight="700">钾和铜：旧表的“同楼”，不是同一家</text><text x="28" y="90.39" font-size="18.2" fill="#18364b" text-anchor="start">短表的 I 大族，包含两支不相同的家族。</text><rect x="28" y="125" width="664" height="130" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="166.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">同一旧标题：I</text><text x="48" y="216.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">K（钾）　　　　　　　　　Cu（铜）</text><path d="M210 265V312H165V340" fill="none" stroke="#21699a" stroke-width="2.4" marker-end="url(#arrow)"/><path class="trace" d="M210 265V312H165V340" pathLength="1" fill="none" stroke="#cf850e" stroke-width="3.6" style="animation-delay:0s"/><path d="M510 265V312H555V340" fill="none" stroke="#21699a" stroke-width="2.4" marker-end="url(#arrow)"/><path class="trace" d="M510 265V312H555V340" pathLength="1" fill="none" stroke="#cf850e" stroke-width="3.6" style="animation-delay:1s"/><rect x="28" y="350" width="320" height="270" rx="10" fill="#e4f2e9" stroke="#cbd5e1" stroke-width="1.5"/><text x="188" y="395.65" font-size="19.6" fill="#18364b" text-anchor="middle" font-weight="700">现代第 1 族</text><text x="188" y="448.96" font-size="19.7" fill="#18364b" text-anchor="middle" font-weight="600">Li　Na　K</text><text x="188" y="500.32" font-size="19.0" fill="#18364b" text-anchor="middle">[Ar] 4s¹</text><text x="188" y="564.39" font-size="18.2" fill="#18364b" text-anchor="middle">K₂O：钾为 +1</text><rect x="372" y="350" width="320" height="270" rx="10" fill="#e2edf9" stroke="#cbd5e1" stroke-width="1.5"/><text x="532" y="395.65" font-size="19.6" fill="#18364b" text-anchor="middle" font-weight="700">现代第 11 族</text><text x="532" y="448.96" font-size="19.7" fill="#18364b" text-anchor="middle" font-weight="600">Cu　Ag　Au</text><text x="532" y="500.32" font-size="19.0" fill="#18364b" text-anchor="middle">[Ar] 3d¹⁰ 4s¹</text><text x="532" y="564.39" font-size="18.2" fill="#18364b" text-anchor="middle">Cu₂O：铜为 +1</text><text x="28" y="668.39" font-size="18.2" fill="#18364b" text-anchor="start">同有“+1”这条线索，不等于化学性质全都相同。</text><text x="28" y="715.45" font-size="17.5" fill="#18364b" text-anchor="start">铜还能形成 CuO（+2）；不能照抄碱金属的性格。</text><text x="28" y="762.45" font-size="17.5" fill="#18364b" text-anchor="start">电子式分别取中性钾、铜基态；[Ar]表示氩核芯。</text><text x="28" y="809.45" font-size="17.5" fill="#18364b" text-anchor="start">A/B 旧标号有不同传统，本文优先写现代族号。</text></g></svg>
