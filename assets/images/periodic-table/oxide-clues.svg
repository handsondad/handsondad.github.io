<svg xmlns="http://www.w3.org/2000/svg" width="547.2" height="684" viewBox="0 0 547.2 684" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">还看不见原子，也能找到元素的“亲戚”</title><desc id="desc">以钠镁铝硅磷硫氯的若干氧化物展示旧I至VII族所利用的化学计量联系。每行核对元素氧化数与氧的负二价总和为零，磷化合物标明经验式。不是每个族每个元素都适用的最高氧化态规则。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L10 6L1 11" fill="none" stroke="#21699a" stroke-width="1.8"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.trace{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1s linear 1 both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none}}</style><rect x="0.75" y="0.75" width="545.7" height="682.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.76)"><text x="28" y="43.42" font-size="20.8" fill="#18364b" text-anchor="start" font-weight="700">还看不见原子，也能找到元素的“亲戚”</text><text x="28" y="90.45" font-size="17.5" fill="#18364b" text-anchor="start">一条历史线索：一些氧化物，能排出化学计量阶梯。</text><rect x="28" y="127" width="664" height="68" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="55" y="169.32" font-size="19.0" fill="#18364b" text-anchor="start">I</text><text x="173" y="168.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">Na₂O</text><text x="455" y="169.32" font-size="19.0" fill="#18364b" text-anchor="start">元素为 +1</text><rect x="28" y="204" width="664" height="68" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="55" y="246.32" font-size="19.0" fill="#18364b" text-anchor="start">II</text><text x="173" y="245.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">MgO</text><text x="455" y="246.32" font-size="19.0" fill="#18364b" text-anchor="start">元素为 +2</text><rect x="28" y="281" width="664" height="68" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="55" y="323.32" font-size="19.0" fill="#18364b" text-anchor="start">III</text><text x="173" y="322.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">Al₂O₃</text><text x="455" y="323.32" font-size="19.0" fill="#18364b" text-anchor="start">元素为 +3</text><rect x="28" y="358" width="664" height="68" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="55" y="400.32" font-size="19.0" fill="#18364b" text-anchor="start">IV</text><text x="173" y="399.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">SiO₂</text><text x="455" y="400.32" font-size="19.0" fill="#18364b" text-anchor="start">元素为 +4</text><rect x="28" y="435" width="664" height="68" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="55" y="477.32" font-size="19.0" fill="#18364b" text-anchor="start">V</text><text x="173" y="476.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">P₂O₅*</text><text x="455" y="477.32" font-size="19.0" fill="#18364b" text-anchor="start">元素为 +5</text><rect x="28" y="512" width="664" height="68" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="55" y="554.32" font-size="19.0" fill="#18364b" text-anchor="start">VI</text><text x="173" y="553.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">SO₃</text><text x="455" y="554.32" font-size="19.0" fill="#18364b" text-anchor="start">元素为 +6</text><rect x="28" y="589" width="664" height="68" rx="10" fill="#edf3f8" stroke="#cbd5e1" stroke-width="1.5"/><text x="55" y="631.32" font-size="19.0" fill="#18364b" text-anchor="start">VII</text><text x="173" y="630.65" font-size="19.6" fill="#18364b" text-anchor="start" font-weight="700">Cl₂O₇</text><text x="455" y="631.32" font-size="19.0" fill="#18364b" text-anchor="start">元素为 +7</text><text x="28" y="718.32" font-size="19.0" fill="#21699a" text-anchor="start">氧按 −2 记：2 × (+3) + 3 × (−2) = 0</text><text x="28" y="766.45" font-size="17.5" fill="#18364b" text-anchor="start">例如 Al₂O₃：氧化数之和配平，不是原子排队图。</text><text x="28" y="813.52" font-size="16.7" fill="#18364b" text-anchor="start">* P₂O₅是常用经验式；常见分子形式写作 P₄O₁₀。</text><text x="28" y="857.45" font-size="17.5" fill="#18364b" text-anchor="start">只选示例：氧、氟等有例外，不能套成万能口诀。</text></g></svg>
