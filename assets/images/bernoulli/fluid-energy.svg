<svg xmlns="http://www.w3.org/2000/svg" width="720" height="945" viewBox="0 0 720 945" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">水平水管的流量守恒与伯努利能量核对</title>
<desc id="desc">截面积二平方厘米、速度每秒一米，与截面积一平方厘米、速度每秒二米的流量相同。在图注所述理想条件下，压力从一百千帕降到九十八点五千帕，两侧压力加动能密度均为十万零五百帕。管形不按实际截面比例绘制。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="720" height="945" fill="#f3f7fa"/>
<text x="36" y="48" font-size="32" fill="#172b45" text-anchor="start">水变快了，能量从哪里来？</text>
<text x="36" y="86" font-size="24" fill="#41576a" text-anchor="start">水密度 1000 kg/m³；以下数值为教学构造。</text>
<rect x="24" y="115" width="672" height="162" rx="16" fill="#fff" stroke="#c9d6df"/>
<text x="44" y="156" font-size="28" fill="#172b45" text-anchor="start">① 先核对：每秒进出的水一样多</text>
<text x="44" y="201" font-size="26" fill="#172b45" text-anchor="start">2 cm² × 1 m/s = 1 cm² × 2 m/s</text>
<text x="44" y="244" font-size="26" fill="#176786" text-anchor="start">两边流量都是 0.2 L/s。</text>
<text x="36" y="318" font-size="28" fill="#172b45" text-anchor="start">② 截面变小，水流加快（管形示意）</text>
<path d="M70 355H290L460 380H650V480H460L290 505H70" fill="#e1f0f5" stroke="#176786" stroke-width="4"/>
<path d="M110 430H260M495 430H615" stroke="#ad4f16" stroke-width="5"/>
<path d="M260 430L244 421V439ZM615 430L599 421V439Z" fill="#ad4f16"/>
<text x="200" y="547" font-size="26" fill="#172b45" text-anchor="middle">截面①：2 cm²</text>
<text x="525" y="547" font-size="26" fill="#172b45" text-anchor="middle">截面②：1 cm²</text>
<text x="200" y="589" font-size="26" fill="#176786" text-anchor="middle">速度：1 m/s</text>
<text x="525" y="589" font-size="26" fill="#176786" text-anchor="middle">速度：2 m/s</text>
<text x="200" y="631" font-size="26" fill="#ad4f16" text-anchor="middle">压力：100 kPa</text>
<text x="525" y="631" font-size="26" fill="#ad4f16" text-anchor="middle">压力：98.5 kPa</text>
<rect x="24" y="662" width="672" height="206" rx="16" fill="#fff" stroke="#c9d6df"/>
<text x="44" y="704" font-size="28" fill="#172b45" text-anchor="start">③ 核对：压力 + 动能密度</text>
<text x="44" y="748" font-size="26" fill="#172b45" text-anchor="start">①侧：100000 + 500 = 100500 Pa</text>
<text x="44" y="792" font-size="26" fill="#172b45" text-anchor="start">②侧：98500 + 2000 = 100500 Pa</text>
<text x="44" y="836" font-size="26" fill="#176786" text-anchor="start">动能项多 1500 Pa，压力项少 1500 Pa。</text>
<text x="36" y="910" font-size="23" fill="#41576a" text-anchor="start">水平、稳态、不可压缩、无损耗；同一流线、无外加功。</text>
</svg>
