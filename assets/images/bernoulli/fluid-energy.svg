<svg xmlns="http://www.w3.org/2000/svg" width="540" height="708.75" viewBox="0 0 540 708.75" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">水平水管的流量守恒与伯努利能量核对</title>
<desc id="desc">截面积二平方厘米、速度每秒一米，与截面积一平方厘米、速度每秒二米的流量相同。在图注所述理想条件下，压力从一百千帕降到九十八点五千帕，两侧压力加动能密度均为十万零五百帕。管形不按实际截面比例绘制。</desc>
<style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect x="0.75" y="0.75" width="538.5" height="707.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/>
<g transform="scale(0.75)">
<text x="36" y="44.98" font-size="21.2" fill="#172b45" text-anchor="start" font-weight="700">水变快了，能量从哪里来？</text>
<text x="36" y="84.39" font-size="18.2" fill="#41576a" text-anchor="start">水密度 1000 kg/m³；以下数值为教学构造。</text>
<rect x="24" y="115" width="672" height="162" rx="16" fill="#fff" stroke="#c9d6df"/>
<text x="44" y="153.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">① 先核对：每秒进出的水一样多</text>
<text x="44" y="199.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">2 cm² × 1 m/s = 1 cm² × 2 m/s</text>
<text x="44" y="242.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">两边流量都是 0.2 L/s。</text>
<text x="36" y="315.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">② 截面变小，水流加快（管形示意）</text>
<path d="M70 355H290L460 380H650V480H460L290 505H70" fill="#e1f0f5" stroke="#176786" stroke-width="4"/>
<path d="M110 430H260M495 430H615" stroke="#ad4f16" stroke-width="5"/>
<path d="M260 430L244 421V439ZM615 430L599 421V439Z" fill="#ad4f16"/>
<text x="200" y="545.11" font-size="19.2" fill="#172b45" text-anchor="middle" font-weight="600">截面①：2 cm²</text>
<text x="525" y="545.11" font-size="19.2" fill="#172b45" text-anchor="middle" font-weight="600">截面②：1 cm²</text>
<text x="200" y="587.11" font-size="19.2" fill="#176786" text-anchor="middle" font-weight="600">速度：1 m/s</text>
<text x="525" y="587.11" font-size="19.2" fill="#176786" text-anchor="middle" font-weight="600">速度：2 m/s</text>
<text x="200" y="629.11" font-size="19.2" fill="#ad4f16" text-anchor="middle" font-weight="600">压力：100 kPa</text>
<text x="525" y="629.11" font-size="19.2" fill="#ad4f16" text-anchor="middle" font-weight="600">压力：98.5 kPa</text>
<rect x="24" y="662" width="672" height="206" rx="16" fill="#fff" stroke="#c9d6df"/>
<text x="44" y="701.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">③ 核对：压力 + 动能密度</text>
<text x="44" y="746.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">①侧：100000 + 500 = 100500 Pa</text>
<text x="44" y="790.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">②侧：98500 + 2000 = 100500 Pa</text>
<text x="44" y="834.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">动能项多 1500 Pa，压力项少 1500 Pa。</text>
<text x="36" y="908.45" font-size="17.5" fill="#41576a" text-anchor="start">水平、稳态、不可压缩、无损耗；同一流线、无外加功。</text>
</g>
</svg>
