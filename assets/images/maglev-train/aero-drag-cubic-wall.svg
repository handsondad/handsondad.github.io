<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">磁悬浮列车气动阻力功率随速度立方增长曲线与万米高空空气密度对比图</title>
<desc id="desc">左图绘制0至600km/h下海平面气动功率(红实线)、11公里平流层同速气动功率(蓝虚线)与轮轨机械摩擦功率(灰点线)，标明600km/h气动功率(6.9MW)是350km/h(1.4MW)的5.04倍；右图解析高能耗、隧道音爆迫使L0系采用15米长鼻锥及飞机借稀薄大气降阻三大工程推论。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="447" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">反直觉真相：浮起来消除了车轮摩擦，为什么跑 600 km/h 反而成了“吞电巨兽”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">时速过 300 km/h 后 85% 以上阻力来自稠密空气！克服风阻所需功率按速度的立方 (P ∝ v³) 爆炸式增长</text>
<rect x="20" y="62" width="418" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="34" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 速度–功率残酷曲线：地面风阻功率 P = ½ρ·Cd·A·v³</text>
<text x="34" y="104" font-size="9.3" fill="#64748b" text-anchor="start" font-weight="600">牵引克服阻力功率 (MW，同尺寸列车模型)</text>
<line x1="74.0" y1="368.0" x2="414.0" y2="368.0" stroke="#cbd5e1" stroke-width="0.9"/>
<text x="67.0" y="371.5" font-size="9.0" fill="#64748b" text-anchor="end">0</text>
<line x1="74.0" y1="307.0" x2="414.0" y2="307.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="67.0" y="310.5" font-size="9.0" fill="#64748b" text-anchor="end">4</text>
<line x1="74.0" y1="246.0" x2="414.0" y2="246.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="67.0" y="249.5" font-size="9.0" fill="#64748b" text-anchor="end">8</text>
<line x1="74.0" y1="185.0" x2="414.0" y2="185.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="67.0" y="188.5" font-size="9.0" fill="#64748b" text-anchor="end">12</text>
<line x1="74.0" y1="124.0" x2="414.0" y2="124.0" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="67.0" y="127.5" font-size="9.0" fill="#64748b" text-anchor="end">16</text>
<line x1="74.0" y1="368.0" x2="74.0" y2="372.0" stroke="#475569" stroke-width="1.1"/>
<text x="74.0" y="385.0" font-size="9.0" fill="#64748b" text-anchor="middle">0</text>
<line x1="183.7" y1="368.0" x2="183.7" y2="372.0" stroke="#475569" stroke-width="1.1"/>
<text x="183.7" y="385.0" font-size="9.0" fill="#64748b" text-anchor="middle">200</text>
<line x1="265.9" y1="368.0" x2="265.9" y2="372.0" stroke="#475569" stroke-width="1.1"/>
<text x="265.9" y="385.0" font-size="9.0" fill="#64748b" text-anchor="middle">350</text>
<line x1="348.2" y1="368.0" x2="348.2" y2="372.0" stroke="#475569" stroke-width="1.1"/>
<text x="348.2" y="385.0" font-size="9.0" fill="#64748b" text-anchor="middle">500</text>
<line x1="403.0" y1="368.0" x2="403.0" y2="372.0" stroke="#475569" stroke-width="1.1"/>
<text x="403.0" y="385.0" font-size="9.0" fill="#64748b" text-anchor="middle">600</text>
<text x="244.0" y="406" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">运行速度 v (km/h)</text>
<line x1="74.0" y1="124.0" x2="74.0" y2="368.0" stroke="#475569" stroke-width="1.3"/>
<line x1="74.0" y1="368.0" x2="414.0" y2="368.0" stroke="#475569" stroke-width="1.3"/>
<path d="M 74.0,368.0 L 87.7,368.0 L 101.4,367.9 L 115.1,367.8 L 128.8,367.5 L 142.5,367.1 L 156.3,366.4 L 170.0,365.4 L 183.7,364.1 L 197.4,362.5 L 211.1,360.4 L 224.8,357.9 L 238.5,354.9 L 252.2,351.4 L 265.9,347.2 L 279.6,342.5 L 293.4,337.0 L 307.1,330.8 L 320.8,323.9 L 334.5,316.1 L 348.2,307.4 L 361.9,297.9 L 375.6,287.4 L 389.3,275.9 L 403.0,263.4" fill="none" stroke="#dc2626" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
