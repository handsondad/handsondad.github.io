<circle cx="265.9" cy="347.2" r="4" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<circle cx="403.0" cy="263.4" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
<line x1="265.9" y1="347.2" x2="265.9" y2="368.0" stroke="#dc2626" stroke-width="1.0" stroke-dasharray="2,2"/>
<line x1="403.0" y1="263.4" x2="403.0" y2="368.0" stroke="#dc2626" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="259.9" y="337.2" font-size="9.0" fill="#0f172a" text-anchor="end" font-weight="700">350 km/h 基准 (1.4 MW)</text>
<text x="395.0" y="267.4" font-size="9.2" fill="#dc2626" text-anchor="end" font-weight="700">600 km/h 风阻功率暴涨 5.04 倍! (6.9 MW)</text>
<text x="337.2" y="343.1" font-size="8.9" fill="#1d6fa5" text-anchor="middle" font-weight="700">若在万米高空 (空气密度仅地面 30%)</text>
<text x="216.6" y="372.2" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="600">轮轨机械摩擦功率 (占比很小)</text>
<rect x="450" y="62" width="290" height="372" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="464" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 这堵“空气墙”逼出了三大后果</text>
<rect x="464" y="100" width="262" height="98" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="476" y="120" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="700">1. 省了轮轨摩擦，却撞上立方级风阻</text>
<text x="476" y="140" font-size="9.2" fill="#1e293b" text-anchor="start">• 从 350 提速到 600 km/h（快 1.71 倍）：</text>
<text x="476" y="158" font-size="9.2" fill="#0f172a" text-anchor="start" font-weight="700">  每公里风阻做功 (∝v²) 涨至 2.94 倍，</text>
<text x="476" y="176" font-size="9.2" fill="#dc2626" text-anchor="start" font-weight="700">  瞬时牵引功率 (∝v³) 暴涨至 5.04 倍！</text>
<rect x="464" y="210" width="262" height="106" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="476" y="230" font-size="9.9" fill="#1d6fa5" text-anchor="start" font-weight="700">2. 隧道微气压波“音爆”与 15 米长鼻子</text>
<text x="476" y="250" font-size="9.1" fill="#1e293b" text-anchor="start">• 列车 500 km/h 扎进隧道像活塞猛推空气，</text>
<text x="476" y="268" font-size="9.1" fill="#1e293b" text-anchor="start">  出口激波 (∝v³) 如炮声震碎门窗！</text>
<text x="476" y="286" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="700">• 日本 L0 系被迫把首车 28 m 中的 15 m 全</text>
<text x="476" y="303" font-size="9.1" fill="#1d6fa5" text-anchor="start" font-weight="700">  做成扁长流线鼻锥（首车仅能坐 24 人）！</text>
<rect x="464" y="328" width="262" height="92" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="476" y="348" font-size="9.9" fill="#6d28d9" text-anchor="start" font-weight="700">3. 为什么飞机飞 850 km/h 反而划算？</text>
<text x="476" y="367" font-size="9.1" fill="#1e293b" text-anchor="start">• 民航客机躲进 11 km 平流层，空气密度只</text>
<text x="476" y="385" font-size="9.1" fill="#1e293b" text-anchor="start">  剩海平面 30%；地面磁浮除非套进抽真空</text>
<text x="476" y="403" font-size="9.1" fill="#6d28d9" text-anchor="start" font-weight="700">  管道，否则永远在最稠密大气层硬扛风阻！</text>
</svg>
