<text x="384.7" y="147.6" font-size="9.0" fill="#18794e" text-anchor="middle" font-weight="700">350 高铁 (市中心直达)</text>
<text x="392.0" y="190.7" font-size="9.0" fill="#c25014" text-anchor="middle" font-weight="700">500 高速磁浮</text>
<text x="399.2" y="226.1" font-size="9.0" fill="#1d6fa5" text-anchor="middle" font-weight="700">850 民航客机 (天空免铺轨!)</text>
<circle cx="117.1" cy="313.5" r="4" fill="#ffffff" stroke="#18794e" stroke-width="2"/>
<circle cx="324.5" cy="226.8" r="4" fill="#ffffff" stroke="#1d6fa5" stroke-width="2"/>
<rect x="468" y="62" width="272" height="376" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="482" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 读懂“两头挤压”与未来突围口</text>
<rect x="482" y="100" width="244" height="102" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="494" y="120" font-size="9.8" fill="#18794e" text-anchor="start" font-weight="700">&lt; 600 km：轮轨高铁越跑越快！</text>
<text x="494" y="139" font-size="9.1" fill="#1e293b" text-anchor="start">• 70 年代磁浮立项时轮轨仅 200 km/h；</text>
<text x="494" y="157" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="700">• 如今复兴号商业 350 km/h（CR450 冲</text>
<text x="494" y="175" font-size="9.1" fill="#1e293b" text-anchor="start">  400 km/h），600 km 内磁浮仅省十来分</text>
<text x="494" y="192" font-size="9.1" fill="#18794e" text-anchor="start" font-weight="700">  钟，远抵不上另起炉灶的万亿造价！</text>
<rect x="482" y="214" width="244" height="96" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="494" y="234" font-size="9.8" fill="#1d6fa5" text-anchor="start" font-weight="700">&gt; 1,400 km：民航客机零基建反超！</text>
<text x="494" y="253" font-size="9.1" fill="#1e293b" text-anchor="start">• 超过 1,400 km 后飞机门到门更快；</text>
<text x="494" y="271" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="700">• 关键在灵活性：两座机场间无需征地</text>
<text x="494" y="289" font-size="9.1" fill="#1d6fa5" text-anchor="start" font-weight="700">  拆迁修一米桥墩，淡旺季随时调航线！</text>
<rect x="482" y="322" width="244" height="102" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="494" y="342" font-size="9.8" fill="#c25014" text-anchor="start" font-weight="700">磁浮真正发光的两大精准赛道：</text>
<text x="494" y="361" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="700">1. 100–160 km/h 城市/景区/机场接驳线：</text>
<text x="494" y="378" font-size="9.0" fill="#1e293b" text-anchor="start">   安静低噪、爬 6% 陡坡、转 75m 急弯；</text>
<text x="494" y="396" font-size="9.0" fill="#0f172a" text-anchor="start" font-weight="700">2. 既有高铁饱和的 800–1,200 km 超级走廊</text>
<text x="494" y="413" font-size="9.0" fill="#c25014" text-anchor="start" font-weight="700">   （如东京—大阪、京沪/沪杭甬远期分流）！</text>
</svg>
