<text x="34" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 门到门总耗时对比：T总 = 市内接驳候车 + 里程 / 旅行均速</text>
<text x="34" y="104" font-size="9.3" fill="#64748b" text-anchor="start" font-weight="600">门到门全程耗时 (小时)</text>
