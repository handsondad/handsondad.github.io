<rect x="0.5" y="0.5" width="759" height="451" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么没有大面积普及（下）：前有 350 高铁、后有 850 飞机，尴尬的“夹心层”！</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">旅客买单的不是“轨道最高表显时速”，而是从家门到目的地办公室的“门到门全程总时间”</text>
