<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">轮轨高铁全国互通网络效应与磁悬浮孤岛效应及百米钢梁柔性道岔对比图</title>
<desc id="desc">左图对比1435毫米标准轨距高铁直通既有老站与全国路网的N平方网络效应，以及磁悬浮物理不兼容导致的郊区换乘孤岛；右图对比传统钢轨拨动16厘米尖轨仅需3至5秒，而高速磁浮必须用液压机整体弯曲70至150米百吨级钢箱梁、耗时15至45秒的工程瓶颈。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="455" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">为什么没有大面积普及（上）：致命的“孤岛效应”与重达百吨的“扳道岔噩梦”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">交通工具的终极竞争力不只看最高时速，更看“能不能一车跑遍全国既有路网”与“枢纽咽喉发车效率”</text>
<rect x="20" y="62" width="354" height="380" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="34" y="85" font-size="13.5" fill="#1d6fa5" text-anchor="start" font-weight="700">① 网络外部性对比：全国一张网 vs 30 公里孤岛</text>
<rect x="34" y="98" width="326" height="154" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="46" y="118" font-size="9.7" fill="#18794e" text-anchor="start" font-weight="700">[互通优势] 轮轨高铁（1,435 mm 标准轨距）：无缝成网！</text>
<line x1="74.0" y1="158.0" x2="206.0" y2="158.0" stroke="#18794e" stroke-width="3.2"/>
<text x="140" y="149" font-size="8.8" fill="#18794e" text-anchor="middle" font-weight="700">新建 350 km/h 高铁正线</text>
<line x1="206.0" y1="158.0" x2="258.0" y2="134.0" stroke="#475569" stroke-width="2.0"/>
<text x="302" y="137" font-size="8.8" fill="#0f172a" text-anchor="middle" font-weight="600">百年市中心老站</text>
<line x1="206.0" y1="158.0" x2="264.0" y2="158.0" stroke="#475569" stroke-width="2.0"/>
<text x="308" y="161" font-size="8.8" fill="#0f172a" text-anchor="middle" font-weight="600">既有普速支线城市</text>
<line x1="206.0" y1="158.0" x2="258.0" y2="182.0" stroke="#475569" stroke-width="2.0"/>
<text x="302" y="185" font-size="8.8" fill="#0f172a" text-anchor="middle" font-weight="600">跨局直通全国网</text>
<circle cx="74" cy="158" r="5" fill="#18794e"/>
<circle cx="206" cy="158" r="5" fill="#18794e"/>
<text x="46" y="208" font-size="9.1" fill="#1e293b" text-anchor="start">• 法国 TGV、德国 ICE、中国复兴号修一段新线，就能立刻开进</text>
<text x="46" y="225" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="700">  既有市中心火车站，全国 4.5 万+ 公里高铁排列组合出上千车次</text>
<text x="46" y="242" font-size="9.1" fill="#18794e" text-anchor="start" font-weight="700">  （梅特卡夫定律：路网价值随连通节点平方 N² 暴涨！）。</text>
<rect x="34" y="264" width="326" height="164" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="46" y="284" font-size="9.7" fill="#dc2626" text-anchor="start" font-weight="700">[孤岛痛点] 磁悬浮轨道（T形抱轨 / U形深槽）：物理绝缘！</text>
<line x1="66.0" y1="320.0" x2="186.0" y2="320.0" stroke="#dc2626" stroke-width="3.4"/>
<text x="126" y="311" font-size="8.8" fill="#dc2626" text-anchor="middle" font-weight="700">浦东机场 ↔ 龙阳路 (8分钟)</text>
<text x="202" y="324" font-size="13.0" fill="#dc2626" text-anchor="middle" font-weight="700">✕</text>
<line x1="218.0" y1="320.0" x2="336.0" y2="320.0" stroke="#475569" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="277" y="311" font-size="8.8" fill="#475569" text-anchor="middle" font-weight="600">进不了虹桥/上海站/全国网</text>
<text x="46" y="350" font-size="9.1" fill="#1e293b" text-anchor="start">• 真实痛点：上海磁浮 30.5 km 只跑 7–8 分钟，但终点停在郊区</text>
<text x="46" y="368" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="700">  龙阳路；旅客拎着大箱子上下楼梯换地铁进市区反倒多耗 20 分钟！</text>
<text x="46" y="386" font-size="9.1" fill="#1e293b" text-anchor="start">• 甚至磁浮内部都互不兼容：上海常导 T 梁、日本超导 U 槽、</text>
<text x="46" y="404" font-size="9.1" fill="#dc2626" text-anchor="start" font-weight="600">  中低速 F 轨各唱各的调，任何新线都得从零重修全套独立王国。</text>
<rect x="386" y="62" width="354" height="380" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="400" y="85" font-size="13.5" fill="#c25014" text-anchor="start" font-weight="700">② 枢纽咽喉死穴：磁浮怎么“扳道岔”换轨？</text>
<rect x="400" y="98" width="326" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="412" y="118" font-size="9.6" fill="#18794e" text-anchor="start" font-weight="700">传统钢轨道岔：拨动两片薄钢尖轨 ≈ 16 cm（仅需 3–5 秒！）</text>
<line x1="424.0" y1="152.0" x2="696.0" y2="152.0" stroke="#475569" stroke-width="2.2"/>
<line x1="424.0" y1="174.0" x2="696.0" y2="174.0" stroke="#475569" stroke-width="2.2"/>
<line x1="510.0" y1="152.0" x2="676.0" y2="128.0" stroke="#18794e" stroke-width="2.2"/>
<line x1="528.0" y1="174.0" x2="694.0" y2="148.0" stroke="#18794e" stroke-width="2.2"/>
<circle cx="516" cy="152" r="4" fill="#18794e"/>
<text x="563" y="198" font-size="9.1" fill="#1e293b" text-anchor="middle">• 结构轻巧紧凑，一座大型高铁站咽喉区可密集排布数十组道岔，</text>
<text x="563" y="216" font-size="9.1" fill="#0f172a" text-anchor="middle" font-weight="700">  支撑每 3–4 分钟追踪发出一列 16 节大编组列车。</text>
<rect x="400" y="250" width="326" height="178" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="412" y="270" font-size="9.5" fill="#c25014" text-anchor="start" font-weight="700">高速磁浮道岔：必须液压硬掰整根百米钢铁巨梁！（15–45 秒）</text>
<rect x="420" y="308" width="92" height="16" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<path d="M 512,308 L 696,308 L 696,324 L 512,324 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
<path d="M 512,308 Q 596,306 692,282 L 696,297 Q 598,321 512,324 Z" fill="#fed7aa" stroke="#c25014" stroke-width="1.8"/>
<line x1="566.0" y1="340.0" x2="566.0" y2="316.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<line x1="622.0" y1="340.0" x2="622.0" y2="316.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<line x1="674.0" y1="340.0" x2="674.0" y2="316.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr-orange)"/>
<text x="620" y="353" font-size="8.9" fill="#dc2626" text-anchor="middle" font-weight="700">多台液压机同步推弯 70–150 m 钢箱梁!</text>
<text x="412" y="376" font-size="9.1" fill="#1e293b" text-anchor="start">• 因为C形臂死死抱住轨道（或嵌在U形深槽里），绝不能有钢轨缺口；</text>
<text x="412" y="394" font-size="9.1" fill="#0f172a" text-anchor="start" font-weight="700">• 高速道岔长逾百米、重达数百吨，掰一次慢且耗能，严苛限制了</text>
<text x="412" y="412" font-size="9.1" fill="#dc2626" text-anchor="start" font-weight="700">  多站台枢纽布置与支线分叉能力！</text>
</svg>
