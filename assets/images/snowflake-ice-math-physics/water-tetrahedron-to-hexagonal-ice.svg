<text x="682.0" y="228" font-size="8.6" fill="#6d28d9" text-anchor="middle" font-weight="700">D₆：6 旋转+6 镜面</text>
<text x="624" y="248" font-size="8.9" fill="#0f172a" text-anchor="middle" font-weight="700">空间群 P6₃/mmc  ｜  |D₆| = 12</text>
<rect x="522" y="262" width="204" height="110" rx="7" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
<text x="532" y="280" font-size="9.1" fill="#6d28d9" text-anchor="start" font-weight="700">晶体学限制定理（为何绝无五角雪花）</text>
<text x="532" y="297" font-size="8.9" fill="#1e293b" text-anchor="start">• 周期平移晶格要求 2cos(2π/n) ∈ Z</text>
<text x="532" y="314" font-size="8.9" fill="#1e293b" text-anchor="start">• 仅 n = 1, 2, 3, 4, 6 有解！</text>
<text x="532" y="331" font-size="8.9" fill="#1e293b" text-anchor="start">• n=5 时 2cos72°≈0.618 非整数被禁；</text>
<text x="532" y="348" font-size="8.9" fill="#1e293b" text-anchor="start">• 草木五瓣花靠生长素螺旋，不受此限。</text>
<rect x="22" y="396" width="716" height="56" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="418" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">千年追问闭环：西汉韩婴《韩诗外传》（约前 135 年）最早点破“凡草木花多五出，雪花独六出”；1611 年开普勒猜想圆球最密六方堆积；</text>
<text x="36" y="438" font-size="9.5" fill="#1d6fa5" text-anchor="start" font-weight="700">1933 年伯纳尔与福勒用 X 射线算出普通冰 Ih 四面体氢键网络——104.5° 水分子正是借三维椅式起伏，在底面投下了永恒的 120° 六角密码！</text>
