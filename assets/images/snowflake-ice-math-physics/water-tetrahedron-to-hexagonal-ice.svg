<text x="530" y="102" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">3</text>
<text x="548" y="102" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">六棱晶胚与 D₆ 群 (12 重对称)</text>
