<text x="380" y="248" font-size="8.9" fill="#4338ca" text-anchor="middle" font-weight="600">深蓝=高氧  浅蓝=低氧 (a ≈ 4.52 Å)</text>
<rect x="278" y="262" width="204" height="110" rx="7" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
<text x="288" y="280" font-size="9.3" fill="#0284c7" text-anchor="start" font-weight="700">三维起伏消掉角度差 + 浮冰奇迹：</text>
<text x="288" y="297" font-size="8.9" fill="#1e293b" text-anchor="start">• 6 个氧一高一低折成“椅式环”，</text>
<text x="288" y="314" font-size="8.9" fill="#1e293b" text-anchor="start">  俯视投影恰好变成严格 120° 正六角！</text>
<text x="288" y="331" font-size="8.9" fill="#1e293b" text-anchor="start">• 中空六角隧道令冰密度仅 0.917 g/cm³</text>
<text x="288" y="348" font-size="8.9" fill="#1e293b" text-anchor="start">  比水轻约 9%，冬天浮在水面护生灵！</text>
<rect x="510" y="76" width="228" height="308" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
