<text x="136" y="248" font-size="9.2" fill="#0f172a" text-anchor="middle" font-weight="700">三维四面体夹角 ≈ 109.47°</text>
<rect x="34" y="262" width="204" height="110" rx="7" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
<text x="44" y="280" font-size="9.4" fill="#dc2626" text-anchor="start" font-weight="700">伯纳尔–鲍林冰规则 (1933–35)：</text>
<text x="44" y="297" font-size="8.9" fill="#1e293b" text-anchor="start">• 水分子不是在平面拿 104.5° 拼图！</text>
<text x="44" y="314" font-size="8.9" fill="#1e293b" text-anchor="start">• 氧原子伸出 2 个 H + 2 对孤对电子，</text>
<text x="44" y="331" font-size="8.9" fill="#1e293b" text-anchor="start">  与 4 个邻居结成正四面体三维网；</text>
<text x="44" y="348" font-size="8.9" fill="#1e293b" text-anchor="start">• 氧间距 O···O ≈ 2.76 Å（二近二远）。</text>
<rect x="266" y="76" width="228" height="308" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="286" cy="98" r="10.5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
