<text x="42" y="102" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">1</text>
<text x="60" y="102" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">单分子 104.5° → 四面体 4 只手</text>
<line x1="136.0" y1="184.0" x2="105.4" y2="141.9" stroke="#1d6fa5" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4 3"/>
