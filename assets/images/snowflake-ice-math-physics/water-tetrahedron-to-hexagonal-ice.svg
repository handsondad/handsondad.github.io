<rect x="0.5" y="0.5" width="759" height="465" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">水分子明明拐着 104.5° 的弯，凭什么拼出严格 120° 的正六角冰晶？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">单分子 104.5° 键角 → 正四面体 4 氢键（109.47°） → 普通六方冰 Ih 椅式六元环俯视投影与 D₆ 对称群</text>
