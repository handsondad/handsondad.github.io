<title id="title">中谷宇吉郎与利布雷希特雪花形态相图三次温度反转及云中六臂同步生长年轮图解</title>
<desc id="desc">左图按热力学精确计算过冷水相对冰面的超额水汽密度拱线，标出0至-32摄氏度内-4、-10、-22摄氏度三次板柱形态反转与-15摄氏度羽毛星晶巅峰区；右图拆解单朵雪花穿越不同温湿云团时六臂同步刻录三层年轮的原因，并解释两朵复杂雪花因湍流路径与10的18次方分子排布而绝难重样。</desc>
