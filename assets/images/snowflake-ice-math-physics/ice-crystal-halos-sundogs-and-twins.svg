<text x="58" y="102" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">六棱冰晶 = 顶角 60° 天然三棱镜（22° 日晕与幻日）</text>
<line x1="92.5" y1="174.8" x2="114.0" y2="137.5" stroke="#475569" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/>
