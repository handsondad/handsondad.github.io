<text x="500" y="138" font-size="9.4" fill="#1d6fa5" text-anchor="start" font-weight="700">① 冠柱晶（Capped Column，“工字车轴晶”）</text>
<text x="500" y="157" font-size="8.8" fill="#1e293b" text-anchor="start">先在 −6°C 云层沿 c 轴长成一段六角短木桩；</text>
<text x="500" y="175" font-size="8.8" fill="#1e293b" text-anchor="start">随后被气流吹进 −15°C 板晶区，柱子上下两头</text>
<text x="500" y="193" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">突然横向疯长两片大六角伞盖，立体感十足！</text>
