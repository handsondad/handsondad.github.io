<rect x="0.5" y="0.5" width="759" height="477" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">高空亿万冰晶变身天然三棱镜：22° 日晕、“三日同辉”幻日与十二出双晶奇观</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：隔面 60° 棱角把折射光精准锁死在 21.84° 极值环 ｜ 右：冠柱晶、30° 旋转孪生十二角雪花与三角板晶</text>
