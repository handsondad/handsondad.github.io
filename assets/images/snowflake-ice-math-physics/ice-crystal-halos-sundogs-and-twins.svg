<text x="500" y="252" font-size="9.4" fill="#6d28d9" text-anchor="start" font-weight="700">② 十二出双晶雪花（1637 笛卡尔首记奇观）</text>
<text x="500" y="271" font-size="8.8" fill="#1e293b" text-anchor="start">绝非推翻六方晶系！而是两颗微小冰晶胚在成核</text>
<text x="500" y="289" font-size="8.8" fill="#1e293b" text-anchor="start">瞬间共轴叠合，且恰好绕 c 轴错开 30° 晶格匹配</text>
<text x="500" y="307" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">角（旋转孪晶），6 + 6 同步长出 12 根对称枝！</text>
<rect x="416" y="346" width="310" height="104" rx="7" fill="#fef1e8" stroke="#fdba74" stroke-width="1"/>
