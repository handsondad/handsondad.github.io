<text x="324.0" y="158.0" font-size="8.0" fill="#bfdbfe" text-anchor="middle" font-weight="700">22° 日晕</text>
<text x="324.0" y="213.0" font-size="7.6" fill="#94a3b8" text-anchor="middle">圈内偏暗</text>
<text x="324.0" y="260" font-size="8.4" fill="#c25014" text-anchor="middle" font-weight="700">天幕实景：日晕 + 双幻日</text>
<rect x="34" y="296" width="344" height="156" rx="7" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
<text x="44" y="315" font-size="9.2" fill="#0284c7" text-anchor="start" font-weight="700">极值聚光公式：δ_min = 2 arcsin(n · sin 30°) − 60° = 21.84°</text>
<text x="44" y="334" font-size="8.8" fill="#1e293b" text-anchor="start">• 为什么亮成锐利圆环？光线无法折进 &lt;21.8°（晕圈内侧天空偏暗），</text>
<text x="44" y="352" font-size="8.8" fill="#1e293b" text-anchor="start">  而在极值角 dδ/dθ₁ = 0 处海量光线扎堆汇聚，亮度陡增！</text>
<text x="44" y="370" font-size="8.8" fill="#dc2626" text-anchor="start" font-weight="600">• 为什么内红外蓝（和彩虹相反）？红光 n=1.306 折得少居内圈！</text>
<text x="44" y="388" font-size="8.8" fill="#1e293b" text-anchor="start">• 【22° 日晕】= 柱晶空中随机乱翻滚，360° 全方位折出光环；</text>
<text x="44" y="406" font-size="8.8" fill="#1e293b" text-anchor="start">• 【双幻日】= 直径 &gt;0.1 mm 六角板晶受空气阻力像落叶水平飘浮，</text>
<text x="44" y="424" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">  只在太阳同高度左右两侧 ≥22° 处射出两团耀眼“假太阳”！</text>
<rect x="404" y="76" width="334" height="388" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="422" cy="98" r="10.5" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
<text x="422" y="102" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="700">2</text>
<text x="440" y="102" font-size="10.6" fill="#0f172a" text-anchor="start" font-weight="700">不止平面六角星：三大真实奇异冰晶解密</text>
