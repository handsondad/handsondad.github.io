<text x="500" y="366" font-size="9.4" fill="#c25014" text-anchor="start" font-weight="700">③ “假三角”板晶（内角依然严格 120°！）</text>
<text x="500" y="385" font-size="8.8" fill="#1e293b" text-anchor="start">近 −2°C 或 −14°C 下落时，迎风尾流让其中相隔的</text>
<text x="500" y="403" font-size="8.8" fill="#1e293b" text-anchor="start">3 条边水汽更足并借分子台阶桥接加速推进，把另</text>
<text x="500" y="421" font-size="8.8" fill="#0f172a" text-anchor="start" font-weight="600">3 条边挤短成切角正三角形——骨子里仍是六方冰！</text>
