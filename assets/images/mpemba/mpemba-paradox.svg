    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="589" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">问题的核心：热水必须“追上并超过”冷水，才可能先结冰</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">下面两条曲线是同一冷却模型的示意，不是实验数据；先看哪里需要额外机制。</text>
<rect x="20" y="66" width="352" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="38" cy="89" r="10.5" fill="#f1f5f9" stroke="#475569" stroke-width="1.2"/>
<text x="38" y="93" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="700">1</text>
<text x="56" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">常识模型：同一条降温规律</text>
<rect x="44" y="118" width="300" height="226" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<line x1="44.0" y1="344.0" x2="344.0" y2="344.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
