<text x="506.1" y="254.0" font-size="10.5" fill="#b42318" text-anchor="start" font-weight="700">交叉点</text>
<text x="408" y="366" font-size="10.5" fill="#475569" text-anchor="start">要交叉，热水必须多一条散热通道：</text>
<rect x="408.0" y="380.0" width="150" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="483.0" y="395.0" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="600">蒸发带走质量与热量</text>
<rect x="408.0" y="408.0" width="132" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="474.0" y="423.0" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">对流改变传热路径</text>
<rect x="408.0" y="436.0" width="132" height="22" rx="11.0" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
<text x="474.0" y="451.0" font-size="10.5" fill="#6d28d9" text-anchor="middle" font-weight="600">成核时间被改写</text>
<rect x="20" y="500" width="720" height="78" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="526" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">先定义再争论：是“先降到 0°C”，还是“先出现第一粒冰”，还是“完全冻成冰块”？</text>
<text x="38" y="554" font-size="10.5" fill="#475569" text-anchor="start">2016 年的综述指出，文献里这三件事经常混用——相当一部分争吵其实不在同一个赛道上。</text>
</svg>
