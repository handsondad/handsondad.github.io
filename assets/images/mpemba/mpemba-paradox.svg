<text x="408" y="112" font-size="10.5" fill="#64748b" text-anchor="end">温度</text>
<line x1="412.0" y1="306.3" x2="712.0" y2="306.3" stroke="#c25014" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
