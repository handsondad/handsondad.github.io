<circle cx="156.1" cy="306.3" r="3.5" fill="#1d6fa5" stroke="#ffffff" stroke-width="1"/>
<circle cx="312.8" cy="306.3" r="3.5" fill="#c25014" stroke="#ffffff" stroke-width="1"/>
<text x="152.1" y="324.3" font-size="10.5" fill="#1d6fa5" text-anchor="end">冷 7.5 分</text>
<text x="316.8" y="300.3" font-size="10.5" fill="#c25014" text-anchor="start">热 17.9 分</text>
<text x="40" y="366" font-size="10.5" fill="#475569" text-anchor="start">同一条曲线 → 热水永远落在冷水后面</text>
<text x="40" y="388" font-size="10.5" fill="#64748b" text-anchor="start">这不是热力学第一定律被推翻，而是提示缺少机制。</text>
<rect x="388" y="66" width="352" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="406" cy="89" r="10.5" fill="#fef1e8" stroke="#c25014" stroke-width="1.2"/>
<text x="406" y="93" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="700">2</text>
<text x="424" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">姆潘巴说法：曲线必须交叉</text>
<rect x="412" y="118" width="300" height="226" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
<line x1="412.0" y1="344.0" x2="712.0" y2="344.0" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
