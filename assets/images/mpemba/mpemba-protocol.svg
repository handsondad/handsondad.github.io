<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">家庭验证姆潘巴效应的可复现实验协议图</title>
<desc id="desc">左栏四步协议先定义终点再控制变量再连续记录最后看波动右栏区分开始成核降到0度完全冻结三种结冰终点并给出浅金属盘小水量贴紧冷板的实用建议底栏强调稳定显著可重复才算复现否则应如实写没观察到。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="589" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">想在家验证？先把实验写成一份“可复现协议”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">如果只是随手把两杯水丢进冰箱，你看到的更可能是杯子位置和霜层，而不是效应。</text>
<rect x="20" y="66" width="352" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="38" y="94" width="316" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="54" y="119" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">① 先定义终点</text>
<text x="54" y="142" font-size="10.5" fill="#1e293b" text-anchor="start">出现第一粒冰 / 降到 0°C /</text>
<text x="54" y="160" font-size="10.5" fill="#1e293b" text-anchor="start">完全冻结：三选一写下来。</text>
<rect x="38" y="192" width="316" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="54" y="217" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">② 控制变量</text>
<text x="54" y="240" font-size="10.5" fill="#1e293b" text-anchor="start">同水量、同容器、同探头高度；</text>
<text x="54" y="258" font-size="10.5" fill="#1e293b" text-anchor="start">同时放入、全程不挪动。</text>
<rect x="38" y="290" width="316" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="54" y="315" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">③ 连续记录</text>
<text x="54" y="338" font-size="10.5" fill="#1e293b" text-anchor="start">多个探头秒级记录，记下</text>
<text x="54" y="356" font-size="10.5" fill="#1e293b" text-anchor="start">冷冻室温度与开关门时间。</text>
<rect x="38" y="388" width="316" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
<text x="54" y="413" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">④ 看波动</text>
<text x="54" y="436" font-size="10.5" fill="#1e293b" text-anchor="start">重复十几轮，比较平均值</text>
<text x="54" y="454" font-size="10.5" fill="#1e293b" text-anchor="start">与离散度；差值小于波动</text>
<text x="54" y="472" font-size="10.5" fill="#1e293b" text-anchor="start">就只能写“没看到”。</text>
<rect x="388" y="66" width="352" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="406" y="93" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">三种“结冰”，别混着说</text>
<rect x="406" y="118" width="316" height="62" rx="7" fill="#f3e8ff" stroke="#6d28d9"/>
<text x="420" y="143" font-size="11.2" fill="#6d28d9" text-anchor="start" font-weight="700">开始成核</text>
<text x="420" y="166" font-size="10.5" fill="#1e293b" text-anchor="start">受杂质与微小缺陷支配</text>
<rect x="406" y="192" width="316" height="62" rx="7" fill="#eaf4fb" stroke="#1d6fa5"/>
<text x="420" y="217" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">降到 0°C</text>
<text x="420" y="240" font-size="10.5" fill="#1e293b" text-anchor="start">2016 年判据针对的阶段</text>
<rect x="406" y="266" width="316" height="62" rx="7" fill="#fef1e8" stroke="#c25014"/>
<text x="420" y="291" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">完全冻结</text>
<text x="420" y="314" font-size="10.5" fill="#1e293b" text-anchor="start">还要移走凝固潜热，量级很大</text>
<line x1="406.0" y1="356.0" x2="722.0" y2="356.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
<text x="406" y="382" font-size="10.5" fill="#1e293b" text-anchor="start">实用建议：想快点得到冰，用浅金属盘、小水量、贴紧冷板。</text>
<text x="406" y="408" font-size="10.5" fill="#64748b" text-anchor="start">“先烧热再冻”既不稳定，也更费电，别当成节能捷径。</text>
<rect x="406.0" y="430.0" width="250" height="24" rx="12.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="531.0" y="446.3" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600">效应是科学问题，制冰是工程问题</text>
<rect x="20" y="500" width="720" height="78" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="38" y="526" font-size="11.2" fill="#0f172a" text-anchor="start" font-weight="700">判断是否复现的最低标准：同样条件下，差异要稳定、显著、并且能被别人重复。</text>
<text x="38" y="554" font-size="10.5" fill="#475569" text-anchor="start">一条也没有满足时，最老实的写法是：这次没有观察到姆潘巴效应。</text>
</svg>
