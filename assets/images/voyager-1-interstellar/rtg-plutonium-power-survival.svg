<rect x="0.5" y="0.5" width="759" height="489" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">阳光只剩三万分之一，靠什么撑满半世纪？钚-238 温差核电池与“断臂求生”账本</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：3 台串联 MHW-RTG 塞贝克温差发电结构｜右：470 W 跌至 ~213 W 衰减曲线与 +2°C 联氨防冻红线</text>
<rect x="20" y="62" width="352" height="412" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 不是核反应堆！无运动部件的“温差发电保温杯”</text>
<text x="36" y="102" font-size="10.3" fill="#64748b" text-anchor="start">173 AU 处阳光仅地球 1/30,000（0.045 W/m²），光伏帆板彻底失效</text>
