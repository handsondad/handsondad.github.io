<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">旅行者1号钚238放射性同位素温差核电池原理与1977至2036年电功率衰减关机时间表</title>
<desc id="desc">左图展示MHW-RTG利用二氧化钚238自然α衰变热与312对硅锗热电偶塞贝克效应无磨损发电的结构，并解释联氨推进剂+2摄氏度结冰红线；右图绘制总电功率从1977年470瓦以每年约4瓦降至2026年约213瓦的实测曲线及10台科学仪器关停至仅剩MAG和PWS的过程。</desc>
