<text x="210" y="173" font-size="9.6" fill="#c25014" text-anchor="start" font-weight="700">热端：半衰期 87.7 年</text>
<text x="210" y="188" font-size="9.4" fill="#1e293b" text-anchor="start">α 粒子一张纸即可挡住</text>
<line x1="180.0" y1="218" x2="206" y2="218" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="210" y="215" font-size="9.6" fill="#1d6fa5" text-anchor="start" font-weight="700">312 对硅锗热电偶</text>
<text x="210" y="230" font-size="9.4" fill="#1e293b" text-anchor="start">塞贝克温差直变直流电</text>
<line x1="186.0" y1="254" x2="206" y2="258" stroke="#475569" stroke-width="1.4"/>
<text x="210" y="255" font-size="9.6" fill="#475569" text-anchor="start" font-weight="700">冷端：铍壳散热翅片</text>
<text x="210" y="270" font-size="9.4" fill="#1e293b" text-anchor="start">向深空辐射排热造温差</text>
<text x="196" y="313" font-size="9.8" fill="#18794e" text-anchor="middle" font-weight="700">零旋转齿轮、零磨损阀门 ⇒ 连续发电 49 年从不卡壳！</text>
<rect x="34" y="338" width="324" height="122" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="44" y="358" font-size="9.9" fill="#c25014" text-anchor="start" font-weight="700">极寒生死线：为什么还剩 210 多瓦电，却连关科学仪器？</text>
<text x="44" y="378" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">• 姿态推进剂“联氨（N₂H₄）”冰点高达 +2°C（比水还娇气！）</text>
<text x="44" y="397" font-size="9.5" fill="#1e293b" text-anchor="start">• 一旦管路冻住，推进器失灵 → 天线偏离地球 0.5° 即失联</text>
<text x="44" y="416" font-size="9.5" fill="#1e293b" text-anchor="start">• 如今大半电力全在给油路和电脑“贴暖宝宝”保命；</text>
<text x="44" y="435" font-size="9.5" fill="#6d28d9" text-anchor="start" font-weight="700">• 2026.09 刚完成“Big Bang”三组加热器同步切换降耗！</text>
