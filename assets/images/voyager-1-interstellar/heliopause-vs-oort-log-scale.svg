<rect x="0.5" y="0.5" width="759" height="501" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">冲进星际空间 ≠ 飞出太阳系！一张对数标尺分清“日球层磁泡”与“奥尔特云”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">上：10⁰ ～ 3×10⁵ AU 对数全景尺｜下：2012 日球层顶粒子反转铁证与 10 米圆桌真实比例尺</text>
<rect x="20" y="62" width="720" height="212" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 太阳系对数坐标全景尺（每向右一格距离放大 10 倍！）</text>
<text x="36" y="102" font-size="10.2" fill="#64748b" text-anchor="start">按等离子体算，2012 年已进星际空间；按太阳引力疆界算，还要再飞约 3 万年才出奥尔特云</text>
