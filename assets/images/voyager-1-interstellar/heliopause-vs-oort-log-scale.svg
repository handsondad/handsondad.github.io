<text x="206.8" y="351.0" font-size="9.5" fill="#0f172a" text-anchor="middle" font-weight="700">2012.08.25 日球层顶</text>
<path d="M 62.0,372.0 L 194.8,375.0 L 214.8,422.0 L 340.0,423.0" fill="none" stroke="#c25014" stroke-width="2.3"/>
<text x="68.0" y="369.0" font-size="9.4" fill="#c25014" text-anchor="start" font-weight="700" class="halo">太阳风低能粒子 → 骤降至零</text>
<path d="M 62.0,414.0 L 194.8,412.0 L 214.8,372.0 L 340.0,370.0" fill="none" stroke="#1d6fa5" stroke-width="2.3"/>
<text x="218.8" y="386.0" font-size="9.4" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">银河宇宙射线暴涨</text>
<text x="218.8" y="402.0" font-size="9.4" fill="#18794e" text-anchor="start" font-weight="700" class="halo">等离子体密度跃升 ~40 倍！</text>
<text x="36" y="454" font-size="9.5" fill="#1e293b" text-anchor="start">• 等离子体仪早年停机，幸亏 2013 太阳风暴激起电子振荡，</text>
<text x="36" y="471" font-size="9.5" fill="#1d6fa5" text-anchor="start" font-weight="700">  PWS 听出“星际琴弦音高”实测密度暴涨 40 倍，一锤定音！</text>
<rect x="388" y="290" width="352" height="196" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
