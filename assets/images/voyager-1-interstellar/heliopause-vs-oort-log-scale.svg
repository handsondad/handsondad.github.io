<rect x="402" y="326" width="324" height="68" rx="8" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="414" y="345" font-size="9.8" fill="#6d28d9" text-anchor="start" font-weight="700">若把奥尔特云（半径 5 万 AU）缩成直径 10 米的大圆桌：</text>
<text x="414" y="364" font-size="9.6" fill="#1e293b" text-anchor="start">• 八大行星全挤在圆心 3.0 毫米的针尖里；</text>
<text x="414" y="382" font-size="9.6" fill="#0f172a" text-anchor="start" font-weight="700">• 狂奔 49 年的旅行者 1 号，才刚爬出圆心 1.73 厘米！</text>
<rect x="402" y="402" width="324" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
<circle cx="434" cy="438" r="21" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/>
<circle cx="434" cy="438" r="5" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
<text x="464" y="421" font-size="9.9" fill="#b45309" text-anchor="start" font-weight="700">关机后永不停航：30 cm 镀金铜唱片</text>
<text x="464" y="439" font-size="9.3" fill="#1e293b" text-anchor="start">• 护盖镀超纯 ²³⁸U（45.1 亿年核时钟）+ 14 颗脉冲星定位</text>
<text x="464" y="457" font-size="9.3" fill="#1e293b" text-anchor="start">• 录 55 种语言问候与古琴《流水》，4 万年后掠过红矮星</text>
