<text x="36" y="256" font-size="9.7" fill="#64748b" text-anchor="start">注：1 AU（天文单位）≈ 1.496 亿 km；1 光日 ≈ 173.1 AU；1 光年 ≈ 63,241 AU。</text>
<rect x="20" y="290" width="352" height="196" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="312" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 2012.08.25 闯出日球层顶的“三大实测铁证”</text>
<text x="36" y="330" font-size="9.9" fill="#64748b" text-anchor="start">没有路牌的漆黑太空，科学家凭什么确认它跨过了 122 AU 边界？</text>
<rect x="56.0" y="356.0" width="290.0" height="74.0" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
