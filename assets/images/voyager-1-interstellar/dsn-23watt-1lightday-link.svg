<svg xmlns="http://www.w3.org/2000/svg" width="760" height="492" viewBox="0 0 760 492" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">旅行者1号23瓦X波段跨越1光日深空网通信链路与69KB计算机远程代码修复图解</title>
<desc id="desc">上图展示旅行者1号用3.7米高增益天线和23瓦X波段发射机跨越259.02亿公里（1光日，单程24小时），由全球间隔120度的三座NASA深空网70米天线接收约10^-20瓦微弱信号；左下图图解69.63 KB内存中拆分搬迁FDS损坏芯片代码的过程；右下图对比从地月1.28光秒到1光日与比邻星4.24光年的光行时间阶梯。</desc>
