<svg xmlns="http://www.w3.org/2000/svg" width="760" height="482" viewBox="0 0 760 482" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">旅行者1号木星与土星引力弹弓加速原理及对日速度跨越太阳逃逸速度实算图</title>
<desc id="desc">左图对比木星参考系中等速偏转98.5度与太阳参考系叠加木星公转13.1 km/s后合速度从12.8跃升至23.7 km/s的矢量机制；右图根据NASA NSSDCA轨道根数绘制1至32 AU对日速度曲线，展示无木星时将在8.96 AU掉头，借木星与土星两次引力弹弓后永久高于太阳逃逸速度。</desc>
