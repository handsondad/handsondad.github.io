<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：行星参考系能量守恒与太阳参考系矢量叠加｜右：NASA 实测对日速度曲线跨越太阳逃逸门槛</text>
<rect x="20" y="62" width="352" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
