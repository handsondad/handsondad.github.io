<text x="468" y="172" font-size="9.9" fill="#1e293b" text-anchor="start">• 矩形金属波导定向引波</text>
<text x="468" y="194" font-size="9.9" fill="#1e293b" text-anchor="start">• 冷钢壁全反射叠出驻波</text>
<text x="468" y="216" font-size="9.9" fill="#1e293b" text-anchor="start">• 炉门 1.5 mm 网孔锁死</text>
<text x="468" y="238" font-size="9.9" fill="#1e293b" text-anchor="start">• 偏心转盘扫匀冷热死区</text>
