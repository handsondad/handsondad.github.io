<text x="36" y="342" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="700">整机能量账单与第一条反直觉真相：微波炉从来不是“从最中心往外加热”！</text>
<rect x="36.0" y="356.0" width="251.8" height="28.0" rx="5" fill="#18794e"/>
<rect x="289.8" y="356.0" width="108.2" height="28.0" rx="5" fill="#c25014"/>
<text x="161.9" y="374.0" font-size="10.0" fill="#ffffff" text-anchor="middle" font-weight="700">有效微波输出 ≈ 800 W (70%)</text>
<text x="342.9" y="374.0" font-size="9.6" fill="#ffffff" text-anchor="middle" font-weight="700">≈ 350 W 余热</text>
<rect x="414" y="350" width="310" height="46" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.0"/>
<text x="426" y="368" font-size="9.5" fill="#1e293b" text-anchor="start">烤箱：先烤热 200 ℃ 空气，热量从焦皮硬往里爬；</text>
<text x="426" y="386" font-size="9.5" fill="#0f766e" text-anchor="start" font-weight="700">微波：穿过冷空气，直达外层 1–2 cm 水分子同步产热！</text>
<text x="36" y="415" font-size="9.7" fill="#1e293b" text-anchor="start">• 为什么磁控管长满散热片还要风扇狂吹？那 ~350 W 损耗全积在铜阳极上，不吹风会过热退磁。</text>
<text x="36" y="433" font-size="9.7" fill="#1d6fa5" text-anchor="start" font-weight="700">• 为什么错觉“从里往外热”？只因空气、冷炉壁和干瓷碗不吸波，表层 1.4 cm 水分直接生热（厚汤中心仍靠导热）！</text>
