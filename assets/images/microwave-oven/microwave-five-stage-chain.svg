<text x="87.0" y="141" font-size="9.3" fill="#475569" text-anchor="middle" font-weight="700" class="mono">220 V · 50 Hz</text>
<text x="30" y="172" font-size="9.9" fill="#1e293b" text-anchor="start">• 整机输入约 1150 W</text>
<text x="30" y="194" font-size="9.9" fill="#1e293b" text-anchor="start">• 每秒仅来回晃 50 次</text>
<text x="30" y="216" font-size="9.9" fill="#1e293b" text-anchor="start">• 远追不上极性水分子</text>
<text x="30" y="238" font-size="9.9" fill="#1e293b" text-anchor="start">• 顺带驱动风扇与转盘</text>
