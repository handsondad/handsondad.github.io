<rect x="0.5" y="0.5" width="759" height="459" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">没有明火也不烫炉壁，微波炉凭什么两分钟热透一杯牛奶？—— 五棒物理能量链</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">从墙上 220 V / 50 Hz 工频电到 2.45 GHz 微波与 1.4 cm 偶极子耗散，逐级追踪电压、频率与波长</text>
