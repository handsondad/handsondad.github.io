<text x="176" y="172" font-size="9.9" fill="#1e293b" text-anchor="start">• 升压变压器抬至 ~2.1 kV</text>
<text x="176" y="194" font-size="9.9" fill="#1e293b" text-anchor="start">• 高压电容+二极管倍压</text>
<text x="176" y="216" font-size="9.9" fill="#1e293b" text-anchor="start">• 阳极接地 0 V 保安全</text>
<text x="176" y="238" font-size="9.9" fill="#1e293b" text-anchor="start">• 灯丝阴极悬在 −4 kV！</text>
