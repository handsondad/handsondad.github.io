<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">微波炉五棒物理能量转换链与整机功率账单图解</title>
<desc id="desc">分五棒展示220V/50Hz市电（约1150W）经半波倍压升至-4000V脉动直流、驱动腔体磁控管产生800W的2.45GHz（波长12.24cm）微波、经波导管送入金属驻波腔（半波长6.12cm）、最终在食物外层约1.4cm水分子中耗散生热的全过程。</desc>
