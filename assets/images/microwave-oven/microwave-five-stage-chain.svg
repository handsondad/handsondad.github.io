<text x="671.0" y="141" font-size="9.3" fill="#18794e" text-anchor="middle" font-weight="700" class="mono">穿透 D_p ≈ 1.4 cm</text>
<text x="614" y="172" font-size="9.9" fill="#1e293b" text-anchor="start">• 电场每秒翻转 49 亿次</text>
<text x="614" y="194" font-size="9.9" fill="#1e293b" text-anchor="start">• 水分子氢键拖拽摩擦热</text>
<text x="614" y="216" font-size="9.9" fill="#1e293b" text-anchor="start">• 盐离子往复冲撞添火力</text>
<text x="614" y="238" font-size="9.9" fill="#1e293b" text-anchor="start">• 外层吸波 → 中心靠导热</text>
<line x1="614.0" y1="272.0" x2="728.0" y2="272.0" stroke="#cbd5e1" stroke-width="0.9"/>
