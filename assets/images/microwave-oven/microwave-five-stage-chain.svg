<text x="322" y="172" font-size="9.9" fill="#1e293b" text-anchor="start">• E × B 正交电磁场掰弯</text>
<text x="322" y="194" font-size="9.9" fill="#1e293b" text-anchor="start">• 电子轮辐扫过 8/10 铜腔</text>
<text x="322" y="216" font-size="9.9" fill="#1e293b" text-anchor="start">• 直流高压变 800 W 微波</text>
<text x="322" y="238" font-size="9.9" fill="#1e293b" text-anchor="start">• 转换效率约 70%</text>
