<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：8 腔铜阳极 + 轴向强磁场 B ≈ 0.18 T 的洛伦兹拐弯与 π 模轮辐（动画）；右：“中火 50%”的继电器通断真相</text>
