<text x="418" y="409" font-size="9.7" fill="#0f172a" text-anchor="start" font-weight="700">👂 听声音秒辨你家是哪一种：设中火加热 1 分钟——</text>
<text x="418" y="427" font-size="9.5" fill="#1e293b" text-anchor="start">每隔十多秒“咔哒”变安静的是传统通断式；全程平稳轻响是真变频！</text>
