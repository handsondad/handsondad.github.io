<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">8腔磁控管正交电磁场电子轮辐旋转动画与传统继电器通断对变频连续控温对比图</title>
<desc id="desc">左图展示-4kV阴极与0V八腔铜阳极在0.18T轴向磁场下由洛伦兹力形成4道π模电子轮辐旋转激振2.45GHz微波；右图对比传统微波炉中火50%采用15秒800W加15秒0W继电器通断与变频微波炉连续输出400W的本质差异。</desc>
