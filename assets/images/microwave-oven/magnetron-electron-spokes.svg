<text x="34" y="294" font-size="9.7" fill="#6d28d9" text-anchor="start" font-weight="700">π 模均压环：</text>
<text x="34" y="309" font-size="9.4" fill="#1e293b" text-anchor="start">相邻腔反相 180°</text>
<rect x="34" y="332" width="344" height="98" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.0"/>
<text x="46" y="351" font-size="9.7" fill="#0f172a" text-anchor="start" font-weight="600">• 洛伦兹力 F = −e(E + v × B) 把径向飞出的电子掰弯成回旋曲线；</text>
<text x="46" y="370" font-size="9.7" fill="#1e293b" text-anchor="start">• 跑得快的电子被逆向射频场减速，聚拢成 N/2 = 4 道旋转“电子轮辐”；</text>
<text x="46" y="389" font-size="9.7" fill="#1e293b" text-anchor="start">• 轮辐同步扫过腔口，源源不断把 −4000 V 势能泵成 2.45 GHz 电磁波，</text>
<text x="46" y="408" font-size="9.7" fill="#1d6fa5" text-anchor="start" font-weight="700">  就像对着一排空啤酒瓶口吹气，激发出极其纯粹的高频哨音！</text>
