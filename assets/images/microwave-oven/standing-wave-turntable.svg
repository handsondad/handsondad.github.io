<text x="46" y="384" font-size="9.4" fill="#1e293b" text-anchor="start">1. 取下玻璃转盘，平铺一整盘芝士片/大块排块巧克力，高火叮 15–20 秒；</text>
<text x="46" y="402" font-size="9.4" fill="#1e293b" text-anchor="start">2. 量出相邻两个融化鼓包中心距 Δx ≈ 6.12 cm → 全波长 λ₀ = 2Δx = 12.24 cm；</text>
<text x="46" y="420" font-size="9.5" fill="#dc2626" text-anchor="start" font-weight="700">3. 乘上背部铭牌频率：c = f × λ₀ = 2.45×10⁹ × 0.1224 ≈ 3.00×10⁸ m/s！</text>
