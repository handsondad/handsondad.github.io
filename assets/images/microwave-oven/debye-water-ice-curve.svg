<rect x="0.5" y="0.5" width="759" height="461" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">破除最大科普谣言：2.45 GHz 根本不是水分子的“共振频率”！—— 德拜弛豫与化冻陷阱</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：据 Kaatze (1989) 精确计算水与冰的介电损耗曲线 ε&#x27;&#x27;(f)；右：穿透深度黄金折中与冰水差万倍的“热失控”</text>
<rect x="20" y="62" width="422" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="34" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 介电损耗谱 ε&#x27;&#x27;(f)：水峰在 19.2 GHz，冰峰在 8 kHz！</text>
<text x="34" y="104" font-size="9.8" fill="#64748b" text-anchor="start">纵轴：损耗因子 ε&#x27;&#x27;（决定同电场下的吸波发热本领）</text>
