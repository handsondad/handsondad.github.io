<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" viewBox="0 0 760 462" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">水与冰德拜介电损耗频率曲线、微波穿透深度折中与化冻热失控原理图</title>
<desc id="desc">左图按德拜方程绘制0℃冰（峰值约8kHz，2.45GHz处仅0.0015）与25℃液态水（峰值19.2GHz，穿透仅0.47mm）的损耗曲线，标明2.45GHz处于山坡左翼甜点区（穿透约1.4cm）；右图对比915MHz、2.45GHz与19.2GHz穿透深度，并解释液态水比冰吸波强上万倍导致化冻边缘煮熟的热失控。</desc>
