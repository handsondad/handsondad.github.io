<text x="113.7" y="141.4" font-size="9.6" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">0℃ 冰弛豫峰 (~8 kHz)</text>
<text x="113.7" y="155.4" font-size="9.1" fill="#1d6fa5" text-anchor="start" class="halo">氢键晶格锁死，转身慢百万倍</text>
<text x="368.2" y="157.0" font-size="9.6" fill="#dc2626" text-anchor="end" font-weight="700" class="halo">25℃ 液态水峰 19.2 GHz</text>
<text x="368.2" y="182.0" font-size="9.2" fill="#dc2626" text-anchor="end" font-weight="700" class="halo">(D_p 仅 0.47 mm!)</text>
<text x="327.7" y="259.9" font-size="9.7" fill="#18794e" text-anchor="end" font-weight="700" class="halo">微波炉 2.45 GHz →</text>
<text x="327.7" y="273.9" font-size="9.2" fill="#18794e" text-anchor="end" font-weight="600" class="halo">山坡左翼甜点区！</text>
<text x="327.7" y="307.0" font-size="9.1" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">冰在此处 ε&#x27;&#x27;≈0.0015 →</text>
<rect x="34" y="356" width="394" height="78" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="375" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="600">• 液态水是氢键牵扯的“拥挤舞池”，没有孤立气体水分子的 22.2 GHz 尖锐共振，</text>
<text x="46" y="393" font-size="9.5" fill="#1e293b" text-anchor="start">  只有宽缓的【德拜转向弛豫】：水偶极子追赶交变电场时慢半拍，滞后功全变热；</text>
<text x="46" y="411" font-size="9.5" fill="#dc2626" text-anchor="start" font-weight="700">• 若真用 19.2 GHz 峰值加热，微波在表皮 0.46 mm 就被吸干，外皮烤焦里面冰凉！</text>
<rect x="454" y="62" width="286" height="386" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="468" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 黄金穿透深度 &amp; 化冻“外熟内冰”之谜</text>
<rect x="468" y="100" width="258" height="146" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.0"/>
<text x="480" y="120" font-size="10.3" fill="#18794e" text-anchor="start" font-weight="700">A. 为什么全世界微波炉偏偏选 2.45 GHz？</text>
<text x="480" y="136" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="700">915 MHz 工业解冻</text>
<rect x="480" y="141" width="118.0" height="10" rx="3" fill="#1d6fa5"/>
<text x="604.0" y="150" font-size="9.1" fill="#1d6fa5" text-anchor="start" font-weight="700">穿透 ~4–9 cm（腔体太大）</text>
<text x="480" y="171" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="700">2.45 GHz 家用黄金频段</text>
<rect x="480" y="176" width="54.0" height="10" rx="3" fill="#18794e"/>
<text x="540.0" y="185" font-size="9.1" fill="#18794e" text-anchor="start" font-weight="700">D_p ≈ 1.4 cm（内外兼顾！）</text>
<text x="480" y="206" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="700">19.2 GHz 水弛豫峰</text>
<rect x="480" y="211" width="4.0" height="10" rx="3" fill="#dc2626"/>
<text x="490.0" y="220" font-size="9.1" fill="#dc2626" text-anchor="start" font-weight="700">仅 0.47 mm（瞬间糊皮！）</text>
<rect x="468" y="258" width="258" height="176" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.0"/>
<text x="480" y="278" font-size="10.2" fill="#b45309" text-anchor="start" font-weight="700">B. 化冻死结：水比冰吸波强 10,000 倍以上！</text>
<rect x="480" y="290" width="234" height="58" rx="7" fill="#dbeafe" stroke="#1d6fa5" stroke-width="1.2"/>
<rect x="480" y="290" width="54" height="58" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="507" y="314" font-size="9.2" fill="#dc2626" text-anchor="middle" font-weight="700">先化水滴</text>
<text x="507" y="329" font-size="9.1" fill="#dc2626" text-anchor="middle" font-weight="700" class="mono">ε&#x27;&#x27; ≈ 21</text>
<text x="507" y="342" font-size="8.9" fill="#dc2626" text-anchor="middle" font-weight="700">疯狂抢波!</text>
<text x="622" y="314" font-size="9.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">内部 0℃ 冰晶 (Ice Ih)</text>
<text x="622" y="331" font-size="9.0" fill="#1d6fa5" text-anchor="middle" font-weight="600">ε&#x27;&#x27; ≈ 0.0015（对微波近乎透明！）</text>
<text x="480" y="368" font-size="9.4" fill="#1e293b" text-anchor="start">• 尖角一旦化出一滴液态水，吸波能力暴涨上万倍，</text>
<text x="480" y="386" font-size="9.4" fill="#dc2626" text-anchor="start" font-weight="700">  形成【热失控】：水滴沸腾把肉边煮熟，冰芯仍硬！</text>
<text x="480" y="405" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="600">• 正确解冻：开低功率断续档，趁停歇期靠热传导融冰；</text>
<text x="480" y="422" font-size="9.2" fill="#64748b" text-anchor="start">  同理，汤里加盐（Na⁺/Cl⁻ 导电损耗）会让表层更易滚烫。</text>
</svg>
