<svg xmlns="http://www.w3.org/2000/svg" width="540" height="741.75" viewBox="0 0 540 741.75" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">轨道上的强引力与微重力</title><desc id="desc">400千米高度的地球引力约为地表88.5%。比较受支撑的人和共同自由落体的人，秤的读数是支撑力而非引力是否存在。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="740.25" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.54" font-size="21.2" fill="#172b45" text-anchor="start" font-weight="700">漂浮，不等于引力消失</text><text x="36" y="93.45" font-size="17.5" fill="#172b45" text-anchor="start">取高度 400 千米；地球近似为不自转的球体</text><rect x="24" y="126" width="672" height="214" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="166.32" font-size="19.0" fill="#172b45" text-anchor="start">地表引力：100%</text><rect x="48" y="190" width="580" height="24" rx="5" fill="#d9e3ea"/><rect x="48" y="190" width="580" height="24" rx="5" fill="#176786"/><text x="46" y="250.32" font-size="19.0" fill="#172b45" text-anchor="start">400 千米处：88.5%（约 8.70 米/秒²）</text><rect x="48" y="274" width="513.487" height="24" rx="5" fill="#b77a09"/><text x="58" y="389.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">① 有支撑</text><rect x="42" y="415" width="295" height="275" rx="14" fill="white" stroke="#8295a5" stroke-width="2"/><circle cx="187.000" cy="490.000" r="17" fill="#176786"/><path d="M187.000,508.000 L187.000,574.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M187.000,535.000 L153.000,551.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M187.000,535.000 L221.000,551.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M187.000,574.000 L158.000,620.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M187.000,574.000 L216.000,620.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M119.000,622.000 L251.000,622.000" fill="none" stroke="#172b45" stroke-width="2.4"/><path d="M237.000,520.000 L237.000,586.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="253" y="570.52" font-size="16.7" fill="#b34039" text-anchor="start">引力</text><path d="M133.000,606.000 L133.000,539.000" fill="none" stroke="#b77a09" stroke-width="2.4" marker-end="url(#arrow)"/><text x="51" y="498.52" font-size="16.7" fill="#b77a09" text-anchor="start">支撑</text><text x="84" y="663.39" font-size="18.2" fill="#172b45" text-anchor="start">秤有读数</text><text x="394" y="389.11" font-size="19.2" fill="#172b45" text-anchor="start" font-weight="600">② 一起自由落体</text><rect x="378" y="415" width="295" height="275" rx="14" fill="white" stroke="#8295a5" stroke-width="2"/><circle cx="523.000" cy="490.000" r="17" fill="#176786"/><path d="M523.000,508.000 L523.000,574.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M523.000,535.000 L489.000,551.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M523.000,535.000 L557.000,551.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M523.000,574.000 L494.000,620.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M523.000,574.000 L552.000,620.000" fill="none" stroke="#176786" stroke-width="2.4"/><path d="M455.000,622.000 L587.000,622.000" fill="none" stroke="#172b45" stroke-width="2.4"/><path d="M573.000,520.000 L573.000,586.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="589" y="570.52" font-size="16.7" fill="#b34039" text-anchor="start">引力</text><path d="M690.000,485.000 L690.000,560.000" fill="none" stroke="#b34039" stroke-width="2.4" marker-end="url(#arrow)"/><text x="420" y="663.45" font-size="17.5" fill="#172b45" text-anchor="start">秤的支撑读数≈0</text><text x="46" y="755.52" font-size="16.7" fill="#172b45" text-anchor="start">右图的人、物体与舱体共同自由落体；房间不按比例。</text><rect x="24" y="787" width="672" height="165" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="827.39" font-size="18.2" fill="#172b45" text-anchor="start">同高度的理想圆轨道：速度约 7.67 千米/秒</text><text x="46" y="873.45" font-size="17.5" fill="#172b45" text-anchor="start">绕地球一圈约 92.4 分钟；不需要引力被抵消。</text><text x="46" y="920.52" font-size="16.7" fill="#172b45" text-anchor="start">真实空间站有阻力、振动与潮汐差，并非完美失重。</text></g></svg>
