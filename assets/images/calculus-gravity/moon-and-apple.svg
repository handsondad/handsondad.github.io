<svg xmlns="http://www.w3.org/2000/svg" width="540" height="659.25" viewBox="0 0 540 659.25" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">苹果和月球运动的引力数量级比较</title><desc id="desc">地月图按统一比例，地球半径6370千米，地月平均距离384400千米。地球在月球距离处的引力加速度约0.00270米每二次方秒。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="657.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">苹果与月亮：同一个引力，不同的尺度</text><text x="36" y="92.45" font-size="17.5" fill="#172b45" text-anchor="start">下面的地月距离与天体直径，使用同一长度比例</text><path d="M90.000,210.000 L640.000,210.000" fill="none" stroke="#8295a5" stroke-width="2.4" stroke-dasharray="7 6"/><circle cx="90.000" cy="210.000" r="9.11420395421436" fill="#176786"/><circle cx="640.000" cy="210.000" r="2.489594172736733" fill="#b77a09"/><text x="65" y="167.39" font-size="18.2" fill="#172b45" text-anchor="start">地球</text><text x="602" y="167.39" font-size="18.2" fill="#172b45" text-anchor="start">月亮</text><text x="330" y="253.39" font-size="18.2" fill="#172b45" text-anchor="middle">约 384,400 千米</text><text x="36" y="302.45" font-size="17.5" fill="#172b45" text-anchor="start">月亮很小并非漏画；距离约为 60.3 个地球半径。</text><rect x="24" y="338" width="672" height="179" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="376.39" font-size="18.2" fill="#172b45" text-anchor="start">① 地表附近：每秒的速度变化约 9.82 米/秒</text><text x="46" y="425.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">从静止自由落下 1 秒，约下降 4.91 米。</text><text x="46" y="477.45" font-size="17.5" fill="#172b45" text-anchor="start">忽略空气阻力；只看靠近地表的短时间。</text><rect x="24" y="544" width="672" height="194" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="583.32" font-size="19.0" fill="#172b45" text-anchor="start">② 月球距离处：地球的引力加速度</text><text x="46" y="632.45" font-size="17.5" fill="#b77a09" text-anchor="start">约 0.00270 米/秒²；1 秒约偏离切线 1.35 毫米</text><text x="46" y="682.39" font-size="18.2" fill="#172b45" text-anchor="start">从月球轨道反算：约 0.00273 米/秒²</text><text x="46" y="716.52" font-size="16.7" fill="#172b45" text-anchor="start">两个估计接近，但不是高精度月球模型。</text><text x="36" y="789.52" font-size="16.7" fill="#b34039" text-anchor="start">注意：这里不是月亮表面约 1.6 米/秒²的自身重力。</text><text x="36" y="834.52" font-size="16.7" fill="#172b45" text-anchor="start">“下落”是相对惯性切线弯曲，不是轨道半径持续缩小。</text></g></svg>
