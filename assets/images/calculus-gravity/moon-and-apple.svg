<svg xmlns="http://www.w3.org/2000/svg" width="720" height="879" viewBox="0 0 720 879" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">苹果和月球运动的引力数量级比较</title><desc id="desc">地月图按统一比例，地球半径6370千米，地月平均距离384400千米。地球在月球距离处的引力加速度约0.00270米每二次方秒。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="879" fill="#f3f7fa"/><text x="36" y="52" font-size="29" fill="#172b45" text-anchor="start">苹果与月亮：同一个引力，不同的尺度</text><text x="36" y="94" font-size="23" fill="#172b45" text-anchor="start">下面的地月距离与天体直径，使用同一长度比例</text><path d="M90.000,210.000 L640.000,210.000" fill="none" stroke="#8295a5" stroke-width="3" stroke-dasharray="7 6"/><circle cx="90.000" cy="210.000" r="9.11420395421436" fill="#176786"/><circle cx="640.000" cy="210.000" r="2.489594172736733" fill="#b77a09"/><text x="65" y="169" font-size="24" fill="#172b45" text-anchor="start">地球</text><text x="602" y="169" font-size="24" fill="#172b45" text-anchor="start">月亮</text><text x="330" y="255" font-size="24" fill="#172b45" text-anchor="middle">约 384,400 千米</text><text x="36" y="304" font-size="23" fill="#172b45" text-anchor="start">月亮很小并非漏画；距离约为 60.3 个地球半径。</text><rect x="24" y="338" width="672" height="179" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="46" y="378" font-size="24" fill="#172b45" text-anchor="start">① 地表附近：每秒的速度变化约 9.82 米/秒</text><text x="46" y="427" font-size="26" fill="#176786" text-anchor="start">从静止自由落下 1 秒，约下降 4.91 米。</text><text x="46" y="479" font-size="23" fill="#172b45" text-anchor="start">忽略空气阻力；只看靠近地表的短时间。</text><rect x="24" y="544" width="672" height="194" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="46" y="585" font-size="25" fill="#172b45" text-anchor="start">② 月球距离处：地球的引力加速度</text><text x="46" y="634" font-size="23" fill="#b77a09" text-anchor="start">约 0.00270 米/秒²；1 秒约偏离切线 1.35 毫米</text><text x="46" y="684" font-size="24" fill="#172b45" text-anchor="start">从月球轨道反算：约 0.00273 米/秒²</text><text x="46" y="718" font-size="22" fill="#172b45" text-anchor="start">两个估计接近，但不是高精度月球模型。</text><text x="36" y="791" font-size="22" fill="#b34039" text-anchor="start">注意：这里不是月亮表面约 1.6 米/秒²的自身重力。</text><text x="36" y="836" font-size="22" fill="#172b45" text-anchor="start">“下落”是相对惯性切线弯曲，不是轨道半径持续缩小。</text></svg>
