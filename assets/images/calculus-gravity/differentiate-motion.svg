<svg xmlns="http://www.w3.org/2000/svg" width="720" height="958" viewBox="0 0 720 958" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">圆周运动中的位置、速度和加速度向量</title><desc id="desc">圆轨道半径不变，速度向量沿切线，加速度向量指向地心。动画旋转整个向量组，几何方向约束始终成立。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.orbit-marker{transform-origin:330px 396px;animation:turn 8s linear 1s 1 both}@keyframes turn{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}@media(prefers-reduced-motion:reduce){.orbit-marker{animation:none}}</style><rect width="720" height="958" fill="#f3f7fa"/><text x="36" y="52" font-size="28" fill="#172b45" text-anchor="start">距离不变，为什么仍然有速度和加速度？</text><text x="36" y="94" font-size="23" fill="#172b45" text-anchor="start">黑箭头：切向速度 v；红箭头：向心加速度 a</text><circle cx="330" cy="396" r="165" fill="none" stroke="#8295a5" stroke-width="3"/><circle cx="330.000" cy="396.000" r="18" fill="#b77a09"/><text x="294" y="445" font-size="24" fill="#172b45" text-anchor="start">地心</text><circle cx="330.000" cy="231.000" r="5" fill="#176786"/><text x="289" y="211" font-size="23" fill="#172b45" text-anchor="start">T / 4</text><circle cx="165.000" cy="396.000" r="5" fill="#176786"/><text x="77" y="406" font-size="23" fill="#172b45" text-anchor="start">T / 2</text><circle cx="330.000" cy="561.000" r="5" fill="#176786"/><text x="290" y="602" font-size="23" fill="#172b45" text-anchor="start">3T / 4</text><text x="531" y="411" font-size="23" fill="#172b45" text-anchor="start">0 / T</text><g class="orbit-marker"><path d="M495.000,396.000 L495.000,296.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M495.000,396.000 L405.000,396.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><circle data-role="moving-body" cx="495" cy="396" r="11" fill="#176786" stroke="white" stroke-width="3"/></g><rect x="24" y="643" width="672" height="179" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="46" y="684" font-size="25" fill="#172b45" text-anchor="start">① 微分位置向量 → 速度：沿轨道切线</text><text x="46" y="733" font-size="25" fill="#172b45" text-anchor="start">② 再微分速度向量 → 加速度：指向地心</text><text x="46" y="780" font-size="23" fill="#172b45" text-anchor="start">只把“距地心的距离”求导，会丢掉转向的信息。</text><text x="36" y="869" font-size="22" fill="#172b45" text-anchor="start">教学圆轨道：8 秒映射一圈，箭头始终保持几何约束。</text><text x="36" y="914" font-size="22" fill="#172b45" text-anchor="start">只播放一次停回初态；减少动态效果时保留静态箭头。</text></svg>
