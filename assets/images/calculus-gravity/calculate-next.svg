<svg xmlns="http://www.w3.org/2000/svg" width="540" height="835.5" viewBox="0 0 540 835.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">速度Verlet法推进一个短时间步的示例</title><desc id="desc">初始位置1和0、速度0和1，引力参数为1，时间步0.2。先估计新位置0.98和0.20，再重算引力更新速度，并与解析圆轨道比较。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="834" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="49.80" font-size="20.2" fill="#172b45" text-anchor="start" font-weight="700">把“这一刻的引力”接到“下一刻的位置”</text><text x="36" y="92.45" font-size="17.5" fill="#172b45" text-anchor="start">归一化教学算例：GM = 1；一步时间 Δt = 0.2</text><rect x="24" y="131" width="672" height="170" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="168.32" font-size="19.0" fill="#172b45" text-anchor="start">① 读入初始条件</text><text x="46" y="216.32" font-size="19.0" fill="#176786" text-anchor="start">位置 (1, 0)；速度 (0, 1)</text><text x="46" y="261.52" font-size="16.7" fill="#172b45" text-anchor="start">知道在哪，还必须知道朝哪里、以多快在动。</text><path d="M360.000,305.000 L360.000,321.000" fill="none" stroke="#b77a09" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="24" y="330" width="672" height="170" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="367.32" font-size="19.0" fill="#172b45" text-anchor="start">② 按距离与方向计算引力</text><text x="46" y="415.32" font-size="19.0" fill="#176786" text-anchor="start">此刻加速度 a₀ = (-1, 0)</text><text x="46" y="460.52" font-size="16.7" fill="#172b45" text-anchor="start">箭头朝地心；不是只记一个“引力大小”。</text><path d="M360.000,504.000 L360.000,520.000" fill="none" stroke="#b77a09" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="24" y="529" width="672" height="170" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="566.32" font-size="19.0" fill="#172b45" text-anchor="start">③ 用短时间近似推进位置</text><text x="46" y="614.32" font-size="19.0" fill="#176786" text-anchor="start">新位置≈(0.98000, 0.20000)</text><text x="46" y="659.52" font-size="16.7" fill="#172b45" text-anchor="start">位置增量：v₀ Δt + ½ a₀ Δt²</text><path d="M360.000,703.000 L360.000,719.000" fill="none" stroke="#b77a09" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="24" y="728" width="672" height="170" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="46" y="765.32" font-size="19.0" fill="#172b45" text-anchor="start">④ 新位置重算引力，再更新速度</text><text x="46" y="813.32" font-size="19.0" fill="#176786" text-anchor="start">新速度≈(-0.19794, 0.98001)</text><text x="46" y="858.52" font-size="16.7" fill="#172b45" text-anchor="start">使用步首与步尾加速度的平均值更新。</text><text x="36" y="979.39" font-size="18.2" fill="#172b45" text-anchor="start">解析圆轨道同一时刻：(0.98007, 0.19867)</text><text x="36" y="1025.52" font-size="16.7" fill="#b34039" text-anchor="start">并不完全相同！有限步长算法是近似，不是微积分本身。</text><text x="36" y="1070.52" font-size="16.7" fill="#172b45" text-anchor="start">采用速度 Verlet 法；单位经过缩放，不是秒与千米。</text></g></svg>
