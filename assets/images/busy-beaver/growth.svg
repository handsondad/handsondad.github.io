<svg xmlns="http://www.w3.org/2000/svg" width="760" height="354" viewBox="0 0 760 354" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">平方、指数、阶乘精确表与指数反超高次多项式的对数图</title>
<desc id="desc">左表列出n从1到8的n²、2ⁿ、n!精确值；右图在对数坐标下展示2ⁿ的直线增长在n=997处反超弯曲放缓的n¹⁰⁰。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="353" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">三种常规增长的精确对比，以及为什么指数迟早反超 n¹⁰⁰</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">左：n 从 1 到 8 的精确值；右：取对数位数（log₁₀）看大趋势——n¹⁰⁰ 越走越平，2ⁿ 按固定斜率一路笔直爬升。</text>
<rect x="20" y="62" width="354" height="276" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.2" fill="#0f172a" text-anchor="start" font-weight="600">① 前 8 项精确表：n=4 起阶乘反超，n=5 起指数超平方</text>
<text x="56" y="108" font-size="11.8" fill="#64748b" text-anchor="middle" font-weight="700">n</text>
<text x="126" y="108" font-size="11.8" fill="#64748b" text-anchor="middle" font-weight="700">n²</text>
<text x="214" y="108" font-size="11.8" fill="#64748b" text-anchor="middle" font-weight="700">2ⁿ</text>
<text x="314" y="108" font-size="11.8" fill="#64748b" text-anchor="middle" font-weight="700">n!</text>
