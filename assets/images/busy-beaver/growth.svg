<circle cx="668.3" cy="142.2" r="4.5" fill="#1d6fa5"/>
<text x="660.3" y="132.2" font-size="10.8" fill="#1d6fa5" text-anchor="end" font-weight="700" class="halo">交点 n≈997（约 300 位数）</text>
<text x="529.0" y="157.0" font-size="11" fill="#c25014" text-anchor="start" font-weight="600" class="halo">n¹⁰⁰（对数越走越缓）</text>
<text x="619.0" y="210.0" font-size="11" fill="#1d6fa5" text-anchor="start" font-weight="600" class="halo">2ⁿ（对数直线上升）</text>
<text x="404" y="310" font-size="11" fill="#1e293b" text-anchor="start">直觉：n 每翻一倍，n¹⁰⁰ 只乘固定的 2¹⁰⁰；而 2ⁿ 直接变成自己的平方！</text>
<text x="404" y="327" font-size="10.5" fill="#64748b" text-anchor="start">注：右图纵轴为十进制对数坐标（log₁₀ 值），以便同屏展示几百位大数。</text>
</svg>
