<svg xmlns="http://www.w3.org/2000/svg" width="760" height="322" viewBox="0 0 760 322" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">停机问题自指反证流程图</title>
<desc id="desc">将对角机器D自身的图纸喂入D，内部的假想停机判定器H若预测会停则D进入死循环，若预测不停则D立刻停机，两条分支均导出矛盾。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="321" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">图灵停机问题的自指死结：如果真有“万能停机预言家 H”，把它装进杠精机器 D 里会怎样？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">对角机器 D 专门跟预言家 H 拧着干：H 猜会停它就死循环，H 猜不停它就立刻停——然后把 D 自己的图纸喂给 D！</text>
<rect x="148" y="72" width="464" height="206" rx="12" fill="#ffffff" stroke="#1d6fa5" stroke-width="1.8" stroke-dasharray="6 4"/>
<rect x="162.0" y="82.0" width="198" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="261.0" y="97.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">对角“杠精”机器 D 的内部电路</text>
<rect x="20" y="146" width="106" height="58" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.5"/>
<text x="73" y="170" font-size="12" fill="#c25014" text-anchor="middle" font-weight="700">喂入图纸 ⟨D⟩</text>
<text x="73" y="189" font-size="10.5" fill="#1e293b" text-anchor="middle">（D自己的代码）</text>
<line x1="126" y1="175" x2="180" y2="175" stroke="#c25014" stroke-width="1.8" marker-end="url(#arr-orange)"/>
<rect x="184" y="134" width="156" height="82" rx="9" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.6"/>
<text x="262" y="160" font-size="12.2" fill="#1d6fa5" text-anchor="middle" font-weight="700">假想的万能判定器 H</text>
<text x="262" y="180" font-size="11.2" fill="#1e293b" text-anchor="middle">先预测：D 读 ⟨D⟩</text>
<text x="262" y="198" font-size="11.2" fill="#1e293b" text-anchor="middle">最终会不会停机？</text>
<path d="M340,155 L418,122" fill="none" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<text x="376" y="126" font-size="10.8" fill="#c25014" text-anchor="middle" font-weight="600" class="halo">若 H 答“会停”</text>
<rect x="422" y="96" width="170" height="50" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="507" y="118" font-size="11.8" fill="#0f172a" text-anchor="middle" font-weight="700">D 故意走进死循环 ∞</text>
<text x="507" y="136" font-size="11" fill="#c25014" text-anchor="middle" font-weight="600">实际结果：永不停机！</text>
<line x1="592" y1="121" x2="626" y2="121" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<rect x="630.0" y="108.0" width="108" height="26" rx="13.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="684.0" y="125.7" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">打脸矛盾 ✗</text>
<path d="M340,195 L418,228" fill="none" stroke="#18794e" stroke-width="1.6" marker-end="url(#arr-green)"/>
<text x="376" y="228" font-size="10.8" fill="#18794e" text-anchor="middle" font-weight="600" class="halo">若 H 答“不停”</text>
<rect x="422" y="204" width="170" height="50" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="507" y="226" font-size="11.8" fill="#0f172a" text-anchor="middle" font-weight="700">D 当场踩刹车停机！</text>
<text x="507" y="244" font-size="11" fill="#18794e" text-anchor="middle" font-weight="600">实际结果：立刻停了！</text>
<line x1="592" y1="229" x2="626" y2="229" stroke="#18794e" stroke-width="1.6" marker-end="url(#arr-green)"/>
<rect x="630.0" y="216.0" width="108" height="26" rx="13.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="684.0" y="233.7" font-size="12" fill="#c25014" text-anchor="middle" font-weight="600">打脸矛盾 ✗</text>
<text x="24" y="304" font-size="11.8" fill="#0f172a" text-anchor="start" font-weight="600">结论：无论 H 回答“会停”还是“不停”都当场自相矛盾 ⇒ 世上绝不存在通杀所有程序的停机判定器 H。</text>
</svg>
