<text x="470" y="430" font-size="24" fill="#172b45" text-anchor="start">B</text>
<rect x="24" y="456" width="672" height="54" rx="16" fill="#fff" stroke="#c9d6df" stroke-width="2"/>
<text x="48" y="492" font-size="24" fill="#176786" text-anchor="start">6</text>
<rect x="110" y="464" width="58" height="38" rx="8" fill="#d9eef5" stroke="#176786" stroke-width="3"/>
<text x="139" y="491" font-size="22" fill="#172b45" text-anchor="middle">1</text>
