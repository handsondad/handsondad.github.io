<text x="349" y="491" font-size="22" fill="#172b45" text-anchor="middle">1</text>
<text x="470" y="492" font-size="24" fill="#ad4f16" text-anchor="start">停机</text>
<rect class="scan" x="28" y="148" width="664" height="50" rx="12" fill="none" stroke="#ad4f16" stroke-width="4"/>
<text x="36" y="548" font-size="22" fill="#172b45" text-anchor="start">橙格是这一步结束时读写头所在的格子。</text>
<text x="36" y="582" font-size="22" fill="#172b45" text-anchor="start">A 读 0：写 1，向右，到 B。A 读 1：写 1，向左，到 B。</text>
<text x="36" y="616" font-size="22" fill="#172b45" text-anchor="start">B 读 0：写 1，向左，到 A。B 读 1：写 1，向右，停机。</text>
<text x="36" y="650" font-size="22" fill="#176786" text-anchor="start">停机时有 4 个 1，共六步。文献里的最大值也是这两项。</text>
</svg>
