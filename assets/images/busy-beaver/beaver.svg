<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">两状态忙碌海狸状态机与六步纸带运行图</title>
<desc id="desc">左侧画出状态A、B与停机的4条转移箭头；右侧列出第1至第6步结束时的纸带内容与读写头橙色位置，最终走6步留下4个1后停机。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
  .scan { animation: scan 5.4s linear 1 forwards; }
      @keyframes scan {
        0%, 14% { transform: translateY(0); }
        18%, 31% { transform: translateY(34px); }
        35%, 48% { transform: translateY(68px); }
        52%, 65% { transform: translateY(102px); }
        69%, 82% { transform: translateY(136px); }
        86%, 100% { transform: translateY(170px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .scan { animation: none; transform: translateY(170px); }
      }
</style>
<rect x="0.5" y="0.5" width="759" height="349" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">两状态“忙碌海狸”冠军机：左边看状态说明书，右边一步步跟完 6 步停机</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">纸带起初全为 0，从状态 A 出发。橙框依次扫过 6 步并停在最后一行（最终留下 4 个 1，恰为两状态理论上限）。</text>
<rect x="20" y="62" width="312" height="272" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="84" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">① 状态转移图（共 4 条指令）</text>
<circle cx="88" cy="158" r="24" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.8"/>
<text x="88" y="163" font-size="14" fill="#1d6fa5" text-anchor="middle" font-weight="700">A</text>
<text x="88" y="124" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">起点↓</text>
<circle cx="246" cy="158" r="24" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.8"/>
<text x="246" y="163" font-size="14" fill="#1d6fa5" text-anchor="middle" font-weight="700">B</text>
<circle cx="167" cy="268" r="24" fill="#fef1e8" stroke="#c25014" stroke-width="2.0"/>
<circle cx="167" cy="268" r="20" fill="none" stroke="#c25014" stroke-width="1.0"/>
<text x="167" y="273" font-size="12.5" fill="#c25014" text-anchor="middle" font-weight="700">停机</text>
<path d="M110,145 Q167,108 222,145" fill="none" stroke="#1d6fa5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="167" y="118" font-size="10.5" fill="#1d6fa5" text-anchor="middle" font-weight="600" class="halo">A读0→写1,右移</text>
<text x="167" y="132" font-size="10.5" fill="#1d6fa5" text-anchor="middle" class="halo">A读1→写1,左移</text>
<path d="M224,172 Q167,208 112,172" fill="none" stroke="#18794e" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="167" y="204" font-size="10.5" fill="#18794e" text-anchor="middle" font-weight="600" class="halo">B读0 → 写1,左移回A</text>
<path d="M236,181 Q222,232 192,256" fill="none" stroke="#c25014" stroke-width="1.6" marker-end="url(#arr-orange)"/>
<text x="248" y="232" font-size="10.5" fill="#c25014" text-anchor="middle" font-weight="700" class="halo">B读1 → 写1,右移停机!</text>
<text x="176" y="318" font-size="11" fill="#64748b" text-anchor="middle">手指顺着圆圈跳，就能算出右边每一步</text>
<rect x="346" y="62" width="394" height="272" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="362" y="84" font-size="12.4" fill="#0f172a" text-anchor="start" font-weight="600">② 纸带逐步记录（橙格 = 本步结束时读写头位置）</text>
<text x="374" y="106" font-size="11" fill="#64748b" text-anchor="middle">步</text>
<text x="488" y="106" font-size="11" fill="#64748b" text-anchor="middle">纸带四格（格号 −2, −1, 0, +1）</text>
<text x="668" y="106" font-size="11" fill="#64748b" text-anchor="middle">转入状态</text>
