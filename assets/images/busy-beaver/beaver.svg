<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">两状态忙碌海狸的六步</title>
<desc id="desc">一台两状态、符号为 0 和 1 的图灵机，从全 0 纸带出发。六步之后停机，纸带上留下四个 1。每行给出该步结束时的纸带和下一个状态。橙框依次移过六行并停在最后一行；减少动态效果时直接停在最后一行。这台机器的步数等于已知的两状态最大值，最大值本身的证明不在这张图里。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="720" height="700" fill="#f3f7fa"/>
<text x="36" y="46" font-size="32" fill="#172b45" text-anchor="start">两状态的海狸：六步后停下</text>
<text x="36" y="84" font-size="22" fill="#41576a" text-anchor="start">纸带开始全是 0。橙框只沿六行各停一次，最后留在停机行。</text>
<style>.scan{animation:scan 6s linear 1 forwards}@keyframes scan{0%{transform:translateY(0)}16%{transform:translateY(0)}20%{transform:translateY(62px)}32%{transform:translateY(62px)}36%{transform:translateY(124px)}48%{transform:translateY(124px)}52%{transform:translateY(186px)}64%{transform:translateY(186px)}68%{transform:translateY(248px)}80%{transform:translateY(248px)}84%{transform:translateY(310px)}100%{transform:translateY(310px)}}@media(prefers-reduced-motion:reduce){.scan{animation:none;transform:translateY(310px)}}</style>
<text x="48" y="128" font-size="20" fill="#41576a" text-anchor="start">步</text>
<text x="110" y="128" font-size="20" fill="#41576a" text-anchor="start">纸带</text>
<text x="430" y="128" font-size="20" fill="#41576a" text-anchor="start">结束后</text>
