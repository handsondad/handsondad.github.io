<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">三段式合成图灵机证明忙碌海狸最终支配一切可计算函数</title>
<desc id="desc">上方串联写数器（约log₂n状态）、计算F(n)的固定程序（c状态）与空转模块，使总步数大于F(n)；下方对比状态预算k(n)=c+O(log₂n)在大n时小于总配额n，推出S(n)&gt;f(n)。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="335" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">忙碌海狸 S(n) 为什么能超过一切可计算函数 f(n)？拼装一台“三段式合成机器”</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">关键账本：算出巨大数值 F(n) 并不需要很多状态——写下输入 n 只要约 log₂n 个状态，程序本身更是固定常数 c！</text>
<rect x="20" y="66" width="720" height="128" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="88" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">① 从全 0 空白纸带出发，把三个模块串成一台一定会停的图灵机：</text>
<rect x="36" y="102" width="210" height="78" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.3"/>
<text x="48" y="122" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">模块 A：写数器</text>
<text x="48" y="142" font-size="11.2" fill="#1e293b" text-anchor="start">在空白纸带上印出二进制 n</text>
<text x="48" y="164" font-size="11.2" fill="#1d6fa5" text-anchor="start" font-weight="700">状态开销 ≈ log₂ n</text>
<rect x="274" y="102" width="210" height="78" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1.3"/>
<text x="286" y="122" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">模块 B：运行 F 的程序</text>
<text x="286" y="142" font-size="11.2" fill="#1e293b" text-anchor="start">算出 F(n) = max{f(0)…f(n)}</text>
<text x="286" y="164" font-size="11.2" fill="#18794e" text-anchor="start" font-weight="700">状态开销 = 固定常数 c</text>
<rect x="512" y="102" width="210" height="78" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="524" y="122" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">模块 C：倒计时空转</text>
<text x="524" y="142" font-size="11.2" fill="#1e293b" text-anchor="start">照着算出的 F(n) 多空转几步再停</text>
<text x="524" y="164" font-size="11.2" fill="#c25014" text-anchor="start" font-weight="700">总运行步数严格 &gt; F(n)</text>
<line x1="246" y1="141" x2="270" y2="141" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-muted)"/>
<line x1="484" y1="141" x2="508" y2="141" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-muted)"/>
<rect x="20" y="206" width="720" height="114" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="36" y="228" font-size="12.6" fill="#0f172a" text-anchor="start" font-weight="600">② 算一算状态预算：当 n 足够大时，c + O(log₂ n) 远远小于可用配额 n！</text>
<text x="36" y="257" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">合成机器状态数 k(n)</text>
<rect x="176" y="242" width="110" height="22" rx="4" fill="#e7f6ee" stroke="#18794e" stroke-width="1.2"/>
<text x="231" y="257" font-size="11" fill="#18794e" text-anchor="middle" font-weight="600">固定程序 c</text>
<rect x="288" y="242" width="96" height="22" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="336" y="257" font-size="11" fill="#1d6fa5" text-anchor="middle" font-weight="600">+ O(log₂ n)</text>
<text x="36" y="290" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">忙碌海狸总配额 n</text>
<rect x="176" y="275" width="364" height="22" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.3"/>
<text x="358" y="290" font-size="11.2" fill="#c25014" text-anchor="middle" font-weight="600">n 越大，富余状态越多（k(n) ≤ n 永远成立）</text>
<rect x="552.0" y="254.0" width="174" height="30" rx="15.0" fill="#f1f5f9" stroke="#0f172a" stroke-width="1" stroke-opacity="0.35"/>
<text x="639.0" y="274.4" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600">S(n) ≥ S(k(n)) &gt; F(n) ≥ f(n)</text>
</svg>
