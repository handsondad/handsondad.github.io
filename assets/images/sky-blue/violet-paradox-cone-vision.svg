<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">太阳光谱与人眼SML三色视锥细胞破解天空为什么是天蓝色而非紫色的定量图解</title>
<desc id="desc">左图计算5772K太阳地面光谱乘以λ⁻⁴后的真实天空散射光谱，显示400纳米紫端受太阳光谱跌落压制且保留宽广的青绿黄长波尾巴；右图绘出人眼S蓝、M绿、L红视锥灵敏度曲线，阐明宽谱尾巴等比激励M与L视锥，使晴空同色异谱等价于474至476纳米单色蓝光加白光。</desc>
