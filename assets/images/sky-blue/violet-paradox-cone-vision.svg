<text x="572.1" y="116.8" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">M 绿</text>
<text x="618.5" y="116.8" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">L 红</text>
<text x="464.8" y="249.3" font-size="11.5" fill="#b91c1c" text-anchor="start" font-weight="600" class="halo">L紫端小峰</text>
<rect x="410" y="320" width="316" height="182" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="422" y="341" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">Smith (2005, AJP) 严格色度匹配结论：</text>
<text x="422" y="362" font-size="11.5" fill="#1e293b" text-anchor="start">• 怎样才显紫色？单色 400 nm 光触发 S 蓝 + L 小峰，</text>
<text x="422" y="381" font-size="11.5" fill="#1e293b" text-anchor="start">  且几乎不碰 M 绿（大脑把“蓝+微红、缺绿”译成紫）；</text>
<text x="422" y="401" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 天空宽谱尾巴同时等比垫高 M 绿和 L 红视锥！</text>
<text x="422" y="421" font-size="11.5" fill="#1e293b" text-anchor="start">• 在人类视网膜里，整片天空光精确同色异谱等价于：</text>
<rect x="422" y="430" width="292" height="30" rx="6" fill="#ffffff" stroke="#1d6fa5" stroke-width="1"/>
<text x="568" y="450" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">474–476 nm 纯正蓝光 ＋ 大量白光</text>
<text x="422" y="483" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">→ 所以是柔和清透的“非饱和天蓝”，而非深紫！</text>
</svg>
