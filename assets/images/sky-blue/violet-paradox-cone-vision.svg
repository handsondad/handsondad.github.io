<text x="198.8" y="241.0" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">真实天空散射光谱</text>
<text x="198.8" y="269.6" font-size="11.5" fill="#0f172a" text-anchor="start" class="halo">(含可观青绿黄长波尾巴!)</text>
<rect x="34" y="404" width="334" height="98" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="46" y="425" font-size="11.5" fill="#1e293b" text-anchor="start">• 太阳光峰值在 ~500 nm 蓝绿区，一进 400 nm 紫光区</text>
<text x="46" y="444" font-size="11.5" fill="#1e293b" text-anchor="start">  光子产率与高层透射率双双跳水，砍掉紫光先发优势；</text>
<text x="46" y="464" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 更关键：天空光并非单色紫光，而是拖着厚厚一条</text>
<text x="46" y="483" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">  青、绿、黄红连续宽谱尾巴（阴影区）冲进人眼！</text>
