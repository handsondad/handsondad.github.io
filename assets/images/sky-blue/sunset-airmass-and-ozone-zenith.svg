<text x="430" y="429" font-size="11.5" fill="#1e293b" text-anchor="start">• 正午竖穿臭氧层 (~3 mm STP)：仅吸 ~4%，无感；</text>
<text x="430" y="449" font-size="11.5" fill="#1e293b" text-anchor="start">• 日落阳光擦过 25 km 平流层切线，路径暴增数十倍，</text>
<text x="430" y="469" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  臭氧精准吞光 550–650 nm 橙黄光 → 日落天顶蓝</text>
<text x="430" y="488" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">  有 2/3 靠臭氧，日落后“蓝调时刻”几乎全靠臭氧！</text>
