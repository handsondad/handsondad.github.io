<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">日落38倍球壳大气质量透射光谱与胡尔伯特1953年臭氧查普伊吸收带守护黄昏天顶蓝图解</title>
<desc id="desc">左图精确计算AM=1、6、38时瑞利直射透射率，展示日落擦地斜穿38倍大气滤尽蓝光留下红霞；右图据Hulburt(1953)绘出臭氧500至700纳米查普伊吸收峰(600纳米处极值)，阐明日落与暮光时正头顶深蓝色有三分之二乃至全部归功于平流层臭氧吸收橙黄光。</desc>
