<text x="430" y="151" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">日落时正头顶本来会变成灰黄绿色，绝不会是深蓝！</text>
<text x="430" y="168" font-size="11.5" fill="#1e293b" text-anchor="start">是谁吃掉了头顶的橙黄红光？答案：平流层臭氧 O₃！</text>
