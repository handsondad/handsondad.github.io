<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">瑞利散射与米氏散射三类粒径颜色规律、乌云黑底光学厚度及地平线泛白原理图解</title>
<desc id="desc">左图对比0.3纳米氮氧分子(λ⁻⁴蓝天)、亚微米霾粒(灰白)与10微米云滴(λ⁰米氏散射白云)的尺度效应；右图解释雷雨乌云并非含脏污而是光学厚度超200导致阳光在云顶折返耗尽，以及平视地平线因多次散射重新混白的原因。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">三、粒子大小决定颜色命运：为什么天空湛蓝，朵云雪白，乌云却发黑？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">同样一束阳光：0.3 nm 分子挑着散射蓝光，10 μm 云滴全波段平权散射白光，厚云靠多次折返遮黑云底</text>
<rect x="20" y="64" width="362" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="76.0" width="334" height="22" rx="11.0" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-opacity="0.35"/>
<text x="201.0" y="91.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">A · 粒径跨越 5 个数量级：从挑色散射到全白散射</text>
<rect x="34" y="112" width="334" height="110" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.2"/>
<text x="46" y="135" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">① 空气分子 N₂ / O₂（直径 ~0.3 nm ≪ λ）</text>
<text x="46" y="157" font-size="11.5" fill="#1e293b" text-anchor="start">尺度参数 x = 2πr/λ ≈ 0.002 → 瑞利散射区</text>
<rect x="46" y="170" width="310" height="38" rx="6" fill="#ffffff" stroke="#1d6fa5" stroke-width="0.9"/>
<text x="201" y="194" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">散射 ∝ λ⁻⁴：蓝光散射是红光近 5 倍 → 蔚蓝晴空</text>
<rect x="34" y="236" width="334" height="110" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
<text x="46" y="259" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="700">② 细霾与气溶胶微粒（粒径 0.1–0.5 μm ≈ λ）</text>
<text x="46" y="281" font-size="11.5" fill="#1e293b" text-anchor="start">尺度参数 x ≈ 1–4 → 瑞利向米氏过渡区</text>
<rect x="46" y="294" width="310" height="38" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="0.9"/>
<text x="201" y="318" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">散射 ∝ λ⁻¹·³：波长偏好大减 → 天空变灰白乳浊</text>
<rect x="34" y="360" width="334" height="110" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/>
<text x="46" y="383" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">③ 云滴与雾滴小水珠（半径 5–20 μm ≫ λ）</text>
<text x="46" y="405" font-size="11.5" fill="#1e293b" text-anchor="start">尺度参数 x ≈ 60–250 → 米氏几何散射平台 (Q≈2)</text>
<rect x="46" y="418" width="310" height="38" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="0.9"/>
<text x="201" y="442" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">散射 ∝ λ⁰：红橙黄绿蓝紫平权散射 → 洁白朵云！</text>
<rect x="396" y="64" width="344" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="410.0" y="76.0" width="316" height="22" rx="11.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="568.0" y="91.0" font-size="12" fill="#475569" text-anchor="middle" font-weight="600">B · 薄云雪白 vs 乌云黑底 &amp; 地平线泛白</text>
<rect x="410" y="112" width="150" height="224" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="485" y="132" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="700">晴天薄积云 (~300m)</text>
<text x="485" y="150" font-size="11.5" fill="#64748b" text-anchor="middle">光学厚度 τ ≈ 10–20</text>
<line x1="485" y1="160" x2="485" y2="184" stroke="#b45309" stroke-width="2.4"/>
<rect x="426" y="188" width="118" height="72" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
<text x="485" y="220" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">10 μm 纯净水滴</text>
<text x="485" y="239" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="600">全波段散射充足</text>
<line x1="473.0" y1="262" x2="461.0" y2="296" stroke="#b45309" stroke-width="2.0"/>
<line x1="485.0" y1="262" x2="485.0" y2="296" stroke="#b45309" stroke-width="2.0"/>
<line x1="497.0" y1="262" x2="509.0" y2="296" stroke="#b45309" stroke-width="2.0"/>
<text x="485" y="318" font-size="11.5" fill="#18794e" text-anchor="middle" font-weight="700">云底明亮洁白！</text>
<rect x="574" y="112" width="152" height="224" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="650" y="132" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">雷雨厚积雨云 (&gt;5km)</text>
<text x="650" y="150" font-size="11.5" fill="#64748b" text-anchor="middle">光学厚度 τ &gt; 200</text>
<line x1="636" y1="160" x2="644" y2="182" stroke="#b45309" stroke-width="2.4"/>
<line x1="656" y1="182" x2="672" y2="160" stroke="#b45309" stroke-width="2.2"/>
<rect x="590" y="184" width="120" height="38" rx="14" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
<text x="650" y="207" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">云顶依然雪白刺眼</text>
<rect x="590" y="218" width="120" height="56" rx="12" fill="#334155" stroke="#1e293b" stroke-width="1.3"/>
<text x="650" y="243" font-size="11.5" fill="#f8fafc" text-anchor="middle">光线经上百次折返</text>
<text x="650" y="262" font-size="11.5" fill="#fde68a" text-anchor="middle" font-weight="700">穿透到底不足 2%！</text>
<line x1="650" y1="276" x2="650" y2="296" stroke="#475569" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="650" y="318" font-size="11.5" fill="#b91c1c" text-anchor="middle" font-weight="700">并非脏，是没光透下！</text>
<rect x="410" y="350" width="316" height="142" rx="8" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.1"/>
<text x="422" y="372" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">顺手解开：为什么万里无云时，天边却泛白？</text>
<text x="422" y="394" font-size="11.5" fill="#1e293b" text-anchor="start">• 抬头看天顶：只穿 1 倍大气，单次散射蓝光最纯；</text>
<text x="422" y="415" font-size="11.5" fill="#1e293b" text-anchor="start">• 平视看地平线：斜穿几十倍底层浓密空气与水汽，</text>
<text x="422" y="436" font-size="11.5" fill="#1e293b" text-anchor="start">  蓝光在半路遭遇“多次散射”损耗，而红绿长波散射</text>
<text x="422" y="457" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  一路累加追平，各色光重新混成乳白浅蓝色！</text>
</svg>
