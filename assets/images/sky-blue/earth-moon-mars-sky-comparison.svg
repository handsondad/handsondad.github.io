<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">月球地球火星三颗星球白昼与日落天空色彩对比及火星微尘米氏前向散射蓝日落原理图解</title>
<desc id="desc">上图对比月球真空黑空、地球氮氧瑞利散射蓝天红日落与火星1至1.5微米氧化铁微尘焦糖黄天蓝日落；下图精确计算贝塞尔J₁前向散射峰，显示450纳米蓝光在落日视角±5度内前向散射峰比670纳米红光高且窄逾两倍。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="529" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">五、放眼太阳系三颗星球：为什么月球正午漆黑，火星却是“黄天配蓝日落”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">同一轮太阳照耀下：大气有无与微粒尺寸彻底改写散射相函数，让地球与火星上演完美反转</text>
<rect x="20" y="64" width="228" height="268" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="32.0" y="76.0" width="204" height="22" rx="11.0" fill="#f1f5f9" stroke="#475569" stroke-width="1" stroke-opacity="0.35"/>
<text x="134.0" y="91.0" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="600">月球 · 超高真空 (~10⁻¹⁵ bar)</text>
<rect x="34" y="108" width="200" height="44" rx="6" fill="#090d16"/>
<rect x="34" y="144" width="200" height="40" rx="6" fill="#1e293b"/>
<circle cx="134" cy="164" r="11" fill="#ffffff"/>
<text x="134" y="128" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">正午黑空 + 刺眼白日</text>
<text x="34" y="206" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">• 散射介质：零大气分子、零悬浮尘</text>
<text x="34" y="228" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">• 白昼天空：毫无侧向散射 → 漆黑</text>
<text x="34" y="250" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">  （遮住强光眩光即可在白天看星星）</text>
<text x="34" y="272" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">• 日落景观：无晨昏蒙影，明暗立切</text>
<rect x="266" y="64" width="228" height="268" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="278.0" y="76.0" width="204" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="380.0" y="91.0" font-size="11.5" fill="#1d6fa5" text-anchor="middle" font-weight="600">地球 · 1 bar 氮氧大气</text>
<rect x="280" y="108" width="200" height="44" rx="6" fill="#2563eb"/>
<rect x="280" y="144" width="200" height="40" rx="6" fill="#ea580c"/>
<circle cx="380" cy="164" r="11" fill="#fed7aa"/>
<text x="380" y="128" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">白天蔚蓝 → 日落火红</text>
<text x="280" y="206" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">• 散射主力：0.3 nm N₂ / O₂ 分子</text>
<text x="280" y="228" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">• 白昼天空：瑞利向四方散蓝 → 蔚蓝</text>
<text x="280" y="250" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">• 日落景观：蓝光沿途向两侧散尽，</text>
<text x="280" y="272" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">  穿透长路径直达人眼的只剩红橙光</text>
<rect x="512" y="64" width="228" height="268" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="524.0" y="76.0" width="204" height="22" rx="11.0" fill="#fef1e8" stroke="#c25014" stroke-width="1" stroke-opacity="0.35"/>
<text x="626.0" y="91.0" font-size="11.5" fill="#c25014" text-anchor="middle" font-weight="600">火星 · 0.006 bar CO₂ + 铁锈尘</text>
<rect x="526" y="108" width="200" height="44" rx="6" fill="#c2854c"/>
<rect x="526" y="144" width="200" height="40" rx="6" fill="#3b82f6"/>
<circle cx="626" cy="164" r="11" fill="#dbeafe"/>
<text x="626" y="128" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">白天焦糖黄 → 日落泛冷蓝！</text>
<text x="526" y="206" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">• 散射主力：r ≈ 1–1.5 μm 氧化铁尘</text>
<text x="526" y="228" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">• 白昼天空：尘埃吸蓝散红 → 奶油黄</text>
<text x="526" y="250" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">• 日落反转（好奇号 2015 实拍）：</text>
<text x="526" y="272" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="700">  微尘把蓝光聚在太阳旁窄前向锥内！</text>
<rect x="20" y="344" width="720" height="172" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="356.0" width="476" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="272.0" y="371.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">C · 火星蓝色日落物理揭秘：1.2 μm 尘埃的米氏近前向散射峰 (θ ∈ [−20°, +20°])</text>
<line x1="56" y1="484" x2="386" y2="484" stroke="#0f172a" stroke-width="1.3"/>
<line x1="221.0" y1="398" x2="221.0" y2="484" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="56.0" y="499" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">-20°</text>
<text x="138.5" y="499" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">-10°</text>
<text x="221.0" y="499" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">0°</text>
<text x="303.5" y="499" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">10°</text>
<text x="386.0" y="499" font-size="11.5" fill="#64748b" text-anchor="middle" class="mono">20°</text>
<text x="221.0" y="514" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="700">偏离落日圆盘视角 θ</text>
