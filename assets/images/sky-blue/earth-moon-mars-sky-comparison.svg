<text x="244.1" y="404.9" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700" class="halo">450nm 蓝：窄锥聚日盘</text>
<text x="266.4" y="453.0" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700" class="halo">670nm 红：宽角散全天</text>
<rect x="420" y="390" width="306" height="112" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="432" y="411" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">Lemmon (2015) &amp; Ehlers 等 (2014) 定量解释：</text>
<text x="432" y="432" font-size="11.5" fill="#1e293b" text-anchor="start">• 火星微尘半径 (~1.2 μm) 恰与可见光波长相当；</text>
<text x="432" y="452" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="700">• 蓝光波长短，前向衍射锥更窄、峰值高逾 2 倍，</text>
<text x="432" y="472" font-size="11.5" fill="#1e293b" text-anchor="start">  紧贴落日聚成冷蓝光晕；红黄散向大角度染黄全天！</text>
</svg>
