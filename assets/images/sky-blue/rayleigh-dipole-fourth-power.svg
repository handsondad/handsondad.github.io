<text x="228.0" y="344" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="700">90° 散射光：强线偏振！</text>
<text x="228.0" y="363" font-size="11.5" fill="#1e293b" text-anchor="start">转偏振墨镜明暗剧变</text>
<text x="204.0" y="384" font-size="11.5" fill="#0f172a" text-anchor="end" font-weight="700">地面人眼</text>
