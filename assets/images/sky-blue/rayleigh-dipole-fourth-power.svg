<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">一、瑞利散射的四次方铁律：为什么波长短一截，散射本领暴涨好几倍？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">0.3 nm 氮氧分子电子云被阳光电场摇晃成偶极天线：加速度平方 × 功率平方 = 1/λ⁴</text>
<rect x="20" y="64" width="368" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="34.0" y="76.0" width="340" height="22" rx="11.0" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1" stroke-opacity="0.35"/>
<text x="204.0" y="91.0" font-size="12" fill="#1d6fa5" text-anchor="middle" font-weight="600">A · 分子偶极子天线 × 90° 线偏振几何</text>
<rect x="34" y="110" width="340" height="82" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.1"/>
<text x="46" y="131" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">为什么偏偏反比于波长四次方（I ∝ 1/λ⁴）？</text>
<text x="46" y="152" font-size="11.5" fill="#1d6fa5" text-anchor="start" font-weight="600">① 弹簧电子受迫加速度 a = −ω²x ∝ 1/λ²（快2倍→a大4倍）</text>
<text x="46" y="173" font-size="11.5" fill="#c25014" text-anchor="start" font-weight="700">② 偶极辐射光强 I ∝ |E|² ∝ a² ∝ (1/λ²)² = 1/λ⁴！</text>
