<text x="46" y="419" font-size="11.5" fill="#0f766e" text-anchor="start" font-weight="700">爱因斯坦 (1910) 关键补丁：为什么均匀空气不漆黑？</text>
<text x="46" y="440" font-size="11.5" fill="#1e293b" text-anchor="start">• 若气体分子像完美晶格静止排列，侧向散射波两两反相</text>
<text x="46" y="459" font-size="11.5" fill="#1e293b" text-anchor="start">  完全抵消为零！正是分子热运动制造微米级“密度涨落”，</text>
<text x="46" y="478" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="700">  才漏出瑞利散射（甚至能靠蓝天亮度算出阿伏伽德罗常数）！</text>
<rect x="402" y="64" width="338" height="442" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<rect x="416.0" y="76.0" width="310" height="22" rx="11.0" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1" stroke-opacity="0.35"/>
