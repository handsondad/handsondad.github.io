<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="735" viewBox="0 0 1000 735" role="img" aria-labelledby="title desc">
<title id="title">三个有理数问题区分1.4142与根号二</title><desc id="desc">前两次比较一致，第三个有理数1.41421位于1.4142与根号二之间。底部是明确标出窗口范围的局部线性数轴。有限实验不是相等证明。</desc>
<style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.s1{animation:r1 4.5s steps(1,end) 1 both}
.s2{animation:r2 4.5s steps(1,end) 1 both}
.s3{animation:r3 4.5s steps(1,end) 1 both}
@keyframes r1{0%,9%{opacity:0}10%,100%{opacity:1}}
@keyframes r2{0%,34%{opacity:0}35%,100%{opacity:1}}
@keyframes r3{0%,64%{opacity:0}65%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.s1,.s2,.s3,.spinner{animation:none}}
</style>
<rect width="1000" height="735" rx="20" fill="#faf8f3"/>
<text x="500" y="48" text-anchor="middle" font-size="28" fill="#20334d" font-weight="700">用有理数提问：先分不出，再找到分界</text><text x="500" y="86" text-anchor="middle" font-size="20" fill="#20334d">x = 1.4142，y = √2；每一行只展示一次比较，不是无限检验</text><g class="s1"><rect x="42" y="116" width="916" height="104" rx="14" fill="#eef2f8"/><text x="66" y="153" text-anchor="start" font-size="23" fill="#20334d" font-weight="700">① 问：比 1.4 大吗？</text><text x="550" y="153" text-anchor="middle" font-size="22" fill="#1e6e9a">x：大于</text><text x="790" y="153" text-anchor="middle" font-size="22" fill="#8750a7">y：大于</text><text x="66" y="194" text-anchor="start" font-size="20" fill="#20334d">这道问题分不出它们。</text></g><g class="s2"><rect x="42" y="235" width="916" height="104" rx="14" fill="#eef2f8"/><text x="66" y="272" text-anchor="start" font-size="23" fill="#20334d" font-weight="700">② 问：比 1.415 小吗？</text><text x="550" y="272" text-anchor="middle" font-size="22" fill="#1e6e9a">x：小于</text><text x="790" y="272" text-anchor="middle" font-size="22" fill="#8750a7">y：小于</text><text x="66" y="313" text-anchor="start" font-size="20" fill="#20334d">第二次仍然分不出。</text></g><g class="s3"><rect x="42" y="354" width="916" height="104" rx="14" fill="#eef2f8"/><text x="66" y="391" text-anchor="start" font-size="23" fill="#20334d" font-weight="700">③ 问：比 1.41421 小吗？</text><text x="550" y="391" text-anchor="middle" font-size="22" fill="#1e6e9a">x：小于</text><text x="790" y="391" text-anchor="middle" font-size="22" fill="#8750a7">y：大于</text><text x="66" y="432" text-anchor="start" font-size="20" fill="#20334d">终于找到一个区分它们的有理数。</text></g><text x="500" y="523" text-anchor="middle" font-size="20" fill="#20334d">放大窗口：[1.41420, 1.41422]，不是从 0 开始的数轴</text><path d="M120 568 L880 568" fill="none" stroke="#20334d" stroke-width="3"/><path d="M120.0 560 L120.0 577" fill="none" stroke="#20334d" stroke-width="2"/><text x="120.0" y="610" text-anchor="middle" font-size="21" fill="#20334d" font-weight="700">x = 1.4142</text><path d="M500.00000000248946 560 L500.00000000248946 577" fill="none" stroke="#20334d" stroke-width="2"/><text x="500.00000000248946" y="548" text-anchor="middle" font-size="21" fill="#20334d" font-weight="700">r = 1.41421</text><path d="M635.3701776192677 560 L635.3701776192677 577" fill="none" stroke="#20334d" stroke-width="2"/><text x="635.3701776192677" y="610" text-anchor="middle" font-size="21" fill="#20334d" font-weight="700">y = √2</text><text x="500" y="659" text-anchor="middle" font-size="24" fill="#20334d" font-weight="700">r² = 1.9999899241 ＜ 2，所以 x ＜ r ＜ √2</text><text x="500" y="700" text-anchor="middle" font-size="19" fill="#20334d">有限次回答相同不能证明相等；所有有理数的比较关系才是定义的关键。</text>
</svg>
