<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">零乳糖牛奶不加蔗糖却变甜数倍的水解化学计量与相对甜度对比图</title>
<desc id="desc">左图核算100毫升牛奶中4.80克乳糖(甜度0.16)结合0.25克水酶解为2.53克葡萄糖(甜度0.74)与2.53克半乳糖(甜度0.32至0.65)，零外加糖且总热量不变；右图对比六种常见糖相对甜度，展示甜感由0.77克跃升至2.68至3.51克蔗糖当量(约3.5至4.6倍)。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="439" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">配料表明明“0 添加蔗糖”，为什么零乳糖牛奶（舒化奶）喝着甜了好几倍？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">秘密藏在分子甜度表里：乳糖原本是“最不甜的糖 (0.16)”，被乳糖酶剪成两颗单糖后甜度瞬间释放 3.5–4.5 倍！</text>
<rect x="20" y="62" width="352" height="366" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="34" y="85" font-size="13.5" fill="#1d6fa5" text-anchor="start" font-weight="700">① 100 mL 牛奶酶解前后质量账（0 克外加糖！）</text>
<rect x="34" y="100" width="324" height="78" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
<text x="46" y="120" font-size="10.1" fill="#0f172a" text-anchor="start" font-weight="700">酶解前（普通纯牛奶 100 mL）：</text>
<text x="46" y="141" font-size="9.6" fill="#1e293b" text-anchor="start">• 天然乳糖 = 4.80 g（14.0 mmol），相对甜度仅 0.16</text>
<text x="46" y="161" font-size="9.6" fill="#64748b" text-anchor="start" font-weight="600">• 折合白砂糖甜感：4.80 × 0.16 ≈ 0.77 g（所以纯奶尝着很淡！）</text>
<line x1="196.0" y1="182.0" x2="196.0" y2="214.0" stroke="#18794e" stroke-width="2.2" marker-end="url(#arr-green)"/>
<rect x="64.0" y="185.0" width="264" height="22" rx="11.0" fill="#e7f6ee" stroke="#18794e" stroke-width="1" stroke-opacity="0.35"/>
<text x="196.0" y="200.0" font-size="9.4" fill="#18794e" text-anchor="middle" font-weight="600">+ 0.25 g 水分子 | 中性酵母乳糖酶 (Kluyveromyces)</text>
<rect x="34" y="220" width="324" height="104" rx="8" fill="#e7f6ee" stroke="#18794e" stroke-width="1"/>
<text x="46" y="240" font-size="10.1" fill="#18794e" text-anchor="start" font-weight="700">酶解后（0乳糖牛奶 100 mL）：</text>
<text x="46" y="261" font-size="9.4" fill="#0f172a" text-anchor="start" font-weight="600">• D-葡萄糖 = 2.53 g（甜度 0.74）+ D-半乳糖 = 2.53 g（甜度 0.32–0.65）</text>
<text x="46" y="281" font-size="9.5" fill="#c25014" text-anchor="start" font-weight="700">• 折合白砂糖甜感跃升至：2.68–3.51 g（舌尖甜感暴涨 3.5–4.6 倍！）</text>
<text x="46" y="303" font-size="9.3" fill="#1e293b" text-anchor="start">• 总碳水化合物质量略增 5.3%（嵌入了水分子），总热量完全相等！</text>
<rect x="34" y="336" width="324" height="78" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
<text x="46" y="356" font-size="9.9" fill="#b45309" text-anchor="start" font-weight="700">两个顺带看懂的厨房化学彩蛋：</text>
<text x="46" y="376" font-size="9.1" fill="#1e293b" text-anchor="start">1. 游离单糖还原端翻倍，超高温灭菌 (UHT) 时轻微美拉德反应略带焦香；</text>
<text x="46" y="395" font-size="9.1" fill="#1e293b" text-anchor="start">2. 无需消化直接经 SGLT1 入血，升糖指数 (GI) 比普通纯牛奶略高一点。</text>
<rect x="384" y="62" width="356" height="366" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="398" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">② 常见糖类相对甜度标尺（以蔗糖 = 1.00 为基准）</text>
<text x="398" y="124" font-size="9.5" fill="#1e293b" text-anchor="start" font-weight="400">果糖 (水果/蜂蜜)</text>
<rect x="548.0" y="110" width="166.0" height="20" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="110" width="160.5" height="20" rx="4" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="650" y="124" font-size="9.1" fill="#6d28d9" text-anchor="start" font-weight="700">1.45</text>
<text x="398" y="160" font-size="9.5" fill="#1e293b" text-anchor="start" font-weight="400">蔗糖 (日常白砂糖基准)</text>
<rect x="548.0" y="146" width="166.0" height="20" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="146" width="110.7" height="20" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
<text x="650" y="160" font-size="9.1" fill="#475569" text-anchor="start" font-weight="700">1.00</text>
<text x="398" y="196" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="700">D-葡萄糖 (乳糖剪开一半)</text>
<rect x="548.0" y="182" width="166.0" height="20" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="182" width="81.9" height="20" rx="4" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1.4"/>
<text x="635.9" y="196" font-size="9.1" fill="#1d6fa5" text-anchor="start" font-weight="700">0.74</text>
<text x="398" y="232" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="700">D-半乳糖 (乳糖剪开另一半)</text>
<rect x="548.0" y="218" width="166.0" height="20" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="218" width="71.9" height="20" rx="4" fill="#e7f6ee" stroke="#18794e" stroke-width="1.4"/>
<text x="625.9" y="232" font-size="9.1" fill="#18794e" text-anchor="start" font-weight="700">0.65 (0.32–0.65)</text>
<text x="398" y="268" font-size="9.5" fill="#1e293b" text-anchor="start" font-weight="400">麦芽糖 (淀粉初步水解)</text>
<rect x="548.0" y="254" width="166.0" height="20" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="254" width="43.2" height="20" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="597.2" y="268" font-size="9.1" fill="#b45309" text-anchor="start" font-weight="700">0.39</text>
<text x="398" y="304" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="700">乳糖 (牛奶原装双糖)</text>
<rect x="548.0" y="290" width="166.0" height="20" rx="4" fill="#f1f5f9"/>
<rect x="548.0" y="290" width="17.7" height="20" rx="4" fill="#fef1e8" stroke="#c25014" stroke-width="1.4"/>
<text x="571.7" y="304" font-size="9.1" fill="#c25014" text-anchor="start" font-weight="700">0.16</text>
<line x1="658.7" y1="104.0" x2="658.7" y2="320.0" stroke="#475569" stroke-width="1.1" stroke-dasharray="3,3"/>
<rect x="398" y="334" width="328" height="80" rx="8" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="410" y="354" font-size="9.5" fill="#0f172a" text-anchor="start" font-weight="700">同喝 1 盒 250 mL 纯奶，舌头味蕾 T1R2/T1R3 感受到的甜度：</text>
<text x="410" y="376" font-size="9.2" fill="#1e293b" text-anchor="start" font-weight="600">普通纯奶 (12g乳糖):</text>
<rect x="524" y="365" width="38" height="14" rx="3" fill="#cbd5e1" stroke="#475569"/>
<text x="568" y="376" font-size="9.1" fill="#475569" text-anchor="start" font-weight="700">≈ 1.9 g 白糖甜感</text>
<text x="410" y="399" font-size="9.2" fill="#c25014" text-anchor="start" font-weight="700">0乳糖奶 (酶解单糖):</text>
<rect x="524" y="388" width="142" height="14" rx="3" fill="#fdba74" stroke="#c25014" stroke-width="1.4"/>
<text x="672" y="399" font-size="9.1" fill="#dc2626" text-anchor="start" font-weight="700">≈ 6.7–8.8 g!</text>
</svg>
