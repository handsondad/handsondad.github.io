<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1220" viewBox="0 0 720 1220" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">用投影分量构造空间线段的真长</title><desc id="desc">空间线段三个分量为30、40、20毫米，前视长度约36.06、水平投影50；以50和20构造直角三角形得到真长约53.85毫米。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1220" fill="#f3f7fa"/><text x="36" y="49" font-size="29" fill="#172b45" text-anchor="start">⑥ 看着短了，不等于零件真的短了</text><text x="36" y="93" font-size="23" fill="#172b45" text-anchor="start">一条空间线段：Δx = 30，Δy = 40，Δz = 20。</text><text x="36" y="132" font-size="23" fill="#172b45" text-anchor="start">正投影只留下两个分量；以下坐标长度单位 mm。</text><rect x="24" y="180" width="672" height="255" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="219" font-size="24" fill="#176786" text-anchor="start">① 主视投影</text><path d="M100.000,393.000 L220.000,393.000 L220.000,313.000" fill="none" stroke="#8b9cab" stroke-width="2" stroke-dasharray="8 6"/><path d="M100.000,393.000 L220.000,313.000" fill="none" stroke="#b34039" stroke-width="3"/><text x="160.0" y="423" font-size="21" fill="#172b45" text-anchor="middle">30</text><text x="232" y="359.0" font-size="21" fill="#172b45" text-anchor="start">20</text><text x="352" y="320.5" font-size="21" fill="#172b45" text-anchor="start">√(30²+20²) ≈ 36.06</text><rect x="24" y="456" width="672" height="326" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="495" font-size="24" fill="#176786" text-anchor="start">② 俯视投影</text><path d="M100.000,740.000 L235.000,740.000 L235.000,560.000" fill="none" stroke="#8b9cab" stroke-width="2" stroke-dasharray="8 6"/><path d="M100.000,740.000 L235.000,560.000" fill="none" stroke="#b34039" stroke-width="3"/><text x="167.5" y="770" font-size="21" fill="#172b45" text-anchor="middle">30</text><text x="247.0" y="656.0" font-size="21" fill="#172b45" text-anchor="start">40</text><text x="352" y="632.0" font-size="21" fill="#172b45" text-anchor="start">√(30²+40²) = 50</text><rect x="24" y="824" width="672" height="255" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="863" font-size="24" fill="#176786" text-anchor="start">③ 以水平投影为底，再加入高度差</text><path d="M100.000,1037.000 L300.000,1037.000 L300.000,957.000" fill="none" stroke="#8b9cab" stroke-width="2" stroke-dasharray="8 6"/><path d="M100.000,1037.000 L300.000,957.000" fill="none" stroke="#b34039" stroke-width="3"/><text x="200.0" y="1067" font-size="21" fill="#172b45" text-anchor="middle">50</text><text x="312" y="1003.0" font-size="21" fill="#172b45" text-anchor="start">20</text><text x="352" y="964.5" font-size="21" fill="#172b45" text-anchor="start">真长 = √(50²+20²) ≈ 53.85</text><text x="36" y="1126" font-size="23" fill="#172b45" text-anchor="start">换到与线段平行的投影面，才能直接看到真长。</text><text x="36" y="1165" font-size="23" fill="#172b45" text-anchor="start">这个直角三角形是求真长的构造，不是零件又多了一条边。</text></svg>
