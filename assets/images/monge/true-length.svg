<svg xmlns="http://www.w3.org/2000/svg" width="540" height="915" viewBox="0 0 540 915" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">用投影分量构造空间线段的真长</title><desc id="desc">空间线段三个分量为30、40、20毫米，前视长度约36.06、水平投影50；以50和20构造直角三角形得到真长约53.85毫米。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="913.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑥ 看着短了，不等于零件真的短了</text><text x="36" y="91.45" font-size="17.5" fill="#172b45" text-anchor="start">一条空间线段：Δx = 30，Δy = 40，Δz = 20。</text><text x="36" y="130.45" font-size="17.5" fill="#172b45" text-anchor="start">正投影只留下两个分量；以下坐标长度单位 mm。</text><rect x="24" y="180" width="672" height="255" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="217.39" font-size="18.2" fill="#176786" text-anchor="start">① 主视投影</text><path d="M100.000,393.000 L220.000,393.000 L220.000,313.000" fill="none" stroke="#8b9cab" stroke-width="1.64" stroke-dasharray="8 6"/><path d="M100.000,393.000 L220.000,313.000" fill="none" stroke="#b34039" stroke-width="2.4"/><text x="160.0" y="421.59" font-size="16.0" fill="#172b45" text-anchor="middle">30</text><text x="232" y="357.59" font-size="16.0" fill="#172b45" text-anchor="start">20</text><text x="352" y="319.09" font-size="16.0" fill="#172b45" text-anchor="start">√(30²+20²) ≈ 36.06</text><rect x="24" y="456" width="672" height="326" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="493.39" font-size="18.2" fill="#176786" text-anchor="start">② 俯视投影</text><path d="M100.000,740.000 L235.000,740.000 L235.000,560.000" fill="none" stroke="#8b9cab" stroke-width="1.64" stroke-dasharray="8 6"/><path d="M100.000,740.000 L235.000,560.000" fill="none" stroke="#b34039" stroke-width="2.4"/><text x="167.5" y="768.59" font-size="16.0" fill="#172b45" text-anchor="middle">30</text><text x="247.0" y="654.59" font-size="16.0" fill="#172b45" text-anchor="start">40</text><text x="352" y="630.59" font-size="16.0" fill="#172b45" text-anchor="start">√(30²+40²) = 50</text><rect x="24" y="824" width="672" height="255" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="861.39" font-size="18.2" fill="#176786" text-anchor="start">③ 以水平投影为底，再加入高度差</text><path d="M100.000,1037.000 L300.000,1037.000 L300.000,957.000" fill="none" stroke="#8b9cab" stroke-width="1.64" stroke-dasharray="8 6"/><path d="M100.000,1037.000 L300.000,957.000" fill="none" stroke="#b34039" stroke-width="2.4"/><text x="200.0" y="1065.59" font-size="16.0" fill="#172b45" text-anchor="middle">50</text><text x="312" y="1001.59" font-size="16.0" fill="#172b45" text-anchor="start">20</text><text x="352" y="963.09" font-size="16.0" fill="#172b45" text-anchor="start">真长 = √(50²+20²) ≈ 53.85</text><text x="36" y="1124.45" font-size="17.5" fill="#172b45" text-anchor="start">换到与线段平行的投影面，才能直接看到真长。</text><text x="36" y="1163.45" font-size="17.5" fill="#172b45" text-anchor="start">这个直角三角形是求真长的构造，不是零件又多了一条边。</text></g></svg>
