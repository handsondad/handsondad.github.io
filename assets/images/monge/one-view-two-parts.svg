<svg xmlns="http://www.w3.org/2000/svg" width="540" height="691.5" viewBox="0 0 540 691.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">相同主视图不能唯一确定台阶深度</title><desc id="desc">两个尺寸相同而高台深度为20和10毫米的块，在主视图中都有相同外框和底厚分界线；轴测辅助图显示不同三维形状。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="690" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">② 正面看一样，零件却可以不同</text><text x="36" y="92.45" font-size="17.5" fill="#172b45" text-anchor="start">两个台阶块：总长 60、总深 40、总高 36，底厚 12。</text><rect x="24" y="124" width="672" height="314" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="164.32" font-size="19.0" fill="#176786" text-anchor="start">同一个主视图</text><rect x="180" y="233.0" width="270.0" height="162.0" fill="none" stroke="#172b45" stroke-width="3"/><path d="M180.000,341.000 L450.000,341.000" fill="none" stroke="#172b45" stroke-width="2.4"/><text x="491" y="304.45" font-size="17.5" fill="#172b45" text-anchor="start">总高 36</text><text x="491" y="355.45" font-size="17.5" fill="#172b45" text-anchor="start">底厚 12</text><polygon points="155.2085,516.9422 341.9751,582.3299 298.3833,613.4577 111.6167,548.0700" fill="#e4eff5" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="111.6167,548.0700 298.3833,613.4577 298.3833,692.4392 111.6167,627.0515" fill="#c9dde9" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="111.6167,627.0515 298.3833,692.4392 254.7915,723.5670 68.0249,658.1793" fill="#e4eff5" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="68.0249,658.1793 254.7915,723.5670 254.7915,763.0578 68.0249,697.6701" fill="#c9dde9" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="254.7915,763.0578 341.9751,700.8022 341.9751,582.3299 298.3833,613.4577 298.3833,692.4392 254.7915,723.5670" fill="#b7cfdf" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="453.4126,532.5061 640.1792,597.8938 640.1792,676.8753 453.4126,611.4876" fill="#c9dde9" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="475.2085,516.9422 661.9751,582.3299 640.1792,597.8938 453.4126,532.5061" fill="#e4eff5" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="453.4126,611.4876 640.1792,676.8753 574.7915,723.5670 388.0249,658.1793" fill="#e4eff5" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="388.0249,658.1793 574.7915,723.5670 574.7915,763.0578 388.0249,697.6701" fill="#c9dde9" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="574.7915,763.0578 661.9751,700.8022 661.9751,582.3299 640.1792,597.8938 640.1792,676.8753 574.7915,723.5670" fill="#b7cfdf" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><text x="205" y="475.39" font-size="18.2" fill="#176786" text-anchor="middle">A：高台深 20</text><text x="525" y="475.39" font-size="18.2" fill="#b34039" text-anchor="middle">B：高台深 10</text><text x="36" y="825.45" font-size="17.5" fill="#172b45" text-anchor="start">观察方向沿深度：位置不同的台阶前沿重叠了。</text><text x="36" y="864.45" font-size="17.5" fill="#172b45" text-anchor="start">这里只说明主视图有歧义；不是透视图或正式零件图。</text></g></svg>
