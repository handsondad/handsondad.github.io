<svg xmlns="http://www.w3.org/2000/svg" width="540" height="645" viewBox="0 0 540 645" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">蒙日与画法几何的历史路标</title><desc id="desc">从早期工程传统、1765年绘图工作，到1794至1795年教育实践、1799年著作出版及后续工程表达的发展。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="643.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">① 蒙日把空间问题变成可教的办法</text><rect x="24" y="84" width="672" height="110" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="117.45" font-size="17.5" fill="#176786" text-anchor="start">蒙日以前</text><text x="249" y="117.39" font-size="18.2" fill="#172b45" text-anchor="start">工匠、建筑与工程传统</text><text x="48" y="165.45" font-size="17.5" fill="#172b45" text-anchor="start">投影和空间作图已有长期积累。</text><rect x="24" y="210" width="672" height="110" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="243.45" font-size="17.5" fill="#176786" text-anchor="start">1765 起</text><text x="249" y="243.39" font-size="18.2" fill="#172b45" text-anchor="start">梅济耶尔工程学校</text><text x="48" y="291.45" font-size="17.5" fill="#172b45" text-anchor="start">蒙日从绘图工作走向空间几何方法。</text><rect x="24" y="336" width="672" height="110" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="369.45" font-size="17.5" fill="#176786" text-anchor="start">1794—1795</text><text x="249" y="369.39" font-size="18.2" fill="#172b45" text-anchor="start">工程教育与师范讲课</text><text x="48" y="417.45" font-size="17.5" fill="#172b45" text-anchor="start">把画法几何组织成可系统传授的课程。</text><rect x="24" y="462" width="672" height="110" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="495.45" font-size="17.5" fill="#176786" text-anchor="start">1799</text><text x="249" y="495.39" font-size="18.2" fill="#172b45" text-anchor="start">《画法几何》出版</text><text x="48" y="543.45" font-size="17.5" fill="#172b45" text-anchor="start">根据师范学校讲课内容整理。</text><rect x="24" y="588" width="672" height="110" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="621.45" font-size="17.5" fill="#176786" text-anchor="start">此后</text><text x="249" y="621.39" font-size="18.2" fill="#172b45" text-anchor="start">工程制图与数字模型</text><text x="48" y="669.45" font-size="17.5" fill="#172b45" text-anchor="start">投影之外，再加入尺寸、公差与制造信息。</text><text x="36" y="769.45" font-size="17.5" fill="#172b45" text-anchor="start">不是“蒙日一个人发明了所有机械制图规则”。</text><text x="36" y="808.45" font-size="17.5" fill="#172b45" text-anchor="start">他的重要贡献，是把表示与空间求解连成系统。</text></g></svg>
