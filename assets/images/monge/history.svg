<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">蒙日与画法几何的历史路标</title><desc id="desc">从早期工程传统、1765年绘图工作，到1794至1795年教育实践、1799年著作出版及后续工程表达的发展。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="860" fill="#f3f7fa"/><text x="36" y="49" font-size="29" fill="#172b45" text-anchor="start">① 蒙日把空间问题变成可教的办法</text><rect x="24" y="84" width="672" height="110" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="119" font-size="23" fill="#176786" text-anchor="start">蒙日以前</text><text x="249" y="119" font-size="24" fill="#172b45" text-anchor="start">工匠、建筑与工程传统</text><text x="48" y="167" font-size="23" fill="#172b45" text-anchor="start">投影和空间作图已有长期积累。</text><rect x="24" y="210" width="672" height="110" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="245" font-size="23" fill="#176786" text-anchor="start">1765 起</text><text x="249" y="245" font-size="24" fill="#172b45" text-anchor="start">梅济耶尔工程学校</text><text x="48" y="293" font-size="23" fill="#172b45" text-anchor="start">蒙日从绘图工作走向空间几何方法。</text><rect x="24" y="336" width="672" height="110" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="371" font-size="23" fill="#176786" text-anchor="start">1794—1795</text><text x="249" y="371" font-size="24" fill="#172b45" text-anchor="start">工程教育与师范讲课</text><text x="48" y="419" font-size="23" fill="#172b45" text-anchor="start">把画法几何组织成可系统传授的课程。</text><rect x="24" y="462" width="672" height="110" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="497" font-size="23" fill="#176786" text-anchor="start">1799</text><text x="249" y="497" font-size="24" fill="#172b45" text-anchor="start">《画法几何》出版</text><text x="48" y="545" font-size="23" fill="#172b45" text-anchor="start">根据师范学校讲课内容整理。</text><rect x="24" y="588" width="672" height="110" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="623" font-size="23" fill="#176786" text-anchor="start">此后</text><text x="249" y="623" font-size="24" fill="#172b45" text-anchor="start">工程制图与数字模型</text><text x="48" y="671" font-size="23" fill="#172b45" text-anchor="start">投影之外，再加入尺寸、公差与制造信息。</text><text x="36" y="771" font-size="23" fill="#172b45" text-anchor="start">不是“蒙日一个人发明了所有机械制图规则”。</text><text x="36" y="810" font-size="23" fill="#172b45" text-anchor="start">他的重要贡献，是把表示与空间求解连成系统。</text></svg>
