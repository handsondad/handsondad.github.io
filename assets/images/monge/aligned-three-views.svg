<svg xmlns="http://www.w3.org/2000/svg" width="540" height="714" viewBox="0 0 540 714" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">第一角画法下台阶块的三视图与同一角点</title><desc id="desc">前视长高图、下方俯视长深图、右方左视深高图按同一比例对齐。高台位于物体后半部；所选点60、20、36在三图一一对应。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="712.5" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">④ 一套三视图，不是三张随便摆的画</text><text x="36" y="91.45" font-size="17.5" fill="#172b45" text-anchor="start">本图用第一角画法：俯视在下，左视在右。</text><text x="36" y="130.45" font-size="17.5" fill="#172b45" text-anchor="start">仍是 A 块；各视图使用同一比例，单位 mm。</text><text x="90" y="183.39" font-size="18.2" fill="#176786" text-anchor="start">主视图：长 × 高</text><text x="444" y="183.39" font-size="18.2" fill="#176786" text-anchor="start">左视图：深 × 高</text><rect x="90" y="236" width="240" height="144" fill="none" stroke="#172b45" stroke-width="3"/><path d="M90.000,332.000 L330.000,332.000" fill="none" stroke="#172b45" stroke-width="2.4"/><polygon points="610.0000,380.0000 450.0000,380.0000 450.0000,236.0000 530.0000,236.0000 530.0000,332.0000 610.0000,332.0000" fill="none" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><text x="90" y="444.39" font-size="18.2" fill="#176786" text-anchor="start">俯视图：长 × 深</text><rect x="90" y="480" width="240" height="160" fill="none" stroke="#172b45" stroke-width="3"/><path d="M90.000,560.000 L330.000,560.000" fill="none" stroke="#172b45" stroke-width="2.4"/><path d="M90.000,387.000 L90.000,410.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M90.000,457.000 L90.000,473.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M330.000,387.000 L330.000,410.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M330.000,457.000 L330.000,473.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M337.000,380.000 L443.000,380.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M337.000,332.000 L443.000,332.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M337.000,236.000 L443.000,236.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><circle cx="330.000" cy="236.000" r="7" fill="#b34039"/><text x="343" y="227.52" font-size="16.7" fill="#b34039" text-anchor="start">P</text><circle cx="530.000" cy="236.000" r="7" fill="#b34039"/><text x="541" y="227.52" font-size="16.7" fill="#b34039" text-anchor="start">P</text><circle cx="330.000" cy="560.000" r="7" fill="#b34039"/><text x="343" y="552.52" font-size="16.7" fill="#b34039" text-anchor="start">P</text><text x="408" y="522.59" font-size="16.0" fill="#172b45" text-anchor="start">P = (60, 20, 36)</text><text x="408" y="559.59" font-size="16.0" fill="#172b45" text-anchor="start">三个 P 是同一角点。</text><text x="408" y="596.59" font-size="16.0" fill="#172b45" text-anchor="start">高台在俯视上半部；</text><text x="408" y="633.59" font-size="16.0" fill="#172b45" text-anchor="start">左视中，高台在左。</text><rect x="24" y="692" width="672" height="172" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="732.39" font-size="18.2" fill="#172b45" text-anchor="start">长对正：主视、俯视的 x 位置对应。</text><text x="48" y="780.39" font-size="18.2" fill="#172b45" text-anchor="start">高平齐：主视、左视的 z 高度对应。</text><text x="48" y="828.39" font-size="18.2" fill="#172b45" text-anchor="start">宽相等：俯视、左视保存同一段深度。</text><text x="36" y="907.52" font-size="16.7" fill="#172b45" text-anchor="start">虚线是本图的投影辅助线，不是零件的不可见棱边。</text></g></svg>
