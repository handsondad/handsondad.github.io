<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1003" viewBox="0 0 720 1003" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">台阶块的五个独立名义尺寸和尺寸区间的间隙计算</title><desc id="desc">台阶块总长60、总深40、总高36、高台深20、底厚12毫米；另以孔轴区间说明直径间隙0.010至0.050毫米，不是完整制造图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1003" fill="#f3f7fa"/><text x="36" y="49" font-size="29" fill="#172b45" text-anchor="start">⑧ 画出形状，还不等于能制造</text><text x="36" y="92" font-size="23" fill="#172b45" text-anchor="start">A 块的名义几何：单位 mm；本图不指定打印比例。</text><rect x="130" y="176" width="240" height="144" fill="none" stroke="#172b45" stroke-width="3"/><path d="M130.000,272.000 L370.000,272.000" fill="none" stroke="#172b45" stroke-width="3"/><path d="M130.000,328.000 L130.000,373.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M370.000,328.000 L370.000,373.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M130.000,366.000 L370.000,366.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M138.000,362.000 L130.000,366.000 L138.000,370.000" fill="none" stroke="#176786" stroke-width="2"/><path d="M362.000,362.000 L370.000,366.000 L362.000,370.000" fill="none" stroke="#176786" stroke-width="2"/><rect x="227.0" y="352" width="46" height="28" fill="#f3f7fa" stroke="none" stroke-width="0"/><text x="250.0" y="374" font-size="23" fill="#176786" text-anchor="middle">60</text><path d="M122.000,176.000 L96.000,176.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M122.000,320.000 L96.000,320.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M89.000,176.000 L89.000,320.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M85.000,184.000 L89.000,176.000 L93.000,184.000" fill="none" stroke="#176786" stroke-width="2"/><path d="M85.000,312.000 L89.000,320.000 L93.000,312.000" fill="none" stroke="#176786" stroke-width="2"/><text x="79" y="256.0" font-size="23" fill="#176786" text-anchor="end">36</text><text x="138" y="139" font-size="24" fill="#176786" text-anchor="start">主视</text><polygon points="580.0000,320.0000 420.0000,320.0000 420.0000,176.0000 500.0000,176.0000 500.0000,272.0000 580.0000,272.0000" fill="none" stroke="#172b45" stroke-width="2.5" stroke-linejoin="round"/><path d="M420.000,328.000 L420.000,373.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M580.000,328.000 L580.000,373.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M420.000,366.000 L580.000,366.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M428.000,362.000 L420.000,366.000 L428.000,370.000" fill="none" stroke="#176786" stroke-width="2"/><path d="M572.000,362.000 L580.000,366.000 L572.000,370.000" fill="none" stroke="#176786" stroke-width="2"/><rect x="477.0" y="352" width="46" height="28" fill="#f3f7fa" stroke="none" stroke-width="0"/><text x="500.0" y="374" font-size="23" fill="#176786" text-anchor="middle">40</text><path d="M420.000,169.000 L420.000,147.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M500.000,169.000 L500.000,147.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M420.000,140.000 L500.000,140.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M428.000,136.000 L420.000,140.000 L428.000,144.000" fill="none" stroke="#176786" stroke-width="2"/><path d="M492.000,136.000 L500.000,140.000 L492.000,144.000" fill="none" stroke="#176786" stroke-width="2"/><rect x="437.0" y="126" width="46" height="28" fill="#f3f7fa" stroke="none" stroke-width="0"/><text x="460.0" y="148" font-size="23" fill="#176786" text-anchor="middle">20</text><path d="M588.000,272.000 L649.000,272.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M588.000,320.000 L649.000,320.000" fill="none" stroke="#8b9cab" stroke-width="3"/><path d="M642.000,272.000 L642.000,320.000" fill="none" stroke="#176786" stroke-width="3"/><path d="M638.000,280.000 L642.000,272.000 L646.000,280.000" fill="none" stroke="#176786" stroke-width="2"/><path d="M638.000,312.000 L642.000,320.000 L646.000,312.000" fill="none" stroke="#176786" stroke-width="2"/><text x="632" y="304.0" font-size="23" fill="#176786" text-anchor="end">12</text><text x="430" y="416" font-size="23" fill="#176786" text-anchor="start">左视（深度方向）</text><rect x="24" y="462" width="672" height="345" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="505" font-size="25" fill="#172b45" text-anchor="start">配合的另一道题：允许做成多大？</text><text x="48" y="556" font-size="25" fill="#172b45" text-anchor="start">孔直径：10.000 ～ 10.020 mm</text><text x="48" y="606" font-size="25" fill="#172b45" text-anchor="start">轴直径： 9.970 ～  9.990 mm</text><text x="48" y="684" font-size="23" fill="#176786" text-anchor="start">最小直径间隙：10.000 − 9.990 = 0.010 mm</text><text x="48" y="733" font-size="23" fill="#176786" text-anchor="start">最大直径间隙：10.020 − 9.970 = 0.050 mm</text><text x="36" y="859" font-size="22" fill="#172b45" text-anchor="start">这是尺寸区间的算术例子，不指定某个标准配合代号。</text><text x="36" y="898" font-size="22" fill="#172b45" text-anchor="start">材料、表面与几何公差等尚未给全，不能直接投产。</text><text x="36" y="937" font-size="22" fill="#172b45" text-anchor="start">比例与缩放改变纸上长度，不改变标注所规定的数值。</text></svg>
