<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1273" viewBox="0 0 720 1273" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">轴套的隐藏线、剖切位置与轴向全剖视</title><desc id="desc">40毫米长、外径30、孔径16的轴套，外部看孔用短虚线；端面A-A切过轴线，轴向剖视只有上下材料带画剖面线，孔中留白。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1273" fill="#f3f7fa"/><text x="36" y="49" font-size="29" fill="#172b45" text-anchor="start">⑦ 剖开不是破坏零件，是把孔说清楚</text><text x="36" y="93" font-size="23" fill="#172b45" text-anchor="start">换一个零件：轴套长 40，外径 30，贯通孔直径 16。</text><rect x="24" y="126" width="672" height="303" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="166" font-size="25" fill="#176786" text-anchor="start">① 外部主视：孔藏在里面</text><rect x="110" y="195" width="240" height="180" fill="none" stroke="#172b45" stroke-width="3"/><path d="M110.000,333.000 L350.000,333.000" fill="none" stroke="#8b9cab" stroke-width="3" stroke-dasharray="7 6"/><path d="M110.000,237.000 L350.000,237.000" fill="none" stroke="#8b9cab" stroke-width="3" stroke-dasharray="7 6"/><path d="M88,285 H374" stroke="#176786" stroke-width="1.5" stroke-dasharray="14 4 2 4"/><text x="405" y="233" font-size="21" fill="#172b45" text-anchor="start">粗实线：可见轮廓</text><text x="405" y="281" font-size="21" fill="#172b45" text-anchor="start">短虚线：孔的暗线</text><text x="405" y="329" font-size="21" fill="#172b45" text-anchor="start">细点画线：轴线</text><rect x="24" y="459" width="672" height="319" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="499" font-size="25" fill="#176786" text-anchor="start">② 看端面：A—A 剖切平面通过轴线</text><circle cx="232" cy="646" r="90" fill="none" stroke="#172b45" stroke-width="3"/><circle cx="232" cy="646" r="48" fill="none" stroke="#172b45" stroke-width="3"/><path d="M232,533 V759" stroke="#b34039" stroke-width="3" stroke-dasharray="19 5 3 5"/><path d="M232.000,535.000 L284.000,535.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><text x="213" y="542" font-size="22" fill="#b34039" text-anchor="end">A</text><path d="M232.000,757.000 L284.000,757.000" fill="none" stroke="#b34039" stroke-width="3" marker-end="url(#arrow)"/><text x="213" y="764" font-size="22" fill="#b34039" text-anchor="end">A</text><text x="405" y="604" font-size="22" fill="#172b45" text-anchor="start">想象沿红线所指</text><text x="405" y="646" font-size="22" fill="#172b45" text-anchor="start">平面剖开，移去</text><text x="405" y="688" font-size="22" fill="#172b45" text-anchor="start">朝观察者的半边。</text><rect x="24" y="808" width="672" height="324" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="850" font-size="23" fill="#176786" text-anchor="start">③ A—A 轴向全剖视：材料画细剖面线，孔留白</text><defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3,3L3,-3M0,12L12,0M9,15L15,9" stroke="#718a9f" stroke-width="1"/></pattern></defs><rect x="110" y="903" width="240" height="42" fill="url(#hatch)" stroke="#172b45" stroke-width="3"/><rect x="110" y="1041" width="240" height="42" fill="url(#hatch)" stroke="#172b45" stroke-width="3"/><path d="M110.000,945.000 L110.000,1041.000" fill="none" stroke="#172b45" stroke-width="3"/><path d="M350.000,945.000 L350.000,1041.000" fill="none" stroke="#172b45" stroke-width="3"/><path d="M88,993 H374" stroke="#176786" stroke-width="1.5" stroke-dasharray="14 4 2 4"/><text x="410" y="937" font-size="22" fill="#172b45" text-anchor="start">上下两带是材料。</text><text x="410" y="982" font-size="22" fill="#172b45" text-anchor="start">中间空白是贯通孔。</text><text x="410" y="1027" font-size="22" fill="#172b45" text-anchor="start">剖面线不是阴影。</text><text x="36" y="1181" font-size="22" fill="#172b45" text-anchor="start">本例剖切通过轴线；剖视不改变原来零件。</text><text x="36" y="1220" font-size="22" fill="#172b45" text-anchor="start">断面只画切到的形状；剖视还表达剖切面后方可见结构。</text></svg>
