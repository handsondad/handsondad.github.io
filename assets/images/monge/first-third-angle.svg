<svg xmlns="http://www.w3.org/2000/svg" width="540" height="787.5" viewBox="0 0 540 787.5" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">第一角与第三角画法的主俯左视图排布</title><desc id="desc">第一角俯视位于主视下方、左视在右；第三角俯视在上、左视在左。视图方向名称不因纸面位置变化；此图不绘标准投影符号。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="786" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">⑤ 左视图，到底放左边还是右边？</text><rect x="24" y="90" width="672" height="393" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="130.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">第一角画法</text><text x="48" y="176.39" font-size="18.2" fill="#172b45" text-anchor="start">观察者 → 物体 → 投影面</text><rect x="205" y="200" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="290" y="243.32" font-size="19.0" fill="#172b45" text-anchor="middle">主视</text><rect x="435" y="200" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="520" y="243.32" font-size="19.0" fill="#172b45" text-anchor="middle">左视</text><rect x="205" y="300" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="290" y="343.32" font-size="19.0" fill="#172b45" text-anchor="middle">俯视</text><text x="48" y="451.52" font-size="16.7" fill="#172b45" text-anchor="start">视图名称由观察方向决定，不由纸面左右决定。</text><rect x="24" y="510" width="672" height="393" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="550.11" font-size="19.2" fill="#176786" text-anchor="start" font-weight="600">第三角画法</text><text x="48" y="596.39" font-size="18.2" fill="#172b45" text-anchor="start">观察者 → 投影面 → 物体</text><rect x="330" y="770" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="415" y="813.32" font-size="19.0" fill="#172b45" text-anchor="middle">主视</text><rect x="100" y="770" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="185" y="813.32" font-size="19.0" fill="#172b45" text-anchor="middle">左视</text><rect x="330" y="670" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="415" y="713.32" font-size="19.0" fill="#172b45" text-anchor="middle">俯视</text><text x="48" y="871.52" font-size="16.7" fill="#172b45" text-anchor="start">视图名称由观察方向决定，不由纸面左右决定。</text><text x="36" y="954.45" font-size="17.5" fill="#172b45" text-anchor="start">两套都可以正确表达；不要在同一套图中混用。</text><text x="36" y="993.45" font-size="17.5" fill="#172b45" text-anchor="start">这是排布示意，不是标准投影法符号。</text></g></svg>
