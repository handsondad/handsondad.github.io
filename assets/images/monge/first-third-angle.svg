<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">第一角与第三角画法的主俯左视图排布</title><desc id="desc">第一角俯视位于主视下方、左视在右；第三角俯视在上、左视在左。视图方向名称不因纸面位置变化；此图不绘标准投影符号。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1050" fill="#f3f7fa"/><text x="36" y="49" font-size="29" fill="#172b45" text-anchor="start">⑤ 左视图，到底放左边还是右边？</text><rect x="24" y="90" width="672" height="393" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="132" font-size="26" fill="#176786" text-anchor="start">第一角画法</text><text x="48" y="178" font-size="24" fill="#172b45" text-anchor="start">观察者 → 物体 → 投影面</text><rect x="205" y="200" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="290" y="245" font-size="25" fill="#172b45" text-anchor="middle">主视</text><rect x="435" y="200" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="520" y="245" font-size="25" fill="#172b45" text-anchor="middle">左视</text><rect x="205" y="300" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="290" y="345" font-size="25" fill="#172b45" text-anchor="middle">俯视</text><text x="48" y="453" font-size="22" fill="#172b45" text-anchor="start">视图名称由观察方向决定，不由纸面左右决定。</text><rect x="24" y="510" width="672" height="393" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="552" font-size="26" fill="#176786" text-anchor="start">第三角画法</text><text x="48" y="598" font-size="24" fill="#172b45" text-anchor="start">观察者 → 投影面 → 物体</text><rect x="330" y="770" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="415" y="815" font-size="25" fill="#172b45" text-anchor="middle">主视</text><rect x="100" y="770" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="185" y="815" font-size="25" fill="#172b45" text-anchor="middle">左视</text><rect x="330" y="670" width="170" height="72" fill="#edf4f8" stroke="#9aafbe" stroke-width="2"/><text x="415" y="715" font-size="25" fill="#172b45" text-anchor="middle">俯视</text><text x="48" y="873" font-size="22" fill="#172b45" text-anchor="start">视图名称由观察方向决定，不由纸面左右决定。</text><text x="36" y="956" font-size="23" fill="#172b45" text-anchor="start">两套都可以正确表达；不要在同一套图中混用。</text><text x="36" y="995" font-size="23" fill="#172b45" text-anchor="start">这是排布示意，不是标准投影法符号。</text></svg>
