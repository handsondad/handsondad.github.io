<svg xmlns="http://www.w3.org/2000/svg" width="540" height="806.25" viewBox="0 0 540 806.25" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">点的三个正投影分别保存两项坐标</title><desc id="desc">空间点30、20、25的主投影保留x和z，水平投影保留x和y，侧投影保留y和z；此图单独展示坐标，不表示工程视图排布。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect x="0.75" y="0.75" width="538.5" height="804.75" rx="12" fill="#fbfcfd" stroke="#dde6ee" stroke-width="1.2"/><g transform="scale(0.75)"><text x="36" y="46.73" font-size="20.9" fill="#172b45" text-anchor="start" font-weight="700">③ 每张正投影，暂时放下一项坐标</text><text x="36" y="90.45" font-size="17.5" fill="#172b45" text-anchor="start">约定：x 向右，y 向后，z 向上。单位：mm。</text><text x="36" y="129.45" font-size="17.5" fill="#172b45" text-anchor="start">空间中的 P = (30, 20, 25)，三个坐标都要保存。</text><rect x="24" y="175" width="672" height="233" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="210.32" font-size="19.0" fill="#176786" text-anchor="start">主视：保留 x、z</text><path d="M134.000,374.000 L368.000,374.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M134.000,374.000 L134.000,237.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M254.000,374.000 L254.000,274.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M134.000,274.000 L254.000,274.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><circle cx="254.000" cy="274.000" r="7" fill="#b34039"/><text x="266" y="263.45" font-size="17.5" fill="#b34039" text-anchor="start">P</text><text x="377" y="380.52" font-size="16.7" fill="#172b45" text-anchor="start">x</text><text x="124" y="240.52" font-size="16.7" fill="#172b45" text-anchor="end">z</text><text x="433" y="279.39" font-size="18.2" fill="#172b45" text-anchor="start">x = 30</text><text x="433" y="327.39" font-size="18.2" fill="#172b45" text-anchor="start">z = 25</text><rect x="24" y="429" width="672" height="233" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="464.32" font-size="19.0" fill="#176786" text-anchor="start">俯视：保留 x、y</text><path d="M134.000,628.000 L368.000,628.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M134.000,628.000 L134.000,491.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M254.000,628.000 L254.000,548.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M134.000,548.000 L254.000,548.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><circle cx="254.000" cy="548.000" r="7" fill="#b34039"/><text x="266" y="537.45" font-size="17.5" fill="#b34039" text-anchor="start">P</text><text x="377" y="634.52" font-size="16.7" fill="#172b45" text-anchor="start">x</text><text x="124" y="494.52" font-size="16.7" fill="#172b45" text-anchor="end">y</text><text x="433" y="533.39" font-size="18.2" fill="#172b45" text-anchor="start">x = 30</text><text x="433" y="581.39" font-size="18.2" fill="#172b45" text-anchor="start">y = 20</text><rect x="24" y="683" width="672" height="233" rx="14" fill="#ffffff" stroke="#dde6ee" stroke-width="1.5"/><text x="48" y="718.32" font-size="19.0" fill="#176786" text-anchor="start">左视：保留 y、z</text><path d="M360.000,882.000 L126.000,882.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M360.000,882.000 L360.000,745.000" fill="none" stroke="#172b45" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M280.000,882.000 L280.000,782.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><path d="M360.000,782.000 L280.000,782.000" fill="none" stroke="#8b9cab" stroke-width="2.4" stroke-dasharray="7 6"/><circle cx="280.000" cy="782.000" r="7" fill="#b34039"/><text x="292" y="771.45" font-size="17.5" fill="#b34039" text-anchor="start">P</text><text x="117" y="888.52" font-size="16.7" fill="#172b45" text-anchor="start">y</text><text x="350" y="748.52" font-size="16.7" fill="#172b45" text-anchor="end">z</text><text x="433" y="787.39" font-size="18.2" fill="#172b45" text-anchor="start">y = 20</text><text x="433" y="835.39" font-size="18.2" fill="#172b45" text-anchor="start">z = 25</text><text x="36" y="982.45" font-size="17.5" fill="#172b45" text-anchor="start">这里分开展示坐标，不是三视图的纸面布置。</text><text x="36" y="1021.45" font-size="17.5" fill="#172b45" text-anchor="start">对应关系正确时，不同投影能把丢掉的信息补回来。</text></g></svg>
