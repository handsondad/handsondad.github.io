<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1075" viewBox="0 0 720 1075" role="img" aria-labelledby="title desc" lang="zh-CN"><title id="title">点的三个正投影分别保存两项坐标</title><desc id="desc">空间点30、20、25的主投影保留x和z，水平投影保留x和y，侧投影保留y和z；此图单独展示坐标，不表示工程视图排布。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="720" height="1075" fill="#f3f7fa"/><text x="36" y="49" font-size="29" fill="#172b45" text-anchor="start">③ 每张正投影，暂时放下一项坐标</text><text x="36" y="92" font-size="23" fill="#172b45" text-anchor="start">约定：x 向右，y 向后，z 向上。单位：mm。</text><text x="36" y="131" font-size="23" fill="#172b45" text-anchor="start">空间中的 P = (30, 20, 25)，三个坐标都要保存。</text><rect x="24" y="175" width="672" height="233" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="212" font-size="25" fill="#176786" text-anchor="start">主视：保留 x、z</text><path d="M134.000,374.000 L368.000,374.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M134.000,374.000 L134.000,237.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M254.000,374.000 L254.000,274.000" fill="none" stroke="#8b9cab" stroke-width="3" stroke-dasharray="7 6"/><path d="M134.000,274.000 L254.000,274.000" fill="none" stroke="#8b9cab" stroke-width="3" stroke-dasharray="7 6"/><circle cx="254.000" cy="274.000" r="7" fill="#b34039"/><text x="266" y="265" font-size="23" fill="#b34039" text-anchor="start">P</text><text x="377" y="382" font-size="22" fill="#172b45" text-anchor="start">x</text><text x="124" y="242" font-size="22" fill="#172b45" text-anchor="end">z</text><text x="433" y="281" font-size="24" fill="#172b45" text-anchor="start">x = 30</text><text x="433" y="329" font-size="24" fill="#172b45" text-anchor="start">z = 25</text><rect x="24" y="429" width="672" height="233" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="466" font-size="25" fill="#176786" text-anchor="start">俯视：保留 x、y</text><path d="M134.000,628.000 L368.000,628.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M134.000,628.000 L134.000,491.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M254.000,628.000 L254.000,548.000" fill="none" stroke="#8b9cab" stroke-width="3" stroke-dasharray="7 6"/><path d="M134.000,548.000 L254.000,548.000" fill="none" stroke="#8b9cab" stroke-width="3" stroke-dasharray="7 6"/><circle cx="254.000" cy="548.000" r="7" fill="#b34039"/><text x="266" y="539" font-size="23" fill="#b34039" text-anchor="start">P</text><text x="377" y="636" font-size="22" fill="#172b45" text-anchor="start">x</text><text x="124" y="496" font-size="22" fill="#172b45" text-anchor="end">y</text><text x="433" y="535" font-size="24" fill="#172b45" text-anchor="start">x = 30</text><text x="433" y="583" font-size="24" fill="#172b45" text-anchor="start">y = 20</text><rect x="24" y="683" width="672" height="233" rx="16" fill="#fff" stroke="#ccd8e2" stroke-width="2"/><text x="48" y="720" font-size="25" fill="#176786" text-anchor="start">左视：保留 y、z</text><path d="M360.000,882.000 L126.000,882.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M360.000,882.000 L360.000,745.000" fill="none" stroke="#172b45" stroke-width="3" marker-end="url(#arrow)"/><path d="M280.000,882.000 L280.000,782.000" fill="none" stroke="#8b9cab" stroke-width="3" stroke-dasharray="7 6"/><path d="M360.000,782.000 L280.000,782.000" fill="none" stroke="#8b9cab" stroke-width="3" stroke-dasharray="7 6"/><circle cx="280.000" cy="782.000" r="7" fill="#b34039"/><text x="292" y="773" font-size="23" fill="#b34039" text-anchor="start">P</text><text x="117" y="890" font-size="22" fill="#172b45" text-anchor="start">y</text><text x="350" y="750" font-size="22" fill="#172b45" text-anchor="end">z</text><text x="433" y="789" font-size="24" fill="#172b45" text-anchor="start">y = 20</text><text x="433" y="837" font-size="24" fill="#172b45" text-anchor="start">z = 25</text><text x="36" y="984" font-size="23" fill="#172b45" text-anchor="start">这里分开展示坐标，不是三视图的纸面布置。</text><text x="36" y="1023" font-size="23" fill="#172b45" text-anchor="start">对应关系正确时，不同投影能把丢掉的信息补回来。</text></svg>
