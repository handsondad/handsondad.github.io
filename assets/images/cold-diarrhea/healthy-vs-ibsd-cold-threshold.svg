<svg xmlns="http://www.w3.org/2000/svg" width="760" height="444" viewBox="0 0 760 444" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">内脏高敏感IBS-D人群与健康人群肠道冷刺激排便反射阈值偏移对比及四大诱因图</title>
<desc id="desc">左图绘制S形刺激响应曲线：在相同日常冷刺激强度下，健康肠道响应低于5%，而阈值左移的腹泻型肠易激(IBS-D)肠道响应超过80%跨过排便急迫线；右图归纳内脏高敏感、焦虑CRF叠加、冰饮乳糖咖啡因合谋及黏膜屏障脆弱四大放大器。</desc>
<defs>
  <marker id="arr-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#1d6fa5"/>
  </marker>
  <marker id="arr-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#c25014"/>
  </marker>
  <marker id="arr-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#18794e"/>
  </marker>
  <marker id="arr-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0,0.6 L6.5,3.5 L0,6.4 Z" fill="#64748b"/>
  </marker>
</defs>
<style>
  text {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .mono {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .halo {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3.5px;
    stroke-linejoin: round;
  }
</style>
<rect x="0.5" y="0.5" width="759" height="443" rx="12" fill="#fbfcfd" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="28" font-size="16" fill="#0f172a" text-anchor="start" font-weight="700">同吹一台 22 ℃ 空调、同喝一杯冰美式，为什么室友没事，你却秒变“喷射战士”？</text>
<text x="24" y="48" font-size="12.5" fill="#64748b" text-anchor="start">人与人的肠道神经报警器“灵敏度阈值”相差数倍 —— 读懂内脏高敏感性 (Visceral Hypersensitivity)</text>
<rect x="20" y="62" width="412" height="368" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="34" y="85" font-size="13.5" fill="#0f172a" text-anchor="start" font-weight="700">① 肠道冷刺激–排便反射曲线：报警器阈值左移！</text>
<text x="34" y="104" font-size="9.2" fill="#64748b" text-anchor="start" font-weight="600">结肠推进与排便急迫强度 (%)</text>
<line x1="72.0" y1="364.0" x2="408.0" y2="364.0" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="65.0" y="367.5" font-size="8.9" fill="#64748b" text-anchor="end">0%</text>
<line x1="72.0" y1="304.5" x2="408.0" y2="304.5" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="65.0" y="308.0" font-size="8.9" fill="#64748b" text-anchor="end">25%</text>
<line x1="72.0" y1="245.0" x2="408.0" y2="245.0" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="65.0" y="248.5" font-size="8.9" fill="#64748b" text-anchor="end">50%</text>
<line x1="72.0" y1="185.5" x2="408.0" y2="185.5" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="65.0" y="189.0" font-size="8.9" fill="#64748b" text-anchor="end">75%</text>
<line x1="72.0" y1="126.0" x2="408.0" y2="126.0" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="65.0" y="129.5" font-size="8.9" fill="#64748b" text-anchor="end">100%</text>
<line x1="72.0" y1="221.2" x2="408.0" y2="221.2" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="78.0" y="215.2" font-size="8.8" fill="#b45309" text-anchor="start" font-weight="700">排便急迫发作线 (60%)</text>
<line x1="240.0" y1="126.0" x2="240.0" y2="364.0" stroke="#1d6fa5" stroke-width="1.3" stroke-dasharray="3,3"/>
<text x="240.0" y="138.0" font-size="8.9" fill="#1d6fa5" text-anchor="middle" font-weight="700">日常冷刺激强度</text>
<text x="240.0" y="152.0" font-size="8.6" fill="#1d6fa5" text-anchor="middle">(一杯冰水 / 吹凉风)</text>
<line x1="72.0" y1="126.0" x2="72.0" y2="364.0" stroke="#475569" stroke-width="1.3"/>
<line x1="72.0" y1="364.0" x2="408.0" y2="364.0" stroke="#475569" stroke-width="1.3"/>
<text x="240.0" y="404" font-size="9.4" fill="#0f172a" text-anchor="middle" font-weight="600">寒冷 / 肠腔扩张复合刺激强度 →</text>
<path d="M 72.0,361.3 L 85.4,359.7 L 98.9,357.2 L 112.3,353.3 L 125.8,347.4 L 139.2,338.4 L 152.6,325.6 L 166.1,307.9 L 179.5,285.3 L 193.0,258.9 L 206.4,231.1 L 219.8,204.7 L 233.3,182.1 L 246.7,164.4 L 260.2,151.6 L 273.6,142.6 L 287.0,136.7 L 300.5,132.8 L 313.9,130.3 L 327.4,128.7 L 340.8,127.7 L 354.2,127.1 L 367.7,126.7 L 381.1,126.4 L 394.6,126.3 L 408.0,126.2" fill="none" stroke="#dc2626" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 72.0,364.0 L 85.4,364.0 L 98.9,363.9 L 112.3,363.9 L 125.8,363.8 L 139.2,363.7 L 152.6,363.5 L 166.1,363.2 L 179.5,362.7 L 193.0,361.9 L 206.4,360.6 L 219.8,358.6 L 233.3,355.5 L 246.7,350.7 L 260.2,343.3 L 273.6,332.6 L 287.0,317.4 L 300.5,297.2 L 313.9,272.5 L 327.4,245.0 L 340.8,217.5 L 354.2,192.8 L 367.7,172.6 L 381.1,157.4 L 394.6,146.7 L 408.0,139.3" fill="none" stroke="#18794e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,3"/>
<circle cx="240.0" cy="172.6" r="4.5" fill="#dc2626"/>
<circle cx="240.0" cy="353.3" r="4.5" fill="#18794e"/>
<text x="152.6" y="315.6" font-size="9.0" fill="#dc2626" text-anchor="middle" font-weight="700">[高敏] 肠易激 IBS-D 曲线</text>
<text x="317.3" y="311.6" font-size="9.0" fill="#18794e" text-anchor="middle" font-weight="700">[耐受] 钝感健康肠道</text>
<rect x="444" y="62" width="296" height="368" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="458" y="85" font-size="11.4" fill="#0f172a" text-anchor="start" font-weight="700">② 把你变成“一凉就拉”的四大放大器</text>
<rect x="458" y="100" width="268" height="70" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
<text x="470" y="119" font-size="9.5" fill="#dc2626" text-anchor="start" font-weight="700">1. 内脏高敏感性 (IBS-D 体质)</text>
<text x="470" y="138" font-size="8.9" fill="#1e293b" text-anchor="start">肠壁神经 TRPM8/5-HT 受体过度敏化，</text>
<text x="470" y="155" font-size="8.9" fill="#1e293b" text-anchor="start">别人无感的微弱降温在你肠里堪比拉警报。</text>
<rect x="458" y="180" width="268" height="70" rx="7" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1"/>
<text x="470" y="199" font-size="9.5" fill="#6d28d9" text-anchor="start" font-weight="700">2. 精神焦虑与熬夜应激叠加</text>
<text x="470" y="218" font-size="8.9" fill="#1e293b" text-anchor="start">压力已提前拉高下丘脑 CRF 基线；再吹</text>
<text x="470" y="235" font-size="8.9" fill="#1e293b" text-anchor="start">一阵凉风，中枢外周双重叠加瞬间破防。</text>
<rect x="458" y="260" width="268" height="70" rx="7" fill="#fef1e8" stroke="#c25014" stroke-width="1"/>
<text x="470" y="279" font-size="9.5" fill="#c25014" text-anchor="start" font-weight="700">3. 冰饮里的“化学合谋犯”</text>
<text x="470" y="298" font-size="8.9" fill="#1e293b" text-anchor="start">背锅的不只是冰块：冰拿铁的乳糖+咖啡因、</text>
<text x="470" y="315" font-size="8.9" fill="#1e293b" text-anchor="start">冰果茶的高果糖都在同步高渗吸水催泻！</text>
<rect x="458" y="340" width="268" height="70" rx="7" fill="#eaf4fb" stroke="#1d6fa5" stroke-width="1"/>
<text x="470" y="359" font-size="9.5" fill="#1d6fa5" text-anchor="start" font-weight="700">4. 肠炎恢复期与黏膜屏障脆弱</text>
<text x="470" y="378" font-size="8.9" fill="#1e293b" text-anchor="start">急性胃肠炎后数月肥大细胞仍活跃；动物</text>
<text x="470" y="395" font-size="8.9" fill="#1e293b" text-anchor="start">实验亦提示冷应激可削弱紧密连接 ZO-1。</text>
</svg>
